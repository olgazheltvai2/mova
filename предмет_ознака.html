<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сортування слів: Магічне Озеро 2.1</title>
    
    <!-- Підключення Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060b19; /* Темне нічне небо */
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }

        /* Деталізований SVG фон */
        #environment {
            position: absolute;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* Кнопки навігації */
        .nav-btn {
            position: absolute;
            bottom: 30px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            color: #00f3ff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            transition: all 0.2s;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #btn-prev { left: 30px; border-color: #ff00ea; color: #ff00ea; box-shadow: 0 0 15px rgba(255, 0, 234, 0.3); }
        #btn-next { right: 30px; }
        .nav-btn:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.2); }
        .nav-btn:active { transform: scale(0.9); }

        #game-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform-origin: top left;
        }

        /* Контейнери персонажів */
        .character-container {
            position: absolute;
            width: 280px;
            height: 350px;
            cursor: pointer;
            z-index: 999;
            transition: filter 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }
        .character-container:hover {
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
        }

        #frog-container { bottom: 10%; left: 15%; }
        #duck-container { bottom: 10%; right: 15%; animation: float 4s infinite ease-in-out; }

        /* Текстові підписи біля персонажів */
        .character-label {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Хмарка зі словом */
        #cloud-container {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 200px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 1s ease-in-out, top 1s ease-in-out, transform 1s ease-in-out, opacity 0.5s;
        }

        .cloud-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.8));
        }

        .word-text {
            position: relative;
            z-index: 2;
            color: #000;
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 2px;
            pointer-events: none;
        }

        /* Дощ */
        .raindrop {
            position: absolute;
            width: 4px;
            height: 20px;
            background: #00f3ff;
            border-radius: 2px;
            opacity: 0;
            z-index: 998;
        }

        /* Анімації */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes jump {
            0%, 100% { transform: translateY(0) scaleY(1); }
            30% { transform: translateY(-100px) scaleY(1.1); }
            70% { transform: translateY(-100px) scaleY(1.1); }
        }
        .jumping { animation: jump 0.8s ease-in-out; }
        @keyframes flap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-40deg); }
        }
        .flapping #duck-wing { animation: flap 0.15s infinite alternate; transform-origin: 150px 120px; }
        @keyframes wrong-shake {
            0%, 100% { transform: translateX(-50%); }
            25% { transform: translateX(calc(-50% - 20px)); }
            75% { transform: translateX(calc(-50% + 20px)); }
        }
        .shake { animation: wrong-shake 0.4s ease-in-out; }
        @keyframes rain-fall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(200px); opacity: 0; }
        }

        /* ДОДАНІ СТИЛІ: Theme Manager, Малювання, Контроль, Зумування, Мова */
        #settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #34495e;
            color: white;
            border-radius: 50%;
            font-size: 24px;
            border: none;
            cursor: pointer;
            z-index: 100000;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 15px;
            z-index: 100001;
            width: 80%;
            max-width: 600px;
            border: 2px solid #00f3ff;
        }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .theme-card {
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 10px;
            overflow: hidden;
            height: 80px;
            background: #2c3e50;
        }
        .theme-card:hover { border-color: #00f3ff; }
        .theme-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 5px 0;
            margin: 0;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            color: red;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            line-height: 100vh;
            z-index: 200000;
        }

        #draw-canvas-global {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 90000;
            pointer-events: none;
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px; right: 20px;
            width: 50px; height: 50px;
            background: #8e44ad; color: white;
            border: none; border-radius: 50%;
            font-size: 24px; cursor: pointer;
            z-index: 100000; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20px; right: 20px;
            background: #2c3e50; padding: 10px;
            border-radius: 10px; z-index: 100001;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column; gap: 10px;
        }
        .draw-panel-handle {
            width: 100%; height: 20px;
            background: #34495e; cursor: grab;
            border-radius: 5px; margin-bottom: 5px;
        }
        .draw-btn {
            background: #ecf0f1; border: none;
            padding: 8px; border-radius: 5px;
            cursor: pointer; font-weight: bold;
        }
        .draw-btn.active { background: #f1c40f; }

        #zoom-controls {
            position: fixed;
            top: 20px; right: 20px;
            display: flex; gap: 10px;
            z-index: 100000;
        }
        .zoom-btn {
            width: 45px; height: 45px;
            background: rgba(255,255,255,0.2); border: 2px solid #fff;
            color: #fff; font-size: 20px; border-radius: 50%; cursor: pointer;
        }

        #lang-toggle {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 100000;
            opacity: 0.3;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s;
        }
        #lang-toggle:hover { opacity: 1; }

        @media (max-width: 768px) {
            .character-container { width: 180px; height: 250px; }
            .word-text { font-size: 36px; }
            #cloud-container { width: 300px; height: 150px; }
        }
    </style>
</head>
<body>

<div id="lang-toggle">UK | RU</div>

<div id="zoom-controls">
    <button class="zoom-btn" onclick="adjustZoom(0.1)">🔎+</button>
    <button class="zoom-btn" onclick="adjustZoom(-0.1)">🔎-</button>
</div>

<svg id="environment" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#040914"/>
            <stop offset="100%" stop-color="#12254a"/>
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a1930"/>
            <stop offset="100%" stop-color="#000914"/>
        </linearGradient>
        <filter id="moon-glow">
            <feGaussianBlur stdDeviation="20" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <rect width="1920" height="600" fill="url(#sky)"/>
    <circle cx="1500" cy="200" r="80" fill="#fff" filter="url(#moon-glow)"/>
    <circle cx="300" cy="150" r="3" fill="#fff" opacity="0.8"/><circle cx="800" cy="100" r="4" fill="#fff"/>
    <rect y="600" width="1920" height="480" fill="url(#water)"/>
    <path d="M1400,620 L1600,620 L1550,640 L1450,640 Z M1420,660 L1580,660 L1520,680 L1480,680 Z" fill="#fff" opacity="0.2"/>
    <path d="M0,500 Q300,550 600,700 Q800,800 650,1080 L0,1080 Z" fill="#0d2b1d" stroke="#184d34" stroke-width="10"/>
    <g transform="translate(150, 750)">
        <path d="M40,100 Q45,20 50,0 Q55,20 60,100 Z" fill="#a8e6cf"/>
        <path d="M0,20 Q50,-40 100,20 Q50,40 0,20 Z" fill="#ff00ea" filter="url(#moon-glow)"/>
        <circle cx="30" cy="10" r="5" fill="#fff"/><circle cx="70" cy="15" r="4" fill="#fff"/>
    </g>
    <g transform="translate(1700, 550)">
        <path d="M10,200 Q0,100 20,0" stroke="#184d34" stroke-width="6" fill="none"/>
        <rect x="15" y="20" width="10" height="60" fill="#5c4033" rx="5"/>
        <path d="M50,220 Q40,120 70,20" stroke="#184d34" stroke-width="6" fill="none"/>
        <rect x="65" y="40" width="10" height="60" fill="#5c4033" rx="5"/>
    </g>
</svg>

<button id="btn-prev" class="nav-btn">◀</button>
<button id="btn-next" class="nav-btn">▶</button>

<div id="game-layer">
    <div id="frog-container" class="character-container" data-type="noun">
        <svg viewBox="0 0 300 300" width="100%" height="250">
            <path d="M50,250 Q10,150 70,180 Q100,200 80,260 L60,265" fill="#00b894"/>
            <path d="M250,250 Q290,150 230,180 Q200,200 220,260 L240,265" fill="#00b894"/>
            <circle cx="58" cy="265" r="4" fill="#00b894"/><circle cx="68" cy="265" r="4" fill="#00b894"/> 
            <circle cx="232" cy="265" r="4" fill="#00b894"/><circle cx="242" cy="265" r="4" fill="#00b894"/>
            <ellipse cx="150" cy="200" rx="90" ry="70" fill="#00cec9"/>
            <ellipse cx="150" cy="220" rx="60" ry="40" fill="#a8e6cf" opacity="0.6"/>
            <ellipse cx="150" cy="120" rx="80" ry="50" fill="#00cec9"/>
            <circle cx="100" cy="80" r="30" fill="#00cec9"/>
            <circle cx="100" cy="80" r="20" fill="#fff"/>
            <circle cx="100" cy="80" r="10" fill="#000" id="frog-pupil-l"/>
            <circle cx="200" cy="80" r="30" fill="#00cec9"/>
            <circle cx="200" cy="80" r="20" fill="#fff"/>
            <circle cx="200" cy="80" r="10" fill="#000" id="frog-pupil-r"/>
            <path id="frog-mouth" d="M110,140 Q150,170 190,140" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="character-label" id="label-noun">ПРЕДМЕТ</span>
    </div>

    <div id="duck-container" class="character-container" data-type="adj">
        <svg viewBox="0 0 300 300" width="100%" height="250">
            <path d="M80,200 Q50,250 150,250 Q250,250 260,180 Q260,150 200,180 Q150,200 80,200 Z" fill="#f1c40f"/>
            <path d="M100,210 Q70,100 120,80 Q150,80 150,120 Q150,180 120,210 Z" fill="#f1c40f"/>
            <circle cx="120" cy="100" r="12" fill="#fff"/>
            <circle cx="115" cy="100" r="6" fill="#000" id="duck-pupil"/>
            <path id="duck-beak" d="M95,110 L50,115 L95,125 Z" fill="#e67e22"/>
            <g id="duck-wing">
                <path d="M140,190 Q180,160 230,190 Q180,230 140,190 Z" fill="#f39c12"/>
            </g>
        </svg>
        <span class="character-label" id="label-adj">ОЗНАКА</span>
    </div>

    <div id="cloud-container">
        <svg class="cloud-svg" viewBox="0 0 400 200">
            <path d="M150,140 a50,50 0 0,1 0,-100 a70,70 0 0,1 120,-10 a50,50 0 0,1 60,60 a40,40 0 0,1 -20,70 Z" fill="#ffffff"/>
            <path d="M100,130 a40,40 0 0,1 0,-80 a50,50 0 0,1 70,20 Z" fill="#ffffff"/>
        </svg>
        <span id="current-word" class="word-text">СЛОВО</span>
    </div>
</div>

<!-- Theme Manager UI -->
<button id="settings-btn">⚙️</button>
<div id="theme-modal">
    <span class="close-modal" id="close-theme-modal">✕</span>
    <h2 style="color:white; margin-top:0;">Оберіть фон</h2>
    <div id="theme-gallery">
        <div class="theme-card" onclick="selectTheme('none')">
            <div style="width:100%; height:100%; background:#2c3e50;"></div>
            <p class="theme-name">Без фону</p>
        </div>
    </div>
</div>

<!-- Блок малювання -->
<canvas id="draw-canvas-global"></canvas>
<button id="toggle-draw-btn-global">✏️</button>
<div id="draw-panel-global">
    <div class="draw-panel-handle" id="draw-handle"></div>
    <span class="close-modal" id="close-draw-panel" style="position:static; text-align:right; font-size:16px;">✕</span>
    <button class="draw-btn active" id="btn-pencil">✏️ Олівець</button>
    <button class="draw-btn" id="btn-eraser">🧽 Гумка</button>
    <input type="range" id="draw-width" min="1" max="50" value="5">
    <input type="color" id="draw-color" value="#ff0000">
    <button class="draw-btn" id="btn-clear-canvas">🗑️ Очистити</button>
</div>

<!-- Екран-заглушка контролю доступу -->
<div id="block-overlay">Зачекай! Зараз не твій урок.</div>

<script>
    // --- FIREBASE ІНІЦІАЛІЗАЦІЯ ТА КОНТРОЛЬ ДОСТУПУ ---
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
        projectId: "lesson-13c44"
    };
    
    let db;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
    } catch(e) {
        console.warn("Firebase не ініціалізовано, гра працюватиме локально.");
    }

    const CONFIG = { gameId: "magic_lake_2_1" };
    let myName = new URLSearchParams(window.location.search).get('user') || sessionStorage.getItem('userName');
    if (!myName) {
        myName = 'Гість_' + Math.floor(Math.random() * 1000);
    }
    sessionStorage.setItem('userName', myName);
    const tabId = Math.random().toString(36).substr(2, 9);
    const senderId = myName + '_' + tabId;
    const initTime = Date.now();

    if (db) {
        const connectedRef = db.ref('.info/connected');
        const userRef = db.ref(`online_users/${myName}/${tabId}`);
        connectedRef.on('value', snap => {
            if(snap.val() === true) {
                userRef.set(true);
                userRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => userRef.remove());

        db.ref('current_activity').on('value', snap => {
            if(Date.now() - initTime < 1000) return; 
            if(snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'block' : 'none';
        });
    }

    function sendGameAction(type, data) {
        if (!db) return;
        db.ref(`game_action`).set({
            senderId: senderId,
            timestamp: Date.now(),
            type: type,
            data: data
        });
    }

    // --- МАСШТАБУВАННЯ (ЗУМ) ---
    let currentZoom = 1;
    function adjustZoom(delta) {
        currentZoom += delta;
        if(currentZoom < 0.3) currentZoom = 0.3;
        if(currentZoom > 3) currentZoom = 3;
        document.getElementById('game-layer').style.transform = `scale(${currentZoom})`;
    }

    // --- БАГАТОМОВНІСТЬ ---
    let currentLang = 'uk';
    const langToggle = document.getElementById('lang-toggle');
    const labelNoun = document.getElementById('label-noun');
    const labelAdj = document.getElementById('label-adj');
    
    langToggle.addEventListener('click', () => {
        currentLang = currentLang === 'uk' ? 'ru' : 'uk';
        langToggle.textContent = currentLang === 'uk' ? 'UK | RU' : 'RU | UK';
        labelNoun.textContent = currentLang === 'uk' ? 'ПРЕДМЕТ' : 'ПРЕДМЕТ'; // Russian is also предмет
        labelAdj.textContent = currentLang === 'uk' ? 'ОЗНАКА' : 'ПРИЗНАК';
        loadWord(currentIdx, true);
    });

    // --- ЛОГІКА ГРИ ---
    let wordsList = [
        { uk: "Ліс", ru: "Лес", t: "noun" }, { uk: "Темний", ru: "Темный", t: "adj" },
        { uk: "Місяць", ru: "Луна", t: "noun" }, { uk: "Яскравий", ru: "Яркий", t: "adj" },
        { uk: "Озеро", ru: "Озеро", t: "noun" }, { uk: "Глибоке", ru: "Глубокое", t: "adj" },
        { uk: "Гриб", ru: "Гриб", t: "noun" }, { uk: "Магічний", ru: "Магический", t: "adj" },
        { uk: "Очерет", ru: "Камыш", t: "noun" }, { uk: "Зелений", ru: "Зеленый", t: "adj" },
        { uk: "Зоря", ru: "Звезда", t: "noun" }, { uk: "Далека", ru: "Далекая", t: "adj" },
        { uk: "Берег", ru: "Берег", t: "noun" }, { uk: "Крутий", ru: "Крутой", t: "adj" },
        { uk: "Вода", ru: "Вода", t: "noun" }, { uk: "Холодна", ru: "Холодная", t: "adj" },
        { uk: "Трава", ru: "Трава", t: "noun" }, { uk: "Мокра", ru: "Мокрая", t: "adj" },
        { uk: "Камінь", ru: "Камень", t: "noun" }, { uk: "Гладкий", ru: "Гладкий", t: "adj" },
        { uk: "Вітер", ru: "Ветер", t: "noun" }, { uk: "Тихий", ru: "Тихий", t: "adj" },
        { uk: "Небо", ru: "Небо", t: "noun" }, { uk: "Зоряне", ru: "Звездное", t: "adj" },
        { uk: "Стежка", ru: "Тропинка", t: "noun" }, { uk: "Вузька", ru: "Узкая", t: "adj" },
        { uk: "Тінь", ru: "Тень", t: "noun" }, { uk: "Довга", ru: "Длинная", t: "adj" },
        { uk: "Секрет", ru: "Секрет", t: "noun" }, { uk: "Таємний", ru: "Тайный", t: "adj" }
    ];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    shuffleArray(wordsList);

    let currentIdx = 0;
    let isAnimating = false;

    const cloud = document.getElementById('cloud-container');
    const wordDisplay = document.getElementById('current-word');
    const frogContainer = document.getElementById('frog-container');
    const duckContainer = document.getElementById('duck-container');
    const frogMouth = document.getElementById('frog-mouth');
    const duckBeak = document.getElementById('duck-beak');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        }
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }

    function loadWord(index, noAnim = false) {
        if(!noAnim) isAnimating = true;
        
        wordDisplay.textContent = wordsList[index][currentLang].toUpperCase();
        cloud.dataset.type = wordsList[index].t;
        
        if(!noAnim) {
            cloud.style.transition = 'none';
            cloud.style.opacity = '0';
            cloud.style.left = '50%';
            cloud.style.top = '15%';
            cloud.style.transform = 'translateX(-50%) scale(0.5)';
            
            setTimeout(() => {
                cloud.style.transition = 'left 1s ease-in-out, top 1s ease-in-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s';
                cloud.style.opacity = '1';
                cloud.style.transform = 'translateX(-50%) scale(1)';
                
                setTimeout(() => {
                    isAnimating = false;
                }, 800);
            }, 50);
        }
    }

    function createRain(targetX, targetY) {
        for(let i=0; i<20; i++) {
            const drop = document.createElement('div');
            drop.className = 'raindrop';
            drop.style.left = (targetX - 100 + Math.random() * 200) + 'px';
            drop.style.top = (targetY + 80) + 'px';
            drop.style.animation = `rain-fall 0.6s linear ${Math.random() * 0.4}s`;
            document.getElementById('game-layer').appendChild(drop);
            setTimeout(() => drop.remove(), 1200);
        }
    }

    function runAnimationSuccess(characterType, targetX, targetY) {
        isAnimating = true;
        playSound('success');
        
        cloud.style.transform = 'translateX(0) scale(1)';
        cloud.style.left = (targetX - 200) + 'px'; 
        cloud.style.top = targetY + 'px';

        setTimeout(() => {
            createRain(targetX, targetY);
            
            if(characterType === 'noun') {
                const el = document.getElementById('frog-container');
                el.querySelector('svg').classList.add('jumping');
                frogMouth.setAttribute('d', 'M110,130 Q150,180 190,130');
                setTimeout(() => {
                    el.querySelector('svg').classList.remove('jumping');
                    frogMouth.setAttribute('d', 'M110,140 Q150,170 190,140');
                }, 800);
            } else {
                const el = document.getElementById('duck-container');
                el.querySelector('svg').classList.add('flapping');
                duckBeak.setAttribute('d', 'M95,110 L50,100 L95,125 Z');
                setTimeout(() => {
                    el.querySelector('svg').classList.remove('flapping');
                    duckBeak.setAttribute('d', 'M95,110 L50,115 L95,125 Z');
                }, 800);
            }

            setTimeout(() => {
                isAnimating = false;
                nextWord(false);
            }, 1500);

        }, 1000);
    }

    function runAnimationError(characterType) {
        playSound('error');
        cloud.classList.add('shake');
        
        if(characterType === 'noun') {
            frogMouth.setAttribute('d', 'M130,160 Q150,140 170,160');
            setTimeout(() => frogMouth.setAttribute('d', 'M110,140 Q150,170 190,140'), 600);
        } else {
            document.getElementById('duck-pupil').setAttribute('cx', '125');
            setTimeout(() => document.getElementById('duck-pupil').setAttribute('cx', '115'), 600);
        }
        setTimeout(() => cloud.classList.remove('shake'), 400);
    }

    function handleCharacterClick(characterElement, characterType, isRemote = false) {
        if(isAnimating && !isRemote) return;
        const currentType = cloud.dataset.type;
        
        if (currentType === characterType) {
            const rect = characterElement.getBoundingClientRect();
            // Коректуємо координати з огляду на зум
            const targetX = (rect.left + rect.width / 2) / currentZoom;
            const targetY = (rect.top - 150) / currentZoom; 
            
            runAnimationSuccess(characterType, targetX, targetY);
            if(!isRemote) sendGameAction('click_correct', { type: characterType, x: targetX, y: targetY });
        } else {
            runAnimationError(characterType);
            if(!isRemote) sendGameAction('click_error', { type: characterType });
        }
    }

    frogContainer.addEventListener('click', () => handleCharacterClick(frogContainer, 'noun'));
    duckContainer.addEventListener('click', () => handleCharacterClick(duckContainer, 'adj'));

    function nextWord(broadcast = true) {
        if(isAnimating) return;
        currentIdx++;
        if(currentIdx >= wordsList.length) {
            shuffleArray(wordsList);
            currentIdx = 0;
        }
        loadWord(currentIdx);
        if(broadcast) sendGameAction('nav_next', {});
    }

    function prevWord(broadcast = true) {
        if(isAnimating) return;
        currentIdx--;
        if(currentIdx < 0) currentIdx = wordsList.length - 1;
        loadWord(currentIdx);
        if(broadcast) sendGameAction('nav_prev', {});
    }

    document.getElementById('btn-next').addEventListener('click', () => nextWord(true));
    document.getElementById('btn-prev').addEventListener('click', () => prevWord(true));

    if (db) {
        db.ref('game_action').on('value', snap => {
            const action = snap.val();
            if(!action || action.senderId === senderId) return;
            if(Date.now() - action.timestamp > 2000) return;
            
            if(action.type === 'click_correct') {
                runAnimationSuccess(action.data.type, action.data.x, action.data.y);
            } else if(action.type === 'click_error') {
                runAnimationError(action.data.type);
            } else if(action.type === 'nav_next') {
                nextWord(false);
            } else if(action.type === 'nav_prev') {
                prevWord(false);
            }
        });
    }

    loadWord(currentIdx);

    // --- THEME MANAGER ---
    const themeModal = document.getElementById('theme-modal');
    const settingsBtn = document.getElementById('settings-btn');
    const closeThemeModal = document.getElementById('close-theme-modal');
    const themeGallery = document.getElementById('theme-gallery');
    
    settingsBtn.addEventListener('click', () => themeModal.style.display = 'block');
    closeThemeModal.addEventListener('click', () => themeModal.style.display = 'none');

    let bgIndex = 1;
    function checkAndLoadBackground() {
        const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${bgIndex}.webp`;
        const img = new Image();
        img.onload = () => {
            const card = document.createElement('div');
            card.className = 'theme-card';
            card.onclick = () => selectTheme(url);
            card.innerHTML = `<img src="${url}" alt="Фон ${bgIndex}"><p class="theme-name">Фон ${bgIndex}</p>`;
            themeGallery.appendChild(card);
            bgIndex++;
            checkAndLoadBackground(); // Послідовне завантаження
        };
        img.onerror = () => {
            // Зупиняємо перевірку при 404
        };
        img.src = url;
    }
    checkAndLoadBackground();

    function selectTheme(url, isRemote = false) {
        if(url === 'none') {
            document.body.style.backgroundImage = 'none';
            document.getElementById('environment').style.opacity = '1';
        } else {
            document.body.style.backgroundImage = `url(${url})`;
            document.getElementById('environment').style.opacity = '0';
        }
        
        if(!isRemote) {
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            if(db) db.ref('game_theme').set({ url: url, senderId: senderId });
        }
        themeModal.style.display = 'none';
    }

    if (db) {
        db.ref('game_theme').on('value', snap => {
            const data = snap.val();
            if(data && data.senderId !== senderId) {
                selectTheme(data.url, true);
            }
        });
    }

    // Відновлення фону при запуску
    const savedTheme = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
    if(savedTheme) selectTheme(savedTheme, true);


    // --- ІНСТРУМЕНТ МАЛЮВАННЯ ---
    const canvas = document.getElementById('draw-canvas-global');
    const ctx = canvas.getContext('2d');
    const toggleDrawBtn = document.getElementById('toggle-draw-btn-global');
    const drawPanel = document.getElementById('draw-panel-global');
    const closeDrawBtn = document.getElementById('close-draw-panel');
    let isDrawingMode = false;
    let isDrawing = false;
    let currentDrawColor = '#ff0000';
    let currentDrawWidth = 5;
    let lastX = 0, lastY = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    toggleDrawBtn.addEventListener('click', () => {
        drawPanel.style.display = 'flex';
        canvas.style.pointerEvents = 'auto';
        isDrawingMode = true;
        setTool('pencil');
    });

    closeDrawBtn.addEventListener('click', () => {
        drawPanel.style.display = 'none';
        canvas.style.pointerEvents = 'none';
        isDrawingMode = false;
    });

    document.getElementById('btn-pencil').addEventListener('click', () => setTool('pencil'));
    document.getElementById('btn-eraser').addEventListener('click', () => setTool('eraser'));
    document.getElementById('draw-width').addEventListener('input', (e) => currentDrawWidth = e.target.value);
    document.getElementById('draw-color').addEventListener('input', (e) => currentDrawColor = e.target.value);
    document.getElementById('btn-clear-canvas').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        sendGameAction('clear_canvas', {});
    });

    function setTool(tool) {
        document.getElementById('btn-pencil').classList.remove('active');
        document.getElementById('btn-eraser').classList.remove('active');
        if(tool === 'pencil') {
            document.getElementById('btn-pencil').classList.add('active');
            ctx.globalCompositeOperation = 'source-over';
        } else {
            document.getElementById('btn-eraser').classList.add('active');
            ctx.globalCompositeOperation = 'destination-out';
        }
    }

    function getMousePos(e) {
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX, y: clientY };
    }

    function drawLine(x0, y0, x1, y1, color, width, mode, isRemote = false) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalCompositeOperation = mode === 'eraser' ? 'destination-out' : 'source-over';
        ctx.stroke();
        ctx.restore();

        if(!isRemote) {
            sendGameAction('draw_line', {
                x0: x0 / canvas.width, y0: y0 / canvas.height,
                x1: x1 / canvas.width, y1: y1 / canvas.height,
                color, width, mode
            });
        }
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', doDraw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseout', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', doDraw);
    canvas.addEventListener('touchend', stopDraw);

    function startDraw(e) {
        if(!isDrawingMode) return;
        isDrawing = true;
        const pos = getMousePos(e);
        lastX = pos.x; lastY = pos.y;
    }
    function doDraw(e) {
        if(!isDrawing || !isDrawingMode) return;
        e.preventDefault();
        const pos = getMousePos(e);
        const mode = document.getElementById('btn-eraser').classList.contains('active') ? 'eraser' : 'pencil';
        drawLine(lastX, lastY, pos.x, pos.y, currentDrawColor, currentDrawWidth, mode);
        lastX = pos.x; lastY = pos.y;
    }
    function stopDraw() { isDrawing = false; }

    if(db) {
        db.ref('game_action').on('value', snap => {
            const action = snap.val();
            if(!action || action.senderId === senderId) return;
            
            if(action.type === 'draw_line') {
                const d = action.data;
                drawLine(
                    d.x0 * canvas.width, d.y0 * canvas.height,
                    d.x1 * canvas.width, d.y1 * canvas.height,
                    d.color, d.width, d.mode, true
                );
            } else if(action.type === 'clear_canvas') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });
    }

    // Перетягування панелі малювання
    const drawHandle = document.getElementById('draw-handle');
    let isDraggingPanel = false;
    let panelOffsetX, panelOffsetY;

    drawHandle.addEventListener('mousedown', (e) => {
        isDraggingPanel = true;
        panelOffsetX = e.clientX - drawPanel.getBoundingClientRect().left;
        panelOffsetY = e.clientY - drawPanel.getBoundingClientRect().top;
    });
    window.addEventListener('mousemove', (e) => {
        if(!isDraggingPanel) return;
        drawPanel.style.left = (e.clientX - panelOffsetX) + 'px';
        drawPanel.style.top = (e.clientY - panelOffsetY) + 'px';
        drawPanel.style.right = 'auto';
    });
    window.addEventListener('mouseup', () => isDraggingPanel = false);

</script>
</body>
</html>
