<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гра з Намистинками</title>
<!-- Firebase Compat 8.x -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    /* Скидання стилів */
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0c0804;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transition: background-image 0.5s ease;
    }

    /* Жорстке співвідношення 16:9 та прозорість */
    #game-wrapper {
        position: relative;
        width: 100vw;
        max-width: calc(100vh * 16 / 9);
        aspect-ratio: 16 / 9;
        background-color: transparent; /* Максимальна прозорість для фону */
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
        overflow: hidden;
    }

    /* Інтерактивний шар */
    .interactive-layer {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Панель вчителя */
    #teacher-panel {
        margin-top: 2%;
        display: flex;
        gap: 15px;
        padding: 10px 20px;
        background: rgba(45, 26, 21, 0.85);
        border-radius: 12px;
        border: 2px solid #27140c;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    /* СЕКРЕТНЕ ПОЛЕ ВВОДУ: колір тексту прозорий */
    #word-input {
        background-color: transparent;
        color: transparent;
        border: none;
        border-bottom: 3px solid #1a0d08;
        outline: none;
        font-size: 24px;
        width: 250px;
        text-align: center;
        caret-color: #8d6e63;
        font-weight: bold;
    }
    #word-input::selection {
        background: transparent;
        color: transparent;
    }

    #generate-btn {
        background: #6d4c41;
        border: 2px solid #27140c;
        border-radius: 8px;
        width: 45px;
        height: 45px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.2s, background 0.2s;
    }
    #generate-btn:active { transform: scale(0.9); background: #5d4037; }
    #generate-btn svg { width: 28px; height: 28px; fill: #d7ccc8; }

    /* Контейнер для дошки з шифром */
    #cipher-board-container {
        width: 90%;
        height: 32%;
        margin-top: 2%;
        position: relative;
    }

    /* Зона мотузки */
    #rope-zone {
        width: 100%;
        height: 35%;
        margin-top: 1%;
        position: relative;
    }

    /* Зона вводу для дитини */
    #child-zone {
        margin-top: auto;
        margin-bottom: 3%;
        display: flex;
        gap: 25px;
        align-items: center;
    }

    #answer-input {
        background: linear-gradient(135deg, #d7ccc8, #bcaaa4);
        border: 5px solid #3e2723;
        border-radius: 20px;
        font-size: 3.5vw;
        padding: 10px 30px;
        text-align: center;
        text-transform: uppercase;
        font-weight: 900;
        color: #27140c;
        outline: none;
        box-shadow: inset 0 5px 15px rgba(0,0,0,0.3), 0 12px 25px rgba(0,0,0,0.6);
        letter-spacing: 8px;
        width: 45vw;
        transition: border-color 0.3s;
        font-family: Arial, sans-serif;
    }
    #answer-input:focus { border-color: #5d4037; }

    #check-btn {
        background: linear-gradient(135deg, #558b2f, #33691e);
        border: 4px solid #1b5e20;
        border-radius: 50%;
        width: 7vw;
        height: 7vw;
        min-width: 70px;
        min-height: 70px;
        cursor: pointer;
        box-shadow: 0 12px 25px rgba(0,0,0,0.6), inset 0 5px 10px rgba(255,255,255,0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.1s, box-shadow 0.1s;
    }
    #check-btn:active { 
        transform: translateY(6px); 
        box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 5px 10px rgba(255,255,255,0.2); 
    }
    #check-btn svg { width: 55%; height: 55%; fill: #fff; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }

    /* Перемикач мов */
    #lang-switcher {
        position: absolute;
        bottom: 15px;
        left: 20px;
        z-index: 100;
        display: flex;
        gap: 8px;
        opacity: 0.15;
        transition: opacity 0.3s;
    }
    #lang-switcher:hover { opacity: 1; }
    .lang-btn {
        background: rgba(0,0,0,0.4);
        color: #a1887f;
        border: 1px solid #a1887f;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.2s;
        font-family: Arial, sans-serif;
    }
    .lang-btn.active { background: #8d6e63; color: #1a0d08; font-weight: bold; border-color: #8d6e63; }

    /* Анімації */
    @keyframes rope-success-glow {
        0%, 100% { filter: drop-shadow(0 0 0px transparent); }
        50% { filter: drop-shadow(0 0 30px #b2ff59); }
    }
    .success-glow { animation: rope-success-glow 0.8s ease-in-out 2; }
    
    @keyframes answer-error-shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-15px); }
        40%, 80% { transform: translateX(15px); }
    }
    .error-shake { animation: answer-error-shake 0.4s ease-in-out; }

    /* МЕНЮ ФОНІВ (Theme Manager) */
    #theme-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0,0,0,0.6);
        border: 2px solid #fff;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 24px;
        cursor: pointer;
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.2s;
    }
    #theme-btn:hover { transform: scale(1.1); }
    
    #theme-modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        z-index: 2000;
        justify-content: center;
        align-items: center;
    }
    #theme-gallery {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        width: 80%;
        max-width: 800px;
        max-height: 60vh;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
    }
    .theme-thumb {
        position: relative;
        cursor: pointer;
        border: 3px solid transparent;
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: 16/9;
        background-size: cover;
        background-position: center;
        transition: border 0.2s;
    }
    .theme-thumb:hover { border-color: #ff9800; }
    .theme-title {
        position: absolute;
        bottom: 0; left: 0; width: 100%;
        background: rgba(0,0,0,0.6);
        color: #fff;
        text-align: center;
        font-size: 14px;
        padding: 5px 0;
        font-family: Arial, sans-serif;
    }
    #close-theme-btn {
        position: absolute;
        top: 20px; right: 30px;
        font-size: 40px; color: #fff;
        cursor: pointer;
        font-weight: bold;
    }

    /* Адаптивність (Mobile Friendly) */
    @media (max-width: 768px) {
        #word-input { width: 160px; font-size: 18px; }
        #generate-btn { width: 35px; height: 35px; }
        #generate-btn svg { width: 22px; height: 22px; }
        #answer-input { font-size: 6vw; width: 55vw; padding: 8px 20px; letter-spacing: 4px; border-width: 3px; }
        #check-btn { width: 12vw; height: 12vw; min-width: 50px; min-height: 50px; border-width: 3px; }
        #teacher-panel { padding: 8px 12px; gap: 10px; margin-top: 5%; }
        #cipher-board-container { width: 95%; height: 28%; }
        #rope-zone { height: 30%; }
        #child-zone { gap: 15px; margin-bottom: 5%; }
    }
</style>
</head>
<body>

<div id="game-wrapper">
    <div class="interactive-layer">
        
        <!-- Панель вчителя -->
        <div id="teacher-panel">
            <input type="text" id="word-input" maxlength="12" autocomplete="off" spellcheck="false">
            <button id="generate-btn">
                <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            </button>
        </div>

        <!-- Дошка з шифром -->
        <div id="cipher-board-container">
            <svg id="cipher-svg" viewBox="0 0 1400 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <filter id="drop-shadow-heavy">
                        <feDropShadow dx="0" dy="15" stdDeviation="10" flood-opacity="0.8"/>
                    </filter>
                    <radialGradient id="bead-blue" cx="35%" cy="30%" r="65%">
                        <stop offset="0%" stop-color="#40c4ff"/><stop offset="100%" stop-color="#01579b"/>
                    </radialGradient>
                    <radialGradient id="bead-yellow" cx="35%" cy="30%" r="65%">
                        <stop offset="0%" stop-color="#ffff00"/><stop offset="100%" stop-color="#f57f17"/>
                    </radialGradient>
                    <radialGradient id="bead-red" cx="35%" cy="30%" r="65%">
                        <stop offset="0%" stop-color="#ff5252"/><stop offset="100%" stop-color="#b71c1c"/>
                    </radialGradient>
                    <linearGradient id="frame-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#5d4037"/><stop offset="100%" stop-color="#3e2723"/>
                    </linearGradient>
                </defs>
                <rect x="20" y="10" width="1360" height="280" rx="20" fill="url(#frame-grad)" filter="url(#drop-shadow-heavy)" stroke="#27140c" stroke-width="4"/>
                <rect x="50" y="40" width="1300" height="220" rx="8" fill="#263238" stroke="#1a0d08" stroke-width="2"/>
                <circle cx="40" cy="30" r="6" fill="#78909c"/><circle cx="1360" cy="30" r="6" fill="#78909c"/>
                <circle cx="40" cy="270" r="6" fill="#78909c"/><circle cx="1360" cy="270" r="6" fill="#78909c"/>
                <g id="key-elements"></g>
            </svg>
        </div>

        <!-- Зона мотузки -->
        <div id="rope-zone">
            <svg id="rope-svg" viewBox="0 0 1600 350" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
                <path d="M -100 120 Q 800 320 1700 120" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="8" transform="translate(0,25)"/>
                <path id="rope-curve" d="M -100 120 Q 800 320 1700 120" fill="none" stroke="#8d6e63" stroke-width="12" stroke-linecap="round"/>
                <path d="M -100 120 Q 800 320 1700 120" fill="none" stroke="#5d4037" stroke-width="4" stroke-dasharray="15, 10" stroke-linecap="round"/>
                <g id="beads-group"></g>
            </svg>
        </div>

        <!-- Зона відповіді -->
        <div id="child-zone">
            <input type="text" id="answer-input" autocomplete="off" spellcheck="false">
            <button id="check-btn">
                <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
            </button>
        </div>
    </div>

    <div id="lang-switcher">
        <button class="lang-btn active" onclick="handleLangClick('uk')">UK</button>
        <button class="lang-btn" onclick="handleLangClick('ru')">RU</button>
    </div>
</div>

<!-- ================= БЛОК THEME MANAGER ================= -->
<button id="theme-btn">⚙️</button>
<div id="theme-modal">
    <div id="close-theme-btn">&times;</div>
    <div id="theme-gallery"></div>
</div>

<!-- ================= БЛОК КОНТРОЛЮ ДОСТУПУ ================= -->
<div id="block-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; color: red; font-size: 5vw; font-family: Arial, sans-serif; font-weight: bold; text-align: center;">
    Зачекай! Зараз не твій урок.
</div>

<script>
// --- ІНІЦІАЛІЗАЦІЯ FIREBASE ---
const firebaseConfig = {
    databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
    projectId: "lesson-13c44"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

// --- РАДАР, ІДЕНТИФІКАЦІЯ, БЛОКУВАННЯ ---
const urlParams = new URLSearchParams(window.location.search);
let myName = urlParams.get('user') || sessionStorage.getItem('userName');
if (!myName) {
    myName = "Гість_" + Math.floor(Math.random() * 1000);
}
sessionStorage.setItem('userName', myName);

const tabId = Math.random().toString(36).substr(2, 9);
const senderId = myName + "_" + tabId;
let isRemoteAction = false;
let startupImmunity = true;

setTimeout(() => { startupImmunity = false; }, 1000);

const presenceRef = db.ref('online_users/' + myName + '/' + tabId);
db.ref('.info/connected').on('value', snap => {
    if (snap.val() === true) {
        presenceRef.set(true);
        presenceRef.onDisconnect().remove();
    }
});
window.addEventListener('beforeunload', () => { presenceRef.remove(); });

db.ref('blocked_users/' + myName).on('value', snap => {
    if (snap.val() === true) {
        document.getElementById('block-overlay').style.display = 'flex';
    } else {
        document.getElementById('block-overlay').style.display = 'none';
    }
});

db.ref('force_refresh').on('value', snap => {
    if (snap.val() && !startupImmunity) window.location.reload();
});

db.ref('current_activity').on('value', snap => {
    if (startupImmunity) return;
    if (snap.val() === 'lobby') {
        window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
    }
});

// --- СИНХРОНІЗАЦІЯ ДІЙ ГРИ ---
const actionRef = db.ref('game_action');
actionRef.on('value', snap => {
    const data = snap.val();
    if (!data || data.senderId === senderId) return;
    
    isRemoteAction = true;
    
    if (data.type === 'LANG') {
        setLanguageCore(data.lang);
    } else if (data.type === 'GENERATE') {
        setLanguageCore(data.lang);
        document.getElementById('word-input').value = data.word;
        
        targetWord = data.word;
        cipherMap = data.cipherMap;
        document.getElementById('answer-input').value = "";
        
        drawCipherBoard(data.keyLetters);
        drawRopeBeads(data.word);
        playTones('generate');
    } else if (data.type === 'CHECK') {
        document.getElementById('answer-input').value = data.answer;
        checkAnswerCore(data.answer);
    }
    
    setTimeout(() => { isRemoteAction = false; }, 50);
});

function sendAction(type, payload) {
    if (isRemoteAction) return;
    actionRef.set({
        senderId: senderId,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        type: type,
        ...payload
    });
}

// --- СИСТЕМА ДИНАМІЧНИХ ФОНІВ ---
const themeRef = db.ref('game_theme');
const bgBaseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';

// Відновлення локального фону при старті
const savedBg = localStorage.getItem('mySavedGameBg');
if (savedBg) {
    document.body.style.backgroundImage = `url('${savedBg}')`;
}

// Завантаження галереї
async function loadThemes() {
    const gallery = document.getElementById('theme-gallery');
    gallery.innerHTML = '';
    
    for (let i = 1; i <= 1000; i++) {
        const url = `${bgBaseUrl}background_${i}.webp`;
        try {
            const exists = await checkImage(url);
            if (exists) {
                const div = document.createElement('div');
                div.className = 'theme-thumb';
                div.style.backgroundImage = `url('${url}')`;
                
                const title = document.createElement('div');
                title.className = 'theme-title';
                title.innerText = `Фон ${i}`;
                
                div.appendChild(title);
                div.onclick = () => {
                    themeRef.set(url);
                    document.getElementById('theme-modal').style.display = 'none';
                };
                gallery.appendChild(div);
            } else {
                break; // Зупиняємо цикл, якщо картинки не існує
            }
        } catch (e) {
            break;
        }
    }
}

function checkImage(url) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
    });
}

// Слухаємо зміну фону в Firebase
themeRef.on('value', snap => {
    const url = snap.val();
    if (url) {
        document.body.style.backgroundImage = `url('${url}')`;
        localStorage.setItem('mySavedGameBg', url);
    }
});

document.getElementById('theme-btn').onclick = () => {
    document.getElementById('theme-modal').style.display = 'flex';
    if (document.getElementById('theme-gallery').innerHTML === '') {
        loadThemes();
    }
};

document.getElementById('close-theme-btn').onclick = () => {
    document.getElementById('theme-modal').style.display = 'none';
};

// --- ЛОГІКА ГРИ З НАМИСТИНКАМИ ---
const colorTypes = ['blue', 'yellow', 'red'];
const allCombos = [];
for (let c1 of colorTypes) {
    for (let c2 of colorTypes) {
        allCombos.push([c1, c2]);
    }
}

const alphabets = {
    uk: "АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ",
    ru: "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ"
};

let currentLang = 'uk';
let targetWord = "";
let cipherMap = {}; 

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx;

function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function getQuadraticBezierPoint(t, p0, p1, p2) {
    const x = (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x;
    const y = (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y;
    return { x, y };
}

function playTones(type) {
    if (!actx) actx = new AudioCtx();
    if (actx.state === 'suspended') actx.resume();
    
    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    
    osc.connect(gain);
    gain.connect(actx.destination);
    
    if (type === 'generate') {
        osc.type = 'sine';
        for(let i=0; i<8; i++) {
            osc.frequency.setValueAtTime(200 + i*100, now + i*0.04);
        }
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
    } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); 
        osc.frequency.setValueAtTime(659.25, now + 0.1); 
        osc.frequency.setValueAtTime(783.99, now + 0.2); 
        osc.frequency.setValueAtTime(1046.50, now + 0.35); 
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.7);
        osc.start(now);
        osc.stop(now + 0.7);
    } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
    }
}

function setLanguageCore(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.lang-btn[onclick="handleLangClick('${lang}')"]`).classList.add('active');
    
    document.getElementById('word-input').value = "";
    document.getElementById('answer-input').value = "";
    document.getElementById('key-elements').innerHTML = "";
    document.getElementById('beads-group').innerHTML = "";
    targetWord = "";
}

function handleLangClick(lang) {
    setLanguageCore(lang);
    sendAction('LANG', { lang: lang });
}

function generatePuzzle() {
    let word = document.getElementById('word-input').value.toUpperCase().replace(/\s/g, '');
    if (!word) return;
    
    targetWord = word;
    cipherMap = {};
    const alphabet = alphabets[currentLang];
    let uniqueLetters = [...new Set(word.split(''))];
    
    if (uniqueLetters.length > 9) {
        word = word.substring(0, 9);
        targetWord = word;
        uniqueLetters = [...new Set(word.split(''))];
    }
    
    let availableNoise = alphabet.split('').filter(l => !uniqueLetters.includes(l));
    availableNoise = shuffle(availableNoise);
    
    let keyLetters = [...uniqueLetters];
    while (keyLetters.length < 9) {
        keyLetters.push(availableNoise.pop());
    }
    keyLetters = shuffle(keyLetters);
    let combos = shuffle(allCombos);
    
    keyLetters.forEach((letter, idx) => {
        cipherMap[letter] = combos[idx];
    });
    
    document.getElementById('answer-input').value = "";
    
    drawCipherBoard(keyLetters);
    drawRopeBeads(word);
    playTones('generate');
    
    sendAction('GENERATE', { 
        word: word, 
        lang: currentLang, 
        keyLetters: keyLetters, 
        cipherMap: cipherMap 
    });
}

function drawCipherBoard(letters) {
    const container = document.getElementById('key-elements');
    container.innerHTML = "";
    
    const row1Y = 110;
    const row2Y = 230;
    
    letters.forEach((letter, i) => {
        const isRow1 = i < 5;
        const countInRow = isRow1 ? 5 : 4;
        const y = isRow1 ? row1Y : row2Y;
        const spacing = 1260 / countInRow; 
        const x = 90 + (i % countInRow) * spacing; 
        
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", x);
        text.setAttribute("y", y);
        text.setAttribute("font-size", "65");
        text.setAttribute("font-weight", "bold");
        text.setAttribute("fill", "#eceff1");
        text.setAttribute("font-family", "Arial, sans-serif");
        text.textContent = letter + ":";
        g.appendChild(text);
        
        const combo = cipherMap[letter];
        [0, 1].forEach(j => {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", x + 125 + j * 55); 
            circle.setAttribute("cy", y - 22);
            circle.setAttribute("r", "22");
            circle.setAttribute("fill", `url(#bead-${combo[j]})`);
            circle.setAttribute("stroke", "#1a0d08");
            circle.setAttribute("stroke-width", "3");
            circle.setAttribute("filter", "drop-shadow(3px 4px 3px rgba(0,0,0,0.6))");
            g.appendChild(circle);
        });
        
        container.appendChild(g);
    });
}

function drawRopeBeads(word) {
    const group = document.getElementById('beads-group');
    group.innerHTML = "";
    
    const totalBeads = word.length * 2;
    if (totalBeads === 0) return;
    
    const p0 = { x: -100, y: 120 };
    const p1 = { x: 800, y: 320 };
    const p2 = { x: 1700, y: 120 };
    
    const flatColors = [];
    for (let char of word) {
        let combo = cipherMap[char];
        if (combo) {
            flatColors.push(combo[0]);
            flatColors.push(combo[1]);
        }
    }
    
    let stepT = 0.05; 
    const maxSpread = 0.8; 
    let totalSpread = (totalBeads - 1) * stepT;
    
    if (totalSpread > maxSpread) {
        stepT = maxSpread / (totalBeads - 1);
        totalSpread = maxSpread;
    }
    
    const startT = 0.5 - (totalSpread / 2);
    
    flatColors.forEach((color, i) => {
        const t = startT + i * stepT;
        const pos = getQuadraticBezierPoint(t, p0, p1, p2);
        
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", pos.x);
        circle.setAttribute("cy", pos.y);
        circle.setAttribute("r", "38"); 
        circle.setAttribute("fill", `url(#bead-${color})`);
        circle.setAttribute("stroke", "#27140c");
        circle.setAttribute("stroke-width", "4");
        circle.setAttribute("filter", "drop-shadow(0px 8px 6px rgba(0,0,0,0.7))");
        
        const anim = document.createElementNS("http://www.w3.org/2000/svg", "animate");
        anim.setAttribute("attributeName", "cy");
        anim.setAttribute("from", "-150");
        anim.setAttribute("to", pos.y);
        anim.setAttribute("dur", "0.6s");
        anim.setAttribute("begin", `${i * 0.08}s`);
        anim.setAttribute("fill", "freeze");
        anim.setAttribute("calcMode", "spline");
        anim.setAttribute("keySplines", "0.2 0.1 0.2 1");
        
        circle.appendChild(anim);
        group.appendChild(circle);
    });
}

function checkAnswerCore(userAnswer) {
    const inputEl = document.getElementById('answer-input');
    const rope = document.getElementById('rope-zone');
    const childZone = document.getElementById('child-zone');
    
    rope.classList.remove('success-glow');
    childZone.classList.remove('error-shake');
    void rope.offsetWidth; 
    
    if (userAnswer === targetWord) {
        playTones('success');
        rope.classList.add('success-glow');
        
        const beads = document.querySelectorAll('#beads-group circle');
        beads.forEach((b, i) => {
            const anim = document.createElementNS("http://www.w3.org/2000/svg", "animateTransform");
            anim.setAttribute("attributeName", "transform");
            anim.setAttribute("type", "translate");
            anim.setAttribute("values", `0,0; 0,-40; 0,0`);
            anim.setAttribute("dur", "0.4s");
            anim.setAttribute("begin", `${i * 0.04}s`);
            b.appendChild(anim);
        });
    } else {
        playTones('error');
        childZone.classList.add('error-shake');
        inputEl.value = ""; 
    }
}

function checkAnswer() {
    if (!targetWord) return;
    const inputEl = document.getElementById('answer-input');
    const userAnswer = inputEl.value.toUpperCase().replace(/\s/g, '');
    
    sendAction('CHECK', { answer: userAnswer });
    checkAnswerCore(userAnswer);
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('generate-btn').addEventListener('click', generatePuzzle);
    document.getElementById('check-btn').addEventListener('click', checkAnswer);
    
    document.getElementById('word-input').addEventListener('keypress', e => {
        if (e.key === 'Enter') generatePuzzle();
    });
    document.getElementById('answer-input').addEventListener('keypress', e => {
        if (e.key === 'Enter') checkAnswer();
    });
    
    document.body.addEventListener('click', () => {
        if (actx && actx.state === 'suspended') {
            actx.resume();
        } else if (!actx) {
            actx = new AudioCtx();
        }
    }, { once: true });
});
