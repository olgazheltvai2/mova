            }
          }
          if (lt.drawProgress < 1) allWritten = false;
        }
        if (allWritten) {
          gamePhase = 'ready';
        }
      } else if (gamePhase === 'sweeping_action' && janitor.state === 'sweeping' && targetLetterToSweep) {
        const prevCycle = Math.floor(janitor.sweepCycle * 2);
        janitor.sweepCycle += dt * 2.15; // ~4 енергійні помахи за ~1 секунду
        const curCycle = Math.floor(janitor.sweepCycle * 2);

        targetLetterToSweep.eraseProgress = Math.min(1, janitor.sweepCycle / 2.0);
        targetLetterToSweep.smudgeOffset = Math.sin(janitor.sweepCycle * Math.PI * 2) * 14 * targetLetterToSweep.eraseProgress;

        if (curCycle !== prevCycle && curCycle <= 4) {
          sound.playBroomSweep(curCycle);
          const sweepDir = curCycle % 2 === 0 ? janitor.facing : -janitor.facing;
          spawnSweepDebris(targetLetterToSweep.x, targetLetterToSweep.y, sweepDir, currentChalkColor.main);
        }

        if (janitor.sweepCycle >= 2.05) {
          finishSweepAndSlide();
        }
      } else if (gamePhase === 'sliding') {
        phaseTimer += dt;
        let allArrived = true;
        chalkLetters.forEach((lt) => {
          if (lt.removed) return;
          const diff = lt.targetX - lt.x;
          if (Math.abs(diff) > 0.8) {
            lt.x += diff * Math.min(1, dt * 11);
            allArrived = false;
            if (Math.random() < 0.35) {
              spawnChalkDust(lt.x, lt.y + lt.size * 0.3, currentChalkColor.main, 1, 0.35);
            }
          } else {
            lt.x = lt.targetX;
          }
        });

        if (allArrived || phaseTimer > 0.55) {
          gamePhase = 'celebrating';
          phaseTimer = 0;
          celebrationSunPulse = 1.0;
          sound.playCelebration(janitor.celebrationVariant);
          spawnCelebrationSparkles(chalkLetters);
          triggerBirdsCelebration();
        }
      } else if (gamePhase === 'celebrating') {
        phaseTimer += dt;
        celebrationSunPulse = Math.max(0, 1 - phaseTimer / 1.9);

        if (phaseTimer >= 2.05) {
          // Повертаємо двірника на вихідну позицію та запускаємо нове слово
          janitor.state = 'returning';
          janitor.targetX = janitor.homeX;
          janitor.targetY = janitor.homeY;
          startNewWord();
        }
      }

      // Плавна анімація наведення та згасання тремтіння літер
      chalkLetters.forEach((lt) => {
        const targetHover = (hoveredLetter === lt && gamePhase === 'ready') ? 1 : 0;
        lt.hoverAmount += (targetHover - lt.hoverAmount) * Math.min(1, dt * 12);
        if (lt.shakeTime > 0) {
          lt.shakeTime = Math.max(0, lt.shakeTime - dt);
        }
      });

      // Якщо двірник закінчив бурчати після помилки — повертається в очікування
      if (janitor.state === 'grumpy' && janitor.stateTimer > 0.72) {
        janitor.state = 'idle';
      }

      // 5. Оновлення двірника
      janitor.update(dt);

      // 6. Оновлення частинок
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt;
        if (p.life >= p.maxLife) {
          particles.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.type === 'pebble') {
          p.vy += 320 * dt;
        } else if (p.type === 'leaf') {
          p.vy += 85 * dt;
          p.rot += p.vRot * dt;
        } else if (p.type === 'dust') {
          p.vx *= Math.pow(0.25, dt);
          p.r += 14 * dt;
        } else if (p.type === 'sparkle') {
          p.vy += 60 * dt;
        }
      }
    }

    function render(nowSec) {
      ctx.clearRect(0, 0, W, H);

      // 1. Базове кешоване тло вулиці та асфальту
      ctx.drawImage(bgLayer, 0, 0, W, H);

      // 2. Живі хмари у верхній частині неба (під кронами дерев)
      drawClouds(ctx);

      // 3. Пишні крони дерев, що погойдуються на вітрі, та сонячні промені
      drawSunbeams(ctx, nowSec);
      drawSwayingCanopies(ctx, nowSec);

      // 4. Пташки на тротуарі
      drawStreetBirds(ctx, nowSec);

      // 5. Осіннє листя на асфальті (задній план)
      drawFallingLeaves(ctx, true);

      // 6. Крейдяні літери на асфальті
      const glow = gamePhase === 'celebrating' ? Math.sin(Math.min(1, phaseTimer * 2) * Math.PI) : 0;
      chalkLetters.forEach((lt) => lt.draw(ctx, glow));

      // Ефект крейди, що пише нове слово
      if (gamePhase === 'writing') {
        const writingLt = chalkLetters.find((l) => l.drawProgress > 0 && l.drawProgress < 1);
        if (writingLt) {
          drawMovingChalkPiece(ctx, writingLt);
        }
      }

      // 7. Двірник
      janitor.draw(ctx);

      // 8. Осіннє листя, що летить у повітрі, та частинки пилу/іскор
      drawFallingLeaves(ctx, false);
      drawParticles(ctx);
    }

    function drawClouds(c) {
      c.save();
      c.beginPath();
      c.rect(0, 0, W, sidewalkTopY * 0.55);
      c.clip();

      clouds.forEach((cl) => {
        c.save();
        c.translate(cl.x, cl.y);
        c.scale(cl.scale, cl.scale);
        c.fillStyle = 'rgba(255, 250, 242, 0.36)';
        c.beginPath();
        c.arc(0, 0, 28, 0, Math.PI * 2);
        c.arc(26, -6, 34, 0, Math.PI * 2);
        c.arc(56, 2, 26, 0, Math.PI * 2);
        c.fill();
        c.restore();
      });
      c.restore();
    }

    function drawSunbeams(c, nowSec) {
      c.save();
      c.globalCompositeOperation = 'screen';
      const baseAlpha = 0.08 + celebrationSunPulse * 0.14;
      for (let i = 0; i < 4; i++) {
        const x1 = W * (0.12 + i * 0.24) + Math.sin(nowSec * 0.4 + i) * 18;
        const grad = c.createLinearGradient(x1, 0, x1 + 140, curbY + 80);
        grad.addColorStop(0, `rgba(255, 238, 175, ${baseAlpha})`);
        grad.addColorStop(1, 'rgba(255, 238, 175, 0)');
        c.fillStyle = grad;
        c.beginPath();
        c.moveTo(x1 - 35, 0);
        c.lineTo(x1 + 55, 0);
        c.lineTo(x1 + 230, curbY + 90);
        c.lineTo(x1 + 60, curbY + 90);
        c.closePath();
        c.fill();
      }
      c.restore();
    }

    function drawSwayingCanopies(c, nowSec) {
      treeClusters.forEach((tc) => {
        tc.blobs.forEach((b) => {
          const swayX = Math.sin(nowSec * 1.4 + b.phase) * 5.5;
          const swayY = Math.cos(nowSec * 1.1 + b.phase) * 2.5;
          c.fillStyle = b.color;
          c.beginPath();
          c.arc(tc.cx + b.ox + swayX, tc.cy + b.oy + swayY, b.rad, 0, Math.PI * 2);
          c.fill();
        });
      });
    }

    function drawStreetBirds(c, nowSec) {
      streetBirds.forEach((b) => {
        c.save();
        c.translate(b.x, b.y);
        c.scale(b.dir, 1);

        const hopBob = b.state === 'hop' ? -Math.abs(Math.sin(nowSec * 22)) * 6 : 0;
        const peckRot = b.state === 'peck' ? Math.max(0, Math.sin(nowSec * 9 + b.x)) * 0.45 : 0;
        c.translate(0, hopBob);
        c.rotate(peckRot);

        // Тінь пташки
        if (b.state !== 'fly') {
          c.fillStyle = 'rgba(20, 16, 12, 0.28)';
          c.beginPath();
          c.ellipse(0, 6 - hopBob, 8, 2.5, 0, 0, Math.PI * 2);
          c.fill();
        }

        // Тіло горобця чи голуба
        c.fillStyle = b.kind === 'sparrow' ? '#7a563b' : '#6c7682';
        c.beginPath();
        c.ellipse(0, 0, 8.5, 5.8, -0.15, 0, Math.PI * 2);
        c.fill();

        // Крило
        const wingY = b.state === 'fly' ? Math.sin(b.wingPhase) * 8 : 0;
        c.fillStyle = b.kind === 'sparrow' ? '#573b26' : '#515963';
        c.beginPath();
        c.ellipse(-1, wingY * 0.5, 6, 3.5 + Math.abs(wingY) * 0.4, 0.2, 0, Math.PI * 2);
        c.fill();

        // Голівка і дзьоб
        c.fillStyle = b.kind === 'sparrow' ? '#694830' : '#58626e';
        c.beginPath();
        c.arc(7, -4, 4.5, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = '#e0a938';
        c.beginPath();
        c.moveTo(11, -5);
        c.lineTo(15, -3.5);
        c.lineTo(11, -2);
        c.closePath();
        c.fill();

        c.restore();
      });
    }

    function drawFallingLeaves(c, settledOnly) {
      ambientLeaves.forEach((lf) => {
        if (lf.settled !== settledOnly) return;
        c.save();
        c.translate(lf.x, lf.y);
        c.rotate(lf.rot);
        c.fillStyle = lf.color;
        c.beginPath();
        c.moveTo(-lf.size, 0);
        c.quadraticCurveTo(0, -lf.size * 0.75, lf.size, 0);
        c.quadraticCurveTo(0, lf.size * 0.75, -lf.size, 0);
        c.fill();

        c.strokeStyle = 'rgba(60, 25, 10, 0.4)';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(-lf.size * 0.8, 0);
        c.lineTo(lf.size * 0.8, 0);
        c.stroke();
        c.restore();
      });
    }

    function drawMovingChalkPiece(c, lt) {
      const cx = lt.x + Math.sin(lt.drawProgress * Math.PI * 4) * (lt.size * 0.28);
      const cy = lt.y - lt.size * 0.45 + lt.drawProgress * (lt.size * 0.9);
      c.save();
      c.translate(cx, cy);
      c.rotate(-0.45);
      c.fillStyle = currentChalkColor.main;
      c.strokeStyle = '#9e9585';
      c.lineWidth = 1.5;
      c.beginPath();
      c.roundRect(-5, -18, 10, 24, 3);
      c.fill();
      c.stroke();
      c.restore();
    }

    function drawParticles(c) {
      particles.forEach((p) => {
        const t = p.life / p.maxLife;
        const alpha = p.alpha * (1 - t);
        c.save();
        c.globalAlpha = Math.max(0, alpha);
        c.translate(p.x, p.y);

        if (p.type === 'dust') {
          const grad = c.createRadialGradient(0, 0, 1, 0, 0, p.r);
          grad.addColorStop(0, p.color);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          c.fillStyle = grad;
          c.beginPath();
          c.arc(0, 0, p.r, 0, Math.PI * 2);
          c.fill();
        } else if (p.type === 'pebble') {
          c.fillStyle = p.color;
          c.beginPath();
          c.arc(0, 0, p.r, 0, Math.PI * 2);
          c.fill();
        } else if (p.type === 'leaf') {
          c.rotate(p.rot);
          c.fillStyle = p.color;
          c.beginPath();
          c.ellipse(0, 0, p.r * 1.5, p.r * 0.8, 0, 0, Math.PI * 2);
          c.fill();
        } else if (p.type === 'sparkle') {
          c.fillStyle = p.color;
          c.rotate(p.life * 6);
          const s = p.r * (1 - t * 0.5);
          c.beginPath();
          c.moveTo(0, -s * 1.6);
          c.quadraticCurveTo(s * 0.3, -s * 0.3, s * 1.6, 0);
          c.quadraticCurveTo(s * 0.3, s * 0.3, 0, s * 1.6);
          c.quadraticCurveTo(-s * 0.3, s * 0.3, -s * 1.6, 0);
          c.quadraticCurveTo(-s * 0.3, -s * 0.3, 0, -s * 1.6);
          c.closePath();
          c.fill();
        }
        c.restore();
      });
    }

    /**
     * ============================================================================
     * ОБРОБНИКИ ПОДІЙ ТА АДАПТИВНІСТЬ ЕКРАНА
     * ============================================================================
     */
    function handleResize() {
      W = window.innerWidth;
      H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = W * DPR;
      canvas.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      buildStaticEnvironment();
      initLivingWorld();
      janitor.resizeUpdate();
      layoutChalkWord(false);
    }

    window.addEventListener('resize', handleResize);

    canvas.addEventListener('pointermove', (e) => {
      if (gamePhase !== 'ready') {
        hoveredLetter = null;
        canvas.style.cursor = 'default';
        return;
      }

      let found = null;
      for (const lt of chalkLetters) {
        if (lt.containsPoint(e.clientX, e.clientY)) {
          found = lt;
          break;
        }
      }

      if (found !== hoveredLetter) {
        hoveredLetter = found;
        if (found) {
          sound.playHoverTick();
          spawnChalkDust(found.x, found.y, currentChalkColor.main, 5, 0.45);
          janitor.facing = found.x >= janitor.x ? 1 : -1;
        }
      }
      canvas.style.cursor = found ? 'pointer' : 'default';
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handlePointerDown(e.clientX, e.clientY);
    });

    // Мінімалістична кнопка "Далі" (миттєвий перехід до наступного слова)
    document.getElementById('nextBtn').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      sound.init();
      sound.playBroomSweep(0);

      // Ефект вихору крейдяного пилу при пропуску слова
      chalkLetters.forEach((lt) => {
        if (!lt.removed) {
          spawnChalkDust(lt.x, lt.y, currentChalkColor.main, 7, 0.9);
        }
      });

      janitor.state = 'returning';
      janitor.targetX = janitor.homeX;
      janitor.targetY = janitor.homeY;
      startNewWord();
    });

    // Запуск гри
    window.onload = () => {
      handleResize();
      startNewWord();

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt, now / 1000);
        render(now / 1000);
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    };
  </script>
</body>
</html>
