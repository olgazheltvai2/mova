<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Нічна пригода на кухні</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #070a12;
      font-family: 'Nunito', sans-serif;
    }

    /* Main 16:9 adaptive viewport container */
    #app-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, #161f33 0%, #090d18 70%, #05070d 100%);
    }

    /* Scene SVG Container */
    #scene-container {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scene-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Interactive SVG elements cursor & transitions */
    .interactive-node {
      cursor: pointer;
      transition: filter 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-box: fill-box;
      transform-origin: center;
    }
    .interactive-node:hover {
      filter: brightness(1.16) drop-shadow(0 0 12px rgba(255, 212, 128, 0.45));
    }

    /* Particle overlay canvas */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    /* Bottom carved oak cutting-board dock for the sentence */
    #board-dock {
      position: relative;
      z-index: 25;
      width: 100%;
      padding: 0.5rem 6.2rem 1rem 1.5rem;
      background: linear-gradient(180deg, rgba(10, 12, 18, 0) 0%, rgba(7, 9, 14, 0.88) 25%, rgba(5, 7, 11, 0.98) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Carved Dark Oak & Brass Kitchen Cutting Board */
    #cutting-board {
      position: relative;
      width: min(96vw, 1780px);
      min-height: clamp(96px, 14vh, 148px);
      padding: clamp(14px, 2vh, 24px) clamp(24px, 2.6vw, 44px);
      border-radius: 28px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 2px,
          transparent 2px,
          transparent 9px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(32, 17, 7, 0.35) 0px,
          rgba(58, 33, 15, 0.25) 14px,
          rgba(28, 15, 6, 0.4) 28px
        ),
        linear-gradient(180deg, #4b2c16 0%, #38200f 48%, #271509 100%);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.85),
        0 4px 12px rgba(0, 0, 0, 0.7),
        inset 0 2px 3px rgba(255, 218, 168, 0.32),
        inset 0 -6px 12px rgba(12, 5, 2, 0.9),
        inset 0 0 28px rgba(18, 8, 3, 0.75);
      border: 3px solid #6e4523;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(16px, 2vw, 32px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
    }

    /* Brass corner rivets on cutting board */
    #cutting-board::before,
    #cutting-board::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 46%;
      border-radius: 8px;
      background: linear-gradient(180deg, #f6d38b 0%, #b88233 50%, #6d4714 100%);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.6),
        0 2px 6px rgba(0, 0, 0, 0.75);
      pointer-events: none;
    }
    #cutting-board::before {
      left: 10px;
    }
    #cutting-board::after {
      right: 10px;
    }

    /* Engraved inner groove of the cutting board */
    #sentence-track {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      row-gap: 14px;
      column-gap: clamp(18px, 2.2vw, 34px);
      padding: 6px 12px;
      width: 100%;
    }

    /* Individual carved word / glued-words block */
    .word-chunk {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: clamp(10px, 1.3vh, 16px) clamp(18px, 1.5vw, 26px);
      border-radius: 18px;
      background:
        radial-gradient(circle at 20% 22%, rgba(255, 245, 214, 0.28) 0%, transparent 55%),
        linear-gradient(180deg, #5c3416 0%, #42240d 55%, #2b1606 100%);
      box-shadow:
        0 10px 20px rgba(0, 0, 0, 0.75),
        0 4px 0 #1c0d03,
        inset 0 2px 3px rgba(255, 226, 176, 0.42),
        inset 0 -4px 8px rgba(15, 7, 2, 0.85);
      border: 2.5px solid #8c5828;
      transition:
        transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.35s ease,
        box-shadow 0.35s ease;
      animation: chunkPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Completed isolated single word styling (warm golden Maasdam/honey glow) */
    .word-chunk.single-word-complete {
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 252, 230, 0.35) 0%, transparent 60%),
        linear-gradient(180deg, #78451a 0%, #593110 54%, #3d2008 100%);
      border-color: #f0b651;
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.75),
        0 4px 0 #261204,
        0 0 20px rgba(255, 204, 102, 0.38),
        inset 0 2px 4px rgba(255, 240, 200, 0.65),
        inset 0 -3px 6px rgba(28, 13, 3, 0.75);
    }

    /* All sentence completed celebratory wave */
    .word-chunk.sentence-celebrate {
      animation: celebrateWave 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes chunkPop {
      0% {
        transform: scale(0.95) translateY(3px);
      }
      60% {
        transform: scale(1.03) translateY(-2px);
      }
      100% {
        transform: scale(1) translateY(0);
      }
    }

    @keyframes celebrateWave {
      0% { transform: translateY(0) scale(1); }
      35% {
        transform: translateY(-14px) scale(1.07);
        filter: brightness(1.18) drop-shadow(0 12px 16px rgba(255, 200, 80, 0.45));
      }
      70% { transform: translateY(2px) scale(0.98); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-6px) rotate(-1.5deg); }
      40% { transform: translateX(6px) rotate(1.5deg); }
      60% { transform: translateX(-4px) rotate(-0.8deg); }
      80% { transform: translateX(4px) rotate(0.8deg); }
    }

    .shake-wrong {
      animation: wrongShake 0.36s ease;
    }

    /* Character styling inside chunks - LARGE, CRISP, NEVER SHIFTS ON HOVER */
    .char-cell {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(36px, 4.4vw, 58px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: 0.01em;
      color: #fff6db;
      text-shadow:
        0 3px 0 #1f0e03,
        0 0 12px rgba(255, 215, 128, 0.25);
      transition: color 0.15s ease, text-shadow 0.15s ease;
      pointer-events: none;
    }

    #sentence-track.long-sentence .char-cell {
      font-size: clamp(32px, 3.8vw, 50px);
    }

    /* Fixed-width slice boundary between adjacent letters: NEVER changes width/margin on hover! */
    .slice-slot {
      position: relative;
      width: 4px;
      height: clamp(38px, 4.6vw, 60px);
      margin: 0;
      flex: 0 0 4px;
      align-self: center;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Wide invisible hit-zone so clicking between letters is effortless without moving letters */
    .slice-slot::before {
      content: "";
      position: absolute;
      left: -12px;
      right: -12px;
      top: -16px;
      bottom: -16px;
      z-index: 25;
      cursor: pointer;
    }

    /* Visual laser / golden kitchen blade line inside the slot */
    .slice-blade {
      position: absolute;
      left: 50%;
      top: -14%;
      width: 5px;
      height: 128%;
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        rgba(255, 250, 210, 0) 0%,
        #ffffff 18%,
        #ffbe3b 50%,
        #ffffff 82%,
        rgba(255, 250, 210, 0) 100%
      );
      box-shadow:
        0 0 12px #ffae2b,
        0 0 24px rgba(255, 230, 128, 0.98);
      opacity: 0;
      transform: translateX(-50%) scaleY(0.5);
      transition: opacity 0.12s ease, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .slice-slot:hover .slice-blade {
      opacity: 1;
      transform: translateX(-50%) scaleY(1.08);
    }

    /* Subtle color highlight on the letter right after the blade without moving a single pixel */
    .slice-slot:hover + .char-cell {
      color: #ffe082;
      text-shadow:
        0 3px 0 #1f0e03,
        0 0 16px rgba(255, 224, 130, 0.75);
    }

    /* Minimalist Stylized Skip / Next Button (Zero words, carved brass & wood medallion) */
    #next-btn {
      position: fixed;
      bottom: clamp(18px, 2.6vh, 32px);
      right: clamp(18px, 2.2vw, 32px);
      z-index: 40;
      width: clamp(60px, 5.2vw, 76px);
      height: clamp(60px, 5.2vw, 76px);
      border-radius: 50%;
      border: 3px solid #f7d68a;
      background:
        radial-gradient(circle at 32% 28%, #ffe8a3 0%, #d89b3c 45%, #8c5614 85%, #5c3509 100%);
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.8),
        0 0 0 4px rgba(59, 34, 14, 0.9),
        inset 0 3px 6px rgba(255, 250, 220, 0.85),
        inset 0 -5px 10px rgba(71, 38, 6, 0.85);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease, box-shadow 0.28s ease;
    }

    #next-btn:hover {
      transform: scale(1.1) translateX(2px);
      filter: brightness(1.12);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.85),
        0 0 22px rgba(255, 206, 107, 0.65),
        0 0 0 4px rgba(92, 54, 22, 0.95),
        inset 0 3px 6px rgba(255, 250, 220, 0.9);
    }

    #next-btn:active {
      transform: scale(0.95);
    }

    #next-btn.ready-pulse {
      animation: pulseMedallion 1.3s infinite ease-in-out;
    }

    @keyframes pulseMedallion {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 10px 25px rgba(0, 0, 0, 0.8),
          0 0 18px rgba(255, 205, 90, 0.55),
          0 0 0 4px rgba(120, 74, 24, 0.95),
          inset 0 3px 6px rgba(255, 250, 220, 0.9);
      }
      50% {
        transform: scale(1.14);
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.9),
          0 0 36px rgba(255, 219, 112, 0.98),
          0 0 0 6px rgba(212, 148, 56, 0.85),
          inset 0 4px 8px rgba(255, 255, 240, 1);
      }
    }

    /* Scene transition fade */
    .scene-fade-enter {
      animation: sceneEnter 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes sceneEnter {
      0% {
        opacity: 0;
        transform: scale(0.97);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="app-stage">
    <!-- Interactive High-Detail SVG Illustration Stage -->
    <div id="scene-container">
      <svg id="scene-svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <!-- Carved Wooden Kitchen Cutting Board for Sentence Splitting -->
    <div id="board-dock">
      <div id="cutting-board">
        <div id="sentence-track"></div>
      </div>
    </div>

    <!-- Minimalist Carved Brass Skip/Next Medallion Button (No text) -->
    <button id="next-btn" aria-label="Next">
      <svg width="36" height="36" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="arrowWoodGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3d1e05"/>
            <stop offset="100%" stop-color="#1f0e02"/>
          </linearGradient>
        </defs>
        <path d="M11 12L25 24L11 36" stroke="url(#arrowWoodGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 12L38 24L24 36" stroke="url(#arrowWoodGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Atmospheric & Interactive Particle Effects Canvas -->
    <canvas id="fx-canvas"></canvas>
  </div>

  <script>
    /********************************************************************
     * 1. WEB AUDIO SYNTHESIZER (NO EXTERNAL FILES, RICH REALISTIC SFX)
     ********************************************************************/
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Soft wooden tick when hovering between letters
      playHoverTick() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.025);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.03);
      }

      // Crisp wooden knife chop + warm marimba harmonic chime on valid word split
      playValidSplit(stepIndex = 0) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // 1. Crisp wooden cutting board chop (filtered noise burst + woody thump)
        const bufferSize = this.ctx.sampleRate * 0.06;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
        }
        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100, now);
        filter.Q.setValueAtTime(2.5, now);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.35, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.055);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        whiteNoise.start(now);

        // 2. Woody resonance thump
        const woodOsc = this.ctx.createOscillator();
        const woodGain = this.ctx.createGain();
        woodOsc.type = 'sine';
        woodOsc.frequency.setValueAtTime(240, now);
        woodOsc.frequency.exponentialRampToValueAtTime(95, now + 0.08);
        woodGain.gain.setValueAtTime(0.28, now);
        woodGain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
        woodOsc.connect(woodGain);
        woodGain.connect(this.ctx.destination);
        woodOsc.start(now);
        woodOsc.stop(now + 0.09);

        // 3. Harmonic marimba chime ascending with split count
        const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66];
        const freq = scale[stepIndex % scale.length];
        const chimeOsc = this.ctx.createOscillator();
        const chimeGain = this.ctx.createGain();
        chimeOsc.type = 'sine';
        chimeOsc.frequency.setValueAtTime(freq, now + 0.02);
        chimeGain.gain.setValueAtTime(0.001, now);
        chimeGain.gain.linearRampToValueAtTime(0.22, now + 0.03);
        chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
        chimeOsc.connect(chimeGain);
        chimeGain.connect(this.ctx.destination);
        chimeOsc.start(now + 0.02);
        chimeOsc.stop(now + 0.45);
      }

      // Soft rubbery/wooden dull thud when clicking inside a word
      playInvalidSplit() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(155, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.07);
        osc.frequency.linearRampToValueAtTime(135, now + 0.14);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      // Warm celebratory chord arpeggio when all words in the sentence are separated
      playSentenceComplete() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc2.type = 'sine';
          const start = now + idx * 0.075;
          osc.frequency.setValueAtTime(freq, start);
          osc2.frequency.setValueAtTime(freq * 1.5, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.75);
          osc.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc2.start(start);
          osc.stop(start + 0.78);
          osc2.stop(start + 0.78);
        });
      }

      // Metallic pot lid rattle & steam puff (Scene 1)
      playPotRattle() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Metallic clatter hops
        [0, 0.08, 0.15, 0.21].forEach((offset, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(820 + i * 190, now + offset);
          osc.frequency.exponentialRampToValueAtTime(340, now + offset + 0.055);
          gain.gain.setValueAtTime(0.09, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.065);
        });
        // Steam hiss
        const bufferSize = this.ctx.sampleRate * 0.35;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.5));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2400, now);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      // Realistic Cat Purr / Trill (Scene 2)
      playCatPurr() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        const mainGain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(58, now);
        osc.frequency.linearRampToValueAtTime(68, now + 0.4);
        osc.frequency.linearRampToValueAtTime(52, now + 0.85);

        lfo.type = 'sine';
        lfo.frequency.setValueAtTime(26, now);
        lfoGain.gain.setValueAtTime(30, now);
        lfo.connect(osc.frequency);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(240, now);

        mainGain.gain.setValueAtTime(0.001, now);
        mainGain.gain.linearRampToValueAtTime(0.22, now + 0.12);
        mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.88);

        osc.connect(filter);
        filter.connect(mainGain);
        mainGain.connect(this.ctx.destination);

        osc.start(now);
        lfo.start(now);
        osc.stop(now + 0.9);
        lfo.stop(now + 0.9);
      }

      // Questioning "Mrr-meow?" pitch contour (Scene 6)
      playQuestionMeow() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        // Rising questioning contour
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.16);
        osc.frequency.exponentialRampToValueAtTime(460, now + 0.32);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.56);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(1600, now + 0.55);
        filter.Q.setValueAtTime(2.8, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.08);
        gain.gain.setValueAtTime(0.2, now + 0.45);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.62);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.64);
      }

        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Subtle hinge creak + magnetic seal pop
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(310, now + 0.18);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.35);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);

      // Happy Mouse Squeak (Scene 4 & 5 & 6)

        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [0, 0.13].forEach((offset, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const base = idx === 0 ? 1550 : 1780;
          osc.frequency.setValueAtTime(base, now + offset);
          osc.frequency.exponentialRampToValueAtTime(base * 1.38, now + offset + 0.06);
          osc.frequency.exponentialRampToValueAtTime(base * 0.92, now + offset + 0.11);
          gain.gain.setValueAtTime(0.001, now + offset);
          gain.gain.linearRampToValueAtTime(0.16, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.115);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.12);
        });

      // Crisp Cheese Bite Crunch (Scene 5)
      playCheeseCrunch() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.14;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const env = Math.sin((i / bufferSize) * Math.PI);
          output[i] = (Math.random() * 2 - 1) * env * (i % 120 < 60 ? 1 : 0.3);
        }
        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, now);
        filter.Q.setValueAtTime(1.8, now);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.32, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        whiteNoise.start(now);
      }

        this.init();

        const now = this.ctx.currentTime;

        osc.type = 'sine';

        osc.frequency.exponentialRampToValueAtTime(1360, now + 0.18);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      }

    /********************************************************************
     * 2. PARTICLE ENGINE (HTML5 CANVAS OVERLAY FOR REALISTIC FX)
     ********************************************************************/
    class ParticleSystem {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.particles = [];
        this.ambientParticles = [];
        this.sceneType = 0;
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initAmbient();
        this.animate();
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      setSceneType(sceneIndex) {
        this.sceneType = sceneIndex;
        this.initAmbient();
      }

      initAmbient() {
        this.ambientParticles = [];
        const count = 42;
        for (let i = 0; i < count; i++) {
          this.ambientParticles.push({
            x: Math.random() * this.canvas.width,
            y: Math.random() * this.canvas.height * 0.82,
            r: 1.2 + Math.random() * 2.8,
            vx: (Math.random() - 0.5) * 0.35,
            vy: -0.15 - Math.random() * 0.35,
            alpha: 0.15 + Math.random() * 0.45,
            phase: Math.random() * Math.PI * 2,
            coldMist: this.sceneType === 2 && Math.random() > 0.35
          });
        }
      }

      // Golden sparkles & wooden crumbs when splitting a word
      burstSplitSparks(x, y) {
        for (let i = 0; i < 28; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 7.5;
          const isGold = i % 3 !== 0;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2.2,
            gravity: 0.22,
            r: isGold ? 2.5 + Math.random() * 3.5 : 3 + Math.random() * 4,
            color: isGold ? '#ffe380' : '#d99b38',
            alpha: 1,
            decay: 0.02 + Math.random() * 0.02,
            type: isGold ? 'spark' : 'crumb'
          });
        }
      }

      // Small dust puff when clicking a wrong boundary inside a word
      burstWrongDust(x, y) {
        for (let i = 0; i < 10; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.8 + Math.random() * 2.4;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.5,
            gravity: 0.05,
            r: 3 + Math.random() * 4,
            color: '#c9a679',
            alpha: 0.65,
            decay: 0.035,
            type: 'steam'
          });
        }
      }

      // Warm steam puffs from the rattling copper pot (Scene 1)
      burstSteam(x, y) {
        for (let i = 0; i < 18; i++) {
          this.particles.push({
            x: x + (Math.random() - 0.5) * 40,
            y: y + (Math.random() - 0.5) * 10,
            vx: (Math.random() - 0.5) * 1.2,
            vy: -1.6 - Math.random() * 2.2,
            gravity: -0.02,
            r: 10 + Math.random() * 18,
            color: '#dce8f7',
            alpha: 0.45,
            decay: 0.012 + Math.random() * 0.008,
            type: 'steam'
          });
        }
      }

      // Cold mist billowing from open refrigerator door (Scene 3)
      burstColdMist(x, y) {
        for (let i = 0; i < 24; i++) {
          this.particles.push({
            x: x + (Math.random() - 0.5) * 50,
            y: y + (Math.random() - 0.5) * 80,
            vx: 1.2 + Math.random() * 2.8,
            vy: 0.5 + Math.random() * 1.4,
            gravity: 0.015,
            r: 16 + Math.random() * 26,
            color: '#d8f1ff',
            alpha: 0.36,
            decay: 0.01 + Math.random() * 0.008,
            type: 'steam'
          });
        }
      }

      // Flying Maasdam cheese crumbs on bite (Scene 5)
      burstCheeseCrumbs(x, y) {
        for (let i = 0; i < 22; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 6.5;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            gravity: 0.28,
            r: 3 + Math.random() * 5.5,
            color: i % 2 === 0 ? '#ffd24c' : '#f0a824',
            alpha: 1,
            decay: 0.018 + Math.random() * 0.015,
            type: 'crumb'
          });
        }
      }

      animate() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // 1. Draw Ambient Dust Motes / Cold Fridge Vapor
        for (let p of this.ambientParticles) {
          p.phase += 0.025;
          p.x += p.vx + Math.sin(p.phase) * 0.25;
          p.y += p.vy;
          if (p.y < -20) p.y = this.canvas.height * 0.82;
          if (p.x < -20) p.x = this.canvas.width + 10;
          if (p.x > this.canvas.width + 20) p.x = -10;

          ctx.save();
          if (p.coldMist) {
            const grad = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r * 5);
            grad.addColorStop(0, `rgba(210, 240, 255, ${p.alpha * 0.45})`);
            grad.addColorStop(1, 'rgba(210, 240, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = `rgba(255, 236, 179, ${p.alpha * (0.6 + 0.4 * Math.sin(p.phase))})`;
            ctx.shadowColor = '#ffe49e';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 2. Draw Active Interactive Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const pt = this.particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.vy += pt.gravity;
          pt.alpha -= pt.decay;

          if (pt.alpha <= 0) {
            this.particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, pt.alpha);
          if (pt.type === 'steam') {
            pt.r += 0.35;
            const g = ctx.createRadialGradient(pt.x, pt.y, 1, pt.x, pt.y, pt.r);
            g.addColorStop(0, pt.color);
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            ctx.fill();
          } else if (pt.type === 'spark') {
            ctx.fillStyle = pt.color;
            ctx.shadowColor = '#ffbb33';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.roundRect(pt.x - pt.r / 2, pt.y - pt.r / 2, pt.r, pt.r * 0.8, 2);
            ctx.fill();
          }
          ctx.restore();
        }

        requestAnimationFrame(() => this.animate());
      }
    }

    /********************************************************************
     * 4. DETAILED REALISTIC SVG SCENE RENDERER & INTERACTIVITY
     ********************************************************************/
    class SceneRenderer {
      constructor(svgEl, particleSys) {
        this.svg = svgEl;
        this.fx = particleSys;
        this.currentScene = 0;
        this.cheeseBites = [];
        this.fridgeOpenAmount = 1; // 1 = ajar, 2 = wide open
        this.catStepOffset = 0;
        this.yarnOffset = 0;
        this.lampBright = true;
        this.setupCursorTracking();
      }

      setupCursorTracking() {
        window.addEventListener('pointermove', (e) => {
          const pupils = this.svg.querySelectorAll('.track-pupil');
          if (!pupils.length) return;
          const nx = (e.clientX / window.innerWidth - 0.5) * 2;
          const ny = (e.clientY / window.innerHeight - 0.5) * 2;
          pupils.forEach((p) => {
            const maxX = parseFloat(p.getAttribute('data-max-x') || '5');
            const maxY = parseFloat(p.getAttribute('data-max-y') || '4');
            p.setAttribute('transform', `translate(${(nx * maxX).toFixed(2)}, ${(ny * maxY).toFixed(2)})`);
          });
        });
      }

      renderScene(sceneIndex) {
        this.currentScene = sceneIndex;
        this.cheeseBites = [];
        this.fridgeOpenAmount = 1;
        this.catStepOffset = 0;
        this.yarnOffset = 0;
        this.lampBright = true;
        this.fx.setSceneType(sceneIndex);

        this.svg.classList.remove('scene-fade-enter');
        void this.svg.offsetWidth;
        this.svg.classList.add('scene-fade-enter');

        switch (sceneIndex) {
          case 0:
            this.svg.innerHTML = this.buildScene1NocturnalKitchen();
            this.bindScene1Events();
            break;
          case 1:
            this.svg.innerHTML = this.buildScene2CuriousCat();
            this.bindScene2Events();
            break;
          case 2:
            this.svg.innerHTML = this.buildScene3AjarFridge();
            this.bindScene3Events();
            break;
          case 3:
            this.svg.innerHTML = this.buildScene4InsideFridgeMouse();
            this.bindScene4Events();
            break;
          case 4:
            this.svg.innerHTML = this.buildScene5CheeseCloseUp();
            this.bindScene5Events();
            break;
          case 5:
          default:
            this.svg.innerHTML = this.buildScene6CatAndMouseDialogue();
            this.bindScene6Events();
            break;
        }
      }

      bindScene1Events() {
        const potGroup = this.svg.querySelector('#s1-pot-group');
        if (potGroup) {
          potGroup.addEventListener('click', () => this.animatePotJump(true));
        }

        const jarGroup = this.svg.querySelector('#s1-jar-group');
        if (jarGroup) {
          jarGroup.addEventListener('click', () => this.animateHiddenEyesPeek());
        }

        const curtain = this.svg.querySelector('#s1-curtain');
        if (curtain) {
          curtain.addEventListener('click', () => {
            sfx.playGlassClink();
            curtain.animate(
              [
                { transform: 'skewX(0deg)' },
                { transform: 'skewX(-5deg) scaleX(1.04)' },
                { transform: 'skewX(4deg)' },
                { transform: 'skewX(0deg)' }
              ],
              { duration: 750, easing: 'ease-in-out' }
            );
          });
        }

        ['#s1-pan-1', '#s1-pan-2', '#s1-pan-3'].forEach((sel, idx) => {
          const pan = this.svg.querySelector(sel);
          if (pan) {
            pan.addEventListener('click', () => {
              sfx.playGlassClink();
              pan.animate(
                [
                  { transform: pan.getAttribute('transform') + ' rotate(0deg)' },
                  { transform: pan.getAttribute('transform') + ` rotate(${idx % 2 === 0 ? 14 : -14}deg)` },
                  { transform: pan.getAttribute('transform') + ` rotate(${idx % 2 === 0 ? -9 : 9}deg)` },
                  { transform: pan.getAttribute('transform') + ' rotate(0deg)' }
                ],
                { duration: 680, easing: 'ease-out' }
              );
            });
          }
        });
      }

      animatePotJump(big = false) {
        sfx.playPotRattle();
        const lid = this.svg.querySelector('#s1-pot-lid');
        if (lid) {
          lid.animate(
            [
              { transform: 'translate(0, 0) rotate(0deg)' },
              { transform: `translate(-4px, ${big ? -28 : -16}px) rotate(-8deg)` },
              { transform: `translate(5px, ${big ? -20 : -10}px) rotate(7deg)` },
              { transform: 'translate(-2px, -6px) rotate(-4deg)' },
              { transform: 'translate(0, 0) rotate(0deg)' }
            ],
            { duration: 540, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
          );
        }
        // Emit steam particles around the pot lid
        const rect = this.svg.getBoundingClientRect();
        this.fx.burstSteam(rect.left + rect.width * 0.52, rect.top + rect.height * 0.50);
      }

      animateHiddenEyesPeek() {
        sfx.playMouseSqueak();
        const eyes = this.svg.querySelector('#s1-hidden-eyes');
        if (eyes) {
          eyes.animate(
            [
              { transform: 'translate(120px, 62px) scale(1)' },
              { transform: 'translate(148px, 38px) scale(1.18)' },
              { transform: 'translate(138px, 46px) scale(1.12)' },
              { transform: 'translate(120px, 62px) scale(1)' }
            ],
            { duration: 750, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' }
          );
        }
      }

      constructor() {
        this.levelIndex = 0;
        this.infinitePoolCursor = 0;
        this.currentWords = [];
        this.splitState = []; // boolean array of length (words.length - 1)
        this.isCompleted = false;

        this.trackEl = document.getElementById('sentence-track');
        this.boardEl = document.getElementById('cutting-board');
        this.nextBtn = document.getElementById('next-btn');
        this.svgEl = document.getElementById('scene-svg');
        this.fxCanvas = document.getElementById('fx-canvas');

        this.fx = new ParticleSystem(this.fxCanvas);
        this.sceneRenderer = new SceneRenderer(this.svgEl, this.fx);

        this.nextBtn.addEventListener('click', () => {
          sfx.playHoverTick();
          this.advanceLevel();
        });

        this.loadLevel(0);
      }

      getLevelData(index) {
        // First 6 levels are the exact 6 story sentences requested
        if (index < CORE_STORY_LEVELS.length) {
          return CORE_STORY_LEVELS[index];
        }

        // After the 6 core sentences, seamlessly continue as an infinite generator
        const poolIdx = index - CORE_STORY_LEVELS.length;
        if (poolIdx < INFINITE_SENTENCE_POOL.length) {
          return INFINITE_SENTENCE_POOL[poolIdx];
        }

        // Procedurally generate fresh combinations forever
        const template = PROCEDURAL_TEMPLATES[poolIdx % PROCEDURAL_TEMPLATES.length];
        const generatedWords = [];
        template.parts.forEach((choices, cIdx) => {
          const pick = choices[(poolIdx + cIdx * 3) % choices.length];
          // Split multi-word phrase choices into individual target words
          pick.split(' ').forEach((w) => generatedWords.push(w));
        });

        return {
          sceneIndex: template.sceneIndex,
          words: generatedWords
        };
      }

      loadLevel(index) {
        this.levelIndex = index;
        this.isCompleted = false;
        this.nextBtn.classList.remove('ready-pulse');

        const data = this.getLevelData(index);
        this.currentWords = data.words.slice();
        // Initially all boundaries between words are false (glued together)
        this.splitState = new Array(Math.max(0, this.currentWords.length - 1)).fill(false);

        this.sceneRenderer.renderScene(data.sceneIndex);
        this.renderSentenceBlocks();
      }

      advanceLevel() {
        this.loadLevel(this.levelIndex + 1);
      }

      /**
       * Groups consecutive unsplit words into contiguous glued chunks
       * and renders each chunk with interactive letter-gap slice slots.
       */
      renderSentenceBlocks() {
        this.trackEl.innerHTML = '';

        // Adjust font scaling slightly only if the sentence has many characters
        const totalChars = this.currentWords.join('').length;
        if (totalChars > 36) {
          this.trackEl.classList.add('long-sentence');
        } else {
          this.trackEl.classList.remove('long-sentence');
        }

        // Build contiguous groups of words based on splitState
        const groups = [];
        let currentGroup = [0];
        for (let i = 0; i < this.splitState.length; i++) {
          if (this.splitState[i]) {
            groups.push(currentGroup);
            currentGroup = [i + 1];
          } else {
            currentGroup.push(i + 1);
          }
        }
        groups.push(currentGroup);

        const allDone = this.splitState.every(Boolean);

        groups.forEach((wordIndices, groupIdx) => {
          const chunkEl = document.createElement('div');
          chunkEl.className = 'word-chunk';

          if (wordIndices.length === 1) {
            chunkEl.classList.add('single-word-complete');
          }
          if (allDone) {
            chunkEl.classList.add('sentence-celebrate');
            chunkEl.style.animationDelay = `${groupIdx * 65}ms`;
          }

          // Build flat list of characters & boundary metadata inside this chunk
          const chars = [];
          wordIndices.forEach((wIdx, localPos) => {
            const wordStr = this.currentWords[wIdx];
            for (let c = 0; c < wordStr.length; c++) {
              const isLastCharOfWord = c === wordStr.length - 1;
              const isLastWordInChunk = localPos === wordIndices.length - 1;
              chars.push({
                char: wordStr[c],
                // If this is the last character of word `wIdx` AND there is another word glued after it,
                // then the gap immediately after this character is valid word boundary `wIdx`!
                validBoundaryIndex: (isLastCharOfWord && !isLastWordInChunk) ? wIdx : null
              });
            }
          });

          chars.forEach((item, charIdx) => {
            const charSpan = document.createElement('span');
            charSpan.className = 'char-cell';
            charSpan.textContent = item.char;
            chunkEl.appendChild(charSpan);

            // Add interactive slice slot between adjacent characters inside the chunk
            // (Skip if this chunk is already a single isolated word so completed words feel solid)
            if (charIdx < chars.length - 1 && wordIndices.length > 1) {
              const slot = document.createElement('div');
              slot.className = 'slice-slot';
              const blade = document.createElement('div');
              blade.className = 'slice-blade';
              slot.appendChild(blade);

              slot.addEventListener('pointerenter', () => {
                sfx.playHoverTick();
              });

              slot.addEventListener('click', (e) => {
                e.stopPropagation();
                this.handleSliceClick(item.validBoundaryIndex, e.clientX, e.clientY, chunkEl);
              });

              chunkEl.appendChild(slot);
            }
          });

          this.trackEl.appendChild(chunkEl);
        });
      }

      handleSliceClick(validBoundaryIndex, clientX, clientY, chunkEl) {
        if (this.isCompleted) return;

        if (validBoundaryIndex !== null && !this.splitState[validBoundaryIndex]) {
          // VALID WORD BOUNDARY SPLIT!
          this.splitState[validBoundaryIndex] = true;
          const completedCount = this.splitState.filter(Boolean).length;

          sfx.playValidSplit(completedCount - 1);
          this.fx.burstSplitSparks(clientX, clientY);

          this.renderSentenceBlocks();

          // Check if the entire sentence is now segmented into words
          if (this.splitState.every(Boolean)) {
            this.isCompleted = true;
            this.nextBtn.classList.add('ready-pulse');
            setTimeout(() => {
              sfx.playSentenceComplete();
              this.sceneRenderer.triggerClimaxReaction();
            }, 180);
          } else {
            this.sceneRenderer.triggerProgressReaction(completedCount, this.splitState.length);
          }
        } else {
          // INVALID BOUNDARY (CLICKED INSIDE A WORD)
          sfx.playInvalidSplit();
          this.fx.burstWrongDust(clientX, clientY);
          chunkEl.classList.remove('shake-wrong');
          void chunkEl.offsetWidth;
          chunkEl.classList.add('shake-wrong');
        }
      }
    }

    window.onload = function () {
      new WordSegmentationGame();
    };
  </script>
</body>
