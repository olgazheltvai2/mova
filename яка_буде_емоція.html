<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Емоційний інтелект</title>
  <style>
    /* ==========================================================================
       БАЗОВІ СТИЛІ ТА СКИДАННЯ (БЕЗ БІЛИХ ПРЯМОКУТНИКІВ ТА ЗАЙВИХ НАПИСІВ)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
      background: #1d2b1f;
    }

    /* Головний контейнер сцени */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* Живий сюжетний SVG-фон на весь екран */
    #scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Канвас для активних частинок емоцій (дощ, іскри, пелюстки, вітер) */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* ==========================================================================
       ВЕРХНЯ ПАНЕЛЬ: КНОПКИ НАВІГАЦІЇ, СИТУАЦІЯ ТА ПЕРЕМИКАЧ МОВИ
       ========================================================================== */
    #top-bar {
      position: relative;
      z-index: 10;
      width: min(96vw, 1280px);
      margin-top: 1.2vh;
      display: grid;
      grid-template-columns: 74px 1fr 74px 86px;
      align-items: center;
      gap: 12px;
    }

    /* Стилізована дерев'яно-бурштинова дошка для тексту ситуації */
    #situation-plaque {
      position: relative;
      min-height: 112px;
      padding: 18px 34px;
      border-radius: 38px;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 238, 185, 0.35), transparent 60%),
        repeating-linear-gradient(
          12deg,
          #6b3e1e 0px,
          #6b3e1e 14px,
          #794723 14px,
          #794723 28px,
          #5e3518 28px,
          #5e3518 42px
        );
      border: 5px solid #d99b43;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.45),
        inset 0 4px 10px rgba(255, 230, 160, 0.45),
        inset 0 -6px 14px rgba(35, 16, 4, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.4s ease;
    }

    /* Декоративна внутрішня рамочка з візерунком */
    #situation-plaque::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 30px;
      border: 2px dashed rgba(255, 222, 145, 0.45);
      pointer-events: none;
    }

    /* Крупний текст ситуації для дітей 6-8 років */
    #situation-text {
      color: #fff6dc;
      font-size: clamp(1.35rem, 2.35vw, 2.15rem);
      font-weight: 800;
      line-height: 1.28;
      letter-spacing: 0.01em;
      text-shadow: 0 3px 6px rgba(25, 10, 0, 0.85), 0 0 18px rgba(255, 196, 87, 0.25);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    /* Мінімалістичні круглі кнопки "Назад", "Далі" та кнопка мови */
    .wooden-btn {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #e5a94c;
      background:
        radial-gradient(circle at 30% 25%, #9c5d2c, #593112 75%);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.45),
        inset 0 3px 6px rgba(255, 232, 175, 0.5),
        inset 0 -5px 8px rgba(30, 12, 2, 0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }

    .wooden-btn:hover {
      transform: scale(1.09) translateY(-2px);
      filter: brightness(1.12);
    }

    .wooden-btn:active {
      transform: scale(0.94);
    }

    .wooden-btn svg {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6));
    }

    /* Кнопка перемикання мови (УКР / РУС) */
    #lang-btn {
      width: 84px;
      height: 72px;
      border-radius: 26px;
      color: #fff3cf;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      background:
        radial-gradient(circle at 30% 25%, #2f7a67, #164237 80%);
      border-color: #6ee2c1;
    }

    /* ==========================================================================
       ЦЕНТРАЛЬНА ЗОНА: КРУПНИЙ ПЛАН ОБЛИЧЧЯ ХЛОПЧИКА
       ========================================================================== */
    #portrait-wrapper {
      position: relative;
      z-index: 5;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    #boy-svg {
      width: min(86vw, 66vh);
      height: min(86vw, 66vh);
      max-height: 64vh;
      overflow: visible;
      cursor: pointer;
      filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.45));
    }

    /* ==========================================================================
       НИЖНЯ ПАНЕЛЬ: 5 КНОПОК ЕМОЦІЙ ЗІ СЛОВАМИ ТА ВІЗЕРУНКАМИ
       ========================================================================== */
    #emotions-bar {
      position: relative;
      z-index: 10;
      width: min(96vw, 1240px);
      margin-bottom: 1.8vh;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .emotion-btn {
      position: relative;
      height: 74px;
      border-radius: 28px;
      cursor: pointer;
      border: 4px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.42),
        inset 0 3px 8px rgba(255, 255, 255, 0.45),
        inset 0 -6px 12px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, filter 0.25s ease;
    }

    /* Візерунок всередині кожної кнопки (SVG-орнамент на фоні кнопки) */
    .emotion-btn .btn-pattern {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.26;
      pointer-events: none;
    }

    .emotion-btn .btn-label {
      position: relative;
      z-index: 2;
      color: #fffdf5;
      font-size: clamp(1.05rem, 1.75vw, 1.5rem);
      font-weight: 900;
      letter-spacing: 0.03em;
      text-shadow: 0 3px 5px rgba(0, 0, 0, 0.7);
    }

    .emotion-btn:hover {
      transform: translateY(-5px) scale(1.04);
      filter: brightness(1.1);
    }

    .emotion-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    /* Активна обрана емоція */
    .emotion-btn.active {
      transform: translateY(-7px) scale(1.06);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.55),
        0 0 24px var(--glow-color, #ffd54f),
        inset 0 4px 12px rgba(255, 255, 255, 0.75);
      border-color: #ffffff;
    }

    /* Індивідуальні кольорові теми кнопок емоцій */
    .emotion-btn[data-emotion="happy"] {
      --glow-color: #ffca28;
      background: linear-gradient(145deg, #f59e0b, #d97706 55%, #b45309);
      border-color: #fde68a;
    }

    .emotion-btn[data-emotion="sad"] {
      --glow-color: #38bdf8;
      background: linear-gradient(145deg, #2563eb, #1d4ed8 55%, #1e3a8a);
      border-color: #93c5fd;
    }

    .emotion-btn[data-emotion="angry"] {
      --glow-color: #ef4444;
      background: linear-gradient(145deg, #dc2626, #b91c1c 55%, #7f1d1d);
      border-color: #fca5a5;
    }

    .emotion-btn[data-emotion="surprised"] {
      --glow-color: #c084fc;
      background: linear-gradient(145deg, #9333ea, #7e22ce 55%, #581c87);
      border-color: #e9d5ff;
    }

    .emotion-btn[data-emotion="scared"] {
      --glow-color: #2dd4bf;
      background: linear-gradient(145deg, #0d9488, #115e59 55%, #134e4a);
      border-color: #99f6e4;
    }

    /* Адаптивність для менших екранів */
    @media (max-width: 820px) {
      #top-bar {
        grid-template-columns: 56px 1fr 56px 68px;
        gap: 8px;
      }
      .wooden-btn {
        width: 54px;
        height: 54px;
      }
      #lang-btn {
        width: 66px;
        height: 54px;
        font-size: 1.05rem;
      }
      #emotions-bar {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .emotion-btn {
        height: 54px;
      }
      .emotion-btn:last-child {
        grid-column: span 2;
      }
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- ========================================================================
       ЖИВИЙ СЮЖЕТНИЙ ФОН (СОНЯЧНА ГАЛЯВИНА В ПАРКУ, ДЕРЕВА, ПТАШКИ, ХМАРИ)
       ======================================================================== -->
  <svg id="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт неба, що динамічно змінює відтінок залежно від емоції -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyTop" offset="0%" stop-color="#4fa8e8" />
        <stop id="skyMid" offset="55%" stop-color="#8ed2f6" />
        <stop id="skyBot" offset="100%" stop-color="#fef3c7" />
      </linearGradient>

      <!-- Сяйво сонця -->
      <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#fffbeb" stop-opacity="1" />
        <stop offset="35%" stop-color="#fde047" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
      </radialGradient>

      <!-- Пагорби на задньому плані -->
      <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#68b66b" />
        <stop offset="100%" stop-color="#3a7d44" />
      </linearGradient>
      <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#80c954" />
        <stop offset="100%" stop-color="#2e6f30" />
      </linearGradient>

      <!-- Стовбури дерев -->
      <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4a2c18" />
        <stop offset="45%" stop-color="#6e4427" />
        <stop offset="100%" stop-color="#382010" />
      </linearGradient>

      <!-- Крона дерев -->
      <radialGradient id="foliageGrad1" cx="0.35" cy="0.3" r="0.7">
        <stop offset="0%" stop-color="#a3e635" />
        <stop offset="55%" stop-color="#4d9c2d" />
        <stop offset="100%" stop-color="#1e4d1b" />
      </radialGradient>

      <radialGradient id="foliageGrad2" cx="0.4" cy="0.3" r="0.7">
        <stop offset="0%" stop-color="#86efac" />
        <stop offset="60%" stop-color="#2e7d32" />
        <stop offset="100%" stop-color="#143d19" />
      </radialGradient>

      <!-- Розмиття для глибини різкості фону -->
      <filter id="bgSoftBlur" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="4" />
      </filter>
    </defs>

    <!-- Небо -->
    <rect width="1920" height="1080" fill="url(#skyGrad)" />

    <!-- Сонце та промені -->
    <g id="bg-sun" transform="translate(1580, 210)">
      <circle r="240" fill="url(#sunGlow)" />
      <circle r="68" fill="#fff9db" />
    </g>

    <!-- Живі пухнасті хмаринки -->
    <g id="bg-clouds" opacity="0.88" filter="url(#bgSoftBlur)">
      <g id="cloud-1" transform="translate(220, 170)">
        <path d="M0,40 Q-30,40 -35,15 Q-40,-15 -5,-20 Q15,-55 65,-40 Q110,-60 145,-20 Q185,-15 180,20 Q180,45 140,45 Z" fill="#ffffff" />
      </g>
      <g id="cloud-2" transform="translate(950, 120) scale(0.85)">
        <path d="M0,40 Q-30,40 -35,15 Q-40,-15 -5,-20 Q15,-55 65,-40 Q110,-60 145,-20 Q185,-15 180,20 Q180,45 140,45 Z" fill="#fff8eb" />
      </g>
      <g id="cloud-3" transform="translate(1420, 260) scale(0.7)">
        <path d="M0,40 Q-30,40 -35,15 Q-40,-15 -5,-20 Q15,-55 65,-40 Q110,-60 145,-20 Q185,-15 180,20 Q180,45 140,45 Z" fill="#ffffff" />
      </g>
    </g>

    <!-- Далекі мальовничі пагорби та стежка -->
    <g filter="url(#bgSoftBlur)">
      <path d="M-100,760 Q380,580 920,700 T1980,670 L1980,1080 L-100,1080 Z" fill="url(#hillFar)" />
      <path d="M-100,830 Q540,690 1180,790 T2020,760 L2020,1080 L-100,1080 Z" fill="url(#hillNear)" />
      <!-- Стежка в парку -->
      <path d="M840,740 Q960,840 760,1080 L1180,1080 Q1060,850 960,740 Z" fill="#d6a96c" opacity="0.65" />
    </g>

    <!-- Анімовані пташки в небі -->
    <g id="bg-birds" stroke="#2c4a3e" stroke-width="4" fill="none" stroke-linecap="round">
      <path id="bird-1" d="M300,280 Q315,265 330,280 Q345,265 360,280" />
      <path id="bird-2" d="M380,310 Q392,298 404,310 Q416,298 428,310" />
    </g>

    <!-- Ліве гіллясте дерево -->
    <g id="tree-left" filter="url(#bgSoftBlur)">
      <path d="M-40,1080 Q60,750 40,420 Q110,420 130,680 Q210,560 280,510 Q170,690 145,1080 Z" fill="url(#trunkGrad)" />
      <circle cx="80" cy="340" r="220" fill="url(#foliageGrad1)" />
      <circle cx="240" cy="430" r="165" fill="url(#foliageGrad2)" />
      <circle cx="-40" cy="490" r="170" fill="url(#foliageGrad2)" />
    </g>

    <!-- Праве гіллясте дерево -->
    <g id="tree-right" filter="url(#bgSoftBlur)">
      <path d="M1960,1080 Q1850,750 1870,400 Q1790,400 1770,660 Q1680,540 1620,490 Q1730,680 1760,1080 Z" fill="url(#trunkGrad)" />
      <circle cx="1840" cy="330" r="230" fill="url(#foliageGrad2)" />
      <circle cx="1670" cy="430" r="170" fill="url(#foliageGrad1)" />
      <circle cx="1960" cy="500" r="175" fill="url(#foliageGrad1)" />
    </g>

    <!-- Квіти та травичка на передньому плані (обрамлення) -->
    <g id="foreground-bushes" filter="url(#bgSoftBlur)">
      <circle cx="120" cy="1050" r="150" fill="url(#foliageGrad1)" />
      <circle cx="320" cy="1090" r="130" fill="url(#foliageGrad2)" />
      <circle cx="1800" cy="1050" r="160" fill="url(#foliageGrad2)" />
      <circle cx="1600" cy="1090" r="135" fill="url(#foliageGrad1)" />
    </g>

    <!-- Атмосферна вуаль настрою (змінює прозорість і колір під час емоцій) -->
    <rect id="mood-overlay" width="1920" height="1080" fill="#0f172a" opacity="0" />
  </svg>

  <!-- Канвас для інтерактивних погодних/емоційних ефектів -->
  <canvas id="fx-canvas"></canvas>

  <!-- ========================================================================
       ВЕРХНЯ ПАНЕЛЬ НАВІГАЦІЇ ТА СИТУАЦІЇ
       ======================================================================== -->
  <div id="top-bar">
    <!-- Кнопка "Назад" (попередній рівень) -->
    <button class="wooden-btn" id="prev-btn" aria-label="Попередня ситуація">
      <svg viewBox="0 0 48 48">
        <path d="M30 10 L14 24 L30 38" fill="none" stroke="#fff5d6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <!-- Дошка із ситуацією -->
    <div id="situation-plaque">
      <div id="situation-text"></div>
    </div>

    <!-- Кнопка "Далі" (наступний рівень без проходження) -->
    <button class="wooden-btn" id="next-btn" aria-label="Наступна ситуація">
      <svg viewBox="0 0 48 48">
        <path d="M18 10 L34 24 L18 38" fill="none" stroke="#fff5d6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <!-- Єдина кнопка перемикання мов (УКР / РУС) -->
    <button class="wooden-btn" id="lang-btn">УКР</button>
  </div>

  <!-- ========================================================================
       ЦЕНТРАЛЬНИЙ ПОРТРЕТ ХЛОПЧИКА КРУПНИМ ПЛАНОМ (МАКСИМАЛЬНИЙ РЕАЛІЗМ У SVG)
       ======================================================================== -->
  <div id="portrait-wrapper">
    <svg id="boy-svg" viewBox="0 0 700 760">
      <defs>
        <!-- Багатошарові реалістичні градієнти шкіри обличчя -->
        <radialGradient id="skinBase" cx="0.48" cy="0.38" r="0.58" fx="0.48" fy="0.32">
          <stop offset="0%" stop-color="#ffe4d0" />
          <stop offset="45%" stop-color="#f7c8a8" />
          <stop offset="82%" stop-color="#e3a47d" />
          <stop offset="100%" stop-color="#c47e56" />
        </radialGradient>

        <!-- Тінь під підборіддям на шиї -->
        <linearGradient id="neckGrad" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" stop-color="#b56e48" />
          <stop offset="32%" stop-color="#dfa079" />
          <stop offset="100%" stop-color="#c9855e" />
        </linearGradient>

        <!-- Рум'янець на щоках та кінчику носа -->
        <radialGradient id="cheekBlush" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#ef6b6b" stop-opacity="0.45" />
          <stop offset="60%" stop-color="#ef6b6b" stop-opacity="0.15" />
          <stop offset="100%" stop-color="#ef6b6b" stop-opacity="0" />
        </radialGradient>

        <!-- Червоний приплив для злості -->
        <radialGradient id="angryFlushGrad" cx="0.5" cy="0.4" r="0.6">
          <stop offset="0%" stop-color="#dc2626" stop-opacity="0.48" />
          <stop offset="70%" stop-color="#dc2626" stop-opacity="0.16" />
          <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
        </radialGradient>

        <!-- Холодна блідість для переляку -->
        <radialGradient id="scaredPallorGrad" cx="0.5" cy="0.4" r="0.6">
          <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.38" />
          <stop offset="100%" stop-color="#64748b" stop-opacity="0" />
        </radialGradient>

        <!-- Об'єм спинки носа -->
        <linearGradient id="noseBridgeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#cf875e" stop-opacity="0.55" />
          <stop offset="35%" stop-color="#fff0e5" stop-opacity="0.65" />
          <stop offset="65%" stop-color="#fff0e5" stop-opacity="0.65" />
          <stop offset="100%" stop-color="#c97f57" stop-opacity="0.6" />
        </linearGradient>

        <!-- Склера ока (білок із природним об'ємом) -->
        <radialGradient id="scleraGrad" cx="0.5" cy="0.45" r="0.55">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="72%" stop-color="#f1f5f9" />
          <stop offset="92%" stop-color="#cbd5e1" />
          <stop offset="100%" stop-color="#94a3b8" />
        </radialGradient>

        <!-- Деталізована райдужка ока (зелено-горіхова з глибиною) -->
        <radialGradient id="irisGrad" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stop-color="#4a2c11" />
          <stop offset="28%" stop-color="#855827" />
          <stop offset="58%" stop-color="#3f7a4d" />
          <stop offset="84%" stop-color="#285238" />
          <stop offset="100%" stop-color="#11261b" />
        </radialGradient>

        <!-- Губи -->
        <linearGradient id="upperLipGrad" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" stop-color="#c96b63" />
          <stop offset="100%" stop-color="#a64b44" />
        </linearGradient>
        <linearGradient id="lowerLipGrad" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" stop-color="#e3887f" />
          <stop offset="45%" stop-color="#eb9890" />
          <stop offset="100%" stop-color="#b85b52" />
        </linearGradient>

        <!-- Ротова порожнина та язик -->
        <linearGradient id="mouthCavityGrad" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" stop-color="#3b0d11" />
          <stop offset="100%" stop-color="#691920" />
        </linearGradient>

  /* ==========================================================================
     4. ПРОЦЕДУРНИЙ СИНТЕЗАТОР ЗВУКІВ (WEB AUDIO API — БЕЗ СЛІВ ТА ЗОВНІШНІХ ФАЙЛІВ)
        Кожна емоція має власний багатоголосний музично-звуковий фідбек.
     ========================================================================== */
  let audioCtx = null;

  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Звук перемикання кнопки "Далі / Назад / Мова" (м'який дерев'яний клік)
  function playWoodenClickSound(pitchMultiplier = 1) {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(320 * pitchMultiplier, now);
    osc.frequency.exponentialRampToValueAtTime(110 * pitchMultiplier, now + 0.08);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.09);
  }

  // Активні звукові фідбеки для кожної з 5 емоцій
  function playEmotionSound(emotion) {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    if (emotion === "happy") {
      // Сонячний мажорний перелив арфи та дзвіночків + грайливий смішок-глісандо
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        const t = now + idx * 0.075;
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.03, t + 0.25);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.2, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.46);
      });
    } else if (emotion === "sad") {
      // Прониклива низхідна мелодія віолончелі/скрипки з вібрато та звуком крапель
      const notes = [440, 392, 349.23, 329.63];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        const t = now + idx * 0.22;
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.linearRampToValueAtTime(freq * 0.96, t + 0.28);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.56);
      });
    } else if (emotion === "angry") {
      // Низький грозовий рокіт + різкий мідний акцент і шипіння пари
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      osc1.type = "sawtooth";
      osc2.type = "square";
      osc1.frequency.setValueAtTime(135, now);
      osc1.frequency.exponentialRampToValueAtTime(68, now + 0.55);
      osc2.frequency.setValueAtTime(142, now);
      osc2.frequency.exponentialRampToValueAtTime(65, now + 0.55);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(620, now);
      filter.frequency.exponentialRampToValueAtTime(160, now + 0.55);

      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.58);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.6);
      osc2.stop(now + 0.6);
    } else if (emotion === "surprised") {
      // Стрімке висхідне глісандо "Ого!" + мерехтливий зірковий акорд
      const slideOsc = ctx.createOscillator();
      const slideGain = ctx.createGain();
      slideOsc.type = "sine";
      slideOsc.frequency.setValueAtTime(280, now);
      slideOsc.frequency.exponentialRampToValueAtTime(920, now + 0.28);
      slideGain.gain.setValueAtTime(0.22, now);
      slideGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      slideOsc.connect(slideGain);
      slideGain.connect(ctx.destination);
      slideOsc.start(now);
      slideOsc.stop(now + 0.46);

      [880, 1108.73, 1318.5].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        const t = now + 0.2 + idx * 0.05;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.46);
      });
    } else if (emotion === "scared") {
      // Тремтяче вібрато + швидке подвійне серцебиття "тук-тук"
      const tremoOsc = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      const mainGain = ctx.createGain();

      tremoOsc.type = "sine";
      tremoOsc.frequency.setValueAtTime(540, now);
      tremoOsc.frequency.linearRampToValueAtTime(360, now + 0.65);

      lfo.frequency.setValueAtTime(24, now);
      lfoGain.gain.setValueAtTime(38, now);
      lfo.connect(lfoGain);
      lfoGain.connect(tremoOsc.frequency);

      mainGain.gain.setValueAtTime(0.18, now);
      mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.68);

      tremoOsc.connect(mainGain);
      mainGain.connect(ctx.destination);

      lfo.start(now);
      tremoOsc.start(now);
      lfo.stop(now + 0.7);
      tremoOsc.stop(now + 0.7);

      // Два удари серця
      [0.05, 0.24].forEach((offset) => {
        const beat = ctx.createOscillator();
        const beatGain = ctx.createGain();
        beat.type = "sine";
        beat.frequency.setValueAtTime(95, now + offset);
        beat.frequency.exponentialRampToValueAtTime(42, now + offset + 0.14);
        beatGain.gain.setValueAtTime(0.32, now + offset);
        beatGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.15);
        beat.connect(beatGain);
        beatGain.connect(ctx.destination);
        beat.start(now + offset);
        beat.stop(now + offset + 0.16);
      });
    }
  }

  /* ==========================================================================
     5. СИСТЕМА АКТИВНИХ ВІЗУАЛЬНИХ ЕФЕКТІВ ТА ЧАСТИНОК НА CANVAS
        Кожна емоція запускає унікальну живу стихію навколо персонажа.
     ========================================================================== */
  const fxCanvas = document.getElementById("fx-canvas");
  const fxCtx = fxCanvas.getContext("2d");
  let particles = [];

  function resizeCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // Створення сплеску частинок відповідно до обраної емоції
  function spawnEmotionParticles(emotion) {
    particles = [];
    const w = fxCanvas.width;
    const h = fxCanvas.height;
    const cx = w * 0.5;
    const cy = h * 0.48;

    if (emotion === "happy") {
      // Сонячні промені, пелюстки квітів та золоті іскорки радості
      for (let i = 0; i < 65; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 5.5;
        particles.push({
          type: "petal",
          x: cx + (Math.random() - 0.5) * 180,
          y: cy + (Math.random() - 0.5) * 180,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: 7 + Math.random() * 11,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.12,
          color: ["#fde047", "#f59e0b", "#fb7185", "#4ade80", "#fffbeb"][i % 5],
          alpha: 1
        });
      }
    } else if (emotion === "sad") {
      // Рясні срібні краплі дощу та кола на воді
      for (let i = 0; i < 85; i++) {
        particles.push({
          type: "rain",
          x: Math.random() * w,
          y: Math.random() * h - h,
          vx: -1.5,
          vy: 9 + Math.random() * 7,
          len: 18 + Math.random() * 18,
          alpha: 0.45 + Math.random() * 0.45
        });
      }
    } else if (emotion === "angry") {
      // Клуби гарячої пари з-за вух та вогняні іскри
      for (let i = 0; i < 55; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        particles.push({
          type: i < 24 ? "steam" : "spark",
          x: cx + side * (140 + Math.random() * 40),
          y: cy - 30 + (Math.random() - 0.5) * 60,
          vx: side * (2 + Math.random() * 4.5),
          vy: -2.5 - Math.random() * 4,
          size: i < 24 ? 18 + Math.random() * 24 : 5 + Math.random() * 6,
          color: i < 24 ? "rgba(255,235,230,0.65)" : ["#ef4444", "#f97316", "#fde047"][i % 3],
          alpha: 1
        });
      }
    } else if (emotion === "surprised") {
      // Яскраві чотирипроменеві зірочки та феєрверк подиву
      for (let i = 0; i < 55; i++) {
        const angle = (i / 55) * Math.PI * 2 + Math.random() * 0.2;
        const speed = 3 + Math.random() * 7;
        particles.push({
          type: "starburst",
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 8 + Math.random() * 12,
          rot: Math.random() * Math.PI,
          vRot: 0.08,
          color: ["#e879f9", "#38bdf8", "#fde047", "#c084fc"][i % 4],
          alpha: 1
        });
      }
    } else if (emotion === "scared") {
      // Холодні вихори вітру та тремтяче осіннє листя
      for (let i = 0; i < 50; i++) {
        particles.push({
          type: "windleaf",
          x: Math.random() * w,
          y: Math.random() * h,
          vx: 6 + Math.random() * 8,
          vy: (Math.random() - 0.5) * 3,
          size: 8 + Math.random() * 10,
          rot: Math.random() * Math.PI * 2,
          vRot: 0.18,
          color: ["#2dd4bf", "#94a3b8", "#38bdf8"][i % 3],
          alpha: 0.85
        });
      }
    }
  }

  /* ==========================================================================
     6. КЕРУВАННЯ СИТУАЦІЯМИ, КНОПКАМИ ЕМОЦІЙ ТА МОВОЮ

  function updateTexts() {
    // Оновлюємо текст поточної ситуації
    const item = SITUATIONS[currentSituationIndex];
    situationTextEl.style.opacity = "0";
    situationTextEl.style.transform = "translateY(6px)";

    setTimeout(() => {
      situationTextEl.textContent = item[currentLang];
      situationTextEl.style.opacity = "1";
      situationTextEl.style.transform = "translateY(0)";
    }, 120);

    // Оновлюємо підписи на кнопках емоцій
    document.querySelectorAll(".btn-label").forEach((span) => {
      const key = span.getAttribute("data-key");
      span.textContent = EMOTION_LABELS[currentLang][key];
    });

    // Оновлюємо напис на єдиній кнопці перемикання мов (УКР або РУС)
    langBtnEl.textContent = currentLang === "uk" ? "УКР" : "РУС";
  }

  // Встановлення емоції хлопчика (або повернення в нейтральний стан)
  function setEmotion(emotion) {
    currentEmotion = emotion;

    // Підсвічуємо активну кнопку емоції
    emotionBtns.forEach((btn) => {
      btn.classList.toggle("active", btn.getAttribute("data-emotion") === emotion);
    });

    if (emotion === "neutral") {
      particles = [];
    } else {
      playEmotionSound(emotion);
      spawnEmotionParticles(emotion);
    }
  }

  // Перехід на наступну чи попередню ситуацію (скидає обличчя в нейтральний стан)
  function changeSituation(delta) {
    playWoodenClickSound(delta > 0 ? 1.12 : 0.9);
    currentSituationIndex = (currentSituationIndex + delta + SITUATIONS.length) % SITUATIONS.length;
    setEmotion("neutral");
    updateTexts();

    // Легка пружна анімація дошки із завданням
    situationPlaqueEl.style.transform = "scale(0.97)";
    setTimeout(() => {
      situationPlaqueEl.style.transform = "scale(1)";
    }, 150);
  }

  prevBtnEl.addEventListener("click", () => changeSituation(-1));
  nextBtnEl.addEventListener("click", () => changeSituation(1));

  // Перемикач мови (УКР / РУС)
  langBtnEl.addEventListener("click", () => {
    playWoodenClickSound(1.25);
    currentLang = currentLang === "uk" ? "ru" : "uk";
    updateTexts();
  });

  // Обробка натискання на кнопки емоцій

    btn.addEventListener("click", () => {
      const chosen = btn.getAttribute("data-emotion");
      // Якщо повторно натиснути ту саму емоцію — повертаємось у проміжний нейтральний стан
      if (currentEmotion === chosen) {
        playWoodenClickSound(0.85);
        setEmotion("neutral");
      } else {
        setEmotion(chosen);
      }
    });
  });

  // Клік по самому обличчю хлопчика викликає приємне кліпання очима
  document.getElementById("boy-svg").addEventListener("click", () => {
    isBlinking = true;

  /* ==========================================================================
     7. ГОЛОВНИЙ ЦИКЛ АНІМАЦІЇ (60 FPS: ЖИВИЙ ПЕРСОНАЖ, ФОН ТА ЧАСТИНКИ)
     ========================================================================== */
  const cloud1 = document.getElementById("cloud-1");
  const cloud2 = document.getElementById("cloud-2");
  const cloud3 = document.getElementById("cloud-3");
  const bird1 = document.getElementById("bird-1");
  const bird2 = document.getElementById("bird-2");
  const treeLeft = document.getElementById("tree-left");
  const treeRight = document.getElementById("tree-right");

  function animate(now) {
    const t = now * 0.001;
    const target = FACE_PRESETS[currentEmotion];
    const smooth = 0.11; // Швидкість плавного морфінгу обличчя

    // 1. Інтерполяція всіх числових параметрів обличчя
    currentFace.headTilt = lerp(currentFace.headTilt, target.headTilt, smooth);
    currentFace.headY = lerp(currentFace.headY, target.headY, smooth);
    currentFace.headScale = lerp(currentFace.headScale, target.headScale, smooth);
    currentFace.eyeTopY = lerp(currentFace.eyeTopY, target.eyeTopY, smooth);
    currentFace.eyeBotY = lerp(currentFace.eyeBotY, target.eyeBotY, smooth);
    currentFace.pupilR = lerp(currentFace.pupilR, target.pupilR, smooth);
    currentFace.irisY = lerp(currentFace.irisY, target.irisY, smooth);
    currentFace.cheekScale = lerp(currentFace.cheekScale, target.cheekScale, smooth);
    currentFace.cheekOpacity = lerp(currentFace.cheekOpacity, target.cheekOpacity, smooth);
    currentFace.angryFlush = lerp(currentFace.angryFlush, target.angryFlush, smooth);
    currentFace.scaredPallor = lerp(currentFace.scaredPallor, target.scaredPallor, smooth);
    currentFace.nostrilScale = lerp(currentFace.nostrilScale, target.nostrilScale, smooth);
    currentFace.foreheadOpacity = lerp(currentFace.foreheadOpacity, target.foreheadOpacity, smooth);
    currentFace.glabellaOpacity = lerp(currentFace.glabellaOpacity, target.glabellaOpacity, smooth);
    currentFace.tearPoolOpacity = lerp(currentFace.tearPoolOpacity, target.tearPoolOpacity, smooth);
    currentFace.fallingTearsOpacity = lerp(currentFace.fallingTearsOpacity, target.fallingTearsOpacity, smooth);
    currentFace.sweatOpacity = lerp(currentFace.sweatOpacity, target.sweatOpacity, smooth);
    currentFace.nasolabialOpacity = lerp(currentFace.nasolabialOpacity, target.nasolabialOpacity, smooth);
    currentFace.upperLipArchY = lerp(currentFace.upperLipArchY, target.upperLipArchY, smooth);
    currentFace.upperLipInnerY = lerp(currentFace.upperLipInnerY, target.upperLipInnerY, smooth);
    currentFace.lowerLipInnerY = lerp(currentFace.lowerLipInnerY, target.lowerLipInnerY, smooth);
    currentFace.lowerLipBottomY = lerp(currentFace.lowerLipBottomY, target.lowerLipBottomY, smooth);
    currentFace.upperTeethY = lerp(currentFace.upperTeethY, target.upperTeethY, smooth);
    currentFace.lowerTeethY = lerp(currentFace.lowerTeethY, target.lowerTeethY, smooth);
    currentFace.tongueY = lerp(currentFace.tongueY, target.tongueY, smooth);
    currentFace.shiverAmount = lerp(currentFace.shiverAmount, target.shiverAmount, smooth);
    currentFace.moodOverlayOpacity = lerp(currentFace.moodOverlayOpacity, target.moodOverlayOpacity, 0.06);

    for (let i = 0; i < 6; i++) {
      currentFace.browL[i] = lerp(currentFace.browL[i], target.browL[i], smooth);
      currentFace.browR[i] = lerp(currentFace.browR[i], target.browR[i], smooth);
    }
    for (let i = 0; i < 2; i++) {
      currentFace.mouthLeft[i] = lerp(currentFace.mouthLeft[i], target.mouthLeft[i], smooth);
      currentFace.mouthRight[i] = lerp(currentFace.mouthRight[i], target.mouthRight[i], smooth);
    }

    // 2. Природне дихання, мікрорухи голови та тремтіння при страху/злості
    const breathY = Math.sin(t * 2.1) * 3.2;
    const idleTilt = Math.sin(t * 1.1) * 1.1;
    const shiverX = currentFace.shiverAmount > 0.05 ? Math.sin(now * 0.08) * currentFace.shiverAmount : 0;

    domFace.torso.setAttribute(
      "transform",
      `translate(0, ${breathY * 0.6}) scale(1, ${1 + Math.sin(t * 2.1) * 0.008})`
    );
    domFace.head.setAttribute(
      "transform",
      `translate(${350 + shiverX}, ${380 + currentFace.headY + breathY}) rotate(${currentFace.headTilt + idleTilt}) scale(${currentFace.headScale}) translate(-350, -380)`
    );

    // 3. Природне кліпання очима
    if (!isBlinking && now > nextBlinkTime) {
      isBlinking = true;
      blinkStart = now;
      nextBlinkTime = now + 2200 + Math.random() * 2800;
    }
    if (isBlinking) {
      const elapsed = (now - blinkStart) / 150;
      if (elapsed >= 1) {
        isBlinking = false;
        blinkFactor = 0;
      } else {
        blinkFactor = Math.sin(elapsed * Math.PI);
      }
    }

    // Обчислення розрізу очей з урахуванням кліпання
    const topY = lerp(currentFace.eyeTopY, 344, blinkFactor);
    const botY = lerp(currentFace.eyeBotY, 346, blinkFactor);

    const leftEyePath = `M 204 331 Q 250 ${topY} 296 331 Q 250 ${botY} 204 331 Z`;
    const rightEyePath = `M 404 331 Q 450 ${topY} 496 331 Q 450 ${botY} 404 331 Z`;
    domFace.leftEyeClip.setAttribute("d", leftEyePath);
    domFace.rightEyeClip.setAttribute("d", rightEyePath);

    domFace.leftUpperLash.setAttribute("d", `M 203 331 Q 250 ${topY} 296 331`);
    domFace.rightUpperLash.setAttribute("d", `M 404 331 Q 450 ${topY} 497 331`);
    domFace.leftLowerLash.setAttribute("d", `M 205 331 Q 250 ${botY} 295 331`);
    domFace.rightLowerLash.setAttribute("d", `M 405 331 Q 450 ${botY} 495 331`);
    domFace.leftCrease.setAttribute("d", `M 202 ${topY + 14} Q 250 ${topY - 14} 296 ${topY + 16}`);
    domFace.rightCrease.setAttribute("d", `M 404 ${topY + 16} Q 450 ${topY - 14} 498 ${topY + 14}`);

    // 4. Рух райдужки та зіниці
    lookCurrentX = lerp(lookCurrentX, lookTargetX, 0.08);
    lookCurrentY = lerp(lookCurrentY, lookTargetY, 0.08);
    const irisJitterX = currentFace.shiverAmount > 0.5 ? Math.cos(now * 0.1) * 1.4 : 0;

    domFace.leftIris.setAttribute(
      "transform",
      `translate(${250 + lookCurrentX + irisJitterX}, ${330 + lookCurrentY + currentFace.irisY})`
    );
    domFace.rightIris.setAttribute(
      "transform",
      `translate(${450 + lookCurrentX + irisJitterX}, ${330 + lookCurrentY + currentFace.irisY})`
    );
    domFace.leftPupil.setAttribute("r", currentFace.pupilR);
    domFace.rightPupil.setAttribute("r", currentFace.pupilR);

    // 5. Оновлення брів
    const bl = currentFace.browL;
    const br = currentFace.browR;
    domFace.browL.setAttribute("d", `M ${bl[0]} ${bl[1]} Q ${bl[2]} ${bl[3]} ${bl[4]} ${bl[5]}`);
    domFace.browR.setAttribute("d", `M ${br[0]} ${br[1]} Q ${br[2]} ${br[3]} ${br[4]} ${br[5]}`);

    // 6. Сльози, крапля поту, щоки та зморшки
    domFace.leftTearPool.setAttribute("opacity", currentFace.tearPoolOpacity);
    domFace.rightTearPool.setAttribute("opacity", currentFace.tearPoolOpacity);
    domFace.fallingTears.setAttribute("opacity", currentFace.fallingTearsOpacity);

    const tearSlide = (now * 0.06) % 75;
    domFace.tearDropLeft.setAttribute("transform", `translate(0, ${tearSlide})`);
    domFace.tearDropRight.setAttribute("transform", `translate(0, ${(tearSlide + 35) % 75})`);

    const sweatSlide = Math.sin(t * 3) * 4 + 6;
    domFace.sweatDrop.setAttribute("opacity", currentFace.sweatOpacity);
    domFace.sweatDrop.setAttribute("transform", `translate(495, ${242 + sweatSlide})`);

    domFace.cheekLeft.setAttribute("opacity", currentFace.cheekOpacity);
    domFace.cheekRight.setAttribute("opacity", currentFace.cheekOpacity);
    domFace.angryOverlay.setAttribute("opacity", currentFace.angryFlush);
    domFace.scaredOverlay.setAttribute("opacity", currentFace.scaredPallor);
    domFace.nostrils.setAttribute("transform", `translate(350, 426) scale(${currentFace.nostrilScale}, 1)`);
    domFace.foreheadLines.setAttribute("opacity", currentFace.foreheadOpacity);
    domFace.glabellaLeft.setAttribute("opacity", currentFace.glabellaOpacity);
    domFace.glabellaRight.setAttribute("opacity", currentFace.glabellaOpacity);
    domFace.nasolabial.setAttribute("opacity", currentFace.nasolabialOpacity);

    // 7. Плавне моделювання губ, ротової порожнини, зубів та язика
    const mlX = currentFace.mouthLeft[0];
    const mlY = currentFace.mouthLeft[1];
    const mrX = currentFace.mouthRight[0];
    const mrY = currentFace.mouthRight[1];
    const uArchY = currentFace.upperLipArchY;
    const uInnerY = currentFace.upperLipInnerY;
    const lInnerY = currentFace.lowerLipInnerY;
    const lBotY = currentFace.lowerLipBottomY;

    // Контур внутрішнього отвору рота
    const mouthClipD = `M ${mlX} ${mlY} Q 350 ${uInnerY} ${mrX} ${mrY} Q 350 ${lInnerY} ${mlX} ${mlY} Z`;
    domFace.mouthClip.setAttribute("d", mouthClipD);

    // Верхня губа з природним вигином Купідона
    const upperLipD = `M ${mlX} ${mlY} Q 322 ${uArchY} 350 ${uArchY + 4} Q 378 ${uArchY} ${mrX} ${mrY} Q 350 ${uInnerY} ${mlX} ${mlY} Z`;
    domFace.upperLip.setAttribute("d", upperLipD);

    // Нижня губа
    const lowerLipD = `M ${mlX} ${mlY} Q 350 ${lInnerY} ${mrX} ${mrY} Q 350 ${lBotY} ${mlX} ${mlY} Z`;
    domFace.lowerLip.setAttribute("d", lowerLipD);

    // Центральна лінія губ
    domFace.mouthCenterLine.setAttribute("d", `M ${mlX} ${mlY} Q 350 ${(uInnerY + lInnerY) * 0.5} ${mrX} ${mrY}`);

    // Зуби та язик
    domFace.upperTeeth.setAttribute(
      "d",
      `M 278 ${currentFace.upperTeethY - 22} L 422 ${currentFace.upperTeethY - 22} L 416 ${currentFace.upperTeethY + 12} Q 350 ${currentFace.upperTeethY + 16} 284 ${currentFace.upperTeethY + 12} Z`
    );
    domFace.lowerTeeth.setAttribute(
      "d",
      `M 284 ${currentFace.lowerTeethY} Q 350 ${currentFace.lowerTeethY - 5} 416 ${currentFace.lowerTeethY} L 420 ${currentFace.lowerTeethY + 28} L 280 ${currentFace.lowerTeethY + 28} Z`
    );
    domFace.tongue.setAttribute("cy", currentFace.tongueY);
    domFace.chinShadow.setAttribute("d", `M 315 ${lBotY + 10} Q 350 ${lBotY + 18} 385 ${lBotY + 10}`);

    // Носогубні складки рухаються за кутиками рота
    domFace.foldLeft.setAttribute("d", `M 304 428 Q ${mlX - 14} 465 ${mlX - 10} ${mlY + 6}`);
    domFace.foldRight.setAttribute("d", `M 396 428 Q ${mrX + 14} 465 ${mrX + 10} ${mrY + 6}`);

    // 8. Анімація живого фону (хмари, пташки, дерева, кольори неба)
    domFace.skyTop.setAttribute("stop-color", target.skyColors[0]);
    domFace.skyMid.setAttribute("stop-color", target.skyColors[1]);
    domFace.skyBot.setAttribute("stop-color", target.skyColors[2]);
    domFace.moodOverlay.setAttribute("opacity", currentFace.moodOverlayOpacity);

    cloud1.setAttribute("transform", `translate(${220 + Math.sin(t * 0.25) * 45}, 170)`);
    cloud2.setAttribute("transform", `translate(${950 + Math.cos(t * 0.2) * 55}, 120) scale(0.85)`);
    cloud3.setAttribute("transform", `translate(${1420 + Math.sin(t * 0.3) * 35}, 260) scale(0.7)`);

    const birdX = ((t * 55) % 2200) - 200;
    const wingY = Math.sin(t * 9) * 8;
    bird1.setAttribute("d", `M${birdX},${240 + wingY} Q${birdX + 15},${225 - wingY} ${birdX + 30},${240 + wingY} Q${birdX + 45},${225 - wingY} ${birdX + 60},${240 + wingY}`);
    bird2.setAttribute("d", `M${birdX + 70},${270 - wingY} Q${birdX + 82},${258 + wingY} ${birdX + 94},${270 - wingY} Q${birdX + 106},${258 + wingY} ${birdX + 118},${270 - wingY}`);

    const treeSway = Math.sin(t * 1.4) * 1.2;
    treeLeft.setAttribute("transform", `rotate(${treeSway} 100 1080)`);
    treeRight.setAttribute("transform", `rotate(${-treeSway} 1820 1080)`);

    // 9. Відмальовування емоційних частинок на Canvas
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      fxCtx.save();

      if (p.type === "petal") {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.rot += p.vRot;
        p.alpha -= 0.004;
        fxCtx.globalAlpha = Math.max(0, p.alpha);
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
        fxCtx.fill();
      } else if (p.type === "rain") {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y > fxCanvas.height) {
          p.y = -20;
          p.x = Math.random() * fxCanvas.width;
        }
        fxCtx.strokeStyle = `rgba(186, 230, 253, ${p.alpha})`;
        fxCtx.lineWidth = 2.2;
        fxCtx.beginPath();
        fxCtx.moveTo(p.x, p.y);
        fxCtx.lineTo(p.x + p.vx * 1.5, p.y + p.len);
        fxCtx.stroke();
      } else if (p.type === "steam" || p.type === "spark") {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.014;
        if (p.alpha <= 0 && currentEmotion === "angry") {
          const side = i % 2 === 0 ? -1 : 1;
          p.x = fxCanvas.width * 0.5 + side * (140 + Math.random() * 35);
          p.y = fxCanvas.height * 0.45;
          p.alpha = 1;
        }
        fxCtx.globalAlpha = Math.max(0, p.alpha);
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fxCtx.fill();
      } else if (p.type === "starburst") {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.rot += p.vRot;
        p.alpha -= 0.008;
        fxCtx.globalAlpha = Math.max(0, p.alpha);
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        for (let s = 0; s < 4; s++) {
          fxCtx.rotate(Math.PI / 2);
          fxCtx.moveTo(0, 0);
          fxCtx.quadraticCurveTo(p.size * 0.25, p.size * 0.25, 0, p.size);
          fxCtx.quadraticCurveTo(-p.size * 0.25, p.size * 0.25, 0, 0);
        }
        fxCtx.fill();
      } else if (p.type === "windleaf") {
        p.x += p.vx;
        p.y += p.vy + Math.sin(t * 6 + i) * 1.8;
        p.rot += p.vRot;
        if (p.x > fxCanvas.width + 30) {
          p.x = -30;
          p.y = Math.random() * fxCanvas.height;
        }
        fxCtx.globalAlpha = p.alpha;
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size, p.size * 0.4, 0, 0, Math.PI * 2);
        fxCtx.fill();
      }

      fxCtx.restore();
    }

    requestAnimationFrame(animate);
  }

  // Перший запуск гри
  updateTexts();
  requestAnimationFrame(animate);
</script>
</body>
</html>
