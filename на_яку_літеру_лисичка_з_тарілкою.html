<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Літери — Ботанічна веранда</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       RESET & BASE WIDESCREEN VIEWPORT
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2b4628;
      font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
    }

    #game-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       LIVING SCENIC BACKGROUND LAYER (SVG + AMBIENT CANVAS)
       ============================================================ */
    #scenery-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 25;
      pointer-events: none;
    }

    /* Animated swaying foliage in background SVG */
    .sway-slow {
      transform-origin: top center;
      animation: swaySlow 7.5s ease-in-out infinite;
    }
    .sway-med {
      transform-origin: top right;
      animation: swayMed 5.8s ease-in-out infinite;
    }
    .sway-branch-left {
      transform-origin: 0% 25%;
      animation: swayLeft 6.5s ease-in-out infinite;
    }
    .sway-branch-right {
      transform-origin: 100% 20%;
      animation: swayRight 7.2s ease-in-out infinite;
    }
    .cloud-drift-1 {
      animation: cloudDrift1 48s linear infinite;
    }
    .cloud-drift-2 {
      animation: cloudDrift2 64s linear infinite;
    }

    @keyframes swaySlow {
      0%, 100% { transform: rotate(-1.4deg); }
      50% { transform: rotate(1.8deg); }
    }
    @keyframes swayMed {
      0%, 100% { transform: rotate(1.5deg); }
      50% { transform: rotate(-2.1deg); }
    }
    @keyframes swayLeft {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(2.2deg); }
    }
    @keyframes swayRight {
      0%, 100% { transform: rotate(1.4deg); }
      50% { transform: rotate(-2deg); }
    }
    @keyframes cloudDrift1 {
      0% { transform: translateX(-180px); }
      100% { transform: translateX(1780px); }
    }
    @keyframes cloudDrift2 {
      0% { transform: translateX(-260px); }
      100% { transform: translateX(1820px); }
    }

    /* ============================================================
       MAIN INTERACTIVE STAGE (WIDESCREEN 16:9 BALANCED)
       ============================================================ */
    #stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      max-width: 1720px;
      display: grid;
      grid-template-columns: 1.18fr 0.92fr;
      align-items: center;
      padding: 2.5vh 3.5vw 3vh 2.5vw;
      gap: 2vw;
    }

    /* LEFT SIDE: CHARACTER + WOVEN TRAY + PRESENTED OBJECT */
    #presenter-zone {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #character-stage {
      position: relative;
      width: min(100%, 760px);
      height: min(92vh, 720px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #fox-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 24px rgba(34, 21, 9, 0.35));
    }

    /* Character idle & expressive animations */
    #fox-body-group {
      transform-origin: 360px 560px;
      animation: foxBreathe 3.8s ease-in-out infinite;
    }
    #fox-head-group {
      transform-origin: 360px 285px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #fox-ear-left {
      transform-origin: 292px 172px;
      animation: earTwitchL 6.4s ease-in-out infinite;
    }
    #fox-ear-right {
      transform-origin: 428px 172px;
      animation: earTwitchR 7.8s ease-in-out infinite;
    }
    #fox-tail {
      transform-origin: 455px 490px;
      animation: tailSway 4.2s ease-in-out infinite;
    }

    /* Eye blinking */
    .fox-eyelid {
      transform-origin: center 228px;
      transform: scaleY(0);
      animation: foxBlink 5.4s infinite;
    }

    @keyframes foxBreathe {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-4px) scaleY(1.012); }
    }
    @keyframes earTwitchL {
      0%, 84%, 100% { transform: rotate(0deg); }
      88% { transform: rotate(-8deg); }
      92% { transform: rotate(3deg); }
      96% { transform: rotate(-4deg); }
    }
    @keyframes earTwitchR {
      0%, 76%, 100% { transform: rotate(0deg); }
      80% { transform: rotate(9deg); }
      84% { transform: rotate(-2deg); }
    }
    @keyframes tailSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes foxBlink {
      0%, 93%, 97.5%, 100% { transform: scaleY(0); }
      95.2% { transform: scaleY(1); }
    }

    /* Fox joyful reactions */
    .fox-happy-hop #fox-whole {
      animation: foxHop 0.65s cubic-bezier(0.28, 0.84, 0.42, 1) 2;
    }
    .fox-happy-hop #fox-tail {
      animation: tailWagFast 0.22s ease-in-out infinite;
    }
    .fox-happy-clap #fox-whole {
      animation: foxSwayJoy 0.55s ease-in-out 2;
    }
    .fox-happy-clap #fox-ear-left {
      animation: earJoyL 0.3s ease-in-out 4;
    }
    .fox-happy-clap #fox-ear-right {
      animation: earJoyR 0.3s ease-in-out 4;
    }
    .fox-happy-wink #fox-head-group {
      transform: rotate(-7deg) translateY(-8px);
    }
    .fox-happy-wink #fox-tail {
      animation: tailWagFast 0.2s ease-in-out infinite;
    }

    /* Fox puzzled reaction on wrong choice */
    .fox-puzzled #fox-head-group {
      transform: rotate(11deg) translate(6px, 4px);
    }
    .fox-puzzled #fox-ear-right {
      animation: none;
      transform: rotate(18deg) translateY(6px);
      transition: transform 0.28s ease;
    }
    .fox-puzzled #fox-ear-left {
      animation: none;
      transform: rotate(-6deg);
      transition: transform 0.28s ease;
    }

    @keyframes foxHop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      25% { transform: translateY(6px) scale(1.03, 0.96); }
      55% { transform: translateY(-28px) scale(0.98, 1.03); }
      80% { transform: translateY(4px) scale(1.02, 0.98); }
    }
    @keyframes foxSwayJoy {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-4.5deg) translateY(-10px); }
      75% { transform: rotate(4.5deg) translateY(-10px); }
    }
    @keyframes tailWagFast {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes earJoyL {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-14deg); }
    }
    @keyframes earJoyR {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(14deg); }
    }

    /* Object container positioned right above the fox's woven botanical tray */
    #object-holder {
      position: absolute;
      left: 50%;
      bottom: 13.5%;
      transform: translateX(-50%);
      width: 44%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 12;
    }

    #object-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center 75%;
      filter: drop-shadow(0 14px 16px rgba(38, 22, 8, 0.38));
      transition: transform 0.35s ease, opacity 0.28s ease;
    }

    #object-stage svg {
      width: 96%;
      height: 96%;
      overflow: visible;
    }

    .obj-enter {
      animation: objPopIn 0.58s cubic-bezier(0.22, 1.32, 0.36, 1) forwards;
    }
    .obj-exit {
      animation: objPopOut 0.28s ease-in forwards;
    }
    .obj-celebrate {
      animation: objCelebrate 1.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes objPopIn {
      0% { opacity: 0; transform: translateY(36px) scale(0.55) rotate(-6deg); }
      65% { opacity: 1; transform: translateY(-10px) scale(1.06) rotate(2deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }
    @keyframes objPopOut {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(22px) scale(0.68); }
    }
    @keyframes objCelebrate {
      0% { transform: translateY(0) scale(1) rotate(0deg); filter: drop-shadow(0 14px 16px rgba(38, 22, 8, 0.38)); }
      28% { transform: translateY(-28px) scale(1.16) rotate(-6deg); filter: drop-shadow(0 24px 26px rgba(255, 214, 92, 0.72)); }
      58% { transform: translateY(-34px) scale(1.18) rotate(6deg); filter: drop-shadow(0 26px 32px rgba(255, 226, 118, 0.85)); }
      100% { transform: translateY(-12px) scale(1.06) rotate(0deg); filter: drop-shadow(0 18px 22px rgba(255, 214, 92, 0.5)); }
    }

    /* Animated teacup steam */
    .steam-wisp {
      animation: steamRise 2.6s ease-in-out infinite;
    }
    .steam-wisp-2 {
      animation: steamRise 2.6s ease-in-out 0.9s infinite;
    }
    @keyframes steamRise {
      0% { opacity: 0; transform: translateY(6px) scaleX(0.9); }
      45% { opacity: 0.75; transform: translateY(-6px) scaleX(1.1); }
      100% { opacity: 0; transform: translateY(-20px) scaleX(0.85); }
    }

    /* ============================================================
       RIGHT SIDE: 4 RICHLY TEXTURED COLORED LETTER PLAQUES
       ============================================================ */
    #letters-zone {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 1vw 6vh 0;
    }

    #letters-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(18px, 2.4vw, 34px);
      width: min(100%, 540px);
    }

    .letter-plaque {
      position: relative;
      aspect-ratio: 1 / 1;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      outline: none;
      border-radius: 34px;
      transform-origin: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
      filter: drop-shadow(0 14px 18px rgba(32, 19, 8, 0.38));
      touch-action: manipulation;
    }

    .letter-plaque:hover {
      transform: translateY(-6px) scale(1.045);
      filter: drop-shadow(0 20px 24px rgba(32, 19, 8, 0.45));
    }

    .letter-plaque:active {
      transform: translateY(3px) scale(0.95);
    }

    .letter-plaque svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .plaque-letter-text {
      font-family: 'Nunito', 'Trebuchet MS', sans-serif;
      font-weight: 900;
      font-size: 112px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* Plaque entrance animation */
    .plaque-pop {
      animation: plaqueEnter 0.48s cubic-bezier(0.22, 1.35, 0.36, 1) backwards;
    }
    .plaque-pop:nth-child(1) { animation-delay: 0.03s; }
    .plaque-pop:nth-child(2) { animation-delay: 0.09s; }
    .plaque-pop:nth-child(3) { animation-delay: 0.15s; }
    .plaque-pop:nth-child(4) { animation-delay: 0.21s; }

    @keyframes plaqueEnter {
      0% { opacity: 0; transform: scale(0.65) translateY(24px) rotate(-4deg); }
      100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
    }

    /* Plaque wrong wobble */
    .plaque-wrong {
      animation: plaqueWobble 0.56s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes plaqueWobble {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      16% { transform: translateX(-11px) rotate(-6deg); }
      34% { transform: translateX(10px) rotate(5.5deg); }
      52% { transform: translateX(-8px) rotate(-4deg); }
      70% { transform: translateX(6px) rotate(3deg); }
      86% { transform: translateX(-3px) rotate(-1.5deg); }
    }

    /* Plaque correct triumph */
    .plaque-correct {
      animation: plaqueWin 0.95s cubic-bezier(0.22, 1.4, 0.36, 1) forwards;
      z-index: 5;
    }
    @keyframes plaqueWin {
      0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 14px 18px rgba(32, 19, 8, 0.38)); }
      30% { transform: scale(1.18) rotate(-5deg); filter: drop-shadow(0 0 28px rgba(255, 224, 102, 0.95)); }
      60% { transform: scale(1.14) rotate(4deg); filter: drop-shadow(0 0 34px rgba(255, 232, 130, 1)); }
      100% { transform: scale(1.1) rotate(0deg); filter: drop-shadow(0 0 22px rgba(255, 218, 95, 0.8)); }
    }

    .plaque-dim {
      opacity: 0.52;
      transform: scale(0.93);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    /* ============================================================
       MINIMALIST STYLIZED UI CONTROLS (ONLY 2 BUTTONS)
       1. Language toggle ("укр" / "рус")
       2. Next icon button (arrow only, no text)
       ============================================================ */
    #lang-btn {
      position: fixed;
      top: clamp(14px, 2.4vh, 28px);
      right: clamp(16px, 2.4vw, 32px);
      z-index: 40;
      border: 3px solid #d7a64d;
      border-radius: 999px;
      padding: 10px 24px;
      min-width: 84px;
      background:
        radial-gradient(circle at 28% 22%, rgba(255, 232, 173, 0.25), transparent 55%),
        linear-gradient(155deg, #6e4526 0%, #4e2d16 55%, #3a1f0d 100%);
      color: #fdf1d0;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(18px, 1.6vw, 24px);
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow:
        0 8px 18px rgba(25, 14, 5, 0.42),
        inset 0 2px 3px rgba(255, 228, 165, 0.4),
        inset 0 -3px 6px rgba(28, 13, 4, 0.55);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      touch-action: manipulation;
    }

    #lang-btn:hover {
      transform: translateY(-2px) scale(1.06);
      filter: brightness(1.08);
    }

    #lang-btn:active {
      transform: translateY(2px) scale(0.95);
    }

    #next-btn {
      position: fixed;
      bottom: clamp(16px, 2.8vh, 32px);
      right: clamp(16px, 2.4vw, 32px);
      z-index: 40;
      width: clamp(64px, 5.4vw, 82px);
      height: clamp(64px, 5.4vw, 82px);
      border: 3.5px solid #e5b95c;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, rgba(164, 232, 148, 0.35), transparent 52%),
        linear-gradient(145deg, #2d7d4f 0%, #1d5b38 58%, #133f26 100%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 10px 22px rgba(17, 36, 20, 0.48),
        inset 0 3px 4px rgba(210, 255, 200, 0.35),
        inset 0 -4px 7px rgba(9, 32, 18, 0.6);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      touch-action: manipulation;
    }

    #next-btn:hover {
      transform: translateY(-3px) scale(1.08);
      filter: brightness(1.1);
    }

    #next-btn:active {
      transform: translateY(2px) scale(0.93);
    }

    #next-btn svg {
      width: 54%;
      height: 54%;
      filter: drop-shadow(0 2px 3px rgba(10, 30, 16, 0.45));
      transition: transform 0.2s ease;
    }

    #next-btn:hover svg {
      transform: translateX(3px);
    }

    /* ============================================================
       RESPONSIVE ADAPTATION (PORTRAIT TABLET / MOBILE)
       ============================================================ */
    @media (max-width: 900px) and (orientation: portrait) {
      #stage {
        grid-template-columns: 1fr;
        grid-template-rows: 1.05fr 0.95fr;
        padding: 5vh 4vw 10vh 4vw;
        gap: 1.5vh;
      }
      #character-stage {
        height: 100%;
        width: min(92vw, 480px);
      }
      #letters-zone {
        padding: 0;
      }
      #letters-grid {
        width: min(88vw, 390px);
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="game-viewport">
    <!-- ============================================================
         LAYER 1: LIVING SUNLIT BOTANICAL GARDEN & WOODEN VERANDA SVG
         ============================================================ -->
    <svg id="scenery-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <!-- Warm morning-afternoon sky gradient -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6cb7d6" />
          <stop offset="34%" stop-color="#9ad0dc" />
          <stop offset="68%" stop-color="#e9e1b8" />
          <stop offset="100%" stop-color="#f7d89c" />
        </linearGradient>

        <!-- Warm sunlit glow -->
        <radialGradient id="sunGlow" cx="22%" cy="18%" r="48%">
          <stop offset="0%" stop-color="#fff9d6" stop-opacity="0.95" />
          <stop offset="28%" stop-color="#ffe79e" stop-opacity="0.55" />
          <stop offset="65%" stop-color="#ffd578" stop-opacity="0.14" />
          <stop offset="100%" stop-color="#ffd578" stop-opacity="0" />
        </radialGradient>

        <!-- Distant hills & garden foliage gradients -->
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7fa973" />
          <stop offset="100%" stop-color="#5a8557" />
        </linearGradient>
        <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5d9451" />
          <stop offset="100%" stop-color="#3c6e3b" />
        </linearGradient>
        <linearGradient id="bushWarm" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6fa649" />
          <stop offset="55%" stop-color="#447b38" />
          <stop offset="100%" stop-color="#2c5928" />
        </linearGradient>
        <linearGradient id="bushDeep" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3b6f35" />
          <stop offset="100%" stop-color="#204422" />
        </linearGradient>

        <!-- Veranda timber gradients -->
        <linearGradient id="woodPost" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#5a3319" />
          <stop offset="25%" stop-color="#8b552c" />
          <stop offset="55%" stop-color="#a66939" />
          <stop offset="82%" stop-color="#744320" />
          <stop offset="100%" stop-color="#482610" />
        </linearGradient>
        <linearGradient id="woodBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9e6233" />
          <stop offset="35%" stop-color="#7a4620" />
          <stop offset="85%" stop-color="#542e14" />
          <stop offset="100%" stop-color="#3b1e0b" />
        </linearGradient>
        <linearGradient id="counterTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#cf9254" />
          <stop offset="16%" stop-color="#ba7c41" />
          <stop offset="52%" stop-color="#995f2c" />
          <stop offset="100%" stop-color="#73421c" />
        </linearGradient>
        <linearGradient id="counterFront" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6d3e1c" />
          <stop offset="22%" stop-color="#834d24" />
          <stop offset="80%" stop-color="#593114" />
          <stop offset="100%" stop-color="#3a1e0b" />
        </linearGradient>

        <!-- Subtle wood grain pattern -->
        <pattern id="woodGrainPat" width="180" height="40" patternUnits="userSpaceOnUse">
          <path d="M0 10 Q45 6 90 11 T180 9" fill="none" stroke="#47240d" stroke-width="1.3" opacity="0.22"/>
          <path d="M0 24 Q55 29 110 22 T180 26" fill="none" stroke="#f0be82" stroke-width="1" opacity="0.16"/>
          <path d="M0 34 Q40 31 95 36 T180 33" fill="none" stroke="#3a1c09" stroke-width="1.5" opacity="0.2"/>
        </pattern>

        <!-- Leaf gradients -->
        <linearGradient id="leafSun" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a9d45f" />
          <stop offset="55%" stop-color="#649e3a" />
          <stop offset="100%" stop-color="#366626" />
        </linearGradient>
        <linearGradient id="leafRich" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7ab849" />
          <stop offset="60%" stop-color="#40782f" />
          <stop offset="100%" stop-color="#224a1e" />
        </linearGradient>

        <!-- Soft sunlit cloud -->
        <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fffbf0" stop-opacity="0.92" />
          <stop offset="100%" stop-color="#f2dfb8" stop-opacity="0.6" />
        </linearGradient>

        <!-- Sunbeam gradient -->
        <linearGradient id="beamGrad" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#fff4bf" stop-opacity="0.34" />
          <stop offset="60%" stop-color="#ffe799" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#ffe799" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- Sky & Sun Glow -->

    const SoundEngine = (() => {
      let ctx = null;

      function ensureContext() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function playTone(freq, startOffset, duration, type = 'sine', peakGain = 0.22, freqEnd = null) {
        const c = ensureContext();
        if (!c) return;
        const now = c.currentTime + startOffset;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (freqEnd) {
          osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);
        }
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(peakGain, now + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + duration + 0.03);
      }

      // 4 distinct joyful sounds cycled/randomized on correct answers
      const successSounds = [
        // 1. Warm Marimba Major Arpeggio
        () => {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
            playTone(f, i * 0.075, 0.34, 'triangle', 0.24);
            playTone(f * 2, i * 0.075, 0.14, 'sine', 0.07);
          });
        },
        // 2. Sparkling Harp Glissando
        () => {
          [440, 554.37, 659.25, 880, 1108.73, 1318.5].forEach((f, i) => {
            playTone(f, i * 0.055, 0.42, 'sine', 0.18);
          });
        },
        // 3. Bright Wooden Xylophone Chime
        () => {
          [587.33, 739.99, 880, 1174.66].forEach((f, i) => {
            playTone(f, i * 0.08, 0.26, 'sine', 0.22);
            playTone(f * 3, i * 0.08, 0.08, 'triangle', 0.06);
          });
        },
        // 4. Playful Melodic Flute Chirp
        () => {
          playTone(523.25, 0, 0.14, 'sine', 0.18, 659.25);
          playTone(659.25, 0.13, 0.16, 'sine', 0.2, 880);
          playTone(880, 0.28, 0.32, 'triangle', 0.22, 1046.5);
        }
      ];

      // 3 gentle, soft humorous sounds on wrong answers (never harsh)
      const wrongSounds = [
        // 1. Soft rubbery boing
        () => {
          playTone(260, 0, 0.22, 'sine', 0.19, 165);
          playTone(175, 0.12, 0.18, 'triangle', 0.12, 215);
        },
        // 2. Gentle hollow wood knock
        () => {
          playTone(320, 0, 0.09, 'triangle', 0.2, 210);
          playTone(235, 0.09, 0.11, 'triangle', 0.16, 175);
        },
        // 3. Muted playful kalimba plunk
        () => {
          playTone(349.23, 0, 0.16, 'sine', 0.16, 293.66);
        }
      ];

      let lastSuccess = -1;
      let lastWrong = -1;

      return {
        playSuccess() {
          let idx;
          do { idx = Math.floor(Math.random() * successSounds.length); } while (idx === lastSuccess);
          lastSuccess = idx;
          successSounds[idx]();
        },
        playWrong() {
          let idx;
          do { idx = Math.floor(Math.random() * wrongSounds.length); } while (idx === lastWrong);
          lastWrong = idx;
          wrongSounds[idx]();
        },
        playClick() {
          playTone(620, 0, 0.06, 'sine', 0.11, 760);
        }
      };
    })();

        border: '#e5be67', innerBorder: '#a8e6b8',
        letterFill: '#fdf6dc', letterShadow: '#0b331d',
        pattern: `<path d="M18 48 Q100 36 182 48 M18 152 Q100 164 182 152" fill="none" stroke="#9be3b0" stroke-width="2.5" opacity="0.22"/>
                  <path d="M22 86 Q100 76 178 86 M22 118 Q100 128 178 118" fill="none" stroke="#0d3820" stroke-width="2" opacity="0.22"/>
                  <circle cx="32" cy="32" r="5" fill="#e8c36b" opacity="0.7"/>
                  <circle cx="168" cy="32" r="5" fill="#e8c36b" opacity="0.7"/>
                  <circle cx="32" cy="168" r="5" fill="#e8c36b" opacity="0.7"/>
                  <circle cx="168" cy="168" r="5" fill="#e8c36b" opacity="0.7"/>`
      },
      {
        id: 'cobalt',
        bg1: '#3c84d6', bg2: '#2359a8', bg3: '#133670',
        border: '#f0c76e', innerBorder: '#9ec9ff',
        letterFill: '#fff5d9', letterShadow: '#0c234d',
        pattern: `<rect x="20" y="20" width="160" height="160" rx="26" fill="none" stroke="#b5d8ff" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.34"/>
                  <circle cx="100" cy="100" r="70" fill="none" stroke="#99c7ff" stroke-width="2" opacity="0.2"/>`
      },
      {
        id: 'amber',
        bg1: '#e69d30', bg2: '#bf7217', bg3: '#80450a',
        border: '#fae08c', innerBorder: '#ffe299',
        letterFill: '#fff9e6', letterShadow: '#542a04',
        pattern: `<rect x="18" y="18" width="164" height="164" rx="28" fill="none" stroke="#ffe5a3" stroke-width="3" stroke-dasharray="8 7" opacity="0.45"/>
                  <path d="M30 30 L50 50 M170 30 L150 50 M30 170 L50 150 M170 170 L150 150" stroke="#ffe5a3" stroke-width="3" stroke-linecap="round" opacity="0.35"/>`
      }
    ];

    /* =========================================================================
       5. CANVAS ENGINES:
          A) AMBIENT LIVING GARDEN (GOLDEN POLLEN + FLUTTERING BUTTERFLIES)
          B) CELEBRATION FX (5 VARIED MODES: BUBBLES, LEAVES, FIREFLIES, PETALS, NOTES)
       ========================================================================= */
    const ambientCanvas = document.getElementById('ambient-canvas');
    const ambCtx = ambientCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');

    let cw = window.innerWidth;
    let ch = window.innerHeight;

    function resizeCanvases() {
      cw = window.innerWidth;
      ch = window.innerHeight;
      ambientCanvas.width = cw;
      ambientCanvas.height = ch;
      fxCanvas.width = cw;
      fxCanvas.height = ch;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    // Ambient golden pollen motes
    const pollen = Array.from({ length: 34 }, () => ({
      x: Math.random() * cw,
      y: Math.random() * ch,
      r: 1.5 + Math.random() * 2.8,
      vx: 0.15 + Math.random() * 0.35,
      vy: -0.1 - Math.random() * 0.25,
      phase: Math.random() * Math.PI * 2,
      alpha: 0.25 + Math.random() * 0.5
    }));

    // Subtle fluttering garden butterflies
    const butterflies = [
      { x: cw * 0.18, y: ch * 0.28, vx: 0.65, vy: 0.15, phase: 0, color: '#ffd166', accent: '#e07a38', scale: 0.9 },
      { x: cw * 0.78, y: ch * 0.22, vx: -0.55, vy: 0.12, phase: 2.4, color: '#9ed9e8', accent: '#4285a8', scale: 0.78 }
    ];

    // Celebratory active particles
    let fxParticles = [];
    let lastFxMode = -1;

    function triggerCelebrationFX(originX, originY) {
      let mode;
      do { mode = Math.floor(Math.random() * 5); } while (mode === lastFxMode);
      lastFxMode = mode;

      const count = 34;
      const palette = ['#ffd166', '#ef6c57', '#6bd48c', '#6ec5e9', '#f7a072', '#f9dc5c'];

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
        const speed = 2.6 + Math.random() * 6.8;
        fxParticles.push({
          mode, // 0: bubbles, 1: golden leaves, 2: fireflies/sparkles, 3: petals, 4: music notes
          x: originX + (Math.random() - 0.5) * 80,
          y: originY + (Math.random() - 0.5) * 60,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (2.2 + Math.random() * 2.5),
          size: 8 + Math.random() * 14,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.14,
          color: palette[Math.floor(Math.random() * palette.length)],
          life: 1,
          decay: 0.01 + Math.random() * 0.008,
          wobble: Math.random() * Math.PI * 2
        });
      }
    }

    function drawAmbient(t) {
      ambCtx.clearRect(0, 0, cw, ch);

      // Draw drifting golden pollen motes
      for (const p of pollen) {
        p.x += p.vx + Math.sin(t * 0.001 + p.phase) * 0.25;
        p.y += p.vy;
        if (p.x > cw + 20) p.x = -20;
        if (p.y < -20) { p.y = ch + 20; p.x = Math.random() * cw; }

        const glow = p.alpha * (0.65 + 0.35 * Math.sin(t * 0.0025 + p.phase));
        ambCtx.beginPath();
        ambCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ambCtx.fillStyle = `rgba(255, 244, 184, ${glow})`;
        ambCtx.fill();
      }

      // Draw fluttering butterflies
      for (const b of butterflies) {
        b.phase += 0.16;
        b.x += b.vx;
        b.y += Math.sin(t * 0.002 + b.phase * 0.15) * 0.65;
        if (b.x > cw + 60) { b.x = -60; b.y = ch * (0.15 + Math.random() * 0.32); }
        if (b.x < -60) { b.x = cw + 60; b.y = ch * (0.15 + Math.random() * 0.32); }

        const flap = Math.abs(Math.sin(b.phase));
        ambCtx.save();
        ambCtx.translate(b.x, b.y);
        ambCtx.scale(b.vx < 0 ? -b.scale : b.scale, b.scale);

        // Upper & lower wings
        ambCtx.fillStyle = b.color;
        ambCtx.beginPath();
        ambCtx.ellipse(-5, -5 * flap, 11, 7 * flap + 2, -0.35, 0, Math.PI * 2);
        ambCtx.ellipse(-4, 4 * flap, 8, 5 * flap + 1.5, 0.35, 0, Math.PI * 2);
        ambCtx.fill();

        ambCtx.fillStyle = b.accent;
        ambCtx.beginPath();
        ambCtx.ellipse(4, -4 * flap, 9, 6 * flap + 2, 0.35, 0, Math.PI * 2);
        ambCtx.fill();

        // Body
        ambCtx.strokeStyle = '#3d2414';
        ambCtx.lineWidth = 2;
        ambCtx.beginPath();
        ambCtx.moveTo(-4, 0);
        ambCtx.lineTo(6, 0);
        ambCtx.stroke();
        ambCtx.restore();
      }
    }

    function drawFX() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      if (fxParticles.length === 0) return;

      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        p.life -= p.decay;
        if (p.life <= 0) {
          fxParticles.splice(i, 1);
          continue;
        }
        p.wobble += 0.1;
        p.x += p.vx + Math.sin(p.wobble) * 0.7;
        p.y += p.vy;
        p.rot += p.vRot;

        if (p.mode === 0) {
          // Iridescent soap bubbles float upward
          p.vy *= 0.96;
          p.vy -= 0.08;
        } else if (p.mode === 2) {
          // Sparkling fireflies drift gently
          p.vx *= 0.96;
          p.vy *= 0.96;
        } else {
          // Leaves, petals, notes float with gentle gravity
          p.vx *= 0.985;
          p.vy += 0.11;
        }

        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.25));
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);

        if (p.mode === 0) {
          // Soap bubble
          const r = p.size * 0.75;
          fxCtx.beginPath();
          fxCtx.arc(0, 0, r, 0, Math.PI * 2);
          fxCtx.fillStyle = 'rgba(180, 238, 255, 0.26)';
          fxCtx.fill();
          fxCtx.lineWidth = 2;
          fxCtx.strokeStyle = p.color;
          fxCtx.stroke();
          fxCtx.beginPath();
          fxCtx.arc(-r * 0.34, -r * 0.34, r * 0.25, 0, Math.PI * 2);
          fxCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          fxCtx.fill();
        } else if (p.mode === 1) {
          // Fluttering golden/green leaf
          fxCtx.fillStyle = p.color;
          fxCtx.beginPath();
          fxCtx.ellipse(0, 0, p.size * 0.8, p.size * 0.42, 0, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.strokeStyle = 'rgba(255, 250, 220, 0.6)';
          fxCtx.lineWidth = 1.5;
          fxCtx.beginPath();
          fxCtx.moveTo(-p.size * 0.7, 0);
          fxCtx.lineTo(p.size * 0.7, 0);
          fxCtx.stroke();
        } else if (p.mode === 2) {
          // Glowing starlight firefly
          const s = p.size * 0.7;
          fxCtx.fillStyle = '#fff5b8';
          fxCtx.beginPath();
          for (let k = 0; k < 4; k++) {
            const a = (k * Math.PI) / 2;
            fxCtx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
            fxCtx.lineTo(Math.cos(a + Math.PI / 4) * (s * 0.3), Math.sin(a + Math.PI / 4) * (s * 0.3));
          }
          fxCtx.closePath();
          fxCtx.fill();
        } else if (p.mode === 3) {
          // Colorful blossom petal
          fxCtx.fillStyle = p.color;
          fxCtx.beginPath();
          fxCtx.moveTo(0, -p.size * 0.65);
          fxCtx.bezierCurveTo(p.size * 0.7, -p.size * 0.4, p.size * 0.6, p.size * 0.5, 0, p.size * 0.65);
          fxCtx.bezierCurveTo(-p.size * 0.6, p.size * 0.5, -p.size * 0.7, -p.size * 0.4, 0, -p.size * 0.65);
          fxCtx.fill();
        } else {
          // Golden musical note
          fxCtx.fillStyle = p.color;
          fxCtx.strokeStyle = p.color;
          fxCtx.lineWidth = 2.6;
          fxCtx.beginPath();
          fxCtx.ellipse(-3, 5, 5.5, 4, -0.35, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.beginPath();
          fxCtx.moveTo(2, 4);
          fxCtx.lineTo(2, -11);
          fxCtx.lineTo(10, -8);
          fxCtx.stroke();
        }

        fxCtx.restore();
      }
    }

    function animationLoop(t) {
      drawAmbient(t);
      drawFX();
      requestAnimationFrame(animationLoop);
    }

    /* =========================================================================
       6. GAME STATE, SMART ENDLESS SHUFFLE BAG & CHARACTER EXPRESSIONS
       ========================================================================= */
    let currentLang = 'uk'; // 'uk' -> "укр", 'ru' -> "рус"
    let bag = [];
    let currentObject = null;
    let isLocked = false;
    let nextTimer = null;
    let reactionTimer = null;
    let lastHappyAnim = -1;

    const objectStage = document.getElementById('object-stage');
    const lettersGrid = document.getElementById('letters-grid');
    const foxSvg = document.getElementById('fox-svg');
    const langBtn = document.getElementById('lang-btn');
    const nextBtn = document.getElementById('next-btn');

    const foxEyesOpen = document.getElementById('fox-eyes-open');
    const foxEyesHappy = document.getElementById('fox-eyes-happy');
    const foxMouthNormal = document.getElementById('fox-mouth-normal');
    const foxMouthHappy = document.getElementById('fox-mouth-happy');
    const foxMouthPuzzled = document.getElementById('fox-mouth-puzzled');

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pullNextObject() {
      if (bag.length === 0) {
        bag = shuffle(OBJECTS);
        // Prevent immediate repeat across reshuffle boundary
        if (currentObject && bag[bag.length - 1].id === currentObject.id) {
          const swapIdx = Math.floor(Math.random() * (bag.length - 1));
          [bag[bag.length - 1], bag[swapIdx]] = [bag[swapIdx], bag[bag.length - 1]];
        }
      }
      return bag.pop();
    }

    function resetFoxExpression() {
      foxSvg.classList.remove('fox-happy-hop', 'fox-happy-clap', 'fox-happy-wink', 'fox-puzzled');
      foxEyesOpen.style.opacity = '1';
      foxEyesHappy.style.opacity = '0';
      foxMouthNormal.style.opacity = '1';
      foxMouthHappy.style.opacity = '0';
      foxMouthPuzzled.style.opacity = '0';
    }

    function setFoxHappy() {
      resetFoxExpression();
      const anims = ['fox-happy-hop', 'fox-happy-clap', 'fox-happy-wink'];
      let idx;
      do { idx = Math.floor(Math.random() * anims.length); } while (idx === lastHappyAnim);
      lastHappyAnim = idx;

      foxSvg.classList.add(anims[idx]);
      foxEyesOpen.style.opacity = '0';
      foxEyesHappy.style.opacity = '1';
      foxMouthNormal.style.opacity = '0';
      foxMouthHappy.style.opacity = '1';
    }

    function setFoxPuzzled() {
      clearTimeout(reactionTimer);
      resetFoxExpression();
      foxSvg.classList.add('fox-puzzled');
      foxMouthNormal.style.opacity = '0';
      foxMouthPuzzled.style.opacity = '1';
      reactionTimer = setTimeout(resetFoxExpression, 750);
    }

    function buildLetterOptions(correctLetter) {
      const pool = ALPHABETS[currentLang].filter(ch => ch !== correctLetter);
      const distractors = shuffle(pool).slice(0, 3);
      return shuffle([correctLetter, ...distractors]);
    }

    function renderLetters(animateEntrance = true) {
      const correctLetter = currentObject[currentLang];
      const options = buildLetterOptions(correctLetter);
      const themes = shuffle(PLAQUE_THEMES);

      lettersGrid.innerHTML = '';

      options.forEach((letter, idx) => {
        const theme = themes[idx];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = animateEntrance ? 'letter-plaque plaque-pop' : 'letter-plaque';
        btn.dataset.letter = letter;

        const gradId = `plqGrad_${theme.id}_${idx}`;
        const sheenId = `plqSheen_${theme.id}_${idx}`;

        btn.innerHTML = `
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="${gradId}" cx="32%" cy="24%" r="78%">
                <stop offset="0%" stop-color="${theme.bg1}" />
                <stop offset="56%" stop-color="${theme.bg2}" />
                <stop offset="100%" stop-color="${theme.bg3}" />
              </radialGradient>
              <linearGradient id="${sheenId}" x1="0" y1="0" x2="0.4" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34" />
                <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06" />
                <stop offset="100%" stop-color="#000000" stop-opacity="0.16" />
              </linearGradient>
            </defs>
            <!-- Stylized outer wooden/metallic frame -->
            <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#${gradId})" stroke="${theme.border}" stroke-width="6.5" />
            <!-- Decorative surface pattern -->
            ${theme.pattern}
            <!-- Subtle inner bevel -->
            <rect x="14" y="14" width="172" height="172" rx="30" fill="none" stroke="${theme.innerBorder}" stroke-width="2" opacity="0.35" />
            <!-- Glossy glaze sheen -->
            <rect x="9" y="9" width="182" height="182" rx="33" fill="url(#${sheenId})" />
            <!-- Carved shadow & bold friendly rounded letter -->
            <text x="100" y="108" class="plaque-letter-text" fill="${theme.letterShadow}" opacity="0.65">${letter}</text>
            <text x="100" y="102" class="plaque-letter-text" fill="${theme.letterFill}">${letter}</text>
          </svg>
        `;

        btn.addEventListener('click', (e) => handleLetterClick(btn, letter, e));
        lettersGrid.appendChild(btn);
      });
    }

    function handleLetterClick(btn, letter, event) {
      if (isLocked) return;
      const correctLetter = currentObject[currentLang];

      if (letter === correctLetter) {
        isLocked = true;
        clearTimeout(reactionTimer);
        SoundEngine.playSuccess();
        setFoxHappy();

        // Highlight winning plaque, soften others
        document.querySelectorAll('.letter-plaque').forEach(el => {
          if (el === btn) {
            el.classList.remove('plaque-pop', 'plaque-wrong');
            el.classList.add('plaque-correct');
          } else {
            el.classList.add('plaque-dim');
          }
        });

        // Object celebrates
        objectStage.classList.remove('obj-enter');
        objectStage.classList.add('obj-celebrate');

        // Particle bursts from both clicked letter and presented object!
        const btnRect = btn.getBoundingClientRect();
        const objRect = objectStage.getBoundingClientRect();
        triggerCelebrationFX(btnRect.left + btnRect.width / 2, btnRect.top + btnRect.height / 2);
        triggerCelebrationFX(objRect.left + objRect.width / 2, objRect.top + objRect.height / 2);

        nextTimer = setTimeout(() => {
          loadNextRound();
        }, 1450);
      } else {
        SoundEngine.playWrong();
        setFoxPuzzled();

        btn.classList.remove('plaque-wrong');
        void btn.offsetWidth; // trigger reflow for replayable wobble
        btn.classList.add('plaque-wrong');
      }
    }

    function loadNextRound(immediate = false) {
      clearTimeout(nextTimer);
      clearTimeout(reactionTimer);
      isLocked = false;
      resetFoxExpression();

      const proceed = () => {
        currentObject = pullNextObject();
        objectStage.className = '';
        objectStage.innerHTML = currentObject.svg;
        void objectStage.offsetWidth;
        objectStage.classList.add('obj-enter');
        renderLetters(true);
      };

      if (immediate || !currentObject) {
        proceed();
      } else {
        objectStage.classList.remove('obj-enter', 'obj-celebrate');
        objectStage.classList.add('obj-exit');
        setTimeout(proceed, 240);
      }
    }

    /* =========================================================================
       7. MINIMALIST CONTROLS: LANGUAGE TOGGLE ("укр" / "рус") & NEXT BUTTON
       ========================================================================= */
    langBtn.addEventListener('click', () => {
      SoundEngine.playClick();
      currentLang = currentLang === 'uk' ? 'ru' : 'uk';
      langBtn.textContent = currentLang === 'uk' ? 'укр' : 'рус';
      document.documentElement.lang = currentLang;

      // Immediately update the 4 letters for the current object without interrupting flow
      if (!isLocked && currentObject) {
        renderLetters(false);
      }
    });

    nextBtn.addEventListener('click', () => {
      SoundEngine.playClick();
      loadNextRound(true);
    });

    /* =========================================================================
       8. START GAME ON WINDOW LOAD
       ========================================================================= */
    window.onload = function () {
      resizeCanvases();
      loadNextRound(true);
      requestAnimationFrame(animationLoop);
    };
  </script>
</body>
</html>
