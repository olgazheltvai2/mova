<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Складовий Лабіринт</title>
  <style>
    /* =========================================================
       ОСНОВНІ СТИЛІ ТА НАЛАШТУВАННЯ СЦЕНИ (ЖОДНИХ БІЛИХ ФОНІВ)
       ========================================================= */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
      background: #1d4d2b;
    }

    /* Контейнер гри на весь екран */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Живий сюжетний SVG-фон */
    #scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
    }

    /* Анімації для живого фону */
    @keyframes floatCloud {
      0% { transform: translateX(-80px); }
      50% { transform: translateX(80px); }
      100% { transform: translateX(-80px); }
    }
    @keyframes swayTree {
      0%, 100% { transform: rotate(-1.6deg); }
      50% { transform: rotate(1.6deg); }
    }
    @keyframes waterShimmer {
      0%, 100% { transform: translateX(-12px) scaleY(1); opacity: 0.55; }
      50% { transform: translateX(12px) scaleY(1.08); opacity: 0.85; }
    }
    @keyframes butterflyFlight {
      0% { transform: translate(0, 0) rotate(5deg) scale(0.9); }
      25% { transform: translate(60px, -35px) rotate(-12deg) scale(1.05); }
      50% { transform: translate(120px, 10px) rotate(8deg) scale(0.95); }
      75% { transform: translate(55px, 40px) rotate(-8deg) scale(1.02); }
      100% { transform: translate(0, 0) rotate(5deg) scale(0.9); }
    }

    .cloud-anim { animation: floatCloud 26s ease-in-out infinite; }
    .cloud-anim-slow { animation: floatCloud 38s ease-in-out infinite reverse; }
    .tree-sway { transform-origin: bottom center; animation: swayTree 5.5s ease-in-out infinite; }
    .tree-sway-2 { transform-origin: bottom center; animation: swayTree 6.8s ease-in-out infinite reverse; }
    .water-wave { animation: waterShimmer 4s ease-in-out infinite; }
    .butterfly { animation: butterflyFlight 14s ease-in-out infinite; }

    /* =========================================================
       ВЕРХНЯ ПАНЕЛЬ НАВІГАЦІЇ ТА ВВЕДЕННЯ ЛІТЕРИ
       ========================================================= */
    #top-controls {
      position: absolute;
      top: 14px;
      left: 18px;
      right: 18px;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .nav-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    /* Стилізовані дерев'яно-бурштинові кнопки навігації */
    .wood-btn {
      width: 58px;
      height: 58px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      filter: drop-shadow(0 6px 8px rgba(15, 38, 12, 0.55));
    }

    .wood-btn:hover {
      transform: scale(1.1) translateY(-2px);
      filter: drop-shadow(0 8px 12px rgba(255, 215, 80, 0.55));
    }

    .wood-btn:active {
      transform: scale(0.93);
    }

    /* Віконце ручного введення літери (стилізований дерев'яний медальйон) */
    .letter-input-wrap {
      pointer-events: auto;
      position: relative;
      width: 92px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 6px 10px rgba(15, 38, 12, 0.6));
      transition: transform 0.2s;
    }

    .letter-input-wrap:focus-within {
      transform: scale(1.08);
      filter: drop-shadow(0 0 14px rgba(255, 220, 90, 0.9));
    }

    .letter-input-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #custom-letter-input {
      position: relative;
      z-index: 2;
      width: 54px;
      height: 42px;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff3c4;
      text-shadow: 0 2px 4px #3e1f07, 0 0 8px #ffae00;
      text-transform: uppercase;
      caret-color: #ffe066;
      cursor: pointer;
    }

    #custom-letter-input::placeholder {
      color: rgba(255, 240, 190, 0.55);
    }

    /* =========================================================
       ОСНОВНИЙ ІГРОВИЙ ПРОСТІР (ПЕРСОНАЖ + ЛАБІРИНТ + ФІНІШ)
       ========================================================= */
    #play-area {
      position: relative;
      z-index: 10;
      width: min(96vw, 1280px);
      height: min(88vh, 760px);
      display: grid;
      grid-template-columns: 270px 1fr 185px;
      align-items: center;
      gap: 14px;
      padding: 10px;
    }

    /* Ліва зона: стартова галявина персонажа та замовлення літери */
    #character-zone {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Хмаринка-замовлення з потрібною літерою */
    #order-bubble {
      position: relative;
      width: 165px;
      height: 135px;
      margin-bottom: -10px;
      z-index: 15;
      transform-origin: bottom center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 10px 14px rgba(20, 40, 10, 0.45));
    }

    #order-letter-text {
      font-size: 58px;
      font-weight: 900;
      fill: #542100;
      paint-order: stroke fill;
      stroke: #fff2b2;
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    /* Контейнер живого персонажа на старті */
    #hero-home-slot {
      position: relative;
      width: 235px;
      height: 265px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Сам персонаж (може стояти на старті або крокувати по клітинках) */
    #active-character {
      position: fixed;
      width: 210px;
      height: 230px;
      z-index: 25;
      pointer-events: none;
      transition:
        left 0.48s cubic-bezier(0.34, 1.45, 0.64, 1),
        top 0.48s cubic-bezier(0.34, 1.45, 0.64, 1),
         width 0.45s ease,
        height 0.45s ease,
        transform 0.3s ease;
      filter: drop-shadow(0 12px 14px rgba(14, 35, 11, 0.55));
    }

    /* Анімації станів персонажа */
    @keyframes heroBreathe {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-6px) scale(1.02, 0.98); }
    }
    @keyframes heroHop {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-28px) scale(1.08, 0.94) rotate(-4deg); }
      75% { transform: translateY(-6px) scale(0.96, 1.05) rotate(4deg); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes heroShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-12px) rotate(-6deg); }
      40% { transform: translateX(12px) rotate(6deg); }
      60% { transform: translateX(-9px) rotate(-4deg); }
      80% { transform: translateX(9px) rotate(4deg); }
    }
    @keyframes heroCelebrate {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      25% { transform: translateY(-34px) scale(1.12) rotate(-8deg); }
      50% { transform: translateY(0) scale(0.95, 1.06) rotate(0deg); }
      75% { transform: translateY(-30px) scale(1.12) rotate(8deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(12deg); }
    }
    @keyframes earTwitch {
      0%, 86%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-9deg); }
      95% { transform: rotate(6deg); }
    }

    .char-idle svg { animation: heroBreathe 2.6s ease-in-out infinite; }
    .char-hop svg { animation: heroHop 0.52s ease-out; }
    .char-wrong svg { animation: heroShake 0.48s ease-in-out; }
    .char-win svg { animation: heroCelebrate 0.95s ease-in-out infinite; }

    .blink-group {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 4.2s infinite;
    }
    .tail-group {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: tailWag 2.1s ease-in-out infinite;
    }
    .ear-group {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: earTwitch 3.8s ease-in-out infinite;
    }

    /* =========================================================
       ЦЕНТРАЛЬНА ДОШКА-ЛАБІРИНТ (КАМ'ЯНО-ДЕРЕВ'ЯНА ГАЛЯВИНА)
       ========================================================= */
    #maze-wrapper {
      position: relative;
      width: 100%;
      height: min(82vh, 660px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Декоративна різьблена основа лабіринту */
    #maze-frame-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: drop-shadow(0 16px 24px rgba(10, 28, 8, 0.65));
    }

    /* Сітка клітинок зі складами */
    #maze-grid {
      position: relative;
      z-index: 5;
      width: 88%;
      height: 83%;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 10px;
      padding: 8px;
    }

    /* SVG-шар для малювання золотої/смарагдової доріжки між пройденими клітинками */
    #path-connector-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    /* Клітинка лабіринту */
    .maze-cell {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s;
      filter: drop-shadow(0 6px 6px rgba(22, 14, 5, 0.45));
    }

    .maze-cell:hover {
      transform: translateY(-4px) scale(1.05);
      filter: drop-shadow(0 10px 12px rgba(255, 215, 70, 0.45));
      z-index: 8;
    }

    .maze-cell:active {
      transform: scale(0.94);
    }

    .cell-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* ЗБІЛЬШЕНИЙ СКЛАД — заповнює клітинку */
    .syllable-label {
      font-size: 48px;
      font-weight: 900;
      fill: #fff8dc;
      paint-order: stroke fill;
      stroke: #4a2506;
      stroke-width: 6px;
      stroke-linejoin: round;
      pointer-events: none;
      letter-spacing: 0;
    }

    /* Активна пройдена клітинка доріжки */
    .maze-cell.stepped {
      transform: scale(1.04);
      filter: drop-shadow(0 0 14px rgba(255, 230, 80, 0.85));
    }

    .maze-cell.stepped .syllable-label {
      fill: #234700;
      stroke: #fff7b8;
    }

    /* Підказка стартової або наступної доступної клітинки */
    @keyframes gentlePulse {
      0%, 100% { filter: drop-shadow(0 6px 6px rgba(22, 14, 5, 0.45)); }
      50% { filter: drop-shadow(0 0 15px rgba(255, 230, 110, 0.9)); }
    }

    .maze-cell.start-hint {
      animation: gentlePulse 2s ease-in-out infinite;
    }

    /* Помилкове натискання */
    @keyframes wrongWobble {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-4deg); }
      75% { transform: translateX(8px) rotate(4deg); }
    }

    .maze-cell.wrong-hit {
      animation: wrongWobble 0.36s ease-in-out;
    }

    /* =========================================================
       ПРАВА ЗОНА: ФІНІШНИЙ БУДИНОЧОК / КОШИК ЗІ СКАРБАМИ
       ========================================================= */
    #goal-zone {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #goal-target {
      position: relative;
      width: 175px;
      height: 210px;
      transition: transform 0.35s ease;
      filter: drop-shadow(0 12px 14px rgba(12, 32, 8, 0.55));
    }

    /* Шар салюту з листочків, зірочок та ягідок */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 40;
    }

    /* Адаптивність для менших екранів */
    @media (max-width: 1024px) {
      #play-area {
        grid-template-columns: 200px 1fr 140px;
        gap: 8px;
      }
      #active-character {
        width: 165px;
        height: 185px;
      }
      #order-bubble {
        width: 135px;
        height: 110px;
      }
      .syllable-label {
        font-size: 40px;
        stroke-width: 5px;
      }
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- =========================================================
       ЖИВИЙ СЮЖЕТНИЙ ФОН: СОНЯЧНА ЛІСОВА ГАЛЯВИНА БІЛЯ СТРУМКА
       ========================================================= -->
  <svg id="scene-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт теплого ранкового неба -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5ec8f8" />
        <stop offset="48%" stop-color="#a8ecff" />
        <stop offset="100%" stop-color="#fef4b8" />
      </linearGradient>

      <!-- Сонячне сяйво -->
      <radialGradient id="sunGlow" cx="0.82" cy="0.16" r="0.35">
        <stop offset="0%" stop-color="#fff9c4" stop-opacity="1" />
        <stop offset="35%" stop-color="#ffe566" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#ffe566" stop-opacity="0" />
      </radialGradient>

      <!-- Далекі пагорби -->
      <linearGradient id="farHillGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#69b86c" />
        <stop offset="100%" stop-color="#3c8248" />
      </linearGradient>

      <!-- Середні пагорби -->
      <linearGradient id="midHillGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#52a847" />
        <stop offset="100%" stop-color="#2b6c2c" />
      </linearGradient>

      <!-- Ближня галявина -->
      <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#63bd45" />
        <stop offset="45%" stop-color="#3f9431" />
        <stop offset="100%" stop-color="#22571d" />
      </linearGradient>

      <!-- Лісовий струмок -->
      <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#47d3ff" />
        <stop offset="50%" stop-color="#1ca3de" />
        <stop offset="100%" stop-color="#0d699e" />
      </linearGradient>

      <!-- Крона дерева -->
      <radialGradient id="canopyGrad1" cx="0.35" cy="0.3" r="0.7">
        <stop offset="0%" stop-color="#8be053" />
        <stop offset="55%" stop-color="#459c2b" />
        <stop offset="100%" stop-color="#205915" />
      </radialGradient>

      <radialGradient id="canopyGrad2" cx="0.4" cy="0.3" r="0.7">
        <stop offset="0%" stop-color="#a5e856" />
        <stop offset="60%" stop-color="#57ad2d" />
        <stop offset="100%" stop-color="#286617" />
      </radialGradient>

      <!-- Стовбур дерева -->
      <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#8a5229" />
        <stop offset="50%" stop-color="#633716" />
        <stop offset="100%" stop-color="#3d1f09" />
      </linearGradient>
    </defs>

    <!-- Небо та сонце -->
    <rect width="1600" height="900" fill="url(#skyGrad)" />
    <circle cx="1310" cy="145" r="310" fill="url(#sunGlow)" />
    <circle cx="1310" cy="145" r="68" fill="#fff7b2" />

    <!-- Хмаринки -->
    <g class="cloud-anim" opacity="0.88">
      <path d="M210,140 Q235,95 285,108 Q325,75 375,105 Q420,100 435,140 Q465,155 445,185 L195,185 Q175,160 210,140 Z" fill="#fffef2" />
      <path d="M920,95 Q945,60 990,72 Q1025,45 1068,72 Q1105,70 1115,102 L905,102 Z" fill="#fffce8" />
    </g>
    <g class="cloud-anim-slow" opacity="0.72">
      <path d="M560,185 Q585,148 630,158 Q665,132 705,156 Q742,154 752,185 L545,185 Z" fill="#fffef5" />
    </g>

    <!-- Далекі лісисті пагорби -->
    <path d="M0,450 Q260,310 560,410 T1180,380 T1600,430 L1600,900 L0,900 Z" fill="url(#farHillGrad)" />

    <!-- Середні пагорби -->
    <path d="M0,510 Q380,410 760,490 T1600,470 L1600,900 L0,900 Z" fill="url(#midHillGrad)" />

    <!-- Головна сонячна галявина -->
    <path d="M0,565 Q420,510 820,555 T1600,535 L1600,900 L0,900 Z" fill="url(#meadowGrad)" />

    <!-- Звивистий струмок під містком-лабіринтом -->
    <path d="M680,485 C580,585 950,670 740,900 L1080,900 C1190,690 820,585 880,485 Z" fill="url(#riverGrad)" opacity="0.85" />
    <g class="water-wave">
      <path d="M735,545 Q805,535 845,555" stroke="#c8f6ff" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M765,645 Q855,630 915,655" stroke="#c8f6ff" stroke-width="6" stroke-linecap="round" fill="none" />
      <path d="M790,765 Q895,745 975,775" stroke="#c8f6ff" stroke-width="7" stroke-linecap="round" fill="none" />
    </g>

    <!-- Ліве велике розлоге дерево -->
    <g class="tree-sway">
      <path d="M110,650 Q125,460 95,310 L165,310 Q145,460 185,650 Z" fill="url(#trunkGrad)" />
      <path d="M130,410 Q60,350 25,310" stroke="url(#trunkGrad)" stroke-width="24" stroke-linecap="round" fill="none" />
      <path d="M145,380 Q215,320 265,285" stroke="url(#trunkGrad)" stroke-width="20" stroke-linecap="round" fill="none" />
      <circle cx="75" cy="260" r="115" fill="url(#canopyGrad1)" />
      <circle cx="215" cy="255" r="120" fill="url(#canopyGrad1)" />
      <circle cx="145" cy="180" r="130" fill="url(#canopyGrad2)" />
    </g>

    <!-- Праве розлоге дерево -->
    <g class="tree-sway-2">
      <path d="M1430,640 Q1445,450 1420,300 L1485,300 Q1465,450 1505,640 Z" fill="url(#trunkGrad)" />
      <circle cx="1385" cy="255" r="110" fill="url(#canopyGrad1)" />
      <circle cx="1515" cy="250" r="115" fill="url(#canopyGrad1)" />
      <circle cx="1450" cy="175" r="125" fill="url(#canopyGrad2)" />
    </g>

    <!-- Квітучі кущі, папороть, грибочки та квіти на передньому плані -->
    <g>
      <!-- Лівий кущ -->
      <ellipse cx="140" cy="865" rx="180" ry="75" fill="#235c1d" />
      <ellipse cx="95" cy="875" rx="130" ry="60" fill="#378529" />
      <!-- Правий кущ -->
      <ellipse cx="1470" cy="865" rx="190" ry="80" fill="#235c1d" />
      <ellipse cx="1510" cy="875" rx="135" ry="62" fill="#378529" />

      <!-- Лісові квіти та грибочки -->
      <g transform="translate(275, 815)">
        <path d="M0,35 Q4,15 10,0" stroke="#2f7d22" stroke-width="4" fill="none" />
        <circle cx="10" cy="0" r="11" fill="#ff6b9d" />
        <circle cx="10" cy="0" r="5" fill="#ffe156" />
      </g>
      <g transform="translate(330, 835)">
        <path d="M8,0 L14,28 L2,28 Z" fill="#f5e6c8" />
        <path d="M-8,6 Q8,-14 24,6 Z" fill="#e63946" />
        <circle cx="4" cy="0" r="2.5" fill="#fff" />
        <circle cx="13" cy="2" r="2" fill="#fff" />
      </g>
      <g transform="translate(1260, 825)">
        <path d="M0,30 Q-4,15 -8,0" stroke="#2f7d22" stroke-width="4" fill="none" />
        <circle cx="-8" cy="0" r="12" fill="#ffd166" />
        <circle cx="-8" cy="0" r="5" fill="#ef476f" />
      </g>
    </g>

    <!-- Живий метелик -->

  /* =========================================================

     Тут можна легко змінити список приголосних і голосних літер

  const CONSONANTS = [
    'Б', 'В', 'Г', 'Ґ', 'Д', 'Ж', 'З', 'К', 'Л', 'М',

  // Усі допустимі українські літери для перевірки введення

  // Розмір таблички-лабіринту (кількість рядків і стовпчиків)

  /* =========================================================
     2. ЗВУКОВИЙ РУШІЙ (WEB AUDIO API — БЕЗ СЛІВ, АКТИВНІ ЗВУКИ)
     ========================================================= */
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Звук появи нового персонажа та завдання
    playAppear() {
      this.init();
      const now = this.ctx.currentTime;
      const notes = [392, 523.25, 659.25, 783.99];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);
        gain.gain.setValueAtTime(0.14, now + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.06);
        osc.stop(now + idx * 0.06 + 0.26);
      });
    }

    // Мелодійний звук правильного кроку (підвищується з кожним кроком доріжки)
    playStep(stepIndex) {
      this.init();
      const now = this.ctx.currentTime;
      const scale = [329.63, 369.99, 415.30, 440.00, 493.88, 554.37, 622.25, 659.25, 739.99, 830.61, 880.00, 987.77];
      const baseFreq = scale[stepIndex % scale.length];

      // Основний маримбовий тон
      const osc1 = this.ctx.createOscillator();
      const gain1 = this.ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(baseFreq, now);
      osc1.frequency.exponentialRampToValueAtTime(baseFreq * 1.02, now + 0.12);
      gain1.gain.setValueAtTime(0.24, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc1.connect(gain1);
      gain1.connect(this.ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.34);

      // Дзвінкий обертон
      const osc2 = this.ctx.createOscillator();
      const gain2 = this.ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(baseFreq * 2, now);
      gain2.gain.setValueAtTime(0.09, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc2.connect(gain2);
      gain2.connect(this.ctx.destination);
      osc2.start(now);
      osc2.stop(now + 0.22);
    }

    // Кумедний пружний звук при натисканні неправильного складу
    playWrong() {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(195, now);
      osc.frequency.linearRampToValueAtTime(125, now + 0.14);
      osc.frequency.linearRampToValueAtTime(160, now + 0.26);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    }

    // Урочиста мелодія перемоги, коли доріжка пройдена до кінця
    playWinFanfare() {
      this.init();
      const now = this.ctx.currentTime;
      const melody = [
        { f: 523.25, t: 0.0, d: 0.14 },
        { f: 659.25, t: 0.11, d: 0.14 },
        { f: 783.99, t: 0.22, d: 0.14 },
        { f: 1046.50, t: 0.34, d: 0.38 },
        { f: 880.00, t: 0.54, d: 0.15 },
        { f: 1046.50, t: 0.68, d: 0.55 }
      ];
      melody.forEach(n => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now + n.t);
        gain.gain.setValueAtTime(0.22, now + n.t);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d + 0.02);
      });
    }
  }

  // Генератор деталізованого SVG-портрета персонажа на основі його параметрів та емоції

  /* =========================================================
     4. ГЕНЕРАТОР СКЛАДІВ ТА ЗВИВИСТОЇ ДОРІЖКИ ЛАБІРИНТУ
     ========================================================= */
  // Створення списку складів із заданою літерою
  function generateSyllablesWithLetter(targetLetter) {
    const letter = targetLetter.toUpperCase();
    const isVowel = VOWELS.includes(letter) || letter === 'Ї';
    const valid = [];

    if (!isVowel) {
      // Якщо замовлена приголосна (наприклад, "З"): ЗА, ЗО, ЗУ, ЗИ, ЗІ, ЗЕ, АЗ, ОЗ...
      VOWELS.forEach(v => {
        valid.push(letter + v);
        valid.push(v + letter);
      });
    } else {
      // Якщо вчитель ввів голосну (наприклад, "А"): МА, СА, ЛА, РА, ТА, ПА...
      CONSONANTS.slice(0, 14).forEach(c => {
        valid.push(c + letter);
        valid.push(letter + c);
      });
    }
    return valid;
  }

  // Створення списку "хибних" складів (які НЕ містять замовленої літери)
  function generateDecoySyllables(targetLetter) {
    const letter = targetLetter.toUpperCase();
    const decoys = [];
    const otherConsonants = CONSONANTS.filter(c => c !== letter);
    const otherVowels = VOWELS.filter(v => v !== letter);

    otherConsonants.forEach(c => {
      otherVowels.forEach(v => {
        decoys.push(c + v);
      });
    });
    return decoys;
  }

  // Алгоритм побудови неперервної випадкової доріжки з лівого стовпчика (0) до правого (GRID_COLS - 1)
  // Важливо: сусідні клітинки доріжки не торкаються одна одної побічними сторонами, щоб доріжка була однозначною
  function generateMazePath(rows, cols) {
    const startRow = Math.floor(Math.random() * rows);
    const path = [{ r: startRow, c: 0 }];
    const visited = Array.from({ length: rows }, () => Array(cols).fill(false));
    visited[startRow][0] = true;

    let r = startRow;
    let c = 0;

    while (c < cols - 1) {
      const candidates = [];

      // Крок праворуч завжди можливий
      candidates.push({ r, c: c + 1, weight: 3 });

      // Крок вгору або вниз (якщо не виходимо за межі та не злипаємось із вже пройденими клітинками)
      [-1, 1].forEach(dr => {
        const nr = r + dr;
        if (nr >= 0 && nr < rows && !visited[nr][c]) {
          // Перевіряємо, щоб нова клітинка мала лише 1 сусіда з поточного шляху (щоб не було петель)
          let neighborCount = 0;
          [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([ar, ac]) => {
            const rr = nr + ar;
            const cc = c + ac;
            if (rr >= 0 && rr < rows && cc >= 0 && cc < cols && visited[rr][cc]) {
              neighborCount++;
            }
          });
          if (neighborCount === 1) {
            candidates.push({ r: nr, c, weight: 4 });
          }
        }
      });

      // Випадковий вибір наступного кроку з урахуванням ваги
      const pool = [];
      candidates.forEach(cand => {
        for (let i = 0; i < cand.weight; i++) pool.push(cand);
      });
      const chosen = pool[Math.floor(Math.random() * pool.length)];
      r = chosen.r;
      c = chosen.c;
      visited[r][c] = true;
      path.push({ r, c });
    }

    return path;
  }

  /* =========================================================
     5. СТАН ГРИ ТА ІСТОРІЯ РІВНІВ (ДЛЯ КНОПОК "НАЗАД" ТА "ДАЛІ")
     ========================================================= */
  const levelHistory = [];
  let currentLevelIdx = -1;
  let isLevelCompleted = false;

  const gridEl = document.getElementById('maze-grid');
  const orderLetterEl = document.getElementById('order-letter-text');
  const customInputEl = document.getElementById('custom-letter-input');
  const activeCharEl = document.getElementById('active-character');
  const heroSlotEl = document.getElementById('hero-home-slot');
  const goalTargetEl = document.getElementById('goal-target');
  const trailLineEl = document.getElementById('golden-trail-line');
  const trailGlowEl = document.getElementById('golden-trail-glow');

  // Випадковий вибір елемента масиву
  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // Створення даних нового рівня
  function createLevelData(forcedLetter = null) {
    // Обираємо випадкову приголосну або введену вчителем літеру
    const prevLetter = currentLevelIdx >= 0 ? levelHistory[currentLevelIdx].letter : null;
    let letter = forcedLetter;
    if (!letter) {
      const available = CONSONANTS.filter(l => l !== prevLetter);
      letter = pickRandom(available);
    }

    // Чергуємо 10 персонажів по колу у випадковому або послідовному порядку
    const charIndex = (currentLevelIdx + 1) % CHARACTERS.length;
    const character = CHARACTERS[charIndex];

    // Генеруємо шлях лабіринту
    const path = generateMazePath(GRID_ROWS, GRID_COLS);
    const pathSet = new Set(path.map(p => `${p.r},${p.c}`));

    const validSyllables = generateSyllablesWithLetter(letter);
    const decoySyllables = generateDecoySyllables(letter);

    // Заповнюємо матрицю клітинок
    const cells = [];
    for (let r = 0; r < GRID_ROWS; r++) {
      const row = [];
      for (let c = 0; c < GRID_COLS; c++) {
        const key = `${r},${c}`;
        const pathIndex = path.findIndex(p => p.r === r && p.c === c);
        const isPath = pathSet.has(key);
        const syllable = isPath
          ? pickRandom(validSyllables)
          : pickRandom(decoySyllables);

        row.push({
          r,
          c,
          syllable,
          isPath,
          pathIndex,
          stepped: false
        });
      }
      cells.push(row);
    }

    return {
      letter,
      character,
      path,
      cells
    };
  }

  /* =========================================================
     6. ВІДМАЛЬОВКА ТАБЛИЧКИ ЛАБІРИНТУ ТА ПЕРСОНАЖА
     ========================================================= */
  function renderCellSVG(syllable, stepped, r, c) {
    const id = `stone_${r}_${c}`;
    const topColor1 = stepped ? '#ffe975' : '#d99b52';
    const topColor2 = stepped ? '#f5b120' : '#a86825';
    const borderColor = stepped ? '#804d00' : '#4a2404';
    const leafColor = stepped ? '#80ff4d' : '#58b835';

    return `
      <svg class="cell-svg" viewBox="0 2 120 96">
        <defs>
          <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${topColor1}" />
            <stop offset="100%" stop-color="${topColor2}" />
          </linearGradient>
        </defs>
        <!-- Об'ємна нижня грань каменя/плитки -->
        <rect x="6" y="16" width="108" height="74" rx="20" fill="${borderColor}" />
        <!-- Верхня різьблена поверхня -->
        <rect x="6" y="8" width="108" height="72" rx="20" fill="url(#${id})" stroke="${borderColor}" stroke-width="3.5" />
        <!-- Внутрішній візерунок -->
        <rect x="14" y="14" width="92" height="58" rx="15" fill="none" stroke="rgba(255,248,210,0.45)" stroke-width="2" stroke-dasharray="10 6" />
        <!-- Маленький листочок у куточку клітинки -->
        <path d="M16,22 Q8,10 24,12 Q22,22 16,22 Z" fill="${leafColor}" stroke="#1f4d0d" stroke-width="1.8" />
        ${stepped ? `<circle cx="98" cy="22" r="6" fill="#fff9bf" />` : ''}
        <!-- Текст складу -->
        <text class="syllable-label" x="60" y="62" text-anchor="middle">${syllable}</text>
      </svg>
    `;
  }

  // Позиціонування персонажа на старті, на клітинці або біля фінішу
  function moveCharacterToElement(targetEl, scale = 1) {
    const rect = targetEl.getBoundingClientRect();
    const charW = scale < 0.8 ? 115 : 210;
    const charH = scale < 0.8 ? 126 : 230;
    activeCharEl.style.width = `${charW}px`;
    activeCharEl.style.height = `${charH}px`;
    activeCharEl.style.left = `${rect.left + rect.width / 2 - charW / 2}px`;
    activeCharEl.style.top = `${rect.top + rect.height / 2 - charH * 0.65}px`;
  }

  // Оновлення золотої пунктирної лінії між відкритими клітинками шляху
  function updateTrailLine(level) {
    const steppedInOrder = [];
    for (let i = 0; i < level.path.length; i++) {
      const p = level.path[i];
      if (level.cells[p.r][p.c].stepped) {
        steppedInOrder.push(p);
      }
    }

    if (steppedInOrder.length < 2) {
      trailLineEl.setAttribute('d', '');
      trailGlowEl.setAttribute('d', '');
      return;
    }

    const colW = 600 / GRID_COLS;
    const rowH = 500 / GRID_ROWS;
    const points = steppedInOrder.map(p => {
      const x = (p.c + 0.5) * colW;
      const y = (p.r + 0.5) * rowH;
      return `${x},${y}`;
    });

    const d = 'M ' + points.join(' L ');
    trailLineEl.setAttribute('d', d);
    trailGlowEl.setAttribute('d', d);
  }

  // Завантаження та відображення поточного рівня
  function loadLevel(level) {
    isLevelCompleted = false;

    // 1. Оновлюємо замовлену літеру в хмаринці та у вікні введення
    orderLetterEl.textContent = level.letter;
    customInputEl.value = level.letter;

    const bubble = document.getElementById('order-bubble');
    bubble.style.transform = 'scale(0.6)';
    setTimeout(() => { bubble.style.transform = 'scale(1)'; }, 50);

    // 2. Оновлюємо персонажа та ставимо його на стартовий пеньочок
    activeCharEl.innerHTML = renderCharacterSVG(level.character, 'happy');
    activeCharEl.className = 'char-idle';
    requestAnimationFrame(() => {
      moveCharacterToElement(heroSlotEl, 1);
    });

    // 3. Очищуємо доріжку та будуємо сітку клітинок
    trailLineEl.setAttribute('d', '');
    trailGlowEl.setAttribute('d', '');
    gridEl.innerHTML = '';

    for (let r = 0; r < GRID_ROWS; r++) {
      for (let c = 0; c < GRID_COLS; c++) {
        const cellData = level.cells[r][c];
        cellData.stepped = false;

        const cellDiv = document.createElement('div');
        cellDiv.className = 'maze-cell';
        if (cellData.pathIndex === 0) {
          cellDiv.classList.add('start-hint');
        }
        cellDiv.dataset.r = r;
        cellDiv.dataset.c = c;
        cellDiv.innerHTML = renderCellSVG(cellData.syllable, false, r, c);

        cellDiv.addEventListener('click', () => handleCellClick(cellData, cellDiv, level));
        gridEl.appendChild(cellDiv);
      }
    }

    sound.playAppear();
  }

  /* =========================================================
     7. ОБРОБКА НАТИСКАННЯ НА КЛІТИНКИ ЛАБІРИНТУ
     ========================================================= */
  function handleCellClick(cellData, cellDiv, level) {
    if (isLevelCompleted) return;

    // Якщо клітинка містить склад із замовленою літерою (належить до доріжки)
    if (cellData.isPath) {
      if (cellData.stepped) return;

      cellData.stepped = true;
      cellDiv.classList.remove('start-hint');
      cellDiv.classList.add('stepped');
      cellDiv.innerHTML = renderCellSVG(cellData.syllable, true, cellData.r, cellData.c);

      // Скільки клітинок доріжки вже відкрито
      const totalStepped = level.path.filter(p => level.cells[p.r][p.c].stepped).length;
      sound.playStep(totalStepped - 1);

      // Іскри навколо клітинки
      const rect = cellDiv.getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 16);

      // Персонаж радісно стрибає на цю клітинку
      activeCharEl.innerHTML = renderCharacterSVG(level.character, 'excited');
      activeCharEl.className = 'char-hop';
      moveCharacterToElement(cellDiv, 0.62);
      setTimeout(() => {
        if (!isLevelCompleted) activeCharEl.className = 'char-idle';
      }, 520);

      // Підсвічуємо наступну ще не відкриту клітинку шляху для зручності дитини
      document.querySelectorAll('.maze-cell.start-hint').forEach(el => el.classList.remove('start-hint'));
      const nextUnstepped = level.path.find(p => !level.cells[p.r][p.c].stepped);
      if (nextUnstepped) {
        const nextEl = gridEl.querySelector(`[data-r="${nextUnstepped.r}"][data-c="${nextUnstepped.c}"]`);
        if (nextEl) nextEl.classList.add('start-hint');
      }

      updateTrailLine(level);

      // Перевіряємо, чи всі склади доріжки відкриті
      if (totalStepped === level.path.length) {
        completeLevel(level);
      }
    } else {
      // Хибна клітинка (інша літера)
      sound.playWrong();
      cellDiv.classList.remove('wrong-hit');
      void cellDiv.offsetWidth;
      cellDiv.classList.add('wrong-hit');

      // Персонаж здивовано хитає головою
      activeCharEl.innerHTML = renderCharacterSVG(level.character, 'surprised');
      activeCharEl.className = 'char-wrong';
      setTimeout(() => {
        if (!isLevelCompleted) {
          activeCharEl.innerHTML = renderCharacterSVG(level.character, 'happy');
          activeCharEl.className = 'char-idle';
        }
      }, 520);
    }
  }

  // Завершення рівня: персонаж добігає до фінішної бесідки, лунає салют і приходить наступний гість
  function completeLevel(level) {
    isLevelCompleted = true;
    sound.playWinFanfare();

    setTimeout(() => {
      activeCharEl.innerHTML = renderCharacterSVG(level.character, 'excited');
      activeCharEl.className = 'char-win';
      moveCharacterToElement(goalTargetEl, 0.92);

      const goalRect = goalTargetEl.getBoundingClientRect();
      spawnBurst(goalRect.left + goalRect.width / 2, goalRect.top + goalRect.height / 2, 65);
    }, 320);

    // Автоматичний перехід до наступного персонажа через 2.5 секунди
    setTimeout(() => {
      if (isLevelCompleted) {
        goNextLevel();
      }
    }, 2600);
  }

  /* =========================================================
     8. НАВІГАЦІЯ ("ДАЛІ", "НАЗАД") ТА ВВЕДЕННЯ ВЛАСНОЇ ЛІТЕРИ
     ========================================================= */
  function goNextLevel(forcedLetter = null) {
    if (!forcedLetter && currentLevelIdx < levelHistory.length - 1) {
      currentLevelIdx++;
      loadLevel(levelHistory[currentLevelIdx]);
    } else {
      const newLevel = createLevelData(forcedLetter);
      levelHistory.push(newLevel);
      currentLevelIdx = levelHistory.length - 1;
      loadLevel(newLevel);
    }
  }

  function goPrevLevel() {
    if (currentLevelIdx > 0) {
      currentLevelIdx--;
      loadLevel(levelHistory[currentLevelIdx]);
    } else {
      // Якщо ми на першому рівні, просто оновлюємо поточний лабіринт
      loadLevel(levelHistory[0]);
    }
  }

  document.getElementById('btn-next').addEventListener('click', () => goNextLevel());
  document.getElementById('btn-prev').addEventListener('click', () => goPrevLevel());

  // При кліку на поле введення виділяємо поточну літеру для миттєвої заміни
  customInputEl.addEventListener('focus', () => {
    customInputEl.select();
  });

  // Коли вчитель вводить літеру у віконце
  customInputEl.addEventListener('input', (e) => {
    const raw = e.target.value.trim().toUpperCase();
    if (!raw) return;

    // Якщо введена коректна українська літера — одразу генеруємо лабіринт із нею
    if (ALL_UKR_LETTERS.includes(raw)) {
      const updatedLevel = createLevelData(raw);
      levelHistory[currentLevelIdx] = updatedLevel;
      loadLevel(updatedLevel);
      customInputEl.blur();
    }
  });

  // Перерахунок позиції персонажа при зміні розміру вікна
  window.addEventListener('resize', () => {
    if (currentLevelIdx >= 0 && !isLevelCompleted) {
      moveCharacterToElement(heroSlotEl, 1);
    }
  });

  /* =========================================================
     9. СИСТЕМА СВЯТКОВИХ ЧАСТИНОК (ЗІРОЧКИ, ЛИСТОЧКИ, СЯЙВО)
     ========================================================= */
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');
  let particles = [];

  function resizeFxCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeFxCanvas);
  resizeFxCanvas();

  function spawnBurst(x, y, count = 25) {
    const colors = ['#ffe066', '#ff6b6b', '#7ae582', '#4cc9f0', '#ff9f1c', '#f72585'];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.5 + Math.random() * 7.5;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2.5,
        size: 6 + Math.random() * 8,
        color: pickRandom(colors),
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.22,
        life: 1,
        decay: 0.016 + Math.random() * 0.015,
        shape: Math.random() > 0.4 ? 'star' : 'leaf'
      });
    }
  }

  function drawStar(ctx, r) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = (i * 72 - 90) * (Math.PI / 180);
      const a2 = ((i * 72 + 36) - 90) * (Math.PI / 180);
      if (i === 0) ctx.moveTo(Math.cos(a1) * r, Math.sin(a1) * r);
      else ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
      ctx.lineTo(Math.cos(a2) * (r * 0.45), Math.sin(a2) * (r * 0.45));
    }
    ctx.closePath();
    ctx.fill();
  }

  function animateFx() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18; // Гравітація
      p.rot += p.vRot;
      p.life -= p.decay;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.fillStyle = p.color;

      if (p.shape === 'star') {
        drawStar(fxCtx, p.size);
      } else {
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }
    requestAnimationFrame(animateFx);
  }
  animateFx();

  /* =========================================================
     10. СТАРТ ПЕРШОГО РІВНЯ (ЗА ЗАМОВЧУВАННЯМ ПОЧИНАЄМО З "З")
     ========================================================= */
  window.addEventListener('DOMContentLoaded', () => {
    goNextLevel('З');
  });
</script>
