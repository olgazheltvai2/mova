<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Фургончик дивних смаколиків</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700;900&family=Rubik:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #141829;
      font-family: 'Rubik', 'Comfortaa', sans-serif;
    }

    #stage-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #main-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Ambient Animations */
    @keyframes swaySlow {
      0%, 100% { transform: rotate(-1.4deg); }
      50% { transform: rotate(1.4deg); }
    }
    @keyframes swayGarland {
      0%, 100% { transform: rotate(-0.8deg) translateY(0px); }
      50% { transform: rotate(0.8deg) translateY(3px); }
    }
    @keyframes bulbPulse {
      0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 8px #ffcf56); }
      50% { opacity: 1; filter: drop-shadow(0 0 15px #ffe885); }
    }
    @keyframes floatBokeh {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(12px, -22px) scale(1.18); opacity: 0.7; }
    }
    @keyframes guestBreathe {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-5px) scaleY(1.018); }
    }
    @keyframes clocheHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes happyDance {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      20% { transform: translateY(-28px) rotate(-6deg) scale(1.06, 0.96); }
      40% { transform: translateY(0) rotate(6deg) scale(0.96, 1.05); }
      60% { transform: translateY(-24px) rotate(-5deg) scale(1.05, 0.97); }
      80% { transform: translateY(-6px) rotate(4deg) scale(1.02); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }
    @keyframes sneezeShock {
      0% { transform: scale(1) rotate(0deg); }
      18% { transform: translateY(-10px) scale(1.08, 0.92) rotate(-3deg); }
      35% { transform: translateY(-22px) scale(1.14, 0.88) rotate(3deg); }
      48% { transform: translateY(12px) scale(0.88, 1.15) rotate(-8deg); }
      65% { transform: translateY(-14px) rotate(6deg); }
      82% { transform: translateY(4px) rotate(-3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    @keyframes glassesPop {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      35% { transform: translateY(-38px) rotate(-14deg) scale(1.12); }
      65% { transform: translateY(-18px) rotate(10deg); }
    }
    @keyframes hatPop {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30% { transform: translateY(-48px) rotate(15deg); }
      65% { transform: translateY(-16px) rotate(-8deg); }
    }

    .tree-canopy {
      transform-origin: center bottom;
      animation: swaySlow 7s ease-in-out infinite;
    }
    .tree-canopy.delay-1 {
      animation-delay: -2.5s;
      animation-duration: 8.5s;
    }
    .garland-strand {
      transform-origin: 960px 40px;
      animation: swayGarland 5.5s ease-in-out infinite;
    }
    .garland-bulb {
      animation: bulbPulse 2.6s ease-in-out infinite;
    }
    .bokeh-dot {
      animation: floatBokeh 8s ease-in-out infinite;
    }

    #guest-rig {
      transform-origin: 1470px 710px;
      animation: guestBreathe 3.4s ease-in-out infinite;
      cursor: pointer;
    }
    #guest-rig.react-happy {
      animation: happyDance 1.05s cubic-bezier(0.34, 1.56, 0.64, 1) 2;
    }
    #guest-rig.react-sneeze {
      animation: sneezeShock 1.15s cubic-bezier(0.36, 0.07, 0.19, 0.97) 1;
    }
    #guest-rig.react-sneeze .guest-glasses {
      transform-origin: center;
      transform-box: fill-box;
      animation: glassesPop 1.15s ease-out 1;
    }
    #guest-rig.react-sneeze .guest-hat {
      transform-origin: center;
      transform-box: fill-box;
      animation: hatPop 1.15s ease-out 1;
    }
    #guest-rig.react-happy .guest-hat {
      transform-origin: center;
      transform-box: fill-box;
      animation: hatPop 1.05s ease-out 2;
    }

    .cloche-slot {
      cursor: pointer;
      transition: filter 0.25s ease;
    }
    .cloche-slot:hover .cloche-dome-group {
      filter: drop-shadow(0 10px 18px rgba(255, 219, 112, 0.55));
    }
    .cloche-dome-group {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center bottom;
      transform-box: fill-box;
    }
    .cloche-slot:hover .cloche-dome-group:not(.lifted) {
      transform: translateY(-9px) scale(1.03);
    }

    .syllable-text {
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: 2px;
      text-anchor: middle;
      dominant-baseline: central;
      paint-order: stroke fill;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    /* Minimalist Stylized Next Button */
    #next-btn {
      position: fixed;
      right: 26px;
      bottom: 24px;
      width: 78px;
      height: 78px;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 50;
      padding: 0;
      outline: none;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
      filter: drop-shadow(0 10px 18px rgba(15, 10, 4, 0.55));
    }
    #next-btn:hover {
      transform: scale(1.1) rotate(4deg);
      filter: drop-shadow(0 12px 22px rgba(255, 196, 77, 0.55));
    }
    #next-btn:active {
      transform: scale(0.93) rotate(-3deg);
    }

    #plate-served-item {
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #plate-served-item:hover {
      filter: drop-shadow(0 0 14px rgba(255, 230, 130, 0.8));
    }
  </style>
</head>
<body>

<div id="stage-wrapper">
  <svg id="main-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Sky & Park Gradients -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1d2242"/>
        <stop offset="38%" stop-color="#3b315e"/>
        <stop offset="72%" stop-color="#8b475d"/>
        <stop offset="92%" stop-color="#d97f54"/>
        <stop offset="100%" stop-color="#f5b963"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx="65%" cy="62%" r="45%">
        <stop offset="0%" stop-color="#ffe799" stop-opacity="0.65"/>
        <stop offset="45%" stop-color="#f79d5c" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#f79d5c" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="distantHill" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2c3d4f"/>
        <stop offset="100%" stop-color="#192533"/>
      </linearGradient>

      <linearGradient id="midParkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2a5446"/>
        <stop offset="100%" stop-color="#173029"/>
      </linearGradient>

      <linearGradient id="foliageDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2e5e4e"/>
        <stop offset="100%" stop-color="#17332b"/>
      </linearGradient>

      <linearGradient id="foliageWarm" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#52824f"/>
        <stop offset="60%" stop-color="#2c593d"/>
        <stop offset="100%" stop-color="#1a3826"/>
      </linearGradient>

      <linearGradient id="cobbleBase" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3c3342"/>
        <stop offset="35%" stop-color="#2d2633"/>
        <stop offset="100%" stop-color="#1c1721"/>
      </linearGradient>

      <!-- Cobblestone Pattern -->
      <pattern id="cobblePattern" width="120" height="64" patternUnits="userSpaceOnUse">
        <rect width="120" height="64" fill="none"/>
        <rect x="3" y="3" width="54" height="26" rx="9" fill="#4b4052" stroke="#221c26" stroke-width="2.5"/>
        <rect x="61" y="3" width="56" height="26" rx="9" fill="#43384a" stroke="#221c26" stroke-width="2.5"/>
        <rect x="-25" y="33" width="54" height="26" rx="9" fill="#3f3546" stroke="#221c26" stroke-width="2.5"/>
        <rect x="33" y="33" width="56" height="26" rx="9" fill="#4f4357" stroke="#221c26" stroke-width="2.5"/>
        <rect x="93" y="33" width="54" height="26" rx="9" fill="#44394b" stroke="#221c26" stroke-width="2.5"/>
        <path d="M10 9 Q30 6 48 10" stroke="#63556b" stroke-width="2" fill="none" opacity="0.5"/>
        <path d="M40 39 Q60 36 80 40" stroke="#63556b" stroke-width="2" fill="none" opacity="0.5"/>
      </pattern>

      <!-- Food Truck Gradients -->
      <linearGradient id="truckBodyTeal" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38b8b2"/>
        <stop offset="45%" stop-color="#229693"/>
        <stop offset="100%" stop-color="#116062"/>
      </linearGradient>

      <linearGradient id="truckUpperCream" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff6e0"/>
        <stop offset="70%" stop-color="#f2dec0"/>
        <stop offset="100%" stop-color="#d6bc96"/>
      </linearGradient>

      <linearGradient id="truckCoralStripe" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ff6b57"/>
        <stop offset="50%" stop-color="#ff856d"/>
        <stop offset="100%" stop-color="#e04e3d"/>
      </linearGradient>

      <linearGradient id="kitchenInterior" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3b2316"/>
        <stop offset="40%" stop-color="#593522"/>
        <stop offset="100%" stop-color="#2b170e"/>
      </linearGradient>

      <radialGradient id="kitchenWarmLight" cx="50%" cy="25%" r="65%">
        <stop offset="0%" stop-color="#ffd27d" stop-opacity="0.7"/>
        <stop offset="60%" stop-color="#e88b38" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#2b170e" stop-opacity="0"/>
      </radialGradient>

      <!-- Wood Counter Gradient -->
      <linearGradient id="woodCounterTop" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#d99152"/>
        <stop offset="35%" stop-color="#b86d31"/>
        <stop offset="75%" stop-color="#8c4b1b"/>
        <stop offset="100%" stop-color="#592c0c"/>
      </linearGradient>

      <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff0a8"/>
        <stop offset="30%" stop-color="#f0bc42"/>
        <stop offset="65%" stop-color="#b87c18"/>
        <stop offset="85%" stop-color="#ffd966"/>
        <stop offset="100%" stop-color="#7a4c08"/>
      </linearGradient>

      <!-- Metallic Silver Cloche Dome -->
      <linearGradient id="silverCloche" x1="15%" y1="10%" x2="88%" y2="90%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="18%" stop-color="#e9f2f7"/>
        <stop offset="45%" stop-color="#b7c9d6"/>
        <stop offset="72%" stop-color="#7c92a3"/>
        <stop offset="88%" stop-color="#d4e2ec"/>
        <stop offset="100%" stop-color="#526575"/>
      </linearGradient>

      <linearGradient id="silverTray" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7f93a3"/>
        <stop offset="22%" stop-color="#eef6fa"/>
        <stop offset="50%" stop-color="#adc0cf"/>
        <stop offset="78%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#596d7d"/>
      </linearGradient>

      <!-- Medallion Backgrounds (No plain white boxes!) -->
      <radialGradient id="medallionPistachio" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#f2ffcf"/>
        <stop offset="55%" stop-color="#b7e376"/>
        <stop offset="100%" stop-color="#6ca336"/>
      </radialGradient>

      <radialGradient id="medallionBerry" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffd9e8"/>
        <stop offset="55%" stop-color="#ff78a5"/>
        <stop offset="100%" stop-color="#b8255f"/>
      </radialGradient>

      <radialGradient id="medallionAmber" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#fff3c4"/>
        <stop offset="55%" stop-color="#ffbe45"/>
        <stop offset="100%" stop-color="#c96b12"/>
      </radialGradient>

      <!-- Tablecloth Checkered Pattern -->
      <pattern id="picnicCloth" width="44" height="44" patternUnits="userSpaceOnUse">
        <rect width="44" height="44" fill="#fff0d9"/>
        <rect width="22" height="22" fill="#e0483e" opacity="0.85"/>
        <rect x="22" y="22" width="22" height="22" fill="#e0483e" opacity="0.85"/>
        <rect width="22" height="44" fill="#bd2820" opacity="0.35"/>
        <rect width="44" height="22" fill="#bd2820" opacity="0.35"/>
      </pattern>

      <!-- Soft Shadow Filter -->
      <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0d0914" flood-opacity="0.48"/>
      </filter>

      <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- ================= 1. SKY & GOLDEN HOUR PARK BACKGROUND ================= -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>
    <circle cx="1280" cy="620" r="680" fill="url(#sunGlow)"/>

    <!-- Distant City Silhouette & Park Bridges -->
    <path d="M0 680 Q260 610 580 650 T1180 620 T1920 660 L1920 800 L0 800 Z" fill="url(#distantHill)" opacity="0.75"/>

    <!-- Background Park Trees & Glowing Lamps -->
    <g class="tree-canopy">
      <circle cx="120" cy="480" r="190" fill="url(#foliageDark)"/>
      <circle cx="260" cy="510" r="160" fill="url(#foliageWarm)"/>
      <circle cx="980" cy="460" r="210" fill="url(#foliageDark)"/>
      <circle cx="1120" cy="490" r="175" fill="url(#foliageWarm)"/>
    </g>
    <g class="tree-canopy delay-1">
      <circle cx="1680" cy="420" r="230" fill="url(#foliageDark)"/>
      <circle cx="1840" cy="470" r="195" fill="url(#foliageWarm)"/>
      <circle cx="1510" cy="490" r="165" fill="url(#foliageWarm)"/>
    </g>

    <!-- Tree Trunks -->
    <path d="M1110 680 L1100 520 L1135 520 L1130 680 Z" fill="#2b1d19"/>
    <path d="M1670 700 L1650 470 L1705 470 L1695 700 Z" fill="#2b1d19"/>

    <!-- Vintage Park Street Lamps -->
    <g id="park-lamps">
      <!-- Lamp 1 -->
      <rect x="1185" y="450" width="10" height="270" rx="4" fill="#1e242b"/>
      <path d="M1172 720 L1208 720 L1198 690 L1182 690 Z" fill="#2c3540"/>
      <circle cx="1190" cy="442" r="36" fill="#ffdf80" opacity="0.28"/>
      <polygon points="1172,452 1208,452 1216,422 1164,422" fill="#fff0a6" stroke="#1e242b" stroke-width="4"/>
      <polygon points="1160,422 1220,422 1190,402" fill="#1e242b"/>

      <!-- Lamp 2 -->
      <rect x="1815" y="420" width="12" height="310" rx="4" fill="#1e242b"/>
      <circle cx="1821" cy="412" r="42" fill="#ffdf80" opacity="0.28"/>
      <polygon points="1800,422 1842,422 1850,388 1792,388" fill="#fff0a6" stroke="#1e242b" stroke-width="4"/>
      <polygon points="1786,388 1856,388 1821,365" fill="#1e242b"/>
    </g>

    <!-- Rolling Park Lawn & Bushes -->
    <path d="M0 715 Q480 675 980 705 T1920 695 L1920 770 L0 770 Z" fill="url(#midParkGrad)"/>
    <path d="M980 715 Q1040 665 1100 715 Q1160 670 1220 715 Q1280 675 1350 715 Z" fill="#234a3c"/>
    <path d="M1680 710 Q1750 655 1820 710 Q1880 665 1930 715 Z" fill="#1e4034"/>

    <!-- Floating Golden Bokeh Particles -->
    <g id="bokeh-layer">
      <circle class="bokeh-dot" cx="1060" cy="340" r="7" fill="#ffe999" style="animation-delay: 0s;"/>
      <circle class="bokeh-dot" cx="1240" cy="280" r="11" fill="#ffd27d" style="animation-delay: -2s;"/>
      <circle class="bokeh-dot" cx="1420" cy="390" r="6" fill="#fff0b8" style="animation-delay: -4s;"/>
      <circle class="bokeh-dot" cx="1610" cy="290" r="10" fill="#ffcf70" style="animation-delay: -1.5s;"/>
      <circle class="bokeh-dot" cx="1770" cy="360" r="8" fill="#ffe999" style="animation-delay: -3.2s;"/>
      <circle class="bokeh-dot" cx="1330" cy="520" r="5" fill="#ffe999" style="animation-delay: -5s;"/>
    </g>

    <!-- Cobblestone Promenade -->
    <rect x="0" y="735" width="1920" height="345" fill="url(#cobbleBase)"/>
    <rect x="0" y="735" width="1920" height="345" fill="url(#cobblePattern)" opacity="0.88"/>
    <!-- Curb stone rim -->
    <rect x="0" y="725" width="1920" height="16" fill="#5b4e63" stroke="#2a232e" stroke-width="2"/>

    <!-- ================= 2. RETRO CULINARY FOOD TRUCK (LEFT / CENTER) ================= -->
    <g id="food-truck" filter="url(#dropShadow)">
      <!-- Truck Drop Shadow on Pavement -->
      <ellipse cx="560" cy="965" rx="540" ry="42" fill="#0d0914" opacity="0.65"/>

      <!-- Main Truck Hull -->
      <rect x="30" y="155" width="1030" height="770" rx="58" fill="url(#truckBodyTeal)" stroke="#0d4a4d" stroke-width="6"/>
      <!-- Upper Cream Body Panel -->
      <path d="M36 215 Q36 160 92 160 L1000 160 Q1056 160 1056 215 L1056 590 L36 590 Z" fill="url(#truckUpperCream)"/>
      <!-- Decorative Coral & Brass Mid-Stripe -->
      <rect x="32" y="575" width="1026" height="44" fill="url(#truckCoralStripe)"/>
      <rect x="32" y="570" width="1026" height="8" fill="url(#brassGrad)"/>
      <rect x="32" y="617" width="1026" height="8" fill="url(#brassGrad)"/>

      <!-- Embossed Vertical Mint Fluting on Lower Truck -->
      <g opacity="0.28" stroke="#083b3d" stroke-width="5" stroke-linecap="round">
        <line x1="95" y1="650" x2="95" y2="890"/>
        <line x1="145" y1="650" x2="145" y2="890"/>
        <line x1="195" y1="650" x2="195" y2="890"/>
        <line x1="245" y1="650" x2="245" y2="890"/>
        <line x1="295" y1="650" x2="295" y2="890"/>
        <line x1="345" y1="650" x2="345" y2="890"/>
        <line x1="395" y1="650" x2="395" y2="890"/>
        <line x1="445" y1="650" x2="445" y2="890"/>
        <line x1="495" y1="650" x2="495" y2="890"/>
        <line x1="545" y1="650" x2="545" y2="890"/>
        <line x1="595" y1="650" x2="595" y2="890"/>
        <line x1="645" y1="650" x2="645" y2="890"/>
        <line x1="695" y1="650" x2="695" y2="890"/>
        <line x1="745" y1="650" x2="745" y2="890"/>
        <line x1="795" y1="650" x2="795" y2="890"/>
        <line x1="845" y1="650" x2="845" y2="890"/>
        <line x1="895" y1="650" x2="895" y2="890"/>
        <line x1="945" y1="650" x2="945" y2="890"/>
        <line x1="995" y1="650" x2="995" y2="890"/>
      </g>

      <!-- Decorative Roof Cupola & Croissant Weathervane Emblem (No text!) -->
      <rect x="340" y="110" width="410" height="50" rx="22" fill="url(# brassGrad)" stroke="#593506" stroke-width="4"/>
      <path d="M390 110 C420 55, 670 55, 700 110 Z" fill="#ff735c" stroke="#593506" stroke-width="4"/>
      <!-- Golden Croissant Crest -->
      <path d="M505 88 C515 55, 575 55, 585 88 C570 74, 520 74, 505 88 Z" fill="#ffd86b" stroke="#784708" stroke-width="3"/>

      <!-- Kitchen Serving Window Inside Truck -->
      <rect x="92" y="235" width="906" height="335" rx="26" fill="url(#kitchenInterior)" stroke="url(#brassGrad)" stroke-width="10"/>
      <rect x="97" y="240" width="896" height="325" rx="20" fill="url(#kitchenWarmLight)"/>

      <!-- Kitchen Background Details (Hanging Copper Pots, Shelves, Bottles) -->
      <rect x="130" y="320" width="290" height="12" rx="5" fill="#8c502b"/>
      <!-- Jam Jars on Shelf -->
      <rect x="155" y="278" width="32" height="42" rx="6" fill="#ff5470" stroke="#ffd9e2" stroke-width="2"/>
      <rect x="152" y="272" width="38" height="9" rx="3" fill="#e0b343"/>
      <rect x="202" y="284" width="30" height="36" rx="6" fill="#f5b727" stroke="#fff3c4" stroke-width="2"/>
      <rect x="199" y="278" width="36" height="8" rx="3" fill="#e0b343"/>
      <rect x="248" y="275" width="34" height="45" rx="8" fill="#88cc44" stroke="#eaffd4" stroke-width="2"/>
      <rect x="245" y="269" width="40" height="8" rx="3" fill="#e0b343"/>

      <!-- Hanging Copper Pans Rack -->
      <line x1="560" y1="265" x2="920" y2="265" stroke="#d49b35" stroke-width="6" stroke-linecap="round"/>
      <!-- Pan 1 -->

  // ============================================================================
  // 3. SYNTHESIZED SOUND ENGINE (WEB AUDIO API - NO EXTERNAL FILES)
  // ============================================================================
  class SoundFX {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Crisp Restaurant Service Bell ("Ding!") + Steam Puff Hiss
    playBellAndSteam() {
      this.init();
      const now = this.ctx.currentTime;

      // Metallic Bell Harmonics
      const freqs = [1567.98, 3135.96, 4703.94]; // G6 + overtones
      freqs.forEach((f, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);

        const peak = idx === 0 ? 0.32 : 0.12 / idx;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(peak, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + (1.35 - idx * 0.3));

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 1.4);
      });

      // Soft Steam Hiss (Filtered White Noise)
      const bufferSize = this.ctx.sampleRate * 0.45;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const whiteNoise = this.ctx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1800, now);
      filter.Q.setValueAtTime(1.2, now);

      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.01, now + 0.05);
      noiseGain.gain.exponentialRampToValueAtTime(0.16, now + 0.14);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

      whiteNoise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(this.ctx.destination);
      whiteNoise.start(now + 0.05);
    }

    // Arc Flight Whoosh
    playWhoosh() {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.25);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.55);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.22);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.56);
    }

    // Joyful Musical Fanfare & Munching for Edible Food
    playHappyTreat() {
      this.init();
      const now = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        const start = now + idx * 0.11;
        osc.frequency.setValueAtTime(freq, start);

        gain.gain.setValueAtTime(0.001, start);
        gain.gain.linearRampToValueAtTime(0.24, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.28);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(start);
        osc.stop(start + 0.3);
      });
    }

    // Comical Ah-Ah-CHOO Sneeze + Confetti Boing for Non-Edible Surprise
    playFunnySneeze() {
      this.init();
      const now = this.ctx.currentTime;

      // 1. "Ah... Ah..." rising pitch build-up
      [0, 0.22].forEach((offset, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        const base = idx === 0 ? 280 : 380;
        osc.frequency.setValueAtTime(base, now + offset);
        osc.frequency.exponentialRampToValueAtTime(base * 1.65, now + offset + 0.16);

        gain.gain.setValueAtTime(0.01, now + offset);
        gain.gain.linearRampToValueAtTime(0.14, now + offset + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.19);
      });

      // 2. "CHOO!" burst + comical spring boing at 0.45s
      const chooTime = now + 0.44;
      const bufferSize = this.ctx.sampleRate * 0.35;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      const nGain = this.ctx.createGain();
      nGain.gain.setValueAtTime(0.28, chooTime);
      nGain.gain.exponentialRampToValueAtTime(0.001, chooTime + 0.34);
      noise.connect(nGain);
      nGain.connect(this.ctx.destination);
      noise.start(chooTime);

      // Boing wobble oscillator
      const boing = this.ctx.createOscillator();
      const bGain = this.ctx.createGain();
      boing.type = 'sine';
      boing.frequency.setValueAtTime(190, chooTime + 0.08);
      boing.frequency.exponentialRampToValueAtTime(640, chooTime + 0.25);
      boing.frequency.exponentialRampToValueAtTime(240, chooTime + 0.45);
      boing.frequency.exponentialRampToValueAtTime(520, chooTime + 0.65);

      bGain.gain.setValueAtTime(0.22, chooTime + 0.08);
      bGain.gain.exponentialRampToValueAtTime(0.001, chooTime + 0.7);
      boing.connect(bGain);
      bGain.connect(this.ctx.destination);
      boing.start(chooTime + 0.08);
      boing.stop(chooTime + 0.72);
    }

    // Soft Wooden Pop for "Next" Button
    playNextPop() {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.exponentialRampToValueAtTime(760, now + 0.11);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    }
  }

  const sfx = new SoundFX();

  const SLOT_COORDS = [

  let currentGuestIndex = 0;

  // Helper to shuffle array
  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function nextRound(playSound = false) {
    if (playSound) {

    // Rotate guest
    currentGuestIndex = (currentGuestIndex + 1) % GUESTS.length;
    renderGuest(currentGuestIndex);

    // Pick 3 distinct syllables
    const chosenSyllables = shuffle(SYLLABLES).slice(0, 3);

    // Ensure a fun mix of edible and non-edible items under the 3 cloches
    const edibles = shuffle(ITEMS.filter(i => i.edible));
    const nonEdibles = shuffle(ITEMS.filter(i => !i.edible));
    const roundItems = shuffle([
      edibles[0],
      nonEdibles[0],
      Math.random() > 0.5 ? edibles[1] : nonEdibles[1]
    ]);

    roundSlots = [0, 1, 2].map(idx => ({
      syllable: chosenSyllables[idx],
      item: roundItems[idx],
      opened: false
    }));

    // Reset Cloche Domes & Update Syllables
    roundSlots.forEach((slot, idx) => {
      const textEl = document.getElementById(`syllable-${idx}`);
      textEl.textContent = slot.syllable;

      const platterItemEl = document.getElementById(`platter-item-${idx}`);

      platterItemEl.setAttribute('transform', 'translate(0, -18) scale(0.01)');

        domeEl.style.opacity = '1';

  // Create Volumetric Steam Puffs when Cloche Lifts

  // Handle Cloche Click
  function handleClocheClick(slotIdx) {
    const slot = roundSlots[slotIdx];
    if (!slot || slot.opened || isAnimatingFlight) return;

    slot.opened = true;
    isAnimatingFlight = true;

    domeEl.style.opacity = '0';

      { transform: 'translate(0px, -22px) scale(1.05)' }
    ], {
      duration: 520,
      easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',

    });

  // Parabolic Arc Flight from Platter to Guest's Plate
  function flyItemToGuestPlate(slotIdx, item) {
    sfx.playWhoosh();

    // Hide item on counter platter
    const platterItemEl = document.getElementById(`platter-item-${slotIdx}`);
    platterItemEl.setAttribute('opacity', '0');

    // Clear previous item on plate so new item lands cleanly
    const plateServedEl = document.getElementById('plate-served-item');
    plateServedEl.innerHTML = '';

    const flyingLayer = document.getElementById('flying-layer');
    const flyer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    flyer.innerHTML = item.svg;
    flyingLayer.appendChild(flyer);

    const start = { x: SLOT_COORDS[slotIdx].x, y: SLOT_COORDS[slotIdx].y - 22 };
    const end = { x: PLATE_COORDS.x, y: PLATE_COORDS.y };
    const control = {
      x: (start.x + end.x) * 0.5,
      y: Math.min(start.y, end.y) - 340
    };

    const duration = 680;
    const startTime = performance.now();

    function step(now) {
      const t = Math.min(1, (now - startTime) / duration);
      // Ease out cubic
      const ease = 1 - Math.pow(1 - t, 3);

      // Quadratic Bezier position
      const x = (1 - ease) * (1 - ease) * start.x + 2 * (1 - ease) * ease * control.x + ease * ease * end.x;
      const y = (1 - ease) * (1 - ease) * start.y + 2 * (1 - ease) * ease * control.y + ease * ease * end.y;
      const rot = Math.sin(ease * Math.PI) * 18;
      const scale = 1 + Math.sin(ease * Math.PI) * 0.32;

      flyer.setAttribute('transform', `translate(${x}, ${y}) rotate(${rot}) scale(${scale})`);

      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        flyingLayer.removeChild(flyer);
        landItemOnPlate(item);
      }
    }

    requestAnimationFrame(step);
  }

      { transform: 'translate(1455px, 705px) scale(1.35, 0.75)' },

      { transform: 'translate(1455px, 705px) scale(1, 1)' }
    ], {
      duration: 420,
      easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
      fill: 'forwards'
    });

    triggerGuestReaction(item.edible);
    isAnimatingFlight = false;

  // Particle System: Stars & Hearts for Edible / Confetti & Bubbles for Sneeze
  function spawnCelebrationParticles(originX, originY, isEdible) {
    const fxLayer = document.getElementById('fx-layer');
    const colors = isEdible
      ? ['#ffbe3b', '#ff5470', '#68d86b', '#fff07c', '#ff85a1']
      : ['#00bbf9', '#fee440', '#f15bb5', '#00f5d4', '#9b5de5', '#ff6b6b'];

    const count = isEdible ? 22 : 38;

    for (let i = 0; i < count; i++) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const color = colors[i % colors.length];

      if (isEdible) {
        // Golden Stars & Hearts
        if (i % 2 === 0) {
          el.innerHTML = `<polygon points="0,-14 4,-4 15,-4 6,3 10,14 0,7 -10,14 -6,3 -15,-4 -4,-4" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>`;
        } else {
          el.innerHTML = `<path d="M0 10 C-14 -2, -18 -14, -8 -18 C-2 -20, 0 -12, 0 -12 C0 -12, 2 -20, 8 -18 C18 -14, 14 -2, 0 10 Z" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>`;
        }
      } else {
        // Sneeze Confetti Streamers & Soap Bubbles
        if (i % 3 === 0) {
          const r = 8 + Math.random() * 12;
          el.innerHTML = `<circle cx="0" cy="0" r="${r}" fill="#c4f5ff" fill-opacity="0.35" stroke="#ffffff" stroke-width="2.5"/>`;
        } else {
          el.innerHTML = `<rect x="-8" y="-5" width="16" height="10" rx="3" fill="${color}"/>`;
        }
      }

      fxLayer.appendChild(el);

      const angle = isEdible
        ? (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3
        : Math.PI + (Math.random() - 0.5) * 2.4; // Sneeze sprays forward & up
      const dist = isEdible
        ? 110 + Math.random() * 170
        : 150 + Math.random() * 320;

      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - (isEdible ? 60 : 40);
      const rot = (Math.random() - 0.5) * 540;

      const anim = el.animate([
        { transform: `translate(${originX}px, ${originY}px) scale(0.2) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${originX + dx * 0.65}px, ${originY + dy * 0.65}px) scale(1.25) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${originX + dx}px, ${originY + dy + 95}px) scale(0.3) rotate(${rot}deg)`, opacity: 0 }
      ], {
        duration: 1050 + Math.random() * 550,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
        fill: 'forwards'
      });

      anim.onfinish = () => {
        if (el.parentNode) el.parentNode.removeChild(el);
      };
    }
  }

  // Allow clicking the Guest or the Served Item on the Plate to replay reaction during discussion
  document.getElementById('guest-rig').addEventListener('click', () => {
    if (lastServedItem) {
      triggerGuestReaction(lastServedItem.edible);
    } else {
      sfx.playNextPop();
    }
  });

  document.getElementById('plate-served-item').addEventListener('click', () => {
    if (lastServedItem) {
      triggerGuestReaction(lastServedItem.edible);
    }
  });

  // Initialize first round on load
  window.addEventListener('DOMContentLoaded', () => {
    nextRound(false);
  });
</script>
</body>
</html>
