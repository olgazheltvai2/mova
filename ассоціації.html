<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Асоціації - Джунглі</title>
    <!-- Підключення Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        /* Глобальні налаштування */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0a1f12;
            user-select: none;
            font-family: Arial, sans-serif; 
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }

        /* Деталізований векторний фон */
        #bg-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Анімація води на фоні */
        @keyframes waterFlow {
            0% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            100% { transform: translateX(-10px); }
        }
        .water-wave {
            animation: waterFlow 4s ease-in-out infinite;
        }

        /* Контейнер для слова, що падає */
        #falling-word-container {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 150; /* Вищий індекс, щоб не перетинатися з кнопками */
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100"><rect width="300" height="100" rx="15" fill="%238d6e63" stroke="%234e342e" stroke-width="8"/><line x1="10" y1="20" x2="290" y2="20" stroke="%235d4037" stroke-width="3"/><line x1="10" y1="50" x2="290" y2="50" stroke="%235d4037" stroke-width="3"/><line x1="10" y1="80" x2="290" y2="80" stroke="%235d4037" stroke-width="3"/></svg>') center/cover;
            width: 300px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            border-radius: 15px;
        }

        #falling-word-text {
            font-size: 40px;
            color: #fff;
            text-shadow: 3px 3px 0 #2a1a15;
            letter-spacing: 2px;
            font-family: Arial, sans-serif; 
        }

        /* Оновлена анімація падіння - значно вище, щоб уникнути перекриття */
        @keyframes fallDown {
            0% { top: -150px; opacity: 1; transform: translateX(-50%) rotate(-4deg); }
            30% { transform: translateX(-50%) rotate(4deg); }
            60% { transform: translateX(-50%) rotate(-2deg); }
            80% { top: 20vh; transform: translateX(-50%) scale(1.05); }
            100% { top: 15vh; opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }
        }

        .falling {
            animation: fallDown 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Зона для гравців */
        #players-area {
            position: absolute;
            bottom: 110px;
            display: flex;
            gap: 20px;
            z-index: 50;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Картка гравця */
        .player-card {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.9), rgba(39, 174, 96, 0.9));
            border: 6px solid #145a32;
            border-radius: 20px;
            padding: 15px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s, background 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 220px;
        }

        .player-card::after {
            content: '';
            position: absolute;
            top: -15px;
            right: -15px;
            width: 40px;
            height: 40px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z" fill="%23f1c40f"/></svg>') center/contain no-repeat;
            opacity: 0.8;
            pointer-events: none;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .player-name-edit {
            background: rgba(0,0,0,0.2);
            border: 1px dashed #7dcea0;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            width: 140px;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 2px;
            outline: none;
        }

        .delete-player-btn {
            background: #e74c3c;
            border: 2px solid #c0392b;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .status-ready { color: #fff; font-size: 18px; margin-top: 10px; font-weight: bold; text-shadow: 1px 1px 2px #000; text-align: center;}
        .status-wait { color: #d5f5e3; font-size: 18px; margin-top: 10px; font-style: italic; text-align: center;}

        /* Відображення розкритого слова */
        .revealed-word {
            background: #0f351e;
            border: 3px dashed #7dcea0;
            border-radius: 12px;
            color: #f1c40f;
            font-size: 30px;
            text-align: center;
            padding: 15px 10px;
            width: 200px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ДЕРЕВ'ЯНІ КНОПКИ (WOOD BUTTONS) */
        .wood-button {
            background-color: #795548;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.08), rgba(0,0,0,0.08) 10px, transparent 10px, transparent 20px);
            border: 4px solid #4e342e;
            color: #fff;
            border-radius: 15px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4), 0 6px 0 #3e2723, 0 10px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .wood-button:active {
            transform: translateY(6px);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4), 0 0 0 #3e2723, 0 4px 6px rgba(0,0,0,0.5);
        }

        /* КОНТЕЙНЕР ДЛЯ КНОПОК КЕРУВАННЯ */
        #controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            z-index: 100;
        }

        /* Специфічні налаштування розмірів кнопок */
        #lang-btn { padding: 15px 25px; font-size: 24px; }
        #word-trigger { padding: 15px 30px; font-size: 24px; }
        #check-btn { padding: 15px 50px; font-size: 28px; }
        #add-player-btn { padding: 15px 30px; font-size: 24px; }
        .write-btn { padding: 10px 20px; font-size: 20px; }
        .modal-action-btn { padding: 10px 20px; font-size: 20px; margin: 5px;}

        /* Шар для візуального фідбеку */
        #feedback-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 200;
        }

        /* ОНОВЛЕНІ АНІМАЦІЇ ФІДБЕКУ (ЛИСТЯ) */
        @keyframes leafBurst {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            80% { transform: scale(1.5) rotate(180deg); opacity: 1; }
            100% { transform: scale(2) rotate(220deg); opacity: 0; }
        }

        @keyframes leafFall {
            0% { transform: translateY(-20vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
        }

        @keyframes intenseShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10%, 50%, 90% { transform: translate(-10px, -10px) rotate(-3deg); }
            20%, 60% { transform: translate(10px, -10px) rotate(3deg); }
            30%, 70% { transform: translate(-10px, 10px) rotate(-3deg); }
            40%, 80% { transform: translate(10px, 10px) rotate(3deg); }
        }
        .shake-active { animation: intenseShake 0.5s ease-in-out; }

        @keyframes superGlow {
            0% { box-shadow: 0 0 20px #ffd700, inset 0 0 20px #ffd700; transform: scale(1); }
            50% { box-shadow: 0 0 60px #ff0, inset 0 0 40px #ff0; transform: scale(1.1); border-color: #fff; }
            100% { box-shadow: 0 0 20px #ffd700, inset 0 0 20px #ffd700; transform: scale(1); }
        }
        .glow-active { animation: superGlow 1s infinite alternate; }

        /* Система динамічних фонів (Theme Manager) */
        #theme-manager-btn {
            position: fixed; bottom: 120px; right: 20px; font-size: 35px;
            background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 50%;
            width: 60px; height: 60px; cursor: pointer; z-index: 9999; color: white;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        #theme-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 800px; max-height: 60vh; background: rgba(20, 40, 25, 0.95);
            border: 3px solid #2ecc71; border-radius: 20px; overflow-y: auto; z-index: 10000; padding: 20px;
        }

        #theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .theme-item { position: relative; cursor: pointer; border: 3px solid transparent; border-radius: 12px; overflow: hidden; }
        .theme-item:hover { transform: scale(1.05); border-color: #2ecc71; }
        .theme-item img { width: 100%; height: 110px; object-fit: cover; display: block; }
        .theme-item span {
            position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.7);
            color: white; text-align: center; padding: 6px 0; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold;
        }
        #close-theme-btn { position: absolute; top: 15px; right: 20px; color: #e74c3c; font-size: 30px; cursor: pointer; background: none; border: none; font-weight: bold; }

        /* Універсальний блок (Заглушка) */
        #block-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 999999; justify-content: center; align-items: center; flex-direction: column;
        }
        #block-overlay h1 { color: #ff4d4d; font-size: 50px; font-family: Arial, sans-serif; text-transform: uppercase; text-align: center; }

        /* Маркер версії */
        #version-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255,255,255,0.3);
            font-family: Arial, sans-serif;
            font-size: 14px;
            pointer-events: none;
            z-index: 9999;
        }

        /* Адаптивність (Mobile Friendly) */
        @media (max-width: 768px) {
            #controls-container { flex-direction: row; bottom: 10px; gap: 10px; }
            #lang-btn, #word-trigger, #check-btn, #add-player-btn { font-size: 16px; padding: 10px 15px; }
            #players-area { bottom: 80px; gap: 10px; }
            .player-card { padding: 10px; transform: scale(0.9); min-width: 180px; }
            .revealed-word { width: 160px; font-size: 22px; padding: 10px; }
            #falling-word-container { width: 220px; height: 80px; }
            #falling-word-text { font-size: 28px; }
            #theme-manager-btn { bottom: 80px; right: 10px; width: 45px; height: 45px; font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- Версія гри -->
    <div id="version-indicator">v2.0</div>

    <!-- МОДАЛЬНЕ ВІКНО ДЛЯ ВВОДУ СЛОВА -->
    <div id="input-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
        <div style="background: linear-gradient(135deg, #2ecc71, #27ae60); border: 6px solid #145a32; border-radius: 20px; padding: 30px; text-align:center; box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 80%; max-width: 400px;">
            <h2 id="modal-title-text" style="color:white; font-family:Arial, sans-serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); margin-top:0;">Ваша асоціація:</h2>
            <input type="text" id="modal-input" autocomplete="off" spellcheck="false" style="background:#0f351e; border:3px dashed #7dcea0; border-radius:12px; color:#f1c40f; font-size:30px; padding:15px; width:90%; outline:none; text-align:center; margin-bottom:20px; font-family:Arial, sans-serif; box-sizing: border-box;">
            <br>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button id="save-btn-text" onclick="saveModalInput()" class="wood-button modal-action-btn">✔ Зберегти</button>
                <button id="cancel-btn-text" onclick="closeInputModal()" class="wood-button modal-action-btn" style="background-color: #5d4037;">✖ Скасувати</button>
            </div>
        </div>
    </div>
    
    <div id="game-container">
        <!-- Складний, яскравий SVG фон за замовчуванням -->
        <svg id="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
            <defs>
                <linearGradient id="jungle-sky" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffb347"/><stop offset="40%" stop-color="#ffcc33"/><stop offset="100%" stop-color="#3b8d99"/>
                </linearGradient>
                <linearGradient id="river" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00c6ff"/><stop offset="50%" stop-color="#0072ff"/><stop offset="100%" stop-color="#00c6ff"/>
                </linearGradient>
                <radialGradient id="sun" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fff59d"/><stop offset="50%" stop-color="#fbc02d"/><stop offset="100%" stop-color="#f57f17" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <rect width="1920" height="1080" fill="url(#jungle-sky)" />
            <circle cx="1500" cy="300" r="250" fill="url(#sun)" />
            <circle cx="1500" cy="300" r="100" fill="#fff" opacity="0.8" />
            <path d="M0,700 Q200,400 500,650 T1000,500 T1600,600 L1920,400 L1920,1080 L0,1080 Z" fill="#2c5e4f" opacity="0.7"/>
            <path d="M-100,800 Q300,500 700,750 T1400,600 T2000,800 L2000,1080 L-100,1080 Z" fill="#1b4332"/>
            <path d="M500,800 Q700,750 900,850 T1300,800 T1920,950 L1920,1080 L0,1080 L0,950 Q200,850 500,800 Z" fill="url(#river)"/>
            <path class="water-wave" d="M600,850 Q800,820 1000,880 T1400,850" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
            <path class="water-wave" d="M300,950 Q600,900 800,980 T1300,930" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
            <g transform="translate(-100, 100) scale(1.5)">
                <path d="M0,0 C100,200 300,100 400,400 C200,350 100,500 0,600 Z" fill="#0c4a24"/>
                <path d="M0,100 C150,250 250,50 350,300 C150,280 50,450 0,500 Z" fill="#126e37"/>
            </g>
            <g transform="translate(1600, -50) scale(1.8) rotate(-20)">
                <path d="M0,0 C100,200 300,100 400,400 C200,350 100,500 0,600 Z" fill="#09381b"/>
                <path d="M0,100 C150,250 250,50 350,300 C150,280 50,450 0,500 Z" fill="#147c3e"/>
            </g>
            <path d="M200,-10 Q250,150 200,300 T250,600" fill="none" stroke="#5c3a21" stroke-width="12"/>
            <path d="M200,100 Q230,120 250,100 Z" fill="#27ae60"/>
            <path d="M220,250 Q190,270 170,250 Z" fill="#2ecc71"/>
            <path d="M1400,-10 Q1350,200 1400,400 T1350,750" fill="none" stroke="#4a2e1b" stroke-width="15"/>
            <path d="M1400,200 Q1370,230 1350,200 Z" fill="#2ecc71"/>
            <path d="M1380,450 Q1420,480 1440,450 Z" fill="#27ae60"/>
        </svg>

        <div id="word-drop-zone">
            <div id="falling-word-container">
                <span id="falling-word-text"></span>
            </div>
        </div>

        <!-- Динамічна зона гравців -->
        <div id="players-area"></div>

        <div id="controls-container">
            <button id="lang-btn" class="wood-button">🇺🇦 УКР</button>
            <button id="word-trigger" class="wood-button">⏬ Слово</button>
            <button id="check-btn" class="wood-button">✔ Перевірити</button>
            <button id="add-player-btn" class="wood-button">+ Гравець</button>
        </div>

        <div id="feedback-layer"></div>
    </div>

    <!-- UI Системи динамічних фонів -->
    <button id="theme-manager-btn">⚙️</button>
    <div id="theme-modal">
        <button id="close-theme-btn">✖</button>
        <h2 id="theme-modal-title" style="color:white; font-family:Arial, sans-serif; text-align:center; margin-top:0;">Обери фон</h2>
        <div id="theme-grid"></div>
    </div>

    <!-- Універсальний екран-заглушка -->
    <div id="block-overlay">
        <h1>Зачекай! Зараз не твій урок.</h1>
    </div>

    <script>
        // Ініціалізація Firebase
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ
        let myName = new URLSearchParams(window.location.search).get('user');
        if (!myName) myName = sessionStorage.getItem('myName');
        if (!myName) myName = 'Гість_' + Math.floor(Math.random() * 1000);
        sessionStorage.setItem('myName', myName);

        const myTabId = 'tab_' + Math.random().toString(36).substr(2, 9);
        const connectedRef = db.ref('.info/connected');
        const onlineRef = db.ref('online_users/' + myName + '/' + myTabId);

        connectedRef.on('value', snap => {
            if (snap.val() === true) {
                onlineRef.set(true);
                onlineRef.onDisconnect().remove();
            }
        });

        window.addEventListener('beforeunload', () => onlineRef.remove());

        db.ref('force_refresh').on('value', snap => { if (snap.val() === true) window.location.reload(); });

        db.ref('blocked_users/' + myName).on('value', snap => {
            const overlay = document.getElementById('block-overlay');
            if(overlay) overlay.style.display = snap.val() === true ? 'flex' : 'none';
        });

        let immunity = true;
        setTimeout(() => { immunity = false; }, 1000);
        db.ref('current_activity').on('value', snap => {
            if (immunity) return;
            if (snap.val() === 'lobby') window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
        });

        // 2. СИСТЕМА ДИНАМІЧНИХ ФОНІВ
        const themeBtn = document.getElementById('theme-manager-btn');
        const themeModal = document.getElementById('theme-modal');
        const closeThemeBtn = document.getElementById('close-theme-btn');
        const themeGrid = document.getElementById('theme-grid');
        const bgSvg = document.getElementById('bg-svg');
        const gameContainer = document.getElementById('game-container');
        
        themeBtn.onclick = () => themeModal.style.display = 'block';
        closeThemeBtn.onclick = () => themeModal.style.display = 'none';

        async function loadThemes() {
            let i = 1; let consecutiveFails = 0;
            while(i <= 1000 && consecutiveFails < 3) {
                let url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                try {
                    let res = await fetch(url, {method: 'HEAD'});
                    if (res.ok) {
                        const div = document.createElement('div');
                        div.className = 'theme-item';
                        div.innerHTML = `<img src="${url}" alt="Фон ${i}"><span>Фон ${i}</span>`;
                        div.onclick = () => selectTheme(url);
                        themeGrid.appendChild(div);
                        consecutiveFails = 0;
                    } else { consecutiveFails++; }
                } catch(e) { consecutiveFails++; }
                i++;
            }
        }
        loadThemes();

        function selectTheme(url, isRemote = false) {
            if (url === 'default') {
                gameContainer.style.backgroundImage = 'none';
                if(bgSvg) bgSvg.style.display = 'block';
                localStorage.removeItem('mySavedGameBg');
                if (!isRemote) db.ref('game_theme').set('default');
            } else {
                gameContainer.style.backgroundImage = `url('${url}')`;
                if(bgSvg) bgSvg.style.display = 'none';
                localStorage.setItem('mySavedGameBg', url);
                if (!isRemote) db.ref('game_theme').set(url);
            }
            themeModal.style.display = 'none'; // Закриваємо вікно після вибору
        }
        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) selectTheme(savedBg, true);
        db.ref('game_theme').on('value', snap => { if (snap.val()) selectTheme(snap.val(), true); });

        // 3. ЛОГІКА ГРИ
        let isRemoteAction = false;
        
        function sendAction(type, payload) {
            db.ref('game_action').set({ senderId: myTabId, timestamp: Date.now(), type: type, payload: payload });
        }

        db.ref('game_action').on('value', snap => {
            const action = snap.val();
            if (!action || action.senderId === myTabId) return;
            isRemoteAction = true;
            handleAction(action.type, action.payload);
            isRemoteAction = false;
        });

        const wordsDB_uk = [
            "дерево", "сонце", "річка", "гора", "море", "океан", "дощ", "сніг", "вітер", "хмара",
            "квітка", "трава", "ліс", "поле", "степ", "камінь", "пісок", "глина", "земля", "небо",
            "яблуко", "груша", "слива", "вишня", "кавун", "диня", "банан", "апельсин", "лимон", "ананас",
            "помідор", "огірок", "морква", "капуста", "буряк", "цибуля", "часник", "перець", "горіх", "гриб",
            "кіт", "собака", "корова", "кінь", "свиня", "вівця", "коза", "курка", "качка", "гуска",
            "вовк", "лисиця", "ведмідь", "заєць", "білка", "їжак", "олень", "кабан", "миша", "щур",
            "слон", "лев", "тигр", "жираф", "зебра", "крокодил", "мавпа", "носоріг", "бегемот", "кенгуру",
            "стіл", "стілець", "ліжко", "шафа", "диван", "крісло", "двері", "вікно", "дах", "підлога",
            "будинок", "квартира", "місто", "село", "вулиця", "дорога", "машина", "автобус", "трамвай", "поїзд",
            "книга", "зошит", "ручка", "олівець", "фарби", "пензлик", "лінійка", "школа", "урок", "клас"
        ];

        const wordsDB_ru = [
            "дерево", "солнце", "река", "гора", "море", "океан", "дождь", "снег", "ветер", "облако",
            "цветок", "трава", "лес", "поле", "степь", "камень", "песок", "глина", "земля", "небо",
            "яблоко", "груша", "слива", "вишня", "арбуз", "дыня", "банан", "апельсин", "лимон", "ананас",
            "помидор", "огурец", "морковь", "капуста", "свекла", "лук", "чеснок", "перец", "орех", "гриб",
            "кот", "собака", "корова", "лошадь", "свинья", "овца", "коза", "курица", "утка", "гусь",
            "волк", "лиса", "медведь", "заяц", "белка", "еж", "олень", "кабан", "мышь", "крыса",
            "слон", "лев", "тигр", "жираф", "зебра", "крокодил", "обезьяна", "носорог", "бегемот", "кенгуру",
            "стол", "стул", "кровать", "шкаф", "диван", "кресло", "дверь", "окно", "крыша", "пол",
            "дом", "квартира", "город", "деревня", "улица", "дорога", "машина", "автобус", "трамвай", "поезд",
            "книга", "тетрадь", "ручка", "карандаш", "краски", "кисточка", "линейка", "школа", "урок", "класс"
        ];

        // СЛОВНИК ІНТЕРФЕЙСУ
        const uiText = {
            uk: {
                wordTrigger: "⏬ Слово",
                checkBtn: "✔ Перевірити",
                addPlayer: "+ Гравець",
                modalTitle: "Ваша асоціація:",
                saveBtn: "✔ Зберегти",
                cancelBtn: "✖ Скасувати",
                themeTitle: "Обери фон",
                writeBtn: "✍️ Написати",
                statusReady: "✅ Готово",
                statusEntered: "✅ Ввів слово",
                statusWait: "⏳ Очікування...",
                newPlayer: "Новий гравець"
            },
            ru: {
                wordTrigger: "⏬ Слово",
                checkBtn: "✔ Проверить",
                addPlayer: "+ Игрок",
                modalTitle: "Ваша ассоциация:",
                saveBtn: "✔ Сохранить",
                cancelBtn: "✖ Отмена",
                themeTitle: "Выбери фон",
                writeBtn: "✍️ Написать",
                statusReady: "✅ Готово",
                statusEntered: "✅ Ввел слово",
                statusWait: "⏳ Ожидание...",
                newPlayer: "Новый игрок"
            }
        };

        let currentLang = 'uk';
        let availableWords = [...wordsDB_uk];
        let playersData = [];
        let isRevealed = false; 

        const playersArea = document.getElementById('players-area');
        const langBtn = document.getElementById('lang-btn');
        const wordTriggerBtn = document.getElementById('word-trigger');
        const checkBtn = document.getElementById('check-btn');
        const addPlayerBtn = document.getElementById('add-player-btn');
        const fallingContainer = document.getElementById('falling-word-container');
        const fallingText = document.getElementById('falling-word-text');
        const feedbackLayer = document.getElementById('feedback-layer');

        // Функція для оновлення текстів інтерфейсу
        function updateUITexts() {
            document.getElementById('word-trigger').textContent = uiText[currentLang].wordTrigger;
            document.getElementById('check-btn').textContent = uiText[currentLang].checkBtn;
            document.getElementById('add-player-btn').textContent = uiText[currentLang].addPlayer;
            document.getElementById('modal-title-text').textContent = uiText[currentLang].modalTitle;
            document.getElementById('save-btn-text').textContent = uiText[currentLang].saveBtn;
            document.getElementById('cancel-btn-text').textContent = uiText[currentLang].cancelBtn;
            document.getElementById('theme-modal-title').textContent = uiText[currentLang].themeTitle;
            renderPlayers(false);
        }

        // Перемикач мови
        langBtn.onclick = () => {
            currentLang = currentLang === 'uk' ? 'ru' : 'uk';
            langBtn.textContent = currentLang === 'uk' ? '🇺🇦 УКР' : '🇷🇺 РУС';
            availableWords = currentLang === 'uk' ? [...wordsDB_uk] : [...wordsDB_ru];
            updateUITexts();
            sendAction('CHANGE_LANG', { lang: currentLang });
        };

        // Модальне вікно вводу
        let currentEditId = null;
        window.openInputModal = function(id) {
            currentEditId = id;
            const p = playersData.find(x => x.id === id);
            document.getElementById('modal-input').value = p ? p.text : '';
            document.getElementById('input-modal').style.display = 'flex';
            setTimeout(() => document.getElementById('modal-input').focus(), 100);
        };
        window.closeInputModal = function() {
            document.getElementById('input-modal').style.display = 'none';
            currentEditId = null;
        };
        window.saveModalInput = function() {
            if (!currentEditId) return;
            const val = document.getElementById('modal-input').value;
            const p = playersData.find(x => x.id === currentEditId);
            if(p) { 
                p.text = val; 
                sendAction('UPDATE_TEXT', {id: currentEditId, text: val}); 
                renderPlayers(false); // Локальне оновлення
            }
            closeInputModal();
        };

        // Захист від втрати гравця при синхронізації
        function ensureIAmInGame() {
            if (isRemoteAction) return;
            const myId = 'p_' + myTabId;
            const meFound = playersData.some(p => p.id === myId || p.name === myName);
            if (!meFound) {
                playersData.push({ id: myId, name: myName, text: '' });
                renderPlayers(true);
            }
        }

        // Рендер гравців
        function renderPlayers(sync = true) {
            playersArea.innerHTML = '';
            
            playersData.forEach(p => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.id = 'card-' + p.id;

                const isMyInput = (p.id === 'p_' + myTabId || p.name === myName);
                let displayContent = '';

                if (isRevealed) {
                    displayContent = `<div class="revealed-word">${p.text || '---'}</div>`;
                } else {
                    if (isMyInput) {
                        displayContent = `<button class="wood-button write-btn" onclick="openInputModal('${p.id}')">${uiText[currentLang].writeBtn}</button>`;
                        if (p.text) displayContent += `<div class="status-ready">${uiText[currentLang].statusReady}</div>`;
                    } else {
                        if (p.text) displayContent = `<div class="status-ready"><br>${uiText[currentLang].statusEntered}</div>`;
                        else displayContent = `<div class="status-wait"><br>${uiText[currentLang].statusWait}</div>`;
                    }
                }

                card.innerHTML = `
                    <div class="player-header">
                        <input type="text" class="player-name-edit" value="${p.name}" onchange="changeName('${p.id}', this.value)">
                        <button class="delete-player-btn" onclick="removePlayer('${p.id}')">✖</button>
                    </div>
                    ${displayContent}
                `;
                playersArea.appendChild(card);
            });

            if (sync && !isRemoteAction) sendAction('SYNC_PLAYERS', playersData);
        }

        window.changeName = function(id, newName) {
            const p = playersData.find(x => x.id === id);
            if(p) { p.name = newName; sendAction('SYNC_PLAYERS', playersData); }
        };

        window.removePlayer = function(id) {
            playersData = playersData.filter(x => x.id !== id);
            renderPlayers();
        };

        addPlayerBtn.onclick = () => {
            playersData.push({ id: 'p_' + Date.now(), name: uiText[currentLang].newPlayer, text: '' });
            renderPlayers();
        };

        // Аудіо
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'drop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.6);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'win') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); 
                osc.frequency.setValueAtTime(783.99, now + 0.2); osc.frequency.setValueAtTime(1046.50, now + 0.3); 
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.8); osc.start(now); osc.stop(now + 0.8);
                const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain(); osc2.connect(gain2); gain2.connect(audioCtx.destination);
                osc2.type = 'square'; osc2.frequency.setValueAtTime(1046.50, now + 0.3); osc2.frequency.exponentialRampToValueAtTime(523.25, now + 0.8);
                gain2.gain.setValueAtTime(0.05, now + 0.3); gain2.gain.linearRampToValueAtTime(0, now + 0.8); osc2.start(now + 0.3); osc2.stop(now + 0.8);
            } else if (type === 'lose') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, now); osc.frequency.linearRampToValueAtTime(80, now + 0.6);
                gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.6); osc.start(now); osc.stop(now + 0.6);
            }
        }

        // Ігрові дії
        function triggerWord(word) {
            isRevealed = false; 
            playersData.forEach(p => p.text = ''); 
            renderPlayers(false); 
            
            // Скидаємо стилі карток
            document.querySelectorAll('.player-card').forEach(card => {
                card.style.borderColor = '#145a32';
                card.style.background = '';
                card.classList.remove('glow-active');
            });
            
            feedbackLayer.innerHTML = '';
            document.body.classList.remove('shake-active');
            fallingText.textContent = word.toUpperCase();
            
            fallingContainer.classList.remove('falling');
            void fallingContainer.offsetWidth; 
            fallingContainer.classList.add('falling');
            playSound('drop');
        }

        wordTriggerBtn.onclick = () => {
            initAudio();
            if (availableWords.length === 0) {
                availableWords = currentLang === 'uk' ? [...wordsDB_uk] : [...wordsDB_ru];
            }
            const word = availableWords.splice(Math.floor(Math.random() * availableWords.length), 1)[0];
            triggerWord(word);
            sendAction('DROP_WORD', { word });
        };

        function executeCheck() {
            initAudio();
            const validValues = playersData.map(p => p.text.trim().toLowerCase()).filter(v => v.length > 0);
            if (validValues.length === 0) return;

            const counts = {};
            let hasMatch = false;
            
            validValues.forEach(val => {
                counts[val] = (counts[val] || 0) + 1;
                if (counts[val] > 1) hasMatch = true;
            });

            isRevealed = true; 
            renderPlayers(false); 

            if (hasMatch) showWinFeedback(counts);
            else showLoseFeedback();
        }

        checkBtn.onclick = () => {
            executeCheck();
            sendAction('CHECK_RESULTS', {});
        };

        function showWinFeedback(counts) {
            playSound('win');
            
            playersData.forEach((p) => {
                const val = p.text.trim().toLowerCase();
                const card = document.getElementById('card-' + p.id);
                if (card && val && counts[val] > 1) {
                    card.classList.add('glow-active'); 
                    card.style.borderColor = '#ffd700';
                    card.style.background = '#1a522e';
                }
            });

            // Вибух тропічних листочків (зелені, жовті)
            let svgVisuals = `<svg width="100%" height="100%" style="position:absolute; top:0; left:0; overflow:visible;">`;
            const colors = ['#2ecc71', '#27ae60', '#f1c40f', '#f39c12', '#8bc34a']; 
            
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * 100; const y = Math.random() * 100; 
                const scale = Math.random() * 2 + 1; const rot = Math.random() * 360;
                const col = colors[Math.floor(Math.random() * colors.length)];
                const delay = Math.random() * 0.3; 
                
                svgVisuals += `
                    <g transform="translate(${x}vw, ${y}vh) scale(${scale}) rotate(${rot})" 
                       style="animation: leafBurst 1s cubic-bezier(0.1, 0.9, 0.2, 1) both ${delay}s;">
                        <path d="M0,0 C10,-10 20,-5 20,10 C10,20 0,15 0,0 Z" fill="${col}" opacity="0.9"/>
                    </g>
                `;
            }
            svgVisuals += `</svg>`;
            feedbackLayer.innerHTML = svgVisuals;

            setTimeout(() => {
                feedbackLayer.innerHTML = '';
                document.querySelectorAll('.player-card').forEach(card => card.classList.remove('glow-active'));
            }, 3000);
        }

        function showLoseFeedback() {
            playSound('lose');
            
            playersData.forEach((p) => {
                const val = p.text.trim().toLowerCase();
                const card = document.getElementById('card-' + p.id);
                if (card && val) {
                    card.style.borderColor = '#ff4d4d';
                    card.style.background = '#4a1515';
                }
            });

            document.body.classList.add('shake-active');

            // Листопад сухих листочків
            let svgVisuals = `<svg width="100%" height="100%" style="position:absolute; top:0; left:0; overflow:visible;">
                <rect width="100%" height="100%" fill="#000" opacity="0.4" style="transition: opacity 0.3s"/>
            `;
            const dryColors = ['#d35400', '#e67e22', '#a04000', '#873600', '#f39c12'];
            
            for(let i = 0; i < 80; i++) {
                const x = Math.random() * 100; const delay = Math.random() * 0.5; const duration = 1.5 + Math.random() * 1.5;
                const scale = Math.random() * 1.5 + 0.5; const rot = Math.random() * 360;
                const col = dryColors[Math.floor(Math.random() * dryColors.length)];
                svgVisuals += `
                    <g transform="translate(${x}vw, -10vh) scale(${scale}) rotate(${rot})" 
                       style="animation: leafFall ${duration}s linear infinite ${delay}s; opacity:0;">
                        <path d="M0,0 C10,-10 20,-5 20,10 C10,20 0,15 0,0 Z" fill="${col}"/>
                    </g>
                `;
            }
            svgVisuals += `</svg>`;
            feedbackLayer.innerHTML = svgVisuals;

            setTimeout(() => {
                feedbackLayer.innerHTML = '';
                document.body.classList.remove('shake-active');
            }, 3500);
        }

        // Обробка Firebase дій
        function handleAction(type, payload) {
            if (type === 'DROP_WORD') {
                triggerWord(payload.word);
            } 
            else if (type === 'CHECK_RESULTS') {
                executeCheck();
            } 
            else if (type === 'SYNC_PLAYERS') {
                // Захист масиву: беремо масив, що прийшов
                let incoming = payload || [];
                // Перевіряємо, чи ми є в цьому масиві (по імені або ID)
                let meFound = incoming.some(p => p.id === 'p_' + myTabId || p.name === myName);
                
                // Якщо масив нас затер, миттєво додаємо себе до цього масиву
                if (!meFound) {
                    incoming.push({ id: 'p_' + myTabId, name: myName, text: '' });
                    // І відсилаємо оновлений масив назад усім
                    setTimeout(() => { if(!isRemoteAction) sendAction('SYNC_PLAYERS', incoming); }, 200);
                }
                
                playersData = incoming;
                renderPlayers(false);
            } 
            else if (type === 'UPDATE_TEXT') {
                const p = playersData.find(x => x.id === payload.id);
                if (p) {
                    p.text = payload.text;
                    renderPlayers(false);
                }
            }
            else if (type === 'CHANGE_LANG') {
                currentLang = payload.lang;
                const btn = document.getElementById('lang-btn');
                if (btn) btn.textContent = currentLang === 'uk' ? '🇺🇦 УКР' : '🇷🇺 РУС';
                availableWords = currentLang === 'uk' ? [...wordsDB_uk] : [...wordsDB_ru];
                updateUITexts(); // Синхронне оновлення кнопок у всіх
            }
        }

        // Початкова ініціалізація
        ensureIAmInGame(); 

    </script>
</html>
