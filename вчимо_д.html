<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Д</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #0a1c36 0%, #1b3f6b 55%, #7fa2c4 100%);
    font-family: 'Trebuchet MS', 'Segoe UI', 'Nunito', sans-serif;
  }
  #stage-wrap {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  svg#scene {
    width: 100%; height: 100%; display: block;
  }

  /* Minimalist styled controls - no white rectangles */
  .ctrl-btn {
    position: fixed; z-index: 30; cursor: pointer; border: none; outline: none;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit; font-weight: 800; letter-spacing: 0.5px;
    color: #fff7e6;
    background: linear-gradient(145deg, rgba(61, 95, 130, 0.88), rgba(27, 49, 76, 0.92));
    border: 2px solid rgba(182, 224, 255, 0.55);
    box-shadow: 0 6px 18px rgba(0, 10, 28, 0.45), inset 0 1px 4px rgba(255,255,255,0.3);
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s, background 0.3s;
    backdrop-filter: blur(6px);
  }
  .ctrl-btn:hover { transform: scale(1.07); box-shadow: 0 8px 24px rgba(255, 194, 102, 0.35), inset 0 1px 6px rgba(255,255,255,0.45); }
  .ctrl-btn:active { transform: scale(0.95); }

  #lang-btn {
    top: 18px; right: 20px;
    padding: 8px 18px; border-radius: 24px; font-size: 16px; text-transform: lowercase;
  }
  #sound-btn {
    top: 18px; right: 102px;
    width: 42px; height: 42px; border-radius: 50%; padding: 0;
  }
  #next-btn {
    bottom: 20px; right: 22px;
    padding: 10px 22px; border-radius: 28px; font-size: 17px;
    background: linear-gradient(145deg, rgba(214, 126, 44, 0.92), rgba(154, 71, 20, 0.95));
    border-color: rgba(255, 224, 163, 0.72);
  }
  #refresh-btn {
    bottom: 20px; right: 138px;
    width: 46px; height: 46px; border-radius: 50%; padding: 0;
    opacity: 0; pointer-events: none;
    background: linear-gradient(145deg, rgba(64, 124, 104, 0.9), rgba(31, 74, 62, 0.94));
    border-color: rgba(173, 240, 212, 0.65);
  }
  #refresh-btn.visible { opacity: 1; pointer-events: auto; }

  /* Keyframe Animations */
  @keyframes shiverHard {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    15% { transform: translate(-2.6px, 0.8px) rotate(-1.1deg); }
    30% { transform: translate(2.8px, -0.5px) rotate(1.2deg); }
    45% { transform: translate(-2.2px, 1px) rotate(-0.9deg); }
    60% { transform: translate(2.4px, 0.2px) rotate(1deg); }
    75% { transform: translate(-1.8px, -0.6px) rotate(-0.8deg); }
  }
  @keyframes breathIdle {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50% { transform: scaleY(1.018) translateY(-1.5px); }
  }
  @keyframes walkBob {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-9px) rotate(1.8deg); }
  }
  @keyframes warmJump {
    0% { transform: translateY(0) scale(1); }
    28% { transform: translateY(-28px) scale(1.06, 0.95); }
    52% { transform: translateY(-4px) scale(0.96, 1.04); }
    74% { transform: translateY(-14px) scale(1.03); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes headShake {
    0%, 100% { transform: rotate(0deg); }
    18% { transform: rotate(-11deg); }
    42% { transform: rotate(11deg); }
    66% { transform: rotate(-8deg); }
    85% { transform: rotate(6deg); }
  }
  @keyframes waveHigh {
    0%, 100% { transform: rotate(-16deg); }
    50% { transform: rotate(18deg); }
  }
  @keyframes waveHighFast {
    0%, 100% { transform: rotate(-22deg); }
    50% { transform: rotate(24deg); }
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(14deg); }
  }
  @keyframes puffSteam {
    0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
    25% { opacity: 0.72; }
    100% { opacity: 0; transform: translate(24px, -28px) scale(1.45); }
  }
  @keyframes swayTree {
    0%, 100% { transform: rotate(-0.9deg); }
    50% { transform: rotate(1.1deg); }
  }
  @keyframes flameDance {
    0%, 100% { transform: scaleY(1) scaleX(1) skewX(-2deg); }
    33% { transform: scaleY(1.14) scaleX(0.93) skewX(3deg); }
    66% { transform: scaleY(0.92) scaleX(1.07) skewX(-3deg); }
  }
  @keyframes floatGentle {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.35) translateY(24px); }
    70% { opacity: 1; transform: scale(1.08) translateY(-4px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes wobbleReject {
    0% { transform: translateX(0) rotate(0); opacity: 1; }
    20% { transform: translateX(-14px) rotate(-12deg); }
    45% { transform: translateX(14px) rotate(12deg); }
    70% { transform: translateX(-8px) rotate(-6deg); opacity: 0.75; }
    100% { transform: translateX(0) translateY(-10px) scale(0.75); opacity: 0.32; }
  }
  @keyframes sparkleRise {
    0% { opacity: 0; transform: translate(0, 0) scale(0.3); }
    25% { opacity: 1; transform: translate(var(--dx), -20px) scale(1.1); }
    100% { opacity: 0; transform: translate(calc(var(--dx) * 2.1), -110px) scale(0.2); }
  }
  @keyframes bubblePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes auroraShift {
    0%, 100% { opacity: 0.25; transform: translateX(-18px) scaleY(1); }
    50% { opacity: 0.55; transform: translateX(22px) scaleY(1.12); }
  }

  .char-root { cursor: pointer; transition: transform 1.25s cubic-bezier(.22,.8,.36,1), filter 0.7s ease; }
  .char-body-anim { transform-origin: 0px 0px; }
  .char-root.walking .char-body-anim { animation: walkBob 0.34s infinite ease-in-out; }
  .char-root.shivering .char-body-anim { animation: shiverHard 0.22s infinite linear; }
  .char-root.warm .char-body-anim { animation: breathIdle 2.6s infinite ease-in-out; }
  .char-root.happy-jump .char-body-anim { animation: warmJump 0.75s ease-out; }
  .char-root.shake-no .char-head-group { animation: headShake 0.65s ease-in-out; }
  .char-root.warm .char-tail { animation: tailWag 1.3s infinite ease-in-out; }

  /* Raised arms for Stage 5 goodbye */
  .arm-wave { display: none; }
  .char-root.waving .arm-idle { display: none; }
  .char-root.waving .arm-wave { display: block; animation: waveHigh 0.68s infinite ease-in-out; }
  .char-root.waving-fast .arm-wave { animation: waveHighFast 0.32s infinite ease-in-out; }

  .char-root.shivering .frost-overlay { opacity: 0.85; }
  .char-root.warm .frost-overlay { opacity: 0; transition: opacity 0.8s; }
  .char-root.shivering .breath-puff { animation: puffSteam 1.9s infinite ease-out; }
  .char-root.warm .breath-puff { opacity: 0; animation: none; }
  .char-root.spotlight { filter: drop-shadow(0 0 22px rgba(255, 206, 112, 0.75)); }

  .sway-slow { transform-origin: bottom center; animation: swayTree 6.5s infinite ease-in-out; }
  .sway-med { transform-origin: bottom center; animation: swayTree 5.2s infinite ease-in-out -1.5s; }
  .float-card { animation: floatGentle 3.2s infinite ease-in-out; }
  .pop-in { animation: popIn 0.55s cubic-bezier(.34,1.56,.64,1) both; }
  .reject-anim { animation: wobbleReject 0.72s ease-out forwards; pointer-events: none; }
  .bubble-ddd { animation: bubblePulse 0.48s infinite ease-in-out; }

  .interactive-zone { cursor: pointer; transition: filter 0.2s; }
  .interactive-zone:hover { filter: brightness(1.15) drop-shadow(0 0 12px rgba(255,222,140,0.6)); }
</style>
</head>
<body>
<div id="stage-wrap">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Dynamic Sky Gradients -->
      <linearGradient id="skyCold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a1c36"/>
        <stop offset="48%" stop-color="#1b3f6b"/>
        <stop offset="85%" stop-color="#4e7ea8"/>
        <stop offset="100%" stop-color="#8ab4d4"/>
      </linearGradient>
      <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#181c45"/>
        <stop offset="42%" stop-color="#4c3568"/>
        <stop offset="76%" stop-color="#b55d59"/>
        <stop offset="100%" stop-color="#f2a968"/>
      </linearGradient>

      <!-- Aurora -->
      <linearGradient id="auroraGrad" x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0%" stop-color="#4de8c2" stop-opacity="0"/>
        <stop offset="30%" stop-color="#6fffe0" stop-opacity="0.45"/>
        <stop offset="65%" stop-color="#a584ff" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="#ff99c8" stop-opacity="0"/>
      </linearGradient>

      <!-- Snow & Hills -->
      <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6d92b5"/>
        <stop offset="100%" stop-color="#355578"/>
      </linearGradient>
      <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9cbcd8"/>
        <stop offset="100%" stop-color="#53789c"/>
      </linearGradient>
      <linearGradient id="snowGround" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d4e7f7"/>
        <stop offset="45%" stop-color="#b4d0e8"/>
        <stop offset="100%" stop-color="#7fa2c4"/>
      </linearGradient>
      <radialGradient id="fireSnowGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffae42" stop-opacity="0.72"/>
        <stop offset="45%" stop-color="#ff7a29" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#ff6200" stop-opacity="0"/>
      </radialGradient>

      <!-- Pine Trees -->
      <linearGradient id="pineDark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1d443d"/>
        <stop offset="100%" stop-color="#0d2424"/>
      </linearGradient>
      <linearGradient id="pineMid" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2c5d4f"/>
        <stop offset="100%" stop-color="#14332d"/>
      </linearGradient>
      <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4e3524"/>
        <stop offset="50%" stop-color="#6e4b34"/>
        <stop offset="100%" stop-color="#382317"/>
      </linearGradient>

      <!-- Stylized Plaque / Ice / Wood Gradients -->
      <linearGradient id="iceCrystal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#87e2ff"/>
        <stop offset="48%" stop-color="#3b9bd1"/>
        <stop offset="100%" stop-color="#1d5b91"/>
      </linearGradient>
      <linearGradient id="warmPlaque" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffd57a"/>
        <stop offset="50%" stop-color="#e88a35"/>
        <stop offset="100%" stop-color="#9e4314"/>
      </linearGradient>
      <linearGradient id="woodBanner" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f3d096"/>
        <stop offset="20%" stop-color="#e3b16d"/>
        <stop offset="85%" stop-color="#bd8140"/>
        <stop offset="100%" stop-color="#8a5523"/>
      </linearGradient>
      <linearGradient id="medallionBg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2a4c6e"/>
        <stop offset="55%" stop-color="#1c3552"/>
        <stop offset="100%" stop-color="#13243b"/>
      </linearGradient>
      <linearGradient id="medallionGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe799"/>
        <stop offset="50%" stop-color="#d9912b"/>
        <stop offset="100%" stop-color="#8a4b12"/>
      </linearGradient>

      <!-- Character Fur & Clothing Gradients -->
      <linearGradient id="parkaGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#c93b42"/>
        <stop offset="60%" stop-color="#9c222a"/>
        <stop offset="100%" stop-color="#69121a"/>
      </linearGradient>
      <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe0c4"/>
        <stop offset="100%" stop-color="#e8b48e"/>
      </linearGradient>
      <linearGradient id="scarfGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#f5ba3b"/>
        <stop offset="50%" stop-color="#d9871c"/>
        <stop offset="100%" stop-color="#f5ba3b"/>
      </linearGradient>
      <linearGradient id="hatGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2d6e7e"/>
        <stop offset="100%" stop-color="#17414d"/>
      </linearGradient>
      <linearGradient id="foxFur" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f07e2b"/>
        <stop offset="55%" stop-color="#cc5214"/>
        <stop offset="100%" stop-color="#8c2e08"/>
      </linearGradient>
      <linearGradient id="creamFur" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff4e4"/>
        <stop offset="100%" stop-color="#dfd0be"/>
      </linearGradient>
      <linearGradient id="bearFur" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8f5d38"/>
        <stop offset="55%" stop-color="#633c20"/>
        <stop offset="100%" stop-color="#3d2210"/>
      </linearGradient>
      <linearGradient id="bearMuzzle" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d4a67d"/>
        <stop offset="100%" stop-color="#a6774e"/>
      </linearGradient>
      <linearGradient id="hareFur" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#eef4f8"/>
        <stop offset="65%" stop-color="#c6d4e0"/>
        <stop offset="100%" stop-color="#92a7ba"/>
      </linearGradient>
      <linearGradient id="sqFur" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#d96a26"/>
        <stop offset="58%" stop-color="#a64312"/>
        <stop offset="100%" stop-color="#6b2508"/>
      </linearGradient>
      <linearGradient id="wolfFur" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#9aa6b2"/>
        <stop offset="55%" stop-color="#687582"/>
        <stop offset="100%" stop-color="#3e4854"/>
      </linearGradient>
      <linearGradient id="wolfLight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e3e9ef"/>
        <stop offset="100%" stop-color="#b4c0cc"/>
      </linearGradient>

      <!-- Fire -->
      <linearGradient id="flameOut" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#d93800"/>
        <stop offset="50%" stop-color="#ff8c00"/>
        <stop offset="100%" stop-color="#ffea54"/>
      </linearGradient>
      <linearGradient id="flameIn" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#ffaa00"/>
        <stop offset="100%" stop-color="#fff8b8"/>
      </linearGradient>

      <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="7" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#071324" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- 1. SKY & LIVING ATMOSPHERE -->
    <rect width="1600" height="900" fill="url(#skyCold)"/>
    <rect id="warm-sky-layer" width="1600" height="900" fill="url(#skyWarm)" opacity="0" style="transition: opacity 1.3s ease;"/>

    <!-- Twinkling Stars & Moon -->
    <g id="stars-layer"></g>
    <g id="moon-group" opacity="0.88">
      <circle cx="1360" cy="140" r="64" fill="#fff4d6" opacity="0.16" filter="url(#softGlow)"/>
      <circle cx="1360" cy="140" r="38" fill="#fff6de"/>
      <circle cx="1348" cy="130" r="9" fill="#e6d6b0" opacity="0.5"/>
      <circle cx="1374" cy="152" r="6" fill="#e6d6b0" opacity="0.4"/>
      <circle cx="1371" cy="126" r="4" fill="#e6d6b0" opacity="0.45"/>
    </g>

    <!-- Subtle Winter Aurora -->
    <path d="M-40,210 Q320,90 680,180 T1420,120 L1640,240 Q1200,290 760,230 T-40,290 Z"
          fill="url(#auroraGrad)" style="animation: auroraShift 9s infinite ease-in-out;"/>

    <!-- 2. DISTANT HILLS & WINTER CABIN SILHOUETTE -->
    <path d="M0,530 Q260,420 560,485 T1180,460 T1600,505 L1600,900 L0,900 Z" fill="url(#hillFar)"/>
    <path d="M0,585 Q380,490 780,550 T1600,535 L1600,900 L0,900 Z" fill="url(#hillMid)"/>

    <!-- Distant Cozy Forest Cabin -->
    <g transform="translate(1155, 452) scale(0.75)" opacity="0.92">
      <path d="M98,12 Q108,-18 122,-32 Q132,-48 126,-66" fill="none" stroke="#dceaf7" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
      <rect x="88" y="8" width="16" height="32" fill="#593a2b"/>
      <polygon points="10,48 64,6 118,48" fill="#7b4b32"/>
      <path d="M4,50 Q64,-2 124,50 Q114,56 104,48 Q64,16 24,48 Q14,56 4,50 Z" fill="#e6f2fc"/>
      <rect x="20" y="48" width="88" height="58" fill="#633d28"/>
      <rect x="35" y="62" width="22" height="22" rx="3" fill="#ffcf66" filter="url(#softGlow)"/>
      <line x1="46" y1="62" x2="46" y2="84" stroke="#633d28" stroke-width="2.5"/>
      <line x1="35" y1="73" x2="57" y2="73" stroke="#633d28" stroke-width="2.5"/>
      <rect x="72" y="65" width="20" height="41" rx="2" fill="#472818"/>
    </g>

    <!-- 3. FOREST TREES -->
    <g id="forest-bg"></g>

    <!-- 4. SNOWY CLEARING GROUND -->
    <path d="M0,635 Q420,580 800,605 T1600,620 L1600,900 L0,900 Z" fill="url(#snowGround)"/>
    <ellipse cx="800" cy="740" rx="580" ry="115" fill="#e8f3fc" opacity="0.45"/>
    <ellipse id="snow-fire-glow" cx="800" cy="735" rx="460" ry="105" fill="url(#fireSnowGlow)" opacity="0" style="transition: opacity 1s ease;"/>

    <!-- 5. CENTRAL CAMPFIRE -->
    <g id="campfire-group" transform="translate(800, 728)">
      <ellipse cx="0" cy="14" rx="74" ry="20" fill="#46596e" opacity="0.5"/>
      <ellipse cx="-52" cy="12" rx="18" ry="11" fill="#687785"/>
      <ellipse cx="-24" cy="19" rx="20" ry="11" fill="#7d8d9c"/>
      <ellipse cx="10" cy="21" rx="21" ry="11" fill="#5e6d7a"/>
      <ellipse cx="42" cy="16" rx="19" ry="10" fill="#7a8996"/>
      <ellipse cx="56" cy="5" rx="15" ry="9" fill="#556470"/>
      <ellipse cx="-56" cy="2" rx="15" ry="9" fill="#5b6a78"/>
      <g>
        <rect x="-46" y="-2" width="92" height="16" rx="7" fill="url(#trunkGrad)" transform="rotate(-14)"/>
        <rect x="-46" y="-2" width="92" height="16" rx="7" fill="url(#trunkGrad)" transform="rotate(15)"/>
        <circle cx="-41" cy="9" r="7" fill="#a87c54"/>
        <circle cx="42" cy="10" r="7" fill="#a87c54"/>
      </g>
      <g id="fire-flames" style="transform: scale(0); transition: transform 0.7s cubic-bezier(.34,1.56,.64,1);">
        <ellipse cx="0" cy="-16" rx="58" ry="42" fill="#ff9524" opacity="0.28" filter="url(#softGlow)"/>
        <g style="animation: flameDance 0.55s infinite ease-in-out; transform-origin: 0px 8px;">
          <path d="M-32,8 C-40,-24 -18,-56 0,-84 C20,-54 42,-24 32,8 C18,18 -18,18 -32,8 Z" fill="url(#flameOut)"/>
          <path d="M-20,6 C-22,-18 -8,-42 2,-58 C14,-38 24,-14 18,6 C8,14 -10,14 -20,6 Z" fill="url(#flameIn)"/>
          <path d="M-40,5 C-44,-14 -28,-32 -18,-44 C-14,-20 -16,2 -28,10 Z" fill="#ff6a00" opacity="0.85"/>
          <path d="M40,5 C44,-14 28,-32 18,-44 C14,-20 16,2 28,10 Z" fill="#ff6a00" opacity="0.85"/>
        </g>
      </g>
    </g>

    <!-- 6. BIG LETTER Д -->
    <g id="big-letter-layer"></g>

    <!-- 7. CHARACTERS LAYER -->
    <g id="characters-layer"></g>

    <!-- 8. STAGE OVERLAYS -->
    <g id="overlay-layer"></g>
    <g id="fx-layer"></g>

    <!-- 9. FOREGROUND SNOW -->
    <g id="snow-layer" pointer-events="none"></g>
    <path d="M-20,860 Q220,815 480,872 T1120,855 T1630,835 L1630,920 L-20,920 Z" fill="#dbeafa" opacity="0.72" pointer-events="none"/>
  </svg>

  <!-- Minimalist UI Controls -->
  <button id="sound-btn" class="ctrl-btn" aria-label="sound">
    <svg id="sound-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>

  /* ===================== SCENERY GENERATION ===================== */
  function buildScenery() {
    const stars = document.getElementById('stars-layer');
    for (let i = 0; i < 65; i++) {
      const cx = (Math.sin(i * 97.3) * 0.5 + 0.5) * 1600;

      const r = 1 + (i % 3) * 0.85;
      el('circle', {
        cx: cx.toFixed(1), cy: cy.toFixed(1), r,
        fill: i % 4 === 0 ? '#ffe7b3' : '#d8eeff',
        opacity: (0.35 + (i % 5) * 0.14).toFixed(2)
      }, stars);
    }

    const forest = document.getElementById('forest-bg');
    const treePositions = [
      { x: 55, y: 635, s: 1.25, c: 'pineDark', cls: 'sway-slow' },
      { x: 165, y: 605, s: 0.95, c: 'pineMid', cls: 'sway-med' },
      { x: 295, y: 580, s: 0.78, c: 'pineDark', cls: 'sway-slow' },
      { x: 425, y: 565, s: 0.65, c: 'pineMid', cls: 'sway-med' },
      { x: 650, y: 555, s: 0.58, c: 'pineDark', cls: 'sway-slow' },
      { x: 960, y: 555, s: 0.62, c: 'pineDark', cls: 'sway-med' },
      { x: 1320, y: 585, s: 0.84, c: 'pineMid', cls: 'sway-slow' },
      { x: 1455, y: 615, s: 1.08, c: 'pineDark', cls: 'sway-med' },
      { x: 1560, y: 645, s: 1.32, c: 'pineMid', cls: 'sway-slow' }
    ];

    treePositions.forEach(t => {
      const g = el('g', { transform: `translate(${t.x},${t.y}) scale(${t.s})` }, forest);
      const inner = el('g', { class: t.cls }, g);
      el('rect', { x: -12, y: -35, width: 24, height: 48, fill: 'url(#trunkGrad)' }, inner);
      [
        { y: -35, w: 92, h: 95 },
        { y: -95, w: 74, h: 86 },
        { y: -152, w: 54, h: 78 }
      ].forEach(tier => {
        el('polygon', {
          points: `${-tier.w},${tier.y} 0,${tier.y - tier.h} ${tier.w},${tier.y}`,
          fill: `url(#${t.c})`
        }, inner);
        el('path', {
          d: `M${-tier.w * 0.62},${tier.y - tier.h * 0.38} L0,${tier.y - tier.h} L${tier.w * 0.62},${tier.y - tier.h * 0.38} Q${tier.w * 0.28},${tier.y - tier.h * 0.22} 0,${tier.y - tier.h * 0.42} Q${-tier.w * 0.28},${tier.y - tier.h * 0.22} ${-tier.w * 0.62},${tier.y - tier.h * 0.38} Z`,
          fill: '#e3f1fc', opacity: '0.88'
        }, inner);
      });
    });

    const snowLayer = document.getElementById('snow-layer');
    for (let i = 0; i < 48; i++) {
      const x = Math.random() * 1600;
      const r = 1.6 + Math.random() * 3.4;
      const dur = 7 + Math.random() * 9;
      const delay = -Math.random() * dur;
      const c = el('circle', {
        cx: x.toFixed(1), cy: -10, r: r.toFixed(1),
        fill: '#ffffff', opacity: (0.35 + Math.random() * 0.5).toFixed(2)
      }, snowLayer);
      c.innerHTML = `
        <animate attributeName="cy" from="-15" to="915" dur="${dur.toFixed(1)}s" begin="${delay.toFixed(1)}s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="${x.toFixed(1)};${(x + 38).toFixed(1)};${(x - 22).toFixed(1)};${x.toFixed(1)}" dur="${(dur * 0.8).toFixed(1)}s" begin="${delay.toFixed(1)}s" repeatCount="indefinite"/>
      `;
    }
  }

  /* ===================== VISUAL FX HELPERS ===================== */
  function spawnSparkles(x, y, color = '#ffe073', count = 14) {
    const fx = document.getElementById('fx-layer');
    for (let i = 0; i < count; i++) {
      const dx = (Math.random() - 0.5) * 110;
      const g = el('g', {
        transform: `translate(${x + (Math.random()-0.5)*36}, ${y + (Math.random()-0.5)*26})`
      }, fx);
      el('path', {
        d: 'M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5 Z',
        fill: i % 3 === 0 ? '#ffffff' : color,
        style: `--dx:${dx.toFixed(1)}px; animation: sparkleRise ${(0.8 + Math.random()*0.6).toFixed(2)}s ease-out forwards;`
      }, g);
      setTimeout(() => g.remove(), 1450);
    }
  }

  function updateWarmthVisuals(level) {
    const ratio = Math.min(1, Math.max(0, level / 6));
    document.getElementById('warm-sky-layer').setAttribute('opacity', (ratio * 0.92).toFixed(2));
    document.getElementById('snow-fire-glow').setAttribute('opacity', (ratio * 0.95).toFixed(2));
    const fireScale = level === 0 ? 0 : (0.45 + ratio * 0.72);
    document.getElementById('fire-flames').style.transform = `scale(${fireScale.toFixed(2)})`;
  }

  /* ===================== GAME STATE ===================== */
  let lang = 'uk';
  let stage = 1;
  let timers = [];
  const charEls = {};

  let stage2State = [];
  let stage3Items = [];
  let stage4ActiveChar = 0;
  let stage4WordIdx = 0;
  let stage4WordQueue = [];
  let stage4SparkCount = 0;

  function clearTimers() {
    timers.forEach(t => clearTimeout(t));
    timers = [];
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setCharTransform(g, x, y, scale) {
    g.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }

  function initCharacters() {
    const layer = document.getElementById('characters-layer');
    layer.innerHTML = '';
    CHAR_SPECS.forEach((spec, idx) => {
      const g = el('g', {
        id: `char-${spec.id}`,
        class: 'char-root'
      }, layer);
      setCharTransform(g, spec.startX, spec.y, spec.scale);
      g.innerHTML = getCharacterSVG(spec.id);
      g.addEventListener('click', () => onCharacterClick(idx));
      charEls[spec.id] = g;
    });
  }

  function triggerHappyJump(idx) {
    const g = charEls[CHAR_SPECS[idx].id];
    g.classList.remove('happy-jump');
    void g.offsetWidth;
    g.classList.add('happy-jump');
    setTimeout(() => g.classList.remove('happy-jump'), 800);
  }

  function triggerHeadShake(idx) {
    const g = charEls[CHAR_SPECS[idx].id];
    g.classList.remove('shake-no');
    void g.offsetWidth;
    g.classList.add('shake-no');
    setTimeout(() => g.classList.remove('shake-no'), 700);
  }

  /* ===================== STAGE 1: FREEZING & LETTER Д ===================== */
  function startStage1() {
    clearTimers();
    stage = 1;
    document.getElementById('refresh-btn').classList.remove('visible');
    document.getElementById('overlay-layer').innerHTML = '';
    document.getElementById('big-letter-layer').innerHTML = '';
    updateWarmthVisuals(0);

    CHAR_SPECS.forEach(spec => {
      const g = charEls[spec.id];
      g.className.baseVal = 'char-root';
      g.style.transition = 'none';
      setCharTransform(g, spec.startX, spec.y, spec.scale);
    });

    void document.getElementById('scene').getBoundingClientRect();

    // 1. Human walks in first
    const human = CHAR_SPECS[0];
    const hg = charEls[human.id];
    hg.style.transition = 'transform 1.35s cubic-bezier(.22,.8,.36,1)';
    hg.classList.add('walking');
    timers.push(setTimeout(() => {
      setCharTransform(hg, human.x, human.y, human.scale);
    }, 60));

    timers.push(setTimeout(() => {
      hg.classList.remove('walking');
      hg.classList.add('shivering');
      addDDDBubble(0);
      SFX.shiverDDD();
    }, 1420));

    // 2. Frosty carved Letter Д appears prominently in the sky
    timers.push(setTimeout(() => {
      renderBigLetterD();
      SFX.iceChime();
    }, 1900));

    // 3. Woodland animals join one by one
    [1, 2, 3, 4, 5].forEach((idx, order) => {
      timers.push(setTimeout(() => {
        const sp = CHAR_SPECS[idx];
        const cg = charEls[sp.id];
        cg.style.transition = 'transform 1.1s cubic-bezier(.22,.8,.36,1)';
        cg.classList.add('walking');
        setCharTransform(cg, sp.x, sp.y, sp.scale);

        timers.push(setTimeout(() => {
          cg.classList.remove('walking');
          cg.classList.add('shivering');
          addDDDBubble(idx);
          SFX.shiverDDD();
        }, 1120));
      }, 2450 + order * 650));
    });
  }

  function addDDDBubble(idx) {
    const overlay = document.getElementById('overlay-layer');
    const sp = CHAR_SPECS[idx];
    const old = document.getElementById(`ddd-${idx}`);
    if (old) old.remove();

    const bx = sp.x;
    const by = sp.y - 215 * sp.scale;
    // Outer wrapper holds SVG translate; inner holds CSS animations (no conflict!)
    const posWrap = el('g', {
      id: `ddd-${idx}`,
      transform: `translate(${bx}, ${by})`
    }, overlay);

    const popWrap = el('g', { class: 'pop-in' }, posWrap);
    const inner = el('g', { class: 'bubble-ddd interactive-zone' }, popWrap);

    el('path', {
      d: 'M-52,-18 C-56,-34 -34,-44 -14,-38 C-4,-50 22,-48 30,-34 C52,-36 62,-14 48,0 C54,14 34,24 14,18 L2,32 L-8,18 C-34,24 -58,10 -52,-18 Z',
      fill: 'url(#iceCrystal)', stroke: '#c7f2ff', 'stroke-width': '2.5',
      filter: 'url(#dropShadow)'
    }, inner);

    const txt = el('text', {
      x: 0, y: -4, 'text-anchor': 'middle', 'dominant-baseline': 'middle',

    }, inner);
    txt.textContent = LANG_DATA[lang].ddd;

    inner.addEventListener('click', () => {
      SFX.shiverDDD();
      spawnSparkles(bx, by, '#a8ecff', 8);
    });
  }

    const posWrap = el('g', { transform: 'translate(800, 205)' }, layer);

    }, fl);

  /* ===================== STAGE 2: SYLLABLES & WARMING UP ===================== */
  function startStage2() {
    clearTimers();
    stage = 2;
    document.getElementById('big-letter-layer').innerHTML = '';
    document.getElementById('refresh-btn').classList.add('visible');

    const vowels = shuffle(LANG_DATA[lang].vowels);
    stage2State = CHAR_SPECS.map((_, i) => ({
      vowel: vowels[i],
      pos: null,
      warm: false
    }));

    updateWarmthVisuals(0);

    CHAR_SPECS.forEach((sp) => {
      const cg = charEls[sp.id];
      cg.style.transition = 'transform 0.8s ease';
      cg.className.baseVal = 'char-root shivering';
      setCharTransform(cg, sp.x, sp.y, sp.scale);
    });

    renderStage2Plaques();
  }

  function renderStage2Plaques() {
    const overlay = document.getElementById('overlay-layer');
    overlay.innerHTML = '';

    CHAR_SPECS.forEach((sp, idx) => {
      const st = stage2State[idx];
      const px = sp.x;
      const py = sp.y - 235 * sp.scale;

      const posWrap = el('g', {
        id: `plaque-${idx}`,
        transform: `translate(${px}, ${py})`
      }, overlay);

      const card = el('g', { class: 'float-card' }, posWrap);
      card.style.animationDelay = `${idx * 0.28}s`;

      const bgFill = st.warm ? 'url(#warmPlaque)' : 'url(#iceCrystal)';
      const strokeCol = st.warm ? '#fff1b8' : '#ccf4ff';

      el('path', {
        d: 'M-66,-44 Q0,-56 66,-44 Q78,0 66,44 Q0,56 -66,44 Q-78,0 -66,-44 Z',
        fill: bgFill, stroke: strokeCol, 'stroke-width': '3.5',
        filter: 'url(#dropShadow)'
      }, card);

      el('path', {
        d: 'M-56,-34 Q0,-44 56,-34 Q66,0 56,34 Q0,44 -56,34 Q-66,0 -56,-34 Z',
        fill: 'rgba(10, 26, 48, 0.25)', stroke: 'rgba(255,255,255,0.35)', 'stroke-width': '1.5'
      }, card);

      if (!st.pos) {
        const leftZone = el('g', { class: 'interactive-zone' }, card);
        el('rect', { x: -64, y: -40, width: 42, height: 80, rx: 14, fill: 'transparent' }, leftZone);
        el('circle', { cx: -42, cy: 0, r: 9, fill: '#ffe58f', opacity: '0.82' }, leftZone);
        leftZone.addEventListener('click', (e) => {
          e.stopPropagation();
          revealSyllable(idx, 'before');
        });

        const rightZone = el('g', { class: 'interactive-zone' }, card);
        el('rect', { x: 22, y: -40, width: 42, height: 80, rx: 14, fill: 'transparent' }, rightZone);
        el('circle', { cx: 42, cy: 0, r: 9, fill: '#ffe58f', opacity: '0.82' }, rightZone);
        rightZone.addEventListener('click', (e) => {
          e.stopPropagation();
          revealSyllable(idx, 'after');
        });

        const centerD = el('text', {
          x: 0, y: 6, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
          fill: '#ffffff', 'font-size': '56', 'font-weight': '900',
          class: 'interactive-zone'
        }, card);
        centerD.textContent = LANG_DATA[lang].letter;
        centerD.addEventListener('click', (e) => {
          e.stopPropagation();
          revealSyllable(idx, 'after');
        });
      } else {
        const syl = st.pos === 'after' ? `${LANG_DATA[lang].letter}${st.vowel}` : `${st.vowel}${LANG_DATA[lang].letter}`;
        const hit = el('g', { class: 'interactive-zone' }, card);
        el('rect', { x: -66, y: -44, width: 132, height: 88, fill: 'transparent' }, hit);

        const t1 = el('text', {
          x: 0, y: 6, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
          fill: '#ffffff', 'font-size': '54', 'font-weight': '900',
          style: 'text-shadow: 0 3px 8px rgba(0,0,0,0.45);'
        }, hit);
        t1.textContent = syl;

        if (st.warm) {
          el('circle', { cx: 52, cy: -34, r: 10, fill: '#fff5b8', filter: 'url(#softGlow)' }, card);
        }

        hit.addEventListener('click', (e) => {
          e.stopPropagation();
          warmCharacter(idx);
        });
      }
    });
  }

  function revealSyllable(idx, pos) {
    stage2State[idx].pos = pos;
    SFX.syllablePop();
    const sp = CHAR_SPECS[idx];
    spawnSparkles(sp.x, sp.y - 235 * sp.scale, '#a8ecff', 10);
    renderStage2Plaques();
  }

  function warmCharacter(idx) {
    const st = stage2State[idx];
    if (!st.pos) {
      revealSyllable(idx, 'after');
      return;
    }
    const wasWarm = st.warm;
    st.warm = true;

    const sp = CHAR_SPECS[idx];
    const cg = charEls[sp.id];
    cg.classList.remove('shivering');
    cg.classList.add('warm');
    triggerHappyJump(idx);

    const warmedCount = stage2State.filter(s => s.warm).length;
    updateWarmthVisuals(warmedCount);
    SFX.warmUp(warmedCount - 1);

    spawnSparkles(sp.x, sp.y - 120 * sp.scale, '#ffcf5c', 18);
    spawnSparkles(800, 690, '#ff8c2b', 12);
    renderStage2Plaques();

    if (!wasWarm && warmedCount === CHAR_SPECS.length) {
      timers.push(setTimeout(() => {
        CHAR_SPECS.forEach((_, i) => triggerHappyJump(i));
        spawnSparkles(800, 650, '#ffe073', 26);
      }, 450));
    }
  }

  /* ===================== STAGE 3: PICTURES ON Д + STORY REACTIONS ===================== */
  function startStage3() {
    clearTimers();
    stage = 3;
    document.getElementById('big-letter-layer').innerHTML = '';
    document.getElementById('refresh-btn').classList.add('visible');
    updateWarmthVisuals(6);

    CHAR_SPECS.forEach((sp) => {
      const cg = charEls[sp.id];
      cg.style.transition = 'transform 0.7s ease';
      cg.className.baseVal = 'char-root warm';
      setCharTransform(cg, sp.x, sp.y, sp.scale);
    });

    generateStage3Round();
  }

  function generateStage3Round() {
    const dPics = shuffle(PICTURES.filter(p => p.isD));
    const nonDPics = shuffle(PICTURES.filter(p => !p.isD));
    const numD = Math.random() < 0.5 ? 3 : 4;
    const chosen = shuffle([
      ...dPics.slice(0, numD),
      ...nonDPics.slice(0, 6 - numD)
    ]);

    stage3Items = chosen.map(pic => ({ pic, resolved: false, rejected: false }));
    renderStage3Pictures();
  }

  function renderStage3Pictures() {
    const overlay = document.getElementById('overlay-layer');
    overlay.innerHTML = '';

    CHAR_SPECS.forEach((sp, idx) => {
      const item = stage3Items[idx];
      const mx = sp.x;
      const my = sp.y - 258 * sp.scale;

      const posWrap = el('g', {
        id: `pic-med-${idx}`,
        transform: `translate(${mx}, ${my})`
      }, overlay);

      const stateWrap = el('g', {
        class: item.rejected ? 'reject-anim' : 'pop-in'
      }, posWrap);
      if (!item.rejected) stateWrap.style.animationDelay = `${idx * 0.06}s`;

      const card = el('g', {
        class: item.rejected ? '' : 'float-card interactive-zone'
      }, stateWrap);
      if (!item.rejected) card.style.animationDelay = `${idx * 0.25}s`;

      el('circle', {
        cx: 0, cy: 0, r: 62,
        fill: 'url(#medallionGold)', filter: 'url(#dropShadow)'
      }, card);
      el('circle', {
        cx: 0, cy: 0, r: 54,
        fill: item.resolved ? 'url(#warmPlaque)' : 'url(#medallionBg)',
        stroke: item.resolved ? '#fff6bd' : '#73a5cc', 'stroke-width': '2.5'
      }, card);

      el('path', {
        d: 'M-14,-58 Q0,-72 14,-58 Q0,-52 -14,-58 Z',
        fill: '#479458'
      }, card);

      const art = el('g', { transform: 'scale(1.06)' }, card);
      art.innerHTML = item.pic.draw();

      if (item.resolved) {
        el('circle', { cx: 42, cy: -42, r: 15, fill: '#3cb35a', stroke: '#fff5b8', 'stroke-width': '2.5' }, card);
        el('polyline', {
          points: '35,-42 40,-37 50,-48',
          fill: 'none', stroke: '#ffffff', 'stroke-width': '3.5', 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
        }, card);
      } else if (!item.rejected) {
        card.addEventListener('click', () => handlePictureClick(idx));
      }
    });
  }

  function handlePictureClick(idx) {
    const item = stage3Items[idx];
    if (item.resolved || item.rejected) return;

    if (item.pic.isD) {
      item.resolved = true;
      SFX.storyCorrect(item.pic.reaction);
      triggerHappyJump(idx);
      spawnStoryReaction(idx, item.pic.reaction);
      renderStage3Pictures();

      const remaining = stage3Items.filter(it => it.pic.isD && !it.resolved).length;
      if (remaining === 0) {
        timers.push(setTimeout(() => {
          CHAR_SPECS.forEach((_, i) => triggerHappyJump(i));
          spawnSparkles(800, 420, '#ffe073', 28);
          SFX.warmUp(5);
        }, 650));
      }
    } else {
      item.rejected = true;
      SFX.wrongBoing();
      triggerHeadShake(idx);
      renderStage3Pictures();
    }
  }

  function spawnStoryReaction(idx, type) {
    const fx = document.getElementById('fx-layer');
    const sp = CHAR_SPECS[idx];
    const x = sp.x;
    const y = sp.y - 145 * sp.scale;

    spawnSparkles(x, y - 40, '#ffe073', 16);

    const posWrap = el('g', { transform: `translate(${x}, ${y})` }, fx);
    const prop = el('g', { class: 'pop-in' }, posWrap);

    if (type === 'rain') {
      prop.innerHTML = `
        <g transform="translate(0, -45)">
          <path d="M-56,0 C-52,-42 52,-42 56,0 Q28,-12 0,0 Q-28,-12 -56,0 Z" fill="#e64553" stroke="#991a26" stroke-width="2"/>
          <path d="M-20,-34 Q0,-44 20,-34 L0,0 Z" fill="#ffd147"/>
          <path d="M0,0 L0,48 Q0,58 -10,58" fill="none" stroke="#5e3a1e" stroke-width="4" stroke-linecap="round"/>
        </g>`;
    } else if (type === 'melon') {
      prop.innerHTML = `
        <g transform="translate(36, 10) rotate(-14)">
          <path d="M-30,0 Q0,34 30,0 Z" fill="#5da62b"/>
          <path d="M-26,-2 Q0,27 26,-2 Z" fill="#ffe173"/>
          <circle cx="-6" cy="6" r="2" fill="#9c6216"/><circle cx="6" cy="8" r="2" fill="#9c6216"/>
        </g>`;
    } else if (type === 'woodpecker') {
      prop.innerHTML = `
        <g transform="translate(0, -48)">
          <path d="M-28,0 Q-16,-16 0,-6" fill="none" stroke="#ffe173" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="-28" cy="4" r="6" fill="#ff5252"/>
          <circle cx="26" cy="-12" r="6" fill="#ffd954"/>
          <path d="M26,-12 L26,-34 L40,-28" fill="none" stroke="#ffd954" stroke-width="3.5" stroke-linecap="round"/>
        </g>`;
    } else if (type === 'house') {
      prop.innerHTML = `
        <g transform="translate(0, -42)">
          <path d="M0,12 C-18,-2 -24,-18 -10,-22 C-2,-24 0,-14 0,-14 C0,-14 2,-24 10,-22 C24,-18 18,-2 0,12 Z" fill="#ff7070" filter="url(#softGlow)"/>
        </g>`;
    } else if (type === 'dolphin') {
      prop.innerHTML = `
        <path d="M-54,10 Q0,-64 54,10" fill="none" stroke="#7be0ff" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" filter="url(#softGlow)"/>`;
    } else {
      prop.innerHTML = `
        <g transform="translate(0, -40)">
          <ellipse cx="-32" cy="-8" rx="12" ry="6" fill="#f5b83d" transform="rotate(-30 -32 -8)"/>
          <ellipse cx="34" cy="-14" rx="12" ry="6" fill="#6bc953" transform="rotate(25 34 -14)"/>
          <ellipse cx="4" cy="-30" rx="10" ry="5" fill="#ff903b" transform="rotate(-10 4 -30)"/>
        </g>`;
    }

    timers.push(setTimeout(() => posWrap.remove(), 1700));
  }

  /* ===================== STAGE 4: WRITTEN WORD FOR ADJECTIVES ===================== */
  function startStage4() {
    clearTimers();
    stage = 4;
    document.getElementById('big-letter-layer').innerHTML = '';
    document.getElementById('refresh-btn').classList.add('visible');
    updateWarmthVisuals(6);

    stage4WordQueue = shuffle(LANG_DATA[lang].words);
    stage4WordIdx = 0;
    stage4ActiveChar = 0;
    stage4SparkCount = 0;

    renderStage4Word();
  }

  function renderStage4Word() {
    const overlay = document.getElementById('overlay-layer');
    overlay.innerHTML = '';

    CHAR_SPECS.forEach((sp, idx) => {
      const cg = charEls[sp.id];
      cg.style.transition = 'transform 0.55s cubic-bezier(.34,1.56,.64,1), filter 0.4s';
      if (idx === stage4ActiveChar) {
        cg.className.baseVal = 'char-root warm spotlight';
        setCharTransform(cg, sp.x, sp.y + 18, +(sp.scale * 1.12).toFixed(2));
      } else {
        cg.className.baseVal = 'char-root warm';
        setCharTransform(cg, sp.x, sp.y, sp.scale);
      }
    });

    const sp = CHAR_SPECS[stage4ActiveChar];
    const word = stage4WordQueue[stage4WordIdx % stage4WordQueue.length];

    const bx = Math.max(270, Math.min(1330, sp.x));
    const by = 275;

    // Separate positioning wrapper from CSS pop-in / float animations!
    const posWrap = el('g', { transform: `translate(${bx}, ${by})` }, overlay);
    const popWrap = el('g', { class: 'pop-in' }, posWrap);
    const fl = el('g', { class: 'float-card interactive-zone' }, popWrap);

    const w = Math.max(290, word.length * 42 + 95);
    const hw = w / 2;

    const tailX = Math.max(-hw + 40, Math.min(hw - 40, sp.x - bx));
    el('polygon', {
      points: `${tailX - 20},52 ${tailX + 20},52 ${tailX},84`,
      fill: '#a6682e', stroke: '#593212', 'stroke-width': '3'
    }, fl);

    el('rect', { x: -hw - 16, y: -64, width: 22, height: 128, rx: 10, fill: '#6e3d19', stroke: '#3d1f0a', 'stroke-width': '2.5' }, fl);
    el('rect', { x: hw - 6, y: -64, width: 22, height: 128, rx: 10, fill: '#6e3d19', stroke: '#3d1f0a', 'stroke-width': '2.5' }, fl);

    el('path', {
      d: `M${-hw},-52 Q0,-64 ${hw},-52 L${hw},52 Q0,64 ${-hw},52 Z`,
      fill: 'url(#woodBanner)', stroke: '#693c18', 'stroke-width': '4',
      filter: 'url(#dropShadow)'
    }, fl);

    el('path', {
      d: `M${-hw + 14},-42 Q0,-51 ${hw - 14},-42 L${hw - 14},42 Q0,51 ${-hw + 14},42 Z`,
      fill: 'none', stroke: 'rgba(255, 240, 200, 0.5)', 'stroke-width': '2'
    }, fl);
    [[-hw + 22, -32], [hw - 22, -32], [-hw + 22, 32], [hw - 22, 32]].forEach(([rx, ry]) => {
      el('circle', { cx: rx, cy: ry, r: 5, fill: '#ffdf85', stroke: '#7a4a18', 'stroke-width': '1.5' }, fl);
    });

    const txt = el('text', {
      x: 0, y: 6, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: '#3d1b06', 'font-size': '64', 'font-weight': '900', 'letter-spacing': '3',
      style: 'text-shadow: 0 2px 0 rgba(255,244,214,0.65);'
    }, fl);
    txt.textContent = word;

    fl.addEventListener('click', () => rewardAdjective(bx, by));
  }

  function rewardAdjective(x, y) {
    SFX.adjectiveSpark(stage4SparkCount++);
    triggerHappyJump(stage4ActiveChar);
    const sp = CHAR_SPECS[stage4ActiveChar];
    spawnSparkles(x, y - 35, '#ffe066', 14);
    spawnSparkles(sp.x, sp.y - 130 * sp.scale, '#ff9f43', 10);
  }

  function nextStage4Word(targetCharIdx = null) {
    stage4WordIdx++;
    if (stage4WordIdx >= stage4WordQueue.length) {
      stage4WordQueue = shuffle(LANG_DATA[lang].words);
      stage4WordIdx = 0;
    }
    stage4ActiveChar = targetCharIdx !== null ? targetCharIdx : (stage4ActiveChar + 1) % CHAR_SPECS.length;
    SFX.syllablePop();
    renderStage4Word();
  }

  /* ===================== STAGE 5: WAVING GOODBYE (HANDS HIGH UP!) ===================== */
  function startStage5() {
    clearTimers();
    stage = 5;
    document.getElementById('big-letter-layer').innerHTML = '';
    document.getElementById('overlay-layer').innerHTML = '';
    document.getElementById('refresh-btn').classList.remove('visible');
    updateWarmthVisuals(6);

    CHAR_SPECS.forEach((sp, idx) => {
      const cg = charEls[sp.id];
      cg.style.transition = 'transform 0.8s ease';
      cg.className.baseVal = 'char-root warm waving';
      setCharTransform(cg, sp.x, sp.y, sp.scale);
      timers.push(setTimeout(() => spawnSparkles(sp.x, sp.y - 165 * sp.scale, '#ffe28a', 10), idx * 180));
    });

    SFX.farewellMelody();
  }

  /* ===================== CHARACTER INTERACTIONS ===================== */
  function onCharacterClick(idx) {
    const sp = CHAR_SPECS[idx];
    if (stage === 1) {
      SFX.shiverDDD();
      addDDDBubble(idx);
      spawnSparkles(sp.x, sp.y - 140 * sp.scale, '#a8ecff', 8);
    } else if (stage === 2) {
      warmCharacter(idx);
    } else if (stage === 3) {
      handlePictureClick(idx);
    } else if (stage === 4) {
      if (idx === stage4ActiveChar) {
        const bx = Math.max(270, Math.min(1330, sp.x));
        rewardAdjective(bx, 275);
      } else {
        nextStage4Word(idx);
      }
    } else if (stage === 5) {
      const cg = charEls[sp.id];
      cg.classList.add('waving-fast');
      triggerHappyJump(idx);
      SFX.adjectiveSpark(idx);
      spawnSparkles(sp.x, sp.y - 165 * sp.scale, '#ffd86b', 16);
      setTimeout(() => cg.classList.remove('waving-fast'), 1100);
    }
  }

  /* ===================== UI BUTTON HANDLERS ===================== */
  document.getElementById('next-btn').addEventListener('click', () => {
    SFX.syllablePop();
    if (stage === 1) startStage2();
    else if (stage === 2) startStage3();
    else if (stage === 3) startStage4();
    else if (stage === 4) startStage5();
    else startStage1();
  });

  document.getElementById('refresh-btn').addEventListener('click', () => {
    SFX.syllablePop();
    if (stage === 2) startStage2();
    else if (stage === 3) generateStage3Round();
    else if (stage === 4) nextStage4Word();
  });

  document.getElementById('lang-btn').addEventListener('click', () => {
    lang = lang === 'uk' ? 'ru' : 'uk';
    document.getElementById('lang-btn').textContent = LANG_DATA[lang].btn;
    document.getElementById('next-label').textContent = LANG_DATA[lang].next;
    SFX.syllablePop();

    if (stage === 1) {
      CHAR_SPECS.forEach((_, idx) => {
        if (document.getElementById(`ddd-${idx}`)) addDDDBubble(idx);
      });
    } else if (stage === 2) {
      const vowels = shuffle(LANG_DATA[lang].vowels);
      stage2State.forEach((st, i) => { st.vowel = vowels[i]; });
      renderStage2Plaques();
    } else if (stage === 4) {
      stage4WordQueue = shuffle(LANG_DATA[lang].words);
      stage4WordIdx = 0;
      renderStage4Word();
    }
  });

  document.getElementById('sound-btn').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    document.getElementById('sound-icon').innerHTML = soundEnabled
      ? `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`
      : `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
  });

  /* ===================== BOOTSTRAP ===================== */
  buildScenery();
  initCharacters();
  startStage1();
})();
</script>
</body>
</html>
