        ctx.lineJoin = 'round';
        ctx.strokeText(text, 0, 2);

        const textGrad = ctx.createLinearGradient(0, -55, 0, 55);
        textGrad.addColorStop(0, '#ffffff');
        textGrad.addColorStop(0.55, '#fff5b8');
        textGrad.addColorStop(1, '#ffd32a');
        ctx.fillStyle = textGrad;
        ctx.fillText(text, 0, 2);

        ctx.restore();
      }

      // Helper to distribute chasing bulbs evenly along the marquee rounded rectangle
      function getRoundedRectPerimeterPoint(u, w, h, r) {
        const hw = w * 0.5;
        const hh = h * 0.5;
        const straightW = w - 2 * r;
        const straightH = h - 2 * r;
        const arcLen = Math.PI * 0.5 * r;
        const total = 2 * straightW + 2 * straightH + 4 * arcLen;
        let d = (u % 1) * total;

        if (d < straightW) return { x: -hw + r + d, y: -hh };
        d -= straightW;
        if (d < arcLen) {
          const a = -Math.PI * 0.5 + (d / arcLen) * Math.PI * 0.5;
          return { x: hw - r + Math.cos(a) * r, y: -hh + r + Math.sin(a) * r };
        }
        d -= arcLen;
        if (d < straightH) return { x: hw, y: -hh + r + d };
        d -= straightH;
        if (d < arcLen) {
          const a = (d / arcLen) * Math.PI * 0.5;
          return { x: hw - r + Math.cos(a) * r, y: hh - r + Math.sin(a) * r };
        }
        d -= arcLen;
        if (d < straightW) return { x: hw - r - d, y: hh };
        d -= straightW;
        if (d < arcLen) {
          const a = Math.PI * 0.5 + (d / arcLen) * Math.PI * 0.5;
          return { x: -hw + r + Math.cos(a) * r, y: hh - r + Math.sin(a) * r };
        }
        d -= arcLen;
        if (d < straightH) return { x: -hw, y: hh - r - d };
        d -= straightH;
        const a = Math.PI + (d / arcLen) * Math.PI * 0.5;
        return { x: -hw + r + Math.cos(a) * r, y: -hh + r + Math.sin(a) * r };
      }

      /* =========================================================================
       * 11. FIVE EXPRESSIVE CARTOON CHARACTERS (Letter Д)
       *     All with blinking cursor-tracking eyes, arms/gloves, legs/sneakers!
       * ========================================================================= */
      function drawCharacter(ctx, ch, isDancer = false) {
        const kind = CHARACTER_DEFS[ch.id].kind;
        const t = game.time;
        const ph = ch.idlePhase;

        ctx.save();

        // Soft glowing hover ring on floor when hovered
        if (!isDancer && ch.hoverBoost > 0.02) {
          ctx.save();
          ctx.globalAlpha = ch.hoverBoost * 0.7;
          ctx.strokeStyle = '#ffe66d';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.ellipse(ch.x, ch.y + 8, 66 + ch.hoverBoost * 8, 20, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Ground shadow
        const baseGroundY = isDancer ? DANCE_CENTER_Y : ch.homeY;
        const lift = Math.max(0, baseGroundY - ch.y);
        const shadowScale = Math.max(0.32, 1 - lift / 360) * ch.spawnPop;
        ctx.fillStyle = 'rgba(14, 4, 34, 0.42)';
        ctx.beginPath();
        ctx.ellipse(ch.x, Math.max(ch.y, baseGroundY) + 10, 56 * shadowScale, 15 * shadowScale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Idle transforms (gentle disco bobbing to the beat)
        let ox = 0;
        let oy = 0;
        let rot = ch.rotation;
        let sx = ch.scaleX * ch.spawnPop;
        let sy = ch.scaleY * ch.spawnPop;

        if (!isDancer) {
          const beatBob = Math.abs(Math.sin(game.beatPhase * Math.PI + ph));
          oy = -beatBob * 10;
          rot += Math.sin(game.beatPhase * Math.PI * 0.5 + ph) * 0.055;

          if (ch.hoverBoost > 0.01) {
            sx *= 1 + ch.hoverBoost * 0.12;
            sy *= 1 + ch.hoverBoost * 0.12;
            oy -= ch.hoverBoost * 16;
          }

          if (ch.wrongTimer > 0) {
            const wp = ch.wrongTimer / 0.62;
            ox += Math.sin(wp * Math.PI * 7) * 16 * wp;
            oy -= Math.abs(Math.sin(wp * Math.PI * 3)) * 20 * wp;
            rot += Math.sin(wp * Math.PI * 7) * 0.22 * wp;
          }
        }

        ctx.translate(ch.x + ox, ch.y + oy);
        ctx.rotate(rot);
        ctx.scale(sx, sy);

        // Gaze tracking toward cursor (or center stage when dancing)
        const tx = game.pointer.active ? game.pointer.x : DANCE_CENTER_X;
        const ty = game.pointer.active ? game.pointer.y : DANCE_CENTER_Y;
        const gdx = tx - ch.x;
        const gdy = ty - (ch.y - 80);
        const gdist = Math.hypot(gdx, gdy) || 1;
        const gazeX = (gdx / gdist) * 3.4;
        const gazeY = (gdy / gdist) * 2.6;

        const isExcited = isDancer || ch.hoverBoost > 0.3;
        const isWrong = ch.wrongTimer > 0;
        const pose = isDancer ? game.dancer.pose : null;

        if (kind === 'dalmatian') {
          drawDalmatian(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose);
        } else if (kind === 'domino') {
          drawDomino(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose);
        } else if (kind === 'shower') {
          drawShower(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose);
        } else if (kind === 'melon') {
          drawMelon(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose);
        } else if (kind === 'dolphin') {
          drawDolphin(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose);
        }

        ctx.restore();
      }

      // Shared expressive face with dizzy spirals on wrong click!
      function drawExpressiveFace(ctx, x, y, eyeSep, eyeR, isBlinking, gazeX, gazeY, isExcited, isWrong) {
        // Rosy cheeks
        ctx.fillStyle = isWrong ? 'rgba(255, 62, 157, 0.72)' : 'rgba(255, 107, 157, 0.48)';
        ctx.beginPath();
        ctx.ellipse(x - eyeSep - 8, y + eyeR + 4, 9.5, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(x + eyeSep + 8, y + eyeR + 4, 9.5, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        [-eyeSep, eyeSep].forEach((ex, idx) => {
          if (isWrong) {
            // Funny dizzy spiral eyes!
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#22223b';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.arc(x + ex, y, eyeR * 1.05, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.translate(x + ex, y);
            ctx.rotate(game.time * 16 * (idx === 0 ? 1 : -1));
            ctx.strokeStyle = '#ff3e9d';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 3.5; a += 0.3) {
              const r = (a / (Math.PI * 3.5)) * (eyeR * 0.75);
              const sx = Math.cos(a) * r;
              const sy = Math.sin(a) * r;
              if (a === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.restore();
          } else if (isBlinking) {
            ctx.strokeStyle = '#22223b';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(x + ex, y + 2, eyeR * 0.75, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
          } else {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#22223b';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.ellipse(x + ex, y, eyeR, eyeR * 1.16, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            const px = x + ex + gazeX;
            const py = y + gazeY;
            ctx.fillStyle = '#1b1438';
            ctx.beginPath();
            ctx.arc(px, py, eyeR * 0.56, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(px - eyeR * 0.22, py - eyeR * 0.25, eyeR * 0.24, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // Mouth
        ctx.strokeStyle = '#2b1038';
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        if (isWrong) {
          ctx.beginPath();
          ctx.moveTo(x - 11, y + eyeR + 12);
          ctx.quadraticCurveTo(x - 5, y + eyeR + 6, x, y + eyeR + 12);
          ctx.quadraticCurveTo(x + 5, y + eyeR + 18, x + 11, y + eyeR + 12);
          ctx.stroke();
        } else if (isExcited) {
          ctx.fillStyle = '#ff4d7d';
          ctx.beginPath();
          ctx.arc(x, y + eyeR + 7, 11.5, 0, Math.PI);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(x, y + eyeR + 5, 9.5, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
        }
      }

      // Shared dancing legs with cute disco sneakers (supports splits, high can-can kicks, moonwalk)
      function drawDancingLegs(ctx, legSep, hipY, t, ph, sneakerColor, excited, wrong, pose) {
        const split = pose ? (pose.split || 0) : 0;
        const kickL = pose ? (pose.kickL || 0) : 0;
        const kickR = pose ? (pose.kickR || 0) : 0;
        const legSwingL = pose ? (pose.legL || 0) : (excited ? Math.sin(t * 10 + ph) * 0.25 : Math.sin(game.beatPhase * Math.PI + ph) * 0.12);
        const legSwingR = pose ? (pose.legR || 0) : (excited ? -Math.sin(t * 10 + ph) * 0.25 : -Math.sin(game.beatPhase * Math.PI + ph) * 0.12);

        const drawOneLeg = (side, swing, kick) => {
          ctx.save();
          ctx.translate(side * legSep, hipY);
          const angle = side * (split * 1.15 + kick * 1.35) + swing;
          ctx.rotate(angle);

          ctx.strokeStyle = '#231942';
          ctx.lineWidth = 7.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(side * 4, -hipY);
          ctx.stroke();

          // Cute funky sneaker with white sole
          ctx.translate(side * 8, -hipY + 2);
          ctx.fillStyle = sneakerColor;
          ctx.strokeStyle = '#231942';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, 16, 9.5, side * -0.08, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Sneaker sole stripe
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-12, 4);
          ctx.lineTo(12, 4);
          ctx.stroke();
          ctx.restore();
        };

        drawOneLeg(-1, legSwingL, kickL);
        drawOneLeg(1, legSwingR, kickR);
      }

      // Shared dancing arms with cute gloves (supports disco pointing, windmill spins, noodle waves)
      function drawDancingArms(ctx, shoulderX, shoulderY, t, ph, armColor, gloveColor, excited, wrong, pose) {
        const defaultWave = wrong
          ? Math.sin(t * 22) * 0.75
          : Math.sin(game.beatPhase * Math.PI + ph) * 0.35;

        const rotL = pose ? (pose.armL || 0) : (-0.4 + defaultWave);
        const rotR = pose ? (pose.armR || 0) : (0.4 - defaultWave);
        const noodle = pose && pose.noodle;

        const drawOneArm = (side, rot) => {
          ctx.save();
          ctx.translate(side * shoulderX, shoulderY);
          ctx.rotate(rot);

          ctx.strokeStyle = armColor;
          ctx.lineWidth = 7.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          if (noodle) {
            const w1 = Math.sin(t * 24 + side) * 14;
            ctx.bezierCurveTo(side * 12, w1, side * 24, -w1, side * 34, 4);
          } else {
            ctx.quadraticCurveTo(side * 16, 12, side * 30, 4);
          }
          ctx.stroke();

          // Cute cartoon glove/hand
          ctx.fillStyle = gloveColor;
          ctx.strokeStyle = '#231942';
          ctx.lineWidth = 2.3;
          ctx.beginPath();
          ctx.arc(side * 33, 4, 8.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        };

        drawOneArm(-1, rotL);
        drawOneArm(1, rotR);
      }

      // 1. ДА — DALMATIAN PUPPY (Далматинець / Далматинец)
      function drawDalmatian(ctx, t, ph, blink, gx, gy, excited, wrong, pose) {
        // Wagging spotted tail behind
        const wag = Math.sin(t * (excited ? 18 : 7) + ph) * 0.45;
        ctx.save();
        ctx.translate(28, -42);
        ctx.rotate(wag);
        ctx.strokeStyle = '#f5f6fa';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(22, -8, 28, -28);
        ctx.stroke();
        ctx.strokeStyle = '#231942';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        drawDancingLegs(ctx, 17, -30, t, ph, '#ff3e9d', excited, wrong, pose);

        // Plump white puppy torso with classic black spots
        const bGrad = ctx.createRadialGradient(-8, -62, 6, 0, -54, 40);
        bGrad.addColorStop(0, '#ffffff');
        bGrad.addColorStop(1, '#dce3ee');
        ctx.fillStyle = bGrad;
        ctx.strokeStyle = '#231942';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.ellipse(0, -54, 33, 32, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Body spots
        ctx.fillStyle = '#1e1e2f';
        ctx.beginPath();
        ctx.ellipse(-14, -56, 8, 6, 0.3, 0, Math.PI * 2);
        ctx.ellipse(15, -46, 7, 9, -0.2, 0, Math.PI * 2);
        ctx.ellipse(2, -38, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Red collar with shiny gold tag
        ctx.strokeStyle = '#ff3b5c';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, -84, 24, 0.25 * Math.PI, 0.75 * Math.PI);
        ctx.stroke();

        ctx.fillStyle = '#ffd32a';
        ctx.strokeStyle = '#b37400';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -68, 7.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        drawDancingArms(ctx, 30, -64, t, ph, '#e4eaf2', '#ffffff', excited, wrong, pose);

        // Floppy spotted ears
        const earFlop = Math.sin(t * (excited ? 14 : 5) + ph) * 0.14;
        [-32, 32].forEach((ex, idx) => {
          ctx.save();
          ctx.translate(ex, -112);
          ctx.rotate(idx === 0 ? 0.35 + earFlop : -0.35 - earFlop);
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#231942';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.ellipse(0, 18, 13, 24, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#1e1e2f';
          ctx.beginPath();
          ctx.arc(idx === 0 ? -2 : 2, 12, 6.5, 0, Math.PI * 2);
          ctx.arc(idx === 0 ? 3 : -3, 27, 5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // Puppy head
        const hGrad = ctx.createRadialGradient(-10, -112, 6, 0, -100, 38);
        hGrad.addColorStop(0, '#ffffff');
        hGrad.addColorStop(1, '#dde4f0');
        ctx.fillStyle = hGrad;
        ctx.strokeStyle = '#231942';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.ellipse(0, -100, 36, 32, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Forehead spot
        ctx.fillStyle = '#1e1e2f';
        ctx.beginPath();
        ctx.ellipse(-18, -118, 9, 6, -0.4, 0, Math.PI * 2);
        ctx.ellipse(16, -121, 6, 4.5, 0.3, 0, Math.PI * 2);
        ctx.fill();

        drawExpressiveFace(ctx, 0, -104, 15, 11, blink, gx, gy, excited, wrong);

        // Cute shiny black puppy nose
        ctx.fillStyle = '#1e1e2f';
        ctx.beginPath();
        ctx.ellipse(0, -88, 8.5, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.ellipse(-2.5, -90, 2.8, 1.6, -0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. ДО — DOMINO (Доміно / Домино)
      function drawDomino(ctx, t, ph, blink, gx, gy, excited, wrong, pose) {
        drawDancingLegs(ctx, 18, -28, t, ph, '#00e5ff', excited, wrong, pose);
        drawDancingArms(ctx, 36, -78, t, ph, '#3f37c9', '#ffe66d', excited, wrong, pose);

        // Glossy rounded dark-indigo/cream domino tile
        const domGrad = ctx.createLinearGradient(-38, -142, 38, -22);
        domGrad.addColorStop(0, '#3a2d82');
        domGrad.addColorStop(0.5, '#251b5c');
        domGrad.addColorStop(1, '#191142');
        ctx.fillStyle = domGrad;
        ctx.strokeStyle = '#ffdf73';
        ctx.lineWidth = 4;
        roundRect(ctx, -37, -142, 74, 118, 16);
        ctx.fill();
        ctx.stroke();

        // Warm cream inner face panel
        const faceGrad = ctx.createLinearGradient(0, -134, 0, -30);
        faceGrad.addColorStop(0, '#fff7dc');
        faceGrad.addColorStop(1, '#f4e0a8');
        ctx.fillStyle = faceGrad;
        roundRect(ctx, -30, -135, 60, 104, 11);
        ctx.fill();

        // Metallic golden dividing bar across middle
        ctx.fillStyle = '#f5a623';
        ctx.strokeStyle = '#9c5a00';
        ctx.lineWidth = 1.8;
        roundRect(ctx, -26, -76, 52, 7, 3);
        ctx.fill();
        ctx.stroke();

        // Classic raised domino pips on the bottom half (4 colorful-accented dark pips)
        const pips = [[-14, -57], [14, -57], [-14, -40], [14, -40]];
        pips.forEach(([px, py]) => {
          ctx.fillStyle = '#251b5c';
          ctx.beginPath();
          ctx.arc(px, py, 6.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.beginPath();
          ctx.arc(px - 1.8, py - 1.8, 2, 0, Math.PI * 2);
          ctx.fill();
        });

        // Glossy corner highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.beginPath();
        ctx.ellipse(-20, -124, 6, 12, 0.25, 0, Math.PI * 2);
        ctx.fill();

        // Expressive cartoon face on top half of domino
        drawExpressiveFace(ctx, 0, -110, 14, 11, blink, gx, gy, excited, wrong);
      }

      // 3. ДУ — SHOWER HEAD (Душ)
      function drawShower(ctx, t, ph, blink, gx, gy, excited, wrong, pose) {
        drawDancingLegs(ctx, 16, -28, t, ph, '#ffe66d', excited, wrong, pose);
        drawDancingArms(ctx, 26, -74, t, ph, '#74b9ff', '#00e5ff', excited, wrong, pose);

        // Sparkling animated water droplets misting playfully out of the shower nozzle!
        for (let i = 0; i < 6; i++) {
          const dropPhase = (t * 2.8 + i * 0.33) % 1;
          const dx = 32 + dropPhase * 34 + Math.sin(i * 2.1) * 8;
          const dy = -114 + dropPhase * 52 + (i - 2.5) * 6;
          ctx.save();
          ctx.globalAlpha = 1 - dropPhase;
          ctx.fillStyle = '#6cf0ff';
          ctx.beginPath();
          ctx.ellipse(dx, dy, 4.5, 2.8, 0.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Curved chrome handle / neck body
        const neckGrad = ctx.createLinearGradient(-22, -120, 22, -30);
        neckGrad.addColorStop(0, '#eef7ff');
        neckGrad.addColorStop(0.5, '#9ec5fe');
        neckGrad.addColorStop(1, '#4b7bec');
        ctx.fillStyle = neckGrad;
        ctx.strokeStyle = '#231942';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-16, -28);
        ctx.quadraticCurveTo(-24, -76, -16, -112);
        ctx.quadraticCurveTo(-8, -138, 22, -134);
        ctx.lineTo(20, -104);
        ctx.quadraticCurveTo(8, -106, 14, -72);
        ctx.quadraticCurveTo(20, -48, 16, -28);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Shiny bell-shaped sky-blue & chrome shower head nozzle
        ctx.save();
        ctx.translate(22, -122);
        ctx.rotate(-0.35);
        const headGrad = ctx.createLinearGradient(-14, -26, 22, 26);
        headGrad.addColorStop(0, '#ffffff');
        headGrad.addColorStop(0.45, '#48dbfb');
        headGrad.addColorStop(1, '#0984e3');
        ctx.fillStyle = headGrad;
        ctx.strokeStyle = '#231942';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-14, -14);
        ctx.lineTo(16, -28);
        ctx.quadraticCurveTo(28, 0, 16, 28);
        ctx.lineTo(-14, 14);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Nozzle face plate with tiny spray holes
        ctx.fillStyle = '#dff9fb';
        ctx.beginPath();
        ctx.ellipse(18, 0, 7, 25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#0984e3';
        for (let h = -15; h <= 15; h += 7.5) {
          ctx.beginPath();
          ctx.arc(18, h, 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Expressive cartoon face on the sleek curved body
        drawExpressiveFace(ctx, -2, -88, 13, 10.5, blink, gx, gy, excited, wrong);
      }

      // 4. ДИ / ДЫ — MELON (Диня / Дыня)
      function drawMelon(ctx, t, ph, blink, gx, gy, excited, wrong, pose) {
        drawDancingLegs(ctx, 18, -28, t, ph, '#2ed573', excited, wrong, pose);
        drawDancingArms(ctx, 42, -76, t, ph, '#c77d00', '#ffe66d', excited, wrong, pose);

        // Cute green curly stem & leaf on top
        ctx.strokeStyle = '#1b8a47';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -128);
        ctx.quadraticCurveTo(4, -148, 18, -146);
        ctx.stroke();

        ctx.save();
        ctx.translate(-14, -138);
        ctx.rotate(-0.45);
        ctx.fillStyle = '#2ed573';
        ctx.strokeStyle = '#1b8a47';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Plump golden-yellow oval melon body
        const mGrad = ctx.createRadialGradient(-14, -96, 10, 0, -78, 56);
        mGrad.addColorStop(0, '#fff4a3');
        mGrad.addColorStop(0.55, '#ffd32a');
        mGrad.addColorStop(1, '#e69500');
        ctx.fillStyle = mGrad;
        ctx.strokeStyle = '#8c5300';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, -78, 43, 52, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Darker amber vertical ribs & subtle melon netting
        ctx.strokeStyle = 'rgba(180, 105, 0, 0.42)';
        ctx.lineWidth = 3;
        [-22, 0, 22].forEach((rx) => {
          ctx.beginPath();
          ctx.moveTo(rx * 0.4, -127);
          ctx.quadraticCurveTo(rx * 1.45, -78, rx * 0.4, -29);
          ctx.stroke();
        });

        // Glossy sunlit highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        ctx.ellipse(-22, -98, 8, 20, 0.22, 0, Math.PI * 2);
        ctx.fill();

        drawExpressiveFace(ctx, 0, -84, 15, 11.5, blink, gx, gy, excited, wrong);
      }

      // 5. ДЕ — DOLPHIN (Дельфін / Дельфин)
      function drawDolphin(ctx, t, ph, blink, gx, gy, excited, wrong, pose) {
        // Playful dolphin tail fluke behind
        const tailWag = Math.sin(t * (excited ? 14 : 5) + ph) * 0.28;
        ctx.save();
        ctx.translate(28, -42);
        ctx.rotate(tailWag);
        ctx.fillStyle = '#00b4d8';
        ctx.strokeStyle = '#005f73';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(26, -6, 36, -24);
        ctx.quadraticCurveTo(24, 0, 36, 18);
        ctx.quadraticCurveTo(18, 10, 0, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Dorsal fin on top/side
        ctx.fillStyle = '#0096c7';
        ctx.strokeStyle = '#005f73';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(12, -124);
        ctx.quadraticCurveTo(36, -150, 32, -108);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        drawDancingLegs(ctx, 16, -28, t, ph, '#ff7f50', excited, wrong, pose);

        // Sleek joyful turquoise-blue upright dolphin body
        const dGrad = ctx.createRadialGradient(-12, -96, 10, 0, -76, 58);
        dGrad.addColorStop(0, '#72efdd');
        dGrad.addColorStop(0.55, '#00b4d8');
        dGrad.addColorStop(1, '#0077b6');
        ctx.fillStyle = dGrad;
        ctx.strokeStyle = '#004e73';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, -78, 36, 52, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Shiny pale-cyan belly patch
        ctx.fillStyle = '#caf0f8';
        ctx.beginPath();
        ctx.ellipse(-4, -64, 21, 32, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cute rounded dolphin snout
        ctx.fillStyle = '#48cae4';
        ctx.strokeStyle = '#004e73';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.ellipse(-28, -90, 16, 9, -0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        drawDancingArms(ctx, 32, -74, t, ph, '#0096c7', '#72efdd', excited, wrong, pose);

        // Expressive cartoon face
        drawExpressiveFace(ctx, 0, -96, 14, 11, blink, gx, gy, excited, wrong);
      }

      // Utility: safe rounded rectangle path
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      /* =========================================================================
       * 12. MAIN RENDER & ANIMATION LOOP
       * ========================================================================= */
      function render() {
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.translate(stageOffsetX, stageOffsetY);
        ctx.scale(stageScale, stageScale);

        // 1. Alive story-driven disco hall, ball, speakers, equalizer & 3D glowing floor
        drawDiscoHall(ctx);

        // 2. Retro neon disco marquee syllable sign
        drawSyllableMarquee(ctx);

        // 3. Active dancing character center-stage on the illuminated disco floor
        if (game.dancer.char) {
          drawCharacter(ctx, game.dancer.char, true);
        }

        // 4. Waiting characters along the lower foreground waiting area
        const waiting = game.characters
          .filter((c) => c !== game.dancer.char)
          .sort((a, b) => a.y - b.y);
        for (const ch of waiting) {
          drawCharacter(ctx, ch, false);
        }

        // 5. Disco confetti, stars, sparkles, and musical notes
        drawParticles(ctx);

        ctx.restore();
      }

      let lastTime = 0;
      function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
        lastTime = timestamp;

        updateGame(dt);
        render();
        requestAnimationFrame(loop);
      }

      window.onload = function () {
        resizeCanvas();
        createWave();
        requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
</html>
