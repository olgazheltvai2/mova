<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Castle Defense</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#07080f;font-family:'Georgia','Palatino Linotype',serif}
  #gameCanvas{position:absolute;top:0;left:0;width:100vw;height:100vh;display:block;z-index:1}
  #statusBar{position:fixed;top:2.2vh;left:2.2vw;display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);z-index:15;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.8))}
  #livesPanel{display:flex;gap:clamp(3px,.4vw,6px)}
  .life-shield{width:clamp(26px,3.2vw,38px);height:clamp(30px,3.7vw,44px);transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .35s ease;display:flex;align-items:center;justify-content:center}
  .life-shield svg{width:100%;height:100%}
  .life-shield.lost{opacity:.22;transform:scale(.82)}
  .life-shield.just-lost{animation:shieldBreak .55s ease-out}
  @keyframes shieldBreak{0%{transform:scale(1)}20%{transform:scale(1.28) rotate(-6deg)}40%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(.82);opacity:.22}}
  #killsPanel{display:flex;gap:clamp(2px,.28vw,4px);padding:clamp(6px,.8vh,10px) clamp(8px,.9vw,14px);background:radial-gradient(ellipse at 50% 30%,rgba(45,32,20,.85) 0%,rgba(20,14,10,.92) 100%);border:2px solid #5e4527;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.8),inset 0 1px 3px rgba(255,210,140,.15)}
  .kill-pip{width:clamp(7px,.9vw,11px);height:clamp(12px,1.6vh,16px);background:rgba(30,20,12,.9);border:1px solid #4a3620;border-radius:2px;transition:all .4s cubic-bezier(.3,1.4,.5,1)}
  .kill-pip.lit{background:linear-gradient(180deg,#ffe087 0%,#ffbb3d 45%,#b87a1a 100%);border-color:#ffe9b0;box-shadow:0 0 8px rgba(255,190,70,.85),0 0 16px rgba(255,170,40,.4),inset 0 1px 1px rgba(255,255,255,.5);transform:translateY(-1px)}
  .kill-pip.just-lit{animation:pipPop .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pipPop{0%{transform:scale(.5) translateY(-4px)}55%{transform:scale(1.35) translateY(-3px)}100%{transform:scale(1) translateY(-1px)}}
  #nextBtn,#muteBtn{position:fixed;top:2.2vh;width:clamp(54px,4.8vw,72px);height:clamp(54px,4.8vw,72px);border-radius:50%;background:radial-gradient(circle at 32% 28%,#4b382a 0%,#241a14 55%,#120c09 100%);border:3px solid #9c7a44;box-shadow:0 6px 20px rgba(0,0,0,.85),inset 0 2px 5px rgba(255,215,130,.35),inset 0 -4px 8px rgba(0,0,0,.9),0 0 16px rgba(255,168,52,.25);cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center;transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .2s ease,border-color .2s ease;outline:none}
  #nextBtn::before,#muteBtn::before{content:'';position:absolute;inset:4px;border-radius:50%;border:1.5px dashed rgba(212,168,87,.45);pointer-events:none}
  #nextBtn:hover,#muteBtn:hover{transform:scale(1.09) rotate(4deg);border-color:#f3c668;box-shadow:0 8px 25px rgba(0,0,0,.9),inset 0 2px 8px rgba(255,225,150,.5),0 0 24px rgba(255,185,65,.65)}
  #nextBtn:active,#muteBtn:active{transform:scale(.93)}
  #nextBtn svg,#muteBtn svg{width:56%;height:56%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.9)) drop-shadow(0 0 6px rgba(255,190,70,.5))}
  #nextBtn{right:2.2vw}
  #muteBtn{right:calc(2.2vw + clamp(54px,4.8vw,72px) + 12px)}
  #muteBtn .sound-waves{transition:opacity .2s ease;opacity:1}
  #muteBtn .mute-slash{transition:opacity .2s ease;opacity:0}
  #muteBtn.muted{border-color:#a05a44;box-shadow:0 6px 20px rgba(0,0,0,.85),inset 0 2px 5px rgba(255,180,140,.35),inset 0 -4px 8px rgba(0,0,0,.9),0 0 16px rgba(255,90,55,.35)}
  #muteBtn.muted .sound-waves{opacity:0}
  #muteBtn.muted .mute-slash{opacity:1}
  #hudContainer{position:fixed;bottom:1.2vh;left:50%;transform:translateX(-50%);width:min(96vw,1180px);z-index:10;display:flex;flex-direction:column;align-items:center;gap:1vh;pointer-events:none}
  #altarPanel{pointer-events:auto;min-width:min(74vw,680px);max-width:94vw;min-height:clamp(54px,7.6vh,76px);padding:.8vh 2vw;border-radius:18px;background:radial-gradient(ellipse at 50% 15%,rgba(75,58,44,.92) 0%,rgba(28,22,18,.96) 65%,rgba(15,11,9,.98) 100%);border:3px solid #6e5536;box-shadow:0 10px 28px rgba(0,0,0,.9),inset 0 2px 6px rgba(255,210,140,.22),inset 0 -5px 12px rgba(0,0,0,.95),0 0 22px rgba(245,170,60,.18);display:flex;align-items:center;justify-content:center;gap:clamp(5px,.65vw,10px);position:relative;transition:transform .1s ease,border-color .2s ease,box-shadow .2s ease}
  #altarPanel::before,#altarPanel::after{content:'';position:absolute;top:50%;transform:translateY(-50%);width:10px;height:28px;border-radius:5px;background:linear-gradient(180deg,#b89152 0%,#5e4321 50%,#2a1c0d 100%);border:1px solid #d9b471;box-shadow:0 2px 5px rgba(0,0,0,.8)}
  #altarPanel::before{left:8px}#altarPanel::after{right:8px}
  #altarPanel.shake{animation:altarShake .36s cubic-bezier(.36,.07,.19,.97) both;border-color:#ff452b;box-shadow:0 10px 28px rgba(0,0,0,.9),0 0 30px rgba(255,55,30,.7),inset 0 0 18px rgba(255,45,20,.45)}
  #altarPanel.success-glow{border-color:#48ff9b;box-shadow:0 10px 28px rgba(0,0,0,.9),0 0 38px rgba(60,255,150,.8),inset 0 0 22px rgba(70,255,160,.5)}
  @keyframes altarShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-11px) rotate(-1deg)}36%{transform:translateX(10px) rotate(1deg)}54%{transform:translateX(-8px) rotate(-.6deg)}72%{transform:translateX(6px) rotate(.4deg)}}
  .rune-slot{width:clamp(32px,3.6vw,48px);height:clamp(38px,5.2vh,56px);border-radius:10px;background:radial-gradient(circle at 50% 30%,#251d17 0%,#140f0c 75%,#0c0907 100%);border:2px solid #473626;box-shadow:inset 0 3px 6px rgba(0,0,0,.92),0 1px 2px rgba(255,210,140,.12);display:flex;align-items:center;justify-content:center;font-size:clamp(18px,2.2vw,30px);font-weight:900;color:#ffe8b3;text-transform:uppercase;position:relative;transition:all .14s cubic-bezier(.2,.9,.3,1.35)}
  .rune-slot.filled{background:radial-gradient(circle at 35% 25%,#3b5239 0%,#1d2e1e 65%,#111c12 100%);border-color:#6ce089;color:#eaffef;text-shadow:0 0 10px rgba(80,255,140,.85),0 2px 3px rgba(0,0,0,.95);box-shadow:0 0 14px rgba(70,235,125,.45),inset 0 2px 5px rgba(170,255,195,.35),inset 0 -3px 6px rgba(0,0,0,.85);transform:translateY(-2px) scale(1.04)}
  .rune-slot.error{background:radial-gradient(circle at 35% 25%,#6e221b 0%,#3d100c 65%,#210705 100%);border-color:#ff5538;color:#ffd5cc;text-shadow:0 0 12px rgba(255,70,40,.95),0 2px 3px rgba(0,0,0,.95);box-shadow:0 0 18px rgba(255,60,35,.75),inset 0 2px 6px rgba(255,150,130,.45);transform:scale(1.08);cursor:pointer}
  .rune-slot.active-cursor::after{content:'';position:absolute;bottom:5px;width:55%;height:3px;border-radius:2px;background:#f5b951;box-shadow:0 0 8px #ffbe4f;animation:pulseCursor 1s infinite ease-in-out}
  @keyframes pulseCursor{0%,100%{opacity:.35;transform:scaleX(.75)}50%{opacity:1;transform:scaleX(1.08)}}
  #keyboardFrame{pointer-events:auto;width:100%;padding:clamp(6px,1vh,12px) clamp(8px,1.2vw,16px);border-radius:20px;background:linear-gradient(180deg,rgba(40,31,24,.95) 0%,rgba(21,16,13,.98) 55%,rgba(12,9,7,.99) 100%);border:3px solid #634b30;box-shadow:0 14px 36px rgba(0,0,0,.95),inset 0 2px 5px rgba(255,210,145,.2),inset 0 -6px 14px rgba(0,0,0,.95);display:flex;flex-direction:column;gap:clamp(5px,.75vh,9px);position:relative}
  .kb-row{display:flex;justify-content:center;gap:clamp(4px,.55vw,8px);width:100%}
  .kb-key{flex:1;max-width:clamp(44px,7.2vw,82px);height:clamp(38px,5.8vh,58px);border-radius:11px;background:radial-gradient(circle at 50% 22%,#4a3a2c 0%,#2b2119 58%,#19130e 100%);border:2px solid #785b3a;border-bottom-width:4px;border-bottom-color:#382818;box-shadow:0 4px 8px rgba(0,0,0,.8),inset 0 1.5px 3px rgba(255,220,165,.28),inset 0 -2px 5px rgba(0,0,0,.85);color:#f6dfb2;font-family:'Georgia',serif;font-size:clamp(16px,1.9vw,25px);font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .08s ease,filter .12s ease,border-color .15s ease,box-shadow .15s ease;text-shadow:0 2px 3px rgba(0,0,0,.95);outline:none}
  .kb-key::before{content:'';position:absolute;inset:3px;border-radius:7px;border:1px solid rgba(255,215,145,.08);pointer-events:none}
  .kb-key:hover{filter:brightness(1.18);border-color:#c99b56;box-shadow:0 5px 12px rgba(0,0,0,.85),0 0 12px rgba(255,190,80,.35),inset 0 2px 5px rgba(255,230,175,.4);transform:translateY(-1px)}
  .kb-key:active,.kb-key.pressed{transform:translateY(2px) scale(.96);border-bottom-width:2px;filter:brightness(1.3)}
  .kb-key.flash-good{background:radial-gradient(circle at 50% 25%,#3f7848 0%,#204526 65%,#112615 100%);border-color:#72ff98;box-shadow:0 0 18px rgba(80,255,130,.7),inset 0 0 10px rgba(150,255,180,.5);color:#fff}
  .kb-key.flash-bad{background:radial-gradient(circle at 50% 25%,#82271e 0%,#4a120d 65%,#260805 100%);border-color:#ff5938;box-shadow:0 0 18px rgba(255,65,35,.8),inset 0 0 10px rgba(255,130,110,.5);color:#ffd4cc}
  .kb-key.key-apostrophe{background:radial-gradient(circle at 50% 22%,#6e4823 0%,#422911 60%,#261607 100%);border-color:#d69c45;color:#ffdf85;font-size:clamp(22px,2.5vw,34px);box-shadow:0 4px 10px rgba(0,0,0,.85),0 0 10px rgba(255,180,55,.25),inset 0 2px 4px rgba(255,225,150,.35)}
  .kb-key.key-action{flex:1.35;max-width:clamp(58px,9.2vw,106px);background:radial-gradient(circle at 50% 25%,#4d322a 0%,#2e1b16 65%,#1a0e0b 100%);border-color:#965c4a}
  .kb-key.key-action svg{width:clamp(20px,2.2vw,28px);height:clamp(20px,2.2vw,28px);filter:drop-shadow(0 2px 3px rgba(0,0,0,.9))}
  #gameOverOverlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4vh;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .7s ease}
  #gameOverOverlay.visible{opacity:1;pointer-events:auto}
  #gameOverOverlay.visible.ready{cursor:pointer}
  .overlay-icon{width:clamp(140px,22vw,240px);height:clamp(140px,22vw,240px);display:flex;align-items:center;justify-content:center;animation:iconAppear .9s cubic-bezier(.3,1.5,.5,1) both;filter:drop-shadow(0 0 40px rgba(255,200,80,.7))}
  .overlay-icon svg{width:100%;height:100%}
  @keyframes iconAppear{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
  .overlay-icon.victory{animation:iconAppear .9s cubic-bezier(.3,1.5,.5,1) both,victoryPulse 2s ease-in-out .9s infinite;filter:drop-shadow(0 0 60px rgba(255,220,90,1)) drop-shadow(0 0 120px rgba(255,160,40,.7))}
  @keyframes victoryPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 60px rgba(255,220,90,1)) drop-shadow(0 0 120px rgba(255,160,40,.7))}50%{transform:scale(1.06);filter:drop-shadow(0 0 80px rgba(255,240,140,1)) drop-shadow(0 0 160px rgba(255,180,60,.9))}}
  .overlay-icon.defeat{animation:iconAppear .9s cubic-bezier(.3,1.5,.5,1) both,defeatShiver 3s ease-in-out .9s infinite;filter:drop-shadow(0 0 40px rgba(200,40,30,.7))}
  @keyframes defeatShiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  .overlay-replay{width:clamp(72px,10vw,110px);height:clamp(72px,10vw,110px);border-radius:50%;background:radial-gradient(circle at 32% 28%,#4b382a 0%,#241a14 55%,#120c09 100%);border:3px solid #9c7a44;box-shadow:0 8px 24px rgba(0,0,0,.9),inset 0 2px 5px rgba(255,215,130,.35),inset 0 -4px 8px rgba(0,0,0,.9),0 0 22px rgba(255,168,52,.35);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:opacity .5s ease .6s,transform .5s cubic-bezier(.3,1.4,.5,1) .6s;animation:replayPulse 1.8s ease-in-out 1.2s infinite}
  #gameOverOverlay.visible .overlay-replay{opacity:1;transform:scale(1)}
  @keyframes replayPulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.9),0 0 22px rgba(255,168,52,.35)}50%{box-shadow:0 8px 24px rgba(0,0,0,.9),0 0 40px rgba(255,190,70,.9)}}
  .overlay-replay svg{width:58%;height:58%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.9)) drop-shadow(0 0 8px rgba(255,190,70,.6))}
  @media(max-width:480px){#statusBar{gap:8px}.life-shield{width:24px;height:28px}.kill-pip{width:6px;height:10px}}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="statusBar">
  <div id="livesPanel"></div>
  <div id="killsPanel"></div>
</div>

<button id="muteBtn" aria-label="Toggle sound">
  <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="muteGold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff0b8"/><stop offset="45%" stop-color="#f5b642"/><stop offset="100%" stop-color="#b56c16"/></linearGradient></defs>
    <path d="M12 24 L21 24 L33 12 L33 52 L21 40 L12 40 Z" fill="url(#muteGold)" stroke="#3b2006" stroke-width="2" stroke-linejoin="round"/>
    <g class="sound-waves">
      <path d="M40 22 Q48 32 40 42" stroke="url(#muteGold)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M46 16 Q56 32 46 48" stroke="url(#muteGold)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
    <g class="mute-slash">
      <line x1="42" y1="22" x2="56" y2="42" stroke="#ff4d30" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="56" y1="22" x2="42" y2="42" stroke="#ff4d30" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </svg>
</button>

<button id="nextBtn" aria-label="Next">
  <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="goldArrow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff0b8"/><stop offset="45%" stop-color="#f5b642"/><stop offset="100%" stop-color="#b56c16"/></linearGradient></defs>
    <path d="M14 14L34 32L14 50L21 50L41 32L21 14Z" fill="url(#goldArrow)" stroke="#3b2006" stroke-width="2" stroke-linejoin="round"/>
    <path d="M31 14L51 32L31 50L38 50L58 32L38 14Z" fill="url(#goldArrow)" stroke="#3b2006" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="12" cy="32" r="3.5" fill="#ffd97d"/>
  </svg>
</button>

<div id="hudContainer">
  <div id="altarPanel"></div>
  <div id="keyboardFrame"></div>
</div>

<div id="gameOverOverlay">
  <div class="overlay-icon" id="overlayIcon"></div>
  <div class="overlay-replay">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="replayGold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff0b8"/><stop offset="50%" stop-color="#f5b642"/><stop offset="100%" stop-color="#b56c16"/></linearGradient></defs>
      <path d="M52 32 A20 20 0 1 1 32 12" stroke="url(#replayGold)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M20 6 L38 12 L20 22 Z" fill="url(#replayGold)" stroke="#3b2006" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<script>
(() => {
'use strict';
const PRIORITY_NUMERALS=[{num:6,word:"шість"},{num:16,word:"шістнадцять"},{num:60,word:"шістдесят"},{num:600,word:"шістсот"},{num:5,word:"п'ять"},{num:15,word:"п'ятнадцять"},{num:50,word:"п'ятдесят"},{num:500,word:"п'ятсот"},{num:9,word:"дев'ять"},{num:19,word:"дев'ятнадцять"},{num:90,word:"дев'яносто"},{num:900,word:"дев'ятсот"}];
const SECONDARY_NUMERALS=[{num:7,word:"сім"},{num:17,word:"сімнадцять"},{num:70,word:"сімдесят"},{num:700,word:"сімсот"},{num:8,word:"вісім"},{num:18,word:"вісімнадцять"},{num:80,word:"вісімдесят"},{num:800,word:"вісімсот"},{num:4,word:"чотири"},{num:14,word:"чотирнадцять"},{num:40,word:"сорок"},{num:400,word:"чотириста"},{num:3,word:"три"},{num:13,word:"тринадцять"},{num:30,word:"тридцять"},{num:300,word:"триста"},{num:2,word:"два"},{num:12,word:"дванадцять"},{num:20,word:"двадцять"},{num:200,word:"двісті"},{num:11,word:"одинадцять"},{num:10,word:"десять"},{num:100,word:"сто"},{num:1000,word:"тисяча"}];
let numeralDeck=[],priorityWavesCompleted=0;
function shuffleArray(arr){const c=arr.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function getNextNumeral(activeNums=[]){if(numeralDeck.length===0){if(priorityWavesCompleted===0){numeralDeck=shuffleArray(PRIORITY_NUMERALS);priorityWavesCompleted++;}else{const combined=[...PRIORITY_NUMERALS,...PRIORITY_NUMERALS,...shuffleArray(SECONDARY_NUMERALS).slice(0,12)];numeralDeck=shuffleArray(combined);priorityWavesCompleted++;}}let idx=numeralDeck.findIndex(item=>!activeNums.includes(item.num));if(idx===-1)idx=0;return numeralDeck.splice(idx,1)[0];}
const MAX_LIVES=5,TOTAL_KILLS_TO_WIN=12;
let gameState='playing',lives=MAX_LIVES,kills=0;

class SoundEngine{
  constructor(){this.ctx=null;this.ambientStarted=false;this.masterGain=null;this.muted=false;}
  init(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC){this.ctx=new AC();this.masterGain=this.ctx.createGain();this.masterGain.gain.value=this.muted?0:1;this.masterGain.connect(this.ctx.destination);}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();if(this.ctx&&!this.ambientStarted){this.ambientStarted=true;this.startAmbientPad();}}
  setMuted(m){this.muted=m;if(this.masterGain&&this.ctx){const t=this.ctx.currentTime;this.masterGain.gain.cancelScheduledValues(t);this.masterGain.gain.linearRampToValueAtTime(m?0:1,t+0.15);}}
  toggleMute(){this.setMuted(!this.muted);return this.muted;}
  startAmbientPad(){try{const now=this.ctx.currentTime;const bufferSize=this.ctx.sampleRate*4;const buffer=this.ctx.createBuffer(1,bufferSize,this.ctx.sampleRate);const data=buffer.getChannelData(0);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<bufferSize;i++){const w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;data[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926;}const wind=this.ctx.createBufferSource();wind.buffer=buffer;wind.loop=true;const wf=this.ctx.createBiquadFilter();wf.type='lowpass';wf.frequency.value=420;wf.Q.value=0.6;const glfo=this.ctx.createOscillator();const gg=this.ctx.createGain();glfo.type='sine';glfo.frequency.value=0.07;gg.gain.value=220;glfo.connect(gg);gg.connect(wf.frequency);const wgain=this.ctx.createGain();wgain.gain.value=0.085;wind.connect(wf);wf.connect(wgain);wgain.connect(this.masterGain);const freqs=[146.83,174.61,220.00,329.63];const padBus=this.ctx.createGain();padBus.gain.value=0.025;padBus.connect(this.masterGain);const tlfo=this.ctx.createOscillator();const tg=this.ctx.createGain();tlfo.type='sine';tlfo.frequency.value=0.13;tg.gain.value=0.008;tlfo.connect(tg);tg.connect(padBus.gain);freqs.forEach((f,idx)=>{const o=this.ctx.createOscillator();o.type=idx%2===0?'sine':'triangle';o.frequency.value=f;o.detune.value=(Math.random()-0.5)*8;const g=this.ctx.createGain();g.gain.value=0.25/(idx+1);o.connect(g);g.connect(padBus);o.start(now);});wind.start(now);glfo.start(now);tlfo.start(now);}catch(e){}}

function initEnvironment(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;groundY=H*0.71;castleGateX=Math.max(195,W*0.195);stars=Array.from({length:85},()=>({x:Math.random()*W,y:Math.random()*(groundY*0.72),r:0.7+Math.random()*1.8,phase:Math.random()*Math.PI*2,speed:1.5+Math.random()*2.5}));clouds=Array.from({length:7},(_,i)=>({x:(i/7)*W+Math.random()*120,y:H*(0.08+Math.random()*0.25),w:190+Math.random()*180,h:36+Math.random()*28,speed:6+Math.random()*8,alpha:0.12+Math.random()*0.16}));trees=[{x:W*0.34,scale:0.92,seed:1.1},{x:W*0.56,scale:0.76,seed:2.4},{x:W*0.79,scale:1.05,seed:3.8},{x:W*0.93,scale:0.85,seed:5.2}];reeds=Array.from({length:42},(_,i)=>({x:castleGateX+40+(i/42)*(W-castleGateX),h:18+Math.random()*28,phase:Math.random()*Math.PI*2,hue:105+Math.random()*35}));fireflies=Array.from({length:32},()=>({x:Math.random()*W,y:groundY*0.3+Math.random()*(groundY*0.68),vx:(Math.random()-0.5)*18,vy:(Math.random()-0.5)*12,r:1.6+Math.random()*2.2,phase:Math.random()*Math.PI*2,color:Math.random()>0.4?'#ffbe4f':'#6bffb8'}));castleBricks=[];for(let i=0;i<55;i++)castleBricks.push({rx:Math.random(),ry:Math.random(),w:18+Math.random()*20,h:9+Math.random()*7,shade:(Math.random()-0.5)*18});}

const ENEMY_TYPES=['skeleton','spider','bat'];

class Enemy{constructor(numObj,type){this.num=numObj.num;this.word=numObj.word;this.type=type;this.x=W+75+Math.random()*40;if(type==='bat')this.baseY=groundY-H*(0.24+Math.random()*0.08);else if(type==='spider')this.baseY=groundY+14;else this.baseY=groundY-4;this.y=this.baseY;const span=W-castleGateX;this.speed=span/(44+Math.random()*8);this.walkCycle=Math.random()*Math.PI*2;this.scale=Math.min(1.15,Math.max(0.78,W/1380));this.targeted=false;this.hitFlash=0;this.dead=false;this.incomingKill=false;}update(dt,isTyping){const sf=isTyping?0.35:1.0;this.x-=this.speed*sf*dt;const freq=this.type==='bat'?7.2:(this.type==='spider'?6.5:3.6);this.walkCycle+=dt*freq*(isTyping?0.65:1.0);if(this.type==='bat')this.y=this.baseY+Math.sin(this.walkCycle*0.5)*12;else this.y=this.baseY;if(this.hitFlash>0)this.hitFlash=Math.max(0,this.hitFlash-dt*4);}}
function getActiveTargetEnemy(){const v=enemies.filter(e=>!e.dead&&!e.incomingKill);if(!v.length)return null;v.sort((a,b)=>a.x-b.x);return v[0];}
function spawnEnemy(off=0){if(gameState!=='playing')return;const activeWords=enemies.filter(e=>!e.dead).map(e=>e.num);const no=getNextNumeral(activeWords);const t=ENEMY_TYPES[Math.floor(Math.random()*ENEMY_TYPES.length)];const e=new Enemy(no,t);e.x+=off;enemies.push(e);updateAltarSlots();}
function startInitialWave(){const f=new Enemy(getNextNumeral([]),'skeleton');f.x=W*0.83;enemies.push(f);const s=new Enemy(getNextNumeral([f.num]),'bat');s.x=W*1.02;enemies.push(s);updateAltarSlots();}

function updateAltarSlots(){const t=getActiveTargetEnemy();altarPanel.innerHTML='';if(!t)return;const total=t.word.length;for(let i=0;i<total;i++){const slot=document.createElement('div');slot.className='rune-slot';if(i<typedLetters.length){slot.classList.add('filled');slot.textContent=typedLetters[i]==="'"?"’":typedLetters[i].toUpperCase();}else if(i===typedLetters.length&&errorLetter){slot.classList.add('error');slot.textContent=errorLetter==="'"?"’":errorLetter.toUpperCase();slot.addEventListener('pointerdown',e=>{e.stopPropagation();clearErrorLetter();});}else if(i===typedLetters.length)slot.classList.add('active-cursor');altarPanel.appendChild(slot);}}
function clearErrorLetter(){if(errorTimer){clearTimeout(errorTimer);errorTimer=null;}errorLetter=null;altarPanel.classList.remove('shake');updateAltarSlots();}
function spawnAltarSparks(isGood){const r=altarPanel.getBoundingClientRect();const cx=r.left+r.width*0.5,cy=r.top+r.height*0.4;for(let i=0;i<(isGood?12:18);i++){const a=Math.random()*Math.PI*2,spd=60+Math.random()*190;particles.push({x:cx+(Math.random()-0.5)*r.width*0.5,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-60,r:2.2+Math.random()*3.2,life:0.45+Math.random()*0.3,maxLife:0.75,color:isGood?(Math.random()>0.4?'#6aff9d':'#ffe173'):'#ff4d30',gravity:260});}}
function handleVirtualKey(rawKey,btnEl){sound.init();if(gameState!=='playing')return;if(rawKey==='BACKSPACE'){sound.playErase();flashKeyButton(btnEl,true);if(errorLetter)clearErrorLetter();else if(typedLetters.length>0){typedLetters.pop();updateAltarSlots();}return;}if(rawKey==='CLEAR'){sound.playErase();flashKeyButton(btnEl,true);typedLetters=[];clearErrorLetter();updateAltarSlots();return;}const ch=normalizeApostrophe(rawKey);const active=enemies.filter(e=>!e.dead&&!e.incomingKill);if(!active.length)return;if(errorLetter){if(errorTimer)clearTimeout(errorTimer);errorLetter=null;}const prefix=typedLetters.join('')+ch;let target=getActiveTargetEnemy();let matches=target&&target.word.startsWith(prefix);if(!matches){const alt=active.find(e=>e.word.startsWith(prefix));if(alt){target=alt;alt.x=Math.min(...active.map(e=>e.x))-1;matches=true;}}if(matches&&target){typedLetters.push(ch);target.hitFlash=0.65;sound.playKeyGood(typedLetters.length-1);flashKeyButton(btnEl,true);spawnAltarSparks(true);updateAltarSlots();for(let i=0;i<8;i++){const a=Math.random()*Math.PI*2;particles.push({x:target.x,y:target.y-78*target.scale,vx:Math.cos(a)*90,vy:Math.sin(a)*90,r:2.5+Math.random()*2.5,life:0.35,maxLife:0.35,color:'#6effa8',gravity:0});}if(typedLetters.join('')===target.word)triggerKillShot(target);}else{errorLetter=ch;sound.playKeyBad();flashKeyButton(btnEl,false);spawnAltarSparks(false);altarPanel.classList.remove('shake');void altarPanel.offsetWidth;altarPanel.classList.add('shake');updateAltarSlots();if(errorTimer)clearTimeout(errorTimer);errorTimer=setTimeout(()=>clearErrorLetter(),580);}}

window.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;if(gameState!=='playing')return;if(e.key==='Backspace'){e.preventDefault();handleVirtualKey('BACKSPACE',keyButtonMap.get('BACKSPACE'));return;}if(e.key==='Escape'){e.preventDefault();handleVirtualKey('CLEAR',keyButtonMap.get('CLEAR'));return;}let k=e.key;if(["'","’","ʼ","`",'"',"~"].includes(k)){e.preventDefault();handleVirtualKey("'",keyButtonMap.get("'"));return;}k=k.toLowerCase();if(keyButtonMap.has(k)){e.preventDefault();handleVirtualKey(k,keyButtonMap.get(k));return;}if(EN_TO_UK[k]){e.preventDefault();const uk=EN_TO_UK[k];handleVirtualKey(uk,keyButtonMap.get(uk));}});

function triggerKillShot(enemy){if(gameState!=='playing')return;enemy.incomingKill=true;typedLetters=[];clearErrorLetter();altarPanel.classList.add('success-glow');setTimeout(()=>altarPanel.classList.remove('success-glow'),380);const origin=getBallistaOrigin();const ty=enemy.type==='bat'?enemy.y:enemy.y-42*enemy.scale;ballistaAngle=Math.atan2(ty-origin.y,enemy.x-origin.x);ballistaRecoil=1.0;torchFlare=1.0;sound.playBallistaLaunch();projectiles.push({startX:origin.x,startY:origin.y,x:origin.x,y:origin.y,targetEnemy:enemy,progress:0,duration:0.34,arcHeight:Math.min(110,Math.abs(enemy.x-origin.x)*0.16)});for(let i=0;i<22;i++){const a=ballistaAngle+(Math.random()-0.5)*0.9;const spd=120+Math.random()*260;particles.push({x:origin.x+Math.cos(ballistaAngle)*28,y:origin.y+Math.sin(ballistaAngle)*28,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:3+Math.random()*4,life:0.32+Math.random()*0.2,maxLife:0.52,color:Math.random()>0.35?'#ffae38':'#68f7ff',gravity:90});}const remaining=enemies.filter(e=>!e.dead&&!e.incomingKill);if(!remaining.length)spawnEnemy();else updateAltarSlots();}
function detonateEnemy(enemy){if(enemy.dead)return;enemy.dead=true;screenShake=14;torchFlare=1.2;sound.playEnemyDestroy(enemy.type);const cx=enemy.x,cy=enemy.type==='bat'?enemy.y:enemy.y-38*enemy.scale,sc=enemy.scale;shockwaves.push({x:cx,y:cy,r:8,maxR:135*sc,alpha:1,color:enemy.type==='spider'?'#58ff9a':(enemy.type==='bat'?'#ff9f40':'#63e5ff')});shockwaves.push({x:cx,y:cy,r:4,maxR:85*sc,alpha:0.9,color:'#fff2b2'});if(enemy.type==='skeleton'){['skull','shield','sword','ribcage','bone','bone','bone','bone'].forEach((pt,idx)=>{const a=-Math.PI*0.85+(idx/8)*Math.PI*0.7+(Math.random()-0.5)*0.3;const spd=180+Math.random()*240;debrisBones.push({partType:pt,x:cx+(Math.random()-0.5)*24,y:cy+(Math.random()-0.5)*30,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-90,rot:Math.random()*Math.PI*2,vRot:(Math.random()-0.5)*16,scale:sc,life:1.5+Math.random()*0.5,maxLife:2.0,groundY:groundY+(Math.random()-0.5)*14});});}else if(enemy.type==='spider'){for(let i=0;i<8;i++){const a=-Math.PI*0.9+(i/8)*Math.PI*0.8;const spd=150+Math.random()*210;debrisBones.push({partType:'spiderLeg',x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-70,rot:Math.random()*Math.PI*2,vRot:(Math.random()-0.5)*14,scale:sc,life:1.2+Math.random()*0.4,maxLife:1.6,groundY:groundY+12});}}else{for(let i=0;i<6;i++){const a=Math.random()*Math.PI*2;const spd=110+Math.random()*190;debrisBones.push({partType:'batWing',x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-40,rot:Math.random()*Math.PI*2,vRot:(Math.random()-0.5)*12,scale:sc,life:1.1+Math.random()*0.4,maxLife:1.5,groundY:groundY});}}for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2;const spd=50+Math.random()*310;let col='#ffbe45';if(enemy.type==='skeleton')col=Math.random()>0.45?'#66f0ff':'#fff0bd';if(enemy.type==='spider')col=Math.random()>0.45?'#54ff8d':'#c466ff';if(enemy.type==='bat')col=Math.random()>0.45?'#ff7b36':'#ffd966';particles.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-60,r:2.5+Math.random()*4.5,life:0.5+Math.random()*0.55,maxLife:1.05,color:col,gravity:280});}if(gameState==='playing'){kills++;updateStatusBar({type:'kill'});if(kills>=TOTAL_KILLS_TO_WIN){triggerVictory();return;}}updateAltarSlots();}

function loseLife(){if(gameState!=='playing')return;lives--;updateStatusBar({type:'life-lost'});sound.playLifeLost();screenShake=12;redFlash=1.0;const gx=castleGateX-10,gy=groundY-60;for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2;const spd=80+Math.random()*220;particles.push({x:gx,y:gy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-50,r:3+Math.random()*4,life:0.6+Math.random()*0.5,maxLife:1.1,color:Math.random()>0.5?'#ff4030':'#ff8a40',gravity:220});}if(lives<=0)setTimeout(()=>triggerDefeat(),500);}

function drawBackground(time,dt){const skyGrad=ctx.createLinearGradient(0,0,0,groundY);skyGrad.addColorStop(0,'#070913');skyGrad.addColorStop(0.42,'#131830');skyGrad.addColorStop(0.76,'#261f38');skyGrad.addColorStop(1,'#3d2835');ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,groundY);stars.forEach(s=>{const tw=0.35+0.65*Math.sin(time*s.speed+s.phase);ctx.fillStyle=`rgba(255,244,214,${tw*0.85})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});const mx=W*0.76,my=H*0.17,mr=Math.min(W,H)*0.068;const halo=ctx.createRadialGradient(mx,my,mr*0.6,mx,my,mr*3.4);halo.addColorStop(0,'rgba(255,230,175,0.35)');halo.addColorStop(0.45,'rgba(240,185,110,0.11)');halo.addColorStop(1,'rgba(240,185,110,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(mx,my,mr*3.4,0,Math.PI*2);ctx.fill();const mg=ctx.createRadialGradient(mx-mr*0.25,my-mr*0.25,mr*0.1,mx,my,mr);mg.addColorStop(0,'#fff9e6');mg.addColorStop(0.7,'#f5d28c');mg.addColorStop(1,'#c9964c');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(165,118,58,0.22)';[[-0.3,-0.2,0.18],[0.25,0.15,0.24],[-0.1,0.38,0.14],[0.32,-0.28,0.12]].forEach(([cx,cy,cr])=>{ctx.beginPath();ctx.arc(mx+cx*mr,my+cy*mr,cr*mr,0,Math.PI*2);ctx.fill();});clouds.forEach(c=>{c.x-=c.speed*dt;if(c.x+c.w<-100)c.x=W+120;const cg=ctx.createRadialGradient(c.x,c.y,10,c.x,c.y,c.w*0.6);cg.addColorStop(0,`rgba(58,48,74,${c.alpha})`);cg.addColorStop(1,'rgba(25,20,35,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(c.x,c.y,c.w*0.6,c.h,0,0,Math.PI*2);ctx.fill();});ctx.fillStyle='#171324';ctx.beginPath();ctx.moveTo(0,groundY);const p1=[0,0.12,0.23,0.35,0.48,0.61,0.74,0.88,1.0];const h1=[0.22,0.34,0.19,0.38,0.25,0.33,0.21,0.36,0.24];p1.forEach((px,idx)=>ctx.lineTo(px*W,groundY-h1[idx]*H));ctx.lineTo(W,groundY);ctx.closePath();ctx.fill();ctx.fillStyle='#1f1a29';ctx.beginPath();ctx.moveTo(0,groundY);for(let x=0;x<=W;x+=W/16){const h=Math.sin(x*0.0045+1.2)*38+Math.cos(x*0.011)*22+64;ctx.lineTo(x,groundY-h);}ctx.lineTo(W,groundY);ctx.closePath();ctx.fill();trees.forEach(t=>drawGnarledTree(t.x,groundY-6,t.scale,time,t.seed));const fogGrad=ctx.createLinearGradient(0,groundY-75,0,groundY+25);fogGrad.addColorStop(0,'rgba(120,135,165,0)');fogGrad.addColorStop(0.55,'rgba(95,110,138,0.18)');fogGrad.addColorStop(1,'rgba(30,35,45,0)');ctx.fillStyle=fogGrad;ctx.fillRect(0,groundY-75,W,100);const terrainGrad=ctx.createLinearGradient(0,groundY-8,0,H);terrainGrad.addColorStop(0,'#23201b');terrainGrad.addColorStop(0.18,'#2d251d');terrainGrad.addColorStop(0.48,'#1a1510');terrainGrad.addColorStop(1,'#0b0806');ctx.fillStyle=terrainGrad;ctx.fillRect(0,groundY-8,W,H-groundY+8);ctx.fillStyle='rgba(65,53,40,0.45)';for(let i=0;i<28;i++){const sx=castleGateX+((i*67)%Math.max(200,W-castleGateX));const sy=groundY+6+(i%5)*9;ctx.beginPath();ctx.ellipse(sx,sy,16+(i%4)*5,4.5,0,0,Math.PI*2);ctx.fill();}reeds.forEach(r=>{const sway=Math.sin(time*2.1+r.phase)*6;ctx.strokeStyle=`hsla(${r.hue},28%,24%,0.75)`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(r.x,groundY-3);ctx.quadraticCurveTo(r.x+sway*0.5,groundY-r.h*0.5,r.x+sway,groundY-r.h);ctx.stroke();});}

function drawNumeralCrest(x,y,numVal,wordStr,isTargeted,time){ctx.save();ctx.translate(x,y);const txt=String(numVal);const w=Math.max(58,txt.length*20+28);const h=38;if(isTargeted){const pulse=1+Math.sin(time*6)*0.07;ctx.save();ctx.scale(pulse,pulse);const aura=ctx.createRadialGradient(0,0,10,0,0,w*0.85);aura.addColorStop(0,'rgba(255,200,75,0.45)');aura.addColorStop(1,'rgba(255,160,40,0)');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,0,w*0.85,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffcf5c';ctx.lineWidth=2.2;const bw=w*0.58,bh=h*0.64;ctx.beginPath();ctx.moveTo(-bw+8,-bh);ctx.lineTo(-bw,-bh);ctx.lineTo(-bw,bh);ctx.lineTo(-bw+8,bh);ctx.moveTo(bw-8,-bh);ctx.lineTo(bw,-bh);ctx.lineTo(bw,bh);ctx.lineTo(bw-8,bh);ctx.stroke();ctx.restore();}const hw=w*0.5,hh=h*0.5,cut=8;const cg=ctx.createLinearGradient(0,-hh,0,hh);if(isTargeted){cg.addColorStop(0,'#592318');cg.addColorStop(0.5,'#33120b');cg.addColorStop(1,'#1c0805');}else{cg.addColorStop(0,'#362c26');cg.addColorStop(0.5,'#211a16');cg.addColorStop(1,'#120e0b');}ctx.fillStyle=cg;ctx.beginPath();ctx.moveTo(-hw+cut,-hh);ctx.lineTo(hw-cut,-hh);ctx.lineTo(hw,-hh+cut);ctx.lineTo(hw,hh-cut);ctx.lineTo(hw-cut,hh);ctx.lineTo(0,hh+6);ctx.lineTo(-hw+cut,hh);ctx.lineTo(-hw,hh-cut);ctx.lineTo(-hw,-hh+cut);ctx.closePath();ctx.fill();ctx.strokeStyle=isTargeted?'#f5b847':'#7d6340';ctx.lineWidth=isTargeted?2.8:2.0;ctx.stroke();ctx.fillStyle=isTargeted?'#ffe08c':'#9c825c';[[-hw+6,-hh+6],[hw-6,-hh+6],[-hw+6,hh-6],[hw-6,hh-6]].forEach(([rx,ry])=>{ctx.beginPath();ctx.arc(rx,ry,2,0,Math.PI*2);ctx.fill();});ctx.font='900 23px Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillText(txt,0,2);ctx.fillStyle=isTargeted?'#fff1b8':'#e6cfa3';if(isTargeted){ctx.shadowColor='#ffaa2b';ctx.shadowBlur=8;}ctx.fillText(txt,0,0);ctx.shadowBlur=0;if(isTargeted&&typedLetters.length>0){const total=wordStr.length;const span=Math.min(w-8,total*7);const stX=-span*0.5;for(let i=0;i<total;i++){const px=stX+(i/Math.max(1,total-1))*span;ctx.fillStyle=i<typedLetters.length?'#5eff9c':'rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(px,hh+12,i<typedLetters.length?2.8:1.8,0,Math.PI*2);ctx.fill();}}ctx.restore();}

function updateAndDrawEffects(dt){for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.progress+=dt/p.duration;const t=Math.min(1,p.progress);const tx=p.targetEnemy.x;const ty=p.targetEnemy.type==='bat'?p.targetEnemy.y:p.targetEnemy.y-42*p.targetEnemy.scale;const px=p.x,py=p.y;p.x=p.startX+(tx-p.startX)*t;p.y=p.startY+(ty-p.startY)*t-Math.sin(t*Math.PI)*p.arcHeight;const ang=Math.atan2(p.y-py,p.x-px);for(let k=0;k<3;k++){particles.push({x:p.x+(Math.random()-0.5)*8,y:p.y+(Math.random()-0.5)*8,vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*40,r:3.5+Math.random()*3.5,life:0.22,maxLife:0.22,color:Math.random()>0.4?'#ffae33':'#63f5ff',gravity:0});}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);const bg=ctx.createRadialGradient(0,0,2,0,0,28);bg.addColorStop(0,'rgba(255,240,150,0.9)');bg.addColorStop(0.5,'rgba(255,130,30,0.45)');bg.addColorStop(1,'rgba(255,80,10,0)');ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(14,0);ctx.stroke();ctx.fillStyle='#68f7ff';ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(8,-6);ctx.lineTo(8,6);ctx.closePath();ctx.fill();ctx.restore();if(t>=1){detonateEnemy(p.targetEnemy);projectiles.splice(i,1);}}
for(let i=debrisBones.length-1;i>=0;i--){const b=debrisBones[i];b.life-=dt;if(b.life<=0){debrisBones.splice(i,1);continue;}b.vy+=680*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vRot*dt;if(b.y>b.groundY&&b.vy>0){b.y=b.groundY;b.vy*=-0.46;b.vx*=0.72;b.vRot*=0.65;}const alpha=Math.min(1,b.life/0.45);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.scale(b.scale,b.scale);ctx.globalAlpha=alpha;if(b.partType==='skull'){ctx.fillStyle='#dfd8c8';ctx.beginPath();ctx.arc(0,0,9.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a1512';ctx.beginPath();ctx.arc(-4,-1,2.8,0,Math.PI*2);ctx.fill();}else if(b.partType==='shield'){ctx.fillStyle='#5c381c';ctx.strokeStyle='#9aa6b5';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.stroke();}else if(b.partType==='sword'){ctx.strokeStyle='#c4d0de';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(16,0);ctx.stroke();}else if(b.partType==='spiderLeg'){ctx.strokeStyle='#3c2445';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-12,-5);ctx.lineTo(0,6);ctx.lineTo(12,-3);ctx.stroke();}else if(b.partType==='batWing'){ctx.fillStyle='#331c3a';ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(4,-10);ctx.lineTo(14,6);ctx.closePath();ctx.fill();}else{ctx.strokeStyle='#dfd8c8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.stroke();}ctx.restore();}
for(let i=shockwaves.length-1;i>=0;i--){const s=shockwaves[i];s.r+=(s.maxR-s.r)*dt*8.5;s.alpha-=dt*2.2;if(s.alpha<=0){shockwaves.splice(i,1);continue;}ctx.save();ctx.strokeStyle=s.color;ctx.globalAlpha=Math.max(0,s.alpha);ctx.lineWidth=4*s.alpha;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.stroke();ctx.restore();}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.vy+=(p.gravity||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const ratio=p.life/p.maxLife;ctx.save();ctx.globalAlpha=ratio;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;ctx.beginPath();ctx.arc(p.x,p.y,p.r*ratio,0,Math.PI*2);ctx.fill();ctx.restore();}
fireflies.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.phase+=dt*3;if(f.x<0)f.x=W;if(f.x>W)f.x=0;if(f.y<60)f.vy=Math.abs(f.vy);if(f.y>groundY+20)f.vy=-Math.abs(f.vy);const alpha=0.3+0.7*Math.abs(Math.sin(f.phase));ctx.save();ctx.globalAlpha=alpha*0.75;ctx.fillStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();ctx.restore();});}

buildKeyboard();
initStatusBar();
updateStatusBar();
startInitialWave();
let lastTime=performance.now();
function gameLoop(now){const dt=Math.min(0.05,(now-lastTime)/1000);lastTime=now;const time=now/1000;if(gameState==='playing'){spawnTimer+=dt;const active=enemies.filter(e=>!e.dead&&!e.incomingKill);if(!active.length){spawnEnemy();spawnTimer=0;}else if(active.length<3&&spawnTimer>9.5){const rm=Math.max(...active.map(e=>e.x));if(rm<W*0.82){spawnEnemy();spawnTimer=0;}}}const primary=getActiveTargetEnemy();enemies.forEach(e=>{e.targeted=(e===primary);});if(screenShake>0)screenShake=Math.max(0,screenShake-dt*36);if(torchFlare>0)torchFlare=Math.max(0,torchFlare-dt*2.2);if(redFlash>0)redFlash=Math.max(0,redFlash-dt*1.8);ctx.save();if(screenShake>0){const sx=(Math.random()-0.5)*screenShake;const sy=(Math.random()-0.5)*screenShake;ctx.translate(sx,sy);}drawBackground(time,dt);drawCastle(time,dt);for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.dead){enemies.splice(i,1);continue;}const isTyping=(e===primary&&typedLetters.length>0);e.update(dt,isTyping);if(e.x<=castleGateX+26&&!e.incomingKill&&gameState==='playing'){numeralDeck.unshift({num:e.num,word:e.word});typedLetters=[];clearErrorLetter();sound.playGateDefense();detonateEnemy(e);loseLife();updateAltarSlots();continue;}drawEnemy(e,time);}updateAndDrawEffects(dt);ctx.restore();if(redFlash>0){ctx.save();ctx.fillStyle=`rgba(180,20,10,${redFlash*0.35})`;ctx.fillRect(0,0,W,H);ctx.restore();}requestAnimationFrame(gameLoop);}
requestAnimationFrame(gameLoop);
})();
</script>
