<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Телевізор Дідуся — Літера С</title>
  <style>
    /* Базові налаштування сторінки без зайвих відступів */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #180f0a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #main-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Курсори для інтерактивних об'єктів */
    .interactive-target {
      cursor: pointer;
    }

    /* ==========================================================================
       БЕЗПЕЧНІ CSS-АНІМАЦІЇ ДЛЯ ВНУТРІШНІХ ГРУП (НЕ ПЕРЕЗАПИСУЮТЬ SVG-КООРДИНАТИ)
       ========================================================================== */
    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }

    @keyframes pulseGentle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes spinAroundZero {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes flapWingLeft {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50% { transform: rotate(-22deg) scaleY(0.72); }
    }

    @keyframes flapWingRight {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      50% { transform: rotate(22deg) scaleY(0.72); }
    }

    @keyframes sprayFountain {
      0%, 100% { transform: scale(0.92) translateY(3px); opacity: 0.8; }
      50% { transform: scale(1.06) translateY(-5px); opacity: 1; }
    }

    @keyframes swayLeafZero {
      0%, 100% { transform: rotate(-2.5deg) translateY(0px); }
      50% { transform: rotate(3.5deg) translateY(-6px); }
    }

    /* Класи застосовуються ЛИШЕ до внутрішніх обгорток без власного атрибута transform */
    .anim-float-inner {
      animation: floatGentle 3.2s ease-in-out infinite;
      transform-origin: 0px 0px;
    }

    .anim-pulse-inner {
      animation: pulseGentle 2.6s ease-in-out infinite;
      transform-origin: 0px 0px;
    }

    .anim-spin-zero {
      animation: spinAroundZero 24s linear infinite;
      transform-origin: 0px 0px;
    }

    .anim-wing-l-zero {
      animation: flapWingLeft 0.07s linear infinite;
      transform-origin: 0px 0px;
    }

    .anim-wing-r-zero {
      animation: flapWingRight 0.07s linear infinite;
      transform-origin: 0px 0px;
    }

    .anim-spray-zero {
      animation: sprayFountain 1.2s ease-in-out infinite;
      transform-origin: 0px 0px;
    }

    .anim-leaf-zero {
      animation: swayLeafZero 3s ease-in-out infinite;
      transform-origin: 0px 0px;
    }

    /* Мінімалістичні кнопки навігації (Назад / Далі) у кутку екрана */
    #nav-controls {
      position: absolute;
      bottom: 22px;
      right: 28px;
      display: flex;
      gap: 14px;
      z-index: 20;
    }

    .nav-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid #d4af37;
      background: linear-gradient(145deg, #4a2a14, #261307);
      color: #ffdf85;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.55), inset 0 2px 3px rgba(255, 255, 255, 0.2);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .nav-btn:hover {
      transform: scale(1.08);
      filter: brightness(1.18);
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    .nav-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <!-- Основне SVG-полотно вітальні (1920x1080) -->
  <svg id="main-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- ================= ГРАДІЄНТИ КІМНАТИ ================= -->
      <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2b1d17"/>
        <stop offset="55%" stop-color="#483026"/>
        <stop offset="100%" stop-color="#291a14"/>
      </linearGradient>

      <!-- Класичний візерунок шпалер -->
      <pattern id="wallpaperPat" width="110" height="110" patternUnits="userSpaceOnUse">
        <path d="M55 12 C70 30, 88 35, 55 56 C22 35, 40 30, 55 12 Z" fill="#5e3f32" opacity="0.26"/>
        <path d="M55 66 C70 84, 88 89, 55 106 C22 89, 40 84, 55 66 Z" fill="#5e3f32" opacity="0.2"/>
        <circle cx="55" cy="58" r="3.5" fill="#785242" opacity="0.3"/>
      </pattern>

      <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3d2414"/>
        <stop offset="45%" stop-color="#2c180c"/>
        <stop offset="100%" stop-color="#180c05"/>
      </linearGradient>

      <radialGradient id="rugGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#8f2d24"/>
        <stop offset="68%" stop-color="#691c15"/>
        <stop offset="90%" stop-color="#d69e4c"/>
        <stop offset="100%" stop-color="#45100c"/>
      </radialGradient>

      <radialGradient id="lampLight" cx="50%" cy="35%" r="55%">
        <stop offset="0%" stop-color="#ffe2a6" stop-opacity="0.55"/>
        <stop offset="45%" stop-color="#ffae42" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#ffae42" stop-opacity="0"/>
      </radialGradient>

      <!-- М'яке світіння навколо телевізора -->
      <radialGradient id="tvRoomGlow" cx="50%" cy="50%" r="50%">
        <stop id="tvGlowColor1" offset="0%" stop-color="#5cc8ff" stop-opacity="0.42"/>
        <stop id="tvGlowColor2" offset="55%" stop-color="#3a88e9" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

      <!-- ================= ГРАДІЄНТИ ДИВАНА ТА ДІДУСЯ ================= -->
      <linearGradient id="couchFabric" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#286c6b"/>
        <stop offset="55%" stop-color="#1b504f"/>
        <stop offset="100%" stop-color="#103332"/>
      </linearGradient>

      <linearGradient id="couchCushion" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#358584"/>
        <stop offset="65%" stop-color="#1f5958"/>
        <stop offset="100%" stop-color="#123a39"/>
      </linearGradient>

      <linearGradient id="plaidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#cc5d35"/>
        <stop offset="100%" stop-color="#873116"/>
      </linearGradient>

      <radialGradient id="skinGrad" cx="45%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#ffe1ca"/>
        <stop offset="65%" stop-color="#f0be9a"/>
        <stop offset="100%" stop-color="#d4956a"/>
      </radialGradient>

      <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#e87468" stop-opacity="0.58"/>
        <stop offset="100%" stop-color="#e87468" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="silverHair" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="65%" stop-color="#dce3ea"/>
        <stop offset="100%" stop-color="#9ca7b3"/>
      </linearGradient>

      <linearGradient id="cardiganGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a33d26"/>
        <stop offset="55%" stop-color="#7c2916"/>
        <stop offset="100%" stop-color="#4f170b"/>
      </linearGradient>

      <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4e5c6e"/>
        <stop offset="100%" stop-color="#29323d"/>
      </linearGradient>

      <linearGradient id="slippersGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8f5a38"/>
        <stop offset="100%" stop-color="#4f2f1a"/>
      </linearGradient>

      <!-- ================= ГРАДІЄНТИ ТЕЛЕВІЗОРА ================= -->
      <linearGradient id="tvWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#804626"/>
        <stop offset="35%" stop-color="#5e3016"/>
        <stop offset="75%" stop-color="#3f1e0c"/>
        <stop offset="100%" stop-color="#261005"/>
      </linearGradient>

      <linearGradient id="tvBezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4a5056"/>
        <stop offset="25%" stop-color="#2c3034"/>
        <stop offset="80%" stop-color="#1a1d20"/>
        <stop offset="100%" stop-color="#35393e"/>
      </linearGradient>

      <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#b8862d"/>
        <stop offset="50%" stop-color="#ffe08a"/>
        <stop offset="100%" stop-color="#9c6c19"/>
      </linearGradient>

      <linearGradient id="tvStandWood" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#381e0e"/>
        <stop offset="50%" stop-color="#59331b"/>
        <stop offset="100%" stop-color="#2b160a"/>
      </linearGradient>

      <linearGradient id="crtGlassGlare" x1="0%" y1="0%" x2="60%" y2="60%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
        <stop offset="32%" stop-color="#ffffff" stop-opacity="0.05"/>
        <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>

      <radialGradient id="crtInnerShadow" cx="50%" cy="50%" r="58%">
        <stop offset="75%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="93%" stop-color="#000000" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
      </radialGradient>

      <!-- Обрізка внутрішнього екрана телевізора (800 x 580) -->
      <clipPath id="innerScreenClip">
        <rect x="0" y="0" width="800" height="580" rx="44" ry="44"/>
      </clipPath>

      <!-- Тіні -->
      <filter id="shadowMain" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#000000" flood-opacity="0.5"/>
      </filter>

      <filter id="shadowSoft" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
    </defs>

    <!-- ========================================================================= -->
    <!-- 1. ЗАТИШНА ВІТАЛЬНЯ (ШПАЛЕРИ, ПІДЛОГА, КАРТИНИ, ТОРШЕР, КНИЖКОВА ПОЛИЦЯ)  -->
    <!-- ========================================================================= -->
    <g id="room-background">
      <!-- Стіна -->
      <rect x="0" y="0" width="1920" height="780" fill="url(#wallGrad)"/>
      <rect x="0" y="0" width="1920" height="780" fill="url(#wallpaperPat)"/>

      <!-- Плінтус -->
      <rect x="0" y="762" width="1920" height="24" fill="#24130a"/>
      <line x1="0" y1="762" x2="1920" y2="762" stroke="#5c361e" stroke-width="3"/>

      <!-- Паркетна підлога -->
      <rect x="0" y="784" width="1920" height="296" fill="url(#floorGrad)"/>
      <g stroke="#1a0d05" stroke-width="2" opacity="0.55">
        <line x1="0" y1="825" x2="1920" y2="825"/>
        <line x1="0" y1="875" x2="1920" y2="875"/>
        <line x1="0" y1="935" x2="1920" y2="935"/>
        <line x1="0" y1="1005" x2="1920" y2="1005"/>
        <line x1="300" y1="784" x2="210" y2="1080"/>
        <line x1="720" y1="784" x2="660" y2="1080"/>
        <line x1="1150" y1="784" x2="1150" y2="1080"/>
        <line x1="1540" y1="784" x2="1620" y2="1080"/>
      </g>

      <!-- Великий візерунчастий килим -->
      <ellipse cx="960" cy="958" rx="840" ry="112" fill="url(#rugGrad)" filter="url(#shadowSoft)"/>
      <ellipse cx="960" cy="958" rx="775" ry="94" fill="none" stroke="#f0c869" stroke-width="3" stroke-dasharray="14 8" opacity="0.65"/>
      <ellipse cx="960" cy="958" rx="670" ry="72" fill="none" stroke="#3d0b08" stroke-width="5" opacity="0.5"/>

      <!-- Картина з карпатським пейзажем над диваном -->
      <g transform="translate(210, 65)" filter="url(#shadowSoft)">
        <rect x="0" y="0" width="250" height="175" rx="8" fill="#5e3a1c" stroke="#c8963e" stroke-width="5"/>
        <rect x="15" y="15" width="220" height="145" rx="3" fill="#21394f"/>
        <circle cx="180" cy="52" r="19" fill="#ffd875" opacity="0.88"/>
        <polygon points="15,160 85,82 155,160" fill="#31516e"/>
        <polygon points="95,160 165,65 235,160" fill="#1e364c"/>
        <polygon points="165,65 147,90 183,90" fill="#dcebf7" opacity="0.85"/>
        <rect x="15" y="140" width="220" height="20" fill="#162836"/>
      </g>

      <!-- Старовинний годинник з маятником між диваном і телевізором -->
      <g transform="translate(650, 55)" filter="url(#shadowSoft)">
        <polygon points="55,0 104,30 92,165 18,165 6,30" fill="#4b2812" stroke="#2b1507" stroke-width="3"/>
        <line x1="55" y1="155" x2="55" y2="210" stroke="#d4af37" stroke-width="4"/>
        <circle cx="55" cy="214" r="15" fill="url(#goldAccent)"/>
        <circle cx="55" cy="84" r="36" fill="#fff7e6" stroke="#c8963e" stroke-width="5"/>
        <line x1="55" y1="84" x2="55" y2="58" stroke="#2b1507" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="55" y1="84" x2="75" y2="84" stroke="#2b1507" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="55" cy="84" r="4" fill="#8c2d25"/>
      </g>

      <!-- Полиця з книгами та чашкою чаю над телевізором -->
      <g transform="translate(1060, 48)" filter="url(#shadowSoft)">
        <rect x="0" y="55" width="460" height="16" rx="5" fill="#59331b" stroke="#2e1608" stroke-width="2"/>
        <path d="M35,71 L45,92 M425,71 L415,92" stroke="#2e1608" stroke-width="6" stroke-linecap="round"/>
        <!-- Книжки -->
        <rect x="45" y="5" width="26" height="50" rx="3" fill="#c0392b" stroke="#781e14" stroke-width="2"/>
        <rect x="73" y="-2" width="30" height="57" rx="3" fill="#2980b9" stroke="#164666" stroke-width="2"/>
        <rect x="105" y="8" width="24" height="47" rx="3" fill="#27ae60" stroke="#145c32" stroke-width="2"/>
        <rect x="142" y="6" width="28" height="49" rx="3" fill="#8e44ad" transform="rotate(14 142 55)"/>
        <!-- Глобус / Сувенір -->
        <circle cx="380" cy="28" r="22" fill="#52b788" stroke="#d4af37" stroke-width="3"/>
        <rect x="368" y="50" width="24" height="5" fill="#d4af37"/>
      </g>

      <!-- Торшер ліворуч біля дивана -->
      <g id="floor-lamp">
        <ellipse cx="105" cy="410" rx="290" ry="330" fill="url(#lampLight)"/>
        <ellipse cx="95" cy="910" rx="52" ry="15" fill="#5e4020"/>
        <rect x="89" y="280" width="12" height="630" fill="#8b6234"/>
        <circle cx="95" cy="445" r="11" fill="#d4af37"/>
        <polygon points="52,175 138,175 168,290 22,290" fill="#e8993e" stroke="#b8651b" stroke-width="4"/>
        <path d="M22,290 Q95,304 168,290" fill="none" stroke="#ffdf8e" stroke-width="6"/>
        <path d="M26,292 L164,292" stroke="#c75b12" stroke-width="8" stroke-dasharray="6 4"/>
      </g>

      <!-- Світіння від телевізора на стіну -->
      <ellipse cx="1310" cy="450" rx="580" ry="430" fill="url(#tvRoomGlow)"/>
    </g>

    <!-- ========================================================================= -->
    <!-- 2. ГАРМОНІЙНИЙ ТЕЛЕВІЗОР НА ТУМБІ (ПРАВА ЧАСТИНА КІМНАТИ)                 -->
    <!-- ========================================================================= -->
    <g id="television-zone">
      <!-- Дерев'яна тумба під телевізор -->
      <g id="tv-cabinet-stand" filter="url(#shadowMain)">
        <!-- Ніжки тумби -->
        <polygon points="915,875 950,875 935,965 900,965" fill="#291408"/>
        <polygon points="1690,875 1725,875 1740,965 1705,965" fill="#291408"/>
        <!-- Корпус тумби -->
        <rect x="865" y="750" width="910" height="132" rx="12" fill="url(#tvStandWood)" stroke="#241106" stroke-width="4"/>
        <!-- Верхня кришка тумби -->
        <rect x="845" y="732" width="950" height="24" rx="8" fill="#6b3d20" stroke="#361b0b" stroke-width="3"/>
        <!-- Бокові дверцята тумби -->
        <rect x="895" y="770" width="250" height="92" rx="6" fill="#2c160a" stroke="#78472a" stroke-width="2"/>
        <circle cx="1115" cy="816" r="9" fill="url(#goldAccent)"/>
        <!-- Центральна полиця з ресивером -->
        <rect x="1165" y="770" width="310" height="92" rx="6" fill="#170b04"/>
        <rect x="1195" y="810" width="250" height="34" rx="5" fill="#2b2f36" stroke="#555" stroke-width="1.5"/>
        <rect x="1215" y="819" width="75" height="16" rx="3" fill="#0d2618"/>
        <text id="receiver-channel-txt" x="1224" y="831" fill="#37ff8b" font-family="monospace" font-size="13" font-weight="bold">CH-01</text>
        <circle cx="1420" cy="827" r="5" fill="#2ecc71"/>
        <!-- Праві дверцята тумби -->
        <rect x="1495" y="770" width="250" height="92" rx="6" fill="#2c160a" stroke="#78472a" stroke-width="2"/>
        <circle cx="1525" cy="816" r="9" fill="url(#goldAccent)"/>
      </g>

      <!-- Кімнатная рослина у вазоні праворуч від телевізора -->
      <g transform="translate(1785, 645)" filter="url(#shadowSoft)">
        <polygon points="15,65 85,65 72,145 28,145" fill="#b85a32" stroke="#7a3519" stroke-width="3"/>
        <rect x="8" y="53" width="84" height="15" rx="5" fill="#cc683d"/>
        <path d="M50,56 Q10,5 -8,32 Q18,45 50,56" fill="#2d7a3e"/>
        <path d="M50,56 Q25,-30 5,-8 Q22,25 50,56" fill="#39944d"/>
        <path d="M50,56 Q62,-40 88,-8 Q72,30 50,56" fill="#2d7a3e"/>
        <path d="M50,56 Q95,2 108,35 Q78,48 50,56" fill="#46ab5c"/>
      </g>

      <!-- САМ ТЕЛЕВІЗОР (пропорційний, клікабельний) -->
      <g id="tv-set" class="interactive-target">
        <!-- Антена зверху -->
        <g id="tv-antenna">
          <line x1="1310" y1="175" x2="1155" y2="95" stroke="#b0b8c0" stroke-width="5.5" stroke-linecap="round"/>
          <circle cx="1155" cy="95" r="8" fill="#d8dfe6"/>
          <line x1="1310" y1="175" x2="1465" y2="95" stroke="#b0b8c0" stroke-width="5.5" stroke-linecap="round"/>
          <circle cx="1465" cy="95" r="8" fill="#d8dfe6"/>
          <ellipse cx="1310" cy="176" rx="52" ry="15" fill="#33383d" stroke="#5b626a" stroke-width="3"/>
        </g>

        <!-- Дерев'яний корпус телевізора (860 x 565) -->
        <rect x="880" y="170" width="860" height="565" rx="36" ry="36" fill="url(#tvWoodGrad)" stroke="#231006" stroke-width="5" filter="url(#shadowMain)"/>
        <!-- Золотий кант -->
        <rect x="895" y="185" width="830" height="535" rx="28" ry="28" fill="none" stroke="url(#goldAccent)" stroke-width="3" opacity="0.85"/>

        <!-- Темна металева рамка навколо кінескопа -->
        <rect x="908" y="198" width="706" height="508" rx="48" ry="48" fill="url(#tvBezelGrad)" stroke="#121417" stroke-width="4"/>

        <!-- =================================================================== -->
        <!-- ВНУТРІШНІЙ ЕКРАН ТЕЛЕВІЗОРА З ВЛАСНОЮ СИСТЕМОЮ КООРДИНАТ (800x580)  -->
        <!-- Центр екрана завжди рівно (400, 290), нічого не зміщується!         -->
        <!-- =================================================================== -->
        <svg id="tv-viewport" x="920" y="210" width="682" height="484" viewBox="0 0 800 580">
          <g clip-path="url(#innerScreenClip)">
            <!-- Базова темна підкладка кінескопа -->
            <rect x="0" y="0" width="800" height="580" fill="#101824"/>

            <!-- Сюди рендериться поточний канал -->
            <g id="tv-channel-stage"></g>

            <!-- Шум ефіру при перемиканні каналу -->
            <g id="tv-static-layer" opacity="0" style="pointer-events: none;">
              <rect x="0" y="0" width="800" height="580" fill="#1a222c"/>
              <g id="tv-static-bars"></g>
              <rect x="0" y="265" width="800" height="40" fill="#ffffff" opacity="0.8"/>
            </g>

<script>
  // ============================================================================
  // 1. ПРОЦЕДУРНИЙ ЗВУКОВИЙ РУШІЙ (Web Audio API)
  // ============================================================================
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Звук кнопки пульта та перемикання каналу
  function playSwitchSound() {
    ensureAudio();
    const now = audioCtx.currentTime;

    // 1. Чіткий механічний клік пульта
    const clickOsc = audioCtx.createOscillator();
    const clickGain = audioCtx.createGain();
    clickOsc.type = 'triangle';
    clickOsc.frequency.setValueAtTime(1450, now);
    clickOsc.frequency.exponentialRampToValueAtTime(230, now + 0.045);
    clickGain.gain.setValueAtTime(0.35, now);
    clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    clickOsc.connect(clickGain);
    clickGain.connect(audioCtx.destination);
    clickOsc.start(now);
    clickOsc.stop(now + 0.05);

    // 2. Короткий шурхіт телеефіру
    const bufferSize = audioCtx.sampleRate * 0.14;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1250, now + 0.02);
    filter.Q.setValueAtTime(1.8, now + 0.02);

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.16, now + 0.02);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noise.start(now + 0.02);
    noise.stop(now + 0.16);
  }

  // Звук пружин дивана, коли дідусь вовтузиться
  function playSofaSpringSound() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(115, now);
    osc.frequency.linearRampToValueAtTime(168, now + 0.08);
    osc.frequency.linearRampToValueAtTime(92, now + 0.17);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(320, now);

    gain.gain.setValueAtTime(0.04, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.19);
  }

  // Музично-звуковий супровід кожного каналу
  function playChannelSoundEffect(channelName) {
    ensureAudio();
    const now = audioCtx.currentTime + 0.14;

    // Приємний мажорний перелив появи зображення
    const chord = [523.25, 659.25, 783.99, 1046.5];
    chord.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.04);
      gain.gain.setValueAtTime(0.08, now + idx * 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.26);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.04);
      osc.stop(now + idx * 0.04 + 0.28);
    });

    const t = now + 0.2;
    if (channelName === 'сова') {
      [0, 0.3].forEach((offset, i) => {

        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(i === 0 ? 420 : 390, t + offset);
        o.frequency.exponentialRampToValueAtTime(285, t + offset + 0.23);
        g.gain.setValueAtTime(0.15, t + offset);
        g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.25);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(t + offset);
        o.stop(t + offset + 0.26);
      });
    } else if (channelName === 'оса') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(215, t);
      o.frequency.linearRampToValueAtTime(265, t + 0.14);
      o.frequency.linearRampToValueAtTime(195, t + 0.32);

      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + 0.36);

      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(240, t);
      o.frequency.exponentialRampToValueAtTime(510, t + 0.18);
      o.frequency.exponentialRampToValueAtTime(370, t + 0.4);

      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + 0.43);
    } else if (channelName === 'гусак') {
      [0, 0.17].forEach((offset) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';

        o.start(t + offset);
        o.stop(t + offset + 0.15);
      });

  // ============================================================================
  // 3. ФОРМУВАННЯ СПИСКУ КАНАЛІВ ТА НАВІГАЦІЯ (ВПЕРЕД / НАЗАД)
  // ============================================================================
  const wordKeys = [
    'сова', 'сніговик', 'сумка', 'сонечко', 'слон', 'сир',
    'ананас', 'кісточка', 'листок', 'оса', 'гусак', 'кекс'
  ];

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Перший канал завжди "літера_с", далі перемішані всі 12 картинок
  let channelList = ['літера_с', ...shuffleArray(wordKeys)];
  let currentIdx = 0;
  let rotaryAngle = 0;
  let isBusy = false;

  const tvChannelStage = document.getElementById('tv-channel-stage');
  const tvStaticLayer = document.getElementById('tv-static-layer');
  const tvStaticBars = document.getElementById('tv-static-bars');
  const tvGlowColor1 = document.getElementById('tvGlowColor1');
  const tvGlowColor2 = document.getElementById('tvGlowColor2');
  const tvRotaryDial = document.getElementById('tv-rotary-dial');
  const receiverChannelTxt = document.getElementById('receiver-channel-txt');
  const fxSparkles = document.getElementById('fx-sparkles');

  function showChannel(index) {
    const key = channelList[index];
    const data = channelsData[key];
    tvChannelStage.innerHTML = data.render();

    tvGlowColor1.setAttribute('stop-color', data.glow[0]);
    tvGlowColor2.setAttribute('stop-color', data.glow[1]);

    const chNum = String(index + 1).padStart(2, '0');
    receiverChannelTxt.textContent = `CH-${chNum}`;
  }

  function renderStaticNoise() {
    let html = '';
    for (let i = 0; i < 24; i++) {
      const y = Math.random() * 560;
      const h = 3 + Math.random() * 12;
      const op = 0.25 + Math.random() * 0.65;
      const col = Math.random() > 0.5 ? '#ffffff' : '#7f9eb2';
      html += `<rect x="0" y="${y}" width="800" height="${h}" fill="${col}" opacity="${op}"/>`;
    }
    tvStaticBars.innerHTML = html;
  }

  function spawnSparkleBurst(colors) {
    for (let i = 0; i < 12; i++) {
      const star = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const sx = 940 + Math.random() * 640;
      const sy = 230 + Math.random() * 440;
      const r = 4.5 + Math.random() * 8;
      star.setAttribute('cx', sx);
      star.setAttribute('cy', sy);
      star.setAttribute('r', r);
      star.setAttribute('fill', i % 2 === 0 ? colors[0] : '#fff3a1');
      fxSparkles.appendChild(star);

      const dx = (Math.random() - 0.5) * 120;
      const dy = -35 - Math.random() * 80;
      star.animate([
        { transform: 'translate(0px, 0px) scale(1)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
      ], {
        duration: 600 + Math.random() * 300,
        easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
      }).onfinish = () => star.remove();
    }
  }

  function changeChannel(step) {
    if (isBusy) return;
    isBusy = true;

    playSwitchSound();
    animateRemotePress();

    rotaryAngle = (rotaryAngle + step * 30 + 360) % 360;
    tvRotaryDial.setAttribute('transform', `rotate(${rotaryAngle})`);

    renderStaticNoise();
    tvStaticLayer.setAttribute('opacity', '1');

    setTimeout(() => {
      currentIdx += step;
      if (currentIdx >= channelList.length) {
        channelList = ['літера_с', ...shuffleArray(wordKeys)];
        currentIdx = 0;
      } else if (currentIdx < 0) {
        currentIdx = channelList.length - 1;
      }

      showChannel(currentIdx);
      tvStaticLayer.setAttribute('opacity', '0');

      const activeKey = channelList[currentIdx];
      playChannelSoundEffect(activeKey);
      spawnSparkleBurst(channelsData[activeKey].glow);

      updateGrandpaEmotion();
      fidgetGrandpaOnSofa(true);

      isBusy = false;
    }, 150);
  }

    grandpaMouth.setAttribute('d', e.mouth);
    browL.setAttribute('d', e.browL);
    browR.setAttribute('d', e.browR);
    grandpaMustache.setAttribute('transform', `translate(2, 24) rotate(${e.mustRot})`);
    grandpaGlasses.setAttribute('transform', `translate(4, ${e.glassY})`);
    pupilL.setAttribute('transform', `translate(${e.pupil[0]}, ${e.pupil[1]})`);
    pupilR.setAttribute('transform', `translate(${e.pupil[0]}, ${e.pupil[1]})`);
  }

  function blinkEyes() {
    eyelidL.setAttribute('d', 'M-15,-14 Q0,14 15,-14');
    eyelidR.setAttribute('d', 'M-15,-14 Q0,14 15,-14');
    eyelidL.setAttribute('opacity', '1');
    eyelidR.setAttribute('opacity', '1');
    setTimeout(() => {
      eyelidL.setAttribute('opacity', '0');
      eyelidR.setAttribute('opacity', '0');
    }, 145);
  }

  function animateRemotePress() {
    grandpaArmR.animate([
      { transform: 'translate(72px, -42px) rotate(0deg)' },
      { transform: 'translate(78px, -48px) rotate(-8deg)' },
      { transform: 'translate(72px, -42px) rotate(0deg)' }
    ], { duration: 250, easing: 'ease-out' });

    grandpaThumb.animate([
      { transform: 'rotate(-12deg) translateY(0px)' },
      { transform: 'rotate(8deg) translateY(5px)' },
      { transform: 'rotate(-12deg) translateY(0px)' }
    ], { duration: 210, easing: 'ease-in-out' });

    remoteTipLed.setAttribute('opacity', '1');
    remoteBeam.setAttribute('opacity', '0.55');
    tvIrLed.setAttribute('fill', '#ff3b30');
    setTimeout(() => {
      remoteTipLed.setAttribute('opacity', '0.4');
      remoteBeam.setAttribute('opacity', '0');
      tvIrLed.setAttribute('fill', '#4a1218');
    }, 160);
  }

  const sofaPoses = [
    { x: -8, y: 4, rot: -3.5, hRot: 3, legL: 4, legR: -3, cushY: 708 },
    { x: 10, y: 2, rot: 3.2, hRot: -2.5, legL: -5, legR: 5, cushY: 707 },
    { x: -3, y: -5, rot: -1.5, hRot: 4, legL: 6, legR: 2, cushY: 701 },
    { x: 6, y: 5, rot: 2.2, hRot: -3.5, legL: -3, legR: -5, cushY: 709 },
    { x: 0, y: 0, rot: 0, hRot: 0, legL: 0, legR: 0, cushY: 704 }
  ];
  let poseIdx = 4;

  function fidgetGrandpaOnSofa(withSpringSound = false) {
    const nextIdx = (poseIdx + 1 + Math.floor(Math.random() * (sofaPoses.length - 1))) % sofaPoses.length;
    const prev = sofaPoses[poseIdx];
    const next = sofaPoses[nextIdx];
    poseIdx = nextIdx;

    if (withSpringSound && Math.random() > 0.45) {
      playSofaSpringSound();
    }

    grandpaTorso.animate([
      { transform: `translate(${prev.x}px, ${prev.y}px) rotate(${prev.rot}deg)` },
      { transform: `translate(${(prev.x + next.x) / 2}px, ${next.y - 6}px) rotate(${(prev.rot + next.rot) / 2}deg)` },
      { transform: `translate(${next.x}px, ${next.y}px) rotate(${next.rot}deg)` }
    ], {
      duration: 750,
      fill: 'forwards',
      easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
    });

    grandpaHead.animate([
      { transform: `translate(5px, -145px) rotate(${prev.hRot}deg)` },
      { transform: `translate(5px, -148px) rotate(${next.hRot}deg)` }
    ], { duration: 700, fill: 'forwards', easing: 'ease-in-out' });

    grandpaLegL.animate([
      { transform: `rotate(${prev.legL}deg)` },
      { transform: `rotate(${next.legL}deg)` }
    ], { duration: 660, fill: 'forwards', easing: 'ease-in-out' });

    grandpaLegR.animate([
      { transform: `rotate(${prev.legR}deg)` },
      { transform: `rotate(${next.legR}deg)` }
    ], { duration: 660, fill: 'forwards', easing: 'ease-in-out' });

    grandpaArmL.animate([
      { transform: 'translate(-80px, -50px) rotate(0deg)' },
      { transform: `translate(${-80 + next.x * 0.5}px, -52px) rotate(${next.rot * 1.4}deg)` }
    ], { duration: 680, fill: 'forwards', easing: 'ease-in-out' });

    grandpaSeatCushion.setAttribute('y', next.cushY);
  }

  // Постійне вовтузіння дідуся на дивані та зміна емоцій
  setInterval(() => {
    fidgetGrandpaOnSofa(false);
    updateGrandpaEmotion();
  }, 2300);

  setInterval(() => {
    blinkEyes();
  }, 3000);

  // ============================================================================
  // 5. ОБРОБНИКИ КЛІКІВ (ТЕЛЕВІЗОР, ДІДУСЬ, МІНІМАЛІСТИЧНІ КНОПКИ НАЗАД/ДАЛІ)
  // ============================================================================
  document.getElementById('tv-set').addEventListener('click', () => {
    changeChannel(1);
  });

  document.getElementById('grandpa-character').addEventListener('click', () => {
    playSofaSpringSound();
    changeChannel(1);
  });

  document.getElementById('btn-next').addEventListener('click', (e) => {
    e.stopPropagation();
    changeChannel(1);
  });

  document.getElementById('btn-prev').addEventListener('click', (e) => {
    e.stopPropagation();
    changeChannel(-1);
  });

  // Запуск гри з першого каналу (Літера С)
  showChannel(0);
</script>

</body>
</html>
