<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Лабораторія Апострофа</title>
  <style>
    /* ==========================================================================
       1. БАЗОВІ СТИЛІ ТА ПОВНОЕКРАННА СЦЕНА (ШРИФТ ARIAL, ЖОДНИХ БІЛИХ ПРЯМОКУТНИКІВ)
       ========================================================================== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b132b;
    }

    #lab-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Фоновий сюжетний SVG-шар (секретна лабораторія винахідника) */
    #lab-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Полотно для спецефектів (райдужні бульбашки, іскри, хмарки диму) */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 35;
      pointer-events: none;
    }

    /* ==========================================================================
       2. ЖИВІ АНІМАЦІЇ ФОНУ (ШЕСТЕРНІ, БУЛЬБАШКИ, СТРІЛКИ ПРИЛАДІВ, ЛАМПИ)
       ========================================================================== */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.7); opacity: 0; }
      20% { opacity: 0.85; }
      85% { opacity: 0.75; }
      100% { transform: translateY(-145px) scale(1.25); opacity: 0; }
    }
    @keyframes needleSwing {
      0%, 100% { transform: rotate(-38deg); }
      45% { transform: rotate(32deg); }
      70% { transform: rotate(8deg); }
    }
    @keyframes lampFlicker {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 0.72; }
    }
    @keyframes liquidWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }

    .gear-cw { transform-origin: center; transform-box: fill-box; animation: spinSlow 18s linear infinite; }
    .gear-ccw { transform-origin: center; transform-box: fill-box; animation: spinReverse 13s linear infinite; }
    .gauge-needle { transform-origin: 0px 0px; animation: needleSwing 4.5s ease-in-out infinite; }
    .lab-lamp-glow { animation: lampFlicker 3.6s ease-in-out infinite; }
    .liquid-surface { animation: liquidWave 2.8s ease-in-out infinite; }

    .tube-bubble-1 { animation: bubbleRise 3.2s ease-in infinite; }
    .tube-bubble-2 { animation: bubbleRise 4.1s ease-in infinite 1.1s; }
    .tube-bubble-3 { animation: bubbleRise 2.7s ease-in infinite 0.5s; }
    .tube-bubble-4 { animation: bubbleRise 3.6s ease-in infinite 1.9s; }

    /* ==========================================================================
       3. МІНІМАЛІСТИЧНІ КНОПКИ «НАЗАД» І «ДАЛІ» (БРОНЗОВІ КЛАПАНИ-СТРІЛКИ)
       ========================================================================== */
    .nav-valve {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;
      width: 68px;
      height: 68px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.55));
    }
    .nav-valve:hover {
      transform: translateY(-50%) scale(1.14);
      filter: drop-shadow(0 0 18px rgba(56, 249, 215, 0.8));
    }
    .nav-valve:active {
      transform: translateY(-50%) scale(0.92);
    }
    #btn-prev { left: 18px; }
    #btn-next { right: 18px; }

    /* ==========================================================================
       4. ЦЕНТРАЛЬНИЙ ЕКРАН ЗАВДАННЯ (СТИЛІЗОВАНИЙ МІДНО-НЕОНОВИЙ МОНІТОР)
       ========================================================================== */
    #monitor-wrapper {
      position: relative;
      z-index: 15;
      width: min(86vw, 920px);
      min-height: 225px;
      margin-bottom: 13vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #monitor-frame-svg {
      position: absolute;
      inset: -24px -30px;
      width: calc(100% + 60px);
      height: calc(100% + 48px);
      z-index: -1;
      pointer-events: none;
      filter: drop-shadow(0 20px 30px rgba(4, 10, 26, 0.7));
    }

    #word-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      padding: 22px 40px;
      position: relative;
      z-index: 2;
    }

    /* Анімація появи нового слова на екрані */
    @keyframes holoAppear {
      0% { transform: scale(0.78) translateY(16px); opacity: 0; filter: brightness(1.8); }
      65% { transform: scale(1.04) translateY(-3px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); }
    }
    .word-holo-in {
      animation: holoAppear 0.44s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Дуже великі, чіткі літери шрифтом Arial */
    .lab-letter {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(3.1rem, 7.8vw, 6.3rem);
      font-weight: 900;
      line-height: 1;
      color: #f0fff4;
      text-shadow:
        0 4px 0 #0b3954,
        0 7px 0 #00b4d8,
        0 0 22px rgba(72, 249, 215, 0.45);
      padding: 4px 2px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s, text-shadow 0.25s;
    }

    .lab-letter.lit-win {
      color: #fff3b0;
      transform: translateY(-10px) scale(1.08);
      text-shadow:
        0 4px 0 #b5179e,
        0 8px 0 #f72585,
        0 0 26px rgba(255, 243, 176, 0.9);
    }

    /* Інтерактивний слот між літерами */
    .apo-gap {
      position: relative;
      width: clamp(18px, 2.5vw, 34px);
      height: clamp(76px, 11vw, 130px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      cursor: pointer;
      transition: width 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }

    /* Світловий індикатор-гніздо у верхній частині проміжку */
    .gap-socket {
      margin-top: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2.5px dashed rgba(72, 249, 215, 0.55);
      background: rgba(72, 249, 215, 0.12);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .apo-gap:hover,
    .apo-gap.drag-active {
      width: clamp(36px, 4.6vw, 58px);
    }
    .apo-gap:hover .gap-socket,
    .apo-gap.drag-active .gap-socket {
      width: 32px;
      height: 38px;
      border-radius: 14px;
      border: 3px dashed #72efdd;
      background: rgba(114, 239, 221, 0.28);
      box-shadow: 0 0 20px #72efdd;
      transform: scale(1.1);
    }

    /* Правильно вставлений енергетичний апостроф */
    .apo-gap.solved {
      width: clamp(34px, 4.2vw, 52px);
      pointer-events: none;
    }
    .apo-gap.solved .gap-socket {
      display: none;
    }

    .crystal-apo-placed {
      width: clamp(28px, 3.8vw, 48px);
      height: clamp(46px, 5.8vw, 72px);
      margin-top: -8px;
      filter: drop-shadow(0 0 14px rgba(255, 214, 10, 0.95));
      animation: crystalSnap 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes crystalSnap {
      0% { transform: scale(0) rotate(35deg) translateY(-28px); }
      70% { transform: scale(1.28) rotate(-8deg) translateY(3px); }
      100% { transform: scale(1) rotate(0deg) translateY(0); }
    }

    /* Анімація помилки в слоті */
    @keyframes sparkError {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-10deg); }
      40% { transform: translateX(8px) rotate(10deg); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .apo-gap.wrong-flash .gap-socket {
      border-color: #ff4d6d;
      background: rgba(255, 77, 109, 0.65);
      box-shadow: 0 0 22px #ff4d6d;
      transform: scale(1.35);
      animation: sparkError 0.42s ease;
    }

    /* Тремтіння монітора при помилці */
    @keyframes monitorJolt {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-11px) rotate(-1deg); }
      40% { transform: translateX(11px) rotate(1deg); }
      60% { transform: translateX(-7px) rotate(-0.6deg); }
      80% { transform: translateX(7px) rotate(0.6deg); }
    }
    .monitor-jolt {
      animation: monitorJolt 0.44s ease-in-out;
    }

    /* Світіння монітора при перемозі на слові без апострофа */
    @keyframes monitorPulseWin {
      0% { transform: scale(1); filter: brightness(1); }
      45% { transform: scale(1.045); filter: brightness(1.22) drop-shadow(0 0 28px #72efdd); }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .monitor-win {
      animation: monitorPulseWin 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ==========================================================================
       5. ПАНЕЛЬ КАПСУЛ УНИЗУ (ЕНЕРГО-АПОСТРОФ ТА КЛАПАН «БЕЗ АПОСТРОФА»)
       ========================================================================== */
    #capsule-dock {
      position: absolute;
      bottom: 4.5vh;
      left: 46%;
      transform: translateX(-50%);
      z-index: 22;
      display: flex;
      align-items: center;
      gap: clamp(26px, 5.5vw, 68px);
    }

    .lab-pod {
      position: relative;
      width: clamp(88px, 11vw, 118px);
      height: clamp(88px, 11vw, 118px);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s;
      filter: drop-shadow(0 12px 18px rgba(4, 10, 26, 0.65));
      touch-action: none;
    }

    .lab-pod:hover {
      transform: scale(1.12) translateY(-6px);
      filter: drop-shadow(0 0 24px rgba(114, 239, 221, 0.85));
    }

    .lab-pod:active {
      transform: scale(0.94);
    }

    @keyframes podLevitate {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    #drag-crystal-pod {
      animation: podLevitate 2.6s ease-in-out infinite;
      cursor: grab;
    }
    #drag-crystal-pod:active {
      cursor: grabbing;
    }

    .pod-jolt {
      animation: sparkError 0.44s ease !important;
    }

    /* Елемент, який летить за курсором під час перетягування */
    #drag-preview {
      position: fixed;
      width: 68px;
      height: 86px;
      pointer-events: none;
      z-index: 100;
      display: none;
      transform: translate(-50%, -50%) rotate(6deg) scale(1.15);
      filter: drop-shadow(0 0 18px rgba(255, 214, 10, 0.95));
    }

    /* ==========================================================================
       6. ЖИВИЙ ПЕРСОНАЖ: ЮНИЙ ВИНАХІДНИК СПРАВА (ДЕТАЛІЗОВАНИЙ SVG З ЕМОЦІЯМИ)
       ========================================================================== */
    #inventor-wrap {
      position: absolute;
      bottom: 2vh;
      right: clamp(14px, 4.5vw, 76px);
      width: clamp(152px, 19.5vw, 240px);
      height: clamp(180px, 23vw, 280px);
      z-index: 20;
      pointer-events: none;
      transform-origin: center bottom;
    }

    /* Стан спокою: життєрадісне дихання і легке похитування */
    @keyframes inventorIdle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(-1.2deg); }
    }
    .inv-idle { animation: inventorIdle 2.5s ease-in-out infinite; }

    /* Перемога 1: Високий стрибок-левітація на радощах */
    @keyframes invHoverJump {
      0% { transform: translateY(0) scale(1); }
      25% { transform: translateY(8px) scale(1.08, 0.92); }
      55% { transform: translateY(-90px) rotate(-6deg) scale(1.06); }
      85% { transform: translateY(5px) scale(1.05, 0.95); }
      100% { transform: translateY(0) scale(1); }
    }
    .inv-win-0 { animation: invHoverJump 0.95s cubic-bezier(0.25, 1, 0.5, 1); }

    /* Перемога 2: Веселий танець-гойдалка */
    @keyframes invJoyDance {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      20% { transform: translateY(-24px) rotate(9deg); }
      40% { transform: translateY(0) rotate(-7deg); }
      60% { transform: translateY(-30px) rotate(-9deg); }
      80% { transform: translateY(0) rotate(5deg); }
    }
    .inv-win-1 { animation: invJoyDance 0.92s ease-in-out; }

    /* Перемога 3: Енергетичний оберт-підскок */
    @keyframes invSpinPop {
      0% { transform: translateY(0) scaleX(1); }
      30% { transform: translateY(-65px) scaleX(0.2); }
      50% { transform: translateY(-75px) scaleX(-1); }
      75% { transform: translateY(-30px) scaleX(0.3); }
      100% { transform: translateY(0) scaleX(1); }
    }
    .inv-win-2 { animation: invSpinPop 0.9s ease-in-out; }

    /* Перемога 4: Подвійний переможний стрибок */
    @keyframes invDoubleHop {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-48px) rotate(6deg); }
      48% { transform: translateY(0) scale(1.06, 0.94); }
      74% { transform: translateY(-68px) rotate(-6deg); }
    }
    .inv-win-3 { animation: invDoubleHop 0.95s ease-in-out; }

    /* Помилка: Кумедне здригання від іскри/диму */
    @keyframes invZapShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      15% { transform: translateX(-10px) rotate(-9deg); }
      35% { transform: translateX(10px) rotate(9deg); }
      55% { transform: translateX(-7px) rotate(-6deg); }
      75% { transform: translateX(6px) rotate(5deg); }
    }
    .inv-err-0 { animation: invZapShake 0.72s ease-in-out; }

    /* Рухи рук персонажа при радості */
    #inv-arm-l, #inv-arm-r {
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .inv-cheer #inv-arm-l {
      transform-origin: 86px 148px;
      transform: rotate(52deg);
    }
    .inv-cheer #inv-arm-r {
      transform-origin: 154px 148px;
      transform: rotate(-52deg);
    }

    /* Кліпання очима в окулярах */
    @keyframes gogglesBlink {
      0%, 93%, 100% { transform: scaleY(1); }
      96.5% { transform: scaleY(0.08); }
    }
    #inv-eyes-normal {
      transform-origin: 120px 92px;
      animation: gogglesBlink 4s infinite;
    }

    /* Обертання спіральок в окулярах при помилці */
    .dizzy-spin {
      transform-origin: center;
      transform-box: fill-box;
      animation: spinSlow 1s linear infinite;
    }

    /* Адаптація для планшетів та вузьких екранів */
    @media (max-width: 768px) {
      #inventor-wrap {
        right: 4px;
        bottom: 1vh;
        width: 122px;
        height: 148px;
      }
      #capsule-dock {
        left: 36%;
        bottom: 3.8vh;
        gap: 18px;
      }
      .nav-valve {
        width: 52px;
        height: 52px;
      }
      #btn-prev { left: 8px; }
      #btn-next { right: 8px; }
      #monitor-wrapper { margin-bottom: 18vh; }
    }
  </style>
</head>
<body>
  <div id="lab-stage">

    <!-- ======================================================================
         1. СЮЖЕТНИЙ ЖИВИЙ ФОН: СЕКРЕТНА ЛАБОРАТОРІЯ ВИНАХІДНИКА
         ====================================================================== -->
    <svg id="lab-bg-svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Глибокий бірюзово-індиговий градієнт стін лабораторії -->
        <radialGradient id="wallGrad" cx="50%" cy="38%" r="72%">
          <stop offset="0%" stop-color="#1d4e68"/>
          <stop offset="52%" stop-color="#132a4a"/>
          <stop offset="100%" stop-color="#091326"/>
        </radialGradient>

        <!-- Сітка креслень на фоні -->
        <pattern id="blueprintGrid" width="44" height="44" patternUnits="userSpaceOnUse">
          <path d="M44 0 L0 0 0 44" fill="none" stroke="rgba(114, 239, 221, 0.08)" stroke-width="1.2"/>
          <circle cx="0" cy="0" r="2" fill="rgba(114, 239, 221, 0.14)"/>
        </pattern>

        <!-- Бронзовий градієнт труб та шестерень -->
        <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffd166"/>
          <stop offset="50%" stop-color="#e09f3e"/>
          <stop offset="100%" stop-color="#9e5a16"/>
        </linearGradient>

        <!-- Рідини у великих колбах -->
        <linearGradient id="limeLiquid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#80ffdb"/>
          <stop offset="100%" stop-color="#06d6a0"/>
        </linearGradient>
        <linearGradient id="berryLiquid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff70a6"/>
          <stop offset="100%" stop-color="#b5179e"/>
        </linearGradient>
        <linearGradient id="amberLiquid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe66d"/>
          <stop offset="100%" stop-color="#f77f00"/>
        </linearGradient>

        <!-- Світло від верхніх ламп -->
        <linearGradient id="lampBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#80ffdb" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#80ffdb" stop-opacity="0"/>
        </linearGradient>

        <!-- Стіл лабораторії -->
        <linearGradient id="benchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2b3a67"/>
          <stop offset="100%" stop-color="#141b33"/>
        </linearGradient>
      </defs>

      <!-- Основна стіна з креслярською сіткою -->
      <rect width="1200" height="750" fill="url(#wallGrad)"/>
      <rect width="1200" height="600" fill="url(#blueprintGrid)"/>

      <!-- Промені світла від двох підвісних ламп -->
      <g class="lab-lamp-glow">
        <polygon points="270,76 140,480 400,480" fill="url(#lampBeam)"/>
        <polygon points="930,76 800,480 1060,480" fill="url(#lampBeam)"/>
      </g>

      <!-- Мідні труби під стелею та по боках -->
      <g stroke="#4a280a" stroke-width="3">
        <rect x="0" y="34" width="1200" height="16" fill="url(#brassGrad)"/>
        <rect x="115" y="48" width="18" height="560" fill="url(#brassGrad)"/>
        <rect x="1065" y="48" width="18" height="560" fill="url(#brassGrad)"/>
        <!-- Муфти на трубах -->
        <rect x="110" y="160" width="28" height="14" rx="4" fill="#ffd166"/>
        <rect x="110" y="380" width="28" height="14" rx="4" fill="#ffd166"/>
        <rect x="1060" y="180" width="28" height="14" rx="4" fill="#ffd166"/>
        <rect x="1060" y="400" width="28" height="14" rx="4" fill="#ffd166"/>
      </g>

      <!-- Підвісні лампи -->
      <g>
        <line x1="270" y1="0" x2="270" y2="56" stroke="#ffd166" stroke-width="5"/>
        <path d="M236 78 Q270 40 304 78 Z" fill="url(#brassGrad)" stroke="#1b263b" stroke-width="3"/>
        <ellipse cx="270" cy="79" rx="22" ry="7" fill="#80ffdb"/>

        <line x1="930" y1="0" x2="930" y2="56" stroke="#ffd166" stroke-width="5"/>
        <path d="M896 78 Q930 40 964 78 Z" fill="url(#brassGrad)" stroke="#1b263b" stroke-width="3"/>
        <ellipse cx="930" cy="79" rx="22" ry="7" fill="#80ffdb"/>
      </g>

      <!-- Обертові бронзові шестерні на задній стіні -->
      <g opacity="0.5">
        <!-- Велика шестерня зліва -->
        <g class="gear-cw" transform="translate(215, 225)">
          <circle cx="0" cy="0" r="46" fill="none" stroke="url(#brassGrad)" stroke-width="14" stroke-dasharray="18 11"/>
          <circle cx="0" cy="0" r="34" fill="none" stroke="url(#brassGrad)" stroke-width="10"/>
          <circle cx="0" cy="0" r="12" fill="#091326" stroke="#ffd166" stroke-width="4"/>
        </g>
        <!-- Мала шестерня поруч -->
        <g class="gear-ccw" transform="translate(288, 286)">
          <circle cx="0" cy="0" r="28" fill="none" stroke="#48bfe3" stroke-width="10" stroke-dasharray="13 9"/>

          <!-- РОТ: Захоплений сміх -->
          <path id="inv-mouth-win" d="M104 114 Q120 133 136 114 Z" fill="#ff4d6d" stroke="#111827" stroke-width="3.2" stroke-linejoin="round" style="display:none;"/>
          <!-- РОТ: Кумедне «О!» при помилці -->
          <ellipse id="inv-mouth-err" cx="120" cy="120" rx="8" ry="10" fill="#3a0ca3" stroke="#111827" stroke-width="3.2" style="display:none;"/>
        </g>

        <!-- ІСКРИ ЕВРИКИ НАД ГОЛОВОЮ (з'являються при перемозі) -->
        <g id="eureka-fx" style="display:none;">
          <polygon points="120,2 124,14 136,16 126,23 129,34 120,27 111,34 114,23 104,16 116,14"
                   fill="#ffe66d" stroke="#111827" stroke-width="2"/>
          <circle cx="72" cy="24" r="6" fill="#80ffdb"/>
          <circle cx="170" cy="22" r="5.5" fill="#ff70a6"/>
        </g>
      </svg>
    </div>

    <!-- Полотно для бульбашок, іскор та диму -->
    <canvas id="fx-canvas"></canvas>
  </div>

  <script>
    /* ==========================================================================
       1. СЛОВНИК ГРИ (24 СЛОВА З АПОСТРОФОМ ТА БЕЗ НЬОГО)
       --------------------------------------------------------------------------
       Як редагувати список:
       - letters: слово БЕЗ апострофа.
       - apoIndex: номер проміжку після літери (зліва направо, починаючи з 1).
         Наприклад, у слові "м'яч" апостроф після 1-ї літери -> apoIndex: 1.
       - Якщо апостроф НЕ ставиться -> apoIndex: -1.
       ========================================================================== */
    const WORDS = [
      { letters: 'мяч',       apoIndex: 1  }, // м'яч
      { letters: 'свято',     apoIndex: -1 }, // свято
      { letters: 'пять',      apoIndex: 1  }, // п'ять
      { letters: 'крюк',      apoIndex: -1 }, // крюк
      { letters: 'обєм',      apoIndex: 2  }, // об'єм
      { letters: 'цвях',      apoIndex: -1 }, // цвях
      { letters: 'сімя',      apoIndex: 3  }, // сім'я
      { letters: 'рядок',     apoIndex: -1 }, // рядок
      { letters: 'бурян',     apoIndex: 3  }, // бур'ян
      { letters: 'бюро',      apoIndex: -1 }, // бюро
      { letters: 'подвіря',   apoIndex: 6  }, // подвір'я
      { letters: 'духмяний',  apoIndex: -1 }, // духмяний
      { letters: 'компютер',  apoIndex: 4  }, // комп'ютер
      { letters: 'тьмяний',   apoIndex: -1 }, // тьмяний
      { letters: 'здоровя',   apoIndex: 6  }, // здоров'я
      { letters: 'різдвяний', apoIndex: -1 }, // різдвяний
      { letters: 'память',    apoIndex: 3  }, // пам'ять
      { letters: 'рятунок',   apoIndex: -1 }, // рятунок
      { letters: 'підїзд',    apoIndex: 3  }, // під'їзд
      { letters: 'дзвякнути', apoIndex: -1 }, // дзвякнути
      { letters: 'камяний',   apoIndex: 3  }, // кам'яний
      { letters: 'рюкзак',    apoIndex: -1 }, // рюкзак
      { letters: 'зєднати',   apoIndex: 1  }, // з'єднати
      { letters: 'премєра',   apoIndex: 4  }  // прем'єра
    ];

    /* ==========================================================================
       2. ЛАБОРАТОРНИЙ ЗВУКОВИЙ СИНТЕЗАТОР (WEB AUDIO API, БЕЗ СЛІВ)
       ========================================================================== */
    const LabAudio = (() => {
      let ac = null;

      function init() {
        if (!ac) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          ac = new Ctx();
        }
        if (ac.state === 'suspended') ac.resume();
        return ac;
      }

      // Базовий генератор одного звукового імпульсу
      function pulse(freq, delay, dur, type = 'sine', vol = 0.2, endFreq = null) {
        const ctx = init();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t = ctx.currentTime + delay;

        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
      }

      return {
        // Звук бульбашки при захопленні апострофа
        grab() {
          pulse(380, 0, 0.09, 'sine', 0.18, 760);
        },
        // Клацання клапана «Назад / Далі»
        valve() {
          pulse(300, 0, 0.07, 'triangle', 0.15, 520);
        },
        // 4 різні лабораторно-кришталеві мелодії успіху
        win(variant) {
          const v = variant % 4;
          if (v === 0) {
            // Іскристий каскад бульбашок + дзвінкий акорд
            [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) =>
              pulse(f, i * 0.06, 0.24, 'sine', 0.2)
            );
          } else if (v === 1) {
            // Електричний синтезатор-фанфар
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
              pulse(f, i * 0.075, 0.28, 'triangle', 0.22)
            );
            pulse(1318.5, 0.3, 0.35, 'sine', 0.18);
          } else if (v === 2) {
            // Веселий глісандо-запуск експерименту
            pulse(320, 0, 0.15, 'sine', 0.2, 880);
            pulse(659.25, 0.14, 0.3, 'triangle', 0.2);
            pulse(987.77, 0.2, 0.34, 'sine', 0.22);
          } else {
            // Подвійний кристальний передзвін
            [587.33, 880, 739.99, 1174.66].forEach((f, i) =>
              pulse(f, i * 0.07, 0.25, 'triangle', 0.2)
            );
          }
        },
        // 2 кумедні лабораторні звуки помилки (булькання + пружинка)
        err(variant) {
          const v = variant % 2;
          if (v === 0) {
            pulse(290, 0, 0.13, 'sine', 0.2, 160);
            pulse(210, 0.11, 0.2, 'sawtooth', 0.09, 115);
          } else {
            pulse(360, 0, 0.09, 'triangle', 0.18, 220);
            pulse(220, 0.09, 0.18, 'triangle', 0.18, 130);
          }
        }
      };
    })();

    /* ==========================================================================
       3. СПЕЦЕФЕКТИ НА CANVAS (РАЙДУЖНІ БУЛЬБАШКИ, КРИСТАЛИ, ХМАРКИ ДИМУ)
       ========================================================================== */
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];

    function resizeFX() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFX);
    resizeFX();

    const LAB_COLORS = ['#80ffdb', '#ffe66d', '#ff70a6', '#06d6a0', '#72efdd', '#ffd166', '#ffffff'];

    // Вибух бульбашок та енерго-кристалів при перемозі
    function spawnWinFX(x, y, variant = 0) {
      for (let i = 0; i < 42; i++) {
        const angle = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.3;
        const speed = 3 + Math.random() * 8.5;
        const kind = (i + variant) % 3 === 0 ? 'bubble' : ((i + variant) % 3 === 1 ? 'diamond' : 'spark');
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.6,
          size: kind === 'bubble' ? 8 + Math.random() * 14 : 6 + Math.random() * 9,
          color: LAB_COLORS[Math.floor(Math.random() * LAB_COLORS.length)],
          alpha: 1,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.22,
          gravity: kind === 'bubble' ? -0.06 : 0.2,
          kind
        });
      }
    }

    // Кумедна хмарка фіолетового диму при помилці
    function spawnSmokeFX(x, y) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 3.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: 12 + Math.random() * 16,
          color: i % 2 === 0 ? '#b5179e' : '#7209b7',
          alpha: 0.72,
          rot: 0,
          vRot: 0,
          gravity: -0.05,
          kind: 'smoke'
        });
      }
    }

    function loopFX() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.982;
        p.rot += p.vRot;
        p.alpha -= p.kind === 'smoke' ? 0.024 : 0.015;
        if (p.kind === 'smoke') p.size += 0.45;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, p.alpha);
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);

        if (p.kind === 'bubble') {
          fxCtx.strokeStyle = p.color;
          fxCtx.lineWidth = 2.6;
          fxCtx.beginPath();
          fxCtx.arc(0, 0, p.size, 0, Math.PI * 2);
          fxCtx.stroke();
          // Блік на бульбашці
          fxCtx.fillStyle = '#ffffff';
          fxCtx.beginPath();
          fxCtx.arc(-p.size * 0.35, -p.size * 0.35, p.size * 0.22, 0, Math.PI * 2);
          fxCtx.fill();
        } else if (p.kind === 'diamond') {
          fxCtx.fillStyle = p.color;
          fxCtx.beginPath();
          fxCtx.moveTo(0, -p.size);
          fxCtx.lineTo(p.size * 0.7, 0);
          fxCtx.lineTo(0, p.size);
          fxCtx.lineTo(-p.size * 0.7, 0);
          fxCtx.closePath();
          fxCtx.fill();
        } else {
          fxCtx.fillStyle = p.color;
          fxCtx.beginPath();
          fxCtx.arc(0, 0, p.size * 0.6, 0, Math.PI * 2);
          fxCtx.fill();
        }
        fxCtx.restore();
      }
      requestAnimationFrame(loopFX);
    }
    loopFX();

    /* ==========================================================================
       4. ЕМОЦІЇ ТА ЖИВІ РУХИ ПЕРСОНАЖА-ВИНАХІДНИКА
       ========================================================================== */
    const invWrap = document.getElementById('inventor-wrap');
    const invEyesNormal = document.getElementById('inv-eyes-normal');
    const invEyesStar = document.getElementById('inv-eyes-star');
    const invEyesHappy = document.getElementById('inv-eyes-happy');
    const invEyesDizzy = document.getElementById('inv-eyes-dizzy');
    const invMouthIdle = document.getElementById('inv-mouth-idle');
    const invMouthWin = document.getElementById('inv-mouth-win');
    const invMouthErr = document.getElementById('inv-mouth-err');
    const invPupils = document.getElementById('inv-pupils');
    const eurekaFx = document.getElementById('eureka-fx');

    let invResetTimer = null;

    // Очі в окулярах стежать за рухом миші або пальця
    window.addEventListener('pointermove', (e) => {
      const r = invWrap.getBoundingClientRect();
      const cx = r.left + r.width * 0.5;
      const cy = r.top + r.height * 0.34;
      const dx = Math.max(-4.5, Math.min(4.5, (e.clientX - cx) / 85));
      const dy = Math.max(-3.5, Math.min(3.5, (e.clientY - cy) / 85));
      invPupils.setAttribute('transform', `translate(${dx.toFixed(1)}, ${dy.toFixed(1)})`);
    });

    function setInventorMood(mood, variant = 0) {
      clearTimeout(invResetTimer);

      invWrap.className = '';
      invEyesNormal.style.display = 'none';
      invEyesStar.style.display = 'none';
      invEyesHappy.style.display = 'none';
      invEyesDizzy.style.display = 'none';
      invMouthIdle.style.display = 'none';
      invMouthWin.style.display = 'none';
      invMouthErr.style.display = 'none';
      eurekaFx.style.display = 'none';

      void invWrap.offsetWidth;

      if (mood === 'win') {
        const v = variant % 4;
        invWrap.classList.add(`inv-win-${v}`, 'inv-cheer');
        invMouthWin.style.display = 'block';
        eurekaFx.style.display = 'block';
        if (v % 2 === 0) {
          invEyesStar.style.display = 'block';
        } else {
          invEyesHappy.style.display = 'block';
        }
        invResetTimer = setTimeout(() => setInventorMood('idle'), 1150);
      } else if (mood === 'err') {
        invWrap.classList.add('inv-err-0');
        invEyesDizzy.style.display = 'block';
        invMouthErr.style.display = 'block';
        invResetTimer = setTimeout(() => setInventorMood('idle'), 850);
      } else {
        invWrap.classList.add('inv-idle');
        invEyesNormal.style.display = 'block';
        invMouthIdle.style.display = 'block';
      }
    }

    /* ==========================================================================
       5. ОСНОВНА МЕХАНІКА ГРИ (РЕНДЕР СЛОВА, КЛІК, ПЕРЕТЯГУВАННЯ, ПЕРЕХІД)
       ========================================================================== */
    const wordStage = document.getElementById('word-stage');
    const monitorWrapper = document.getElementById('monitor-wrapper');
    const dragCrystalPod = document.getElementById('drag-crystal-pod');
    const noApoPod = document.getElementById('no-apo-pod');
    const dragPreview = document.getElementById('drag-preview');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    let currentIdx = 0;
    let locked = false;
    let winCount = 0;
    let errCount = 0;
    let nextLevelTimer = null;

    // Створення SVG-елемента вставленого апострофа
    function createCrystalApoSVG() {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 60 85');
      svg.classList.add('crystal-apo-placed');
      svg.innerHTML = `
        <path d="M30 8 C46 8 54 20 51 38 C48 56 35 71 16 79 C11 81 8 74 12 70 C21 62 26 51 26 42 C15 41 10 33 12 23 C14 14 21 8 30 8 Z"
              fill="#ffe66d" stroke="#1b263b" stroke-width="5.5" stroke-linejoin="round"/>
        <circle cx="27" cy="22" r="4.5" fill="#ffffff"/>
      `;
      return svg;
    }

    // Виведення поточного слова на голографічний монітор
    function loadWord() {
      clearTimeout(nextLevelTimer);
      locked = false;
      monitorWrapper.classList.remove('monitor-jolt', 'monitor-win');

      const entry = WORDS[currentIdx];
      wordStage.innerHTML = '';
      wordStage.classList.remove('word-holo-in');
      void wordStage.offsetWidth;
      wordStage.classList.add('word-holo-in');

      const chars = [...entry.letters];
      chars.forEach((char, i) => {
        const letterEl = document.createElement('span');
        letterEl.className = 'lab-letter';
        letterEl.textContent = char;
        wordStage.appendChild(letterEl);

        // Додаємо інтерактивний слот між літерами
        if (i < chars.length - 1) {
          const gapPos = i + 1;
          const gapEl = document.createElement('div');
          gapEl.className = 'apo-gap';
          gapEl.dataset.pos = gapPos;

          const socket = document.createElement('div');
          socket.className = 'gap-socket';
          gapEl.appendChild(socket);

          // Можна натискати напряму між літерами
          gapEl.addEventListener('click', () => checkGap(gapPos, gapEl));
          wordStage.appendChild(gapEl);
        }
      });
    }

    // Перевірка вставки апострофа у вибраний слот
    function checkGap(gapPos, gapEl) {
      if (locked) return;
      const entry = WORDS[currentIdx];

      if (entry.apoIndex === gapPos) {
        locked = true;
        gapEl.classList.add('solved');
        gapEl.appendChild(createCrystalApoSVG());

        const r = gapEl.getBoundingClientRect();
        onCorrect(r.left + r.width / 2, r.top + r.height / 3);
      } else {
        gapEl.classList.remove('wrong-flash');
        void gapEl.offsetWidth;
        gapEl.classList.add('wrong-flash');
        setTimeout(() => gapEl.classList.remove('wrong-flash'), 480);

        const r = gapEl.getBoundingClientRect();
        onWrong(r.left + r.width / 2, r.top + r.height / 3);
      }
    }

    // Перевірка кнопки «Без апострофа»
    noApoPod.addEventListener('click', () => {
      if (locked) return;
      const entry = WORDS[currentIdx];

      if (entry.apoIndex === -1) {
        locked = true;
        monitorWrapper.classList.add('monitor-win');
        const r = monitorWrapper.getBoundingClientRect();
        onCorrect(r.left + r.width / 2, r.top + r.height / 2);
      } else {
        noApoPod.classList.remove('pod-jolt');
        void noApoPod.offsetWidth;
        noApoPod.classList.add('pod-jolt');
        setTimeout(() => noApoPod.classList.remove('pod-jolt'), 480);

        const r = noApoPod.getBoundingClientRect();
        onWrong(r.left + r.width / 2, r.top + r.height / 2);
      }
    });

    // Активний фідбек при правильній відповіді
    function onCorrect(fxX, fxY) {
      const variant = winCount++;
      LabAudio.win(variant);
      setInventorMood('win', variant);

      // Хвиля підсвічування літер
      const letters = wordStage.querySelectorAll('.lab-letter');
      letters.forEach((el, idx) => {
        setTimeout(() => el.classList.add('lit-win'), idx * 42);
      });

      // Подвійний залп бульбашок та кристалів
      spawnWinFX(fxX, fxY, variant);
      const invRect = invWrap.getBoundingClientRect();
      setTimeout(() => {
        spawnWinFX(invRect.left + invRect.width * 0.5, invRect.top + invRect.height * 0.3, variant + 1);
      }, 150);

      // Автоматичний перехід до наступного слова
      nextLevelTimer = setTimeout(() => {
        currentIdx = (currentIdx + 1) % WORDS.length;
        loadWord();
      }, 1350);
    }

    // Активний м'який фідбек при помилці
    function onWrong(fxX, fxY) {
      const variant = errCount++;
      LabAudio.err(variant);
      setInventorMood('err', variant);
      spawnSmokeFX(fxX, fxY);

      monitorWrapper.classList.remove('monitor-jolt');
      void monitorWrapper.offsetWidth;
      monitorWrapper.classList.add('monitor-jolt');
    }

    /* ==========================================================================
       6. ПЕРЕТЯГУВАННЯ (DRAG & DROP) ДЛЯ МИШІ ТА СЕНСОРНИХ ЕКРАНІВ
       ========================================================================== */
    let dragging = false;
    let hoveredGap = null;

    dragCrystalPod.addEventListener('pointerdown', (e) => {
      if (locked) return;
      dragging = true;
      LabAudio.grab();
      dragPreview.style.display = 'block';
      updatePreviewPos(e.clientX, e.clientY);
      dragCrystalPod.setPointerCapture(e.pointerId);
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      updatePreviewPos(e.clientX, e.clientY);

      const nearest = findNearestGap(e.clientX, e.clientY);
      if (hoveredGap && hoveredGap !== nearest) {
        hoveredGap.classList.remove('drag-active');
      }
      hoveredGap = nearest;
      if (hoveredGap) {
        hoveredGap.classList.add('drag-active');
      }
    });

    window.addEventListener('pointerup', () => {
      if (!dragging) return;
      dragging = false;
      dragPreview.style.display = 'none';

      if (hoveredGap) {
        hoveredGap.classList.remove('drag-active');
        const pos = Number(hoveredGap.dataset.pos);
        checkGap(pos, hoveredGap);
        hoveredGap = null;
      }
    });

    function updatePreviewPos(x, y) {
      dragPreview.style.left = `${x}px`;
      dragPreview.style.top = `${y}px`;
    }

    // Магнітний пошук найближчого слота (зручно для дітей)
    function findNearestGap(x, y) {
      const gaps = wordStage.querySelectorAll('.apo-gap:not(.solved)');
      let best = null;
      let minDist = 50;
      gaps.forEach((gap) => {
        const r = gap.getBoundingClientRect();
        const dist = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
        if (dist < minDist) {
          minDist = dist;
          best = gap;
        }
      });
      return best;
    }

    /* ==========================================================================
       7. МИТТЄВА НАВІГАЦІЯ «НАЗАД» ТА «ДАЛІ» (БЕЗ ПРОХОДЖЕННЯ РІВНЯ)
       ========================================================================== */
    btnNext.addEventListener('click', () => {
      LabAudio.valve();
      currentIdx = (currentIdx + 1) % WORDS.length;
      setInventorMood('idle');
      loadWord();
    });

    btnPrev.addEventListener('click', () => {
      LabAudio.valve();
      currentIdx = (currentIdx - 1 + WORDS.length) % WORDS.length;
      setInventorMood('idle');
      loadWord();
    });

    // Старт гри
    loadWord();
  </script>
</body>
</html>
