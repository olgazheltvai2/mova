<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adjectives Game</title>
    <!-- Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --base-font-size: 22px;
            --btn-font-size: 20px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f9f9f9; 
            background-image: none; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif; 
            color: #111;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
            transition: background-image 0.3s ease;
        }

        .sketch-effect {
            filter: url(#sketch-filter);
        }

        #bg-sketch-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #game-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transform-origin: center center;
            transition: transform 0.2s ease;
            z-index: 10;
        }

        #cat-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 180px;
            z-index: 100;
            pointer-events: none;
            transition: all 0.5s ease-in-out;
        }

        #nav-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 120;
        }

        .nav-btn {
            background: #fff;
            border: 3px solid #000;
            border-radius: 50% 40% 50% 40% / 40% 50% 40% 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 4px 4px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .nav-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 #000;
        }

        #task-container {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            min-height: 400px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: var(--base-font-size);
            text-align: center;
        }

        .check-btn {
            margin-top: 20px;
            background: #fff;
            border: 3px solid #000;
            border-radius: 10px 20px 10px 20px;
            width: 70px;
            height: 50px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
        }

        .mcq-btn, .word-btn {
            background: #fff;
            border: 2px solid #000;
            border-radius: 15px 5px 20px 10px;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: var(--btn-font-size);
            box-shadow: 2px 2px 0 #000;
        }
        
        .word-btn.selected {
            background: #000;
            color: #fff;
        }

        .drag-item {
            display: inline-block;
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 5px 15px;
            margin: 5px;
            cursor: grab;
            font-weight: bold;
            box-shadow: 2px 2px 0 #000;
            touch-action: none; 
            position: relative;
            z-index: 50;
        }

        .drop-zone {
            display: inline-block;
            min-width: 60px;
            height: 35px;
            border: 2px dashed #000;
            border-radius: 10px;
            margin: 0 5px;
            vertical-align: middle;
            background: rgba(255,255,255,0.5);
        }

        .category-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 20px;
        }

        .category-box {
            width: 45%;
            min-height: 150px;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
            background: rgba(255,255,255,0.8);
        }

        .category-title {
            width: 100%;
            font-weight: bold;
            border-bottom: 2px solid #000;
            margin-bottom: 10px;
            padding-bottom: 5px;
        }

        .sketch-input {
            border: none;
            border-bottom: 2px solid #000;
            background: rgba(255,255,255,0.7);
            font-family: inherit;
            font-size: var(--base-font-size);
            width: 120px;
            text-align: center;
            outline: none;
            color: #000;
            border-radius: 5px;
        }

        .match-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            position: relative;
        }
        .match-col { display: flex; flex-direction: column; gap: 15px; }
        .match-item {
            border: 2px solid #000; padding: 10px; border-radius: 10px; cursor: pointer; background: #fff;
        }
        .match-item.active { background: #ddd; }

        @keyframes tail-wag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }
        @keyframes blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
        @keyframes cool-dance {
            0% { transform: translate(-50%, 0) rotate(0deg) scale(1.5); }
            20% { transform: translate(-50%, -80px) rotate(-20deg) scale(1.6); }
            40% { transform: translate(-50%, 0) rotate(20deg) scale(1.5); }
            60% { transform: translate(-50%, -100px) rotate(360deg) scale(1.6); }
            80% { transform: translate(-50%, 0) rotate(-20deg) scale(1.5); }
            100% { transform: translate(-50%, 0) rotate(0deg) scale(1.5); }
        }
        
        .cat-tail { transform-origin: 20px 150px; animation: tail-wag 2s infinite ease-in-out; }
        .cat-eyes { transform-origin: center; animation: blink 4s infinite; }
        .anim-happy { animation: bounce 0.5s ease 3; }
        .anim-sad { animation: shake 0.4s ease 2; }
        .anim-cool-dance { animation: cool-dance 2.5s infinite ease-in-out !important; }
        
        .clickable-word {
            cursor: pointer;
            display: inline-block;
            margin: 0 5px;
            font-weight: bold; 
        }

        .tool-panel-left {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10000;
        }
        .tool-btn {
            background: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
        }
        .tool-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        @media (max-width: 600px) {
            .tool-panel-left {
                top: 10px;
                left: 10px;
                transform: scale(0.8);
                transform-origin: top left;
            }
            #nav-container {
                top: 10px;
                right: 10px;
                transform: scale(0.8);
                transform-origin: top right;
            }
            #draw-panel-global {
                width: 90vw;
                right: 5vw !important;
            }
            #theme-modal {
                width: 95% !important;
            }
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position: absolute;">
        <filter id="sketch-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div id="bg-sketch-elements" class="sketch-effect">
        <svg style="position:absolute; top: 5%; left: 5%; width: 150px; height: 150px;" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="20" fill="none" stroke="#000" stroke-width="3"/>
            <line x1="50" y1="10" x2="50" y2="25" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <line x1="50" y1="75" x2="50" y2="90" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <line x1="10" y1="50" x2="25" y2="50" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <line x1="75" y1="50" x2="90" y2="50" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <line x1="22" y1="22" x2="32" y2="32" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <line x1="78" y1="78" x2="68" y2="68" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <line x1="22" y1="78" x2="32" y2="68" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <line x1="78" y1="22" x2="68" y2="32" stroke="#000" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <svg style="position:absolute; bottom: 5%; right: 5%; width: 180px; height: 150px;" viewBox="0 0 200 150">
            <rect x="50" y="100" width="120" height="20" fill="none" stroke="#000" stroke-width="3" rx="3"/>
            <rect x="40" y="80" width="130" height="20" fill="none" stroke="#000" stroke-width="3" rx="3" transform="rotate(-5 100 90)"/>
            <rect x="60" y="120" width="110" height="20" fill="none" stroke="#000" stroke-width="3" rx="3"/>
            <path d="M 120 70 C 100 70, 90 40, 120 40 C 150 40, 140 70, 120 70 Z" fill="none" stroke="#000" stroke-width="3"/>
            <path d="M 120 45 Q 125 30 135 25" fill="none" stroke="#000" stroke-width="3"/>
            <polygon points="10,140 30,130 140,20 120,0 10,110 0,140" fill="none" stroke="#000" stroke-width="3"/>
            <line x1="30" y1="130" x2="10" y2="110" stroke="#000" stroke-width="3"/>
            <line x1="120" y1="0" x2="140" y2="20" stroke="#000" stroke-width="3"/>
        </svg>
        <svg style="position:absolute; top: 15%; right: 20%; width: 100px; height: 100px;" viewBox="0 0 100 100">
            <polygon points="10,90 90,10 40,90 45,60 10,50" fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
            <line x1="90" y1="10" x2="45" y2="60" stroke="#000" stroke-width="3"/>
            <path d="M 5,95 Q -10,110 5,120" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
        </svg>
    </div>

    <div class="tool-panel-left">
        <button class="tool-btn" id="btn-zoom-out" title="Віддалити">🔍-</button>
        <button class="tool-btn" id="btn-zoom-in" title="Наблизити">🔍+</button>
        <button class="tool-btn" id="btn-font-out" title="Зменшити шрифт">A-</button>
        <button class="tool-btn" id="btn-font-in" title="Збільшити шрифт">A+</button>
    </div>

    <canvas id="global-draw-canvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:90000; pointer-events:none;"></canvas>

    <button id="toggle-draw-btn-global" style="position:fixed; bottom:85px; right:20px; z-index:90001; background:#8e44ad; color:white; border:none; border-radius:10px; padding:10px; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:2px 2px 5px rgba(0,0,0,0.3);">✏️ Малювати</button>
    
    <div id="draw-panel-global" style="display:none; position:fixed; top:80px; right:20px; z-index:90002; background:white; border:3px solid #000; border-radius:10px; padding:10px; box-shadow:4px 4px 0 #000; flex-direction:column; gap:10px;">
       <div id="draw-handle" style="cursor:move; background:#ddd; padding:5px; text-align:center; font-weight:bold; border-radius:5px;">Перетягнути <span id="close-draw-btn" style="float:right; cursor:pointer; color:red;">✕</span></div>
       <div style="display:flex; gap:5px;">
           <button id="btn-pencil" style="flex:1; background:#000; color:#fff; border:2px solid #000; border-radius:5px; padding:5px; cursor:pointer;">✏️ Олівець</button>
           <button id="btn-eraser" style="flex:1; background:#fff; color:#000; border:2px solid #000; border-radius:5px; padding:5px; cursor:pointer;">🧽 Гумка</button>
       </div>
       <input type="range" id="draw-thickness" min="1" max="50" value="5" style="width:100%;">
       <input type="color" id="draw-color" value="#8e44ad" style="width:100%; height:30px; cursor:pointer;">
       <button id="btn-clear-draw" style="background:#ff4757; color:white; border:2px solid #000; border-radius:5px; padding:5px; cursor:pointer; font-weight:bold;">🗑️ Очистити</button>
    </div>

    <button id="theme-btn" style="position:fixed; bottom:20px; right:20px; z-index:10000; font-size:24px; background:#fff; border:3px solid #000; border-radius:50%; width:50px; height:50px; cursor:pointer; box-shadow: 2px 2px 0 #000;">⚙️</button>
    <div id="theme-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:80%; max-width:600px; max-height:60vh; background:#fff; border:4px solid #000; z-index:10001; overflow-y:auto; padding:20px; border-radius:15px; box-shadow: 10px 10px 0 rgba(0,0,0,0.5);">
        <h2 style="margin-top:0; border-bottom:2px solid #000; padding-bottom:10px;">Обери фон <span id="close-theme" style="float:right; cursor:pointer; color:red;">✕</span></h2>
        <div id="theme-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px;">
             <div class="theme-item" data-url="none" style="border:2px solid #000; border-radius:10px; cursor:pointer; text-align:center; height:100px; display:flex; align-items:center; justify-content:center; background:#eee; font-weight:bold;" onclick="selectTheme('none')">Без фону</div>
        </div>
    </div>

    <div id="nav-container" class="sketch-effect">
        <button class="nav-btn" id="btn-back">←</button>
        <button class="nav-btn" id="btn-next">→</button>
    </div>

    <canvas id="confetti-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000;"></canvas>

    <div id="game-container">
        <div id="cat-container" class="sketch-effect">
            <svg viewBox="0 0 150 180" width="100%" height="100%">
                <path class="cat-tail" d="M 40 140 Q 10 160 20 120 Q 30 90 10 70" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
                <path d="M 50 160 Q 30 100 50 70 L 100 70 Q 120 100 100 160 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 60 160 v 15 M 90 160 v 15" stroke="#000" stroke-width="6" stroke-linecap="round"/>
                <path d="M 30 70 Q 75 20 120 70 Q 130 110 75 110 Q 20 110 30 70 Z" fill="#fff" stroke="#000" stroke-width="4"/>
                <path d="M 35 60 L 25 20 L 60 40 M 115 60 L 125 20 L 90 40" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
                <path d="M 40 85 L 10 80 M 40 95 L 10 100 M 110 85 L 140 80 M 110 95 L 140 100" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                <path d="M 35 75 A 15 15 0 1 0 65 75 A 15 15 0 1 0 35 75 M 85 75 A 15 15 0 1 0 115 75 A 15 15 0 1 0 85 75 M 65 75 L 85 75" fill="none" stroke="#000" stroke-width="4"/>
                <g class="cat-eyes">
                    <circle cx="50" cy="75" r="3" fill="#000"/>
                    <circle cx="100" cy="75" r="3" fill="#000"/>
                </g>
                <path d="M 70 85 L 80 85 L 75 92 Z" fill="#000"/>
                <path id="cat-mouth" d="M 65 95 Q 75 105 85 95" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>

        <div id="task-container" class="sketch-effect"></div>
    </div>

<script>
// =========================================================
// КОНФІГУРАЦІЯ ТА СИНХРОНІЗАЦІЯ FIREBASE
// =========================================================
const CONFIG = { gameId: 'adjectives_game_001' };
const firebaseConfig = {
    databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
    projectId: "lesson-13c44"
};

let db = null;
let isFirebaseConnected = false;
let mySessionId = 'session_' + Math.random().toString(36).substr(2, 9);
let isRemoteAction = false; // Блокувальник відлуння

try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    isFirebaseConnected = true;
} catch (e) {
    console.warn("Firebase не підключено, гра працюватиме локально.");
}

// Універсальна функція для надсилання ВСІХ дій
function emitSync(actionType, actionData) {
    if (!isFirebaseConnected || isRemoteAction) return;
    db.ref('game_action_' + CONFIG.gameId).push().set({
        type: actionType,
        data: actionData || {},
        senderId: mySessionId,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    });
}

// Приймач ВСІХ дій
if (isFirebaseConnected) {
    const startTime = Date.now();
    db.ref('game_action_' + CONFIG.gameId).orderByChild('timestamp').startAt(startTime).on('child_added', snap => {
        const payload = snap.val();
        if (payload.senderId === mySessionId) return;

        isRemoteAction = true;
        try {
            if (payload.type === 'CLICK') {
                const el = document.getElementById(payload.data.id);
                if (el) el.click();
            } else if (payload.type === 'INPUT') {
                const el = document.getElementById(payload.data.id);
                if (el) { el.value = payload.data.val; }
            } else if (payload.type === 'DROP') {
                const dragEl = document.getElementById(payload.data.dragId);
                const dropEl = payload.data.dropZoneId === 'drag-pool'
                    ? document.getElementById('drag-pool')
                    : document.getElementById(payload.data.dropZoneId);
                if (dragEl && dropEl) {
                    dragEl.style.position = 'relative';
                    dragEl.style.left = '0';
                    dragEl.style.top = '0';
                    dragEl.style.zIndex = '';
                    dropEl.appendChild(dragEl);
                    playPop();
                }
            } else if (payload.type === 'draw_line') {
                const w = drawCanvas.width;
                const h = drawCanvas.height;
                drawLineOnCanvas(payload.data.x0 * w, payload.data.y0 * h, payload.data.x1 * w, payload.data.y1 * h, payload.data.color, payload.data.thickness, false);
            } else if (payload.type === 'clear_canvas') {
                ctxDraw.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            }
        } finally {
            isRemoteAction = false;
        }
    });
}

function makeSafeId(prefix, str) {
    return prefix + '-' + encodeURIComponent(str).replace(/%/g, '');
}

// =========================================================
// THEME MANAGER
// =========================================================
const savedThemeKey = 'mySavedBg_' + CONFIG.gameId;

function applyTheme(url) {
    if (url === 'none') {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#f9f9f9';
    } else {
        document.body.style.backgroundImage = `url('${url}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
    }
}

const initialTheme = localStorage.getItem(savedThemeKey);
if (initialTheme) { applyTheme(initialTheme); }

function selectTheme(url) {
    applyTheme(url);
    localStorage.setItem(savedThemeKey, url);
    document.getElementById('theme-modal').style.display = 'none';
    if (isFirebaseConnected) {
        db.ref('game_theme_' + CONFIG.gameId).set({
            url: url, timestamp: firebase.database.ServerValue.TIMESTAMP
        });
    }
}

if (isFirebaseConnected) {
    db.ref('game_theme_' + CONFIG.gameId).on('value', snap => {
        const data = snap.val();
        if (data && data.url) {
            applyTheme(data.url);
            localStorage.setItem(savedThemeKey, data.url);
        }
    });
}

function loadThemesSequentially(index) {
    let url = `https://olgazheltvai2.github.io/images/backgrounds/background_${index}.webp`;
    let img = new Image();
    img.onload = () => {
        let div = document.createElement('div');
        div.className = 'theme-item';
        div.style.border = '2px solid #000';
        div.style.borderRadius = '10px';
        div.style.cursor = 'pointer';
        div.style.height = '100px';
        div.style.backgroundImage = `url('${url}')`;
        div.style.backgroundSize = 'cover';
        div.style.backgroundPosition = 'center';
        div.style.position = 'relative';
        div.style.overflow = 'hidden';
        div.innerHTML = `<span style="background:rgba(255,255,255,0.8); position:absolute; bottom:0; width:100%; text-align:center; font-weight:bold; padding:2px 0;">Фон ${index}</span>`;
        div.onclick = () => selectTheme(url);
        document.getElementById('theme-grid').appendChild(div);
        loadThemesSequentially(index + 1);
    };
    img.onerror = () => { };
    img.src = url;
}

document.getElementById('theme-btn').onclick = () => {
    document.getElementById('theme-modal').style.display = 'block';
    if (document.getElementById('theme-grid').children.length === 1) loadThemesSequentially(1);
};
document.getElementById('close-theme').onclick = () => document.getElementById('theme-modal').style.display = 'none';

// =========================================================
// ІНСТРУМЕНТИ (ЗУМ ТА ШРИФТ)
// =========================================================
let currentZoom = 1;
let currentFontScale = 1;

document.getElementById('btn-zoom-in').onclick = () => {
    currentZoom += 0.1; document.getElementById('game-container').style.transform = `scale(${currentZoom})`;
};
document.getElementById('btn-zoom-out').onclick = () => {
    currentZoom = Math.max(0.5, currentZoom - 0.1); document.getElementById('game-container').style.transform = `scale(${currentZoom})`;
};
document.getElementById('btn-font-in').onclick = () => {
    currentFontScale += 0.1;
    document.documentElement.style.setProperty('--base-font-size', (22 * currentFontScale) + 'px');
    document.documentElement.style.setProperty('--btn-font-size', (20 * currentFontScale) + 'px');
};
document.getElementById('btn-font-out').onclick = () => {
    currentFontScale = Math.max(0.5, currentFontScale - 0.1);
    document.documentElement.style.setProperty('--base-font-size', (22 * currentFontScale) + 'px');
    document.documentElement.style.setProperty('--btn-font-size', (20 * currentFontScale) + 'px');
};

// =========================================================
// ГЛОБАЛЬНИЙ ОЛІВЕЦЬ
// =========================================================
const drawCanvas = document.getElementById('global-draw-canvas');
const ctxDraw = drawCanvas.getContext('2d');
const drawPanel = document.getElementById('draw-panel-global');

function getDrawPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
}

drawCanvas.addEventListener('mousedown', e => { isDrawing = true; const p = getDrawPos(e); lastX = p.x; lastY = p.y; });
drawCanvas.addEventListener('touchstart', e => { isDrawing = true; const p = getDrawPos(e); lastX = p.x; lastY = p.y; }, {passive: false});

function draw(e) {
    if (!isDrawing) return; e.preventDefault();
    const p = getDrawPos(e);
    const color = drawMode === 'eraser' ? 'eraser' : document.getElementById('draw-color').value;
    const thickness = document.getElementById('draw-thickness').value;
    drawLineOnCanvas(lastX, lastY, p.x, p.y, color, thickness, true);
    lastX = p.x; lastY = p.y;
}

drawCanvas.addEventListener('mousemove', draw);
drawCanvas.addEventListener('touchmove', draw, {passive: false});
drawCanvas.addEventListener('mouseup', () => isDrawing = false);
drawCanvas.addEventListener('touchend', () => isDrawing = false);

function drawLineOnCanvas(x0, y0, x1, y1, color, thickness, emit) {
    ctxDraw.beginPath(); ctxDraw.moveTo(x0, y0); ctxDraw.lineTo(x1, y1);
    ctxDraw.lineWidth = thickness; ctxDraw.lineCap = 'round';
    if (color === 'eraser') { ctxDraw.globalCompositeOperation = 'destination-out'; ctxDraw.strokeStyle = 'rgba(0,0,0,1)'; }
    else { ctxDraw.globalCompositeOperation = 'source-over'; ctxDraw.strokeStyle = color; }
    ctxDraw.stroke(); ctxDraw.closePath(); ctxDraw.globalCompositeOperation = 'source-over';
    
    if (emit) {
        emitSync('draw_line', {
            x0: x0/drawCanvas.width, y0: y0/drawCanvas.height, 
            x1: x1/drawCanvas.width, y1: y1/drawCanvas.height, 
            color: color, thickness: thickness
        });
    }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(frequency, type, duration, vol = 0.2, delay = 0) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(0, audioCtx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + delay + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay); osc.stop(audioCtx.currentTime + delay + duration);
}

function playSuccess() { playTone(523.25, 'sine', 0.15, 0.3, 0); playTone(659.25, 'sine', 0.15, 0.3, 0.1); playTone(783.99, 'sine', 0.3, 0.3, 0.2); }
function playError() { playTone(150, 'sawtooth', 0.4, 0.2, 0); playTone(140, 'sawtooth', 0.4, 0.2, 0.1); }
function playPop() { playTone(400, 'square', 0.1, 0.1, 0); }

const canvasConfetti = document.getElementById('confetti-canvas');
const ctxConf = canvasConfetti.getContext('2d');
let particles = [];

function resizeConfetti() { canvasConfetti.width = window.innerWidth; canvasConfetti.height = window.innerHeight; }
window.addEventListener('resize', resizeConfetti); resizeConfetti();

function createStars() {
    particles = [];
    for(let i=0; i<60; i++) {
        particles.push({
            x: window.innerWidth / 2, y: window.innerHeight / 2,
            vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 1) * 25,
            size: Math.random() * 15 + 10, rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 15,
            color: ['#f1c40f', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'][Math.floor(Math.random()*5)]
        });
    }
    requestAnimationFrame(animateStars);
}

function animateStars() {
    if(particles.length === 0) { ctxConf.clearRect(0, 0, canvasConfetti.width, canvasConfetti.height); return; }
    ctxConf.clearRect(0, 0, canvasConfetti.width, canvasConfetti.height);
    ctxConf.lineWidth = 3;
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.6; p.rot += p.rotSpeed;
        ctxConf.save(); ctxConf.translate(p.x, p.y); ctxConf.rotate(p.rot * Math.PI / 180); ctxConf.strokeStyle = p.color;
        ctxConf.beginPath();
        for (let j = 0; j < 5; j++) {
            ctxConf.lineTo(Math.cos((18 + j * 72) * Math.PI / 180) * p.size, -Math.sin((18 + j * 72) * Math.PI / 180) * p.size);
            ctxConf.lineTo(Math.cos((54 + j * 72) * Math.PI / 180) * (p.size/2.5), -Math.sin((54 + j * 72) * Math.PI / 180) * (p.size/2.5));
        }
        ctxConf.closePath(); ctxConf.stroke(); ctxConf.restore();
        if(p.y > canvasConfetti.height) particles[i].dead = true;
    });
    particles = particles.filter(p => !p.dead);
    requestAnimationFrame(animateStars);
}

let draggedEl = null;
let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

function initDragAndDrop() {
    const items = document.querySelectorAll('.drag-item');
    items.forEach(item => {
        item.addEventListener('mousedown', dragStart);
        item.addEventListener('touchstart', dragStart, {passive: false});
    });
}

function dragStart(e) {
    if (e.target.classList.contains('dropped')) return;
    draggedEl = e.target;
    const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    
    const rect = draggedEl.getBoundingClientRect();
    draggedEl.style.position = 'absolute'; draggedEl.style.zIndex = 1000;
    
    document.getElementById('game-container').appendChild(draggedEl);
    
    const containerRect = document.getElementById('game-container').getBoundingClientRect();
    draggedEl.style.left = ((rect.left - containerRect.left) / currentZoom) + 'px';
    draggedEl.style.top = ((rect.top - containerRect.top) / currentZoom) + 'px';
    
    startX = clientX; startY = clientY;
    initialLeft = parseFloat(draggedEl.style.left); initialTop = parseFloat(draggedEl.style.top);

    playPop();

    document.addEventListener('mousemove', dragMove);
    document.addEventListener('touchmove', dragMove, {passive: false});
    document.addEventListener('mouseup', dragEnd);
    document.addEventListener('touchend', dragEnd);
}

function dragMove(e) {
    if (!draggedEl) return; e.preventDefault();
    const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    const dx = (clientX - startX) / currentZoom;
    const dy = (clientY - startY) / currentZoom;
    draggedEl.style.left = (initialLeft + dx) + 'px'; draggedEl.style.top = (initialTop + dy) + 'px';
}

function dragEnd(e) {
    if (!draggedEl) return;
    const clientX = e.type.includes('mouse') ? e.clientX : e.changedTouches[0].clientX;
    const clientY = e.type.includes('mouse') ? e.clientY : e.changedTouches[0].clientY;
    
    draggedEl.style.display = 'none'; 
    let elemBelow = document.elementFromPoint(clientX, clientY);
    draggedEl.style.display = 'inline-block';
    
    let dropZone = elemBelow ? elemBelow.closest('.drop-zone, .category-box') : null;
    
    if (dropZone && (dropZone.classList.contains('category-box') || dropZone.children.length === 0)) {
        if(!isRemoteAction) emitSync('DROP', { dragId: draggedEl.id, dropZoneId: dropZone.id });
        draggedEl.style.position = 'relative'; draggedEl.style.left = '0'; draggedEl.style.top = '0'; draggedEl.style.zIndex = '';
        dropZone.appendChild(draggedEl);
        playPop();
    } else {
        if(!isRemoteAction) emitSync('DROP', { dragId: draggedEl.id, dropZoneId: 'drag-pool' });
        const pool = document.getElementById('drag-pool');
        if(pool) {
            draggedEl.style.position = 'relative'; draggedEl.style.left = '0'; draggedEl.style.top = '0'; draggedEl.style.zIndex = '';
            pool.appendChild(draggedEl);
        }
    }
    
    document.removeEventListener('mousemove', dragMove); document.removeEventListener('touchmove', dragMove);
    document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchend', dragEnd);
    draggedEl = null;
}

                { t: 'Учні підійшли до <u style="font-weight:bold">високого</u> дуба.', r: 'ч.р.', v: 'Р.в.' },
                { t: 'Ми пишаємося <u style="font-weight:bold">рідною</u> мовою.', r: 'ж.р.', v: 'О.в.' }
            ];
            const rods = ['ч.р.', 'ж.р.', 'с.р.'];
            const vids = ['Н.в.', 'Р.в.', 'Д.в.', 'З.в.', 'О.в.', 'М.в.'];
            
            sentences.forEach((s, i) => {
                let div = document.createElement('div');
                div.style.margin = '20px 0';
                
                let selectR = document.createElement('select');
                selectR.className = 'sketch-input'; selectR.style.width = '80px'; selectR.id = `r8-${i}`;
                selectR.innerHTML = `<option value=""></option>` + rods.map(r => `<option value="${r}">${r}</option>`).join('');
                
                let selectV = document.createElement('select');
                selectV.className = 'sketch-input'; selectV.style.width = '80px'; selectV.id = `v8-${i}`;
                selectV.innerHTML = `<option value=""></option>` + vids.map(v => `<option value="${v}">${v}</option>`).join('');
                
                div.innerHTML = s.t + '<br>';
                div.appendChild(selectR); div.appendChild(selectV);
                container.appendChild(div);
            });

            setTimeout(() => {
                sentences.forEach((s, i) => {
                    document.getElementById(`r8-${i}`).addEventListener('change', e => { if(!isRemoteAction) emitSync('INPUT', {id: e.target.id, val: e.target.value}); });
                    document.getElementById(`v8-${i}`).addEventListener('change', e => { if(!isRemoteAction) emitSync('INPUT', {id: e.target.id, val: e.target.value}); });
                });
            }, 100);

            container.appendChild(createCheckButton(8, () => {
                let correct = true;
                sentences.forEach((s, i) => {
                    if(document.getElementById(`r8-${i}`).value !== s.r) correct = false;
                    if(document.getElementById(`v8-${i}`).value !== s.v) correct = false;
                });
                correct ? showHappy() : showSad();
            }));
        }
    },
    {
        render: () => {
            container.innerHTML = `<div style="margin-bottom:20px;">Розстав слова за схемою:</div><div style="font-size:18px; margin-bottom:15px;">[Який?] [Хто?] [Що робить?] [Яку?] [Що?]</div>`;
            const words = ['Сірий', 'кіт', 'їсть', 'смачну', 'рибу'].sort(() => Math.random() - 0.5);
            const correctOrder = ['Сірий', 'кіт', 'їсть', 'смачну', 'рибу'];
            
            const dropContainer = document.createElement('div'); dropContainer.style.marginBottom = '20px';
            for(let i=0; i<5; i++) { dropContainer.innerHTML += `<div class="drop-zone" id="dz9-${i}" style="width:80px; height:40px;"></div>`; }
            container.appendChild(dropContainer);

            const pool = document.createElement('div'); pool.id = 'drag-pool'; pool.style.minHeight = '50px';
            words.forEach(w => {
                let drag = document.createElement('div'); drag.className = 'drag-item'; drag.id = makeSafeId('t9-drag', w); drag.innerText = w; pool.appendChild(drag);
            });
            container.appendChild(pool);

            container.appendChild(createCheckButton(9, () => {
                let correct = true;
                for(let i=0; i<5; i++) {
                    const dz = document.getElementById(`dz9-${i}`);
                    if(!dz.firstChild || dz.firstChild.innerText !== correctOrder[i]) correct = false;
                }
                correct ? showHappy() : showSad();
            }));
            setTimeout(initDragAndDrop, 100);
        }
    },
    {
        render: () => {
            container.innerHTML = `<div style="margin-bottom:20px;">Натискай на слова з помилками, щоб їх виправити:</div>`;
            const textHTML = `Настала <span class="clickable-word" id="t10-w-0" data-opts="теплий,тепла,тепле" data-correct="тепла">теплий</span> весна. З-під землі пробилася свіжа травиця. На деревах з'явилися ніжні <span class="clickable-word" id="t10-w-1" data-opts="зелений,зелені,зелена" data-correct="зелені">зелений</span> листочки. Повіяв легкий <span class="clickable-word" id="t10-w-2" data-opts="весняне,весняний,весняні" data-correct="весняний">весняне</span> вітерець.`;
            
            const textCont = document.createElement('div');
            textCont.style.lineHeight = '2'; textCont.innerHTML = textHTML;
            container.appendChild(textCont);

            container.querySelectorAll('.clickable-word').forEach(span => {
                span.onclick = () => {
                    if(!isRemoteAction) emitSync('CLICK', { id: span.id });
                    playPop();
                    const opts = span.dataset.opts.split(','); let idx = opts.indexOf(span.innerText);
                    span.innerText = opts[(idx + 1) % opts.length];
                };
            });

            container.appendChild(createCheckButton(10, () => {
                let correct = true;
                container.querySelectorAll('.clickable-word').forEach(span => { if(span.innerText !== span.dataset.correct) correct = false; });
                correct ? showHappy() : showSad();
            }));
        }
    },
    {
        render: () => {
            const words = ['Золотий годинник', 'золоті руки', 'гострий ніж', 'гостре слово', 'залізний цвях', 'залізний характер'].sort(() => Math.random() - 0.5);
            container.innerHTML = `
                <div id="drag-pool" style="min-height:90px; margin-bottom:10px;"></div>
                <div class="category-container">
                    <div class="category-box drop-zone" id="cat-dir" data-type="dir"><div class="category-title">Пряме</div></div>
                    <div class="category-box drop-zone" id="cat-fig" data-type="fig"><div class="category-title">Переносне</div></div>
                </div>
            `;
            const pool = document.getElementById('drag-pool');
            words.forEach(w => {
                let isFig = ['золоті руки', 'гостре слово', 'залізний характер'].includes(w);
                let drag = document.createElement('div'); drag.className = 'drag-item'; drag.id = makeSafeId('t11-drag', w); drag.innerText = w; drag.dataset.type = isFig ? 'fig' : 'dir';
                pool.appendChild(drag);
            });

            container.appendChild(createCheckButton(11, () => {
                let correct = true;
                if(pool.children.length > 0) correct = false;
                document.querySelectorAll('.category-box .drag-item').forEach(item => { if(item.dataset.type !== item.parentElement.dataset.type) correct = false; });
                correct ? showHappy() : showSad();
            }));
            
            setTimeout(initDragAndDrop, 100);
        }
    }
];

// ФІНАЛ ТА НАВІГАЦІЯ
// =========================================================
function renderCurrentTask() {
    container.innerHTML = '';
    tasks[currentTaskIdx].render();
}

function nextTask() {
    if (currentTaskIdx < tasks.length - 1) {
        currentTaskIdx++; renderCurrentTask();
    } else {
        container.innerHTML = ``;
        playSuccess(); createStars(); 
        catMouth.setAttribute('d', 'M 60 95 Q 75 110 90 95');
        catContainer.style.left = '50%'; catContainer.style.bottom = '40%';
        setTimeout(() => {
            catContainer.classList.remove('anim-happy');
            catContainer.classList.add('anim-cool-dance'); 
        }, 500);
    }
}

function prevTask() {
    if (currentTaskIdx > 0) { currentTaskIdx--; renderCurrentTask(); }
}

document.getElementById('btn-next').addEventListener('click', (e) => {
    if(!isRemoteAction) emitSync('CLICK', { id: 'btn-next' });
    playPop(); nextTask();
});

document.getElementById('btn-back').addEventListener('click', (e) => {
    if(!isRemoteAction) emitSync('CLICK', { id: 'btn-back' });
    playPop(); prevTask();
});

window.onload = () => {
    const initAudio = () => {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        document.removeEventListener('click', initAudio);
        document.removeEventListener('touchstart', initAudio);
    };
    document.addEventListener('click', initAudio); document.addEventListener('touchstart', initAudio);
    renderCurrentTask();
};
</script>

<!-- Універсальний блок контролю -->
<div id="block-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:999999; color:red; font-size:40px; font-weight:bold; justify-content:center; align-items:center; text-align:center; flex-direction:column; padding:20px;">
    Зачекай! Зараз не твій урок.
</div>

<script>
(function() {
    if (!isFirebaseConnected) return;

    const urlParams = new URLSearchParams(window.location.search);
    let myName = urlParams.get('user');

    if (myName) {
        sessionStorage.setItem('userName', myName);
    } else {
        myName = sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('userName', myName);
        }
    }

    const tabId = Math.random().toString(36).substr(2, 9);
    const userRef = db.ref(`online_users/${myName}/${tabId}`);
    
    db.ref('.info/connected').on('value', snap => {
        if (snap.val() === true) {
            userRef.set(true);
            userRef.onDisconnect().remove();
        }
    });

    window.addEventListener('beforeunload', () => { userRef.remove(); });

    const overlay = document.getElementById('block-overlay');
    db.ref(`blocked_users/${myName}`).on('value', snap => {
        if (snap.val() === true) { overlay.style.display = 'flex'; } 
        else { overlay.style.display = 'none'; }
    });

    db.ref('force_refresh').on('value', snap => {
        if (snap.val() === true) { userRef.set(true); }
    });

    let immunity = true;
    setTimeout(() => { immunity = false; }, 1000);

    db.ref('current_activity').on('value', snap => {
        if (immunity) return;
        if (snap.val() === 'lobby') {
            window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
        }
    });
})();
</script>
