<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пригоди Кульбабки та Коника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     БАЗОВІ СТИЛІ ТА НАЛАШТУВАННЯ ЕКРАНА
     Жодних білих прямокутників — усе побудовано на живих природних формах
     ===================================================================== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Nunito', 'Trebuchet MS', 'Comic Sans MS', sans-serif;
    background: #3a7d44;
  }

  #game-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* =====================================================================
     СЮЖЕТНИЙ ЖИВИЙ ФОН (SVG СВІТ)
     ===================================================================== */
  #world-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: block;
  }

  /* Плавна зміна кольорів неба залежно від сюжетної сцени */
  #sky-stop-1, #sky-stop-2, #sky-stop-3 {
    transition: stop-color 1.2s ease;
  }

  /* Анімація коливання трави та квітів на вітрі */
  .sway-slow {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: gentleSway 4.8s ease-in-out infinite;
  }
  .sway-fast {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: gentleSway 2.9s ease-in-out infinite reverse;
  }
  .windy-mode .sway-slow,
  .windy-mode .sway-fast {
    animation-duration: 1.1s;
  }

  @keyframes gentleSway {
    0%, 100% { transform: rotate(-3.5deg); }
    50% { transform: rotate(4.2deg); }
  }

  /* Обертання сонячних променів */
  #sun-rays {
    transform-box: fill-box;
    transform-origin: center;
    animation: spinRays 28s linear infinite;
  }
  @keyframes spinRays {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Плив хмаринок */
  .cloud-drift-1 { animation: cloudMove1 26s ease-in-out infinite; }
  .cloud-drift-2 { animation: cloudMove2 34s ease-in-out infinite; }
  @keyframes cloudMove1 {
    0%, 100% { transform: translateX(0px); }
    50% { transform: translateX(55px); }
  }
  @keyframes cloudMove2 {
    0%, 100% { transform: translateX(0px); }
    50% { transform: translateX(-65px); }
  }

  /* Інтерактивні об'єкти фону (на них можна клікати для кумедних реакцій) */
  .clickable-prop {
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-box: fill-box;
    transform-origin: center;
  }
  .clickable-prop:hover {
    filter: brightness(1.08);
  }
  .prop-pop {
    animation: propBoing 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes propBoing {
    0% { transform: scale(1, 1); }
    30% { transform: scale(1.22, 0.82); }
    60% { transform: scale(0.9, 1.16); }
    100% { transform: scale(1, 1); }
  }

  /* Сюжетні декорації, які плавно з'являються на відповідних рівнях */
  .story-group {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateY(25px);
  }
  .story-group.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* Анімація метелика */
  #butterfly-wings {
    transform-box: fill-box;
    transform-origin: center;
    animation: flapWings 0.28s ease-in-out infinite alternate;
  }
  @keyframes flapWings {
    from { transform: scaleY(1) scaleX(1); }
    to { transform: scaleY(0.35) scaleX(0.92); }
  }
  #prop-butterfly-wrap {
    animation: butterflyHover 4.5s ease-in-out infinite;
  }
  @keyframes butterflyHover {
    0%, 100% { transform: translate(0, 0) rotate(-4deg); }
    25% { transform: translate(24px, -18px) rotate(6deg); }
    50% { transform: translate(-12px, -28px) rotate(-8deg); }
    75% { transform: translate(-26px, -8px) rotate(5deg); }
  }

  /* =====================================================================
     ШАР ЧАСТИНОК (ПУШИНКИ, ПИЛОК, ДОЩ, КВІТКОВИЙ САЛЮТ)
     ===================================================================== */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 6;
    pointer-events: none;
  }

  /* =====================================================================
     ШАР СИНТАКСИЧНОЇ СТРІЛКИ (ВІД ГОЛОВНОГО ДО ЗАЛЕЖНОГО СЛОВА)
     ===================================================================== */
  #arrow-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    overflow: visible;
  }

  /* =====================================================================
     ЗОНА РЕЧЕННЯ (ВЕЛИКИЙ ШРИФТ, ОРГАНІЧНІ ПЛАШКИ-ЛИСТОЧКИ)
     ===================================================================== */
  #sentence-zone {
    position: absolute;
    top: 23vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(94vw, 1280px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: clamp(14px, 2.2vw, 32px);
    z-index: 5;
    padding: 18px 10px;
  }

  /* Базова органічна кнопка-слово */
  .word-tile {
    position: relative;
    cursor: pointer;
    padding: clamp(14px, 2vw, 24px) clamp(22px, 3vw, 40px);
    font-size: clamp(26px, 3.6vw, 52px);
    font-weight: 900;
    letter-spacing: 0.015em;
    line-height: 1.1;
    color: #fffef2;
    text-shadow: 0 3px 0 rgba(36, 44, 15, 0.55), 0 0 12px rgba(25, 35, 10, 0.25);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    isolation: isolate;
  }

  /* Вбудована SVG-підкладка під кожним словом (різні природні візерунки) */
  .word-bg-svg {
    position: absolute;
    inset: -8px -10px;
    width: calc(100% + 20px);
    height: calc(100% + 16px);
    z-index: -1;
    overflow: visible;
    filter: drop-shadow(0 10px 14px rgba(24, 52, 20, 0.32));
    transition: filter 0.25s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Ефект наведення на слово-кандидат */
  .word-tile.candidate:hover {
    transform: translateY(-9px) scale(1.06) rotate(-1deg);
  }
  .word-tile.candidate:hover .word-bg-svg {
    filter: drop-shadow(0 16px 20px rgba(24, 52, 20, 0.38)) brightness(1.08);
  }
  .word-tile.candidate:active {
    transform: translateY(-2px) scale(0.97);
  }

  /* Залежне слово (до якого ставимо питання) — сяюча сонячна квітка */
  .word-tile.target-word {
    color: #4a2304;
    text-shadow: 0 2px 0 rgba(255, 250, 205, 0.85);
    animation: targetPulse 2.4s ease-in-out infinite;
  }
  @keyframes targetPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }

  /* Правильно знайдене головне слово */
  .word-tile.solved-head {
    transform: translateY(-6px) scale(1.08);
    animation: victoryGlow 1.3s ease-in-out infinite alternate;
  }
  @keyframes victoryGlow {
    from { filter: drop-shadow(0 0 12px rgba(255, 232, 90, 0.85)); }
    to { filter: drop-shadow(0 0 28px rgba(255, 245, 130, 1)); }
  }

  /* Кумедне тремтіння при помилковому кліку */
  .word-tile.wrong-wobble {
    animation: jellyWobble 0.65s ease-in-out;
  }
  @keyframes jellyWobble {
    0% { transform: translateX(0) rotate(0deg) scale(1); }
    15% { transform: translateX(-14px) rotate(-6deg) scale(1.08, 0.9); }
    35% { transform: translateX(13px) rotate(5deg) scale(0.92, 1.08); }
    55% { transform: translateX(-9px) rotate(-3.5deg) scale(1.04, 0.96); }
    75% { transform: translateX(6px) rotate(2deg) scale(0.98, 1.02); }
    100% { transform: translateX(0) rotate(0deg) scale(1); }
  }

  /* Поява слів при переході на новий рівень */
  .word-enter {
    animation: tilePopIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  @keyframes tilePopIn {
    from { opacity: 0; transform: translateY(35px) scale(0.65) rotate(-5deg); }
    to { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }

  /* =====================================================================
     ХМАРИНКА-ПИТАННЯ НАД ЗАЛЕЖНИМ СЛОВОМ (ПОТІМ ПЕРЕЛІТАЄ НА СТРІЛКУ)
     ВАЖЛИВО: позиція задається в JS через layout-координати (offsetTop),
     тому хмаринка завжди стоїть РІВНО НАД словом і ніколи його не закриває.
     ===================================================================== */
  #question-badge {
    position: absolute;
    z-index: 8;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: left 0.72s cubic-bezier(0.34, 1.4, 0.64, 1),
                top 0.72s cubic-bezier(0.34, 1.4, 0.64, 1),
                transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.32s ease;
  }

  .q-bubble-inner {
    position: relative;
    padding: clamp(8px, 1.1vw, 14px) clamp(18px, 2.2vw, 30px);
    font-size: clamp(22px, 2.6vw, 36px);
    font-weight: 900;
    color: #fffef2;
    text-shadow: 0 2px 0 rgba(120, 14, 56, 0.6);
    animation: floatQuestion 2.2s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }

  .q-bubble-svg {
    position: absolute;
    inset: -10px -14px;
    width: calc(100% + 28px);
    height: calc(100% + 20px);
    z-index: -1;
    filter: drop-shadow(0 8px 12px rgba(130, 18, 65, 0.35));
  }

  @keyframes floatQuestion {
    0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
    50% { transform: translateY(-9px) rotate(1.5deg); }
  }

  /* Корона-зірочка, що з'являється над головним словом після відповіді */
  .head-crown {
    position: absolute;
    top: -34px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    width: 46px;
    height: 46px;
    pointer-events: none;
    animation: crownPop 0.6s cubic-bezier(0.34, 1.7, 0.64, 1) forwards;
  }
  @keyframes crownPop {
    0% { transform: translateX(-50%) scale(0) rotate(-45deg); }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); }
  }

  /* =====================================================================
     ЖИВІ ПЕРСОНАЖІ: КУЛЬБАБКА ТА КОНИК-СТРИБУНЕЦЬ
     ===================================================================== */
  #dandelion-actor {
    position: absolute;
    left: clamp(20px, 6vw, 110px);
    bottom: clamp(18px, 4vh, 52px);
    width: clamp(150px, 19vw, 250px);
    height: clamp(200px, 26vw, 330px);
    z-index: 7;
    cursor: pointer;
    transform-origin: bottom center;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .dandy-idle {
    animation: dandySway 3.4s ease-in-out infinite;
  }
  @keyframes dandySway {
    0%, 100% { transform: rotate(-2.5deg) scaleY(1); }
    50% { transform: rotate(3deg) scaleY(1.02); }
  }

  .dandy-celebrate {
    animation: dandyDance 0.65s ease-in-out 3;
  }
  @keyframes dandyDance {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25% { transform: translateY(-28px) rotate(-10deg) scale(1.08, 0.94); }
    50% { transform: translateY(0) rotate(0deg) scale(1.1, 0.9); }
    75% { transform: translateY(-24px) rotate(10deg) scale(0.95, 1.07); }
  }

  .dandy-spin {
    animation: dandyTwirl 1.1s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  @keyframes dandyTwirl {
    0% { transform: rotate(0deg) scale(1); }
    40% { transform: translateY(-35px) rotate(-16deg) scale(1.12); }
    70% { transform: translateY(-18px) rotate(16deg) scale(1.06); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .dandy-oops {
    animation: dandyShake 0.55s ease-in-out;
  }
  @keyframes dandyShake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-12deg) translateX(-6px); }
    45% { transform: rotate(11deg) translateX(6px); }
    70% { transform: rotate(-7deg); }
  }

  /* Коник-стрибунець (вільно стрибає по всьому екрану за параболою!) */
  #hopper-actor {
    position: absolute;
    left: 0;
    top: 0;
    width: clamp(145px, 18vw, 235px);
    height: clamp(135px, 16vw, 215px);
    z-index: 9;
    cursor: pointer;
    transform-origin: center bottom;
    will-change: transform;
  }

  #hopper-inner {
    width: 100%;
    height: 100%;
    transform-origin: center bottom;
  }

  .hopper-idle #hopper-inner {
    animation: hopperBreathe 2.1s ease-in-out infinite;
  }
  @keyframes hopperBreathe {
    0%, 100% { transform: scaleY(1) scaleX(1) translateY(0); }
    50% { transform: scaleY(0.94) scaleX(1.04) translateY(3px); }
  }

  .hopper-crouch #hopper-inner {
    transform: scaleY(0.76) scaleX(1.16) translateY(10px);
    transition: transform 0.16s ease;
  }

  .hopper-backflip #hopper-inner {
    animation: hopperFlip 0.85s cubic-bezier(0.28, 0.84, 0.42, 1);
  }
  @keyframes hopperFlip {
    0% { transform: translateY(0) rotate(0deg) scale(1); }
    20% { transform: translateY(8px) scale(1.15, 0.78); }
    55% { transform: translateY(-95px) rotate(-200deg) scale(1.06); }
    85% { transform: translateY(-10px) rotate(-360deg) scale(0.94, 1.08); }
    100% { transform: translateY(0) rotate(-360deg) scale(1); }
  }

  .hopper-jig #hopper-inner {
    animation: hopperJig 0.42s ease-in-out 4;
  }
  @keyframes hopperJig {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-28px) rotate(11deg) scale(1.05, 0.95); }
  }

  .hopper-bonk #hopper-inner {
    animation: hopperDizzyBounce 0.65s ease-in-out;
  }
  @keyframes hopperDizzyBounce {
    0% { transform: rotate(0deg); }
    25% { transform: translateY(-18px) rotate(22deg) scale(0.9, 1.1); }
    55% { transform: translateY(6px) rotate(-18deg) scale(1.12, 0.85); }
    80% { transform: translateY(-6px) rotate(8deg); }
    100% { transform: rotate(0deg); }
  }

  /* Анімація зірочок запаморочення та вусиків коника */
  #hopper-dizzy {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transition: opacity 0.25s ease;
  }
  #hopper-dizzy.show {
    opacity: 1;
    animation: spinDizzy 0.8s linear infinite;
  }
  @keyframes spinDizzy {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .ant-twitch {
    transform-box: fill-box;
    transform-origin: bottom left;
    animation: twitchAnt 3.2s ease-in-out infinite;
  }
  @keyframes twitchAnt {
    0%, 82%, 100% { transform: rotate(0deg); }
    87% { transform: rotate(12deg); }
    92% { transform: rotate(-9deg); }
    96% { transform: rotate(7deg); }
  }

  /* Кліпання очима для обох персонажів */
  .blink-lid {
    transform-box: fill-box;
    transform-origin: center top;
    animation: eyeBlink 4.6s infinite;
  }
  @keyframes eyeBlink {
    0%, 93%, 100% { transform: scaleY(0); }
    96% { transform: scaleY(1); }
  }

  /* =====================================================================
     МІНІМАЛІСТИЧНІ ОРГАНІЧНІ КНОПКИ «НАЗАД» ТА «ДАЛІ» (БЕЗ ЗАЙВИХ СЛІВ)
     ===================================================================== */
  .nav-btn {
    position: absolute;
    bottom: clamp(18px, 3.2vh, 34px);
    width: clamp(62px, 6.2vw, 82px);
    height: clamp(62px, 6.2vw, 82px);
    z-index: 12;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
    transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, filter 0.25s ease;
  }

  #btn-prev {
    left: clamp(16px, 2.5vw, 34px);
  }
  #btn-next {
    right: clamp(16px, 2.5vw, 34px);
  }

  .nav-btn:hover {
    transform: scale(1.13) rotate(-4deg);
    filter: brightness(1.08);
  }
  #btn-next:hover {
    transform: scale(1.13) rotate(4deg);
  }
  .nav-btn:active {
    transform: scale(0.92);
  }
  .nav-btn.dimmed {
    opacity: 0.35;
    pointer-events: none;
  }

  /* Пульсація кнопки «Далі» після успішного виконання завдання */
  .nav-btn.ready-pulse {
    animation: nextBounce 1.1s ease-in-out infinite;
  }
  @keyframes nextBounce {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255, 232, 95, 0.6)); }
    50% { transform: scale(1.16); filter: drop-shadow(0 0 22px rgba(255, 240, 110, 1)); }
  }

  /* Адаптація для невеликих екранів / планшетів */
  @media (max-width: 768px) {
    #sentence-zone {
      top: 17vh;
      gap: 12px;
    }
    #dandelion-actor {
      left: 8px;
      bottom: 84px;
      width: 130px;
      height: 175px;
    }
    #hopper-actor {
      width: 125px;
      height: 115px;
    }
  }
</style>
</head>
<body>

<div id="game-stage">

  <!-- ===================================================================
       1. ЖИВИЙ СЮЖЕТНИЙ SVG-СВІТ (ПОВНІСТЮ ВЕКТОРНА ГРАФІКА)
       =================================================================== -->
  <svg id="world-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Градієнт неба (динамічно змінюється в JS для кожної сцени мультика) -->
      <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
        <stop id="sky-stop-1" offset="0%" stop-color="#48b8f0"/>
        <stop id="sky-stop-2" offset="55%" stop-color="#9fe3ff"/>
        <stop id="sky-stop-3" offset="100%" stop-color="#fff0c2"/>
      </linearGradient>

      <!-- Сонячне сяйво -->
      <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8b0" stop-opacity="1"/>
        <stop offset="45%" stop-color="#ffd54f" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
      </radialGradient>

      <!-- Хмаринки (ніжні кремово-блакитні, не плоскі білі) -->
      <linearGradient id="cloud-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fffdf4"/>
        <stop offset="70%" stop-color="#e3f3ff"/>
        <stop offset="100%" stop-color="#b8d9f5"/>
      </linearGradient>
      <linearGradient id="storm-cloud-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a2b9d6"/>
        <stop offset="65%" stop-color="#6c87ad"/>
        <stop offset="100%" stop-color="#4e678c"/>
      </linearGradient>

      <!-- Пагорби галявини -->
      <linearGradient id="hill-far" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#90d658"/>
        <stop offset="100%" stop-color="#5da838"/>
      </linearGradient>
      <linearGradient id="hill-mid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#76c940"/>
        <stop offset="100%" stop-color="#3c8d29"/>
      </linearGradient>
      <linearGradient id="hill-front" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5db832"/>
        <stop offset="45%" stop-color="#3a9126"/>
        <stop offset="100%" stop-color="#226318"/>
      </linearGradient>

      <!-- Струмок -->
      <linearGradient id="brook-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7ce8ff"/>
        <stop offset="50%" stop-color="#2bb8e6"/>
        <stop offset="100%" stop-color="#1982b8"/>
      </linearGradient>

      <!-- Шапочка гриба -->

/* =========================================================================
   ЗВУКОВИЙ РУШІЙ (WEB AUDIO API — ЖИВІ МУЛЬТЯШНІ ЗВУКИ БЕЗ ФАЙЛІВ)
   ========================================================================= */
const SoundFX = (() => {
  let ctx = null;

  function ensureCtx() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      ctx = new AudioCtx();
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  /* Легкий дерев'яний клік при наведенні */
  function playHover() {
    try {
      const c = ensureCtx();
      const now = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(760, now + 0.055);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain).connect(c.destination);
      osc.start(now);
      osc.stop(now + 0.065);
    } catch (e) {}
  }

  /* Пружинний мультяшний стрибок Коника */
  function playJump() {
    try {
      const c = ensureCtx();
      const now = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.16);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.28);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain).connect(c.destination);
      osc.start(now);
      osc.stop(now + 0.31);
    } catch (e) {}
  }

  /* 5 різних радісних мелодій перемоги без слів */
  function playSuccess(variant = 0) {
    try {
      const c = ensureCtx();
      const now = c.currentTime;
      const melodies = [
        [523.25, 659.25, 783.99, 1046.5],         // Дзвінкий мажорний арпеджіо
        [587.33, 739.99, 880.0, 1174.66, 1479.98], // Казкова арфа
        [523.25, 587.33, 659.25, 783.99, 1046.5],  // Веселий ксилофон
        [659.25, 783.99, 987.77, 1318.5],          // Сонячна флейта
        [440, 554.37, 659.25, 880, 1108.73]        // Галявинна фанфара
      ];
      const notes = melodies[variant % melodies.length];
      const wave = variant % 2 === 0 ? "triangle" : "sine";

      notes.forEach((freq, i) => {
        const t = now + i * 0.085;
        const osc = c.createOscillator();
        const osc2 = c.createOscillator();
        const gain = c.createGain();
        osc.type = wave;
        osc2.type = "sine";
        osc.frequency.setValueAtTime(freq, t);
        osc2.frequency.setValueAtTime(freq * 2, t);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(c.destination);
        osc.start(t);
        osc2.start(t);
        osc.stop(t + 0.45);
        osc2.stop(t + 0.45);
      });
    } catch (e) {}
  }

  /* 4 кумедні, м'які мультяшні звуки промаху */
  function playWrong(variant = 0) {
    try {
      const c = ensureCtx();
      const now = c.currentTime;
      const osc = c.createOscillator();
      const lfo = c.createOscillator();
      const lfoGain = c.createGain();
      const gain = c.createGain();

      if (variant % 3 === 0) {
        // Кумедний гумовий «боїнг» вниз
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(145, now + 0.34);
        lfo.frequency.setValueAtTime(18, now);
        lfoGain.gain.setValueAtTime(24, now);
        lfo.connect(lfoGain).connect(osc.frequency);
      } else if (variant % 3 === 1) {
        // Комічний свисток-слайд вниз
        osc.type = "triangle";
        osc.frequency.setValueAtTime(490, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.22);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.32);
      } else {
        // Подвійний пружинний «плюх-плюх»
        osc.type = "sine";
        osc.frequency.setValueAtTime(290, now);
        osc.frequency.setValueAtTime(210, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.34);
      }

      const filter = c.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(950, now);

      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

      osc.connect(filter).connect(gain).connect(c.destination);
      osc.start(now);
      if (variant % 3 === 0) lfo.start(now);
      osc.stop(now + 0.4);
      if (variant % 3 === 0) lfo.stop(now + 0.4);
    } catch (e) {}
  }

  /* Природні звуки при кліку на декорації (жабка, гриб, сонце, метелик) */
  function playProp(type) {
    try {
      const c = ensureCtx();
      const now = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      if (type === "frog") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(310, now + 0.09);
        osc.frequency.setValueAtTime(170, now + 0.13);
        osc.frequency.exponentialRampToValueAtTime(340, now + 0.23);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      } else if (type === "boing") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);
        gain.gain.setValueAtTime(0.13, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      } else {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.exponentialRampToValueAtTime(990, now + 0.14);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      }
      const lp = c.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 1200;
      osc.connect(lp).connect(gain).connect(c.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    } catch (e) {}
  }

  /* Легкий перехід між рівнями */
  function playNav() {
    try {
      const c = ensureCtx();
      const now = c.currentTime;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(380, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.11);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(gain).connect(c.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    } catch (e) {}
  }

  return { playHover, playJump, playSuccess, playWrong, playProp, playNav };
})();

/* =========================================================================
   СИСТЕМА ЖИВИХ ЧАСТИНОК НА CANVAS (ПУШИНКИ, КВІТИ, ДОЩ, ЗІРОЧКИ)
   ========================================================================= */
const FX = (() => {
  const canvas = document.getElementById("fx-canvas");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let ambientSeeds = [];
  let raindrops = [];
  let isRaining = false;
  let isWindy = false;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  /* Створення фонових пушинок кульбабки, що плавно летять у повітрі */
  for (let i = 0; i < 16; i++) {
    ambientSeeds.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: 0.35 + Math.random() * 0.65,
      vy: -0.2 - Math.random() * 0.35,
      phase: Math.random() * Math.PI * 2,
      size: 7 + Math.random() * 6,
      rot: Math.random() * 0.6 - 0.3
    });
  }

  /* Малювання витонченої пушинки-парашутика без емодзі */
  function drawSeed(x, y, size, angle, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha = alpha;
    // Ніжка-насінинка
    ctx.strokeStyle = "#fffbe0";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, size * 0.8);
    ctx.lineTo(0, -size * 0.3);
    ctx.stroke();
    // Насінинка внизу
    ctx.fillStyle = "#c98b34";
    ctx.beginPath();
    ctx.ellipse(0, size * 0.9, 2.2, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // Парасолька пушинок зверху
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.3;
    for (let a = -1.1; a <= 1.1; a += 0.36) {
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.25);
      ctx.lineTo(Math.sin(a) * size * 0.95, -size * 0.25 - Math.cos(a) * size * 0.72);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* Малювання 5-пелюсткової квіточки або іскри для салюту */
  function drawPetalBurst(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;

    if (p.shape === "star") {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const ang = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const r = p.size;
        ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
      }
      ctx.closePath();
      ctx.fill();
    } else if (p.shape === "flower") {
      for (let i = 0; i < 5; i++) {
        ctx.rotate((Math.PI * 2) / 5);
        ctx.beginPath();
        ctx.ellipse(0, -p.size * 0.55, p.size * 0.36, p.size * 0.52, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#ffe45e";
      ctx.beginPath();
      ctx.arc(0, 0, p.size * 0.28, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.shape === "seed") {
      drawSeed(0, 0, p.size * 1.1, p.rot * 0.3, Math.max(0, p.life));
    } else {
      // Сяюча краплина-пилок
      ctx.beginPath();
      ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* Запуск святкового вибуху частинок у точці (x, y) */
  function burst(x, y, count = 34, mode = "celebrate") {
    const colors = mode === "celebrate"
      ? ["#ffe44d", "#ff6b98", "#6cf062", "#52d9ff", "#ff9f1c", "#fff5b8"]
      : ["#ffe147", "#ff9f1c", "#fff3b0"];
    const shapes = mode === "celebrate"
      ? ["flower", "star", "seed", "dot"]
      : ["star", "dot"];

    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (mode === "celebrate" ? 3.2 : 2) + Math.random() * 7.5;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - (mode === "celebrate" ? 3.5 : 1.5),
        size: 6 + Math.random() * 10,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.22,
        color: colors[Math.floor(Math.random() * colors.length)],
        shape: shapes[Math.floor(Math.random() * shapes.length)],
        life: 1,
        decay: 0.011 + Math.random() * 0.012
      });
    }
  }

  function setWeather(rain, windy) {
    isRaining = rain;
    isWindy = windy;
    if (isRaining && raindrops.length === 0) {
      for (let i = 0; i < 65; i++) {
        raindrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          len: 14 + Math.random() * 16,
          spd: 9 + Math.random() * 6
        });
      }
    }
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Фоновий політ пушинок кульбабки
    const windBoost = isWindy ? 4.2 : 1;
    ambientSeeds.forEach(s => {
      s.phase += 0.025 * windBoost;
      s.x += s.vx * windBoost;
      s.y += s.vy + Math.sin(s.phase) * 0.55;
      if (s.x > canvas.width + 30) s.x = -30;
      if (s.y < -30) s.y = canvas.height + 20;
      drawSeed(s.x, s.y, s.size, Math.sin(s.phase) * 0.35 + (isWindy ? 0.45 : 0), 0.72);
    });

    // 2. Сюжетний теплий дощик (на рівнях із дощиком)
    if (isRaining) {
      ctx.strokeStyle = "rgba(195, 240, 255, 0.58)";
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      raindrops.forEach(r => {
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - 4, r.y + r.len);
        ctx.stroke();
        r.x -= 2.2;
        r.y += r.spd;
        if (r.y > canvas.height) {
          r.y = -20;
          r.x = Math.random() * (canvas.width + 120);
        }
      });
    }

    // 3. Активні частинки салюту та реакцій
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.shape === "seed" ? 0.04 : 0.17;
      p.vx *= 0.985;
      p.rot += p.vrot;
      p.life -= p.decay;
      drawPetalBurst(p);
      if (p.life <= 0) particles.splice(i, 1);
    }

    requestAnimationFrame(loop);
  }
  loop();

  return { burst, setWeather };
})();

/* Поточні координати Коника-стрибунця */
let hopperPos = { x: 0, y: 0, flip: false };

/* Обчислення базової позиції Коника на правій галявині */
function getHopperHome() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const actorW = hopperActor.offsetWidth || 200;
  const actorH = hopperActor.offsetHeight || 180;
  return {
    x: w - actorW - Math.max(24, w * 0.08),
    y: h - actorH - Math.max(24, h * 0.05),
    flip: false
  };
}

function applyHopperTransform(x, y, flip, tiltDeg = 0) {
  hopperPos = { x, y, flip };
  hopperActor.style.transform = `translate3d(${x}px, ${y}px, 0) scaleX(${flip ? -1 : 1}) rotate(${tiltDeg}deg)`;
}

/* Жива параболічна фізика стрибка Коника з точки А в точку Б */
function jumpHopperTo(targetX, targetY, arcHeight = 165, duration = 560, onLand) {
  isJumping = true;
  SoundFX.playJump();

  const startX = hopperPos.x;
  const startY = hopperPos.y;
  const goingRight = targetX > startX;
  // За замовчуванням Коник дивиться ліворуч; якщо стрибає праворуч — дзеркально розвертається
  const flip = goingRight;
  const startTime = performance.now();

  hopperActor.classList.remove("hopper-idle", "hopper-crouch", "hopper-backflip", "hopper-jig", "hopper-bonk");
  hopperShadow.style.opacity = "0.12";

  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    // Плавне прискорення/сповільнення по X та реалістична парабола по Y
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const curX = startX + (targetX - startX) * ease;
    const linearY = startY + (targetY - startY) * ease;
    const parabola = 4 * t * (1 - t) * arcHeight;
    const curY = linearY - parabola;
    const tilt = (1 - 2 * t) * -18;

    applyHopperTransform(curX, curY, flip, tilt);

    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      applyHopperTransform(targetX, targetY, flip, 0);
      hopperShadow.style.opacity = "0.4";
      hopperActor.classList.add("hopper-idle");
      isJumping = false;
      if (onLand) onLand();
    }
  }
  requestAnimationFrame(step);
}

/* Живе стеження оченят Кульбабки та Коника за курсором або пальцем дитини */
function trackEyes(clientX, clientY) {
  document.querySelectorAll(".pupil-track").forEach(pupil => {
    const rect = pupil.parentElement.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const angle = Math.atan2(clientY - cy, clientX - cx);
    const dist = Math.min(4.2, Math.hypot(clientX - cx, clientY - cy) / 45);
    pupil.setAttribute("transform", `translate(${Math.cos(angle) * dist}, ${Math.sin(angle) * dist})`);
  });
}
window.addEventListener("pointermove", e => trackEyes(e.clientX, e.clientY));

/* Створення органічної SVG-підкладки під кожне слово */
function createWordBgSVG(isTarget, paletteIdx) {

        <defs>
          <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">

            <stop offset="55%" stop-color="#ffc82c"/>

          </linearGradient>
        </defs>
        <path d="M24,14 C56,4 164,4 196,14 C216,22 218,70 196,78 C162,88 58,88 24,78 C2,70 2,22 24,14 Z"
              fill="url(#${uid})" stroke="#fff9c4" stroke-width="4.5"/>
        <path d="M26,22 Q110,12 194,22" fill="none" stroke="#fffbe0" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
        <circle cx="24" cy="46" r="5" fill="#fff6b8" opacity="0.75"/>
        <circle cx="196" cy="46" r="5" fill="#fff6b8" opacity="0.75"/>
      </svg>`;
  } else {
    // Слово-кандидат: яскравий фігурний листочок-плашка з прожилками
    const pal = LEAF_PALETTES[paletteIdx % LEAF_PALETTES.length];
    return `
      <svg class="word-bg-svg" viewBox="0 0 220 92" preserveAspectRatio="none">
        <defs>
          <linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${pal.c1}"/>
            <stop offset="100%" stop-color="${pal.c2}"/>
          </linearGradient>
        </defs>
        <path d="M26,12 C72,5 154,6 196,16 C215,24 216,68 192,78 C148,88 68,86 24,76 C4,66 5,22 26,12 Z"
              fill="url(#${uid})" stroke="${pal.stroke}" stroke-width="4"/>
        <!-- Декоративний візерунок листка -->
        <path d="M20,46 Q110,41 200,46" fill="none" stroke="${pal.vein}" stroke-width="2.5" opacity="0.32" stroke-dasharray="10 8"/>
        <circle cx="30" cy="24" r="3.5" fill="${pal.stroke}" opacity="0.5"/>
        <circle cx="190" cy="68" r="3.5" fill="${pal.stroke}" opacity="0.5"/>
      </svg>`;
  }
}

/* =========================================================================
   ПОЗИЦІОНУВАННЯ ХМАРИНКИ-ПИТАННЯ
   -------------------------------------------------------------------------
   ВИПРАВЛЕНО: раніше хмаринка ставилася за getBoundingClientRect(), а слова
   в цей момент ще анімувалися (tilePopIn з translateY(35px) scale(0.65)),
   тому виміряна позиція була зміщена ВНИЗ і хмаринка «сідала» на слово.
   Тепер використовуються layout-координати offsetLeft/offsetTop, які
   взагалі не залежать від CSS-анімацій і трансформацій.
   ========================================================================= */
function setBadgePosition(centerX, centerY) {
  const badgeH = questionBadge.offsetHeight || 72;
  const badgeW = questionBadge.offsetWidth || 130;

  // Тримаємо хмаринку в межах екрана по горизонталі
  const clampedX = Math.min(
    Math.max(centerX, badgeW / 2 + 8),
    window.innerWidth - badgeW / 2 - 8
  );
  // І не даємо їй вилетіти за верхній край
  const clampedY = Math.max(centerY, badgeH / 2 + 8);

  questionBadge.style.left = `${clampedX}px`;
  questionBadge.style.top = `${clampedY}px`;
}

/* Позиціонування хмаринки-питання НАД залежним словом (до відповіді) */
function positionQuestionOverTarget() {
  const targetEl = sentenceZone.querySelector(".target-word");
  if (!targetEl) return;

  // Layout-координати (offsetLeft/offsetTop) не залежать від анімацій появи слів
  const zoneRect = sentenceZone.getBoundingClientRect();
  const badgeH = questionBadge.offsetHeight || 72;
  const gap = 16;

  const wordCenterX = zoneRect.left + targetEl.offsetLeft + targetEl.offsetWidth / 2;
  const wordTop = zoneRect.top + targetEl.offsetTop;
  const wordBottom = wordTop + targetEl.offsetHeight;

  // За замовчуванням хмаринка стоїть НАД словом (нижній край — з відступом)
  let centerY = wordTop - gap - badgeH / 2;

  // Якщо зверху зовсім немає місця (дуже маленький екран) — показуємо під словом
  if (centerY - badgeH / 2 < 8) {
    centerY = wordBottom + gap + badgeH / 2;
  }

  setBadgePosition(wordCenterX, centerY);
}

/* Обчислення координат дуги між двома елементами слів */
function computeArcGeometry(fromEl, toEl) {
  const r1 = fromEl.getBoundingClientRect();
  const r2 = toEl.getBoundingClientRect();
  const x1 = r1.left + r1.width / 2;
  const y1 = r1.top + 4;
  const x2 = r2.left + r2.width / 2;
  const y2 = r2.top + 4;
  const dist = Math.abs(x2 - x1);
  const arcLift = Math.max(76, Math.min(148, dist * 0.32));
  const cx = (x1 + x2) / 2;
  const cy = Math.min(y1, y2) - arcLift;
  // Найвища точка квадратичної кривої Безьє (t = 0.5)
  const apexX = 0.25 * x1 + 0.5 * cx + 0.25 * x2;
  const apexY = 0.25 * y1 + 0.5 * cy + 0.25 * y2;
  return { x1, y1, x2, y2, cx, cy, apexX, apexY };
}

/* Малювання плавної анімованої синтаксичної стрілки після правильної відповіді */
function drawSolvedArrow(headEl, targetEl, instant = false) {
  const g = computeArcGeometry(headEl, targetEl);
  const pathD = `M ${g.x1} ${g.y1} Q ${g.cx} ${g.cy} ${g.x2} ${g.y2}`;
  solvedArc.setAttribute("d", pathD);
  solvedArc.style.opacity = "1";

  // Обчислення кута наконечника стрілки в кінцевій точці
  const angle = Math.atan2(g.y2 - g.cy, g.x2 - g.cx);
  const headLen = 22;
  const p1x = g.x2 - headLen * Math.cos(angle - 0.52);
  const p1y = g.y2 - headLen * Math.sin(angle - 0.52);
  const p2x = g.x2 - headLen * Math.cos(angle + 0.52);
  const p2y = g.y2 - headLen * Math.sin(angle + 0.52);
  solvedArrowhead.setAttribute("d", `M ${g.x2} ${g.y2} L ${p1x} ${p1y} L ${p2x} ${p2y} Z`);

  const len = solvedArc.getTotalLength();
  if (instant) {
    solvedArc.style.transition = "none";
    solvedArc.style.strokeDasharray = `${len}`;
    solvedArc.style.strokeDashoffset = "0";
    solvedArrowhead.style.opacity = "1";
  } else {
    solvedArc.style.transition = "none";
    solvedArc.style.strokeDasharray = `${len}`;
    solvedArc.style.strokeDashoffset = `${len}`;
    solvedArrowhead.style.opacity = "0";
    requestAnimationFrame(() => {
      solvedArc.style.transition = "stroke-dashoffset 0.65s cubic-bezier(0.25, 0.9, 0.35, 1)";
      solvedArc.style.strokeDashoffset = "0";
      setTimeout(() => {
        solvedArrowhead.style.transition = "opacity 0.25s ease";
        solvedArrowhead.style.opacity = "1";
      }, 480);
    });
  }

  // Плавний переліт хмаринки з питанням на вершину дуги (НАД словами!)
  const badgeH = questionBadge.offsetHeight || 72;
  setBadgePosition(g.apexX, g.apexY - badgeH / 2 - 6);
}

/* Показ легкої пунктирної дуги при наведенні на слово-кандидат */
function showPreviewArc(candidateEl) {
  if (levelSolved || isJumping) return;
  const targetEl = sentenceZone.querySelector(".target-word");
  if (!targetEl || candidateEl === targetEl) return;
  const g = computeArcGeometry(candidateEl, targetEl);
  previewArc.setAttribute("d", `M ${g.x1} ${g.y1} Q ${g.cx} ${g.cy} ${g.x2} ${g.y2}`);
  previewArc.style.opacity = "0.78";
  hopperActor.classList.add("hopper-crouch");
  setEmotions("curious");
}

function hidePreviewArc() {
  previewArc.style.opacity = "0";
  hopperActor.classList.remove("hopper-crouch");
  if (!levelSolved && !isJumping) setEmotions("neutral");
}

/* Перемикання сюжетного фону мультика */
function applyScene(sceneName) {
  const sc = SCENES[sceneName] || SCENES.morning;
  document.getElementById("sky-stop-1").setAttribute("stop-color", sc.sky[0]);
  document.getElementById("sky-stop-2").setAttribute("stop-color", sc.sky[1]);
  document.getElementById("sky-stop-3").setAttribute("stop-color", sc.sky[2]);

  document.querySelectorAll(".story-group").forEach(el => {
    el.classList.toggle("active", sc.props.includes(el.id));
  });

  stage.classList.toggle("windy-mode", !!sc.windy);
  FX.setWeather(!!sc.rain, !!sc.windy);
}

/* =========================================================================
   ЗАВАНТАЖЕННЯ РІВНЯ
   ========================================================================= */
function loadLevel(index) {
  currentLevel = ((index % LEVELS.length) + LEVELS.length) % LEVELS.length;
  levelSolved = false;
  isJumping = false;

  const data = LEVELS[currentLevel];
  applyScene(data.scene);

  // Скидання стрілок та кнопок
  previewArc.style.opacity = "0";
  solvedArc.style.opacity = "0";
  solvedArrowhead.style.opacity = "0";
  btnNext.classList.remove("ready-pulse");
  btnPrev.classList.toggle("dimmed", currentLevel === 0);

  setEmotions("neutral");

  // Повернення Коника на стартову галявину
  const home = getHopperHome();
  applyHopperTransform(home.x, home.y, false, 0);

  // Генерація великих фігурних слів речення
  sentenceZone.innerHTML = "";
  data.words.forEach((word, idx) => {
    const isTarget = idx === data.targetIndex;
    const btn = document.createElement("div");
    btn.className = `word-tile word-enter ${isTarget ? "target-word" : "candidate"}`;
    btn.style.animationDelay = `${idx * 0.075}s`;
    btn.dataset.index = idx;
    btn.innerHTML = `${createWordBgSVG(isTarget, idx + currentLevel)}<span>${word}</span>`;

    if (!isTarget) {
      btn.addEventListener("pointerenter", () => {
        SoundFX.playHover();
        showPreviewArc(btn);
      });
      btn.addEventListener("pointerleave", hidePreviewArc);
    }

    btn.addEventListener("click", () => handleWordClick(btn, idx));
    sentenceZone.appendChild(btn);
  });

  // Оновлення тексту питання та його позиції (одразу — за layout-координатами)
  questionText.textContent = data.question;
  questionBadge.style.opacity = "0";
  positionQuestionOverTarget();

  requestAnimationFrame(() => {
    positionQuestionOverTarget();
    questionBadge.style.opacity = "1";
  });

  // Страхувальний перерахунок після завантаження шрифтів та завершення анімацій появи
  setTimeout(positionQuestionOverTarget, 700);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(positionQuestionOverTarget).catch(() => {});
  }
}

/* =========================================================================
   ОБРОБКА КЛІКУ ПО СЛОВУ (СТРИБОК КОНИКА + АКТИВНІ РЕАКЦІЇ)
   ========================================================================= */
function handleWordClick(tileEl, wordIndex) {
  if (levelSolved || isJumping) return;

  const data = LEVELS[currentLevel];
  const rect = tileEl.getBoundingClientRect();
  const actorW = hopperActor.offsetWidth || 200;
  const actorH = hopperActor.offsetHeight || 180;

  // Цільова точка приземлення Коника — прямо зверху на натиснутому слові
  const landX = rect.left + rect.width / 2 - actorW * 0.5;
  const landY = rect.top - actorH * 0.72;

  hidePreviewArc();

  // Якщо дитина клікнула на саме залежне слово (із питанням) — кумедний м'який відскок
  if (wordIndex === data.targetIndex) {
    SoundFX.playWrong(wrongCount++);
    tileEl.classList.remove("wrong-wobble");
    void tileEl.offsetWidth;
    tileEl.classList.add("wrong-wobble");
    dandelionActor.classList.add("dandy-oops");
    setEmotions("oops");
    setTimeout(() => {
      if (!levelSolved) setEmotions("neutral");
      dandelionActor.classList.remove("dandy-oops");
    }, 850);
    return;
  }

  // Коник виконує живий параболічний стрибок на вибране слово!
  jumpHopperTo(landX, landY, 175, 520, () => {
    if (wordIndex === data.headIndex) {
      triggerVictory(tileEl);
    } else {
      triggerWrong(tileEl);
    }
  });
}

/* Різноманітний святковий фідбек без слів (сальто, танок, салют, стрілка) */
function triggerVictory(headEl) {
  levelSolved = true;
  const targetEl = sentenceZone.querySelector(".target-word");

  SoundFX.playSuccess(currentLevel);
  setEmotions("happy");

  headEl.classList.add("solved-head");

  // Додаємо сяючу золоту зірочку-корону над головним словом
  const crown = document.createElement("div");
  crown.className = "head-crown";
  crown.innerHTML = `
    <svg viewBox="0 0 60 60" width="100%" height="100%">
      <polygon points="30,4 37,20 55,22 41,34 45,52 30,42 15,52 19,34 5,22 23,20"
               fill="#ffe44d" stroke="#d96b00" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="30" cy="29" r="5.5" fill="#fffdf0"/>
    </svg>`;
  headEl.appendChild(crown);

  // Малюємо синтаксичну стрілку і переносимо питання на дугу
  drawSolvedArrow(headEl, targetEl, false);

  // Різні хореографії радості для Коника і Кульбабки залежно від рівня
  const style = currentLevel % 3;
  if (style === 0) {
    hopperActor.classList.add("hopper-backflip");
    dandelionActor.classList.add("dandy-celebrate");
  } else if (style === 1) {
    hopperActor.classList.add("hopper-jig");
    dandelionActor.classList.add("dandy-spin");
  } else {
    hopperActor.classList.add("hopper-backflip");
    dandelionActor.classList.add("dandy-spin");
  }

  // Серія квіткових та пушинкових салютів
  const rHead = headEl.getBoundingClientRect();
  const rTarget = targetEl.getBoundingClientRect();
  FX.burst(rHead.left + rHead.width / 2, rHead.top + 10, 36, "celebrate");
  setTimeout(() => {
    FX.burst(rTarget.left + rTarget.width / 2, rTarget.top + 10, 34, "celebrate");
  }, 320);

  // Якщо це фінальний 16-й рівень — грандіозний веселковий салют!
  if (currentLevel === LEVELS.length - 1) {
    setTimeout(() => FX.burst(window.innerWidth * 0.25, window.innerHeight * 0.35, 42, "celebrate"), 550);
    setTimeout(() => FX.burst(window.innerWidth * 0.75, window.innerHeight * 0.35, 42, "celebrate"), 800);
    setTimeout(() => FX.burst(window.innerWidth * 0.5, window.innerHeight * 0.25, 50, "celebrate"), 1050);
  }

  // Підсвічуємо кнопку «Далі», щоб дитина бачила можливість рухатися далі
  setTimeout(() => {
    btnNext.classList.add("ready-pulse");
  }, 750);
}

/* Кумедний і добрий фідбек при помилці (Коник кумедно відскакує на галявину) */
function triggerWrong(wrongEl) {
  SoundFX.playWrong(wrongCount++);
  setEmotions("oops");

  wrongEl.classList.remove("wrong-wobble");
  void wrongEl.offsetWidth;
  wrongEl.classList.add("wrong-wobble");

  hopperActor.classList.add("hopper-bonk");
  dandelionActor.classList.add("dandy-oops");

  const r = wrongEl.getBoundingClientRect();
  FX.burst(r.left + r.width / 2, r.top, 12, "wrong");

  // Через коротку паузу Коник зі смішним стрибком повертається на галявину
  setTimeout(() => {
    if (levelSolved) return;
    hopperActor.classList.remove("hopper-bonk");
    dandelionActor.classList.remove("dandy-oops");
    const home = getHopperHome();
    jumpHopperTo(home.x, home.y, 120, 460, () => {
      applyHopperTransform(home.x, home.y, false, 0);
      setEmotions("neutral");
    });
  }, 620);
}

/* =========================================================================
   ІНТЕРАКТИВНІСТЬ ПЕРСОНАЖІВ ТА ДЕКОРАЦІЙ (КЛІКАБЕЛЬНИЙ МУЛЬТЯШНИЙ СВІТ)
   ========================================================================= */
dandelionActor.addEventListener("click", () => {
  SoundFX.playProp("chime");
  dandelionActor.classList.remove("dandy-spin");
  void dandelionActor.offsetWidth;
  dandelionActor.classList.add("dandy-spin");
  const r = dandelionActor.getBoundingClientRect();
  FX.burst(r.left + r.width / 2, r.top + r.height * 0.35, 22, "celebrate");
  setTimeout(() => dandelionActor.classList.remove("dandy-spin"), 1100);
});

hopperActor.addEventListener("click", () => {
  if (isJumping) return;
  SoundFX.playJump();
  hopperActor.classList.remove("hopper-backflip");
  void hopperActor.offsetWidth;
  hopperActor.classList.add("hopper-backflip");
  const r = hopperActor.getBoundingClientRect();
  FX.burst(r.left + r.width / 2, r.top + r.height * 0.5, 16, "celebrate");
  setTimeout(() => hopperActor.classList.remove("hopper-backflip"), 900);
});

/* Реакції на клік по об'єктах фону: сонце, хмаринки, жабка, гриб, росинка, метелик, суниці */
const interactiveProps = [
  { id: "sun-prop", sound: "chime" },
  { id: "cloud-1", sound: "boing" },
  { id: "cloud-2", sound: "boing" },
  { id: "frog-prop", sound: "frog" },
  { id: "dew-prop", sound: "chime" },
  { id: "mushroom-prop", sound: "boing" },
  { id: "butterfly-prop", sound: "chime" },
  { id: "berries-prop", sound: "boing" }
];

interactiveProps.forEach(item => {
  const el = document.getElementById(item.id);
  if (!el) return;
  el.addEventListener("click", e => {
    SoundFX.playProp(item.sound);
    el.classList.remove("prop-pop");
    void el.offsetWidth;
    el.classList.add("prop-pop");
    FX.burst(e.clientX, e.clientY, 16, "celebrate");
  });
});

/* =========================================================================
   НАВІГАЦІЯ: КНОПКИ «ДАЛІ» (МИТТЄВИЙ ПЕРЕХІД) ТА «НАЗАД»
   ========================================================================= */
btnNext.addEventListener("click", () => {
  SoundFX.playNav();
  loadLevel(currentLevel + 1);
});

btnPrev.addEventListener("click", () => {
  if (currentLevel === 0) return;
  SoundFX.playNav();
  loadLevel(currentLevel - 1);
});

/* Перерахунок координат стрілки, хмаринки та персонажів при зміні розміру вікна */
window.addEventListener("resize", () => {
  if (levelSolved) {
    const headEl = sentenceZone.querySelector(".solved-head");
    const targetEl = sentenceZone.querySelector(".target-word");
    if (headEl && targetEl) drawSolvedArrow(headEl, targetEl, true);
  } else {
    positionQuestionOverTarget();
    const home = getHopperHome();
    applyHopperTransform(home.x, home.y, false, 0);
  }
});

/* Старт пригоди з 1-го рівня */
window.addEventListener("DOMContentLoaded", () => {
  loadLevel(0);
});
</script>
