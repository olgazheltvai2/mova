<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Інтерактивна гра: Знайди об'єкт</title>

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* БАЗОВІ СТИЛІ ТА ШРИФТ */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #222;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ПРОЗОРІ КОНТЕЙНЕРИ ІГРИ ТА ПАНЕЛЬ ПИТАННЯ (ПЕРЕТЯГУЄТЬСЯ) */
        #game-ui {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: 95%;
            text-align: center;
            z-index: 10;
            pointer-events: auto;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        #game-ui:active {
            cursor: grabbing;
        }
        
        /* КОНТРАСТНИЙ ШРИФТ ПИТАННЯ */
        #question-display {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 32px;
            font-weight: 900;
            color: #FFFF00;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 
                3px 3px 0 #000, 
                -2px -2px 0 #000, 
                2px -2px 0 #000, 
                -2px 2px 0 #000, 
                2px 2px 0 #000,
                0px 5px 15px rgba(0,0,0,1);
            border: 3px solid #FFFF00;
            transition: transform 0.3s ease;
            user-select: none;
        }

        /* КНОПКА "НАСТУПНЕ ПИТАННЯ" */
        #next-btn {
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9900, #ff5500);
            color: white;
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            pointer-events: auto;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px #000;
        }
        #next-btn:active {
            transform: scale(0.92);
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* КОНТЕЙНЕР ЗОБРАЖЕННЯ НА ВЕСЬ ЕКРАН */
        #image-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        #main-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: crosshair;
            position: relative;
            pointer-events: auto;
        }
        
        /* ЕФЕКТ ФІДБЕКУ ПРИ ЗНАХОДЖЕННІ */
        .feedback-ripple {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(0,255,0,0.9) 0%, rgba(0,255,0,0) 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: rippleAnim 1s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }
        @keyframes rippleAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(4); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(6); opacity: 0; }
        }

        /* THEME MANAGER UI */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border: 2px solid white;
            font-size: 24px;
            cursor: pointer;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            transition: transform 0.2s;
        }
        #theme-btn:active { transform: scale(0.9); }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            max-height: 60vh;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid white;
            border-radius: 15px;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .theme-item {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
        }
        .theme-item:hover { border-color: #fff; }
        .theme-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-item span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 4px 0;
            font-weight: bold;
        }
        #theme-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        /* БЛОК ДОСТУПУ (ЗАГЛУШКА) */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #block-overlay h1 {
            color: red;
            font-size: 40px;
            text-align: center;
            margin: 0 20px;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
        }

        /* АДАПТИВНІСТЬ */
        @media (max-width: 600px) {
            #question-display { font-size: 20px; padding: 12px 20px; border-width: 2px; }
            #next-btn { font-size: 18px; padding: 10px 20px; }
            .theme-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- UI ІГРИ (МОЖНА ПЕРЕТЯГУВАТИ) -->
    <div id="game-ui">
        <div id="question-display">ЗАВАНТАЖЕННЯ...</div>
        <button id="next-btn" style="display: none;">Наступне питання ➔</button>
    </div>

    <!-- КОНТЕЙНЕР ІГРОВОГО ПОЛЯ НА ВЕСЬ ЕКРАН -->
    <div id="image-container">
        <!-- Змініть шлях на ваш новий фон, якщо потрібно. За замовчуванням залишаю фон.webp -->
        <img id="main-image" src="фон.webp" alt="Ігрове поле">
        <div id="ripple-container"></div>
    </div>

    <!-- THEME MANAGER UI -->
    <div id="theme-btn">⚙️</div>
    <div id="theme-modal">
        <div id="theme-close">×</div>
        <h2 style="color:white; text-align:center; margin-top:0;">Виберіть фон</h2>
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <!-- ЕКРАН-ЗАГЛУШКА -->
    <div id="block-overlay">
        <h1>Зачекай! Зараз не твій урок.</h1>
    </div>

    <script>
        // ==========================================
        // ЛОГІКА ПЕРЕТЯГУВАННЯ ПАНЕЛІ (DRAG & DROP)
        // ==========================================
        const gameUI = document.getElementById('game-ui');
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        function onDragStart(e) {
            if (e.target.id === 'next-btn') return;
            isDragging = true;
            
            const clientX = e.type.includes('mouse') ? e.clientX : (e.touches && e.touches.length > 0 ? e.touches[0].clientX : 0);
            const clientY = e.type.includes('mouse') ? e.clientY : (e.touches && e.touches.length > 0 ? e.touches[0].clientY : 0);
            
            startX = clientX;
            startY = clientY;
            
            const rect = gameUI.getBoundingClientRect();
            gameUI.style.transform = 'none';
            gameUI.style.left = rect.left + 'px';
            gameUI.style.top = rect.top + 'px';
            
            initialLeft = rect.left;
            initialTop = rect.top;
        }

        function onDragMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const clientX = e.type.includes('mouse') ? e.clientX : (e.touches && e.touches.length > 0 ? e.touches[0].clientX : 0);
            const clientY = e.type.includes('mouse') ? e.clientY : (e.touches && e.touches.length > 0 ? e.touches[0].clientY : 0);
            
            const dx = clientX - startX;
            const dy = clientY - startY;
            
            gameUI.style.left = (initialLeft + dx) + 'px';
            gameUI.style.top = (initialTop + dy) + 'px';
        }

        function onDragEnd() {
            isDragging = false;
        }

        gameUI.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove, { passive: false });
        document.addEventListener('mouseup', onDragEnd);

        gameUI.addEventListener('touchstart', onDragStart, { passive: false });
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);


        // ==========================================
        // 1. ДАНІ ГРИ ТА КООРДИНАТИ (Нові координати та питання)
        // ==========================================
        const commonSoundUrl = "https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"; 

        const questionsData = [
            { id: 1, text: "Шукай там, де холодно.", x: 64.44, y: 70.40, radius: 6, sound: commonSoundUrl },
            { id: 2, text: "Шукай там, де портяться зуби.", x: 82.79, y: 37.68, radius: 6, sound: commonSoundUrl },
            { id: 3, text: "Шукай те, що наводить порядок.", x: 77.19, y: 91.06, radius: 6, sound: commonSoundUrl },
            { id: 4, text: "Шукай когось у формі.", x: 69.58, y: 37.35, radius: 6, sound: commonSoundUrl },
            { id: 5, text: "Шукай те, що може їхати.", x: 48.08, y: 61.31, radius: 6, sound: commonSoundUrl },
            { id: 6, text: "Шукай там, де вітаміни.", x: 19.97, y: 52.22, radius: 6, sound: commonSoundUrl },
            { id: 7, text: "Шукай там, де була курка.", x: 30.11, y: 48.59, radius: 6, sound: commonSoundUrl },
            { id: 8, text: "Шукай там, де є гроші.", x: 47.54, y: 45.12, radius: 6, sound: commonSoundUrl },
            { id: 9, text: "Шукай там, де пахне.", x: 22.66, y: 29.91, radius: 6, sound: commonSoundUrl },
            { id: 10, text: "Шукай те, що було у морі.", x: 23.81, y: 89.41, radius: 6, sound: commonSoundUrl }
        ];

        let availableQuestions = [...questionsData];
        let currentQuestion = null;
        let isGameFinished = false;
        let isGameStarted = false;

        // ==========================================
        // 2. ІДЕНТИФІКАЦІЯ
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user');
        if (myName) {
            sessionStorage.setItem('userName', myName);
        } else {
            myName = sessionStorage.getItem('userName');
            if (!myName) {
                myName = "Гість_" + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('userName', myName);
            }
        }
        const tabId = Math.random().toString(36).substr(2, 9);
        const senderId = myName + "_" + tabId;

        // ==========================================
        // 3. БЕЗПЕЧНА FIREBASE ІНІЦІАЛІЗАЦІЯ
        // ==========================================
        let db = null;
        try {
            const firebaseConfig = {
                databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
                projectId: "lesson-13c44"
            };
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            } else {
                console.warn("Скрипт Firebase заблоковано браузером. Гра працюватиме локально.");
            }
        } catch (error) {
            console.error("Помилка підключення до Firebase:", error);
        }

        // ==========================================
        // 4. THEME MANAGER З СИНХРОНІЗАЦІЄЮ
        // ==========================================
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeClose = document.getElementById('theme-close');
        const themeGrid = document.getElementById('theme-grid');
        const baseUrl = "https://olgazheltvai2.github.io/images/backgrounds/";

        themeBtn.onclick = () => themeModal.style.display = 'block';
        themeClose.onclick = () => themeModal.style.display = 'none';

        async function loadThemes() {
            themeGrid.innerHTML = '';
            for (let i = 1; i <= 1000; i++) {
                const url = `${baseUrl}background_${i}.webp`;
                
                const isLoaded = await new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = url;
                });

                if (isLoaded) {
                    const div = document.createElement('div');
                    div.className = 'theme-item';
                    div.innerHTML = `<img src="${url}"><span>Фон ${i}</span>`;
                    div.onclick = () => {
                        if (db) db.ref('game_theme').set(url).catch(()=>{});
                        else applyThemeLocally(url);
                        themeModal.style.display = 'none';
                    };
                    themeGrid.appendChild(div);
                } else {
                    break;
                }
            }
        }
        loadThemes();

        function applyThemeLocally(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
        }

        if (db) {
            db.ref('game_theme').on('value', (snap) => {
                const url = snap.val();
                if (url) applyThemeLocally(url);
            });
        }
        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) applyThemeLocally(savedBg);

        // ==========================================
        // 5. ЛОГІКА ІГРИ ТА СИНХРОНІЗАЦІЯ ДІЙ
        // ==========================================
        const questionDisplay = document.getElementById('question-display');
        const nextBtn = document.getElementById('next-btn');
        const mainImage = document.getElementById('main-image');
        
        let lastActionTimestamp = 0;

        function pickRandomQuestion() {
            if (availableQuestions.length === 0) return null;
            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            return availableQuestions[randomIndex];
        }

        function setQuestion(questionObj) {
            currentQuestion = questionObj;
            if (currentQuestion) {
                questionDisplay.innerText = currentQuestion.text;
                questionDisplay.style.transform = 'scale(1.05)';
                setTimeout(() => questionDisplay.style.transform = 'scale(1)', 200);
                nextBtn.style.display = 'inline-block';
            } else {
                questionDisplay.innerText = "ВСІ ПРЕДМЕТИ ЗНАЙДЕНО!";
                nextBtn.style.display = 'none';
                triggerConfetti();
                isGameFinished = true;
            }
        }

        function sendGameAction(type, data) {
            if (!db) return;
            db.ref('game_action').set({
                senderId: senderId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            }).catch(e => console.log("Офлайн режим. Дані не відправлено.", e));
        }

        nextBtn.addEventListener('click', () => {
            if (isGameFinished || !currentQuestion) return;
            
            availableQuestions = availableQuestions.filter(q => q.id !== currentQuestion.id);
            const nextQ = pickRandomQuestion();
            
            const data = {
                nextQuestionId: nextQ ? nextQ.id : null,
                availableIds: availableQuestions.map(q => q.id)
            };
            
            setQuestion(nextQ);
            sendGameAction('skip_question', data);
        });

        mainImage.addEventListener('click', (e) => {
            if (isGameFinished || !currentQuestion) return;

            const rect = mainImage.getBoundingClientRect();
            
            const clientX = e.clientX;
            const clientY = e.clientY;

            const clickX = ((clientX - rect.left) / rect.width) * 100;
            const clickY = ((clientY - rect.top) / rect.height) * 100;

            const dx = clickX - currentQuestion.x;
            const dy = clickY - currentQuestion.y;
            const distance = Math.sqrt(dx*dx + dy*dy);

            if (distance <= currentQuestion.radius) {
                availableQuestions = availableQuestions.filter(q => q.id !== currentQuestion.id);
                const nextQ = pickRandomQuestion();
                
                const data = {
                    clickX: clickX,
                    clickY: clickY,
                    soundUrl: currentQuestion.sound,
                    nextQuestionId: nextQ ? nextQ.id : null,
                    availableIds: availableQuestions.map(q => q.id)
                };
                
                showRipple(clickX, clickY);
                playSound(currentQuestion.sound);
                setQuestion(nextQ);

                sendGameAction('target_found', data);
            }
        });

        function playSound(url) {
            const audio = new Audio(url);
            audio.volume = 0.1; 
            audio.play().catch(e => console.log("Аудіо заблоковано браузером", e));
        }

        function showRipple(xPercent, yPercent) {
            const ripple = document.createElement('div');
            ripple.className = 'feedback-ripple';
            ripple.style.left = `${xPercent}%`;
            ripple.style.top = `${yPercent}%`;
            mainImage.parentElement.appendChild(ripple);
            setTimeout(() => { ripple.remove(); }, 1000);
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // ==========================================
        // СТАБІЛЬНА ЛОГІКА ІНІЦІАЛІЗАЦІЇ ІЗ ЗАХИСТОМ ВІД ЗБОЇВ
        // ==========================================
        function startNewGame() {
            if (isGameStarted) return;
            isGameStarted = true;
            
            availableQuestions = [...questionsData];
            const firstQ = pickRandomQuestion();
            availableQuestions = availableQuestions.filter(q => q.id !== firstQ.id);
            
            const data = {
                firstQuestionId: firstQ.id,
                availableIds: availableQuestions.map(q => q.id)
            };
            
            setQuestion(firstQ);
            sendGameAction('start_game', data);
        }

        const fallbackTimer = setTimeout(() => {
            if (!isGameStarted) {
                console.warn("Примусовий старт: перевищено час очікування бази даних.");
                startNewGame();
            }
        }, 1500);

        if (db) {
            db.ref('game_action').on('value', (snap) => {
                try {
                    const action = snap.val();
                    
                    if (!action || !action.timestamp || !action.type) {
                        if (!isGameStarted) startNewGame();
                        return;
                    }

                    const now = Date.now();
                    
                    if (!isGameStarted) {
                        if (now - action.timestamp < 3600000) { 
                            isGameStarted = true;
                            lastActionTimestamp = action.timestamp;

                            if (action.data && Array.isArray(action.data.availableIds)) {
                                availableQuestions = questionsData.filter(q => action.data.availableIds.includes(q.id));
                            } else {
                                availableQuestions = [...questionsData];
                            }

                            let restoredQ = null;
                            if (action.type === 'start_game' && action.data && action.data.firstQuestionId) {
                                restoredQ = questionsData.find(q => q.id === action.data.firstQuestionId);
                            } else if ((action.type === 'target_found' || action.type === 'skip_question') && action.data && action.data.nextQuestionId) {
                                restoredQ = questionsData.find(q => q.id === action.data.nextQuestionId);
                            }
                            
                            if (!restoredQ && availableQuestions.length > 0) {
                                restoredQ = pickRandomQuestion();
                                availableQuestions = availableQuestions.filter(q => q.id !== restoredQ.id);
                            }
                            
                            setQuestion(restoredQ);
                        } else {
                            startNewGame();
                        }
                        return;
                    }

                    if (action.timestamp <= lastActionTimestamp) return;
                    lastActionTimestamp = action.timestamp;

                    const isRemoteAction = action.senderId !== senderId;
                    if (isRemoteAction) {
                        if (action.data && Array.isArray(action.data.availableIds)) {
                            availableQuestions = questionsData.filter(q => action.data.availableIds.includes(q.id));
                        }

                        let nextQ = null;
                        if (action.type === 'start_game' && action.data && action.data.firstQuestionId) {
                            nextQ = questionsData.find(q => q.id === action.data.firstQuestionId);
                        } else if (action.type === 'target_found' || action.type === 'skip_question') {
                            if (action.type === 'target_found' && action.data) {
                                showRipple(action.data.clickX, action.data.clickY);
                                if (action.data.soundUrl) playSound(action.data.soundUrl);
                            }
                            if (action.data && action.data.nextQuestionId) {
                                nextQ = questionsData.find(q => q.id === action.data.nextQuestionId);
                            }
                        }
                        setQuestion(nextQ);
                    }
                } catch (err) {
                    console.error("Критична помилка обробки даних з Firebase. Примусове перезавантаження.", err);
                    if (!isGameStarted) startNewGame();
                }
            });
        }

        // ==========================================
        // 6. УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ
        // ==========================================
        if (db) {
            const radarRef = db.ref(`online_users/${myName}/${tabId}`);
            const connectedRef = db.ref('.info/connected');
            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    radarRef.set({ timestamp: firebase.database.ServerValue.TIMESTAMP });
                    radarRef.onDisconnect().remove();
                }
            });
            window.addEventListener('beforeunload', () => { radarRef.remove(); });

            db.ref('force_refresh').on('value', (snap) => {
                if(snap.val()) {
                    const now = Date.now();
                    if(now - snap.val() < 5000) window.location.reload();
                }
            });

            db.ref(`blocked_users/${myName}`).on('value', (snap) => {
                document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
            });

            let immunity = true;
            setTimeout(() => { immunity = false; }, 1000);
            db.ref('current_activity').on('value', (snap) => {
                if(immunity) return;
                const activity = snap.val();
                if (activity === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            });
        }
    </script>
</html>
