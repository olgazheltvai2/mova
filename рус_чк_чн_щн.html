<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Орфограми</title>
<style>
  /* Скидання стандартних відступів та базові налаштування сторінки */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', 'Palatino Linotype', serif;
    background: #1a2418;
  }

  /* Головний контейнер сцени */
  #game-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 1.5vh 2vw 2vh 2vw;
    overflow: hidden;
  }

  /* Фоновий живий SVG-пейзаж */
  #bg-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }

  /* Шар для ефектів (іскри, листя, світлячки під час фідбеку) */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 25;
    pointer-events: none;
  }

  /* Верхня панель керування (мінімалістичні кнопки навігації та мови) */
  .top-controls {
    position: relative;
    z-index: 20;
    width: 100%;
    max-width: 1320px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
  }

  .nav-group {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  /* Стилізація дерев'яно-бронзових кнопок без білих прямокутників */
  .wood-btn {
    position: relative;
    height: 50px;
    min-width: 54px;
    padding: 0 16px;
    border-radius: 26px;
    border: 2px solid #d7a14b;
    background: radial-gradient(circle at 30% 25%, #6e4726 0%, #432812 65%, #291608 100%);
    box-shadow:
      0 6px 14px rgba(0, 0, 0, 0.55),
      inset 0 2px 3px rgba(255, 224, 166, 0.45),
      inset 0 -3px 6px rgba(20, 9, 2, 0.8);
    color: #fce2b6;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 1.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease, box-shadow 0.18s ease;
  }

  .wood-btn:hover {
    transform: translateY(-2px) scale(1.05);
    filter: brightness(1.14);
    box-shadow:
      0 9px 18px rgba(0, 0, 0, 0.65),
      0 0 12px rgba(245, 189, 89, 0.4),
      inset 0 2px 4px rgba(255, 232, 185, 0.6);
  }

  .wood-btn:active {
    transform: translateY(2px) scale(0.96);
  }

  .wood-btn svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: #fce2b6;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.6));
  }

  /* Центральна ігрова зона: картина + живий персонаж */
  .middle-stage {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1280px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5vw;
    min-height: 0;
    margin: 0.5vh 0;
  }

  /* Різьблена дерев'яна рама для реалістичної ілюстрації слайду */
  .art-frame {
    position: relative;
    width: min(56vw, 620px);
    height: min(41vh, 365px);
    border-radius: 28px;
    padding: 12px;
    background: linear-gradient(145deg, #6b4223 0%, #3d220e 48%, #543117 100%);
    box-shadow:
      0 18px 38px rgba(0, 0, 0, 0.68),
      0 0 0 3px #b88337,
      inset 0 3px 6px rgba(255, 217, 148, 0.42),
      inset 0 -5px 10px rgba(15, 7, 2, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.35s ease;
  }

  /* Декоративні бронзові кутики на рамі */
  .art-frame::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 22px;
    border: 1.5px dashed rgba(235, 186, 105, 0.42);
    pointer-events: none;
  }

  .art-inner {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.65);
    background: #1e2d24;
  }

  #slide-illustration {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Контейнер живого персонажа (рудий лісовий лис-художник) */
  .character-wrap {
    position: relative;
    width: min(23vw, 250px);
    height: min(39vh, 330px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.6));
  }

  #fox-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    transform-origin: bottom center;
  }

  /* Анімації живого персонажа */
  @keyframes foxBreathe {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50% { transform: scaleY(1.025) translateY(-3px); }
  }
  @keyframes tailSway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(7deg); }
  }
  @keyframes earTwitchL {
    0%, 88%, 100% { transform: rotate(0deg); }
    92% { transform: rotate(-10deg); }
    96% { transform: rotate(4deg); }
  }
  @keyframes earTwitchR {
    0%, 75%, 100% { transform: rotate(0deg); }
    80% { transform: rotate(11deg); }
    84% { transform: rotate(-3deg); }
  }
  @keyframes foxJumpJoy {
    0% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-34px) scale(1.06, 0.95) rotate(-4deg); }
    50% { transform: translateY(0) scale(0.95, 1.05) rotate(4deg); }
    75% { transform: translateY(-22px) scale(1.04) rotate(-2deg); }
    100% { transform: translateY(0) scale(1) rotate(0); }
  }
  @keyframes foxSadShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-11px) rotate(-5deg); }
    40% { transform: translateX(11px) rotate(5deg); }
    60% { transform: translateX(-8px) rotate(-3deg); }
    80% { transform: translateX(8px) rotate(3deg); }
  }

  #fox-body-group {
    animation: foxBreathe 3.4s ease-in-out infinite;
    transform-origin: 130px 260px;
  }
  #fox-tail {
    animation: tailSway 3.8s ease-in-out infinite;
    transform-origin: 185px 255px;
  }
  #fox-ear-l {
    animation: earTwitchL 5.5s ease-in-out infinite;
    transform-origin: 92px 86px;
  }
  #fox-ear-r {
    animation: earTwitchR 4.7s ease-in-out infinite;
    transform-origin: 168px 86px;
  }

  .fox-happy {
    animation: foxJumpJoy 0.85s cubic-bezier(0.25, 1, 0.5, 1) 2;
  }
  .fox-upset {
    animation: foxSadShake 0.6s ease-in-out 1;
  }

  /* Нижня зона: дерев'яна різьблена дошка з великим реченням та клавіатурою */
  .sentence-board {
    position: relative;
    z-index: 15;
    width: 100%;
    max-width: 1240px;
    border-radius: 30px;
    padding: 2vh 2.5vw 2.2vh 2.5vw;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(125, 78, 39, 0.96) 0%, rgba(73, 41, 18, 0.98) 65%, rgba(46, 24, 9, 1) 100%);
    border: 3px solid #c9923e;
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.75),
      inset 0 3px 8px rgba(255, 223, 158, 0.38),
      inset 0 -6px 14px rgba(18, 8, 2, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.8vh;
  }

  /* Декоративна текстура дерева через внутрішній градієнтний орнамент */
  .sentence-board::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 23px;
    border: 1.5px solid rgba(236, 190, 114, 0.28);
    background: repeating-linear-gradient(
      90deg,
      rgba(255, 210, 140, 0.02) 0px,
      rgba(255, 210, 140, 0.02) 18px,
      rgba(20, 8, 0, 0.04) 18px,
      rgba(20, 8, 0, 0.04) 36px
    );
    pointer-events: none;
  }

  /* Текст речення - крупний, контрастний, теплий пергаментно-золотий відтінок */
  .sentence-text {
    position: relative;
    z-index: 2;
    font-size: clamp(1.45rem, 2.55vw, 2.35rem);
    line-height: 1.48;
    color: #fff0d1;
    text-align: center;
    text-shadow: 0 3px 6px rgba(0, 0, 0, 0.85), 0 0 12px rgba(236, 175, 75, 0.2);
    font-weight: 700;
    max-width: 1150px;
  }

  /* Інтерактивне поле для вписування слова всередині речення (бурштиново-дерев'яна плашка) */
  .word-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 230px;
    min-height: 54px;
    padding: 4px 20px;
    margin: 0 6px;
    vertical-align: middle;
    border-radius: 16px;
    background: linear-gradient(180deg, #241307 0%, #381e0b 55%, #2b1607 100%);
    border: 2.5px solid #e6aa49;
    box-shadow:
      inset 0 4px 9px rgba(0, 0, 0, 0.88),
      0 2px 10px rgba(242, 181, 75, 0.32);
    color: #ffd875;
    font-size: clamp(1.5rem, 2.6vw, 2.4rem);
    letter-spacing: 3px;
    text-transform: lowercase;
    position: relative;
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .word-slot.correct-glow {
    background: linear-gradient(180deg, #1b4319 0%, #2b6625 100%);
    border-color: #8df56c;
    color: #e9ffdb;
    box-shadow:
      0 0 24px rgba(124, 247, 89, 0.8),
      inset 0 2px 8px rgba(255, 255, 255, 0.3);
    transform: scale(1.06);
  }

  .word-slot.error-glow {
    background: linear-gradient(180deg, #591616 0%, #7d2020 100%);
    border-color: #ff6b6b;
    color: #ffdada;
    box-shadow: 0 0 22px rgba(255, 77, 77, 0.85);
    animation: slotShake 0.45s ease;
  }

  @keyframes slotShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* Золотий курсор-перо всередині плашки */
  .cursor-nib {
    display: inline-block;
    width: 3px;
    height: 1.15em;
    background: #ffcf5c;
    margin-left: 4px;
    border-radius: 2px;
    box-shadow: 0 0 8px #ffcf5c;
    animation: blinkNib 1s steps(2, start) infinite;
  }

  @keyframes blinkNib {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Панель літер-плиток та кнопок стирання / перевірки */
  .letters-deck {
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    max-width: 1120px;
  }

  /* Тактильна різьблена дерев'яна плитка з літерою */
  .letter-tile {
    height: 54px;
    min-width: 52px;
    padding: 0 14px;
    border-radius: 14px;
    border: 2px solid #d89b43;
    background:
      radial-gradient(circle at 35% 25%, #8f5b2d 0%, #5c3616 68%, #3d210b 100%);
    box-shadow:
      0 5px 0 #261305,
      0 8px 14px rgba(0, 0, 0, 0.55),
      inset 0 2px 3px rgba(255, 228, 176, 0.5);
    color: #fff1d4;
    font-family: 'Georgia', serif;
    font-size: 1.55rem;
    font-weight: 700;
    text-transform: lowercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.12s ease;
  }

  .letter-tile:hover {
    transform: translateY(-3px);
    filter: brightness(1.15);
    border-color: #f7c36a;
  }

  .letter-tile:active {
    transform: translateY(3px);
    box-shadow:
      0 2px 0 #261305,
      0 3px 6px rgba(0, 0, 0, 0.5),
      inset 0 2px 3px rgba(255, 228, 176, 0.4);
  }

  /* Службові кнопки (стерти та перевірити) */
  .action-tile {
    background: radial-gradient(circle at 35% 25%, #5f452e 0%, #3d2817 75%, #26170b 100%);
    border-color: #c28b42;
    padding: 0 18px;
  }

  .check-tile {
    background: radial-gradient(circle at 35% 25%, #3f6e33 0%, #264a1d 70%, #173011 100%);
    border-color: #8ad66c;
    box-shadow:
      0 5px 0 #0f210b,
      0 8px 14px rgba(0, 0, 0, 0.55),
      inset 0 2px 3px rgba(209, 255, 184, 0.45);
  }

  .action-tile svg, .check-tile svg {
    width: 26px;
    height: 26px;
    stroke: #fff1d4;
    stroke-width: 2.6;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Адаптивність для менших екранів */
  @media (max-width: 900px) {
    .middle-stage {
      flex-direction: column;
      gap: 1vh;
    }
    .art-frame {
      width: 84vw;
      height: 31vh;
    }
    .character-wrap {
      width: 140px;
      height: 150px;
    }
    .letter-tile {
      height: 46px;
      min-width: 44px;
      font-size: 1.3rem;
    }
  }
</style>
</head>
<body>

<div id="game-stage">
  <!-- Живий деталізований лісовий та озерний фон на світанку -->
  <svg id="bg-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт ранкового неба -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1d3549"/>
        <stop offset="32%" stop-color="#3c6270"/>
        <stop offset="62%" stop-color="#88876d"/>
        <stop offset="85%" stop-color="#df9e62"/>
        <stop offset="100%" stop-color="#f7c97e"/>
      </linearGradient>
      <!-- Сонячне сяйво -->
      <radialGradient id="sunGlow" cx="72%" cy="48%" r="42%">
        <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.95"/>
        <stop offset="22%" stop-color="#ffd27d" stop-opacity="0.65"/>
        <stop offset="55%" stop-color="#eb9853" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#eb9853" stop-opacity="0"/>
      </radialGradient>
      <!-- Градієнт далеких гір -->
      <linearGradient id="mountFar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4e5d6c"/>
        <stop offset="100%" stop-color="#87786a"/>
      </linearGradient>
      <!-- Градієнт ближнього хвойного лісу -->
      <linearGradient id="forestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2c4939"/>
        <stop offset="100%" stop-color="#17291f"/>
      </linearGradient>
      <!-- Градієнт озера -->
      <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#d4935c"/>
        <stop offset="30%" stop-color="#6e7c6e"/>
        <stop offset="70%" stop-color="#2e4c49"/>
        <stop offset="100%" stop-color="#182b29"/>
      </linearGradient>
      <!-- Градієнт соковитої галявини на передньому плані -->
      <linearGradient id="meadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#385b28"/>
        <stop offset="45%" stop-color="#243f19"/>
        <stop offset="100%" stop-color="#12210b"/>
      </linearGradient>
      <!-- Градієнт стовбура дуба -->
      <linearGradient id="oakBark" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#26170c"/>
        <stop offset="45%" stop-color="#472c18"/>
        <stop offset="80%" stop-color="#5e3a20"/>
        <stop offset="100%" stop-color="#2e1b0e"/>
      </linearGradient>
    </defs>

    <!-- Небо та сонячний ореол -->
    <rect width="1600" height="900" fill="url(#skyGrad)"/>
    <circle cx="1150" cy="430" r="520" fill="url(#sunGlow)"/>
    <circle cx="1150" cy="410" r="68" fill="#fff6cf" opacity="0.9"/>

    <!-- Рухомі ранкові хмари -->
    <g opacity="0.55">
      <path d="M180,170 Q230,135 290,155 Q340,125 400,155 Q450,150 470,180 Q410,198 180,185 Z" fill="#f7d399">
        <animateTransform attributeName="transform" type="translate" values="0,0; 90,0; 0,0" dur="38s" repeatCount="indefinite"/>
      </path>
      <path d="M880,120 Q940,85 1010,110 Q1075,85 1130,120 Q1175,125 1190,150 Q1040,165 880,145 Z" fill="#fae2b4">
        <animateTransform attributeName="transform" type="translate" values="0,0; -80,0; 0,0" dur="44s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Далекі гірські хребти -->
    <path d="M0,470 L180,330 L340,410 L550,275 L760,395 L960,305 L1140,390 L1350,285 L1600,380 L1600,520 L0,520 Z" fill="url(#mountFar)" opacity="0.75"/>
    <path d="M0,490 L240,385 L450,440 L680,350 L890,435 L1220,375 L1440,420 L1600,390 L1600,540 L0,540 Z" fill="#3a4e48" opacity="0.85"/>

    <!-- Силуети смерек та сосен біля озера -->
    <path d="M0,515 L30,440 L55,505 L85,425 L115,505 L145,450 L175,510 L210,435 L240,510 L290,460 L330,515 L600,515 L630,455 L660,515 L1280,515 L1315,435 L1345,510 L1385,420 L1420,510 L1460,440 L1500,512 L1545,430 L1600,515 Z" fill="url(#forestGrad)"/>

    <!-- Спокійне лісове озеро з сонячною доріжкою -->
    <rect x="0" y="512" width="1600" height="175" fill="url(#lakeGrad)"/>
    <g opacity="0.65">
      <ellipse cx="1150" cy="535" rx="95" ry="5" fill="#ffebad">
        <animate attributeName="rx" values="95;112;95" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1150" cy="558" rx="75" ry="4" fill="#ffe194">
        <animate attributeName="rx" values="75;62;75" dur="3.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1150" cy="582" rx="52" ry="3.5" fill="#ffd278">
        <animate attributeName="rx" values="52;65;52" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Передня лісова галявина з травою та квітами -->
    <path d="M0,645 Q380,605 820,638 Q1240,670 1600,620 L1600,900 L0,900 Z" fill="url(#meadowGrad)"/>

    <!-- Могутній гіллястий дуб зліва -->
    <path d="M-30,900 L-20,0 L125,0 Q105,260 118,520 Q135,720 210,850 L95,900 Z" fill="url(#oakBark)"/>
    <path d="M90,180 Q260,150 390,90 Q280,210 105,245 Z" fill="#3b2312"/>
    <!-- Пишне дубове листя у верхніх кутах -->
    <g fill="#26471e" opacity="0.95">
      <circle cx="70" cy="60" r="110"/>
      <circle cx="210" cy="45" r="95"/>
      <circle cx="330" cy="65" r="80"/>
      <circle cx="150" cy="135" r="85"/>
      <circle cx="1520" cy="55" r="115"/>
      <circle cx="1390" cy="40" r="90"/>
    </g>
    <g fill="#3f6b29" opacity="0.8">
      <circle cx="110" cy="85" r="75"/>
      <circle cx="250" cy="70" r="68"/>
      <circle cx="1460" cy="75" r="72"/>
    </g>

    <!-- Живі стебла трави та очерету, що коливаються на вітрі -->
    <g stroke="#4c7c2f" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M180,890 Q195,780 225,710">
        <animate attributeName="d" values="M180,890 Q195,780 225,710; M180,890 Q210,785 245,720; M180,890 Q195,780 225,710" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M210,890 Q200,790 175,725" stroke="#396120">
        <animate attributeName="d" values="M210,890 Q200,790 175,725; M210,890 Q215,790 195,725; M210,890 Q200,790 175,725" dur="4.4s" repeatCount="indefinite"/>
      </path>
      <path d="M1420,890 Q1400,780 1365,700">
        <animate attributeName="d" values="M1420,890 Q1400,780 1365,700; M1420,890 Q1385,785 1345,710; M1420,890 Q1400,780 1365,700" dur="5.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Сонячний пилок / світлячки у повітрі -->
    <g fill="#fff2a6" opacity="0.75">

  /* ============================================================================
     СТАН ГРИ ТА ЗВУКОВИЙ РУШІЙ (Web Audio API — багаті музичні звуки без слів)

  let currentIndex = 0;

  let audioCtx = null;

  // Ініціалізація аудіоконтексту при першому кліку або натисканні клавіші
  function getAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // М'який дерев'яний клік при натисканні плитки з літерою
  function playTileClick(freqOffset = 0) {
    try {
      const ctx = getAudio();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320 + freqOffset, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.065);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    } catch (e) {}
  }

  // Яскравий переливчастий арфовий акорд при правильній відповіді
  function playSuccessSymphony() {
    try {
      const ctx = getAudio();
      const now = ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc2.type = 'triangle';
        const start = now + idx * 0.075;
        osc.frequency.setValueAtTime(freq, start);
        osc2.frequency.setValueAtTime(freq * 1.5, start);
        gain.gain.setValueAtTime(0.001, start);
        gain.gain.linearRampToValueAtTime(0.22, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.55);
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc2.start(start);
        osc.stop(start + 0.56);
        osc2.stop(start + 0.56);
      });
    } catch (e) {}
  }

  // Комічний пружний звук при помилці (наприклад, спробі написати з 'Ь')
  function playErrorBoing() {
    try {
      const ctx = getAudio();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.linearRampToValueAtTime(155, now + 0.16);
      osc.frequency.linearRampToValueAtTime(195, now + 0.28);
      osc.frequency.linearRampToValueAtTime(115, now + 0.45);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.47);
    } catch (e) {}
  }

  /* ============================================================================
     СИСТЕМА ЧАСТИНОК (Салют із золотих іскор, жолудів та смарагдового листя)
     ============================================================================ */
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function triggerCelebrationParticles() {
    const cx = window.innerWidth * 0.5;
    const cy = window.innerHeight * 0.55;
    const palette = ['#ffd43b', '#ff922b', '#69db7c', '#fff3bf', '#f06595', '#4dabf7'];
    for (let i = 0; i < 85; i++) {
      const angle = (Math.PI * 2 * i) / 85 + (Math.random() - 0.5) * 0.3;
      const speed = 4 + Math.random() * 11;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.5,
        size: 6 + Math.random() * 8,
        color: palette[Math.floor(Math.random() * palette.length)],
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.22,
        life: 1,
        shape: i % 3 // 0 - зірка, 1 - листок, 2 - золота іскра
      });
    }
  }

  function animateParticles() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.24; // гравітація
      p.rot += p.vRot;
      p.life -= 0.014;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.fillStyle = p.color;

      if (p.shape === 0) {
        // Чотирикутна іскра
        fxCtx.beginPath();
        for (let j = 0; j < 4; j++) {
          fxCtx.lineTo(Math.cos((j * Math.PI) / 2) * p.size, Math.sin((j * Math.PI) / 2) * p.size);
          fxCtx.lineTo(
            Math.cos(((j + 0.5) * Math.PI) / 2) * (p.size * 0.38),
            Math.sin(((j + 0.5) * Math.PI) / 2) * (p.size * 0.38)
          );
        }
        fxCtx.closePath();
        fxCtx.fill();
      } else if (p.shape === 1) {
        // Лісовий листочок
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
        fxCtx.fill();
      } else {
        // Золота кулька світлячка
        fxCtx.beginPath();
        fxCtx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  /* ============================================================================
     ВІДМАЛЬОВКА СЛАЙДУ, РЕЧЕННЯ ТА ТАКТИЛЬНОЇ КЛАВІАТУРИ
     ============================================================================ */
  const illustrationEl = document.getElementById('slide-illustration');
  const sentenceContainer = document.getElementById('sentence-container');
  const lettersDeck = document.getElementById('letters-deck');
  const btnLang = document.getElementById('btn-lang');

  // Генерація набору літер для поточного слова + обов'язкова пастка 'ь'
  function buildLetterBank(targetWord) {
    const uniqueChars = Array.from(new Set(targetWord.toLowerCase().split('')));
    // Обов'язково додаємо м'який знак 'ь', щоб перевірити знання правила "пиши без ь"
    if (!uniqueChars.includes('ь')) {
      uniqueChars.push('ь');
    }
    // Додаємо декілька додаткових літер для уважності
    const extras = currentLang === 'ru'
      ? ['а', 'о', 'е', 'и', 'к', 'н', 'ч', 'щ', 'т']
      : ['а', 'о', 'е', 'и', 'і', 'к', 'н', 'ч', 'щ', 'т'];

    for (const ch of extras) {
      if (uniqueChars.length >= 11) break;
      if (!uniqueChars.includes(ch)) uniqueChars.push(ch);
    }

    // Перемішуємо літери алгоритмом Фішера-Єйтса
    for (let i = uniqueChars.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [uniqueChars[i], uniqueChars[j]] = [uniqueChars[j], uniqueChars[i]];
    }
    return uniqueChars;
  }

  // Оновлення відображення вписаного слова всередині речення
  function updateWordSlotText() {
    const slot = document.getElementById('active-word-slot');
    if (!slot) return;
    slot.innerHTML = `<span>${userTyped}</span><span class="cursor-nib"></span>`;
  }

  // Перевірка введеного слова
  function verifyAnswer() {
    if (isLocked) return;
    const slideData = SLIDES[currentIndex][currentLang];
    const cleanInput = userTyped.trim().toLowerCase();
    const slot = document.getElementById('active-word-slot');

    if (!cleanInput) {
      playErrorBoing();
      slot.classList.add('error-glow');
      setFoxMood('upset');
      setTimeout(() => {
        slot.classList.remove('error-glow');
        setFoxMood('neutral');
      }, 650);
      return;
    }

    if (slideData.accepted.includes(cleanInput)) {
      isLocked = true;
      slot.classList.remove('error-glow');
      slot.classList.add('correct-glow');
      slot.innerHTML = `<span>${cleanInput}</span>`;
      playSuccessSymphony();
      setFoxMood('happy');
      triggerCelebrationParticles();

      // Автоматичний плавний перехід до наступного слайду після святкування
      setTimeout(() => {
        if (isLocked) {
          goToSlide((currentIndex + 1) % SLIDES.length);
        }
      }, 1900);
    } else {
      playErrorBoing();
      slot.classList.add('error-glow');
      setFoxMood('upset');
      setTimeout(() => {
        slot.classList.remove('error-glow');
        setFoxMood('neutral');
      }, 650);
    }
  }

  // Рендер активного слайду
  function renderSlide() {
    isLocked = false;
    userTyped = '';
    setFoxMood('neutral');

    const slide = SLIDES[currentIndex];
    const langData = slide[currentLang];

    // Малюємо деталізовану SVG-ілюстрацію слайду
    illustrationEl.innerHTML = slide.renderSVG();

    // Формуємо речення з інтерактивною плашкою для слова
    sentenceContainer.innerHTML = `
      <span>${langData.before}</span><span class="word-slot" id="active-word-slot"><span></span><span class="cursor-nib"></span></span><span>${langData.after}</span>
    `;

    // Створюємо тактильні дерев'яні плитки літер
    lettersDeck.innerHTML = '';
    const letters = buildLetterBank(langData.answer);

    letters.forEach((letter, idx) => {
      const btn = document.createElement('button');
      btn.className = 'letter-tile';
      btn.textContent = letter;
      btn.addEventListener('click', () => {
        if (isLocked) return;
        if (userTyped.length < 16) {
          userTyped += letter;
          playTileClick(idx * 14);
          setFoxMood('curious');
          updateWordSlotText();
        }
      });
      lettersDeck.appendChild(btn);
    });

    // Кнопка стирання останньої літери (Backspace)
    const backBtn = document.createElement('button');
    backBtn.className = 'letter-tile action-tile';
    backBtn.setAttribute('aria-label', 'Backspace');
    backBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>`;
    backBtn.addEventListener('click', () => {
      if (isLocked) return;
      if (userTyped.length > 0) {
        userTyped = userTyped.slice(0, -1);
        playTileClick(-60);
        updateWordSlotText();
      }
    });
    lettersDeck.appendChild(backBtn);

    // Кнопка перевірки (галочка без слів)
    const checkBtn = document.createElement('button');
    checkBtn.className = 'letter-tile check-tile';
    checkBtn.setAttribute('aria-label', 'Check');
    checkBtn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
    checkBtn.addEventListener('click', verifyAnswer);
    lettersDeck.appendChild(checkBtn);
  }

  function goToSlide(newIdx) {
    currentIndex = (newIdx + SLIDES.length) % SLIDES.length;
    renderSlide();
  }

  /* ============================================================================
     ОБРОБНИКИ КНОПОК НАВІГАЦІЇ, ПЕРЕМИКАННЯ МОВИ ТА ФІЗИЧНОЇ КЛАВІАТУРИ
     ============================================================================ */
  document.getElementById('btn-prev').addEventListener('click', () => {
    playTileClick(-40);
    goToSlide(currentIndex - 1);
  });

  document.getElementById('btn-next').addEventListener('click', () => {
    playTileClick(40);
    goToSlide(currentIndex + 1);
  });

  // Єдина кнопка перемикання мови (РУС / УКР)
  btnLang.addEventListener('click', () => {
    playTileClick(80);
    currentLang = currentLang === 'ru' ? 'uk' : 'ru';
    btnLang.textContent = currentLang === 'ru' ? 'РУС' : 'УКР';
    renderSlide();
  });

  // Підтримка введення слова з фізичної клавіатури комп'ютера
  window.addEventListener('keydown', (e) => {
    if (isLocked) return;
    if (e.key === 'Backspace') {
      e.preventDefault();
      if (userTyped.length > 0) {
        userTyped = userTyped.slice(0, -1);
        playTileClick(-60);
        updateWordSlotText();
      }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      verifyAnswer();
    } else if (e.key === 'ArrowRight') {
      goToSlide(currentIndex + 1);
    } else if (e.key === 'ArrowLeft') {
      goToSlide(currentIndex - 1);
    } else if (e.key.length === 1 && /^[а-яёіїєґ']/i.test(e.key)) {
      if (userTyped.length < 16) {
        userTyped += e.key.toLowerCase();
        playTileClick(30);
        setFoxMood('curious');
        updateWordSlotText();
      }
    }
  });

  // Перший запуск гри
  renderSlide();
</script>
</body>
</html>
