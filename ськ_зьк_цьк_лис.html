<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гірська експедиція</title>
<style>
  /* ================= ОСНОВНІ СТИЛІ ЕКРАНУ ================= */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', 'Palatino Linotype', serif;
    background: #0d1b24;
  }

  /* Контейнер гри на весь екран */
  #game-world {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* Фонова SVG-сцена */
  #scene-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  /* ================= АВТОМАТИЧНІ АНІМАЦІЇ ПРИРОДИ ================= */
  @keyframes cloudDrift1 {
    0% { transform: translateX(-100px); }
    50% { transform: translateX(120px); }
    100% { transform: translateX(-100px); }
  }
  @keyframes cloudDrift2 {
    0% { transform: translateX(80px); }
    50% { transform: translateX(-140px); }
    100% { transform: translateX(80px); }
  }
  @keyframes treeSway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(1.6deg); }
  }
  @keyframes waterFlow {
    0% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -120; }
  }
  @keyframes wheelSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes lanternSwing {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes fireflyFloat {
    0%, 100% { transform: translate(0, 0) scale(0.8); opacity: 0.3; }
    50% { transform: translate(15px, -25px) scale(1.3); opacity: 1; }
  }

  .cloud-1 { animation: cloudDrift1 70s ease-in-out infinite; }
  .cloud-2 { animation: cloudDrift2 95s ease-in-out infinite; }
  .sway-tree { transform-origin: bottom center; animation: treeSway 6s ease-in-out infinite; }
  .sway-tree-slow { transform-origin: bottom center; animation: treeSway 8.5s ease-in-out infinite reverse; }
  .water-stream { stroke-dasharray: 25 35; animation: waterFlow 1.8s linear infinite; }
  .water-stream-fast { stroke-dasharray: 18 22; animation: waterFlow 1.1s linear infinite; }
  #mill-wheel { transform-origin: 315px 510px; animation: wheelSpin 18s linear infinite; transition: animation-duration 0.5s; }
  #mill-wheel.turbo { animation: wheelSpin 2.2s linear infinite; }
  .hanging-lantern { transform-origin: top center; animation: lanternSwing 4.5s ease-in-out infinite; cursor: pointer; }
  .firefly { animation: fireflyFloat 4s ease-in-out infinite; }

  /* ================= АНІМАЦІЇ ЖИВОГО ПЕРСОНАЖА (ЛИСА) ================= */
  @keyframes foxBreathe {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50% { transform: scaleY(1.025) translateY(-2px); }
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes earTwitchL {
    0%, 88%, 100% { transform: rotate(0deg); }
    92% { transform: rotate(-12deg); }
    96% { transform: rotate(4deg); }
  }
  @keyframes earTwitchR {
    0%, 75%, 100% { transform: rotate(0deg); }
    80% { transform: rotate(14deg); }
    85% { transform: rotate(-3deg); }
  }
  @keyframes foxJumpWin {
    0%, 100% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-55px) rotate(-5deg) scale(1.05); }
    50% { transform: translateY(0) scale(0.95, 1.05); }
    75% { transform: translateY(-35px) rotate(5deg) scale(1.04); }
  }
  @keyframes foxDanceWin {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-18px) translateY(-15px) rotate(-8deg); }
    40% { transform: translateX(18px) translateY(-20px) rotate(8deg); }
    60% { transform: translateX(-15px) translateY(-12px) rotate(-6deg); }
    80% { transform: translateX(15px) translateY(-15px) rotate(6deg); }
  }
  @keyframes foxSadShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px) rotate(-4deg); }
    40% { transform: translateX(10px) rotate(4deg); }
    60% { transform: translateX(-8px) rotate(-3deg); }
    80% { transform: translateX(8px) rotate(3deg); }
  }

  #fox-character {
    cursor: pointer;
    transform-origin: 1420px 830px;
    transition: transform 0.3s ease;
  }
  #fox-torso-group {
    transform-origin: 1420px 760px;
    animation: foxBreathe 3.2s ease-in-out infinite;
  }
  #fox-tail {
    transform-origin: 1490px 790px;
    animation: tailWag 3.6s ease-in-out infinite;
  }
  #fox-ear-left {
    transform-origin: 1385px 605px;
    animation: earTwitchL 5s infinite;
  }
  #fox-ear-right {
    transform-origin: 1455px 605px;
    animation: earTwitchR 6.5s infinite;
  }
  #fox-head {
    transform-origin: 1420px 655px;
    transition: transform 0.25s ease-out;
  }

  /* Класи активних емоцій персонажа */
  .fox-win-jump { animation: foxJumpWin 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 2; }
  .fox-win-dance { animation: foxDanceWin 1.1s ease-in-out 2; }
  .fox-error-shake #fox-head { animation: foxSadShake 0.6s ease-in-out 1; }
  .fox-error-shake #fox-ear-left { transform: rotate(-28deg) !important; transition: 0.2s; }
  .fox-error-shake #fox-ear-right { transform: rotate(28deg) !important; transition: 0.2s; }
  .fox-error-shake #fox-tail { transform: rotate(-22deg) !important; transition: 0.3s; }

  /* ================= ДЕРЕВ'ЯНА ДОШКА ЗАВДАННЯ (БЕЗ БІЛИХ ПРЯМОКУТНИКІВ) ================= */
  #task-board-wrapper {
    position: absolute;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 980px);
    z-index: 10;
    transform-origin: top center;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes boardSwingError {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    20% { transform: translateX(-52%) rotate(-2.5deg); }
    40% { transform: translateX(-48%) rotate(2.5deg); }
    60% { transform: translateX(-51%) rotate(-1.5deg); }
    80% { transform: translateX(-49%) rotate(1.5deg); }
  }

  .board-error {
    animation: boardSwingError 0.55s ease-in-out;
  }

  /* Різьблена дерев'яна основа дошки */
  #wooden-plaque {
    position: relative;
    padding: 36px 48px 40px 48px;
    border-radius: 28px;
    /* Багатошарова текстура темного різьбленого дуба та бронзи */
    background: 
      radial-gradient(circle at 15% 20%, rgba(255, 195, 110, 0.14), transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(212, 122, 42, 0.16), transparent 55%),
      repeating-linear-gradient(
        8deg,
        #3d2314 0px,
        #4a2c18 14px,
        #361e10 28px,
        #4e2f1b 42px
      );
    border: 6px solid #261409;
    box-shadow: 
      0 22px 45px rgba(0, 0, 0, 0.75),
      inset 0 4px 12px rgba(255, 210, 145, 0.35),
      inset 0 -8px 18px rgba(15, 7, 2, 0.9),
      0 0 0 3px #8c6239;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* Декоративний внутрішній орнамент бронзової рамки */
  #wooden-plaque::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px dashed rgba(218, 165, 92, 0.45);
    border-radius: 20px;
    pointer-events: none;
  }

  /* Металеві ланцюги підвісу дошки */
  .chain-left, .chain-right {
    position: absolute;
    top: -45px;
    width: 18px;
    height: 55px;
    background: repeating-linear-gradient(
      to bottom,
      #5c646d 0px,
      #2b3036 8px,
      #8b95a1 12px,
      #23272c 18px
    );
    border-radius: 8px;
    border: 2px solid #181a1d;
    box-shadow: 3px 5px 10px rgba(0,0,0,0.7);
    z-index: -1;
  }
  .chain-left { left: 12%; }
  .chain-right { right: 12%; }

  /* Кутові ковані накладки */
  .brass-corner {
    position: absolute;
    width: 28px;
    height: 28px;
    background: radial-gradient(circle at 35% 35%, #ffd984, #a66c1e 65%, #593508 100%);
    border: 2px solid #3b2204;
    border-radius: 50%;
    box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.6);
  }
  .brass-corner.tl { top: 12px; left: 12px; }
  .brass-corner.tr { top: 12px; right: 12px; }
  .brass-corner.bl { bottom: 12px; left: 12px; }
  .brass-corner.br { bottom: 12px; right: 12px; }

  /* Текст речення на дерев'яній дошці */
  #sentence-container {
    font-size: clamp(1.35rem, 2.5vw, 2.05rem);
    line-height: 1.75;
    color: #ffefd5;
    text-shadow: 0 3px 5px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 183, 77, 0.25);
    text-align: center;
    font-weight: bold;
    letter-spacing: 0.5px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 2;
  }

  /* Латунна табличка-підказка з іменником у дужках */
  .base-word-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 16px;
    border-radius: 18px;
    background: linear-gradient(145deg, #c98a32, #825010 55%, #5c3606);
    border: 2px solid #f7cf86;
    box-shadow: 
      0 4px 8px rgba(0,0,0,0.6),
      inset 0 2px 4px rgba(255, 240, 195, 0.6);
    color: #fff6dc;
    font-size: 0.92em;
    font-style: italic;
    text-shadow: 0 2px 3px rgba(0,0,0,0.85);
    transform: translateY(-2px);
  }

  /* Блок введення слова + кнопка перевірки */
  .input-mechanism {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, #1f1209 0%, #2d1b0e 100%);
    padding: 6px 10px 6px 16px;
    border-radius: 20px;
    border: 3px solid #9e6b30;
    box-shadow: 
      inset 0 5px 12px rgba(0,0,0,0.95),
      0 3px 10px rgba(0,0,0,0.6),
      0 0 15px rgba(255, 184, 77, 0.15);
    position: relative;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .input-mechanism:focus-within {
    border-color: #ffca63;
    box-shadow: 
      inset 0 5px 12px rgba(0,0,0,0.95),
      0 0 22px rgba(255, 196, 82, 0.55);
  }

  .input-mechanism.correct-glow {
    border-color: #5eff86;
    box-shadow: 
      inset 0 4px 12px rgba(0,0,0,0.8),
      0 0 30px rgba(94, 255, 134, 0.85);
  }

  .input-mechanism.error-glow {
    border-color: #ff4747;
    box-shadow: 
      inset 0 4px 12px rgba(0,0,0,0.8),
      0 0 30px rgba(255, 71, 71, 0.85);
  }

  /* Поле введення прикметника (темний гравірований сланець/мідь) */
  #word-input {
    background: transparent;
    border: none;
    outline: none;
    color: #ffd875;
    font-family: 'Georgia', serif;
    font-size: clamp(1.3rem, 2.3vw, 1.95rem);
    font-weight: bold;
    width: 230px;
    text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255, 200, 80, 0.5);
    border-bottom: 2px dotted rgba(255, 204, 112, 0.5);
    padding-bottom: 2px;
  }

  /* Механічна кнопка підтвердження відповіді (шестерня з галочкою, без слів) */
  #check-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid #ffe094;
    background: radial-gradient(circle at 30% 30%, #f5b942, #a86411 70%, #633603);
    box-shadow: 0 4px 10px rgba(0,0,0,0.65), inset 0 2px 4px rgba(255,255,255,0.6);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, filter 0.2s;
  }

  #check-btn:hover {
    transform: scale(1.1) rotate(12deg);
    filter: brightness(1.15);
  }

  #check-btn:active {
    transform: scale(0.92);
  }

  /* ================= МІНІМАЛІСТИЧНІ КНОПКИ НАВІГАЦІЇ (НАЗАД / ДАЛІ) ================= */
  .nav-btn {
    position: absolute;
    top: 32px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 25;
    background: radial-gradient(circle at 35% 30%, #7d522b, #3d220e 70%, #211105);
    border: 3px solid #c99349;
    box-shadow: 
      0 8px 20px rgba(0,0,0,0.75),
      inset 0 2px 6px rgba(255, 219, 158, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
  }

  .nav-btn:hover {
    transform: scale(1.12);
    filter: brightness(1.2);
  }

  .nav-btn:active {
    transform: scale(0.92);
  }

  #prev-btn { left: 28px; }
  #next-btn { right: 28px; }

  .nav-btn svg {
    width: 32px;
    height: 32px;
    fill: #ffe299;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));
  }

  /* ================= СПЕЦЕФЕКТИ ЗВОРОТНОГО ЗВ'ЯЗКУ ================= */
  #fx-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    overflow: hidden;
  }

  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot)); opacity: 0; }
  }

  .fx-particle {
    position: absolute;
    pointer-events: none;
    animation: particleFly 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Веселка над водоспадом при одному з видів виграшу */
  #rainbow-arc {
    opacity: 0;
    transition: opacity 1s ease;
  }
  #rainbow-arc.visible {
    opacity: 0.75;
  }

  /* Кришка старовинної скрині зі скарбами */
  #chest-lid {
    transform-origin: 830px 790px;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #chest-glow {
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .chest-open #chest-lid {
    transform: translateY(-28px) rotate(-18deg);
  }
  .chest-open #chest-glow {
    opacity: 1;
  }
</style>
</head>
<body>

<div id="game-world">

  <!-- МІНІМАЛІСТИЧНА КНОПКА "НАЗАД" (ПОПЕРЕДНІЙ РІВЕНЬ) -->
  <button id="prev-btn" class="nav-btn" aria-label="Попередній рівень">
    <svg viewBox="0 0 24 24">
      <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
    </svg>
  </button>

  <!-- МІНІМАЛІСТИЧНА КНОПКА "ДАЛІ" (МИТТЄВИЙ ПЕРЕХІД НА НАСТУПНИЙ РІВЕНЬ) -->
  <button id="next-btn" class="nav-btn" aria-label="Наступний рівень">
    <svg viewBox="0 0 24 24">
      <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
    </svg>
  </button>

  <!-- РІЗЬБЛЕНА ДЕРЕВ'ЯНА ДОШКА ІЗ ЗАВДАННЯМ -->
  <div id="task-board-wrapper">
    <div class="chain-left"></div>
    <div class="chain-right"></div>
    <div id="wooden-plaque">
      <div class="brass-corner tl"></div>
      <div class="brass-corner tr"></div>
      <div class="brass-corner bl"></div>
      <div class="brass-corner br"></div>

      <!-- Контейнер, куди підставляється поточне речення -->
      <div id="sentence-container"></div>
    </div>
  </div>

  <!-- ШАР АКТИВНИХ ЧАСТИНОК ТА ФІДБЕКІВ -->
  <div id="fx-layer"></div>

  <!-- ДЕТАЛІЗОВАНА РЕАЛІСТИЧНА ІНТЕРАКТИВНА SVG-СЦЕНА -->
  <svg id="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнти неба, гір, води, дерева та хутра лиса -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#13293d"/>
        <stop offset="38%" stop-color="#2c5364"/>
        <stop offset="72%" stop-color="#c97b53"/>
        <stop offset="100%" stop-color="#f5b971"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx="65%" cy="42%" r="35%">
        <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.95"/>
        <stop offset="35%" stop-color="#ffae52" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#ffae52" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="farMountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3c4f65"/>
        <stop offset="100%" stop-color="#76687a"/>
      </linearGradient>

      <linearGradient id="midMountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#253b47"/>
        <stop offset="100%" stop-color="#485d54"/>
      </linearGradient>

      <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#7ce8ff"/>
        <stop offset="40%" stop-color="#2ca6c9"/>
        <stop offset="100%" stop-color="#0e4966"/>
      </linearGradient>

      <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#104e6b"/>
        <stop offset="45%" stop-color="#2ca8c9"/>
        <stop offset="100%" stop-color="#0b364d"/>
      </linearGradient>

      <linearGradient id="pineDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e4631"/>
        <stop offset="100%" stop-color="#0b2116"/>
      </linearGradient>

      <linearGradient id="pineLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#356e46"/>
        <stop offset="100%" stop-color="#143320"/>
      </linearGradient>

      <linearGradient id="woodMillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6e4423"/>
        <stop offset="50%" stop-color="#4d2c14"/>
        <stop offset="100%" stop-color="#2b1708"/>
      </linearGradient>

      <!-- Хутро Лиса-дослідника -->
      <linearGradient id="foxFurMain" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f26b1d"/>
        <stop offset="55%" stop-color="#d14708"/>
        <stop offset="100%" stop-color="#8c2800"/>
      </linearGradient>

      <linearGradient id="foxFurLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff7e8"/>
        <stop offset="100%" stop-color="#e3cbb1"/>
      </linearGradient>

      <linearGradient id="leatherVest" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6b3e23"/>
        <stop offset="100%" stop-color="#381d0d"/>
      </linearGradient>

      <radialGradient id="lanternLight" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8b8" stop-opacity="1"/>
        <stop offset="45%" stop-color="#ffae2b" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#ff7700" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0.65"/>
        <stop offset="20%" stop-color="#ff9e2b" stop-opacity="0.65"/>
        <stop offset="40%" stop-color="#ffe83b" stop-opacity="0.65"/>
        <stop offset="60%" stop-color="#4aff65" stop-opacity="0.65"/>
        <stop offset="80%" stop-color="#3bc4ff" stop-opacity="0.65"/>
        <stop offset="100%" stop-color="#9d4aff" stop-opacity="0.65"/>
      </linearGradient>

      <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- 1. НЕБО ТА ЗАХІД СОНЦЯ -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>
    <circle cx="1250" cy="450" r="520" fill="url(#sunGlow)"/>
    <circle cx="1250" cy="450" r="78" fill="#ffefc2" opacity="0.85"/>

    <!-- Хмари -->

      baseNoun: "Прага",
      answer: "празький",
      after: "ліхтар освітлює дерев'яний міст."
    },
    {
      before: "Теплий",
      baseNoun: "товариш",
      answer: "товариський",
      after: "погляд підбадьорив дослідника."
    },
    {
      before: "Далекий",
      baseNoun: "Париж",
      answer: "паризький",
      after: "потяг вирушив у гірську подорож."
    }
  ];

  // Поточний індекс рівня
  let currentLevelIndex = 0;
  // Лічильник для чергування різних активних фідбеків
  let feedbackVariant = 0;

  /* =========================================================================
   * ЗВУКОВИЙ РУШІЙ (Web Audio API — синтез живих звуків без зовнішніх файлів)
   * ========================================================================= */
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Звук друку літери (дерев'яний клік + теплий маримбовий тон)
    playKeyClick(charIndex = 0) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      // Пентатонічна гама, щоб набір тексту звучав мелодійно
      const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
      const freq = notes[charIndex % notes.length];

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.05, now + 0.08);

      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    }

    // Звук перемикання рівня кнопками Далі / Назад
    playSwitch() {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(540, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // Різноманітні переможні звукові фідбеки (4 різні мелодії та тембри)
    playWinSound(variant) {
      this.init();
      const now = this.ctx.currentTime;

      if (variant === 0) {
        // 1. Кришталева арфа + передзвін скарбів
        const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        chord.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.07);
          gain.gain.setValueAtTime(0.22, now + i * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.65);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.07);
          osc.stop(now + i * 0.07 + 0.65);
        });
      } else if (variant === 1) {
        // 2. Карпатська сопілка + шум водяного колеса
        const melody = [587.33, 659.25, 783.99, 880.00, 783.99, 1046.50];
        melody.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.09);
          gain.gain.setValueAtTime(0.24, now + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.09);
          osc.stop(now + i * 0.09 + 0.35);
        });
      } else if (variant === 2) {
        // 3. Урочистий мідний ріг експедиції
        const brass = [392.00, 493.88, 587.33, 783.99];
        brass.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + i * 0.11);
          gain.gain.setValueAtTime(0.12, now + i * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.55);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.11);
          osc.stop(now + i * 0.11 + 0.55);
        });
      } else {
        // 4. Лісові дзвіночки та веселковий акорд
        const chimes = [659.25, 783.99, 987.77, 1174.66, 1318.51];
        chimes.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.2, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.7);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.7);
        });
      }
    }

    // Звук помилки (пружний низький дерев'яний звук без слів)
    playErrorSound() {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.linearRampToValueAtTime(115, now + 0.22);
      osc.frequency.linearRampToValueAtTime(145, now + 0.32);
      osc.frequency.linearRampToValueAtTime(95, now + 0.5);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.52);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.52);
    }
  }

  const sound = new SoundEngine();

  /* =========================================================================
   * КЕРУВАННЯ ЕМОЦІЯМИ ТА РУХАМИ ПЕРСОНАЖА (ЛИСА)
   * ========================================================================= */
  const foxChar = document.getElementById('fox-character');
  const foxPupils = document.getElementById('fox-pupils');
  const foxMouth = document.getElementById('fox-mouth');
  const browL = document.getElementById('brow-l');
  const browR = document.getElementById('brow-r');
  const eyelidL = document.getElementById('eyelid-l');
  const eyelidR = document.getElementById('eyelid-r');

  // Природне кліпання очима кожні кілька секунд
  setInterval(() => {
    eyelidL.setAttribute('ry', '17');
    eyelidR.setAttribute('ry', '17');
    setTimeout(() => {
      eyelidL.setAttribute('ry', '0');
      eyelidR.setAttribute('ry', '0');
    }, 150);
  }, 4200);

  // Реакція очей лиса під час набору літер
  function foxLookAtBoard(charCount) {
    const offsetX = Math.max(-5, Math.min(5, (charCount - 5) * 0.9));
    foxPupils.style.transform = `translate(${offsetX}px, -4px)`;
    // Зацікавлена усмішка під час письма
    foxMouth.setAttribute('d', 'M1408 688 Q1420 696 1432 688');
  }

  // Емоція радості персонажа
  function foxCelebrate(variant) {
    foxChar.classList.remove('fox-win-jump', 'fox-win-dance', 'fox-error-shake');
    void foxChar.offsetWidth; // скидання анімації

    // Широка щаслива усмішка та підняті брови
    foxMouth.setAttribute('d', 'M1402 684 Q1420 706 1438 684');
    browL.setAttribute('d', 'M1374 614 Q1390 606 1404 616');
    browR.setAttribute('d', 'M1436 616 Q1450 606 1466 614');
    foxPupils.style.transform = 'translate(0px, 0px)';

    if (variant % 2 === 0) {
      foxChar.classList.add('fox-win-jump');
    } else {
      foxChar.classList.add('fox-win-dance');
    }
  }

  // Емоція засмучення / подиву при помилці
  function foxReactError() {
    foxChar.classList.remove('fox-win-jump', 'fox-win-dance', 'fox-error-shake');
    void foxChar.offsetWidth;
    foxChar.classList.add('fox-error-shake');

    // Здивований рот та насуплені брови
    foxMouth.setAttribute('d', 'M1408 694 Q1420 682 1432 694');
    browL.setAttribute('d', 'M1374 624 Q1390 620 1404 614');
    browR.setAttribute('d', 'M1436 614 Q1450 620 1466 624');

    setTimeout(() => {
      foxChar.classList.remove('fox-error-shake');
      foxMouth.setAttribute('d', 'M1406 688 Q1420 698 1434 688');
      browL.setAttribute('d', 'M1374 620 Q1390 614 1404 622');
      browR.setAttribute('d', 'M1436 622 Q1450 614 1466 620');
    }, 1100);
  }

  /* =========================================================================
   * ГЕНЕРАТОР АКТИВНИХ ВІЗУАЛЬНИХ ФІДБЕКІВ (БЕЗ СЛІВ)
   * ========================================================================= */
  const fxLayer = document.getElementById('fx-layer');
  const chestGroup = document.getElementById('treasure-chest');
  const millWheel = document.getElementById('mill-wheel');
  const rainbowArc = document.getElementById('rainbow-arc');

  function spawnSVGParticles(originX, originY, count, type) {
    for (let i = 0; i < count; i++) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.setAttribute('viewBox', '0 0 32 32');
      el.style.width = '30px';
      el.style.height = '30px';
      el.style.left = `${originX}px`;
      el.style.top = `${originY}px`;
      el.classList.add('fx-particle');

      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const dist = 90 + Math.random() * 220;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist - 60;
      const rot = (Math.random() - 0.5) * 540;

      el.style.setProperty('--tx', `${tx}px`);
      el.style.setProperty('--ty', `${ty}px`);
      el.style.setProperty('--rot', `${rot}deg`);

      if (type === 'gems') {
        // Самоцвіти та золоті зірки зі скрині
        const colors = ['#ffd700', '#00f5d4', '#ff4d6d', '#ffee55'];
        const c = colors[i % colors.length];
        el.innerHTML = `<polygon points="16,2 28,16 16,30 4,16" fill="${c}" stroke="#fff" stroke-width="2"/>`;
      } else if (type === 'water') {
        // Бризки води та лісові листочки
        el.innerHTML = `<path d="M16 3 C24 15 26 22 16 29 C6 22 8 15 16 3 Z" fill="#6beeff" stroke="#ffffff" stroke-width="1.5"/>`;
      } else if (type === 'fireflies') {
        // Сяючі золоті світлячки
        el.innerHTML = `<circle cx="16" cy="16" r="10" fill="#fff775" stroke="#ff9900" stroke-width="3"/>`;
      } else if (type === 'error-sparks') {
        // Червоні іскри при помилці
        el.innerHTML = `<polygon points="16,4 22,26 10,26" fill="#ff4747"/>`;
      }

      fxLayer.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }
  }

  // Запуск сюжетної події в світі гри при правильній відповіді
  function triggerWorldCelebration() {
    const variant = feedbackVariant % 4;
    feedbackVariant++;

    sound.playWinSound(variant);
    foxCelebrate(variant);

    const inputRect = document.querySelector('.input-mechanism').getBoundingClientRect();
    const centerX = inputRect.left + inputRect.width / 2;
    const centerY = inputRect.top + inputRect.height / 2;

    if (variant === 0) {
      // Фідбек 1: Відкривається кована скриня зі скарбами та вилітають самоцвіти
      chestGroup.classList.add('chest-open');
      spawnSVGParticles(centerX, centerY, 22, 'gems');
      spawnSVGParticles(window.innerWidth * 0.47, window.innerHeight * 0.73, 26, 'gems');
      setTimeout(() => chestGroup.classList.remove('chest-open'), 1800);
    } else if (variant === 1) {
      // Фідбек 2: Водяне колесо млина крутиться на повну потужність із бризками води
      millWheel.classList.add('turbo');
      spawnSVGParticles(centerX, centerY, 22, 'water');
      spawnSVGParticles(window.innerWidth * 0.18, window.innerHeight * 0.48, 24, 'water');
      setTimeout(() => millWheel.classList.remove('turbo'), 2000);
    } else if (variant === 2) {
      // Фідбек 3: Ліхтарі спалахують і рій світлячків кружляє над табором
      spawnSVGParticles(centerX, centerY, 26, 'fireflies');
      spawnSVGParticles(window.innerWidth * 0.42, window.innerHeight * 0.6, 24, 'fireflies');
    } else {
      // Фідбек 4: Над водоспадом з'являється яскрава веселка
      rainbowArc.classList.add('visible');
      spawnSVGParticles(centerX, centerY, 24, 'gems');
      setTimeout(() => rainbowArc.classList.remove('visible'), 2200);
    }
  }

  /* =========================================================================
   * ВІДОБРАЖЕННЯ ПОТОЧНОГО РІВНЯ ТА ПЕРЕВІРКА ВІДПОВІДІ
   * ========================================================================= */
  const sentenceContainer = document.getElementById('sentence-container');
  const boardWrapper = document.getElementById('task-board-wrapper');

  function renderLevel(index) {
    const level = LEVELS[index];
    sentenceContainer.innerHTML = '';

    // Текст перед пропущеним словом
    if (level.before) {
      const spanBefore = document.createElement('span');
      spanBefore.textContent = level.before;
      sentenceContainer.appendChild(spanBefore);
    }

    // Латунна табличка з іменником, від якого треба утворити прикметник
    const badge = document.createElement('span');
    badge.className = 'base-word-badge';
    badge.textContent = `(${level.baseNoun})`;
    sentenceContainer.appendChild(badge);

    // Механізм введення слова + кнопка перевірки
    const mech = document.createElement('span');
    mech.className = 'input-mechanism';

    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'word-input';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.setAttribute('aria-label', 'Впиши прикметник');

    // Підлаштовуємо ширину поля під довжину очікуваного слова
    const charWidth = Math.max(11, level.answer.length + 2);
    input.style.width = `${charWidth}ch`;

    const checkBtn = document.createElement('button');
    checkBtn.id = 'check-btn';
    checkBtn.type = 'button';
    checkBtn.setAttribute('aria-label', 'Перевірити');
    checkBtn.innerHTML = `
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2b1603" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    `;

    mech.appendChild(input);
    mech.appendChild(checkBtn);
    sentenceContainer.appendChild(mech);

    // Текст після пропущеного слова
    if (level.after) {
      const spanAfter = document.createElement('span');
      spanAfter.textContent = level.after;
      sentenceContainer.appendChild(spanAfter);
    }

    // Обробники подій для поля введення
    input.addEventListener('input', () => {
      sound.playKeyClick(input.value.length);
      foxLookAtBoard(input.value.length);
      mech.classList.remove('error-glow');
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        verifyAnswer();
      }
    });

    checkBtn.addEventListener('click', verifyAnswer);

    // Автоматичний фокус на поле введення
    setTimeout(() => input.focus(), 80);
  }

  // Перевірка введеного слова
  function verifyAnswer() {
    const input = document.getElementById('word-input');
    const mech = document.querySelector('.input-mechanism');
    if (!input || !mech) return;

    // Очищуємо пробіли та переводимо в нижній регістр, замінюємо апострофи на єдиний стандарт
    const userValue = input.value.trim().toLowerCase().replace(/[`’']/g, "'");
    const targetAnswer = LEVELS[currentLevelIndex].answer.toLowerCase().replace(/[`’']/g, "'");

    if (userValue === targetAnswer) {
      // Правильна відповідь!
      mech.classList.remove('error-glow');
      mech.classList.add('correct-glow');
      input.disabled = true;

      triggerWorldCelebration();

      // Перехід на наступний рівень після завершення анімації радості
      setTimeout(() => {
        currentLevelIndex = (currentLevelIndex + 1) % LEVELS.length;
        renderLevel(currentLevelIndex);
      }, 1750);
    } else {
      // Неправильна відповідь — активний візуальний та звуковий фідбек без слів
      sound.playErrorSound();
      foxReactError();

      mech.classList.add('error-glow');
      boardWrapper.classList.remove('board-error');
      void boardWrapper.offsetWidth;
      boardWrapper.classList.add('board-error');

      const rect = mech.getBoundingClientRect();
      spawnSVGParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 12, 'error-sparks');

      input.focus();
    }
  }

  /* =========================================================================
   * НАВІГАЦІЯ КНОПКАМИ "НАЗАД" ТА "ДАЛІ" (БЕЗ ОБОВ'ЯЗКОВОГО ПРОХОДЖЕННЯ)
   * ========================================================================= */
  document.getElementById('prev-btn').addEventListener('click', () => {
    sound.playSwitch();
    currentLevelIndex = (currentLevelIndex - 1 + LEVELS.length) % LEVELS.length;
    renderLevel(currentLevelIndex);
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    sound.playSwitch();
    currentLevelIndex = (currentLevelIndex + 1) % LEVELS.length;
    renderLevel(currentLevelIndex);
  });

  /* =========================================================================
   * ДОДАТКОВІ ІНТЕРАКТИВНІ ОБ'ЄКТИ НА ФОНІ (ДЛЯ ДОСЛІДЖЕННЯ ДІТЬМИ)
   * ========================================================================= */
  // Натискання на Лиса викликає веселий стрибок
  foxChar.addEventListener('click', () => {
    sound.playWinSound(1);
    foxCelebrate(0);
  });

  // Натискання на водяне колесо прискорює його та розбризкує воду
  millWheel.addEventListener('click', (e) => {
    sound.playSwitch();
    millWheel.classList.add('turbo');
    spawnSVGParticles(e.clientX, e.clientY, 16, 'water');
    setTimeout(() => millWheel.classList.remove('turbo'), 1500);
  });

  // Натискання на скриню відкриває її з сяйвом
  chestGroup.addEventListener('click', (e) => {
    sound.playWinSound(0);
    chestGroup.classList.add('chest-open');
    spawnSVGParticles(e.clientX, e.clientY, 18, 'gems');
    setTimeout(() => chestGroup.classList.remove('chest-open'), 1500);
  });

  // Натискання на ліхтар випускає світлячків
  document.getElementById('camp-lantern').addEventListener('click', (e) => {
    sound.playSwitch();
    spawnSVGParticles(e.clientX, e.clientY, 16, 'fireflies');
  });

  // Запуск першого рівня при завантаженні
  renderLevel(currentLevelIndex);
</script>

</body>
