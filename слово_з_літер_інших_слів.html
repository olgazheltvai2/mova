<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розгадай слово: Пропущені літери</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0e0e0;
            transition: background-image 0.5s ease;
            user-select: none;
            overflow: hidden; /* Забороняємо прокрутку всього екрану */
        }

        #game-container {
            /* Максимально прозорий контейнер, як вимагалося */
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(2px);
            padding: 20px;
            border-radius: 20px;
            box-shadow: none; /* Прибрано тінь для повної прозорості */
            text-align: center;
            width: 98vw;
            height: 98vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Setup Screen */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: auto;
            width: 100%;
            max-width: 1000px;
        }

        #word-input {
            font-size: 36px;
            padding: 15px;
            width: 80%;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.6);
            /* Секретне поле вводу: невидимий текст та виділення */
            color: transparent; 
            caret-color: #000000;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #word-input::selection {
            color: transparent;
            background: transparent;
        }

        #word-input:focus {
            outline: none;
            border-color: #888;
        }

        #start-btn, #restart-btn {
            font-size: 28px;
            padding: 15px 40px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        #start-btn:hover, #restart-btn:hover {
            background-color: #45a049;
        }

        #restart-btn {
            z-index: 50;
            position: relative;
        }

        /* Play Screen */
        #play-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Змінено для уникнення зсувів кнопки на телефонах */
            gap: 30px; /* Задає стабільний відступ між елементами */
            min-height: 100%; /* Дозволяє блоку рости і не перекривати кнопку */
            width: 100%;
            padding: 20px 0;
        }

        #slots-area {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Дозволяємо перенесення на новий рядок, щоб комірки не стискалися критично */
            width: 100%;
            gap: 2.5vw; /* Збільшено відступ між комірками для уникнення накладання */
            margin-bottom: 20px;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex: 1 1 auto; /* Змінено на auto, щоб враховувався розмір контенту */
            min-width: 80px; /* Мінімальна ширина, щоб літери не налізали */
            max-width: 140px;
        }

        .slot {
            width: 100%;
            aspect-ratio: 3/4; /* Пропорція замість жорстких пікселів */
            border: 4px dashed #888;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(200, 200, 200, 0.4);
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            box-sizing: border-box;
        }

        .slot.filled {
            border-style: solid;
            border-color: #4CAF50;
            background: transparent;
        }

        .expression {
            font-size: clamp(14px, 1.8vw, 30px); /* Зменшено шрифт для уникнення накладання */
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            letter-spacing: 1px; /* Зменшено відстань між літерами */
        }

        #cards-area {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Карткам дозволено переноситися для зручності */
            gap: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.1);
            border-radius: 20px;
            min-height: 120px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            width: 90px;
            height: 110px;
            background: white;
            border: 3px solid #2196F3;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card.selected {
            border-color: #FF9800;
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 152, 0, 0.4);
        }

        .card .char {
            font-size: 56px;
            font-weight: bold;
            color: #000;
            line-height: 1.1;
        }

        #win-message {
            display: none;
            font-size: 64px;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.8);
            padding: 10px 30px;
            border-radius: 15px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-anim {
            animation: shake 0.4s;
            border-color: #f44336 !important;
        }

        /* Theme Manager */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid #ccc;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        #theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            width: 320px;
            max-height: 60vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow-y: auto;
            padding: 15px;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .theme-thumb {
            height: 100px;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            border: 3px solid transparent;
        }

        .theme-thumb:hover { border-color: #4CAF50; }
        .theme-thumb span {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 4px 0;
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
        }

        /* Блок контролю та заглушка */
        #block-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: red;
            font-size: 40px;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            text-align: center;
            text-transform: uppercase;
        }

        /* Адаптивність */
        @media (max-width: 768px) {
            #word-input { width: 95%; font-size: 28px; }
            .card { width: 70px; height: 90px; }
            .card .char { font-size: 40px; }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="setup-screen">
            <input type="text" id="word-input" autocomplete="off" spellcheck="false" placeholder="ВВЕДІТЬ СЛОВО ТУТ">
            <button id="start-btn">ПОЧАТИ ГРУ</button>
        </div>

        <div id="play-screen">
            <div id="win-message"></div>
            <div id="slots-area"></div>
            <div id="cards-area"></div>
            <button id="restart-btn" style="display: none;">НОВЕ СЛОВО</button>
        </div>
    </div>

    <button id="theme-btn">⚙️</button>
    <div id="theme-modal"></div>
    
    <!-- Екран-заглушка -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        /* === FIREBASE ІНІЦІАЛІЗАЦІЯ === */
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        /* === УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ (Ідентифікація, Радар, Блокування) === */
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user');
        if (myName) {
            sessionStorage.setItem('userName', myName);
        } else {
            myName = sessionStorage.getItem('userName');
            if (!myName) {
                myName = 'Гість_' + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('userName', myName);
            }
        }
        
        const tabId = Math.random().toString(36).substr(2, 9);
        const senderId = tabId; 
        let isRemoteAction = false;
        let lastActionTimestamp = 0;
        let immunity = true;
        setTimeout(() => immunity = false, 1000);

        const connectedRef = db.ref('.info/connected');
        const userRef = db.ref(`online_users/${myName}/${tabId}`);
        
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                userRef.onDisconnect().remove();
                userRef.set(true);
            }
        });
        window.addEventListener('beforeunload', () => userRef.remove());

        db.ref('force_refresh').on('value', (snap) => {
            if (snap.val() && !immunity) window.location.reload();
        });

        db.ref(`blocked_users/${myName}`).on('value', (snap) => {
            const overlay = document.getElementById('block-overlay');
            if (snap.val() === true) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        });

        db.ref('current_activity').on('value', (snap) => {
            if (!immunity && snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        /* === THEME MANAGER === */
        const baseBgUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        let currentBgIndex = 1;
        const themeModal = document.getElementById('theme-modal');
        const themeBtn = document.getElementById('theme-btn');
        let isRemoteTheme = false;

        themeBtn.onclick = () => {
            themeModal.style.display = themeModal.style.display === 'grid' ? 'none' : 'grid';
        };

        function setBackground(url, fromRemote = false) {
            document.body.style.backgroundImage = `url(${url})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';
            localStorage.setItem('mySavedGameBg', url);
            
            if (!fromRemote) {
                db.ref('game_theme').set(url);
            }
        }

        db.ref('game_theme').on('value', snap => {
            const url = snap.val();
            if (url) {
                setBackground(url, true);
            }
        });

        function checkAndLoadNextBg() {
            if (currentBgIndex > 1000) return;
            const url = `${baseBgUrl}background_${currentBgIndex}.webp`;
            const img = new Image();
            
            img.onload = () => {
                const thumb = document.createElement('div');
                thumb.className = 'theme-thumb';
                thumb.style.backgroundImage = `url(${url})`;
                
                const label = document.createElement('span');
                label.innerText = `Фон ${currentBgIndex}`;
                
                thumb.appendChild(label);
                thumb.onclick = () => {
                    setBackground(url);
                    themeModal.style.display = 'none';
                };
                
                themeModal.appendChild(thumb);
                currentBgIndex++;
                checkAndLoadNextBg();
            };
            img.onerror = () => {
                // Якщо картинки немає, зупиняємо пошук
            };
            img.src = url;
        }

        setBackground(localStorage.getItem('mySavedGameBg') || `${baseBgUrl}background_1.webp`, true);
        checkAndLoadNextBg();

        /* === СИНХРОНІЗАЦІЯ ХОДІВ (GAME ACTION) === */
        function sendAction(type, data = {}) {
            if (isRemoteAction) return;
            try {
                const action = {
                    senderId: senderId,
                    timestamp: Date.now(),
                    type: type,
                    data: data,
                    state: { // Зберігаємо стан для тих, хто запізнився або оновив сторінку
                        gameWord, slotsData, cardsData, selectedCardId,
                        isPlayScreen: document.getElementById('play-screen').style.display === 'flex'
                    }
                };
                
                // Очистка об'єкта від можливих undefined
                const cleanAction = JSON.parse(JSON.stringify(action));
                db.ref('game_action').set(cleanAction);
            } catch (e) {
                console.error("Firebase sync error:", e);
            }
        }

        db.ref('game_action').on('value', snap => {
            const action = snap.val();
            if (!action || action.timestamp <= lastActionTimestamp) return;

            // Якщо зайшли вперше (після завантаження), перевіряємо стан гри
            if (lastActionTimestamp === 0 && action.state) {
                gameWord = action.state.gameWord || "";
                slotsData = action.state.slotsData || [];
                cardsData = action.state.cardsData || [];
                selectedCardId = action.state.selectedCardId !== undefined ? action.state.selectedCardId : false;
                
                if (action.state.isPlayScreen) {
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('play-screen').style.display = 'flex';
                    renderGame();
                }
            }

            if (action.senderId === senderId) {
                lastActionTimestamp = action.timestamp;
                return;
            }

            lastActionTimestamp = action.timestamp;
            isRemoteAction = true;

            try {
                switch(action.type) {
                    case 'START_GAME':
                        gameWord = action.data.gameWord;
                        slotsData = action.data.slotsData || [];
                        cardsData = action.data.cardsData || [];
                        selectedCardId = action.data.selectedCardId !== undefined ? action.data.selectedCardId : false;
                        document.getElementById('setup-screen').style.display = 'none';
                        document.getElementById('play-screen').style.display = 'flex';
                        renderGame();
                        break;
                    case 'RESTART':
                        resetToSetupLocal();
                        break;
                    case 'CARD_CLICK':
                        handleCardClickLocal(action.data.id);
                        break;
                    case 'SLOT_CLICK':
                        handleSlotClickLocal(action.data.slotIndex);
                        break;
                }
            } catch(e) {
                console.error("Action processing error:", e);
            } finally {
                // Гарантуємо, що блокування ходів знімається навіть у разі помилки
                isRemoteAction = false;
            }
        });


        /* === SOUND SYSTEM (Web Audio API) === */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // Ре5
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // Ля5
                    gain.gain.setValueAtTime(0.08, now); // Тихий рівень
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'error') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now); // Ля3
                    osc.frequency.linearRampToValueAtTime(110, now + 0.25); // Ля2
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.26);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // До5 - Мі5 - Соль5 - До6
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.type = 'sine';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        noteGain.gain.setValueAtTime(0.06, now + idx * 0.12);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
                        noteOsc.start(now + idx * 0.12);
                        noteOsc.stop(now + idx * 0.12 + 0.45);
                    });
                }
            } catch (e) {
                console.log("Audio failed to play", e);
            }
        }

        /* === VOCABULARY DATABASE (Повна база з 500+ слів) === */
        const wordDatabase = [
            "СОБАКА", "КОТИК", "ПТАШКА", "РИБА", "ВЕДМІДЬ", "ЛИСИЦЯ", "ЗАЄЦЬ", "БІЛКА", "ЇЖАК", "МИША", "ЖАБА", "КОРОВА", "СВИНЯ", "КОЗА", "ВІВЦЯ", "КУРКА", "ПІВЕНЬ", "КАЧКА", "СЛОН", "ТИГР", "МАВПА", "ЖИРАФ", "ЗЕБРА", "МЕТЕЛИК", "БДЖОЛА", "ЖУРАВЕЛЬ", "ЛЕЛЕКА", "СОЛОВЕЙ", "ГОРОБЕЦЬ", "СИНИЦЯ", "ВОРОНА", "СОРОКА", "ҐАВА", "ДЯТЕЛ", "ЗОЗУЛЯ", "ШПАК", "СОВА", "ОРЕЛ", "ЯСТРУБ", "ЩУКА", "КАРАСЬ", "СОМ", "ОКУНЬ", "КИТ", "ДЕЛЬФІН", "АКУЛА", "КРАБ", "РАК", "ПАВУК", "МУРАХА", "КОМАР", "МУХА",

        function resetToSetupLocal() {
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('win-message').style.display = 'none';
            document.getElementById('slots-area').style.display = 'flex';
            document.getElementById('cards-area').style.display = 'flex';
            slotsData = []; cardsData = []; selectedCardId = false;
        }

        function startGame() {
            const inputEl = document.getElementById('word-input');
            const rawWord = inputEl.value.trim().toUpperCase();
            inputEl.value = ''; 
            
            gameWord = rawWord.replace(/[^А-ЯІЇЄҐ]/g, '');
            if (gameWord.length === 0) { alert('Введіть слово українською!'); return; }
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('play-screen').style.display = 'flex';

            generateLevel();
            
            sendAction('START_GAME', {
                gameWord: gameWord,
                slotsData: slotsData,
                cardsData: cardsData,
                selectedCardId: selectedCardId
            });
            
            renderGame();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateLevel() {
            slotsData = []; cardsData = []; selectedCardId = false;
            let usedWords = new Set();
            let cardIdCounter = 1;

            // Генерація унікальних слів-завдань для кожної літери загаданого слова
            gameWord.split('').forEach((char, index) => {
                // Шукаємо в базі слова, які містять потрібну літеру
                let available = wordDatabase.filter(w => w.includes(char) && !usedWords.has(w));
                
                if (available.length === 0) {
                    // Якщо унікальні слова закінчились, беремо ті, що вже були
                    available = wordDatabase.filter(w => w.includes(char));
                    usedWords.clear();
                }

                let expr = "_";
                
                if (available.length > 0) {
                    const chosenWord = available[Math.floor(Math.random() * available.length)];
                    usedWords.add(chosenWord);
                    
                    // Знаходимо всі позиції нашої літери в обраному слові
                    let indices = [];
                    for (let i = 0; i < chosenWord.length; i++) {
                        if (chosenWord[i] === char) indices.push(i);
                    }
                    
                    // Вибираємо випадкову позицію літери і ховаємо її
                    let dropIndex = indices[Math.floor(Math.random() * indices.length)];
                    let wordArr = chosenWord.split('');
                    wordArr[dropIndex] = '_';
                    expr = wordArr.join('');
                }

                slotsData.push({
                    index: index,
                    char: char,           
                    target: char,         
                    expression: expr,     
                    filledWithId: false // Замість null
                });

                cardsData.push({
                    id: cardIdCounter++,
                    target: char,         
                    placedInSlot: false // Замість null
                });
            });

            // Додаємо плутаючі літери (декої), які точно не підходять для слова
            const requiredAnswers = slotsData.map(s => s.target);
            const possibleAnswers = alphabet;
            let availableDecoys = possibleAnswers.filter(a => !requiredAnswers.includes(a));
            
            const decoysCount = Math.max(5, Math.floor(gameWord.length / 2));
            let finalDecoyLetters = shuffle(availableDecoys).slice(0, decoysCount);

            finalDecoyLetters.forEach(char => {
                cardsData.push({
                    id: cardIdCounter++,
                    target: char,
                    placedInSlot: false // Замість null
                });
            });

            cardsData = shuffle(cardsData);
        }

        function renderGame() {
            const slotsArea = document.getElementById('slots-area');
            const cardsArea = document.getElementById('cards-area');
            
            slotsArea.innerHTML = '';
            cardsArea.innerHTML = '';

            slotsData.forEach((slot, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'slot-wrapper';

                const slotEl = document.createElement('div');
                slotEl.className = 'slot' + (slot.filledWithId !== false ? ' filled' : '');
                
                if (slot.filledWithId !== false) {
                    // Коли дитина правильно вставляє букву, слот відкриває велику літеру загаданого слова
                    slotEl.innerHTML = `
                        <div style="text-align:center;">
                            <div class="char" style="font-size:clamp(40px, 5vw, 64px); font-weight:bold; line-height:1.1; color:#000;">${slot.char}</div>
                        </div>
                    `;
                }

                slotEl.onclick = () => {
                    sendAction('SLOT_CLICK', { slotIndex: idx });
                    handleSlotClickLocal(idx);
                };

                const expEl = document.createElement('div');
                expEl.className = 'expression';
                
                // Рендеримо слово під коміркою з підсвіткою пропуску або вставленої літери
                expEl.innerHTML = slot.filledWithId !== false 
                    ? slot.expression.replace('_', `<span style="color:#4CAF50">${slot.target}</span>`)
                    : slot.expression.replace('_', '<span style="color:#d32f2f">_</span>');

                wrapper.appendChild(slotEl);
                wrapper.appendChild(expEl);
                slotsArea.appendChild(wrapper);
            });

            cardsData.filter(c => c.placedInSlot === false).forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card' + (selectedCardId === card.id ? ' selected' : '');
                
                cardEl.innerHTML = `
                    <div class="char">${card.target}</div>
                `;
                cardEl.onclick = () => {
                    sendAction('CARD_CLICK', { id: card.id });
                    handleCardClickLocal(card.id);
                };
                cardsArea.appendChild(cardEl);
            });

            checkWin();
        }

        function handleCardClickLocal(id) {
            selectedCardId = selectedCardId === id ? false : id;
            renderGame();
        }

        function handleSlotClickLocal(slotIndex) {
            const slot = slotsData[slotIndex];
            const slotEls = document.querySelectorAll('.slot');
            const slotEl = slotEls[slotIndex];

            if (slot.filledWithId !== false) {
                const card = cardsData.find(c => c.id === slot.filledWithId);
                // Додатковий захист від помилки (якщо картки з якихось причин не існує)
                if (card) {
                    card.placedInSlot = false;
                }
                slot.filledWithId = false;
                renderGame();
                return;
            }

            if (selectedCardId !== false) {
                const card = cardsData.find(c => c.id === selectedCardId);
                
                // Якщо обрана літера співпадає з потрібною літерою у слові-прикладі
                if (card && card.target === slot.target) {
                    card.placedInSlot = slotIndex;
                    slot.filledWithId = card.id;
                    selectedCardId = false;
                    playSound('success'); // Тихий звук успіху
                    renderGame();
                } else {
                    if (slotEl) slotEl.classList.add('error-anim');
                    playSound('error'); // М'який звук помилки
                    setTimeout(() => {
                        if (slotEl) slotEl.classList.remove('error-anim');
                    }, 400);
                    selectedCardId = false;
                    renderGame();
                }
            }
        }

        function checkWin() {
            const isWin = slotsData.every(s => s.filledWithId !== false);
            if (isWin && slotsData.length > 0) {
                document.getElementById('win-message').innerText = gameWord;
                document.getElementById('win-message').style.display = 'block';
                document.getElementById('slots-area').style.display = 'none';
                document.getElementById('cards-area').style.display = 'none';
                document.getElementById('restart-btn').style.display = 'block';
                playSound('win'); // Фанфари перемоги
            }
        }
