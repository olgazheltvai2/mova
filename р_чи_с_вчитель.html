<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Р / С</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1a120b;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  #gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }
  /* Stylized wooden & brass buttons without any white rectangles */
  .wood-btn {
    background: linear-gradient(180deg, #6e4726 0%, #4d2f16 55%, #38200d 100%);
    border: 3px solid #b88644;
    box-shadow:
      0 6px 14px rgba(0, 0, 0, 0.65),
      inset 0 2px 3px rgba(255, 222, 173, 0.35),
      inset 0 -3px 6px rgba(0, 0, 0, 0.6);
    color: #f9e8c9;
    text-shadow: 0 2px 3px rgba(0, 0, 0, 0.85);
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .wood-btn::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px dashed rgba(212, 163, 89, 0.35);
    border-radius: inherit;
    pointer-events: none;
  }
  .wood-btn:hover {
    filter: brightness(1.12);
    transform: translateY(-2px) scale(1.03);
  }
  .wood-btn:active {
    transform: translateY(2px) scale(0.96);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7), inset 0 3px 6px rgba(0, 0, 0, 0.7);
  }
  .brass-rivet {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3b0, #c9933b 65%, #5c3d0e 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.8);
    position: absolute;
    pointer-events: none;
  }
  .letter-plaque {
    background:
      repeating-linear-gradient(90deg, rgba(45, 24, 10, 0.16) 0px, rgba(45, 24, 10, 0.16) 3px, transparent 3px, transparent 11px),
      linear-gradient(180deg, #7c4f28 0%, #593518 52%, #3f230e 100%);
    border: 4px solid #c99649;
    box-shadow:
      0 10px 22px rgba(0, 0, 0, 0.75),
      inset 0 2px 5px rgba(255, 232, 185, 0.45),
      inset 0 -5px 10px rgba(20, 10, 4, 0.8);
    color: #fff5dc;
    text-shadow: 0 3px 5px rgba(0, 0, 0, 0.9), 0 0 16px rgba(255, 215, 130, 0.25);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease, border-color 0.2s ease;
  }
  .letter-plaque:hover {
    filter: brightness(1.14);
    transform: translateY(-5px) scale(1.05);
    border-color: #f3c66f;
  }
  .letter-plaque:active {
    transform: translateY(2px) scale(0.95);
  }
  @keyframes plaqueShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-12px) rotate(-4deg); }
    40% { transform: translateX(11px) rotate(4deg); }
    60% { transform: translateX(-9px) rotate(-3deg); }
    80% { transform: translateX(8px) rotate(2deg); }
  }
  .shake-error {
    animation: plaqueShake 0.48s ease-in-out;
    border-color: #d9534f !important;
  }
  @keyframes plaquePulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.16) translateY(-8px); border-color: #ffe066; box-shadow: 0 0 30px rgba(255, 224, 102, 0.85); }
    100% { transform: scale(1); }
  }
  .pulse-correct {
    animation: plaquePulse 0.65s ease-out;
  }
</style>
</head>
<body>

<!-- Fullscreen Interactive Classroom & Blackboard Canvas -->
<canvas id="gameCanvas"></canvas>

<!-- Top Minimalist Stylized Controls: Language Toggle (УКР/РУС) & Next/Skip Button -->
<div class="fixed top-4 right-5 z-20 flex items-center gap-3">
  <!-- Single Language Toggle Button (УКР or РУС) -->
  <button id="langBtn" class="wood-btn rounded-2xl px-4 py-2.5 text-lg sm:text-xl font-bold tracking-wider flex items-center justify-center min-w-[78px]" aria-label="Language">
    <span class="brass-rivet top-1.5 left-1.5"></span>
    <span class="brass-rivet top-1.5 right-1.5"></span>
    <span class="brass-rivet bottom-1.5 left-1.5"></span>
    <span class="brass-rivet bottom-1.5 right-1.5"></span>
    <span id="langLabel">УКР</span>
  </button>

  <!-- Minimalist Next / Skip Button -->
  <button id="nextBtn" class="wood-btn rounded-2xl px-5 py-2.5 flex items-center justify-center" aria-label="Next">
    <span class="brass-rivet top-1.5 left-1.5"></span>
    <span class="brass-rivet top-1.5 right-1.5"></span>
    <span class="brass-rivet bottom-1.5 left-1.5"></span>
    <span class="brass-rivet bottom-1.5 right-1.5"></span>
    <svg class="w-8 h-8 fill-[#fce8c3]" viewBox="0 0 24 24">
      <path d="M5.5 4.5a1 1 0 0 1 1.6-.8l9.5 7.5a1 1 0 0 1 0 1.6l-9.5 7.5a1 1 0 0 1-1.6-.8V4.5z"/>
      <rect x="17.5" y="4.5" width="2.8" height="15" rx="1.2" />
    </svg>
  </button>
</div>

<!-- Bottom Wooden Chalk Ledge Letter Plaques -->
<div id="letterContainer" class="fixed bottom-3 left-1/2 -translate-x-1/2 z-20 flex items-center justify-center gap-8 md:gap-14 px-6 py-2">
  <!-- Letter Р Plaque -->
  <button id="btnR" data-letter="Р" class="letter-plaque rounded-3xl w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 flex items-center justify-center text-5xl sm:text-6xl md:text-7xl font-extrabold relative cursor-pointer">
    <span class="brass-rivet top-2.5 left-2.5"></span>
    <span class="brass-rivet top-2.5 right-2.5"></span>
    <span class="brass-rivet bottom-2.5 left-2.5"></span>
    <span class="brass-rivet bottom-2.5 right-2.5"></span>
    <span>Р</span>
  </button>

  <!-- Letter С Plaque -->
  <button id="btnS" data-letter="С" class="letter-plaque rounded-3xl w-24 h-24 sm:w-28 sm:h-28 md:w-32 md:h-32 flex items-center justify-center text-5xl sm:text-6xl md:text-7xl font-extrabold relative cursor-pointer">
    <span class="brass-rivet top-2.5 left-2.5"></span>
    <span class="brass-rivet top-2.5 right-2.5"></span>
    <span class="brass-rivet bottom-2.5 left-2.5"></span>
    <span class="brass-rivet bottom-2.5 right-2.5"></span>
    <span>С</span>
  </button>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Offscreen blackboard buffer for authentic chalk drawing & real sponge erasing
  const boardCanvas = document.createElement('canvas');
  boardCanvas.width = 900;
  boardCanvas.height = 600;
  const bCtx = boardCanvas.getContext('2d');

  // Offscreen static slate grain texture so the board looks like real natural stone
  const slatePatternCanvas = document.createElement('canvas');
  slatePatternCanvas.width = 256;
  slatePatternCanvas.height = 256;
  const sCtx = slatePatternCanvas.getContext('2d');

  function initSlateTexture() {
    sCtx.fillStyle = '#173326';
    sCtx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 3500; i++) {
      const x = Math.random() * 256;
      const y = Math.random() * 256;
      const alpha = Math.random() * 0.06;
      sCtx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${alpha})` : `rgba(0,0,0,${alpha * 1.4})`;
      sCtx.fillRect(x, y, 2, 2);
    }
  }
  initSlateTexture();

  // ==========================================
  // WEB AUDIO SYNTHESIZER (No external files!)
  // ==========================================
  let audioCtx = null;
  let lastChalkSfxTime = 0;
  let lastStepSfxTime = 0;

  function ensureAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Synthesize subtle wooden shoe footstep sound when walking or stomping
  function playFootstepSound(heavy = false) {
    if (!audioCtx) return;
    const now = performance.now();
    if (!heavy && now - lastStepSfxTime < 210) return;
    lastStepSfxTime = now;
    try {
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(heavy ? 115 : 145 + Math.random() * 25, t);
      osc.frequency.exponentialRampToValueAtTime(42, t + (heavy ? 0.13 : 0.075));
      gain.gain.setValueAtTime(heavy ? 0.24 : 0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (heavy ? 0.14 : 0.08));
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + (heavy ? 0.15 : 0.085));
    } catch (e) {}
  }

  // Synthesize realistic chalk scratching sound on slate
  function playChalkScratch(speed = 1) {
    if (!audioCtx) return;
    const now = performance.now();
    if (now - lastChalkSfxTime < 65) return;
    lastChalkSfxTime = now;

    try {
      const t = audioCtx.currentTime;
      const dur = 0.055;
      const bufferSize = Math.floor(audioCtx.sampleRate * dur);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const env = Math.sin((i / bufferSize) * Math.PI);
        data[i] = (Math.random() * 2 - 1) * env * 0.22;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1900 + Math.random() * 900, t);
      filter.Q.setValueAtTime(3.2, t);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.06 * Math.min(1.5, speed), t);
      gain.gain.exponentialRampToValueAtTime(0.003, t + dur);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(t);
    } catch (e) {}
  }

  // Synthesize soft felt sponge wiping sound
  function playEraseSound() {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const dur = 0.24;
      const bufferSize = Math.floor(audioCtx.sampleRate * dur);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const env = Math.sin((i / bufferSize) * Math.PI);
        data[i] = (Math.random() * 2 - 1) * env * 0.35;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(650, t);
      filter.frequency.linearRampToValueAtTime(320, t + dur);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.11, t);
      gain.gain.exponentialRampToValueAtTime(0.005, t + dur);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(t);
    } catch (e) {}
  }

  // Rich joyful musical fanfare & chimes on correct choice
  function playCorrectSound() {
    ensureAudio();
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc2.type = 'sine';
        osc.frequency.setValueAtTime(freq, t + idx * 0.085);
        osc2.frequency.setValueAtTime(freq * 1.5, t + idx * 0.085);

        gain.gain.setValueAtTime(0.001, t + idx * 0.085);
        gain.gain.linearRampToValueAtTime(0.16, t + idx * 0.085 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.085 + 0.55);

        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t + idx * 0.085);
        osc2.start(t + idx * 0.085);
        osc.stop(t + idx * 0.085 + 0.56);
        osc2.stop(t + idx * 0.085 + 0.56);
      });
    } catch (e) {}
  }

  // Comical grumpy teacher brass/grumble sound on wrong choice
  function playWrongSound() {
    ensureAudio();
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const freqs = [195, 145];
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        const start = t + i * 0.22;
        osc.frequency.setValueAtTime(f, start);
        osc.frequency.linearRampToValueAtTime(f * 0.82, start + 0.2);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(520, start);

        gain.gain.setValueAtTime(0.001, start);
        gain.gain.linearRampToValueAtTime(0.18, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.24);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(start);
        osc.stop(start + 0.25);
      });
    } catch (e) {}
  }

  function playWoodClick() {
    ensureAudio();
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(340, t);
      osc.frequency.exponentialRampToValueAtTime(110, t + 0.06);
      gain.gain.setValueAtTime(0.16, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.065);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.07);
    } catch (e) {}
  }

  // ========================================================
  // PROCEDURAL GEOMETRY HELPERS FOR REALISTIC CHALK ARTWORK
  // ========================================================
  function sampleCatmullRom(pts, closed = false, segmentsPerSpan = 14) {
    if (pts.length < 2) return pts.slice();
    const out = [];
    const n = pts.length;
    const count = closed ? n : n - 1;
    for (let i = 0; i < count; i++) {
      const p0 = pts[closed ? (i - 1 + n) % n : Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[(i + 1) % n];
      const p3 = pts[closed ? (i + 2) % n : Math.min(n - 1, i + 2)];
      for (let s = 0; s < segmentsPerSpan; s++) {
        const t = s / segmentsPerSpan;
        const t2 = t * t;
        const t3 = t2 * t;
        const x = 0.5 * (
          (2 * p1[0]) +
          (-p0[0] + p2[0]) * t +
          (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
          (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3
        );
        const y = 0.5 * (
          (2 * p1[1]) +
          (-p0[1] + p2[1]) * t +
          (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
          (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3
        );
        out.push([x, y]);
      }
    }
    if (closed) {
      out.push([pts[0][0], pts[0][1]]);
    } else {
      out.push([pts[n - 1][0], pts[n - 1][1]]);
    }
    return out;
  }

  function makeArc(cx, cy, rx, ry, a0, a1, steps = 36, rot = 0) {
    const pts = [];
    const cosR = Math.cos(rot);
    const sinR = Math.sin(rot);
    for (let i = 0; i <= steps; i++) {
      const a = a0 + (a1 - a0) * (i / steps);
      const lx = Math.cos(a) * rx;
      const ly = Math.sin(a) * ry;
      pts.push([
        cx + lx * cosR - ly * sinR,
        cy + lx * sinR + ly * cosR
      ]);
    }
    return pts;
  }

  function makeStroke(pts, color = '#f7f4eb', width = 5, fill = null, closed = false, smooth = true) {
    const sampled = smooth && pts.length > 2 ? sampleCatmullRom(pts, closed, 12) : pts;
    return { pts: sampled, color, width, fill };
  }

  // ========================================================
  // 14 DETAILED REALISTIC CHALK ILLUSTRATIONS (Р & С)
  // Coordinates are in 900 x 600 blackboard space (center ~ 430, 300)
  // ========================================================
  function buildIllustrations() {
    const items = [];

    // 1. РАКЕТА (Realistic Multi-Stage Space Rocket)
    items.push({
      id: 'raketa',
      uk: 'РАКЕТА',
      ru: 'РАКЕТА',
      letterUk: 'Р',
      letterRu: 'Р',
      build: () => {
        const s = [];
        // Main fuselage nose cone & body
        s.push(makeStroke([
          [430, 68], [468, 125], [488, 210], [492, 330], [482, 415],
          [378, 415], [368, 330], [372, 210], [392, 125]
        ], '#f4f6f8', 6, 'rgba(225, 235, 245, 0.24)', true));
        // Red nose cone cap
        s.push(makeStroke([
          [430, 68], [462, 115], [474, 152], [386, 152], [398, 115]
        ], '#ff6b5b', 6, 'rgba(255, 107, 91, 0.42)', true));
        // Decorative checkered/striped stage band
        s.push(makeStroke([[372, 215], [488, 215]], '#ff6b5b', 6, null, false, false));
        s.push(makeStroke([[369, 345], [491, 345]], '#ff6b5b', 6, null, false, false));
        // Left aerodynamic booster fin
        s.push(makeStroke([
          [372, 310], [312, 368], [298, 452], [342, 428], [378, 410]
        ], '#ff6b5b', 6, 'rgba(255, 107, 91, 0.38)', true));
        // Right aerodynamic booster fin
        s.push(makeStroke([
          [488, 310], [548, 368], [562, 452], [518, 428], [482, 410]
        ], '#ff6b5b', 6, 'rgba(255, 107, 91, 0.38)', true));
        // Center dorsal fin
        s.push(makeStroke([
          [430, 325], [418, 405], [430, 455], [442, 405]
        ], '#ff8577', 5, 'rgba(255, 107, 91, 0.35)', true));
        // Upper circular porthole frame & glass
        s.push(makeStroke(makeArc(430, 255, 34, 34, 0, Math.PI * 2), '#ffd166', 6, 'rgba(110, 212, 255, 0.42)', false, false));
        s.push(makeStroke(makeArc(430, 255, 25, 25, 0, Math.PI * 2), '#8ae1ff', 3, null, false, false));
        s.push(makeStroke([[415, 244], [428, 235]], '#ffffff', 4, null, false, false));
        // Lower circular porthole
        s.push(makeStroke(makeArc(430, 312, 18, 18, 0, Math.PI * 2), '#ffd166', 4, 'rgba(110, 212, 255, 0.32)', false, false));
        // Engine nozzle
        s.push(makeStroke([
          [395, 416], [384, 444], [476, 444], [465, 416]
        ], '#adb5bd', 5, 'rgba(173, 181, 189, 0.35)', true, false));
        // Multi-layered roaring exhaust flame
        s.push(makeStroke([
          [392, 446], [368, 495], [398, 488], [408, 542], [430, 565],
          [452, 542], [462, 488], [492, 495], [468, 446]
        ], '#ff9f1c', 6, 'rgba(255, 159, 28, 0.42)', true));
        s.push(makeStroke([
          [408, 446], [398, 492], [430, 535], [462, 492], [452, 446]
        ], '#ffe66d', 5, 'rgba(255, 230, 109, 0.55)', true));
        return s;
      }
    });

    // 2. РУКА (Realistic Anatomical Human Hand)
    items.push({
      id: 'ruka',
      uk: 'РУКА',
      ru: 'РУКА',
      letterUk: 'Р',
      letterRu: 'Р',
      build: () => {
        const s = [];
        // Continuous anatomical contour of open hand with 5 distinct fingers & wrist
        s.push(makeStroke([
          [380, 485], [376, 418], [344, 372], [292, 326], [268, 294],
          [272, 272], [296, 275], [332, 312], [358, 336], // thumb
          [348, 240], [342, 155], [352, 132], [372, 134], [380, 162], [388, 252], // index finger
          [402, 145], [408, 102], [426, 98], [438, 118], [438, 250], // middle finger
          [456, 152], [468, 122], [486, 128], [490, 158], [480, 268], // ring finger
          [508, 198], [526, 174], [542, 184], [538, 216], [514, 305], // pinky finger
          [508, 372], [482, 422], [476, 485]
        ], '#f7d6b5', 6, 'rgba(247, 214, 181, 0.28)', true));
        // Fingernails & knuckle creases
        s.push(makeStroke(makeArc(282, 283, 9, 7, 0, Math.PI * 2, 16, -0.5), '#fff0e0', 3, null, false, false));
        s.push(makeStroke(makeArc(361, 144, 8, 10, 0, Math.PI * 2), '#fff0e0', 3, null, false, false));
        s.push(makeStroke(makeArc(421, 111, 8, 10, 0, Math.PI * 2), '#fff0e0', 3, null, false, false));
        s.push(makeStroke(makeArc(476, 136, 8, 10, 0, Math.PI * 2), '#fff0e0', 3, null, false, false));
        s.push(makeStroke(makeArc(531, 188, 7, 9, 0, Math.PI * 2, 16, 0.2), '#fff0e0', 3, null, false, false));
        // Natural palm lifelines & heart lines
        s.push(makeStroke([[366, 336], [408, 355], [430, 405]], '#e0ac7e', 4, null, false));
        s.push(makeStroke([[368, 298], [428, 312], [485, 302]], '#e0ac7e', 4, null, false));
        s.push(makeStroke([[492, 286], [442, 282], [392, 266]], '#e0ac7e', 4, null, false));
        // Shirt cuff with button at the bottom
        s.push(makeStroke([
          [358, 478], [498, 478], [508, 535], [348, 535]
        ], '#74c0fc', 6, 'rgba(116, 192, 252, 0.36)', true, false));
        s.push(makeStroke(makeArc(468, 506, 8, 8, 0, Math.PI * 2), '#fff3bf', 4, 'rgba(255,243,191,0.6)', false, false));
        return s;
      }
    });

    // 3. РАК (Realistic Crayfish with Claws, Carapace, Legs & Tail Fan)
    items.push({

  const allItems = buildIllustrations();

  // Fisher-Yates Infinite Shuffle Generator
  function nextFromDeck() {
    if (deck.length === 0) {
      deck = allItems.slice();
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      // Prevent back-to-back duplicate on deck boundary
      if (currentItem && deck[deck.length - 1].id === currentItem.id) {
        const swapIdx = Math.floor(Math.random() * (deck.length - 1));
        [deck[deck.length - 1], deck[swapIdx]] = [deck[swapIdx], deck[deck.length - 1]];
      }
    }
    return deck.pop();
  }

  function resetBoardCanvas() {
    bCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
  }

  // Draw realistic multi-bristle chalk segment onto boardCanvas
  function drawChalkSegmentOnBoard(p1, p2, color, width) {
    bCtx.save();
    bCtx.lineCap = 'round';
    bCtx.lineJoin = 'round';

    // Core chalk line
    bCtx.strokeStyle = color;
    bCtx.globalAlpha = 0.85;
    bCtx.lineWidth = width;
    bCtx.beginPath();
    bCtx.moveTo(p1[0], p1[1]);
    bCtx.lineTo(p2[0], p2[1]);
    bCtx.stroke();

    // Textured chalk grain bristles along segment
    const dist = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const steps = Math.max(2, Math.ceil(dist / 3));
    bCtx.fillStyle = color;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const x = p1[0] + (p2[0] - p1[0]) * t + (Math.random() - 0.5) * width * 0.85;
      const y = p1[1] + (p2[1] - p1[1]) * t + (Math.random() - 0.5) * width * 0.85;
      bCtx.globalAlpha = 0.35 + Math.random() * 0.45;
      bCtx.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
    }
    bCtx.restore();
  }

  // Soft pastel chalk shading fill when a closed shape completes
  function drawChalkShadeFill(pts, fillStyle) {
    if (!fillStyle || pts.length < 3) return;
    bCtx.save();
    bCtx.beginPath();
    bCtx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      bCtx.lineTo(pts[i][0], pts[i][1]);
    }
    bCtx.closePath();
    bCtx.fillStyle = fillStyle;
    bCtx.fill();
    bCtx.restore();
  }

  function spawnChalkDust(bx, by, color, count = 2) {
    for (let i = 0; i < count; i++) {
      chalkDust.push({
        bx: bx + (Math.random() - 0.5) * 14,

  }

  // Start erasing the current drawing before drawing the next item
  function transitionToNewItem(newItem = null) {
    currentItem = newItem || nextFromDeck();
    activeStrokes = currentItem.build();
    eraseProgress = 0;
    lastEraseSoundProgress = 0;
    gameState = 'ERASING';
    stateTimer = 0;
    updateLanguageUI();
  }

  // Begin drawing currentItem stroke-by-stroke on a clean board
  function startDrawingCurrentItem() {
    resetBoardCanvas();
    activeStrokes = currentItem.build();
    currentStrokeIdx = 0;
    currentPointIdx = 0;
    if (activeStrokes.length > 0 && activeStrokes[0].pts.length > 0) {
      chalkBoardPos.x = activeStrokes[0].pts[0][0];
      chalkBoardPos.y = activeStrokes[0].pts[0][1];
      activeChalkColor = activeStrokes[0].color;
    }
    gameState = 'DRAWING';
    stateTimer = 0;

    langBtn.addEventListener('click', () => {

  function handleLetterChoice(chosenLetter, buttonEl) {
    ensureAudio();
    if (!currentItem) return;
    if (gameState === 'CORRECT' || gameState === 'ERASING') return;

    // If the student answers while the teacher is still drawing, instantly finish the drawing so it's clear
    if (gameState === 'DRAWING') {
      finishDrawingInstantly();
    }

    const expected = lang === 'uk' ? currentItem.letterUk : currentItem.letterRu;
    const isCorrect = chosenLetter === expected;

    if (isCorrect) {
      gameState = 'CORRECT';
      stateTimer = 0;
      playCorrectSound();
      spawnCelebration();
      buttonEl.classList.remove('pulse-correct');
      void buttonEl.offsetWidth;
      buttonEl.classList.add('pulse-correct');
    } else {
      gameState = 'WRONG';
      stateTimer = 0;
      playWrongSound();
      playFootstepSound(true);
      spawnAngrySteam();
      buttonEl.classList.remove('shake-error');
      void buttonEl.offsetWidth;
      buttonEl.classList.add('shake-error');
    }
  }

  function finishDrawingInstantly() {
    while (currentStrokeIdx < activeStrokes.length) {
      const st = activeStrokes[currentStrokeIdx];
      for (let p = currentPointIdx; p < st.pts.length - 1; p++) {
        drawChalkSegmentOnBoard(st.pts[p], st.pts[p + 1], st.color, st.width);
      }
      if (st.fill) {
        drawChalkShadeFill(st.pts, st.fill);
      }
      currentStrokeIdx++;
      currentPointIdx = 0;
    }
    gameState = 'WAITING';
  }

  btnR.addEventListener('click', () => handleLetterChoice('Р', btnR));
  btnS.addEventListener('click', () => handleLetterChoice('С', btnS));

  nextBtn.addEventListener('click', () => {
    ensureAudio();
    playWoodClick();
    transitionToNewItem(nextFromDeck());

  // ========================================================
  // RESPONSIVE WIDESCREEN CLASSROOM LAYOUT & SCENE RENDERER
  // ========================================================
  let W = window.innerWidth;
  let H = window.innerHeight;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resize);
  resize();

  // Draw the living classroom story background (arched window, swaying trees, bookshelf & globe, pendant lamps, wainscoting, AND perspective wooden parquet floor)
  function drawClassroomBackground(time) {
    const dadoY = H * 0.56;
    const floorY = H * 0.77;

    // Warm vintage classroom upper wall gradient
    const wallGrad = ctx.createLinearGradient(0, 0, 0, dadoY);
    wallGrad.addColorStop(0, '#3a2618');
    wallGrad.addColorStop(1, '#2b1b10');
    ctx.fillStyle = wallGrad;
    ctx.fillRect(0, 0, W, dadoY);

    // Subtle decorative striped wallpaper pattern
    ctx.fillStyle = 'rgba(255, 215, 160, 0.025)';
    const stripeW = Math.max(28, W * 0.025);
    for (let x = 0; x < W; x += stripeW * 2) {
      ctx.fillRect(x, 0, stripeW, dadoY);
    }

    // Carved wooden wainscoting middle wall panels (between dadoY and floorY)
    const woodGrad = ctx.createLinearGradient(0, dadoY, 0, floorY);
    woodGrad.addColorStop(0, '#4a2c16');
    woodGrad.addColorStop(0.15, '#3b2210');
    woodGrad.addColorStop(1, '#261509');
    ctx.fillStyle = woodGrad;
    ctx.fillRect(0, dadoY, W, floorY - dadoY);

    ctx.strokeStyle = '#6e4523';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, dadoY);
    ctx.lineTo(W, dadoY);
    ctx.stroke();

    // Recessed wood wainscoting panels along the wall
    const panelW = Math.max(110, W * 0.09);
    for (let x = 16; x < W - 20; x += panelW + 18) {
      ctx.strokeStyle = 'rgba(20, 9, 3, 0.65)';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, dadoY + 12, panelW, floorY - dadoY - 26);
      ctx.strokeStyle = 'rgba(212, 163, 115, 0.14)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 4, dadoY + 16, panelW - 8, floorY - dadoY - 34);
    }

    // =========================================================================
    // PERSPECTIVE WOODEN PARQUET CLASSROOM FLOOR (So teacher stands firmly!)
    // =========================================================================
    const floorGrad = ctx.createLinearGradient(0, floorY, 0, H);
    floorGrad.addColorStop(0, '#4d2e18');
    floorGrad.addColorStop(0.25, '#5e3a1f');
    floorGrad.addColorStop(0.7, '#462914');
    floorGrad.addColorStop(1, '#2d190b');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, floorY, W, H - floorY);

    // Horizontal perspective floorboard plank seams
    const plankRows = [0.14, 0.31, 0.51, 0.74];
    ctx.strokeStyle = 'rgba(24, 12, 4, 0.55)';
    ctx.lineWidth = 2;
    plankRows.forEach((r) => {
      const py = floorY + (H - floorY) * r;
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(W, py);
      ctx.stroke();
    });

    // Perspective radiating floorboard joints from vanishing point
    const vpX = W * 0.5;
    const vpY = H * 0.35;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, floorY, W, H - floorY);
    ctx.clip();
    ctx.strokeStyle = 'rgba(28, 14, 5, 0.48)';
    ctx.lineWidth = 2;
    const numPlanks = 18;
    for (let i = -numPlanks; i <= numPlanks; i++) {
      const bottomX = vpX + i * (W / 9);
      const tStart = (floorY - vpY) / (H - vpY);
      const topX = vpX + (bottomX - vpX) * tStart;
      ctx.beginPath();
      ctx.moveTo(topX, floorY);
      ctx.lineTo(bottomX, H);
      ctx.stroke();
    }
    ctx.restore();

    // Molded wooden baseboard (плінтус) separating wall and parquet floor
    const baseGrad = ctx.createLinearGradient(0, floorY - 12, 0, floorY + 6);
    baseGrad.addColorStop(0, '#6e4423');
    baseGrad.addColorStop(0.5, '#472a13');
    baseGrad.addColorStop(1, '#241307');
    ctx.fillStyle = baseGrad;
    ctx.fillRect(0, floorY - 10, W, 14);
    ctx.strokeStyle = '#8a5830';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, floorY - 10);
    ctx.lineTo(W, floorY - 10);
    ctx.stroke();

    // Arched Sunlit Classroom Window on the Left
    const winX = W * 0.022;
    const winY = H * 0.06;
    const winW = Math.min(W * 0.145, 205);
    const winH = H * 0.45;

    if (W > 700) {
      ctx.save();
      // Arched window path helper
      const archR = winW / 2;
      ctx.beginPath();
      ctx.arc(winX + archR, winY + archR, archR, Math.PI, 0, false);
      ctx.lineTo(winX + winW, winY + winH);
      ctx.lineTo(winX, winY + winH);
      ctx.closePath();

      const skyGrad = ctx.createLinearGradient(winX, winY, winX, winY + winH);
      skyGrad.addColorStop(0, '#72c4ff');
      skyGrad.addColorStop(0.65, '#bfe6ff');
      skyGrad.addColorStop(1, '#fef3c7');
      ctx.fillStyle = skyGrad;
      ctx.fill();
      ctx.clip();

      // Drifting soft clouds
      const cloudOffset = (time * 0.012) % (winW + 120) - 60;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(winX + cloudOffset, winY + winH * 0.25, 20, 0, Math.PI * 2);
      ctx.arc(winX + cloudOffset + 18, winY + winH * 0.22, 26, 0, Math.PI * 2);
      ctx.arc(winX + cloudOffset + 38, winY + winH * 0.26, 18, 0, Math.PI * 2);
      ctx.fill();

      // Animated birds flying outside the window
      for (let b = 0; b < 2; b++) {
        const bx = winX + ((time * 0.028 + b * 85) % (winW + 60)) - 30;
        const by = winY + winH * (0.32 + b * 0.09) + Math.sin(time * 0.006 + b) * 6;
        const wingY = Math.sin(time * 0.018 + b * 2) * 5;
        ctx.strokeStyle = '#2b4c65';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bx - 7, by + wingY);
        ctx.quadraticCurveTo(bx - 3, by - 3, bx, by);
        ctx.quadraticCurveTo(bx + 3, by - 3, bx + 7, by + wingY);
        ctx.stroke();
      }

      // Swaying green tree branches & foliage outside the window
      const sway = Math.sin(time * 0.0018) * 8;
      ctx.strokeStyle = '#5c3a21';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(winX, winY + winH * 0.78);
      ctx.quadraticCurveTo(winX + winW * 0.4, winY + winH * 0.68 + sway * 0.5, winX + winW * 0.72, winY + winH * 0.58 + sway);
      ctx.stroke();

      const leafClusters = [
        [0.25, 0.72, 32, '#2d6a4f'],
        [0.52, 0.62, 36, '#40916c'],
        [0.75, 0.56, 28, '#52b788'],
        [0.38, 0.54, 26, '#74c69d'],
        [0.18, 0.85, 40, '#1b4332']
      ];
      leafClusters.forEach(([rx, ry, rad, col], idx) => {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(
          winX + winW * rx + Math.sin(time * 0.002 + idx) * 5,
          winY + winH * ry + sway * rx,
          rad,

        );

      });

      ctx.restore();

      // Wooden window muntins & arched frame
      ctx.save();
      ctx.strokeStyle = '#4a2c16';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(winX + winW / 2, winY);
      ctx.lineTo(winX + winW / 2, winY + winH);
      ctx.moveTo(winX, winY + winH * 0.52);
      ctx.lineTo(winX + winW, winY + winH * 0.52);

      ctx.strokeStyle = '#6e4523';
      ctx.lineWidth = 10;
      ctx.beginPath();

      ctx.roundRect(winX - 10, winY + winH - 4, winW + 20, 16, 6);
      ctx.fill();

      // Potted lush green classroom fern sitting on the window sill
      const potX = winX + winW * 0.66;

      // Terracotta pot

      // Wooden bookshelf standing on the classroom floor on the right

      const contShift = (time * 0.015) % 44;

      ctx.arc(globeX - 16 + contShift, globeY - 4, 10, 0, Math.PI * 2);
      ctx.arc(globeX - 38 + contShift, globeY + 6, 12, 0, Math.PI * 2);

      // Shelves & colorful book spines
      const bookPalette = ['#bc4749', '#e09f3e', '#386641', '#457b9d', '#9b2226', '#6d597a'];
      for (let row = 0; row < 3; row++) {
        const sy = shelfY + (row + 1) * (shelfH / 3);

        ctx.fillRect(shelfX + 3, sy - 6, shelfW - 6, 6);
        let bx = shelfX + 10;
        for (let b = 0; b < 6; b++) {

    // Swaying Vintage Pendant Lamps at the top of the classroom
    [W * 0.34, W * 0.68].forEach((lx, idx) => {
      const lampSway = Math.sin(time * 0.0016 + idx * 1.4) * 0.04;
      const cordLen = H * 0.065;

      // Warm glow cone under lamp
      const glow = ctx.createRadialGradient(0, cordLen + 14, 4, 0, cordLen + 40, 120);
      glow.addColorStop(0, 'rgba(255, 228, 150, 0.25)');
      glow.addColorStop(1, 'rgba(255, 228, 150, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, cordLen + 20, 110, 0, Math.PI * 2);

      // Brass & enamel shade
      ctx.fillStyle = '#c99649';
      ctx.beginPath();
      ctx.moveTo(-24, cordLen + 14);
      ctx.quadraticCurveTo(0, cordLen - 4, 24, cordLen + 14);
