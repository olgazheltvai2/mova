      ctx.fillStyle = '#fff3b0';
      ctx.beginPath();
      ctx.arc(0, cordLen + 15, 7, 0, Math.PI);
      ctx.fill();
      ctx.restore();
    });

    // Floating dust motes in the warm sunbeams
    ctx.fillStyle = 'rgba(255, 243, 195, 0.45)';
    roomDust.forEach((d) => {
      d.x = (d.x + d.vx + 1) % 1;
      d.y = (d.y + d.vy + 1) % 1;
      const dx = d.x * W;
      const dy = d.y * H * 0.8;
      const twinkle = 0.4 + 0.6 * Math.sin(time * 0.003 + d.phase);
      ctx.globalAlpha = twinkle * 0.55;
      ctx.beginPath();
      ctx.arc(dx, dy, d.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // ========================================================
  // BLACKBOARD & CHALK LEDGE RENDERING
  // ========================================================
  function getBoardRect() {
    const maxW = Math.min(W * 0.58, 840);
    const maxH = Math.min(H * 0.58, 520);
    const aspect = 1.5;
    let bw = maxW;
    let bh = bw / aspect;
    if (bh > maxH) {
      bh = maxH;
      bw = bh * aspect;
    }
    // Position board slightly to the right of center so teacher has plenty of floor space on the left
    const bx = W > 720 ? W * 0.27 : (W - bw) / 2;
    const by = H * 0.055;
    return { x: bx, y: by, w: bw, h: bh };
  }

  function drawBlackboard(boardRect) {
    const { x, y, w, h } = boardRect;
    const frameT = Math.max(16, w * 0.026);

    ctx.save();
    // Subtle board shake on wrong answer
    if (gameState === 'WRONG' && stateTimer < 26) {
      const shake = Math.sin(stateTimer * 0.85) * 6 * (1 - stateTimer / 26);
      ctx.translate(shake, 0);
    }

    // Deep drop shadow behind blackboard
    ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
    ctx.shadowBlur = 28;
    ctx.shadowOffsetY = 14;

    // Carved wooden outer frame
    const frameGrad = ctx.createLinearGradient(x - frameT, y - frameT, x + w + frameT, y + h + frameT);
    frameGrad.addColorStop(0, '#784b27');
    frameGrad.addColorStop(0.5, '#543216');
    frameGrad.addColorStop(1, '#3b210c');
    ctx.fillStyle = frameGrad;
    ctx.beginPath();
    ctx.roundRect(x - frameT, y - frameT, w + frameT * 2, h + frameT * 2, 14);
    ctx.fill();
    ctx.shadowColor = 'transparent';

    // Brass corner brackets & bevel trim
    ctx.strokeStyle = '#c89646';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x - 3, y - 3, w + 6, h + 6);

    // Dark-green natural slate surface
    const slateGrad = ctx.createRadialGradient(x + w * 0.48, y + h * 0.45, 20, x + w * 0.5, y + h * 0.5, w * 0.75);
    slateGrad.addColorStop(0, '#224735');
    slateGrad.addColorStop(0.7, '#173326');
    slateGrad.addColorStop(1, '#0f241a');
    ctx.fillStyle = slateGrad;
    ctx.fillRect(x, y, w, h);

    // Overlay procedural slate grain texture
    const pat = ctx.createPattern(slatePatternCanvas, 'repeat');
    if (pat) {
      ctx.save();
      ctx.globalAlpha = 0.65;
      ctx.fillStyle = pat;
      ctx.fillRect(x, y, w, h);
      ctx.restore();
    }

    // Subtle residual chalk dust clouds on the slate
    ctx.fillStyle = 'rgba(240, 248, 242, 0.035)';
    ctx.beginPath();
    ctx.ellipse(x + w * 0.45, y + h * 0.48, w * 0.34, h * 0.28, -0.1, 0, Math.PI * 2);
    ctx.fill();

    // Render the active offscreen chalk buffer onto the slate board
    ctx.drawImage(boardCanvas, x, y, w, h);

    // Inner shadow of wooden frame onto slate
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.lineWidth = 6;
    ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);

    // Wooden Chalk Ledge at the bottom of the board
    const ledgeH = frameT * 1.15;
    const ledgeGrad = ctx.createLinearGradient(x, y + h, x, y + h + ledgeH);
    ledgeGrad.addColorStop(0, '#85552d');
    ledgeGrad.addColorStop(0.45, '#593619');
    ledgeGrad.addColorStop(1, '#331c0b');
    ctx.fillStyle = ledgeGrad;
    ctx.beginPath();
    ctx.roundRect(x - frameT - 8, y + h, w + frameT * 2 + 16, ledgeH, 6);
    ctx.fill();
    ctx.strokeStyle = '#b58342';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Colorful pastel chalk sticks resting on the wooden ledge
    const chalkColors = ['#ffffff', '#ffd166', '#ff6b6b', '#74c0fc', '#74c69d'];
    chalkColors.forEach((c, idx) => {
      const cx = x + 36 + idx * 44;
      const cy = y + h - 5;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.roundRect(cx, cy, 28, 7, 3);
      ctx.fill();
    });

    // If the teacher is not currently holding the sponge duster, draw it resting on the ledge
    if (gameState !== 'ERASING') {
      const spX = x + w - 110;
      const spY = y + h - 18;
      // Felt bottom
      ctx.fillStyle = '#38302e';
      ctx.beginPath();
      ctx.roundRect(spX, spY + 9, 56, 10, 3);
      ctx.fill();
      // Wooden handle top
      ctx.fillStyle = '#a46c38';
      ctx.beginPath();
      ctx.roundRect(spX + 2, spY, 52, 10, 4);
      ctx.fill();
    }

    ctx.restore();
  }

  // =========================================================================
  // REALISTIC TEACHER WITH GROUNDED SHOES, WALK CYCLE & GRAVITY-CONSTRAINED ARMS
  // =========================================================================
  let teacherPosX = null;
  let teacherTurn = 1; // 1 = facing blackboard (3/4 back view), 0 = facing student (front view)
  let walkCycle = 0;

  // Gravity-stabilized 2-Bone Inverse Kinematics Solver:
  // Computes both circle-circle intersection points for the elbow and ALWAYS selects
  // the anatomically natural elbow position (pulled downward by gravity, never bent backwards or snapped).
  function solveNaturalArmIK(shoulderX, shoulderY, rawTargetX, rawTargetY, upperLen, lowerLen, preferSide = 'down') {
    let dx = rawTargetX - shoulderX;
    let dy = rawTargetY - shoulderY;
    let dist = Math.hypot(dx, dy) || 0.0001;

    // Strictly keep distance between 52% and 93% of total arm length so the elbow NEVER folds at an acute "broken" angle (< 60 deg) or hyper-extends!
    const minReach = (upperLen + lowerLen) * 0.52;
    const maxReach = (upperLen + lowerLen) * 0.93;
    const clampedDist = Math.max(minReach, Math.min(maxReach, dist));

    const ux = dx / dist;
    const uy = dy / dist;
    const wristX = shoulderX + ux * clampedDist;
    const wristY = shoulderY + uy * clampedDist;

    // Law of cosines for distance from shoulder along shoulder->wrist line
    const a = (upperLen * upperLen - lowerLen * lowerLen + clampedDist * clampedDist) / (2 * clampedDist);
    const h = Math.sqrt(Math.max(0, upperLen * upperLen - a * a));

    // Midpoint along line
    const mx = shoulderX + ux * a;
    const my = shoulderY + uy * a;

    // Two candidate elbow positions perpendicular to (ux, uy)
    const e1x = mx - uy * h;
    const e1y = my + ux * h;
    const e2x = mx + uy * h;
    const e2y = my - ux * h;

    let elbowX, elbowY;
    if (preferSide === 'leftOut') {
      // For left arm in front view: pick the candidate that bends further left and downward
      if (e1x - e1y * 0.4 < e2x - e2y * 0.4) {
        elbowX = e1x;
        elbowY = e1y;
      } else {
        elbowX = e2x;
        elbowY = e2y;
      }
    } else if (preferSide === 'rightOut') {
      // For right arm on hip in front view: pick the candidate that bends further right and downward
      if (e1x + e1y * 0.4 > e2x + e2y * 0.4) {
        elbowX = e1x;
        elbowY = e1y;
      } else {
        elbowX = e2x;
        elbowY = e2y;
      }
    } else {
      // Default ('down'): Gravity pulls the elbow DOWN (+Y on canvas) and slightly toward torso if nearly vertical
      if (e1y >= e2y) {
        elbowX = e1x;
        elbowY = e1y;
      } else {
        elbowX = e2x;
        elbowY = e2y;
      }
    }

    const upperAngle = Math.atan2(elbowY - shoulderY, elbowX - shoulderX);
    const lowerAngle = Math.atan2(wristY - elbowY, wristX - elbowX);

    return {
      shoulderX,
      shoulderY,
      elbowX,
      elbowY,
      wristX,
      wristY,
      upperAngle,
      lowerAngle
    };
  }

  // Render a unified, continuous, crease-free anatomical jacket sleeve + cuff + sculpted hand
  function drawContinuousArm(ik, scale, toolMode, chalkColor) {
    const { shoulderX, shoulderY, elbowX, elbowY, wristX, wristY, lowerAngle } = ik;

    // Shorten sleeve slightly before wrist so the cream shirt cuff shows cleanly
    const cuffLen = 9 * scale;
    const sleeveEndX = wristX - Math.cos(lowerAngle) * cuffLen;
    const sleeveEndY = wristY - Math.sin(lowerAngle) * cuffLen;

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 1. Dark outline stroke of the continuous 2-segment arm
    ctx.strokeStyle = '#1b291f';
    ctx.lineWidth = 31 * scale;
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.lineTo(elbowX, elbowY);
    ctx.lineTo(sleeveEndX, sleeveEndY);
    ctx.stroke();

    // 2. Main tweed olive jacket sleeve fill (single continuous path so elbow never looks broken or disjointed!)
    const sleeveGrad = ctx.createLinearGradient(shoulderX, shoulderY - 15 * scale, wristX, wristY + 15 * scale);
    sleeveGrad.addColorStop(0, '#4a6b53');
    sleeveGrad.addColorStop(0.55, '#385340');
    sleeveGrad.addColorStop(1, '#293e2f');
    ctx.strokeStyle = sleeveGrad;
    ctx.lineWidth = 26 * scale;
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY);
    ctx.lineTo(elbowX, elbowY);
    ctx.lineTo(sleeveEndX, sleeveEndY);
    ctx.stroke();

    // 3. Soft top highlight along the sleeve for 3D cylindrical volume
    ctx.strokeStyle = 'rgba(130, 175, 140, 0.16)';
    ctx.lineWidth = 10 * scale;
    ctx.beginPath();
    ctx.moveTo(shoulderX, shoulderY - 3 * scale);
    ctx.lineTo(elbowX, elbowY - 3 * scale);
    ctx.lineTo(sleeveEndX, sleeveEndY - 2 * scale);
    ctx.stroke();

    // 4. Crisp cream dress-shirt cuff at the wrist
    ctx.strokeStyle = '#d5c7b2';
    ctx.lineWidth = 20 * scale;
    ctx.beginPath();
    ctx.moveTo(sleeveEndX, sleeveEndY);
    ctx.lineTo(wristX, wristY);
    ctx.stroke();

    ctx.strokeStyle = '#fbf6ec';
    ctx.lineWidth = 16.5 * scale;
    ctx.beginPath();
    ctx.moveTo(sleeveEndX, sleeveEndY);
    ctx.lineTo(wristX, wristY);
    ctx.stroke();

    // 5. Natural anatomical hand & fingers oriented upright relative to the forearm
    ctx.translate(wristX, wristY);
    ctx.rotate(lowerAngle);

    // Ensure the thumb always stays on the upper/inner anatomical side of the hand
    const handFlip = Math.cos(lowerAngle) < -0.25 ? -1 : 1;
    ctx.scale(1, handFlip);

    const skinFill = '#f1c2a0';
    const skinStroke = '#c28864';

    if (toolMode === 'sponge') {
      // Wooden blackboard sponge held firmly against the slate
      ctx.save();
      ctx.rotate(Math.sin(eraseProgress * Math.PI * 8) * 0.14);
      ctx.fillStyle = '#2d2624';
      ctx.beginPath();
      ctx.roundRect(2 * scale, -18 * scale, 48 * scale, 34 * scale, 6 * scale);
      ctx.fill();
      ctx.fillStyle = '#a46c38';
      ctx.strokeStyle = '#69411e';
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.roundRect(0, -14 * scale, 42 * scale, 26 * scale, 5 * scale);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Hand gripping the back of the wooden sponge handle
      ctx.fillStyle = skinFill;
      ctx.strokeStyle = skinStroke;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.roundRect(-2 * scale, -10 * scale, 22 * scale, 19 * scale, 8 * scale);
      ctx.fill();
      ctx.stroke();

      // Thumb wrapped over top
      ctx.beginPath();
      ctx.ellipse(12 * scale, -10 * scale, 7 * scale, 3.8 * scale, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (toolMode === 'chalk') {
      // Pastel chalk stick projecting from fingers to the exact drawing point
      ctx.save();
      ctx.rotate(-0.12);
      ctx.fillStyle = chalkColor || '#ffffff';
      ctx.strokeStyle = 'rgba(0,0,0,0.28)';
      ctx.lineWidth = 1.5 * scale;
      ctx.beginPath();
      ctx.roundRect(10 * scale, -5 * scale, 24 * scale, 7.5 * scale, 3 * scale);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Rounded palm
      ctx.fillStyle = skinFill;
      ctx.strokeStyle = skinStroke;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.roundRect(-2 * scale, -8 * scale, 19 * scale, 16 * scale, 7 * scale);
      ctx.fill();
      ctx.stroke();

      // Index & middle finger pinching chalk
      ctx.beginPath();
      ctx.ellipse(15 * scale, -4.5 * scale, 7.5 * scale, 3.4 * scale, 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Thumb supporting chalk below
      ctx.beginPath();
      ctx.ellipse(13 * scale, 3.5 * scale, 6.5 * scale, 3.4 * scale, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (toolMode === 'thumbsUp') {
      ctx.fillStyle = skinFill;
      ctx.strokeStyle = skinStroke;
      ctx.lineWidth = 2 * scale;
      // Raised thumb
      ctx.beginPath();
      ctx.roundRect(3 * scale, -18 * scale, 7.5 * scale, 14 * scale, 3.5 * scale);
      ctx.fill();
      ctx.stroke();
      // Warm closed fist
      ctx.beginPath();
      ctx.roundRect(-2 * scale, -8 * scale, 17 * scale, 16 * scale, 7 * scale);
      ctx.fill();
      ctx.stroke();
    } else {
      // Natural relaxed sculpted hand
      ctx.fillStyle = skinFill;
      ctx.strokeStyle = skinStroke;
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.roundRect(-2 * scale, -8 * scale, 18 * scale, 16 * scale, 7.5 * scale);
      ctx.fill();
      ctx.stroke();
      // Softly curved fingers
      ctx.beginPath();
      ctx.ellipse(15 * scale, -3 * scale, 6 * scale, 3 * scale, 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(15.5 * scale, 2 * scale, 6 * scale, 3 * scale, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }

  // Draw a realistic stitched brown leather Oxford shoe firmly on the floor
  function drawLeatherShoe(ankleX, ankleY, scale, dir = 1, liftY = 0, pitch = 0) {
    ctx.save();
    ctx.translate(ankleX, ankleY - liftY);
    ctx.rotate(pitch);
    ctx.scale(dir, 1);

    // Dark rubber/wooden heel & outsole at the bottom (y = 0 is ground contact level)
    ctx.fillStyle = '#1c110a';
    ctx.beginPath();
    ctx.roundRect(-16 * scale, -6 * scale, 52 * scale, 7 * scale, 2.5 * scale);
    ctx.fill();
    // Distinct heel block
    ctx.fillRect(-16 * scale, -5 * scale, 16 * scale, 7 * scale);

    // Polished cognac-brown leather shoe upper
    const shoeGrad = ctx.createLinearGradient(-15 * scale, -24 * scale, 34 * scale, -4 * scale);
    shoeGrad.addColorStop(0, '#6e3d1e');
    shoeGrad.addColorStop(0.55, '#8a4f28');
    shoeGrad.addColorStop(1, '#4f2a13');
    ctx.fillStyle = shoeGrad;
    ctx.strokeStyle = '#2b1508';
    ctx.lineWidth = 2.2 * scale;

    ctx.beginPath();
    ctx.moveTo(-15 * scale, -6 * scale);
    ctx.lineTo(-14 * scale, -22 * scale);
    ctx.quadraticCurveTo(-2 * scale, -24 * scale, 6 * scale, -20 * scale);
    ctx.quadraticCurveTo(20 * scale, -14 * scale, 33 * scale, -12 * scale);
    ctx.quadraticCurveTo(38 * scale, -9 * scale, 35 * scale, -6 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Toe cap seam & subtle leather shine highlight
    ctx.strokeStyle = 'rgba(255, 220, 185, 0.25)';
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.arc(24 * scale, -9 * scale, 7 * scale, Math.PI * 1.1, Math.PI * 1.85);
    ctx.stroke();

    // Shoe laces
    ctx.strokeStyle = '#241207';
    ctx.lineWidth = 1.8 * scale;
    for (let l = 0; l < 3; l++) {
      const lx = 4 * scale + l * 5 * scale;
      const ly = -19 * scale + l * 1.8 * scale;
      ctx.beginPath();
      ctx.moveTo(lx - 2 * scale, ly + 3 * scale);
      ctx.lineTo(lx + 2 * scale, ly - 2 * scale);
      ctx.stroke();
    }

    ctx.restore();
  }

  // Draw tailored trouser leg from hip -> knee -> ankle so knees bend naturally when walking
  function drawTrouserLeg(hipX, hipY, kneeX, kneeY, ankleX, ankleY, scale) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Dark trouser outline
    ctx.strokeStyle = '#120e0c';
    ctx.lineWidth = 34 * scale;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(kneeX, kneeY);
    ctx.lineTo(ankleX, ankleY - 18 * scale);
    ctx.stroke();

    // Charcoal-brown wool trouser fill
    const legGrad = ctx.createLinearGradient(hipX - 15 * scale, hipY, ankleX + 15 * scale, ankleY);
    legGrad.addColorStop(0, '#302520');
    legGrad.addColorStop(0.5, '#251c18');
    legGrad.addColorStop(1, '#1c1512');
    ctx.strokeStyle = legGrad;
    ctx.lineWidth = 29 * scale;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(kneeX, kneeY);
    ctx.lineTo(ankleX, ankleY - 18 * scale);
    ctx.stroke();

    // Trouser cuff hem above shoe
    ctx.fillStyle = '#251c18';
    ctx.strokeStyle = '#120e0c';
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.roundRect(ankleX - 16 * scale, ankleY - 24 * scale, 32 * scale, 9 * scale, 3 * scale);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawTeacher(boardRect, time) {
    const scale = Math.min(W / 1280, H / 720) * 0.96;
    const isWorkingOnBoard = (gameState === 'DRAWING' || gameState === 'ERASING');

    // Compute exact world coordinates of the chalk/sponge on the blackboard
    const toolWorldX = boardRect.x + (chalkBoardPos.x / boardCanvas.width) * boardRect.w;
    const toolWorldY = boardRect.y + (chalkBoardPos.y / boardCanvas.height) * boardRect.h;

    // Ground level on the wooden parquet floor where the teacher's shoes stand firmly!
    const groundY = H * 0.865;

    // Keep the teacher positioned comfortably to the left of the active chalk/sponge point
    // so his right arm ALWAYS extends naturally to the right without ever folding back on itself!
    const standLeftX = Math.max(115 * scale, boardRect.x - 82 * scale);
    const idealShoulderOffset = 132 * scale;
    const workBoardX = Math.max(
      boardRect.x - 45 * scale,
      Math.min(boardRect.x + boardRect.w - 75 * scale, toolWorldX - idealShoulderOffset)
    );
    const targetTeacherX = isWorkingOnBoard ? workBoardX : standLeftX;

    if (teacherPosX === null) {
      teacherPosX = targetTeacherX;
      teacherTurn = isWorkingOnBoard ? 1 : 0;
    }

    // Smoothly walk horizontally along the floor toward targetTeacherX
    const dxWalk = targetTeacherX - teacherPosX;
    const moveSpeed = isWorkingOnBoard ? 0.22 : 0.10;
    const stepDelta = dxWalk * moveSpeed;
    teacherPosX += stepDelta;

    const stepSpeed = Math.abs(stepDelta);
    if (stepSpeed > 0.35) {
      walkCycle += stepDelta * 0.065;
      if (Math.abs(Math.sin(walkCycle)) > 0.92) {
        playFootstepSound(false);
      }
    } else {
      walkCycle *= 0.82;
    }

    // Smoothly turn between facing the board (1) and facing the student (0)
    const targetTurn = isWorkingOnBoard ? 1 : 0;
    teacherTurn += (targetTurn - teacherTurn) * 0.16;

    // Subtle knee bend when drawing on the lower part of the board so his shoulder stays at an ideal height
    const lowBoardCrouch = isWorkingOnBoard
      ? Math.max(0, Math.min(28 * scale, (toolWorldY - (groundY - 310 * scale)) * 0.22))
      : 0;

    // Emotional animations when facing the student
    let headPitchY = 0;
    let headTiltRot = 0;
    let headShakeX = 0;
    let bodyBounceY = 0;
    let rightFootStompLift = 0;

    if (gameState === 'CORRECT') {
      headPitchY = Math.abs(Math.sin(stateTimer * 0.24)) * 14 * scale;
      headTiltRot = Math.sin(stateTimer * 0.12) * 0.06;
      bodyBounceY = -Math.abs(Math.sin(stateTimer * 0.24)) * 6 * scale;
    } else if (gameState === 'WRONG') {
      headShakeX = Math.sin(stateTimer * 0.42) * 10 * scale;
      headTiltRot = Math.sin(stateTimer * 0.42) * 0.08;
      // Angry foot stomp in the first 28 frames
      if (stateTimer < 28) {
        const stompPhase = (stateTimer / 28) * Math.PI * 2;
        rightFootStompLift = Math.max(0, Math.sin(stompPhase)) * 18 * scale;
        if (stateTimer === 14) {
          spawnStompDust(teacherPosX + 26 * scale, groundY);
        }
      }
    }

    const walkBobY = (stepSpeed > 0.35 ? Math.abs(Math.sin(walkCycle)) * 5 * scale : 0);
    const idleBreathY = Math.sin(time * 0.0028) * 2 * scale;

    const tx = teacherPosX;
    // Anchor torso height directly relative to groundY so legs ALWAYS reach the floor!
    const torsoY = groundY - 248 * scale + lowBoardCrouch - walkBobY + idleBreathY + bodyBounceY;
    const torsoX = tx;

    ctx.save();

    // =========================================================================
    // 1. FLOOR CONTACT SHADOW DIRECTLY UNDER THE TEACHER'S SHOES
    // =========================================================================
    ctx.save();
    const shadowGrad = ctx.createRadialGradient(tx, groundY - 2 * scale, 10 * scale, tx, groundY - 2 * scale, 78 * scale);
    shadowGrad.addColorStop(0, 'rgba(10, 5, 2, 0.62)');
    shadowGrad.addColorStop(0.65, 'rgba(10, 5, 2, 0.28)');
    shadowGrad.addColorStop(1, 'rgba(10, 5, 2, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(tx, groundY - 2 * scale, 76 * scale, 15 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // =========================================================================
    // 2. ARTICULATED LEGS (HIP -> KNEE -> ANKLE) & LEATHER OXFORD SHOES ON FLOOR
    // =========================================================================
    const walkStride = stepSpeed > 0.35 ? Math.sin(walkCycle) * 18 * scale : 0;
    const leftLift = stepSpeed > 0.35 ? Math.max(0, Math.cos(walkCycle)) * 11 * scale : 0;
    const rightLift = (stepSpeed > 0.35 ? Math.max(0, -Math.cos(walkCycle)) * 11 * scale : 0) + rightFootStompLift;

    const hipY = torsoY + 118 * scale;
    const leftHipX = torsoX - 24 * scale;
    const rightHipX = torsoX + 22 * scale;

    const leftAnkleX = leftHipX + walkStride;
    const leftAnkleY = groundY;
    const rightAnkleX = rightHipX - walkStride;
    const rightAnkleY = groundY;

    const leftKneeX = (leftHipX + leftAnkleX) * 0.5 + (teacherTurn > 0.5 ? 5 * scale : -3 * scale);
    const leftKneeY = (hipY + (leftAnkleY - leftLift)) * 0.5 - leftLift * 0.35 + lowBoardCrouch * 0.3;

    const rightKneeX = (rightHipX + rightAnkleX) * 0.5 + (teacherTurn > 0.5 ? 7 * scale : 4 * scale);
    const rightKneeY = (hipY + (rightAnkleY - rightLift)) * 0.5 - rightLift * 0.35 + lowBoardCrouch * 0.3;

    // Draw legs and leather shoes
    drawTrouserLeg(leftHipX, hipY, leftKneeX, leftKneeY, leftAnkleX, leftAnkleY - leftLift, scale);
    drawTrouserLeg(rightHipX, hipY, rightKneeX, rightKneeY, rightAnkleX, rightAnkleY - rightLift, scale);

    const leftShoeDir = teacherTurn > 0.5 ? 1 : -1;
    const rightShoeDir = 1;
    drawLeatherShoe(leftAnkleX, leftAnkleY, scale, leftShoeDir, leftLift, leftLift > 1 ? -0.08 : 0);
    drawLeatherShoe(rightAnkleX, rightAnkleY, scale, rightShoeDir, rightLift, rightLift > 1 ? 0.1 : 0);

    // Render floor stomp dust puffs if any
    for (let i = stompDust.length - 1; i >= 0; i--) {
      const sd = stompDust[i];
      sd.x += sd.vx;
      sd.y += sd.vy;
      sd.r += 0.35;
      sd.alpha -= 0.028;
      if (sd.alpha <= 0) {
        stompDust.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = sd.alpha;
      ctx.fillStyle = '#d8c3a5';
      ctx.beginPath();
      ctx.arc(sd.x, sd.y, sd.r * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // =========================================================================
    // MODE A: TEACHER TURNED TOWARD BLACKBOARD (3/4 Back View while Drawing/Erasing)
    // =========================================================================
    if (teacherTurn > 0.5) {
      // Left arm resting naturally along his left side (elbow gently down & left)
      const leftShoulderX = torsoX - 46 * scale;
      const leftShoulderY = torsoY - 46 * scale;
      const leftWristTargetX = torsoX - 58 * scale;
      const leftWristTargetY = torsoY + 52 * scale;
      const leftIK = solveNaturalArmIK(
        leftShoulderX,
        leftShoulderY,
        leftWristTargetX,
        leftWristTargetY,
        62 * scale,
        60 * scale,
        'leftOut'
      );
      drawContinuousArm(leftIK, scale, 'relaxed', null);

      // Neck (seen from 3/4 back)
      ctx.fillStyle = '#e6b48e';
      ctx.beginPath();
      ctx.roundRect(torsoX - 17 * scale, torsoY - 98 * scale, 34 * scale, 36 * scale, 10 * scale);
      ctx.fill();

      // Back of Tweed Emerald-Olive Jacket (with tailored center seam & vents)
      const backGrad = ctx.createLinearGradient(torsoX - 66 * scale, torsoY - 75 * scale, torsoX + 66 * scale, torsoY + 135 * scale);
      backGrad.addColorStop(0, '#46664f');
      backGrad.addColorStop(0.6, '#314937');
      backGrad.addColorStop(1, '#203125');
      ctx.fillStyle = backGrad;
      ctx.beginPath();
      ctx.moveTo(torsoX - 58 * scale, torsoY - 62 * scale);
      ctx.quadraticCurveTo(torsoX, torsoY - 78 * scale, torsoX + 58 * scale, torsoY - 62 * scale);
      ctx.lineTo(torsoX + 64 * scale, torsoY + 135 * scale);
      ctx.lineTo(torsoX - 64 * scale, torsoY + 135 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#1b291f';
      ctx.lineWidth = 3 * scale;
      ctx.stroke();

      // White shirt collar ring visible above back of jacket collar
      ctx.fillStyle = '#fbf6ec';
      ctx.beginPath();
      ctx.roundRect(torsoX - 24 * scale, torsoY - 78 * scale, 48 * scale, 10 * scale, 5 * scale);
      ctx.fill();

      // Jacket back collar & vertical center tailor seam
      ctx.fillStyle = '#263a2c';
      ctx.beginPath();
      ctx.roundRect(torsoX - 28 * scale, torsoY - 72 * scale, 56 * scale, 12 * scale, 6 * scale);
      ctx.fill();

      ctx.strokeStyle = 'rgba(18, 29, 21, 0.7)';
      ctx.lineWidth = 2.5 * scale;
      ctx.beginPath();
      ctx.moveTo(torsoX + 3 * scale, torsoY - 60 * scale);
      ctx.lineTo(torsoX + 3 * scale, torsoY + 132 * scale);
      ctx.stroke();

      // Head turned toward the blackboard (3/4 Back View of Head, Hair, Right Ear & Eyeglass Temple)
      const headX = torsoX + 6 * scale;
      const headY = torsoY - 138 * scale + Math.sin(time * 0.008) * 2 * scale;
      ctx.save();
      ctx.translate(headX, headY);
      ctx.rotate(0.06);

      ctx.fillStyle = '#e6b48e';
      ctx.beginPath();
      ctx.ellipse(10 * scale, 2 * scale, 42 * scale, 48 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // Right temple of brass glasses visible from 3/4 back view
      ctx.strokeStyle = '#c99649';
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.moveTo(32 * scale, -6 * scale);
      ctx.lineTo(52 * scale, -10 * scale);
      ctx.stroke();

      // Full sculpted wavy brown hair covering the back and crown of the head
      const hairGrad = ctx.createRadialGradient(-10 * scale, -20 * scale, 8 * scale, 0, 0, 58 * scale);
      hairGrad.addColorStop(0, '#5e412d');
      hairGrad.addColorStop(0.7, '#432d1e');
      hairGrad.addColorStop(1, '#2d1d12');
      ctx.fillStyle = hairGrad;
      ctx.beginPath();
      ctx.ellipse(-2 * scale, -6 * scale, 49 * scale, 51 * scale, -0.08, 0, Math.PI * 2);
      ctx.fill();

      // Natural hair texture waves on the back of head
      ctx.strokeStyle = 'rgba(30, 18, 10, 0.5)';
      ctx.lineWidth = 2.2 * scale;
      ctx.beginPath();
      ctx.arc(-8 * scale, -12 * scale, 28 * scale, 0.3, 2.2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(4 * scale, 4 * scale, 24 * scale, 0.5, 2.5);
      ctx.stroke();

      // Right ear (closest to the board)
      ctx.fillStyle = '#eab893';
      ctx.strokeStyle = '#c28b66';
      ctx.lineWidth = 1.8 * scale;
      ctx.beginPath();
      ctx.ellipse(36 * scale, 3 * scale, 8.5 * scale, 14.5 * scale, 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.restore();

      // RIGHT DRAWING / ERASING ARM:
      // Connected seamlessly to the right shoulder, with gravity-stabilized elbow ALWAYS below the shoulder-hand line!
      const rShoulderX = torsoX + 46 * scale;
      const rShoulderY = torsoY - 46 * scale;
      const upperArmLen = 76 * scale;
      const lowerArmLen = 74 * scale;

      const tipOffsetX = gameState === 'ERASING' ? -18 * scale : -28 * scale;
      const tipOffsetY = gameState === 'ERASING' ? 4 * scale : 8 * scale;

      // Guarantee target is to the right of the shoulder so the arm never crosses backward over his own back
      const safeTargetX = Math.max(rShoulderX + 32 * scale, toolWorldX + tipOffsetX);
      const safeTargetY = toolWorldY + tipOffsetY;

      const rightIK = solveNaturalArmIK(
        rShoulderX,
        rShoulderY,
        safeTargetX,
        safeTargetY,
        upperArmLen,
        lowerArmLen,
        'down' // strictly chooses the gravity-downward elbow!
      );

      drawContinuousArm(
        rightIK,
        scale,
        gameState === 'ERASING' ? 'sponge' : 'chalk',
        activeChalkColor
      );

      ctx.restore();
      return;
    }

    // =========================================================================
    // MODE B: TEACHER FACING STUDENT (Front View for Waiting, Happy Nodding & Angry Reactions)
    // =========================================================================

    // Neck
    ctx.fillStyle = gameState === 'WRONG' ? '#eba08e' : '#f1c2a0';
    ctx.beginPath();
    ctx.roundRect(torsoX - 18 * scale, torsoY - 98 * scale, 36 * scale, 38 * scale, 10 * scale);
    ctx.fill();

    // Jacket Body (Rich emerald-olive academic blazer with warm cream shirt & burgundy tie)
    const jacketGrad = ctx.createLinearGradient(torsoX - 66 * scale, torsoY - 75 * scale, torsoX + 66 * scale, torsoY + 135 * scale);
    jacketGrad.addColorStop(0, '#4a6b53');
    jacketGrad.addColorStop(0.6, '#344e3b');
    jacketGrad.addColorStop(1, '#233628');
    ctx.fillStyle = jacketGrad;
    ctx.beginPath();
    ctx.moveTo(torsoX - 58 * scale, torsoY - 62 * scale);
    ctx.quadraticCurveTo(torsoX, torsoY - 78 * scale, torsoX + 58 * scale, torsoY - 62 * scale);
    ctx.lineTo(torsoX + 66 * scale, torsoY + 135 * scale);
    ctx.lineTo(torsoX - 66 * scale, torsoY + 135 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#1d2d22';
    ctx.lineWidth = 3 * scale;
    ctx.stroke();

    // Cream dress shirt V-neck & collar
    ctx.fillStyle = '#fbf6ec';
    ctx.beginPath();
    ctx.moveTo(torsoX - 24 * scale, torsoY - 70 * scale);
    ctx.lineTo(torsoX + 24 * scale, torsoY - 70 * scale);
    ctx.lineTo(torsoX, torsoY + 12 * scale);
    ctx.closePath();
    ctx.fill();

    // Silk burgundy tie
    ctx.fillStyle = '#9b2226';
    ctx.beginPath();
    ctx.moveTo(torsoX - 7 * scale, torsoY - 62 * scale);
    ctx.lineTo(torsoX + 7 * scale, torsoY - 62 * scale);
    ctx.lineTo(torsoX + 10 * scale, torsoY - 4 * scale);
    ctx.lineTo(torsoX, torsoY + 14 * scale);
    ctx.lineTo(torsoX - 10 * scale, torsoY - 4 * scale);
    ctx.closePath();
    ctx.fill();

    // Jacket Lapels
    ctx.strokeStyle = '#25392a';
    ctx.lineWidth = 4 * scale;
    ctx.beginPath();
    ctx.moveTo(torsoX - 26 * scale, torsoY - 68 * scale);
    ctx.lineTo(torsoX - 36 * scale, torsoY - 22 * scale);
    ctx.lineTo(torsoX, torsoY + 14 * scale);
    ctx.lineTo(torsoX + 36 * scale, torsoY - 22 * scale);
    ctx.lineTo(torsoX + 26 * scale, torsoY - 68 * scale);
    ctx.stroke();

    // Both shoulders anchored inside the upper jacket
    const leftShoulderX = torsoX - 48 * scale;
    const leftShoulderY = torsoY - 46 * scale;
    const rightShoulderX = torsoX + 48 * scale;
    const rightShoulderY = torsoY - 46 * scale;
    const armUpper = 60 * scale;
    const armLower = 58 * scale;

    if (gameState === 'CORRECT') {
      // Warm celebratory posture: left arm relaxed at side, right arm raised in a friendly thumbs-up with elbow strictly downward
      const wave = Math.sin(stateTimer * 0.24) * 5 * scale;
      const leftIK = solveNaturalArmIK(
        leftShoulderX,
        leftShoulderY,
        leftShoulderX - 22 * scale,
        torsoY + 50 * scale,
        armUpper,
        armLower,
        'leftOut'
      );
      const rightIK = solveNaturalArmIK(
        rightShoulderX,
        rightShoulderY,
        rightShoulderX + 54 * scale,
        rightShoulderY - 6 * scale + wave,
        armUpper,
        armLower,
        'down'
      );
      drawContinuousArm(leftIK, scale, 'relaxed', null);
      drawContinuousArm(rightIK, scale, 'thumbsUp', null);
    } else if (gameState === 'WRONG') {
      // Classic grumpy teacher hands-on-hips pose with elbows naturally outward
      const leftIK = solveNaturalArmIK(
        leftShoulderX,
        leftShoulderY,
        torsoX - 44 * scale,
        torsoY + 38 * scale,
        armUpper,
        armLower,
        'leftOut'
      );
      const rightIK = solveNaturalArmIK(
        rightShoulderX,
        rightShoulderY,
        torsoX + 44 * scale,
        torsoY + 38 * scale,
        armUpper,
        armLower,
        'rightOut'
      );
      drawContinuousArm(leftIK, scale, 'relaxed', null);
      drawContinuousArm(rightIK, scale, 'relaxed', null);
    } else {
      // Calm, natural teacher posture while waiting for student's answer:
      // Left hand resting cleanly by jacket pocket, right hand holding chalk comfortably toward the board
      const gestureBob = Math.sin(time * 0.003) * 3.5 * scale;
      const leftIK = solveNaturalArmIK(
        leftShoulderX,
        leftShoulderY,
        leftShoulderX - 18 * scale,
        torsoY + 52 * scale,
        armUpper,
        armLower,
        'leftOut'
      );
      const rightIK = solveNaturalArmIK(
        rightShoulderX,
        rightShoulderY,
        rightShoulderX + 46 * scale,
        torsoY + 18 * scale + gestureBob,
        armUpper,
        armLower,
        'down'
      );
      drawContinuousArm(leftIK, scale, 'relaxed', null);
      drawContinuousArm(rightIK, scale, 'chalk', '#ffffff');
    }

    // ====================================================
    // TEACHER'S HEAD & EXPRESSIVE ANATOMICAL FACE
    // ====================================================
    const headX = torsoX + headShakeX;
    const headY = torsoY - 140 * scale + headPitchY * 0.45;

    ctx.save();
    ctx.translate(headX, headY);
    ctx.rotate(headTiltRot);

    // Back hair volume
    ctx.fillStyle = '#4a3222';
    ctx.beginPath();
    ctx.ellipse(0, -14 * scale, 56 * scale, 54 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ears
    ctx.fillStyle = gameState === 'WRONG' ? '#eb9886' : '#f1c2a0';
    ctx.beginPath();
    ctx.ellipse(-49 * scale, 2 * scale, 9 * scale, 15 * scale, -0.1, 0, Math.PI * 2);
    ctx.ellipse(49 * scale, 2 * scale, 9 * scale, 15 * scale, 0.1, 0, Math.PI * 2);
    ctx.fill();

    // Face shape (flushes reddish when WRONG)
    const faceGrad = ctx.createRadialGradient(-8 * scale, -10 * scale, 10 * scale, 0, 0, 56 * scale);
    if (gameState === 'WRONG') {
      faceGrad.addColorStop(0, '#f7b2a1');
      faceGrad.addColorStop(1, '#e07a68');
    } else {
      faceGrad.addColorStop(0, '#fae0c8');
      faceGrad.addColorStop(1, '#e6b48e');
    }
    ctx.fillStyle = faceGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 47 * scale, 54 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Rosy cheeks
    ctx.fillStyle = gameState === 'WRONG' ? 'rgba(220, 45, 45, 0.36)' : 'rgba(235, 115, 95, 0.24)';
    ctx.beginPath();
    ctx.ellipse(-25 * scale, 12 * scale + headPitchY * 0.18, 12 * scale, 7 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(25 * scale, 12 * scale + headPitchY * 0.18, 12 * scale, 7 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    const fY = headPitchY * 0.35;

    // Eyes & Pupils looking warmly at the student
    [-18 * scale, 18 * scale].forEach((ex) => {
      if (gameState === 'CORRECT') {
        ctx.strokeStyle = '#2d1e14';
        ctx.lineWidth = 3.5 * scale;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(ex, -6 * scale + fY, 9 * scale, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(ex, -6 * scale + fY, 10 * scale, 7.5 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#3b5249';
        ctx.beginPath();
        ctx.arc(ex, -6 * scale + fY, 4.8 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#121417';
        ctx.beginPath();
        ctx.arc(ex, -6 * scale + fY, 2.4 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ex - 1.5 * scale, -8 * scale + fY, 1.4 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#3d2516';
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        ctx.arc(ex, -6 * scale + fY, 10 * scale, Math.PI * 1.08, Math.PI * 1.92);
        ctx.stroke();
      }
    });

    // Expressive Eyebrows
    ctx.strokeStyle = '#3b2416';
    ctx.lineWidth = 4.2 * scale;
    ctx.lineCap = 'round';
    if (gameState === 'WRONG') {
      ctx.beginPath();
      ctx.moveTo(-31 * scale, -22 * scale + fY);
      ctx.lineTo(-8 * scale, -13 * scale + fY);
      ctx.moveTo(31 * scale, -22 * scale + fY);
      ctx.lineTo(8 * scale, -13 * scale + fY);
      ctx.stroke();
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      ctx.moveTo(-3 * scale, -22 * scale + fY);
      ctx.lineTo(-3 * scale, -14 * scale + fY);
      ctx.moveTo(3 * scale, -22 * scale + fY);
      ctx.lineTo(3 * scale, -14 * scale + fY);
      ctx.stroke();
    } else if (gameState === 'CORRECT') {
      ctx.beginPath();
      ctx.moveTo(-29 * scale, -21 * scale + fY);
      ctx.quadraticCurveTo(-18 * scale, -29 * scale + fY, -7 * scale, -21 * scale + fY);
      ctx.moveTo(7 * scale, -21 * scale + fY);
      ctx.quadraticCurveTo(18 * scale, -29 * scale + fY, 29 * scale, -21 * scale + fY);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-29 * scale, -18 * scale + fY);
      ctx.quadraticCurveTo(-18 * scale, -24 * scale + fY, -7 * scale, -19 * scale + fY);
      ctx.moveTo(7 * scale, -19 * scale + fY);
      ctx.quadraticCurveTo(18 * scale, -24 * scale + fY, 29 * scale, -18 * scale + fY);
      ctx.stroke();
    }

    // Vintage Brass-Rimmed Glasses
    ctx.strokeStyle = '#c99649';
    ctx.lineWidth = 2.6 * scale;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
    [-19 * scale, 19 * scale].forEach((gx) => {
      ctx.beginPath();
      ctx.roundRect(gx - 14 * scale, -16 * scale + fY, 28 * scale, 20 * scale, 7 * scale);
      ctx.fill();
      ctx.stroke();
    });
    ctx.beginPath();
    ctx.moveTo(-5 * scale, -7 * scale + fY);
    ctx.lineTo(5 * scale, -7 * scale + fY);
    ctx.stroke();

    // Sculpted Nose
    ctx.strokeStyle = '#c48b68';
    ctx.lineWidth = 2.6 * scale;
    ctx.beginPath();
    ctx.moveTo(-2 * scale, -4 * scale + fY);
    ctx.lineTo(-5 * scale, 9 * scale + fY);
    ctx.quadraticCurveTo(0, 12 * scale + fY, 4 * scale, 9 * scale + fY);
    ctx.stroke();

    // Expressive Mouth
    if (gameState === 'CORRECT') {
      ctx.fillStyle = '#8c2d2d';
      ctx.strokeStyle = '#5c1d1d';
      ctx.lineWidth = 2.5 * scale;
      ctx.beginPath();
      ctx.moveTo(-18 * scale, 21 * scale + fY);
      ctx.quadraticCurveTo(0, 38 * scale + fY, 18 * scale, 21 * scale + fY);
      ctx.quadraticCurveTo(0, 25 * scale + fY, -18 * scale, 21 * scale + fY);
      ctx.fill();
      ctx.stroke();
    } else if (gameState === 'WRONG') {
      ctx.fillStyle = '#6e2222';
      ctx.strokeStyle = '#4a1414';
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.moveTo(-17 * scale, 31 * scale + fY);
      ctx.quadraticCurveTo(0, 16 * scale + fY, 17 * scale, 31 * scale + fY);
      ctx.quadraticCurveTo(0, 26 * scale + fY, -17 * scale, 31 * scale + fY);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#7c3f2c';
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.moveTo(-13 * scale, 24 * scale + fY);
      ctx.quadraticCurveTo(0, 31 * scale + fY, 13 * scale, 24 * scale + fY);
      ctx.stroke();
    }

    // Styled Wavy Hair & Parting
    ctx.fillStyle = '#4a3222';
    ctx.beginPath();
    ctx.moveTo(-48 * scale, -8 * scale);
    ctx.quadraticCurveTo(-52 * scale, -54 * scale, -8 * scale, -58 * scale);
    ctx.quadraticCurveTo(46 * scale, -60 * scale, 49 * scale, -10 * scale);
    ctx.quadraticCurveTo(32 * scale, -34 * scale, 6 * scale, -36 * scale);
    ctx.quadraticCurveTo(-22 * scale, -40 * scale, -48 * scale, -8 * scale);
    ctx.fill();

    ctx.restore(); // End head transform

    // Render angry steam puffs if teacher is grumpy
    for (let i = angrySteam.length - 1; i >= 0; i--) {
      const st = angrySteam[i];
      st.ox += st.vx;
      st.oy += st.vy;
      st.r += 0.25;
      st.alpha -= 0.018;
      if (st.alpha <= 0) {
        angrySteam.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.fillStyle = '#f8f9fa';
      ctx.beginPath();
      ctx.arc(headX + st.ox * scale, headY - 60 * scale + st.oy * scale, st.r * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  // ========================================================
  // UPDATE LOOP: ERASING, CHALK DRAWING & PARTICLES
  // ========================================================
  function updateSimulation() {
    stateTimer++;

    if (gameState === 'ERASING') {
      const prevProg = eraseProgress;
      eraseProgress = Math.min(1, eraseProgress + 0.024);

      if (eraseProgress - lastEraseSoundProgress > 0.22) {
        playEraseSound();
        lastEraseSoundProgress = eraseProgress;
      }

      // Interpolate along the zigzag sponge path across the board
      const totalSegs = eraseWaypoints.length - 1;
      const exactPos = eraseProgress * totalSegs;
      const segIdx = Math.min(totalSegs - 1, Math.floor(exactPos));
      const segT = exactPos - segIdx;
      const pA = eraseWaypoints[segIdx];
      const pB = eraseWaypoints[segIdx + 1];

      const prevExact = prevProg * totalSegs;
      const prevIdx = Math.min(totalSegs - 1, Math.floor(prevExact));
      const prevT = prevExact - prevIdx;
      const prevX = eraseWaypoints[prevIdx][0] + (eraseWaypoints[prevIdx + 1][0] - eraseWaypoints[prevIdx][0]) * prevT;
      const prevY = eraseWaypoints[prevIdx][1] + (eraseWaypoints[prevIdx + 1][1] - eraseWaypoints[prevIdx][1]) * prevT;

      const curX = pA[0] + (pB[0] - pA[0]) * segT;
      const curY = pA[1] + (pB[1] - pA[1]) * segT;

      chalkBoardPos.x = curX;
      chalkBoardPos.y = curY;

      // Physically erase the chalk buffer along the sponge path!
      bCtx.save();
      bCtx.globalCompositeOperation = 'destination-out';
      bCtx.lineCap = 'round';
      bCtx.lineWidth = 175;
      bCtx.beginPath();
      bCtx.moveTo(prevX, prevY);
      bCtx.lineTo(curX, curY);
      bCtx.stroke();
      bCtx.restore();

      spawnChalkDust(curX, curY, 'rgba(235, 242, 238, 0.7)', 4);

      if (eraseProgress >= 1) {
        startDrawingCurrentItem();
      }
    } else if (gameState === 'DRAWING') {
      // Advance multiple sub-segments per frame so the realistic drawing finishes smoothly in ~2.2 seconds
      let pointsBudget = 5;
      while (pointsBudget > 0 && currentStrokeIdx < activeStrokes.length) {
        const st = activeStrokes[currentStrokeIdx];
        activeChalkColor = st.color;

        if (currentPointIdx < st.pts.length - 1) {
          const p1 = st.pts[currentPointIdx];
          const p2 = st.pts[currentPointIdx + 1];
          drawChalkSegmentOnBoard(p1, p2, st.color, st.width);
          chalkBoardPos.x = p2[0];
          chalkBoardPos.y = p2[1];
          currentPointIdx++;
          pointsBudget--;

          if (Math.random() < 0.35) {
            spawnChalkDust(p2[0], p2[1], st.color, 1);
          }
          playChalkScratch(1);
        } else {
          // Completed this stroke: apply soft pastel chalk fill if present
          if (st.fill) {
            drawChalkShadeFill(st.pts, st.fill);
          }
          currentStrokeIdx++;
          currentPointIdx = 0;
        }
      }

      if (currentStrokeIdx >= activeStrokes.length) {
        gameState = 'WAITING';
        stateTimer = 0;
      }
    } else if (gameState === 'CORRECT') {
      // After teacher finishes nodding approvingly, automatically erase and draw next item
      if (stateTimer > 105) {
        transitionToNewItem(nextFromDeck());
      }
    } else if (gameState === 'WRONG') {
      // Return from angry expression to waiting after ~1.1s so student can try again
      if (stateTimer > 68) {
        gameState = 'WAITING';
        stateTimer = 0;
      }
    }
  }

  function drawBoardParticles(boardRect) {
    // Chalk dust particles
    for (let i = chalkDust.length - 1; i >= 0; i--) {
      const p = chalkDust[i];
      p.bx += p.vx;
      p.by += p.vy;
      p.alpha -= 0.024;
      if (p.alpha <= 0) {
        chalkDust.splice(i, 1);
        continue;
      }
      const sx = boardRect.x + (p.bx / boardCanvas.width) * boardRect.w;
      const sy = boardRect.y + (p.by / boardCanvas.height) * boardRect.h;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Celebratory stars, musical notes & glowing chalk sparks
    for (let i = celebrationParticles.length - 1; i >= 0; i--) {
      const c = celebrationParticles[i];
      c.bx += c.vx;
      c.by += c.vy;
      c.vy += 0.16;
      c.rot += c.vRot;
      c.alpha -= 0.013;
      if (c.alpha <= 0) {
        celebrationParticles.splice(i, 1);
        continue;
      }
      const sx = boardRect.x + (c.bx / boardCanvas.width) * boardRect.w;
      const sy = boardRect.y + (c.by / boardCanvas.height) * boardRect.h;

      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(c.rot);
      ctx.globalAlpha = c.alpha;
      ctx.fillStyle = c.color;
      ctx.strokeStyle = c.color;

      if (c.kind === 'star') {
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const a1 = (k * 2 * Math.PI) / 5 - Math.PI / 2;
          const a2 = a1 + Math.PI / 5;
          ctx.lineTo(Math.cos(a1) * c.size, Math.sin(a1) * c.size);
          ctx.lineTo(Math.cos(a2) * (c.size * 0.45), Math.sin(a2) * (c.size * 0.45));
        }
        ctx.closePath();
        ctx.fill();
      } else if (c.kind === 'note') {
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.ellipse(-3, 4, 5, 3.8, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(1, 3);
        ctx.lineTo(1, -10);
        ctx.lineTo(8, -7);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, c.size * 0.42, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ========================================================
  // MAIN ANIMATION LOOP
  // ========================================================
  function animate(time) {
    updateSimulation();

    ctx.clearRect(0, 0, W, H);
    drawClassroomBackground(time);

    const boardRect = getBoardRect();
    drawBlackboard(boardRect);
    drawBoardParticles(boardRect);
    drawTeacher(boardRect, time);

    requestAnimationFrame(animate);
  }

  // Start the infinite randomized generator with the first chalk drawing
  window.onload = () => {
    currentItem = nextFromDeck();
    updateLanguageUI();
    startDrawingCurrentItem();
    requestAnimationFrame(animate);
  };
})();
</script>
