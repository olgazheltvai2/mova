<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Звукові доріжки — Літера Р</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 12% 0%,  rgba(56,189,248,.22), transparent 55%),
      radial-gradient(ellipse at 92% 100%, rgba(244,63,94,.18),  transparent 55%),
      radial-gradient(ellipse at 80% 8%,  rgba(251,191,36,.13), transparent 45%),
      #0a0f1e;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 28px;
    gap: 16px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    width: 100%;
    max-width: 1000px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .dots { display: flex; gap: 9px; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%;
    border: none; padding: 0; cursor: pointer;
    background: rgba(148,163,184,.3);
    transition: .22s;
  }
  .dot:hover { background: rgba(148,163,184,.6); }
  .dot.active {
    background: #38bdf8;
    transform: scale(1.35);
    box-shadow: 0 0 12px rgba(56,189,248,.8);
  }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56,189,248,.12);
    color: #38bdf8;
    font: italic 800 21px/1 Georgia, 'Times New Roman', serif;
    cursor: pointer;
    transition: .2s;
  }
  .icon-btn:hover { background: #38bdf8; color: #0a0f1e; box-shadow: 0 0 20px rgba(56,189,248,.6); }

  /* ---------- stage ---------- */
  .stage {
    width: 100%;
    max-width: 1040px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .slide-wrap { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }

  .nav-btn {
    flex: 0 0 auto;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid rgba(148,163,184,.3);
    background: rgba(255,255,255,.05);
    color: #cbd5e1;
    display: grid; place-items: center;
    cursor: pointer;
    transition: .2s;
  }
  .nav-btn:hover:not(:disabled) { background: #38bdf8; border-color: #38bdf8; color: #0a0f1e; }
  .nav-btn:disabled { opacity: .2; cursor: default; }

  /* ---------- sheet ---------- */
  .sheet {
    width: 880px;
    max-width: 100%;
    background: #fff;
    border-radius: 18px;
    padding: 16px 18px 18px;
    box-shadow: 0 26px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
    display: none;
  }
  .sheet.active { display: block; }

  .frame-outer { border: 2.5px solid #1f2937; border-radius: 10px; padding: 6px; }
  .frame-inner {
    position: relative;
    width: 100%;
    aspect-ratio: 880 / 470;
    border: 2.5px dashed #64748b;
    border-radius: 6px;
    background: #fff;
    overflow: hidden;
  }
  .phoneme {
    position: absolute;
    top: 4%; left: 3.5%;
    z-index: 2;
    font-size: clamp(22px, 4.2vw, 44px);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: 1px;
    color: #334155;
    pointer-events: none;
  }
  .board-svg { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }

  /* ---------- edges ---------- */
  .edge {
    stroke: #94a3b8;
    stroke-width: 3;
    stroke-dasharray: 7 5;
    stroke-linecap: round;
    transition: .25s;
  }
  .edge.active {
    stroke: #dc2626;
    stroke-width: 5.5;
    stroke-dasharray: none;
    filter: drop-shadow(0 0 6px rgba(220,38,38,.45));
  }

  /* ---------- nodes ---------- */
  .node-group { cursor: pointer; }
  .node-circle {
    fill: #fff;
    stroke: #94a3b8;
    stroke-width: 2.5;
    transition: .22s;
  }
  .node-group:not(.start):not(.finish):hover .node-circle {
    stroke: #38bdf8;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.18));
  }
  .node-group.active .node-circle {
    stroke: #dc2626;
    stroke-width: 5.5;
    fill: #fef2f2;
  }
  .node-group.start .node-circle,
  .node-group.finish .node-circle { cursor: default; }

  /* wrong click feedback */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .node-group.wrong .node-inner { animation: shake .45s ease; }
  .node-group.wrong .node-circle { stroke: #ef4444; fill: #fee2e2; }

  /* finish glow */
  .node-group.finish .node-inner > path { transition: .35s; }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(34,197,94,.5)); }
    50%      { filter: drop-shadow(0 0 20px rgba(34,197,94,.95)); }
  }
  .sheet.solved .node-group.finish .node-inner > path {
    fill: #dcfce7;
    stroke: #22c55e;
    stroke-width: 3;
    animation: glowPulse 1.6s ease-in-out infinite;
  }

  /* ---------- modal ---------- */
  .modal {
    position: fixed; inset: 0;
    background: rgba(2,6,23,.78);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal.open { display: flex; }
  .modal-card {
    background: #fff;
    color: #1e293b;
    width: 100%; max-width: 520px;
    border-radius: 20px;
    padding: 28px 30px 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.7);
    animation: pop .25s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  .modal-card h2 { font-size: 20px; color: #0f172a; margin-bottom: 14px; letter-spacing: .3px; }
  #modalTask {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    color: #b91c1c;
    margin-bottom: 14px;
  }
  .modal-hint { font-size: 15px; line-height: 1.55; color: #475569; margin-bottom: 22px; }
  .modal-close {
    display: block; width: 100%;
    padding: 12px; border: none; border-radius: 12px;
    background: #0ea5e9; color: #fff;
    font-size: 16px; font-weight: 700;
    cursor: pointer; transition: .2s;
  }
  .modal-close:hover { background: #0284c7; }

  @media (max-width: 720px) {
    .nav-btn { width: 40px; height: 40px; }
    .stage { gap: 8px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="dots" id="dots"></div>
  <button class="icon-btn" id="infoBtn" title="Інструкція" aria-label="Інструкція">i</button>
</div>

<main class="stage">
  <button class="nav-btn" id="prevBtn" aria-label="Назад">
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="slide-wrap" id="app"></div>

  <button class="nav-btn" id="nextBtn" aria-label="Далі">
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</main>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2>Як грати</h2>
    <p id="modalTask"></p>
    <p class="modal-hint">Натискай на картинки по черзі — так ти прокладеш доріжку від старту до фінішу. Якщо натиснути на картинку ще раз, вона зніметься з доріжки.</p>
    <button class="modal-close" id="modalClose">Зрозуміло</button>
  </div>
</div>

/* ====================== РЕНДЕР ====================== */

let current = 0;

function buildEdges(bi) {
  return BOARDS[bi].edges.map(([u, v]) => {
    const [x1, y1] = COORDS[u], [x2, y2] = COORDS[v];
    return `<line id="e-${bi}-${u}-${v}" class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  }).join('');
}

function buildNodes(bi) {
  const nodes = BOARDS[bi].nodes;
  return Object.keys(nodes).map(k => {
    const info = nodes[k];
    const [x, y] = COORDS[k];
    const isEnd = (k === 'S' || k === 'E');
    const cls = 'node-group' + (k === 'S' ? ' start' : k === 'E' ? ' finish' : '');
    return `<g id="n-${bi}-${k}" class="${cls}" transform="translate(${x},${y})" onclick="clickNode(${bi},'${k}')">
      <g class="node-inner">
        ${isEnd
          ? `<path d="M-68,-30 C-50,-75 55,-75 70,-25 C85,25 55,75 -10,70 C-65,65 -85,15 -68,-30 Z" fill="#e6f4fa"/>`
          : `<circle class="node-circle" r="44"/>`}
        <g transform="scale(${isEnd ? 1.15 : 0.92})">${ICONS[info.icon]}</g>
      </g>
    </g>`;
  }).join('');
}

function render() {
  document.getElementById('app').innerHTML = BOARDS.map((b, bi) => `
    <div class="sheet ${bi === 0 ? 'active' : ''}" data-bi="${bi}">
      <div class="frame-outer">
        <div class="frame-inner">
          <div class="phoneme">${b.phoneme}</div>
          <svg class="board-svg" viewBox="0 0 880 470" preserveAspectRatio="xMidYMid meet">
            ${DEFS}${buildEdges(bi)}${buildNodes(bi)}
          </svg>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('dots').innerHTML = BOARDS.map((_, i) =>
    `<button class="dot ${i === 0 ? 'active' : ''}" onclick="gotoSlide(${i})" aria-label="Завдання ${i + 1}"></button>`
  ).join('');

  updateSlide();
}

function updateSlide() {
  document.querySelectorAll('.sheet').forEach((el, i) => el.classList.toggle('active', i === current));
  document.querySelectorAll('.dot').forEach((el, i) => el.classList.toggle('active', i === current));
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === BOARDS.length - 1;
}

function gotoSlide(i) { current = i; updateSlide(); }
function moveSlide(d) {
  const n = current + d;
  if (n >= 0 && n < BOARDS.length) { current = n; updateSlide(); }
}

/* ====================== ЛОГІКА ГРИ ====================== */

function isOn(bi, k) {
  if (k === 'S' || k === 'E') return true;
  const g = document.getElementById(`n-${bi}-${k}`);
  return !!g && g.classList.contains('active');
}

function refresh(bi) {
  // Підсвічуємо ребра, які є частиною `edges` і з'єднують дві увімкнені картинки
  BOARDS[bi].edges.forEach(([u, v]) => {
    const line = document.getElementById(`e-${bi}-${u}-${v}`);
    if (!line) return;
    line.classList.toggle('active', isOn(bi, u) && isOn(bi, v));
  });

  const sheet = document.querySelector(`.sheet[data-bi="${bi}"]`);
  if (sheet) sheet.classList.toggle('solved', isSolved(bi));
}

function isSolved(bi) {
  const adj = {};
  BOARDS[bi].edges.forEach(([u, v]) => {
    if (!isOn(bi, u) || !isOn(bi, v)) return;
    (adj[u] = adj[u] || []).push(v);
    (adj[v] = adj[v] || []).push(u);
  });
  const seen = new Set(['S']);
  const queue = ['S'];
  while (queue.length) {
    const cur = queue.shift();
    if (cur === 'E') return true;
    (adj[cur] || []).forEach(nxt => {
      if (!seen.has(nxt)) { seen.add(nxt); queue.push(nxt); }
    });
  }
  return false;
}

function clickNode(bi, k) {
  if (k === 'S' || k === 'E') return;

  const g = document.getElementById(`n-${bi}-${k}`);
  const info = BOARDS[bi].nodes[k];

  if (!info.ok) {
    g.classList.remove('wrong');
    void g.getBoundingClientRect();
    g.classList.add('wrong');
    clearTimeout(g._wrongTimer);
    g._wrongTimer = setTimeout(() => g.classList.remove('wrong'), 500);
    return;
  }

  g.classList.toggle('active');
  refresh(bi);
}

/* ====================== UI ====================== */

const modal = document.getElementById('modal');

function openInfo() {
  document.getElementById('modalTask').innerHTML = BOARDS[current].title;
  modal.classList.add('open');
}

document.getElementById('infoBtn').addEventListener('click', openInfo);
document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

document.getElementById('prevBtn').addEventListener('click', () => moveSlide(-1));
document.getElementById('nextBtn').addEventListener('click', () => moveSlide(1));

render();
</script>
