<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ЦаП ХоЧе ФіСТашКи</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,700;1,700&family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a2e19;
      font-family: 'Rubik', sans-serif;
    }

    #game-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient floating animations */
    @keyframes swaySlow {
      0%, 100% { transform: rotate(-2.2deg); }
      50% { transform: rotate(2.5deg); }
    }

    @keyframes swayBranch {
      0%, 100% { transform: rotate(-1.5deg) translateY(0px); }
      50% { transform: rotate(2deg) translateY(4px); }
    }

    @keyframes pulseWave {
      0% { transform: scale(0.75); opacity: 0.85; }
      100% { transform: scale(1.65); opacity: 0; }
    }

    @keyframes floatHint {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    @keyframes jellyPlaque {
      0%, 100% { transform: scale(1, 1) rotate(0deg); }
      20% { transform: scale(1.08, 0.91) rotate(-3deg); }
      40% { transform: scale(0.93, 1.07) rotate(3deg); }
      60% { transform: scale(1.04, 0.96) rotate(-1.5deg); }
      80% { transform: scale(0.98, 1.02) rotate(1deg); }
    }

    @keyframes shakePlaque {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      15% { transform: translateX(-16px) rotate(-4deg); }
      30% { transform: translateX(14px) rotate(3.5deg); }
      45% { transform: translateX(-12px) rotate(-2.5deg); }
      60% { transform: translateX(10px) rotate(2deg); }
      75% { transform: translateX(-6px) rotate(-1deg); }
    }

    @keyframes flipPlaque {
      0% { transform: perspective(900px) rotateX(0deg) scale(1); }
      48% { transform: perspective(900px) rotateX(88deg) scale(0.92); }
      52% { transform: perspective(900px) rotateX(-88deg) scale(0.92); }
      100% { transform: perspective(900px) rotateX(0deg) scale(1); }
    }

    @keyframes ringBell {
      0%, 100% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(16deg) scale(1.08); }
      30% { transform: rotate(-15deg) scale(1.08); }
      45% { transform: rotate(12deg) scale(1.05); }
      60% { transform: rotate(-9deg) scale(1.04); }
      75% { transform: rotate(5deg) scale(1.02); }
    }

    @keyframes letterCluePulse {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-14px) scale(1.25) rotate(-5deg); color: #ff5733; text-shadow: 0 0 18px rgba(255, 87, 51, 0.9); }
      70% { transform: translateY(3px) scale(1.1) rotate(4deg); color: #ff7847; }
    }

    @keyframes letterVoicedGlow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.16); color: #ffe566; text-shadow: 0 0 22px rgba(255, 225, 80, 0.95); }
    }

    .sway-branch {
      transform-origin: 0% 10%;
      animation: swayBranch 6.5s ease-in-out infinite;
    }

    .sway-grass-1 {
      transform-origin: bottom center;
      animation: swaySlow 4.8s ease-in-out infinite;
    }

    .sway-grass-2 {
      transform-origin: bottom center;
      animation: swaySlow 6.2s ease-in-out infinite reverse;
    }

    .plaque-jelly {
      animation: jellyPlaque 0.72s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    .plaque-shake {
      animation: shakePlaque 0.65s ease-in-out;
    }

    .plaque-flip {
      animation: flipPlaque 0.62s ease-in-out;
    }

    .bell-ringing {
      animation: ringBell 0.7s ease-in-out;
    }

    /* Word Plaque Styling - Ornate Carved Wood & Hammered Brass (zero white rectangles) */
    .resonator-plaque {
      position: relative;
      background:
        radial-gradient(ellipse at 50% 25%, rgba(162, 104, 52, 0.55) 0%, rgba(74, 41, 17, 0.92) 72%, #2f1708 100%),
        repeating-linear-gradient(8deg, rgba(45, 22, 8, 0.25) 0px, rgba(45, 22, 8, 0.25) 4px, rgba(112, 66, 28, 0.2) 5px, rgba(112, 66, 28, 0.2) 12px);
      border-radius: 56px 64px 52px 60px / 44px 50px 48px 42px;
      border: 6px solid #b8863b;
      box-shadow:
        0 20px 40px rgba(10, 18, 8, 0.75),
        inset 0 4px 12px rgba(255, 218, 145, 0.45),
        inset 0 -10px 22px rgba(20, 8, 2, 0.85),
        0 0 0 4px #4a2810,
        0 0 0 8px rgba(214, 161, 74, 0.45);
      padding: clamp(1.1rem, 2.6vw, 2.2rem) clamp(2rem, 4.5vw, 4.2rem);
      min-width: clamp(300px, 44vw, 680px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    .resonator-plaque::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 48px 54px 44px 50px / 36px 42px 40px 34px;
      border: 2px dashed rgba(235, 188, 104, 0.42);
      pointer-events: none;
    }

    .word-letter {
      display: inline-block;
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 6.2vw, 6.2rem);
      line-height: 1.08;
      letter-spacing: 0.03em;
      color: #ffefd2;
      text-shadow:
        0 4px 0 #3d1e08,
        0 7px 14px rgba(0, 0, 0, 0.65),
        0 0 18px rgba(255, 209, 117, 0.25);
      transition: transform 0.2s ease, color 0.25s ease;
      cursor: pointer;
    }

    .word-letter:hover {
      transform: translateY(-5px) scale(1.07);
      color: #ffe28a;
    }

    .letter-clue {
      animation: letterCluePulse 0.85s ease-in-out;
    }

    .letter-voiced-win {
      animation: letterVoicedGlow 0.75s ease-in-out;
    }

    /* Interactive Choice Totems */
    .totem-btn {
      position: relative;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
      filter: drop-shadow(0 14px 20px rgba(8, 19, 8, 0.68));
    }

    .totem-btn:hover {
      transform: translateY(-7px) scale(1.06);
      filter: drop-shadow(0 20px 26px rgba(8, 19, 8, 0.8)) brightness(1.07);
    }

    .totem-btn:active {
      transform: translateY(2px) scale(0.95);
    }

    /* Goat Interactive Container */
    #goat-stage {
      cursor: pointer;
      filter: drop-shadow(0 22px 32px rgba(10, 22, 8, 0.72));
      transition: filter 0.25s ease;
    }

    #goat-stage:hover {
      filter: drop-shadow(0 24px 36px rgba(245, 194, 88, 0.32));
    }

    /* Hint Scroll Bubble */
    #hint-scroll {
      pointer-events: auto;
      cursor: pointer;
      transform-origin: bottom left;
      transition: opacity 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: floatHint 4.2s ease-in-out infinite;
    }

    .hint-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(0.35) translateY(40px) rotate(-12deg) !important;
    }

    .hint-visible {
      opacity: 1 !important;
      transform: scale(1) translateY(0px) rotate(0deg) !important;
    }

    .cons-char {
      color: #ff542e;
      font-weight: 900;
      text-shadow:
        0 2px 0 #3b0d02,
        0 0 14px rgba(255, 102, 51, 0.65);
      display: inline-block;
      transform: scale(1.06);
    }

    .vowel-char {
      color: #f5dfb0;
      font-weight: 700;
      text-shadow: 0 2px 0 #3b230a;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="game-viewport">
    <!-- 1. SCENIC ANIMATED CARPATHIAN MEADOW & PISTACHIO GROVE SVG BACKGROUND -->
    <svg id="meadow-bg" class="absolute inset-0 w-full h-full object-cover" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Rich warm golden-hour Carpathian sky -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1e4d5c" />
          <stop offset="32%" stop-color="#3b7a6c" />
          <stop offset="68%" stop-color="#8ab87a" />
          <stop offset="100%" stop-color="#e8cf7c" />
        </linearGradient>

        <!-- Sun glow -->
        <radialGradient id="sunGlow" cx="72%" cy="24%" r="42%">
          <stop offset="0%" stop-color="#fff6c2" stop-opacity="0.95" />
          <stop offset="28%" stop-color="#ffd966" stop-opacity="0.55" />
          <stop offset="65%" stop-color="#e3a857" stop-opacity="0.18" />
          <stop offset="100%" stop-color="#e3a857" stop-opacity="0" />
        </radialGradient>

        <!-- Distant mountain gradients -->
        <linearGradient id="mtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3a6b63" />
          <stop offset="100%" stop-color="#6b9673" />
        </linearGradient>

        <linearGradient id="mtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2d5944" />
          <stop offset="100%" stop-color="#4e7d4c" />
        </linearGradient>

        <!-- Lush rolling hills -->
        <linearGradient id="hillBack" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#4c853b" />
          <stop offset="100%" stop-color="#2a5424" />
        </linearGradient>

        <linearGradient id="hillFront" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5a9936" />
          <stop offset="55%" stop-color="#356924" />
          <stop offset="100%" stop-color="#1d3d15" />
        </linearGradient>

        <!-- Wood & Bark Gradients -->
        <linearGradient id="barkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#6e4726" />
          <stop offset="50%" stop-color="#4a2c14" />
          <stop offset="100%" stop-color="#2b1708" />
        </linearGradient>

        <!-- Pistachio Shell & Nut Gradients -->
        <linearGradient id="pistachioShell" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f5e7c4" />
          <stop offset="65%" stop-color="#d6bc8b" />
          <stop offset="100%" stop-color="#9e7f4f" />
        </linearGradient>

        <linearGradient id="pistachioNut" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#a8e05f" />
          <stop offset="60%" stop-color="#6eb332" />
          <stop offset="100%" stop-color="#452138" />
        </linearGradient>

        <!-- Sunbeam ray gradient -->
        <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff5ba" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#fff5ba" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- Sky Base -->
      <rect width="1920" height="1080" fill="url(#skyGrad)" />
      <circle cx="1380" cy="260" r="650" fill="url(#sunGlow)" />
      <circle cx="1380" cy="260" r="85" fill="#fff8d6" opacity="0.88" />

      <!-- Volumetric Drifting Clouds -->
      <g id="clouds-layer" opacity="0.78">
        <g id="cloud-1" transform="translate(220, 145)">
          <path d="M0,40 Q30,-10 90,10 Q140,-25 200,15 Q250,5 270,45 Q290,75 240,80 L10,80 Q-30,70 0,40 Z" fill="#f7eed7" opacity="0.7" />
          <path d="M30,50 Q70,15 130,30 Q180,5 220,40 L30,65 Z" fill="#fff9eb" opacity="0.85" />
        </g>
        <g id="cloud-2" transform="translate(980, 110) scale(1.25)">
          <path d="M0,45 Q40,0 100,20 Q160,-20 220,25 Q265,15 280,50 L0,65 Z" fill="#f7eed7" opacity="0.6" />
        </g>
        <g id="cloud-3" transform="translate(1520, 190) scale(0.9)">
          <path d="M0,40 Q30,-10 90,10 Q140,-25 200,15 Q250,5 270,45 L10,70 Z" fill="#fff6e0" opacity="0.65" />
        </g>
      </g>

      <!-- Far Carpathian Ridges -->
      <path d="M-50,680 L180,430 L340,520 L590,350 L820,510 L1090,370 L1320,490 L1610,330 L1840,460 L1980,390 L1980,800 L-50,800 Z" fill="url(#mtnFar)" opacity="0.85" />
      <!-- Mountain snow/mist highlights -->
      <path d="M590,350 L650,390 L570,410 L530,385 Z" fill="#e6f0de" opacity="0.45" />
      <path d="M1610,330 L1690,380 L1600,405 L1540,375 Z" fill="#e6f0de" opacity="0.45" />

      <!-- Mid Mountains with Pine Silhouettes -->
      <path d="M-40,720 Q240,490 540,610 T1180,540 T1750,580 L1960,510 L1960,860 L-40,860 Z" fill="url(#mtnMid)" />

      <!-- Golden Sunbeams slanting across the valley -->
      <polygon points="1380,260 650,1080 950,1080" fill="url(#sunBeam)" />
      <polygon points="1380,260 1120,1080 1440,1080" fill="url(#sunBeam)" />
      <polygon points="1380,260 220,1080 480,1080" fill="url(#sunBeam)" />

      <!-- Distant Wooden Windmill / Shepherd Hut on Right Hill -->
      <g transform="translate(1580, 525) scale(0.82)">
        <polygon points="20,60 95,60 85,135 30,135" fill="#4f3119" />
        <polygon points="5,65 57,15 110,65" fill="#2e1b0d" />
        <rect x="48" y="88" width="18" height="24" rx="4" fill="#ffcf6b" opacity="0.85" />
      </g>

      <!-- Rolling Green Pastures -->
      <path d="M-60,770 Q420,620 960,730 T1980,690 L1980,1080 L-60,1080 Z" fill="url(#hillBack)" />

      <!-- Warm Worn Cobblestone & Mossy Meadow Path -->
      <path d="M720,1080 Q920,880 1240,780 Q1450,730 1650,760 L1980,840 L1980,1080 Z" fill="#3c5e2a" opacity="0.7" />
      <ellipse cx="1150" cy="960" rx="95" ry="26" fill="#6b6656" opacity="0.45" />
      <ellipse cx="1340" cy="910" rx="72" ry="20" fill="#787260" opacity="0.4" />
      <ellipse cx="1010" cy="1020" rx="115" ry="30" fill="#5e5a4b" opacity="0.48" />

      <!-- Foreground Meadow Slope -->
      <path d="M-80,820 Q480,710 980,850 T1980,830 L1980,1090 L-80,1090 Z" fill="url(#hillFront)" />

      <!-- Foreground Swaying Grasses & Wildflowers -->
      <g class="sway-grass-1" transform="translate(860, 1060)">
        <path d="M0,0 Q-18,-65 -35,-110 Q-8,-60 6,0 Z" fill="#295218" />
        <path d="M15,0 Q25,-75 48,-120 Q32,-60 22,0 Z" fill="#467d2b" />
        <circle cx="-35" cy="-112" r="9" fill="#ffcf4d" />
        <circle cx="48" cy="-122" r="7" fill="#ff785a" />
      </g>
      <g class="sway-grass-2" transform="translate(1720, 1065)">
        <path d="M0,0 Q-22,-80 -45,-135 Q-10,-75 8,0 Z" fill="#295218" />
        <path d="M18,0 Q15,-65 35,-115 Q25,-60 26,0 Z" fill="#559435" />
        <circle cx="35" cy="-118" r="10" fill="#ffd966" />
        <circle cx="35" cy="-118" r="4" fill="#d95f18" />
      </g>
      <g class="sway-grass-1" transform="translate(1420, 1075)">
        <path d="M0,0 Q-12,-55 -28,-95 Q-4,-50 6,0 Z" fill="#386622" />
        <path d="M12,0 Q22,-65 38,-98 Q25,-50 18,0 Z" fill="#5a9936" />
      </g>

      <!-- Lush Pistachio Tree Branch in Upper-Left Foreground -->
      <g class="sway-branch">
        <!-- Main gnarled wooden bough -->
        <path d="M-40,35 Q160,55 340,25 Q490,5 620,65 Q480,45 330,65 Q170,95 -40,95 Z" fill="url(#barkGrad)" />
        <path d="M210,60 Q280,115 370,145 Q290,90 245,55 Z" fill="url(#barkGrad)" />
        <path d="M430,42 Q500,90 560,130 Q510,72 465,38 Z" fill="url(#barkGrad)" />

        <!-- Pistachio Foliage Clusters -->
        <g transform="translate(140, 45)">
          <ellipse cx="0" cy="25" rx="52" ry="26" transform="rotate(-18)" fill="#2d591e" />
          <ellipse cx="45" cy="18" rx="58" ry="28" transform="rotate(14)" fill="#498231" />
          <ellipse cx="22" cy="-8" rx="48" ry="24" transform="rotate(-6)" fill="#63a343" />
        </g>
        <g transform="translate(340, 40)">
          <ellipse cx="-10" cy="38" rx="55" ry="25" transform="rotate(-24)" fill="#2a521b" />
          <ellipse cx="38" cy="30" rx="60" ry="28" transform="rotate(18)" fill="#467d2e" />
          <ellipse cx="15" cy="5" rx="50" ry="24" transform="rotate(4)" fill="#6eb04c" />
        </g>
        <g transform="translate(530, 58)">
          <ellipse cx="0" cy="30" rx="48" ry="22" transform="rotate(-15)" fill="#356624" />
          <ellipse cx="35" cy="15" rx="52" ry="24" transform="rotate(20)" fill="#58963e" />
        </g>

        <!-- Hanging Clusters of Ripe Cracked Pistachios -->
        <g id="tree-pistachio-1" transform="translate(205, 85)">
          <path d="M0,-20 Q-5,0 -12,12" stroke="#5c3a1d" stroke-width="4" fill="none" />
          <g transform="translate(-14, 18) rotate(-12)">
            <ellipse cx="0" cy="0" rx="16" ry="22" fill="url(#pistachioNut)" />
            <path d="M-15,-8 Q-18,12 -3,23 Q-4,4 -15,-8 Z" fill="url(#pistachioShell)" />
            <path d="M14,-10 Q19,10 4,23 Q5,4 14,-10 Z" fill="url(#pistachioShell)" />
          </g>
          <g transform="translate(12, 24) rotate(18)">
            <ellipse cx="0" cy="0" rx="15" ry="20" fill="url(#pistachioNut)" />
            <path d="M-14,-7 Q-17,11 -2,21 Q-3,3 -14,-7 Z" fill="url(#pistachioShell)" />
            <path d="M13,-9 Q18,9 3,21 Q4,3 13,-9 Z" fill="url(#pistachioShell)" />
          </g>
        </g>

        <g id="tree-pistachio-2" transform="translate(365, 118)">
          <g transform="translate(-10, 12) rotate(-8)">
            <ellipse cx="0" cy="0" rx="17" ry="23" fill="url(#pistachioNut)" />
            <path d="M-16,-9 Q-19,12 -3,24 Q-4,4 -16,-9 Z" fill="url(#pistachioShell)" />
            <path d="M15,-10 Q20,10 4,24 Q5,4 15,-10 Z" fill="url(#pistachioShell)" />
          </g>
          <g transform="translate(18, 8) rotate(24)">
            <ellipse cx="0" cy="0" rx="15" ry="21" fill="url(#pistachioNut)" />
            <path d="M-14,-8 Q-17,11 -2,21 Q-3,3 -14,-8 Z" fill="url(#pistachioShell)" />
            <path d="M13,-9 Q18,9 3,21 Q4,3 13,-9 Z" fill="url(#pistachioShell)" />
          </g>
        </g>
      </g>

      <!-- Animated Dragonfly / Meadow Bug that the Goat's eyes track -->
      <g id="meadow-dragonfly" transform="translate(950, 320)">
        <ellipse cx="0" cy="0" rx="18" ry="4" fill="#34d399" />
        <circle cx="-18" cy="0" r="5.5" fill="#10b981" />
        <circle cx="-20" cy="-2" r="2" fill="#064e3b" />
        <ellipse id="df-wing-1" cx="-4" cy="-10" rx="16" ry="5" transform="rotate(-25 -4 -10)" fill="#e0f2fe" opacity="0.75" />
        <ellipse id="df-wing-2" cx="4" cy="-9" rx="14" ry="4.5" transform="rotate(20 4 -9)" fill="#e0f2fe" opacity="0.75" />
      </g>
    </svg>

    <!-- 2. PARTICLE CANVAS FOR FLYING PISTACHIOS, ACOUSTIC RINGS & POLLEN -->
    <canvas id="fx-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-20"></canvas>

    <!-- 3. TOP-RIGHT MINIMALIST CONTROLS (Next Skip Button & Sound Toggle - NO TEXT) -->
    <div class="absolute top-5 right-6 z-40 flex items-center gap-4">
      <!-- Sound Toggle Brass Medallion -->
      <button id="sound-toggle-btn" class="totem-btn w-16 h-16 md:w-20 md:h-20 focus:outline-none" aria-label="Toggle Sound">
        <svg viewBox="0 0 100 100" class="w-full h-full">
          <defs>
            <radialGradient id="brassCoin" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ffe699" />
              <stop offset="55%" stop-color="#c9933b" />
              <stop offset="100%" stop-color="#6e4815" />
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="44" fill="#3d220a" stroke="#d49e43" stroke-width="5" />
          <circle cx="50" cy="50" r="37" fill="url(#brassCoin)" />
          <!-- Ear-trumpet / Horn icon -->
          <path d="M26,56 L42,56 L62,72 L62,28 L42,44 L26,44 Z" fill="#3b2008" />
          <path id="sound-waves-icon" d="M70,38 Q80,50 70,62 M77,30 Q91,50 77,70" stroke="#3b2008" stroke-width="5" stroke-linecap="round" fill="none" />
        </svg>
      </button>

      <!-- Minimalist "Next Word" Skip Button (Ornate Carved Wood & Brass Arrow) -->
      <button id="next-word-btn" class="totem-btn w-20 h-16 md:w-24 md:h-20 focus:outline-none" aria-label="Next">
        <svg viewBox="0 0 120 100" class="w-full h-full">
          <defs>
            <linearGradient id="woodSkip" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8c5425" />
              <stop offset="55%" stop-color="#593212" />
              <stop offset="100%" stop-color="#331a06" />
            </linearGradient>
          </defs>

    /********************************************************************
     * 2. SYNTHESIZED WEB AUDIO ENGINE (Rich Folk & Comedic Sounds, Zero Words)
     ********************************************************************/
    class FolkSoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        const waves = document.getElementById('sound-waves-icon');
        if (waves) {
          waves.style.opacity = this.muted ? '0.18' : '1';
        }
        if (!this.muted) this.playWoodTap(520);
      }

      // Crisp wooden resonator tap when hovering/clicking letters or skip
      playWoodTap(freq = 420) {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.45, now + 0.085);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.095);
      }

      // Celebratory Alpine Shepherd Bell + Jaw-Harp overtone for Correct Voiced (+)
      playVoicedSuccess() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5]; // C5, E5, G5, C6, E6
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const overtone = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          overtone.type = 'triangle';
          const start = now + idx * 0.065;
          osc.frequency.setValueAtTime(freq, start);
          overtone.frequency.setValueAtTime(freq * 2.0, start);

          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.85);

          osc.connect(gain);
          overtone.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(start);
          overtone.start(start);
          osc.stop(start + 0.88);
          overtone.stop(start + 0.88);
        });
        // Add pistachio crunch after a beat
        setTimeout(() => this.playPistachioCrunch(), 240);
      }

      // Crisp rhythmic muted-percussion & pistachio crack for Correct Voiceless (−)
      playVoicelessSuccess() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const freqs = [330, 392, 493.88, 659.25];
        freqs.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const t = now + i * 0.07;
          osc.frequency.setValueAtTime(f, t);
          osc.frequency.exponentialRampToValueAtTime(f * 1.15, t + 0.12);

          gain.gain.setValueAtTime(0.22, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.19);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.2);
        });
        setTimeout(() => this.playPistachioCrunch(), 210);
      }

      // Realistic crunchy pistachio shell crack + munch
      playPistachioCrunch() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        // White noise burst filtered for shell crack
        const bufferSize = this.ctx.sampleRate * 0.14;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.035));
        }

        [0, 0.14].forEach((offset) => {
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1650;
          filter.Q.value = 2.2;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.45, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.13);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now + offset);
        });
      }

      // Comedic Wrong Feedback Variant 1: Muffled Tuba Boing
      playWrongBoing() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(420, now);
        filter.frequency.linearRampToValueAtTime(950, now + 0.18);
        filter.frequency.linearRampToValueAtTime(260, now + 0.55);

        osc.frequency.setValueAtTime(145, now);
        osc.frequency.exponentialRampToValueAtTime(230, now + 0.15);
        osc.frequency.exponentialRampToValueAtTime(98, now + 0.55);

        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.58);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
      }

      // Comedic Wrong Feedback Variant 2: Expressive Caprine Bleat-Wah Synthesizer
      playWrongGoatBleat() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const vibrato = this.ctx.createOscillator();
        const vibGain = this.ctx.createGain();
        const mainGain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(310, now);
        osc.frequency.linearRampToValueAtTime(370, now + 0.15);
        osc.frequency.linearRampToValueAtTime(240, now + 0.55);

        // Fast goat-voice vibrato (14 Hz)
        vibrato.frequency.value = 14;
        vibGain.gain.value = 26;
        vibrato.connect(vibGain);
        vibGain.connect(osc.frequency);

        const bandpass = this.ctx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.value = 880;
        bandpass.Q.value = 2.0;

        mainGain.gain.setValueAtTime(0.01, now);
        mainGain.gain.linearRampToValueAtTime(0.28, now + 0.05);
        mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.58);

        osc.connect(bandpass);
        bandpass.connect(mainGain);
        mainGain.connect(this.ctx.destination);

        osc.start(now);
        vibrato.start(now);
        osc.stop(now + 0.6);
        vibrato.stop(now + 0.6);
      }

      // Comedic Wrong Feedback Variant 3: Metallic Ear-Trumpet Knock-Knock + Low Slide
      playWrongTrumpetTap() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        [0, 0.16].forEach((offset) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(780, now + offset);
          osc.frequency.exponentialRampToValueAtTime(290, now + offset + 0.09);

          gain.gain.setValueAtTime(0.2, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.11);
        });
      }

      // Soft rustling scroll sound when clicking the Goat for the "ЦаП ХоЧе ФіСТашКи" hint
      playHintChime() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        [587.33, 880].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + i * 0.08);
          gain.gain.setValueAtTime(0.16, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.36);
        });
      }
    }

      const pool = ['listening', 'curious', 'skeptical', 'puzzled', 'listening', 'grumpy'];
      const next = pool[Math.floor(Math.random() * pool.length)];

        { x: 8, y: -2 },    // Looking toward the Word Plaque
        { x: 10, y: 4 },    // Looking at the Choice Totems
        { x: 0, y: 0 },     // Looking straight at the Player
        { x: -7, y: -6 },   // Glancing up at the Pistachio Branch
        { x: Math.sin(t * 0.9) * 8, y: -5 } // Tracking the meadow dragonfly
      ];
      const chosen = modes[Math.floor(Math.random() * modes.length)];
      goatState.targetGazeX = chosen.x;
      goatState.targetGazeY = chosen.y;
      goatState.gazeTimer = 55 + Math.random() * 95;

    function updateGoatAndScene(timeMs) {
      const t = timeMs * 0.001;

      // 1. Animate meadow dragonfly in a figure-8 path
      const dfX = 920 + Math.sin(t * 0.85) * 280;
      const dfY = 270 + Math.sin(t * 1.7) * 75;
      const dfAngle = Math.cos(t * 0.85) * 14;
      if (goatDOM.dragonfly) {
        goatDOM.dragonfly.setAttribute('transform', `translate(${dfX}, ${dfY}) rotate(${dfAngle})`);
      }

      // 2. Update gaze target timer (Goat NEVER blinks — pupils smoothly shift gaze)
      if (goatState.reactionLock <= 0) {
        goatState.gazeTimer--;
        if (goatState.gazeTimer <= 0) {
          pickNextGazeTarget(t);
        }

        goatState.emotionTimer--;
        if (goatState.emotionTimer <= 0) {
          pickNextGoatEmotion();
        }
      } else {
        goatState.reactionLock--;
      }

      // Smoothly interpolate pupil position
      goatState.gazeX = lerp(goatState.gazeX, goatState.targetGazeX, 0.12);
      goatState.gazeY = lerp(goatState.gazeY, goatState.targetGazeY, 0.12);

      // Determine target pose based on current emotion
      let targetHeadX = 355;
      let targetHeadY = 385 + Math.sin(t * 2.1) * 4;
      let targetHeadRot = Math.sin(t * 1.3) * 2;
      let targetHeadScale = 1;

      let targetBrowLRot = 0, targetBrowLY = -56;
      let targetBrowRRot = 0, targetBrowRY = -56;
      let targetEarLRot = -12 + Math.sin(t * 2.5) * 3;
      let targetEarRRot = 12 + Math.cos(t * 2.5) * 3;
      let targetArmRot = Math.sin(t * 1.8) * 1.8;
      let targetArmX = 445, targetArmY = 665;
      let targetJawY = 118 + Math.sin(t * 2.1) * 1.5;
      let targetJawRot = 0;
      let wavesOpacity = 0;
      let irisScaleY = 1;

      switch (goatState.emotion) {
        case 'listening':
          // Tilts right ear toward the ear-trumpet tip while keeping shoulder anchored at (445, 665)
          targetHeadX = 364;
          targetHeadY = 382;
          targetHeadRot = 6 + Math.sin(t * 3.2) * 1.8;
          targetBrowLRot = -10;
          targetBrowLY = -62;
          targetBrowRRot = 12;
          targetBrowRY = -64;
          targetEarLRot = -22;
          targetEarRRot = 4 + Math.sin(t * 6) * 3; // Right ear angled right onto the horn earpiece
          targetArmRot = -2 + Math.sin(t * 3.5) * 1.5;
          wavesOpacity = 0.9;
          goatDOM.mouthLine.setAttribute('d', 'M-26,26 Q-8,20 4,24 Q18,28 30,22');
          break;

        case 'curious':
          targetHeadX = 362;
          targetHeadY = 380;
          targetHeadRot = 5;
          targetBrowLRot = -14;
          targetBrowLY = -63;
          targetBrowRRot = 14;
          targetBrowRY = -63;
          targetEarLRot = -6;
          targetEarRRot = 8;
          targetArmRot = 1;
          irisScaleY = 1.08;
          goatDOM.mouthLine.setAttribute('d', 'M-30,24 Q-12,30 0,24 Q12,30 30,24');
          break;

        case 'skeptical':
          // Asymmetric brow raise, squinting slightly (without closing eyes!)
          targetHeadX = 350;
          targetHeadRot = -5;
          targetBrowLRot = 14;
          targetBrowLY = -50;
          targetBrowRRot = -16;
          targetBrowRY = -65;
          targetEarLRot = -28;
          targetEarRRot = 16;
          targetArmRot = 5;
          irisScaleY = 0.86;
          goatDOM.mouthLine.setAttribute('d', 'M-32,28 Q-10,20 8,25 Q22,29 34,20');
          break;

        case 'puzzled':
          targetHeadX = 362;
          targetHeadRot = 9;
          targetBrowLRot = -18;
          targetBrowLY = -62;
          targetBrowRRot = -8;
          targetBrowRY = -52;
          targetEarLRot = -32;
          targetEarRRot = 4;
          targetArmRot = -1;
          wavesOpacity = 0.55;
          goatDOM.mouthLine.setAttribute('d', 'M-28,26 Q-14,18 2,27 Q16,33 28,23');
          break;

        case 'grumpy':
          targetHeadRot = -4;
          targetBrowLRot = 18;
          targetBrowLY = -49;
          targetBrowRRot = -18;
          targetBrowRY = -49;
          targetEarLRot = -34;
          targetEarRRot = 28;
          targetArmRot = 6;
          irisScaleY = 0.88;
          goatDOM.mouthLine.setAttribute('d', 'M-34,29 Q-16,21 0,23 Q16,21 34,29');
          break;

        case 'happy-munch':
          // Energetic joyful nodding & munching pistachio
          targetHeadY = 374 + Math.sin(t * 18) * 10;
          targetHeadRot = Math.sin(t * 10) * 8;
          targetBrowLRot = -14;
          targetBrowLY = -64;
          targetBrowRRot = 14;
          targetBrowRY = -64;
          targetEarLRot = -5 + Math.sin(t * 16) * 10;
          targetEarRRot = 8 - Math.sin(t * 16) * 8;
          targetJawY = 122 + Math.abs(Math.sin(t * 20)) * 16;
          targetJawRot = Math.sin(t * 18) * 6;
          targetArmRot = 2 + Math.sin(t * 12) * 4;
          goatDOM.mouthLine.setAttribute('d', 'M-38,18 Q-16,36 0,28 Q16,36 38,18');
          break;

        case 'wrong-tilt':
          // Variant 1: Head tilt in disbelief + wiggling ear-trumpet without detaching shoulder
          targetHeadX = 348;
          targetHeadRot = -16;
          targetBrowLRot = 20;
          targetBrowLY = -48;
          targetBrowRRot = -22;
          targetBrowRY = -67;
          targetEarLRot = -42;
          targetEarRRot = 24;
          targetArmRot = 7 + Math.sin(t * 26) * 5;
          goatDOM.mouthLine.setAttribute('d', 'M-32,30 Q-8,16 14,28 Q26,34 34,26');
          break;

        case 'wrong-bleat':
          // Variant 2: Head shakes & bleats while eyes roll sideways
          targetHeadX = 355 + Math.sin(t * 26) * 12;
          targetHeadRot = Math.sin(t * 26) * 10;
          targetBrowLRot = -18;
          targetBrowRRot = 18;
          targetJawY = 132 + Math.sin(t * 28) * 8;
          targetEarLRot = -30 + Math.sin(t * 26) * 12;
          targetEarRRot = 22 + Math.sin(t * 26) * 10;
          targetArmRot = 4 + Math.sin(t * 24) * 4;
          goatDOM.mouthLine.setAttribute('d', 'M-30,28 Q0,14 30,28');
          break;

        case 'wrong-squint':
          // Variant 3: Leans close to screen squinting intensely (never closing eyelids!) & cupping horn
          targetHeadX = 368;
          targetHeadY = 386;
          targetHeadScale = 1.07;
          targetHeadRot = 6;
          targetBrowLRot = 16;
          targetBrowLY = -48;
          targetBrowRRot = -16;
          targetBrowRY = -48;
          irisScaleY = 0.78;
          targetArmRot = -3 + Math.abs(Math.sin(t * 22)) * 6;
          goatDOM.mouthLine.setAttribute('d', 'M-34,27 Q-12,21 0,26 Q12,21 34,27');
          break;
      }

      // Smoothly interpolate all anatomical joints
      const s = 0.14;
      goatState.headX = lerp(goatState.headX, targetHeadX, s);
      goatState.headY = lerp(goatState.headY, targetHeadY, s);
      goatState.headRot = lerp(goatState.headRot, targetHeadRot, s);
      goatState.headScale = lerp(goatState.headScale, targetHeadScale, s);

      goatState.browLRot = lerp(goatState.browLRot, targetBrowLRot, s);
      goatState.browLY = lerp(goatState.browLY, targetBrowLY, s);
      goatState.browRRot = lerp(goatState.browRRot, targetBrowRRot, s);
      goatState.browRY = lerp(goatState.browRY, targetBrowRY, s);

      goatState.earLRot = lerp(goatState.earLRot, targetEarLRot, s);
      goatState.earRRot = lerp(goatState.earRRot, targetEarRRot, s);

      goatState.armRot = lerp(goatState.armRot, targetArmRot, s);
      goatState.armX = lerp(goatState.armX, targetArmX, s);
      goatState.armY = lerp(goatState.armY, targetArmY, s);

      goatState.jawY = lerp(goatState.jawY, targetJawY, 0.22);
      goatState.jawRot = lerp(goatState.jawRot, targetJawRot, 0.22);

      // Apply transforms to SVG nodes
      goatDOM.headPivot.setAttribute(
        'transform',
        `translate(${goatState.headX.toFixed(1)}, ${goatState.headY.toFixed(1)}) rotate(${goatState.headRot.toFixed(2)}) scale(${goatState.headScale.toFixed(3)})`
      );
      goatDOM.pupilLeft.setAttribute('transform', `translate(${goatState.gazeX.toFixed(2)}, ${goatState.gazeY.toFixed(2)})`);
      goatDOM.pupilRight.setAttribute('transform', `translate(${goatState.gazeX.toFixed(2)}, ${goatState.gazeY.toFixed(2)})`);

      goatDOM.irisLeft.setAttribute('transform', `scale(1, ${irisScaleY.toFixed(2)})`);
      goatDOM.irisRight.setAttribute('transform', `scale(1, ${irisScaleY.toFixed(2)})`);

      goatDOM.browLeft.setAttribute('transform', `translate(-62, ${goatState.browLY.toFixed(1)}) rotate(${goatState.browLRot.toFixed(1)})`);
      goatDOM.browRight.setAttribute('transform', `translate(62, ${goatState.browRY.toFixed(1)}) rotate(${goatState.browRRot.toFixed(1)})`);

      goatDOM.earLeft.setAttribute('transform', `translate(-92, -62) rotate(${goatState.earLRot.toFixed(1)})`);
      goatDOM.earRight.setAttribute('transform', `translate(92, -62) rotate(${goatState.earRRot.toFixed(1)})`);

      goatDOM.trumpetArm.setAttribute(
        'transform',
        `translate(${goatState.armX.toFixed(1)}, ${goatState.armY.toFixed(1)}) rotate(${goatState.armRot.toFixed(1)})`
      );

      // Gentle breeze sway on goatee beard + jaw motion
      const beardSway = Math.sin(t * 2.7) * 4 + goatState.jawRot;
      goatDOM.jawGroup.setAttribute('transform', `translate(0, ${goatState.jawY.toFixed(1)})`);
      goatDOM.beard.setAttribute('transform', `rotate(${beardSway.toFixed(2)})`);

      // Pulse acoustic listening rings near the goat's ear-trumpet when straining to hear
      const wavePulse = wavesOpacity * (0.55 + 0.45 * Math.sin(t * 6.5));
      goatDOM.listeningWaves.setAttribute('opacity', wavePulse.toFixed(2));
    }

    /********************************************************************
     * 5. CANVAS RENDER LOOP (Pollen, Pistachios, Acoustic Shockwaves)
     ********************************************************************/
    function renderCanvasFX(timeMs) {
      ctx.clearRect(0, 0, cw, ch);
      const t = timeMs * 0.001;

      // 1. Floating golden meadow pollen seeds
      for (let i = 0; i < pollenSeeds.length; i++) {
        const p = pollenSeeds[i];
        p.x += p.vx + Math.sin(t + p.phase) * 0.25;
        p.y += p.vy + Math.cos(t * 0.8 + p.phase) * 0.2;
        if (p.x > cw + 20) p.x = -20;
        if (p.y < -20) p.y = ch + 20;
        if (p.y > ch + 20) p.y = -20;

        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 246, 185, 0.45)';
        ctx.shadowColor = '#ffe680';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();
      }

      // 2. Expanding Acoustic Resonance Rings
      for (let i = acousticWaves.length - 1; i >= 0; i--) {
        const w = acousticWaves[i];
        w.r += 4.5;
        w.alpha *= 0.94;
        if (w.alpha <= 0.02 || w.r >= w.maxR) {
          acousticWaves.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
        ctx.strokeStyle = w.color;
        ctx.globalAlpha = w.alpha;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();
      }

      // 3. Active Celebration / Comedy Particles (Pistachios, Shells, Leaves, Dust)
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += pt.gravity;
        pt.rot += pt.vRot;
        pt.alpha -= 0.015;

        if (pt.alpha <= 0.02 || pt.y > ch + 60) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.rot);
        ctx.globalAlpha = Math.max(0, pt.alpha);

        if (pt.kind === 'pistachio') {
          // Green pistachio nut inside cracked beige shell
          ctx.fillStyle = '#84cc16';
          ctx.beginPath();
          ctx.ellipse(0, 0, pt.size * 0.55, pt.size * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f5deb3';
          ctx.beginPath();
          ctx.arc(-pt.size * 0.22, 0, pt.size * 0.62, 0.5, Math.PI - 0.3);
          ctx.fill();
        } else if (pt.kind === 'shell') {
          ctx.fillStyle = '#e6ccb2';
          ctx.strokeStyle = '#9c6644';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, 0, pt.size * 0.45, pt.size * 0.72, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (pt.kind === 'leaf') {
          ctx.fillStyle = '#4ade80';
          ctx.beginPath();
          ctx.ellipse(0, 0, pt.size * 0.75, pt.size * 0.35, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (pt.kind === 'dust') {
          ctx.fillStyle = '#e7dec8';
          ctx.beginPath();
          ctx.arc(0, 0, pt.size, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Golden spark
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(0, 0, pt.size * 0.35, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function mainLoop(timeMs) {
      updateGoatAndScene(timeMs);
      renderCanvasFX(timeMs);
      requestAnimationFrame(mainLoop);
    }

    /********************************************************************
     * 6. ENDLESS WORD GENERATOR & INTERACTIVE GAMEPLAY LOGIC
     ********************************************************************/
    let shuffledDeck = [];
    let currentItem = null;
    let isTransitioning = false;
    let hintTimeout = null;

    function refillAndShuffleDeck() {
      shuffledDeck = [...WORKSHEET_WORDS];
      for (let i = shuffledDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledDeck[i], shuffledDeck[j]] = [shuffledDeck[j], shuffledDeck[i]];
      }
      // Avoid immediate repeat across deck boundary
      if (currentItem && shuffledDeck[shuffledDeck.length - 1].word === currentItem.word) {
        const first = shuffledDeck.pop();
        shuffledDeck.unshift(first);
      }
    }

    function getNextWordItem() {
      if (shuffledDeck.length === 0) {
        refillAndShuffleDeck();
      }
      return shuffledDeck.pop();
    }

    const wordPlaque = document.getElementById('word-plaque');
    const wordContainer = document.getElementById('word-container');
    const btnPlus = document.getElementById('btn-voiced-plus');
    const btnMinus = document.getElementById('btn-voiceless-minus');
    const btnNext = document.getElementById('next-word-btn');
    const btnSound = document.getElementById('sound-toggle-btn');
    const goatStage = document.getElementById('goat-stage');
    const hintScroll = document.getElementById('hint-scroll');

    function renderWordOnPlaque(item, animateFlip = true) {
      currentItem = item;

      const buildLetters = () => {
        wordContainer.innerHTML = '';
        const chars = Array.from(item.word);
        chars.forEach((ch, idx) => {
          const span = document.createElement('span');
          span.className = 'word-letter';
          span.textContent = ch;
          span.dataset.char = ch.toLowerCase();

          // Clicking an individual letter plays a resonant or muted tap & draws the goat's gaze + ear
          span.addEventListener('click', (e) => {
            e.stopPropagation();
            const lower = ch.toLowerCase();
            const rect = span.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            if (VOICELESS_SET.has(lower)) {
              sound.playWoodTap(260);
              spawnAcousticWave(cx, cy, '#ff6b4a', 95);
            } else if (VOICED_SET.has(lower)) {
              sound.playWoodTap(620);
              spawnAcousticWave(cx, cy, '#ffe066', 120);
            } else {
              sound.playWoodTap(480);
            }
            goatState.emotion = 'listening';
            goatState.reactionLock = 50;
            goatState.targetGazeX = 9;
            goatState.targetGazeY = -3;
          });

          wordContainer.appendChild(span);
        });
      };

      if (animateFlip) {
        wordPlaque.classList.remove('plaque-flip', 'plaque-jelly', 'plaque-shake');
        void wordPlaque.offsetWidth;
        wordPlaque.classList.add('plaque-flip');
        setTimeout(buildLetters, 280);
      } else {
        buildLetters();
      }

      // Whenever a new word appears, the goat perks its ear-trumpet to listen
      goatState.emotion = 'listening';
      goatState.reactionLock = 65;
      goatState.targetGazeX = 8;
      goatState.targetGazeY = -2;
    }

    function evaluateChoice(choseAllVoicedPlus) {
      if (isTransitioning || !currentItem) return;

      const isCorrect = (choseAllVoicedPlus === currentItem.allVoiced);
      const plaqueRect = wordPlaque.getBoundingClientRect();
      const px = plaqueRect.left + plaqueRect.width / 2;
      const py = plaqueRect.top + plaqueRect.height / 2;

      const goatRect = goatStage.getBoundingClientRect();
      const gx = goatRect.left + goatRect.width * 0.52;
      const gy = goatRect.top + goatRect.height * 0.46;

      if (isCorrect) {
        isTransitioning = true;

        // Happy munching goat emotion
        goatState.emotion = 'happy-munch';
        goatState.reactionLock = 95;
        goatState.targetGazeX = 2;
        goatState.targetGazeY = 0;

        if (choseAllVoicedPlus) {
          // Correct "+" (All consonants are voiced!)
          sound.playVoicedSuccess();
          btnPlus.classList.remove('bell-ringing');
          void btnPlus.offsetWidth;
          btnPlus.classList.add('bell-ringing');

          // Highlight all voiced consonants in shimmering gold
          const letterSpans = wordContainer.querySelectorAll('.word-letter');
          letterSpans.forEach((sp, i) => {
            if (VOICED_SET.has(sp.dataset.char)) {
              setTimeout(() => sp.classList.add('letter-voiced-win'), i * 45);
            }
          });

          spawnAcousticWave(px, py, '#ffe066', 280);
          setTimeout(() => spawnAcousticWave(gx, gy, '#ffe066', 220), 120);
        } else {
          // Correct "−" (Contains voiceless consonants!)
          sound.playVoicelessSuccess();

          // Visually pulse the voiceless consonants in coral-gold so the child sees them clearly
          const letterSpans = wordContainer.querySelectorAll('.word-letter');
          letterSpans.forEach((sp) => {
            if (VOICELESS_SET.has(sp.dataset.char)) {
              sp.classList.add('letter-clue');
            }
          });

          spawnAcousticWave(px, py, '#ff7847', 240);
        }

        // Burst of pistachios & shells near the plaque and the goat's mouth
        spawnPistachioCelebration(px, py, 24);
        setTimeout(() => spawnPistachioCelebration(gx, gy + 30, 18), 160);

        setTimeout(() => {
          renderWordOnPlaque(getNextWordItem(), true);
          setTimeout(() => {
            isTransitioning = false;
          }, 350);
        }, 1150);

      } else {
        // WRONG CHOICE -> Cycle through 3 rich comedic animations & sounds (NO words!)
        const variant = goatState.wrongVariantIdx % 3;
        goatState.wrongVariantIdx++;
        goatState.reactionLock = 85;

        wordPlaque.classList.remove('plaque-jelly', 'plaque-shake');
        void wordPlaque.offsetWidth;

        if (variant === 0) {
          sound.playWrongBoing();
          goatState.emotion = 'wrong-tilt';
          goatState.targetGazeX = -6;
          goatState.targetGazeY = -5;
          wordPlaque.classList.add('plaque-shake');
          spawnTrumpetDustPuff(gx + 165, gy - 25);
        } else if (variant === 1) {
          sound.playWrongGoatBleat();
          goatState.emotion = 'wrong-bleat';
          goatState.targetGazeX = 11;
          goatState.targetGazeY = -7;
          wordPlaque.classList.add('plaque-jelly');
          spawnTrumpetDustPuff(gx + 155, gy - 15);
        } else {
          sound.playWrongTrumpetTap();
          goatState.emotion = 'wrong-squint';
          goatState.targetGazeX = 0;
          goatState.targetGazeY = 2;
          wordPlaque.classList.add('plaque-shake');
          spawnAcousticWave(gx + 160, gy - 25, '#fca5a5', 140);
        }

        // Pedagogical visual clue: if the word actually has voiceless consonants, briefly pulse them!
        const letterSpans = wordContainer.querySelectorAll('.word-letter');
        letterSpans.forEach((sp) => {
          sp.classList.remove('letter-clue', 'letter-voiced-win');
          void sp.offsetWidth;
          if (!currentItem.allVoiced && VOICELESS_SET.has(sp.dataset.char)) {
            sp.classList.add('letter-clue');
          } else if (currentItem.allVoiced && VOICED_SET.has(sp.dataset.char)) {
            sp.classList.add('letter-voiced-win');
          }
        });
      }
    }

    // Event Listeners for the "+" and "−" Totems
    btnPlus.addEventListener('click', () => evaluateChoice(true));
    btnMinus.addEventListener('click', () => evaluateChoice(false));

    // Minimalist "Next" Skip Button (Immediately transitions to next word without solving)
    btnNext.addEventListener('click', () => {
      sound.playWoodTap(540);
      isTransitioning = false;
      renderWordOnPlaque(getNextWordItem(), true);
    });

    // Sound Toggle Button
    btnSound.addEventListener('click', () => {
      sound.toggleMute();
    });

    // Clicking on the Goat toggles the "ЦаП ХоЧе ФіСТашКи" mnemonic hint scroll
    function toggleMnemonicHint(e) {
      if (e) e.stopPropagation();
      sound.playHintChime();

      const isHidden = hintScroll.classList.contains('hint-hidden');
      if (isHidden) {
        hintScroll.classList.remove('hint-hidden');
        hintScroll.classList.add('hint-visible');

        // Goat looks up toward the hint scroll and perks ears
        goatState.emotion = 'curious';
        goatState.reactionLock = 90;
        goatState.targetGazeX = -5;
        goatState.targetGazeY = -8;

        const goatRect = goatStage.getBoundingClientRect();
        spawnPistachioCelebration(goatRect.left + goatRect.width * 0.45, goatRect.top + 80, 12);

        if (hintTimeout) clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => {
          hintScroll.classList.remove('hint-visible');
          hintScroll.classList.add('hint-hidden');
        }, 6500);
      } else {
        hintScroll.classList.remove('hint-visible');
        hintScroll.classList.add('hint-hidden');
        if (hintTimeout) clearTimeout(hintTimeout);
      }
    }

    goatStage.addEventListener('click', toggleMnemonicHint);
    hintScroll.addEventListener('click', toggleMnemonicHint);

    // Subtle mouse-tracking so the goat occasionally glances toward the user's cursor
    window.addEventListener('pointermove', (e) => {
      if (goatState.reactionLock <= 0 && Math.random() < 0.08) {
        const nx = (e.clientX / cw - 0.35) * 14;
        const ny = (e.clientY / ch - 0.5) * 10;
        goatState.targetGazeX = Math.max(-10, Math.min(11, nx));
        goatState.targetGazeY = Math.max(-7, Math.min(7, ny));
      }
    });

    // Start Game on Window Load
    window.onload = function () {
      refillAndShuffleDeck();
      renderWordOnPlaque(getNextWordItem(), false);
      requestAnimationFrame(mainLoop);
    };
  </script>
