<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Зимові Метаграми</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0a1526;
      font-family: 'Rubik', sans-serif;
    }

    #game-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 30% 25%, #1e385b 0%, #0f1e36 55%, #08101f 100%);
    }

    /* Main Widescreen Scene SVG */
    #scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Particle & Projectile Canvas */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    /* Minimalist Stylized Next Button */
    #next-btn {
      position: absolute;
      top: clamp(16px, 2.5vh, 28px);
      right: clamp(16px, 2.5vw, 32px);
      width: clamp(56px, 5.2vw, 74px);
      height: clamp(56px, 5.2vw, 74px);
      border-radius: 50%;
      cursor: pointer;
      z-index: 40;
      border: none;
      padding: 0;
      background: transparent;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
      outline: none;
    }

    #next-btn:hover {
      transform: scale(1.1) rotate(5deg);
      filter: drop-shadow(0 10px 22px rgba(255, 195, 90, 0.45));
    }

    #next-btn:active {
      transform: scale(0.93);
    }

    /* Pine tree sway animations */
    @keyframes swaySlow {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.5deg); }
    }

    @keyframes swayMedium {
      0%, 100% { transform: rotate(1.4deg); }
      50% { transform: rotate(-1.6deg); }
    }

    .tree-sway-1 {
      transform-origin: 200px 920px;
      animation: swaySlow 7s ease-in-out infinite;
    }

    .tree-sway-2 {
      transform-origin: 540px 860px;
      animation: swayMedium 8.5s ease-in-out infinite;
    }

    /* Streetlamp glow pulse */
    @keyframes lampPulse {
      0%, 100% { opacity: 0.82; transform: scale(1); }
      50% { opacity: 0.96; transform: scale(1.03); }
    }

    .lamp-glow {
      transform-origin: 255px 380px;
      animation: lampPulse 4s ease-in-out infinite;
    }

    /* Boy Character Animations */
    @keyframes boyIdleBreathe {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(0.4deg); }
    }

    @keyframes scarfFlutter {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      33% { transform: rotate(-5deg) skewX(-3deg); }
      66% { transform: rotate(3deg) skewX(2deg); }
    }

    @keyframes breathVapor {
      0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
      30% { opacity: 0.45; transform: translate(18px, -12px) scale(0.9); }
      75% { opacity: 0.15; transform: translate(42px, -30px) scale(1.45); }
      100% { opacity: 0; transform: translate(55px, -42px) scale(1.8); }
    }

    .boy-breathe {
      transform-origin: 410px 960px;
      animation: boyIdleBreathe 3.4s ease-in-out infinite;
    }

    .scarf-tail {
      transform-origin: 435px 690px;
      animation: scarfFlutter 3.2s ease-in-out infinite;
    }

    .vapor-puff-1 {
      transform-origin: 438px 632px;
      animation: breathVapor 4.2s ease-out infinite;
    }

    .vapor-puff-2 {
      transform-origin: 438px 632px;
      animation: breathVapor 4.2s ease-out 2.1s infinite;
    }

    /* Boy Shivering (Wrong Click) */
    @keyframes boyShiver {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-7px, 2px) rotate(-1.5deg); }
      20% { transform: translate(7px, 0px) rotate(1.5deg); }
      30% { transform: translate(-8px, 3px) rotate(-1.8deg); }
      40% { transform: translate(8px, 1px) rotate(1.8deg); }
      50% { transform: translate(-7px, 2px) rotate(-1.5deg); }
      60% { transform: translate(7px, 3px) rotate(1.5deg); }
      70% { transform: translate(-6px, 1px) rotate(-1.2deg); }
      80% { transform: translate(6px, 2px) rotate(1.2deg); }
      90% { transform: translate(-4px, 1px) rotate(-0.8deg); }
    }

    .boy-shivering {
      animation: boyShiver 0.36s linear 3 !important;
    }

    /* Boy Windup & Throw (Correct Click) */
    @keyframes boyThrowBody {
      0% { transform: translate(0, 0) rotate(0deg); }
      35% { transform: translate(-24px, 8px) rotate(-9deg); }
      60% { transform: translate(28px, -14px) rotate(8deg); }
      82% { transform: translate(8px, -6px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .boy-throwing {
      animation: boyThrowBody 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
    }

    /* Boy Celebration Bounce */
    @keyframes boyCelebrate {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-22px) scale(1.02) rotate(-2deg); }
      50% { transform: translateY(0) scale(0.99); }
      75% { transform: translateY(-16px) scale(1.01) rotate(2deg); }
    }

    .boy-celebrating {
      animation: boyCelebrate 0.9s ease-in-out 2 !important;
    }

    /* Letter Plaque Interactions */
    .letter-plaque-group {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }

    .letter-plaque-group:hover {
      filter: brightness(1.12) drop-shadow(0 0 16px rgba(255, 214, 112, 0.55));
    }

    /* Wrong Plaque Shake */
    @keyframes plaqueFrozenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-8px, 0) rotate(-3deg); }
      40% { transform: translate(8px, 0) rotate(3deg); }
      60% { transform: translate(-6px, 0) rotate(-2deg); }
      80% { transform: translate(5px, 0) rotate(1.5deg); }
    }

    .plaque-wrong-anim {
      animation: plaqueFrozenShake 0.42s ease-in-out;
    }

    /* Splat Pop-In Animation */
    @keyframes splatPop {
      0% { transform: scale(0.1) rotate(-15deg); opacity: 0; }
      65% { transform: scale(1.14) rotate(4deg); opacity: 1; }
      85% { transform: scale(0.95) rotate(-1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .splat-appear {
      animation: splatPop 0.38s cubic-bezier(0.22, 1.4, 0.36, 1) forwards;
    }

    /* Interactive icicle wiggle */
    .icicle-interactive {
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .icicle-interactive:hover {
      filter: drop-shadow(0 0 8px rgba(180, 240, 255, 0.8));
    }
  </style>
</head>
<body>

<div id="game-viewport">
  <!-- Minimalist Stylized Wood & Ice "Next" Button (No text) -->
  <button id="next-btn" aria-label="Next">
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <defs>
        <radialGradient id="nextBtnWood" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#9c5a2d" />
          <stop offset="55%" stop-color="#6b3716" />
          <stop offset="100%" stop-color="#3d1c08" />
        </radialGradient>
        <linearGradient id="nextBtnRim" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f6d386" />
          <stop offset="50%" stop-color="#b87e31" />
          <stop offset="100%" stop-color="#6e4312" />
        </linearGradient>
        <linearGradient id="nextArrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="50%" stop-color="#dff4ff" />
          <stop offset="100%" stop-color="#93ccf2" />
        </linearGradient>
      </defs>
      <!-- Outer Brass/Gold Rim -->
      <circle cx="50" cy="50" r="46" fill="url(#nextBtnRim)" stroke="#2b1406" stroke-width="3" />
      <!-- Inner Carved Wood Disc -->
      <circle cx="50" cy="50" r="39" fill="url(#nextBtnWood)" stroke="#47220c" stroke-width="2" />
      <!-- Wood grain arcs -->
      <path d="M22,38 Q50,26 78,38" fill="none" stroke="#4c240c" stroke-width="2" opacity="0.6" />
      <path d="M20,64 Q50,76 80,64" fill="none" stroke="#4c240c" stroke-width="2" opacity="0.6" />
      <!-- Snow cap on top of button -->
      <path d="M16,32 Q28,10 52,10 Q74,10 84,30 Q76,36 67,31 Q58,26 49,32 Q38,38 28,31 Q21,36 16,32 Z" fill="#eef8ff" stroke="#b6dbf5" stroke-width="1.5" />
      <!-- Crystalline Forward Arrow Icon -->
      <path d="M34,33 L58,33 L58,22 L80,50 L58,78 L58,67 L34,67 Z" fill="url(#nextArrowGrad)" stroke="#244a6e" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Double chevron accent -->
      <path d="M24,38 L32,50 L24,62" fill="none" stroke="#bfe6ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- Main Widescreen Vector Scene (1920x1080 coordinate space) -->
  <svg id="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky & Atmosphere Gradients -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#071124" />
        <stop offset="32%" stop-color="#112545" />
        <stop offset="68%" stop-color="#1f416e" />
        <stop offset="92%" stop-color="#355d8a" />
        <stop offset="100%" stop-color="#4e7396" />
      </linearGradient>

      <radialGradient id="auroraGlow" cx="45%" cy="22%" r="50%">
        <stop offset="0%" stop-color="#3ec9b6" stop-opacity="0.18" />
        <stop offset="50%" stop-color="#2c6eb8" stop-opacity="0.08" />
        <stop offset="100%" stop-color="#071124" stop-opacity="0" />
      </radialGradient>

      <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#fffef5" />
        <stop offset="65%" stop-color="#fceab8" />
        <stop offset="100%" stop-color="#dfb86c" />
      </radialGradient>

      <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.35" />
        <stop offset="45%" stop-color="#96c2ec" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#112545" stop-opacity="0" />
      </radialGradient>

      <!-- Snow Hills Gradients -->
      <linearGradient id="farHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#5d83ab" />
        <stop offset="50%" stop-color="#395980" />
        <stop offset="100%" stop-color="#1f3554" />
      </linearGradient>

      <linearGradient id="midHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#8bb3dc" />
        <stop offset="40%" stop-color="#5b84b0" />
        <stop offset="100%" stop-color="#2d496e" />
      </linearGradient>

      <linearGradient id="foreSnowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#e3f2ff" />
        <stop offset="25%" stop-color="#bdd9f2" />
        <stop offset="65%" stop-color="#85add4" />
        <stop offset="100%" stop-color="#4e739c" />
      </linearGradient>

      <radialGradient id="lampConeGrad" cx="50%" cy="0%" r="90%">
        <stop offset="0%" stop-color="#ffdd85" stop-opacity="0.52" />
        <stop offset="45%" stop-color="#ffbe57" stop-opacity="0.22" />
        <stop offset="100%" stop-color="#ffae36" stop-opacity="0" />
      </radialGradient>

      <radialGradient id="lampSnowSpot" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe7a8" stop-opacity="0.55" />
        <stop offset="60%" stop-color="#f7c873" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#85add4" stop-opacity="0" />
      </radialGradient>

      <!-- Building Wall & Brick Pattern -->
      <linearGradient id="buildingWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6b3226" />
        <stop offset="45%" stop-color="#52231a" />
        <stop offset="100%" stop-color="#33140e" />
      </linearGradient>

      <pattern id="brickPattern" width="64" height="32" patternUnits="userSpaceOnUse">
        <rect width="64" height="32" fill="#4f2219" />
        <rect x="2" y="2" width="28" height="12" rx="2" fill="#783728" />
        <rect x="34" y="2" width="28" height="12" rx="2" fill="#662d20" />
        <rect x="-14" y="18" width="28" height="12" rx="2" fill="#6b3123" />
        <rect x="18" y="18" width="28" height="12" rx="2" fill="#823d2d" />
        <rect x="50" y="18" width="28" height="12" rx="2" fill="#5e281c" />
      </pattern>

      <!-- Dark Carved Timber Frame for Billboard -->
      <linearGradient id="timberFrameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4f2d17" />
        <stop offset="50%" stop-color="#361d0d" />
        <stop offset="100%" stop-color="#211006" />
      </linearGradient>

      <linearGradient id="billboardBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2c3e52" />
        <stop offset="35%" stop-color="#1d2a3a" />
        <stop offset="100%" stop-color="#121b26" />
      </linearGradient>

      <pattern id="woodPlankPattern" width="120" height="36" patternUnits="userSpaceOnUse">
        <rect width="120" height="36" fill="#26170c" />
        <rect x="0" y="1" width="120" height="33" fill="#3b2313" />
        <path d="M0,12 Q40,7 80,14 T120,11" fill="none" stroke="#29170b" stroke-width="1.5" opacity="0.65" />
        <path d="M0,25 Q60,30 120,23" fill="none" stroke="#4d301c" stroke-width="1.2" opacity="0.5" />
      </pattern>

      <!-- Warm Window Glow -->
      <radialGradient id="warmWindowGlow" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#fff3bd" />
        <stop offset="55%" stop-color="#ffbf47" />
        <stop offset="100%" stop-color="#d66b13" />
      </radialGradient>

      <!-- Letter Plaque Gradients -->
      <linearGradient id="plaqueWoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#a86432" />
        <stop offset="25%" stop-color="#874b20" />
        <stop offset="75%" stop-color="#6b3814" />
        <stop offset="100%" stop-color="#4a240a" />
      </linearGradient>

      <linearGradient id="plaqueGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe699" />
        <stop offset="45%" stop-color="#d49b3b" />
        <stop offset="100%" stop-color="#7d5211" />
      </linearGradient>

      <linearGradient id="plaqueWinGlow" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#d18838" />
        <stop offset="50%" stop-color="#9e5a19" />
        <stop offset="100%" stop-color="#693608" />
      </linearGradient>

      <!-- Snow Splat 3D Shading -->
      <radialGradient id="snowSplatGrad" cx="38%" cy="32%" r="68%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="52%" stop-color="#edf7ff" />
        <stop offset="82%" stop-color="#c3e0f7" />
        <stop offset="100%" stop-color="#8eb8de" />
      </radialGradient>

      <!-- Boy Character Gradients -->
      <radialGradient id="boySkinGrad" cx="42%" cy="38%" r="62%">
        <stop offset="0%" stop-color="#ffe4d1" />
        <stop offset="60%" stop-color="#f7c5a8" />
        <stop offset="88%" stop-color="#e39f7e" />
        <stop offset="100%" stop-color="#c97f5d" />
      </radialGradient>

      <radialGradient id="boyCheekGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff6b7a" stop-opacity="0.65" />
        <stop offset="65%" stop-color="#ff6b7a" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#ff6b7a" stop-opacity="0" />
      </radialGradient>

      <radialGradient id="boyFrostCheek" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#80d4ff" stop-opacity="0.65" />
        <stop offset="70%" stop-color="#b3e5ff" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      </radialGradient>

      <linearGradient id="boyCoatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#266e57" />
        <stop offset="45%" stop-color="#195240" />
        <stop offset="85%" stop-color="#0f382b" />
        <stop offset="100%" stop-color="#09241b" />
      </linearGradient>

      <linearGradient id="boyCoatAccent" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#d98a36" />
        <stop offset="100%" stop-color="#965515" />
      </linearGradient>

      <linearGradient id="furHoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5ead6" />
        <stop offset="50%" stop-color="#d6c2a3" />
        <stop offset="100%" stop-color="#9c8362" />
      </linearGradient>

      <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d93829" />
        <stop offset="55%" stop-color="#a81e14" />
        <stop offset="100%" stop-color="#6e0e08" />
      </linearGradient>

      <linearGradient id="scarfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f2a922" />
        <stop offset="30%" stop-color="#d93829" />
        <stop offset="65%" stop-color="#f2a922" />
        <stop offset="100%" stop-color="#9e1b11" />
      </linearGradient>

      <linearGradient id="mittenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d93829" />
        <stop offset="65%" stop-color="#9c1c12" />
        <stop offset="100%" stop-color="#610c06" />
      </linearGradient>

      <!-- Big Snowball in Boy's Hands -->
      <radialGradient id="bigSnowballGrad" cx="35%" cy="30%" r="68%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="40%" stop-color="#f2f9ff" />
        <stop offset="72%" stop-color="#c6e2fa" />
        <stop offset="92%" stop-color="#8bb8e0" />
        <stop offset="100%" stop-color="#6896c2" />
      </radialGradient>

      <!-- Billboard Spotlight Cone -->
      <radialGradient id="signLampCone" cx="50%" cy="0%" r="85%">
        <stop offset="0%" stop-color="#ffe79e" stop-opacity="0.58" />
        <stop offset="55%" stop-color="#ffc857" stop-opacity="0.18" />
        <stop offset="100%" stop-color="#ffc857" stop-opacity="0" />
      </radialGradient>

      <!-- Drop Shadows -->
      <filter id="deepShadow" x="-15%" y="-15%" width="130%" height="135%">
        <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#050b14" flood-opacity="0.65" />
      </filter>

      <filter id="plaqueShadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#070d17" flood-opacity="0.7" />
      </filter>

      <filter id="goldenGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- ================= 1. SKY, AURORA & MOON ================= -->
    <rect width="1920" height="1080" fill="url(#skyGrad)" />
    <ellipse cx="820" cy="220" rx="850" ry="260" fill="url(#auroraGlow)" />
    <path d="M120,180 Q520,60 920,190 T1680,140" fill="none" stroke="#52e3c4" stroke-width="28" opacity="0.08" filter="blur(18px)" />

    <!-- Stars in upper sky -->
    <g opacity="0.8">
      <circle cx="120" cy="88" r="2" fill="#fff9d6" />
      <circle cx="290" cy="140" r="1.5" fill="#d9eeff" />
      <circle cx="460" cy="64" r="2.4" fill="#ffffff" />
      <circle cx="620" cy="118" r="1.6" fill="#fff4c2" />
      <circle cx="780" cy="70" r="2.2" fill="#ffffff" />
      <circle cx="960" cy="130" r="1.5" fill="#d4ecff" />
      <circle cx="1140" cy="62" r="2" fill="#ffffff" />
      <circle cx="155" cy="230" r="1.5" fill="#ffffff" />
      <circle cx="695" cy="195" r="1.8" fill="#ffeab5" />
    </g>

    <!-- Glowing Winter Moon -->
    <g id="moon-group" transform="translate(530, 155)">
      <circle cx="0" cy="0" r="145" fill="url(#moonHalo)" />
      <circle cx="0" cy="0" r="54" fill="url(#moonGrad)" />
      <circle cx="-14" cy="-12" r="9" fill="#e6c67e" opacity="0.35" />
      <circle cx="18" cy="14" r="13" fill="#e6c67e" opacity="0.3" />
      <circle cx="-8" cy="22" r="6" fill="#e6c67e" opacity="0.3" />
    </g>

    <!-- ================= 2. DISTANT SNOWY MOUNTAINS & VILLAGE ================= -->
    <!-- Far Mountain Range -->
    <path d="M0,620 L0,470 Q160,390 330,445 Q520,355 720,430 Q920,370 1120,450 L1120,650 Z" fill="url(#farHillGrad)" />
    <!-- Mountain snow ridges -->
    <path d="M330,445 Q430,395 520,388 L485,445 L410,430 Z" fill="#9bc0e6" opacity="0.35" />

    <!-- Distant Cozy Winter Cottage on the Hill -->

  /********************************************************************
   * 2. SYNTHESIZED WEB AUDIO API SOUND ENGINE (NO EXTERNAL FILES)
   ********************************************************************/
  class WinterAudioEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Soft filtered noise helper for snow crunch & wind
    createNoiseBuffer(duration = 0.5) {
      const sampleRate = this.ctx.sampleRate;
      const bufferSize = sampleRate * duration;
      const buffer = this.ctx.createBuffer(1, bufferSize, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    // Wind-up & Throw Whoosh
    playThrowWhoosh() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      const noise = this.ctx.createBufferSource();
      noise.buffer = this.createNoiseBuffer(0.45);

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(280, now);
      filter.frequency.exponentialRampToValueAtTime(1150, now + 0.25);
      filter.frequency.exponentialRampToValueAtTime(420, now + 0.42);
      filter.Q.value = 2.2;

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.38, now + 0.16);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);

      noise.start(now);
      noise.stop(now + 0.45);
    }

    // Crisp Snowball Splat Impact + Festive Winter Chimes
    playSnowSplatAndSuccess() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      // 1. Low thump of snowball hitting wood plaque
      const oscThump = this.ctx.createOscillator();
      const gainThump = this.ctx.createGain();
      oscThump.type = 'sine';
      oscThump.frequency.setValueAtTime(155, now);
      oscThump.frequency.exponentialRampToValueAtTime(42, now + 0.18);
      gainThump.gain.setValueAtTime(0.55, now);
      gainThump.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      oscThump.connect(gainThump);
      gainThump.connect(this.ctx.destination);
      oscThump.start(now);
      oscThump.stop(now + 0.2);

      // 2. Crisp snow crunch burst
      const crunch = this.ctx.createBufferSource();
      crunch.buffer = this.createNoiseBuffer(0.28);
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1600, now);
      filter.Q.value = 1.1;
      const gainCrunch = this.ctx.createGain();
      gainCrunch.gain.setValueAtTime(0.45, now);
      gainCrunch.gain.exponentialRampToValueAtTime(0.005, now + 0.26);
      crunch.connect(filter);
      filter.connect(gainCrunch);
      gainCrunch.connect(this.ctx.destination);
      crunch.start(now);
      crunch.stop(now + 0.28);

      // 3. Magical Sparkling Winter Bell Chimes Arpeggio
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
      notes.forEach((freq, idx) => {
        const start = now + 0.06 + idx * 0.085;
        const osc = this.ctx.createOscillator();
        const overtone = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, start);

        overtone.type = 'sine';
        overtone.frequency.setValueAtTime(freq * 2, start);

        gain.gain.setValueAtTime(0.001, start);
        gain.gain.linearRampToValueAtTime(0.22, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.75);

        osc.connect(gain);
        overtone.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(start);
        overtone.start(start);
        osc.stop(start + 0.78);
        overtone.stop(start + 0.78);
      });
    }

    // Cold Wind + Shivering / Teeth Chattering Sound on Wrong Click
    playColdShiver() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      // 1. Icy Wind Gust
      const wind = this.ctx.createBufferSource();
      wind.buffer = this.createNoiseBuffer(0.95);
      const windFilter = this.ctx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.setValueAtTime(620, now);
      windFilter.frequency.linearRampToValueAtTime(980, now + 0.4);
      windFilter.frequency.linearRampToValueAtTime(480, now + 0.9);
      windFilter.Q.value = 4.5;

      const windGain = this.ctx.createGain();
      windGain.gain.setValueAtTime(0.01, now);
      windGain.gain.linearRampToValueAtTime(0.28, now + 0.25);
      windGain.gain.exponentialRampToValueAtTime(0.002, now + 0.92);

      wind.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(this.ctx.destination);
      wind.start(now);
      wind.stop(now + 0.95);

      // 2. Rhythmic Shivering / Chattering Pulses ("Brrr-brrr-brrr")
      for (let i = 0; i < 6; i++) {
        const pulseStart = now + i * 0.11;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190 - (i % 2) * 28, pulseStart);
        osc.frequency.exponentialRampToValueAtTime(125, pulseStart + 0.08);

        const lpf = this.ctx.createBiquadFilter();
        lpf.type = 'lowpass';
        lpf.frequency.value = 540;

        g.gain.setValueAtTime(0.16, pulseStart);
        g.gain.exponentialRampToValueAtTime(0.005, pulseStart + 0.085);

        osc.connect(lpf);
        lpf.connect(g);
        g.connect(this.ctx.destination);

        osc.start(pulseStart);
        osc.stop(pulseStart + 0.09);
      }
    }

    // Crisp Snow Pack Sound when New Round Starts
    playFreshSnowballPack() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      [0, 0.11].forEach((offset, idx) => {
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.createNoiseBuffer(0.12);
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = idx === 0 ? 1150 : 1450;
        filter.Q.value = 1.8;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.22, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.005, now + offset + 0.1);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now + offset);
        noise.stop(now + offset + 0.12);
      });
    }

    // Musical Icicle Chime
    playIcicleChime(noteIndex = 0) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const scale = [783.99, 880, 987.77, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
      const freq = scale[noteIndex % scale.length];

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.68);
    }
  }

  const audio = new WinterAudioEngine();

  /********************************************************************
   * 3. STATE & SHUFFLE QUEUE
   ********************************************************************/
  let deck = [];
  let currentPair = null;
  let isBusy = false;
  let autoAdvanceTimer = null;

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Helper to classify whether replacement is at start, middle, or end
  function getPositionType(pair) {
    if (pair.index === 0) return 'start';
    if (pair.index === pair.from.length - 1) return 'end';
    return 'middle';
  }

  // Build a thoroughly shuffled deck that interleaves middle, end, and start replacements
  function buildBalancedDeck() {
    const middlePairs = shuffleArray(WORD_PAIRS_POOL.filter(p => p.index > 0 && p.index < p.from.length - 1));
    const endPairs = shuffleArray(WORD_PAIRS_POOL.filter(p => p.index === p.from.length - 1));
    const startPairs = shuffleArray(WORD_PAIRS_POOL.filter(p => p.index === 0));

    const combined = [];
    const maxLen = Math.max(middlePairs.length, endPairs.length, startPairs.length);

    for (let i = 0; i < maxLen; i++) {
      const bucket = [];
      if (i < middlePairs.length) bucket.push(middlePairs[i]);
      if (i < endPairs.length) bucket.push(endPairs[i]);
      if (i < startPairs.length) bucket.push(startPairs[i]);
      combined.push(...shuffleArray(bucket));
    }

    return combined;
  }

  function getNextWordPair() {
    if (deck.length === 0) {
      deck = buildBalancedDeck();
    }

    let candidate = deck.pop();

    // Avoid repeating the exact same base word or too many same-position replacements in a row
    if (currentPair && deck.length > 2) {
      const prevType = getPositionType(currentPair);
      if (candidate.from === currentPair.from || candidate.from === currentPair.to) {
        const altIdx = deck.findIndex(
          p => p.from !== currentPair.from && p.from !== currentPair.to && getPositionType(p) !== prevType
        );
        if (altIdx !== -1) {
          const [alt] = deck.splice(altIdx, 1);
          deck.unshift(candidate);
          candidate = alt;
        }
      }
    }

    return candidate;
  }

    newLetterText.setAttribute('y', 0);
    newLetterText.setAttribute('text-anchor', 'middle');
    newLetterText.setAttribute('dominant-baseline', 'central');
    newLetterText.setAttribute('font-family', "'Rubik', sans-serif");
    newLetterText.setAttribute('font-weight', '900');
    newLetterText.setAttribute('font-size', fontSize);
    newLetterText.setAttribute('fill', '#0d3b73');
    newLetterText.setAttribute('stroke', '#062142');
    newLetterText.setAttribute('stroke-width', '2.5');
    newLetterText.textContent = newLetter;
    splatAnimGroup.appendChild(newLetterText);

    splatHolder.appendChild(splatAnimGroup);
  }

  /********************************************************************
   * 6. LOAD & DISPLAY WORD TASK
   ********************************************************************/
  function loadNextRound(playPackSound = false) {
    if (autoAdvanceTimer) {
      clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = null;
    }
    isBusy = false;
    activeProjectile = null;

    currentPair = getNextWordPair();
    setBoyEmotion('idle');
    heldSnowballGroup.style.opacity = '1';
    heldSnowballGroup.style.transform = 'translate(415px, 782px) scale(1)';

    // Update letter on the boy's snowball
    snowballLetter.textContent = currentPair.letter;
    snowballLetterShadow.textContent = currentPair.letter;

    // Render word letters on the billboard
    plaquesLayer.innerHTML = '';
    const letters = Array.from(currentPair.from);
    const count = letters.length;

    // Billboard inner area: x from 815 to 1775 (width 960), y from 280 to 570
    const boardCenterX = 1295;
    const plaqueWidth = count <= 4 ? 172 : count === 5 ? 156 : 138;
    const plaqueHeight = 216;
    const gap = count <= 4 ? 26 : count === 5 ? 20 : 15;
    const totalWidth = count * plaqueWidth + (count - 1) * gap;
    const startX = boardCenterX - totalWidth / 2;
    const plaqueY = 318;

    letters.forEach((char, idx) => {
      const x = startX + idx * (plaqueWidth + gap);
      const plaque = buildPlaqueSVG(char, idx, x, plaqueY, plaqueWidth, plaqueHeight);
      plaquesLayer.appendChild(plaque);
    });

    if (playPackSound) {
      audio.playFreshSnowballPack();
      const sbPos = svgToCanvasCoords(450, 800);
      spawnSnowBurst(sbPos.x, sbPos.y, 18, false);
    }
  }

  /********************************************************************
   * 7. HANDLE LETTER CLICK (CORRECT vs. WRONG)
   ********************************************************************/
  function handleLetterClick(clickedIndex, plaqueGroup, targetSvgX, targetSvgY, plaqueW, plaqueH) {
    if (isBusy) return;

    const isCorrect = clickedIndex === currentPair.index;

    if (isCorrect) {
      isBusy = true;
      setBoyEmotion('happy');
      boyCharacter.classList.add('boy-throwing');
      audio.playThrowWhoosh();

      // At peak of wind-up/release (~210ms), launch the 3D snowball projectile
      setTimeout(() => {
        heldSnowballGroup.style.opacity = '0';
        const startPt = svgToCanvasCoords(465, 760);
        const endPt = svgToCanvasCoords(targetSvgX, targetSvgY);

        launchSnowballProjectile(startPt.x, startPt.y, endPt.x, endPt.y, currentPair.letter, () => {
          // ON IMPACT!
          audio.playSnowSplatAndSuccess();

          // Hide original letter underneath the splat so the splat letter is super clear
          const origLetter = plaqueGroup.querySelector('.plaque-letter');
          if (origLetter) origLetter.setAttribute('opacity', '0.12');

          // Insert realistic Snow Splat with new letter
          insertSnowSplat(plaqueGroup, currentPair.letter, plaqueW, plaqueH);

          // Particle burst of snow crystals & golden celebration sparkles
          const hitPt = svgToCanvasCoords(targetSvgX, targetSvgY);
          spawnSnowBurst(hitPt.x, hitPt.y, 65, true);

          // Illuminate all plaques warmly to celebrate the newly formed word
          const allFaces = plaquesLayer.querySelectorAll('.plaque-face');
          allFaces.forEach(face => {
            face.setAttribute('fill', 'url(#plaqueWinGlow)');
            face.setAttribute('stroke', '#ffe28a');
            face.setAttribute('stroke-width', '4');
          });

          // Boy celebrates with joyful bounce
          boyCharacter.classList.remove('boy-throwing');
          boyCharacter.classList.add('boy-celebrating');

          // Advance to next word after celebration pause
          autoAdvanceTimer = setTimeout(() => {
            loadNextRound(true);
          }, 2300);
        });
      }, 210);

    } else {
      // INCORRECT LETTER CLICKED: Boy shivers from cold & looks displeased
      isBusy = true;
      audio.playColdShiver();

      // Shake the clicked plaque
      const inner = plaqueGroup.querySelector('.plaque-inner');
      inner.classList.remove('plaque-wrong-anim');
      void inner.offsetWidth;
      inner.classList.add('plaque-wrong-anim');

      // Boy shivers and frost puffs around him
      setBoyEmotion('cold');
      boyCharacter.classList.add('boy-shivering');

      const boyPt = svgToCanvasCoords(450, 680);
      spawnFrostGustOnBoy(boyPt.x, boyPt.y);

      setTimeout(() => {
        if (isBusy) {
          setBoyEmotion('idle');
          isBusy = false;
        }
      }, 1100);
    }
  }

  /********************************************************************
   * 8. COORDINATE CONVERSION (SVG 1920x1080 <-> CANVAS PIXELS)
   * Matches `preserveAspectRatio="xMidYMid slice"`
   ********************************************************************/
  function svgToCanvasCoords(svgX, svgY) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.max(vw / 1920, vh / 1080);
    const offsetX = (vw - 1920 * scale) / 2;
    const offsetY = (vh - 1080 * scale) / 2;
    return {
      x: offsetX + svgX * scale,
      y: offsetY + svgY * scale,
      scale
    };
  }

  /********************************************************************
   * 9. HTML5 CANVAS ENGINE: PARALLAX SNOW, FLYING SNOWBALL & BURSTS
   ********************************************************************/
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');

  let cw = window.innerWidth;
  let ch = window.innerHeight;
  let ambientSnow = [];
  let burstParticles = [];
  let activeProjectile = null;

  function resizeCanvas() {
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = cw;
    canvas.height = ch;
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Initialize 3-layer Parallax Falling Snowflakes
  function initAmbientSnow() {
    ambientSnow = [];
    const count = 135;
    for (let i = 0; i < count; i++) {
      const layer = i < 65 ? 0 : i < 110 ? 1 : 2; // 0: far, 1: mid, 2: foreground
      ambientSnow.push({
        x: Math.random() * cw,
        y: Math.random() * ch,
        r: layer === 0 ? 1.5 + Math.random() * 1.5 : layer === 1 ? 2.5 + Math.random() * 2.2 : 4 + Math.random() * 3,
        vy: layer === 0 ? 0.45 + Math.random() * 0.4 : layer === 1 ? 0.9 + Math.random() * 0.6 : 1.5 + Math.random() * 0.9,
        vx: (Math.random() - 0.35) * 0.6,
        swingAmp: 0.3 + Math.random() * 0.8,
        swingSpeed: 0.01 + Math.random() * 0.02,
        phase: Math.random() * Math.PI * 2,
        alpha: layer === 0 ? 0.38 : layer === 1 ? 0.65 : 0.85
      });
    }
  }
  initAmbientSnow();

  // Launch 3D Parabolic Flying Snowball
  function launchSnowballProjectile(startX, startY, targetX, targetY, letter, onHitCallback) {
    activeProjectile = {
      startX,
      startY,
      targetX,
      targetY,
      letter,
      progress: 0,
      duration: 28, // frames (~0.46s at 60fps)
      arcHeight: Math.max(110, Math.hypot(targetX - startX, targetY - startY) * 0.24),
      rotation: 0,
      onHitCallback
    };
  }

  // Spawn Explosion of Snow Crystals & Festive Sparkles on Impact
  function spawnSnowBurst(x, y, count = 55, includeGoldSparkles = true) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 11;
      const isGold = includeGoldSparkles && i % 4 === 0;
      burstParticles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2.2,
        gravity: 0.26,
        r: isGold ? 3 + Math.random() * 4 : 3 + Math.random() * 6.5,
        alpha: 1,
        decay: 0.016 + Math.random() * 0.018,
        color: isGold ? '#ffe07d' : (Math.random() > 0.3 ? '#ffffff' : '#bfe3ff'),
        isCrystal: !isGold && Math.random() > 0.5
      });
    }
  }

  // Spawn Frosty Wind Gust around Boy on Wrong Click
  function spawnFrostGustOnBoy(x, y) {
    for (let i = 0; i < 38; i++) {
      const angle = (Math.random() - 0.5) * Math.PI * 1.4;
      const speed = 2.5 + Math.random() * 6.5;
      burstParticles.push({
        x: x + (Math.random() - 0.5) * 120,
        y: y + (Math.random() - 0.5) * 140,
        vx: Math.cos(angle) * speed,
        vy: -1.5 + (Math.random() - 0.5) * 3,
        gravity: -0.03,
        r: 2.5 + Math.random() * 4.5,
        alpha: 0.9,
        decay: 0.02 + Math.random() * 0.015,
        color: '#b8e8ff',
        isCrystal: true
      });
    }
  }

  // Main 60FPS Animation Loop
  function animateCanvas() {
    ctx.clearRect(0, 0, cw, ch);

    // 1. Update & Draw Ambient Falling Snow
    for (let i = 0; i < ambientSnow.length; i++) {
      const f = ambientSnow[i];
      f.phase += f.swingSpeed;
      f.x += f.vx + Math.sin(f.phase) * f.swingAmp;
      f.y += f.vy;

      if (f.y > ch + 12) {
        f.y = -10;
        f.x = Math.random() * cw;
      }
      if (f.x > cw + 12) f.x = -10;
      if (f.x < -12) f.x = cw + 10;

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(240, 249, 255, ${f.alpha})`;
      ctx.fill();
    }

    // 2. Update & Draw Flying Snowball Projectile
    if (activeProjectile) {
      const p = activeProjectile;
      p.progress += 1 / p.duration;

      if (p.progress >= 1) {
        const cb = p.onHitCallback;
        activeProjectile = null;
        if (cb) cb();
      } else {
        const t = p.progress;
        // Parabolic interpolation
        const curX = p.startX + (p.targetX - p.startX) * t;
        const linearY = p.startY + (p.targetY - p.startY) * t;
        const arcOffset = -4 * p.arcHeight * t * (1 - t);
        const curY = linearY + arcOffset;

        // Perspective scaling as it flies from foreground boy to building billboard
        const scaleFactor = (1 - t * 0.25) * Math.max(cw / 1920, ch / 1080);
        const radius = 68 * scaleFactor;
        p.rotation += 0.14;

        // Spawn snow trail particles behind flying snowball
        for (let k = 0; k < 2; k++) {
          burstParticles.push({
            x: curX + (Math.random() - 0.5) * radius * 0.7,
            y: curY + (Math.random() - 0.5) * radius * 0.7,
            vx: (Math.random() - 0.5) * 1.8,
            vy: (Math.random() - 0.5) * 1.8 + 0.5,
            gravity: 0.08,
            r: (3 + Math.random() * 4) * scaleFactor,
            alpha: 0.85,
            decay: 0.045,
            color: '#e8f5ff',
            isCrystal: false
          });
        }

        // Draw 3D shaded snowball sphere
        ctx.save();
        ctx.translate(curX, curY);
        ctx.rotate(p.rotation * 0.25);

        const grad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, radius * 0.1, 0, 0, radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.55, '#e3f2ff');
        grad.addColorStop(0.88, '#9bc6eb');
        grad.addColorStop(1, '#6896c2');

        ctx.shadowColor = 'rgba(5, 15, 30, 0.5)';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 10;

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#7da8d1';
        ctx.stroke();

        // Draw Letter on Flying Snowball
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.font = `900 ${Math.round(68 * scaleFactor)}px 'Rubik', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 5 * scaleFactor;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeText(p.letter, 0, 2);
        ctx.fillStyle = '#103663';
        ctx.fillText(p.letter, 0, 0);

        ctx.restore();
      }
    }

    // 3. Update & Draw Burst / Frost Particles
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const b = burstParticles[i];
      b.x += b.vx;
      b.y += b.vy;
      b.vy += b.gravity;
      b.alpha -= b.decay;

      if (b.alpha <= 0) {
        burstParticles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, b.alpha);
      ctx.fillStyle = b.color;
      ctx.strokeStyle = b.color;

      if (b.isCrystal) {
        // Draw 6-pointed snow crystal star
        ctx.translate(b.x, b.y);
        ctx.lineWidth = 1.8;
        for (let arm = 0; arm < 3; arm++) {
          ctx.beginPath();
          ctx.moveTo(-b.r, 0);
          ctx.lineTo(b.r, 0);
          ctx.stroke();
          ctx.rotate(Math.PI / 3);
        }
      } else {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    requestAnimationFrame(animateCanvas);
  }

  /********************************************************************
   * 10. UI & ENVIRONMENTAL INTERACTIONS
   ********************************************************************/
  // Minimalist "Next" Button: Immediately skips to next word
  document.getElementById('next-btn').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    loadNextRound(true);
  });

  // Clicking on Hanging Icicles Plays Musical Chimes & Drops Snow Dust
  document.querySelectorAll('.icicle-interactive').forEach((icicle) => {
    icicle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      const note = parseInt(icicle.getAttribute('data-note') || '0', 10);
      audio.playIcicleChime(note);
      const rect = icicle.getBoundingClientRect();
      spawnSnowBurst(rect.left + rect.width / 2, rect.bottom, 16, false);
    });
  });

  // Clicking on the Streetlamp Emits Golden Sparks
  document.getElementById('streetlamp').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    audio.playIcicleChime(5);
    const pt = svgToCanvasCoords(255, 382);
    spawnSnowBurst(pt.x, pt.y, 24, true);
  });

  // Clicking on Distant Cottage Puff
  document.getElementById('distant-cottage').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    audio.playIcicleChime(2);
    const pt = svgToCanvasCoords(662, 368);
    spawnSnowBurst(pt.x, pt.y, 18, true);
  });

  // Start Game on Load
  window.onload = () => {
    loadNextRound(false);
    animateCanvas();
  };
</script>
