<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Зимовий ліс</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: #041122;
      cursor: pointer;
    }

    /* Animated Aurora & Sky Canvas */
    #skyCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Parallax Pine Forest SVG Layer */
    #forestLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Interactive Pine Trees clickable zones */
    .pine-interactive {
      pointer-events: auto;
      cursor: pointer;
      transition: filter 0.3s ease;
    }
    .pine-interactive:hover {
      filter: drop-shadow(0 0 12px rgba(125, 249, 255, 0.35));
    }

    /* Swaying animations for pine trees */
    @keyframes swaySlow {
      0%, 100% { transform: rotate(-1.1deg); }
      50% { transform: rotate(1.3deg); }
    }
    @keyframes swayMedium {
      0%, 100% { transform: rotate(1.4deg); }
      50% { transform: rotate(-1.5deg); }
    }
    @keyframes treeShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-3.5deg) scale(1.02); }
      40% { transform: rotate(3.5deg) scale(1.02); }
      60% { transform: rotate(-2.5deg) scale(1.01); }
      80% { transform: rotate(2deg) scale(1.01); }
    }

    .sway-left {
      transform-origin: bottom center;
      animation: swaySlow 7s ease-in-out infinite;
    }
    .sway-right {
      transform-origin: bottom center;
      animation: swayMedium 6.2s ease-in-out infinite;
    }
    .shake-tree {
      animation: treeShake 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) !important;
    }

    /* Ambient & Effect Snow Canvas */
    #fxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      pointer-events: none;
    }

    /* Falling Word Snowflakes Container */
    #snowflakeStage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* Stylized Top Control Bar - Faceted Ice & Pine Amber Gems (NO white rectangles) */
    #topBar {
      position: absolute;
      top: 16px;
      right: 22px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
    }

    .crystal-btn {
      position: relative;
      height: 58px;
      min-width: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #e6fbff;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 1px;
      border: none;
      background: linear-gradient(135deg, rgba(12, 48, 88, 0.88) 0%, rgba(20, 88, 138, 0.85) 50%, rgba(10, 35, 68, 0.92) 100%);
      clip-path: polygon(14px 0%, calc(100% - 14px) 0%, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0% 50%);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.45), inset 0 0 15px rgba(125, 249, 255, 0.35);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }

    .crystal-btn::before {
      content: '';
      position: absolute;
      inset: 2px;
      clip-path: polygon(13px 0%, calc(100% - 13px) 0%, 100% 50%, calc(100% - 13px) 100%, 13px 100%, 0% 50%);
      border: 2px solid rgba(165, 243, 252, 0.55);
      background: radial-gradient(circle at 30% 20%, rgba(186, 230, 253, 0.28), transparent 65%);
      pointer-events: none;
    }

    .crystal-btn:hover {
      transform: translateY(-3px) scale(1.06);
      filter: brightness(1.18) drop-shadow(0 6px 16px rgba(56, 189, 248, 0.55));
    }

    .crystal-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    .crystal-btn.emerald-gem {
      background: linear-gradient(135deg, rgba(8, 72, 64, 0.92) 0%, rgba(16, 134, 108, 0.88) 50%, rgba(6, 52, 48, 0.95) 100%);
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.5), inset 0 0 15px rgba(110, 231, 183, 0.4);
    }

    .crystal-btn.amber-gem {
      background: linear-gradient(135deg, rgba(92, 45, 12, 0.92) 0%, rgba(180, 83, 9, 0.88) 50%, rgba(68, 28, 6, 0.95) 100%);
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.45), inset 0 0 15px rgba(253, 230, 138, 0.35);
    }

    .crystal-btn.next-gem {
      background: linear-gradient(135deg, rgba(46, 26, 106, 0.92) 0%, rgba(91, 33, 182, 0.88) 50%, rgba(30, 18, 74, 0.95) 100%);
      box-shadow: 0 0 25px rgba(167, 139, 250, 0.5), inset 0 0 15px rgba(221, 214, 254, 0.35);
      padding: 0 24px;
    }

    /* Speed Pip Indicators inside Speed Button */
    .speed-pips {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .speed-pip {
      width: 10px;
      height: 18px;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      background: rgba(165, 243, 252, 0.25);
      transition: all 0.25s ease;
    }
    .speed-pip.active {
      background: #7df9ff;
      box-shadow: 0 0 10px #7df9ff;
      transform: scale(1.15);
    }

    /* Sky Start Trigger Crystal (Top Center) */
    #skyTrigger {
      position: absolute;
      top: 11%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #skyTrigger.hidden-trigger {
      opacity: 0;
      transform: translateX(-50%) scale(0.4);
      pointer-events: none;
    }

    @keyframes pulseCrystal {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        filter: drop-shadow(0 0 18px rgba(125, 249, 255, 0.75));
      }
      50% {
        transform: scale(1.13) rotate(15deg);
        filter: drop-shadow(0 0 34px rgba(56, 189, 248, 1));
      }
    }

    .trigger-svg {
      width: 135px;
      height: 135px;
      animation: pulseCrystal 3s ease-in-out infinite;
    }

    /* Individual Word Snowflake Card */
    .word-snowflake {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform, top, left;
      transition: filter 0.2s ease;
    }

    .word-snowflake:hover {
      filter: brightness(1.2) drop-shadow(0 0 22px rgba(125, 249, 255, 0.95));
      z-index: 15;
    }

    /* Ornate Rotating SVG Snowflake Frame behind the Word Medallion */
    .snowflake-ornament {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: drop-shadow(0 6px 16px rgba(3, 18, 38, 0.7));
    }

    /* Faceted Crystal Word Medallion (No white boxes! Rich deep sapphire/cyan crystal plate) */
    .crystal-word-plate {
      position: relative;
      z-index: 2;
      padding: 14px 26px;
      min-width: 140px;
      background: radial-gradient(ellipse at center, rgba(8, 47, 84, 0.96) 0%, rgba(5, 29, 58, 0.98) 70%, rgba(12, 74, 110, 0.95) 100%);
      clip-path: polygon(
        18px 0%,
        calc(100% - 18px) 0%,
        100% 28%,
        100% 72%,
        calc(100% - 18px) 100%,
        18px 100%,
        0% 72%,
        0% 28%
      );
      border-top: 2px solid rgba(165, 243, 252, 0.8);
      border-bottom: 2px solid rgba(56, 189, 248, 0.75);
      box-shadow:
        0 0 24px rgba(56, 189, 248, 0.6),
        inset 0 0 18px rgba(125, 249, 255, 0.35);
      display: flex;
       flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Inner geometric crystal facet rim */
    .crystal-word-plate::after {
      content: '';
      position: absolute;
      inset: 4px;
      clip-path: polygon(
        15px 0%,
        calc(100% - 15px) 0%,
        100% 28%,
        100% 72%,
        calc(100% - 15px) 100%,
        15px 100%,
        0% 72%,
        0% 28%
      );
      border: 1.5px solid rgba(186, 230, 253, 0.45);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.12) 0%, transparent 45%, rgba(56, 189, 248, 0.12) 100%);
      pointer-events: none;
    }

    /* THE UPSIDE-DOWN WORD: Strictly rotated 180 degrees, large & ultra-clear */
    .upside-down-word {
      display: inline-block;
      transform: rotate(180deg);
      font-size: clamp(26px, 2.75vw, 44px);
      font-weight: 900;
      color: #f0fdff;
      text-shadow:
        0 2px 6px rgba(0, 0, 0, 0.85),
        0 0 14px rgba(125, 249, 255, 0.65);
      letter-spacing: 1.2px;
      white-space: nowrap;
      line-height: 1.15;
    }

    /* Order crystal pips on top of each snowflake so sequence is unmistakable */
    .order-gems {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      opacity: 0.9;
    }
    .order-gem-dot {
      width: 7px;
      height: 7px;
      background: #7df9ff;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      box-shadow: 0 0 6px #7df9ff;
    }

    @keyframes popSparkle {
      0% { transform: scale(1); }
      40% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }
    .snowflake-bounce {
      animation: popSparkle 0.45s ease-out;
    }

    /* Pine Cone Lantern Glow during Celebration */
    .pine-cone {
      transition: filter 0.5s ease, fill 0.5s ease;
    }
    .cone-glow {
      fill: #fbbf24 !important;
      filter: drop-shadow(0 0 14px #f59e0b) drop-shadow(0 0 25px #fef08a);
    }
  </style>
</head>
<body>

  <!-- 1. Living Winter Sky & Aurora Borealis Canvas -->
  <canvas id="skyCanvas"></canvas>

  <!-- 2. Multi-Layered Vector Pine Forest & Sculpted Snowdrifts (No characters, 100% custom SVG) -->
  <svg id="forestLayer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Gradients for distant mountains & snowdrifts -->
      <linearGradient id="distantPeakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0d2b4e" stop-opacity="0.85" />
        <stop offset="100%" stop-color="#071930" stop-opacity="0.98" />
      </linearGradient>

      <linearGradient id="snowDriftBack" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3b82a6" />
        <stop offset="100%" stop-color="#163e5c" />
      </linearGradient>

      <linearGradient id="snowDriftMid" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#67b7dc" />
        <stop offset="50%" stop-color="#387ca3" />
        <stop offset="100%" stop-color="#194263" />
      </linearGradient>

      <linearGradient id="snowDriftFront" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9be2f8" />
        <stop offset="35%" stop-color="#56a8d0" />
        <stop offset="100%" stop-color="#1e4e75" />
      </linearGradient>

      <!-- Pine Needles & Snow Cap Gradients -->
      <linearGradient id="pineDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0f3d3e" />
        <stop offset="100%" stop-color="#062024" />
      </linearGradient>

      <linearGradient id="pineRichGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1b5e57" />
        <stop offset="60%" stop-color="#0d3b3a" />
        <stop offset="100%" stop-color="#062326" />
      </linearGradient>

      <linearGradient id="pineForeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#227468" />
        <stop offset="50%" stop-color="#114b46" />
        <stop offset="100%" stop-color="#082829" />
      </linearGradient>

      <linearGradient id="snowCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#d8f8ff" />
        <stop offset="65%" stop-color="#88d4f2" />
        <stop offset="100%" stop-color="#4794bc" />
      </linearGradient>

      <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2a1810" />
        <stop offset="45%" stop-color="#4e2f21" />
        <stop offset="100%" stop-color="#1c0f0a" />
      </linearGradient>

      <!-- Ornate Ice Crystal Pattern on Foreground Snowdrifts -->
      <pattern id="frostFacetPattern" width="120" height="60" patternUnits="userSpaceOnUse">
        <path d="M 0 30 L 30 15 L 60 30 L 90 15 L 120 30 L 90 45 L 60 30 L 30 45 Z" fill="none" stroke="rgba(207, 250, 254, 0.16)" stroke-width="1.2"/>
        <circle cx="60" cy="30" r="2.5" fill="rgba(224, 242, 254, 0.35)"/>
      </pattern>

      <!-- Reusable Detailed Pine Tree Template -->
      <g id="detailedPineTree">
        <!-- Textured Bark Trunk -->
        <path d="M -22 0 L -12 -390 L 12 -390 L 22 0 Z" fill="url(#trunkGrad)" />
        <path d="M -8 -80 L -4 -260 M 6 -40 L 3 -210" stroke="#1a0d08" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

        <!-- Tier 1 (Bottom Branches) -->
        <path d="M 0 -175 L -165 -35 L -115 -45 L -145 -18 L -65 -26 L -80 -8 L 0 -22 L 80 -8 L 65 -26 L 145 -18 L 115 -45 L 165 -35 Z" fill="url(#pineForeGrad)" />
        <!-- Tier 1 Snow Cap -->
        <path d="M 0 -175 L -148 -42 Q -95 -28 -68 -48 Q -35 -25 0 -45 Q 35 -25 68 -48 Q 95 -28 148 -42 Z" fill="url(#snowCapGrad)" opacity="0.92" />

        <!-- Tier 2 -->
        <path d="M 0 -255 L -142 -115 L -98 -122 L -128 -96 L -55 -105 L 0 -98 L 55 -105 L 128 -96 L 98 -122 L 142 -115 Z" fill="url(#pineRichGrad)" />
        <path d="M 0 -255 L -126 -120 Q -80 -105 -52 -124 Q -22 -104 0 -122 Q 22 -104 52 -124 Q 80 -105 126 -120 Z" fill="url(#snowCapGrad)" opacity="0.95" />

        <!-- Tier 3 -->
        <path d="M 0 -330 L -116 -195 L -78 -202 L -102 -180 L -42 -188 L 0 -182 L 42 -188 L 102 -180 L 78 -202 L 116 -195 Z" fill="url(#pineForeGrad)" />
        <path d="M 0 -330 L -102 -200 Q -62 -186 -36 -202 Q 0 -184 36 -202 Q 62 -186 102 -200 Z" fill="url(#snowCapGrad)" opacity="0.95" />

        <!-- Tier 4 -->
        <path d="M 0 -395 L -88 -275 L -58 -282 L -75 -262 L 0 -268 L 75 -262 L 58 -282 L 88 -275 Z" fill="url(#pineRichGrad)" />
        <path d="M 0 -395 L -76 -280 Q -38 -266 0 -282 Q 38 -266 76 -280 Z" fill="url(#snowCapGrad)" />

        <!-- Tier 5 (Crown) -->
        <path d="M 0 -455 L -56 -345 L -28 -350 L 0 -340 L 28 -350 L 56 -345 Z" fill="url(#pineForeGrad)" />
        <path d="M 0 -455 L -48 -352 Q -22 -338 0 -354 Q 22 -338 48 -352 Z" fill="url(#snowCapGrad)" />

        <!-- Decorative Pine Cones -->
        <g class="pine-cone" fill="#6b3e26" stroke="#3d2214" stroke-width="1.5">
          <ellipse cx="-58" cy="-105" rx="7" ry="12" transform="rotate(12 -58 -105)" />
          <ellipse cx="64" cy="-100" rx="7" ry="12" transform="rotate(-10 64 -100)" />
          <ellipse cx="-42" cy="-190" rx="6.5" ry="11" transform="rotate(8 -42 -190)" />
          <ellipse cx="48" cy="-185" rx="6.5" ry="11" transform="rotate(-12 48 -185)" />
          <ellipse cx="-24" cy="-272" rx="6" ry="10" />
          <ellipse cx="28" cy="-268" rx="6" ry="10" />
          <ellipse cx="-88" cy="-32" rx="8" ry="13" transform="rotate(14 -88 -32)" />
          <ellipse cx="92" cy="-28" rx="8" ry="13" transform="rotate(-14 92 -28)" />
        </g>
      </g>

      <!-- Distant Silhouette Pine -->
      <g id="distantPine">
        <path d="M 0 -240 L -65 -140 L -42 -145 L -82 -75 L -52 -82 L -95 0 L 95 0 L 52 -82 L 82 -75 L 42 -145 L 65 -140 Z" fill="url(#pineDarkGrad)" opacity="0.85"/>
        <path d="M 0 -240 L -55 -148 Q 0 -135 55 -148 Z M -42 -145 L -72 -82 Q 0 -68 72 -82 L 42 -145 Z" fill="#6ab7d6" opacity="0.35"/>
      </g>
    </defs>

    <!-- Distant Frosty Mountain Peaks -->
    <path d="M 0 840 L 210 590 L 430 740 L 710 530 L 980 720 L 1260 550 L 1540 710 L 1760 560 L 1920 690 L 1920 1080 L 0 1080 Z" fill="url(#distantPeakGrad)" />
    <path d="M 210 590 L 265 655 L 210 640 L 165 665 Z M 710 530 L 785 615 L 705 595 L 640 620 Z M 1260 550 L 1335 630 L 1260 610 L 1190 635 Z M 1760 560 L 1820 630 L 1755 615 L 1705 635 Z" fill="#5ea4c7" opacity="0.25" />

    <!-- Background Pine Forest Layer -->
    <g opacity="0.78">
      <use href="#distantPine" transform="translate(110, 860) scale(1.1)" />
      <use href="#distantPine" transform="translate(260, 880) scale(0.85)" />
      <use href="#distantPine" transform="translate(420, 895) scale(0.95)" />
      <use href="#distantPine" transform="translate(610, 910) scale(0.75)" />
      <use href="#distantPine" transform="translate(1310, 910) scale(0.8)" />
      <use href="#distantPine" transform="translate(1490, 895) scale(1.0)" />
      <use href="#distantPine" transform="translate(1670, 875) scale(0.9)" />
      <use href="#distantPine" transform="translate(1820, 855) scale(1.15)" />
    </g>

    <!-- Back Snowdrift Hill -->
    <path d="M 0 865 Q 380 805 840 875 Q 1380 940 1920 835 L 1920 1080 L 0 1080 Z" fill="url(#snowDriftBack)" />

    <!-- Midground Interactive Swaying Pines -->
    <g class="pine-interactive sway-left" data-tree="1" transform="translate(310, 935) scale(0.88)">
      <use href="#detailedPineTree" />
    </g>
    <g class="pine-interactive sway-right" data-tree="2" transform="translate(480, 960) scale(0.68)">
      <use href="#detailedPineTree" />
    </g>
    <g class="pine-interactive sway-left" data-tree="3" transform="translate(1445, 960) scale(0.72)">
      <use href="#detailedPineTree" />
    </g>
    <g class="pine-interactive sway-right" data-tree="4" transform="translate(1620, 935) scale(0.92)">
      <use href="#detailedPineTree" />
    </g>

    <!-- Midground Snowdrift with Frost Pattern -->
    <path d="M 0 905 Q 480 985 1020 915 Q 1520 855 1920 925 L 1920 1080 L 0 1080 Z" fill="url(#snowDriftMid)" />
    <path d="M 0 905 Q 480 985 1020 915 Q 1520 855 1920 925 L 1920 1080 L 0 1080 Z" fill="url(#frostFacetPattern)" />

    <!-- Grand Foreground Hero Pine Trees on Left and Right Framing the Widescreen -->
    <g class="pine-interactive sway-right" data-tree="5" transform="translate(95, 1020) scale(1.38)">
      <use href="#detailedPineTree" />
    </g>
    <g class="pine-interactive sway-left" data-tree="6" transform="translate(235, 1045) scale(1.06)">
      <use href="#detailedPineTree" />
    </g>
    <g class="pine-interactive sway-right" data-tree="7" transform="translate(1695, 1045) scale(1.08)">
      <use href="#detailedPineTree" />
    </g>
    <g class="pine-interactive sway-left" data-tree="8" transform="translate(1835, 1025) scale(1.42)">
      <use href="#detailedPineTree" />
    </g>

    <!-- Foreground Sculpted Crystal Snowdrift -->
    <path d="M 0 975 Q 340 930 740 985 Q 1180 1035 1560 965 Q 1760 935 1920 970 L 1920 1080 L 0 1080 Z" fill="url(#snowDriftFront)" />
    <path d="M 0 975 Q 340 930 740 985 Q 1180 1035 1560 965 Q 1760 935 1920 970 L 1920 1080 L 0 1080 Z" fill="url(#frostFacetPattern)" />
    <!-- Glowing Ice Ridge Line -->
    <path d="M 0 975 Q 340 930 740 985 Q 1180 1035 1560 965 Q 1760 935 1920 970" fill="none" stroke="#cffafe" stroke-width="3" opacity="0.65" />

    <!-- Foreground Sparkling Ice Crystals Grown in the Snowbank -->
    <g transform="translate(640, 995)" opacity="0.85">
      <polygon points="0,0 -10,-28 0,-42 10,-28" fill="#a5f3fc" />
      <polygon points="12,4 8,-18 18,-28 22,-14" fill="#67e8f9" />
      <polygon points="-12,4 -22,-16 -14,-26 -6,-14" fill="#38bdf8" />
    </g>
    <g transform="translate(1280, 985)" opacity="0.85">
      <polygon points="0,0 -12,-32 0,-48 12,-32" fill="#a5f3fc" />
      <polygon points="14,4 10,-22 20,-32 24,-16" fill="#67e8f9" />
      <polygon points="-14,4 -24,-18 -16,-28 -8,-14" fill="#38bdf8" />
    </g>
  </svg>

  <!-- 3. Top Stylized Control Bar (Language, Speed, Replay, Celebrate, Next) -->
  <div id="topBar">
    <!-- Single Language Toggle Button (УКР / РУС) -->
    <button id="langBtn" class="crystal-btn" title="Мова / Язык">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <polygon points="12,2 22,12 12,22 2,12" stroke="#7df9ff" stroke-width="2" fill="rgba(125,249,255,0.2)" />
        <circle cx="12" cy="12" r="4" fill="#e0f2fe" />
      </svg>
      <span id="langLabel">УКР</span>
    </button>

    <!-- 3-Speed Switcher (Slow, Medium, Fast) -->
    <button id="speedBtn" class="crystal-btn" title="Швидкість">
      <svg width="28" height="24" viewBox="0 0 28 24" fill="none">
        <path d="M2 8 H18 C21 8 22 4 19 4 C17 4 16 6 17 7" stroke="#7df9ff" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M2 13 H23 C26 13 27 17 24 18 C21 19 20 16 21 15" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M5 18 H15 C17 18 18 21 15 21" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
      </svg>

    // Procedural templates for infinite variety after curated pool cycles
    const PROCEDURAL_PARTS = {

    function generateProceduralSentence() {
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const act = pick(PROCEDURAL_PARTS.actions);
      if (act.type === "shape") {
        const h = pick(PROCEDURAL_PARTS.Hands);
        const s = pick(PROCEDURAL_PARTS.shapes);
        return { uk: `${act.uk} ${h.uk} ${s.uk}`, ru: `${act.ru} ${h.ru} ${s.ru}` };
      } else if (act.type === "object") {
        const h = pick(PROCEDURAL_PARTS.Hands);
        const o = pick(PROCEDURAL_PARTS.objects);
        return { uk: `${act.uk} ${h.uk} ${o.uk}`, ru: `${act.ru} ${h.ru} ${o.ru}` };
      } else if (act.type === "touch") {
        const t = pick(PROCEDURAL_PARTS.touches);
        return { uk: `${act.uk} ${t.uk}`, ru: `${act.ru} ${t.ru}` };
      } else {
        const j = pick(PROCEDURAL_PARTS.jumps);
        return { uk: `${act.uk} ${j.uk}`, ru: `${act.ru} ${j.ru}` };

    /********************************************************************
     * 2. SYNTHESIZED WEB AUDIO ENGINE (No external files, rich feedback)
     ********************************************************************/
    class WinterAudio {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Crystal glockenspiel note when a word snowflake spawns or is clicked
      playCrystalNote(stepIndex = 0, octaveShift = 0) {
        this.init();
        if (!this.ctx) return;
        const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51];
        const freq = scale[stepIndex % scale.length] * Math.pow(2, octaveShift);
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const overtone = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        overtone.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        overtone.frequency.setValueAtTime(freq * 2, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.15);

        osc.connect(gain);
        overtone.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        overtone.start(now);
        osc.stop(now + 1.2);
        overtone.stop(now + 1.2);
      }

      // Soft winter breeze sound on starting snowfall or changing speed
      playWindSwirl() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.7;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(380, now);
        filter.frequency.exponentialRampToValueAtTime(920, now + 0.35);
        filter.frequency.exponentialRampToValueAtTime(300, now + 0.7);
        filter.Q.value = 4.5;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.25);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
        noise.stop(now + 0.7);
      }

      // 5 Distinct Non-Verbal Musical Celebrations
      playCelebrationTheme(themeIndex) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        if (themeIndex === 0) {
          // 1. Aurora Harp Arpeggio
          const notes = [523.25, 659.25, 783.99, 987.77, 1046.5, 1318.51, 1567.98, 2093.0];
          notes.forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + idx * 0.09);
            g.gain.setValueAtTime(0.001, now + idx * 0.09);
            g.gain.linearRampToValueAtTime(0.18, now + idx * 0.09 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 1.1);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 1.15);
          });
        } else if (themeIndex === 1) {
          // 2. Festive Pine Chime Fanfare
          const chordSequence = [
            { t: 0, freqs: [587.33, 880, 1174.66] },
            { t: 0.22, freqs: [659.25, 987.77, 1318.51] },
            { t: 0.45, freqs: [783.99, 1174.66, 1567.98] },
            { t: 0.72, freqs: [1046.5, 1318.51, 1567.98, 2093.0] }
          ];
          chordSequence.forEach(item => {
            item.freqs.forEach(f => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(f, now + item.t);
              g.gain.setValueAtTime(0.001, now + item.t);
              g.gain.linearRampToValueAtTime(0.12, now + item.t + 0.02);
              g.gain.exponentialRampToValueAtTime(0.001, now + item.t + 0.85);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(now + item.t);
              osc.stop(now + item.t + 0.9);
            });
          });
        } else if (themeIndex === 2) {
          // 3. Ice Crystal Fireworks Pop & Harmonic Shimmer
          for (let i = 0; i < 6; i++) {
            const delay = i * 0.16;
            const base = 600 + i * 180;
            [base, base * 1.25, base * 1.5].forEach(f => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, now + delay);
              osc.frequency.exponentialRampToValueAtTime(f * 1.06, now + delay + 0.4);
              g.gain.setValueAtTime(0.12, now + delay);
              g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.65);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(now + delay);
              osc.stop(now + delay + 0.7);
            });
          }
        } else if (themeIndex === 3) {
          // 4. Golden Stardust Celesta Swirl
          const melody = [783.99, 987.77, 880.0, 1046.5, 987.77, 1174.66, 1318.51, 1567.98];
          melody.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            g.gain.setValueAtTime(0.16, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.75);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.8);
          });
        } else {
          // 5. Warm Winter Lantern Bell Symphony
          const bells = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
          bells.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.11);
            g.gain.setValueAtTime(0.18, now + i * 0.11);
            g.gain.exponentialRampToValueAtTime(0.0008, now + i * 0.11 + 1.3);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now + i * 0.11);
            osc.stop(now + i * 0.11 + 1.35);
          });
        }
      }
    }

    /********************************************************************
     * 3. GAME STATE & SPEED CONFIGURATION (3rd-4th Grade Calibrated)
     ********************************************************************/
    // Speeds:
    // 0 = Slow (Повільно): ~15s fall duration, 2200ms between consecutive words
    // 1 = Medium (Середньо): ~11s fall duration, 1550ms between consecutive words
    // 2 = Fast (Швидко, але комфортно): ~8s fall duration, 1100ms between consecutive words
    const SPEED_CONFIGS = [
      { id: 1, fallDurationSec: 15.0, spawnIntervalMs: 2150, ambientMultiplier: 0.85 },
      { id: 2, fallDurationSec: 11.0, spawnIntervalMs: 1500, ambientMultiplier: 1.25 },
      { id: 3, fallDurationSec: 7.8,  spawnIntervalMs: 1050, ambientMultiplier: 1.75 }

    let currentSpeedIdx = 1; // Default Medium (2 pips)
    let sentenceQueue = [];
    let currentSentenceObj = null;

    // Falling word snowflakes state
    let activeWordFlakes = [];

    let spawnTimerAccum = 0;
    let isDropping = false;
    let celebrationIndex = 0;
    let auroraBoost = 0;
    let auroraHueShift = 0;

    // Shuffle helper
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getNextSentenceObj() {
      if (sentenceQueue.length === 0) {
        sentenceQueue = shuffleArray(CURATED_SENTENCES);
        // Also inject 8 fresh procedural sentences each cycle for infinite non-repeating play
        for (let i = 0; i < 8; i++) {
          sentenceQueue.push(generateProceduralSentence());
        }
      }
      return sentenceQueue.pop();
    }

    /********************************************************************
     * 4. CUSTOM SVG GENERATOR FOR ORNATE SNOWFLAKE BACKDROPS
     ********************************************************************/
    function createOrnateSnowflakeSVG(variant = 0) {
      const colors = ['#7df9ff', '#bae6fd', '#a5f3fc', '#c4b5fd'];
      const strokeColor = colors[variant % colors.length];
      const branchPath = variant % 2 === 0
        ? `M 100 10 L 100 190 M 22 55 L 178 145 M 22 145 L 178 55
           M 86 28 L 100 40 L 114 28 M 86 172 L 100 160 L 114 172
           M 34 76 L 52 72 L 48 54 M 152 146 L 148 128 L 166 124
           M 48 146 L 52 128 L 34 124 M 166 76 L 148 72 L 152 54`
        : `M 100 8 L 100 192 M 20 54 L 180 146 M 20 146 L 180 54
           M 82 34 L 100 48 L 118 34 M 82 166 L 100 152 L 118 166
           M 38 82 L 58 76 L 52 56 M 148 144 L 142 124 L 162 118
           M 52 144 L 58 124 L 38 118 M 162 82 L 142 76 L 148 56`;

      return `
        <svg class="snowflake-ornament" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <g stroke="${strokeColor}" stroke-width="2.5" stroke-linecap="round" opacity="0.72" fill="none">
            <path d="${branchPath}" />
            <polygon points="100,52 142,76 142,124 100,148 58,124 58,76" stroke-width="1.8" fill="rgba(56, 189, 248, 0.12)" />
          </g>
        </svg>
      `;
    }

    /********************************************************************
     * 5. WORD SNOWFLAKE SPAWNING & SEQUENTIAL MOTION
     ********************************************************************/
    const stageEl = document.getElementById('snowflakeStage');
    const skyTriggerEl = document.getElementById('skyTrigger');

    function clearCurrentSnowflakes() {
      activeWordFlakes.forEach(f => {
        if (f.el && f.el.parentNode) {
          f.el.parentNode.removeChild(f.el);
        }
      });
      activeWordFlakes = [];
      pendingWords = [];
      spawnTimerAccum = 0;
      isDropping = false;
    }

    function prepareRound(useSameSentence = false) {
      clearCurrentSnowflakes();
      if (!useSameSentence || !currentSentenceObj) {
        currentSentenceObj = getNextSentenceObj();
      }
      // Show pulsing sky crystal inviting a click
      skyTriggerEl.classList.remove('hidden-trigger');
    }

    function startDroppingSequence() {
      if (!currentSentenceObj) {
        currentSentenceObj = getNextSentenceObj();
      }
      clearCurrentSnowflakes();
      skyTriggerEl.classList.add('hidden-trigger');
      sound.playWindSwirl();

      // Burst of frost sparkles from the sky trigger position
      spawnCrystalBurst(window.innerWidth * 0.5, window.innerHeight * 0.16, '#7df9ff', 28);

      const rawText = currentSentenceObj[currentLang];
      const words = rawText.trim().split(/\s+/);
      const total = words.length;

      // Calculate organized widescreen lanes so snowflakes NEVER overlap horizontally
      // For sentences with 5-7 words, we spread them across 12% to 88% of screen width.
      const leftMargin = 0.11;
      const rightMargin = 0.89;
      const usableSpan = rightMargin - leftMargin;

      pendingWords = words.map((word, idx) => {
        const ratio = total === 1 ? 0.5 : idx / (total - 1);
        const laneXRatio = leftMargin + ratio * usableSpan;
        // Stagger resting snowbank height slightly in a gentle arc so adjacent plates never collide
        const rowOffset = (idx % 2 === 0) ? 0 : -58;
        return {
          word,
          index: idx,
          total,
          laneXRatio,
          targetYRatio: 0.77 + (rowOffset / window.innerHeight)
        };
      });

      isDropping = true;
      // Immediately spawn the first snowflake on click!
      spawnNextWordSnowflake();
      spawnTimerAccum = 0;
    }

    function spawnNextWordSnowflake() {
      if (pendingWords.length === 0) return;
      const item = pendingWords.shift();

      sound.playCrystalNote(item.index, 0);

      const el = document.createElement('div');
      el.className = 'word-snowflake';

      // Build order crystal pips (1 pip for 1st word, 2 for 2nd, etc.)
      let pipsHTML = '<div class="order-gems">';
      for (let i = 0; i <= item.index; i++) {
        pipsHTML += '<span class="order-gem-dot"></span>';
      }
      pipsHTML += '</div>';

      el.innerHTML = `
        ${createOrnateSnowflakeSVG(item.index)}
        <div class="crystal-word-plate">
          ${pipsHTML}
          <span class="upside-down-word">${item.word}</span>
        </div>
      `;

      stageEl.appendChild(el);

      // Measure dimensions so we can center accurately in its lane
      const rect = el.getBoundingClientRect();
      const width = Math.max(rect.width, 160);
      const height = Math.max(rect.height, 110);

      const startX = item.laneXRatio * window.innerWidth;
      const startY = -height * 0.65;

      // Spawn small frost burst at top entry point
      spawnCrystalBurst(startX, 32, '#bae6fd', 14);

      const flakeObj = {
        el,
        index: item.index,
        laneXRatio: item.laneXRatio,
        x: startX,
        y: startY,
        targetY: item.targetYRatio * window.innerHeight,
        swayPhase: item.index * 1.3,
        swayAmp: 14,
        settled: false,
        width,
        height
      };

      // Interactive click on individual snowflake: chime, sparkle & bounce
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.playCrystalNote(flakeObj.index, 1);
        el.classList.remove('snowflake-bounce');
        void el.offsetWidth;
        el.classList.add('snowflake-bounce');
        spawnCrystalBurst(flakeObj.x, flakeObj.y, '#7df9ff', 22);
      });

      activeWordFlakes.push(flakeObj);
    }

    /********************************************************************
     * 6. LIVING WINTER SKY, AURORA BOREALIS & PARTICLE ENGINE
     ********************************************************************/
    const skyCanvas = document.getElementById('skyCanvas');
    const skyCtx = skyCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fxCanvas');
    const fxCtx = fxCanvas.getContext('2d');

    let stars = [];
    let ambientSnow = [];
    let fxParticles = [];
    let fractalFireworks = [];

    function resizeCanvases() {
      skyCanvas.width = window.innerWidth;
      skyCanvas.height = window.innerHeight;
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;

      // Reposition active word snowflakes proportionally on resize
      activeWordFlakes.forEach(f => {
        f.x = f.laneXRatio * window.innerWidth;
        const rowOffset = (f.index % 2 === 0) ? 0 : -58;
        f.targetY = 0.77 * window.innerHeight + rowOffset;
      });
    }

    function initEnvironmentParticles() {
      resizeCanvases();
      stars = [];
      for (let i = 0; i < 95; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * (window.innerHeight * 0.65),
          r: Math.random() * 2.1 + 0.6,
          alpha: Math.random(),
          speed: Math.random() * 1.8 + 0.5
        });
      }

      ambientSnow = [];
      for (let i = 0; i < 130; i++) {
        ambientSnow.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 3.5 + 1.2,
          vy: Math.random() * 38 + 22,
          vx: (Math.random() - 0.5) * 18,
          phase: Math.random() * Math.PI * 2,
          isStar: Math.random() > 0.72
        });
      }
    }

    function spawnCrystalBurst(x, y, color = '#7df9ff', count = 24) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
        const speed = Math.random() * 190 + 55;
        fxParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 30,
          size: Math.random() * 7 + 3,
          color,
          life: 1.0,
          decay: Math.random() * 0.7 + 0.65,
          rotation: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 5
        });
      }
    }

    /********************************************************************
     * 7. FIVE VARIED NON-VERBAL CELEBRATION SPECTACLES
     ********************************************************************/
    function triggerActiveCelebration() {
      const mode = celebrationIndex % 5;
      celebrationIndex++;

      sound.playCelebrationTheme(mode);

      const W = window.innerWidth;
      const H = window.innerHeight;

      if (mode === 0) {
        // 1. Rainbow Aurora Borealis Sky Surge + Crystal Starbursts
        auroraBoost = 1.0;
        auroraHueShift = 120;
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            spawnCrystalBurst(W * (0.2 + i * 0.15), H * (0.22 + (i % 2) * 0.08), '#6ee7b7', 30);
          }, i * 110);
        }
      } else if (mode === 1) {
        // 2. Pine Forest Shake & Glittering Snow Cascade from Branches
        const trees = document.querySelectorAll('.pine-interactive');
        trees.forEach((t, idx) => {
          setTimeout(() => {
            t.classList.remove('shake-tree');
            void t.offsetWidth;
            t.classList.add('shake-tree');
            const rect = t.getBoundingClientRect();
            spawnCrystalBurst(rect.left + rect.width / 2, rect.top + rect.height * 0.35, '#e0f2fe', 26);
          }, idx * 70);
        });
      } else if (mode === 2) {
        // 3. Geometric Ice Crystal Fractal Fireworks
        const colors = ['#7df9ff', '#f472b6', '#facc15', '#a78bfa', '#34d399'];
        colors.forEach((col, idx) => {
          setTimeout(() => {
            const fxX = W * (0.18 + idx * 0.16);
            const fxY = H * (0.24 + (idx % 2) * 0.12);
            fractalFireworks.push({
              x: fxX,
              y: fxY,
              radius: 5,
              maxRadius: 150,
              color: col,
              alpha: 1.0
            });
            spawnCrystalBurst(fxX, fxY, col, 36);
          }, idx * 140);
        });
      } else if (mode === 3) {
        // 4. Swirling Golden & Cyan Frost Stardust Vortex from Snowdrifts
        for (let i = 0; i < 85; i++) {
          const startX = Math.random() * W;
          const startY = H * 0.88 + Math.random() * 80;
          fxParticles.push({
            x: startX,
            y: startY,
            vx: (Math.random() - 0.5) * 160,
            vy: -(Math.random() * 340 + 180),
            size: Math.random() * 8 + 4,
            color: i % 2 === 0 ? '#fde047' : '#67e8f9',
            life: 1.25,
            decay: 0.65,
            rotation: Math.random() * Math.PI,
            vRot: 4
          });
        }
      } else {
        // 5. Pine Cones Light Up Like Golden Winter Lanterns Across All Trees
        const cones = document.querySelectorAll('.pine-cone');
        cones.forEach(c => c.classList.add('cone-glow'));
        for (let i = 0; i < 4; i++) {
          spawnCrystalBurst(W * (0.2 + i * 0.2), H * 0.35, '#fbbf24', 28);
        }
        setTimeout(() => {
          cones.forEach(c => c.classList.remove('cone-glow'));
        }, 2200);
      }

      // Bounce all currently visible word snowflakes in celebration
      activeWordFlakes.forEach((f, i) => {
        setTimeout(() => {
          if (f.el) {
            f.el.classList.remove('snowflake-bounce');
            void f.el.offsetWidth;
            f.el.classList.add('snowflake-bounce');
          }
        }, i * 65);
      });
    }

    /********************************************************************
     * 8. MAIN 60FPS ANIMATION LOOP
     ********************************************************************/
    let lastTime = performance.now();

    function renderSkyAndAurora(nowSec) {
      const W = skyCanvas.width;
      const H = skyCanvas.height;

      // Deep night winter sky gradient
      const skyGrad = skyCtx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#020b18');
      skyGrad.addColorStop(0.45, '#07213c');
      skyGrad.addColorStop(0.8, '#0f395e');
      skyGrad.addColorStop(1, '#194d76');
      skyCtx.fillStyle = skyGrad;
      skyCtx.fillRect(0, 0, W, H);

      // Twinkling frost stars
      stars.forEach(st => {
        const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(nowSec * st.speed + st.alpha * 10));
        skyCtx.fillStyle = `rgba(224, 242, 254, ${twinkle})`;
        skyCtx.beginPath();
        skyCtx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        skyCtx.fill();
      });

      // Flowing Aurora Borealis Ribbons
      if (auroraBoost > 0) {
        auroraBoost = Math.max(0, auroraBoost - 0.008);
      }
      const ribbonCount = 3;
      for (let r = 0; r < ribbonCount; r++) {
        skyCtx.save();
        skyCtx.beginPath();
        const baseY = H * (0.16 + r * 0.08);
        skyCtx.moveTo(0, baseY);

        for (let x = 0; x <= W; x += 60) {
          const wave = Math.sin(x * 0.003 + nowSec * (0.7 + r * 0.2) + r) * (34 + auroraBoost * 45)
                     + Math.cos(x * 0.007 - nowSec * 0.4) * 18;
          skyCtx.lineTo(x, baseY + wave);
        }
        skyCtx.lineTo(W, baseY + 140);
        skyCtx.lineTo(0, baseY + 140);
        skyCtx.closePath();

        const aurGrad = skyCtx.createLinearGradient(0, baseY - 40, 0, baseY + 140);
        const alphaPeak = 0.16 + auroraBoost * 0.28;
        if (r === 0) {
          aurGrad.addColorStop(0, 'rgba(45, 212, 191, 0)');
          aurGrad.addColorStop(0.4, `rgba(45, 212, 191, ${alphaPeak})`);
          aurGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
        } else if (r === 1) {
          aurGrad.addColorStop(0, 'rgba(56, 189, 248, 0)');
          aurGrad.addColorStop(0.5, `rgba(129, 140, 248, ${alphaPeak * 0.85})`);
          aurGrad.addColorStop(1, 'rgba(167, 139, 250, 0)');
        } else {
          aurGrad.addColorStop(0, 'rgba(52, 211, 153, 0)');
          aurGrad.addColorStop(0.5, `rgba(110, 231, 183, ${alphaPeak * 0.75})`);
          aurGrad.addColorStop(1, 'rgba(16, 185, 129, 0)');
        }

        skyCtx.fillStyle = aurGrad;
        skyCtx.fill();
        skyCtx.restore();
      }
    }

    function updateAndRenderSnowAndFX(dt, nowSec) {
      const W = fxCanvas.width;
      const H = fxCanvas.height;
      fxCtx.clearRect(0, 0, W, H);

      const speedCfg = SPEED_CONFIGS[currentSpeedIdx];
      const snowMult = (isDropping ? 1.35 : 0.75) * speedCfg.ambientMultiplier;

      // 1. Ambient Snowflakes
      ambientSnow.forEach(s => {
        s.y += s.vy * snowMult * dt;
        s.x += (s.vx + Math.sin(nowSec * 1.5 + s.phase) * 16) * dt;

        if (s.y > H + 10) {
          s.y = -10;
          s.x = Math.random() * W;
        }
        if (s.x < -10) s.x = W + 10;
        if (s.x > W + 10) s.x = -10;

        fxCtx.save();
        fxCtx.translate(s.x, s.y);
        if (s.isStar) {
          fxCtx.strokeStyle = 'rgba(207, 250, 254, 0.75)';
          fxCtx.lineWidth = 1.3;
          const r = s.r * 1.6;
          fxCtx.beginPath();
          fxCtx.moveTo(-r, 0); fxCtx.lineTo(r, 0);
          fxCtx.moveTo(0, -r); fxCtx.lineTo(0, r);
          fxCtx.stroke();
        } else {
          fxCtx.fillStyle = 'rgba(224, 242, 254, 0.7)';
          fxCtx.beginPath();
          fxCtx.arc(0, 0, s.r, 0, Math.PI * 2);
          fxCtx.fill();
        }
        fxCtx.restore();
      });

      // 2. Sequential Spawning of Word Snowflakes
      if (isDropping && pendingWords.length > 0) {
        spawnTimerAccum += dt * 1000;
        if (spawnTimerAccum >= speedCfg.spawnIntervalMs) {
          spawnTimerAccum = 0;
          spawnNextWordSnowflake();
        }
      }

      // 3. Update Falling Upside-Down Word Snowflakes
      const fallDistance = H * 0.82;
      const fallPixelsPerSec = fallDistance / speedCfg.fallDurationSec;

      // Draw subtle glowing crystal thread connecting sequential snowflakes so reading order is crystal clear
      if (activeWordFlakes.length > 1) {
        fxCtx.save();
        fxCtx.beginPath();
        fxCtx.strokeStyle = 'rgba(125, 249, 255, 0.26)';
        fxCtx.lineWidth = 2.5;
        fxCtx.setLineDash([8, 10]);
        activeWordFlakes.forEach((f, idx) => {
          if (idx === 0) fxCtx.moveTo(f.x, f.y);
          else fxCtx.lineTo(f.x, f.y);
        });
        fxCtx.stroke();
        fxCtx.restore();
      }

      activeWordFlakes.forEach(f => {
        if (!f.settled) {
          f.y += fallPixelsPerSec * dt;
          if (f.y >= f.targetY) {
            f.y = f.targetY;
            f.settled = true;
            // Gentle chime & snow puff when snowflake lands softly on the foreground snowdrift
            spawnCrystalBurst(f.x, f.y + 28, '#a5f3fc', 10);
          }
        }
        const swayOffset = Math.sin(nowSec * 1.8 + f.swayPhase) * (f.settled ? 4 : f.swayAmp);
        const floatY = f.settled ? Math.sin(nowSec * 2.2 + f.swayPhase) * 5 : 0;

        f.el.style.left = `${f.x + swayOffset}px`;
        f.el.style.top = `${f.y + floatY}px`;
        f.el.style.transform = `translate(-50%, -50%)`;
      });

      // 4. Update Crystal Burst Particles
      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 210 * dt; // gentle gravity
        p.rotation += p.vRot * dt;
        p.life -= p.decay * dt;

        if (p.life <= 0) {
          fxParticles.splice(i, 1);
          continue;
        }

        fxCtx.save();
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rotation);
        fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life));
        fxCtx.fillStyle = p.color;
        // Draw diamond ice crystal shard
        fxCtx.beginPath();
        fxCtx.moveTo(0, -p.size);
        fxCtx.lineTo(p.size * 0.65, 0);
        fxCtx.lineTo(0, p.size);
        fxCtx.lineTo(-p.size * 0.65, 0);
        fxCtx.closePath();
        fxCtx.fill();
        fxCtx.restore();
      }

      // 5. Update Geometric Fractal Fireworks
      for (let i = fractalFireworks.length - 1; i >= 0; i--) {
        const fw = fractalFireworks[i];
        fw.radius += 220 * dt;
        fw.alpha -= 0.85 * dt;
        if (fw.alpha <= 0) {
          fractalFireworks.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.translate(fw.x, fw.y);
        fxCtx.strokeStyle = fw.color;
        fxCtx.globalAlpha = Math.max(0, fw.alpha);
        fxCtx.lineWidth = 3;
        for (let b = 0; b < 6; b++) {
          fxCtx.rotate(Math.PI / 3);
          fxCtx.beginPath();
          fxCtx.moveTo(0, 0);
          fxCtx.lineTo(0, fw.radius);
          fxCtx.moveTo(-fw.radius * 0.25, fw.radius * 0.65);
          fxCtx.lineTo(0, fw.radius * 0.8);
          fxCtx.lineTo(fw.radius * 0.25, fw.radius * 0.65);
          fxCtx.stroke();
        }
        fxCtx.restore();
      }
    }

    function gameLoop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const nowSec = now / 1000;

      renderSkyAndAurora(nowSec);
      updateAndRenderSnowAndFX(dt, nowSec);

      requestAnimationFrame(gameLoop);
    }

    /********************************************************************
     * 9. INTERACTIVE CONTROLS & EVENT LISTENERS
     ********************************************************************/
    // Clicking the sky trigger or anywhere on the background starts dropping the snowflakes
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('#topBar')) return;
      if (!isDropping) {
        startDroppingSequence();
      } else if (pendingWords.length === 0) {
        // If all words have already appeared, clicking the background triggers a celebration!
        triggerActiveCelebration();
      }
    });

    // Clicking any pine tree shakes snow off its branches with a crystal chime
    document.querySelectorAll('.pine-interactive').forEach((treeEl, idx) => {
      treeEl.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.playCrystalNote(idx + 2, 1);
        treeEl.classList.remove('shake-tree');
        void treeEl.offsetWidth;
        treeEl.classList.add('shake-tree');

        const rect = treeEl.getBoundingClientRect();
        spawnCrystalBurst(rect.left + rect.width * 0.5, rect.top + rect.height * 0.4, '#cffafe', 22);

        // If round hasn't started yet, also start dropping snowflakes
        if (!isDropping) {
          startDroppingSequence();
        }
      });
    });

    // 1. Single Language Toggle Button (УКР / РУС)
    const langBtn = document.getElementById('langBtn');
    const langLabel = document.getElementById('langLabel');
    langBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentLang = currentLang === 'uk' ? 'ru' : 'uk';
      langLabel.textContent = currentLang === 'uk' ? 'УКР' : 'РУС';
      sound.playCrystalNote(4, 1);

      // If currently displaying or dropping a sentence, immediately restart it in the selected language
      if (isDropping) {
        startDroppingSequence();
      } else {
        prepareRound(true);
      }
    });

    // 2. Speed Selector Button (Cycles 1 -> 2 -> 3)
    const speedBtn = document.getElementById('speedBtn');
    const pips = [
      document.getElementById('pip1'),
      document.getElementById('pip2'),
      document.getElementById('pip3')
    ];
    speedBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentSpeedIdx = (currentSpeedIdx + 1) % 3;
      pips.forEach((p, idx) => {
        p.classList.toggle('active', idx <= currentSpeedIdx);
      });
      sound.playWindSwirl();
      sound.playCrystalNote(currentSpeedIdx * 2, 1);
    });

    // 3. Replay Current Sentence Button
    document.getElementById('replayBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      startDroppingSequence();
    });

    // 4. Celebration / Action Done Button
    document.getElementById('celebrateBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      triggerActiveCelebration();
    });

    // 5. Minimalist "Next" ("Далі") Button — immediately jumps to next sentence
    document.getElementById('nextBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      currentSentenceObj = getNextSentenceObj();
      startDroppingSequence();
    });

    window.addEventListener('resize', resizeCanvases);

    // Initialize on window load
    window.onload = () => {
      initEnvironmentParticles();
      prepareRound(false);
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
