<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мультфільм-пригода</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Головна кінематографічна сцена мультфільму -->
  <div class="cartoon-viewport">
    
    <!-- Верхня панель з кристалами прогресу та мінімалістичною навігацією -->
    <header class="hud-bar">
      <button class="nav-btn prev-btn" id="btnPrev" aria-label="Попередній рівень"></button>
      <div class="crystals" id="crystals"></div>
      <button class="nav-btn next-btn" id="btnNext" aria-label="Наступний рівень"></button>
    </header>

    <!-- Ігровий екран-сцена -->
    <main class="game-board" id="gameBoard" data-scene="attic">
      <!-- Багатошаровий реалістичний SVG-фон поточної локації -->
      <div class="scene-decor" id="sceneDecor"></div>
      <!-- Світлова вуаль та атмосферні частинки -->
      <div class="scene-veil" id="sceneVeil"></div>

      <!-- Інтерактивна зона завдання (стилізована під предмети світу) -->
      <div class="slide-stage">
        <div class="slide" id="slide"></div>
      </div>

      <!-- Глобальний шар для яскравих невербальних SVG-салютів та фідбеків -->
      <div class="fx-stage" id="fxStage"></div>

      <!-- Персонажі на передньому плані сцени -->
      <section class="stage">
        <div class="character character-left" id="charLeft" data-mood="idle">
          <div class="mood-fx" id="fxProfessor"></div>
          <div class="speech-bubble left" id="dialogLeft"></div>
          <div class="avatar" id="avatarProfessor"></div>
        </div>

        <div class="character character-right" id="charRight" data-mood="idle">
          <div class="mood-fx" id="fxGirl"></div>
          <div class="speech-bubble right" id="dialogRight"></div>
          <div class="avatar" id="avatarGirl"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Сюжетна катсцена (як кадр книги-мультфільму) -->
  <div class="cutscene" id="cutscene" hidden>
    <div class="cutscene-box">
      <div class="cutscene-icon" id="cutsceneIcon"></div>
      <p class="cutscene-text" id="cutsceneText"></p>
      <button class="cutscene-next" id="cutsceneNext" aria-label="Продовжити"></button>
    </div>
  </div>

  <script src="svg.js"></script>
  <script src="scenes.js"></script>
  <script src="tasks.js"></script>
  <script src="game.js"></script>
</body>
</html>
