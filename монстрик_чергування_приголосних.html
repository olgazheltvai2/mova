<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чергування приголосних: К-Ч-Ц, Г-Ж-З, Х-Ш-С</title>
  <style>
    /* ==========================================================
       ОСНОВНІ СТИЛІ ТА ШРИФТИ
       ========================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Nunito', 'Comfortaa', sans-serif;
      background: #1a2f1d;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #scene-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ==========================================================
       ІНТЕРАКТИВНІ ЧАСТИНИ ТІЛА МОНСТРИКА
       ========================================================== */
    .interactive-part {
      cursor: pointer;
      transition: filter 0.25s ease;
    }
    .interactive-part:hover {
      filter: drop-shadow(0 0 16px rgba(255, 245, 130, 0.95)) brightness(1.07);
    }

    /* Плавна пружна зміна розміру (велика -> маленька -> звичайна з мухою) */
    .morph-part {
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-box: view-box;
    }

    /* Природне дихання монстрика */
    @keyframes breathe {
      0%, 100% { transform: translateY(0px) scaleY(1) scaleX(1); }
      50% { transform: translateY(-5px) scaleY(1.016) scaleX(0.992); }
    }
    .monster-breathe {
      animation: breathe 3.6s ease-in-out infinite;
      transform-origin: 540px 680px;
    }

    /* Тріпотіння крилець мухи */
    @keyframes wingBuzzLeft {
      0%, 100% { transform: rotate(-18deg) scaleY(1); }
      50% { transform: rotate(30deg) scaleY(0.55); }
    }
    @keyframes wingBuzzRight {
      0%, 100% { transform: rotate(18deg) scaleY(1); }
      50% { transform: rotate(-30deg) scaleY(0.55); }
    }
    .fly-wing-l {
      animation: wingBuzzLeft 0.045s linear infinite;
      transform-origin: 0px 0px;
    }
    .fly-wing-r {
      animation: wingBuzzRight 0.045s linear infinite;
      transform-origin: 0px 0px;
    }

    /* ==========================================================
       ПРАВА ЗОНА: ДЕРЕВ'ЯНЕ ВІКНО ЗІ СЛОВОМ ТА ВСІМА 3 ГРУПАМИ
       ========================================================== */
    #right-area {
      position: absolute;
      right: 3.5vw;
      top: 50%;
      transform: translateY(-50%);
      width: min(760px, 47vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      z-index: 20;
      pointer-events: none;
    }

    /* Головна дерев'яна дошка для поточного слова */
    #word-plaque {
      position: relative;
      width: 100%;
      height: 230px;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
    }

    /* Перемикачі трійки букв зверху дошки (наприклад К -> Ч -> Ц) */
    #triad-stepper {
      position: absolute;
      top: -34px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 4;
    }

    .step-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #fef3c7;
      background: radial-gradient(circle at 30% 30%, #8d5524, #4e2a0c);
      border: 4px solid #d99b52;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.3);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .step-badge:hover {
      transform: scale(1.12);
    }
    .step-badge.active {
      background: radial-gradient(circle at 30% 30%, #ffeb3b, #ff6f00);
      color: #4a1500;
      border-color: #fff;
      transform: scale(1.2) translateY(-5px);
      box-shadow: 0 0 26px rgba(255, 214, 0, 0.95), 0 8px 16px rgba(0,0,0,0.55);
    }
    .step-arrow {
      font-size: 30px;
      color: #ffe082;
      text-shadow: 0 3px 5px rgba(0,0,0,0.7);
      font-weight: 900;
    }

    /* Крупне слово в центрі правого вікна */
    #word-display {
      position: relative;
      z-index: 3;
      font-size: clamp(58px, 6.2vw, 108px);
      font-weight: 900;
      color: #fff8e7;
      text-shadow: 0 6px 0 #5b3112, 0 10px 22px rgba(0,0,0,0.65);
      letter-spacing: 3px;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      margin-top: 14px;
    }

    /* Яскраве блимання потрібної букви */
    @keyframes blinkLetter {
      0%, 100% {
        color: #ffeb3b;
        transform: scale(1.24) translateY(-7px);
        text-shadow: 0 0 25px #ffeb3b, 0 0 48px #ff5722, 0 6px 0 #7f1d00;
      }
      50% {
        color: #ff3d00;
        transform: scale(1.02) translateY(0px);
        text-shadow: 0 0 12px #ff9100, 0 4px 0 #4e1200;
      }
    }

    .highlight-letter {
      display: inline-block;
      animation: blinkLetter 0.75s ease-in-out infinite;
      padding: 0 5px;
      border-radius: 12px;
    }

    /* ==========================================================
       ТАБЛИЦЯ ВСІХ ТРЬОХ ГРУП (ТАКОЖ СПРАВА, НЕ ЗАКРИВАЄ МОНСТРА)
       ========================================================== */
    #all-groups-board {
      width: 100%;
      padding: 20px 22px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,220,150,0.14), transparent 60%),
        linear-gradient(160deg, #6d411d 0%, #47280f 55%, #331b08 100%);
      border: 6px solid #c68642;
      box-shadow:
        0 18px 40px rgba(0,0,0,0.7),
        inset 0 3px 10px rgba(255, 230, 180, 0.3),
        inset 0 -6px 14px rgba(0,0,0,0.55);
      display: none;
      flex-direction: column;
      gap: 14px;
      pointer-events: auto;
      animation: popBoard 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #all-groups-board.open {
      display: flex;
    }

    @keyframes popBoard {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .summary-row {
      display: grid;
      grid-template-columns: 155px 1fr 1fr 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 22px;
      background: linear-gradient(90deg, rgba(0,0,0,0.38), rgba(255,255,255,0.06));
      border: 2px solid rgba(255, 213, 128, 0.28);
    }

    .summary-triad-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px 6px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffb300, #e65100);
      border: 3px solid #fff59d;
      box-shadow: 0 5px 12px rgba(0,0,0,0.45);
      font-size: clamp(20px, 1.9vw, 28px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 0 #7f2700;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .summary-triad-box:hover {
      transform: scale(1.06);
    }

    .summary-word-card {
      height: 82px;
      border-radius: 18px;
      background: linear-gradient(145deg, #8c5828, #573312);
      border: 3px solid #d7995b;
      box-shadow: 0 5px 12px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .summary-word-card:hover {
      transform: translateY(-4px) scale(1.04);
      border-color: #ffeb3b;
      box-shadow: 0 8px 18px rgba(0,0,0,0.55), 0 0 14px rgba(255, 235, 59, 0.5);
    }
    .summary-word-card.playing {
      background: linear-gradient(145deg, #2e7d32, #1b5e20);
      border-color: #ffeb3b;
      transform: scale(1.05);
    }

    .summary-word-text {
      font-size: clamp(22px, 2.1vw, 34px);
      font-weight: 900;
      color: #fff8e1;
      text-shadow: 0 3px 0 #3e1e04;
    }

    /* ==========================================================
       МІНІМАЛІСТИЧНІ КНОПКИ КЕРУВАННЯ (ДАЛІ / НАЗАД / ВСІ 3 ГРУПИ)
       ========================================================== */
    #controls-bar {
      position: absolute;
      right: 3.5vw;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 30;
    }

    .nav-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #8d5524, #4a280b);
      border: 4px solid #e6a962;
      box-shadow: 0 6px 14px rgba(0,0,0,0.55), inset 0 2px 4px rgba(255,255,255,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }
    .nav-btn:hover {
      transform: scale(1.12);
      filter: brightness(1.12);
    }
    .nav-btn:active {
      transform: scale(0.95);
    }
    .nav-btn.active-toggle {
      background: radial-gradient(circle at 30% 30%, #66bb6a, #1b5e20);
      border-color: #ffeb3b;
      box-shadow: 0 0 20px rgba(255, 235, 59, 0.75), 0 6px 14px rgba(0,0,0,0.55);
    }
  </style>
</head>
<body>

<div id="app">
  <!-- ==========================================================
       ПРАВА ПАНЕЛЬ: ВЕЛИКЕ СЛОВО З БЛИМАЮЧОЮ БУКВОЮ ТА ДОШКА 3 ГРУП
       ========================================================== -->
  <div id="right-area">
    <!-- Дерев'яне вікно зі словом -->
    <div id="word-plaque">
      <!-- Інтерактивні кружечки трійки букв -->
      <div id="triad-stepper">
        <div class="step-badge active" id="step-btn-0" onclick="selectCurrentStep(0)">К</div>
        <div class="step-arrow">➔</div>
        <div class="step-badge" id="step-btn-1" onclick="selectCurrentStep(1)">Ч</div>
        <div class="step-arrow">➔</div>
        <div class="step-badge" id="step-btn-2" onclick="selectCurrentStep(2)">Ц</div>
      </div>

      <!-- Деталізована різьблена дерев'яна дошка (SVG) -->
      <svg viewBox="0 0 760 220" style="position:absolute; inset:0; width:100%; height:100%; filter: drop-shadow(0 14px 24px rgba(0,0,0,0.65));">
        <defs>
          <linearGradient id="woodPlaqueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9c5f28"/>
            <stop offset="50%" stop-color="#734218"/>
            <stop offset="100%" stop-color="#4a280b"/>
          </linearGradient>
          <linearGradient id="woodBorderGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f0b673"/>
            <stop offset="100%" stop-color="#9c6127"/>
          </linearGradient>
        </defs>
        <!-- Підвісні канати дошки -->
        <path d="M120,0 L120,28 M640,0 L640,28" stroke="#d7995b" stroke-width="10" stroke-linecap="round"/>
        <!-- Корпус дошки -->
        <path d="M40,24 Q380,10 720,24 Q748,110 720,196 Q380,210 40,196 Q12,110 40,24 Z"
              fill="url(#woodPlaqueGrad)" stroke="url(#woodBorderGrad)" stroke-width="9"/>
        <!-- Текстура дерева -->
        <path d="M70,54 Q380,40 690,54" fill="none" stroke="rgba(255,220,160,0.18)" stroke-width="4" stroke-linecap="round"/>
        <path d="M65,168 Q380,182 695,168" fill="none" stroke="rgba(0,0,0,0.32)" stroke-width="5" stroke-linecap="round"/>
        <!-- Кутові золоті заклепки -->
        <circle cx="58" cy="52" r="8" fill="#ffd54f" stroke="#5d4037" stroke-width="2.5"/>
        <circle cx="702" cy="52" r="8" fill="#ffd54f" stroke="#5d4037" stroke-width="2.5"/>
        <circle cx="58" cy="168" r="8" fill="#ffd54f" stroke="#5d4037" stroke-width="2.5"/>
        <circle cx="702" cy="168" r="8" fill="#ffd54f" stroke="#5d4037" stroke-width="2.5"/>
      </svg>

      <!-- Текст слова з блимаючою буквою -->
      <div id="word-display">
        <span>ру</span><span class="highlight-letter">К</span><span>а</span>
      </div>
    </div>

    <!-- Таблиця всіх 3 груп (К-Ч-Ц, Г-Ж-З, Х-Ш-С), що відкривається тут же праворуч -->
    <div id="all-groups-board">
      <!-- Ряд 1: К - Ч - Ц -->
      <div class="summary-row">
        <div class="summary-triad-box" onclick="playTriadDemo('hand')">
          <span>К</span><span>➔</span><span>Ч</span><span>➔</span><span>Ц</span>
        </div>
        <div class="summary-word-card" id="sum-hand-0" onclick="pickFromSummary('hand', 0)">
          <div class="summary-word-text">ру<span class="highlight-letter">К</span>а</div>
        </div>
        <div class="summary-word-card" id="sum-hand-1" onclick="pickFromSummary('hand', 1)">
          <div class="summary-word-text">ру<span class="highlight-letter">Ч</span>ка</div>
        </div>
        <div class="summary-word-card" id="sum-hand-2" onclick="pickFromSummary('hand', 2)">
          <div class="summary-word-text">на ру<span class="highlight-letter">Ц</span>і</div>
        </div>
      </div>

      <!-- Ряд 2: Г - Ж - З -->
      <div class="summary-row">
        <div class="summary-triad-box" onclick="playTriadDemo('leg')">
          <span>Г</span><span>➔</span><span>Ж</span><span>➔</span><span>З</span>
        </div>
        <div class="summary-word-card" id="sum-leg-0" onclick="pickFromSummary('leg', 0)">
          <div class="summary-word-text">но<span class="highlight-letter">Г</span>а</div>
        </div>
        <div class="summary-word-card" id="sum-leg-1" onclick="pickFromSummary('leg', 1)">
          <div class="summary-word-text">ні<span class="highlight-letter">Ж</span>ка</div>
        </div>
        <div class="summary-word-card" id="sum-leg-2" onclick="pickFromSummary('leg', 2)">
          <div class="summary-word-text">на но<span class="highlight-letter">З</span>і</div>
        </div>
      </div>

      <!-- Ряд 3: Х - Ш - С -->
      <div class="summary-row">
        <div class="summary-triad-box" onclick="playTriadDemo('ear')">
          <span>Х</span><span>➔</span><span>Ш</span><span>➔</span><span>С</span>
        </div>
        <div class="summary-word-card" id="sum-ear-0" onclick="pickFromSummary('ear', 0)">
          <div class="summary-word-text">ву<span class="highlight-letter">Х</span>о</div>
        </div>
        <div class="summary-word-card" id="sum-ear-1" onclick="pickFromSummary('ear', 1)">
          <div class="summary-word-text">ву<span class="highlight-letter">Ш</span>ко</div>
        </div>
        <div class="summary-word-card" id="sum-ear-2" onclick="pickFromSummary('ear', 2)">
          <div class="summary-word-text">на ву<span class="highlight-letter">С</span>і</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================
       МІНІМАЛІСТИЧНІ КНОПКИ: НАЗАД, ДАЛІ ТА ПОКАЗ УСІХ 3 ГРУП
       ========================================================== -->
  <div id="controls-bar">
    <!-- Кнопка "Назад" -->
    <div class="nav-btn" onclick="stepSequence(-1)" title="Попередній крок">
      <svg width="34" height="34" viewBox="0 0 48 48">
        <path d="M30,10 L16,24 L30,38" fill="none" stroke="#fff8e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Кнопка показу всіх 3 груп разом -->
    <div class="nav-btn" id="toggle-all-btn" onclick="toggleSummaryBoard()" title="Показати / сховати всі 3 групи">
      <svg width="34" height="34" viewBox="0 0 48 48">
        <rect x="6" y="7" width="36" height="8" rx="4" fill="#ffeb3b"/>
        <rect x="6" y="20" width="36" height="8" rx="4" fill="#ffca28"/>
        <rect x="6" y="33" width="36" height="8" rx="4" fill="#ffa000"/>
      </svg>
    </div>

    <!-- Кнопка "Далі" -->
    <div class="nav-btn" onclick="stepSequence(1)" title="Наступний крок">
      <svg width="34" height="34" viewBox="0 0 48 48">
        <path d="M18,10 L32,24 L18,38" fill="none" stroke="#fff8e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- ==========================================================
       ГОЛОВНА SVG-СЦЕНА (ЗЛІВА МОНСТРИК НА ПЕНЬКУ, ЖИВИЙ ЛІС)
       ========================================================== -->
  <svg id="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнти неба та сонячної галявини -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4fc3f7"/>
        <stop offset="55%" stop-color="#a8e6cf"/>
        <stop offset="100%" stop-color="#dcedc1"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx="75%" cy="18%" r="40%">
        <stop offset="0%" stop-color="#fffde7" stop-opacity="0.95"/>
        <stop offset="35%" stop-color="#fff59d" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#fff59d" stop-opacity="0"/>
      </radialGradient>

      <!-- Пагорби та галявина -->
      <linearGradient id="farHillGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#68b684"/>
        <stop offset="100%" stop-color="#3c7a57"/>
      </linearGradient>
      <linearGradient id="midHillGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#55a630"/>
        <stop offset="100%" stop-color="#2b6e1b"/>
      </linearGradient>
      <linearGradient id="frontMeadowGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#70c132"/>
        <stop offset="45%" stop-color="#438a1b"/>
        <stop offset="100%" stop-color="#1e460a"/>
      </linearGradient>

      <!-- Дерев'яний пеньок-сцена -->
      <linearGradient id="stumpTopGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e6b88a"/>
        <stop offset="100%" stop-color="#b8824c"/>
      </linearGradient>
      <linearGradient id="stumpBarkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4a2c11"/>
        <stop offset="30%" stop-color="#6e441e"/>
        <stop offset="65%" stop-color="#593515"/>
        <stop offset="100%" stop-color="#361e09"/>
      </linearGradient>

      <!-- ==========================================================
           3D-ГРАДІЄНТИ ДЛЯ ПУХНАСТОГО МОНСТРИКА
           ========================================================== -->
      <radialGradient id="monsterBodyFur" cx="42%" cy="32%" r="65%" fx="35%" fy="25%">
        <stop offset="0%" stop-color="#64ffda"/>
        <stop offset="32%" stop-color="#1de9b6"/>
        <stop offset="68%" stop-color="#00897b"/>
        <stop offset="92%" stop-color="#004d40"/>
        <stop offset="100%" stop-color="#00332c"/>
      </radialGradient>

      <radialGradient id="monsterBellyFur" cx="48%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#fff9c4"/>
        <stop offset="45%" stop-color="#ffe082"/>
        <stop offset="85%" stop-color="#ffb74d"/>
        <stop offset="100%" stop-color="#f57c00"/>
      </radialGradient>

      <radialGradient id="limbFurGrad" cx="35%" cy="28%" r="70%">
        <stop offset="0%" stop-color="#80cbc4"/>
        <stop offset="32%" stop-color="#26a69a"/>
        <stop offset="75%" stop-color="#00796b"/>
        <stop offset="100%" stop-color="#004d40"/>
      </radialGradient>

      <radialGradient id="earHighlightGrad" cx="40%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#a7ffeb"/>
        <stop offset="40%" stop-color="#26a69a"/>
        <stop offset="85%" stop-color="#00695c"/>
        <stop offset="100%" stop-color="#003d33"/>
      </radialGradient>

      <radialGradient id="innerEarGrad" cx="45%" cy="45%" r="60%">
        <stop offset="0%" stop-color="#ffcdd2"/>
        <stop offset="55%" stop-color="#f06292"/>
        <stop offset="100%" stop-color="#ad1457"/>
      </radialGradient>

      <radialGradient id="padGrad" cx="40%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#f8bbd0"/>
        <stop offset="65%" stop-color="#ec407a"/>
        <stop offset="100%" stop-color="#880e4f"/>
      </radialGradient>

      <linearGradient id="hornGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff8e1"/>
        <stop offset="45%" stop-color="#ffd54f"/>
        <stop offset="85%" stop-color="#ff8f00"/>
        <stop offset="100%" stop-color="#6d4c41"/>
      </linearGradient>

      <!-- Градієнти очей та повік -->

    <g id="fly-character" transform="translate(2100, 120) scale(0)" style="pointer-events:none;">
      <ellipse cx="0" cy="24" rx="26" ry="8" fill="rgba(0,0,0,0.35)"/>

    <!-- Шар для салюту із зірочок під час трансформацій -->
    <g id="particles-layer" style="pointer-events:none;"></g>

</div>

<script>
  /* ==========================================================
     ДАНІ ГРИ: ТРИ ГРУПИ ЧЕРГУВАННЯ ПРИГОЛОСНИХ
     Масштаби маленьких частин тіла (0.60 - 0.64) підібрані так,
     щоб маленьке вуШко, руЧку та ніЖку було чудово видно!
     ========================================================== */
  const GROUPS_DATA = {
    hand: {
      letters: ['К', 'Ч', 'Ц'],
      steps: [
        // Крок 0: Велика рука
        { prefix: 'ру', blink: 'К', suffix: 'а', scale: 1.72, fly: false },
        // Крок 1: Маленька ручка (добре видима!)
        { prefix: 'ру', blink: 'Ч', suffix: 'ка', scale: 0.58, fly: false },
        // Крок 2: Муха на руці
        { prefix: 'на ру', blink: 'Ц', suffix: 'і', scale: 1.08, fly: true }
      ],
      effectPos: { x: 885, y: 495 },
      flyLandPos: { x: 890, y: 478 }
    },
    leg: {
      letters: ['Г', 'Ж', 'З'],
      steps: [
        // Крок 0: Велика нога
        { prefix: 'но', blink: 'Г', suffix: 'а', scale: 1.68, fly: false },
        // Крок 1: Маленька ніжка (добре видима!)
        { prefix: 'ні', blink: 'Ж', suffix: 'ка', scale: 0.60, fly: false },
        // Крок 2: Муха на нозі
        { prefix: 'на но', blink: 'З', suffix: 'і', scale: 1.06, fly: true }
      ],
      effectPos: { x: 685, y: 845 },
      flyLandPos: { x: 685, y: 825 }
    },
    ear: {
      letters: ['Х', 'Ш', 'С'],
      steps: [
        // Крок 0: Велике вухо
        { prefix: 'ву', blink: 'Х', suffix: 'о', scale: 1.82, fly: false },
        // Крок 1: Маленьке вушко (чітко видиме на краю голови!)
        { prefix: 'ву', blink: 'Ш', suffix: 'ко', scale: 0.62, fly: false },
        // Крок 2: Муха на вусі
        { prefix: 'на ву', blink: 'С', suffix: 'і', scale: 1.12, fly: true }
      ],
      effectPos: { x: 815, y: 355 },
      flyLandPos: { x: 815, y: 332 }
    }
  };

  /* Послідовність усіх кроків для кнопок "Назад" / "Далі" */
  const SEQUENCE_ORDER = [
    { part: 'hand', step: 0 },
    { part: 'hand', step: 1 },
    { part: 'hand', step: 2 },
    { part: 'leg',  step: 0 },
    { part: 'leg',  step: 1 },
    { part: 'leg',  step: 2 },
    { part: 'ear',  step: 0 },
    { part: 'ear',  step: 1 },
    { part: 'ear',  step: 2 }
  ];

  let currentPart = 'hand';
  let partStepIndex = { hand: 0, leg: -1, ear: -1 };
  let currentEmotionIndex = 0;
  let flyLookTarget = null;

  /* ==========================================================
     ЗВУКОВИЙ РУШІЙ (Web Audio API)
     ========================================================== */
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  /* Звук для ВЕЛИКОЇ частини тіла (руКа, ноГа, вуХо) */
  function playGiantSound() {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(95, now);
    osc.frequency.exponentialRampToValueAtTime(265, now + 0.28);
    osc.frequency.exponentialRampToValueAtTime(130, now + 0.52);

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.28, now + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.56);
  }

  /* Звук для МАЛЕНЬКОЇ частини тіла (руЧка, ніЖка, вуШко) */
  function playTinySound() {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(980, now);
    osc.frequency.exponentialRampToValueAtTime(380, now + 0.22);
    osc.frequency.setValueAtTime(740, now + 0.24);
    osc.frequency.exponentialRampToValueAtTime(1280, now + 0.36);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  }

  /* Звук дзижчання МУХИ (на руЦі, на ноЗі, на вуСі) */
  function playFlyBuzzSound() {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const lfo = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(195, now);
    osc.frequency.linearRampToValueAtTime(245, now + 0.25);
    osc.frequency.linearRampToValueAtTime(185, now + 0.55);

    lfo.frequency.value = 38;
    lfoGain.gain.value = 28;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    filter.type = 'bandpass';
    filter.frequency.value = 800;

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.26, now + 0.12);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.48);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.68);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    lfo.start(now);
    osc.stop(now + 0.7);
    lfo.stop(now + 0.7);
  }

  /* Звук зміни емоції монстрика */
  function playMonsterEmotionSound() {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const notes = [330, 440, 587];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      const start = now + i * 0.065;
      osc.frequency.setValueAtTime(freq + Math.random() * 70, start);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.25, start + 0.09);
      gain.gain.setValueAtTime(0.18, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.11);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.12);
    });
  }

  /* ==========================================================
     СИСТЕМА 6 ЖИВИХ ЕМОЦІЙ МОНСТРИКА (З ОКРУГЛИМИ ПОВІКАМИ!)
     ========================================================== */
  const EMOTIONS = [
    {
      // 0: Щаслива широка усмішка
      mouthBg: "M-75,-12 Q0,15 75,-12 Q65,58 0,58 Q-65,58 -75,-12 Z",
      tongue: "M-38,28 Q0,5 38,28 Q28,56 0,56 Q-28,56 -38,28 Z",
      teethVisible: true,
      browL: "M418,300 Q468,275 508,300",
      browR: "M572,300 Q612,275 662,300",
      topLidL: "M-52,-52 L52,-52 L52,-38 Q0,-28 -52,-38 Z",
      topLidR: "M-52,-52 L52,-52 L52,-38 Q0,-28 -52,-38 Z",
      botLidL: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z",
      botLidR: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z"
    },
    {
      // 1: Сильне здивування ("О-о-о!", очі широко розплющені)
      mouthBg: "M-32,-8 C-32,-32 32,-32 32,-8 C32,38 -32,38 -32,-8 Z",
      tongue: "M-18,16 Q0,4 18,16 Q12,32 0,32 Q-12,32 -18,16 Z",
      teethVisible: false,
      browL: "M415,284 Q465,252 508,284",
      browR: "M572,284 Q615,252 665,284",
      topLidL: "M-52,-52 L52,-52 L52,-48 Q0,-46 -52,-48 Z",
      topLidR: "M-52,-52 L52,-52 L52,-48 Q0,-46 -52,-48 Z",
      botLidL: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z",
      botLidR: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z"
    },
    {
      // 2: Бешкетник (висунутий язик, ліве око хитро примружене дугою)
      mouthBg: "M-65,-6 Q0,8 65,-6 Q50,35 0,35 Q-50,35 -65,-6 Z",
      tongue: "M-15,10 Q15,5 35,22 Q48,68 12,72 Q-18,65 -15,10 Z",
      teethVisible: true,
      browL: "M418,310 Q468,292 508,288",
      browR: "M572,288 Q612,264 662,296",
      topLidL: "M-52,-52 L52,-52 L52,-12 Q0,-24 -52,-12 Z",
      topLidR: "M-52,-52 L52,-52 L52,-40 Q0,-32 -52,-40 Z",
      botLidL: "M-52,52 L52,52 L52,24 Q0,12 -52,24 Z",
      botLidR: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z"
    },
    {
      // 3: Щирий регіт (обидва ока усміхаються нижніми дугоподібними повіками)
      mouthBg: "M-82,-16 Q0,6 82,-16 Q72,68 0,68 Q-72,68 -82,-16 Z",
      tongue: "M-45,26 Q0,0 45,26 Q34,64 0,64 Q-34,64 -45,26 Z",
      teethVisible: true,
      browL: "M415,292 Q465,268 508,298",
      browR: "M572,298 Q615,268 665,292",
      topLidL: "M-52,-52 L52,-52 L52,-28 Q0,-36 -52,-28 Z",
      topLidR: "M-52,-52 L52,-52 L52,-28 Q0,-36 -52,-28 Z",
      botLidL: "M-52,52 L52,52 L52,26 Q0,10 -52,26 Z",
      botLidR: "M-52,52 L52,52 L52,26 Q0,10 -52,26 Z"
    },
    {
      // 4: Зацікавлена хитра посмішка
      mouthBg: "M-58,4 Q10,-14 72,-18 Q58,34 -5,32 Q-48,30 -58,4 Z",
      tongue: "M-20,16 Q15,8 35,18 Q20,32 -5,30 Z",
      teethVisible: true,
      browL: "M420,312 Q468,302 510,310",
      browR: "M572,286 Q615,258 662,282",
      topLidL: "M-52,-52 L52,-52 L52,-18 Q0,-10 -52,-22 Z",
      topLidR: "M-52,-52 L52,-52 L52,-44 Q0,-38 -52,-44 Z",
      botLidL: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z",
      botLidR: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z"
    },
    {
      // 5: Милий усміхнений монстрик
      mouthBg: "M-42,-2 Q0,18 42,-2 Q32,28 0,28 Q-32,28 -42,-2 Z",
      tongue: "M-22,12 Q0,4 22,12 Q16,27 0,27 Q-16,27 -22,12 Z",
      teethVisible: false,
      browL: "M418,310 Q465,282 508,290",
      browR: "M572,290 Q615,282 662,310",
      topLidL: "M-52,-52 L52,-52 L52,-34 Q0,-24 -52,-34 Z",
      topLidR: "M-52,-52 L52,-52 L52,-34 Q0,-24 -52,-34 Z",
      botLidL: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z",
      botLidR: "M-52,52 L52,52 L52,52 Q0,52 -52,52 Z"
    }
  ];

  function applyEmotion(index) {
    currentEmotionIndex = index;
    const emo = EMOTIONS[index];
    document.getElementById('mouth-bg').setAttribute('d', emo.mouthBg);
    document.getElementById('mouth-tongue').setAttribute('d', emo.tongue);
    document.getElementById('mouth-teeth').style.display = emo.teethVisible ? 'block' : 'none';

    document.getElementById('brow-left').setAttribute('d', emo.browL);
    document.getElementById('brow-left-hi').setAttribute('d', emo.browL);
    document.getElementById('brow-right').setAttribute('d', emo.browR);
    document.getElementById('brow-right-hi').setAttribute('d', emo.browR);

    document.getElementById('eyelid-top-left').setAttribute('d', emo.topLidL);
    document.getElementById('eyelid-top-right').setAttribute('d', emo.topLidR);
    document.getElementById('eyelid-bot-left').setAttribute('d', emo.botLidL);
    document.getElementById('eyelid-bot-right').setAttribute('d', emo.botLidR);
  }

  function triggerRandomEmotion(withSound = false) {
    let nextIdx = Math.floor(Math.random() * EMOTIONS.length);
    if (nextIdx === currentEmotionIndex) {
      nextIdx = (nextIdx + 1) % EMOTIONS.length;
    }
    applyEmotion(nextIdx);

    if (withSound) {
      playMonsterEmotionSound();
      spawnParticles(540, 380, '#ffeb3b');
    }
  }

  // Автоматична жива зміна емоцій та природне кругле кліпання очима
  setInterval(() => {
    triggerRandomEmotion(false);
  }, 4500);

  setInterval(() => {
    const topL = document.getElementById('eyelid-top-left');
    const topR = document.getElementById('eyelid-top-right');
    // Повне закриття круглих повік із плавним вигином вій
    topL.setAttribute('d', 'M-52,-52 L52,-52 L52,48 Q0,58 -52,48 Z');
    topR.setAttribute('d', 'M-52,-52 L52,-52 L52,48 Q0,58 -52,48 Z');
    setTimeout(() => {
      topL.setAttribute('d', EMOTIONS[currentEmotionIndex].topLidL);
      topR.setAttribute('d', EMOTIONS[currentEmotionIndex].topLidR);
    }, 150);
  }, 3300);

  /* Стеження зіниць очей за курсором або мухою */
  window.addEventListener('mousemove', (e) => {
    if (flyLookTarget) return;
    const svg = document.getElementById('scene-svg');
    const rect = svg.getBoundingClientRect();
    const normX = ((e.clientX - rect.left) / rect.width - 0.3) * 24;
    const normY = ((e.clientY - rect.top) / rect.height - 0.35) * 20;
    const dx = Math.max(-14, Math.min(14, normX));
    const dy = Math.max(-12, Math.min(12, normY));
    document.getElementById('pupil-left').setAttribute('transform', `translate(${dx}, ${dy})`);
    document.getElementById('pupil-right').setAttribute('transform', `translate(${dx}, ${dy})`);
  });

  function lookAtPoint(svgX, svgY) {
    const dxL = Math.max(-15, Math.min(15, (svgX - 468) / 20));
    const dyL = Math.max(-14, Math.min(14, (svgY - 365) / 20));
    const dxR = Math.max(-15, Math.min(15, (svgX - 612) / 20));
    const dyR = Math.max(-14, Math.min(14, (svgY - 365) / 20));
    document.getElementById('pupil-left').setAttribute('transform', `translate(${dxL}, ${dyL})`);
    document.getElementById('pupil-right').setAttribute('transform', `translate(${dxR}, ${dyR})`);
  }

  /* ==========================================================
     КЕРУВАННЯ ТРАНСФОРМАЦІЯМИ ЧАСТИН ТІЛА ТА СЛОВАМИ
     ========================================================== */
  function triggerPartCycle(partName) {
    let nextStep = 0;
    if (currentPart === partName) {
      nextStep = (partStepIndex[partName] + 1) % 3;
    }
    setPartState(partName, nextStep);
  }

  function selectCurrentStep(stepIdx) {
    setPartState(currentPart || 'hand', stepIdx);
  }

  function setPartState(partName, stepIdx, playSound = true) {
    currentPart = partName;
    partStepIndex[partName] = stepIdx;

    const groupInfo = GROUPS_DATA[partName];
    const stepData = groupInfo.steps[stepIdx];

    // 1. Трансформуємо обрану частину тіла, а інші повертаємо до звичайного розміру
    ['hand', 'leg', 'ear'].forEach(p => {
      const morphEl = document.getElementById(`${p}-morph`);
      if (p === partName) {
        morphEl.style.transform = `scale(${stepData.scale})`;
      } else {
        morphEl.style.transform = 'scale(1)';
      }
    });

    // 2. Оновлюємо кружечки трійки букв над дошкою
    groupInfo.letters.forEach((letter, idx) => {
      const btn = document.getElementById(`step-btn-${idx}`);
      btn.textContent = letter;
      btn.classList.toggle('active', idx === stepIdx);
    });

    // 3. Оновлюємо велике слово праворуч
    const wordDisplay = document.getElementById('word-display');
    wordDisplay.innerHTML = `
      <span>${stepData.prefix}</span><span class="highlight-letter">${stepData.blink}</span><span>${stepData.suffix}</span>
    `;

    // 4. Підсвічуємо активну картку в таблиці всіх 3 груп
    document.querySelectorAll('.summary-word-card').forEach(c => c.classList.remove('playing'));
    const activeCard = document.getElementById(`sum-${partName}-${stepIdx}`);
    if (activeCard) activeCard.classList.add('playing');

    // 5. Анімація мухи, очей та звуків
    if (stepData.fly) {
      if (playSound) playFlyBuzzSound();
      flyToPosition(groupInfo.flyLandPos.x, groupInfo.flyLandPos.y);
      flyLookTarget = groupInfo.flyLandPos;
      lookAtPoint(groupInfo.flyLandPos.x, groupInfo.flyLandPos.y);
      applyEmotion(1); // Здивований погляд на муху
      spawnParticles(groupInfo.effectPos.x, groupInfo.effectPos.y, '#80deea');
    } else {
      hideFly();
      flyLookTarget = null;
      lookAtPoint(groupInfo.effectPos.x, groupInfo.effectPos.y);

      if (stepIdx === 0) {
        if (playSound) playGiantSound();
        applyEmotion(3); // Радісний сміх
        spawnParticles(groupInfo.effectPos.x, groupInfo.effectPos.y, '#ffeb3b');
      } else {
        if (playSound) playTinySound();
        applyEmotion(2); // Кумедний бешкетний вираз
        spawnParticles(groupInfo.effectPos.x, groupInfo.effectPos.y, '#ff80ab');
      }
    }
  }

  /* Кнопки "Назад" та "Далі" для послідовного проходження всіх трійок */
  function stepSequence(direction) {
    const curIdx = SEQUENCE_ORDER.findIndex(
      item => item.part === currentPart && item.step === partStepIndex[currentPart]
    );
    const nextIdx = (curIdx + direction + SEQUENCE_ORDER.length) % SEQUENCE_ORDER.length;
    const target = SEQUENCE_ORDER[nextIdx];
    setPartState(target.part, target.step);
  }

  /* Політ мухи по дузі */
  let flyAnimFrame = null;
  function flyToPosition(targetX, targetY) {
    if (flyAnimFrame) cancelAnimationFrame(flyAnimFrame);
    const flyEl = document.getElementById('fly-character');
    const startX = 1150;
    const startY = 80;
    const startTime = performance.now();
    const duration = 520;

    function animateFly(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const ease = 1 - Math.pow(1 - t, 3);
      const waveY = Math.sin(t * Math.PI * 3) * 40 * (1 - t);
      const curX = startX + (targetX - startX) * ease;
      const curY = startY + (targetY - startY) * ease + waveY;
      const scale = 0.4 + 0.75 * ease;

      flyEl.setAttribute('transform', `translate(${curX}, ${curY}) scale(${scale})`);
      if (t < 1) {
        flyAnimFrame = requestAnimationFrame(animateFly);
      }
    }
    flyAnimFrame = requestAnimationFrame(animateFly);
  }

  function hideFly() {
    if (flyAnimFrame) cancelAnimationFrame(flyAnimFrame);
    const flyEl = document.getElementById('fly-character');
    flyEl.setAttribute('transform', 'translate(2100, 120) scale(0)');
  }

  /* ==========================================================
     ТАБЛИЦЯ «ВСІ 3 ГРУПИ РАЗОМ» (ПРАВОРУЧ ПІД ОСНОВНИМ СЛОВОМ)
     ========================================================== */
  function toggleSummaryBoard() {
    const board = document.getElementById('all-groups-board');
    const btn = document.getElementById('toggle-all-btn');
    const isOpen = board.classList.toggle('open');
    btn.classList.toggle('active-toggle', isOpen);
    playMonsterEmotionSound();
  }

  function pickFromSummary(partName, stepIdx) {
    setPartState(partName, stepIdx);
  }

  function playTriadDemo(partName) {
    pickFromSummary(partName, 0);
    setTimeout(() => pickFromSummary(partName, 1), 900);
    setTimeout(() => pickFromSummary(partName, 2), 1800);
  }

  /* ==========================================================
     ЧАСТИНКИ ТА ЗІРОЧКИ ПІД ЧАС ПЕРЕТВОРЕНЬ
     ========================================================== */
  function spawnParticles(cx, cy, color) {
    const layer = document.getElementById('particles-layer');
    for (let i = 0; i < 14; i++) {
      const star = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      const angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.3;
      const dist = 55 + Math.random() * 85;
      const r = 6 + Math.random() * 8;

      star.setAttribute('cx', cx);
      star.setAttribute('cy', cy);
      star.setAttribute('r', r);
      star.setAttribute('fill', i % 2 === 0 ? color : '#ffffff');
      layer.appendChild(star);

      const start = performance.now();
      const dur = 480 + Math.random() * 220;

      function step(now) {
        const p = Math.min(1, (now - start) / dur);
        const curX = cx + Math.cos(angle) * dist * p;
        const curY = cy + Math.sin(angle) * dist * p;
        star.setAttribute('cx', curX);
        star.setAttribute('cy', curY);
        star.setAttribute('r', r * (1 - p));
        if (p < 1) {
          requestAnimationFrame(step);
        } else {
          star.remove();
        }
      }
      requestAnimationFrame(step);
    }
  }

  // Початковий стан при завантаженні (показуємо руКу без різкого звуку до першого кліку)
  setPartState('hand', 0, false);
</script>
