<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дерева та їх плоди</title>
<style>
  /* ================= СКИДАННЯ ТА БАЗОВІ СТИЛІ ================= */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    background: #163015;
  }

  /* Головний контейнер світу гри */
  #game-world {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* ================= ЖИВИЙ СЮЖЕТНИЙ ФОН ЛІСОВОЇ ГАЛЯВИНИ ================= */
  #background-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Анімація сонячних променів */
  .sunbeam {
    transform-origin: top center;
    animation: swayBeam 9s ease-in-out infinite alternate;
  }
  .sunbeam:nth-child(2) { animation-duration: 12s; animation-delay: -4s; }
  .sunbeam:nth-child(3) { animation-duration: 10s; animation-delay: -7s; }

  @keyframes swayBeam {
    0% { transform: rotate(-3.5deg) scaleX(0.94); opacity: 0.2; }
    100% { transform: rotate(3.5deg) scaleX(1.06); opacity: 0.36; }
  }

  /* Рух хмаринок */
  .cloud-anim-1 { animation: driftCloud 65s linear infinite; }
  .cloud-anim-2 { animation: driftCloud 85s linear infinite reverse; }
  @keyframes driftCloud {
    0% { transform: translateX(-160px); }
    100% { transform: translateX(160px); }
  }

  /* Гойдання трави та гілок на фоні */
  .foliage-sway {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: grassSway 4.5s ease-in-out infinite alternate;
  }
  .foliage-sway-top {
    transform-box: fill-box;
    transform-origin: top center;
    animation: grassSway 5.5s ease-in-out infinite alternate-reverse;
  }
  @keyframes grassSway {
    0% { transform: rotate(-2.2deg); }
    100% { transform: rotate(2.2deg); }
  }

  /* Політ лісових метеликів */
  .butterfly {
    animation: flyAround 15s ease-in-out infinite;
  }
  @keyframes flyAround {
    0%   { transform: translate(0, 0) rotate(5deg); }
    25%  { transform: translate(90px, -40px) rotate(-8deg); }
    50%  { transform: translate(170px, 15px) rotate(10deg); }
    75%  { transform: translate(70px, 45px) rotate(-6deg); }
    100% { transform: translate(0, 0) rotate(5deg); }
  }

  /* ================= НАВІГАЦІЯ ТА ПЕРЕМИКАЧІ ================= */
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 68px;
    height: 68px;
    z-index: 30;
    cursor: pointer;
    background: none;
    border: none;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }
  .nav-btn:hover {
    transform: translateY(-50%) scale(1.14);
    filter: drop-shadow(0 8px 16px rgba(255,215,100,0.55));
  }
  .nav-btn:active {
    transform: translateY(-50%) scale(0.92);
  }
  #btn-prev { left: 14px; }
  #btn-next { right: 14px; }

  /* Мінімалістичні іконки перемикання між Слайдами та Вікториною */
  #mode-switcher {
    position: absolute;
    top: 14px;
    right: 20px;
    z-index: 30;
    display: flex;
    gap: 12px;
  }
  .mode-btn {
    width: 54px;
    height: 54px;
    cursor: pointer;
    background: none;
    border: none;
    transition: transform 0.25s, filter 0.25s;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));
  }
  .mode-btn:hover { transform: scale(1.12); }
  .mode-btn.active-mode {
    filter: drop-shadow(0 0 12px #ffd54f) drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    transform: scale(1.08);
  }

  /* Гілочка з листочками прогресу вгорі (без цифр і слів) */
  #vine-progress {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: 30px;
    background: linear-gradient(180deg, rgba(62,39,35,0.88), rgba(39,23,20,0.92));
    border: 2.5px solid #8d6e63;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45), inset 0 2px 4px rgba(255,255,255,0.15);
  }
  .progress-leaf {
    width: 14px;
    height: 14px;
    border-radius: 50% 0 50% 50%;
    transform: rotate(-45deg);
    background: #4e342e;
    border: 1.5px solid #795548;
    transition: all 0.35s ease;
    cursor: pointer;
  }
  .progress-leaf.active {
    background: radial-gradient(circle at 30% 30%, #ffee58, #f57f17);
    border-color: #fff59d;
    transform: rotate(-45deg) scale(1.32);
    box-shadow: 0 0 9px #ffd54f;
  }
  .progress-leaf.visited {
    background: linear-gradient(135deg, #9ccc65, #33691e);
    border-color: #c5e1a5;
  }

  /* ================= ОСНОВНА ІГРОВА СЦЕНА ТА ДЕРЕВ'ЯНІ ПАННО ================= */
  #stage {
    position: absolute;
    top: 64px;
    bottom: 20px;
    left: 96px;
    right: 96px;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.4vw;
  }

  /* Фактурні дерев'яні рамки з корою та мохом (жодних білих прямокутників) */
  .wood-plaque {
    position: relative;
    background:
      radial-gradient(ellipse at 50% 25%, rgba(255, 236, 179, 0.28), transparent 70%),
      repeating-linear-gradient(90deg, rgba(93,64,55,0.1) 0px, rgba(93,64,55,0.1) 7px, transparent 7px, transparent 16px),
      linear-gradient(165deg, #d7b899 0%, #b88b61 48%, #936639 100%);
    border-radius: 38px 44px 40px 36px;
    border: 7px solid #4e342e;
    box-shadow:
      0 16px 34px rgba(0,0,0,0.58),
      inset 0 0 0 4px #6d4c41,
      inset 0 6px 18px rgba(255,248,225,0.45),
      inset 0 -8px 20px rgba(46,27,22,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.32s;
  }

  /* Смужка лісового моху вздовж верхнього краю панно */
  .wood-plaque::before {
    content: "";
    position: absolute;
    top: -9px;
    left: 26px;
    right: 26px;
    height: 13px;
    border-radius: 10px;
    background: linear-gradient(90deg, transparent 5%, #558b2f 20%, #7cb342 35%, transparent 52%, #689f38 78%, transparent 95%);
    pointer-events: none;
  }

  /* Панно дерева */
  .tree-card {
    width: min(44vw, 530px);
    height: min(80vh, 650px);
    cursor: pointer;
  }
  .tree-card:hover {
    transform: translateY(-4px) scale(1.01);
  }

  /* Панно плоду та листочка у режимі слайдів */
  .fruit-showcase-card {
    width: min(36vw, 440px);
    height: min(80vh, 650px);
    cursor: pointer;
  }
  .fruit-showcase-card:hover {
    transform: translateY(-4px) scale(1.012);
  }

  /* Внутрішній мальовничий медальйон із природним градієнтом неба та галявини */
  .illustration-frame {
    position: relative;
    width: 100%;
    flex: 1;
    border-radius: 26px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 22%, rgba(255,253,231,0.85) 0%, transparent 55%),
      linear-gradient(180deg, #b3e5fc 0%, #e1f5fe 45%, #dcedc8 78%, #9ccc65 100%);
    border: 4px solid #5d4037;
    box-shadow: inset 0 6px 18px rgba(0,0,0,0.26);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Окремий м'який фон-медальйон для ботанічної картки листка й плоду */
  .fruit-frame-bg {
    background:
      radial-gradient(circle at 50% 30%, #fffde7 0%, #e8f5e9 58%, #c5e1a5 100%);
  }

  .illustration-frame svg {
    width: 97%;
    height: 97%;
    overflow: visible;
    filter: drop-shadow(0 6px 9px rgba(0,0,0,0.22));
    transition: transform 0.35s ease;
  }
  .wood-plaque:hover .illustration-frame svg {
    transform: scale(1.03);
  }

  /* Дерев'яна табличка з підписом (відкривається по кліку) */
  .label-plaque {
    position: relative;
    margin-top: 12px;
    width: 94%;
    height: 64px;
    border-radius: 20px;
    background: linear-gradient(180deg, #3e2723 0%, #241411 100%);
    border: 3px solid #8d6e63;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.75), 0 4px 8px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
  }

  .label-text {
    font-size: clamp(1.25rem, 2.1vw, 2rem);
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff8e1;
    text-shadow: 0 2px 5px rgba(0,0,0,0.9), 0 0 12px rgba(255, 213, 79, 0.5);
    opacity: 0;
    transform: scale(0.72);
    transition: opacity 0.38s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Листяна завіса, яка приховує підпис до кліку */
  .leaf-shutter {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 50%, #7cb342, transparent 60%),
      radial-gradient(circle at 80% 50%, #558b2f, transparent 60%),
      linear-gradient(90deg, #33691e, #689f38 50%, #33691e);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.52s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.42s ease;
    border-radius: 16px;
  }
  .leaf-shutter::after {
    content: "";
    width: 46%;
    height: 6px;
    border-radius: 3px;
    background: rgba(236, 246, 218, 0.55);
    box-shadow: 0 0 10px rgba(255, 241, 118, 0.65);
  }

  .label-plaque.revealed .leaf-shutter {
    transform: translateY(110%) scale(0.82);
    opacity: 0;
    pointer-events: none;
  }
  .label-plaque.revealed .label-text {
    opacity: 1;
    transform: scale(1);
  }

  /* ================= РЕЖИМ ВІКТОРИНИ (3 ВАРІАНТИ ПЛОДІВ) ================= */
  .quiz-options-column {
    display: flex;
    flex-direction: column;
    gap: 14px;
    height: min(80vh, 650px);
    justify-content: space-between;
  }

  .quiz-option-card {
    width: min(27vw, 320px);
    height: calc((min(80vh, 650px) - 28px) / 3);
    padding: 10px;
    border-radius: 28px;
    cursor: pointer;
    position: relative;
  }
  .quiz-option-card:hover {
    transform: scale(1.055) translateX(-6px);
    box-shadow:
      0 14px 28px rgba(0,0,0,0.5),
      0 0 18px rgba(255, 238, 88, 0.65),
      inset 0 0 0 4px #8d6e63;
  }

  .quiz-option-card.correct-choice {
    border-color: #ffd600;
    box-shadow:
      0 0 36px #ffd600,
      0 0 65px #64dd17,
      inset 0 0 22px rgba(255, 238, 88, 0.85);
    animation: correctPulse 0.75s ease-in-out infinite alternate;
  }
  @keyframes correctPulse {
    0% { transform: scale(1.05); }
    100% { transform: scale(1.12); }
  }

  .quiz-option-card.wrong-choice {
    animation: shakeWrong 0.52s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    filter: brightness(0.78) sepia(0.35);
  }
  @keyframes shakeWrong {
    10%, 90% { transform: translateX(-8px) rotate(-2deg); }
    20%, 80% { transform: translateX(10px) rotate(2deg); }
    30%, 50%, 70% { transform: translateX(-12px) rotate(-3deg); }
    40%, 60% { transform: translateX(12px) rotate(3deg); }
  }

  /* ================= ЖИВИЙ ПЕРСОНАЖ: БІЛОЧКА (З ФІКСОВАНИМИ ВУШКАМИ) ================= */
  #character-container {
    position: absolute;
    bottom: 6px;
    left: 12px;
    width: 195px;
    height: 230px;
    z-index: 22;
    cursor: pointer;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.5));
  }

  /* Плавне дихання білочки */
  #squirrel-body {
    transform-box: fill-box;
    transform-origin: 50% 90%;
    animation: squirrelIdle 3s ease-in-out infinite alternate;
  }

  /* Пухнастий хвіст погойдується */
  #squirrel-tail {
    transform-box: fill-box;
    transform-origin: 80% 85%;
    animation: tailSway 2.6s ease-in-out infinite alternate;
  }

  /* Вушка міцно прикріплені до голови завдяки transform-box: fill-box та точці обертання в основі вуха */
  .squirrel-ear-left {
    transform-box: fill-box;
    transform-origin: 70% 92%;
    animation: earTwitchLeft 4.8s ease-in-out infinite;
  }
  .squirrel-ear-right {
    transform-box: fill-box;
    transform-origin: 30% 92%;
    animation: earTwitchRight 4.8s ease-in-out infinite;
  }

  @keyframes squirrelIdle {
    0% { transform: translateY(0) scaleY(1); }
    100% { transform: translateY(-3px) scaleY(1.025); }
  }
  @keyframes tailSway {
    0% { transform: rotate(-5deg); }
    100% { transform: rotate(7deg); }
  }
  @keyframes earTwitchLeft {
    0%, 84%, 100% { transform: rotate(0deg); }
    88% { transform: rotate(-6deg); }
    93% { transform: rotate(3deg); }
  }
  @keyframes earTwitchRight {
    0%, 84%, 100% { transform: rotate(0deg); }
    88% { transform: rotate(6deg); }
    93% { transform: rotate(-3deg); }
  }

  /* Стрибок радості білочки */
  .squirrel-happy #squirrel-body {
    animation: squirrelJump 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) 3;
  }
  .squirrel-happy #squirrel-tail {
    animation: tailWagFast 0.24s ease-in-out 6 alternate;
  }
  @keyframes squirrelJump {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    50% { transform: translateY(-34px) rotate(6deg) scale(1.06); }
  }
  @keyframes tailWagFast {
    0% { transform: rotate(-14deg); }
    100% { transform: rotate(18deg); }
  }

  /* Збентеження білочки при помилці */
  .squirrel-sad #squirrel-body {
    animation: squirrelOops 0.58s ease-in-out 1;
  }
  @keyframes squirrelOops {
    0%, 100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(6px) rotate(-6deg) scaleY(0.93); }
    50% { transform: translateY(6px) rotate(6deg) scaleY(0.93); }
    75% { transform: translateY(4px) rotate(-4deg) scaleY(0.96); }
  }

  /* Полотно для святкових частинок і салютів */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 40;
    pointer-events: none;
  }

  @media (max-width: 980px) {
    #stage { left: 72px; right: 72px; gap: 12px; }
    #character-container { width: 135px; height: 160px; left: 4px; }
    .nav-btn { width: 52px; height: 52px; }
  }
</style>
</head>
<body>

<div id="game-world">

  <!-- ================= ЖИВИЙ СЮЖЕТНИЙ ФОН ЛІСОВОЇ ГАЛЯВИНИ ================= -->
  <svg id="background-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#64b5f6"/>
        <stop offset="48%" stop-color="#b3e5fc"/>
        <stop offset="85%" stop-color="#fff9c4"/>
        <stop offset="100%" stop-color="#c5e1a5"/>
      </linearGradient>
      <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fffde7" stop-opacity="0.65"/>
        <stop offset="100%" stop-color="#fffde7" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#81c784"/>
        <stop offset="100%" stop-color="#388e3c"/>
      </linearGradient>
      <linearGradient id="hillMid" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#689f38"/>
        <stop offset="100%" stop-color="#2e7d32"/>
      </linearGradient>
      <linearGradient id="hillNear" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#558b2f"/>
        <stop offset="100%" stop-color="#1b5e20"/>
      </linearGradient>
      <linearGradient id="trunkBg" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3e2723"/>
        <stop offset="50%" stop-color="#5d4037"/>
        <stop offset="100%" stop-color="#271714"/>
      </linearGradient>
    </defs>

    <!-- Небо та лагідне сонце -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>
    <circle cx="310" cy="135" r="105" fill="#fff59d" opacity="0.85"/>
    <circle cx="310" cy="135" r="165" fill="#fff9c4" opacity="0.35"/>

    <!-- Хмари -->
    <g class="cloud-anim-1" opacity="0.8" fill="#ffffff">
      <path d="M220,160 Q250,115 300,130 Q340,95 395,125 Q440,120 455,160 Q480,185 440,200 L210,200 Q180,180 220,160 Z"/>
      <path d="M1250,110 Q1285,70 1335,90 Q1380,60 1430,95 Q1475,105 1465,140 L1235,140 Q1210,125 1250,160 Z"/>
    </g>
    <g class="cloud-anim-2" opacity="0.65" fill="#fffde7">
      <path d="M740,210 Q775,170 820,185 Q865,155 910,190 Q945,200 930,225 L730,225 Z"/>
    </g>

    <!-- Далекі лісисті пагорби -->
    <path d="M0,690 Q240,580 520,640 T1080,610 T1620,650 T1920,600 L1920,1080 L0,1080 Z" fill="url(#hillFar)"/>
    <path d="M0,760 Q450,660 950,740 T1920,710 L1920,1080 L0,1080 Z" fill="url(#hillMid)"/>

    <!-- Сонячні промені -->
    <polygon class="sunbeam" points="280,0 120,1080 390,1080 360,0" fill="url(#beamGrad)"/>
    <polygon class="sunbeam" points="340,0 640,1080 960,1080 440,0" fill="url(#beamGrad)"/>
    <polygon class="sunbeam" points="420,0 1220,1080 1560,1080 520,0" fill="url(#beamGrad)"/>

    <!-- Стовбури великих дерев по краях екрана -->
    <path d="M-40,0 L75,0 Q60,420 95,880 L-40,880 Z" fill="url(#trunkBg)"/>
    <path d="M1960,0 L1845,0 Q1860,420 1825,880 L1960,880 Z" fill="url(#trunkBg)"/>

    <!-- Передній зелений луг -->
    <path d="M0,865 Q520,795 1040,855 T1920,830 L1920,1080 L0,1080 Z" fill="url(#hillNear)"/>

    <!-- Листя на верхніх кулісах -->
    <g class="foliage-sway-top" fill="#1b5e20">
      <circle cx="45" cy="40" r="125"/>
      <circle cx="170" cy="15" r="105" fill="#2e7d32"/>
      <circle cx="1875" cy="45" r="130"/>
      <circle cx="1740" cy="15" r="105" fill="#2e7d32"/>
    </g>

    <!-- Трава та лісові квіти на галявині -->
    <g class="foliage-sway">
      <path d="M320,1080 Q340,960 300,910 Q355,950 355,1080 Z" fill="#33691e"/>
      <path d="M355,1080 Q385,950 430,900 Q395,965 385,1080 Z" fill="#558b2f"/>
      <path d="M920,1080 Q940,980 905,930 Q955,975 960,1080 Z" fill="#33691e"/>
      <path d="M1480,1080 Q1510,960 1560,915 Q1525,970 1510,1080 Z" fill="#558b2f"/>
      <g transform="translate(420,975)">
        <circle cx="0" cy="0" r="14" fill="#ffffff"/>
        <circle cx="0" cy="0" r="6" fill="#fdd835"/>
      </g>
      <g transform="translate(910,995)">
        <circle cx="0" cy="0" r="12" fill="#ffffff"/>
        <circle cx="0" cy="0" r="5" fill="#fdd835"/>
      </g>
      <g transform="translate(1545,980)">
        <circle cx="0" cy="0" r="15" fill="#fff9c4"/>
        <circle cx="0" cy="0" r="6" fill="#ffb300"/>
      </g>
    </g>

    <!-- Живий метелик -->
    <g class="butterfly" transform="translate(520, 420)">
      <path d="M0,0 C-18,-22 -34,-5 -12,10 C-28,22 -10,32 0,14 C10,32 28,22 12,10 C34,-5 18,-22 0,0 Z" fill="#ffd54f" stroke="#f57f17" stroke-width="2"/>
      <ellipse cx="0" cy="8" rx="2.5" ry="10" fill="#3e2723"/>
    </g>
  </svg>

  <!-- ================= ГІЛОЧКА ПРОГРЕСУ ТА ПЕРЕМИКАЧІ РЕЖИМІВ ================= -->

<script>
/* ============================================================================
   1. АУДІО-РУШІЙ WEB AUDIO API (ЖИВІ ЛІСОВІ ЗВУКИ ТА МЕЛОДІЇ БЕЗ СЛІВ)
   ============================================================================ */
const AudioEngine = (() => {
  let ctx = null;

  function getCtx() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (ctx.state === 'suspended') {
      ctx.resume();
    }
    return ctx;
  }

  // Дерев'яний ксилофон при перемиканні або відкритті таблички
  function playWoodTap(freq = 540) {
    const c = getCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, c.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.38, c.currentTime + 0.09);

    gain.gain.setValueAtTime(0.26, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.14);

    osc.connect(gain);
    gain.connect(c.destination);
    osc.start();
    osc.stop(c.currentTime + 0.15);
  }

  // Спів лісової пташки
  function playBirdChirp() {
    const c = getCtx();
    const now = c.currentTime;
    [0, 0.13].forEach((offset, i) => {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      const startFreq = i === 0 ? 1680 : 1980;
      osc.frequency.setValueAtTime(startFreq, now + offset);
      osc.frequency.exponentialRampToValueAtTime(startFreq * 1.42, now + offset + 0.06);
      osc.frequency.exponentialRampToValueAtTime(startFreq * 0.92, now + offset + 0.12);

      gain.gain.setValueAtTime(0.01, now + offset);
      gain.gain.linearRampToValueAtTime(0.18, now + offset + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.13);

      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.14);
    });
  }

  // Святкові мелодії при правильній відповіді (4 різні варіанти)
  function playSuccessMelody(variant = 0) {
    const c = getCtx();
    const now = c.currentTime;
    const scales = [
      [523.25, 659.25, 783.99, 1046.50, 1318.51],
      [587.33, 739.99, 880.00, 1174.66, 1479.98],
      [440.00, 554.37, 659.25, 880.00, 1108.73, 1318.51],
      [493.88, 622.25, 739.99, 987.77, 1244.51]
    ];
    const notes = scales[variant % scales.length];

    notes.forEach((freq, idx) => {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.075);

      gain.gain.setValueAtTime(0.001, now + idx * 0.075);
      gain.gain.linearRampToValueAtTime(0.24, now + idx * 0.075 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.45);

      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now + idx * 0.075);
      osc.stop(now + idx * 0.075 + 0.46);
    });
  }

  // Глухий дерев'яний звук при помилці
  function playWrongSound() {
    const c = getCtx();
    const now = c.currentTime;
    [210, 160].forEach((freq, idx) => {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + idx * 0.12);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.7, now + idx * 0.12 + 0.15);

      gain.gain.setValueAtTime(0.22, now + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.16);

      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now + idx * 0.12);
      osc.stop(now + idx * 0.12 + 0.17);
    });
  }

  return { playWoodTap, playBirdChirp, playSuccessMelody, playWrongSound };
})();

   Створюють пучки голок сосни, плакучі віти верби, різьблене листя дуба та клена.
   ============================================================================ */

// Генератор пучка довгих соснових голок (віяло хвоїнок для дерева сосни)
function renderPineNeedleCluster(cx, cy, radius, darkColor, midColor, lightColor) {
  let paths = '';
  // Задній темний шар голок
  for (let a = -155; a <= -25; a += 10) {
    const rad = (a * Math.PI) / 180;
    const x2 = (cx + Math.cos(rad) * radius).toFixed(1);
    const y2 = (cy + Math.sin(rad) * radius).toFixed(1);
    paths += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="${darkColor}" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  // Середній смарагдовий шар голок
  for (let a = -148; a <= -32; a += 11) {
    const rad = (a * Math.PI) / 180;
    const r2 = radius * 0.92;
    const x2 = (cx + Math.cos(rad) * r2).toFixed(1);
    const y2 = (cy + Math.sin(rad) * r2).toFixed(1);
    paths += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="${midColor}" stroke-width="2" stroke-linecap="round"/>`;
  }
  // Передній освітлений сонцем шар голок
  for (let a = -138; a <= -42; a += 14) {
    const rad = (a * Math.PI) / 180;
    const r2 = radius * 0.8;
    const x2 = (cx + Math.cos(rad) * r2).toFixed(1);
    const y2 = (cy + Math.sin(rad) * r2).toFixed(1);
    paths += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="${lightColor}" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  return paths;
}

// Генератор довгої плакучої гілки верби з густими вузькими листочками вздовж усієї довжини
function renderWillowWeepingStrand(xStart, yStart, xEnd, yEnd, ctrlX, hasCatkins = false) {
  let svg = `<path d="M${xStart},${yStart} Q${ctrlX},${(yStart + yEnd) / 2} ${xEnd},${yEnd}" fill="none" stroke="#688f2e" stroke-width="2.2" stroke-linecap="round"/>`;
  const steps = 11;
  for (let i = 1; i <= steps; i++) {
    const t = i / (steps + 1);
    const inv = 1 - t;
    const px = (inv * inv * xStart + 2 * inv * t * ctrlX + t * t * xEnd).toFixed(1);
    const py = (inv * inv * yStart + 2 * inv * t * ((yStart + yEnd) / 2) + t * t * yEnd).toFixed(1);
    const leafColor = i % 3 === 0 ? '#c5e1a5' : (i % 2 === 0 ? '#9ccc65' : '#689f38');
    // Лівий і правий вузькі вербові листочки
    svg += `<path d="M${px},${py} C${px - 10},${Number(py) + 6} ${px - 12},${Number(py) + 18} ${px - 4},${Number(py) + 24} C${px - 1},${Number(py) + 16} ${px},${Number(py) + 8} ${px},${py} Z" fill="${leafColor}"/>`;
    svg += `<path d="M${px},${py} C${Number(px) + 10},${Number(py) + 6} ${Number(px) + 12},${Number(py) + 18} ${Number(px) + 4},${Number(py) + 24} C${Number(px) + 1},${Number(py) + 16} ${px},${Number(py) + 8} ${px},${py} Z" fill="${leafColor}"/>`;
    if (hasCatkins && i % 3 === 1) {
      svg += `<ellipse cx="${Number(px) + (i % 2 === 0 ? 5 : -5)}" cy="${Number(py) + 8}" rx="3.2" ry="5" fill="#f5f5f5" stroke="#b0bec5" stroke-width="0.8"/>`;
    }
  }
  return svg;
}

/* ============================================================================
   7. АКТИВНІ ВІЗУАЛЬНІ ФІДБЕКИ (САЛЮТИ З ЛИСТЯ, КВІТІВ ТА ІСКОР)
   ============================================================================ */
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function spawnCelebrationParticles(x, y, styleVariant = 0) {
  const palettes = [
    ['#ffd54f', '#8bc34a', '#ff8a65', '#dce775', '#ffffff'],
    ['#ffee58', '#66bb6a', '#ffb74d', '#aed581', '#fff59d'],
    ['#ffd740', '#9ccc65', '#ffab40', '#c5e1a5', '#f48fb1']
  ];
  const colors = palettes[styleVariant % palettes.length];

  for (let i = 0; i < 46; i++) {
    const angle = (Math.PI * 2 * i) / 46 + (Math.random() - 0.5) * 0.3;
    const speed = 4 + Math.random() * 11;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      size: 8 + Math.random() * 12,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)],
      shape: i % 3,
      alpha: 1,
      gravity: 0.22
    });
  }
}

function animateParticles() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.rot += p.vRot;
    p.alpha -= 0.015;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, p.alpha);
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.color;

    if (p.shape === 0) {
      fxCtx.beginPath();
      fxCtx.moveTo(0, -p.size);
      fxCtx.quadraticCurveTo(p.size, 0, 0, p.size);
      fxCtx.quadraticCurveTo(-p.size, 0, 0, -p.size);
      fxCtx.fill();
    } else if (p.shape === 1) {
      fxCtx.beginPath();
      for (let k = 0; k < 4; k++) {
        fxCtx.lineTo(Math.cos((k * Math.PI) / 2) * p.size, Math.sin((k * Math.PI) / 2) * p.size);
        fxCtx.lineTo(Math.cos(((k + 0.5) * Math.PI) / 2) * (p.size * 0.35), Math.sin(((k + 0.5) * Math.PI) / 2) * (p.size * 0.35));
      }
      fxCtx.closePath();
      fxCtx.fill();
    } else {
      fxCtx.beginPath();
      fxCtx.arc(0, 0, p.size * 0.55, 0, Math.PI * 2);
      fxCtx.fill();
    }
    fxCtx.restore();
  }

  requestAnimationFrame(animateParticles);
}
animateParticles();

  if (type === 'happy') {
    charContainer.classList.add('squirrel-happy');
    eyesNormal.style.display = 'none';
    eyesHappy.style.display = 'block';
    mouthEl.setAttribute('d', 'M103,95 Q112,107 121,95');
    setTimeout(() => {
      charContainer.classList.remove('squirrel-happy');
      eyesNormal.style.display = 'block';
      eyesHappy.style.display = 'none';
      mouthEl.setAttribute('d', 'M105,97 Q112,104 119,97');
    }, 1650);
  } else if (type === 'sad') {
    charContainer.classList.add('squirrel-sad');
    mouthEl.setAttribute('d', 'M106,102 Q112,96 118,102');
    setTimeout(() => {
      charContainer.classList.remove('squirrel-sad');
      mouthEl.setAttribute('d', 'M105,97 Q112,104 119,97');
    }, 800);
  }
}

charContainer.addEventListener('click', () => {
  AudioEngine.playBirdChirp();
  triggerSquirrelReaction('happy');
  const rect = charContainer.getBoundingClientRect();
  spawnCelebrationParticles(rect.left + rect.width / 2, rect.top + 60, 1);
});

function renderProgressVine() {
  vineProgressEl.innerHTML = '';
  const isSlideMode = LEVELS[currentLevelIndex].type === 'slide';
  const startIdx = isSlideMode ? 0 : 8;
  const endIdx = isSlideMode ? 8 : LEVELS.length;

  btnModeSlides.classList.toggle('active-mode', isSlideMode);
  btnModeQuiz.classList.toggle('active-mode', !isSlideMode);

  for (let i = startIdx; i < endIdx; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'progress-leaf';
    if (i === currentLevelIndex) leaf.classList.add('active');
    else if (visitedLevels.has(i)) leaf.classList.add('visited');

    leaf.addEventListener('click', () => {
      AudioEngine.playWoodTap(600);
      goToLevel(i);
    });
    vineProgressEl.appendChild(leaf);
  }
}

function renderCurrentLevel() {
  visitedLevels.add(currentLevelIndex);
  renderProgressVine();
  stageEl.innerHTML = '';

  const level = LEVELS[currentLevelIndex];

  // ---------------- 1 РІВЕНЬ: СЛАЙД (ДЕРЕВО + ЛИСТОК І ПЛІД + ВІДКРИТТЯ ПІДПИСІВ ПО КЛІКУ) ----------------
  if (level.type === 'slide') {
    const treePlaque = document.createElement('div');
    treePlaque.className = 'wood-plaque tree-card';
    treePlaque.innerHTML = `
      <div class="illustration-frame">
        ${getTreeSVG(level.treeId)}
      </div>
      <div class="label-plaque" id="tree-label-box">
        <span class="label-text">${level.treeName}</span>
        <div class="leaf-shutter"></div>
      </div>
    `;

    const fruitPlaque = document.createElement('div');
    fruitPlaque.className = 'wood-plaque fruit-showcase-card';
    fruitPlaque.innerHTML = `
      <div class="illustration-frame fruit-frame-bg">
        ${getFruitSVG(level.treeId)}
      </div>
      <div class="label-plaque" id="fruit-label-box">
        <span class="label-text">${level.fruitName}</span>
        <div class="leaf-shutter"></div>
      </div>
    `;

    treePlaque.addEventListener('click', () => {
      const box = treePlaque.querySelector('#tree-label-box');
      const wasRevealed = box.classList.contains('revealed');
      box.classList.toggle('revealed');
      AudioEngine.playWoodTap(wasRevealed ? 440 : 660);
      if (!wasRevealed) {
        triggerSquirrelReaction('happy');
        const rect = box.getBoundingClientRect();
        spawnCelebrationParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 0);
      }
    });

    fruitPlaque.addEventListener('click', () => {
      const box = fruitPlaque.querySelector('#fruit-label-box');
      const wasRevealed = box.classList.contains('revealed');
      box.classList.toggle('revealed');
      AudioEngine.playBirdChirp();
      if (!wasRevealed) {
        triggerSquirrelReaction('happy');
        const rect = box.getBoundingClientRect();
        spawnCelebrationParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 1);
      }
    });

    stageEl.appendChild(treePlaque);
    stageEl.appendChild(fruitPlaque);
  }

  // ---------------- 2 РІВЕНЬ: ВІКТОРИНА (ДЕРЕВО ТА 3 ПЛОДИ НА ВИБІР) ----------------
  else if (level.type === 'quiz') {
    const treePlaque = document.createElement('div');
    treePlaque.className = 'wood-plaque tree-card';
    treePlaque.innerHTML = `
      <div class="illustration-frame">
        ${getTreeSVG(level.treeId)}
      </div>
      <div class="label-plaque" id="quiz-tree-label">
        <span class="label-text">${level.treeName}</span>
        <div class="leaf-shutter"></div>
      </div>
    `;

    treePlaque.addEventListener('click', () => {
      const box = treePlaque.querySelector('#quiz-tree-label');
      box.classList.toggle('revealed');
      AudioEngine.playWoodTap(580);
    });

    const optionsCol = document.createElement('div');
    optionsCol.className = 'quiz-options-column';

    let roundSolved = false;

    level.options.forEach((optTreeId) => {
      const optCard = document.createElement('div');
      optCard.className = 'wood-plaque quiz-option-card';
      optCard.innerHTML = `
        <div class="illustration-frame fruit-frame-bg">
          ${getFruitSVG(optTreeId)}
        </div>
      `;

      optCard.addEventListener('click', () => {
        const rect = optCard.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        if (optTreeId === level.treeId) {
          optCard.classList.add('correct-choice');
          AudioEngine.playSuccessMelody(currentLevelIndex % 4);
          triggerSquirrelReaction('happy');
          spawnCelebrationParticles(centerX, centerY, currentLevelIndex % 3);

          treePlaque.querySelector('#quiz-tree-label').classList.add('revealed');

          if (!roundSolved) {
            roundSolved = true;
            setTimeout(() => {
              if (currentLevelIndex < LEVELS.length - 1) {
                goToLevel(currentLevelIndex + 1);
              }
            }, 1750);
          }
        } else {
          optCard.classList.remove('wrong-choice');
          void optCard.offsetWidth;
          optCard.classList.add('wrong-choice');
          AudioEngine.playWrongSound();
          triggerSquirrelReaction('sad');
        }
      });

      optionsCol.appendChild(optCard);
    });

    stageEl.appendChild(treePlaque);
    stageEl.appendChild(optionsCol);
  }
}

function goToLevel(index) {
  if (index < 0) index = LEVELS.length - 1;
  if (index >= LEVELS.length) index = 0;
  currentLevelIndex = index;
  renderCurrentLevel();
}

document.getElementById('btn-prev').addEventListener('click', () => {
  AudioEngine.playWoodTap(460);
  goToLevel(currentLevelIndex - 1);
});

document.getElementById('btn-next').addEventListener('click', () => {
  AudioEngine.playWoodTap(580);
  goToLevel(currentLevelIndex + 1);
});

btnModeSlides.addEventListener('click', () => {
  AudioEngine.playWoodTap(520);
  goToLevel(0);
});

btnModeQuiz.addEventListener('click', () => {
  AudioEngine.playWoodTap(640);
  goToLevel(8);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') {
    AudioEngine.playWoodTap(580);
    goToLevel(currentLevelIndex + 1);
  } else if (e.key === 'ArrowLeft') {
    AudioEngine.playWoodTap(460);
    goToLevel(currentLevelIndex - 1);
  }
});

renderCurrentLevel();
</script>
</body>
</html>
