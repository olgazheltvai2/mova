<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Битва з Драконом</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0c0508;
      font-family: 'Montserrat', sans-serif;
    }

    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 60% 45%, #47141e 0%, #210913 50%, #090306 100%);
    }

    /* Тремтіння екрану під час ударів та реву дракона */
    .screen-shake {
      animation: shakeLight 0.42s cubic-bezier(.36,.07,.19,.97) both;
    }
    .screen-shake-heavy {
      animation: shakeHeavy 0.8s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shakeLight {
      10%, 90% { transform: translate3d(-4px, 2px, 0); }
      20%, 80% { transform: translate3d(6px, -3px, 0); }
      30%, 50%, 70% { transform: translate3d(-8px, 4px, 0); }
      40%, 60% { transform: translate3d(8px, -4px, 0); }
    }

    @keyframes shakeHeavy {
      0%, 100% { transform: translate3d(0, 0, 0); }
      10%, 30%, 50%, 70%, 90% { transform: translate3d(-13px, 7px, 0) rotate(-0.6deg); }
      20%, 40%, 60%, 80% { transform: translate3d(13px, -7px, 0) rotate(0.6deg); }
    }

    /* Шари сцени */
    #bg-svg, #bg-canvas, #battle-svg, #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #bg-svg { z-index: 1; object-fit: cover; }
    #bg-canvas { z-index: 2; }
    #battle-svg { z-index: 3; object-fit: cover; }
    #fx-canvas { z-index: 5; }

    /* Верхня панель для підвішених на ланцюгах геральдичних щитів зі словами (НІКОЛИ не перекриває голови дракона) */
    #banners-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 25vh;
      max-height: 220px;
      z-index: 6;
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding-right: 9vw;
      gap: 3.5vw;
    }

    .word-banner {
      position: relative;
      pointer-events: auto;
      cursor: pointer;
      width: clamp(250px, 27vw, 450px);
      transform-origin: top center;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease, opacity 0.25s ease;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.9));
    }

    .word-banner:hover {
      transform: translateY(6px) scale(1.05);
      filter: drop-shadow(0 18px 28px rgba(255, 175, 40, 0.6)) brightness(1.12);
    }

    .word-banner:active {
      transform: translateY(2px) scale(0.97);
    }

    .word-banner.disabled {
      pointer-events: none;
    }

    .word-banner svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .word-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 1.5px;
      fill: url(#parchmentGoldGrad);
      paint-order: stroke fill;
      stroke: #1a0805;
      stroke-width: 7px;
      stroke-linejoin: round;
      filter: drop-shadow(0 4px 3px rgba(0,0,0,0.95));
      pointer-events: none;
    }

    /* Клікабельні голови дракона */
    .dragon-hitbox {
      cursor: pointer;
      pointer-events: all;
      transition: filter 0.2s ease;
    }
    .dragon-hitbox:hover, .dragon-hitbox.linked-hover {
      filter: brightness(1.22) drop-shadow(0 0 18px rgba(255, 165, 30, 0.75));
    }

    /* Мінімалістична кована кнопка "Далі" */
    #skip-btn {
      position: absolute;
      top: clamp(14px, 2.2vh, 26px);
      right: clamp(14px, 2vw, 28px);
      z-index: 10;
      width: clamp(54px, 4.8vw, 70px);
      height: clamp(54px, 4.8vw, 70px);
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.85));
    }

    #skip-btn:hover {
      transform: scale(1.13) rotate(5deg);
      filter: drop-shadow(0 10px 20px rgba(255, 190, 50, 0.7)) brightness(1.15);
    }

    #skip-btn:active {
      transform: scale(0.93);
    }

    .lava-glow {
      animation: lavaPulse 3.2s ease-in-out infinite alternate;
    }
    @keyframes lavaPulse {
      0% { opacity: 0.7; filter: brightness(0.95); }
      100% { opacity: 1; filter: brightness(1.3); }
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- ================= 1. СЮЖЕТНИЙ ЖИВИЙ ФОН ІЗ ЗАМКОМ НА СКЕЛІ (SVG) ================= -->
  <svg id="bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#08030d"/>
        <stop offset="28%" stop-color="#1c0921"/>
        <stop offset="58%" stop-color="#471220"/>
        <stop offset="82%" stop-color="#852319"/>
        <stop offset="100%" stop-color="#d45622"/>
      </linearGradient>

      <radialGradient id="craterGlow" cx="64%" cy="62%" r="48%">
        <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.52"/>
        <stop offset="45%" stop-color="#b81d13" stop-opacity="0.26"/>
        <stop offset="100%" stop-color="#1a050d" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="bloodMoon" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff6d6"/>
        <stop offset="55%" stop-color="#f7b257"/>
        <stop offset="85%" stop-color="#d44b20" stop-opacity="0.65"/>
        <stop offset="100%" stop-color="#d44b20" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="farMountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2c101d"/>
        <stop offset="100%" stop-color="#12050c"/>
      </linearGradient>

      <!-- Масивна скеля під замком, що спускається до самого низу долини -->
      <linearGradient id="castleCliffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b2029"/>
        <stop offset="45%" stop-color="#241119"/>
        <stop offset="100%" stop-color="#0d0509"/>
      </linearGradient>

      <linearGradient id="castleWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4a2c36"/>
        <stop offset="55%" stop-color="#2b1620"/>
        <stop offset="100%" stop-color="#14080e"/>
      </linearGradient>

      <linearGradient id="midMountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#220b15"/>
        <stop offset="100%" stop-color="#090307"/>
      </linearGradient>

      <linearGradient id="bridgeStoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3d2f3a"/>
        <stop offset="22%" stop-color="#291e27"/>
        <stop offset="65%" stop-color="#171017"/>
        <stop offset="100%" stop-color="#080508"/>
      </linearGradient>

      <linearGradient id="dragonRockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#402325"/>
        <stop offset="45%" stop-color="#241115"/>
        <stop offset="100%" stop-color="#090407"/>
      </linearGradient>

      <linearGradient id="lavaRiverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff282"/>
        <stop offset="35%" stop-color="#ff7700"/>
        <stop offset="75%" stop-color="#cc1600"/>
        <stop offset="100%" stop-color="#4a0404"/>
      </linearGradient>

      <linearGradient id="parchmentGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="40%" stop-color="#fef08a"/>
        <stop offset="80%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>
    </defs>

    <!-- Небо та вулканічна заграва -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>
    <rect width="1920" height="1080" fill="url(#craterGlow)"/>

    <!-- Багряний місяць -->
    <circle cx="145" cy="185" r="95" fill="url(#bloodMoon)" opacity="0.85"/>

    <!-- Далекий гірський хребет на горизонті -->
    <path d="M0,660 L110,520 L220,565 L370,450 L520,570 L670,470 L820,595 L980,455 L1140,580 L1310,415 L1490,555 L1670,430 L1810,530 L1920,475 L1920,1080 L0,1080 Z" fill="url(#farMountGrad)"/>

    <!-- ================= МІЦНО ВКОРІНЕНА СКЕЛЯ ТА ФОРТЕЦЯ (БЕЗ ЗАВИСАННЯ В ПОВІТРІ) ================= -->
    <g id="grounded-castle-complex">
      <!-- Масивний скелястий стрімчак, на якому стоїть замок (йде від вершин замку аж до підніжжя мосту y=900) -->
      <path d="M120,860 L165,640 L215,525 L245,455 L465,455 L505,535 L555,650 L620,860 Z" fill="url(#castleCliffGrad)" stroke="#14070c" stroke-width="3"/>
      <!-- Кам'яні грані, уступи та рельєф скелі під замком -->
      <path d="M245,455 L285,575 L235,720 L260,840 L150,840 L185,660 L225,530 Z" fill="#4f2d38" opacity="0.45"/>
      <path d="M355,460 L380,590 L340,745 M465,455 L435,585 L485,730 M245,460 L300,530 L375,495 L455,540" stroke="#14070c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- Підпірні кам'яні контрфорси, що вростають прямо у скелю -->
      <path d="M250,480 L235,565 L268,545 L268,460 Z" fill="#2c1721" stroke="#12060b" stroke-width="2"/>
      <path d="M335,485 L328,585 L362,560 L362,465 Z" fill="#2c1721" stroke="#12060b" stroke-width="2"/>
      <path d="M430,480 L445,570 L412,550 L412,460 Z" fill="#2c1721" stroke="#12060b" stroke-width="2"/>

      <!-- Мури та вежі середньовічного замку, що стоять прямо на скельному плато -->
      <g transform="translate(225, 250)">
        <!-- Головна основа цитаделі (вмурована в скелю на рівні y=205..235) -->
        <path d="M15,225 L15,105 L30,105 L30,120 L46,120 L46,105 L62,105 L62,160 L88,160 L88,58 L152,58 L152,150 L182,150 L182,88 L198,88 L198,104 L214,104 L214,88 L230,88 L230,225 Q175,240 120,232 Q65,240 15,225 Z" fill="url(#castleWallGrad)" stroke="#12060b" stroke-width="3"/>

        <!-- Ліва сторожова вежа з гострим дахом -->
        <rect x="18" y="95" width="42" height="125" fill="url(#castleWallGrad)" stroke="#12060b" stroke-width="2.5"/>
        <path d="M10,95 L39,42 L68,95 Z" fill="#5c1922" stroke="#1a060b" stroke-width="2.5"/>

        <!-- Центральний Донжон (Головна вежа) -->
        <rect x="85" y="45" width="70" height="180" fill="url(#castleWallGrad)" stroke="#12060b" stroke-width="3"/>
        <!-- Зубці центральної вежі -->
        <path d="M78,45 L78,28 L94,28 L94,38 L108,38 L108,28 L132,28 L132,38 L146,38 L146,28 L162,28 L162,45 Z" fill="#3b202b" stroke="#12060b" stroke-width="2"/>
        <!-- Високий шатровий дах донжона -->
        <path d="M82,28 L120,-38 L158,28 Z" fill="#691b24" stroke="#1a060b" stroke-width="2.5"/>

        <!-- Права башта -->
        <rect x="180" y="80" width="48" height="142" fill="url(#castleWallGrad)" stroke="#12060b" stroke-width="2.5"/>
        <path d="M172,80 L204,28 L236,80 Z" fill="#5c1922" stroke="#1a060b" stroke-width="2.5"/>

        <!-- Рухомі королівські прапори на шпилях замку -->
        <line x1="39" y1="42" x2="39" y2="8" stroke="#eab308" stroke-width="2.5"/>
        <path id="castle-flag-1" d="M39,10 Q60,16 78,10 L68,20 L78,28 Q58,22 39,28 Z" fill="#dc2626" stroke="#fde047" stroke-width="1"/>

        <line x1="120" y1="-38" x2="120" y2="-78" stroke="#eab308" stroke-width="3"/>
        <path id="castle-flag-2" d="M120,-76 Q148,-68 172,-76 L158,-64 L172,-52 Q145,-60 120,-52 Z" fill="#dc2626" stroke="#fde047" stroke-width="1.2"/>

        <line x1="204" y1="28" x2="204" y2="-6" stroke="#eab308" stroke-width="2.5"/>
        <path id="castle-flag-3" d="M204,-4 Q225,2 243,-4 L233,6 L243,14 Q223,8 204,14 Z" fill="#dc2626" stroke="#fde047" stroke-width="1"/>

        <!-- Тепле світло у бійницях та вікнах замку -->
        <rect x="106" y="68" width="10" height="24" rx="5" fill="#ffbe42" class="lava-glow"/>
        <rect x="124" y="68" width="10" height="24" rx="5" fill="#ffbe42" class="lava-glow"/>
        <rect x="115" y="115" width="12" height="28" rx="6" fill="#ff9922" class="lava-glow"/>
        <rect x="34" y="118" width="9" height="20" rx="4" fill="#ff9922" class="lava-glow"/>
        <rect x="199" y="105" width="10" height="22" rx="4" fill="#ff9922" class="lava-glow"/>
        <!-- Кована брама замку та серпантин стежки вниз по скелі -->
        <path d="M104,225 L104,182 Q120,165 136,182 L136,225 Z" fill="#14070a" stroke="#eab308" stroke-width="2"/>
        <line x1="112" y1="176" x2="112" y2="225" stroke="#52343d" stroke-width="2"/>
        <line x1="120" y1="173" x2="120" y2="225" stroke="#52343d" stroke-width="2"/>
        <line x1="128" y1="176" x2="128" y2="225" stroke="#52343d" stroke-width="2"/>
      </g>
    </g>

    <!-- Середній план гір із потоками лави -->
    <path d="M0,760 L140,655 L290,725 L540,585 L730,735 L950,555 L1140,695 L1360,505 L1590,675 L1790,545 L1920,625 L1920,1080 L0,1080 Z" fill="url(#midMountGrad)"/>

    <!-- Розжарені лавові ріки в ущелині -->
    <g class="lava-glow">
      <path d="M950,560 Q970,650 920,740 Q870,830 940,950 L1000,950 Q950,825 985,735 Q1015,645 965,560 Z" fill="url(#lavaRiverGrad)"/>
      <path d="M1360,510 Q1330,605 1380,690 Q1420,770 1350,900 L1400,900 Q1465,775 1415,685 Q1370,605 1375,510 Z" fill="url(#lavaRiverGrad)"/>
      <ellipse cx="970" cy="935" rx="260" ry="42" fill="url(#lavaRiverGrad)" opacity="0.55"/>
    </g>

    <!-- Кам'яний бастіон та міст, по якому крокує Лицар -->
    <g>
      <path d="M0,835 L1290,842 L1350,925 L1260,1080 L0,1080 Z" fill="url(#bridgeStoneGrad)"/>
      <!-- Зубці парапету вздовж мосту -->
      <path d="M0,810 L90,810 L90,835 L130,835 L130,810 L220,810 L220,835 L260,835 L260,810 L350,810 L350,835 L390,835 L390,810 L480,810 L480,835 L520,835 L520,810 L610,810 L610,835 L650,835 L650,810 L740,810 L740,835 L780,835 L780,810 L870,810 L870,835 L910,835 L910,810 L1000,810 L1000,835 L1040,835 L1040,810 L1130,810 L1130,835 L0,835 Z" fill="#231922"/>
      <!-- Кам'яні плити дороги -->
      <path d="M0,842 L1290,848 L1325,890 L0,890 Z" fill="#4b3a46"/>
      <path d="M0,848 L1295,854" stroke="#6b5364" stroke-width="3" opacity="0.65"/>
      <g fill="#2d212b" stroke="#140d13" stroke-width="2" opacity="0.8">
        <rect x="45" y="856" width="130" height="26" rx="4"/>
        <rect x="195" y="858" width="160" height="25" rx="4"/>
        <rect x="375" y="855" width="140" height="28" rx="4"/>
        <rect x="535" y="859" width="175" height="24" rx="4"/>
        <rect x="730" y="856" width="145" height="27" rx="4"/>
        <rect x="895" y="858" width="165" height="25" rx="4"/>
        <rect x="1080" y="860" width="140" height="25" rx="4"/>
      </g>
      <!-- Опорні арки мосту -->
      <path d="M120,1080 Q260,905 400,1080 Z" fill="#090408"/>
      <path d="M520,1080 Q670,905 820,1080 Z" fill="#090408"/>
      <path d="M920,1080 Q1060,920 1200,1080 Z" fill="#090408"/>
    </g>

    <!-- Ковані жаровні з живим вогнем уздовж мосту -->
    <g transform="translate(155, 725)">
      <path d="M15,120 L25,45 L35,45 L45,120 Z" fill="#1a1318" stroke="#42323d" stroke-width="2"/>
      <path d="M0,45 Q30,75 60,45 L52,30 L8,30 Z" fill="#2c2028" stroke="#6e5239" stroke-width="2"/>
      <ellipse cx="30" cy="30" rx="22" ry="8" fill="#ff7b00" class="lava-glow"/>
    </g>
    <g transform="translate(795, 732)">
      <path d="M15,120 L25,45 L35,45 L45,120 Z" fill="#1a1318" stroke="#42323d" stroke-width="2"/>
      <path d="M0,45 Q30,75 60,45 L52,30 L8,30 Z" fill="#2c2028" stroke="#6e5239" stroke-width="2"/>
      <ellipse cx="30" cy="30" rx="22" ry="8" fill="#ff7b00" class="lava-glow"/>
    </g>

    <!-- Вулканічний скелястий бастіон справа, де стоїть Двоглавий Дракон -->
    <g>
      <path d="M1140,1080 L1200,835 L1315,785 L1540,765 L1780,780 L1920,740 L1920,1080 Z" fill="url(#dragonRockGrad)"/>
      <path d="M1260,855 L1340,905 L1310,985 M1520,810 L1470,895 L1540,990 M1710,825 L1660,935" stroke="url(#lavaRiverGrad)" stroke-width="5" fill="none" stroke-linecap="round" class="lava-glow"/>
      <path d="M1200,835 L1315,785 L1540,765 L1780,780 L1920,740 L1920,770 L1775,805 L1535,795 L1325,815 L1215,860 Z" fill="#543132" opacity="0.65"/>
    </g>
  </svg>

  <!-- Канвас живого фону: хмари, далекі дракони в небі, полум'я смолоскипів, іскри -->
  <canvas id="bg-canvas"></canvas>

  <!-- ================= 2. ПЕРСОНАЖІ: ЛИЦАР З РУХОМИМИ НОГАМИ ТА ДВОГЛАВИЙ ДРАКОН (SVG) ================= -->
  <svg id="battle-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="steelLight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="30%" stop-color="#cbd5e1"/>
        <stop offset="65%" stop-color="#64748b"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>

      <linearGradient id="steelDark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94a3b8"/>
        <stop offset="50%" stop-color="#475569"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>

      <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="40%" stop-color="#eab308"/>
        <stop offset="80%" stop-color="#a16207"/>
        <stop offset="100%" stop-color="#422006"/>
      </linearGradient>

      <linearGradient id="crimsonCape" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#dc2626"/>
        <stop offset="55%" stop-color="#991b1b"/>
        <stop offset="100%" stop-color="#450a0a"/>
      </linearGradient>

      <linearGradient id="swordBlade" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="48%" stop-color="#e2e8f0"/>
        <stop offset="52%" stop-color="#94a3b8"/>
        <stop offset="100%" stop-color="#cbd5e1"/>
      </linearGradient>

      <linearGradient id="dragonBodyScale" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7f1d1d"/>
        <stop offset="45%" stop-color="#450a0a"/>
        <stop offset="100%" stop-color="#1c0408"/>
      </linearGradient>

      <!-- Ліва голова має рубіново-золотий відтінок луски (відповідає Лівому Щиту) -->
      <linearGradient id="dragonLeftScale" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#b91c1c"/>
        <stop offset="50%" stop-color="#6b1111"/>
        <stop offset="100%" stop-color="#290507"/>
      </linearGradient>

      <!-- Права голова має бронзово-смарагдовий гребінь і темну бронзову луску (відповідає Правому Щиту) -->
      <linearGradient id="dragonRightScale" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#9a3412"/>
        <stop offset="50%" stop-color="#431407"/>
        <stop offset="100%" stop-color="#1f0802"/>
      </linearGradient>

      <linearGradient id="dragonBellyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b"/>

  /********************************************************************
   * 2. СИНТЕЗАТОР ЗВУКІВ (WEB AUDIO API)
   ********************************************************************/
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Легкий металевий передзвін при наведенні на щит
    playHoverChime() {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    }

    // Дзвін меча при виборі цілі
    playSelectRing() {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1100, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.16);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    // Синхронізований з кроками брязкіт латних чобіт по каменю
    playArmorStep(pitchOffset = 0) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const clank = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'triangle';
      clank.type = 'square';
      osc.frequency.setValueAtTime(220 + pitchOffset, now);
      osc.frequency.exponentialRampToValueAtTime(75, now + 0.085);

      clank.frequency.setValueAtTime(920 + pitchOffset * 2, now);
      clank.frequency.exponentialRampToValueAtTime(420, now + 0.05);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(gain);
      clank.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      clank.start(now);
      osc.stop(now + 0.095);
      clank.stop(now + 0.06);
    }

    // Свист розсікання повітря мечем
    playSwordSlash() {
      this.init();
      const now = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.28;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 3.5;
      filter.frequency.setValueAtTime(600, now);
      filter.frequency.exponentialRampToValueAtTime(2800, now + 0.12);
      filter.frequency.exponentialRampToValueAtTime(400, now + 0.27);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.45, now + 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    }

    // Переможний удар мечем + глухий удар голови об землю + фанфара
    playVictoryHit() {
      this.init();
      const now = this.ctx.currentTime;

      const impactOsc = this.ctx.createOscillator();
      const impactGain = this.ctx.createGain();
      impactOsc.type = 'sawtooth';
      impactOsc.frequency.setValueAtTime(195, now);
      impactOsc.frequency.exponentialRampToValueAtTime(38, now + 0.35);
      impactGain.gain.setValueAtTime(0.55, now);
      impactGain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      impactOsc.connect(impactGain);
      impactGain.connect(this.ctx.destination);
      impactOsc.start(now);
      impactOsc.stop(now + 0.37);

      const thudOsc = this.ctx.createOscillator();
      const thudGain = this.ctx.createGain();
      thudOsc.type = 'sine';
      thudOsc.frequency.setValueAtTime(98, now + 0.42);
      thudOsc.frequency.exponentialRampToValueAtTime(24, now + 0.95);
      thudGain.gain.setValueAtTime(0.001, now);
      thudGain.gain.setValueAtTime(0.68, now + 0.42);
      thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.98);
      thudOsc.connect(thudGain);
      thudGain.connect(this.ctx.destination);
      thudOsc.start(now + 0.42);
      thudOsc.stop(now + 1.0);

      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + 0.14 + idx * 0.085);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1650, now + 0.14 + idx * 0.085);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.setValueAtTime(0.16, now + 0.14 + idx * 0.085);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.25);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + 0.14 + idx * 0.085);
        osc.stop(now + 1.3);
      });
    }

    // Відскок меча + рев дракона + потік вогню
    playDragonFireBreath() {
      this.init();
      const now = this.ctx.currentTime;

      [860, 1320, 2080].forEach(freq => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.72, now + 0.22);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      });

      const roarOsc = this.ctx.createOscillator();
      const roarSub = this.ctx.createOscillator();
      const roarGain = this.ctx.createGain();
      roarOsc.type = 'sawtooth';
      roarSub.type = 'triangle';

      roarOsc.frequency.setValueAtTime(140, now + 0.18);
      roarOsc.frequency.linearRampToValueAtTime(70, now + 0.72);
      roarOsc.frequency.exponentialRampToValueAtTime(42, now + 1.55);

      roarSub.frequency.setValueAtTime(70, now + 0.18);
      roarSub.frequency.exponentialRampToValueAtTime(30, now + 1.55);

      roarGain.gain.setValueAtTime(0.001, now);
      roarGain.gain.linearRampToValueAtTime(0.44, now + 0.3);
      roarGain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);

      roarOsc.connect(roarGain);
      roarSub.connect(roarGain);
      roarGain.connect(this.ctx.destination);
      roarOsc.start(now + 0.18);
      roarSub.start(now + 0.18);
      roarOsc.stop(now + 1.65);
      roarSub.stop(now + 1.65);

      const bufferSize = this.ctx.sampleRate * 1.5;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const fireFilter = this.ctx.createBiquadFilter();
      fireFilter.type = 'lowpass';
      fireFilter.frequency.setValueAtTime(360, now + 0.2);
      fireFilter.frequency.linearRampToValueAtTime(1450, now + 0.5);
      fireFilter.frequency.exponentialRampToValueAtTime(280, now + 1.65);

      const fireGain = this.ctx.createGain();
      fireGain.gain.setValueAtTime(0.001, now + 0.2);
      fireGain.gain.linearRampToValueAtTime(0.55, now + 0.42);
      fireGain.gain.exponentialRampToValueAtTime(0.001, now + 1.68);

      noise.connect(fireFilter);
      fireFilter.connect(fireGain);
      fireGain.connect(this.ctx.destination);
      noise.start(now + 0.2);
    }

    playSkipClick() {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(780, now + 0.11);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }
  }

    bgCanvas.width = cw;
    bgCanvas.height = ch;
    fxCanvas.width = cw;
    fxCanvas.height = ch;
  }
  window.addEventListener('resize', resizeCanvases);
  resizeCanvases();

  function svgToScreen(svgX, svgY) {
    const scale = Math.max(cw / 1920, ch / 1080);
    const offsetX = (cw - 1920 * scale) / 2;
    const offsetY = (ch - 1080 * scale) / 2;
    return {
      x: svgX * scale + offsetX,
      y: svgY * scale + offsetY,
      scale: scale
    };
  }

  // Силуети далеких крилатих птахів/дракончиків біля замку та вулканічні іскри
  const bgEmbers = [];
  for (let i = 0; i < 65; i++) {
    bgEmbers.push({
      x: Math.random() * cw,
      y: Math.random() * ch,
      r: 1.2 + Math.random() * 3.2,
      vx: -0.4 - Math.random() * 0.8,
      vy: -0.6 - Math.random() * 1.5,
      alpha: 0.3 + Math.random() * 0.7,
      hue: 15 + Math.random() * 35
    });
  }

  const distantFlyers = [
    { svgX: 180, svgY: 220, speed: 0.35, phase: 0, amp: 12 },
    { svgX: 520, svgY: 190, speed: 0.48, phase: 2.1, amp: 15 },
    { svgX: 780, svgY: 260, speed: 0.3, phase: 4.2, amp: 10 }
  ];

  const fxParticles = [];
  const slashArcs = [];

  function spawnSmokePuff(svgX, svgY, count = 4, dark = false) {
    const pos = svgToScreen(svgX, svgY);
    for (let i = 0; i < count; i++) {
      fxParticles.push({
        type: 'smoke',
        x: pos.x + (Math.random() - 0.5) * 16,
        y: pos.y + (Math.random() - 0.5) * 10,
        vx: (-0.8 - Math.random() * 1.4) * pos.scale,
        vy: (-1.1 - Math.random() * 1.8) * pos.scale,
        r: (6 + Math.random() * 9) * pos.scale,
        maxR: (24 + Math.random() * 24) * pos.scale,
        alpha: dark ? 0.65 : 0.38,
        color: dark ? '25, 18, 22' : '165, 150, 160',
        life: 0,
        maxLife: 42 + Math.random() * 24
      });
    }
  }

  function spawnSwordSlash(svgX, svgY, isCorrect) {
    const pos = svgToScreen(svgX, svgY);
    slashArcs.push({
      x: pos.x,
      y: pos.y,
      radius: 95 * pos.scale,
      life: 0,
      maxLife: 18,
      color: isCorrect ? '#fde047' : '#cbd5e1',
      glow: isCorrect ? '#f97316' : '#64748b'
    });

    const sparkCount = isCorrect ? 50 : 24;
    for (let i = 0; i < sparkCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (3 + Math.random() * (isCorrect ? 14 : 8)) * pos.scale;
      fxParticles.push({
        type: 'spark',
        x: pos.x,
        y: pos.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2 * pos.scale,
        r: (2.5 + Math.random() * 4) * pos.scale,
        color: isCorrect
          ? (Math.random() > 0.35 ? '#fef08a' : '#ff7b00')
          : '#e2e8f0',
        life: 0,
        maxLife: 24 + Math.random() * 20
      });
    }
  }

  function spawnDragonFireStream(mouthSvgX, mouthSvgY, targetSvgX, targetSvgY) {
    const start = svgToScreen(mouthSvgX, mouthSvgY);
    const end = svgToScreen(targetSvgX, targetSvgY);
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist;
    const uy = dy / dist;

    for (let i = 0; i < 9; i++) {
      const speed = (18 + Math.random() * 14) * start.scale;
      const spread = (Math.random() - 0.5) * 0.25;
      const cos = Math.cos(spread);
      const sin = Math.sin(spread);
      const vx = (ux * cos - uy * sin) * speed;
      const vy = (ux * sin + uy * cos) * speed;

      fxParticles.push({
        type: 'fire',
        x: start.x + (Math.random() - 0.5) * 16 * start.scale,
        y: start.y + (Math.random() - 0.5) * 16 * start.scale,
        vx,
        vy,
        r: (14 + Math.random() * 20) * start.scale,
        maxR: (55 + Math.random() * 45) * start.scale,
        life: 0,
        maxLife: 28 + Math.random() * 16
      });
    }
  }

  function adjustWordFontSize(textEl, wordStr) {
    if (wordStr.length >= 9) {
      textEl.style.fontSize = '38px';

      textEl.style.fontSize = '43px';
    } else {
      textEl.style.fontSize = '50px';
    }
  }

  function generateNextWordPair() {
    const bySounds = {};
    WORD_DATABASE.forEach(item => {
      if (!bySounds[item.sounds]) bySounds[item.sounds] = [];
      bySounds[item.sounds].push(item);
    });

    const soundPairs = [[3, 4], [4, 5], [5, 6], [6, 7], [7, 8]];
    const chosenRange = soundPairs[Math.floor(Math.random() * soundPairs.length)];

    const poolLow = bySounds[chosenRange[0]].filter(w => !recentWords.includes(w.word));
    const poolHigh = bySounds[chosenRange[1]].filter(w => !recentWords.includes(w.word));

    const finalPoolLow = poolLow.length ? poolLow : bySounds[chosenRange[0]];
    const finalPoolHigh = poolHigh.length ? poolHigh : bySounds[chosenRange[1]];

    const wordLow = finalPoolLow[Math.floor(Math.random() * finalPoolLow.length)];
    const wordHigh = finalPoolHigh[Math.floor(Math.random() * finalPoolHigh.length)];

    recentWords.push(wordLow.word, wordHigh.word);
    if (recentWords.length > 18) {
      recentWords.splice(0, 2);
    }

    if (Math.random() < 0.5) {
      currentPair = [wordHigh, wordLow];
    } else {
      currentPair = [wordLow, wordHigh];
    }

    wordText0.textContent = currentPair[0].word;
    wordText1.textContent = currentPair[1].word;
    adjustWordFontSize(wordText0, currentPair[0].word);
    adjustWordFontSize(wordText1, currentPair[1].word);

    [banner0, banner1].forEach(b => {
      b.classList.remove('disabled');
      b.style.opacity = '1';
      b.style.transform = 'translateY(0) scale(1)';
    });
  }

  function setCharacterEmotions(knightMood, dragonMood) {

  function resetPositionsAndNextRound() {
    animState.knightX = 420;
    animState.knightY = 845;
    animState.isWalking = false;
    animState.walkPhase = 0;
    animState.swordAngle = -18;
    animState.shieldY = 0;

    animState.head1FallY = 0;
    animState.head1FallRot = 0;

    animState.jaw0Angle = 0;
    animState.jaw1Angle = 0;

    setCharacterEmotions('idle', 'idle');
    generateNextWordPair();

  function triggerShake(heavy = false) {
    gameStage.classList.remove('screen-shake', 'screen-shake-heavy');
    void gameStage.offsetWidth;
    gameStage.classList.add(heavy ? 'screen-shake-heavy' : 'screen-shake');
  }

  // Головна бойова сцена при кліку на слово або голову дракона
  function handleChoice(chosenIndex) {
    if (isAnimating) return;
    isAnimating = true;
    sound.playSelectRing();

    banner0.classList.add('disabled');
    banner1.classList.add('disabled');
    dragonNeck0.classList.remove('linked-hover');
    dragonNeck1.classList.remove('linked-hover');

    const chosenWord = currentPair[chosenIndex];
    const otherWord = currentPair[1 - chosenIndex];
    const isCorrect = chosenWord.sounds > otherWord.sounds;

    const activeBanner = chosenIndex === 0 ? banner0 : banner1;
    const passiveBanner = chosenIndex === 0 ? banner1 : banner0;
    passiveBanner.style.opacity = '0.35';
    activeBanner.style.transform = 'translateY(8px) scale(1.08)';

    setCharacterEmotions('attack', 'idle');

    const targetKnightX = chosenIndex === 0 ? 1015 : 1135;
    const targetKnightY = chosenIndex === 0 ? 825 : 795;
    const strikeSvgPos = chosenIndex === 0 ? { x: 1255, y: 495 } : { x: 1415, y: 435 };

    const startTime = performance.now();
    const walkDuration = 680; // Достатньо часу, щоб дитина чітко бачила, як лицар перебирає ногами
    let lastStepIndex = -1;

    // КРОК 1: Лицар біжить вперед, активно рухаючи суглобами обох ніг
    animState.isWalking = true;
    animState.walkDir = 1;

    function animateCharge(now) {
      const t = Math.min(1, (now - startTime) / walkDuration);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

      animState.knightX = 420 + (targetKnightX - 420) * ease;
      animState.knightY = 845 + (targetKnightY - 845) * ease;
      animState.walkPhase = t * Math.PI * 5.5; // Майже 3 повних кроки обома ногами
      animState.swordAngle = -18 - ease * 78;

      const currentStep = Math.floor(animState.walkPhase / Math.PI);
      if (currentStep !== lastStepIndex) {
        lastStepIndex = currentStep;
        sound.playArmorStep((currentStep % 2) * 35);
        spawnSmokePuff(animState.knightX - 15, animState.knightY + 14, 3, false);
      }

      if (t < 1) {
        requestAnimationFrame(animateCharge);
      } else {
        animState.isWalking = false;
        executeSwordStrike();
      }
    }

    // КРОК 2: Помах мечем
    function executeSwordStrike() {
      sound.playSwordSlash();
      const strikeStart = performance.now();
      const strikeDuration = 165;

      function animateSwing(now) {
        const t = Math.min(1, (now - strikeStart) / strikeDuration);
        animState.swordAngle = -96 + t * 175;

        if (t < 1) {
          requestAnimationFrame(animateSwing);
        } else {
          spawnSwordSlash(strikeSvgPos.x, strikeSvgPos.y, isCorrect);
          if (isCorrect) {
            handleCorrectOutcome(chosenIndex);
          } else {
            handleWrongOutcome(chosenIndex);
          }
        }
      }
      requestAnimationFrame(animateSwing);
    }

    // КРОК 3А: ПРАВИЛЬНО — Голова падає, потім лицар крокує назад
    function handleCorrectOutcome(headIdx) {
      sound.playVictoryHit();
      triggerShake(true);
      setCharacterEmotions('victory', headIdx === 0 ? 'hit0' : 'hit1');

      animState.swordAngle = -65;
      if (headIdx === 0) {
        animState.jaw1Angle = -24;
      } else {
        animState.jaw0Angle = -24;
      }

      const fallStart = performance.now();
      const totalDuration = 1250;
      let lastRetreatStep = -1;

      function animateHeadFallAndRetreat(now) {
        const t = Math.min(1, (now - fallStart) / totalDuration);
        const fallT = Math.min(1, t / 0.65);
        const gravityEase = fallT * fallT;

        if (headIdx === 0) {
          animState.head0FallY = gravityEase * 520;
          animState.head0FallRot = -fallT * 110;
          if (fallT > 0.7) animState.head0Opacity = Math.max(0, 1 - (fallT - 0.7) / 0.3);
        } else {
          animState.head1FallY = gravityEase * 520;
          animState.head1FallRot = -fallT * 110;
          if (fallT > 0.7) animState.head1Opacity = Math.max(0, 1 - (fallT - 0.7) / 0.3);
        }

        // Відступ лицаря кроком назад на вихідну позицію
        if (t > 0.35) {
          animState.isWalking = true;
          animState.walkDir = -1;
          const retreatT = Math.min(1, (t - 0.35) / 0.65);
          animState.knightX = targetKnightX + (420 - targetKnightX) * retreatT;
          animState.knightY = targetKnightY + (845 - targetKnightY) * retreatT;
          animState.walkPhase = retreatT * Math.PI * 5;
          animState.swordAngle = -65 + retreatT * 47;

          const rStep = Math.floor(animState.walkPhase / Math.PI);
          if (rStep !== lastRetreatStep) {
            lastRetreatStep = rStep;
            sound.playArmorStep((rStep % 2) * 30);
            spawnSmokePuff(animState.knightX + 10, animState.knightY + 14, 2, false);
          }
        }

        if (t < 1) {
          requestAnimationFrame(animateHeadFallAndRetreat);
        } else {
          animState.isWalking = false;
          setTimeout(() => {
            spawnSmokePuff(strikeSvgPos.x, strikeSvgPos.y, 10, false);
            resetPositionsAndNextRound();
          }, 260);
        }
      }
      requestAnimationFrame(animateHeadFallAndRetreat);
    }

    // КРОК 3Б: НЕПРАВИЛЬНО — Дракон дихає вогнем, лицар відступає, перебираючи ногами
    function handleWrongOutcome(headIdx) {
      sound.playDragonFireBreath();
      triggerShake(true);
      setCharacterEmotions('scorched', 'angry');

      animState.jaw0Angle = -32;
      animState.jaw1Angle = -32;
      animState.shieldY = -18;
      animState.fireActive = true;
      animState.fireOriginSvg = headIdx === 0
        ? { x: 1185, y: 495 }
        : { x: 1335, y: 430 };

      const fireStart = performance.now();
      const fireDuration = 1400;
      let lastRetreatStep = -1;

      function animateFireRetreat(now) {
        const t = Math.min(1, (now - fireStart) / fireDuration);

        // Лицар активно задкує ногами від полум'я
        const retreatT = Math.min(1, t / 0.8);
        animState.isWalking = retreatT < 1;
        animState.walkDir = -1;
        animState.walkPhase = retreatT * Math.PI * 6;
        animState.knightX = targetKnightX + (420 - targetKnightX) * retreatT;
        animState.knightY = targetKnightY + (845 - targetKnightY) * retreatT;
        animState.swordAngle = 22;

        const rStep = Math.floor(animState.walkPhase / Math.PI);
        if (rStep !== lastRetreatStep && retreatT < 1) {
          lastRetreatStep = rStep;
          sound.playArmorStep((rStep % 2) * 25);
          spawnSmokePuff(animState.knightX + 12, animState.knightY + 14, 2, true);
        }

        if (t > 0.15 && t < 0.85) {
          knightSoot.setAttribute('opacity', String(Math.min(1, (t - 0.15) * 2.5)));
        }

        if (t > 0.72) {
          animState.fireActive = false;
          animState.jaw0Angle = 0;
          animState.jaw1Angle = 0;
        }

        if (t < 1) {
          requestAnimationFrame(animateFireRetreat);
        } else {
          animState.isWalking = false;
          spawnSmokePuff(420, 710, 12, true);
          setTimeout(() => {
            resetPositionsAndNextRound();
          }, 340);
        }
      }
      requestAnimationFrame(animateFireRetreat);
    }

    requestAnimationFrame(animateCharge);
  }

  /********************************************************************
   * 6. ГОЛОВНИЙ ЦИКЛ ЖИВОЇ АНІМАЦІЇ (КРОКИ НІГ, ПРАПОРИ ЗАМКУ, ДИХАННЯ, ВОГОНЬ)
   ********************************************************************/
  let lastSmokeTime = 0;

  function masterLoop(timestamp) {
    const time = timestamp * 0.001;

    // 1. ЖИВИЙ ФОН (bgCanvas)
    bgCtx.clearRect(0, 0, cw, ch);

    // Крилаті силуети в небі біля замку
    distantFlyers.forEach(f => {
      f.svgX += f.speed;
      if (f.svgX > 1960) f.svgX = -40;
      const pos = svgToScreen(f.svgX, f.svgY + Math.sin(time * 2 + f.phase) * f.amp);
      const wingY = Math.sin(time * 7 + f.phase) * 6 * pos.scale;
      bgCtx.save();
      bgCtx.strokeStyle = 'rgba(25, 8, 14, 0.75)';
      bgCtx.lineWidth = 2.2 * pos.scale;
      bgCtx.beginPath();
      bgCtx.moveTo(pos.x - 10 * pos.scale, pos.y + wingY);
      bgCtx.quadraticCurveTo(pos.x - 4 * pos.scale, pos.y - 4 * pos.scale, pos.x, pos.y);
      bgCtx.quadraticCurveTo(pos.x + 4 * pos.scale, pos.y - 4 * pos.scale, pos.x + 10 * pos.scale, pos.y + wingY);
      bgCtx.stroke();
      bgCtx.restore();
    });

    // Полум'я в жаровнях мосту
    const brazierPositions = [
      svgToScreen(185, 750),
      svgToScreen(825, 757)
    ];
    brazierPositions.forEach((bPos, idx) => {
      const flicker = Math.sin(time * 12 + idx * 2) * 4 * bPos.scale;
      const grad = bgCtx.createRadialGradient(
        bPos.x, bPos.y - 12 * bPos.scale, 2,
        bPos.x, bPos.y - 18 * bPos.scale, (36 + flicker) * bPos.scale
      );
      grad.addColorStop(0, 'rgba(255, 250, 180, 0.95)');
      grad.addColorStop(0.4, 'rgba(255, 120, 20, 0.75)');
      grad.addColorStop(1, 'rgba(220, 20, 0, 0)');
      bgCtx.fillStyle = grad;
      bgCtx.beginPath();
      bgCtx.arc(bPos.x, bPos.y - 14 * bPos.scale, (36 + flicker) * bPos.scale, 0, Math.PI * 2);
      bgCtx.fill();
    });

    // Іскри у повітрі
    bgEmbers.forEach(e => {
      e.x += e.vx + Math.sin(time * 2 + e.y * 0.01) * 0.35;
      e.y += e.vy;
      if (e.y < -10) {
        e.y = ch + 10;
        e.x = Math.random() * cw;
      }
      if (e.x < -10) e.x = cw + 10;
      bgCtx.save();
      bgCtx.globalAlpha = e.alpha * (0.65 + 0.35 * Math.sin(time * 5 + e.x));
      bgCtx.fillStyle = `hsl(${e.hue}, 100%, 62%)`;
      bgCtx.shadowColor = '#ff6a00';
      bgCtx.shadowBlur = 8;
      bgCtx.beginPath();
      bgCtx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      bgCtx.fill();
      bgCtx.restore();
    });

    // Хвилювання прапорів на вежах замку
    const fWave = Math.sin(time * 6) * 5;
    castleFlag1.setAttribute('d', `M39,10 Q60,${16 + fWave} 78,${10 - fWave * 0.5} L68,20 L78,${28 - fWave * 0.5} Q58,${22 + fWave} 39,28 Z`);
    castleFlag2.setAttribute('d', `M120,-76 Q148,${-68 + fWave} 172,${-76 - fWave * 0.6} L158,-64 L172,${-52 - fWave * 0.6} Q145,${-60 + fWave} 120,-52 Z`);
    castleFlag3.setAttribute('d', `M204,-4 Q225,${2 - fWave} 243,${-4 + fWave * 0.5} L233,6 L243,${14 + fWave * 0.5} Q223,${8 - fWave} 204,14 Z`);

    // 2. АНІМАЦІЯ СУГЛОБІВ НІГ ТА ТІЛА ЛИЦАРЯ
    let hipAngleL = 0;
    let kneeAngleL = 0;
    let hipAngleR = 0;
    let kneeAngleR = 0;
    let walkBobY = 0;
    let torsoLean = 0;

    if (animState.isWalking) {
      const p = animState.walkPhase * animState.walkDir;
      // Ліва і права нога рухаються у протифазі з реалістичним згинанням колін
      hipAngleL = Math.sin(p) * 34;
      kneeAngleL = Math.max(0, -Math.cos(p) * 38);

      hipAngleR = Math.sin(p + Math.PI) * 34;
      kneeAngleR = Math.max(0, -Math.cos(p + Math.PI) * 38);

      walkBobY = -Math.abs(Math.sin(p)) * 12;
      torsoLean = animState.walkDir * 7;
    } else {
      // Легке дихання у спокої
      walkBobY = Math.sin(time * 3.2) * 3;
    }

    const capeWave = Math.sin(time * (animState.isWalking ? 11 : 5.5)) * (animState.isWalking ? 18 : 10);

    knightRoot.setAttribute('transform', `translate(${animState.knightX}, ${animState.knightY})`);
    knightLegLeft.setAttribute('transform', `translate(-18, -96) rotate(${hipAngleL})`);
    knightShinLeft.setAttribute('transform', `translate(-2, 46) rotate(${kneeAngleL})`);
    knightLegRight.setAttribute('transform', `translate(18, -96) rotate(${hipAngleR})`);
    knightShinRight.setAttribute('transform', `translate(2, 46) rotate(${kneeAngleR})`);

    knightUpperBody.setAttribute(
      'transform',
      `translate(0, ${-108 + walkBobY}) rotate(${torsoLean})`
    );
    knightSwordArm.setAttribute(
      'transform',
      `translate(32, -88) rotate(${animState.swordAngle + Math.sin(time * 3.2) * 2.5 - hipAngleL * 0.35})`
    );
    knightShieldArm.setAttribute(
      'transform',
      `translate(-22, ${-78 + animState.shieldY + Math.cos(time * 3.2) * 2}) rotate(${hipAngleL * 0.25})`
    );
    knightCapePath.setAttribute(
      'd',
      `M10,0 Q${-85 + capeWave},45 ${-135 + capeWave * 1.4},${145 + capeWave * 0.4} Q-90,165 -35,155 Q-5,85 25,15 Z`
    );

    // 3. АНІМАЦІЯ ДВОГЛАВОГО ДРАКОНА
    const wingBeat = Math.sin(time * 2.6) * 7.5;
    const tailSway = Math.cos(time * 2.1) * 5;
    const dragonBreath = Math.sin(time * 2.6) * 4;

    dragonWingLeft.setAttribute('transform', `translate(-45, ${-210 + dragonBreath}) rotate(${-wingBeat})`);
    dragonWingRight.setAttribute('transform', `translate(55, ${-220 + dragonBreath}) rotate(${wingBeat})`);
    dragonTail.setAttribute('transform', `rotate(${tailSway})`);
    dragonTorso.setAttribute('transform', `translate(0, ${dragonBreath * 0.6})`);

    const neck0Sway = Math.sin(time * 2.3) * 4;
    const neck1Sway = Math.cos(time * 2.0 + 1.2) * 4.2;

    dragonNeck0.setAttribute('transform', `translate(-95, ${-215 + dragonBreath}) rotate(${neck0Sway})`);
    dragonNeck1.setAttribute('transform', `translate(25, ${-240 + dragonBreath}) rotate(${neck1Sway})`);

    headDetach0.setAttribute(
      'transform',
      `translate(-82, ${-92 + animState.head0FallY}) rotate(${animState.head0FallRot + Math.cos(time * 2.3) * 2.8})`
    );
    headDetach0.setAttribute('opacity', String(animState.head0Opacity));

    headDetach1.setAttribute(
      'transform',
      `translate(20, ${-95 + animState.head1FallY}) rotate(${animState.head1FallRot + Math.sin(time * 2.0) * 2.8})`
    );
    headDetach1.setAttribute('opacity', String(animState.head1Opacity));

    const idleJaw0 = Math.sin(time * 2.3) * 2.5 - 2.5;
    const idleJaw1 = Math.cos(time * 2.0) * 2.5 - 2.5;
    jaw0.setAttribute('transform', `translate(-15, 10) rotate(${animState.jaw0Angle || idleJaw0})`);
    jaw1.setAttribute('transform', `translate(-15, 10) rotate(${animState.jaw1Angle || idleJaw1})`);

    if (!isAnimating && timestamp - lastSmokeTime > 1500) {
      if (Math.random() < 0.5) {
        spawnSmokePuff(1185, 485, 2, false);
      } else {
        spawnSmokePuff(1365, 420, 2, false);
      }
      lastSmokeTime = timestamp;
    }

    if (animState.fireActive) {
      spawnDragonFireStream(
        animState.fireOriginSvg.x,
        animState.fireOriginSvg.y,
        animState.knightX + 15,
        animState.knightY - 125
      );
    }

    // 4. БОЙОВІ СПЕЦЕФЕКТИ (fxCanvas)
    fxCtx.clearRect(0, 0, cw, ch);

    for (let i = slashArcs.length - 1; i >= 0; i--) {
      const arc = slashArcs[i];
      arc.life++;
      const progress = arc.life / arc.maxLife;
      fxCtx.save();
      fxCtx.translate(arc.x, arc.y);
      fxCtx.rotate(-0.65);
      fxCtx.globalAlpha = 1 - progress;
      fxCtx.strokeStyle = arc.color;
      fxCtx.shadowColor = arc.glow;
      fxCtx.shadowBlur = 22;
      fxCtx.lineWidth = (1 - progress) * 18;
      fxCtx.lineCap = 'round';
      fxCtx.beginPath();
      fxCtx.arc(0, 0, arc.radius * (0.85 + progress * 0.45), -Math.PI * 0.65, Math.PI * 0.65);
      fxCtx.stroke();
      fxCtx.restore();
      if (arc.life >= arc.maxLife) slashArcs.splice(i, 1);
    }

    for (let i = fxParticles.length - 1; i >= 0; i--) {
      const p = fxParticles[i];
      p.life++;
      const progress = p.life / p.maxLife;

      if (p.type === 'fire') {
        p.x += p.vx;
        p.y += p.vy;
        const currR = p.r + (p.maxR - p.r) * progress;
        const alpha = Math.max(0, 1 - Math.pow(progress, 1.5));

        fxCtx.save();
        const grad = fxCtx.createRadialGradient(p.x, p.y, currR * 0.1, p.x, p.y, currR);
        if (progress < 0.25) {
          grad.addColorStop(0, `rgba(255, 255, 220, ${alpha})`);
          grad.addColorStop(0.5, `rgba(255, 200, 30, ${alpha * 0.9})`);
          grad.addColorStop(1, 'rgba(255, 80, 0, 0)');
        } else if (progress < 0.65) {
          grad.addColorStop(0, `rgba(255, 170, 20, ${alpha})`);
          grad.addColorStop(0.55, `rgba(230, 45, 5, ${alpha * 0.85})`);
          grad.addColorStop(1, 'rgba(120, 10, 5, 0)');
        } else {
          grad.addColorStop(0, `rgba(180, 35, 10, ${alpha * 0.8})`);
          grad.addColorStop(0.6, `rgba(40, 25, 30, ${alpha * 0.65})`);
          grad.addColorStop(1, 'rgba(15, 10, 12, 0)');
        }
        fxCtx.fillStyle = grad;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, currR, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      } else if (p.type === 'spark') {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.38;
        fxCtx.save();
        fxCtx.globalAlpha = 1 - progress;
        fxCtx.fillStyle = p.color;
        fxCtx.shadowColor = '#ff9900';
        fxCtx.shadowBlur = 10;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.r * (1 - progress * 0.5), 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      } else if (p.type === 'smoke') {
        p.x += p.vx;
        p.y += p.vy;
        const currR = p.r + (p.maxR - p.r) * progress;
        fxCtx.save();
        fxCtx.globalAlpha = p.alpha * (1 - progress);
        fxCtx.fillStyle = `rgb(${p.color})`;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, currR, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }

      if (p.life >= p.maxLife) fxParticles.splice(i, 1);
    }

    requestAnimationFrame(masterLoop);
  }

  window.onload = function () {
    generateNextWordPair();
    requestAnimationFrame(masterLoop);
  };
</script>
</body>
