<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Черга з повітряною кулькою — Звук Р</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1a2e40;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  #scene-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 30;
  }

  /* Top right minimalist controls - no plain white rectangles */
  .hud-controls {
    position: absolute;
    top: 2vh;
    right: 2vw;
    display: flex;
    align-items: center;
    gap: 1.1vw;
    z-index: 40;
  }

  .hud-btn {
    position: relative;
    border: none;
    outline: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    filter: drop-shadow(0 6px 12px rgba(25, 40, 65, 0.38));
    background: transparent;
    padding: 0;
  }

  .hud-btn:hover {
    transform: translateY(-3px) scale(1.07);
    filter: drop-shadow(0 10px 16px rgba(25, 40, 65, 0.48)) brightness(1.06);
  }

  .hud-btn:active {
    transform: translateY(1px) scale(0.95);
  }

  /* Animations inside SVG */
  @keyframes ferrisSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes cabinCounterSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(-360deg); }
  }
  @keyframes cloudDriftSlow {
    0% { transform: translateX(-120px); }
    50% { transform: translateX(120px); }
    100% { transform: translateX(-120px); }
  }
  @keyframes cloudDriftMed {
    0% { transform: translateX(90px); }
    50% { transform: translateX(-90px); }
    100% { transform: translateX(90px); }
  }
  @keyframes treeSway {
    0%, 100% { transform: rotate(-1.6deg); }
    50% { transform: rotate(1.8deg); }
  }
  @keyframes idleBreathe {
    0%, 100% { transform: scaleY(1) translateY(0px); }
    50% { transform: scaleY(1.018) translateY(-2.5px); }
  }
  @keyframes balloonFloat {
    0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
    50% { transform: translateY(-11px) rotate(1.8deg); }
  }
  @keyframes spotPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 6px 14px rgba(255, 195, 40, 0.45)); }
    50% { transform: scale(1.055); filter: drop-shadow(0 10px 24px rgba(255, 215, 70, 0.85)); }
  }
  @keyframes waterPulse {
    0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.88; }
    50% { transform: scaleY(1.08) scaleX(1.03); opacity: 1; }
  }
  @keyframes eyeBlink {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.08); }
  }
  @keyframes queueJump {
    0%, 100% { transform: translateY(0) scaleY(1); }
    30% { transform: translateY(-26px) scaleY(1.05); }
    55% { transform: translateY(0) scaleY(0.95); }
    78% { transform: translateY(-14px) scaleY(1.03); }
  }
  @keyframes wrongWobble {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    18% { transform: translateX(-18px) rotate(-7deg); }
    36% { transform: translateX(16px) rotate(7deg); }
    54% { transform: translateX(-12px) rotate(-5deg); }
    72% { transform: translateX(9px) rotate(4deg); }
    88% { transform: translateX(-4px) rotate(-2deg); }
  }

  .ferris-wheel-rotator {
    transform-origin: 1420px 330px;
    animation: ferrisSpin 48s linear infinite;
  }
  .ferris-cabin {
    animation: cabinCounterSpin 48s linear infinite;
  }
  .cloud-slow {
    animation: cloudDriftSlow 38s ease-in-out infinite;
  }
  .cloud-med {
    animation: cloudDriftMed 29s ease-in-out infinite;
  }
  .sway-tree-1 {
    transform-origin: 540px 580px;
    animation: treeSway 6.5s ease-in-out infinite;
  }
  .sway-tree-2 {
    transform-origin: 1120px 560px;
    animation: treeSway 7.2s ease-in-out infinite reverse;
  }
  .sway-tree-3 {
    transform-origin: 1680px 600px;
    animation: treeSway 5.8s ease-in-out infinite;
  }
  .fountain-jet {
    transform-origin: 730px 560px;
    animation: waterPulse 1.4s ease-in-out infinite;
  }
  .char-breathe {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: idleBreathe 3.2s ease-in-out infinite;
  }
  .char-blink {
    transform-box: fill-box;
    transform-origin: center;
    animation: eyeBlink 4.3s infinite;
  }
  .balloon-bob {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: balloonFloat 3.4s ease-in-out infinite;
  }
  .interactive-spot {
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
  }
  .interactive-spot:hover {
    filter: brightness(1.12) drop-shadow(0 12px 26px rgba(255, 220, 80, 0.95));
  }
  .spot-badge-anim {
    transform-box: fill-box;
    transform-origin: center;
    animation: spotPulse 2.3s ease-in-out infinite;
  }
  .celebrate-jump {
    animation: queueJump 0.75s ease-in-out 2;
  }
  .wrong-shake {
    animation: wrongWobble 0.65s ease-in-out;
  }
  .clickable-queue-zone {
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <!-- Minimalist Custom-Shaped Top-Right Controls (No plain white boxes, no text feedbacks) -->
  <div class="hud-controls">
    <!-- Audio Pronunciation Button -->
    <button id="btn-speak" class="hud-btn" aria-label="Sound">
      <svg width="66" height="66" viewBox="0 0 66 66">
        <defs>
          <radialGradient id="speakBtnGrad" cx="35%" cy="28%" r="70%">
            <stop offset="0%" stop-color="#67e8f9"/>
            <stop offset="55%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#1e3a8a"/>
          </radialGradient>
          <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#b45309"/>
          </linearGradient>
        </defs>
        <!-- Scalloped medallion shape -->
        <path d="M33,4 C41,4 46,8 52,14 C58,20 62,25 62,33 C62,41 58,46 52,52 C46,58 41,62 33,62 C25,62 20,58 14,52 C8,46 4,41 4,33 C4,25 8,20 14,14 C20,8 25,4 33,4 Z" fill="url(#speakBtnGrad)" stroke="url(#goldRim)" stroke-width="3.5"/>
        <ellipse cx="26" cy="16" rx="12" ry="5" transform="rotate(-18 26 16)" fill="rgba(255,255,255,0.35)"/>
        <!-- Speaker Horn Icon -->
        <path d="M18,27 L25,27 L34,19 L34,47 L25,39 L18,39 Z" fill="#fef9c3" stroke="#78350f" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M40,24 C44,28 44,38 40,42" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
        <path d="M45,19 C52,26 52,40 45,47" fill="none" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Single Language Toggle Button (УКР / РУС) -->
    <button id="btn-lang" class="hud-btn" aria-label="Language">
      <svg width="84" height="62" viewBox="0 0 84 62">
        <defs>
          <linearGradient id="langBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f472b6"/>
            <stop offset="50%" stop-color="#db2777"/>
            <stop offset="100%" stop-color="#831843"/>
          </linearGradient>
          <pattern id="langDots" width="10" height="10" patternUnits="userSpaceOnUse">
            <circle cx="5" cy="5" r="1.4" fill="rgba(255,255,255,0.16)"/>
          </pattern>
        </defs>
        <path d="M18,6 Q42,2 66,6 Q80,10 80,31 Q80,52 66,56 Q42,60 18,56 Q4,52 4,31 Q4,10 18,6 Z" fill="url(#langBtnGrad)" stroke="url(#goldRim)" stroke-width="3.5"/>
        <path d="M18,6 Q42,2 66,6 Q80,10 80,31 Q80,52 66,56 Q42,60 18,56 Q4,52 4,31 Q4,10 18,6 Z" fill="url(#langDots)"/>
        <path d="M20,12 Q42,9 64,12" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <text id="lang-label" x="42" y="38" text-anchor="middle" fill="#fef9c3" font-size="22" font-weight="900" letter-spacing="1.5" style="text-shadow: 0 2px 4px rgba(0,0,0,0.45);">УКР</text>
      </svg>
    </button>

    <!-- Minimalist Next / Skip Button ("Далі") -->
    <button id="btn-next" class="hud-btn" aria-label="Next">
      <svg width="72" height="66" viewBox="0 0 72 66">
        <defs>
          <radialGradient id="nextBtnGrad" cx="35%" cy="25%" r="75%">
            <stop offset="0%" stop-color="#fde047"/>
            <stop offset="55%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#9a3412"/>
          </radialGradient>
        </defs>
        <path d="M16,7 Q36,3 56,7 Q68,14 68,33 Q68,52 56,59 Q36,63 16,59 Q4,52 4,33 Q4,14 16,7 Z" fill="url(#nextBtnGrad)" stroke="url(#goldRim)" stroke-width="3.5"/>
        <ellipse cx="28" cy="15" rx="14" ry="4.5" fill="rgba(255,255,255,0.4)"/>
        <path d="M22,33 L44,33 M36,21 L49,33 L36,45" fill="none" stroke="#fffbeb" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Main Widescreen 16:9 SVG Scene -->
  <svg id="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Sky & Atmosphere Gradients -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="42%" stop-color="#7dd3fc"/>
        <stop offset="78%" stop-color="#bae6fd"/>
        <stop offset="100%" stop-color="#fef3c7"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
        <stop offset="35%" stop-color="#fde047" stop-opacity="0.65"/>
        <stop offset="70%" stop-color="#facc15" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
      </radialGradient>

      <!-- Distant Hills & Park Greens -->
      <linearGradient id="farHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#86efac"/>
        <stop offset="100%" stop-color="#22c55e"/>
      </linearGradient>
      <linearGradient id="midHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#15803d"/>
      </linearGradient>
      <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#84cc16"/>
        <stop offset="60%" stop-color="#4d7c0f"/>
        <stop offset="100%" stop-color="#365314"/>
      </linearGradient>

      <!-- Cobblestone Plaza -->
      <linearGradient id="plazaBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fde68a"/>
        <stop offset="28%" stop-color="#f59e0b"/>
        <stop offset="65%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#92400e"/>
      </linearGradient>

      <pattern id="cobblePattern" width="96" height="52" patternUnits="userSpaceOnUse">
        <rect width="96" height="52" fill="#e59838" fill-opacity="0.18"/>
        <path d="M4,4 Q24,1 44,4 Q47,13 44,22 Q24,25 4,22 Q1,13 4,4 Z" fill="#fef3c7" fill-opacity="0.28" stroke="#92400e" stroke-opacity="0.3" stroke-width="1.5"/>
        <path d="M52,4 Q72,1 92,4 Q95,13 92,22 Q72,25 52,22 Q49,13 52,4 Z" fill="#fde68a" fill-opacity="0.22" stroke="#78350f" stroke-opacity="0.3" stroke-width="1.5"/>
        <path d="M28,28 Q48,25 68,28 Q71,37 68,46 Q48,49 28,46 Q25,37 28,28 Z" fill="#fed7aa" fill-opacity="0.25" stroke="#92400e" stroke-opacity="0.3" stroke-width="1.5"/>
        <path d="M-20,28 Q0,25 20,28 Q23,37 20,46 Q0,49 -20,46 Z" fill="#fef08a" fill-opacity="0.2" stroke="#92400e" stroke-opacity="0.28" stroke-width="1.5"/>
        <path d="M76,28 Q96,25 116,28 Q119,37 116,46 Q96,49 76,46 Z" fill="#fef08a" fill-opacity="0.2" stroke="#92400e" stroke-opacity="0.28" stroke-width="1.5"/>
      </pattern>

      <!-- Kiosk Striped Awning Pattern -->
      <pattern id="awningStripes" width="56" height="90" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="28" height="90" fill="#e11d48"/>
        <rect x="28" y="0" width="28" height="90" fill="#fff1f2"/>
      </pattern>

      <linearGradient id="kioskWood" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="50%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#78350f"/>
      </linearGradient>

      <!-- Spot Gradients (Start & End of Queue) -->
      <radialGradient id="spotFloorLeft" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="55%" stop-color="#10b981"/>
        <stop offset="85%" stop-color="#047857"/>
        <stop offset="100%" stop-color="#064e3b"/>
      </radialGradient>
      <radialGradient id="spotFloorRight" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="55%" stop-color="#8b5cf6"/>
        <stop offset="85%" stop-color="#6d28d9"/>
        <stop offset="100%" stop-color="#4c1d95"/>
      </radialGradient>

      <linearGradient id="badgeBoardLeft" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#34d399"/>
        <stop offset="50%" stop-color="#059669"/>
        <stop offset="100%" stop-color="#064e3b"/>
      </linearGradient>
      <linearGradient id="badgeBoardRight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a78bfa"/>
        <stop offset="50%" stop-color="#7c3aed"/>
        <stop offset="100%" stop-color="#3b0764"/>
      </linearGradient>

      <!-- Giant Balloon Shell Gradients -->
      <radialGradient id="mainBalloonShell" cx="35%" cy="28%" r="68%">
        <stop offset="0%" stop-color="#fffbeb"/>
        <stop offset="28%" stop-color="#fef3c7"/>
        <stop offset="68%" stop-color="#fde68a"/>
        <stop offset="90%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#b45309"/>
      </radialGradient>

      <radialGradient id="balloonInnerBackdrop" cx="50%" cy="45%" r="58%">
        <stop offset="0%" stop-color="#e0f2fe"/>
        <stop offset="60%" stop-color="#bae6fd"/>
        <stop offset="100%" stop-color="#7dd3fc"/>
      </radialGradient>

      <pattern id="balloonFestivePattern" width="36" height="36" patternUnits="userSpaceOnUse">
        <circle cx="18" cy="18" r="3.5" fill="rgba(251, 146, 60, 0.22)"/>
        <circle cx="0" cy="0" r="2.5" fill="rgba(244, 63, 94, 0.18)"/>
        <circle cx="36" cy="0" r="2.5" fill="rgba(244, 63, 94, 0.18)"/>
        <circle cx="0" cy="36" r="2.5" fill="rgba(244, 63, 94, 0.18)"/>
        <circle cx="36" cy="36" r="2.5" fill="rgba(244, 63, 94, 0.18)"/>
      </pattern>

      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1e1b4b" flood-opacity="0.32"/>
      </filter>

      <filter id="balloonDropShadow" x="-25%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#451a03" flood-opacity="0.38"/>
      </filter>
    </defs>

    <!-- ================= 1. SKY, SUN & CLOUDS ================= -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>

    <!-- Warm Summer Sun -->
    <g transform="translate(980, 145)">
      <circle cx="0" cy="0" r="210" fill="url(#sunGlow)"/>
      <circle cx="0" cy="0" r="64" fill="#fef9c3"/>
    </g>

    <!-- Drifting Layered Clouds -->
    <g class="cloud-slow" opacity="0.92">
      <g transform="translate(260, 120)">
        <path d="M0,40 Q15,10 55,15 Q80,-12 125,8 Q165,-5 185,28 Q215,32 210,58 Q205,78 170,78 L15,78 Q-20,75 0,40 Z" fill="#fefce8"/>
        <path d="M12,62 Q95,72 195,58" stroke="#bae6fd" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
      </g>
      <g transform="translate(1180, 95) scale(1.15)">
        <path d="M0,40 Q15,10 55,15 Q80,-12 125,8 Q165,-5 185,28 Q215,32 210,58 Q205,78 170,78 L15,78 Q-20,75 0,40 Z" fill="#fffbeb"/>
      </g>
    </g>
    <g class="cloud-med" opacity="0.82">
      <g transform="translate(680, 175) scale(0.88)">
        <path d="M0,40 Q15,10 55,15 Q80,-12 125,8 Q165,-5 185,28 Q215,32 210,58 Q205,78 170,78 L15,78 Q-20,75 0,40 Z" fill="#f0f9ff"/>
      </g>
      <g transform="translate(1620, 150) scale(0.95)">
        <path d="M0,40 Q15,10 55,15 Q80,-12 125,8 Q165,-5 185,28 Q215,32 210,58 Q205,78 170,78 L15,78 Q-20,75 0,40 Z" fill="#fefce8"/>
      </g>
    </g>

    <!-- Animated Flying Birds Layer -->
    <g id="birds-layer"></g>

    <!-- ================= 2. DISTANT AMUSEMENT PARK & FERRIS WHEEL ================= -->
    <!-- Far Hills -->
    <path d="M0,510 Q320,410 680,470 T1380,445 T1920,490 L1920,660 L0,660 Z" fill="url(#farHillGrad)"/>

    <!-- Rotating Giant Ferris Wheel in Background Right -->
    <g id="ferris-wheel-assembly">
      <!-- Support Legs -->
      <path d="M1320,575 L1420,330 L1520,575" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
      <path d="M1345,575 L1420,330 L1495,575" fill="none" stroke="#94a3b8" stroke-width="6"/>
      <!-- Rotating Wheel & Gondolas -->
      <g class="ferris-wheel-rotator">
        <circle cx="1420" cy="330" r="165" fill="none" stroke="#f8fafc" stroke-width="8"/>
        <circle cx="1420" cy="330" r="142" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="12 10"/>
        <!-- Spokes -->
        <g stroke="#e2e8f0" stroke-width="3.5">
          <line x1="1420" y1="165" x2="1420" y2="495"/>
          <line x1="1255" y1="330" x2="1585" y2="330"/>
          <line x1="1303" y1="213" x2="1537" y2="447"/>
          <line x1="1537" y1="213" x2="1303" y2="447"/>
        </g>
        <!-- 8 Counter-Rotating Colorful Cabins -->
        <g transform="translate(1420, 165)"><g class="ferris-cabin"><path d="M-16,4 L16,4 L12,28 Q0,34 -12,28 Z" fill="#ef4444" stroke="#fef08a" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="3"/></g></g>
        <g transform="translate(1537, 213)"><g class="ferris-cabin"><path d="M-16,4 L16,4 L12,28 Q0,34 -12,28 Z" fill="#3b82f6" stroke="#fef08a" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="3"/></g></g>
        <g transform="translate(1585, 330)"><g class="ferris-cabin"><path d="M-16,4 L16,4 L12,28 Q0,34 -12,28 Z" fill="#10b981" stroke="#fef08a" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="3"/></g></g>
        <g transform="translate(1537, 447)"><g class="ferris-cabin"><path d="M-16,4 L16,4 L12,28 Q0,34 -12,28 Z" fill="#f59e0b" stroke="#fef08a" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="3"/></g></g>
        <g transform="translate(1420, 495)"><g class="ferris-cabin"><path d="M-16,4 L16,4 L12,28 Q0,34 -12,28 Z" fill="#ec4899" stroke="#fef08a" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="3"/></g></g>
        <g transform="translate(1303, 447)"><g class="ferris-cabin"><path d="M-16,4 L16,4 L12,28 Q0,34 -12,28 Z" fill="#8b5cf6" stroke="#fef08a" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="3"/></g></g>
        <g transform="translate(1255, 330)"><g class="ferris-cabin"><path d="M-16,4 L16,4 L12,28 Q0,34 -12,28 Z" fill="#06b6d4" stroke="#fef08a" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="3"/></g></g>
        <g transform="translate(1303, 213)"><g class="ferris-cabin"><path d="M-16,4 L16,4 L12,28 Q0,34 -12,28 Z" fill="#eab308" stroke="#fef08a" stroke-width="2.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="3"/></g></g>
      </g>

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, startTime = 0, vol = 0.16, slideTo = null) {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime + startTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
    }
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function playStepSound() {
    playTone(150 + Math.random() * 45, 'triangle', 0.06, 0, 0.05, 90);
  }

  function playBalloonPopIn() {
    playTone(240, 'sine', 0.22, 0, 0.18, 580);
    playTone(580, 'triangle', 0.15, 0.12, 0.12, 760);

    ensureAudio();

      // Brass & Marimba Triumph
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];

        playTone(n * 0.5, 'sine', 0.3, i * 0.075, 0.12);
      });

      const scale = [440, 493.88, 554.37, 587.33, 659.25, 739.99, 830.61, 880, 1108.73];
      scale.forEach((n, i) => playTone(n, 'sine', 0.35, i * 0.045, 0.15));

      // Playful Xylophone Dance
      const melody = [587.33, 783.99, 987.77, 783.99, 1174.66];
      melody.forEach((n, i) => playTone(n, 'sine', 0.18, i * 0.085, 0.22, n * 1.02));

        [523.25, 659.25, 783.99],
        [587.33, 739.99, 880],
        [659.25, 830.61, 987.77],
        [783.99, 987.77, 1174.66, 1567.98]
      ];
      chords.forEach((ch, idx) => {
        ch.forEach(freq => playTone(freq, 'triangle', 0.26, idx * 0.11, 0.11));
      });

      // Joyful Bell Fanfare
      const bells = [659.25, 659.25, 783.99, 1046.5, 987.77, 1318.5];
      const times = [0, 0.09, 0.18, 0.28, 0.40, 0.52];
      bells.forEach((n, i) => playTone(n, 'sine', 0.32, times[i], 0.18));
    }

    }

    // Right Arm (viewer's right): Attached cleanly to right shoulder (18, -98)

  // Initialize the 4 people standing in the queue
  const queueLayer = document.getElementById('queue-layer');

  function initQueue() {
    queueCharacters = [];
    for (let i = 0; i < 4; i++) {
      const prof = createCharacterProfile(i + 1);
      prof.x = QUEUE_SLOTS[i].x;
      prof.y = QUEUE_SLOTS[i].y;
      prof.targetX = QUEUE_SLOTS[i].x;
      prof.withSmallBalloon = false;
      queueCharacters.push(prof);
    }
    renderQueueDOM();
  }

  function renderQueueDOM() {
    queueLayer.innerHTML = queueCharacters.map((c, idx) => `
      <g id="qchar-${idx}" transform="translate(${c.x}, ${c.y}) scale(${QUEUE_SLOTS[idx]?.scale || 0.96})">
        ${buildCharacterSVG(c, true, c.withSmallBalloon)}

  }

  let celebrationIndex = 0;

  // completely separated from the queue (X=385..1095)
  const childState = {
    x: 1690,
    y: 775,
    scale: 1.15,
    balloonScale: 1,
    walkPhase: 0,
    facingLeft: true
  };

  function getNextWord() {
    if (deck.length === 0) {
      deck = [...WORDS_DATA];
      // Fisher-Yates shuffle
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      // Prevent immediate repeat across reshuffle boundary
      if (currentWord && deck[deck.length - 1].id === currentWord.id) {
        [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];

    return deck.pop();

                <g id="balloon-clickable" style="cursor: pointer;">
                  <path d="M0,-296 C106,-296 154,-224 154,-142 C154,-66 96,-14 0,2 C-96,-14 -154,-66 -154,-142 C-154,-224 -106,-296 0,-296 Z"
                        fill="url(#mainBalloonShell)" stroke="#92400e" stroke-width="5"/>
                  <path d="M0,-296 C106,-296 154,-224 154,-142 C154,-66 96,-14 0,2 C-96,-14 -154,-66 -154,-142 C-154,-224 -106,-296 0,-296 Z"
                        fill="url(#balloonFestivePattern)"/>

                  <!-- Sky-Tinted Medallion Frame Inside Balloon for High-Contrast Realistic Picture -->
                  <circle cx="0" cy="-148" r="118" fill="url(#balloonInnerBackdrop)" stroke="#f59e0b" stroke-width="5"/>
                  <circle cx="0" cy="-148" r="110" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="10 7"/>

                  <!-- The Realistic Word Illustration Scaled Large & Clear -->
                  <g id="balloon-picture-art" transform="translate(0, -148) scale(1.1)">
                    ${wordObj.renderSVG()}
                  </g>

                  <!-- Glossy Specular Balloon Highlights -->
                  <ellipse cx="-72" cy="-228" rx="26" ry="12" transform="rotate(-34 -72 -228)" fill="rgba(255,255,255,0.58)"/>
                  <circle cx="-96" cy="-194" r="7" fill="rgba(255,255,255,0.48)"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    `;
  }

  function updateWalkingLimbs(groupEl, phase) {
    if (!groupEl) return;
    const legF = groupEl.querySelector('.leg-front');
    const legB = groupEl.querySelector('.leg-back');
    const armF = groupEl.querySelector('.arm-front');
    const armB = groupEl.querySelector('.arm-back');
    const swing = Math.sin(phase) * 26;
    if (legF) legF.style.transform = `rotate(${swing}deg)`;
    if (legB) legB.style.transform = `rotate(${-swing}deg)`;
    if (armF) armF.style.transform = `rotate(${-swing * 0.7}deg)`;
    if (armB) armB.style.transform = `rotate(${swing * 0.7}deg)`;
  }

  function resetLimbs(groupEl) {
    if (!groupEl) return;
    ['.leg-front', '.leg-back', '.arm-front', '.arm-back'].forEach(sel => {
      const el = groupEl.querySelector(sel);
      if (el) el.style.transform = 'rotate(0deg)';
    });
  }

  function animateChildTo(targetX, targetY, targetScale, targetBalloonScale, durationMs, onComplete) {
    const startX = childState.x;
    const startY = childState.y;
    const startScale = childState.scale;
    const startBScale = childState.balloonScale;
    const startTime = performance.now();
    let lastStep = 0;

    function step(now) {
      const t = Math.min(1, (now - startTime) / durationMs);
      // Smooth easeOutCubic
      const ease = 1 - Math.pow(1 - t, 3);
      childState.x = startX + (targetX - startX) * ease;
      childState.y = startY + (targetY - startY) * ease;
      childState.scale = startScale + (targetScale - startScale) * ease;
      childState.balloonScale = startBScale + (targetBalloonScale - startBScale) * ease;
      childState.walkPhase += 0.36;

      const grp = document.getElementById('active-child-group');
      const bAnchor = document.getElementById('giant-balloon-anchor');
      if (grp) {
        const bounceY = Math.abs(Math.sin(childState.walkPhase)) * -7 * (1 - t * 0.5);
        grp.setAttribute('transform', `translate(${childState.x}, ${childState.y + bounceY}) scale(${childState.scale})`);
        updateWalkingLimbs(grp, childState.walkPhase);
      }
      if (bAnchor) {
        bAnchor.setAttribute('transform', `translate(-80, -113) scale(${childState.balloonScale})`);
      }

      if (now - lastStep > 165 && t < 0.92) {
        playStepSound();
        lastStep = now;
      }

      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        const grpFinal = document.getElementById('active-child-group');
        if (grpFinal) {
          grpFinal.setAttribute('transform', `translate(${targetX}, ${targetY}) scale(${targetScale})`);
          resetLimbs(grpFinal);
        }
        if (bAnchor) {
          bAnchor.setAttribute('transform', `translate(-80, -113) scale(${targetBalloonScale})`);
        }
        if (onComplete) onComplete();
      }
    }
    requestAnimationFrame(step);
  }

  function spawnNextChild(immediate = false) {
    isBusy = true;
    currentWord = getNextWord();
    activeChildProfile = createCharacterProfile(charCounter++);

    // Walk in from right edge of the park promenade to the dedicated right-side waiting spot (1690, 775)
    childState.x = 2040;
    childState.y = 785;
    childState.scale = 1.15;
    childState.balloonScale = 1;

    activeChildLayer.innerHTML = buildActiveChildWithGiantBalloonSVG(activeChildProfile, currentWord);

    // Click on balloon plays gentle bounce & word pronunciation
    const balloonClick = document.getElementById('balloon-clickable');
    if (balloonClick) {
      balloonClick.addEventListener('click', (e) => {
        e.stopPropagation();
        speakCurrentWord(currentWord);
      });
    }

    playBalloonPopIn();

    const destX = 1690;
    const destY = 775;
    const dur = immediate ? 360 : 650;

    animateChildTo(destX, destY, 1.15, 1, dur, () => {
      isBusy = false;
    });
  }

  // ============================================================================
  // 5. PARTICLE & ACTIVE NON-VERBAL FEEDBACK ENGINE (Canvas 2D + SVG Animations)
  // ============================================================================
  const fxCanvas = document.getElementById('fx-canvas');
  const ctx = fxCanvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Convert SVG 1920x1080 coordinates to screen canvas coordinates
  function svgToScreen(svgX, svgY) {
    const rect = fxCanvas.getBoundingClientRect();
    const scale = Math.max(rect.width / 1920, rect.height / 1080);
    const offsetX = (rect.width - 1920 * scale) / 2;
    const offsetY = (rect.height - 1080 * scale) / 2;
    return {
      x: svgX * scale + offsetX,
      y: svgY * scale + offsetY
    };
  }

  function triggerCelebrationFX(svgX, svgY, styleIndex) {
    const origin = svgToScreen(svgX, svgY);
    const style = styleIndex % 5;
    const colors = ['#fde047', '#f43f5e', '#38bdf8', '#4ade80', '#c084fc', '#fb923c'];

    for (let i = 0; i < 68; i++) {
      const angle = (Math.PI * 2 * i) / 68 + (Math.random() - 0.5) * 0.3;
      const speed = 4 + Math.random() * 13;
      particles.push({
        x: origin.x,
        y: origin.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        gravity: style === 2 ? -0.05 : 0.24, // Bubbles float up, others arc
        size: 8 + Math.random() * 12,
        color: colors[i % colors.length],
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.22,
        alpha: 1,
        decay: 0.013 + Math.random() * 0.01,
        shape: ['confetti', 'star', 'bubble', 'note', 'petal'][style]
      });
    }
  }

  function triggerWrongPuffFX(svgX, svgY) {
    const origin = svgToScreen(svgX, svgY);
    for (let i = 0; i < 24; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      particles.push({
        x: origin.x,
        y: origin.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        gravity: -0.04,
        size: 10 + Math.random() * 14,
        color: i % 2 === 0 ? '#fda4af' : '#fde68a',
        rot: Math.random() * Math.PI,
        vRot: 0.08,
        alpha: 0.9,
        decay: 0.028,
        shape: 'puff'
      });
    }
  }

  function drawStar(c, x, y, r) {
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = (i * 72 - 90) * Math.PI / 180;
      const a2 = ((i * 72 + 36) - 90) * Math.PI / 180;
      if (i === 0) c.moveTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
      else c.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
      c.lineTo(x + Math.cos(a2) * (r * 0.45), y + Math.sin(a2) * (r * 0.45));
    }
    c.closePath();
    c.fill();
  }

  function updateAndRenderFX() {
    ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.rot += p.vRot;
      p.alpha -= p.decay;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = p.color;

      if (p.shape === 'confetti') {
        ctx.fillRect(-p.size * 0.6, -p.size * 0.35, p.size * 1.2, p.size * 0.7);
      } else if (p.shape === 'star') {
        drawStar(ctx, 0, 0, p.size);
      } else if (p.shape === 'bubble') {
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.85, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath();
        ctx.arc(-p.size * 0.28, -p.size * 0.28, p.size * 0.22, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === 'note') {
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 0.55, p.size * 0.4, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.size * 0.42, 0);
        ctx.lineTo(p.size * 0.42, -p.size * 1.3);
        ctx.lineTo(p.size * 0.95, -p.size * 1.05);
        ctx.stroke();
      } else if (p.shape === 'petal') {
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 0.8, p.size * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === 'puff') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(updateAndRenderFX);
  }
  requestAnimationFrame(updateAndRenderFX);

  // ============================================================================
  // 6. ANIMATED FLYING BIRDS IN SKY
  // ============================================================================
  const birdsLayer = document.getElementById('birds-layer');
  const birds = [
    { x: 220, y: 110, speed: 0.75, wingPhase: 0, scale: 0.75 },
    { x: 270, y: 135, speed: 0.78, wingPhase: 1.5, scale: 0.62 },
    { x: 1120, y: 85, speed: 0.65, wingPhase: 0.8, scale: 0.7 }
  ];

  function animateBackgroundLife() {
    let html = '';
    birds.forEach(b => {
      b.x += b.speed;
      if (b.x > 1980) b.x = -60;
      b.wingPhase += 0.14;
      const wingY = Math.sin(b.wingPhase) * 10;
      html += `
        <g transform="translate(${b.x.toFixed(1)}, ${b.y}) scale(${b.scale})">
          <path d="M-18,${wingY.toFixed(1)} Q-8,-6 0,0 Q8,-6 18,${wingY.toFixed(1)}"
                fill="none" stroke="#1e3a8a" stroke-width="3.2" stroke-linecap="round"/>
        </g>`;
    });
    birdsLayer.innerHTML = html;
    requestAnimationFrame(animateBackgroundLife);
  }
  requestAnimationFrame(animateBackgroundLife);

  // ============================================================================
  // 7. CHOICE HANDLING: JOIN BEGINNING OF QUEUE (LEFT) OR END OF QUEUE (RIGHT)
  // ============================================================================
  function animateQueueCelebration() {
    for (let i = 0; i < 4; i++) {
      const el = document.getElementById(`qchar-${i}`);
      if (el) {
        const inner = el.querySelector('.char-root');
        if (inner) {
          inner.classList.remove('celebrate-jump');
          void inner.offsetWidth;
          inner.classList.add('celebrate-jump');
        }
      }
    }
  }

  function shiftQueuePositionsSmoothly(joinedStart, newProfile, onDone) {
    newProfile.withSmallBalloon = true;
    const startPositions = [];

    if (joinedStart) {
      // Child joined at front (385). Insert at front, shift others right, remove last.
      queueCharacters.unshift(newProfile);
      queueCharacters.pop();
      startPositions.push(385, QUEUE_SLOTS[0].x, QUEUE_SLOTS[1].x, QUEUE_SLOTS[2].x);
    } else {
      // Child joined at back (1095). Remove first (got ice cream!), shift others left, append at end.
      queueCharacters.shift();
      queueCharacters.push(newProfile);
      startPositions.push(QUEUE_SLOTS[1].x, QUEUE_SLOTS[2].x, QUEUE_SLOTS[3].x, 1095);
    }

    renderQueueDOM();
    const t0 = performance.now();
    const dur = 480;

    function stepShift(now) {
      const p = Math.min(1, (now - t0) / dur);
      const ease = 1 - Math.pow(1 - p, 3);
      for (let i = 0; i < 4; i++) {
        const curX = startPositions[i] + (QUEUE_SLOTS[i].x - startPositions[i]) * ease;
        queueCharacters[i].x = curX;
        const el = document.getElementById(`qchar-${i}`);
        if (el) {
          el.setAttribute('transform', `translate(${curX}, ${QUEUE_SLOTS[i].y}) scale(${QUEUE_SLOTS[i].scale})`);
        }
      }
      if (p < 1) {
        requestAnimationFrame(stepShift);
      } else {
        if (onDone) onDone();
      }
    }
    requestAnimationFrame(stepShift);
  }

  function handleSpotChoice(chosenPosition) {
    if (isBusy || !currentWord) return;

    const spotCoords = chosenPosition === 'start'
      ? { x: 385, y: 685 }
      : { x: 1095, y: 685 };

    if (chosenPosition === currentWord.position) {
      // CORRECT CHOICE!
      isBusy = true;
      const styleIdx = celebrationIndex++;
      playSuccessSound(styleIdx);
      triggerCelebrationFX(spotCoords.x, spotCoords.y - 90, styleIdx);
      triggerCelebrationFX(childState.x - 210, childState.y - 310, styleIdx);
      animateQueueCelebration();

      // Walk the child to the chosen spot in the queue while the giant balloon smoothly scales down into a neat party balloon
      animateChildTo(spotCoords.x, spotCoords.y, 0.92, 0.24, 720, () => {
        triggerCelebrationFX(spotCoords.x, spotCoords.y - 120, (styleIdx + 1) % 5);
        activeChildLayer.innerHTML = '';
        shiftQueuePositionsSmoothly(chosenPosition === 'start', activeChildProfile, () => {
          spawnNextChild(false);
        });
      });
    } else {
      // WRONG CHOICE — Expressive non-verbal rubbery wobble + puff FX
      playWrongSound();
      triggerWrongPuffFX(spotCoords.x, spotCoords.y - 40);

      const grp = document.getElementById('active-child-figure');
      const balloonWrap = document.getElementById('giant-balloon-wrap');
      if (grp) {
        grp.classList.remove('wrong-shake');
        void grp.offsetWidth;
        grp.classList.add('wrong-shake');
      }
      if (balloonWrap) {
        balloonWrap.classList.remove('wrong-shake');
        void balloonWrap.offsetWidth;
        balloonWrap.classList.add('wrong-shake');
      }
    }
  }

  // Bind interactive spots and left/right queue zones
  document.getElementById('spot-start').addEventListener('click', () => handleSpotChoice('start'));
  document.getElementById('zone-start-hit').addEventListener('click', () => handleSpotChoice('start'));
  document.getElementById('spot-end').addEventListener('click', () => handleSpotChoice('end'));
  document.getElementById('zone-end-hit').addEventListener('click', () => handleSpotChoice('end'));

  // ============================================================================
  // 8. TOP-RIGHT HUD CONTROLS (Language УКР/РУС, Speak, Immediate Next "Далі")
  // ============================================================================
  const btnLang = document.getElementById('btn-lang');
  const langLabel = document.getElementById('lang-label');
  const btnSpeak = document.getElementById('btn-speak');
  const btnNext = document.getElementById('btn-next');

  btnLang.addEventListener('click', () => {
    currentLang = currentLang === 'uk' ? 'ru' : 'uk';
    langLabel.textContent = currentLang === 'uk' ? 'УКР' : 'РУС';
    playTone(520, 'triangle', 0.12, 0, 0.14, 740);
    speakCurrentWord(currentWord);
  });

  btnSpeak.addEventListener('click', () => {
    speakCurrentWord(currentWord);
  });

  // Minimalist "Next" button immediately transitions to the next child & balloon
  btnNext.addEventListener('click', () => {
    playTone(440, 'sine', 0.1, 0, 0.12, 660);
    spawnNextChild(true);
  });

  // Initialize queue and first child on load
  window.onload = () => {
    initQueue();
    spawnNextChild(true);
  };
})();
</script>
