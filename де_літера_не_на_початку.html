<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лісова Гра</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1a472a;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  }

  #game-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Living Forest Background */
  #bg-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Celebration Particle Canvas */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 30;
    pointer-events: none;
  }

  /* Top Hanging Sign Assembly */
  #sign-wrapper {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(260px, 31vw, 440px);
    height: 45vh;
    z-index: 15;
    pointer-events: none;
  }

  #sign-rig {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    transform-origin: 50% 0%;
    will-change: transform;
  }

  #chains-svg {
    position: absolute;
    top: -160px;
    left: 0;
    width: 100%;
    height: 240px;
    overflow: visible;
    pointer-events: none;
  }

  #plaque-svg {
    position: relative;
    width: 100%;
    height: auto;
    display: block;
    margin-top: 34px;
    filter: drop-shadow(0 16px 20px rgba(10, 30, 12, 0.55));
  }

  /* Pedestals Stage */
  #stage {
    position: absolute;
    bottom: clamp(22px, 5.5vh, 64px);
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 1340px);
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
    gap: clamp(12px, 3vw, 48px);
    z-index: 10;
  }

  .pedestal-slot {
    position: relative;
    flex: 1 1 0;
    max-width: clamp(210px, 26vw, 370px);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    outline: none;
  }

  .pedestal-slot:hover .item-stage {
    transform: translateY(-10px) scale(1.045);
    filter: drop-shadow(0 18px 18px rgba(255, 224, 102, 0.45));
  }

  .pedestal-slot:active .item-stage {
    transform: translateY(-2px) scale(0.97);
  }

  .item-aura {
    position: absolute;
    bottom: 26%;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    width: 92%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 240, 130, 0.85) 0%, rgba(255, 195, 50, 0.35) 45%, rgba(255, 180, 0, 0) 72%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.4s ease;
    z-index: 1;
  }

  .pedestal-slot.correct-glow .item-aura {
    opacity: 1;
    transform: translateX(-50%) scale(1.22);
    animation: auraPulse 0.9s ease-in-out infinite alternate;
  }

  .item-stage {
    position: relative;
    width: 84%;
    aspect-ratio: 1 / 1;
    margin-bottom: -17%;
    z-index: 4;
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.28s ease;
    filter: drop-shadow(0 10px 10px rgba(15, 35, 15, 0.38));
    will-change: transform;
  }

  .item-stage svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: idleFloat 3.6s ease-in-out infinite;
  }

  .pedestal-slot:nth-child(2) .item-stage svg { animation-delay: -1.2s; }
  .pedestal-slot:nth-child(3) .item-stage svg { animation-delay: -2.4s; }

  .pedestal-base {
    position: relative;
    width: 100%;
    height: auto;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 12px 14px rgba(12, 32, 10, 0.48));
  }

  /* Animations for Items */
  .item-enter {
    animation: popInItem 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .item-exit {
    animation: popOutItem 0.32s ease-in forwards;
  }

  .wrong-wobble .item-stage {
    animation: playfulWobble 0.56s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
  }

  .correct-jump .item-stage {
    animation: joyfulJump 0.85s cubic-bezier(0.28, 0.84, 0.42, 1) infinite !important;
  }

  /* Top-Right Language Toggle Button */
  #lang-btn {
    position: absolute;
    top: clamp(14px, 2.4vh, 26px);
    right: clamp(14px, 2.2vw, 30px);
    z-index: 40;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    width: clamp(86px, 8.2vw, 118px);
    height: clamp(46px, 4.8vw, 64px);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    filter: drop-shadow(0 6px 10px rgba(10, 28, 10, 0.48));
  }

  #lang-btn:hover {
    transform: scale(1.07) rotate(-1.5deg);
    filter: drop-shadow(0 8px 14px rgba(255, 220, 110, 0.35));
  }

  #lang-btn:active {
    transform: scale(0.94);
  }

  /* Bottom-Right Minimalist Next Button */
  #next-btn {
    position: absolute;
    bottom: clamp(14px, 2.6vh, 28px);
    right: clamp(14px, 2.2vw, 30px);
    z-index: 40;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    width: clamp(84px, 7.6vw, 112px);
    height: clamp(84px, 7.6vw, 112px);
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
    filter: drop-shadow(0 8px 12px rgba(10, 30, 10, 0.5));
  }

  #next-btn:hover {
    transform: scale(1.09) rotate(3deg);
    filter: drop-shadow(0 10px 18px rgba(255, 200, 60, 0.45));
  }

  #next-btn:active {
    transform: scale(0.93);
  }

  /* Living Background Keyframes */
  @keyframes swaySlow {
    0%, 100% { transform: rotate(-1.6deg); }
    50% { transform: rotate(1.8deg); }
  }
  @keyframes swayFast {
    0%, 100% { transform: rotate(-3.5deg); }
    50% { transform: rotate(3.5deg); }
  }
  @keyframes swingGentle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }
  @keyframes cloudDrift {
    0% { transform: translateX(-140px); }
    100% { transform: translateX(1740px); }
  }
  @keyframes sunPulse {
    0%, 100% { opacity: 0.26; }
    50% { opacity: 0.44; }
  }
  @keyframes idleFloat {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-4px) scale(1.015); }
  }
  @keyframes blinkEye {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.08); }
  }
  @keyframes playfulWobble {
    0% { transform: translateX(0) rotate(0deg) scale(1); }
    18% { transform: translateX(-14px) rotate(-9deg) scale(1.04, 0.96); }
    38% { transform: translateX(13px) rotate(8deg) scale(0.96, 1.04); }
    58% { transform: translateX(-9px) rotate(-5deg) scale(1.02, 0.98); }
    78% { transform: translateX(6px) rotate(3deg) scale(0.99, 1.01); }
    100% { transform: translateX(0) rotate(0deg) scale(1); }
  }
  @keyframes joyfulJump {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    15% { transform: translateY(6px) scale(1.1, 0.88); }
    48% { transform: translateY(-34px) scale(0.94, 1.08) rotate(-3deg); }
    62% { transform: translateY(-32px) scale(0.96, 1.06) rotate(3deg); }
    85% { transform: translateY(3px) scale(1.05, 0.94); }
  }
  @keyframes auraPulse {
    0% { transform: translateX(-50%) scale(1.12); opacity: 0.85; }
    100% { transform: translateX(-50%) scale(1.3); opacity: 1; }
  }
  @keyframes popInItem {
    0% { transform: translateY(28px) scale(0.3); opacity: 0; }
    70% { transform: translateY(-8px) scale(1.06); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes popOutItem {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.4) translateY(20px); opacity: 0; }
  }

  .sway-tree { transform-origin: bottom center; animation: swaySlow 6.5s ease-in-out infinite; }
  .sway-flower { transform-origin: bottom center; animation: swayFast 3.8s ease-in-out infinite; }
  .tree-swing { transform-origin: 1272px 472px; animation: swingGentle 4.8s ease-in-out infinite; }
  .sun-beam { animation: sunPulse 7s ease-in-out infinite; }
  .blink-eye { transform-box: fill-box; transform-origin: center; animation: blinkEye 4.2s infinite; }

  @media (max-aspect-ratio: 4/3) {
    #sign-wrapper { width: clamp(230px, 44vw, 380px); }
    #stage { bottom: 9vh; width: 96vw; gap: 10px; }
  }
</style>
</head>
<body>

<div id="game-root">
  <!-- GLOBAL SHARED SVG DEFS FOR REALISTIC SHADING & TEXTURES -->
  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>

        <stop offset="55%" stop-color="#d49e62"/>
        <stop offset="100%" stop-color="#8c5827"/>
      </radialGradient>
      <radialGradient id="gCream" cx="35%" cy="30%" r="72%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="60%" stop-color="#f2e4cc"/>
        <stop offset="100%" stop-color="#c9b291"/>
      </radialGradient>
      <radialGradient id="gGrey" cx="34%" cy="28%" r="72%">

        <stop offset="78%" stop-color="#5c3114"/>
        <stop offset="100%" stop-color="#381b09"/>

    <rect width="1600" height="900" fill="url(#skyGrad)"/>
    <rect width="1600" height="900" fill="url(#sunHalo)"/>

    <!-- Drifting Soft Clouds -->
    <g style="animation: cloudDrift 72s linear infinite;" opacity="0.72">
      <path d="M0 130 Q30 95 75 105 Q105 70 155 95 Q195 92 210 130 Z" fill="#ffffff"/>
    </g>
    <g style="animation: cloudDrift 96s linear infinite; animation-delay: -38s;" opacity="0.62">
      <path d="M0 190 Q40 155 92 168 Q128 135 182 158 Q230 155 250 190 Z" fill="#ffffff"/>
    </g>

    <!-- Distant Forest Silhouette & Hills -->
    <path d="M0 520 Q260 400 580 465 T1220 440 T1600 490 L1600 900 L0 900 Z" fill="url(#hillFar)"/>

      <g stroke="#7a4218" stroke-width="1.5" opacity="0.65">

      <!-- Warm Glowing Window & Door -->
      <rect x="1314" y="352" width="38" height="68" rx="18" fill="#633210" stroke="#3d1b06" stroke-width="2.5"/>

<script>
(() => {
  'use strict';

  /* =========================================================================
     1. WEB AUDIO API SOUND SYNTHESIZER (NO EXTERNAL AUDIO FILES)
     ========================================================================= */
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    }

    playChainDrop() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      // Sequence of metallic chain clinks
      const clinkTimes = [0.02, 0.09, 0.17, 0.26, 0.36, 0.48];
      clinkTimes.forEach((t, idx) => {
        const osc = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc2.type = 'sine';
        const baseFreq = 1650 + (idx % 3) * 340 + Math.random() * 180;
        osc.frequency.setValueAtTime(baseFreq, now + t);
        osc2.frequency.setValueAtTime(baseFreq * 1.47, now + t);
        gain.gain.setValueAtTime(0.0001, now + t);
        gain.gain.linearRampToValueAtTime(0.065, now + t + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.085);
        osc.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + t);
        osc2.start(now + t);
        osc.stop(now + t + 0.095);
        osc2.stop(now + t + 0.095);
      });
      // Warm wooden settle thud
      const thud = this.ctx.createOscillator();
      const tGain = this.ctx.createGain();
      thud.type = 'sine';
      thud.frequency.setValueAtTime(145, now + 0.34);
      thud.frequency.exponentialRampToValueAtTime(52, now + 0.48);
      tGain.gain.setValueAtTime(0.0001, now + 0.34);
      tGain.gain.linearRampToValueAtTime(0.11, now + 0.355);
      tGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      thud.connect(tGain);
      tGain.connect(this.ctx.destination);
      thud.start(now + 0.34);
      thud.stop(now + 0.52);
    }

    playChainLift() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [0, 0.07, 0.14, 0.21].forEach((t, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1900 + i * 240, now + t);
        gain.gain.setValueAtTime(0.045, now + t);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.065);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + t);
        osc.stop(now + t + 0.075);
      });
    }

    playBoing() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.exponentialRampToValueAtTime(340, now + 0.09);
      osc.frequency.exponentialRampToValueAtTime(165, now + 0.22);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.34);
      osc.frequency.exponentialRampToValueAtTime(145, now + 0.46);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.16, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    }

    playWoodClick() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.07);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    }

    playCelebration(variant) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const melodies = [
        // Bright Xylophone Fanfare
        [523.25, 659.25, 783.99, 1046.5, 1318.5],
        // Fairy Harp Glissando
        [587.33, 739.99, 880.0, 1174.66, 1479.98, 1760.0],
        // Playful Marimba Bounce
        [440.0, 554.37, 659.25, 880.0, 659.25, 1108.73],
        // Joyful Bell Chimes
        [523.25, 587.33, 659.25, 783.99, 1046.5, 1567.98]
      ];
      const notes = melodies[variant % melodies.length];
      const step = variant % 2 === 0 ? 0.095 : 0.075;

      notes.forEach((freq, i) => {
        const t = now + i * step;
        const osc = this.ctx.createOscillator();
        const overtone = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = variant % 2 === 0 ? 'sine' : 'triangle';
        overtone.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        overtone.frequency.setValueAtTime(freq * 2, t);

        const vol = i === notes.length - 1 ? 0.16 : 0.12;
        const dur = i === notes.length - 1 ? 0.65 : 0.28;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        const overGain = this.ctx.createGain();
        overGain.gain.setValueAtTime(0.32, t);
        overtone.connect(overGain);
        overGain.connect(gain);
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(t);
        overtone.start(t);
        osc.stop(t + dur + 0.05);
        overtone.stop(t + dur + 0.05);
      });
    }
  }

  const sound = new SoundEngine();

        <circle cx="38" cy="102" r="5" fill="#fff"/><circle cx="38" cy="102" r="2.2" fill="#ffcc29"/>
        <circle cx="62" cy="112" r="4.5" fill="#ff94b8"/><circle cx="62" cy="112" r="2" fill="#ffe14d"/>

        <circle cx="216" cy="114" r="4.5" fill="#ffe14d"/><circle cx="216" cy="114" r="1.8" fill="#ff7b29"/>
        <circle cx="140" cy="118" r="4.5" fill="#fff"/><circle cx="140" cy="118" r="2" fill="#ffcc29"/>
      </g>
    `;
  }

  /* =========================================================================

  /* =========================================================================
     5. CELEBRATION FX ENGINE (FIREWORKS, PETALS, BUTTERFLIES, SPARKLES)
     ========================================================================= */
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');
  let particles = [];

  function resizeFx() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeFx);
  resizeFx();

  function spawnCelebrationFX(originX, originY, variant) {
    const colors = ['#ffe14d', '#ff6b9e', '#5ce65c', '#4dc3ff', '#ff9436', '#d178ff', '#ffffff'];
    // Golden spark fireworks
    for (let i = 0; i < 42; i++) {
      const angle = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.25;
      const speed = 3 + Math.random() * 8.5;
      particles.push({
        type: variant % 3 === 1 ? 'petal' : 'spark',
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.2,
        size: 5 + Math.random() * 8,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.22,
        alpha: 1,
        decay: 0.011 + Math.random() * 0.008
      });
    }
    // Bursting Celebration Butterflies
    for (let i = 0; i < 6; i++) {
      const angle = -Math.PI * 0.15 - Math.random() * Math.PI * 0.7;
      particles.push({
        type: 'butterfly',
        x: originX + (Math.random() - 0.5) * 60,
        y: originY + (Math.random() - 0.5) * 30,
        vx: Math.cos(angle) * (2.5 + Math.random() * 3.5),
        vy: Math.sin(angle) * (2.5 + Math.random() * 3.5) - 1,
        size: 10 + Math.random() * 6,
        color: colors[i % 5],
        phase: Math.random() * 10,
        alpha: 1,
        decay: 0.0085
      });
    }
    // Expanding Golden Ring
    particles.push({
      type: 'ring',
      x: originX,
      y: originY,
      radius: 18,
      maxRadius: 190,
      color: '#ffe866',
      alpha: 0.95,
      decay: 0.025
    });
  }

  function updateAndDrawFX() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.alpha -= p.decay;
      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.alpha);

      if (p.type === 'ring') {
        p.radius += (p.maxRadius - p.radius) * 0.12;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        fxCtx.strokeStyle = p.color;
        fxCtx.lineWidth = 6 * p.alpha;
        fxCtx.stroke();
      } else if (p.type === 'spark') {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.16;
        p.vx *= 0.985;
        p.rot += p.vrot;
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        for (let s = 0; s < 5; s++) {
          const a = (s * Math.PI * 2) / 5;
          const r1 = p.size;
          const r2 = p.size * 0.42;
          fxCtx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
          fxCtx.lineTo(Math.cos(a + Math.PI / 5) * r2, Math.sin(a + Math.PI / 5) * r2);
        }
        fxCtx.closePath();
        fxCtx.fill();
      } else if (p.type === 'petal') {
        p.x += p.vx + Math.sin(p.rot * 2) * 0.8;
        p.y += p.vy;
        p.vy += 0.08;
        p.vx *= 0.98;
        p.rot += p.vrot;
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size, p.size * 0.52, 0, 0, Math.PI * 2);
        fxCtx.fill();
      } else if (p.type === 'butterfly') {
        p.phase += 0.35;
        p.x += p.vx + Math.sin(p.phase * 0.5) * 1.4;
        p.y += p.vy + Math.cos(p.phase * 0.4) * 0.9;
        const flap = 0.35 + Math.abs(Math.sin(p.phase)) * 0.75;
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.ellipse(-p.size * 0.6 * flap, -2, p.size * 0.65 * flap, p.size * 0.48, -0.3, 0, Math.PI * 2);
        fxCtx.ellipse(p.size * 0.6 * flap, -2, p.size * 0.65 * flap, p.size * 0.48, 0.3, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }
  }

  /* =========================================================================
     6. AMBIENT LIVING BUTTERFLIES IN BACKGROUND SVG
     ========================================================================= */
  const ambientGroup = document.getElementById('ambient-butterflies');
  const ambientButterflies = [
    { x: 260, y: 310, phase: 0, speed: 0.012, rx: 140, ry: 65, color: '#ff94c2' },
    { x: 1180, y: 260, phase: 2.2, speed: 0.01, rx: 165, ry: 75, color: '#ffe14d' },
    { x: 760, y: 490, phase: 4.1, speed: 0.014, rx: 190, ry: 55, color: '#7ad7ff' }
  ];

  ambientButterflies.forEach((b) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.innerHTML = `
      <ellipse class="wL" cx="-9" cy="0" rx="10" ry="7" fill="${b.color}" opacity="0.9"/>
      <ellipse class="wR" cx="9" cy="0" rx="10" ry="7" fill="${b.color}" opacity="0.9"/>
      <ellipse cx="0" cy="0" rx="2.2" ry="7" fill="#3a2310"/>
    `;
    ambientGroup.appendChild(g);
    b.el = g;
    b.wL = g.querySelector('.wL');
    b.wR = g.querySelector('.wR');
  });

  function updateAmbientButterflies(t) {
    ambientButterflies.forEach((b) => {
      const a = t * b.speed + b.phase;
      const cx = b.x + Math.cos(a) * b.rx;
      const cy = b.y + Math.sin(a * 1.6) * b.ry;
      const dx = -Math.sin(a) * b.rx;
      const flap = 0.28 + Math.abs(Math.sin(t * 0.26 + b.phase)) * 0.72;
      b.el.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)}) rotate(${dx > 0 ? 12 : -12})`);
      b.wL.setAttribute('rx', (10 * flap).toFixed(1));
      b.wR.setAttribute('rx', (10 * flap).toFixed(1));
    });
  }

  /* =========================================================================
     7. CHAIN & SIGN PENDULUM / SPRING DROP PHYSICS
     ========================================================================= */
  const signRig = document.getElementById('sign-rig');
  const signPhysics = {
    y: -260,
    vy: 0,
    targetY: 0,
    angle: 0,
    vAngle: 0
  };

  function dropSign() {
    signPhysics.y = -270;
    signPhysics.vy = 4;
    signPhysics.targetY = 0;
    signPhysics.angle = (Math.random() > 0.5 ? 1 : -1) * 7.5;
    signPhysics.vAngle = 0;
    sound.playChainDrop();
  }

  function liftSign() {
    signPhysics.targetY = -280;
    sound.playChainLift();
  }

  function updateSignPhysics(t) {
    // Vertical spring with realistic damped bounce
    const forceY = (signPhysics.targetY - signPhysics.y) * 0.115;
    signPhysics.vy = (signPhysics.vy + forceY) * 0.78;
    signPhysics.y += signPhysics.vy;

    // Pendulum sway + subtle forest breeze
    const breeze = Math.sin(t * 0.022) * 0.75;
    const forceA = (breeze - signPhysics.angle) * 0.045;
    signPhysics.vAngle = (signPhysics.vAngle + forceA) * 0.91;
    signPhysics.angle += signPhysics.vAngle;

    signRig.style.transform = `translate3d(0, ${signPhysics.y.toFixed(2)}px, 0) rotate(${signPhysics.angle.toFixed(2)}deg)`;
  }

  /* =========================================================================
     8. CORE GAME STATE & INFINITE SHUFFLE GENERATOR
     ========================================================================= */
  let currentLang = 'uk';
  let deckQueue = [];
  let lastLetter = null;
  let currentRound = null;
  let isTransitioning = false;
  let celebrationCount = 0;

  const letterShadow = document.getElementById('sign-letter-shadow');
  const letterExtrude = document.getElementById('sign-letter-extrude');
  const letterMain = document.getElementById('sign-letter-main');
  const langLabel = document.getElementById('lang-label');
  const nextLabel = document.getElementById('next-label');
  const slots = Array.from(document.querySelectorAll('.pedestal-slot'));

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function nextFromDeck() {
    if (deckQueue.length === 0) {
      deckQueue = shuffleArray(DECKS[currentLang]);
      // Prevent immediate repeat across deck boundary
      if (lastLetter && deckQueue[0].letter === lastLetter && deckQueue.length > 1) {
        const swapIdx = 1 + Math.floor(Math.random() * (deckQueue.length - 1));
        [deckQueue[0], deckQueue[swapIdx]] = [deckQueue[swapIdx], deckQueue[0]];
      }
    }
    const entry = deckQueue.shift();
    lastLetter = entry.letter;
    return entry;
  }

  function renderLetter(ch) {
    letterShadow.textContent = ch;
    letterExtrude.textContent = ch;
    letterMain.textContent = ch;
  }

  function loadRound(immediate = false) {
    isTransitioning = false;
    const entry = nextFromDeck();
    renderLetter(entry.letter);

    // Build randomized 3-slot layout
    const items = shuffleArray([
      { id: entry.starts[0], isOdd: false },
      { id: entry.starts[1], isOdd: false },
      { id: entry.odd, isOdd: true }
    ]);
    currentRound = { entry, items };

    slots.forEach((slot, idx) => {
      slot.classList.remove('correct-jump', 'correct-glow', 'wrong-wobble');
      const container = document.getElementById(`item-${idx}`);
      container.classList.remove('item-exit', 'item-enter');
      void container.offsetWidth; // trigger reflow for clean animation
      const artFn = ART[items[idx].id];
      container.innerHTML = `<svg viewBox="0 0 200 200">${artFn ? artFn() : ''}</svg>`;
      container.classList.add('item-enter');
    });

    if (immediate) {
      signPhysics.y = -240;
      signPhysics.targetY = 0;
      signPhysics.angle = 5;
    } else {
      dropSign();
    }
  }

  function transitionToNextRound() {
    if (isTransitioning) return;
    isTransitioning = true;
    liftSign();
    slots.forEach((_, idx) => {
      const container = document.getElementById(`item-${idx}`);
      container.classList.remove('item-enter');
      container.classList.add('item-exit');
    });
    setTimeout(() => {
      loadRound(false);
    }, 340);
  }

  // Handle Pedestal Click / Tap
  slots.forEach((slot, idx) => {
    slot.addEventListener('click', () => {
      if (isTransitioning || !currentRound) return;
      sound.init();
      const chosen = currentRound.items[idx];

      if (chosen.isOdd) {
        // CORRECT ANSWER: Rich, varied non-verbal celebration!
        isTransitioning = true;
        celebrationCount++;
        slot.classList.add('correct-jump', 'correct-glow');

        const rect = slot.getBoundingClientRect();
        spawnCelebrationFX(rect.left + rect.width / 2, rect.top + rect.height * 0.42, celebrationCount);
        sound.playCelebration(celebrationCount);

        setTimeout(() => {
          liftSign();
          slots.forEach((_, sIdx) => {
            const c = document.getElementById(`item-${sIdx}`);
            c.classList.remove('item-enter');
            c.classList.add('item-exit');
          });
          setTimeout(() => {
            loadRound(false);
          }, 360);
        }, 1280);
      } else {
        // WRONG ANSWER: Playful gentle wobble + soft comical boing
        slot.classList.remove('wrong-wobble');
        void slot.offsetWidth;
        slot.classList.add('wrong-wobble');
        sound.playBoing();
      }
    });
  });

  // Top-Right Language Toggle ("УКР" / "РУС")
  document.getElementById('lang-btn').addEventListener('click', () => {
    sound.playWoodClick();
    currentLang = currentLang === 'uk' ? 'ru' : 'uk';
    langLabel.textContent = currentLang === 'uk' ? 'УКР' : 'РУС';
    nextLabel.textContent = currentLang === 'uk' ? 'Далі' : 'Далее';
    deckQueue = [];
    lastLetter = null;
    if (!isTransitioning) {
      transitionToNextRound();
    } else {
      isTransitioning = false;
      loadRound(false);
    }
  });

  // Bottom-Right Minimalist Next Button ("Далі" / "Далее")
  document.getElementById('next-btn').addEventListener('click', () => {
    sound.playWoodClick();
    if (isTransitioning) {
      isTransitioning = false;
      loadRound(false);
    } else {
      transitionToNextRound();
    }
  });

  /* =========================================================================
     9. MAIN 60FPS ANIMATION LOOP
     ========================================================================= */
  let tick = 0;
  function animate() {
    tick++;
    updateSignPhysics(tick);
    updateAmbientButterflies(tick);
    updateAndDrawFX();
    requestAnimationFrame(animate);
  }

  window.onload = () => {
    loadRound(true);
    animate();
  };
})();
</script>
</body>
</html>
