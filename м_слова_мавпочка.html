<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лісова Переправа на М</title>
<style>
  :root {
    --wood-dark: #3e2415;
    --wood-mid: #6b3e23;
    --wood-light: #9c6339;
    --gold-warm: #f7c948;
    --moss-bright: #68b836;
    --moss-deep: #2f6b18;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0d3842;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }

  #game-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, #1b5c69 0%, #144957 35%, #0e3845 75%, #092933 100%);
  }

  /* Animated river canvas layer */
  #river-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Left & Right Riverbanks SVG layer */
  #scenery-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* Wooden Bridges SVG Layer connecting stepped stones */
  #trail-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
  }

  /* Grid of Stepping Stones (5 rows x 7 columns for crisp orthogonal alignment) */
  #stones-container {
    position: absolute;
    left: 11vw;
    right: 11vw;
    top: 8.5vh;
    bottom: 5.5vh;
    z-index: 4;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 0.7vw 0.9vw;
    align-items: center;
    justify-items: center;
  }

  /* Individual River Stone */
  .river-stone {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 10.8vw;
    max-height: 16.5vh;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.24s ease;
    transform-origin: center center;
  }

  .river-stone:hover {
    transform: translateY(-3px) scale(1.04);
    filter: brightness(1.06) drop-shadow(0 8px 12px rgba(0, 20, 28, 0.55));
  }

  .river-stone.ortho-neighbor:hover {
    transform: translateY(-5px) scale(1.07);
    filter: brightness(1.12) drop-shadow(0 0 12px rgba(255, 230, 120, 0.65));
  }

  .river-stone:active {
    transform: translateY(2px) scale(0.96);
  }

  .stone-base-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  /* Subtle orthogonal reachability ring */
  .river-stone.ortho-pulse .hint-ring {
    opacity: 0.95;
    stroke: #ffe46b;
    animation: pulseRipple 0.65s ease-in-out 2;
  }

  .river-stone.next-hint .hint-ring {
    opacity: 0.85;
    stroke: #a6ff78;
    animation: pulseRipple 1.8s infinite ease-in-out;
  }

  .hint-ring {
    opacity: 0;
    transform-origin: center;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  @keyframes pulseRipple {
    0% { transform: scale(0.92); opacity: 0.85; }
    50% { transform: scale(1.07); opacity: 0.35; }
    100% { transform: scale(0.92); opacity: 0.85; }
  }

  /* Illustration inside stone */
  .stone-art {
    position: relative;
    width: 68%;
    height: 70%;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 4px 5px rgba(15, 23, 30, 0.42));
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .river-stone:hover .stone-art {
    transform: scale(1.08);
  }

  /* Stepped / Activated M Stone */
  .river-stone.stepped {
    cursor: default;
    filter: drop-shadow(0 0 12px rgba(154, 242, 92, 0.5));
  }

  .river-stone.stepped .moss-rim {
    opacity: 1 !important;
  }

  .river-stone.stepped .stone-lotus {
    opacity: 1 !important;
    transform: translate(94px, 22px) scale(1) !important;
  }

  /* Wrong Shake & Sink Animation */
  .river-stone.wrong-sink {
    animation: sinkWobble 0.68s cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }

  /* Out-of-range / Diagonal nudge animation */
  .river-stone.diagonal-deny {
    animation: diagonalDeny 0.42s ease-in-out;
  }

  @keyframes sinkWobble {
    0% { transform: translate(0, 0) rotate(0deg) scale(1); }
    18% { transform: translate(-7px, 8px) rotate(-6deg) scale(0.9); filter: brightness(0.75) sepia(0.3); }
    36% { transform: translate(7px, 11px) rotate(5deg) scale(0.87); }
    55% { transform: translate(-5px, 7px) rotate(-4deg) scale(0.92); }
    75% { transform: translate(3px, 4px) rotate(2deg) scale(0.96); }
    100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  }

  @keyframes diagonalDeny {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(0.93); filter: brightness(0.85); }
    65% { transform: scale(1.03); }
  }

  /* Bridge Plank Pop-in Animation */
  .bridge-plank-anim {
    transform-box: fill-box;
    transform-origin: center;
    animation: plankPopIn 0.26s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes plankPopIn {
    0% { transform: scale(0.2); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Optional Carved Wooden Nameplate (when reading caption is toggled on) */
  .word-plaque {
    position: absolute;
    bottom: 1%;
    left: 50%;
    transform: translateX(-50%) scale(0.85);
    background: linear-gradient(180deg, #5c3419 0%, #3d200d 100%);
    border: 2px solid #b57c43;
    border-radius: 12px;
    padding: 1px 8px 2px;
    color: #fff3d6;
    font-size: clamp(10px, 0.95vw, 15px);
    font-weight: 800;
    letter-spacing: 0.4px;
    white-space: nowrap;
    box-shadow: 0 3px 6px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,220,160,0.35);
    z-index: 6;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  body.show-words .word-plaque {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  .word-plaque .hl-m {
    color: #ffd84d;
    text-shadow: 0 0 6px rgba(255, 200, 30, 0.7);
    text-decoration: underline;
  }

  /* Articulated Realistic Monkey Character Container */
  #character-wrapper {
    position: absolute;
    width: 7.4vw;
    height: 7.4vw;
    min-width: 74px;
    min-height: 74px;
    max-width: 124px;
    max-height: 124px;
    z-index: 12;
    pointer-events: none;
    transform: translate(-50%, -68%);
    will-change: left, top, transform;
    filter: drop-shadow(0 10px 10px rgba(0, 15, 22, 0.55));
  }

  #monkey-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Idle breathing & tail sway for Monkey */
  #monkey-body-group {
    transform-origin: 50px 68px;
    animation: monkeyBreathe 2.3s infinite ease-in-out;
  }

  #monkey-tail {
    transform-origin: 36px 70px;
    animation: monkeyTailSway 2.1s infinite ease-in-out;
  }

  #monkey-ear-l {
    transform-origin: 27px 39px;
    animation: earTwitchL 4.2s infinite ease-in-out;
  }

  #monkey-ear-r {
    transform-origin: 73px 39px;
    animation: earTwitchR 4.9s infinite ease-in-out;
  }

  #monkey-arm-l {
    transform-origin: 35px 55px;
    animation: armSwingL 2.3s infinite ease-in-out;
  }

  #monkey-arm-r {
    transform-origin: 65px 55px;
    animation: armSwingR 2.3s infinite ease-in-out;
  }

  .monkey-eyelid {
    transform-origin: center;
    animation: eyeBlink 4.4s infinite;
  }

  @keyframes monkeyBreathe {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50% { transform: scaleY(1.04) translateY(-2px); }
  }

  @keyframes monkeyTailSway {
    0%, 100% { transform: rotate(-9deg); }
    50% { transform: rotate(14deg); }
  }

  @keyframes armSwingL {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(6deg); }
  }

  @keyframes armSwingR {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-6deg); }
  }

  @keyframes earTwitchL {
    0%, 88%, 100% { transform: rotate(0deg); }
    92% { transform: rotate(-10deg); }
    96% { transform: rotate(4deg); }
  }

  @keyframes earTwitchR {
    0%, 84%, 100% { transform: rotate(0deg); }
    89% { transform: rotate(11deg); }
    94% { transform: rotate(-4deg); }
  }

  @keyframes eyeBlink {
    0%, 94%, 100% { transform: scaleY(0.01); opacity: 0; }
    96%, 98% { transform: scaleY(1); opacity: 1; }
  }

  /* Monkey Headshake on Wrong Click */
  #character-wrapper.monkey-no #monkey-head {
    transform-origin: 50px 38px;
    animation: monkeyHeadNo 0.58s ease-in-out;
  }

  @keyframes monkeyHeadNo {
    0%, 100% { transform: rotate(0deg) translateX(0); }
    20% { transform: rotate(-15deg) translateX(-4px); }
    40% { transform: rotate(15deg) translateX(4px); }
    60% { transform: rotate(-11deg) translateX(-3px); }
    80% { transform: rotate(9deg) translateX(2px); }
  }

  /* Top-Right Natural Wooden Control Medallions */
  #controls-hud {
    position: absolute;
    top: 1.2vh;
    right: 1.4vw;
    z-index: 25;
    display: flex;
    align-items: center;
    gap: 0.65vw;
  }

  .wood-btn {
    position: relative;
    height: clamp(38px, 5.4vh, 52px);
    min-width: clamp(42px, 5.8vh, 58px);
    padding: 0 13px;
    border: none;
    border-radius: 28px;
    background: radial-gradient(circle at 30% 25%, #8f562e 0%, #5e3416 65%, #3d200b 100%);
    box-shadow:
      0 5px 12px rgba(0, 18, 24, 0.65),
      inset 0 2px 3px rgba(255, 222, 173, 0.45),
      inset 0 -3px 5px rgba(28, 12, 4, 0.75);
    border: 2.5px solid #b87b44;
    color: #ffefd0;
    font-weight: 900;
    font-size: clamp(12px, 1.15vw, 17px);
    letter-spacing: 0.8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease, border-color 0.2s ease;
  }

  .wood-btn:hover {
    transform: translateY(-2px) scale(1.05);
    filter: brightness(1.12);
    border-color: #f3be69;
  }

  .wood-btn:active {
    transform: translateY(2px) scale(0.95);
  }

  .wood-btn.active-toggle {
    background: radial-gradient(circle at 30% 25%, #5c9e31 0%, #376e18 70%, #22470d 100%);
    border-color: #a9f069;
    color: #ffffff;
  }

  .wood-btn svg {
    width: clamp(19px, 2.4vh, 25px);
    height: clamp(19px, 2.4vh, 25px);
    overflow: visible;
  }

  /* Celebration Overlay Canvas */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="game-viewport">
  <!-- Animated Water & Koi Fish Canvas -->
  <canvas id="river-canvas"></canvas>

  <!-- Riverbanks, Starting Dock (Left) & Banana Island Dock (Right) -->
  <svg id="scenery-layer" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
      <linearGradient id="bankLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1e4d1b"/>
        <stop offset="55%" stop-color="#357228"/>
        <stop offset="85%" stop-color="#598f36"/>
        <stop offset="100%" stop-color="#7ca352"/>
      </linearGradient>
      <linearGradient id="bankRightGrad" x1="100%" y1="0%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#1e4d1b"/>
        <stop offset="55%" stop-color="#357228"/>
        <stop offset="85%" stop-color="#598f36"/>
        <stop offset="100%" stop-color="#7ca352"/>
      </linearGradient>
      <linearGradient id="dockWood" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#9e6034"/>
        <stop offset="50%" stop-color="#73411e"/>
        <stop offset="100%" stop-color="#4a260e"/>
      </linearGradient>
      <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff6a9" stop-opacity="1"/>
        <stop offset="45%" stop-color="#ffae2b" stop-opacity="0.65"/>
        <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
      </radialGradient>
      <filter id="bankShadow" x="-20%" y="-10%" width="140%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#051c24" flood-opacity="0.65"/>
      </filter>
    </defs>

    <!-- Left Riverbank Contour -->
    <g filter="url(#bankShadow)">
      <path d="M-20,-20 L205,-20 C225,160 175,320 198,520 C215,700 165,890 198,1100 L-20,1100 Z" fill="#c2a167" opacity="0.45"/>
      <path d="M-20,-20 L185,-20 C205,160 155,320 178,520 C195,700 145,890 178,1100 L-20,1100 Z" fill="url(#bankLeftGrad)"/>
      <!-- Jungle palms & foliage along left bank -->
      <ellipse cx="125" cy="110" rx="52" ry="38" fill="#46852d"/>
      <ellipse cx="95" cy="290" rx="58" ry="42" fill="#2e631d"/>
      <ellipse cx="130" cy="820" rx="56" ry="40" fill="#3d7826"/>
      <ellipse cx="95" cy="960" rx="66" ry="48" fill="#295919"/>

      <!-- Left Starting Wooden Pier / Dock (Dynamically positioned vertically to match start row) -->
      <g id="start-dock" transform="translate(22, 465)">
        <rect x="132" y="12" width="18" height="125" rx="6" fill="#2b1608"/>
        <rect x="0" y="22" width="152" height="86" rx="10" fill="#3a1d0a"/>
        <rect x="8" y="16" width="25" height="98" rx="5" fill="url(#dockWood)" stroke="#2b1406" stroke-width="2"/>
        <rect x="37" y="14" width="25" height="102" rx="5" fill="url(#dockWood)" stroke="#2b1406" stroke-width="2"/>
        <rect x="66" y="16" width="25" height="98" rx="5" fill="url(#dockWood)" stroke="#2b1406" stroke-width="2"/>
        <rect x="95" y="14" width="25" height="102" rx="5" fill="url(#dockWood)" stroke="#2b1406" stroke-width="2"/>
        <rect x="124" y="16" width="27" height="98" rx="6" fill="url(#dockWood)" stroke="#2b1406" stroke-width="2"/>
        <!-- Corner Rope Posts -->
        <circle cx="138" cy="18" r="9" fill="#5e3416" stroke="#261205" stroke-width="2.5"/>
        <circle cx="138" cy="18" r="4" fill="#d9a86c"/>
        <circle cx="138" cy="110" r="9" fill="#5e3416" stroke="#261205" stroke-width="2.5"/>
        <circle cx="138" cy="110" r="4" fill="#d9a86c"/>
        <!-- Warm Lantern Glow -->
        <circle cx="138" cy="18" r="32" fill="url(#lanternGlow)"/>
      </g>
    </g>

    <!-- Right Riverbank & Monkey's Tropical Banana Haven -->
    <g filter="url(#bankShadow)">
      <path d="M1940,-20 L1715,-20 C1695,180 1745,350 1722,540 C1705,720 1755,900 1722,1100 L1940,1100 Z" fill="#c2a167" opacity="0.45"/>
      <path d="M1940,-20 L1735,-20 C1715,180 1765,350 1742,540 C1725,720 1775,900 1742,1100 L1940,1100 Z" fill="url(#bankRightGrad)"/>

      <!-- Right Finish Wooden Pier & Banana Basket Gazebo (Dynamically aligned to finish stone row) -->
      <g id="finish-dock" transform="translate(1715, 445)">
        <rect x="-12" y="38" width="160" height="88" rx="12" fill="#3a1d0a"/>
        <rect x="-8" y="32" width="25" height="100" rx="6" fill="url(#dockWood)" stroke="#2b1406" stroke-width="2"/>
        <rect x="21" y="34" width="25" height="96" rx="5" fill="url(#dockWood)" stroke="#2b1406" stroke-width="2"/>
        <rect x="50" y="32" width="25" height="100" rx="5" fill="url(#dockWood)" stroke="#2b1406" stroke-width="2"/>
        <!-- Gazebo Floor Circle -->
        <ellipse cx="118" cy="82" rx="64" ry="56" fill="#784421" stroke="#3d200b" stroke-width="5"/>
        <ellipse cx="118" cy="82" rx="50" ry="44" fill="#965a32" stroke="#593216" stroke-width="2"/>
        <!-- Woven Tropical Fruit & Banana Basket -->
        <g transform="translate(95, 50)">
          <path d="M6,26 L44,26 L38,48 C35,53 15,53 12,48 Z" fill="#c78336" stroke="#5c3409" stroke-width="2.2"/>
          <line x1="9" y1="33" x2="41" y2="33" stroke="#784712" stroke-width="2"/>
          <line x1="11" y1="41" x2="39" y2="41" stroke="#784712" stroke-width="2"/>
          <!-- Golden Bananas in Basket -->
          <path d="M10,25 C12,8 28,6 36,20 C26,22 18,22 10,25 Z" fill="#ffe135" stroke="#997700" stroke-width="1.8"/>
          <path d="M18,26 C22,10 38,8 44,24 C34,26 24,26 18,26 Z" fill="#ffcf19" stroke="#997700" stroke-width="1.8"/>
          <circle cx="14" cy="24" r="6" fill="#ff7326" stroke="#8c2d00" stroke-width="1.5"/>
        </g>
        <!-- Corner Rope Posts -->
        <circle cx="4" cy="34" r="9" fill="#5e3416" stroke="#261205" stroke-width="2.5"/>
        <circle cx="4" cy="34" r="4" fill="#d9a86c"/>
        <circle cx="4" cy="128" r="9" fill="#5e3416" stroke="#261205" stroke-width="2.5"/>
        <circle cx="4" cy="128" r="4" fill="#d9a86c"/>
        <circle cx="4" cy="34" r="30" fill="url(#lanternGlow)"/>
      </g>

      <!-- Lush Foliage on Right Bank -->
      <ellipse cx="1795" cy="145" rx="60" ry="42" fill="#3a7524"/>
      <ellipse cx="1820" cy="295" rx="54" ry="38" fill="#2c5e1a"/>
      <ellipse cx="1795" cy="825" rx="62" ry="46" fill="#3f7c27"/>
      <ellipse cx="1825" cy="965" rx="68" ry="50" fill="#295718"/>
    </g>
  </svg>

  <!-- Real 3D Wooden Plank Bridges Layer -->
  <svg id="trail-layer" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
      <linearGradient id="plankWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#b8763e"/>
        <stop offset="50%" stop-color="#8f5322"/>
        <stop offset="100%" stop-color="#613411"/>
      </linearGradient>
      <linearGradient id="beamWoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#693b18"/>
        <stop offset="100%" stop-color="#3b1d08"/>
      </linearGradient>
      <filter id="bridgeShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#041821" flood-opacity="0.72"/>
      </filter>
    </defs>
    <g id="trail-segments" filter="url(#bridgeShadow)"></g>
  </svg>

  <!-- Stepping Stones Grid (5x7) -->
  <div id="stones-container"></div>

  <!-- Articulated Realistic Jungle Monkey Character (Мавпочка) -->
  <div id="character-wrapper">
    <svg id="monkey-svg" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="monkeyFur" cx="42%" cy="35%" r="62%">
          <stop offset="0%" stop-color="#a86432"/>
          <stop offset="60%" stop-color="#753d17"/>
          <stop offset="100%" stop-color="#472108"/>
        </radialGradient>
        <radialGradient id="monkeyFace" cx="48%" cy="40%" r="58%">
          <stop offset="0%" stop-color="#ffe6c7"/>
          <stop offset="70%" stop-color="#f0be8d"/>
          <stop offset="100%" stop-color="#c98e59"/>
        </radialGradient>
        <linearGradient id="monkeyLimb" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#7d431b"/>
          <stop offset="100%" stop-color="#421f07"/>
        </linearGradient>
      </defs>

      <!-- Long Prehensile Curled Tail -->
      <g id="monkey-tail">
        <path d="M38,71 C16,76 5,56 12,38 C17,25 31,26 29,37 C27,45 19,43 21,36"
              fill="none" stroke="#472108" stroke-width="8.5" stroke-linecap="round"/>
        <path d="M38,71 C16,76 5,56 12,38 C17,25 31,26 29,37 C27,45 19,43 21,36"
              fill="none" stroke="url(#monkeyFur)" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Main Articulated Monkey Body Group -->
      <g id="monkey-body-group">
        <!-- Hind Legs & Feet -->
        <g id="monkey-leg-l">
          <path d="M39,72 Q31,79 33,86" fill="none" stroke="url(#monkeyLimb)" stroke-width="7.5" stroke-linecap="round"/>
          <ellipse cx="32" cy="87" rx="8" ry="4.5" transform="rotate(-10 32 87)" fill="url(#monkeyFace)" stroke="#5c2e0e" stroke-width="1.4"/>
        </g>
        <g id="monkey-leg-r">
          <path d="M61,72 Q69,79 67,86" fill="none" stroke="url(#monkeyLimb)" stroke-width="7.5" stroke-linecap="round"/>
          <ellipse cx="68" cy="87" rx="8" ry="4.5" transform="rotate(10 68 87)" fill="url(#monkeyFace)" stroke="#5c2e0e" stroke-width="1.4"/>
        </g>

        <!-- Torso & Soft Cream Belly -->
        <path d="M34,51 C30,65 34,80 50,81 C66,80 70,65 66,51 C62,42 38,42 34,51 Z"
              fill="url(#monkeyFur)" stroke="#3d1c06" stroke-width="1.5"/>
        <ellipse cx="50" cy="65" rx="12.5" ry="12" fill="url(#monkeyFace)" opacity="0.92"/>

        <!-- Articulated Arms & Hands -->

  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Wooden plank bridge building clack + ascending marimba + happy monkey chirp
    playCorrectStep(stepIndex) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 987.77, 1046.50, 1174.66];
      const freq = scale[Math.min(stepIndex, scale.length - 1)];

      // 3 quick wooden plank clacks as bridge builds
      for (let p = 0; p < 3; p++) {
        const t = now + p * 0.055;
        const woodOsc = this.ctx.createOscillator();
        const woodGain = this.ctx.createGain();
        woodOsc.type = 'triangle';
        woodOsc.frequency.setValueAtTime(180 + p * 45, t);
        woodOsc.frequency.exponentialRampToValueAtTime(95, t + 0.045);
        woodGain.gain.setValueAtTime(0.18, t);
        woodGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        woodOsc.connect(woodGain);
        woodGain.connect(this.ctx.destination);
        woodOsc.start(t);
        woodOsc.stop(t + 0.055);
      }

      // Marimba note on landing
      const landTime = now + 0.14;
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(freq, landTime);
      osc2.frequency.setValueAtTime(freq * 2, landTime);

      gain.gain.setValueAtTime(0.001, landTime);
      gain.gain.exponentialRampToValueAtTime(0.32, landTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, landTime + 0.42);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(this.ctx.destination);

      osc1.start(landTime);
      osc2.start(landTime);
      osc1.stop(landTime + 0.45);
      osc2.stop(landTime + 0.45);

      // Playful monkey "oo-oo!" chirp
      const chirp = this.ctx.createOscillator();
      const chirpGain = this.ctx.createGain();
      chirp.type = 'sine';
      chirp.frequency.setValueAtTime(580, now + 0.06);
      chirp.frequency.exponentialRampToValueAtTime(920, now + 0.16);
      chirpGain.gain.setValueAtTime(0.001, now + 0.06);
      chirpGain.gain.linearRampToValueAtTime(0.11, now + 0.09);
      chirpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
      chirp.connect(chirpGain);
      chirpGain.connect(this.ctx.destination);
      chirp.start(now + 0.06);
      chirp.stop(now + 0.2);
    }

      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(195, now);
      osc.frequency.exponentialRampToValueAtTime(68, now + 0.24);

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(520, now);
      filter.frequency.exponentialRampToValueAtTime(140, now + 0.25);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.26, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);

      // Second quick low note
      const osc2 = this.ctx.createOscillator();
      const gain2 = this.ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(140, now + 0.12);
      osc2.frequency.exponentialRampToValueAtTime(92, now + 0.32);
      gain2.gain.setValueAtTime(0.001, now + 0.12);
      gain2.gain.linearRampToValueAtTime(0.2, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
      osc2.connect(gain2);
      gain2.connect(this.ctx.destination);
      osc2.start(now + 0.12);
      osc2.stop(now + 0.36);
    }

      this.init();

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();

      osc.type = 'sine';

      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    }

      const notes = melodies[variant % melodies.length];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.26, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.7);
      });
    }

      const now = this.ctx.currentTime;

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    }

        <!-- Long Barbels / Whiskers -->

        <circle cx="28" cy="46" r="3" fill="#ffd54f"/><circle cx="28" cy="46" r="1.4" fill="#111"/>

  /* =========================================================================
     3. GAME STATE & STRICT ORTHOGONAL CHORDLESS PATH GENERATOR (10 - 13 Stones)
        - Grid is 5 rows x 7 columns (35 stones)
        - Movements are ONLY UP, DOWN, LEFT, RIGHT (Math.abs(dr) + Math.abs(dc) === 1)
        - Path is chordless (induced): no two non-consecutive path stones touch orthogonally,
          guaranteeing a single unambiguous orthogonal bridge route from left bank to right bank!
     ========================================================================= */
  const COLS = 7;
  const ROWS = 5;

  let currentLang = 'uk';      // 'uk' or 'ru'
  let currentMode = 1;         // 1 = Distractors WITHOUT 'М', 2 = Distractors WITH 'М' inside/end
  let showWords = false;       // Toggle reading nameplates
  let celebrationIndex = 0;

  let gridCells = [];          // 35 cell objects
  let pathCoords = [];         // Array of {r, c} of length 10..13
  let steppedSet = new Set();  // Indices of stepped M stones
  let lastSteppedCell = null;  // Last stepped stone for orthogonal neighbor validation
  let isJumping = false;
  let isCelebrating = false;

  const stonesContainer = document.getElementById('stones-container');
  const trailSegmentsGroup = document.getElementById('trail-segments');
  const startDockGroup = document.getElementById('start-dock');
  const finishDockGroup = document.getElementById('finish-dock');
  const charWrapper = document.getElementById('character-wrapper');
  const btnLang = document.getElementById('btn-lang');
  const btnWords = document.getElementById('btn-words');
  const btnMode = document.getElementById('btn-mode');
  const btnHint = document.getElementById('btn-hint');
  const modeIconSvg = document.getElementById('mode-icon-svg');
  const btnNext = document.getElementById('btn-next');
  const nextLabel = document.getElementById('next-label');

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Strictly orthogonal adjacency check (UP, DOWN, LEFT, RIGHT only)
  function isOrthogonalNeighbor(r1, c1, r2, c2) {
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
  }

  // Generate a chordless (induced) orthogonal path from col 0 to col 6 with 10 to 13 stones
  function generateOrthogonalPath() {
    const targetMin = 10;
    const targetMax = 13;

    for (let attempt = 0; attempt < 120; attempt++) {
      const startRow = Math.floor(Math.random() * ROWS);
      const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      const path = [{ r: startRow, c: 0 }];
      visited[startRow][0] = true;

      let steps = 0;
      const dfs = (r, c) => {
        if (++steps > 3500) return false;
        if (c === COLS - 1) {
          return path.length >= targetMin && path.length <= targetMax;
        }
        if (path.length >= targetMax) return false;

        // Strictly 4 orthogonal directions: UP, DOWN, RIGHT, LEFT
        const dirs = shuffleArray([
          { dr: -1, dc: 0 },
          { dr: 1, dc: 0 },
          { dr: 0, dc: 1 },
          { dr: 0, dc: -1 }
        ]);

        for (const { dr, dc } of dirs) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
          if (visited[nr][nc]) continue;

          // Keep start column clean (only 1 stone in col 0) and finish column clean
          if (nc === 0) continue;
          if (nc === COLS - 1 && path.length + 1 < targetMin) continue;

          // Induced / chordless check: (nr, nc) must NOT be orthogonally adjacent
          // to any already-visited cell except the current cell (r, c)
          let touchesOtherVisited = false;
          const orthoChecks = [
            { r: nr - 1, c: nc },
            { r: nr + 1, c: nc },
            { r: nr, c: nc - 1 },
            { r: nr, c: nc + 1 }
          ];
          for (const chk of orthoChecks) {
            if (chk.r < 0 || chk.r >= ROWS || chk.c < 0 || chk.c >= COLS) continue;
            if (chk.r === r && chk.c === c) continue;
            if (visited[chk.r][chk.c]) {
              touchesOtherVisited = true;
              break;
            }
          }
          if (touchesOtherVisited) continue;

          visited[nr][nc] = true;
          path.push({ r: nr, c: nc });
          if (dfs(nr, nc)) return true;
          path.pop();
          visited[nr][nc] = false;
        }
        return false;
      };

      if (dfs(startRow, 0)) {
        return path;
      }
    }

    // Guaranteed chordless orthogonal fallback path of 11 stones (strictly up/down/left/right)
    return [
      { r: 1, c: 0 },
      { r: 1, c: 1 },
      { r: 2, c: 1 },
      { r: 3, c: 1 },
      { r: 3, c: 2 },
      { r: 3, c: 3 },
      { r: 2, c: 3 },
      { r: 1, c: 3 },
      { r: 1, c: 4 },
      { r: 1, c: 5 },
      { r: 1, c: 6 }
    ];
  }

  // Highlight letter М/м inside word for optional reading plaque
  function formatWordWithHighlight(word) {
    return word.split('').map(ch => {
      if (ch === 'М' || ch === 'м') {
        return `<span class="hl-m">${ch}</span>`;
      }
      return ch;
    }).join('');
  }

  // Convert screen coordinates to the 1920x1080 SVG coordinate space
  function toSvgCoords(xPx, yPx) {
    return {
      x: (xPx / window.innerWidth) * 1920,
      y: (yPx / window.innerHeight) * 1080
    };
  }

  // Align Left Start Dock and Right Finish Dock with the first and last stone rows
  function alignDocksWithPath() {
    if (!pathCoords.length || !gridCells.length) return;
    const firstCell = gridCells[pathCoords[0].r * COLS + pathCoords[0].c];
    const lastCoord = pathCoords[pathCoords.length - 1];
    const lastCell = gridCells[lastCoord.r * COLS + lastCoord.c];

    if (firstCell && firstCell.el) {
      const pt = getStoneCenterScreen(firstCell.el);
      const svgPt = toSvgCoords(pt.x, pt.y);
      startDockGroup.setAttribute('transform', `translate(22, ${Math.round(svgPt.y - 65)})`);
    }
    if (lastCell && lastCell.el) {
      const pt = getStoneCenterScreen(lastCell.el);
      const svgPt = toSvgCoords(pt.x, pt.y);
      finishDockGroup.setAttribute('transform', `translate(1715, ${Math.round(svgPt.y - 82)})`);
    }

  // Place Monkey at start dock aligned with the first stone row
  function placeMonkeyAtStartDock() {
    const startDockX = window.innerWidth * 0.068;
    let startDockY = window.innerHeight * 0.505;
    if (pathCoords.length && gridCells.length) {
      const firstCell = gridCells[pathCoords[0].r * COLS + pathCoords[0].c];
      if (firstCell && firstCell.el) {
        startDockY = getStoneCenterScreen(firstCell.el).y;
      }
    }
    charWrapper.style.left = `${startDockX}px`;
    charWrapper.style.top = `${startDockY}px`;
    charWrapper.style.transform = `translate(-50%, -68%) scale(1)`;
  }

  /* =========================================================================
     4. REAL 3D WOODEN PLANK BRIDGE BUILDER (Справжні дерев'яні місточки)
     ========================================================================= */
  function buildWoodenBridge(fromPt, toPt) {
    const p1 = toSvgCoords(fromPt.x, fromPt.y);
    const p2 = toSvgCoords(toPt.x, toPt.y);

    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const fullDist = Math.hypot(dx, dy);
    const angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);

    // Trim ends slightly so bridge rests naturally on the edges of the two stones
    const trim = Math.min(34, fullDist * 0.16);
    const spanLen = Math.max(40, fullDist - trim * 2);
    const bridgeHalfW = 24;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${p1.x.toFixed(1)}, ${p1.y.toFixed(1)}) rotate(${angleDeg.toFixed(2)})`);

    // 1. Two parallel sturdy timber support stringers
    let innerHTML = `
      <rect x="${trim - 4}" y="${-bridgeHalfW + 5}" width="${spanLen + 8}" height="8" rx="4" fill="url(#beamWoodGrad)" stroke="#241004" stroke-width="1.5"/>
      <rect x="${trim - 4}" y="${bridgeHalfW - 13}" width="${spanLen + 8}" height="8" rx="4" fill="url(#beamWoodGrad)" stroke="#241004" stroke-width="1.5"/>
    `;

    // 2. Transverse Wooden Planks with wood grain & iron nails
    const plankStep = 22;
    const numPlanks = Math.max(4, Math.floor(spanLen / plankStep));
    const actualStep = spanLen / numPlanks;
    const plankW = Math.min(18, actualStep * 0.82);

    for (let i = 0; i < numPlanks; i++) {
      const px = trim + i * actualStep + (actualStep - plankW) * 0.5;
      const delay = (i * 0.035).toFixed(3);
      const jitterY = (i % 2 === 0 ? -0.8 : 0.8);
      innerHTML += `
        <g class="bridge-plank-anim" style="animation-delay: ${delay}s">
          <rect x="${px.toFixed(1)}" y="${(-bridgeHalfW + jitterY).toFixed(1)}" width="${plankW.toFixed(1)}" height="${bridgeHalfW * 2}" rx="4"
                fill="url(#plankWoodGrad)" stroke="#3b1d08" stroke-width="2"/>
          <!-- Wood grain highlight -->
          <line x1="${(px + 3.5).toFixed(1)}" y1="${-bridgeHalfW + 4}" x2="${(px + 3.5).toFixed(1)}" y2="${bridgeHalfW - 4}"
                stroke="#d99b62" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
          <!-- Iron nails at top and bottom of plank -->
          <circle cx="${(px + plankW / 2).toFixed(1)}" cy="${-bridgeHalfW + 8}" r="2.1" fill="#2b2d30"/>
          <circle cx="${(px + plankW / 2).toFixed(1)}" cy="${bridgeHalfW - 8}" r="2.1" fill="#2b2d30"/>
        </g>
      `;
    }

    // 3. Side Rope Handrails & Corner Wooden Bollard Posts
    const xStart = trim;
    const xEnd = trim + spanLen;
    const xMid = trim + spanLen * 0.5;

    innerHTML += `
      <!-- Top & Bottom Rope Handrails -->
      <path d="M${xStart},${-bridgeHalfW - 2} Q${xMid},${-bridgeHalfW + 2} ${xEnd},${-bridgeHalfW - 2}"
            fill="none" stroke="#e6ba7e" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M${xStart},${bridgeHalfW + 2} Q${xMid},${bridgeHalfW - 2} ${xEnd},${bridgeHalfW + 2}"
            fill="none" stroke="#e6ba7e" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 4 Corner Wooden Posts with Rope Knots -->
      <circle cx="${xStart}" cy="${-bridgeHalfW - 1}" r="6.5" fill="#693b18" stroke="#261205" stroke-width="2"/>
      <circle cx="${xStart}" cy="${-bridgeHalfW - 1}" r="3" fill="#e6ba7e"/>
      <circle cx="${xEnd}" cy="${-bridgeHalfW - 1}" r="6.5" fill="#693b18" stroke="#261205" stroke-width="2"/>
      <circle cx="${xEnd}" cy="${-bridgeHalfW - 1}" r="3" fill="#e6ba7e"/>
      <circle cx="${xStart}" cy="${bridgeHalfW + 1}" r="6.5" fill="#693b18" stroke="#261205" stroke-width="2"/>
      <circle cx="${xStart}" cy="${bridgeHalfW + 1}" r="3" fill="#e6ba7e"/>
      <circle cx="${xEnd}" cy="${bridgeHalfW + 1}" r="6.5" fill="#693b18" stroke="#261205" stroke-width="2"/>
      <circle cx="${xEnd}" cy="${bridgeHalfW + 1}" r="3" fill="#e6ba7e"/>
    `;

    g.innerHTML = innerHTML;
    trailSegmentsGroup.appendChild(g);
  }

  // Mark currently reachable orthogonal neighbors (up/down/left/right) for hover clarity
  function updateOrthogonalReachability() {
    gridCells.forEach(cell => {
      cell.el.classList.remove('ortho-neighbor', 'next-hint');
    });

    if (!lastSteppedCell) {
      // At the start pier: any stone in column 0 is orthogonally across from the pier
      gridCells.forEach(cell => {
        if (cell.c === 0) {
          cell.el.classList.add('ortho-neighbor');
        }
      });
    } else {
      const { r, c } = lastSteppedCell;
      gridCells.forEach(cell => {
        if (!steppedSet.has(cell.idx) && isOrthogonalNeighbor(r, c, cell.r, cell.c)) {
          cell.el.classList.add('ortho-neighbor');
        }
      });
    }
  }

  // Pulse valid orthogonal neighbors when user clicks diagonally or too far
  function pulseOrthogonalNeighbors() {
    gridCells.forEach(cell => {
      cell.el.classList.remove('ortho-pulse');
      const isReachable = !lastSteppedCell
        ? (cell.c === 0)
        : (!steppedSet.has(cell.idx) && isOrthogonalNeighbor(lastSteppedCell.r, lastSteppedCell.c, cell.r, cell.c));
      if (isReachable) {
        void cell.el.offsetWidth;
        cell.el.classList.add('ortho-pulse');
      }
    });
  }

  // Build / Regenerate Level
  function initLevel() {
    isJumping = false;
    isCelebrating = false;
    steppedSet.clear();
    lastSteppedCell = null;
    trailSegmentsGroup.innerHTML = '';
    stonesContainer.innerHTML = '';
    gridCells = [];

    pathCoords = generateOrthogonalPath();
    const pathIndexSet = new Set(pathCoords.map(p => p.r * COLS + p.c));

    // Distractor words must NOT appear even on non-path cells as accidental M words
    const shuffledTargets = shuffleArray(TARGET_M_POOL);
    const distractorSource = currentMode === 1 ? DISTRACTOR_MODE1_POOL : DISTRACTOR_MODE2_POOL;
    const shuffledDistractors = shuffleArray(distractorSource);

    let targetPtr = 0;
    let distPtr = 0;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const idx = r * COLS + c;
        const isTarget = pathIndexSet.has(idx);
        const item = isTarget
          ? shuffledTargets[targetPtr++ % shuffledTargets.length]
          : shuffledDistractors[distPtr++ % shuffledDistractors.length];

        const stoneEl = document.createElement('div');
        stoneEl.className = 'river-stone';
        stoneEl.dataset.index = idx;

        const rx1 = 46;
        const ry1 = 39;
        const wordText = currentLang === 'uk' ? item.uk : item.ru;

        stoneEl.innerHTML = `
          <svg class="stone-base-svg" viewBox="0 0 120 100">
            <defs>
              <radialGradient id="stoneGrad_${idx}" cx="38%" cy="30%" r="68%">
                <stop offset="0%" stop-color="#98a8b3"/>
                <stop offset="58%" stop-color="#62727d"/>
                <stop offset="100%" stop-color="#37434d"/>
              </radialGradient>
            </defs>
            <!-- Orthogonal reachability / hint water ripple ring -->
            <ellipse class="hint-ring" cx="60" cy="52" rx="54" ry="43" fill="none" stroke="#9ef7ff" stroke-width="3.5" stroke-dasharray="10 7"/>
            <ellipse cx="60" cy="55" rx="${rx1 + 4}" ry="${ry1 + 3}" fill="none" stroke="#6ce5f5" stroke-width="1.5" opacity="0.32"/>
            <!-- Underwater stone shadow -->
            <ellipse cx="60" cy="57" rx="${rx1 + 2}" ry="${ry1 + 2}" fill="#07222b" opacity="0.65"/>
            <!-- Main Carved River Stone (Crisp Orthogonal Alignment) -->
            <ellipse cx="60" cy="50" rx="${rx1}" ry="${ry1}" fill="url(#stoneGrad_${idx})" stroke="#27323a" stroke-width="2.5"/>
            <!-- Top stone bevel highlight -->
            <ellipse cx="57" cy="45" rx="${rx1 - 7}" ry="${ry1 - 7}" fill="#b3c2cc" opacity="0.22"/>
            <!-- Glowing Emerald Moss Rim (Revealed when stepped) -->
            <ellipse class="moss-rim" cx="60" cy="50" rx="${rx1}" ry="${ry1}" fill="none" stroke="#85f24b" stroke-width="5.5" stroke-dasharray="18 7" opacity="0" style="transition: opacity 0.35s ease;"/>
            <!-- Small natural moss patch on corner -->
            <path d="M22,37 Q30,27 40,33 Q32,41 22,37 Z" fill="#4f9428" opacity="0.75"/>
            <!-- Blooming Water Lotus on corner when stepped -->
            <g class="stone-lotus" transform="translate(94, 22) scale(0)" opacity="0" style="transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);">
              <circle cx="0" cy="0" r="11" fill="#479e24"/>
              <circle cx="0" cy="0" r="7.5" fill="#ff85b3"/>
              <circle cx="0" cy="0" r="3.5" fill="#ffe45e"/>
            </g>
          </svg>
          <div class="stone-art">${item.svg}</div>
          <div class="word-plaque">${formatWordWithHighlight(wordText)}</div>
        `;

        stoneEl.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleStoneClick(idx);
        });

        stonesContainer.appendChild(stoneEl);
        gridCells.push({ idx, r, c, isTarget, item, el: stoneEl });
      }
    }

    requestAnimationFrame(() => {
      alignDocksWithPath();
      placeMonkeyAtStartDock();
      updateOrthogonalReachability();
    });
  }

  /* =========================================================================
     5. MONKEY JUMP & STRICT ORTHOGONAL INTERACTION LOGIC
     ========================================================================= */
  function getStoneCenterScreen(stoneEl) {
    const rect = stoneEl.getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height / 2
    };
  }

  function animateMonkeyJump(targetX, targetY, onLanded) {
    isJumping = true;
    const startX = parseFloat(charWrapper.style.left) || window.innerWidth * 0.068;
    const startY = parseFloat(charWrapper.style.top) || window.innerHeight * 0.505;
    const dist = Math.hypot(targetX - startX, targetY - startY);
    const arcHeight = Math.min(115, Math.max(52, dist * 0.36));
    const duration = Math.min(480, Math.max(310, dist * 1.05));
    const startTime = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const curX = startX + (targetX - startX) * ease;
      const curY = startY + (targetY - startY) * ease - Math.sin(t * Math.PI) * arcHeight;

      // Agile monkey crouch, leap stretch, and landing bounce
      let scaleX = 1;
      let scaleY = 1;
      if (t < 0.18) {
        scaleX = 1.15;
        scaleY = 0.85;
      } else if (t < 0.78) {
        scaleX = 0.9;
        scaleY = 1.14;
      } else {
        scaleX = 1.14 - (t - 0.78) * 0.63;
        scaleY = 0.86 + (t - 0.78) * 0.63;
      }

      charWrapper.style.left = `${curX}px`;
      charWrapper.style.top = `${curY}px`;
      charWrapper.style.transform = `translate(-50%, -68%) scale(${scaleX.toFixed(3)}, ${scaleY.toFixed(3)})`;

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        charWrapper.style.transform = `translate(-50%, -68%) scale(1, 1)`;
        isJumping = false;
        if (onLanded) onLanded();
      }
    }

    requestAnimationFrame(frame);
  }

  function handleStoneClick(idx) {
    if (isJumping || isCelebrating) return;
    const cell = gridCells[idx];
    if (!cell) return;
    if (steppedSet.has(idx)) return;

    // 1. Check strict ORTHOGONAL reachability (Up, Down, Left, Right ONLY — NO Diagonals!)
    const isReachableOrthogonally = !lastSteppedCell
      ? (cell.c === 0)
      : isOrthogonalNeighbor(lastSteppedCell.r, lastSteppedCell.c, cell.r, cell.c);

    if (!isReachableOrthogonally) {
      // Diagonal or distant stone clicked -> Deny jump and pulse valid orthogonal neighbors
      sound.playDiagonalDeny();
      cell.el.classList.remove('diagonal-deny');
      void cell.el.offsetWidth;
      cell.el.classList.add('diagonal-deny');
      pulseOrthogonalNeighbors();
      return;
    }

    // 2. Reachable orthogonally: check if it is a valid 'М' stone
    if (cell.isTarget) {
      const stoneCenter = getStoneCenterScreen(cell.el);
      const prevPt = lastSteppedCell
        ? getStoneCenterScreen(lastSteppedCell.el)
        : { x: window.innerWidth * 0.068, y: stoneCenter.y };

      steppedSet.add(idx);
      const stepNum = steppedSet.size;

      // Build the real wooden plank bridge first, then monkey leaps across it!
      buildWoodenBridge(prevPt, stoneCenter);
      sound.playCorrectStep(stepNum - 1);

      animateMonkeyJump(stoneCenter.x, stoneCenter.y, () => {
        cell.el.classList.add('stepped');
        spawnWaterSplash(stoneCenter.x, stoneCenter.y, true);
        lastSteppedCell = cell;
        updateOrthogonalReachability();

        // Check if monkey has reached the final stone on the right bank (col 6)
        if (cell.c === COLS - 1 && steppedSet.size >= pathCoords.length) {
          completeCrossing(stoneCenter);
        }
      });
    } else {
      // Orthogonal distractor stone clicked -> Wobble, sink, splash & monkey headshake
      sound.playWrongSplash();
      cell.el.classList.remove('wrong-sink');
      void cell.el.offsetWidth;
      cell.el.classList.add('wrong-sink');

      charWrapper.classList.remove('monkey-no');
      void charWrapper.offsetWidth;
      charWrapper.classList.add('monkey-no');

      const stoneCenter = getStoneCenterScreen(cell.el);
      spawnWaterSplash(stoneCenter.x, stoneCenter.y, false);
    }
  }

  function completeCrossing(lastStonePt) {
    isCelebrating = true;
    const finishDockPt = {
      x: window.innerWidth * 0.935,
      y: lastStonePt.y
    };

    setTimeout(() => {
      // Build final wooden bridge from the last stone to the Banana Island Dock
      buildWoodenBridge(lastStonePt, finishDockPt);
      animateMonkeyJump(finishDockPt.x, finishDockPt.y, () => {
        const variant = celebrationIndex++ % 3;
        sound.playWinFanfare(variant);
        triggerGrandCelebration(variant);

        setTimeout(() => {
          initLevel();
        }, 3100);
      });
    }, 180);
  }

  /* =========================================================================
     6. TOP-RIGHT HUD CONTROLS (Language, Reading Captions, Mode, Hint, Next)
     ========================================================================= */
  function refreshAllStoneCaptions() {
    gridCells.forEach(cell => {
      const plaque = cell.el.querySelector('.word-plaque');
      if (plaque) {
        const wordText = currentLang === 'uk' ? cell.item.uk : cell.item.ru;
        plaque.innerHTML = formatWordWithHighlight(wordText);
      }
    });
    btnLang.textContent = currentLang === 'uk' ? 'УКР' : 'РУС';
    nextLabel.textContent = currentLang === 'uk' ? 'Далі' : 'Далее';
  }

  btnLang.addEventListener('click', () => {
    sound.playClick();
    currentLang = currentLang === 'uk' ? 'ru' : 'uk';
    refreshAllStoneCaptions();
  });

  btnWords.addEventListener('click', () => {
    sound.playClick();
    showWords = !showWords;
    document.body.classList.toggle('show-words', showWords);
    btnWords.classList.toggle('active-toggle', showWords);
  });

  btnMode.addEventListener('click', () => {
    sound.playClick();
    currentMode = currentMode === 1 ? 2 : 1;
    renderModeButtonIcon();
    initLevel();
  });

  btnHint.addEventListener('click', () => {
    sound.playClick();
    // Highlight the next unstepped orthogonal M stone in the path
    for (const p of pathCoords) {
      const idx = p.r * COLS + p.c;
      if (!steppedSet.has(idx)) {
        const cell = gridCells[idx];
        if (cell && cell.el) {
          cell.el.classList.add('next-hint');
          const pt = getStoneCenterScreen(cell.el);
          spawnWaterSplash(pt.x, pt.y, true);
        }
        break;
      }
    }
  });

  btnNext.addEventListener('click', () => {
    sound.playClick();
    initLevel();
  });

  renderModeButtonIcon();

  /* =========================================================================
     7. LIVING RIVER BACKGROUND & FX CANVASES (Koi Fish, Caustics, Celebrations)
     ========================================================================= */
  const riverCanvas = document.getElementById('river-canvas');
  const rCtx = riverCanvas.getContext('2d');
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');

  let cw = window.innerWidth;
  let ch = window.innerHeight;

  function resizeCanvases() {
    cw = window.innerWidth;
    ch = window.innerHeight;
    riverCanvas.width = cw;
    riverCanvas.height = ch;
    fxCanvas.width = cw;
    fxCanvas.height = ch;
    alignDocksWithPath();
    if (!isJumping && !lastSteppedCell) {
      placeMonkeyAtStartDock();
    } else if (!isJumping && lastSteppedCell) {
      const pt = getStoneCenterScreen(lastSteppedCell.el);
      charWrapper.style.left = `${pt.x}px`;
      charWrapper.style.top = `${pt.y}px`;
    }
  }
  window.addEventListener('resize', resizeCanvases);
  resizeCanvases();

  // Underwater Swimming Koi Fish
  const koiFish = Array.from({ length: 9 }, (_, i) => ({
    x: Math.random() * cw,
    y: Math.random() * ch,
    vx: (Math.random() * 0.65 + 0.35) * (i % 2 === 0 ? 1 : -1),
    vy: (Math.random() - 0.5) * 0.35,
    size: 16 + Math.random() * 12,
    phase: Math.random() * Math.PI * 2,
    color: i % 3 === 0 ? '#ff7b3b' : (i % 3 === 1 ? '#ffd042' : '#ff5468')
  }));

  // Shimmering Water Current Lines
  const waterStreams = Array.from({ length: 26 }, () => ({
    x: Math.random() * cw,
    y: Math.random() * ch,
    len: 60 + Math.random() * 110,
    speed: 0.4 + Math.random() * 0.7,
    alpha: 0.06 + Math.random() * 0.11
  }));

  // Floating Golden Fireflies / Sunlit Pollen
  const fireflies = Array.from({ length: 22 }, () => ({
    x: Math.random() * cw,
    y: Math.random() * ch,
    r: 1.8 + Math.random() * 2.5,
    phase: Math.random() * Math.PI * 2,
    vx: (Math.random() - 0.5) * 0.4,
    vy: -0.2 - Math.random() * 0.35
  }));

  // Active FX Particles (Splashes & Celebration)
  const fxParticles = [];
  constfxRings = [];

  function spawnWaterSplash(x, y, isCorrect) {
    fxRings.push({
      x, y,
      r: 12,
      maxR: isCorrect ? 85 : 65,
      alpha: 0.85,
      color: isCorrect ? '#a8ff78' : '#7ec8e3'
    });

    const count = isCorrect ? 22 : 14;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
      const speed = 2.2 + Math.random() * 5.2;
      fxParticles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (isCorrect ? 2.5 : 1),
        gravity: 0.18,
        r: isCorrect ? (3.5 + Math.random() * 4) : (3 + Math.random() * 3),
        alpha: 1,
        color: isCorrect
          ? (i % 2 === 0 ? '#ffe96b' : '#7ef556')
          : (i % 2 === 0 ? '#89c4d7' : '#567d8c'),
        type: 'drop'
      });
    }
  }

  // 3 Varied Non-Verbal Grand Celebrations
  function triggerGrandCelebration(variant) {
    if (variant === 0) {
      // Variant 0: Golden Koi Leap & Rainbow River Mist
      for (let i = 0; i < 65; i++) {
        fxParticles.push({
          x: cw * (0.2 + Math.random() * 0.65),
          y: ch * 0.85,
          vx: (Math.random() - 0.5) * 7,
          vy: -8 - Math.random() * 9,
          gravity: 0.22,
          r: 5 + Math.random() * 6,
          alpha: 1,
          color: ['#ff5e7e', '#ffbe3b', '#6ef25c', '#5ce1ff', '#d47aff'][i % 5],
          type: 'sparkle'
        });
      }
    } else if (variant === 1) {
      // Variant 1: Monarch Butterfly Swarm across the River
      for (let i = 0; i < 36; i++) {
        fxParticles.push({
          x: cw * Math.random(),
          y: ch + 20,
          vx: (Math.random() - 0.5) * 3.5,
          vy: -3.5 - Math.random() * 4,
          gravity: -0.02,
          r: 9 + Math.random() * 6,
          alpha: 1,
          phase: Math.random() * Math.PI * 2,
          color: i % 2 === 0 ? '#ff9b29' : '#ffd84d',
          type: 'butterfly'
        });
      }
    } else {
      // Variant 2: Blooming River Lotus & Golden Fountain
      for (let i = 0; i < 55; i++) {
        const cx = cw * (0.25 + (i % 5) * 0.12);
        const cy = ch * 0.5;
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 7;
        fxParticles.push({
          x: cx,
          y: cy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 2,
          gravity: 0.12,
          r: 5 + Math.random() * 5,
          alpha: 1,
          color: i % 2 === 0 ? '#ff85b3' : '#ffe659',
          type: 'petal'
        });
      }
    }
  }

  const fxRings = [];

  function renderLoop(time) {
    rCtx.clearRect(0, 0, cw, ch);

    // 1. Shimmering Water Current Ripples
    rCtx.lineCap = 'round';
    for (const s of waterStreams) {
      s.y += s.speed;
      if (s.y > ch + 50) {
        s.y = -60;
        s.x = cw * 0.12 + Math.random() * (cw * 0.76);
      }
      rCtx.strokeStyle = `rgba(145, 238, 255, ${s.alpha})`;
      rCtx.lineWidth = 2.5;
      rCtx.beginPath();
      rCtx.moveTo(s.x, s.y);
      rCtx.quadraticCurveTo(
        s.x + Math.sin(time * 0.002 + s.y * 0.02) * 14,
        s.y + s.len * 0.5,
        s.x,
        s.y + s.len
      );
      rCtx.stroke();
    }

    // 2. Swimming Underwater Koi Fish
    for (const f of koiFish) {
      f.x += f.vx;
      f.y += f.vy + Math.sin(time * 0.003 + f.phase) * 0.25;
      if (f.x > cw * 0.88) f.vx = -Math.abs(f.vx);
      if (f.x < cw * 0.12) f.vx = Math.abs(f.vx);
      if (f.y < 60) f.vy = Math.abs(f.vy);
      if (f.y > ch - 60) f.vy = -Math.abs(f.vy);

      const angle = Math.atan2(f.vy, f.vx);
      rCtx.save();
      rCtx.translate(f.x, f.y);
      rCtx.rotate(angle);
      rCtx.globalAlpha = 0.38;

      // Tail wag
      const wag = Math.sin(time * 0.012 + f.phase) * 5;
      rCtx.fillStyle = f.color;
      rCtx.beginPath();
      rCtx.moveTo(-f.size * 0.7, 0);
      rCtx.lineTo(-f.size * 1.45, -f.size * 0.45 + wag);
      rCtx.lineTo(-f.size * 1.45, f.size * 0.45 + wag);
      rCtx.closePath();
      rCtx.fill();

      // Body
      rCtx.beginPath();
      rCtx.ellipse(0, 0, f.size, f.size * 0.42, 0, 0, Math.PI * 2);
      rCtx.fill();
      rCtx.restore();
    }

    // 3. FX Canvas (Splash Rings, Droplets, Butterflies, Petals & Fireflies)
    fxCtx.clearRect(0, 0, cw, ch);

    // Floating Golden Fireflies
    for (const fl of fireflies) {
      fl.x += fl.vx + Math.sin(time * 0.002 + fl.phase) * 0.3;
      fl.y += fl.vy;
      if (fl.y < -10) {
        fl.y = ch + 10;
        fl.x = Math.random() * cw;
      }
      const glowAlpha = 0.35 + 0.45 * Math.sin(time * 0.004 + fl.phase);
      fxCtx.fillStyle = `rgba(255, 240, 140, ${glowAlpha})`;
      fxCtx.beginPath();
      fxCtx.arc(fl.x, fl.y, fl.r, 0, Math.PI * 2);
      fxCtx.fill();
    }

    // Expanding Ripple Rings
    for (let i = fxRings.length - 1; i >= 0; i--) {
      const ring = fxRings[i];
      ring.r += 2.6;
      ring.alpha -= 0.024;
      if (ring.alpha <= 0 || ring.r >= ring.maxR) {
        fxRings.splice(i, 1);
        continue;
      }
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, ring.alpha);
      fxCtx.strokeStyle = ring.color;
      fxCtx.lineWidth = 3.2;
      fxCtx.beginPath();
      fxCtx.ellipse(ring.x, ring.y, ring.r, ring.r * 0.75, 0, 0, Math.PI * 2);
      fxCtx.stroke();
      fxCtx.restore();
    }

    // Active Splash & Celebration Particles
    for (let i = fxParticles.length - 1; i >= 0; i--) {
      const p = fxParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.alpha -= 0.014;

      if (p.alpha <= 0 || p.y > ch + 50 || p.y < -60) {
        fxParticles.splice(i, 1);
        continue;
      }

      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.alpha);
      fxCtx.fillStyle = p.color;

      if (p.type === 'butterfly') {
        const wingFlap = Math.abs(Math.sin(time * 0.02 + p.phase));
        fxCtx.translate(p.x, p.y);
        fxCtx.beginPath();
        fxCtx.ellipse(-p.r * 0.5 * wingFlap, 0, p.r * 0.7 * wingFlap, p.r * 0.5, -0.3, 0, Math.PI * 2);
        fxCtx.ellipse(p.r * 0.5 * wingFlap, 0, p.r * 0.7 * wingFlap, p.r * 0.5, 0.3, 0, Math.PI * 2);
        fxCtx.fill();
      } else {
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }

    requestAnimationFrame(renderLoop);
  }

  // Start Game & Animation Loop
  window.onload = () => {
    initLevel();
    requestAnimationFrame(renderLoop);
  };
})();
</script>
</body>
</html>
