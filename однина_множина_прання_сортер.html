<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Laundry Grammar Sorter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Rubik', sans-serif;
      background: #1d3547;
      touch-action: none;
    }

    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #3c7a89 0%, #2e6171 62%, #8c583a 62%, #633b24 100%);
    }

    /* Subtle Washing Machine Vibration */
    @keyframes washerRumble {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-1.2px, 0.8px) rotate(-0.3deg); }
      50% { transform: translate(1.2px, -0.8px) rotate(0.3deg); }
      75% { transform: translate(-0.8px, -0.6px) rotate(-0.2deg); }
    }

    .washer-rumble {
      animation: washerRumble 0.22s infinite linear;
      transform-origin: center bottom;
    }

    /* Spinning drum inside washing machine */
    @keyframes drumSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .drum-spin {
      animation: drumSpin 2.6s infinite linear;
      transform-origin: 290px 455px;
    }

    /* Fern gentle sway */
    @keyframes fernSway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2.5deg); }
    }

    .fern-sway {
      animation: fernSway 4.2s ease-in-out infinite;
      transform-origin: 1620px 320px;
    }

    /* Hanging Towel gentle sway */
    @keyframes towelSway {
      0%, 100% { transform: rotate(-1deg) skewX(-0.5deg); }
      50% { transform: rotate(1.2deg) skewX(0.8deg); }
    }

    .towel-sway {
      animation: towelSway 5s ease-in-out infinite;
      transform-origin: 1470px 235px;
    }

    /* Dirty Stink Lines Wave */
    @keyframes stinkWave {
      0%, 100% { transform: translateY(0px) scaleX(1); opacity: 0.75; }
      50% { transform: translateY(-10px) scaleX(1.12); opacity: 0.35; }
    }

    .stink-line {
      animation: stinkWave 1.8s ease-in-out infinite;
    }

    /* Clean Sparkle Twinkle */
    @keyframes twinkle {
      0%, 100% { transform: scale(0.4) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.15) rotate(45deg); opacity: 1; }
    }

    .sparkle-star {
      animation: twinkle 1.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    /* Basket Hover & Active States */
    .basket-group {
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .basket-group:hover {
      filter: brightness(1.08) drop-shadow(0 0 18px rgba(255, 238, 170, 0.55));
    }

    .basket-highlight {
      filter: brightness(1.14) drop-shadow(0 0 26px rgba(255, 245, 157, 0.85)) !important;
    }

    /* Draggable Garment Cursor */
    #active-garment-group {
      cursor: grab;
      touch-action: none;
    }

    #active-garment-group:active {
      cursor: grabbing;
    }

    /* Minimalist Next Button */
    #next-btn {
      position: absolute;
      bottom: 2.2vh;
      right: 2vw;
      width: clamp(54px, 4.8vw, 76px);
      height: clamp(54px, 4.8vw, 76px);
      border-radius: 50%;
      cursor: pointer;
      z-index: 50;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      background: transparent;
      border: none;
      padding: 0;
      outline: none;
    }

    #next-btn:hover {
      transform: scale(1.12) rotate(8deg);
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
    }

    #next-btn:active {
      transform: scale(0.94);
    }

    /* Subtle Language Switcher blended into top-left ceramic tile */
    #lang-switcher {
      position: absolute;
      top: 1.6vh;
      left: 1.4vw;
      z-index: 50;
      display: flex;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 10px;
      background: rgba(26, 67, 78, 0.35);
      border: 1.5px solid rgba(178, 224, 232, 0.25);
      opacity: 0.26;
      transition: opacity 0.25s ease, transform 0.2s ease;
      backdrop-filter: blur(2px);
    }

    #lang-switcher:hover {
      opacity: 0.85;
      transform: scale(1.04);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: #d8f3f7;
      font-family: 'Rubik', sans-serif;
      font-weight: 800;
      font-size: clamp(11px, 0.9vw, 15px);
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .lang-btn.active {
      background: rgba(255, 213, 111, 0.38);
      color: #fff8dc;
      box-shadow: inset 0 0 0 1px rgba(255, 225, 148, 0.5);
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- Barely noticeable Language Switcher (UA / RU) -->
  <div id="lang-switcher">
    <button class="lang-btn active" id="lang-ua" type="button">УКР</button>
    <button class="lang-btn" id="lang-ru" type="button">РУС</button>
  </div>

  <!-- Minimalist Next Button (Soap & Brass Medallion with Arrow, no words) -->
  <button id="next-btn" type="button" aria-label="Next">
    <svg viewBox="0 0 100 100" width="100%" height="100%">
      <defs>
        <radialGradient id="soapBtnGrad" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ffd6e8"/>
          <stop offset="55%" stop-color="#ff85b3"/>
          <stop offset="100%" stop-color="#c94b7c"/>
        </radialGradient>
        <linearGradient id="brassRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff0b3"/>
          <stop offset="50%" stop-color="#d49b35"/>
          <stop offset="100%" stop-color="#7d5210"/>
        </linearGradient>
      </defs>
      <!-- Outer Brass Ring -->
      <circle cx="50" cy="50" r="46" fill="url(#brassRimGrad)" stroke="#5c3a08" stroke-width="3"/>
      <!-- Carved Pink Soap Inner Disc -->
      <circle cx="50" cy="50" r="39" fill="url(#soapBtnGrad)" stroke="#ffbad6" stroke-width="2"/>
      <!-- Stitched / Engraved Soap Groove -->
      <circle cx="50" cy="50" r="33" fill="none" stroke="#a63662" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"/>
      <!-- Glossy Highlight -->
      <ellipse cx="36" cy="28" rx="14" ry="7" transform="rotate(-25 36 28)" fill="#ffffff" opacity="0.45"/>
      <!-- Decorative tiny soap bubbles on rim -->
      <circle cx="78" cy="24" r="6" fill="#d9f7ff" stroke="#ffffff" stroke-width="1.5" opacity="0.85"/>
      <circle cx="84" cy="34" r="3.5" fill="#d9f7ff" stroke="#ffffff" stroke-width="1" opacity="0.85"/>
      <!-- Bold Skip/Next Double Arrow Icon -->
      <path d="M 34 33 L 54 50 L 34 67 Z" fill="#fff8e7" stroke="#7d2449" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 52 33 L 72 50 L 52 67 Z" fill="#fff8e7" stroke="#7d2449" stroke-width="3" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Main Widescreen Interactive SVG Scene -->
  <svg id="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
    <defs>
      <!-- Ceramic Wall Tile Pattern -->
      <pattern id="wallTilePattern" width="120" height="120" patternUnits="userSpaceOnUse">
        <rect width="120" height="120" fill="#468998"/>
        <rect x="3" y="3" width="114" height="114" rx="8" fill="#529bad" stroke="#397280" stroke-width="2"/>
        <!-- Subtle ceramic glaze shine -->
        <path d="M 10 12 L 95 12 Q 108 12 108 25 L 108 40 Q 60 25 10 50 Z" fill="#6ab4c7" opacity="0.35"/>
        <!-- Subtle Moroccan corner motif -->
        <circle cx="60" cy="60" r="14" fill="none" stroke="#3f8091" stroke-width="2" opacity="0.45"/>
        <path d="M 60 40 L 66 54 L 80 60 L 66 66 L 60 80 L 54 66 L 40 60 L 54 54 Z" fill="#6ab4c7" opacity="0.25"/>
      </pattern>

      <!-- Decorative Dado Border Tile Pattern -->
      <pattern id="dadoTilePattern" width="80" height="44" patternUnits="userSpaceOnUse">
        <rect width="80" height="44" fill="#255461"/>
        <rect x="2" y="4" width="76" height="36" rx="5" fill="#e8b86d" stroke="#b07d2b" stroke-width="2"/>
        <path d="M 12 22 Q 40 6 68 22 Q 40 38 12 22 Z" fill="#2c788c"/>
        <circle cx="40" cy="22" r="5" fill="#fff2cc"/>
      </pattern>

      <!-- Lower Wall Wainscoting Tile Pattern -->
      <pattern id="lowerWallPattern" width="90" height="140" patternUnits="userSpaceOnUse">
        <rect width="90" height="140" fill="#2b6170"/>
        <rect x="4" y="4" width="82" height="132" rx="6" fill="#347182" stroke="#1f4c59" stroke-width="2"/>
        <rect x="14" y="14" width="62" height="112" rx="4" fill="none" stroke="#488b9e" stroke-width="2" opacity="0.6"/>
      </pattern>

      <!-- Terracotta & Cream Warm Bathroom Floor Tile Pattern -->
      <pattern id="floorTilePattern" width="160" height="100" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
        <rect width="160" height="100" fill="#8f5336"/>
        <polygon points="0,0 80,0 80,50 0,50" fill="#b86b43" stroke="#6e3b23" stroke-width="3"/>
        <polygon points="80,0 160,0 160,50 80,50" fill="#d99b66" stroke="#6e3b23" stroke-width="3"/>
        <polygon points="0,50 80,50 80,100 0,100" fill="#d99b66" stroke="#6e3b23" stroke-width="3"/>
        <polygon points="80,50 160,50 160,100 80,100" fill="#b86b43" stroke="#6e3b23" stroke-width="3"/>
        <line x1="10" y1="10" x2="65" y2="10" stroke="#e8ba8e" stroke-width="2" opacity="0.35"/>
      </pattern>

      <!-- Woman's Housecoat Floral Pattern -->
      <pattern id="robePattern" width="70" height="70" patternUnits="userSpaceOnUse">
        <rect width="70" height="70" fill="#d94f70"/>
        <!-- Soft berry-pink fabric weave -->
        <circle cx="22" cy="22" r="10" fill="#ff9ebb" opacity="0.85"/>
        <circle cx="15" cy="18" r="6" fill="#ffb8ce"/>
        <circle cx="29" cy="18" r="6" fill="#ffb8ce"/>
        <circle cx="22" cy="11" r="6" fill="#ffb8ce"/>
        <circle cx="22" cy="29" r="6" fill="#ffb8ce"/>
        <circle cx="22" cy="20" r="4.5" fill="#ffe066"/>
        <!-- Second flower offset -->
        <circle cx="55" cy="54" r="9" fill="#ff9ebb" opacity="0.85"/>
        <circle cx="49" cy="50" r="5.5" fill="#ffd1e0"/>
        <circle cx="61" cy="50" r="5.5" fill="#ffd1e0"/>
        <circle cx="55" cy="44" r="5.5" fill="#ffd1e0"/>
        <circle cx="55" cy="60" r="5.5" fill="#ffd1e0"/>
        <circle cx="55" cy="52" r="4" fill="#ffe066"/>
        <!-- Leaves -->
        <path d="M 34 26 Q 44 22 40 32 Z" fill="#52b788"/>
        <path d="M 42 56 Q 34 62 38 50 Z" fill="#52b788"/>
      </pattern>

      <!-- Woman's Polka-Dot Apron Pattern -->
      <pattern id="apronPattern" width="44" height="44" patternUnits="userSpaceOnUse">
        <rect width="44" height="44" fill="#fff3d6"/>
        <path d="M 0 22 L 44 22 M 22 0 L 22 44" stroke="#f5dfad" stroke-width="1.5"/>
        <circle cx="11" cy="11" r="4.5" fill="#f28482" opacity="0.75"/>
        <circle cx="33" cy="33" r="4.5" fill="#84a59d" opacity="0.75"/>
      </pattern>

      <!-- Wicker Basket Texture Pattern (Left Warm Honey Rattan) -->
      <pattern id="wickerLeftPattern" width="48" height="28" patternUnits="userSpaceOnUse">
        <rect width="48" height="28" fill="#8c5319"/>
        <!-- Woven horizontal strands -->
        <rect x="2" y="2" width="20" height="11" rx="4" fill="#d99343" stroke="#693b0c" stroke-width="1.5"/>
        <rect x="26" y="2" width="20" height="11" rx="4" fill="#c47d2f" stroke="#693b0c" stroke-width="1.5"/>
        <rect x="-10" y="15" width="20" height="11" rx="4" fill="#c47d2f" stroke="#693b0c" stroke-width="1.5"/>
        <rect x="14" y="15" width="20" height="11" rx="4" fill="#e3a152" stroke="#693b0c" stroke-width="1.5"/>
        <rect x="38" y="15" width="20" height="11" rx="4" fill="#c47d2f" stroke="#693b0c" stroke-width="1.5"/>
        <!-- Vertical ribs -->
        <rect x="21" y="0" width="5" height="28" fill="#a66321" opacity="0.75"/>
        <rect x="45" y="0" width="5" height="28" fill="#a66321" opacity="0.75"/>
      </pattern>

      <!-- Wicker Basket Texture Pattern (Right Chestnut Rattan) -->
      <pattern id="wickerRightPattern" width="48" height="28" patternUnits="userSpaceOnUse">
        <rect width="48" height="28" fill="#6b3818"/>
        <rect x="2" y="2" width="20" height="11" rx="4" fill="#ba6d38" stroke="#4d250c" stroke-width="1.5"/>
        <rect x="26" y="2" width="20" height="11" rx="4" fill="#a35926" stroke="#4d250c" stroke-width="1.5"/>
        <rect x="-10" y="15" width="20" height="11" rx="4" fill="#a35926" stroke="#4d250c" stroke-width="1.5"/>
        <rect x="14" y="15" width="20" height="11" rx="4" fill="#c97b44" stroke="#4d250c" stroke-width="1.5"/>
        <rect x="38" y="15" width="20" height="11" rx="4" fill="#a35926" stroke="#4d250c" stroke-width="1.5"/>
        <rect x="21" y="0" width="5" height="28" fill="#82441b" opacity="0.75"/>
        <rect x="45" y="0" width="5" height="28" fill="#82441b" opacity="0.75"/>
      </pattern>

      <!-- Garment Fabric Patterns (Dynamically Colored via Opacity Overlays) -->
      <pattern id="clothStripes" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
        <rect width="16" height="32" fill="rgba(255,255,255,0.18)"/>
        <rect x="16" width="16" height="32" fill="rgba(0,0,0,0.07)"/>
      </pattern>

      <pattern id="clothDots" width="36" height="36" patternUnits="userSpaceOnUse">
        <circle cx="10" cy="10" r="5" fill="rgba(255,255,255,0.28)"/>
        <circle cx="28" cy="28" r="5" fill="rgba(255,255,255,0.28)"/>
      </pattern>

      <pattern id="clothArgyle" width="44" height="44" patternUnits="userSpaceOnUse">
        <polygon points="22,0 44,22 22,44 0,22" fill="rgba(255,255,255,0.16)"/>
        <line x1="0" y1="0" x2="44" y2="44" stroke="rgba(0,0,0,0.15)" stroke-width="2" stroke-dasharray="4 3"/>
        <line x1="44" y1="0" x2="0" y2="44" stroke="rgba(0,0,0,0.15)" stroke-width="2" stroke-dasharray="4 3"/>
      </pattern>

      <pattern id="clothZigzag" width="40" height="24" patternUnits="userSpaceOnUse">
        <path d="M 0 12 L 10 2 L 20 12 L 30 2 L 40 12" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>
        <path d="M 0 22 L 10 12 L 20 22 L 30 12 L 40 22" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="3" stroke-linecap="round"/>
      </pattern>

      <!-- Skin & Shading Gradients -->
      <radialGradient id="skinGrad" cx="45%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#ffe0cc"/>
        <stop offset="65%" stop-color="#f7bfa0"/>
        <stop offset="100%" stop-color="#e09875"/>
      </radialGradient>

      <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff6b8b" stop-opacity="0.65"/>
        <stop offset="100%" stop-color="#ff6b8b" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="brassPlaqueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fff3c4"/>
        <stop offset="20%" stop-color="#f0c45d"/>
        <stop offset="80%" stop-color="#b88222"/>
        <stop offset="100%" stop-color="#784f0b"/>
      </linearGradient>

      <linearGradient id="woodPlaqueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#5e3619"/>
        <stop offset="50%" stop-color="#45240e"/>
        <stop offset="100%" stop-color="#2b1506"/>
      </linearGradient>

      <linearGradient id="tealBadgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#287a8c"/>
        <stop offset="100%" stop-color="#144955"/>
      </linearGradient>

      <linearGradient id="plumBadgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#7a3263"/>
        <stop offset="100%" stop-color="#471637"/>
      </linearGradient>

      <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a8e6f0"/>
        <stop offset="45%" stop-color="#daf7fc"/>
        <stop offset="55%" stop-color="#89d4e3"/>
        <stop offset="100%" stop-color="#5bb0c4"/>
      </linearGradient>

      <!-- Soft Drop Shadows -->
      <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
        <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#12232b" flood-opacity="0.42"/>
      </filter>

      <filter id="garmentShadow" x="-20%" y="-20%" width="140%" height="145%">
        <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0d1b22" flood-opacity="0.48"/>
      </filter>
    </defs>

    <!-- ===================================================== -->
    <!-- 1. BACKGROUND: STORY-DRIVEN "ALIVE" BATHROOM SCENE    -->
    <!-- ===================================================== -->
    <g id="bathroom-background">
      <!-- Upper Tiled Wall -->
      <rect x="0" y="0" width="1920" height="440" fill="url(#wallTilePattern)"/>
      <!-- Decorative Dado Border -->
      <rect x="0" y="435" width="1920" height="44" fill="url(#dadoTilePattern)"/>
      <!-- Lower Wainscoting Wall -->
      <rect x="0" y="479" width="1920" height="230" fill="url(#lowerWallPattern)"/>
      <!-- Baseboard Molding -->
      <rect x="0" y="695" width="1920" height="22" fill="#d9a76a" stroke="#7d5224" stroke-width="3"/>

      <!-- Perspective Terracotta Tiled Floor -->
      <rect x="0" y="717" width="1920" height="363" fill="url(#floorTilePattern)"/>
      <!-- Ambient Floor Vignette & Depth Shading -->
      <rect x="0" y="717" width="1920" height="45" fill="rgba(25, 12, 5, 0.28)"/>

      <!--LEFT SIDE: Spinning Front-Load Washing Machine & Laundry Shelf -->
      <g id="washing-machine-area" class="washer-rumble" style="cursor: pointer;">
        <!-- Shadow under washer -->
        <ellipse cx="290" cy="738" rx="175" ry="26" fill="rgba(20, 10, 4, 0.45)"/>
        <!-- Washer Body -->
        <rect x="135" y="250" width="310" height="480" rx="28" fill="#f4efe6" stroke="#8b9bb4" stroke-width="5"/>
        <!-- Side 3D Bevel -->
        <path d="M 163 250 L 145 250 Q 135 250 135 278 L 135 702 Q 135 730 155 730 L 170 730 Z" fill="#cfd8e3"/>
        <!-- Top Lid Countertop -->
        <rect x="128" y="238" width="324" height="24" rx="8" fill="#d99b52" stroke="#7d4e1d" stroke-width="4"/>
        <!-- Control Panel Header -->
        <rect x="145" y="268" width="290" height="72" rx="10" fill="#d9e4ec" stroke="#9fb1c2" stroke-width="3"/>
        <!-- Soap Dispenser Drawer -->
        <rect x="160" y="282" width="88" height="44" rx="6" fill="#e9f1f7" stroke="#8a9fb0" stroke-width="2.5"/>
        <path d="M 180 304 L 228 304" stroke="#6c8294" stroke-width="5" stroke-linecap="round"/>
        <!-- Rotary Program Dial -->
        <circle cx="295" cy="304" r="22" fill="#f7fbff" stroke="#5a7184" stroke-width="4"/>
        <circle cx="295" cy="304" r="14" fill="#e0a94f"/>
        <line x1="295" y1="304" x2="306" y2="293" stroke="#3b2309" stroke-width="4" stroke-linecap="round"/>
        <!-- Glowing Indicator LEDs (No text/numbers!) -->
        <rect x="342" y="284" width="76" height="38" rx="8" fill="#233b47" stroke="#5c788a" stroke-width="2"/>
        <circle cx="362" cy="303" r="6" fill="#52f296"/>
        <circle cx="382" cy="303" r="6" fill="#ffd166"/>
        <circle cx="402" cy="303" r="6" fill="#ff6b6b"/>

        <!-- Porthole Outer Ring -->
        <circle cx="290" cy="455" r="108" fill="#b8c7d4" stroke="#697d8f" stroke-width="5"/>
        <circle cx="290" cy="455" r="92" fill="#8599ab" stroke="#4d6070" stroke-width="4"/>
        <!-- Porthole Dark Drum Interior -->
        <circle cx="290" cy="455" r="80" fill="#1e3c4c"/>

        <!-- Rotating Clothes inside Drum -->
        <g class="drum-spin">
          <path d="M 230 435 Q 265 390 315 415 Q 355 445 320 495 Q 275 515 235 475 Z" fill="#ff6b8b"/>
          <path d="M 255 485 Q 305 525 345 465 Q 360 420 310 400 Q 275 430 255 485 Z" fill="#ffd166"/>
          <path d="M 220 460 Q 250 510 295 495 Q 315 450 265 425 Z" fill="#4cc9f0"/>
          <circle cx="265" cy="430" r="10" fill="#ffffff" opacity="0.6"/>
          <circle cx="315" cy="475" r="14" fill="#ffffff" opacity="0.5"/>
          <circle cx="280" cy="495" r="8" fill="#ffffff" opacity="0.7"/>
        </g>

        <!-- Sloshing Soapy Water Wave in Drum -->
        <path d="M 212 468 Q 250 452 290 468 Q 330 484 368 468 A 80 80 0 0 1 212 468 Z" fill="#7ce0f5" opacity="0.65"/>
        <!-- Foam Suds Layer -->
        <path d="M 214 468 Q 232 456 250 467 Q 270 455 290 468 Q 310 456 330 468 Q 350 458 366 468" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
        <!-- Glass Dome Reflection -->
        <path d="M 230 405 Q 280 375 335 405 Q 290 395 245 435 Z" fill="#ffffff" opacity="0.38"/>
        <!-- Door Hinge & Handle -->
        <rect x="376" y="435" width="20" height="42" rx="6" fill="#6c8091" stroke="#455563" stroke-width="2"/>

        <!-- Detergent Bottle & Folded Towels on Top of Washer -->

  // ============================================================================
  // 2. PROCEDURAL WEB AUDIO SYNTHESIZER (NO EXTERNAL FILES, RICH FEEDBACK)
  // ============================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Soft fabric rustle / snap when picking up or throwing laundry
    playClothWhoosh(pitchMultiplier = 1) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      // White noise burst filtered for fabric swoosh
      const bufferSize = this.ctx.sampleRate * 0.22;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(380 * pitchMultiplier, now);
      filter.frequency.exponentialRampToValueAtTime(1100 * pitchMultiplier, now + 0.18);
      filter.Q.value = 1.8;

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    }

    // Bubble pop sound
    playBubblePop(freq = 650) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 2.1, now + 0.085);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    }

    // 3 Varied Joyful Celebrations + Cheerful Chuckle
    playSuccess(variant = 0) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      // Soft basket thud
      const thudOsc = this.ctx.createOscillator();
      const thudGain = this.ctx.createGain();
      thudOsc.type = 'triangle';
      thudOsc.frequency.setValueAtTime(140, now);
      thudOsc.frequency.exponentialRampToValueAtTime(52, now + 0.14);
      thudGain.gain.setValueAtTime(0.32, now);
      thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      thudOsc.connect(thudGain);
      thudGain.connect(this.ctx.destination);
      thudOsc.start(now);
      thudOsc.stop(now + 0.16);

      // Melodic Chime Variations
      const melodies = [
        [523.25, 659.25, 783.99, 1046.50], // C5 E5 G5 C6
        [587.33, 739.99, 880.00, 1174.66], // D5 F#5 A5 D6
        [440.00, 554.37, 659.25, 880.00, 1108.73] // A4 C#5 E5 A5 C#6
      ];
      const notes = melodies[variant % melodies.length];

      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        const startTime = now + 0.05 + idx * 0.075;
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(0.22, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.36);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.38);
      });

      // Playful bubbly pops & warm chuckle synth bursts
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          this.playBubblePop(500 + i * 160);
        }, 120 + i * 75);
      }
    }

    // 3 Varied Comical Mistake Sounds (Boing / Tuba Womp / Squeaky Bounce)
    playMistake(variant = 0) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      if (variant % 3 === 0) {
        // Elastic Spring Boing
        const osc = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.18);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.48);

        lfo.frequency.value = 28;
        lfoGain.gain.value = 45;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        lfo.start(now);
        osc.stop(now + 0.52);
        lfo.stop(now + 0.52);
      } else if (variant % 3 === 1) {
        // Comical Tuba Womp-Womp
        const notes = [
          { f1: 240, f2: 215, start: 0, dur: 0.22 },
          { f1: 205, f2: 145, start: 0.24, dur: 0.36 }
        ];
        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(n.f1, now + n.start);
          osc.frequency.linearRampToValueAtTime(n.f2, now + n.start + n.dur);

          filter.type = 'lowpass';
          filter.frequency.value = 650;

          gain.gain.setValueAtTime(0.24, now + n.start);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + n.start);
          osc.stop(now + n.start + n.dur + 0.02);
        });
      } else {
        // Slippery Soap Squeak + Low Bounce
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(780, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.16);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.28);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.45);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.48);
      }
    }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

    shine.setAttribute('cx', -radius * 0.35);

    shine.setAttribute('opacity', '0.75');

    g.appendChild(c);

    particlesLayer.appendChild(g);

    return {

      r: radius,
      vy: -0.6 - Math.random() * 1.1,

    sound.playClothWhoosh(0.95);

    const targetX = targetCategory === 'both' ? 380 : 1540;
    const targetY = 675; // Rim of the basket

    // Set woman lean toward target basket during throw
    womanEmotion = targetCategory === 'both' ? 'aim_left' : 'aim_right';
    emotionTimer = 24;

    // Parabolic control point high in the air between start and target
    const ctrlX = (garmentPos.x + targetX) * 0.5;
    const ctrlY = Math.min(garmentPos.y, targetY) - 260;

    throwAnim = {
      startX: garmentPos.x,
      startY: garmentPos.y,
      ctrlX,
      ctrlY,
      endX: targetX,
      endY: targetY,
      progress: 0,
      speed: 0.045,
      targetCategory,
      isCorrect,
      returning: false

    basketLeftEl.classList.remove('basket-highlight');

  // ============================================================================

  // ============================================================================
  const sceneSvg = document.getElementById('scene-svg');

  function clientToSvgCoords(clientX, clientY) {
    const pt = sceneSvg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    const ctm = sceneSvg.getScreenCTM();
    if (!ctm) return { x: 960, y: 540 };
    return pt.matrixTransform(ctm.inverse());
  }

  activeGarmentGroup.addEventListener('pointerdown', (e) => {
    if (throwAnim) return;
    sound.init();
    sound.playClothWhoosh(1.2);
    isDragging = true;
    activeGarmentGroup.setPointerCapture(e.pointerId);

    const svgPt = clientToSvgCoords(e.clientX, e.clientY);
    dragStartPointer = { x: svgPt.x, y: svgPt.y };
    dragOffset = { x: garmentPos.x - svgPt.x, y: garmentPos.y - svgPt.y };
  });

  window.addEventListener('pointermove', (e) => {
    const svgPt = clientToSvgCoords(e.clientX, e.clientY);
    pointerPos = svgPt;

    if (!isDragging || throwAnim) return;

    garmentPos.x = Math.max(160, Math.min(1760, svgPt.x + dragOffset.x));
    garmentPos.y = Math.max(150, Math.min(920, svgPt.y + dragOffset.y));
    garmentPos.rot = (garmentPos.x - HOME_POS.x) * 0.035;
    garmentPos.scale = 1.06;

    // Check proximity to Left or Right Basket
    const distLeft = Math.hypot(garmentPos.x - 380, garmentPos.y - 720);
    const distRight = Math.hypot(garmentPos.x - 1540, garmentPos.y - 720);

    if (distLeft < 340 || garmentPos.x < 680) {
      hoveredBasket = 'both';
      basketLeftEl.classList.add('basket-highlight');
      basketRightEl.classList.remove('basket-highlight');
      womanEmotion = 'aim_left';
    } else if (distRight < 340 || garmentPos.x > 1240) {
      hoveredBasket = 'only';
      basketRightEl.classList.add('basket-highlight');
      basketLeftEl.classList.remove('basket-highlight');
      womanEmotion = 'aim_right';
    } else {
      hoveredBasket = null;
      basketLeftEl.classList.remove('basket-highlight');
      basketRightEl.classList.remove('basket-highlight');
      womanEmotion = 'idle';
    }
  });

  window.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;

    if (hoveredBasket) {
      triggerThrowToBasket(hoveredBasket);
      hoveredBasket = null;
    } else {
      // Check if player flicked quickly left or right
      const svgPt = clientToSvgCoords(e.clientX, e.clientY);
      const dx = svgPt.x - dragStartPointer.x;
      if (dx < -160) {
        triggerThrowToBasket('both');
      } else if (dx > 160) {
        triggerThrowToBasket('only');
      } else {
        womanEmotion = 'idle';
      }
    }

    if (!isDragging && !throwAnim && emotionTimer <= 0) womanEmotion = 'idle';

  basketRightEl.addEventListener('pointerenter', () => {

  const btnRu = document.getElementById('lang-ru');

  function switchLanguage(lang) {
    if (currentLang === lang) return;
    currentLang = lang;
    btnUa.classList.toggle('active', lang === 'ua');
    btnRu.classList.toggle('active', lang === 'ru');
    refillDeck();
    throwAnim = null;
    spawnNextGarment(true);
  }

  btnUa.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    switchLanguage('ua');
  });
  btnRu.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    switchLanguage('ru');
  });

  // ============================================================================
  // 10. ARTICULATED WOMAN & SCENE ANIMATION LOOP (60 FPS)
  // ============================================================================
  const womanUpperBody = document.getElementById('woman-upper-body');
  const womanBelly = document.getElementById('woman-belly');
  const womanHead = document.getElementById('woman-head');
  const pupilLeft = document.getElementById('pupil-left');
  const pupilRight = document.getElementById('pupil-right');
  const eyelidLeft = document.getElementById('eyelid-left');
  const eyelidRight = document.getElementById('eyelid-right');
  const browLeft = document.getElementById('brow-left');
  const browRight = document.getElementById('brow-right');
  const cheekLeft = document.getElementById('cheek-left');
  const cheekRight = document.getElementById('cheek-right');
  const noseCrinkle = document.getElementById('nose-crinkle');

  const mouthSmile = document.getElementById('mouth-smile');
  const mouthLaugh = document.getElementById('mouth-laugh');
  const mouthShock = document.getElementById('mouth-shock');
  const mouthPout = document.getElementById('mouth-pout');

  const armLeftSleeve = document.getElementById('arm-left-sleeve');
  const armLeftSkin = document.getElementById('arm-left-skin');
  const armRightSleeve = document.getElementById('arm-right-sleeve');
  const armRightSkin = document.getElementById('arm-right-skin');
  const handLeft = document.getElementById('hand-left');
  const handRight = document.getElementById('hand-right');
  const faucetDrip = document.getElementById('faucet-drip');

  let frameCount = 0;

  function setMouth(type) {
    mouthSmile.setAttribute('opacity', type === 'smile' ? '1' : '0');
    mouthLaugh.setAttribute('opacity', type === 'laugh' ? '1' : '0');
    mouthShock.setAttribute('opacity', type === 'shock' ? '1' : '0');
    mouthPout.setAttribute('opacity', type === 'pout' ? '1' : '0');
  }

  function updateArmRig(leftHandX, leftHandY, rightHandX, rightHandY) {
    // Left Shoulder is at (815, 435), Right Shoulder is at (1105, 435)
    const lElbowX = (815 + leftHandX) * 0.5 - 38;
    const lElbowY = (435 + leftHandY) * 0.5 + 22;

    const rElbowX = (1105 + rightHandX) * 0.5 + 38;
    const rElbowY = (435 + rightHandY) * 0.5 + 22;

    armLeftSleeve.setAttribute('d', `M 815 435 Q ${lElbowX} ${lElbowY} ${(lElbowX + leftHandX) * 0.5} ${(lElbowY + leftHandY) * 0.5}`);
    armLeftSkin.setAttribute('d', `M ${(lElbowX + leftHandX) * 0.5} ${(lElbowY + leftHandY) * 0.5} L ${leftHandX} ${leftHandY}`);

    armRightSleeve.setAttribute('d', `M 1105 435 Q ${rElbowX} ${rElbowY} ${(rElbowX + rightHandX) * 0.5} ${(rElbowY + rightHandY) * 0.5}`);
    armRightSkin.setAttribute('d', `M ${(rElbowX + rightHandX) * 0.5} ${(rElbowY + rightHandY) * 0.5} L ${rightHandX} ${rightHandY}`);

    handLeft.setAttribute('transform', `translate(${leftHandX - 775}, ${leftHandY - 565})`);
    handRight.setAttribute('transform', `translate(${rightHandX - 1145}, ${rightHandY - 565})`);
  }

  function animateScene() {
    frameCount++;
    const t = frameCount * 0.05;

    // 1. Update Garment Parabolic Throw or Elastic Return
    if (throwAnim) {
      throwAnim.progress += throwAnim.speed;
      const p = Math.min(1, throwAnim.progress);
      const inv = 1 - p;

      // Quadratic Bezier interpolation
      garmentPos.x = inv * inv * throwAnim.startX + 2 * inv * p * throwAnim.ctrlX + p * p * throwAnim.endX;
      garmentPos.y = inv * inv * throwAnim.startY + 2 * inv * p * throwAnim.ctrlY + p * p * throwAnim.endY;

      if (!throwAnim.returning) {
        // Flying toward basket
        garmentPos.scale = 1 - p * 0.52;
        garmentPos.rot = (throwAnim.targetCategory === 'both' ? -1 : 1) * p * 380;

        if (p >= 1) {
          if (throwAnim.isCorrect) {
            // CORRECT SORT!
            const variant = successVariantCounter++;
            sound.playSuccess(variant);
            addGarmentToBasketPile(throwAnim.targetCategory, currentTask.palette);
            spawnBasketBurst(throwAnim.endX, throwAnim.endY, true);

            if (throwAnim.targetCategory === 'both') basketBounceLeft = 1;
            else basketBounceRight = 1;

            womanEmotion = `success_${variant % 3}`;
            emotionTimer = 52;
            throwAnim = null;

            // Hide garment briefly inside basket, then pull out next garment
            garmentPos.scale = 0;
            setTimeout(() => {
              spawnNextGarment(true);
            }, 680);
          } else {
            // MISTAKE! Bounce back from basket to woman's hands
            const variant = mistakeVariantCounter++;
            sound.playMistake(variant);
            spawnBasketBurst(throwAnim.endX, throwAnim.endY, false);

            if (throwAnim.targetCategory === 'both') basketBounceLeft = -1;
            else basketBounceRight = -1;

            womanEmotion = `mistake_${variant % 3}`;
            emotionTimer = 55;

            // Reverse trajectory back to HOME_POS
            throwAnim = {
              startX: garmentPos.x,
              startY: garmentPos.y,
              ctrlX: (garmentPos.x + HOME_POS.x) * 0.5,
              ctrlY: 260,
              endX: HOME_POS.x,
              endY: HOME_POS.y,
              progress: 0,
              speed: 0.048,
              targetCategory: throwAnim.targetCategory,
              isCorrect: false,
              returning: true
            };
          }
        }
      } else {
        // Returning back to woman's hands after bounce
        garmentPos.scale = 0.48 + p * 0.52;
        garmentPos.rot = (1 - p) * 360;
        if (p >= 1) {
          garmentPos.x = HOME_POS.x;
          garmentPos.y = HOME_POS.y;
          garmentPos.scale = 1;
          garmentPos.rot = 0;
          throwAnim = null;
        }
      }
    } else if (!isDragging) {
      // Smoothly settle garment into woman's breathing hands
      const breathOffset = Math.sin(t * 1.1) * 6;
      garmentPos.x += (HOME_POS.x - garmentPos.x) * 0.18;
      garmentPos.y += (HOME_POS.y + breathOffset - garmentPos.y) * 0.18;
      garmentPos.scale += (1 - garmentPos.scale) * 0.18;
      garmentPos.rot += (Math.sin(t * 0.7) * 1.5 - garmentPos.rot) * 0.18;
    }

    // Apply Garment Transform
    activeGarmentGroup.setAttribute(
      'transform',
      `translate(${garmentPos.x.toFixed(1)}, ${garmentPos.y.toFixed(1)}) rotate(${garmentPos.rot.toFixed(1)}) scale(${garmentPos.scale.toFixed(3)})`
    );

    // 2. Basket Squash & Stretch Bounce Animation
    if (Math.abs(basketBounceLeft) > 0.01) {
      basketBounceLeft *= 0.84;
      const sx = 1 + Math.sin(basketBounceLeft * Math.PI * 3) * 0.12;
      const sy = 1 - Math.sin(basketBounceLeft * Math.PI * 3) * 0.1;
      basketLeftEl.setAttribute('transform', `translate(380, 770) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`);
    } else {
      basketLeftEl.setAttribute('transform', 'translate(380, 770)');
    }

    if (Math.abs(basketBounceRight) > 0.01) {
      basketBounceRight *= 0.84;
      const sx = 1 + Math.sin(basketBounceRight * Math.PI * 3) * 0.12;
      const sy = 1 - Math.sin(basketBounceRight * Math.PI * 3) * 0.1;
      basketRightEl.setAttribute('transform', `translate(1540, 770) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`);
    } else {
      basketRightEl.setAttribute('transform', 'translate(1540, 770)');
    }

    // 3. Woman's Continuous Breathing, Swaying, Facial Expressions & Arm Rigging
    if (emotionTimer > 0) {
      emotionTimer--;
      if (emotionTimer === 0 && !isDragging) {
        womanEmotion = 'idle';
      }
    }

    // Natural Blinking
    const isBlinking = frameCount % 210 < 7;
    eyelidLeft.setAttribute('opacity', isBlinking ? '1' : '0');
    eyelidRight.setAttribute('opacity', isBlinking ? '1' : '0');

    // Default Body Transform Values
    let bodyTilt = Math.sin(t * 0.65) * 1.1;
    let bodyY = Math.sin(t * 1.1) * 4;
    let bellyScaleX = 1 + Math.sin(t * 1.1) * 0.022;
    let bellyScaleY = 1 + Math.cos(t * 1.1) * 0.022;
    let headRot = Math.sin(t * 0.5) * 2;
    let headY = 0;

    // Default Hand Grip Positions on Garment
    const gripL = currentTask ? currentTask.shape.leftGrip : { x: -185, y: -20 };
    const gripR = currentTask ? currentTask.shape.rightGrip : { x: 185, y: -20 };

    let leftHX = garmentPos.x + gripL.x * Math.min(1, garmentPos.scale);
    let leftHY = garmentPos.y + gripL.y * Math.min(1, garmentPos.scale);
    let rightHX = garmentPos.x + gripR.x * Math.min(1, garmentPos.scale);
    let rightHY = garmentPos.y + gripR.y * Math.min(1, garmentPos.scale);

    // Clamp hand reach so her arms don't stretch across the entire room when dragging far
    leftHX = Math.max(660, Math.min(930, leftHX));
    leftHY = Math.max(320, Math.min(730, leftHY));
    rightHX = Math.max(990, Math.min(1260, rightHX));
    rightHY = Math.max(320, Math.min(730, rightHY));

    // Reset subtle facial features
    noseCrinkle.setAttribute('opacity', '0');
    cheekLeft.setAttribute('r', '28');
    cheekRight.setAttribute('r', '28');

    // Pupil tracking toward garment or pointer
    const lookTargetX = isDragging || throwAnim ? garmentPos.x : pointerPos.x;
    const lookTargetY = isDragging || throwAnim ? garmentPos.y : pointerPos.y;
    const px = Math.max(-7, Math.min(7, (lookTargetX - 960) * 0.012));
    const py = Math.max(-5, Math.min(5, (lookTargetY - 285) * 0.012));
    pupilLeft.setAttribute('transform', `translate(${px.toFixed(1)}, ${py.toFixed(1)})`);
    pupilRight.setAttribute('transform', `translate(${px.toFixed(1)}, ${py.toFixed(1)})`);

    // Evaluate Emotion States
    if (womanEmotion === 'idle' || womanEmotion === 'pickup') {
      if (currentTask && currentTask.isDirty && Math.sin(t * 0.8) > 0.35) {
        // Funny sniffing crinkled nose when holding dirty clothes!
        setMouth('pout');
        noseCrinkle.setAttribute('opacity', '1');
        browLeft.setAttribute('d', 'M 896 258 Q 920 264 942 250');
        browRight.setAttribute('d', 'M 978 250 Q 1000 264 1024 258');
        headRot = Math.sin(t * 4) * 3.5;
      } else {
        setMouth('smile');
        browLeft.setAttribute('d', 'M 896 254 Q 920 242 942 254');
        browRight.setAttribute('d', 'M 978 254 Q 1000 242 1024 254');
      }
    } else if (womanEmotion === 'aim_left') {
      bodyTilt = -6.5;
      headRot = -8;
      setMouth('smile');
      browLeft.setAttribute('d', 'M 896 246 Q 920 232 942 248');
      browRight.setAttribute('d', 'M 978 252 Q 1000 242 1024 254');
    } else if (womanEmotion === 'aim_right') {
      bodyTilt = 6.5;
      headRot = 8;
      setMouth('smile');
      browLeft.setAttribute('d', 'M 896 254 Q 920 242 942 252');
      browRight.setAttribute('d', 'M 978 248 Q 1000 232 1024 246');
    } else if (womanEmotion === 'success_0') {
      // SUCCESS 1: Big Belly Laugh & Clapping Hands!
      setMouth('laugh');
      headRot = Math.sin(t * 5) * 6;
      headY = -8 + Math.sin(t * 7) * 5;
      bodyY = Math.sin(t * 7) * 9;
      bellyScaleX = 1.06 + Math.sin(t * 9) * 0.05;
      bellyScaleY = 0.96 - Math.sin(t * 9) * 0.04;
      cheekLeft.setAttribute('r', '34');
      cheekRight.setAttribute('r', '34');
      browLeft.setAttribute('d', 'M 894 244 Q 920 230 942 246');
      browRight.setAttribute('d', 'M 978 246 Q 1000 230 1026 244');
      // Clapping hands in front of chest
      const clapSpread = Math.abs(Math.sin(t * 7)) * 48;
      leftHX = 935 - clapSpread;
      leftHY = 485 + Math.cos(t * 7) * 12;
      rightHX = 985 + clapSpread;
      rightHY = 485 - Math.cos(t * 7) * 12;
    } else if (womanEmotion === 'success_1') {
      // SUCCESS 2: Happy Shimmy Shoulder Dance & Wink!
      setMouth('laugh');
      eyelidRight.setAttribute('opacity', '1'); // Winking right eye!
      bodyTilt = Math.sin(t * 7) * 7;
      headRot = -Math.sin(t * 7) * 8;
      bellyScaleX = 1.04 + Math.cos(t * 7) * 0.04;
      cheekLeft.setAttribute('r', '33');
      cheekRight.setAttribute('r', '33');
      leftHX = 765 + Math.sin(t * 7) * 35;
      leftHY = 440 + Math.cos(t * 7) * 25;
      rightHX = 1155 + Math.sin(t * 7) * 35;
      rightHY = 440 - Math.cos(t * 7) * 25;
    } else if (womanEmotion === 'success_2') {
      // SUCCESS 3: Joyful Arms Raised Celebration!
      setMouth('laugh');
      headY = -6;
      bodyY = -8 + Math.sin(t * 6) * 6;
      browLeft.setAttribute('d', 'M 894 242 Q 920 228 942 244');
      browRight.setAttribute('d', 'M 978 244 Q 1000 228 1026 242');
      leftHX = 755 - Math.sin(t * 6) * 20;
      leftHY = 320 + Math.cos(t * 6) * 20;
      rightHX = 1165 + Math.sin(t * 6) * 20;
      rightHY = 320 + Math.cos(t * 6) * 20;
    } else if (womanEmotion === 'mistake_0') {
      // MISTAKE 1: Comical Shock — Hands on Plump Cheeks & O-Mouth!
      setMouth('shock');
      headRot = Math.sin(t * 8) * 5;
      browLeft.setAttribute('d', 'M 894 238 Q 920 222 942 242');
      browRight.setAttribute('d', 'M 978 242 Q 1000 222 1026 238');
      leftHX = 875;
      leftHY = 335;
      rightHX = 1045;
      rightHY = 335;
    } else if (womanEmotion === 'mistake_1') {
      // MISTAKE 2: Puffed Cheeks, Head Shake & Scratching Curlers!
      setMouth('pout');
      cheekLeft.setAttribute('r', '36');
      cheekRight.setAttribute('r', '36');
      headRot = Math.sin(t * 6.5) * 11;
      browLeft.setAttribute('d', 'M 896 260 Q 920 248 942 262');
      browRight.setAttribute('d', 'M 978 244 Q 1000 232 1024 248');
      leftHX = 815;
      leftHY = 515;
      rightHX = 1055;
      rightHY = 210 + Math.sin(t * 8) * 14; // Scratching head curler
    } else if (womanEmotion === 'mistake_2') {
      // MISTAKE 3: Funny Facepalm / Covering Eyes!
      setMouth('shock');
      headRot = -6 + Math.sin(t * 5) * 4;
      leftHX = 915;
      leftHY = 295;
      rightHX = 1005;
      rightHY = 295;
    }

    // Apply Articulated Body Transforms
    womanUpperBody.setAttribute(
      'transform',
      `translate(0, ${bodyY.toFixed(1)}) rotate(${bodyTilt.toFixed(2)}, 960, 750)`
    );
    womanBelly.setAttribute(
      'transform',
      `translate(960, 640) scale(${bellyScaleX.toFixed(3)}, ${bellyScaleY.toFixed(3)}) translate(-960, -640)`
    );
    womanHead.setAttribute(
      'transform',
      `translate(0, ${headY.toFixed(1)}) rotate(${headRot.toFixed(2)}, 960, 340)`
    );

    updateArmRig(leftHX, leftHY, rightHX, rightHY);

    // 4. Animate Bathtub Faucet Water Drip
    dripProgress = (dripProgress + 0.012) % 1;
    const dripY = dripProgress * dripProgress * 105;
    const dripScale = dripProgress < 0.25 ? dripProgress * 4 : 1;
    const dripOpacity = dripProgress > 0.85 ? (1 - dripProgress) * 6 : 0.9;
    faucetDrip.setAttribute(
      'transform',
      `translate(0, ${dripY.toFixed(1)}) translate(1705, 405) scale(${dripScale.toFixed(2)}) translate(-1705, -405)`
    );
    faucetDrip.setAttribute('opacity', dripOpacity.toFixed(2));

    // 5. Update Ambient Floating Soap Bubbles
    for (let i = 0; i < ambientBubbles.length; i++) {
      const b = ambientBubbles[i];
      b.y += b.vy;
      b.phase += b.wobbleSpeed;
      const bx = b.x + Math.sin(b.phase) * b.wobbleAmp * 12;

      if (b.y < -40) {
        b.y = 1090;
        b.x = 150 + Math.random() * 1620;
      }
      b.el.setAttribute('transform', `translate(${bx.toFixed(1)}, ${b.y.toFixed(1)})`);
    }

    // 6. Update Celebration / Bounce Burst Particles
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const p = burstParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.28; // Gravity
      p.rot += p.vRot;
      p.life -= p.decay;

      if (p.life <= 0) {
        p.el.remove();
        burstParticles.splice(i, 1);
      } else {
        p.el.setAttribute(
          'transform',
          `translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(1)}) scale(${p.life.toFixed(2)})`
        );
        p.el.setAttribute('opacity', p.life.toFixed(2));
      }
    }

    requestAnimationFrame(animateScene);
  }

  // Initialize Game on Load
  window.onload = () => {
    refillDeck();
    spawnNextGarment(false);
    requestAnimationFrame(animateScene);
  };
</script>
</body>
</html>
