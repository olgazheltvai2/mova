<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jar Anagram Game</title>
<style>
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0}
  body,html{width:100vw;height:100vh;overflow:hidden;font-family:'Segoe UI','Comic Sans MS',sans-serif;background:#2b1810}
  #game-stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
  .hud-bar{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;z-index:30;pointer-events:none}
  .hud-group{display:flex;gap:12px;pointer-events:auto}
  .wood-btn{width:62px;height:62px;border-radius:50%;border:4px solid #5c2e0e;background:radial-gradient(circle at 30% 30%,#ffcf6b,#d88a28 70%,#9e580c 100%);box-shadow:0 6px 0 #4a2308,0 10px 18px rgba(0,0,0,.45),inset 0 3px 4px rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.34,1.56,.64,1);position:relative}
  .wood-btn:hover{transform:translateY(-3px) scale(1.06)}
  .wood-btn:active{transform:translateY(4px) scale(.96);box-shadow:0 2px 0 #4a2308,0 4px 8px rgba(0,0,0,.4)}
  .lang-btn{width:auto;min-width:120px;padding:0 20px;border-radius:32px;font-size:22px;font-weight:900;color:#fff;letter-spacing:1px;gap:9px;background:radial-gradient(circle at 30% 30%,#80ff72,#2bb626 75%,#167012 100%);border-color:#0e4b0b;box-shadow:0 6px 0 #0b3808,0 10px 18px rgba(0,0,0,.45),inset 0 3px 4px rgba(255,255,255,.7);text-shadow:0 2px 2px rgba(0,0,0,.45)}
  #lang-flag{display:flex;align-items:center}
  #play-area{position:relative;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:24px}
  #jar-wrapper{position:relative;width:min(430px,84vw);height:min(490px,60vh);display:flex;align-items:center;justify-content:center;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .4s;z-index:20;margin-bottom:10px}
  #jar-wrapper.slide-out{transform:translateX(-120vw) rotate(-18deg) scale(.8);opacity:0}
  #jar-wrapper.slide-in{animation:jarArrive .65s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes jarArrive{0%{transform:translateX(110vw) rotate(15deg) scale(.8);opacity:0}70%{transform:translateX(-12px) rotate(-3deg) scale(1.03);opacity:1}100%{transform:translateX(0) rotate(0) scale(1);opacity:1}}
  #jar-lid{transform-origin:200px 65px;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
  .jar-solved #jar-lid{animation:lidPop .9s cubic-bezier(.34,1.56,.64,1)}
  @keyframes lidPop{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-55px) rotate(-10deg) scale(1.08)}65%{transform:translateY(-40px) rotate(8deg) scale(1.05)}100%{transform:translateY(0) rotate(0) scale(1)}}
  #jar-prize{opacity:0;transform:scale(.2) translateY(60px);transform-origin:200px 280px;transition:opacity .5s ease,transform .7s cubic-bezier(.34,1.56,.64,1)}
  .jar-solved #jar-prize{opacity:1;transform:scale(1) translateY(0)}
  #jar-letters-layer{position:absolute;inset:22% 11% 12% 11%;z-index:20;pointer-events:none}
  .jar-letter{position:absolute;width:clamp(66px,13vw,84px);height:clamp(66px,13vw,84px);margin-left:calc(clamp(66px,13vw,84px)/-2);margin-top:calc(clamp(66px,13vw,84px)/-2);border-radius:22px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,7.5vw,52px);font-weight:900;color:#fff8ea;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 12px rgba(255,255,255,.3);box-shadow:0 7px 0 rgba(0,0,0,.28),0 10px 16px rgba(0,0,0,.25),inset 0 4px 6px rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.65);transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .25s;animation:floatLetter 3.2s ease-in-out infinite alternate}
  .jar-letter:hover{transform:scale(1.16) rotate(0)!important;z-index:25;filter:brightness(1.1)}
  .jar-letter.used{transform:scale(.1) translateY(80px)!important;opacity:0;pointer-events:none}
  @keyframes floatLetter{0%{translate:0 -5px}100%{translate:0 6px}}
  #word-board{position:relative;z-index:25;display:flex;gap:clamp(10px,2vw,18px);padding:16px 26px;border-radius:36px;background:repeating-linear-gradient(45deg,#8c4a19,#8c4a19 16px,#7a3e12 16px,#7a3e12 32px);border:5px solid #4d2206;box-shadow:0 10px 0 #331502,0 18px 28px rgba(0,0,0,.55),inset 0 4px 8px rgba(255,210,140,.45)}
  .letter-slot{width:clamp(68px,13.5vw,88px);height:clamp(74px,14.5vw,94px);border-radius:22px;background:radial-gradient(circle at 50% 35%,#52260a,#361704 85%);border:3px dashed #c88746;box-shadow:inset 0 6px 10px rgba(0,0,0,.7),0 2px 0 rgba(255,215,150,.35);display:flex;align-items:center;justify-content:center;font-size:clamp(40px,8vw,54px);font-weight:900;color:#fff;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
  .letter-slot.filled{border-style:solid;border-color:#fff2bd;text-shadow:0 3px 0 rgba(0,0,0,.35);box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 4px 6px rgba(255,255,255,.5);animation:slotPop .3s cubic-bezier(.34,1.56,.64,1)}
  .letter-slot.filled:hover{transform:translateY(-4px) scale(1.05)}
  @keyframes slotPop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  #word-board.error-shake{animation:boardShake .55s ease}
  @keyframes boardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-16px) rotate(-2deg)}40%{transform:translateX(16px) rotate(2deg)}60%{transform:translateX(-12px) rotate(-1deg)}80%{transform:translateX(12px) rotate(1deg)}}
  #word-board.success-glow .letter-slot{border-color:#ffd700;box-shadow:0 0 22px #ffea00,inset 0 4px 8px rgba(255,255,255,.8);animation:slotWinJump .6s ease infinite alternate}
  @keyframes slotWinJump{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-10px) scale(1.06)}}
  /* Персонаж ЗА СТОЛОМ, тепер з ногами */
  #character-box{position:absolute;bottom:160px;left:max(2vw,calc(50% - 470px));width:clamp(170px,24vw,250px);height:clamp(210px,30vw,300px);z-index:15;pointer-events:auto;cursor:pointer;transform-origin:bottom center;animation:pandaBreathe 3s ease-in-out infinite alternate}
  @keyframes pandaBreathe{0%{transform:scaleY(1) scaleX(1)}100%{transform:scaleY(1.03) scaleX(.98)}}
  #character-box.happy-jump{animation:pandaHappy .55s cubic-bezier(.34,1.56,.64,1) 4 alternate}
  @keyframes pandaHappy{0%{transform:translateY(0) rotate(-4deg) scale(1)}100%{transform:translateY(-38px) rotate(6deg) scale(1.08)}}
  #character-box.sad-wiggle{animation:pandaSad .5s ease 2}
  @keyframes pandaSad{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) translateY(6px)}75%{transform:rotate(10deg) translateY(6px)}}
  /* Передній край столу — перекриває нижню частину персонажа */
  #table-front{position:absolute;left:0;right:0;bottom:0;height:clamp(150px,22vh,200px);z-index:16;pointer-events:none;background-color:#fff0d4;background-image:repeating-linear-gradient(90deg,rgba(224,67,49,.28) 0 30px,transparent 30px 60px),repeating-linear-gradient(0deg,rgba(224,67,49,.28) 0 30px,transparent 30px 60px);box-shadow:0 -12px 26px rgba(80,30,8,.3);border-top:3px solid rgba(180,90,40,.4)}
  #fx-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
  @media (max-width:700px){
    #character-box{left:6px;bottom:130px;width:145px;height:180px}
    #jar-wrapper{margin-left:45px}
  }
</style>
</head>
<body>
<div id="game-stage">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;z-index:1">
    <defs>
      <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f6d397"/><stop offset="65%" stop-color="#e3a857"/><stop offset="100%" stop-color="#b5722b"/></linearGradient>
      <pattern id="wallPattern" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="rgba(166,89,22,.16)" stroke-width="3"/><circle cx="40" cy="40" r="6" fill="rgba(255,240,200,.35)"/></pattern>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6fd6ff"/><stop offset="60%" stop-color="#bdf0ff"/><stop offset="100%" stop-color="#fff6c2"/></linearGradient>
      <pattern id="tableCloth" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#fff0d4"/><rect width="30" height="60" fill="rgba(224,67,49,.28)"/><rect width="60" height="30" fill="rgba(224,67,49,.28)"/><rect width="30" height="30" fill="rgba(196,35,20,.55)"/></pattern>
      <linearGradient id="woodShelf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b86b2b"/><stop offset="50%" stop-color="#8a4813"/><stop offset="100%" stop-color="#572905"/></linearGradient>
      <linearGradient id="sunRay" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="rgba(255,250,190,.42)"/><stop offset="100%" stop-color="rgba(255,250,190,0)"/></linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#wallGrad)"/>
    <rect width="1600" height="660" fill="url(#wallPattern)"/>
    <g transform="translate(110,60)">
      <rect x="-14" y="-14" width="388" height="428" rx="28" fill="#5e2f0d" opacity=".35"/>
      <rect x="0" y="0" width="360" height="400" rx="20" fill="url(#skyGrad)" stroke="#7c3f14" stroke-width="16"/>
      <g transform="translate(85,85)"><circle r="42" fill="#ffe853" opacity=".4"><animate attributeName="r" values="40;52;40" dur="3s" repeatCount="indefinite"/></circle><circle r="30" fill="#ffd000"/></g>
      <g fill="#ffffff" opacity=".9"><animateTransform attributeName="transform" type="translate" values="-60,10; 340,10; -60,10" dur="28s" repeatCount="indefinite"/><circle cx="60" cy="70" r="24"/><circle cx="90" cy="62" r="30"/><circle cx="120" cy="72" r="22"/></g>
      <path d="M8 320 Q110 250 220 300 T352 290 L352 392 L8 392 Z" fill="#78c947"/>
      <path d="M8 350 Q180 290 352 340 L352 392 L8 392 Z" fill="#52a72c"/>
      <line x1="180" y1="0" x2="180" y2="400" stroke="#7c3f14" stroke-width="12"/>
      <line x1="0" y1="200" x2="360" y2="200" stroke="#7c3f14" stroke-width="12"/>
      <rect x="-22" y="390" width="404" height="26" rx="10" fill="url(#woodShelf)"/>
    </g>
    <polygon points="130,80 460,80 950,650 320,650" fill="url(#sunRay)"/>
    <g transform="translate(1060,150)">
      <path d="M40 120 L40 175 L85 120 Z" fill="#4f2406"/><path d="M360 120 L360 175 L315 120 Z" fill="#4f2406"/>
      <rect x="45" y="42" width="58" height="75" rx="14" fill="#d9f7ff" stroke="#8ad4eb" stroke-width="3" opacity=".9"/>
      <rect x="49" y="64" width="50" height="50" rx="10" fill="#ffa600"/>
      <rect x="42" y="30" width="64" height="16" rx="6" fill="#d9534f"/>
      <rect x="0" y="115" width="430" height="24" rx="9" fill="url(#woodShelf)"/>
    </g>
    <g transform="translate(0,620)">
      <rect x="0" y="0" width="1600" height="280" fill="#612c0c"/>
      <path d="M0 0 L1600 0 L1600 280 L0 280 Z" fill="url(#tableCloth)"/>
      <rect x="0" y="0" width="1600" height="16" fill="rgba(120,35,15,.25)"/>
    </g>
  </svg>

  <div class="hud-bar">
    <div class="hud-group">
      <button id="btn-lang" class="wood-btn lang-btn" onclick="toggleLanguage()" aria-label="Змінити мову">
        <span id="lang-flag"></span><span id="lang-code">UA</span>
      </button>
    </div>
    <div class="hud-group">
      <button class="wood-btn" onclick="changeLevel(-1)" aria-label="Previous">
        <svg width="32" height="32" viewBox="0 0 32 32"><path d="M20 6 L9 16 L20 26" fill="none" stroke="#421d04" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="wood-btn" onclick="changeLevel(1)" aria-label="Next">
        <svg width="32" height="32" viewBox="0 0 32 32"><path d="M12 6 L23 16 L12 26" fill="none" stroke="#421d04" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div id="play-area">
    <div id="character-box" onclick="pokeCharacter()">
      <!-- viewBox збільшено до 340, щоб вмістити ноги -->
      <svg viewBox="0 0 260 340" width="100%" height="100%">
        <defs>
          <radialGradient id="pandaFur" cx="45%" cy="38%" r="60%"><stop offset="0%" stop-color="#ff7b36"/><stop offset="70%" stop-color="#d9480f"/><stop offset="100%" stop-color="#9c2c03"/></radialGradient>
          <linearGradient id="chefHat" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fffdf9"/><stop offset="70%" stop-color="#f2e6d8"/><stop offset="100%" stop-color="#d5c0a8"/></linearGradient>
        </defs>

        <!-- Хвіст -->
        <g transform="translate(185,235)"><g><animateTransform attributeName="transform" type="rotate" values="-8 0 0; 14 0 0; -8 0 0" dur="1.8s" repeatCount="indefinite"/><path d="M0 0 Q65 -25 58 -80 Q48 -115 18 -85 Q-5 -50 0 0 Z" fill="url(#pandaFur)" stroke="#6e1d00" stroke-width="4"/><path d="M22 -65 Q42 -60 52 -72" fill="none" stroke="#4a1504" stroke-width="10" stroke-linecap="round"/><path d="M12 -38 Q35 -32 45 -44" fill="none" stroke="#4a1504" stroke-width="10" stroke-linecap="round"/></g></g>

        <!-- НОГИ (додано) -->
        <g>
          <ellipse cx="98" cy="300" rx="18" ry="24" fill="#4a1504" stroke="#2b0b01" stroke-width="4"/>
          <ellipse cx="98" cy="318" rx="21" ry="12" fill="#3a0f02" stroke="#2b0b01" stroke-width="3"/>
          <ellipse cx="152" cy="300" rx="18" ry="24" fill="#4a1504" stroke="#2b0b01" stroke-width="4"/>
          <ellipse cx="152" cy="318" rx="21" ry="12" fill="#3a0f02" stroke="#2b0b01" stroke-width="3"/>
        </g>

        <!-- Тіло -->
        <ellipse cx="125" cy="235" rx="64" ry="58" fill="url(#pandaFur)" stroke="#6e1d00" stroke-width="4"/>
        <path d="M75 195 Q125 208 175 195 L182 280 Q125 294 68 280 Z" fill="#ffefc7" stroke="#c99e5a" stroke-width="4"/>
        <path d="M98 228 L152 228 L148 262 Q125 270 102 262 Z" fill="#ffae42" stroke="#b86b11" stroke-width="3"/>
        <path d="M82 186 Q125 212 168 186 L142 216 L125 202 L108 216 Z" fill="#e63946" stroke="#8f1620" stroke-width="3"/>

        <!-- Вушка -->
        <g transform="translate(65,96)"><path d="M0 20 C-28 -25 10 -45 30 -5 Z" fill="#4a1504" stroke="#2b0b01" stroke-width="4"/><path d="M2 14 C-16 -14 8 -28 22 -3 Z" fill="#fff3e0"/></g>
        <g transform="translate(185,96)"><path d="M0 20 C28 -25 -10 -45 -30 -5 Z" fill="#4a1504" stroke="#2b0b01" stroke-width="4"/><path d="M-2 14 C16 -14 -8 -28 -22 -3 Z" fill="#fff3e0"/></g>

        <!-- Голова -->
        <ellipse cx="125" cy="138" rx="68" ry="56" fill="url(#pandaFur)" stroke="#6e1d00" stroke-width="4"/>
        <ellipse cx="85" cy="148" rx="24" ry="18" fill="#fff3e0"/><ellipse cx="165" cy="148" rx="24" ry="18" fill="#fff3e0"/>
        <ellipse cx="98" cy="112" rx="14" ry="9" transform="rotate(-12 98 112)" fill="#fff3e0"/>
        <ellipse cx="152" cy="112" rx="14" ry="9" transform="rotate(12 152 112)" fill="#fff3e0"/>
        <ellipse cx="76" cy="154" rx="11" ry="6" fill="#ff6b8b" opacity=".65"/><ellipse cx="174" cy="154" rx="11" ry="6" fill="#ff6b8b" opacity=".65"/>

        <!-- Очі -->
        <g id="panda-eyes-normal"><circle cx="96" cy="132" r="13" fill="#260c02"/><circle cx="154" cy="132" r="13" fill="#260c02"/><circle id="pupil-l" cx="99" cy="128" r="5" fill="#fff"/><circle id="pupil-r" cx="157" cy="128" r="5" fill="#fff"/><circle cx="92" cy="136" r="2.5" fill="#fff"/><circle cx="150" cy="136" r="2.5" fill="#fff"/></g>
        <g id="panda-eyes-happy" style="display:none" stroke="#260c02" stroke-width="5" fill="none" stroke-linecap="round"><path d="M82 134 Q96 116 110 134"/><path d="M140 134 Q154 116 168 134"/></g>

        <!-- Мордочка -->
        <ellipse cx="125" cy="152" rx="22" ry="16" fill="#fff8ee"/>
        <ellipse cx="125" cy="144" rx="9" ry="6.5" fill="#2b0c02"/>
        <ellipse cx="123" cy="142" rx="3" ry="1.8" fill="#fff" opacity=".7"/>
        <path id="panda-mouth" d="M113 155 Q125 166 137 155" fill="none" stroke="#2b0c02" stroke-width="4" stroke-linecap="round"/>

        <!-- Ковпак -->
        <g transform="translate(125,76)"><path d="M-48 10 C-72 -25 -38 -62 -12 -46 C0 -68 32 -65 40 -42 C68 -48 75 -12 48 10 Z" fill="url(#chefHat)" stroke="#a88b67" stroke-width="4"/><rect x="-46" y="4" width="92" height="18" rx="7" fill="#f7ead9" stroke="#a88b67" stroke-width="4"/><polygon points="0,-32 4,-22 15,-21 7,-14 9,-3 0,-9 -9,-3 -7,-14 -15,-21 -4,-22" fill="#ffb703" stroke="#b57600" stroke-width="1.5"/></g>

        <!-- Лапки -->
        <g transform="translate(65,215)"><ellipse cx="0" cy="0" rx="18" ry="14" transform="rotate(25)" fill="#4a1504"/></g>
        <g transform="translate(186,210)"><animateTransform attributeName="transform" type="rotate" values="0 186 210; 10 186 210; 0 186 210" dur="2.2s" repeatCount="indefinite"/><rect x="4" y="-58" width="8" height="62" rx="4" transform="rotate(18)" fill="#c97d36" stroke="#6e3907" stroke-width="2.5"/><ellipse cx="22" cy="-64" rx="14" ry="19" transform="rotate(18 22 -64)" fill="#e0964c" stroke="#6e3907" stroke-width="3"/><ellipse cx="0" cy="0" rx="18" ry="14" transform="rotate(-25)" fill="#4a1504"/></g>
      </svg>
    </div>

    <div id="jar-wrapper">
      <svg viewBox="0 0 400 460" width="100%" height="100%">
        <defs>
          <linearGradient id="glassBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="rgba(220,247,255,.72)"/><stop offset="35%" stop-color="rgba(182,232,252,.45)"/><stop offset="70%" stop-color="rgba(155,218,245,.38)"/><stop offset="100%" stop-color="rgba(215,246,255,.78)"/></linearGradient>
          <linearGradient id="lidGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c97016"/><stop offset="22%" stop-color="#ffb84d"/><stop offset="50%" stop-color="#ffd984"/><stop offset="80%" stop-color="#e88d25"/><stop offset="100%" stop-color="#a35208"/></linearGradient>
          <linearGradient id="lidTopGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe299"/><stop offset="100%" stop-color="#d47a1c"/></linearGradient>
          <radialGradient id="magicGlow" cx="50%" cy="55%" r="48%"><stop offset="0%" stop-color="rgba(255,244,156,.9)"/><stop offset="60%" stop-color="rgba(255,215,80,.35)"/><stop offset="100%" stop-color="rgba(255,215,80,0)"/></radialGradient>
        </defs>
        <ellipse cx="200" cy="434" rx="142" ry="20" fill="rgba(50,18,4,.38)"/>
        <path d="M98 92 L302 92 L310 118 C345 135 356 172 354 225 L348 372 C345 416 312 434 264 434 L136 434 C88 434 55 416 52 372 L46 225 C44 172 55 135 90 118 Z" fill="url(#glassBody)" stroke="rgba(255,255,255,.85)" stroke-width="5"/>
        <ellipse cx="200" cy="412" rx="132" ry="18" fill="rgba(255,255,255,.38)"/>
        <g id="jar-prize"></g>
        <path d="M74 155 Q65 260 72 375 C74 392 92 405 112 408" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="14" stroke-linecap="round"/>
        <path d="M96 165 Q90 240 94 320" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="6" stroke-linecap="round"/>
        <path d="M328 160 Q335 265 326 375 C322 395 304 406 282 410" fill="none" stroke="rgba(255,255,255,.48)" stroke-width="10" stroke-linecap="round"/>
        <path d="M88 112 Q200 124 312 112" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="6" stroke-linecap="round"/>
        <g id="jar-lid">
          <ellipse cx="200" cy="92" rx="118" ry="18" fill="#8f4505"/>
          <path d="M76 56 C76 42 324 42 324 56 L318 88 C318 106 82 106 82 88 Z" fill="url(#lidGrad)" stroke="#7a3903" stroke-width="3.5"/>
          <ellipse cx="200" cy="54" rx="122" ry="18" fill="url(#lidTopGrad)" stroke="#9e4d08" stroke-width="3"/>
          <g stroke="rgba(122,57,3,.35)" stroke-width="4" stroke-linecap="round"><line x1="105" y1="68" x2="105" y2="90"/><line x1="135" y1="71" x2="135" y2="94"/><line x1="168" y1="73" x2="168" y2="96"/><line x1="200" y1="74" x2="200" y2="97"/><line x1="232" y1="73" x2="232" y2="96"/><line x1="265" y1="71" x2="265" y2="94"/><line x1="295" y1="68" x2="295" y2="90"/></g>
          <path d="M110 52 Q200 40 290 52" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>
      <div id="jar-letters-layer"></div>
    </div>

    <div id="word-board"></div>

let audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();}
function playSound(type,stepIndex=0){
  ensureAudio();const now=audioCtx.currentTime;
  if(type==="pick"){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";const b=360+stepIndex*55;o.frequency.setValueAtTime(b,now);o.frequency.exponentialRampToValueAtTime(b*1.45,now+.11);g.gain.setValueAtTime(.28,now);g.gain.exponentialRampToValueAtTime(.001,now+.13);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.13);}
  else if(type==="return"){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.setValueAtTime(420,now);o.frequency.exponentialRampToValueAtTime(220,now+.12);g.gain.setValueAtTime(.22,now);g.gain.exponentialRampToValueAtTime(.001,now+.13);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.13);}
  else if(type==="win"){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.setValueAtTime(f,now+i*.085);g.gain.setValueAtTime(.28,now+i*.085);g.gain.exponentialRampToValueAtTime(.001,now+i*.085+.38);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.085);o.stop(now+i*.085+.39);});}
  else if(type==="error"){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sawtooth";o.frequency.setValueAtTime(190,now);o.frequency.linearRampToValueAtTime(125,now+.28);g.gain.setValueAtTime(.2,now);g.gain.exponentialRampToValueAtTime(.001,now+.3);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.31);}
}

let currentLang="ua",currentLevelIndex=0,placedLetters=[],isLocked=false,autoNextTimer=null;
const jarWrapper=document.getElementById("jar-wrapper");
const jarLettersLayer=document.getElementById("jar-letters-layer");
const jarPrizeGroup=document.getElementById("jar-prize");
const wordBoard=document.getElementById("word-board");
const characterBox=document.getElementById("character-box");

function updateLangButton(){
  document.getElementById("lang-flag").innerHTML=LANG_FLAGS[currentLang];
  document.getElementById("lang-code").textContent=currentLang.toUpperCase();
}
function toggleLanguage(){
  currentLang=currentLang==="ua"?"ru":"ua";
  updateLangButton();
  playSound("pick",3);
  loadLevel(true);
}

function loadLevel(animateSlide=false){
  clearTimeout(autoNextTimer);isLocked=false;
  const levelData=LEVELS[currentLang][currentLevelIndex];
  placedLetters=new Array(levelData.word.length).fill(null);
  if(animateSlide){
    jarWrapper.classList.remove("jar-solved","slide-in");
    jarWrapper.classList.add("slide-out");
    setTimeout(()=>{renderJarAndSlots(levelData);jarWrapper.classList.remove("slide-out");jarWrapper.classList.add("slide-in");},340);
  }else{
    jarWrapper.classList.remove("jar-solved","slide-out");
    renderJarAndSlots(levelData);
  }
}

function renderJarAndSlots(levelData){
  wordBoard.classList.remove("error-shake","success-glow");
  jarPrizeGroup.innerHTML=REALISTIC_SVGS[levelData.svg];
  jarLettersLayer.innerHTML="";wordBoard.innerHTML="";
  levelData.scrambled.forEach((char,idx)=>{
    const pos=LETTER_POSITIONS[idx%LETTER_POSITIONS.length];
    const color=TILE_COLORS[idx%TILE_COLORS.length];
    const btn=document.createElement("div");
    btn.className="jar-letter";btn.id=`jar-let-${idx}`;btn.textContent=char;
    btn.style.left=`${pos.x}%`;btn.style.top=`${pos.y}%`;
    btn.style.transform=`rotate(${pos.rot}deg)`;btn.style.background=color;
    btn.style.animationDelay=`${idx*.25}s`;
    btn.onclick=(e)=>{e.stopPropagation();pickLetterFromJar(idx,char,color,btn);};
    jarLettersLayer.appendChild(btn);
  });
  for(let i=0;i<levelData.word.length;i++){
    const slot=document.createElement("div");
    slot.className="letter-slot";slot.id=`slot-${i}`;
    slot.onclick=()=>returnLetterToJar(i);
    wordBoard.appendChild(slot);
  }
}

function pickLetterFromJar(jarIdx,char,color,btnElement){
  if(isLocked)return;
  const emptySlotIdx=placedLetters.indexOf(null);
  if(emptySlotIdx===-1)return;
  placedLetters[emptySlotIdx]={char,jarIdx,color};
  btnElement.classList.add("used");
  const slotEl=document.getElementById(`slot-${emptySlotIdx}`);
  slotEl.textContent=char;slotEl.style.background=color;slotEl.classList.add("filled");
  playSound("pick",emptySlotIdx);lookAtJar();
  if(!placedLetters.includes(null))checkWordResult();
}

function returnLetterToJar(slotIdx){
  if(isLocked||!placedLetters[slotIdx])return;
  const item=placedLetters[slotIdx];placedLetters[slotIdx]=null;
  const jarBtn=document.getElementById(`jar-let-${item.jarIdx}`);
  if(jarBtn)jarBtn.classList.remove("used");
  const slotEl=document.getElementById(`slot-${slotIdx}`);
  slotEl.textContent="";slotEl.style.background="";slotEl.classList.remove("filled");
  playSound("return");
}

function checkWordResult(){
  const levelData=LEVELS[currentLang][currentLevelIndex];
  const candidate=placedLetters.map(i=>i.char).join("");
  if(candidate===levelData.word){
    isLocked=true;playSound("win");
    jarWrapper.classList.add("jar-solved");
    wordBoard.classList.add("success-glow");
    setCharacterEmotion("happy");
    spawnCelebrationParticles();
    autoNextTimer=setTimeout(()=>changeLevel(1),2900);
  }else{
    isLocked=true;playSound("error");
    wordBoard.classList.add("error-shake");
    setCharacterEmotion("sad");
    setTimeout(()=>{
      wordBoard.classList.remove("error-shake");
      placedLetters.forEach((item,idx)=>{
        if(item){
          const jarBtn=document.getElementById(`jar-let-${item.jarIdx}`);
          if(jarBtn)jarBtn.classList.remove("used");
          const slotEl=document.getElementById(`slot-${idx}`);
          slotEl.textContent="";slotEl.style.background="";slotEl.classList.remove("filled");
        }
      });
      placedLetters.fill(null);isLocked=false;
    },650);
  }
}

function changeLevel(delta){
  playSound("pick",2);
  const total=LEVELS[currentLang].length;
  currentLevelIndex=(currentLevelIndex+delta+total)%total;
  loadLevel(true);
}

function setCharacterEmotion(state){
  const eyesNormal=document.getElementById("panda-eyes-normal");
  const eyesHappy=document.getElementById("panda-eyes-happy");
  const mouth=document.getElementById("panda-mouth");
  characterBox.classList.remove("happy-jump","sad-wiggle");
  void characterBox.offsetWidth;
  if(state==="happy"){
    eyesNormal.style.display="none";eyesHappy.style.display="block";
    mouth.setAttribute("d","M110 153 Q125 174 140 153 Z");mouth.setAttribute("fill","#d90429");
    characterBox.classList.add("happy-jump");
    setTimeout(()=>{eyesNormal.style.display="block";eyesHappy.style.display="none";mouth.setAttribute("d","M113 155 Q125 166 137 155");mouth.setAttribute("fill","none");},2400);
  }else if(state==="sad"){
    mouth.setAttribute("d","M114 162 Q125 150 136 162");
    characterBox.classList.add("sad-wiggle");
    setTimeout(()=>mouth.setAttribute("d","M113 155 Q125 166 137 155"),900);
  }
}

function pokeCharacter(){playSound("pick",4);setCharacterEmotion("happy");}
function lookAtJar(){
  const pl=document.getElementById("pupil-l"),pr=document.getElementById("pupil-r");
  pl.setAttribute("cx",102);pr.setAttribute("cx",160);
  setTimeout(()=>{pl.setAttribute("cx",99);pr.setAttribute("cx",157);},350);
}

const canvas=document.getElementById("fx-canvas"),ctx=canvas.getContext("2d");
let particles=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener("resize",resizeCanvas);resizeCanvas();

function spawnCelebrationParticles(){
  const cx=window.innerWidth/2,cy=window.innerHeight*.45;
  const colors=["#ffbe0b","#ff006e","#3a86ff","#80ed99","#fb5607","#fff"];
  for(let i=0;i<65;i++){
    const a=Math.random()*Math.PI*2,s=4+Math.random()*11;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,size:6+Math.random()*9,color:colors[i%colors.length],rot:Math.random()*6.28,vRot:(Math.random()-.5)*.25,life:1});
  }
}
function updateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.rot+=p.vRot;p.life-=.016;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;
    ctx.beginPath();
    for(let j=0;j<5;j++){
      ctx.lineTo(Math.cos((18+j*72)*Math.PI/180)*p.size,-Math.sin((18+j*72)*Math.PI/180)*p.size);
      ctx.lineTo(Math.cos((54+j*72)*Math.PI/180)*(p.size*.45),-Math.sin((54+j*72)*Math.PI/180)*(p.size*.45));
    }
    ctx.closePath();ctx.fill();ctx.restore();
  }
  requestAnimationFrame(updateParticles);
}
updateParticles();

updateLangButton();
loadLevel(false);
</script>
