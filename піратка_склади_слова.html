<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pirate Island Reading</title>
    <!-- Rounded Cyrillic-friendly fonts for crisp, legible reading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           GLOBAL RESET & FULLSCREEN WIDESCREEN CANVAS
           ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a3b4c;
            font-family: 'Rubik', 'Nunito', 'Trebuchet MS', sans-serif;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }

        /* =========================================================
           WOOD & BRASS STYLIZED HUD CONTROLS (ZERO WHITE BOXES)
           ========================================================= */
        .hud-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        .hud-top-left {
            position: absolute;
            top: clamp(12px, 2vh, 22px);
            left: clamp(14px, 2vw, 26px);
            display: flex;
            align-items: center;
            gap: clamp(8px, 1vw, 14px);
            pointer-events: auto;
        }

        .hud-top-right {
            position: absolute;
            top: clamp(12px, 2vh, 22px);
            right: clamp(14px, 2vw, 26px);
            display: flex;
            align-items: center;
            gap: clamp(8px, 1vw, 14px);
            pointer-events: auto;
        }

        .hud-bottom-right {
            position: absolute;
            bottom: clamp(16px, 2.8vh, 30px);
            right: clamp(18px, 2.4vw, 32px);
            pointer-events: auto;
        }

        /* Carved oak & burnished brass button aesthetic */
        .pirate-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: clamp(8px, 1.1vh, 12px) clamp(13px, 1.5vw, 18px);
            border-radius: 16px;
            border: 3px solid #c9973b;
            background:
                repeating-linear-gradient(
                    8deg,
                    rgba(255, 210, 140, 0.04) 0px,
                    rgba(255, 210, 140, 0.04) 2px,
                    rgba(35, 16, 6, 0.07) 2px,
                    rgba(35, 16, 6, 0.07) 5px
                ),
                linear-gradient(180deg, #7d4a26 0%, #5b3116 52%, #42210d 100%);
            color: #fce7ba;
            font-family: 'Rubik', 'Nunito', sans-serif;
            font-weight: 800;
            font-size: clamp(15px, 1.35vw, 20px);
            letter-spacing: 0.03em;
            text-shadow: 0 2px 3px rgba(20, 8, 2, 0.85);
            box-shadow:
                0 6px 14px rgba(14, 18, 24, 0.48),
                inset 0 2px 2px rgba(255, 226, 160, 0.35),
                inset 0 -3px 4px rgba(26, 10, 2, 0.65);
            cursor: pointer;
            transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease, border-color 0.2s ease;
            outline: none;
        }

        .pirate-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            border-color: #f0c45f;
        }

        .pirate-btn:active {
            transform: translateY(2px) scale(0.97);
            box-shadow:
                0 2px 6px rgba(14, 18, 24, 0.55),
                inset 0 2px 5px rgba(20, 8, 2, 0.7);
        }

        .pirate-btn.active {
            border-color: #ffe07a;
            background:
                repeating-linear-gradient(
                    8deg,
                    rgba(255, 230, 150, 0.08) 0px,
                    rgba(255, 230, 150, 0.08) 2px,
                    rgba(80, 35, 5, 0.07) 2px,
                    rgba(80, 35, 5, 0.07) 5px
                ),
                linear-gradient(180deg, #b86c25 0%, #8a4814 55%, #66310b 100%);
            color: #fff7dc;
            box-shadow:
                0 0 18px rgba(255, 210, 85, 0.45),
                0 6px 14px rgba(14, 18, 24, 0.48),
                inset 0 2px 3px rgba(255, 242, 190, 0.55);
        }

        .pirate-btn.icon-only {
            padding: clamp(9px, 1.1vh, 12px);
            min-width: clamp(46px, 3.6vw, 54px);
            height: clamp(46px, 3.6vw, 54px);
        }

        /* Minimalist "Next" brass-and-oak medallion button */
        .next-btn {
            width: clamp(58px, 4.8vw, 72px);
            height: clamp(58px, 4.8vw, 72px);
            border-radius: 50%;
            padding: 0;
            border: 3.5px solid #e6b852;
            background:
                radial-gradient(circle at 32% 28%, #9b5d2e 0%, #683817 62%, #47230c 100%);
            box-shadow:
                0 8px 20px rgba(10, 18, 26, 0.52),
                inset 0 3px 4px rgba(255, 232, 168, 0.45),
                inset 0 -4px 6px rgba(28, 10, 2, 0.72);
        }

        .next-btn svg {
            width: 52%;
            height: 52%;
            filter: drop-shadow(0 2px 2px rgba(20, 8, 2, 0.75));
        }

        /* Language toggle pill */
        .lang-btn {
            min-width: clamp(66px, 5vw, 78px);
            height: clamp(46px, 3.6vw, 54px);
            text-transform: lowercase;
            font-size: clamp(16px, 1.4vw, 20px);
        }

        /* Filter badge dot when specific consonants are selected */
        .filter-badge {
            position: absolute;
            top: -7px;
            right: -7px;
            min-width: 22px;
            height: 22px;
            padding: 0 5px;
            border-radius: 11px;
            background: linear-gradient(180deg, #ffda68 0%, #d48c1c 100%);
            border: 2px solid #4d260b;
            color: #361704;
            font-size: 12px;
            font-weight: 900;
            display: none;
            align-items: center;
            justify-content: center;
            text-shadow: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .filter-badge.visible {
            display: flex;
        }

        .hidden-btn {
            display: none !important;
        }

        /* =========================================================
           CARVED WOOD CONSONANT SELECTOR TRAY (MODE 1)
           ========================================================= */
        .consonant-tray {
            position: absolute;
            top: clamp(68px, 9.5vh, 88px);
            left: clamp(14px, 2vw, 26px);
            max-width: min(560px, 92vw);
            padding: 14px 16px;
            border-radius: 22px;
            border: 3.5px solid #c9973b;
            background:
                repeating-linear-gradient(
                    4deg,
                    rgba(255, 220, 155, 0.045) 0px,
                    rgba(255, 220, 155, 0.045) 3px,
                    rgba(28, 12, 4, 0.08) 3px,
                    rgba(28, 12, 4, 0.08) 7px
                ),
                linear-gradient(165deg, rgba(102, 57, 26, 0.96) 0%, rgba(69, 35, 14, 0.97) 100%);
            box-shadow:
                0 16px 36px rgba(10, 16, 22, 0.62),
                inset 0 2px 4px rgba(255, 226, 165, 0.3),
                inset 0 -4px 8px rgba(22, 8, 2, 0.72);
            pointer-events: auto;
            display: none;
            flex-direction: column;
            gap: 10px;
            transform-origin: top left;
            animation: trayPop 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .consonant-tray.open {
            display: flex;
        }

        @keyframes trayPop {
            from { opacity: 0; transform: translateY(-8px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .consonant-grid {
            display: grid;
            grid-template-columns: repeat(8, minmax(38px, 1fr));
            gap: 7px;
        }

        @media (max-width: 640px) {
            .consonant-grid {
                grid-template-columns: repeat(6, minmax(36px, 1fr));
            }
        }

        .letter-tile {
            height: 42px;
            border-radius: 11px;
            border: 2px solid #9d6f33;
            background: linear-gradient(180deg, #e7c992 0%, #cfa564 55%, #b68443 100%);
            color: #3a1c08;
            font-family: 'Rubik', 'Nunito', sans-serif;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 3px 6px rgba(20, 9, 2, 0.45),
                inset 0 2px 2px rgba(255, 246, 218, 0.65),
                inset 0 -2px 3px rgba(96, 54, 18, 0.4);
            transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .letter-tile:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        .letter-tile:active {
            transform: scale(0.94);
        }

        .letter-tile.selected {
            border-color: #fff0a8;
            background: linear-gradient(180deg, #ffcf4d 0%, #e8961c 58%, #bd6b0b 100%);
            color: #2c1002;
            box-shadow:
                0 0 12px rgba(255, 212, 74, 0.72),
                0 3px 6px rgba(20, 9, 2, 0.5),
                inset 0 2px 3px rgba(255, 250, 224, 0.75);
        }

        .letter-tile.reset-tile {
            background: linear-gradient(180deg, #8b4628 0%, #632c14 100%);
            border-color: #d69d46;
            color: #fde4b2;
        }

        .letter-tile.reset-tile svg {
            width: 21px;
            height: 21px;
        }
    </style>
</head>
<body>
    <!-- Fullscreen painterly game canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Stylized Wood & Brass HUD -->
    <div class="hud-layer">
        <!-- Top-Left: Mode toggles & Consonant Filter button -->
        <div class="hud-top-left">
            <!-- Mode 1: Syllables -->
            <button id="btnModeSyllables" class="pirate-btn active" aria-label="Syllables">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M5 19H19" stroke="#f7d279" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M12 4V19" stroke="#e0aa4e" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M12 5C16.8 6.8 18.4 11.4 16.4 15.8C14.8 15.1 13.3 15 12 15V5Z" fill="#f7e5be" stroke="#c9973b" stroke-width="1.3"/>
                    <path d="M12 7.2C8.6 8.5 7.2 11.8 8.4 15.2C9.7 14.8 10.9 14.8 12 14.8V7.2Z" fill="#e6cfa0" stroke="#c9973b" stroke-width="1.2"/>
                </svg>
                <span id="modeSyllablesSample">МА</span>
            </button>

            <!-- Mode 2: Words -->
            <button id="btnModeWords" class="pirate-btn" aria-label="Words">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3.5" y="9" width="17" height="10" rx="2.2" fill="#c78138" stroke="#f7d279" stroke-width="1.7"/>
                    <path d="M4.5 9C5.4 5.8 8.2 4.5 12 4.5C15.8 4.5 18.6 5.8 19.5 9H4.5Z" fill="#d99648" stroke="#f7d279" stroke-width="1.7"/>
                    <rect x="10.2" y="10.5" width="3.6" height="4.2" rx="1" fill="#ffe07a" stroke="#5c2f0d" stroke-width="1"/>
                </svg>
                <span id="modeWordsSample">КОЗА</span>
            </button>

            <!-- Consonant Selector Toggle (Mode 1 only) -->
            <button id="btnConsonantFilter" class="pirate-btn icon-only" aria-label="Consonants">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="3.5" y="3.5" width="7" height="7" rx="2" fill="#f2d59b" stroke="#54280b" stroke-width="1.3"/>
                    <rect x="13.5" y="3.5" width="7" height="7" rx="2" fill="#ffcf54" stroke="#54280b" stroke-width="1.3"/>
                    <rect x="3.5" y="13.5" width="7" height="7" rx="2" fill="#ffcf54" stroke="#54280b" stroke-width="1.3"/>
                    <rect x="13.5" y="13.5" width="7" height="7" rx="2" fill="#f2d59b" stroke="#54280b" stroke-width="1.3"/>
                </svg>
                <span id="filterBadge" class="filter-badge"></span>
            </button>
        </div>

        <!-- Collapsible Carved Wood Consonant Selector Tray -->
        <div id="consonantTray" class="consonant-tray">
            <div id="consonantGrid" class="consonant-grid"></div>
        </div>

        <!-- Top-Right: Single Language Toggle & Sound Toggle -->
        <div class="hud-top-right">
            <button id="btnLang" class="pirate-btn lang-btn" aria-label="Language">укр</button>
            <button id="btnSound" class="pirate-btn icon-only" aria-label="Sound">
                <svg id="iconSoundOn" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M4.5 9.2H8.4L13.5 5V19L8.4 14.8H4.5C3.9 14.8 3.5 14.4 3.5 13.8V10.2C3.5 9.6 3.9 9.2 4.5 9.2Z" fill="#fce4a8" stroke="#54280b" stroke-width="1.2"/>
                    <path d="M16.5 8.8C17.8 10.1 17.8 13.9 16.5 15.2" stroke="#ffe07a" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M19.2 6.4C21.6 9.1 21.6 14.9 19.2 17.6" stroke="#f0be59" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
                <svg id="iconSoundOff" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none;">
                    <path d="M4.5 9.2H8.4L13.5 5V19L8.4 14.8H4.5C3.9 14.8 3.5 14.4 3.5 13.8V10.2C3.5 9.6 3.9 9.2 4.5 9.2Z" fill="#bfa176" stroke="#54280b" stroke-width="1.2"/>
                    <path d="M16.5 9L21 15M21 9L16.5 15" stroke="#ff9671" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <!-- Bottom-Right: Minimalist Immediate "Next" Button -->
        <div class="hud-bottom-right">
            <button id="btnNext" class="pirate-btn next-btn" aria-label="Next">
                <svg viewBox="0 0 28 28" fill="none">
                    <path d="M6 14H20.5" stroke="#fff3c8" stroke-width="3.6" stroke-linecap="round"/>
                    <path d="M14.5 7.5L21.5 14L14.5 20.5" stroke="#fff3c8" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* =====================================================================
           1. PROCEDURAL WEB AUDIO ENGINE (NO EXTERNAL AUDIO FILES, NO SPEECH)
           ===================================================================== */
        const SoundFX = {
            ctx: null,
            enabled: true,

            init() {
                try {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume().catch(function () {});
                    }
                } catch (err) {
                    // Gracefully ignore audio context errors on restricted devices
                }
            },

            tone(freq, startOffset, duration, type, gainVal, freqEnd) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const oscType = type || 'sine';
                const vol = gainVal !== undefined ? gainVal : 0.14;
                const t = this.ctx.currentTime + startOffset;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = oscType;
                osc.frequency.setValueAtTime(freq, t);
                if (freqEnd !== undefined && freqEnd !== null) {
                    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + duration);
                }
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.linearRampToValueAtTime(vol, t + Math.min(0.025, duration * 0.25));
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + duration + 0.03);
            },

            noise(startOffset, duration, filterFreq, gainVal, q) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const fFreq = filterFreq || 800;
                const vol = gainVal !== undefined ? gainVal : 0.08;
                const qVal = q || 1.2;
                const sampleRate = this.ctx.sampleRate;
                const len = Math.max(1, Math.floor(sampleRate * duration));
                const buffer = this.ctx.createBuffer(1, len, sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < len; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const src = this.ctx.createBufferSource();
                src.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = fFreq;
                filter.Q.value = qVal;

                const gain = this.ctx.createGain();
                const t = this.ctx.currentTime + startOffset;
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.linearRampToValueAtTime(vol, t + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

                src.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                src.start(t);
                src.stop(t + duration + 0.03);
            },

            woodClick() {
                this.tone(360, 0, 0.055, 'triangle', 0.12, 190);
                this.tone(720, 0, 0.03, 'sine', 0.06, 480);
            },

            shipDock() {
                this.noise(0, 0.45, 520, 0.055, 0.9);
                this.tone(175, 0.05, 0.18, 'triangle', 0.06, 125);
            },

            shipSailOff() {
                this.noise(0, 0.5, 680, 0.05, 0.8);
                this.tone(220, 0.04, 0.22, 'sine', 0.05, 310);
            },

            sackWhoosh() {
                this.noise(0, 0.34, 950, 0.075, 1.4);
                this.tone(240, 0.02, 0.28, 'sine', 0.09, 580);
            },

            chestOpen() {
                this.tone(150, 0, 0.14, 'sawtooth', 0.06, 290);
                this.tone(523.25, 0.06, 0.25, 'triangle', 0.12, 523.25);
            },

            coconutBonk() {
                this.tone(230, 0, 0.09, 'triangle', 0.16, 110);
                this.tone(420, 0.01, 0.06, 'sine', 0.08, 280);
            },

            coconutSplash() {
                this.noise(0, 0.32, 1100, 0.09, 1.1);
                this.tone(320, 0, 0.14, 'sine', 0.09, 640);
            },

            /* 6 Distinct Celebratory Musical Soundscapes */
            playCelebration(id) {
                if (!this.enabled) return;
                this.chestOpen();
                if (id === 0) {
                    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
                    notes.forEach((n, i) => {
                        this.tone(n, 0.06 + i * 0.08, 0.28, 'triangle', 0.13);
                        this.tone(n * 2.02, 0.1 + i * 0.08, 0.14, 'sine', 0.05);
                    });
                    for (let i = 0; i < 6; i++) {
                        this.tone(2100 + i * 240, 0.35 + i * 0.07, 0.12, 'sine', 0.045, 2500 + i * 200);
                    }
                } else if (id === 1) {
                    const harp = [392, 493.88, 587.33, 783.99, 987.77, 1174.66, 1567.98];
                    harp.forEach((n, i) => this.tone(n, 0.05 + i * 0.065, 0.42, 'sine', 0.11));
                    this.noise(0.18, 0.42, 1250, 0.095, 1.0);
                    this.noise(0.62, 0.45, 980, 0.085, 0.9);
                    this.tone(1100, 0.32, 0.16, 'sine', 0.06, 1780);
                } else if (id === 2) {
                    const flute = [659.25, 783.99, 987.77, 880, 1046.5, 1318.5];
                    flute.forEach((n, i) => {
                        this.tone(n, 0.05 + i * 0.1, 0.22, 'sine', 0.12, n * 1.04);
                    });
                    this.tone(1420, 0.22, 0.14, 'triangle', 0.07, 1920);
                    this.tone(1820, 0.42, 0.14, 'triangle', 0.06, 1350);
                } else if (id === 3) {
                    const xylo = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
                    xylo.forEach((n, i) => this.tone(n, 0.04 + i * 0.09, 0.26, 'triangle', 0.12));
                    for (let i = 0; i < 7; i++) {
                        this.tone(420 + i * 95, 0.24 + i * 0.13, 0.09, 'sine', 0.075, 860 + i * 110);
                    }
                } else if (id === 4) {
                    this.tone(135, 0.04, 0.22, 'sine', 0.2, 42);
                    this.noise(0.04, 0.24, 420, 0.13, 0.8);
                    const brass = [392, 493.88, 587.33, 783.99, 659.25, 783.99];
                    brass.forEach((n, i) => {
                        this.tone(n, 0.16 + i * 0.11, 0.22, 'sawtooth', 0.055);
                        this.tone(n, 0.16 + i * 0.11, 0.24, 'triangle', 0.095);
                    });
                } else {
                    const glock = [783.99, 987.77, 1174.66, 1567.98, 1318.5, 1567.98, 1975.53];
                    glock.forEach((n, i) => {
                        this.tone(n, 0.05 + i * 0.1, 0.45, 'sine', 0.095);
                        this.tone(n * 1.5, 0.05 + i * 0.1, 0.18, 'sine', 0.035);
                    });
                }
            }
        };

        /* =====================================================================
           2. BILINGUAL CURRICULUM DATA & PERSISTENT NON-REPEATING STATE
           ===================================================================== */
        const CONSONANTS = {
            uk: ['Б','В','Г','Ґ','Д','Ж','З','Й','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ'],
            ru: ['Б','В','Г','Д','Ж','З','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ']
        };

        // Subtle, tasteful nautical sail palettes (always high-contrast for dark text!)
        const SAIL_PALETTES = [
            { top: '#f7e7c2', mid: '#fdf3dc', low: '#ecd4a4', edge: '#d5b37c', stripe: 'rgba(176, 114, 42, 0.36)', rope: '#997543', flag: '#c92a32' },
            { top: '#e4f1ee', mid: '#f3fbf9', low: '#cde3df', edge: '#a6c6c1', stripe: 'rgba(46, 128, 136, 0.35)', rope: '#6c8d88', flag: '#23828f' },
            { top: '#fbe3cf', mid: '#fff1e4', low: '#ecc3a6', edge: '#d2a17f', stripe: 'rgba(186, 86, 48, 0.34)', rope: '#9d6a4c', flag: '#d4582a' },

            { top: '#e5eef8', mid: '#f4f8fd', low: '#c9dbee', edge: '#a5bdd6', stripe: 'rgba(56, 102, 158, 0.34)', rope: '#6c829b', flag: '#2b66ad' },
            { top: '#e8f0dc', mid: '#f5faee', low: '#cedcb9', edge: '#aebf95', stripe: 'rgba(78, 128, 56, 0.34)', rope: '#728559', flag: '#458734' }
        ];

        function getSyllablesForConsonant(lang, c) {
            if (lang === 'uk') {
                if (c === 'Й') {
                    return ['ЙО', 'АЙ', 'ОЙ', 'УЙ', 'ИЙ', 'ЕЙ', 'ІЙ'];
                }
                const vowels = ['А', 'О', 'У', 'И', 'Е', 'І'];
                return vowels.map(v => c + v);
            } else {
                if (c === 'Ж') return ['ЖА', 'ЖО', 'ЖУ', 'ЖИ', 'ЖЕ'];
                if (c === 'Ш') return ['ША', 'ШО', 'ШУ', 'ШИ', 'ШЕ'];
                if (c === 'Ч') return ['ЧА', 'ЧУ', 'ЧИ', 'ЧЕ', 'ЧЁ'];
                if (c === 'Щ') return ['ЩА', 'ЩУ', 'ЩИ', 'ЩЕ'];
                if (c === 'Ц') return ['ЦА', 'ЦО', 'ЦУ', 'ЦИ', 'ЦЕ'];
                if (c === 'Г' || c === 'К' || c === 'Х') return [c+'А', c+'О', c+'У', c+'И', c+'Е'];
                const vowels = ['А', 'О', 'У', 'Ы', 'Э', 'И', 'Е', 'Я', 'Ю', 'Ё'];
                return vowels.map(v => c + v);
            }
        }

        // 28 words per language (4-6 letters), useful island items + funny absurd items
        const WORDS = {
            uk: [
                'КОРОВА', 'ДИВАН', 'ЛИЖІ', 'САНКИ', 'ПРАСКА', 'ШАФА', 'МІТЛА',
                'ВАЗА', 'КОЗА', 'КАКТУС', 'ЧАЙНИК', 'ГІТАРА', 'КОВДРА', 'СВИНЯ',
                'КАРТА', 'КОМПАС', 'БАНАН', 'КОКОС', 'ВІДРО', 'ЛОПАТА', 'ЧОВЕН',
                'ВЕСЛО', 'КАНАТ', 'ЛІХТАР', 'НАМЕТ', 'МАНГО', 'КАВУН', 'СКРИНЯ'
            ],
            ru: [
                'КОРОВА', 'ДИВАН', 'ЛЫЖИ', 'САНКИ', 'УТЮГ', 'ШКАФ', 'МЕТЛА',
                'ВАЗА', 'КОЗА', 'КАКТУС', 'ЧАЙНИК', 'ГИТАРА', 'ОДЕЯЛО', 'СВИНЬЯ',
                'КАРТА', 'КОМПАС', 'БАНАН', 'КОКОС', 'ВЕДРО', 'ЛОПАТА', 'ЛОДКА',
                'ВЕСЛО', 'КАНАТ', 'ФОНАРЬ', 'АРБУЗ', 'МАНГО', 'СУНДУК', 'ГАМАК'
            ]
        };

        const ANIMAL_COUNT = 10;
        const CELEBRATION_COUNT = 6;

        function shuffleArray(arr, avoidFirst) {
            const copy = arr.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = copy[i];
                copy[i] = copy[j];
                copy[j] = tmp;
            }
            if (avoidFirst !== undefined && avoidFirst !== null && copy.length > 1 && copy[0] === avoidFirst) {
                const swapIdx = 1 + Math.floor(Math.random() * (copy.length - 1));
                const tmp = copy[0];
                copy[0] = copy[swapIdx];
                copy[swapIdx] = tmp;
            }
            return copy;
        }

        // Persistent state per language & mode — switching modes NEVER resets progress
        const GameState = {
            lang: 'uk',        // 'uk' | 'ru'
            mode: 'syllables', // 'syllables' | 'words'
            selectedConsonants: {
                uk: new Set(),
                ru: new Set()
            },
            buckets: {
                uk: {
                    syllables: { current: null, queue: [], lastShown: null, poolKey: '' },
                    words:     { current: null, queue: [], lastShown: null, poolKey: 'all' }
                },
                ru: {
                    syllables: { current: null, queue: [], lastShown: null, poolKey: '' },
                    words:     { current: null, queue: [], lastShown: null, poolKey: 'all' }
                }
            },
            animalQueue: [],
            lastAnimal: -1,
            currentAnimal: 0,
            sailQueue: [],
            lastSail: -1,
            currentSail: 0,
            celebrationQueue: [],
            lastCelebration: -1,

            getActivePool(lang, mode) {
                if (mode === 'words') return WORDS[lang].slice();
                const sel = this.selectedConsonants[lang];
                const activeCons = sel.size > 0 ? Array.from(sel) : CONSONANTS[lang];
                const pool = [];
                activeCons.forEach(c => {
                    pool.push(...getSyllablesForConsonant(lang, c));
                });
                return pool;
            },

            getPoolKey(lang, mode) {
                if (mode === 'words') return 'all';
                const sel = this.selectedConsonants[lang];
                return sel.size > 0 ? Array.from(sel).sort().join(',') : 'ALL';
            },

            ensureBucketReady(lang, mode) {
                const bucket = this.buckets[lang][mode];
                const key = this.getPoolKey(lang, mode);
                if (bucket.poolKey !== key) {
                    const pool = this.getActivePool(lang, mode);
                    bucket.poolKey = key;
                    bucket.queue = shuffleArray(pool, bucket.lastShown);
                    bucket.current = bucket.queue.shift() || pool[0];
                    bucket.lastShown = bucket.current;
                } else if (!bucket.current) {
                    this.advanceBucket(lang, mode);
                }
                return bucket;
            },

            advanceBucket(lang, mode) {
                const bucket = this.buckets[lang][mode];
                const key = this.getPoolKey(lang, mode);
                if (bucket.poolKey !== key || bucket.queue.length === 0) {
                    const pool = this.getActivePool(lang, mode);
                    bucket.poolKey = key;
                    bucket.queue = shuffleArray(pool, bucket.lastShown);
                }
                bucket.current = bucket.queue.shift();
                bucket.lastShown = bucket.current;
                return bucket.current;
            },

            getCurrentText() {
                const b = this.ensureBucketReady(this.lang, this.mode);
                return b.current;
            },

            nextAnimal() {
                if (this.animalQueue.length === 0) {
                    const indices = Array.from({ length: ANIMAL_COUNT }, (_, i) => i);
                    this.animalQueue = shuffleArray(indices, this.lastAnimal);
                }
                this.currentAnimal = this.animalQueue.shift();
                this.lastAnimal = this.currentAnimal;
                return this.currentAnimal;
            },

            nextSailTheme() {
                if (this.sailQueue.length === 0) {
                    const indices = Array.from({ length: SAIL_PALETTES.length }, (_, i) => i);
                    this.sailQueue = shuffleArray(indices, this.lastSail);
                }
                this.currentSail = this.sailQueue.shift();
                this.lastSail = this.currentSail;
                return this.currentSail;
            },

            nextCelebration() {
                if (this.celebrationQueue.length === 0) {
                    const indices = Array.from({ length: CELEBRATION_COUNT }, (_, i) => i);
                    this.celebrationQueue = shuffleArray(indices, this.lastCelebration);
                }
                const c = this.celebrationQueue.shift();
                this.lastCelebration = c;
                return c;
            }
        };

        let sceneOffsetX = 0;
        let sceneOffsetY = 0;

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            viewW = window.innerWidth;
            viewH = window.innerHeight;
            canvas.width = Math.floor(viewW * dpr);
            canvas.height = Math.floor(viewH * dpr);
            canvas.style.width = viewW + 'px';
            canvas.style.height = viewH + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            sceneScale = Math.min(viewW / LOGICAL_W, viewH / LOGICAL_H);
            sceneOffsetX = (viewW - LOGICAL_W * sceneScale) * 0.5;
            sceneOffsetY = (viewH - LOGICAL_H * sceneScale) * 0.5;
        }

        function screenToLogical(sx, sy) {
            return {
                x: (sx - sceneOffsetX) / sceneScale,
                y: (sy - sceneOffsetY) / sceneScale
            };
        }

                // Gliding seagulls

                    c.life += dt;
                    c.vy += 980 * dt;
                    c.x += c.vx * dt;
                    c.y += c.vy * dt;
                    c.rot += c.vrot * dt;

                    if (!c.bounced && c.y >= c.landingY) {
                        c.y = c.landingY;
                        c.bounced = true;
                        if (c.inWater) {
                            SoundFX.coconutSplash();
                            this.waterRipples.push({ x: c.x, y: c.y, r: 8, alpha: 0.9 });
                            for (let s = 0; s < 10; s++) {
                                this.particles.push({
                                    kind: 'droplet',
                                    x: c.x,
                                    y: c.y,
                                    vx: (Math.random() - 0.5) * 140,
                                    vy: -120 - Math.random() * 120,
                                    gravity: 540,
                                    size: 4 + Math.random() * 3,
                                    color: '#d8f9ff',
                                    life: 0,
                                    maxLife: 0.65
                                });
                            }
                            this.fallingCoconuts.splice(i, 1);
                            continue;
                        } else {
                            SoundFX.coconutBonk();
                            c.vy = -210;
                            c.vx *= 1.25;
                        }
                    } else if (c.bounced && c.y >= c.landingY) {
                        c.y = c.landingY;
                        c.vy = 0;
                        c.vx *= 0.9;
                        c.alpha -= dt * 0.9;
                        if (c.alpha <= 0) {
                            this.fallingCoconuts.splice(i, 1);
                        }
                    }
                }

                // Water ripples
                for (let i = this.waterRipples.length - 1; i >= 0; i--) {
                    const r = this.waterRipples[i];
                    r.r += 70 * dt;
                    r.alpha -= 1.1 * dt;
                    if (r.alpha <= 0) this.waterRipples.splice(i, 1);
                }

                // Cannon recoil & smoke
                if (this.cannonRecoil > 0) this.cannonRecoil = Math.max(0, this.cannonRecoil - dt * 3.8);
                for (let i = this.cannonSmoke.length - 1; i >= 0; i--) {
                    const s = this.cannonSmoke[i];
                    s.life += dt;
                    s.x += s.vx * dt;
                    s.y += s.vy * dt;
                    s.r += 24 * dt;
                    if (s.life >= s.maxLife) this.cannonSmoke.splice(i, 1);
                }

                // Phase state machine
                if (this.phase === 'arriving') {
                    const dur = 1.15;
                    const p = Math.min(1, this.phaseTime / dur);
                    const ease = 1 - Math.pow(1 - p, 3);
                    this.shipX = this.shipStartX + (this.shipDockX - this.shipStartX) * ease;
                    this.chestOpen = Math.max(0, this.chestOpen - dt * 3);
                    this.chestGlow = Math.max(0, this.chestGlow - dt * 3);
                    this.girlCheerAmount = Math.max(0, this.girlCheerAmount - dt * 3);
                    if (p >= 1) {
                        this.shipX = this.shipDockX;
                        this.phase = 'ready';
                        this.phaseTime = 0;
                        SoundFX.shipDock();
                    }
                } else if (this.phase === 'tossing') {
                    this.sack.t += dt / this.sack.duration;
                    this.chestOpen = Math.min(0.35, this.sack.t * 0.4);
                    if (this.sack.t >= 1) {
                        this.sack.active = false;
                        this.launchCelebration();
                    }
                } else if (this.phase === 'celebrating') {
                    this.chestOpen = Math.min(1, this.chestOpen + dt * 6.5);
                    this.chestGlow = Math.min(1, this.chestGlow + dt * 4.5);
                    this.girlCheerAmount = Math.min(1, this.girlCheerAmount + dt * 5);

                    if (this.celebrationId === 3) {
                        const fade = this.phaseTime < 1.6
                            ? Math.min(1, this.phaseTime * 2.2)
                            : Math.max(0, 1 - (this.phaseTime - 1.6) * 1.8);
                        this.rainbowAlpha = fade;
                    }

                    if (this.macaw) {
                        this.macaw.t += dt / this.macaw.duration;
                        const u = this.macaw.t;
                        this.macaw.x = -120 + (LOGICAL_W + 260) * u;
                        this.macaw.y = 215 - Math.sin(u * Math.PI) * 110 + Math.sin(u * Math.PI * 5) * 14;
                        if (Math.random() < 0.55) {
                            this.particles.push({
                                kind: 'sparkle',
                                x: this.macaw.x - 24,
                                y: this.macaw.y + 8,
                                vx: -30 + (Math.random() - 0.5) * 40,
                                vy: 20 + Math.random() * 40,
                                gravity: 45,
                                rot: Math.random() * Math.PI,
                                vrot: 4,
                                size: 6 + Math.random() * 5,
                                color: Math.random() < 0.5 ? '#ffe77a' : '#ff8c42',
                                life: 0,
                                maxLife: 0.75
                            });
                        }
                    }

                    for (const d of this.dolphins) {
                        const localT = (this.phaseTime - d.delay) / d.duration;
                        if (localT >= 0 && !d.entered) {
                            d.entered = true;
                            this.waterRipples.push({ x: d.startX, y: d.baseY, r: 12, alpha: 0.9 });
                        }
                        if (localT >= 0.96 && !d.exited) {
                            d.exited = true;
                            this.waterRipples.push({ x: d.endX, y: d.baseY, r: 12, alpha: 0.95 });
                            for (let k = 0; k < 14; k++) {
                                this.particles.push({
                                    kind: 'droplet',
                                    x: d.endX + (Math.random() - 0.5) * 30,
                                    y: d.baseY,
                                    vx: (Math.random() - 0.5) * 180,
                                    vy: -140 - Math.random() * 140,
                                    gravity: 540,
                                    size: 4 + Math.random() * 4,
                                    color: '#d9faff',
                                    life: 0,
                                    maxLife: 0.65
                                });
                            }
                        }
                    }

                    if (this.phaseTime >= 2.25) {
                        this.pendingNextAdvance = true;
                        SoundFX.shipSailOff();
                        this.phase = 'departing';
                        this.phaseTime = 0;
                    }
                } else if (this.phase === 'departing') {
                    // Ship sails FORWARD past the island and off the right edge!
                    const dur = 1.2;
                    const p = Math.min(1, this.phaseTime / dur);
                    // Smooth natural forward acceleration catching the wind
                    const ease = p * p * (1.4 - 0.4 * p);
                    this.shipX = this.shipDockX + (this.shipExitX - this.shipDockX) * ease;
                    this.chestOpen = Math.max(0, this.chestOpen - dt * 3.8);
                    this.chestGlow = Math.max(0, this.chestGlow - dt * 3.2);
                    this.girlCheerAmount = Math.max(0, this.girlCheerAmount - dt * 3.2);
                    this.rainbowAlpha = Math.max(0, this.rainbowAlpha - dt * 2.5);

                    if (p >= 1) {
                        if (this.pendingNextAdvance) {
                            this.shipText = GameState.advanceBucket(GameState.lang, GameState.mode);
                        } else {
                            this.shipText = GameState.getCurrentText();
                        }
                        this.shipAnimal = GameState.nextAnimal();
                        this.sailThemeIdx = GameState.nextSailTheme();
                        this.hasSackOnAnimal = true;
                        this.shipX = this.shipStartX;
                        this.particles = [];
                        this.dolphins = [];
                        this.macaw = null;
                        this.phase = 'arriving';
                        this.phaseTime = 0;
                    }
                }

                // Update active particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const pt = this.particles[i];
                    pt.life += dt;
                    if (pt.life >= pt.maxLife) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    if (pt.kind === 'butterfly') {
                        pt.angle += pt.speed * dt;
                        pt.flapPhase += dt * 16;
                        const targetR = pt.radius * (0.7 + 0.35 * Math.sin(pt.life * 2.1));
                        pt.x = pt.centerX + Math.cos(pt.angle) * targetR;
                        pt.y = pt.centerY + Math.sin(pt.angle * 1.4) * (targetR * 0.55) - pt.life * 32;
                    } else {
                        pt.vy += (pt.gravity || 0) * dt;
                        pt.x += pt.vx * dt;
                        pt.y += pt.vy * dt;
                        if (pt.kind === 'bubble') {
                            pt.x += Math.sin(this.time * 4 + pt.rot) * 28 * dt;
                        }
                        if (pt.kind === 'firefly') {
                            pt.x += Math.cos(this.time * 5 + pt.rot) * 42 * dt;
                        }
                        if (pt.vrot) pt.rot += pt.vrot * dt;
                    }
                }
            }
        };

        /* =====================================================================
           5. PAINTERLY PROCEDURAL CANVAS RENDERING ENGINE
           ===================================================================== */

        function roundRectPath(c, x, y, w, h, r) {
            c.beginPath();
            c.moveTo(x + r, y);
            c.arcTo(x + w, y, x + w, y + h, r);
            c.arcTo(x + w, y + h, x, y + h, r);
            c.arcTo(x, y + h, x, y, r);
            c.arcTo(x, y, x + w, y, r);
            c.closePath();
        }

        /* ----- 5.2 LAYERED ANIMATED OCEAN ----- */
        function drawOceanLayer(layerIndex) {
            const t = Scene.time;
            const configs = [
                { y: 472, amp: 5.5, freq: 0.011, speed: 1.0, colTop: '#24a5ad', colBot: '#158194', foam: 0.25 },
                { y: 532, amp: 7.5, freq: 0.0095, speed: -1.35, colTop: '#1a909e', colBot: '#116e84', foam: 0.32 },
                { y: 604, amp: 9.5, freq: 0.0085, speed: 1.75, colTop: '#157e92', colBot: '#0d5e76', foam: 0.42 },
                { y: 704, amp: 12.0, freq: 0.0075, speed: -2.05, colTop: '#116a82', colBot: '#094a63', foam: 0.52 },
                { y: 804, amp: 13.5, freq: 0.0068, speed: 2.35, colTop: '#0d5872', colBot: '#07384d', foam: 0.55 }
            ];
            const cfg = configs[layerIndex];

            const minX = -600;
            const maxX = LOGICAL_W + 600;

            const grad = ctx.createLinearGradient(0, cfg.y - 20, 0, cfg.y + 180);
            grad.addColorStop(0, cfg.colTop);
            grad.addColorStop(1, cfg.colBot);

            ctx.beginPath();
            ctx.moveTo(minX, LOGICAL_H + 350);
            for (let x = minX; x <= maxX; x += 32) {
                const wy = cfg.y
                    + Math.sin(x * cfg.freq + t * cfg.speed) * cfg.amp
                    + Math.cos(x * cfg.freq * 1.9 - t * cfg.speed * 0.7) * (cfg.amp * 0.42);
                ctx.lineTo(x, wy);
            }
            ctx.lineTo(maxX, LOGICAL_H + 350);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.save();
            ctx.strokeStyle = `rgba(218, 250, 255, ${cfg.foam * 0.55})`;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            for (let x = minX; x <= maxX; x += 36) {
                const wy = cfg.y
                    + Math.sin(x * cfg.freq + t * cfg.speed) * cfg.amp
                    + Math.cos(x * cfg.freq * 1.9 - t * cfg.speed * 0.7) * (cfg.amp * 0.42);
                if (x === minX) ctx.moveTo(x, wy);
                else ctx.lineTo(x, wy);
            }
            ctx.stroke();

            if (layerIndex <= 3) {
                ctx.fillStyle = 'rgba(255, 240, 182, 0.36)';
                for (let k = 0; k < 10; k++) {
                    const gx = 165 + k * 34 + Math.sin(t * 2.2 + k * 1.7 + layerIndex) * 18;
                    const gy = cfg.y + 12 + Math.sin(gx * cfg.freq + t * cfg.speed) * cfg.amp;
                    const gw = 14 + Math.sin(t * 3.5 + k * 2.1) * 9;
                    ctx.beginPath();
                    ctx.ellipse(gx, gy, Math.max(4, gw), 2.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        }

        function drawPalmTree(palm, scale, curveDir) {
            const t = Scene.time;
            const windSway = Math.sin(t * 1.45 + palm.id * 1.7) * 14 + Math.sin(t * 22) * palm.shake * 10;

            const bx = palm.baseX;
            const by = palm.baseY;
            const cx = palm.crownX + windSway * 0.55;
            const cy = palm.crownY;
            const ctrlX = bx + (cx - bx) * 0.35 + curveDir * 68;
            const ctrlY = (by + cy) * 0.52;

            ctx.save();
            const steps = 16;
            for (let i = 0; i < steps; i++) {
                const u0 = i / steps;
                const u1 = (i + 1) / steps;
                const x0 = (1-u0)*(1-u0)*bx + 2*(1-u0)*u0*ctrlX + u0*u0*cx;
                const y0 = (1-u0)*(1-u0)*by + 2*(1-u0)*u0*ctrlY + u0*u0*cy;
                const x1 = (1-u1)*(1-u1)*bx + 2*(1-u1)*u1*ctrlX + u1*u1*cx;
                const y1 = (1-u1)*(1-u1)*by + 2*(1-u1)*u1*ctrlY + u1*u1*cy;
                const w = (24 * (1 - u0 * 0.58)) * scale;

                ctx.strokeStyle = i % 2 === 0 ? '#7c5330' : '#654022';
                ctx.lineWidth = w;
                ctx.lineCap = 'butt';
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(226, 178, 115, 0.28)';
                ctx.lineWidth = w * 0.28;
                ctx.beginPath();
                ctx.moveTo(x0 - w * 0.25, y0);
                ctx.lineTo(x1 - w * 0.25, y1);
                ctx.stroke();
            }

            const frondAngles = [-2.55, -2.05, -1.35, -0.58, -0.05, 0.45, 2.75];
            frondAngles.forEach((baseA, idx) => {
                const sway = Math.sin(t * 1.9 + idx * 0.8 + palm.id) * 0.08 + Math.sin(t * 24 + idx) * palm.shake * 0.08;
                const a = baseA + sway;
                const len = (118 + (idx % 3) * 18) * scale;
                const ex = cx + Math.cos(a) * len;
                const ey = cy + Math.sin(a) * len + 34 * scale;
                const mx = cx + Math.cos(a) * len * 0.52;
                const my = cy + Math.sin(a) * len * 0.46 - 18 * scale;

                const grad = ctx.createLinearGradient(cx, cy, ex, ey);
                grad.addColorStop(0, idx % 2 === 0 ? '#2f7228' : '#3d8b32');
                grad.addColorStop(0.65, idx % 2 === 0 ? '#4ca338' : '#5db842');
                grad.addColorStop(1, '#75c74b');

                ctx.strokeStyle = '#336e24';
                ctx.lineWidth = 3.2 * scale;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.quadraticCurveTo(mx, my, ex, ey);
                ctx.stroke();

                ctx.fillStyle = grad;
                const leafCount = 11;
                for (let l = 1; l < leafCount; l++) {
                    const u = l / leafCount;
                    const lx = (1-u)*(1-u)*cx + 2*(1-u)*u*mx + u*u*ex;
                    const ly = (1-u)*(1-u)*cy + 2*(1-u)*u*my + u*u*ey;
                    const leafLen = (34 * Math.sin(u * Math.PI) + 8) * scale;
                    const droop = 0.7 + u * 0.55;
                    ctx.beginPath();
                    ctx.moveTo(lx, ly);
                    ctx.quadraticCurveTo(lx + Math.cos(a + droop) * leafLen * 0.6, ly + Math.sin(a + droop) * leafLen * 0.6, lx + Math.cos(a + droop) * leafLen, ly + Math.sin(a + droop) * leafLen + 8);
                    ctx.quadraticCurveTo(lx + Math.cos(a + droop - 0.3) * leafLen * 0.45, ly + Math.sin(a + droop - 0.3) * leafLen * 0.45, lx, ly);
                    ctx.fill();
                }
            });

            // Cluster of coconuts
            const cocoPos = [[-11, 10], [8, 12], [-1, 20]];
            for (const [ox, oy] of cocoPos) {
                const cGrad = ctx.createRadialGradient(cx + ox - 3, cy + oy - 3, 2, cx + ox, cy + oy, 11 * scale);
                cGrad.addColorStop(0, '#8a582e');
                cGrad.addColorStop(0.6, '#5c3416');
                cGrad.addColorStop(1, '#3a1f0b');
                ctx.fillStyle = cGrad;
                ctx.beginPath();
                ctx.arc(cx + ox * scale, cy + oy * scale, 10.5 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        /* ----- 5.5 CLOSE-UP PIRATE GIRL STANDING ON ISLAND SAND ----- */
        function drawPirateGirl() {
            const t = Scene.time;
            const cheer = Scene.girlCheerAmount;
            const cType = Scene.girlCelebrateType;

            let jumpY = 0;
            let bodyTilt = Math.sin(t * 1.4) * 0.018;
            let rightArmAngle = -0.35 + Math.sin(t * 1.8) * 0.06;
            let leftArmAngle = 0.25 + Math.sin(t * 1.6) * 0.05;

            if (cheer > 0.01) {
                if (cType === 0) {
                    jumpY = -Math.abs(Math.sin(t * 9.5)) * 34 * cheer;
                    rightArmAngle = -2.35 + Math.sin(t * 11) * 0.25;
                    leftArmAngle = -2.2 + Math.cos(t * 11) * 0.25;
                } else if (cType === 1) {
                    jumpY = -Math.abs(Math.sin(t * 7.2)) * 18 * cheer;
                    rightArmAngle = -2.6 + Math.sin(t * 13) * 0.32;
                    hatLift = 16 * cheer;
                } else if (cType === 2) {
                    jumpY = -Math.abs(Math.sin(t * 11)) * 22 * cheer;
                    bodyTilt = Math.sin(t * 11) * 0.14 * cheer;
                    rightArmAngle = -1.6 + Math.sin(t * 11) * 0.45;
                    leftArmAngle = -1.5 - Math.sin(t * 11) * 0.45;

            const hairWave = Math.sin(t * 3.1) * 8;

            hairGrad.addColorStop(0.5, '#6b2912');

            ctx.bezierCurveTo(32, -108, 12, -126, -20, -112);

            ctx.beginPath();
            ctx.moveTo(-22, -26);
            ctx.lineTo(22, -26);
            ctx.lineTo(36, 14);
            ctx.quadraticCurveTo(0, 22, -36, 14);
            ctx.closePath();
            ctx.fill();

            const skirtGrad = ctx.createLinearGradient(-28, -32, 28, 12);
            skirtGrad.addColorStop(0, '#b92e36');
            skirtGrad.addColorStop(1, '#7f1a22');
            ctx.fillStyle = skirtGrad;
            ctx.beginPath();
            ctx.moveTo(-20, -32);
            ctx.lineTo(20, -32);

            ctx.quadraticCurveTo(10, 14, -4, 4);

            ctx.translate(-22, -74 + breath);

        function drawBillowingMainsailWithText(theme) {
            const t = Scene.time;
            const billow = Math.sin(t * 2.15) * 10 + Math.cos(t * 1.35) * 4;
            const swayX = Math.sin(t * 1.8) * 4.5;
            const cx = -46; // Sail center aligned with aft-shifted mainmast

            ctx.save();

            // Upper & lower wooden yardarms (raised cleanly above the deck!)
            const drawYard = (yy, halfW) => {
                const yg = ctx.createLinearGradient(0, yy - 6, 0, yy + 6);
                yg.addColorStop(0, '#8d582e');
                yg.addColorStop(1, '#4b2710');
                ctx.fillStyle = yg;
                roundRectPath(ctx, cx - halfW, yy - 6, halfW * 2, 12, 5);
                ctx.fill();
                ctx.strokeStyle = '#331808';
                ctx.lineWidth = 1.8;
                ctx.stroke();
            };

            drawYard(-316, 148);
            drawYard(-116, 140);

            // Softly tinted billowing linen sail
            const sailGrad = ctx.createLinearGradient(cx - 145, -312, cx + 145, -116);
            sailGrad.addColorStop(0, theme.top);
            sailGrad.addColorStop(0.32, theme.mid);
            sailGrad.addColorStop(0.72, theme.low);
            sailGrad.addColorStop(1, theme.edge);

            const defineSailPath = () => {
                ctx.beginPath();
                ctx.moveTo(cx - 144, -310);
                ctx.quadraticCurveTo(cx, -320 + billow * 0.24, cx + 138, -310);
                ctx.quadraticCurveTo(cx + 158 + billow + swayX, -214, cx + 132 + swayX * 0.4, -122);
                ctx.quadraticCurveTo(cx, -108 - billow * 0.25, cx - 138 + swayX * 0.4, -122);
                ctx.quadraticCurveTo(cx - 118 + billow * 0.72 + swayX, -214, cx - 144, -310);
                ctx.closePath();
            };

            defineSailPath();
            ctx.fillStyle = sailGrad;
            ctx.fill();

            // Clipped fabric seams, trim & crisp reading text
            ctx.save();
            ctx.clip();

            ctx.strokeStyle = 'rgba(110, 82, 48, 0.18)';
            ctx.lineWidth = 1.5;
            for (let sx = cx - 95; sx <= cx + 95; sx += 46) {
                ctx.beginPath();
                ctx.moveTo(sx, -325);
                ctx.quadraticCurveTo(sx + billow * 0.75 + swayX, -214, sx, -105);
                ctx.stroke();
            }

            const foldGrad = ctx.createLinearGradient(0, -155, 0, -108);
            foldGrad.addColorStop(0, 'rgba(95, 65, 32, 0)');
            foldGrad.addColorStop(1, 'rgba(95, 65, 32, 0.22)');
            ctx.fillStyle = foldGrad;
            ctx.fillRect(cx - 170, -155, 340, 56);

            // Subtle woven nautical stripes near top & bottom of sail
            ctx.strokeStyle = theme.stripe;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx - 155, -294); ctx.quadraticCurveTo(cx, -301 + billow * 0.2, cx + 155, -294);
            ctx.moveTo(cx - 155, -135); ctx.quadraticCurveTo(cx, -125 - billow * 0.2, cx + 155, -135);
            ctx.stroke();

            // CRISP, HIGH-CONTRAST READING TEXT ON THE SAIL
            const txt = Scene.shipText || '';
            if (txt) {
                ctx.save();
                ctx.translate(cx + 4 + billow * 0.4 + swayX * 0.55, -214);
                ctx.rotate(billow * 0.002);

                let fontSize = 94;
                if (txt.length === 3) fontSize = 80;
                else if (txt.length === 4) fontSize = 70;
                else if (txt.length === 5) fontSize = 60;
                else if (txt.length >= 6) fontSize = 52;

                ctx.font = `900 ${fontSize}px 'Rubik', 'Nunito', 'Trebuchet MS', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const measured = ctx.measureText(txt).width;
                const maxSailTextW = 232;
                if (measured > maxSailTextW) {
                    fontSize = Math.floor(fontSize * (maxSailTextW / measured));
                    ctx.font = `900 ${fontSize}px 'Rubik', 'Nunito', 'Trebuchet MS', sans-serif`;
                }

                ctx.lineWidth = 7;
                ctx.strokeStyle = 'rgba(255, 250, 236, 0.78)';
                ctx.lineJoin = 'round';
                ctx.strokeText(txt, 0, 2);

                ctx.fillStyle = '#221510';
                ctx.fillText(txt, 0, 2);
                ctx.restore();
            }

            ctx.restore(); // end clip

            // Sail rope outline
            defineSailPath();
            ctx.strokeStyle = theme.rope;
            ctx.lineWidth = 2.4;
            ctx.stroke();

            // Rope lashes along top yardarm
            ctx.strokeStyle = '#6f4b24';
            ctx.lineWidth = 2.2;
            for (let rx = cx - 122; rx <= cx + 122; rx += 35) {
                ctx.beginPath();
                ctx.moveTo(rx, -321);
                ctx.lineTo(rx, -308);
                ctx.stroke();
            }

            ctx.restore();
        }

        /* ----- 5.7 TEN REALISTIC PROCEDURAL ANIMALS ON CLEAR OPEN DECK ----- */
        function drawAnimalOnDeck() {
            const t = Scene.time;
            let hopY = 0;
            if (Scene.phase === 'tossing') {
                hopY = -Math.sin(Math.min(1, Scene.sack.t * 1.4) * Math.PI) * 28;
            } else if (Scene.phase === 'celebrating') {
                hopY = -Math.abs(Math.sin(t * 9)) * 18;
            } else {
                hopY = Math.sin(t * 2.8) * 2.2;
            }

            ctx.save();
            // Standing proudly in the completely clear open bow deck well ahead of the sail!
            ctx.translate(148, -48 + hopY);
            ctx.scale(1.06, 1.06);

            // Burlap sack slung over shoulder behind back
            if (Scene.hasSackOnAnimal) {
                drawBurlapSack(-28, -28, -0.25, 0.96);
            }

            const type = Scene.shipAnimal % ANIMAL_COUNT;
            const blink = Scene.animalBlinking;

            switch (type) {
                case 0: drawFox(t, blink); break;
                case 1: drawBear(t, blink); break;
                case 2: drawRaccoon(t, blink); break;
                case 3: drawHare(t, blink); break;
                case 4: drawGingerCat(t, blink); break;
                case 5: drawDog(t, blink); break;
                case 6: drawSquirrel(t, blink); break;
                case 7: drawHedgehog(t, blink); break;
                case 8: drawMonkey(t, blink); break;
                case 9: drawOwl(t, blink); break;
            }

            if (Scene.hasSackOnAnimal) {
                ctx.strokeStyle = '#755029';
                ctx.lineWidth = 4.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-16, -24);
                ctx.quadraticCurveTo(-2, -10, 12, -2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawBurlapSack(x, y, rot, scale) {
