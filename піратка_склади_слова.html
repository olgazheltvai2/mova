        /* ----- 5.8 FLYING SACK, COCONUTS & 6 DIVERSE CELEBRATIONS ----- */
        function drawFlyingSack() {
            if (!Scene.sack.active) return;
            const s = Scene.sack;
            const u = Math.min(1, s.t);
            const x = s.startX + (s.endX - s.startX) * u;
            const arcH = 250;
            const y = s.startY + (s.endY - s.startY) * u - Math.sin(u * Math.PI) * arcH;
            const rot = u * Math.PI * 2.2;
            const scale = 1.08 + Math.sin(u * Math.PI) * 0.25;

            ctx.save();
            for (let i = 1; i <= 4; i++) {
                const tu = Math.max(0, u - i * 0.045);
                const tx = s.startX + (s.endX - s.startX) * tu;
                const ty = s.startY + (s.endY - s.startY) * tu - Math.sin(tu * Math.PI) * arcH;
                ctx.fillStyle = `rgba(255, 232, 145, ${0.5 - i * 0.1})`;
                ctx.beginPath();
                ctx.arc(tx, ty, 6.5 - i, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            drawBurlapSack(x, y, rot, scale);
        }

        function drawFallingCoconuts() {
            for (const c of Scene.fallingCoconuts) {
                ctx.save();
                ctx.globalAlpha = c.alpha;
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rot);
                const cg = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
                cg.addColorStop(0, '#8d592e');
                cg.addColorStop(0.65, '#593215');
                cg.addColorStop(1, '#361c0a');
                ctx.fillStyle = cg;
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawDolphins() {
            for (const d of Scene.dolphins) {
                const u = (Scene.phaseTime - d.delay) / d.duration;
                if (u < 0 || u > 1) continue;
                const x = d.startX + (d.endX - d.startX) * u;
                const y = d.baseY - Math.sin(u * Math.PI) * d.peakH;
                const dx = d.endX - d.startX;
                const dy = -Math.cos(u * Math.PI) * Math.PI * d.peakH;
                const angle = Math.atan2(dy, dx);

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.scale(d.scale, d.scale);

                const dg = ctx.createLinearGradient(0, -18, 0, 16);
                dg.addColorStop(0, '#4a7fa8');
                dg.addColorStop(0.55, '#7db2d4');
                dg.addColorStop(1, '#e1f2fa');
                ctx.fillStyle = dg;
                ctx.beginPath();
                ctx.moveTo(42, 2);
                ctx.quadraticCurveTo(26, -16, -6, -15);
                ctx.quadraticCurveTo(-34, -12, -52, 4);
                ctx.lineTo(-66, -10);
                ctx.lineTo(-56, 5);
                ctx.lineTo(-66, 17);
                ctx.lineTo(-48, 8);
                ctx.quadraticCurveTo(-16, 15, 22, 11);
                ctx.quadraticCurveTo(36, 9, 42, 2);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#487da6';
                ctx.beginPath();
                ctx.moveTo(-4, -14);
                ctx.quadraticCurveTo(-18, -32, -24, -12);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#5a8eb6';
                ctx.beginPath();
                ctx.ellipse(6, 10, 10, 4.5, 0.65, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#182b3a';
                ctx.beginPath();
                ctx.arc(26, -1, 2.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function drawMacawParrot() {
            if (!Scene.macaw || Scene.macaw.t > 1) return;
            const m = Scene.macaw;
            const flap = Math.sin(Scene.time * 17) * 32;

            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.scale(1.12, 1.12);

            ctx.fillStyle = '#2075d8';
            ctx.beginPath();
            ctx.moveTo(-22, 4);
            ctx.lineTo(-76, 18);
            ctx.lineTo(-68, 25);
            ctx.lineTo(-18, 10);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#e52b38';
            ctx.beginPath();
            ctx.moveTo(-20, 2);
            ctx.lineTo(-70, 8);
            ctx.lineTo(-66, 14);
            ctx.lineTo(-16, 8);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#1f6bd1';
            ctx.beginPath();
            ctx.moveTo(-6, -2);
            ctx.quadraticCurveTo(-16, -42 + flap * 0.7, 14, -22 + flap * 0.5);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#e82c38';
            ctx.beginPath();
            ctx.ellipse(2, 2, 24, 13, -0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(24, -5, 11.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff9eb';
            ctx.beginPath();
            ctx.ellipse(26, -6, 6.5, 4.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1b1614';
            ctx.beginPath();
            ctx.arc(27, -6, 2.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f2cc55';
            ctx.beginPath();
            ctx.moveTo(34, -8);
            ctx.quadraticCurveTo(44, -6, 41, 4);
            ctx.lineTo(33, 0);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#f2323c';
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.quadraticCurveTo(-22, -48 - flap, 12, -26 - flap * 0.8);
            ctx.quadraticCurveTo(10, -8, 12, 2);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#ffd138';
            ctx.beginPath();
            ctx.moveTo(-8, -8);
            ctx.quadraticCurveTo(-12, -32 - flap * 0.65, 8, -18 - flap * 0.55);
            ctx.lineTo(4, -4);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function drawCannonSmoke() {
            for (const s of Scene.cannonSmoke) {
                const alpha = Math.max(0, 1 - s.life / s.maxLife) * 0.55;
                ctx.fillStyle = `rgba(255, 242, 208, ${alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawParticles() {
            for (const pt of Scene.particles) {
                const alpha = Math.min(1, (1 - pt.life / pt.maxLife) * 1.6);
                ctx.save();
                ctx.globalAlpha = Math.max(0, alpha);
                ctx.translate(pt.x, pt.y);

                if (pt.kind === 'coin') {
                    ctx.rotate(pt.rot);
                    const spin = Math.cos(pt.life * 12 + pt.rot);
                    ctx.scale(Math.max(0.25, Math.abs(spin)), 1);
                    ctx.fillStyle = '#ffd644';
                    ctx.beginPath();
                    ctx.arc(0, 0, pt.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#b5740c';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#fff5b3';
                    ctx.beginPath();
                    ctx.arc(-pt.size * 0.25, -pt.size * 0.25, pt.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else if (pt.kind === 'gem') {
                    ctx.rotate(pt.rot);
                    ctx.fillStyle = pt.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -pt.size);
                    ctx.lineTo(pt.size * 0.78, 0);
                    ctx.lineTo(0, pt.size);
                    ctx.lineTo(-pt.size * 0.78, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.beginPath();
                    ctx.moveTo(0, -pt.size * 0.75);
                    ctx.lineTo(pt.size * 0.35, -pt.size * 0.1);
                    ctx.lineTo(0, 0);
                    ctx.lineTo(-pt.size * 0.35, -pt.size * 0.1);
                    ctx.closePath();
                    ctx.fill();
                } else if (pt.kind === 'droplet' || pt.kind === 'pearl') {
                    const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, pt.size);
                    g.addColorStop(0, '#ffffff');
                    g.addColorStop(1, pt.color);
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(0, 0, pt.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (pt.kind === 'petal') {
                    ctx.rotate(pt.rot);
                    ctx.fillStyle = pt.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, pt.size, pt.size * 0.58, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (pt.kind === 'sparkle' || pt.kind === 'star') {
                    ctx.rotate(pt.rot);
                    ctx.fillStyle = pt.color;
                    const spikes = pt.kind === 'star' ? 5 : 4;
                    const rOuter = pt.size;
                    const rInner = pt.size * 0.42;
                    ctx.beginPath();
                    for (let k = 0; k < spikes * 2; k++) {
                        const r = k % 2 === 0 ? rOuter : rInner;
                        const a = (k * Math.PI) / spikes;
                        if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                } else if (pt.kind === 'bubble') {
                    const bg = ctx.createRadialGradient(-pt.size * 0.3, -pt.size * 0.3, 1, 0, 0, pt.size);
                    bg.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                    bg.addColorStop(0.55, 'rgba(170, 238, 255, 0.22)');
                    bg.addColorStop(0.85, 'rgba(255, 185, 235, 0.36)');
                    bg.addColorStop(1, 'rgba(180, 245, 255, 0.72)');
                    ctx.fillStyle = bg;
                    ctx.beginPath();
                    ctx.arc(0, 0, pt.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                } else if (pt.kind === 'ribbon') {
                    ctx.rotate(pt.rot);
                    ctx.fillStyle = pt.color;
                    ctx.fillRect(-pt.size * 0.6, -pt.size * 0.24, pt.size * 1.2, pt.size * 0.48);
                } else if (pt.kind === 'firefly') {
                    const fg = ctx.createRadialGradient(0, 0, 1, 0, 0, pt.size * 2.8);
                    fg.addColorStop(0, 'rgba(255, 254, 214, 1)');
                    fg.addColorStop(0.4, 'rgba(255, 224, 96, 0.75)');
                    fg.addColorStop(1, 'rgba(255, 200, 50, 0)');
                    ctx.fillStyle = fg;
                    ctx.beginPath();
                    ctx.arc(0, 0, pt.size * 2.8, 0, Math.PI * 2);
                    ctx.fill();
                } else if (pt.kind === 'butterfly') {
                    const wingScale = 0.25 + Math.abs(Math.sin(pt.flapPhase)) * 0.85;
                    ctx.rotate(Math.sin(pt.angle) * 0.35);
                    ctx.fillStyle = pt.color;
                    ctx.save();
                    ctx.scale(wingScale, 1);
                    ctx.beginPath();
                    ctx.ellipse(-pt.size * 0.55, -pt.size * 0.25, pt.size * 0.65, pt.size * 0.48, -0.3, 0, Math.PI * 2);
                    ctx.ellipse(pt.size * 0.55, -pt.size * 0.25, pt.size * 0.65, pt.size * 0.48, 0.3, 0, Math.PI * 2);
                    ctx.ellipse(-pt.size * 0.4, pt.size * 0.35, pt.size * 0.42, pt.size * 0.34, 0.3, 0, Math.PI * 2);
                    ctx.ellipse(pt.size * 0.4, pt.size * 0.35, pt.size * 0.42, pt.size * 0.34, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    ctx.fillStyle = '#2c1d15';
                    ctx.fillRect(-1.5, -pt.size * 0.45, 3, pt.size * 0.9);
                }

                ctx.restore();
            }
        }

        /* ----- MASTER FRAME RENDER (PROPER DEPTH LAYERING) ----- */
        function renderFrame() {
            ctx.clearRect(0, 0, viewW, viewH);

            // 1. Seamless full-bleed sky & sea backdrop
            drawFullBleedSkyAndOceanBackdrop();

            // 2. Transform into logical 1600x900 close-up widescreen stage
            ctx.save();
            ctx.translate(sceneOffsetX, sceneOffsetY);
            ctx.scale(sceneScale, sceneScale);

            drawSkyDetails();
            drawOceanLayer(0);
            drawOceanLayer(1);
            drawOceanLayer(2);

            // Pirate ship sails across open sea and glides forward behind the foreground island!
            drawShipAndAnimal();

            // Foreground ocean waves lapping against the ship's hull
            drawOceanLayer(3);
            drawDolphins();
            drawWaterRipples();
            drawOceanLayer(4);

            // FOREGROUND TROPICAL ISLAND DRAWN ABOVE OCEAN:
            // Ensures beach sand, treasure chest & pirate girl are 100% on dry land!
            drawIslandForeground();

            // Treasure chest & pirate girl firmly planted on the bright sandy island shore
            drawTreasureChest();
            drawPirateGirl();

            // Active effects drawn cleanly above everything
            drawFallingCoconuts();
            drawCannonSmoke();
            drawFlyingSack();
            drawMacawParrot();
            drawParticles();

            ctx.restore();
        }

        /* =====================================================================
           6. INTERACTION, HIT-TESTING & UI CONTROLS
           ===================================================================== */
        function hitTestCanvas(lx, ly) {
            // 1. Ship / sail / animal hitbox (adjusted for close-up scale)
            const sx = Scene.shipX;
            const sy = SHIP_BASE_Y + Scene.getShipBobY();
            if (lx >= sx - 270 && lx <= sx + 300 && ly >= sy - 420 && ly <= sy + 68) {
                return { type: 'ship' };
            }
            // 2. Treasure chest hitbox on island sand
            if (lx >= CHEST_X - 88 && lx <= CHEST_X + 88 && ly >= CHEST_Y - 82 && ly <= CHEST_Y + 62) {
                return { type: 'chest' };
            }
            // 3. Pirate girl hitbox on island sand
            if (lx >= GIRL_X - 65 && lx <= GIRL_X + 65 && ly >= GIRL_Y - 205 && ly <= GIRL_Y + 70) {
                return { type: 'chest' };
            }
            // 4. Interactive coconut palm crowns
            for (const palm of Scene.palmTrees) {
                const dx = lx - palm.crownX;
                const dy = ly - palm.crownY;
                if (dx * dx + dy * dy <= 118 * 118) {
                    return { type: 'palm', palm };
                }
            }
            return null;
        }

        canvas.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const pt = screenToLogical(e.clientX - rect.left, e.clientY - rect.top);
            const hit = hitTestCanvas(pt.x, pt.y);
            Scene.hoverTarget = hit ? hit.type : null;
            canvas.style.cursor = hit ? 'pointer' : 'default';
        });

        canvas.addEventListener('pointerdown', (e) => {
            SoundFX.init();
            if (consonantTray.classList.contains('open')) {
                consonantTray.classList.remove('open');
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const pt = screenToLogical(e.clientX - rect.left, e.clientY - rect.top);
            const hit = hitTestCanvas(pt.x, pt.y);
            if (!hit) return;

            if (hit.type === 'palm') {
                Scene.dropCoconut(hit.palm);
            } else if (hit.type === 'ship' || hit.type === 'chest') {
                Scene.triggerCompletion();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                SoundFX.init();
                Scene.triggerCompletion();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                SoundFX.init();
                Scene.triggerImmediateNext();
            }
        });

        // HUD DOM bindings
        const btnModeSyllables = document.getElementById('btnModeSyllables');
        const btnModeWords = document.getElementById('btnModeWords');
        const btnConsonantFilter = document.getElementById('btnConsonantFilter');
        const filterBadge = document.getElementById('filterBadge');
        const consonantTray = document.getElementById('consonantTray');
        const consonantGrid = document.getElementById('consonantGrid');
        const btnLang = document.getElementById('btnLang');
        const btnSound = document.getElementById('btnSound');
        const iconSoundOn = document.getElementById('iconSoundOn');
        const iconSoundOff = document.getElementById('iconSoundOff');
        const btnNext = document.getElementById('btnNext');
        const modeSyllablesSample = document.getElementById('modeSyllablesSample');
        const modeWordsSample = document.getElementById('modeWordsSample');

        function rebuildConsonantGrid() {
            const lang = GameState.lang;
            const list = CONSONANTS[lang];
            const sel = GameState.selectedConsonants[lang];
            consonantGrid.innerHTML = '';

            list.forEach((letter) => {
                const tile = document.createElement('button');
                tile.type = 'button';
                tile.className = 'letter-tile' + (sel.has(letter) ? ' selected' : '');
                tile.textContent = letter;
                tile.addEventListener('click', (e) => {
                    e.stopPropagation();
                    SoundFX.woodClick();
                    if (sel.has(letter)) sel.delete(letter);
                    else sel.add(letter);
                    tile.classList.toggle('selected', sel.has(letter));
                    updateFilterBadge();
                    Scene.triggerModeOrLangRefresh();
                });
                consonantGrid.appendChild(tile);
            });

            const resetTile = document.createElement('button');
            resetTile.type = 'button';
            resetTile.className = 'letter-tile reset-tile';
            resetTile.setAttribute('aria-label', 'Reset');
            resetTile.innerHTML =
                '<svg viewBox="0 0 24 24" fill="none">' +
                '<path d="M5 12A7 7 0 1 1 7.2 17.1" stroke="#ffe5a3" stroke-width="2.4" stroke-linecap="round"/>' +
                '<path d="M4.8 14.5L5 18.2L8.7 17.6" stroke="#ffe5a3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
                '</svg>';
            resetTile.addEventListener('click', (e) => {
                e.stopPropagation();
                SoundFX.woodClick();
                sel.clear();
                rebuildConsonantGrid();
                updateFilterBadge();
                Scene.triggerModeOrLangRefresh();
            });
            consonantGrid.appendChild(resetTile);
        }

        function updateFilterBadge() {
            const count = GameState.selectedConsonants[GameState.lang].size;
            if (count > 0) {
                filterBadge.textContent = String(count);
                filterBadge.classList.add('visible');
            } else {
                filterBadge.textContent = '';
                filterBadge.classList.remove('visible');
            }
        }

        function updateHudState() {
            const isSyll = GameState.mode === 'syllables';
            btnModeSyllables.classList.toggle('active', isSyll);
            btnModeWords.classList.toggle('active', !isSyll);
            btnConsonantFilter.classList.toggle('hidden-btn', !isSyll);
            if (!isSyll) consonantTray.classList.remove('open');

            btnLang.textContent = GameState.lang === 'uk' ? 'укр' : 'рус';
            modeSyllablesSample.textContent = 'МА';
            modeWordsSample.textContent = 'КОЗА';
            updateFilterBadge();
        }

        btnModeSyllables.addEventListener('click', () => {
            SoundFX.woodClick();
            if (GameState.mode === 'syllables') return;
            GameState.mode = 'syllables';
            updateHudState();
            Scene.triggerModeOrLangRefresh();
        });

        btnModeWords.addEventListener('click', () => {
            SoundFX.woodClick();
            if (GameState.mode === 'words') return;
            GameState.mode = 'words';
            updateHudState();
            Scene.triggerModeOrLangRefresh();
        });

        btnConsonantFilter.addEventListener('click', (e) => {
            e.stopPropagation();
            SoundFX.woodClick();
            consonantTray.classList.toggle('open');
        });

        btnLang.addEventListener('click', () => {
            SoundFX.woodClick();
            GameState.lang = GameState.lang === 'uk' ? 'ru' : 'uk';
            rebuildConsonantGrid();
            updateHudState();
            Scene.triggerModeOrLangRefresh();
        });

        btnSound.addEventListener('click', () => {
            SoundFX.enabled = !SoundFX.enabled;
            iconSoundOn.style.display = SoundFX.enabled ? 'block' : 'none';
            iconSoundOff.style.display = SoundFX.enabled ? 'none' : 'block';
            if (SoundFX.enabled) SoundFX.woodClick();
        });

        btnNext.addEventListener('click', () => {
            SoundFX.init();
            consonantTray.classList.remove('open');
            Scene.triggerImmediateNext();
        });

        /* =====================================================================
           7. MAIN 60FPS GAME LOOP (STARTED ON WINDOW LOAD)
           ===================================================================== */
        let lastFrameTime = 0;

        function gameLoop(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const dt = Math.min(0.05, (timestamp - lastFrameTime) / 1000);
            lastFrameTime = timestamp;

            Scene.update(dt);
            renderFrame();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', resizeCanvas);

        window.onload = function () {
            resizeCanvas();
            rebuildConsonantGrid();
            updateHudState();
            Scene.startFirstShip();
            requestAnimationFrame(gameLoop);
        };
    })();
    </script>
</body>
