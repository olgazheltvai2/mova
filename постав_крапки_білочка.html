<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра: Розстав крапки та великі літери</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Propysy Bold", Arial, sans-serif;
            background-color: #87CEEB;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ігровий контейнер */
        .game-wrapper {
            width: 95%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            margin: 40px 0;
            transition: all 0.3s ease;
        }

        /* Візуальні ефекти фідбеку */
        .success-visual {
            box-shadow: 0 0 50px rgba(40, 167, 69, 0.9) !important;
            background: rgba(240, 255, 240, 0.95) !important;
            transform: scale(1.02);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .error-visual {
            box-shadow: 0 0 50px rgba(220, 53, 69, 0.9) !important;
            background: rgba(255, 240, 240, 0.95) !important;
            animation: shake 0.5s ease-in-out;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .controls button {
            padding: 5px 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #007BFF;
            background: #fff;
            color: #007BFF;
            border-radius: 8px;
            transition: 0.2s;
        }

        .controls button:hover {
            background: #007BFF;
            color: #fff;
        }

        /* Текстовий блок */
        #text-container {
            text-align: left;
            line-height: 2;
            user-select: none;
            margin-bottom: 30px;
            min-height: 200px;
        }

        .word-group {
            display: inline-flex;
            align-items: baseline;
            margin-right: 6px;
            margin-bottom: 10px;
        }

        .word {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(200, 200, 200, 0.25);
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }

        .word:hover {
            background: rgba(0, 123, 255, 0.2);
        }

        .word.error {
            background: rgba(255, 0, 0, 0.15);
            border-bottom: 2px solid red;
        }

        .dot-slot {
            cursor: pointer;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            margin-left: 2px;
            transition: all 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .dot-slot:hover {
            background: rgba(0, 123, 255, 0.5);
        }

        .dot-slot.active {
            background: transparent;
            width: auto;
            height: auto;
        }

        .dot-slot.active::after {
            content: '.';
            font-weight: bold;
        }

        .dot-slot.error {
            background: rgba(255, 0, 0, 0.4);
            border: 1px solid red;
        }

        .dash {
            margin: 0 8px;
            color: #333;
        }

        /* Кнопка перевірки */
        .check-btn {
            font-size: 22px;
            padding: 10px 40px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .check-btn:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        /* Theme Manager */
        .settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid #ccc;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .settings-btn:hover {
            transform: rotate(45deg);
            background-color: #f0f0f0;
        }

        .theme-modal {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 320px;
            max-height: 60vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
            z-index: 9998;
            overflow-y: auto;
            padding: 15px;
        }

        .theme-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .theme-modal-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .theme-modal-header button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #dc3545;
        }

        .theme-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .theme-thumbnail {
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .theme-thumbnail:hover {
            border-color: #007BFF;
            transform: scale(1.02);
        }

        .theme-thumbnail img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            display: block;
        }

        .theme-thumbnail span {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 5px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="game-wrapper">
        <div class="controls">
            <button onclick="changeFontSize(1)">+ А</button>
            <button onclick="changeFontSize(-1)">- А</button>
        </div>

        <div id="text-container" style="font-size: 26px;"></div>

        <button class="check-btn" onclick="checkAnswers()">Перевірити</button>
    </div>

    <!-- Theme Manager UI -->
    <button class="settings-btn" onclick="toggleThemeManager()">⚙️</button>
    <div id="theme-modal" class="theme-modal">
        <div class="theme-modal-header">
            <h3>Виберіть фон</h3>
            <button onclick="toggleThemeManager()">❌</button>
        </div>
        <div id="theme-gallery" class="theme-gallery"></div>
    </div>

    <script>
        // === АУДІО ФІДБЕК (Тихі звуки через AudioContext) ===
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'error') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // === ДАНІ ТЕКСТУ ТА ЛОГІКА ГРИ ===
        let currentFontSize = 26;

        const textParts = [
            { text: "білочка", cap: true, dot: false },
            { text: "—", cap: false, dot: false, isDash: true },
            { text: "маленька", cap: false, dot: false },
            { text: "й", cap: false, dot: false },
            { text: "дуже", cap: false, dot: false },
            { text: "спритна", cap: false, dot: false },
            { text: "тваринка", cap: false, dot: true },
            { text: "вона", cap: true, dot: false },
            { text: "має", cap: false, dot: false },
            { text: "пухнастий", cap: false, dot: false },
            { text: "рудий", cap: false, dot: false },
            { text: "хвіст", cap: false, dot: false },
            { text: "і", cap: false, dot: false },
            { text: "гострі", cap: false, dot: false },
            { text: "вушка", cap: false, dot: true },
            { text: "білочка", cap: true, dot: false },
            { text: "швидко", cap: false, dot: false },
            { text: "стрибає", cap: false, dot: false },
            { text: "з", cap: false, dot: false },
            { text: "гілки", cap: false, dot: false },
            { text: "на", cap: false, dot: false },
            { text: "гілку", cap: false, dot: true },
            { text: "найбільше", cap: true, dot: false },
            { text: "вона", cap: false, dot: false },
            { text: "любить", cap: false, dot: false },
            { text: "горіхи", cap: false, dot: false },
            { text: "та", cap: false, dot: false },
            { text: "шишки", cap: false, dot: true },
            { text: "на", cap: true, dot: false },
            { text: "зиму", cap: false, dot: false },
            { text: "білочка", cap: false, dot: false },
            { text: "робить", cap: false, dot: false },
            { text: "запаси", cap: false, dot: false },
            { text: "їжі", cap: false, dot: true },
            { text: "за", cap: true, dot: false },
            { text: "нею", cap: false, dot: false },
            { text: "завжди", cap: false, dot: false },
            { text: "цікаво", cap: false, dot: false },
            { text: "спостерігати", cap: false, dot: true }
        ];

        let gameData = textParts.map((item, index) => ({
            id: index,
            original: item.text,
            isDash: item.isDash || false,
            needsCap: item.cap,
            hasCap: false, 
            needsDot: item.dot,
            hasDot: false
        }));

        function renderText() {
            const container = document.getElementById('text-container');
            container.innerHTML = '';
            
            gameData.forEach((item, index) => {
                if (item.isDash) {
                    const dashSpan = document.createElement('span');
                    dashSpan.className = 'dash';
                    dashSpan.innerText = item.original;
                    container.appendChild(dashSpan);
                    return;
                }

                const groupSpan = document.createElement('span');
                groupSpan.className = 'word-group';

                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.id = 'word-' + index;
                
                let displayText = item.hasCap ? 
                    (item.original.charAt(0).toUpperCase() + item.original.slice(1)) : 
                    item.original.toLowerCase();
                
                wordSpan.innerText = displayText;
                wordSpan.onclick = () => {
                    playSound('click');
                    item.hasCap = !item.hasCap;
                    wordSpan.classList.remove('error');
                    renderText();
                };

                const dotSlot = document.createElement('span');
                dotSlot.className = 'dot-slot';
                dotSlot.id = 'dot-' + index;
                if (item.hasDot) dotSlot.classList.add('active');

                dotSlot.onclick = () => {
                    playSound('click');
                    item.hasDot = !item.hasDot;
                    dotSlot.classList.remove('error');
                    renderText();
                };

                groupSpan.appendChild(wordSpan);
                groupSpan.appendChild(dotSlot);
                container.appendChild(groupSpan);
            });
        }

        function changeFontSize(change) {
            currentFontSize += change * 2;
            if (currentFontSize < 18) currentFontSize = 18;
            if (currentFontSize > 42) currentFontSize = 42;
            document.getElementById('text-container').style.fontSize = currentFontSize + 'px';
        }

        function checkAnswers() {
            let allCorrect = true;
            
            gameData.forEach((item, index) => {
                if (item.isDash) return;

                const wordEl = document.getElementById('word-' + index);
                const dotEl = document.getElementById('dot-' + index);

                if (item.hasCap !== item.needsCap) {
                    wordEl.classList.add('error');
                    allCorrect = false;
                }
                if (item.hasDot !== item.needsDot) {
                    dotEl.classList.add('error');
                    allCorrect = false;
                }
            });

            const wrapper = document.getElementById('game-wrapper');

            // Скидання попередніх ефектів
            wrapper.classList.remove('success-visual', 'error-visual');
            void wrapper.offsetWidth; // Тригер reflow для перезапуску анімації

            if (allCorrect) {
                playSound('success');
                wrapper.classList.add('success-visual');
            } else {
                playSound('error');
                wrapper.classList.add('error-visual');
            }
        }

        // === THEME MANAGER (Система динамічних фонів) ===
        const THEME_BASE_URL = 'https://olgazheltvai2.github.io/images/backgrounds/';

        async function initThemeManager() {
            const savedBg = localStorage.getItem('mySavedGameBg') || `${THEME_BASE_URL}background_1.webp`;
            document.body.style.backgroundImage = `url('${savedBg}')`;

            const gallery = document.getElementById('theme-gallery');
            let currentId = 1;
            let consecutiveErrors = 0;
            const maxErrorsAllowed = 3; 

            while (currentId <= 1000 && consecutiveErrors < maxErrorsAllowed) {
                const checks = [];
                for (let i = 0; i < 5 && currentId <= 1000; i++) {
                    checks.push(checkAndAddTheme(currentId, gallery));
                    currentId++;
                }
                
                const results = await Promise.all(checks);
                
                if (!results.includes(true)) {
                    consecutiveErrors++;
                } else {
                    consecutiveErrors = 0;
                }
            }
        }

        function checkAndAddTheme(id, gallery) {
            return new Promise(resolve => {
                const url = `${THEME_BASE_URL}background_${id}.webp`;
                const img = new Image();
                
                img.onload = () => {
                    const thumb = document.createElement('div');
                    thumb.className = 'theme-thumbnail';
                    thumb.onclick = () => {
                        document.body.style.backgroundImage = `url('${url}')`;
                        localStorage.setItem('mySavedGameBg', url);
                        toggleThemeManager();
                    };
                    
                    const imgEl = document.createElement('img');
                    imgEl.src = url;
                    imgEl.alt = `Фон ${id}`;
                    
                    const label = document.createElement('span');
                    label.innerText = `Фон ${id}`;
                    
                    thumb.appendChild(imgEl);
                    thumb.appendChild(label);
                    gallery.appendChild(thumb);
                    resolve(true);
                };
                
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function toggleThemeManager() {
            const modal = document.getElementById('theme-modal');
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        // Запуск
        window.onload = () => {
            renderText();
            initThemeManager();
        };

    </script>
<script src="https://olgazheltvai2.github.io/rizne/pencil.js"></script></body>
</html>
