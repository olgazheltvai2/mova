const MIN_ZOOM = 0.75;
const MAX_ZOOM = 1.35;

let W = window.innerWidth;
let H = window.innerHeight;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  W = window.innerWidth / gameZoom;
  H = window.innerHeight / gameZoom;
  ctx.setTransform(dpr * gameZoom, 0, 0, dpr * gameZoom, 0, 0);
}
window.addEventListener('resize', resizeCanvas);

function changeZoom(delta) {
  gameZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, +(gameZoom + delta).toFixed(2)));

}

// 2. VERY QUIET WEB AUDIO SYNTHESIZER (Master Gain ~ 0.045)
// ============================================================================
class QuietSoundEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
  }

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    this.ctx = new AudioCtx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.045;
    this.master.connect(this.ctx.destination);
  }

  tone(freq, type, dur, delay = 0, vol = 1, slideTo = null) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
    }
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(vol, now + Math.min(0.02, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  noise(dur, delay = 0, vol = 0.5, filterFreq = 900) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const bufSize = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(filterFreq, now);

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);

    src.connect(filter);
    filter.connect(g);
    g.connect(this.master);
    src.start(now);
    src.stop(now + dur);
  }

  step() {
    this.noise(0.045, 0, 0.25, 420 + Math.random() * 180);
  }

  crystalGain() {
    this.tone(587.33, 'sine', 0.14, 0, 0.9, 659.25);
    this.tone(880, 'triangle', 0.18, 0.07, 0.85, 1046.5);
    this.tone(1318.5, 'sine', 0.25, 0.14, 0.75, 1567.98);
  }

  wrongAnswer() {
    this.tone(210, 'sawtooth', 0.18, 0, 0.7, 135);
    this.tone(155, 'triangle', 0.24, 0.1, 0.7, 98);
    this.noise(0.18, 0, 0.45, 300);
  }

  slingshot() {
    this.tone(240, 'triangle', 0.12, 0, 0.8, 620);
    this.noise(0.07, 0.04, 0.4, 1200);
  }

  crossbow() {
    this.noise(0.06, 0, 0.6, 1600);
    this.tone(480, 'sawtooth', 0.11, 0, 0.65, 180);
    this.tone(520, 'sawtooth', 0.11, 0.06, 0.65, 190);
    this.tone(560, 'sawtooth', 0.11, 0.12, 0.65, 200);
  }

  catapult() {
    this.tone(110, 'sine', 0.28, 0, 0.95, 340);
    this.noise(0.22, 0.05, 0.7, 400);
  }

  hitEnemy(heavy = false) {
    if (heavy) {
      this.tone(130, 'sawtooth', 0.32, 0, 1.0, 42);
      this.noise(0.28, 0, 0.85, 320);
    } else {
      this.tone(190, 'triangle', 0.16, 0, 0.8, 75);
      this.noise(0.12, 0, 0.55, 650);
    }
  }

  shieldBlock() {
    this.tone(360, 'triangle', 0.14, 0, 0.7, 290);
    this.tone(540, 'sine', 0.12, 0.03, 0.5, 480);
  }

  enemyDefeat() {
    const notes = [392, 493.88, 587.33, 783.99];
    notes.forEach((n, idx) => {
      this.tone(n, 'triangle', 0.18, idx * 0.07, 0.8, n * 1.03);
    });
  }

  shrineChime() {
    const notes = [440, 554.37, 659.25, 880, 1108.73];
    notes.forEach((n, idx) => {
      this.tone(n, 'sine', 0.25, idx * 0.06, 0.75);
    });
  }

  bossVictory() {
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
    notes.forEach((n, idx) => {
      this.tone(n, 'triangle', 0.28, idx * 0.08, 0.85);
    });
  }

  gameOverDefeat() {
    const notes = [311.13, 277.18, 246.94, 207.65, 164.81];
    notes.forEach((n, idx) => {
      this.tone(n, 'sawtooth', 0.32, idx * 0.12, 0.8, n * 0.92);
    });
  }
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}
function lerpColor(c1, c2, t) {
  const r = Math.round(lerp(c1[0], c2[0], t));
  const g = Math.round(lerp(c1[1], c2[1], t));
  const b = Math.round(lerp(c1[2], c2[2], t));
  return `rgb(${r},${g},${b})`;
}
function lerpColorAlpha(c1, c2, t, a) {
  const r = Math.round(lerp(c1[0], c2[0], t));
  const g = Math.round(lerp(c1[1], c2[1], t));
  const b = Math.round(lerp(c1[2], c2[2], t));
  return `rgba(${r},${g},${b},${a})`;
}

function pickNextQuestion() {
  const bank = WORD_BANK[state.lang];
  const used = state.usedWordIndices[state.lang];
  if (used.size >= bank.length) used.clear();

  let idx = Math.floor(Math.random() * bank.length);
  let tries = 0;
  while (used.has(idx) && tries < 100) {
    idx = (idx + 1) % bank.length;
    tries++;
  }
  used.add(idx);
  state.currentQuestion = bank[idx];
  state.highlightCorrectVowel = null;
  state.highlightTimer = 0;
  state.answerCooldown = 0.22;
}

function spawnEnemyForEncounter(encIdx) {
  const effectiveIdx = Math.min(encIdx, 10);
  const template = ENEMY_TYPES[effectiveIdx];
  const cycleScale = 1 + state.endlessCycle * 0.25;
  const maxHp = Math.round(template.hp * cycleScale);

  state.enemy = {
    typeId: template.id,
    name: template.name,
    hp: maxHp,
    maxHp: maxHp,
    atk: Math.round(template.atk * cycleScale),
    scale: template.scale,
    xOffset: W * 0.45,
    targetXOffset: 0,
    hurtAnim: 0,
    attackAnim: 0,
    snaredTurns: 0,
    stunnedTurns: 0,
    defeated: false,
    defeatTimer: 0,
    headsAlive: [true, true, true],
    lavaShield: template.id === 10 ? 0.35 : 0
  };
}
