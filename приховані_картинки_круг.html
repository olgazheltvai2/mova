<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Майстерня Борсука-Художника</title>
  <style>
    /* =========================================================================
       БАЗОВІ СТИЛІ ТА СЮЖЕТНА СЦЕНА (БЕЗ БІЛИХ ПРЯМОКУТНИКІВ ТА ТЕКСТУ)
       ========================================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #4bb5e7;
      font-family: Arial, sans-serif;
    }

    /* Допоміжний клас для миттєвого скидання без анімації (прибирає проблиск картинки) */
    .no-transition {
      transition: none !important;
    }

    /* Головний контейнер гри — клік по фону відкриває картинку */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    /* Повноекранний живий сюжетний фон (лісова галявина-майстерня) */
    #scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Анімація живого фону: хмарки, гілки, прапорці, пилок */
    .cloud-slow {
      animation: driftCloud 34s linear infinite;
    }
    .cloud-fast {
      animation: driftCloud 22s linear infinite;
    }
    @keyframes driftCloud {
      0% { transform: translateX(-220px); }
      100% { transform: translateX(1550px); }
    }

    .sway-left {
      transform-origin: 0% 20%;
      animation: swayBranch 5.5s ease-in-out infinite alternate;
    }
    .sway-right {
      transform-origin: 100% 20%;
      animation: swayBranch 6.2s ease-in-out infinite alternate-reverse;
    }
    @keyframes swayBranch {
      0% { transform: rotate(-2.5deg); }
      100% { transform: rotate(2.5deg); }
    }

    .bunting-sway {
      transform-origin: 50% 0%;
      animation: buntingWave 4.5s ease-in-out infinite alternate;
    }
    @keyframes buntingWave {
      0% { transform: rotate(-1.2deg) translateY(0px); }
      100% { transform: rotate(1.2deg) translateY(4px); }
    }

    .sun-spin {
      transform-origin: 120px 100px;
      animation: slowSpin 40s linear infinite;
    }
    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pollen {
      animation: floatPollen 7s ease-in-out infinite alternate;
    }
    @keyframes floatPollen {
      0% { transform: translate(0, 0) scale(0.8); opacity: 0.35; }
      50% { transform: translate(18px, -22px) scale(1.2); opacity: 0.85; }
      100% { transform: translate(-12px, -40px) scale(0.9); opacity: 0.4; }
    }

    /* =========================================================================
       ЦЕНТРАЛЬНИЙ МОЛЬБЕРТ З КРУГЛИМ ПОЛОТНОМ
       ========================================================================= */
    #easel-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }

    #easel-container {
      position: relative;
      width: min(76vh, 84vw, 580px);
      height: min(76vh, 84vw, 580px);
      transform: translateY(-2%);
      pointer-events: none;
      filter: drop-shadow(0 18px 28px rgba(42, 26, 12, 0.38));
    }

    #canvas-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Стиль шару-розмальовки: теплий пергаментний колір + чіткі контури */
    #layer-lineart * {
      fill: #fcf6e5 !important;
      stroke: #3c2618 !important;
      stroke-width: 3px !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
    }
    #layer-lineart .no-fill {
      fill: none !important;
    }
    #layer-lineart .always-dark {
      fill: #3c2618 !important;
    }
    #layer-lineart .soft-line {
      stroke-width: 1.8px !important;
    }

    /* Шар розмальованої картинки — розкривається хвилею фарби */
    #layer-color {
      clip-path: circle(0px at 150px 150px);
      transition: clip-path 1.15s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #layer-color.colored {
      clip-path: circle(175px at 150px 150px);
    }

    /* Легкий радісний підскок картинки після розмальовування */
    #art-bounce-group {
      transform-origin: 150px 150px;
    }
    #art-bounce-group.pop-celebrate {
      animation: artPop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes artPop {
      0% { transform: scale(1); }
      35% { transform: scale(1.07) rotate(-2deg); }
      65% { transform: scale(0.97) rotate(1.5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* =========================================================================
       НЕПРОЗОРИЙ КРУГ-ПАЛІТРА З ПРОРІЗОМ-СЕКТОРОМ
       ========================================================================= */
    #shutter-hit-area {
      pointer-events: all;
      cursor: pointer;
    }

    #shutter-wrapper {
      transform-origin: 150px 150px;
      transition: transform 0.6s cubic-bezier(0.55, -0.35, 0.3, 1.4), opacity 0.45s ease;
    }

    #shutter-wrapper.opened {
      transform: scale(1.38) rotate(55deg);
      opacity: 0;
      pointer-events: none;
    }

    #shutter-wheel {
      transform-origin: 150px 150px;
    }

    /* =========================================================================
       ЖИВИЙ ПЕРСОНАЖ — БОРСУК-ХУДОЖНИК НА ПЕНЬОЧКУ
       ========================================================================= */
    #badger-box {
      position: absolute;
      right: clamp(8px, 3vw, 44px);
      bottom: clamp(8px, 2.5vh, 30px);
      width: clamp(145px, 23vw, 255px);
      height: clamp(145px, 23vw, 255px);
      z-index: 8;
      cursor: pointer;
      pointer-events: all;
      filter: drop-shadow(0 12px 16px rgba(30, 35, 18, 0.38));
      transition: transform 0.25s ease;
    }

    #badger-box:hover {
      transform: scale(1.05);
    }

    #badger-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Дихання борсука у спокої */
    .badger-body-idle {
      transform-origin: 125px 195px;
      animation: badgerBreathe 3.2s ease-in-out infinite;
    }
    @keyframes badgerBreathe {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      50% { transform: scale(1.02, 0.98) translateY(2px); }
    }

    /* Емоція: зацікавлене нахиляння голови під час обертання круга */
    #badger-box.curious .badger-body-idle {
      animation: badgerCurious 0.75s ease-in-out infinite alternate;
    }
    @keyframes badgerCurious {
      0% { transform: rotate(-4deg) translateY(0); }
      100% { transform: rotate(4deg) translateY(-4px); }
    }

    /* Емоція: радісні стрибки при відкритті картинки */
    #badger-box.happy .badger-body-idle {
      animation: badgerJump 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 3;
    }
    @keyframes badgerJump {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-22px) scale(1.05, 0.96) rotate(-4deg); }
      75% { transform: translateY(2px) scale(0.97, 1.03) rotate(3deg); }
    }

    /* Помах лапкою з пензликом */
    .badger-brush-arm {
      transform-origin: 86px 156px;
      animation: brushIdle 2.5s ease-in-out infinite alternate;
    }
    @keyframes brushIdle {
      0% { transform: rotate(-7deg); }
      100% { transform: rotate(8deg); }
    }
    #badger-box.happy .badger-brush-arm {
      animation: brushWave 0.26s ease-in-out infinite alternate;
    }
    @keyframes brushWave {
      0% { transform: rotate(-28deg); }
      100% { transform: rotate(24deg); }
    }

    /* Рух вушок при радості */
    .badger-ears {
      transform-origin: 120px 80px;
    }
    #badger-box.happy .badger-ears {
      animation: earsWiggle 0.35s ease-in-out infinite alternate;
    }
    @keyframes earsWiggle {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(4deg); }
    }

    /* Моргання очима */
    .badger-eyelid {
      transform-origin: 120px 104px;
      animation: badgerBlink 4.6s infinite;
    }
    @keyframes badgerBlink {
      0%, 92%, 100% { transform: scaleY(0); }
      96% { transform: scaleY(1); }
    }

    /* =========================================================================
       МІНІМАЛІСТИЧНІ КНОПКИ НАВІГАЦІЇ («НАЗАД» І «ДАЛІ») + КНОПКА ВІДКРИТТЯ
       ========================================================================= */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(54px, 7.5vw, 76px);
      height: clamp(54px, 7.5vw, 76px);
      border: none;
      background: none;
      cursor: pointer;
      z-index: 15;
      padding: 0;
      filter: drop-shadow(0 8px 14px rgba(34, 22, 10, 0.35));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.12);
    }
    .nav-btn:active {
      transform: translateY(-50%) scale(0.92);
    }

    #btn-prev {
      left: clamp(12px, 2.5vw, 34px);
    }

    #btn-next {
      right: clamp(12px, 2.5vw, 34px);
    }

    /* Декоративна іконка-кнопка розкриття (око) знизу ліворуч */
    #btn-reveal {
      position: absolute;
      left: clamp(18px, 3vw, 42px);
      bottom: clamp(18px, 3.5vh, 40px);
      width: clamp(60px, 8vw, 80px);
      height: clamp(60px, 8vw, 80px);
      border: none;
      background: none;
      cursor: pointer;
      z-index: 15;
      filter: drop-shadow(0 8px 14px rgba(34, 22, 10, 0.35));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }
    #btn-reveal:hover {
      transform: scale(1.12) rotate(-6deg);
    }
    #btn-reveal:active {
      transform: scale(0.9);
    }
    #btn-reveal.hidden-btn {
      opacity: 0.45;
      transform: scale(0.88);
    }

    /* Шар для візуальних ефектів (бризки фарби, зірочки, пелюстки) */
    #fx-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
    }

    @media (max-width: 720px) {
      #easel-container {
        width: min(64vh, 88vw);
        height: min(64vh, 88vw);
        transform: translateY(-7%);
      }
      #badger-box {
        width: 132px;
        height: 132px;
        right: 6px;
        bottom: 6px;
      }
    }
  </style>
</head>
<body>

<div id="game-stage">

  <!-- =======================================================================
       1. ЖИВИЙ СЮЖЕТНИЙ ФОН: СОНЯЧНА ЛІСОВА ГАЛЯВИНА-МАЙСТЕРНЯ БОРСУКА
       ======================================================================= -->
  <svg id="scene-bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#38b6ff"/>
        <stop offset="55%" stop-color="#87e0ff"/>
        <stop offset="100%" stop-color="#fff0b5"/>
      </linearGradient>
      <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7cd45b"/>
        <stop offset="100%" stop-color="#48a842"/>
      </linearGradient>
      <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5ec443"/>
        <stop offset="100%" stop-color="#2e8b38"/>
      </linearGradient>
      <linearGradient id="woodFloor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d48b48"/>
        <stop offset="50%" stop-color="#b56c30"/>
        <stop offset="100%" stop-color="#8b4d1e"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8b0" stop-opacity="0.95"/>
        <stop offset="60%" stop-color="#ffdd59" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#ffdd59" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Небо -->
    <rect width="1440" height="900" fill="url(#skyGrad)"/>

    <!-- Тепле сонечко з променями -->
    <circle cx="120" cy="100" r="145" fill="url(#sunGlow)"/>
    <g class="sun-spin">
      <g fill="#ffe066" opacity="0.85">
        <polygon points="120,14 130,45 110,45"/>
        <polygon points="120,186 130,155 110,155"/>
        <polygon points="34,100 65,90 65,110"/>
        <polygon points="206,100 175,90 175,110"/>
        <polygon points="59,39 86,54 72,68"/>
        <polygon points="181,161 154,146 168,132"/>
        <polygon points="181,39 168,68 154,54"/>
        <polygon points="59,161 72,132 86,146"/>
      </g>
    </g>
    <circle cx="120" cy="100" r="46" fill="#ffdf4d" stroke="#ffb703" stroke-width="5"/>

    <!-- Пливучі мальовані хмарки -->
    <g class="cloud-slow" opacity="0.9">
      <path d="M40 160 C40 135 65 120 90 128 C102 102 145 100 162 125 C185 122 206 140 202 162 C202 178 188 188 168 188 L65 188 C48 188 40 176 40 160 Z" fill="#fff9e8"/>
      <path d="M58 176 Q120 185 185 176" stroke="#d8f0ff" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <g class="cloud-fast" transform="translate(450, 45) scale(0.75)" opacity="0.82">
      <path d="M40 160 C40 135 65 120 90 128 C102 102 145 100 162 125 C185 122 206 140 202 162 C202 178 188 188 168 188 L65 188 C48 188 40 176 40 160 Z" fill="#fffdf5"/>
    </g>

    <!-- Далекі зелені пагорби -->
    <path d="M-40 660 Q320 480 760 610 T1500 570 L1500 900 L-40 900 Z" fill="url(#hillBack)"/>
    <path d="M-40 720 Q420 580 920 680 T1500 660 L1500 900 L-40 900 Z" fill="url(#hillFront)"/>

    <!-- Садові квіточки на галявині -->
    <g opacity="0.9">
      <circle cx="170" cy="700" r="8" fill="#ff6b9d"/><circle cx="170" cy="700" r="3.5" fill="#ffe066"/>
      <circle cx="245" cy="675" r="7" fill="#ffd166"/><circle cx="245" cy="675" r="3" fill="#ff6b6b"/>
      <circle cx="1210" cy="685" r="9" fill="#ff8fab"/><circle cx="1210" cy="685" r="4" fill="#fff3b0"/>
      <circle cx="1310" cy="710" r="7" fill="#a2d2ff"/><circle cx="1310" cy="710" r="3" fill="#ffbe0b"/>
    </g>

    <!-- Дерев'яна тераса-майстерня внизу -->
    <path d="M0 745 L1440 745 L1440 900 L0 900 Z" fill="url(#woodFloor)"/>
    <line x1="0" y1="745" x2="1440" y2="745" stroke="#6b3813" stroke-width="6"/>
    <line x1="0" y1="795" x2="1440" y2="795" stroke="#7c4217" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="848" x2="1440" y2="848" stroke="#7c4217" stroke-width="3" opacity="0.6"/>

    <!-- Декор майстерні: баночки з фарбами та пензлями ліворуч -->
    <g transform="translate(135, 680)">
      <rect x="0" y="25" width="44" height="52" rx="10" fill="#ff595e" stroke="#6b2124" stroke-width="3.5"/>
      <rect x="-4" y="18" width="52" height="12" rx="5" fill="#ffd166" stroke="#6b2124" stroke-width="3"/>
      <path d="M8 30 Q18 46 24 30 Q30 42 36 30" fill="#ff8fa3"/>
      <rect x="54" y="34" width="40" height="43" rx="9" fill="#1982c4" stroke="#103d5c" stroke-width="3.5"/>
      <rect x="50" y="27" width="48" height="11" rx="5" fill="#ffca3a" stroke="#103d5c" stroke-width="3"/>
      <line x1="74" y1="27" x2="90" y2="-18" stroke="#e09f3e" stroke-width="7" stroke-linecap="round"/>
      <path d="M87 -18 Q98 -34 94 -12 Z" fill="#8ac926" stroke="#2d5a12" stroke-width="2"/>
    </g>

    <!-- Святкова гірлянда з різнокольорових прапорців зверху -->
    <g class="bunting-sway">
      <path d="M-20 35 Q360 115 720 62 T1460 40" fill="none" stroke="#5e3a1c" stroke-width="4"/>
      <polygon points="110,63 148,68 124,114" fill="#ff595e" stroke="#6d1c20" stroke-width="2.5"/>
      <polygon points="220,76 260,79 238,128" fill="#ffca3a" stroke="#7a5900" stroke-width="2.5"/>
      <polygon points="340,80 380,80 360,130" fill="#8ac926" stroke="#305208" stroke-width="2.5"/>
      <polygon points="460,76 500,73 482,123" fill="#1982c4" stroke="#0c3b5e" stroke-width="2.5"/>
      <polygon points="580,68 620,64 603,115" fill="#9b5de5" stroke="#421e70" stroke-width="2.5"/>
      <polygon points="820,56 860,54 842,105" fill="#ff595e" stroke="#6d1c20" stroke-width="2.5"/>
      <polygon points="940,54 980,56 958,108" fill="#ffca3a" stroke="#7a5900" stroke-width="2.5"/>
      <polygon points="1060,57 1100,60 1078,112" fill="#00bbf9" stroke="#004d66" stroke-width="2.5"/>
      <polygon points="1180,58 1220,57 1200,109" fill="#f15bb5" stroke="#6b184a" stroke-width="2.5"/>
      <polygon points="1300,52 1340,48 1324,99" fill="#8ac926" stroke="#305208" stroke-width="2.5"/>
    </g>

    <!-- Живі гілки з листям по кутках екрана -->
    <g class="sway-left">
      <path d="M-20 140 Q95 165 180 120" fill="none" stroke="#6e4321" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="75" cy="115" rx="44" ry="22" transform="rotate(-24 75 115)" fill="#4cb944" stroke="#235c20" stroke-width="3"/>
      <ellipse cx="145" cy="155" rx="40" ry="20" transform="rotate(18 145 155)" fill="#6ad455" stroke="#235c20" stroke-width="3"/>
      <ellipse cx="195" cy="110" rx="34" ry="17" transform="rotate(-12 195 110)" fill="#52c447" stroke="#235c20" stroke-width="3"/>
    </g>
    <g class="sway-right">
      <path d="M1460 160 Q1350 185 1265 135" fill="none" stroke="#6e4321" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="1365" cy="130" rx="44" ry="22" transform="rotate(24 1365 130)" fill="#4cb944" stroke="#235c20" stroke-width="3"/>
      <ellipse cx="1300" cy="175" rx="40" ry="20" transform="rotate(-18 1300 175)" fill="#6ad455" stroke="#235c20" stroke-width="3"/>
      <ellipse cx="1245" cy="128" rx="34" ry="17" transform="rotate(14 1245 128)" fill="#52c447" stroke="#235c20" stroke-width="3"/>
    </g>

    <!-- Сонячні пилинки в повітрі -->
    <g fill="#fff8c4">
      <circle class="pollen" cx="310" cy="310" r="5"/>
      <circle class="pollen" cx="1110" cy="260" r="6" style="animation-delay: -2s;"/>
      <circle class="pollen" cx="260" cy="520" r="4.5" style="animation-delay: -4s;"/>
      <circle class="pollen" cx="1170" cy="490" r="5.5" style="animation-delay: -1.5s;"/>
    </g>
  </svg>

  <!-- =======================================================================
       2. ЦЕНТРАЛЬНИЙ ДЕРЕВ'ЯНИЙ МОЛЬБЕРТ, КАРТИНКА ТА ОБЕРТОВИЙ КРУГ-ПАЛІТРА
       ======================================================================= -->
  <div id="easel-wrapper">
    <div id="easel-container">
      <svg id="canvas-svg" viewBox="-42 -42 384 410" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Кругла маска для внутрішньої картинки -->
          <clipPath id="roundCanvasClip">
            <circle cx="150" cy="150" r="142"/>
          </clipPath>

          <!-- Градієнт дерев'яної рамки мольберта -->
          <linearGradient id="woodFrameGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e39d52"/>
            <stop offset="50%" stop-color="#c27430"/>
            <stop offset="100%" stop-color="#8f4c1a"/>
          </linearGradient>

          <!-- Градієнт теплого паперу полотна -->
          <radialGradient id="parchmentGrad" cx="45%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#fffdf4"/>
            <stop offset="75%" stop-color="#f7ebd0"/>
            <stop offset="100%" stop-color="#ebd5a7"/>
          </radialGradient>

          <!-- Градієнт дерев'яного круга-палітри -->
          <radialGradient id="paletteWoodGrad" cx="38%" cy="35%" r="68%">
            <stop offset="0%" stop-color="#f2ba72"/>
            <stop offset="58%" stop-color="#d48c42"/>
            <stop offset="100%" stop-color="#9e5a1d"/>
          </radialGradient>

          <!-- Градієнт латунного гвоздика по центру -->
          <radialGradient id="brassPinGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fff3a8"/>
            <stop offset="55%" stop-color="#f4b926"/>
            <stop offset="100%" stop-color="#a66905"/>
          </radialGradient>
        </defs>

        <!-- Ніжки дерев'яного мольберта -->
        <g stroke="#5e3010" stroke-width="5" stroke-linejoin="round">
          <path d="M135 -30 L165 -30 L170 25 L130 25 Z" fill="url(#woodFrameGrad)"/>

     =========================================================================== */
  const SoundEngine = (() => {
    let ctx = null;

    function init() {
      if (!ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        ctx = new AudioCtx();
      }
      if (ctx.state === 'suspended') ctx.resume();
    }

    function playTone(freq, type, duration, startTime, gainVal = 0.16, slideTo = null) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, startTime + duration);
      }
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(gainVal, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    return {
      // Звук запуску обертання дерев'яного круга
      spinStart() {
        init();
        const t = ctx.currentTime;
        playTone(260, 'triangle', 0.14, t, 0.18, 440);
        playTone(390, 'sine', 0.12, t + 0.07, 0.12, 580);
      },

      // Звук зупинки обертання
      spinStop() {
        init();
        const t = ctx.currentTime;
        playTone(420, 'triangle', 0.1, t, 0.14, 240);
      },

      // Тихий дерев'яний «тік» під час обертання
      spinTick() {
        if (!ctx || ctx.state !== 'running') return;
        const t = ctx.currentTime;
        playTone(620 + Math.random() * 120, 'sine', 0.035, t, 0.035, 340);
      },

      // Різноманітний радісний фідбек при відкритті та розмальовуванні (4 варіанти)
      reveal(variant) {
        init();
        const t = ctx.currentTime;
        playTone(300, 'sine', 0.14, t, 0.2, 760);

        const melodies = [
          [523.25, 659.25, 783.99, 1046.5, 1318.5],
          [392.00, 493.88, 587.33, 783.99, 987.77, 1174.66],
          [587.33, 739.99, 880.00, 1174.66, 987.77, 1174.66],
          [440.00, 554.37, 659.25, 880.00, 1108.73]
        ];
        const notes = melodies[variant % melodies.length];
        const wave = variant % 2 === 0 ? 'triangle' : 'sine';

        notes.forEach((n, idx) => {
          playTone(n, wave, 0.34, t + 0.18 + idx * 0.095, 0.15);
          playTone(n * 2, 'sine', 0.18, t + 0.19 + idx * 0.095, 0.05);
        });
      },

      // Звук перемикання рівня (Далі / Назад)

        init();
        const t = ctx.currentTime;
        if (isNext) {
          playTone(360, 'sine', 0.12, t, 0.15, 540);
          playTone(540, 'triangle', 0.12, t + 0.06, 0.12, 720);
        } else {
          playTone(520, 'sine', 0.12, t, 0.15, 360);
          playTone(360, 'triangle', 0.12, t + 0.06, 0.12, 260);
        }
      },

      // Веселий відгук борсука при кліку на персонажа або розмальовану картинку
      badger() {
        init();
        const t = ctx.currentTime;
        playTone(440, 'triangle', 0.1, t, 0.14, 680);
        playTone(620, 'sine', 0.12, t + 0.09, 0.14, 920);
      }
    };
  })();

  /* ===========================================================================
     СТАН ГРИ ТА ПОСИЛАННЯ НА ЕЛЕМЕНТИ DOM
     =========================================================================== */
  let currentIndex = 0;        // Поточна картинка (0..19)
  let isSpinning = false;      // Чи обертається зараз круг
  let isRevealed = false;      // Чи відкрита вже картинка
  let currentAngle = 0;        // Поточний кут обертання круга (в градусах)
  let lastTickSector = 0;      // Для м'якого звуку «тік» при обертанні
  let revealTimerId = null;    // Таймер розмальовування (щоб скасовувати при швидкому переході)

  const gameStage        = document.getElementById('game-stage');
  const layerLineart     = document.getElementById('layer-lineart');
  const layerColor       = document.getElementById('layer-color');
  const artBounceGroup   = document.getElementById('art-bounce-group');
  const shutterWrapper   = document.getElementById('shutter-wrapper');
  const shutterWheel     = document.getElementById('shutter-wheel');
  const shutterHitArea   = document.getElementById('shutter-hit-area');
  const badgerBox        = document.getElementById('badger-box');
  const badgerPupilGroup = document.getElementById('badger-pupil-group');
  const badgerMouth      = document.getElementById('badger-mouth');
  const badgerBrushTip   = document.getElementById('badger-brush-tip');
  const btnPrev          = document.getElementById('btn-prev');
  const btnNext          = document.getElementById('btn-next');
  const btnReveal        = document.getElementById('btn-reveal');
  const fxLayer          = document.getElementById('fx-layer');

  /* ===========================================================================
     ЗАВАНТАЖЕННЯ ПОТОЧНОГО РІВНЯ (БЕЗ ЖОДНОГО ПРОБЛИСКУ НАСТУПНОЇ КАРТИНКИ!)
     =========================================================================== */
  function loadLevel(index) {
    // Скасовуємо попередній таймер розмальовування, якщо він ще не спрацював
    if (revealTimerId) {
      clearTimeout(revealTimerId);
      revealTimerId = null;
    }

    currentIndex = (index + PICTURES.length) % PICTURES.length;
    const pic = PICTURES[currentIndex];

    // 1. Вимикаємо плавні переходи, щоб круг-палітра та кольоровий шар
    //    МИТТЄВО закрилися ДО підстановки нової картинки
    shutterWrapper.classList.add('no-transition');
    layerColor.classList.add('no-transition');

    isSpinning = false;
    isRevealed = false;
    currentAngle = Math.floor(Math.random() * 360);
    lastTickSector = Math.floor(currentAngle / 60);

    // Повертаємо заслінку на місце і ховаємо кольоровий шар
    shutterWrapper.classList.remove('opened');
    shutterWheel.style.transform = `rotate(${currentAngle}deg)`;
    layerColor.classList.remove('colored');
    artBounceGroup.classList.remove('pop-celebrate');

    // Примусовий перерахунок стилів (reflow), щоб браузер зафіксував закриту заслінку
    void shutterWrapper.offsetWidth;
    void layerColor.offsetWidth;

    // 2. Тільки тепер, коли полотно гарантовано закрите кругом, оновлюємо SVG
    layerLineart.innerHTML = pic.svg;
    layerColor.innerHTML = pic.svg;

    // Скидаємо емоції борсука-художника та кнопку відкриття
    badgerBox.classList.remove('curious', 'happy');
    badgerPupilGroup.setAttribute('transform', 'translate(0, 0)');
    badgerMouth.setAttribute('d', 'M111 127 Q121 136 131 127');
    badgerBrushTip.setAttribute('fill', pic.accent);
    btnReveal.classList.remove('hidden-btn');

    // 3. Повертаємо плавні анімації вже після відмальовки закритого стану
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        shutterWrapper.classList.remove('no-transition');
        layerColor.classList.remove('no-transition');
      });
    });
  }

  /* ===========================================================================
     ПЛАВНЕ ОБЕРТАННЯ КРУГА З ПРОРІЗОМ
     =========================================================================== */
  function spinLoop() {
    if (isSpinning && !isRevealed) {
      currentAngle = (currentAngle + 1.55) % 360;
      shutterWheel.style.transform = `rotate(${currentAngle}deg)`;

      // Очі борсука стежать за обертанням прорізу
      const rad = (currentAngle * Math.PI) / 180;
      const eyeX = Math.cos(rad) * 3;
      const eyeY = Math.sin(rad) * 2.5;
      badgerPupilGroup.setAttribute('transform', `translate(${eyeX.toFixed(1)}, ${eyeY.toFixed(1)})`);

      // Легкий дерев'яний «тік» кожні 60 градусів
      const sector = Math.floor(currentAngle / 60);
      if (sector !== lastTickSector) {
        lastTickSector = sector;
        SoundEngine.spinTick();
      }
    }
    requestAnimationFrame(spinLoop);
  }

  // Клік по кругу: запускає або зупиняє обертання
  function toggleSpin(e) {
    e.stopPropagation();
    if (isRevealed) {
      triggerExtraCelebration();
      return;
    }
    isSpinning = !isSpinning;
    if (isSpinning) {
      SoundEngine.spinStart();
      badgerBox.classList.add('curious');
    } else {
      SoundEngine.spinStop();
      badgerBox.classList.remove('curious');
      badgerPupilGroup.setAttribute('transform', 'translate(0, 0)');
    }
  }

  /* ===========================================================================
     ВІДКРИТТЯ КАРТИНКИ ТА АНІМАЦІЯ РОЗМАЛЬОВУВАННЯ
     =========================================================================== */
  function revealPicture() {
    if (isRevealed) return;
    isRevealed = true;
    isSpinning = false;

    const pic = PICTURES[currentIndex];

    // 1. Круг-палітра плавно зникає
    shutterWrapper.classList.remove('no-transition');
    layerColor.classList.remove('no-transition');
    shutterWrapper.classList.add('opened');
    btnReveal.classList.add('hidden-btn');

    // 2. Різноманітний музичний фідбек
    SoundEngine.reveal(currentIndex);

    // 3. Через мить запускаємо хвилю розмальовування
    revealTimerId = setTimeout(() => {
      revealTimerId = null;
      if (!isRevealed) return;

      layerColor.classList.add('colored');
      artBounceGroup.classList.remove('pop-celebrate');
      void artBounceGroup.offsetWidth;
      artBounceGroup.classList.add('pop-celebrate');

      // 4. Яскраві візуальні ефекти (різні для кожного рівня)
      spawnCelebrationFX(currentIndex % 3, pic.accent);

      // 5. Борсук-художник радіє, підстрибує, широко посміхається та махає пензликом
      badgerBox.classList.remove('curious');
      badgerBox.classList.add('happy');
      badgerPupilGroup.setAttribute('transform', 'translate(-2, -1)');
      badgerMouth.setAttribute('d', 'M107 125 Q121 142 135 125');
    }, 240);
  }

  function triggerExtraCelebration() {
    const pic = PICTURES[currentIndex];
    SoundEngine.badger();
    artBounceGroup.classList.remove('pop-celebrate');
    void artBounceGroup.offsetWidth;
    artBounceGroup.classList.add('pop-celebrate');
    spawnCelebrationFX((currentIndex + 1) % 3, pic.accent);
  }

  /* ===========================================================================
     РІЗНОМАНІТНІ ВІЗУАЛЬНІ ФІДБЕКИ (ЗІРОЧКИ, БРИЗКИ ФАРБИ, ПЕЛЮСТКИ)
     =========================================================================== */
  function spawnCelebrationFX(styleType, accentColor) {
    const palette = [accentColor, '#ff595e', '#ffca3a', '#8ac926', '#2ec4ff', '#9b5de5', '#f15bb5'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const count = 26;

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
      const dist = 130 + Math.random() * 210;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist - 30;
      const color = palette[i % palette.length];
      const size = 10 + Math.random() * 14;

      const ns = 'http://www.w3.org/2000/svg';
      let el;

      if (styleType === 0) {
        el = document.createElementNS(ns, 'polygon');
        el.setAttribute('points', '0,-12 3.5,-4 12,-4 5,2 7.5,11 0,6 -7.5,11 -5,2 -12,-4 -3.5,-4');
      } else if (styleType === 1) {
        el = document.createElementNS(ns, 'circle');
        el.setAttribute('r', String(size * 0.65));
      } else {
        el = document.createElementNS(ns, 'ellipse');
        el.setAttribute('rx', String(size * 0.7));
        el.setAttribute('ry', String(size * 0.4));
      }

      el.setAttribute('fill', color);
      el.setAttribute('stroke', '#ffffff');
      el.setAttribute('stroke-width', '2');
      el.style.transformOrigin = 'center';
      el.setAttribute('transform', `translate(${cx}, ${cy}) scale(0.2)`);
      fxLayer.appendChild(el);

      const anim = el.animate([
        { transform: `translate(${cx}px, ${cy}px) scale(0.2) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${cx + tx}px, ${cy + ty}px) scale(1.15) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: 0.65 },
        { transform: `translate(${cx + tx * 1.15}px, ${cy + ty + 50}px) scale(0.1) rotate(${Math.random() * 540}deg)`, opacity: 0 }
      ], {
        duration: 850 + Math.random() * 450,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
      });

      anim.onfinish = () => el.remove();
    }
  }

  /* ===========================================================================
     ОБРОБНИКИ ПОДІЙ
     =========================================================================== */
  // Клік по кругу-палітрі -> обертання / пауза
  shutterHitArea.addEventListener('click', toggleSpin);

  // Клік по будь-якому вільному місцю фону -> зникає круг і розмальовується картинка
  gameStage.addEventListener('click', () => {
    if (!isRevealed) {
      revealPicture();
    } else {
      triggerExtraCelebration();
    }
  });

  // Клік по кнопці «Відкрити» (око)
  btnReveal.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!isRevealed) {
      revealPicture();
    } else {
      triggerExtraCelebration();
    }
  });

  // Клік по борсуку -> або відкриває картинку, або весело реагує
  badgerBox.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!isRevealed) {
      revealPicture();
    } else {
      SoundEngine.badger();
      badgerBox.classList.remove('happy');
      void badgerBox.offsetWidth;
      badgerBox.classList.add('happy');
    }
  });

  // Кнопка «Назад»
  btnPrev.addEventListener('click', (e) => {
    e.stopPropagation();
    SoundEngine.nav(false);
    loadLevel(currentIndex - 1);
  });

  // Кнопка «Далі»
  btnNext.addEventListener('click', (e) => {
    e.stopPropagation();
    SoundEngine.nav(true);
    loadLevel(currentIndex + 1);
  });

  // Зручне керування з клавіатури для вчителя (стрілки вліво/вправо, пробіл)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') {
      SoundEngine.nav(true);
      loadLevel(currentIndex + 1);
    } else if (e.key === 'ArrowLeft') {
      SoundEngine.nav(false);
      loadLevel(currentIndex - 1);
    } else if (e.key === ' ') {
      e.preventDefault();
      if (!isRevealed) revealPicture();
    }
  });

  // Старт гри
  loadLevel(0);
  spinLoop();
</script>
</body>
</html>
