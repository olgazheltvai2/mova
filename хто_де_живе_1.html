<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Хто де живе</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background: #14281d;
    touch-action: none;
  }

  /* Main Widescreen Stage */
  #game-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  /* Animated living background layers */
  .sky-beam {
    transform-origin: 50% 0%;
    animation: beamSway 9s ease-in-out infinite alternate;
  }
  .sky-beam:nth-child(2) { animation-duration: 12s; animation-delay: -3s; }
  .sky-beam:nth-child(3) { animation-duration: 15s; animation-delay: -7s; }

  @keyframes beamSway {
    0% { transform: rotate(-6deg) scaleX(0.9); opacity: 0.18; }
    100% { transform: rotate(6deg) scaleX(1.15); opacity: 0.32; }
  }

  .cloud-drift-1 { animation: cloudMove 65s linear infinite; }
  .cloud-drift-2 { animation: cloudMove 90s linear infinite reverse; }
  @keyframes cloudMove {
    0% { transform: translateX(-15%); }
    100% { transform: translateX(15%); }
  }

  /* Habitat Cards - Organic Carved Wood & Foliage Frames (NO white rectangles) */
  #habitats-grid {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 67vh;
    padding: 1.2vh 2vw 0.5vh 2vw;
    display: grid;
    gap: 1.4vw;
    align-items: stretch;
    justify-items: stretch;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Mode 4: 4 large habitats for detailed speech work */
  .grid-mode-4 {
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr;
  }
  @media (max-aspect-ratio: 4/3) {
    .grid-mode-4 {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }
  }

  /* Mode 12: Full 12-habitat panorama */
  .grid-mode-12 {
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 0.9vw !important;
  }
  @media (max-aspect-ratio: 4/3) {
    .grid-mode-12 {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
    }
  }

  /* Individual Habitat Container */
  .habitat-card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 28px;
    padding: 8px;
    background: linear-gradient(145deg, #5c3a1e 0%, #3b2310 50%, #271508 100%);
    box-shadow:
      0 12px 25px rgba(0, 0, 0, 0.55),
      inset 0 2px 3px rgba(255, 215, 150, 0.35),
      inset 0 -4px 8px rgba(0, 0, 0, 0.7),
      0 0 0 3px #2b4c24;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    overflow: visible;
  }

  .habitat-card::before {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 23px;
    border: 2px dashed rgba(176, 125, 70, 0.35);
    pointer-events: none;
    z-index: 4;
  }

  .habitat-card:hover {
    transform: translateY(-4px) scale(1.015);
    box-shadow:
      0 16px 32px rgba(0, 0, 0, 0.65),
      0 0 20px rgba(154, 230, 110, 0.45),
      inset 0 2px 4px rgba(255, 230, 170, 0.5),
      0 0 0 3px #4d8b31;
  }

  .habitat-card.drop-target-hover {
    transform: scale(1.05);
    box-shadow:
      0 0 35px #fde047,
      0 0 0 5px #facc15,
      inset 0 0 20px rgba(250, 204, 21, 0.5);
  }

  .habitat-card.matched-card {
    box-shadow:
      0 12px 28px rgba(0, 0, 0, 0.55),
      0 0 22px rgba(74, 222, 128, 0.65),
      0 0 0 4px #4ade80;
  }

  .habitat-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    background: #1e3a2f;
  }

  .habitat-inner svg.scene-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Housed Animal inside Habitat */
  .housed-animal-slot {
    position: absolute;
    width: 58%;
    height: 58%;
    left: 21%;
    top: 28%;
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.2);
    transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.55));
  }

  .habitat-card.matched-card .housed-animal-slot {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
    cursor: pointer;
  }

  /* Custom placement per habitat so the animal sits naturally inside its home */
  .habitat-card[data-key="dog"] .housed-animal-slot { left: 20%; top: 32%; width: 56%; height: 56%; }
  .habitat-card[data-key="camel"] .housed-animal-slot { left: 22%; top: 24%; width: 60%; height: 62%; }
  .habitat-card[data-key="bear"] .housed-animal-slot { left: 22%; top: 33%; width: 56%; height: 56%; }
  .habitat-card[data-key="squirrel"] .housed-animal-slot { left: 26%; top: 24%; width: 48%; height: 50%; }
  .habitat-card[data-key="fox"] .housed-animal-slot { left: 22%; top: 36%; width: 56%; height: 54%; }
  .habitat-card[data-key="spider"] .housed-animal-slot { left: 28%; top: 26%; width: 44%; height: 44%; }
  .habitat-card[data-key="bird"] .housed-animal-slot { left: 26%; top: 18%; width: 48%; height: 48%; }
  .habitat-card[data-key="mouse"] .housed-animal-slot { left: 22%; top: 38%; width: 50%; height: 50%; }
  .habitat-card[data-key="ant"] .housed-animal-slot { left: 25%; top: 34%; width: 50%; height: 50%; }
  .habitat-card[data-key="bat"] .housed-animal-slot { left: 24%; top: 16%; width: 52%; height: 52%; }
  .habitat-card[data-key="bee"] .housed-animal-slot { left: 20%; top: 26%; width: 46%; height: 46%; }
  .habitat-card[data-key="frog"] .housed-animal-slot { left: 25%; top: 34%; width: 50%; height: 50%; }

  /* Animal Shelf at the Bottom */
  #bottom-shelf-area {
    position: relative;
    z-index: 20;
    width: 100%;
    height: 31vh;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.8vw 1.2vh 1.8vw;
  }

  #animals-log-shelf {
    position: relative;
    width: calc(100% - 155px);
    height: 100%;
    border-radius: 34px;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(139, 90, 43, 0.55), transparent 70%),
      linear-gradient(180deg, #4f3117 0%, #38200d 45%, #261407 100%);
    box-shadow:
      0 -6px 22px rgba(0, 0, 0, 0.6),
      inset 0 5px 10px rgba(217, 155, 82, 0.35),
      inset 0 -8px 16px rgba(0, 0, 0, 0.8),
      0 0 0 4px #3c6324;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0.8vh 1.5vw;
    overflow: visible;
  }

  /* Wood grain & moss overlay on shelf */
  #animals-log-shelf::before {
    content: '';
    position: absolute;
    top: -7px;
    left: 3%;
    right: 3%;
    height: 14px;
    background: linear-gradient(90deg,
      transparent 0%,
      #4d8c2b 10%,
      #68ab38 25%,
      transparent 40%,
      #4d8c2b 60%,
      #7bc043 80%,
      transparent 100%);
    border-radius: 12px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    pointer-events: none;
  }

  /* Animal Token on the Shelf */
  .animal-item {
    position: relative;
    height: 88%;
    aspect-ratio: 1 / 1;
    max-width: 22vh;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.28s ease, opacity 0.3s ease;
    filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.6));
    z-index: 25;
    touch-action: none;
  }

  .grid-mode-12-shelf .animal-item {
    height: 76%;
    max-width: 7.4vw;
  }

  /* Organic mossy wood medallion under each animal */
  .animal-pedestal {
    position: absolute;
    bottom: 4%;
    width: 82%;
    height: 24%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, #659b38 0%, #3d6820 65%, #233f10 100%);
    box-shadow:
      0 6px 10px rgba(0,0,0,0.65),
      inset 0 2px 5px rgba(200, 255, 150, 0.45),
      0 0 0 3px #5c3a1e;
    z-index: -1;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .animal-item:hover {
    transform: translateY(-10px) scale(1.08);
    filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.75)) drop-shadow(0 0 14px rgba(253, 224, 71, 0.55));
  }

  .animal-item.selected-animal {
    transform: translateY(-14px) scale(1.13);
    filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 22px #fde047);
  }

  .animal-item.selected-animal .animal-pedestal {
    box-shadow: 0 0 20px #fde047, 0 0 0 3px #facc15;
  }

  .animal-item.placed-hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.1);
  }

  .animal-svg-wrap {
    width: 100%;
    height: 100%;
    animation: animalIdleBreathe 3.2s ease-in-out infinite alternate;
  }

  .animal-item:nth-child(even) .animal-svg-wrap {
    animation-delay: -1.5s;
  }

  @keyframes animalIdleBreathe {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-4px) scale(1.025, 0.985); }
  }

  /* Dragging Clone */
  #drag-proxy {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 170px;
    height: 170px;
    transform: translate(-50%, -50%) scale(1.18);
    filter: drop-shadow(0 22px 26px rgba(0,0,0,0.75)) drop-shadow(0 0 20px rgba(253, 224, 71, 0.75));
    display: none;
  }

  /* Wrong answer shake animation */
  @keyframes headShakeWrong {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-14px) rotate(-8deg); }
    40% { transform: translateX(14px) rotate(8deg); }
    60% { transform: translateX(-10px) rotate(-5deg); }
    80% { transform: translateX(10px) rotate(5deg); }
  }

  .wrong-shake {
    animation: headShakeWrong 0.55s ease-in-out !important;
  }

  /* Happy bounce inside habitat */
  @keyframes happyJump {
    0%, 100% { transform: scale(1) translateY(0) rotate(0deg); }
    30% { transform: scale(1.16, 0.9) translateY(-14px) rotate(-4deg); }
    60% { transform: scale(0.95, 1.08) translateY(-6px) rotate(4deg); }
  }

  .happy-bounce {
    animation: happyJump 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
  }

  /* Minimalist Wooden Button "далі →" */
  #next-btn {
    position: relative;
    width: 138px;
    height: 76px;
    border-radius: 26px;
    border: none;
    cursor: pointer;
    background: linear-gradient(180deg, #76b83f 0%, #4b871e 55%, #346311 100%);
    box-shadow:
      0 8px 0 #1f3d08,
      0 14px 24px rgba(0, 0, 0, 0.65),
      inset 0 3px 5px rgba(220, 255, 170, 0.65),
      0 0 0 4px #5c3a1e;
    color: #fffbeb;
    font-size: 1.65rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.2s ease;
    z-index: 30;
  }

  #next-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.08);
    box-shadow:
      0 11px 0 #1f3d08,
      0 18px 28px rgba(0, 0, 0, 0.75),
      inset 0 3px 6px rgba(220, 255, 170, 0.8),
      0 0 18px rgba(132, 204, 22, 0.65),
      0 0 0 4px #6e4726;
  }

  #next-btn:active {
    transform: translateY(5px);
    box-shadow:
      0 3px 0 #1f3d08,
      0 6px 12px rgba(0, 0, 0, 0.6),
      inset 0 2px 4px rgba(220, 255, 170, 0.5),
      0 0 0 4px #5c3a1e;
  }

  @keyframes pulseGlowBtn {
    0%, 100% { transform: scale(1); box-shadow: 0 8px 0 #1f3d08, 0 0 25px #fde047, 0 0 0 4px #facc15; }
    50% { transform: scale(1.08); box-shadow: 0 8px 0 #1f3d08, 0 0 45px #fde047, 0 0 0 6px #fef08a; }
  }

  .btn-celebrate {
    animation: pulseGlowBtn 1.1s ease-in-out infinite !important;
  }

  /* Pictorial Mode & Sound Icon Buttons (Top Right, No Text) */
  #top-controls {
    position: fixed;
    top: 1.2vh;
    right: 1.8vw;
    z-index: 50;
    display: flex;
    gap: 10px;
  }

  .icon-wood-btn {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    background: linear-gradient(145deg, #6b4423, #3d2310);
    box-shadow:
      0 4px 0 #211106,
      0 6px 14px rgba(0,0,0,0.55),
      inset 0 2px 3px rgba(255,215,160,0.4),
      0 0 0 2px #4c7c29;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .icon-wood-btn:hover {
    transform: translateY(-2px) scale(1.06);
    filter: brightness(1.12);
  }

  .icon-wood-btn:active {
    transform: translateY(2px);
  }

  /* Particle FX Canvas */
  #fx-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9000;
  }
</style>
</head>
<body>

<div id="game-stage">
  <!-- Living Nature Panorama Background SVG (Zero white rectangles) -->
  <svg id="bg-panorama" class="fixed inset-0 w-full h-full pointer-events-none" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="38%" stop-color="#7dd3fc"/>
        <stop offset="72%" stop-color="#bae6fd"/>
        <stop offset="100%" stop-color="#fef08a"/>
      </linearGradient>
      <linearGradient id="sunBeamGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="farHills" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4d7c5d"/>
        <stop offset="100%" stop-color="#294c36"/>
      </linearGradient>
      <linearGradient id="midHills" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3f6e37"/>
        <stop offset="100%" stop-color="#1f3f1d"/>
      </linearGradient>
      <linearGradient id="foreMeadow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2f5922"/>
        <stop offset="50%" stop-color="#1e3c16"/>
        <stop offset="100%" stop-color="#11240c"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
        <stop offset="40%" stop-color="#fde047" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Sky -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>

    <!-- Warm Sun & Sunbeams -->
    <circle cx="960" cy="90" r="240" fill="url(#sunGlow)"/>
    <g>
      <polygon class="sky-beam" points="960,-20 550,1080 780,1080" fill="url(#sunBeamGrad)"/>
      <polygon class="sky-beam" points="960,-20 880,1080 1120,1080" fill="url(#sunBeamGrad)"/>
      <polygon class="sky-beam" points="960,-20 1220,1080 1480,1080" fill="url(#sunBeamGrad)"/>
    </g>

    <!-- Drifting Soft Clouds -->
    <g class="cloud-drift-1" opacity="0.65" fill="#ffffff">
      <path d="M180,140 Q210,100 260,115 Q300,85 350,115 Q395,110 410,145 Q430,170 390,180 L170,180 Q140,165 180,140 Z"/>
      <path d="M1280,110 Q1320,70 1380,90 Q1430,65 1480,100 Q1520,110 1510,145 L1260,145 Q1240,125 1280,110 Z"/>
    </g>
    <g class="cloud-drift-2" opacity="0.45" fill="#f0f9ff">
      <path d="M680,175 Q710,140 760,155 Q800,135 840,165 L660,165 Z"/>
      <path d="M1620,180 Q1660,145 1710,160 Q1750,140 1790,175 L1600,175 Z"/>
    </g>

    <!-- Distant Mountains & Forest Ridges -->
    <path d="M0,560 Q240,420 520,510 T1080,470 T1620,520 T1920,460 L1920,1080 L0,1080 Z" fill="url(#farHills)"/>
    <path d="M0,650 Q340,530 700,610 T1380,580 T1920,620 L1920,1080 L0,1080 Z" fill="url(#midHills)"/>

    <!-- Foreground Lush Meadow & Framing Forest Trees -->
    <path d="M0,740 Q480,680 960,730 T1920,710 L1920,1080 L0,1080 Z" fill="url(#foreMeadow)"/>

    <!-- Left & Right Framing Tree Trunks & Vines -->
    <g fill="#2b180a">
      <path d="M0,0 L70,0 Q55,300 45,600 Q65,850 95,1080 L0,1080 Z"/>
      <path d="M1920,0 L1850,0 Q1865,300 1875,600 Q1855,850 1825,1080 L1920,1080 Z"/>
    </g>
    <!-- Framing Canopy Leaves -->
    <g fill="#274e1a" opacity="0.9">
      <circle cx="40" cy="40" r="95"/>
      <circle cx="140" cy="15" r="75"/>
      <circle cx="1880" cy="40" r="95"/>
      <circle cx="1780" cy="15" r="75"/>
    </g>
  </svg>

  <!-- Pictorial Top-Right Controls (Layout Toggle 4/12 & Audio Toggle) -->
  <div id="top-controls">
    <!-- Toggle 4 Large Cards vs 12 Full Panorama -->
    <button id="mode-toggle-btn" class="icon-wood-btn" aria-label="Toggle View">
      <svg id="mode-icon-svg" viewBox="0 0 36 36" width="28" height="28">
        <!-- 4-grid icon / 12-grid icon updated dynamically -->
        <rect x="4" y="4" width="12" height="12" rx="3" fill="#fde047" stroke="#422006" stroke-width="1.5"/>
        <rect x="20" y="4" width="12" height="12" rx="3" fill="#fde047" stroke="#422006" stroke-width="1.5"/>
        <rect x="4" y="20" width="12" height="12" rx="3" fill="#fde047" stroke="#422006" stroke-width="1.5"/>
        <rect x="20" y="20" width="12" height="12" rx="3" fill="#fde047" stroke="#422006" stroke-width="1.5"/>
      </svg>
    </button>
    <!-- Mute/Unmute Sound Icon -->
    <button id="sound-toggle-btn" class="icon-wood-btn" aria-label="Toggle Sound">
      <svg id="sound-icon-svg" viewBox="0 0 36 36" width="28" height="28">
        <path d="M6,14 L12,14 L19,8 L19,28 L12,22 L6,22 Z" fill="#fde047" stroke="#422006" stroke-width="1.5" stroke-linejoin="round"/>
        <path id="sound-waves-path" d="M24,12 Q29,18 24,24 M27,8 Q34,18 27,28" fill="none" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Habitats Stage Grid -->
  <div id="habitats-grid" class="grid-mode-4"></div>

  <!-- Bottom Carved Log Shelf with Animals + Minimalist "далі →" Button -->
  <div id="bottom-shelf-area">
    <div id="animals-log-shelf"></div>
    <button id="next-btn" type="button">далі →</button>
  </div>

  <!-- Floating Drag Proxy -->
  <div id="drag-proxy"></div>

  <!-- Particle Effects Canvas -->
  <canvas id="fx-canvas"></canvas>
</div>

<script>
/**
 * ============================================================================
 * 1. REALISTIC MULTI-LAYERED VECTOR ILLUSTRATIONS (12 ANIMALS & 12 HABITATS)
 * Hand-crafted inline SVGs with gradients, fur/feather textures, and lighting
 * ============================================================================
 */
const ANIMALS_DATA = [
  {
    key: 'dog',
    themeColor: '#f59e0b',
    particleType: 'boneHeart',
    /* Realistic Golden-Brown Dog */
    animalSVG: `
      <svg viewBox="0 0 220 220" width="100%" height="100%">
        <defs>
          <radialGradient id="dogFur" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#f6c478"/>
            <stop offset="55%" stop-color="#d98a3c"/>
            <stop offset="100%" stop-color="#8c4f19"/>
          </radialGradient>
          <linearGradient id="dogChest" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff3d6"/>
            <stop offset="100%" stop-color="#e2b477"/>
          </linearGradient>
          <linearGradient id="dogEar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9e581c"/>
            <stop offset="100%" stop-color="#5c2e09"/>
          </linearGradient>
        </defs>
        <!-- Wagging Tail -->
        <path d="M155,148 Q195,125 198,95 Q185,92 172,115 Q158,132 148,142 Z" fill="url(#dogFur)" stroke="#6b380f" stroke-width="2"/>
        <!-- Hind Body & Haunches -->
        <ellipse cx="128" cy="148" rx="42" ry="36" fill="url(#dogFur)" stroke="#6b380f" stroke-width="2"/>
        <ellipse cx="152" cy="164" rx="22" ry="20" fill="#b56a24"/>

/**
 * ============================================================================
 * 2. SYNTHESIZED WEB AUDIO ENGINE (Active Non-Verbal Animal & Musical Feedbacks)
 * ============================================================================
 */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playTone(freq, type, duration, delay = 0, vol = 0.18, slideTo = null) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
    }
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  playPickup() {
    this.playTone(380, 'sine', 0.11, 0, 0.15, 620);
  }

  playWrong() {
    // Gentle comical non-verbal "boing-uh-oh"
    this.playTone(260, 'triangle', 0.18, 0, 0.2, 180);
    this.playTone(190, 'sawtooth', 0.26, 0.14, 0.14, 125);
  }

  playAnimalCelebration(key) {
    if (this.muted) return;
    this.init();
    // Play a bright musical chord plus a distinct synthesized signature for each animal
    const chords = [523.25, 659.25, 783.99, 1046.5];
    chords.forEach((f, idx) => this.playTone(f, 'triangle', 0.35, idx * 0.06, 0.13));

    switch (key) {
      case 'dog': // Playful double woof
        this.playTone(240, 'sawtooth', 0.12, 0.05, 0.2, 340);
        this.playTone(260, 'sawtooth', 0.15, 0.22, 0.22, 380);
        break;
      case 'camel': // Warm desert harmonic glissando
        this.playTone(293.66, 'sine', 0.35, 0.05, 0.2, 440);
        this.playTone(440, 'triangle', 0.4, 0.25, 0.18, 554.37);
        break;
      case 'bear': // Deep warm bass rumble + wood chime
        this.playTone(110, 'sawtooth', 0.4, 0.02, 0.2, 85);
        this.playTone(330, 'sine', 0.3, 0.2, 0.18, 440);
        break;
      case 'squirrel': // Rapid woody chitter
        [0, 0.07, 0.14, 0.21].forEach((d, i) => {
          this.playTone(900 + i * 160, 'square', 0.05, d, 0.1, 1300);
        });
        break;
      case 'fox': // Playful harp cascade
        [587, 740, 880, 1174].forEach((f, i) => {
          this.playTone(f, 'sine', 0.22, i * 0.06, 0.16);
        });
        break;
      case 'spider': // Plucked silk harp arpeggio
        [659, 784, 987, 1318, 1567].forEach((f, i) => {
          this.playTone(f, 'triangle', 0.18, i * 0.05, 0.14);
        });
        break;
      case 'bird': // Melodic bird tweet trill
        this.playTone(1400, 'sine', 0.12, 0.02, 0.18, 2200);
        this.playTone(1800, 'sine', 0.14, 0.16, 0.18, 2600);
        this.playTone(2100, 'sine', 0.2, 0.32, 0.18, 1600);
        break;
      case 'mouse': // Cute high squeak-squeak
        this.playTone(1650, 'sine', 0.09, 0.04, 0.16, 2350);
        this.playTone(1850, 'sine', 0.11, 0.16, 0.16, 2500);
        break;
      case 'ant': // Busy marimba percussion
        [440, 554, 659, 880].forEach((f, i) => {
          this.playTone(f, 'sine', 0.09, i * 0.05, 0.2);
        });
        break;
      case 'bat': // Crystal cave sonar echo
        [1200, 1600, 2000, 2400].forEach((f, i) => {
          this.playTone(f, 'sine', 0.28, i * 0.07, 0.12, f * 0.85);
        });
        break;
      case 'bee': // Buzzing hum + sweet chord
        this.playTone(220, 'sawtooth', 0.38, 0.02, 0.12, 260);
        this.playTone(224, 'sawtooth', 0.38, 0.02, 0.12, 265);
        break;
      case 'frog': // Ribbit croak
        this.playTone(160, 'sawtooth', 0.14, 0.04, 0.22, 340);
        this.playTone(180, 'sawtooth', 0.18, 0.22, 0.22, 410);
        break;
    }
  }

  playRoundCompleteFanfare() {
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
    notes.forEach((f, i) => {
      this.playTone(f, 'triangle', 0.45, i * 0.08, 0.18);
    });
  }
}

function spawnMatchBurst(x, y, themeColor, particleType) {
  const palette = [themeColor, '#fde047', '#4ade80', '#38bdf8', '#fb7185', '#ffffff'];
  for (let i = 0; i < 48; i++) {
    const angle = (Math.PI * 2 * i) / 48 + (Math.random() - 0.5) * 0.25;
    const speed = 3 + Math.random() * 9;
    let shape = 'leaf';
    if (particleType === 'waterBubble' || particleType === 'dewSparkle') shape = 'bubble';
    else if (particleType === 'sunSparkle' || particleType === 'crystalSparkle' || particleType === 'cheeseStar') shape = 'star';
    else if (particleType === 'blossomPetal' || particleType === 'honeyPetal' || particleType === 'boneHeart') shape = 'petal';

    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2.5,
      gravity: 0.16,
      size: 7 + Math.random() * 9,
      color: palette[i % palette.length],
      alpha: 1,
      decay: 0.014 + Math.random() * 0.01,
      shape,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.2
    });
  }
}

function drawStarShape(c, r) {
  c.beginPath();
  for (let i = 0; i < 5; i++) {
    const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
    const a2 = a1 + Math.PI / 5;
    c.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
    c.lineTo(Math.cos(a2) * (r * 0.45), Math.sin(a2) * (r * 0.45));
  }
  c.closePath();
  c.fill();
}

function renderParticlesLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ambient fireflies
  fireflies.forEach(f => {
    f.x += f.vx;
    f.y += f.vy;
    f.phase += 0.04;
    if (f.x < 0) f.x = canvas.width;
    if (f.x > canvas.width) f.x = 0;
    if (f.y < 0) f.y = canvas.height;
    if (f.y > canvas.height) f.y = 0;

    const glow = 0.25 + 0.45 * Math.sin(f.phase);
    ctx.save();
    ctx.globalAlpha = Math.max(0.05, glow);
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Active burst & trail particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.gravity) p.vy += p.gravity;
    p.rot += p.vRot || 0;
    p.alpha -= p.decay;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;

    if (p.shape === 'bubble') {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, p.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (p.shape === 'leaf' || p.shape === 'petal') {
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      drawStarShape(ctx, p.size);
    }
    ctx.restore();
  }

  requestAnimationFrame(renderParticlesLoop);
}

/**
 * ============================================================================
 * 4. INFINITE GAME GENERATOR & INTERACTION CONTROLLER
 * ============================================================================
 */
let viewMode = 4; // 4 close-up cards per round (default) or 12 full panorama
let deckQueue = [];
let currentRoundItems = [];
let matchedCount = 0;
let selectedAnimalKey = null;
let dragState = null;

const habitatsGrid = document.getElementById('habitats-grid');
const animalsShelf = document.getElementById('animals-log-shelf');
const dragProxy = document.getElementById('drag-proxy');
const nextBtn = document.getElementById('next-btn');
const modeToggleBtn = document.getElementById('mode-toggle-btn');
const soundToggleBtn = document.getElementById('sound-toggle-btn');

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function getNextBatch(count) {
  if (count === 12) {
    return shuffleArray(ANIMALS_DATA);
  }
  // Infinite deck generator so all 12 animals appear regularly without repetition before reshuffling
  if (deckQueue.length < count) {
    const fresh = shuffleArray(ANIMALS_DATA).filter(item => !deckQueue.some(d => d.key === item.key));
    deckQueue.push(...fresh);
  }
  return deckQueue.splice(0, count);
}

function generateRound() {
  selectedAnimalKey = null;
  matchedCount = 0;
  nextBtn.classList.remove('btn-celebrate');

  currentRoundItems = getNextBatch(viewMode);
  const shuffledHabitats = shuffleArray(currentRoundItems);
  const shuffledAnimals = shuffleArray(currentRoundItems);

  // Configure grid classes
  habitatsGrid.className = viewMode === 12 ? 'grid-mode-12' : 'grid-mode-4';
  animalsShelf.className = viewMode === 12 ? 'grid-mode-12-shelf' : '';

  // Render Habitat Cards
  habitatsGrid.innerHTML = '';
  shuffledHabitats.forEach(item => {
    const card = document.createElement('div');
    card.className = 'habitat-card';
    card.dataset.key = item.key;
    card.innerHTML = `
      <div class="habitat-inner">
        ${item.habitatSVG}
        <div class="housed-animal-slot">${item.animalSVG}</div>
      </div>
    `;

    // Clicking a habitat either places a selected animal OR replays the housed animal animation & sound
    card.addEventListener('pointerdown', (e) => {
      if (card.classList.contains('matched-card')) {
        e.stopPropagation();
        triggerHousedAnimalAction(card, item);
        return;
      }
      if (selectedAnimalKey) {
        e.stopPropagation();
        const animalEl = animalsShelf.querySelector(`.animal-item[data-key="${selectedAnimalKey}"]`);
        if (animalEl) attemptMatch(animalEl, card);
      } else {
        // Subtle ambient sound when exploring an empty habitat
        sound.playPickup();
        const rect = card.getBoundingClientRect();
        spawnTrailParticle(rect.left + rect.width / 2, rect.top + rect.height / 2, item.themeColor);
      }
    });

    habitatsGrid.appendChild(card);
  });

  // Render Animal Tokens on the Carved Wooden Log Shelf
  animalsShelf.innerHTML = '';
  shuffledAnimals.forEach(item => {
    const animalEl = document.createElement('div');
    animalEl.className = 'animal-item';
    animalEl.dataset.key = item.key;
    animalEl.innerHTML = `
      <div class="animal-pedestal"></div>
      <div class="animal-svg-wrap">${item.animalSVG}</div>
    `;

    animalEl.addEventListener('pointerdown', (e) => startAnimalInteraction(e, animalEl, item));
    animalsShelf.appendChild(animalEl);
  });
}

function triggerHousedAnimalAction(card, item) {
  const slot = card.querySelector('.housed-animal-slot');
  slot.classList.remove('happy-bounce');
  void slot.offsetWidth;
  slot.classList.add('happy-bounce');
  sound.playAnimalCelebration(item.key);
  const rect = card.getBoundingClientRect();
  spawnMatchBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, item.themeColor, item.particleType);
}

function startAnimalInteraction(e, animalEl, item) {
  if (animalEl.classList.contains('placed-hidden')) return;
  e.preventDefault();
  sound.playPickup();

  // Select animal for click-to-match as well as drag-to-match
  animalsShelf.querySelectorAll('.animal-item').forEach(el => el.classList.remove('selected-animal'));
  animalEl.classList.add('selected-animal');
  selectedAnimalKey = item.key;

  dragProxy.innerHTML = item.animalSVG;
  dragProxy.style.display = 'block';
  dragProxy.style.left = `${e.clientX}px`;
  dragProxy.style.top = `${e.clientY}px`;

  dragState = {
    animalEl,
    item,
    startX: e.clientX,
    startY: e.clientY,
    moved: false
  };
}

window.addEventListener('pointermove', (e) => {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if (Math.hypot(dx, dy) > 8) dragState.moved = true;

  dragProxy.style.left = `${e.clientX}px`;
  dragProxy.style.top = `${e.clientY}px`;

  if (Math.random() < 0.45) {
    spawnTrailParticle(e.clientX, e.clientY, dragState.item.themeColor);
  }

  // Highlight hovered habitat card
  habitatsGrid.querySelectorAll('.habitat-card').forEach(card => {
    if (card.classList.contains('matched-card')) return;
    const r = card.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    card.classList.toggle('drop-target-hover', inside);
  });
});

window.addEventListener('pointerup', (e) => {
  if (!dragState) return;
  const { animalEl } = dragState;
  dragProxy.style.display = 'none';

  // Check if released over a habitat card
  let targetCard = null;
  habitatsGrid.querySelectorAll('.habitat-card').forEach(card => {
    card.classList.remove('drop-target-hover');
    if (card.classList.contains('matched-card')) return;
    const r = card.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
      targetCard = card;
    }
  });

  if (targetCard) {
    attemptMatch(animalEl, targetCard);
  }

  dragState = null;
});

function attemptMatch(animalEl, habitatCard) {
  const animalKey = animalEl.dataset.key;
  const habitatKey = habitatCard.dataset.key;
  const itemData = ANIMALS_DATA.find(a => a.key === animalKey);
  const rect = habitatCard.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  if (animalKey === habitatKey) {
    // Correct Match!
    animalEl.classList.remove('selected-animal');
    animalEl.classList.add('placed-hidden');
    selectedAnimalKey = null;

    habitatCard.classList.add('matched-card');
    const slot = habitatCard.querySelector('.housed-animal-slot');
    slot.classList.add('happy-bounce');

    sound.playAnimalCelebration(animalKey);
    spawnMatchBurst(centerX, centerY, itemData.themeColor, itemData.particleType);

    matchedCount++;
    if (matchedCount >= currentRoundItems.length) {
      setTimeout(() => {
        sound.playRoundCompleteFanfare();
        nextBtn.classList.add('btn-celebrate');
        // Grand celebration bursts across the screen
        habitatsGrid.querySelectorAll('.habitat-card').forEach((c, idx) => {
          setTimeout(() => {
            const r = c.getBoundingClientRect();
            spawnMatchBurst(r.left + r.width / 2, r.top + r.height / 2, '#fde047', 'sunSparkle');
          }, idx * 120);
        });
      }, 450);
    }
  } else {
    // Non-verbal active wrong feedback: head shake + boing sound
    sound.playWrong();
    habitatCard.classList.remove('wrong-shake');
    animalEl.classList.remove('wrong-shake');
    void habitatCard.offsetWidth;
    habitatCard.classList.add('wrong-shake');
    animalEl.classList.add('wrong-shake');
    animalEl.classList.remove('selected-animal');
    selectedAnimalKey = null;
  }
}

// Minimalist "далі →" button: immediately generates a new round without requiring completion
nextBtn.addEventListener('click', () => {
  sound.playPickup();
  const r = nextBtn.getBoundingClientRect();
  spawnMatchBurst(r.left + r.width / 2, r.top + r.height / 2, '#84cc16', 'forestLeaf');
  generateRound();
});

// Pictorial View Mode Toggle (4 Large Habitats vs All 12 Habitats)
modeToggleBtn.addEventListener('click', () => {
  sound.playPickup();
  viewMode = viewMode === 4 ? 12 : 4;
  const iconSvg = document.getElementById('mode-icon-svg');
  if (viewMode === 12) {
    iconSvg.innerHTML = `
      <rect x="4" y="4" width="12" height="12" rx="3" fill="#fde047" stroke="#422006" stroke-width="1.5"/>
      <rect x="20" y="4" width="12" height="12" rx="3" fill="#fde047" stroke="#422006" stroke-width="1.5"/>
      <rect x="4" y="20" width="12" height="12" rx="3" fill="#fde047" stroke="#422006" stroke-width="1.5"/>
      <rect x="20" y="20" width="12" height="12" rx="3" fill="#fde047" stroke="#422006" stroke-width="1.5"/>
    `;
  } else {
    iconSvg.innerHTML = `
      <rect x="3" y="5" width="8" height="7" rx="1.5" fill="#fde047"/>
      <rect x="14" y="5" width="8" height="7" rx="1.5" fill="#fde047"/>
      <rect x="25" y="5" width="8" height="7" rx="1.5" fill="#fde047"/>
      <rect x="3" y="15" width="8" height="7" rx="1.5" fill="#fde047"/>
      <rect x="14" y="15" width="8" height="7" rx="1.5" fill="#fde047"/>
      <rect x="25" y="15" width="8" height="7" rx="1.5" fill="#fde047"/>
      <rect x="3" y="25" width="8" height="7" rx="1.5" fill="#fde047"/>
      <rect x="14" y="25" width="8" height="7" rx="1.5" fill="#fde047"/>
      <rect x="25" y="25" width="8" height="7" rx="1.5" fill="#fde047"/>
    `;
  }
  generateRound();
});

// Pictorial Sound Mute/Unmute Toggle
soundToggleBtn.addEventListener('click', () => {
  sound.muted = !sound.muted;
  const waves = document.getElementById('sound-waves-path');
  waves.style.display = sound.muted ? 'none' : 'block';
  if (!sound.muted) sound.playPickup();
});

window.onload = function () {
  // Set initial icon for switching to 12-card panorama
  document.getElementById('mode-icon-svg').innerHTML = `
    <rect x="3" y="5" width="8" height="7" rx="1.5" fill="#fde047"/>
    <rect x="14" y="5" width="8" height="7" rx="1.5" fill="#fde047"/>
    <rect x="25" y="5" width="8" height="7" rx="1.5" fill="#fde047"/>
    <rect x="3" y="15" width="8" height="7" rx="1.5" fill="#fde047"/>
    <rect x="14" y="15" width="8" height="7" rx="1.5" fill="#fde047"/>
    <rect x="25" y="15" width="8" height="7" rx="1.5" fill="#fde047"/>
    <rect x="3" y="25" width="8" height="7" rx="1.5" fill="#fde047"/>
    <rect x="14" y="25" width="8" height="7" rx="1.5" fill="#fde047"/>
    <rect x="25" y="25" width="8" height="7" rx="1.5" fill="#fde047"/>
  `;
  generateRound();
  renderParticlesLoop();
};
</script>
