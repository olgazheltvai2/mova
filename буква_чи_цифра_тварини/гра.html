<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відео-галерея Тварини</title>
    <style>
        /* Скидання базових відступів для чистоти полотна */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Яскравий сюжетний фон: літня галявина з градієнтами */
        body {
            background: 
                radial-gradient(circle at 15% 15%, #ffeb3b 0%, transparent 15%), /* Сонце */
                linear-gradient(to bottom, #87CEEB 0%, #87CEEB 55%, #76db65 55%, #4caf50 100%); /* Небо і трава */
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Забороняємо прокрутку сторінки */
        }

        /* Декоративні хмарки на фоні (створені суто засобами CSS) */
        .clouds {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .cloud {
            position: absolute;
            background: #fff9;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #fff9;
            border-radius: 50%;
        }
        .c1 { top: 8%; left: 12%; width: 160px; height: 55px; }
        .c1::before { width: 80px; height: 80px; top: -40px; left: 25px; }
        .c1::after { width: 60px; height: 60px; top: -25px; right: 20px; }
        
        .c2 { top: 20%; left: 75%; width: 220px; height: 65px; }
        .c2::before { width: 100px; height: 100px; top: -50px; left: 35px; }
        .c2::after { width: 80px; height: 80px; top: -35px; right: 35px; }

        /* Контейнер для сітки відео-карток */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 40px;
            width: 95%;
            max-width: 1300px;
            z-index: 1;
        }

        /* Стилізація самих вікон з відео (яскраві рожеві рамки) */
        .video-card {
            position: relative;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border: 8px solid #ff6b6b;
            border-radius: 25px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3), inset 0 0 15px rgba(255,255,255,0.5);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, border-color 0.3s;
            aspect-ratio: 16 / 9; /* Зберігаємо правильні пропорції екрану */
        }

        /* Пунктирна внутрішня лінія для ефекту "прошивки" */
        .video-card::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 3px dashed rgba(255,255,255,0.8);
            border-radius: 12px;
            pointer-events: none;
            z-index: 2;
        }

        /* Анімація при наведенні миші на картку */
        .video-card:hover {
            transform: scale(1.06) translateY(-8px);
            box-shadow: 0 25px 40px rgba(0,0,0,0.4);
            border-color: #ff9f43;
        }

        /* Налаштування відео в режимі прев'ю */
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            pointer-events: none; /* Забороняємо взаємодію, щоб клік йшов на всю картку */
            background-color: transparent;
        }

        /* Темний розмитий фон для повноекранного режиму */
        .fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        /* Клас для активації повноекранного режиму */
        .fullscreen-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Контейнер для відкритого відео зі стилізованою зеленої рамкою */
        .expanded-video-container {
            position: relative;
            width: 85%;
            max-width: 1100px;
            background: linear-gradient(45deg, #1dd1a1, #10ac84);
            padding: 18px;
            border-radius: 35px;
            box-shadow: 0 0 60px rgba(29, 209, 161, 0.6);
            transform: scale(0.6);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Анімація збільшення вікна відео */
        .fullscreen-overlay.active .expanded-video-container {
            transform: scale(1);
        }

        /* Налаштування самого плеєра у відкритому вигляді */
        .expanded-video-container video {
            width: 100%;
            border-radius: 20px;
            display: block;
            background: #000;
            outline: none;
        }

        /* Стилізована кругла кнопка закриття (хрестик) */
        .close-btn {
            position: absolute;
            top: -25px;
            right: -25px;
            width: 65px;
            height: 65px;
            background: #ff4757;
            border: 5px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s, background 0.3s;
            z-index: 101;
        }

        /* Малювання хрестика за допомогою псевдоелементів */
        .close-btn::before, .close-btn::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 5px;
            background: #fff;
            border-radius: 3px;
        }

        .close-btn::before { transform: rotate(45deg); }
        .close-btn::after { transform: rotate(-45deg); }

        /* Анімація обертання хрестика при наведенні */
        .close-btn:hover {
            transform: scale(1.15) rotate(90deg);
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <!-- Декорації сюжетного фону -->
    <div class="clouds">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
    </div>

    <!-- Сітка з відео. Шляхи тепер прямі, бо файли в тій самій папці. #t=0.1 змушує браузер показати перший кадр відео як картинку -->
    <div class="gallery-container">
        <div class="video-card" onclick="openVideo('свинка.mp4')">
            <video src="свинка.mp4#t=0.1" preload="metadata"></video>
        </div>
        <div class="video-card" onclick="openVideo('корова.mp4')">
            <video src="корова.mp4#t=0.1" preload="metadata"></video>
        </div>
        <div class="video-card" onclick="openVideo('вівця.mp4')">
            <video src="вівця.mp4#t=0.1" preload="metadata"></video>
        </div>
        <div class="video-card" onclick="openVideo('собака.mp4')">
            <video src="собака.mp4#t=0.1" preload="metadata"></video>
        </div>
        <div class="video-card" onclick="openVideo('конячка.mp4')">
            <video src="конячка.mp4#t=0.1" preload="metadata"></video>
        </div>
        <div class="video-card" onclick="openVideo('курка.mp4')">
            <video src="курка.mp4#t=0.1" preload="metadata"></video>
        </div>
    </div>

    <!-- Оверлей для збільшеного відео з контролами -->
    <div class="fullscreen-overlay" id="overlay">
        <div class="expanded-video-container">
            <div class="close-btn" onclick="closeVideo()"></div>
            <!-- Атрибут controls додає панель керування відео -->
            <video id="expanded-video" controls autoplay></video>
        </div>
    </div>

    <script>
        // Зв'язуємо змінні з елементами інтерфейсу
        const overlay = document.getElementById('overlay');
        const expandedVideo = document.getElementById('expanded-video');

        /**
         * Функція відкриття відео на весь екран
         * @param {string} filename - назва файлу відео
         */
        function openVideo(filename) {
            // Встановлюємо прямий шлях до відеофайлу
            expandedVideo.src = filename;
            
            // Показуємо затемнений фон та збільшене вікно
            overlay.classList.add('active');
            
            // Запускаємо відео. Відловлюємо можливі помилки автовідтворення
            expandedVideo.play().catch(error => {
                console.log("Браузер вимагає взаємодії для відтворення.");
            });
        }

        /**
         * Функція закриття повноекранного режиму
         */
        function closeVideo() {
            // Ховаємо оверлей
            overlay.classList.remove('active');
            
            // Затримка, щоб відео не зникало різко до кінця анімації
            setTimeout(() => {
                expandedVideo.pause(); // Ставимо на паузу
                expandedVideo.src = ''; // Очищаємо пам'ять
            }, 400); 
        }

        // Закриваємо відео, якщо клікнути будь-де на розмитому чорному фоні
        overlay.addEventListener('click', function(event) {
            if(event.target === overlay) {
                closeVideo();
            }
        });
    </script>
</body>
</html>
