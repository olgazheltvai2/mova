<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра: Прочитай слово по нитці</title>
    <!-- Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* Основні стилі та архітектура сторінки */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Propysy Bold', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
        }

        /* Перемикач мов */
        .lang-switch {
            position: fixed;
            top: 20px;
            left: 20px;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            z-index: 1000;
            display: flex;
            gap: 5px;
        }

        .lang-switch:hover {
            opacity: 1;
        }

        .lang-switch button {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #8c9c8a;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Propysy Bold', sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            transition: all 0.2s;
        }

        .lang-switch button.active {
            background: #8c9c8a;
            color: white;
            border-color: #5c6c5a;
        }

        /* Контейнер гри (повністю прозорий, гнучкий) */
        .game-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 60px;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        .controls-window {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #8c9c8a;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        #wordInput {
            font-family: 'Propysy Bold', sans-serif;
            font-size: 22px;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: #f4f4f4;
            color: transparent; /* Текст повністю невидимий */
            outline: none;
            width: 220px;
            text-align: center;
            transition: border-color 0.3s;
        }

        #wordInput:focus {
            border-color: #8c9c8a;
        }

        #wordInput::selection {
            background-color: #c0c0c0;
            color: transparent; /* Виділення теж не показує текст */
        }

        #generateBtn {
            font-family: 'Propysy Bold', sans-serif;
            font-size: 20px;
            padding: 12px 25px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        #generateBtn:hover {
            background-color: #333333;
            transform: translateY(-2px);
        }

        canvas {
            background-color: transparent;
            width: 100%;
            max-width: 600px;
            height: auto;
            display: block;
        }

        /* --- Адаптація для телефонів та маленьких екранів --- */
        @media (max-width: 800px) {
            body {
                align-items: flex-start; /* Дозволяє скролити сторінку на телефоні */
                padding-top: 60px; /* Місце для кнопок мови */
            }
            .game-container {
                flex-direction: column; /* Панель керування перестрибує вниз під гру */
                gap: 20px;
                padding: 10px;
            }
            .controls-window {
                padding: 20px;
                width: 90%;
                max-width: 320px;
                box-sizing: border-box;
            }
            #wordInput {
                width: 100%;
                box-sizing: border-box;
            }
        }

        /* --- Theme Manager Styles --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #ddd;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        #theme-btn:hover {
            transform: scale(1.1);
        }

        #theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            width: 320px;
            max-height: 60vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
            box-sizing: border-box;
        }

        .theme-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s;
        }

        .theme-thumb:hover {
            border-color: #4CAF50;
        }

        .theme-thumb span {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 3px 6px;
            font-size: 12px;
            font-family: 'Propysy Bold', sans-serif;
            border-radius: 4px;
            pointer-events: none;
        }
        #theme-modal::-webkit-scrollbar {
            width: 8px;
        }
        #theme-modal::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 8px;
        }
        #theme-modal::-webkit-scrollbar-thumb {
            background: #bbb; 
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Перемикач мов -->
    <div class="lang-switch">
        <button id="btnUA" class="active">УКР</button>
        <button id="btnRU">РУС</button>
    </div>

    <!-- Ігровий контейнер -->
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="controls-window">
            <input type="text" id="wordInput" placeholder="Введіть слово..." autocomplete="off">
            <button id="generateBtn">Створити шлях</button>
        </div>
    </div>

    <!-- Theme Manager -->
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal"></div>

    <script>
        /* =========================================
           FIREBASE КОНФІГ (спільний для гри та фонів)
           ========================================= */
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const senderId = 'dev_' + Math.random().toString(36).substr(2, 9);
        let lastActionTime = 0;
        let isRemoteAction = false;

        /* =========================================
           СИСТЕМА ДИНАМІЧНИХ ФОНІВ (Theme Manager) + СИНХРОНІЗАЦІЯ
           ========================================= */
        const baseBgUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        const defaultBgUrl = baseBgUrl + 'background_1.webp';
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        let isRemoteTheme = false;

        // Застосування фону (локально + Firebase)
        function applyBackground(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
            
            if (!isRemoteTheme) {
                console.log('📤 Відправляємо фон у Firebase:', url);
                db.ref('game_theme').set({
                    url: url,
                    senderId: senderId,
                    timestamp: Date.now()
                }).catch(err => console.warn('Помилка синхронізації фону:', err));
            }
        }

        // Слухач змін фону від інших пристроїв
        db.ref('game_theme').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.senderId === senderId) return;
            
            console.log('📥 Отримано фон з Firebase:', data.url);
            isRemoteTheme = true;
            document.body.style.backgroundImage = `url('${data.url}')`;
            localStorage.setItem('mySavedGameBg', data.url);
            isRemoteTheme = false;
        });

        // Відновлення фону при завантаженні
        function initTheme() {
            const savedBg = localStorage.getItem('mySavedGameBg');
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
            } else {
                document.body.style.backgroundImage = `url('${defaultBgUrl}')`;
            }

            db.ref('game_theme').once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data && data.senderId !== senderId) {
                    console.log('🔄 Відновлення фону з Firebase:', data.url);
                    document.body.style.backgroundImage = `url('${data.url}')`;
                    localStorage.setItem('mySavedGameBg', data.url);
                }
            }).catch(err => console.warn('Помилка завантаження фону з Firebase:', err));
        }

        // Завантаження мініатюр
        function loadThemes() {
            let index = 1;
            const maxAttempts = 1000;

            function checkNextImage() {
                if (index > maxAttempts) return;

                const url = `${baseBgUrl}background_${index}.webp`;
                const img = new Image();
                
                img.onload = function() {
                    const thumb = document.createElement('div');
                    thumb.className = 'theme-thumb';
                    thumb.style.backgroundImage = `url('${url}')`;
                    thumb.onclick = () => applyBackground(url);

                    const label = document.createElement('span');
                    label.textContent = `Фон ${index}`;
                    
                    thumb.appendChild(label);
                    themeModal.appendChild(thumb);
                    
                    index++;
                    checkNextImage();
                };

                img.onerror = function() {
                    return;
                };

                img.src = url;
            }

            checkNextImage();
        }

        themeBtn.addEventListener('click', () => {
            if (themeModal.style.display === 'grid') {
                themeModal.style.display = 'none';
            } else {
                themeModal.style.display = 'grid';
            }
        });

        document.addEventListener('click', (e) => {
            if (!themeModal.contains(e.target) && e.target !== themeBtn) {
                themeModal.style.display = 'none';
            }
        });

        initTheme();
        loadThemes();


        /* =========================================
           ЛОГІКА ГРИ "ПРОЧИТАЙ СЛОВО" + СИНХРОНІЗАЦІЯ
           ========================================= */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const generateBtn = document.getElementById('generateBtn');
        const wordInput = document.getElementById('wordInput');
        const btnUA = document.getElementById('btnUA');
        const btnRU = document.getElementById('btnRU');
        
        const alphabetUA = "АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ";
        const alphabetRU = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
        
        let currentAlphabet = alphabetUA;
        let currentLang = 'UA';
        const TOTAL_SLOTS = 28;

        let currentSlots = [];
        let currentPath = [];

        // Слухач ігрових дій
        db.ref('game_action').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.senderId === senderId) return;
            if (data.timestamp <= lastActionTime) return;

            isRemoteAction = true;
            lastActionTime = data.timestamp;

            console.log('📥 Отримано дію гри:', data.type);

            if (data.type === 'init' || data.type === 'generate') {
                const { slots, pathIndices, word, lang } = data;
                currentSlots = slots;
                currentPath = pathIndices;
                if (lang) {
                    currentLang = lang;
                    currentAlphabet = lang === 'UA' ? alphabetUA : alphabetRU;
                    btnUA.classList.toggle('active', lang === 'UA');
                    btnRU.classList.toggle('active', lang === 'RU');
                }
                wordInput.value = word || '';
                // Примусове малювання з невеликою затримкою для синхронізації DOM
                setTimeout(() => drawGame(slots, pathIndices), 50);
            }

            isRemoteAction = false;
        });

        // Відновлення стану гри при завантаженні
        function loadInitialState() {
            db.ref('game_action').once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data && (data.type === 'init' || data.type === 'generate') && data.senderId !== senderId) {
                    console.log('🔄 Відновлення стану гри з Firebase');
                    isRemoteAction = true;
                    const { slots, pathIndices, word, lang } = data;
                    currentSlots = slots;
                    currentPath = pathIndices;
                    if (lang) {
                        currentLang = lang;
                        currentAlphabet = lang === 'UA' ? alphabetUA : alphabetRU;
                        btnUA.classList.toggle('active', lang === 'UA');
                        btnRU.classList.toggle('active', lang === 'RU');
                    }
                    wordInput.value = word || '';
                    drawGame(slots, pathIndices);
                    isRemoteAction = false;
                } else {
                    // Якщо немає даних – генеруємо нову гру
                    console.log('🆕 Немає збереженого стану, генеруємо нову гру');
                    generateGame();
                }
            }).catch(err => {
                console.warn('Помилка завантаження стану гри:', err);
                generateGame();
            });
        }

        function sendAction(actionData) {
            if (isRemoteAction) return;
            actionData.senderId = senderId;
            actionData.timestamp = Date.now();
            db.ref('game_action').set(actionData);
            console.log('📤 Відправлено дію гри:', actionData.type);
        }

        // --- ОСНОВНІ ФУНКЦІЇ ГРИ ---

        function generateGame() {
            if (isRemoteAction) return;

            let word = wordInput.value.trim().toUpperCase();
            let slots = new Array(TOTAL_SLOTS);
            for (let i = 0; i < TOTAL_SLOTS; i++) {
                slots[i] = currentAlphabet[Math.floor(Math.random() * currentAlphabet.length)];
            }

            let pathIndices = [];
            
            if (word) {
                let availablePositions = Array.from({length: TOTAL_SLOTS}, (_, i) => i);

                for (let i = 0; i < word.length; i++) {
                    if (availablePositions.length === 0) break;
                    let randomIdx = Math.floor(Math.random() * availablePositions.length);
                    let pos = availablePositions[randomIdx];
                    slots[pos] = word[i];
                    pathIndices.push(pos);
                    availablePositions.splice(randomIdx, 1);
                }
            }

            currentSlots = slots;
            currentPath = pathIndices;

            drawGame(slots, pathIndices);
            sendAction({
                type: 'generate',
                slots: slots,
                pathIndices: pathIndices,
                word: word,
                lang: currentLang
            });
        }

        function drawGame(slots, pathIndices) {
            // Якщо дані не передано, використовуємо поточні
            if (!slots || slots.length === 0) {
                console.warn('⚠️ drawGame: slots порожній, використовуємо currentSlots');
                slots = currentSlots;
                pathIndices = currentPath;
            }

            // Якщо все ще порожньо – створюємо випадкові літери
            if (!slots || slots.length === 0) {
                console.warn('⚠️ drawGame: створюємо випадкові літери');
                slots = new Array(TOTAL_SLOTS);
                for (let i = 0; i < TOTAL_SLOTS; i++) {
                    slots[i] = currentAlphabet[Math.floor(Math.random() * currentAlphabet.length)];
                }
                pathIndices = [];
                currentSlots = slots;
                currentPath = pathIndices;
            }

            console.log('🎨 Малюємо гру, кількість літер:', slots.length);
            console.log('📌 Шлях:', pathIndices);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 240;

            // Зовнішнє коло
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Координати літер
            const coords = slots.map((_, i) => {
                const angle = (i / slots.length) * 2 * Math.PI - Math.PI / 2;
                return {
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle)
                };
            });

            // Нитки
            if (pathIndices && pathIndices.length > 1) {
                ctx.beginPath();
                ctx.moveTo(coords[pathIndices[0]].x, coords[pathIndices[0]].y);
                
                for (let i = 1; i < pathIndices.length; i++) {
                    const end = coords[pathIndices[i]];
                    const cpX = cx + (Math.random() * 120 - 60);
                    const cpY = cy + (Math.random() * 120 - 60);
                    ctx.quadraticCurveTo(cpX, cpY, end.x, end.y);
                }
                ctx.strokeStyle = '#8c9c8a';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // Шрифт для літер (Arial – надійний)
            ctx.font = 'bold 32px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Малюємо кожну літеру
            slots.forEach((letter, i) => {
                const c = coords[i];

                // Тінь для кружечка
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                // Кружечок
                ctx.beginPath();
                ctx.arc(c.x, c.y, 28, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Скидаємо тінь для обідка та тексту
                ctx.shadowColor = 'transparent';

                // Обідок
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#5c6c5a';
                ctx.stroke();

                // Колір тексту та заливка для першої літери
                if (pathIndices && pathIndices.length > 0 && pathIndices[0] === i) {
                    ctx.fillStyle = '#8c9c8a';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 28, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = '#222222';
                }

                ctx.fillText(letter, c.x, c.y);
            });
        }

        // --- ОБРОБНИКИ ПОДІЙ ---

        function setLanguage(lang) {
            if (isRemoteAction) return;
            if (lang === currentLang) return;
            currentLang = lang;
            currentAlphabet = lang === 'UA' ? alphabetUA : alphabetRU;
            btnUA.classList.toggle('active', lang === 'UA');
            btnRU.classList.toggle('active', lang === 'RU');
            generateGame();
        }

        btnUA.addEventListener('click', () => setLanguage('UA'));
        btnRU.addEventListener('click', () => setLanguage('RU'));

        generateBtn.addEventListener('click', generateGame);

        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateGame();
            }
        });

        // --- ЗАПУСК ---
        window.onload = function() {
            // Спочатку малюємо тестові дані, щоб канвас точно щось показав
            const testSlots = [
                'А','Б','В','Г','Д','Е','Є','Ж','З','И','І','Ї','Й','К',
                'Л','М','Н','О','П','Р','С','Т','У','Ф','Х','Ц','Ч','Ш'
            ];
            drawGame(testSlots, [0, 5, 10, 15, 20, 25]);

            // Потім відновлюємо стан гри з Firebase
            setTimeout(() => {
                loadInitialState();
            }, 100);

            console.log('🚀 Гра "Прочитай слово по нитці" завантажена. Синхронізація активна.');
            console.log('🔑 Sender ID:', senderId);
        };
    </script>

    <!-- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ -->
    <!-- 1. Екран-заглушка -->
    <div id="block-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); color: white; z-index: 99999; justify-content: center; align-items: center; flex-direction: column; font-family: sans-serif;">
        <h1 style="color: #e74c3c; font-size: 50px; margin:0;">Зачекай! ✋</h1>
        <p style="font-size: 24px;">Зараз не твій урок.</p>
    </div>

    <!-- 2. Логіка Firebase для радару та блокування -->
    <script>
        // НАДІЙНЕ збереження імені
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user');

        if (myName) {
            sessionStorage.setItem('myStudentName', myName); 
        } else {
            myName = sessionStorage.getItem('myStudentName'); 
            if (!myName) {
                myName = 'Гість_' + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('myStudentName', myName);
            }
        }

        // Радар: унікальні вкладки та присутність
        const tabId = Math.random().toString(36).substring(2, 10);
        const myPresenceRef = db.ref('online_users/' + myName + '/' + tabId);
        
        db.ref('.info/connected').on('value', (snapshot) => {
            if (snapshot.val() === true) {
                myPresenceRef.onDisconnect().remove();
                myPresenceRef.set(true);
            }
        });

        // Сигнал від вчителя: "Оновити список"
        db.ref('force_refresh').on('value', (snapshot) => {
            if(snapshot.val()) {
                myPresenceRef.set(true);
            }
        });

        // МИТТЄВА ЗАЧИСТКА при виході з гри
        window.addEventListener('beforeunload', () => {
            myPresenceRef.remove();
        });

        // Слухач блокування
        db.ref('blocked_users/' + myName).on('value', (snapshot) => {
            const overlay = document.getElementById('block-overlay');
            if (snapshot.val() === true) { 
                overlay.style.display = 'flex'; 
            } else { 
                overlay.style.display = 'none'; 
            }
        });

        // ПОВЕРНЕННЯ В ЛОБІ (з надійним імунітетом при старті)
        let currentDBValue = null;
        let isInitialSync = true;

        db.ref('current_activity').on('value', (snapshot) => {
            const val = snapshot.val();
            
            if (isInitialSync) {
                currentDBValue = val;
                // Даємо 1 секунду імунітету, щоб Firebase обробив свої подвійні завантаження
                setTimeout(() => { isInitialSync = false; }, 1000);
                return;
            }

            // Переходимо в лобі тільки якщо вчитель РЕАЛЬНО змінив команду на 'lobby'
            if (val === 'lobby' && val !== currentDBValue) {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
            
            currentDBValue = val;
        });
    </script>
