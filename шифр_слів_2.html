<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра: Прочитай слово по нитці</title>
    <!-- Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* Основні стилі та архітектура сторінки */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Propysy Bold', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out;
        }

        /* Перемикач мов */
        .lang-switch {
            position: fixed;
            top: 20px;
            left: 20px;
            opacity: 0.4;
            transition: opacity 0.3s ease;
            z-index: 1000;
            display: flex;
            gap: 5px;
        }

        .lang-switch:hover {
            opacity: 1;
        }

        .lang-switch button {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #8c9c8a;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Propysy Bold', sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            transition: all 0.2s;
        }

        .lang-switch button.active {
            background: #8c9c8a;
            color: white;
            border-color: #5c6c5a;
        }

        .game-container {
            /* Білий прямокутник прибрано */
            padding: 20px;
            display: flex;
            flex-direction: row; /* Канвас зліва, вікно керування справа */
            justify-content: center;
            align-items: center;
            gap: 60px;
            width: 100%;
            max-width: 1200px;
        }

        /* Стилізоване вікно керування (праворуч) */
        .controls-window {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #8c9c8a;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* Поле вводу з невидимим текстом */
        #wordInput {
            font-family: 'Propysy Bold', sans-serif;
            font-size: 22px;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: #f4f4f4;
            color: #f4f4f4; /* Текст зливається з фоном */
            outline: none;
            width: 220px;
            text-align: center;
            transition: border-color 0.3s;
        }

        #wordInput:focus {
            border-color: #8c9c8a;
        }

        #wordInput::selection {
            background-color: #c0c0c0;
            color: #333; /* Дозволяє побачити текст при виділенні */
        }

        #generateBtn {
            font-family: 'Propysy Bold', sans-serif;
            font-size: 20px;
            padding: 12px 25px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        #generateBtn:hover {
            background-color: #333333;
            transform: translateY(-2px);
        }

        canvas {
            background-color: transparent;
            max-width: 100%;
            height: auto;
        }

        /* --- Theme Manager Styles --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #ddd;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        #theme-btn:hover {
            transform: scale(1.1);
        }

        #theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            width: 320px;
            max-height: 60vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            overflow-y: auto;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
            box-sizing: border-box;
        }

        .theme-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s;
        }

        .theme-thumb:hover {
            border-color: #4CAF50;
        }

        .theme-thumb span {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 3px 6px;
            font-size: 12px;
            font-family: 'Propysy Bold', sans-serif;
            border-radius: 4px;
            pointer-events: none;
        }
        /* Скроллбар для меню тем */
        #theme-modal::-webkit-scrollbar {
            width: 8px;
        }
        #theme-modal::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 8px;
        }
        #theme-modal::-webkit-scrollbar-thumb {
            background: #bbb; 
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Перемикач мов -->
    <div class="lang-switch">
        <button id="btnUA" class="active">УКР</button>
        <button id="btnRU">РУС</button>
    </div>

    <!-- Ігровий контейнер -->
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="controls-window">
            <input type="text" id="wordInput" placeholder="Введіть слово..." autocomplete="off">
            <button id="generateBtn">Створити шлях</button>
        </div>
    </div>

    <!-- Theme Manager -->
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal"></div>

    <script>
        /* =========================================
           СИСТЕМА ДИНАМІЧНИХ ФОНІВ (Theme Manager)
           ========================================= */
        const baseBgUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        const defaultBgUrl = baseBgUrl + 'background_1.webp';
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');

        // Ініціалізація фону при завантаженні
        function initTheme() {
            const savedBg = localStorage.getItem('mySavedGameBg');
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
            } else {
                document.body.style.backgroundImage = `url('${defaultBgUrl}')`;
            }
        }

        // Застосування та збереження вибраного фону
        function applyBackground(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
        }

        // Асинхронне завантаження та генерація мініатюр
        function loadThemes() {
            let index = 1;
            const maxAttempts = 1000; // Ліміт за інструкцією

            function checkNextImage() {
                if (index > maxAttempts) return;

                const url = `${baseBgUrl}background_${index}.webp`;
                const img = new Image();
                
                img.onload = function() {
                    // Створення плитки (мініатюри)
                    const thumb = document.createElement('div');
                    thumb.className = 'theme-thumb';
                    thumb.style.backgroundImage = `url('${url}')`;
                    thumb.onclick = () => applyBackground(url);

                    const label = document.createElement('span');
                    label.textContent = `Фон ${index}`;
                    
                    thumb.appendChild(label);
                    themeModal.appendChild(thumb);
                    
                    index++;
                    checkNextImage(); // Рекурсивний виклик для наступної картинки
                };

                img.onerror = function() {
                    // Якщо картинки немає, зупиняємо цикл (перевірка на 404)
                    return;
                };

                img.src = url;
            }

            checkNextImage();
        }

        // Відкриття/закриття модального вікна
        themeBtn.addEventListener('click', () => {
            if (themeModal.style.display === 'grid') {
                themeModal.style.display = 'none';
            } else {
                themeModal.style.display = 'grid';
            }
        });

        // Клік поза вікном закриває його
        document.addEventListener('click', (e) => {
            if (!themeModal.contains(e.target) && e.target !== themeBtn) {
                themeModal.style.display = 'none';
            }
        });

        // Запуск Theme Manager
        initTheme();
        loadThemes();


        /* =========================================
           ЛОГІКА ГРИ "ПРОЧИТАЙ СЛОВО" + СИНХРОНІЗАЦІЯ
           ========================================= */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const generateBtn = document.getElementById('generateBtn');
        const wordInput = document.getElementById('wordInput');
        const btnUA = document.getElementById('btnUA');
        const btnRU = document.getElementById('btnRU');
        
        const alphabetUA = "АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ";
        const alphabetRU = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
        
        let currentAlphabet = alphabetUA; // За замовчуванням УКР
        let currentLang = 'UA';
        const TOTAL_SLOTS = 28; // Кількість літер по колу

        // Поточний стан гри
        let currentSlots = [];
        let currentPath = [];

        // --- FIREBASE СИНХРОНІЗАЦІЯ ---
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const senderId = 'dev_' + Math.random().toString(36).substr(2, 9);
        let lastActionTime = 0;
        let isRemoteAction = false;

        // Слухач лобі
        db.ref('current_activity').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val === 'lobby' || (val && val.activity === 'lobby')) {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html';
            }
        });

        // Слухач ігрових дій
        db.ref('game_action').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.senderId === senderId) return;
            if (data.timestamp <= lastActionTime) return;

            isRemoteAction = true;
            lastActionTime = data.timestamp;

            console.log('Отримано дію:', data.type, 'від', data.senderId);

            if (data.type === 'init' || data.type === 'generate') {
                // Відновлюємо стан
                const { slots, pathIndices, word, lang } = data;
                currentSlots = slots;
                currentPath = pathIndices;
                if (lang) {
                    currentLang = lang;
                    currentAlphabet = lang === 'UA' ? alphabetUA : alphabetRU;
                    btnUA.classList.toggle('active', lang === 'UA');
                    btnRU.classList.toggle('active', lang === 'RU');
                }
                // Оновлюємо поле вводу (без тригеру подій)
                wordInput.value = word || '';
                drawGame(slots, pathIndices);
                console.log('Стан відновлено з Firebase');
            }

            isRemoteAction = false;
        });

        // При завантаженні сторінки відновлюємо стан, якщо є
        function loadInitialState() {
            db.ref('game_action').once('value').then((snapshot) => {
                const data = snapshot.val();
                if (data && (data.type === 'init' || data.type === 'generate') && data.senderId !== senderId) {
                    console.log('Відновлення початкового стану з Firebase');
                    isRemoteAction = true;
                    const { slots, pathIndices, word, lang } = data;
                    currentSlots = slots;
                    currentPath = pathIndices;
                    if (lang) {
                        currentLang = lang;
                        currentAlphabet = lang === 'UA' ? alphabetUA : alphabetRU;
                        btnUA.classList.toggle('active', lang === 'UA');
                        btnRU.classList.toggle('active', lang === 'RU');
                    }
                    wordInput.value = word || '';
                    drawGame(slots, pathIndices);
                    isRemoteAction = false;
                } else {
                    // Якщо немає збереженого стану – генеруємо випадкове поле
                    generateGame();
                }
            }).catch(err => {
                console.warn('Помилка завантаження початкового стану:', err);
                generateGame();
            });
        }

        // Відправка дії
        function sendAction(actionData) {
            if (isRemoteAction) return;
            actionData.senderId = senderId;
            actionData.timestamp = Date.now();
            db.ref('game_action').set(actionData);
            console.log('Відправлено дію:', actionData.type);
        }

        // --- ОСНОВНІ ФУНКЦІЇ ГРИ ---

        function generateGame() {
            if (isRemoteAction) return;

            let word = wordInput.value.trim().toUpperCase();
            let slots = new Array(TOTAL_SLOTS);
            for (let i = 0; i < TOTAL_SLOTS; i++) {
                slots[i] = currentAlphabet[Math.floor(Math.random() * currentAlphabet.length)];
            }

            let pathIndices = [];
            
            if (word) {
                let availablePositions = Array.from({length: TOTAL_SLOTS}, (_, i) => i);

                for (let i = 0; i < word.length; i++) {
                    if (availablePositions.length === 0) break;
                    let randomIdx = Math.floor(Math.random() * availablePositions.length);
                    let pos = availablePositions[randomIdx];
                    slots[pos] = word[i];
                    pathIndices.push(pos);
                    availablePositions.splice(randomIdx, 1);
                }
            }

            // Зберігаємо поточний стан
            currentSlots = slots;
            currentPath = pathIndices;

            drawGame(slots, pathIndices);

            // Відправляємо дію
            sendAction({
                type: 'generate',
                slots: slots,
                pathIndices: pathIndices,
                word: word,
                lang: currentLang
            });
        }

        function drawGame(slots, pathIndices) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 240;

            // Малюємо зовнішнє коло
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Обчислюємо координати для кожної літери
            const coords = slots.map((_, i) => {
                const angle = (i / TOTAL_SLOTS) * 2 * Math.PI - Math.PI / 2;
                return {
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle)
                };
            });

            // Малюємо "нитки" (лінії) між буквами слова
            if (pathIndices.length > 1) {
                ctx.beginPath();
                ctx.moveTo(coords[pathIndices[0]].x, coords[pathIndices[0]].y);
                
                for (let i = 1; i < pathIndices.length; i++) {
                    const start = coords[pathIndices[i - 1]];
                    const end = coords[pathIndices[i]];
                    
                    // Вигин кривої до центру для ефекту "ниток у клубку"
                    const cpX = cx + (Math.random() * 120 - 60);
                    const cpY = cy + (Math.random() * 120 - 60);
                    
                    ctx.quadraticCurveTo(cpX, cpY, end.x, end.y);
                }
                ctx.strokeStyle = '#8c9c8a'; // Колір нитки
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // Налаштування шрифту (крупніший)
            ctx.font = 'bold 32px "Propysy Bold", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Відмальовуємо літери та стилізовані кружечки
            slots.forEach((letter, i) => {
                const c = coords[i];

                // Малюємо тінь для кружечка
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 5;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                // Основа кружечка
                ctx.beginPath();
                ctx.arc(c.x, c.y, 28, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Скидаємо тінь для обідка та тексту
                ctx.shadowColor = 'transparent';

                // Контрастний обідок
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#5c6c5a';
                ctx.stroke();

                // Якщо це ПЕРША літера слова — виділяємо її кольором
                if (pathIndices.length > 0 && pathIndices[0] === i) {
                    ctx.fillStyle = '#8c9c8a';
                    ctx.fill();
                    ctx.fillStyle = '#ffffff'; // Текст першої літери білий
                } else {
                    ctx.fillStyle = '#222222'; // Текст інших літер темний
                }

                ctx.fillText(letter, c.x, c.y);
            });
        }

        // --- ОБРОБНИКИ ПОДІЙ ---

        // Обробка перемикання мови
        function setLanguage(lang) {
            if (isRemoteAction) return;
            if (lang === currentLang) return; // Вже активна
            currentLang = lang;
            currentAlphabet = lang === 'UA' ? alphabetUA : alphabetRU;
            btnUA.classList.toggle('active', lang === 'UA');
            btnRU.classList.toggle('active', lang === 'RU');
            // Перегенерувати поле з новою мовою
            generateGame(); // Це викличе sendAction
        }

        btnUA.addEventListener('click', () => setLanguage('UA'));
        btnRU.addEventListener('click', () => setLanguage('RU'));

        // Обробник кнопки генерації
        generateBtn.addEventListener('click', generateGame);

        // Також генеруємо при натисканні Enter у полі вводу
        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateGame();
            }
        });

        // --- ЗАПУСК ---
        window.onload = function() {
            // Спроба відновити стан із Firebase, якщо немає – згенерує випадкове
            loadInitialState();
            console.log('Гра "Прочитай слово по нитці" завантажена. Синхронізація активна.');
        };
    </script>
</body>
</html>
