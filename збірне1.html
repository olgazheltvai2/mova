.discard-drop      { animation: discardDrop 0.5s forwards ease-in; pointer-events: none !important; }
.discard-fade      { animation: discardFade 0.5s forwards ease; pointer-events: none !important; }
.discard-shrink    { animation: discardShrink 0.5s forwards ease-in; pointer-events: none !important; }
/* --- СТИЛІ ДЛЯ ВІКТОРИНИ --- */
#quiz-container { margin: auto 0; width: 100%; display: flex; flex-direction: column; gap: 0.5em; text-align: center; transition: font-size 0.2s ease; }
#card-question { width: 100%; line-height: 1.25; white-space: pre-wrap; word-break: break-word; hyphens: auto; -webkit-hyphens: auto; }
#card-options { display: flex; flex-direction: column; gap: 0.3em; width: 100%; }
.quiz-option { background: #ffffff; border: 2px solid #007bff; color: #333333; padding: 0.3em 0.5em; border-radius: 0.3em; font-size: 0.75em; font-weight: normal;
cursor: pointer; transition: all 0.2s ease; text-align: center; width: 100%; box-sizing: border-box; word-break: break-word; hyphens: auto; -webkit-hyphens: auto; font-family: inherit;
}
.quiz-option:hover { background: #f0f7ff; transform: scale(1.02); }
.quiz-option.correct { background: #28a745 !important; border-color: #28a745 !important; color: white !important; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4); }
.quiz-option.incorrect { background: #dc3545 !important; border-color: #dc3545 !important; color: white !important; box-shadow: 0 4px 10px rgba(220, 53, 69, 0.4); }

.view-mode .element-group { pointer-events: none !important; }
.view-mode .element-group > * { pointer-events: auto !important; }
.edit-mode .element-group { pointer-events: auto !important; }
.edit-mode .element-group > * { pointer-events: none !important; }
.element-group { overflow: visible !important; }
.edit-mode .element-group.selected { outline: 2px dashed #ffc107 !important; background: rgba(255, 193, 7, 0.05); }
.edit-mode .multi-selected { outline: 3px solid #fd7e14 !important; z-index: 9999 !important; }
/* Кастомне випадаюче меню анімацій (з категоріями) */
.custom-anim-dropdown { position: relative; flex: 1; }
.custom-anim-btn { width: 100%; text-align: left; background: #fff; border: 1px solid #ccc; border-radius: 3px; padding: 4px; font-size: 11px; cursor: pointer; color:#333; }
.custom-anim-menu { position: absolute; top: 100%; left: 0; width: max-content; min-width: 100%; background: #fff; border: 1px solid #ccc; border-radius:3px; z-index: 999999; max-height: 250px; overflow-y: auto; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

.custom-anim-menu .anim-opt { padding: 5px 15px; font-size: 11px; cursor: pointer; display: block; border-top: 1px solid #f1f1f1;}
.custom-anim-menu .anim-opt:hover { background: #007bff; color: white; }

function updateSlideCounter() {

const slides = pArea.querySelectorAll('.slide');

function triggerAutoAnimations(slide) {

}
});

// --- ЗУМ ТА ПАНОРАМУВАННЯ ---
let zoomLevel = 1; let panX = 0; let panY = 0; let isPanning = false; let startPanX = 0; let startPanY = 0;
function applyZoomPan() {
    if(pArea) pArea.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
}
function resetZoomPan() {
    zoomLevel = 1; panX = 0; panY = 0; applyZoomPan();
}

function goToSlide(direction) {
resetZoomPan(); // Скидання зуму при перемиканні слайдів
const slides = pArea.querySelectorAll('.slide');
let currentIndex = Array.from(slides).indexOf(getActiveSlide());
let newIndex = currentIndex + direction;
if (newIndex >= 0 && newIndex < slides.length) {
slides[currentIndex].querySelectorAll('.element').forEach(el => el.dataset.isAnimating = 'false');
slides[currentIndex].classList.remove('active');
const transSelect = document.getElementById('slide-transition');
const transClass = transSelect ? transSelect.value : 'trans-fade';
slides[newIndex].className = `slide active ${transClass}`;
if (typeof window.deselectElement === 'function') window.deselectElement();
updateSlideCounter();
if (typeof isEditMode === 'undefined' || !isEditMode) { triggerAutoAnimations(slides[newIndex]); }

if (typeof drawCtx !== 'undefined' && typeof drawCanvas !== 'undefined' && drawCanvas) {
drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
}
}

});

currentCustomAudio.pause();

function initAudio() {
if (!audioCtx) {
audioCtx = new AudioContext();
masterGain = audioCtx.createGain();
masterGain.connect(audioCtx.destination);
masterGain.gain.value = globalVolume;
}
if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type, customData = null) {
if (type === 'custom' && customData) {
if (currentCustomAudio) { currentCustomAudio.pause(); }
currentCustomAudio = new Audio(customData);
currentCustomAudio.volume = globalVolume;
currentCustomAudio.play().then(() => {
sidePlayPauseBtn.innerText = ' ⏸ ️';
}).catch(err => console.log('Аудіо заблоковано браузером', err));
currentCustomAudio.onended = () => { sidePlayPauseBtn.innerText = ' ▶ ️'; };

}

const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();

osc.frequency.setValueAtTime(freq, time); gain.gain.setValueAtTime(vol, time);
gain.gain.exponentialRampToValueAtTime(0.01, time + duration);

function getMousePos(e) {
    let rect = drawCanvas.getBoundingClientRect();
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }
    return {
        x: clientX - rect.left,
        y: clientY - rect.top
    };
}

function startDrawing(e) {
    if (!isDrawingMode || !drawCtx) return;
    isDrawing = true;
    let pos = getMousePos(e);
    drawCtx.beginPath();
    drawCtx.moveTo(pos.x, pos.y);
    e.preventDefault();
}

function drawEvent(e) {
    if (!isDrawing || !isDrawingMode || !drawCtx) return;
    e.preventDefault();
    let pos = getMousePos(e);
    
    drawCtx.lineCap = 'round';
    drawCtx.lineJoin = 'round';
    
    if (drawMode === 'eraser') {
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.lineWidth = (sizePicker ? parseInt(sizePicker.value) : 4) * 4;
    } else {
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.lineWidth = sizePicker ? parseInt(sizePicker.value) : 4;
        drawCtx.strokeStyle = colorPicker ? colorPicker.value : '#ff0000';
    }
    
    drawCtx.lineTo(pos.x, pos.y);
    drawCtx.stroke();
}

function stopDrawing() {
    if (isDrawing && drawCtx) {
        isDrawing = false;
        drawCtx.closePath();
    }
}

if (drawCanvas) {
    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', drawEvent);
    drawCanvas.addEventListener('mouseup', stopDrawing);
    drawCanvas.addEventListener('mouseout', stopDrawing);
    
    drawCanvas.addEventListener('touchstart', startDrawing, {passive: false});

window.rollMathDice = function(diceEl) {
const cube = diceEl.querySelector('.cube');
if(!cube) return;
let currentX = parseFloat(cube.dataset.rotX || 0);
let currentY = parseFloat(cube.dataset.rotY || 0);
const randomFace = Math.floor(Math.random() * 6) + 1;
const spinX = Math.floor(Math.random() * 4 + 2) * 360;
const spinY = Math.floor(Math.random() * 4 + 2) * 360;
let rotateX = 0, rotateY = 0;
switch(randomFace) {
case 1: rotateX = 0; rotateY = 0; break;
case 2: rotateX = 90; rotateY = 0; break;
case 3: rotateX = 0; rotateY = -90; break;
case 4: rotateX = 0; rotateY = 90; break;
case 5: rotateX = -90; rotateY = 0; break;
case 6: rotateX = 0; rotateY = 180; break;
}
currentX = currentX + spinX + rotateX - (currentX % 360);
currentY = currentY + spinY + rotateY - (currentY % 360);
cube.dataset.rotX = currentX;
cube.dataset.rotY = currentY;
cube.style.transform = `translateZ(calc(var(--half-size) * -1)) rotateX(${currentX}deg) rotateY(${currentY}deg)`;
};

window.shuffleArray = function(array) {
let currentIndex = array.length, randomIndex;
while (currentIndex > 0) {
randomIndex = Math.floor(Math.random() * currentIndex);
currentIndex--;
[array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
}
return array;
};

window.calcPress = function(btnEl, val, type) {
const calc = btnEl.closest('.math-calc-container');
const display = calc.querySelector('.math-calc-display');

let prev = calc.dataset.prev || '';
let op = calc.dataset.op || '';

const calculate = (a, b, operation) => {
let numA = parseFloat(a); let numB = parseFloat(b);
if(isNaN(numA) || isNaN(numB)) return '';
if(operation === '+') return numA + numB;
if(operation === '-') return numA - numB;
if(operation === '*') return numA * numB;
if(operation === '/') return numB !== 0 ? numA / numB : 'Error';
return '';
};
if(type === 'num') {
if(current === '0' || calc.dataset.reset === '1') newCurrent = val;
else newCurrent += val;
calc.dataset.reset = '0';
} else if(type === 'clear') {
newCurrent = '0'; prev = ''; op = '';
} else if(type === 'op') {
if(op && prev && calc.dataset.reset !== '1') {
let res = calculate(prev, current, op);
display.innerText = res; prev = res;
} else {
prev = current;
}
op = val; calc.dataset.reset = '1'; newCurrent = display.innerText;
} else if(type === 'eq') {
if(op && prev) {
let res = calculate(prev, current, op);
newCurrent = res; prev = ''; op = ''; calc.dataset.reset = '1';
}
}
if(newCurrent.toString().length > 12) newCurrent = newCurrent.toString().substring(0,12);
display.innerText = newCurrent;
calc.dataset.current = newCurrent; calc.dataset.prev = prev; calc.dataset.op = op;
};

async function exportPresentation(isTrial = false) {

        const pArea = document.getElementById('presentation-area');

                if (img.src.startsWith('data:image/') && !img.src.startsWith('data:image/webp') && !img.src.startsWith('data:image/gif')) {
                    try {
                        const canvas = document.createElement('canvas'); canvas.width = img.naturalWidth || img.width; canvas.height = img.naturalHeight || img.height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0); img.src = canvas.toDataURL('image/webp', 0.7);
                    } catch (e) {}

                for (let el of audioElements) {

                                const resampledBuffer = await offlineCtx.startRendering(); const finalSamples = resampledBuffer.getChannelData(0); const int16Samples = new Int16Array(finalSamples.length);
                                for (let j = 0; j < finalSamples.length; j++) { let s = Math.max(-1, Math.min(1, finalSamples[j])); int16Samples[j] = s < 0 ? s * 0x8000 : s * 0x7FFF; }
                                const lame = new lamejs.Mp3Encoder(1, 44100, 64); const mp3Data = []; const blockSize = 1152;
