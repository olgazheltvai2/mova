<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Бурундук у Місті</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Nunito', sans-serif;
      background: #2b4c65;
      touch-action: none;
    }

    /* Fullscreen stage container */
    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main interactive SVG scene */
    #city-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top HUD - Stylized wooden/brass signboard + buttons */
    #hud-bar {
      position: absolute;
      top: 1.4vh;
      left: 1.5vw;
      right: 1.5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.2vw;
      z-index: 30;
      pointer-events: none;
    }

    /* Ornate Wooden & Brass Signboard for Task Text (No White Rectangles!) */
    #task-board {
      position: relative;
      flex: 1;
      min-height: 88px;
      padding: 14px 32px;
      border-radius: 28px;
      background: 
        radial-gradient(circle at 18% 30%, rgba(255, 214, 138, 0.18) 0%, transparent 50%),
        repeating-linear-gradient(
          90deg,
          #6b3e26 0px,
          #6b3e26 28px,
          #5e341e 28px,
          #5e341e 56px
        );
      border: 6px solid #d99b38;
      box-shadow:
        0 10px 0 #3d2010,
        0 16px 28px rgba(0, 0, 0, 0.45),
        inset 0 3px 0 rgba(255, 236, 179, 0.45),
        inset 0 -5px 0 rgba(42, 20, 8, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      transform-origin: center top;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    /* Decorative brass corner rivets & wood grain overlay */
    #task-board::before {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 20px;
      border: 2px dashed rgba(255, 217, 132, 0.38);
      pointer-events: none;
    }

    #task-text {
      position: relative;
      z-index: 2;
      color: #fff6d6;
      font-size: clamp(24px, 2.85vw, 44px);
      font-weight: 900;
      line-height: 1.18;
      text-align: center;
      letter-spacing: 0.01em;
      text-shadow:
        0 3px 0 #2d1507,
        0 5px 10px rgba(0, 0, 0, 0.6);
      margin: 0;
    }

    /* Highlighted spatial prepositions inside the instruction */
    .prep-highlight {
      display: inline-block;
      color: #ffe055;
      background: linear-gradient(180deg, #9c2b23 0%, #6e1711 100%);
      padding: 1px 14px;
      margin: 0 4px;
      border-radius: 14px;
      border: 3px solid #f7b940;
      box-shadow: 0 4px 0 #3d1208;
      transform: translateY(-1px);
    }

    /* Control Buttons Wrapper */
    .hud-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
      flex-shrink: 0;
    }

    /* Stylized Brass/Wood Language Button (УКР / РУС) */
    .ctrl-btn {
      position: relative;
      cursor: pointer;
      border: none;
      outline: none;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      transform: translateY(-3px) scale(1.05);
      filter: brightness(1.08);
    }

    .ctrl-btn:active {
      transform: translateY(3px) scale(0.96);
    }

    #lang-btn {
      width: clamp(84px, 7.5vw, 118px);
      height: clamp(64px, 6.2vw, 84px);
      border-radius: 24px;
      background: linear-gradient(180deg, #f59e0b 0%, #c2410c 100%);
      border: 5px solid #fde68a;
      box-shadow:
        0 8px 0 #7c2d12,
        0 12px 20px rgba(0, 0, 0, 0.4),
        inset 0 3px 0 rgba(255, 255, 255, 0.45);
      color: #fffbeb;
      font-size: clamp(22px, 2.2vw, 34px);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-shadow: 0 3px 0 #7c2d12;
    }

    /* Minimalist Circular Next/Skip Button */
    #next-btn {
      width: clamp(68px, 6.4vw, 88px);
      height: clamp(68px, 6.4vw, 88px);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #4ade80 0%, #15803d 85%);
      border: 5px solid #fef08a;
      box-shadow:
        0 8px 0 #14532d,
        0 12px 20px rgba(0, 0, 0, 0.4),
        inset 0 4px 0 rgba(255, 255, 255, 0.45);
      padding: 0;
    }

    /* Ambient SVG Animations */
    @keyframes floatCloudSlow {
      0% { transform: translateX(-60px); }
      50% { transform: translateX(60px); }
      100% { transform: translateX(-60px); }
    }

    @keyframes swayFoliage {
      0%, 100% { transform: rotate(-1.6deg); }
      50% { transform: rotate(1.6deg); }
    }

    @keyframes fountainPulse {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50% { transform: scaleY(1.08) translateY(-4px); }
    }

    @keyframes steamRise {
      0% { opacity: 0; transform: translateY(6px) scale(0.85); }
      50% { opacity: 0.75; transform: translateY(-10px) scale(1.05); }
      100% { opacity: 0; transform: translateY(-26px) scale(1.25); }
    }

    @keyframes tireSwing {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }

    @keyframes trafficBlinkRed {
      0%, 45% { opacity: 1; filter: drop-shadow(0 0 10px #ff3b30); }
      50%, 100% { opacity: 0.25; filter: none; }
    }

    @keyframes trafficBlinkGreen {
      0%, 45% { opacity: 0.25; filter: none; }
      50%, 100% { opacity: 1; filter: drop-shadow(0 0 10px #34c759); }
    }

    .cloud-anim-1 { animation: floatCloudSlow 28s ease-in-out infinite; }
    .cloud-anim-2 { animation: floatCloudSlow 36s ease-in-out infinite reverse; }
    .sway-tree { transform-origin: bottom center; animation: swayFoliage 5.5s ease-in-out infinite; }
    .fountain-jet { transform-origin: bottom center; animation: fountainPulse 1.1s ease-in-out infinite; }
    .steam-1 { animation: steamRise 2.6s ease-in-out infinite; }
    .steam-2 { animation: steamRise 2.6s ease-in-out 1.3s infinite; }
    .tire-swing-group { transform-origin: 1090px 265px; animation: tireSwing 4.2s ease-in-out infinite; }
    .light-red { animation: trafficBlinkRed 4s infinite; }
    .light-green { animation: trafficBlinkGreen 4s infinite; }

    /* Chipmunk cursor style */
    #chipmunk-actor {
      cursor: grab;
      filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.35));
    }
    #chipmunk-actor.dragging {
      cursor: grabbing;
      filter: drop-shadow(0 22px 18px rgba(0, 0, 0, 0.45));
    }

    /* Fullscreen Particle Canvas Overlay */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 25;
    }

    /* Scene transition curtain (stylized golden leaf wipe) */
    #scene-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.45) 0%, rgba(217, 119, 6, 0) 70%);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.35s ease;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <!-- Top HUD: Task Signboard + Language Toggle + Next Button -->
    <div id="hud-bar">
      <div id="task-board">
        <!-- Decorative SVG acorns on corners of the wooden board -->
        <svg width="42" height="42" viewBox="0 0 42 42" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:0.85; pointer-events:none;">
          <path d="M12,18 C12,28 21,35 21,35 C21,35 30,28 30,18 Z" fill="#d97706" stroke="#451a03" stroke-width="2.5"/>
          <path d="M9,18 C9,11 33,11 33,18 Z" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
          <path d="M21,11 L24,5" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <p id="task-text"></p>
        <svg width="42" height="42" viewBox="0 0 42 42" style="position:absolute; right:10px; top:50%; transform:translateY(-50%) scaleX(-1); opacity:0.85; pointer-events:none;">
          <path d="M12,18 C12,28 21,35 21,35 C21,35 30,28 30,18 Z" fill="#d97706" stroke="#451a03" stroke-width="2.5"/>
          <path d="M9,18 C9,11 33,11 33,18 Z" fill="#78350f" stroke="#451a03" stroke-width="2.5"/>
          <path d="M21,11 L24,5" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="hud-controls">
        <!-- Single Language Switcher Button (УКР / РУС) -->
        <button id="lang-btn" class="ctrl-btn" type="button" aria-label="Switch Language">УКР</button>

        <!-- Minimalist Skip / Next Task Button -->
        <button id="next-btn" class="ctrl-btn" type="button" aria-label="Next Task">
          <svg width="46" height="46" viewBox="0 0 48 48">
            <path d="M11 12 L25 24 L11 36 Z" fill="#fef08a" stroke="#14532d" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M24 12 L38 24 L24 36 Z" fill="#fef08a" stroke="#14532d" stroke-width="3.5" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Interactive City SVG (1920x1080 Widescreen Coordinate Space) -->
    <svg id="city-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Sky & Ground Gradients -->
        <linearGradient id="skyWarm" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="55%" stop-color="#bae6fd"/>
          <stop offset="100%" stop-color="#fef3c7"/>
        </linearGradient>

        <linearGradient id="skyPark" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0ea5e9"/>
          <stop offset="60%" stop-color="#7dd3fc"/>
          <stop offset="100%" stop-color="#d9f99d"/>
        </linearGradient>

        <linearGradient id="skySquare" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="60%" stop-color="#bfdbfe"/>
          <stop offset="100%" stop-color="#fde68a"/>
        </linearGradient>

        <linearGradient id="skyPlay" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="65%" stop-color="#a5f3fc"/>
          <stop offset="100%" stop-color="#fef08a"/>
        </linearGradient>

        <!-- Cobblestone & Brick Patterns -->
        <pattern id="cobblePattern" width="80" height="40" patternUnits="userSpaceOnUse">
          <rect width="80" height="40" fill="#64748b"/>
          <rect x="2" y="2" width="36" height="16" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
          <rect x="42" y="2" width="36" height="16" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
          <rect x="-18" y="22" width="36" height="16" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
          <rect x="22" y="22" width="36" height="16" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
          <rect x="62" y="22" width="36" height="16" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
        </pattern>

        <pattern id="brickPattern" width="60" height="32" patternUnits="userSpaceOnUse">
          <rect width="60" height="32" fill="#9a3412"/>
          <rect x="2" y="2" width="26" height="12" rx="2" fill="#c2410c"/>
          <rect x="32" y="2" width="26" height="12" rx="2" fill="#b45309"/>
          <rect x="-12" y="18" width="26" height="12" rx="2" fill="#b45309"/>
          <rect x="18" y="18" width="26" height="12" rx="2" fill="#c2410c"/>
          <rect x="48" y="18" width="26" height="12" rx="2" fill="#b45309"/>
        </pattern>

        <pattern id="roofTilePattern" width="48" height="28" patternUnits="userSpaceOnUse">
          <rect width="48" height="28" fill="#b91c1c"/>
          <path d="M0,14 Q12,28 24,14 Q36,28 48,14" fill="none" stroke="#7f1d1d" stroke-width="4"/>
          <path d="M-12,0 Q0,14 12,0 Q24,14 36,0 Q48,14 60,0" fill="none" stroke="#ef4444" stroke-width="3"/>
        </pattern>

        <!-- Chipmunk Fur Gradients -->
        <radialGradient id="furBodyGrad" cx="45%" cy="38%" r="60%">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="65%" stop-color="#d97706"/>
          <stop offset="100%" stop-color="#92400e"/>
        </radialGradient>

        <radialGradient id="bellyGrad" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#fffbeb"/>
          <stop offset="75%" stop-color="#fde68a"/>
          <stop offset="100%" stop-color="#f59e0b"/>
        </radialGradient>

        <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f59e0b"/>
          <stop offset="50%" stop-color="#b45309"/>
          <stop offset="100%" stop-color="#451a03"/>
        </linearGradient>
      </defs>

      <!-- ================================================================= -->
      <!-- SCENE 1: STREET BAKERY & CAFE (Вулична пекарня та кав'ярня)       -->
      <!-- ================================================================= -->
      <g id="scene-1" class="city-scene">
        <!-- Sky -->
        <rect x="0" y="0" width="1920" height="1080" fill="url(#skyWarm)"/>

        <!-- Distant City Silhouette -->
        <path d="M0,700 L0,420 L140,420 L180,350 L290,350 L290,460 L450,460 L510,330 L670,330 L670,480 L1250,480 L1310,340 L1490,340 L1550,430 L1720,430 L1790,310 L1920,310 L1920,700 Z" fill="#fed7aa" opacity="0.7"/>

        <!-- Floating Clouds -->
        <g class="cloud-anim-1" opacity="0.88">
          <path d="M220,210 Q250,160 310,180 Q360,140 420,180 Q470,180 460,230 Z" fill="#fef9c3"/>
          <path d="M1380,190 Q1420,140 1480,165 Q1540,130 1590,175 Q1640,180 1630,225 Z" fill="#fef9c3"/>
        </g>

        <!-- Sidewalk & Cobblestone Street -->
        <rect x="0" y="740" width="1920" height="120" fill="#d6d3d1" stroke="#78716c" stroke-width="6"/>
        <!-- Decorative Sidewalk Curbs -->
        <g fill="#a8a29e">
          <rect x="40" y="755" width="160" height="90" rx="8"/>
          <rect x="240" y="755" width="160" height="90" rx="8"/>
          <rect x="440" y="755" width="160" height="90" rx="8"/>
          <rect x="640" y="755" width="160" height="90" rx="8"/>
          <rect x="840" y="755" width="160" height="90" rx="8"/>
          <rect x="1040" y="755" width="160" height="90" rx="8"/>
          <rect x="1240" y="755" width="160" height="90" rx="8"/>
          <rect x="1440" y="755" width="160" height="90" rx="8"/>
          <rect x="1640" y="755" width="160" height="90" rx="8"/>
        </g>
        <rect x="0" y="850" width="1920" height="230" fill="url(#cobblePattern)"/>

        <!-- Bakery Building (Left & Center-Left) -->
        <rect x="110" y="250" width="840" height="500" rx="12" fill="#f59e0b" stroke="#78350f" stroke-width="8"/>
        <rect x="135" y="275" width="790" height="455" rx="8" fill="#fde68a"/>
        <!-- Decorative Brick Pillars -->
        <rect x="110" y="250" width="55" height="500" fill="url(#brickPattern)" stroke="#78350f" stroke-width="5"/>
        <rect x="895" y="250" width="55" height="500" fill="url(#brickPattern)" stroke="#78350f" stroke-width="5"/>

        <!-- Bakery Door -->
        <rect x="210" y="455" width="170" height="290" rx="16" fill="#78350f" stroke="#451a03" stroke-width="7"/>
        <rect x="232" y="480" width="126" height="145" rx="10" fill="#bae6fd" stroke="#451a03" stroke-width="5"/>
        <!-- Golden Pretzel Emblem on Door (No Words) -->
        <path d="M270,550 C255,525 285,505 295,530 C305,505 335,525 320,550 C310,565 280,565 270,550 Z" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
        <circle cx="342" cy="645" r="9" fill="#fbbf24" stroke="#451a03" stroke-width="3"/>

        <!-- Bakery Large Window + Windowsill + Two Flowerpots (Task 4: МІЖ двома горщиками) -->
        <rect x="450" y="445" width="380" height="210" rx="14" fill="#38bdf8" stroke="#78350f" stroke-width="8"/>
        <!-- Bakery Window Pastries Display -->
        <ellipse cx="560" cy="610" rx="45" ry="20" fill="#d97706" stroke="#78350f" stroke-width="4"/>
        <ellipse cx="710" cy="610" rx="48" ry="22" fill="#f59e0b" stroke="#78350f" stroke-width="4"/>
        <!-- Windowsill -->
        <rect x="425" y="648" width="430" height="28" rx="8" fill="#b45309" stroke="#451a03" stroke-width="6"/>

        <!-- Left Flowerpot on Windowsill -->
        <g id="pot-left">
          <polygon points="465,650 535,650 522,590 478,590" fill="#ea580c" stroke="#451a03" stroke-width="5"/>
          <rect x="470" y="580" width="60" height="16" rx="5" fill="#c2410c" stroke="#451a03" stroke-width="4"/>
          <circle cx="485" cy="558" r="18" fill="#22c55e" stroke="#14532d" stroke-width="4"/>
          <circle cx="515" cy="560" r="18" fill="#16a34a" stroke="#14532d" stroke-width="4"/>
          <circle cx="500" cy="542" r="16" fill="#ec4899" stroke="#831843" stroke-width="4"/>
          <circle cx="500" cy="542" r="6" fill="#fef08a"/>
        </g>

        <!-- Right Flowerpot on Windowsill -->
        <g id="pot-right">
          <polygon points="745,650 815,650 802,590 758,590" fill="#ea580c" stroke="#451a03" stroke-width="5"/>
          <rect x="750" y="580" width="60" height="16" rx="5" fill="#c2410c" stroke="#451a03" stroke-width="4"/>
          <circle cx="765" cy="558" r="18" fill="#22c55e" stroke="#14532d" stroke-width="4"/>
          <circle cx="795" cy="560" r="18" fill="#16a34a" stroke="#14532d" stroke-width="4"/>
          <circle cx="780" cy="542" r="16" fill="#f43f5e" stroke="#881337" stroke-width="4"/>
          <circle cx="780" cy="542" r="6" fill="#fef08a"/>
        </g>

        <!-- Striped Awning Roof of Bakery (Task 1: НА смугастий дах пекарні) -->
        <g id="bakery-awning">
          <polygon points="85,380 975,380 925,245 135,245" fill="#ef4444" stroke="#451a03" stroke-width="7"/>
          <!-- Alternating Cream Stripes -->
          <polygon points="185,380 285,380 265,245 195,245" fill="#fef3c7" stroke="#451a03" stroke-width="4"/>
          <polygon points="385,380 485,380 475,245 395,245" fill="#fef3c7" stroke="#451a03" stroke-width="4"/>
          <polygon points="585,380 685,380 675,245 595,245" fill="#fef3c7" stroke="#451a03" stroke-width="4"/>
          <polygon points="785,380 885,380 865,245 795,245" fill="#fef3c7" stroke="#451a03" stroke-width="4"/>
          <!-- Scalloped Fringe -->
          <path d="M85,380 Q135,425 185,380 Q235,425 285,380 Q335,425 385,380 Q435,425 485,380 Q535,425 585,380 Q635,425 685,380 Q735,425 785,380 Q835,425 885,380 Q930,425 975,380" fill="#dc2626" stroke="#451a03" stroke-width="6"/>
        </g>

        <!-- Lush Green Bush Base Next to Cafe (Task 5: ЗА пишний зелений кущ) -->
        <g id="bush-back">
          <ellipse cx="1045" cy="720" rx="95" ry="62" fill="#15803d" stroke="#052e16" stroke-width="6"/>
        </g>

        <!-- Red Patio Umbrella & Round Cafe Table (Task 6: НА червону парасольку, Task 2: ПІД круглий столик) -->
        <g id="cafe-patio">
          <!-- Umbrella Pole -->
          <rect x="1312" y="340" width="16" height="440" fill="#78350f" stroke="#451a03" stroke-width="4"/>
          <!-- Red Umbrella Canopy -->
          <path d="M1100,385 Q1320,205 1540,385 Z" fill="#dc2626" stroke="#451a03" stroke-width="7"/>
          <path d="M1180,385 Q1320,225 1460,385 Z" fill="#ef4444" stroke="#451a03" stroke-width="5"/>
          <circle cx="1320" cy="285" r="14" fill="#fbbf24" stroke="#451a03" stroke-width="5"/>

          <!-- Cafe Chairs -->
          <path d="M1155,630 L1155,785 M1155,705 L1225,705 L1225,785" fill="none" stroke="#451a03" stroke-width="10" stroke-linecap="round"/>
          <path d="M1485,630 L1485,785 M1485,705 L1415,705 L1415,785" fill="none" stroke="#451a03" stroke-width="10" stroke-linecap="round"/>

          <!-- Round Cafe Table Legs (Behind/Under space for Chipmunk) -->
          <path d="M1320,660 L1255,795 M1320,660 L1385,795" stroke="#451a03" stroke-width="12" stroke-linecap="round"/>
          <!-- Table Top -->
          <ellipse cx="1320" cy="650" rx="135" ry="30" fill="#d97706" stroke="#451a03" stroke-width="7"/>
          <ellipse cx="1320" cy="643" rx="120" ry="22" fill="#f59e0b"/>

          <!-- Steaming Coffee Cup & Croissant on Table -->
          <ellipse cx="1290" cy="638" rx="24" ry="8" fill="#fde68a" stroke="#451a03" stroke-width="3"/>
          <path d="M1272,612 L1308,612 L1303,638 L1277,638 Z" fill="#e11d48" stroke="#451a03" stroke-width="4"/>
          <path class="steam-1" d="M1285,602 Q1278,588 1292,576" fill="none" stroke="#fffbeb" stroke-width="4" stroke-linecap="round"/>
          <path class="steam-2" d="M1298,604 Q1305,590 1294,578" fill="none" stroke="#fffbeb" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Blue Vintage Bicycle with Wicker Basket (Task 3: У плетений кошик синього велосипеда) -->
        <g id="blue-bicycle">
          <!-- Kickstand -->

    /*************************************************************************
     * 2. SYNTHESIZED WEB AUDIO SOUND ENGINE (NO EXTERNAL AUDIO FILES)
     *************************************************************************/
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Cute high-pitched chipmunk squeak/chirp
      playSqueak(pitchMultiplier = 1) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const base = 780 * pitchMultiplier;
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.exponentialRampToValueAtTime(base * 1.65, now + 0.07);
        osc.frequency.exponentialRampToValueAtTime(base * 1.15, now + 0.13);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      // Playful double-chirp when picking up the chipmunk
      playPickup() {
        this.playSqueak(1.0);
        setTimeout(() => this.playSqueak(1.28), 75);
      }

      // Comical cartoon boing + puzzled squeak when dropped in wrong place
      playWrong() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Wobbling spring boing
        const osc = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(145, now + 0.42);

        lfo.frequency.setValueAtTime(26, now);
        lfoGain.gain.setValueAtTime(45, now);
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        lfo.start(now);
        osc.stop(now + 0.45);
        lfo.stop(now + 0.45);
      }

      // Rich celebratory fanfare + happy chipmunk chittering
      playSuccess() {
        this.init();
        if (!this.ctx) return;
        const melodies = [
          [523.25, 659.25, 783.99, 1046.50], // C5 E5 G5 C6
          [587.33, 739.99, 880.00, 1174.66], // D5 F#5 A5 D6
          [659.25, 783.99, 987.77, 1318.51]  // E5 G5 B5 E6
        ];
        const notes = melodies[Math.floor(Math.random() * melodies.length)];
        const now = this.ctx.currentTime;

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          const start = now + idx * 0.085;
          osc.frequency.setValueAtTime(freq, start);

          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.24, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.36);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.38);
        });

        // Happy chipmunk chittering bursts
        setTimeout(() => this.playSqueak(1.35), 140);
        setTimeout(() => this.playSqueak(1.55), 250);
        setTimeout(() => this.playSqueak(1.42), 360);
        setTimeout(() => this.playSqueak(1.75), 470);
      }

      // Soft wooden click for UI buttons
      playClick() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.06);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    /*************************************************************************
     * 3. CUSTOM PARTICLE ENGINE (ACORNS, OAK LEAVES, GOLDEN STARS)
     *************************************************************************/
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      fxCanvas.width = window.innerWidth;
      fxCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnCelebrationParticles(svgX, svgY) {
      // Convert SVG coordinates (1920x1080) to screen pixels
      const svgEl = document.getElementById('city-svg');
      const pt = svgEl.createSVGPoint();
      pt.x = svgX;
      pt.y = svgY;
      const screenPt = pt.matrixTransform(svgEl.getScreenCTM());

      const types = ['acorn', 'star', 'leaf', 'sparkle'];
      const colors = ['#facc15', '#fb923c', '#4ade80', '#f43f5e', '#38bdf8', '#a855f7'];

      for (let i = 0; i < 42; i++) {
        const angle = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.3;
        const speed = 4 + Math.random() * 11;
        particles.push({
          x: screenPt.x,
          y: screenPt.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4.5,
          gravity: 0.28,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.18,
          size: 12 + Math.random() * 14,
          type: types[i % types.length],
          color: colors[i % colors.length],
          alpha: 1,
          decay: 0.012 + Math.random() * 0.01
        });
      }
    }

    function drawParticle(p) {
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.alpha);
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);

      if (p.type === 'star') {
        fxCtx.fillStyle = p.color;
        fxCtx.strokeStyle = '#451a03';
        fxCtx.lineWidth = 2;
        fxCtx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
          const a2 = a1 + Math.PI / 5;
          fxCtx.lineTo(Math.cos(a1) * p.size, Math.sin(a1) * p.size);
          fxCtx.lineTo(Math.cos(a2) * (p.size * 0.45), Math.sin(a2) * (p.size * 0.45));
        }
        fxCtx.closePath();
        fxCtx.fill();
        fxCtx.stroke();
      } else if (p.type === 'acorn') {
        // Nut body
        fxCtx.fillStyle = '#d97706';
        fxCtx.strokeStyle = '#451a03';
        fxCtx.lineWidth = 2;
        fxCtx.beginPath();
        fxCtx.arc(0, 3, p.size * 0.55, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.stroke();
        // Cap
        fxCtx.fillStyle = '#78350f';
        fxCtx.beginPath();
        fxCtx.arc(0, -1, p.size * 0.62, Math.PI, 0);
        fxCtx.closePath();
        fxCtx.fill();
        fxCtx.stroke();
      } else if (p.type === 'leaf') {
        fxCtx.fillStyle = p.color;
        fxCtx.strokeStyle = '#14532d';
        fxCtx.lineWidth = 2;
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size * 0.75, p.size * 0.38, 0, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.stroke();
      } else {
        fxCtx.fillStyle = '#fef08a';
        fxCtx.beginPath();
        fxCtx.arc(0, 0, p.size * 0.35, 0, Math.PI * 2);
        fxCtx.fill();
      }

      fxCtx.restore();
    }

    /*************************************************************************
     * 4. GAME STATE, SHUFFLED INFINITE GENERATOR & CHIPMUNK CONTROLLER
     *************************************************************************/
    const svg = document.getElementById('city-svg');
    const chipActor = document.getElementById('chipmunk-actor');
    const chipRig = document.getElementById('chipmunk-rig');
    const chipTail = document.getElementById('chip-tail');
    const chipHead = document.getElementById('chip-head');
    const chipPupils = document.getElementById('chip-pupils');
    const chipEyelids = document.getElementById('chip-eyelids');
    const chipArmLeft = document.getElementById('chip-arm-left');
    const chipArmRight = document.getElementById('chip-arm-right');
    const chipFootLeft = document.getElementById('chip-foot-left');
    const chipFootRight = document.getElementById('chip-foot-right');
    const chipEarLeft = document.getElementById('chip-ear-left');
    const chipEarRight = document.getElementById('chip-ear-right');
    const chipAcorn = document.getElementById('chip-acorn');

    const mouthHappy = document.getElementById('mouth-happy');
    const mouthDrag = document.getElementById('mouth-drag');
    const mouthWrong = document.getElementById('mouth-wrong');

    const taskTextEl = document.getElementById('task-text');
    const taskBoardEl = document.getElementById('task-board');
    const langBtn = document.getElementById('lang-btn');
    const nextBtn = document.getElementById('next-btn');
    const sceneFlash = document.getElementById('scene-flash');

    const HOME_POS = { x: 960, y: 920 };

    let currentLang = 'uk'; // 'uk' or 'ru'
    let taskQueue = [];
    let currentTask = null;
    let currentScene = 1;

    // Chipmunk physics & animation state
    let chipState = 'idle'; // 'idle' | 'dragging' | 'celebrating' | 'wrong' | 'returning'
    let chipX = HOME_POS.x;
    let chipY = HOME_POS.y;
    let chipScale = 1;
    let targetX = HOME_POS.x;
    let targetY = HOME_POS.y;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let celebrationType = 0;
    let stateTimer = 0;
    let nextTaskTimeout = null;

    // Shuffle helper (Fisher-Yates)
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getNextTaskFromDeck() {
      if (taskQueue.length === 0) {
        taskQueue = shuffleArray(TASKS);
        // Prevent immediate repeat at deck boundary
        if (currentTask && taskQueue[0].id === currentTask.id) {
          taskQueue.push(taskQueue.shift());
        }
      }
      return taskQueue.shift();
    }

    function updateTaskUI() {
      if (!currentTask) return;
      taskTextEl.innerHTML = currentLang === 'uk' ? currentTask.uk : currentTask.ru;
      langBtn.textContent = currentLang === 'uk' ? 'УКР' : 'РУС';

      // Pop animation on signboard
      taskBoardEl.style.transform = 'scale(1.04)';
      setTimeout(() => {
        taskBoardEl.style.transform = 'scale(1)';
      }, 220);
    }

    function switchScene(sceneIndex) {
      if (currentScene !== sceneIndex) {
        sceneFlash.style.opacity = '1';
        setTimeout(() => {
          sceneFlash.style.opacity = '0';
        }, 280);
      }
      currentScene = sceneIndex;

      for (let i = 1; i <= 4; i++) {
        const sc = document.getElementById(`scene-${i}`);
        const fg = document.getElementById(`fg-scene-${i}`);
        if (sc) sc.style.display = i === sceneIndex ? 'block' : 'none';
        if (fg) fg.style.display = i === sceneIndex ? 'block' : 'none';
      }
    }

    function setMouth(mode) {
      mouthHappy.style.display = mode === 'happy' ? 'block' : 'none';
      mouthDrag.style.display = mode === 'drag' ? 'block' : 'none';
      mouthWrong.style.display = mode === 'wrong' ? 'block' : 'none';
    }

    function resetChipmunkToPedestal() {
      chipState = 'returning';
      targetX = HOME_POS.x;
      targetY = HOME_POS.y;
      chipScale = 1;
      chipAcorn.style.display = 'none';
      setMouth('happy');
    }

    function loadNextTask() {
      if (nextTaskTimeout) {
        clearTimeout(nextTaskTimeout);
        nextTaskTimeout = null;
      }
      currentTask = getNextTaskFromDeck();
      switchScene(currentTask.scene);
      updateTaskUI();
      resetChipmunkToPedestal();
    }

    /*************************************************************************
     * 5. POINTER / TOUCH DRAG INTERACTION & COORDINATE MAPPING
     *************************************************************************/
    function clientToSVG(clientX, clientY) {
      const pt = svg.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      const ctm = svg.getScreenCTM();
      if (!ctm) return { x: HOME_POS.x, y: HOME_POS.y };
      return pt.matrixTransform(ctm.inverse());
    }

    chipActor.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (chipState === 'celebrating') return;

      sound.playPickup();
      chipActor.setPointerCapture(e.pointerId);
      chipActor.classList.add('dragging');

      const svgPt = clientToSVG(e.clientX, e.clientY);
      pointerStartX = svgPt.x;
      pointerStartY = svgPt.y;
      dragOffsetX = chipX - svgPt.x;
      dragOffsetY = chipY - svgPt.y;

      chipState = 'dragging';
      chipScale = 1.08;
      chipAcorn.style.display = 'none';
      setMouth('drag');
    });

    window.addEventListener('pointermove', (e) => {
      const svgPt = clientToSVG(e.clientX, e.clientY);

      // Subtle eye tracking toward cursor when idle
      if (chipState === 'idle') {
        const dx = Math.max(-3.5, Math.min(3.5, (svgPt.x - chipX) * 0.006));
        const dy = Math.max(-3.0, Math.min(3.0, (svgPt.y - chipY) * 0.006));
        chipPupils.setAttribute('transform', `translate(${dx.toFixed(1)}, ${dy.toFixed(1)})`);
        return;
      }

      if (chipState !== 'dragging') return;

      chipX = Math.max(85, Math.min(1835, svgPt.x + dragOffsetX));
      chipY = Math.max(110, Math.min(990, svgPt.y + dragOffsetY));
    });

    window.addEventListener('pointerup', (e) => {
      if (chipState !== 'dragging') return;
      chipActor.classList.remove('dragging');

      const svgPt = clientToSVG(e.clientX, e.clientY);
      const movedDist = Math.hypot(svgPt.x - pointerStartX, svgPt.y - pointerStartY);

      // If child just tapped the chipmunk on its pedestal, do a funny acorn munch!
      if (movedDist < 18 && Math.hypot(chipX - HOME_POS.x, chipY - HOME_POS.y) < 60) {
        sound.playSqueak(1.4);
        chipAcorn.style.display = 'block';
        setMouth('happy');
        chipState = 'idle';
        chipScale = 1;
        setTimeout(() => {
          if (chipState === 'idle') chipAcorn.style.display = 'none';
        }, 1100);
        return;
      }

      // Check distance to current task target
      const dist = Math.hypot(chipX - currentTask.tx, chipY - currentTask.ty);
      if (dist <= currentTask.r) {
        // CORRECT PLACEMENT!
        chipX = currentTask.tx;
        chipY = currentTask.ty;
        chipScale = currentTask.scale || 0.92;
        chipState = 'celebrating';
        stateTimer = 0;
        celebrationType = Math.floor(Math.random() * 3);
        setMouth('happy');
        chipAcorn.style.display = celebrationType === 1 ? 'block' : 'none';

        sound.playSuccess();
        spawnCelebrationParticles(chipX, chipY - 30);

        nextTaskTimeout = setTimeout(() => {
          loadNextTask();
        }, 2300);
      } else {
        // WRONG PLACEMENT -> Puzzled head shake & comical spring back!
        chipState = 'wrong';
        stateTimer = 0;
        setMouth('wrong');
        sound.playWrong();

        setTimeout(() => {
          if (chipState === 'wrong') {
            resetChipmunkToPedestal();
          }
        }, 680);
      }
    });

    /*************************************************************************
     * 6. HUD BUTTONS (LANGUAGE SWITCHER & SKIP/NEXT BUTTON)
     *************************************************************************/
    langBtn.addEventListener('click', () => {
      sound.playClick();
      currentLang = currentLang === 'uk' ? 'ru' : 'uk';
      updateTaskUI();
    });

    nextBtn.addEventListener('click', () => {
      sound.playClick();
      loadNextTask();
    });

    /*************************************************************************
     * 7. MAIN 60FPS ANIMATION LOOP (CHARACTER RIG + PARTICLES)
     *************************************************************************/
    let lastBlink = 0;

    function animate(timestamp) {
      const t = timestamp * 0.001;

      // 1. Periodic Eye Blinking
      if (t - lastBlink > 3.4) {
        chipEyelids.style.display = 'block';
        if (t - lastBlink > 3.56) {
          chipEyelids.style.display = 'none';
          lastBlink = t + Math.random() * 1.5;
        }
      }

      // 2. Smooth Returning to Home Pedestal
      if (chipState === 'returning') {
        chipX += (targetX - chipX) * 0.18;
        chipY += (targetY - chipY) * 0.18;
        if (Math.hypot(targetX - chipX, targetY - chipY) < 2.5) {
          chipX = targetX;
          chipY = targetY;
          chipState = 'idle';
        }
      }

      // 3. Procedural Character Rig Expressions per State
      let rigX = 0, rigY = 0, rigRot = 0;
      let tailRot = Math.sin(t * 4.5) * 10;
      let headRot = Math.sin(t * 2.2) * 3;
      let armLRot = Math.sin(t * 3.5) * 12;
      let armRRot = -Math.sin(t * 3.5) * 12;
      let footLRot = 0, footRRot = 0;
      let earTwitch = Math.sin(t * 9) > 0.85 ? 12 : 0;

      if (chipState === 'idle') {
        // Gentle breathing & cheerful bobbing
        rigY = Math.sin(t * 4.2) * 4;
      } else if (chipState === 'dragging') {
        // Excited kicking feet, waving paws & fast wagging tail while carried
        rigRot = Math.sin(t * 16) * 6;
        tailRot = Math.sin(t * 24) * 24;
        armLRot = -45 + Math.sin(t * 22) * 28;
        armRRot = 45 - Math.sin(t * 22) * 28;
        footLRot = Math.sin(t * 26) * 28;
        footRRot = -Math.sin(t * 26) * 28;
      } else if (chipState === 'wrong') {
        // Comical puzzled head-shake & shrug
        stateTimer += 0.016;
        rigX = Math.sin(t * 38) * 14;
        headRot = Math.sin(t * 34) * 18;
        armLRot = -55;
        armRRot = 55;
        tailRot = -20;
      } else if (chipState === 'celebrating') {
        // Varied joyous dances on the target spot!
        stateTimer += 0.016;
        if (celebrationType === 0) {
          // High happy jumps + waving arms
          rigY = -Math.abs(Math.sin(t * 11)) * 38;
          rigRot = Math.sin(t * 11) * 9;
          armLRot = -65 + Math.sin(t * 22) * 35;
          armRRot = 65 - Math.sin(t * 22) * 35;
          tailRot = Math.sin(t * 25) * 30;
        } else if (celebrationType === 1) {
          // Excited acorn munching & happy wiggle
          rigY = -Math.abs(Math.sin(t * 14)) * 18;
          headRot = Math.sin(t * 20) * 12;
          armRRot = -35 + Math.sin(t * 28) * 15;
          armLRot = -25;
          tailRot = Math.sin(t * 22) * 28;
        } else {
          // Cheerful rhythmic side-to-side victory dance
          rigX = Math.sin(t * 12) * 16;
          rigY = -Math.abs(Math.cos(t * 12)) * 26;
          rigRot = Math.sin(t * 12) * 14;
          armLRot = -70;
          armRRot = 70;
          tailRot = Math.sin(t * 28) * 32;
        }
      }

      // Apply transforms to SVG Chipmunk Rig
      chipActor.setAttribute('transform', `translate(${chipX.toFixed(1)}, ${chipY.toFixed(1)}) scale(${chipScale})`);
      chipRig.setAttribute('transform', `translate(${rigX.toFixed(1)}, ${rigY.toFixed(1)}) rotate(${rigRot.toFixed(1)})`);
      chipTail.setAttribute('transform', `translate(26, 12) rotate(${tailRot.toFixed(1)})`);
      chipHead.setAttribute('transform', `translate(0, -38) rotate(${headRot.toFixed(1)})`);
      chipArmLeft.setAttribute('transform', `translate(-34, -2) rotate(${armLRot.toFixed(1)})`);
      chipArmRight.setAttribute('transform', `translate(34, -2) rotate(${armRRot.toFixed(1)})`);
      chipFootLeft.setAttribute('transform', `translate(-26, 44) rotate(${footLRot.toFixed(1)})`);
      chipFootRight.setAttribute('transform', `translate(26, 44) rotate(${footRRot.toFixed(1)})`);
      chipEarLeft.setAttribute('transform', `translate(-32, -32) rotate(${-earTwitch})`);
      chipEarRight.setAttribute('transform', `translate(32, -32) rotate(${earTwitch})`);

      // 4. Update & Render Celebration Particles
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rot += p.vRot;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          drawParticle(p);
        }
      }

      requestAnimationFrame(animate);
    }

    // Start the game on window load
    window.onload = function () {
      loadNextTask();
      requestAnimationFrame(animate);
    };
  </script>
</body>
