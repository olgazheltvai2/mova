<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Street Dance Stage</title>
  <style>
    /* =====================================================================
       ГЛОБАЛЬНІ НАЛАШТУВАННЯ ТА ОСНОВНА СЦЕНА
       Змінюйте кольорові змінні нижче для швидкої зміни палітри освітлення
       ===================================================================== */
    :root {
      --neon-cyan: #00f0ff;
      --neon-pink: #ff2a85;
      --neon-gold: #ffd000;
      --neon-green: #00ff88;
      --neon-red: #ff3b5c;
      --neon-purple: #9d4edd;
      --metal-dark: #141724;
      --metal-mid: #23283d;
      --font-main: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090b14;
      font-family: var(--font-main);
    }

    /* Головний контейнер арени на весь екран */
    #stage-arena {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #1d1438 0%, #0d0f1d 65%, #06070d 100%);
      transition: filter 0.3s ease;
    }

    /* Ефект миттєвого струсу сцени від потужного басу або помилки */
    #stage-arena.bass-shake {
      animation: arenaBassShake 0.28s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    #stage-arena.error-flicker {
      animation: arenaPowerFlicker 0.65s ease;
    }

    @keyframes arenaBassShake {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-3px, 2px) scale(1.005); }
      50% { transform: translate(3px, -2px) scale(1.003); }
      75% { transform: translate(-2px, -1px) scale(1.001); }
    }

    @keyframes arenaPowerFlicker {
      0% { filter: brightness(1); }
      15% { filter: brightness(0.45) saturate(1.4) hue-rotate(-15deg); }
      30% { filter: brightness(0.95); }
      45% { filter: brightness(0.55) hue-rotate(-10deg); }
      65% { filter: brightness(1.05); }
      100% { filter: brightness(1); }
    }

    /* =====================================================================
       ШАР 1: ДЕТАЛІЗОВАНИЙ SVG-ФОН (МІСТО, СТІНА З ГРАФІТІ, ФЕРМА, ПІДЛОГА)
       ===================================================================== */
    #scene-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    /* Плавне погойдування променів прожекторів */
    .beam-left {
      transform-origin: 240px 58px;
      animation: sweepLeft 7s ease-in-out infinite alternate;
      transition: opacity 0.25s ease;
    }

    .beam-center {
      transform-origin: 800px 58px;
      animation: sweepCenter 5.5s ease-in-out infinite alternate;
      transition: opacity 0.25s ease;
    }

    .beam-right {
      transform-origin: 1360px 58px;
      animation: sweepRight 6.5s ease-in-out infinite alternate;
      transition: opacity 0.25s ease;
    }

    /* Прискорення променів під час святкування */
    #stage-arena.party-mode .beam-left { animation-duration: 1.1s; }
    #stage-arena.party-mode .beam-center { animation-duration: 0.9s; }
    #stage-arena.party-mode .beam-right { animation-duration: 1.2s; }

    @keyframes sweepLeft {
      0% { transform: rotate(-16deg); }
      100% { transform: rotate(22deg); }
    }

    @keyframes sweepCenter {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }

    @keyframes sweepRight {
      0% { transform: rotate(16deg); }
      100% { transform: rotate(-22deg); }
    }

    /* Інтерактивні прожектори (можна натискати для зміни кольору освітлення) */
    .spotlight-fixture {
      cursor: pointer;
      transition: filter 0.2s ease;
    }
    .spotlight-fixture:hover {
      filter: brightness(1.35) drop-shadow(0 0 8px var(--neon-cyan));
    }

    /* =====================================================================
       ШАР 2: ПОТУЖНІ СЦЕНІЧНІ КОЛОНКИ З ЕКВАЛАЙЗЕРОМ
       ===================================================================== */
    .speaker-tower {
      position: absolute;
      bottom: 8vh;
      width: clamp(110px, 14vw, 210px);
      height: clamp(220px, 46vh, 410px);
      z-index: 3;
      cursor: pointer;
      transition: transform 0.12s ease;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.8));
    }

    .speaker-tower.left { left: clamp(8px, 2.2vw, 34px); }
    .speaker-tower.right { right: clamp(8px, 2.2vw, 34px); }

    .speaker-tower:hover {
      transform: scale(1.025);
    }

    .speaker-tower:active {
      transform: scale(0.97);
    }

    .speaker-woofer {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.08s ease-out;
    }

    .speaker-tower.thump .speaker-woofer {
      transform: scale(1.11);
    }

    /* =====================================================================
       ШАР 3: НЕОНОВИЙ СВІТЛОДІОДНИЙ БІЛБОРД ІЗ ЗАВДАННЯМ
       Жодних білих прямокутників — темна LED-матриця в металевому корпусі
       ===================================================================== */
    #billboard-wrapper {
      position: absolute;
      top: clamp(22px, 4.5vh, 52px);
      left: 50%;
      transform: translateX(-50%);
      width: min(72vw, 660px);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    /* Металеві підвіси до верхньої ферми */
    .billboard-chains {
      width: 78%;
      height: clamp(16px, 3vh, 30px);
      display: flex;
      justify-content: space-between;
      margin-bottom: -4px;
    }

    .chain-rod {
      width: 8px;
      height: 100%;
      background: linear-gradient(90deg, #1b2030, #697496, #1f2436);
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.7);
    }

    /* Корпус LED-екрану */
    #task-billboard {
      position: relative;
      width: 100%;
      min-height: clamp(78px, 12.5vh, 118px);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      /* Темний металік з геометричним LED-візерунком */
      background:
        radial-gradient(rgba(0, 240, 255, 0.12) 1.2px, transparent 1.2px),
        linear-gradient(145deg, #15192e 0%, #0c0f1e 50%, #1c1330 100%);
      background-size: 10px 10px, 100% 100%;
      border: 3px solid #00f0ff;
      box-shadow:
        0 0 18px rgba(0, 240, 255, 0.5),
        0 0 42px rgba(157, 78, 221, 0.35),
        inset 0 0 28px rgba(0, 240, 255, 0.22),
        0 18px 36px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    }

    /* Світловий блік по склу LED-панелі */
    #task-billboard::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.02) 38%, transparent 52%);
      pointer-events: none;
    }

    /* Декоративні кутові заклепки корпусу */
    .rivet {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #a8b5d6, #323a56);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    }
    .rivet.tl { top: 9px; left: 11px; }
    .rivet.tr { top: 9px; right: 11px; }
    .rivet.bl { bottom: 9px; left: 11px; }
    .rivet.br { bottom: 9px; right: 11px; }

    /* Текст завдання на LED-екрані */
    #phrase-text {
      position: relative;
      z-index: 2;
      font-family: var(--font-main);
      font-size: clamp(26px, 3.9vw, 48px);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #f4fbff;
      text-align: center;
      text-shadow:
        0 0 10px rgba(0, 240, 255, 0.75),
        0 0 24px rgba(0, 240, 255, 0.35),
        0 3px 6px rgba(0, 0, 0, 0.9);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease;
    }

    /* Стан екрану при зміні завдання */
    #phrase-text.switching {
      opacity: 0;
      transform: scale(0.86) skewX(-6deg);
    }

    /* Реакції екрану на правильну та неправильну відповідь */
    #task-billboard.state-correct {
      border-color: var(--neon-green);
      box-shadow:
        0 0 28px rgba(0, 255, 136, 0.85),
        0 0 60px rgba(0, 255, 136, 0.4),
        inset 0 0 36px rgba(0, 255, 136, 0.35),
        0 18px 36px rgba(0, 0, 0, 0.75);
      transform: scale(1.04);
    }

    #task-billboard.state-wrong {
      border-color: var(--neon-red);
      box-shadow:
        0 0 26px rgba(255, 59, 92, 0.85),
        0 0 54px rgba(255, 59, 92, 0.38),
        inset 0 0 32px rgba(255, 59, 92, 0.35),
        0 18px 36px rgba(0, 0, 0, 0.75);
      animation: billboardGlitch 0.45s ease;
    }

    @keyframes billboardGlitch {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px) skewX(3deg); }
      40% { transform: translateX(9px) skewX(-3deg); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(4px); }
    }

    /* =====================================================================
       ШАР 4: ЖИВИЙ ПЕРСОНАЖ — СУЧАСНИЙ ТАНЦЮРИСТ НА ЦЕНТРАЛЬНОМУ ТАНЦПОЛІ
       ===================================================================== */
    #dancer-stage-spot {
      position: absolute;
      left: 50%;
      bottom: clamp(22px, 5.5vh, 58px);
      transform: translateX(-50%);
      width: clamp(250px, 34vw, 390px);
      height: clamp(300px, 56vh, 470px);
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
    }

    #dancer-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.6));
    }

    /* Опорні точки суглобів танцюриста у координатах viewBox (0 0 360 440) */
    #dancer-body, #torso-group, #head-group, #cap-group,
    #arm-left, #forearm-left, #arm-right, #forearm-right,
    #leg-left, #shin-left, #leg-right, #shin-right,
    #dancer-shadow, #eyelid-left, #eyelid-right,
    #brow-left, #brow-right {
      transform-box: view-box;
    }

    #dancer-body    { transform-origin: 180px 395px; }
    #torso-group    { transform-origin: 180px 258px; }
    #head-group     { transform-origin: 180px 146px; }
    #cap-group      { transform-origin: 180px 92px; }
    #arm-left       { transform-origin: 138px 168px; }
    #forearm-left   { transform-origin: 112px 218px; }
    #arm-right      { transform-origin: 222px 168px; }
    #forearm-right  { transform-origin: 248px 218px; }
    #leg-left       { transform-origin: 158px 262px; }
    #shin-left      { transform-origin: 148px 330px; }
    #leg-right      { transform-origin: 202px 262px; }
    #shin-right     { transform-origin: 212px 330px; }
    #dancer-shadow  { transform-origin: 180px 410px; }
    #brow-left      { transform-origin: 164px 104px; }
    #brow-right     { transform-origin: 196px 104px; }

    /* ---------- БАЗОВИЙ ЖИВИЙ ГРУВ (IDLE) ---------- */
    .anim-idle #dancer-body {
      animation: idleBounce 0.9s ease-in-out infinite;
    }
    .anim-idle #torso-group {
      animation: idleTorsoSway 1.8s ease-in-out infinite;
    }
    .anim-idle #head-group {
      animation: idleHeadNod 0.9s ease-in-out infinite;
    }
    .anim-idle #arm-left {
      animation: idleArmL 1.8s ease-in-out infinite;
    }
    .anim-idle #arm-right {
      animation: idleArmR 1.8s ease-in-out infinite;
    }
    .anim-idle #forearm-left {
      animation: idleForearmL 0.9s ease-in-out infinite;
    }
    .anim-idle #forearm-right {
      animation: idleForearmR 0.9s ease-in-out infinite;
    }
    .anim-idle #dancer-shadow {
      animation: idleShadow 0.9s ease-in-out infinite;
    }

    @keyframes idleBounce {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(7px) scaleY(0.975); }
    }
    @keyframes idleTorsoSway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3.5deg); }
    }
    @keyframes idleHeadNod {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(4deg) translateY(3px); }
    }
    @keyframes idleArmL {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-10deg); }
    }
    @keyframes idleArmR {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes idleForearmL {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(-6deg); }
    }
    @keyframes idleForearmR {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes idleShadow {
      0%, 100% { transform: scaleX(1); opacity: 0.72; }
      50% { transform: scaleX(1.06); opacity: 0.85; }
    }

    /* Нахил зацікавленості при наведенні на праву чи ліву вертушку */
    #dancer-svg.look-left #torso-group { transform: rotate(-8deg) !important; transition: transform 0.25s ease; }
    #dancer-svg.look-left #head-group { transform: rotate(-7deg) !important; transition: transform 0.25s ease; }
    #dancer-svg.look-right #torso-group { transform: rotate(8deg) !important; transition: transform 0.25s ease; }
    #dancer-svg.look-right #head-group { transform: rotate(7deg) !important; transition: transform 0.25s ease; }

    /* ---------- 5 РІЗНОМАНІТНИХ ПЕРЕМОЖНИХ ТАНЦЮВАЛЬНИХ КОМБО ---------- */
    /* Комбо 1: Високий стрибок із фрізом у повітрі */
    .anim-win-jump #dancer-body { animation: winJumpBody 1.25s cubic-bezier(0.22, 1, 0.36, 1); }
    .anim-win-jump #arm-left { animation: winJumpArmL 1.25s ease; }
    .anim-win-jump #arm-right { animation: winJumpArmR 1.25s ease; }
    .anim-win-jump #leg-left { animation: winJumpLegL 1.25s ease; }
    .anim-win-jump #leg-right { animation: winJumpLegR 1.25s ease; }
    .anim-win-jump #cap-group { animation: winCapPop 1.25s ease; }
    .anim-win-jump #dancer-shadow { animation: winJumpShadow 1.25s ease; }

    @keyframes winJumpBody {
      0% { transform: translateY(0) scaleY(1); }
      15% { transform: translateY(18px) scaleY(0.9); }
      45% { transform: translateY(-78px) rotate(-6deg) scale(1.05); }
      65% { transform: translateY(-68px) rotate(5deg) scale(1.05); }
      88% { transform: translateY(10px) scaleY(0.94); }
      100% { transform: translateY(0) scaleY(1); }
    }
    @keyframes winJumpArmL {
      0%, 100% { transform: rotate(0deg); }
      45%, 70% { transform: rotate(132deg); }
    }
    @keyframes winJumpArmR {
      0%, 100% { transform: rotate(0deg); }
      45%, 70% { transform: rotate(-132deg); }
    }
    @keyframes winJumpLegL {
      0%, 100% { transform: rotate(0deg); }
      45%, 65% { transform: rotate(32deg); }
    }
    @keyframes winJumpLegR {
      0%, 100% { transform: rotate(0deg); }
      45%, 65% { transform: rotate(-32deg); }
    }
    @keyframes winCapPop {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      45% { transform: translateY(-14px) rotate(-10deg); }
      75% { transform: translateY(2px) rotate(4deg); }
    }
    @keyframes winJumpShadow {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(0.45); opacity: 0.3; }
    }

    /* Комбо 2: Брейкданс-оберт 360 з розмахом рук */
    .anim-win-spin #dancer-body { animation: winSpinBody 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .anim-win-spin #arm-left { animation: winSpinArmL 1.2s ease; }
    .anim-win-spin #arm-right { animation: winSpinArmR 1.2s ease; }
    .anim-win-spin #dancer-shadow { animation: winJumpShadow 1.2s ease; }

    @keyframes winSpinBody {
      0% { transform: translateY(0) scaleX(1); }
      25% { transform: translateY(-32px) scaleX(0.12); }
      50% { transform: translateY(-48px) scaleX(-1); }
      75% { transform: translateY(-28px) scaleX(0.12); }
      90% { transform: translateY(8px) scaleX(1.06); }
      100% { transform: translateY(0) scaleX(1); }
    }
    @keyframes winSpinArmL {
      0%, 100% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(85deg); }
    }
    @keyframes winSpinArmR {
      0%, 100% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(-85deg); }
    }

    /* Комбо 3: Мунволк / Слайдер по танцполу */
    .anim-win-slide #dancer-body { animation: winSlideBody 1.3s ease-in-out; }
    .anim-win-slide #torso-group { animation: winSlideTorso 1.3s ease-in-out; }
    .anim-win-slide #leg-left { animation: winSlideLegL 1.3s ease-in-out; }
    .anim-win-slide #leg-right { animation: winSlideLegR 1.3s ease-in-out; }
    .anim-win-slide #arm-left { animation: winSlideArmL 1.3s ease-in-out; }
    .anim-win-slide #arm-right { animation: winSlideArmR 1.3s ease-in-out; }

    @keyframes winSlideBody {
      0% { transform: translateX(0); }
      25% { transform: translateX(-54px) translateY(-6px); }
      55% { transform: translateX(54px) translateY(-10px); }
      80% { transform: translateX(-16px) translateY(4px); }
      100% { transform: translateX(0); }
    }
    @keyframes winSlideTorso {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(12deg); }
      55% { transform: rotate(-14deg); }
    }
    @keyframes winSlideLegL {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-22deg); }
      55% { transform: rotate(22deg); }
    }
    @keyframes winSlideLegR {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(18deg); }
      55% { transform: rotate(-20deg); }
    }
    @keyframes winSlideArmL {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(58deg); }
      55% { transform: rotate(115deg); }
    }
    @keyframes winSlideArmR {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-115deg); }
      55% { transform: rotate(-52deg); }
    }

    /* Комбо 4: Хвиля руками + ритмічний дроп */
    .anim-win-wave #dancer-body { animation: winWaveBody 1.3s ease-in-out; }
    .anim-win-wave #arm-left { animation: winWaveArmL 1.3s ease-in-out; }
    .anim-win-wave #forearm-left { animation: winWaveForeL 1.3s ease-in-out; }
    .anim-win-wave #arm-right { animation: winWaveArmR 1.3s ease-in-out; }
    .anim-win-wave #forearm-right { animation: winWaveForeR 1.3s ease-in-out; }
    .anim-win-wave #head-group { animation: winWaveHead 1.3s ease-in-out; }

    @keyframes winWaveBody {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(22px) scaleY(0.93); }
      50% { transform: translateY(-22px) scaleY(1.03); }
      75% { transform: translateY(18px) scaleY(0.95); }
    }
    @keyframes winWaveArmL {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(95deg); }
      60% { transform: rotate(40deg); }
      85% { transform: rotate(120deg); }
    }
    @keyframes winWaveForeL {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-55deg); }
      70% { transform: rotate(35deg); }
    }
    @keyframes winWaveArmR {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-40deg); }
      60% { transform: rotate(-105deg); }
      85% { transform: rotate(-125deg); }
    }
    @keyframes winWaveForeR {
      0%, 100% { transform: rotate(0deg); }
      45% { transform: rotate(55deg); }
      75% { transform: rotate(-35deg); }
    }
    @keyframes winWaveHead {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg); }
      55% { transform: rotate(12deg); }
      80% { transform: rotate(-6deg); }
    }

    /* Комбо 5: Зірковий фріз-перемога */
    .anim-win-star #dancer-body { animation: winStarBody 1.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-win-star #torso-group { animation: winStarTorso 1.35s ease; }
    .anim-win-star #arm-left { animation: winStarArmL 1.35s ease; }
    .anim-win-star #arm-right { animation: winStarArmR 1.35s ease; }
    .anim-win-star #leg-right { animation: winStarLegR 1.35s ease; }
    .anim-win-star #shin-right { animation: winStarShinR 1.35s ease; }

    @keyframes winStarBody {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      35%, 75% { transform: translateY(-28px) rotate(-10deg) scale(1.06); }
    }
    @keyframes winStarTorso {
      0%, 100% { transform: rotate(0deg); }
      35%, 75% { transform: rotate(12deg); }
    }
    @keyframes winStarArmL {
      0%, 100% { transform: rotate(0deg); }
      35%, 75% { transform: rotate(148deg); }
    }
    @keyframes winStarArmR {
      0%, 100% { transform: rotate(0deg); }
      35%, 75% { transform: rotate(-50deg); }
    }
    @keyframes winStarLegR {
      0%, 100% { transform: rotate(0deg); }
      35%, 75% { transform: rotate(-42deg); }
    }
    @keyframes winStarShinR {
      0%, 100% { transform: rotate(0deg); }
      35%, 75% { transform: rotate(54deg); }
    }

    /* ---------- 4 КОМІЧНІ РЕАКЦІЇ НА ПОМИЛКУ ---------- */
    /* Помилка 1: Вініловий скретч і похитування */
    .anim-wrong-stumble #dancer-body { animation: wrongStumbleBody 0.9s ease; }
    .anim-wrong-stumble #head-group { animation: wrongHeadShake 0.9s ease; }
    .anim-wrong-stumble #cap-group { animation: wrongCapTilt 0.9s ease; }
    .anim-wrong-stumble #arm-left { animation: wrongFlailL 0.9s ease; }
    .anim-wrong-stumble #arm-right { animation: wrongFlailR 0.9s ease; }

    @keyframes wrongStumbleBody {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-22px) rotate(-11deg); }
      45% { transform: translateX(18px) rotate(9deg); }
      70% { transform: translateX(-9px) rotate(-4deg); }
    }
    @keyframes wrongHeadShake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-16deg); }
      50% { transform: rotate(16deg); }
      75% { transform: rotate(-8deg); }
    }
    @keyframes wrongCapTilt {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      35% { transform: translateY(-8px) rotate(14deg); }
      70% { transform: translateY(3px) rotate(-6deg); }
    }
    @keyframes wrongFlailL {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(75deg); }
      65% { transform: rotate(25deg); }
    }
    @keyframes wrongFlailR {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-75deg); }
      65% { transform: rotate(-25deg); }
    }

    /* Помилка 2: Комічне знизування плечима */
    .anim-wrong-shrug #torso-group { animation: wrongShrugTorso 0.95s ease; }
    .anim-wrong-shrug #arm-left { animation: wrongShrugArmL 0.95s ease; }
    .anim-wrong-shrug #forearm-left { animation: wrongShrugForeL 0.95s ease; }
    .anim-wrong-shrug #arm-right { animation: wrongShrugArmR 0.95s ease; }
    .anim-wrong-shrug #forearm-right { animation: wrongShrugForeR 0.95s ease; }
    .anim-wrong-shrug #head-group { animation: wrongShrugHead 0.95s ease; }

    @keyframes wrongShrugTorso {
      0%, 100% { transform: translateY(0); }
      30%, 70% { transform: translateY(-8px); }
    }
    @keyframes wrongShrugArmL {
      0%, 100% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(45deg); }
    }
    @keyframes wrongShrugForeL {
      0%, 100% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(55deg); }
    }
    @keyframes wrongShrugArmR {
      0%, 100% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(-45deg); }
    }
    @keyframes wrongShrugForeR {
      0%, 100% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(-55deg); }
    }
    @keyframes wrongShrugHead {
      0%, 100% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(14deg) translateY(5px); }
    }

    /* Помилка 3: Підсковзнувся і зловив рівновагу */
    .anim-wrong-slip #dancer-body { animation: wrongSlipBody 0.95s cubic-bezier(0.25, 1, 0.5, 1); }
    .anim-wrong-slip #leg-left { animation: wrongSlipLegL 0.95s ease; }
    .anim-wrong-slip #arm-left { animation: wrongFlailL 0.95s ease; }
    .anim-wrong-slip #arm-right { animation: wrongFlailR 0.95s ease; }

    @keyframes wrongSlipBody {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      35% { transform: translateY(16px) rotate(-18deg); }
      65% { transform: translateY(-6px) rotate(6deg); }
    }
    @keyframes wrongSlipLegL {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-45deg); }
    }

    /* Помилка 4: Подив + хват за кепку */
    .anim-wrong-cap #head-group { animation: wrongCapHead 0.95s ease; }
    .anim-wrong-cap #arm-right { animation: wrongCapArmR 0.95s ease; }
    .anim-wrong-cap #forearm-right { animation: wrongCapForeR 0.95s ease; }
    .anim-wrong-cap #dancer-body { animation: wrongCapDrop 0.95s ease; }

    @keyframes wrongCapDrop {
      0%, 100% { transform: translateY(0); }
      35%, 70% { transform: translateY(14px) scaleY(0.96); }
    }
    @keyframes wrongCapHead {
      0%, 100% { transform: rotate(0deg); }
      35%, 70% { transform: rotate(-14deg); }
    }
    @keyframes wrongCapArmR {
      0%, 100% { transform: rotate(0deg); }
      35%, 70% { transform: rotate(-125deg); }
    }
    @keyframes wrongCapForeR {
      0%, 100% { transform: rotate(0deg); }
      35%, 70% { transform: rotate(-72deg); }
    }

    /* Міні-реакція, коли дитина клікає прямо по танцюристу */
    .anim-poke #dancer-body { animation: pokeBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .anim-poke #arm-right { animation: pokeWave 0.55s ease; }
    .anim-poke #head-group { animation: idleHeadNod 0.55s ease; }

    @keyframes pokeBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-20px) scale(1.04); }
    }
    @keyframes pokeWave {
      0%, 100% { transform: rotate(0deg); }
      35% { transform: rotate(-125deg); }
      65% { transform: rotate(-95deg); }
    }

    /* Природне моргання очима */
    .eye-lid {
      transform-origin: center top;
      transform: scaleY(0);
      transition: transform 0.08s ease;
    }
    .is-blinking .eye-lid {
      transform: scaleY(1);
    }

    /* =====================================================================
       ШАР 5: ІНТЕРАКТИВНІ DJ-ВЕРТУШКИ (КНОПКИ ВИБОРУ: ТАК / НІ)
       Повна відсутність білих прямокутників — стилізовані діджейські деки
       ===================================================================== */
    #dj-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 7;
    }

    .turntable-btn {
      position: absolute;
      bottom: clamp(28px, 7vh, 72px);
      width: clamp(138px, 17.5vw, 210px);
      height: clamp(138px, 17.5vw, 210px);
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      outline: none;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), filter 0.22s ease;
      filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.8));
    }

    /* Розташування по обидва боки від танцюриста */
    #btn-yes {
      left: clamp(128px, 19.5vw, 290px);
    }

    #btn-no {
      right: clamp(128px, 19.5vw, 290px);
    }

    .turntable-btn svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .turntable-btn:hover {
      transform: translateY(-8px) scale(1.07);
    }

    .turntable-btn:active {
      transform: translateY(2px) scale(0.96);
    }

    #btn-yes:hover {
      filter: drop-shadow(0 0 24px rgba(0, 255, 136, 0.7)) drop-shadow(0 18px 26px rgba(0, 0, 0, 0.8));
    }

    #btn-no:hover {
      filter: drop-shadow(0 0 24px rgba(255, 59, 92, 0.7)) drop-shadow(0 18px 26px rgba(0, 0, 0, 0.8));
    }

    /* Обертання вінілової платівки */
    .vinyl-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: vinylRotate 5.5s linear infinite;
    }

    .turntable-btn:hover .vinyl-spin {
      animation-duration: 1.6s;
    }

    .turntable-btn.turbo-spin .vinyl-spin {
      animation-duration: 0.4s;
    }

    .turntable-btn.scratch-back {
      animation: deckShake 0.45s ease;
    }

    .turntable-btn.scratch-back .vinyl-spin {
      animation: vinylScratch 0.45s ease;
    }

    @keyframes vinylRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes vinylScratch {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(-65deg); }
      60% { transform: rotate(45deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes deckShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-3deg); }
      55% { transform: translateX(10px) rotate(3deg); }
      80% { transform: translateX(-5px); }
    }

    /* Рух тонарма вертушки при наведенні */
    .tonearm {
      transform-box: view-box;
      transform-origin: 184px 44px;
      transition: transform 0.25s ease;
    }
    .turntable-btn:hover .tonearm {
      transform: rotate(12deg);
    }

    /* =====================================================================
       ШАР 6: МІНІМАЛІСТИЧНІ КНОПКИ НАВІГАЦІЇ (НАЗАД / ДАЛІ) ТА БІТ-ПЕРЕМИКАЧ
       ===================================================================== */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: clamp(46px, 4.8vw, 60px);
      height: clamp(46px, 4.8vw, 60px);
      border-radius: 50%;
      border: 2px solid rgba(0, 240, 255, 0.55);
      background: linear-gradient(145deg, rgba(24, 30, 56, 0.78), rgba(10, 13, 26, 0.88));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.25), 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #btn-prev { left: clamp(12px, 1.8vw, 26px); }
    #btn-next { right: clamp(12px, 1.8vw, 26px); }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.12);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.7), 0 10px 22px rgba(0, 0, 0, 0.7);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .nav-btn svg {
      width: 52%;
      height: 52%;
      stroke: #e8fbff;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      filter: drop-shadow(0 0 5px var(--neon-cyan));
    }

    /* Кнопка фонового хіп-хоп біту (верхній правий кут) */
    #btn-beat {
      position: absolute;
      top: clamp(14px, 2.2vh, 24px);
      right: clamp(14px, 2vw, 26px);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 42, 133, 0.6);
      background: linear-gradient(145deg, rgba(32, 18, 48, 0.82), rgba(14, 11, 26, 0.9));
      cursor: pointer;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(255, 42, 133, 0.28), 0 6px 16px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    #btn-beat:hover {
      transform: scale(1.1);
      border-color: var(--neon-pink);
      box-shadow: 0 0 22px rgba(255, 42, 133, 0.7);
    }

    #btn-beat.active {
      border-color: var(--neon-green);
      box-shadow: 0 0 22px rgba(0, 255, 136, 0.75);
      animation: beatPulseBtn 0.48s ease-in-out infinite alternate;
    }

    @keyframes beatPulseBtn {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    /* =====================================================================
       ШАР 7: ПОЛОТНО ДЛЯ СВІТЛОВИХ ЧАСТИНОК, ЛАЗЕРІВ ТА КОНФЕТІ
       ===================================================================== */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Адаптація для вужчих екранів та планшетів */
    @media (max-width: 900px) {
      .speaker-tower { width: 92px; height: 210px; opacity: 0.85; }
      #btn-yes { left: 14vw; bottom: 20px; width: 126px; height: 126px; }
      #btn-no { right: 14vw; bottom: 20px; width: 126px; height: 126px; }
      #dancer-stage-spot { bottom: 13vh; height: 48vh; }
    }
  </style>
</head>
<body>
  <div id="stage-arena">

    <!-- =================================================================
         ШАР 1: ДЕТАЛІЗОВАНИЙ SVG-ФОН ТАНЦЮВАЛЬНОЇ ВУЛИЧНОЇ АРЕНИ
         ================================================================= -->
    <svg id="scene-bg-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Градієнт нічного міського неба -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#070a1c"/>
          <stop offset="45%" stop-color="#19113b"/>
          <stop offset="82%" stop-color="#3c134e"/>
          <stop offset="100%" stop-color="#611855"/>
        </linearGradient>

        <!-- Градієнт цегляної стіни з освітленням у центрі -->
        <radialGradient id="brickLight" cx="50%" cy="46%" r="55%">
          <stop offset="0%" stop-color="#362854"/>
          <stop offset="55%" stop-color="#1d1834"/>
          <stop offset="100%" stop-color="#0c0d1b"/>
        </radialGradient>

        <!-- Реалістичний паттерн цегляної кладки -->
        <pattern id="brickPattern" width="84" height="42" patternUnits="userSpaceOnUse">
          <rect width="84" height="42" fill="#0d0e1a" fill-opacity="0.45"/>
          <rect x="2" y="2" width="38" height="17" rx="2" fill="#2c2447" fill-opacity="0.52"/>
          <rect x="44" y="2" width="38" height="17" rx="2" fill="#251e3d" fill-opacity="0.52"/>
          <rect x="-18" y="23" width="38" height="17" rx="2" fill="#221c38" fill-opacity="0.52"/>
          <rect x="24" y="23" width="38" height="17" rx="2" fill="#30274c" fill-opacity="0.52"/>
          <rect x="66" y="23" width="38" height="17" rx="2" fill="#261f3f" fill-opacity="0.52"/>
        </pattern>

        <!-- Градієнт глянцевого танцполу -->
        <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#181330"/>
          <stop offset="28%" stop-color="#121426"/>
          <stop offset="72%" stop-color="#0b0d1b"/>
          <stop offset="100%" stop-color="#05060d"/>
        </linearGradient>

        <!-- Неонове відблиск-коло під танцюристом -->
        <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
          <stop id="floorGlowStop1" offset="0%" stop-color="#00f0ff" stop-opacity="0.55"/>
          <stop id="floorGlowStop2" offset="48%" stop-color="#9d4edd" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
        </radialGradient>

        <!-- Об'ємні промені прожекторів -->
        <linearGradient id="beamCyan" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55"/>
          <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="beamPink" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.52"/>
          <stop offset="50%" stop-color="#ff2a85" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#ff2a85" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="beamGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd000" stop-opacity="0.48"/>
          <stop offset="55%" stop-color="#9d4edd" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#ffd000" stop-opacity="0"/>
        </linearGradient>

        <!-- Градієнт металевої ферми сцени -->
        <linearGradient id="trussMetal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4e587a"/>
          <stop offset="50%" stop-color="#22283d"/>
          <stop offset="100%" stop-color="#111422"/>
        </linearGradient>

        <!-- М'яке неонове світіння -->
        <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Нічне небо і силуети сучасного мегаполісу на горизонті -->
      <rect width="1600" height="400" fill="url(#skyGrad)"/>
      <g id="city-skyline" opacity="0.88">
        <!-- Далекий шар будинків -->
        <path d="M0,255 L70,255 L70,150 L145,150 L145,210 L215,210 L215,120 L290,120 L290,195 L380,195 L380,140 L455,140 L455,220 L550,220 L550,115 L630,115 L630,185 L740,185 L740,130 L835,130 L835,205 L950,205 L950,125 L1035,125 L1035,190 L1140,190 L1140,108 L1225,108 L1225,175 L1340,175 L1340,135 L1430,135 L1430,195 L1520,195 L1520,145 L1600,145 L1600,320 L0,320 Z" fill="#120d29"/>
        <!-- Вогники вікон у висотках -->
        <g fill="#ffd86b" opacity="0.55">
          <rect x="90" y="168" width="8" height="10"/><rect x="108" y="168" width="8" height="10"/>
          <rect x="90" y="188" width="8" height="10"/><rect x="122" y="188" width="8" height="10"/>
          <rect x="232" y="138" width="9" height="10"/><rect x="255" y="156" width="9" height="10"/>
          <rect x="232" y="176" width="9" height="10"/><rect x="398" y="158" width="9" height="10"/>
          <rect x="572" y="136" width="8" height="11"/><rect x="595" y="158" width="8" height="11"/>
          <rect x="762" y="148" width="9" height="10"/><rect x="786" y="168" width="9" height="10"/>
          <rect x="970" y="146" width="8" height="10"/><rect x="992" y="168" width="8" height="10"/>
          <rect x="1160" y="128" width="10" height="11"/><rect x="1186" y="148" width="10" height="11"/>
          <rect x="1362" y="156" width="9" height="10"/><rect x="1390" y="172" width="9" height="10"/>
        </g>
        <!-- Неонові акценти на дахах -->
        <rect x="215" y="118" width="75" height="3" fill="#00f0ff" opacity="0.7"/>
        <rect x="550" y="113" width="80" height="3" fill="#ff2a85" opacity="0.75"/>
        <rect x="1140" y="106" width="85" height="3" fill="#00f0ff" opacity="0.75"/>
      </g>

      <!-- Цегляна стіна вуличної танцювальної арени -->
      <rect x="0" y="210" width="1600" height="450" fill="url(#brickLight)"/>
      <rect x="0" y="210" width="1600" height="450" fill="url(#brickPattern)"/>
      <!-- Бетонний верхній парапет стіни -->
      <rect x="0" y="202" width="1600" height="16" fill="#2c304b"/>
      <rect x="0" y="216" width="1600" height="5" fill="#0d0e1a" opacity="0.8"/>

      <!-- Художнє вуличне графіті на цегляній стіні (без слів — динамічні стріт-арт мотиви) -->
      <g id="wall-graffiti" opacity="0.62">
        <!-- Ліва композиція: абстрактні стрілки, хвилі та сплески фарби -->
        <path d="M180,470 C220,380 340,340 430,395 C370,415 320,455 290,515 Z" fill="#ff2a85" opacity="0.52"/>
        <path d="M140,420 L295,320 L275,365 L395,325 L265,445 L285,398 Z" fill="#00f0ff" opacity="0.48"/>
        <circle cx="245" cy="365" r="46" fill="none" stroke="#ffd000" stroke-width="7" stroke-dasharray="22 12" opacity="0.58"/>
        <circle cx="380" cy="485" r="24" fill="#9d4edd" opacity="0.55"/>
        <!-- Краплі спрей-фарби -->
        <path d="M295,380 L295,432 M320,390 L320,422 M210,445 L210,492" stroke="#ff2a85" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

        <!-- Права композиція: блискавка, звукові хвилі та стріт-зірки -->
        <path d="M1220,335 L1390,375 L1320,425 L1440,468 L1265,495 L1308,438 Z" fill="#9d4edd" opacity="0.55"/>
        <path d="M1170,445 Q1285,310 1425,365" fill="none" stroke="#00f0ff" stroke-width="11" stroke-linecap="round" opacity="0.5"/>
        <path d="M1195,478 Q1300,360 1418,412" fill="none" stroke="#ffd000" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
        <polygon points="1245,355 1255,378 1280,380 1261,395 1267,419 1245,406 1223,419 1229,395 1210,380 1235,378" fill="#ff2a85" opacity="0.58"/>
        <!-- Краплі фарби справа -->
        <path d="M1355,440 L1355,495 M1382,425 L1382,468" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

        <!-- Центральна декоративна неонова арка-ореол позаду танцюриста -->
        <circle cx="800" cy="480" r="215" fill="none" stroke="#ff2a85" stroke-width="4" opacity="0.45" filter="url(#neonGlow)"/>

  <script>
    /* =======================================================================

       Можна легко редагувати текст або додавати власні питання нижче!
       ======================================================================= */
    const QUESTIONS = [
      { text: "крутий танець",        isPhrase: true  }, // Словосполучення: танець (який?) крутий
      { text: "музика грає",          isPhrase: false }, // НЕ словосполучення: граматична основа (підмет + присудок)
      { text: "стрибати високо",      isPhrase: true  }, // Словосполучення: стрибати (як?) високо
      { text: "на сцені",             isPhrase: false }, // НЕ словосполучення: іменник із прийменником
      { text: "яскраві кросівки",     isPhrase: true  }, // Словосполучення: кросівки (які?) яскраві
      { text: "кепка і кросівки",     isPhrase: false }, // НЕ словосполучення: однорідні члени речення
      { text: "слухати ритм",         isPhrase: true  }, // Словосполучення: слухати (що?) ритм
      { text: "танцюрист стрибає",    isPhrase: false }, // НЕ словосполучення: граматична основа
      { text: "гучна музика",         isPhrase: true  }, // Словосполучення: музика (яка?) гучна
      { text: "під біт",              isPhrase: false }, // НЕ словосполучення: іменник із прийменником
      { text: "рухатися швидко",      isPhrase: true  }, // Словосполучення: рухатися (як?) швидко
      { text: "стрибати й крутитися", isPhrase: false }, // НЕ словосполучення: однорідні члени речення
      { text: "стильна кепка",        isPhrase: true  }, // Словосполучення: кепка (яка?) стильна
      { text: "прожектори світять",   isPhrase: false }, // НЕ словосполучення: граматична основа
      { text: "крутити вініл",        isPhrase: true  }, // Словосполучення: крутити (що?) вініл
      { text: "перед залом",          isPhrase: false }, // НЕ словосполучення: іменник із прийменником
      { text: "веселий батл",         isPhrase: true  }, // Словосполучення: батл (який?) веселий

      { text: "світити яскраво",      isPhrase: true  }, // Словосполучення: світити (як?) яскраво
      { text: "глядачі аплодують",    isPhrase: false }  // НЕ словосполучення: граматична основа

    /* =======================================================================
       2. ПОСИЛАННЯ НА ЕЛЕМЕНТИ ІНТЕРФЕЙСУ ТА СТАН ГРИ
       ======================================================================= */
    const arena        = document.getElementById("stage-arena");
    const billboard    = document.getElementById("task-billboard");
    const phraseText   = document.getElementById("phrase-text");
    const dancerSvg    = document.getElementById("dancer-svg");
    const btnYes       = document.getElementById("btn-yes");
    const btnNo        = document.getElementById("btn-no");
    const btnPrev      = document.getElementById("btn-prev");
    const btnNext      = document.getElementById("btn-next");
    const btnBeat      = document.getElementById("btn-beat");
    const speakerLeft  = document.getElementById("speaker-left");
    const speakerRight = document.getElementById("speaker-right");
    const sweatDrop    = document.getElementById("sweat-drop");
    const pupilLeft    = document.getElementById("pupil-left");
    const pupilRight   = document.getElementById("pupil-right");
    const browLeft     = document.getElementById("brow-left");
    const browRight    = document.getElementById("brow-right");

    const mouths = {
      idle:  document.getElementById("mouth-idle"),
      happy: document.getElementById("mouth-happy"),
      wow:   document.getElementById("mouth-wow"),
      oops:  document.getElementById("mouth-oops")
    };

    let currentIndex    = 0;      // Поточний номер питання (0..19)
    let isLocked        = false;  // Захист від подвійного кліку під час перемоги
    let autoNextTimer   = null;   // Таймер автоматичного переходу після успіху
    let animResetTimer  = null;   // Таймер повернення танцюриста у базовий грув
    let winComboCursor  = 0;      // Лічильник для чергування 5 різних танців
    let wrongComboCursor = 0;     // Лічильник для чергування 4 різних помилок

    const WIN_ANIMATIONS   = ["anim-win-jump", "anim-win-spin", "anim-win-slide", "anim-win-wave", "anim-win-star"];
    const WRONG_ANIMATIONS = ["anim-wrong-stumble", "anim-wrong-shrug", "anim-wrong-slip", "anim-wrong-cap"];

    /* =======================================================================
       3. ЗВУКОВИЙ СИНТЕЗАТОР (WEB AUDIO API) — ХІП-ХОП БІТИ, СКРЕТЧІ, ФАНФАРИ
       Повністю автономний: жодних зовнішніх mp3-файлів
       ======================================================================= */
    class StreetAudioEngine {
      constructor() {
        this.ctx = null;
        this.beatPlaying = false;
        this.beatStep = 0;
        this.beatInterval = null;
      }

      // Ініціалізація аудіоконтексту після першої взаємодії
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      // Глибокий 808-кік (бас-барабан)
      playKick(timeOffset = 0, gainVal = 0.55) {
        this.init();
        const t = this.ctx.currentTime + timeOffset;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(145, t);
        osc.frequency.exponentialRampToValueAtTime(36, t + 0.16);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
      }

      // Чіткий снейр / хлопок у долоні
      playSnare(timeOffset = 0, gainVal = 0.25) {
        this.init();
        const t = this.ctx.currentTime + timeOffset;
        const bufferSize = this.ctx.sampleRate * 0.14;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.32));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1600, t);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(t);
      }

      // Короткий хай-хет для біту
      playHiHat(timeOffset = 0, gainVal = 0.08) {
        this.init();
        const t = this.ctx.currentTime + timeOffset;
        const bufferSize = this.ctx.sampleRate * 0.045;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.setValueAtTime(7500, t);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(t);
      }

      // Синтезаторна нота з фільтром
      playTone(freq, type, startOffset, duration, volume = 0.18, slideTo = null) {
        this.init();
        const t = this.ctx.currentTime + startOffset;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
        }
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(volume, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + duration + 0.02);
      }

      // 5 РІЗНИХ ПЕРЕМОЖНИХ МУЗИЧНИХ КОМБО
      playWinCombo(variant) {
        this.init();
        switch (variant % 5) {
          case 0: // Фанковий акорд + бас-дроп
            this.playKick(0, 0.65);
            this.playSnare(0.16, 0.3);
            [261.6, 329.6, 392.0, 523.2, 659.2].forEach((f, i) => {
              this.playTone(f, "triangle", i * 0.06, 0.35, 0.16);
            });
            break;

          case 1: // Енергійне стріт-арпеджіо + подвійний хлопок
            this.playKick(0, 0.55);
            this.playSnare(0.14, 0.25);
            this.playSnare(0.28, 0.28);
            [330, 392, 494, 659, 784].forEach((f, i) => {
              this.playTone(f, "sawtooth", i * 0.055, 0.22, 0.09);
            });
            break;

          case 2: // Потужний біт + духова фанфара
            this.playKick(0, 0.65);
            this.playKick(0.22, 0.55);
            this.playSnare(0.34, 0.32);
            this.playTone(392, "sawtooth", 0.02, 0.18, 0.11);
            this.playTone(523.2, "sawtooth", 0.18, 0.42, 0.13);
            this.playTone(659.2, "triangle", 0.18, 0.45, 0.16);
            break;

          case 3: // Світловий синт-слайд угору
            this.playKick(0, 0.55);
            this.playTone(220, "triangle", 0, 0.3, 0.18, 440);
            this.playTone(440, "sine", 0.12, 0.35, 0.18, 880);
            this.playTone(587.3, "triangle", 0.24, 0.38, 0.15);
            this.playSnare(0.24, 0.24);
            break;

          case 4: // Зіркова перемога (мажорний фанк-брейк)
            this.playKick(0, 0.65);
            [293.6, 370, 440, 587.3, 740, 880].forEach((f, i) => {
              this.playTone(f, "triangle", i * 0.05, 0.32, 0.14);
            });
            this.playSnare(0.26, 0.28);
            break;
        }
      }

      // 4 РІЗНІ ЗВУКИ ПОМИЛКИ (ВІНІЛОВІ СКРЕТЧІ ТА ЗУПИНКИ ПЛАТІВКИ)
      playWrongCombo(variant) {
        this.init();
        const t = this.ctx.currentTime;
        switch (variant % 4) {
          case 0: // Класичний DJ-скретч вінілу
            this.playScratch(0, 0.22);
            this.playScratch(0.18, 0.22);
            break;

          case 1: // Ефект вимкнення вертушки (повільне сповільнення звуку)
            this.playTone(320, "sawtooth", 0, 0.48, 0.13, 62);
            this.playTone(240, "triangle", 0.04, 0.44, 0.14, 48);
            break;

          case 2: // Комічний басовий "пружинистий" промах
            this.playTone(190, "sawtooth", 0, 0.16, 0.14, 125);
            this.playTone(150, "sawtooth", 0.16, 0.28, 0.15, 78);
            break;

          case 3: // Короткий подвійний глухий біт + мікро-скретч
            this.playScratch(0, 0.15);
            this.playTone(135, "square", 0.12, 0.14, 0.09, 95);
            this.playTone(105, "square", 0.26, 0.2, 0.09, 72);
            break;
        }
      }

      // Процедурний скретч платівки
      playScratch(offset = 0, duration = 0.2) {
        const t = this.ctx.currentTime + offset;
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(620, t);
        osc.frequency.exponentialRampToValueAtTime(160, t + duration * 0.45);
        osc.frequency.exponentialRampToValueAtTime(740, t + duration * 0.8);
        osc.frequency.exponentialRampToValueAtTime(190, t + duration);

        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1350, t);
        filter.Q.setValueAtTime(4.5, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.24, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + duration + 0.02);
      }

      // М'який звук перемикання рівня (Назад / Далі)
      playWhoosh() {
        this.init();
        this.playTone(260, "sine", 0, 0.13, 0.1, 560);
      }

      // Легкий клік при наведенні на вертушку
      playHoverTick() {
        if (!this.ctx || this.ctx.state !== "running") return;
        this.playTone(880, "sine", 0, 0.035, 0.035, 620);
      }

      // Грайливий звук при кліку на танцюриста
      playPokeSound() {
        this.init();
        this.playTone(380, "triangle", 0, 0.1, 0.12, 680);
        this.playHiHat(0.06, 0.12);
      }

      // Увімкнення/вимкнення фонового хіп-хоп біту (96 BPM)
      toggleBeat() {
        this.init();
        if (this.beatPlaying) {
          clearInterval(this.beatInterval);
          this.beatPlaying = false;
          btnBeat.classList.remove("active");
          return;
        }
        this.beatPlaying = true;
        this.beatStep = 0;
        btnBeat.classList.add("active");

        // 16-кроковий класичний бум-беп ритм
        const stepMs = 156;
        const tick = () => {
          const s = this.beatStep % 16;
          if (s === 0 || s === 7 || s === 10) {
            this.playKick(0, 0.34);
            pulseSpeakers(false);
          }
          if (s === 4 || s === 12) {
            this.playSnare(0, 0.14);
          }
          if (s % 2 === 0) {
            this.playHiHat(0, 0.045);
          }
          this.beatStep++;
        };
        tick();
        this.beatInterval = setInterval(tick, stepMs);
      }
    }

    const audio = new StreetAudioEngine();

    /* =======================================================================
       4. СИСТЕМА ВІЗУАЛЬНИХ ЕФЕКТІВ НА CANVAS (ПИЛ, КОНФЕТІ, ЛАЗЕРИ, ХВИЛІ)
       ======================================================================= */
    const canvas = document.getElementById("fx-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let shockwaves = [];
    let ambientMotes = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initAmbientMotes();
    }

    // Створення живих світлових пилинок, які плавно літають у променях прожекторів
    function initAmbientMotes() {
      ambientMotes = [];
      for (let i = 0; i < 42; i++) {
        ambientMotes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2.2 + 0.8,
          vx: (Math.random() - 0.5) * 0.35,
          vy: -Math.random() * 0.45 - 0.1,
          alpha: Math.random() * 0.5 + 0.18,
          color: ["#00f0ff", "#ff2a85", "#ffd000", "#ffffff"][Math.floor(Math.random() * 4)]
        });
      }
    }

    // Вибух яскравих неонових іскор, зірок і конфеті при правильній відповіді
    function spawnCelebrationFX(originX, originY, intensity = 1) {
      const colors = ["#00ff88", "#00f0ff", "#ff2a85", "#ffd000", "#9d4edd", "#ffffff"];
      const count = Math.floor(68 * intensity);

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = (Math.random() * 9 + 3.5) * intensity;
        const shapes = ["confetti", "star", "spark", "note"];
        particles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4.5,
          size: Math.random() * 9 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.25,
          life: 1,
          decay: Math.random() * 0.012 + 0.011,
          gravity: 0.18,
          shape: shapes[Math.floor(Math.random() * shapes.length)]
        });
      }

      // Потужні звукові неонові хвилі від танцюриста
      shockwaves.push({ x: originX, y: originY, r: 24, maxR: 290 * intensity, color: "#00ff88", alpha: 0.9 });
      shockwaves.push({ x: originX, y: originY, r: 10, maxR: 220 * intensity, color: "#00f0ff", alpha: 0.8 });
    }

    // Візуальний ефект для помилки (червоні іскри та пил з-під кросівок)
    function spawnWrongFX(originX, originY) {
      const colors = ["#ff3b5c", "#ff9100", "#ffd000"];
      for (let i = 0; i < 24; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: 0,
          vRot: 0.1,
          life: 1,
          decay: 0.025,
          gravity: 0.12,
          shape: "spark"
        });
      }
      shockwaves.push({ x: originX, y: originY, r: 18, maxR: 170, color: "#ff3b5c", alpha: 0.85 });
    }

    // Звукова хвиля від кліку по колонці
    function spawnSpeakerRing(el, color) {
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.68;
      shockwaves.push({ x: cx, y: cy, r: 18, maxR: 165, color, alpha: 0.85 });
    }

    // Малювання п'ятикутної зірочки на canvas
    function drawStar(cx, cy, spikes, outerR, innerR) {
      let rot = (Math.PI / 2) * 3;
      const step = Math.PI / spikes;
      ctx.beginPath();
      ctx.moveTo(cx, cy - outerR);
      for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        rot += step;
      }
      ctx.closePath();
      ctx.fill();
    }

    // Малювання векторної музичної ноти на canvas
    function drawNote(r) {
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.65, r * 0.45, -0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(r * 0.5, 0);
      ctx.lineTo(r * 0.5, -r * 1.9);
      ctx.lineTo(r * 1.35, -r * 1.45);
      ctx.stroke();
    }

    // Головний цикл анімації ефектів (60 FPS)
    function renderFXLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Фоновий світловий пил у повітрі
      for (const m of ambientMotes) {
        m.x += m.vx;
        m.y += m.vy;
        if (m.y < -10) { m.y = canvas.height + 10; m.x = Math.random() * canvas.width; }
        if (m.x < -10) m.x = canvas.width + 10;
        if (m.x > canvas.width + 10) m.x = -10;
        ctx.save();
        ctx.globalAlpha = m.alpha;
        ctx.fillStyle = m.color;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 2. Звукові ударні хвилі
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.14;
        sw.alpha -= 0.028;
        if (sw.alpha <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = sw.alpha;
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = sw.color;
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 3. Частинки (конфеті, зірки, іскри, ноти)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.985;
        p.rotation += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;

        if (p.shape === "confetti") {
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.52);
        } else if (p.shape === "star") {
          drawStar(0, 0, 5, p.size * 0.72, p.size * 0.34);
        } else if (p.shape === "note") {
          drawNote(p.size * 0.65);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      requestAnimationFrame(renderFXLoop);
    }

    /* =======================================================================
       5. ЖИВА ПОВЕДІНКА ТАНЦЮРИСТА ТА СЦЕНІЧНОГО ОСВІТЛЕННЯ
       ======================================================================= */

    // Перемикання емоції обличчя танцюриста
    function setDancerEmotion(mood) {
      Object.values(mouths).forEach(el => { el.style.display = "none"; });
      sweatDrop.style.display = "none";
      browLeft.style.transform = "";
      browRight.style.transform = "";

      if (mood === "happy") {
        mouths.happy.style.display = "block";
        browLeft.style.transform = "translateY(-4px) rotate(-6deg)";
        browRight.style.transform = "translateY(-4px) rotate(6deg)";
      } else if (mood === "wow") {
        mouths.wow.style.display = "block";
        browLeft.style.transform = "translateY(-6px)";
        browRight.style.transform = "translateY(-6px)";
      } else if (mood === "oops") {
        mouths.oops.style.display = "block";
        sweatDrop.style.display = "block";
        browLeft.style.transform = "translateY(-2px) rotate(-14deg)";
        browRight.style.transform = "translateY(2px) rotate(12deg)";
      } else {
        mouths.idle.style.display = "block";
      }
    }

    // Запуск танцювальної анімації персонажа з чистим перезапуском
    function playDancerAnim(animClass, durationMs, emotion) {
      clearTimeout(animResetTimer);
      dancerSvg.classList.remove("anim-idle", "anim-poke", ...WIN_ANIMATIONS, ...WRONG_ANIMATIONS);
      void dancerSvg.offsetWidth; // Примусовий перезапуск CSS-анімації
      dancerSvg.classList.add(animClass);
      setDancerEmotion(emotion);

      animResetTimer = setTimeout(() => {
        dancerSvg.classList.remove(animClass);
        dancerSvg.classList.add("anim-idle");
        setDancerEmotion("idle");
      }, durationMs);
    }

    // Природне періодичне моргання очима
    function scheduleBlink() {
      const delay = 2400 + Math.random() * 2800;
      setTimeout(() => {
        dancerSvg.classList.add("is-blinking");
        setTimeout(() => {
          dancerSvg.classList.remove("is-blinking");
          scheduleBlink();
        }, 130);
      }, delay);
    }

    // Стеження зіницями танцюриста за курсором миші
    window.addEventListener("mousemove", (e) => {
      const rect = dancerSvg.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.27;
      const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 260));
      const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 240));
      const tx = (dx * 3.4).toFixed(2);
      const ty = (dy * 2.6).toFixed(2);
      pupilLeft.setAttribute("transform", `translate(${tx}, ${ty})`);
      pupilRight.setAttribute("transform", `translate(${tx}, ${ty})`);
    });

    // Жива анімація смужок еквалайзера на обох колонках
    const eqBarsL = Array.from(document.querySelectorAll("#eq-left rect"));
    const eqBarsR = Array.from(document.querySelectorAll("#eq-right rect"));
    let eqBoost = 0;

    setInterval(() => {
      const base = audio.beatPlaying ? 0.55 : 0.28;
      [...eqBarsL, ...eqBarsR].forEach(bar => {
        const level = Math.min(1, base + eqBoost + Math.random() * 0.45);
        const h = Math.max(5, Math.round(level * 26));
        bar.setAttribute("height", h);
        bar.setAttribute("y", 58 - h);
      });
      eqBoost *= 0.82;
    }, 110);

    // Пульсація сабвуферів
    function pulseSpeakers(shakeArena = true) {
      eqBoost = 0.65;
      speakerLeft.classList.add("thump");
      speakerRight.classList.add("thump");
      if (shakeArena) {
        arena.classList.remove("bass-shake");
        void arena.offsetWidth;
        arena.classList.add("bass-shake");
      }
      setTimeout(() => {
        speakerLeft.classList.remove("thump");
        speakerRight.classList.remove("thump");
      }, 130);
    }

    // Колірні палітри для інтерактивного перемикання прожекторів
    const SPOT_PALETTES = [
      { l: "#00f0ff", c: "#ffd000", r: "#ff2a85", ring: "#00f0ff" },
      { l: "#00ff88", c: "#00f0ff", r: "#9d4edd", ring: "#00ff88" },
      { l: "#ff2a85", c: "#ff8800", r: "#ffd000", ring: "#ff2a85" },
      { l: "#9d4edd", c: "#00ff88", r: "#00f0ff", ring: "#9d4edd" }
    ];
    let paletteIndex = 0;

    function cycleStageLights() {
      paletteIndex = (paletteIndex + 1) % SPOT_PALETTES.length;
      const p = SPOT_PALETTES[paletteIndex];
      document.getElementById("lens-left").setAttribute("fill", p.l);
      document.getElementById("lens-center").setAttribute("fill", p.c);
      document.getElementById("lens-right").setAttribute("fill", p.r);
      document.getElementById("podium-ring").setAttribute("stroke", p.ring);
      document.getElementById("floorGlowStop1").setAttribute("stop-color", p.ring);
      audio.playTone(520 + paletteIndex * 90, "triangle", 0, 0.14, 0.12);
    }

    /* =======================================================================
       6. ЛОГІКА ГРИ: ВІДОБРАЖЕННЯ ПИТАННЯ, ПЕРЕВІРКА ТА ПЕРЕХОДИ
       ======================================================================= */
    function renderQuestion(withAnimation = true) {
      clearTimeout(autoNextTimer);
      isLocked = false;
      billboard.classList.remove("state-correct", "state-wrong");
      arena.classList.remove("party-mode");
      btnYes.classList.remove("turbo-spin", "scratch-back");
      btnNo.classList.remove("turbo-spin", "scratch-back");

      const item = QUESTIONS[currentIndex];
      if (withAnimation) {
        phraseText.classList.add("switching");
        setTimeout(() => {
          phraseText.textContent = item.text;
          phraseText.classList.remove("switching");
        }, 160);
      } else {
        phraseText.textContent = item.text;
      }
    }

    // Обробка вибору дитини (userChoice: true = ✓, false = ✕)
    function handleAnswer(userChoice) {
      if (isLocked) return;
      const currentQ = QUESTIONS[currentIndex];
      const clickedBtn = userChoice ? btnYes : btnNo;
      const dancerRect = dancerSvg.getBoundingClientRect();
      const centerX = dancerRect.left + dancerRect.width / 2;
      const centerY = dancerRect.top + dancerRect.height * 0.48;

      if (userChoice === currentQ.isPhrase) {
        // ===== ПРАВИЛЬНА ВІДПОВІДЬ =====
        isLocked = true;
        billboard.classList.remove("state-wrong");
        billboard.classList.add("state-correct");
        clickedBtn.classList.add("turbo-spin");
        arena.classList.add("party-mode");

        const winAnim = WIN_ANIMATIONS[winComboCursor % WIN_ANIMATIONS.length];
        const emotion = (winComboCursor % 2 === 0) ? "happy" : "wow";
        audio.playWinCombo(winComboCursor);
        winComboCursor++;

        playDancerAnim(winAnim, 1380, emotion);
        pulseSpeakers(true);

        // Перевірка на гранд-фінал (останнє 20-те питання)
        const isLastQuestion = currentIndex === QUESTIONS.length - 1;
        if (isLastQuestion) {
          spawnCelebrationFX(centerX, centerY, 1.55);
          setTimeout(() => spawnCelebrationFX(window.innerWidth * 0.28, window.innerHeight * 0.42, 1.15), 260);
          setTimeout(() => spawnCelebrationFX(window.innerWidth * 0.72, window.innerHeight * 0.42, 1.15), 520);
          setTimeout(() => audio.playWinCombo(4), 420);
        } else {
          spawnCelebrationFX(centerX, centerY, 1.0);
        }

        // Автоматичний перехід на наступне завдання після святкування
        autoNextTimer = setTimeout(() => {
          currentIndex = (currentIndex + 1) % QUESTIONS.length;
          renderQuestion(true);
        }, isLastQuestion ? 2100 : 1550);

      } else {
        // ===== ПОМИЛКОВА ВІДПОВІДЬ =====
        billboard.classList.remove("state-wrong");
        void billboard.offsetWidth;
        billboard.classList.add("state-wrong");

        clickedBtn.classList.remove("scratch-back");
        void clickedBtn.offsetWidth;
        clickedBtn.classList.add("scratch-back");

        arena.classList.remove("error-flicker");
        void arena.offsetWidth;
        arena.classList.add("error-flicker");

        const wrongAnim = WRONG_ANIMATIONS[wrongComboCursor % WRONG_ANIMATIONS.length];
        audio.playWrongCombo(wrongComboCursor);
        wrongComboCursor++;

        playDancerAnim(wrongAnim, 980, "oops");

        const btnRect = clickedBtn.getBoundingClientRect();
        spawnWrongFX(btnRect.left + btnRect.width / 2, btnRect.top + btnRect.height / 2);

        setTimeout(() => {
          billboard.classList.remove("state-wrong");
        }, 650);
      }
    }

    // Миттєвий перехід назад (без проходження поточного рівня)
    function goPrev() {
      audio.playWhoosh();
      currentIndex = (currentIndex - 1 + QUESTIONS.length) % QUESTIONS.length;
      renderQuestion(true);
    }

    // Миттєвий перехід далі (без проходження поточного рівня)
    function goNext() {
      audio.playWhoosh();
      currentIndex = (currentIndex + 1) % QUESTIONS.length;
      renderQuestion(true);
    }

    /* =======================================================================
       7. ПІДПИСКА НА ПОДІЇ ТА ІНТЕРАКТИВНІСТЬ СЦЕНИ
       ======================================================================= */
    btnYes.addEventListener("click", () => handleAnswer(true));
    btnNo.addEventListener("click",  () => handleAnswer(false));

    // Реакція танцюриста на наведення курсора на вертушки
    btnYes.addEventListener("mouseenter", () => {
      dancerSvg.classList.add("look-left");
      audio.playHoverTick();
    });
    btnYes.addEventListener("mouseleave", () => dancerSvg.classList.remove("look-left"));

    btnNo.addEventListener("mouseenter", () => {
      dancerSvg.classList.add("look-right");
      audio.playHoverTick();
    });
    btnNo.addEventListener("mouseleave", () => dancerSvg.classList.remove("look-right"));

    // Кнопки навігації (Назад / Далі)
    btnPrev.addEventListener("click", goPrev);
    btnNext.addEventListener("click", goNext);

    // Перемикач фонового хіп-хоп ритму
    btnBeat.addEventListener("click", () => audio.toggleBeat());

    // Клік по самому танцюристу — привітний рух та посмішка
    dancerSvg.addEventListener("click", () => {
      if (isLocked) return;
      audio.playPokeSound();
      playDancerAnim("anim-poke", 620, "happy");
      const r = dancerSvg.getBoundingClientRect();
      spawnSpeakerRing(dancerSvg, "#ffd000");
    });

    // Клік по лівій та правій колонках — потужний 808-бас і візуальна хвиля
    speakerLeft.addEventListener("click", () => {
      audio.playKick(0, 0.7);
      pulseSpeakers(true);
      spawnSpeakerRing(speakerLeft, "#ff2a85");
    });
    speakerRight.addEventListener("click", () => {
      audio.playKick(0, 0.65);
      audio.playSnare(0.08, 0.25);
      pulseSpeakers(true);
      spawnSpeakerRing(speakerRight, "#00f0ff");
    });

    // Клік по верхніх прожекторах — зміна світлової палітри сцени
    document.querySelectorAll(".spotlight-fixture").forEach(spot => {
      spot.addEventListener("click", cycleStageLights);
    });

    // Зручне керування з клавіатури для вчителя (стрілки Вліво/Вправо)
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goPrev();
      if (e.key === "ArrowRight") goNext();
    });

    /* =======================================================================
       8. СТАРТ ГРИ
       ======================================================================= */
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    renderFXLoop();
    scheduleBlink();
    renderQuestion(false);
  </script>
</body>
</html>
