<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>anketa</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;user-select:none}
body{
  font-family:'Comic Sans MS','Chalkboard SE','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  background:linear-gradient(135deg,#FFE29A,#FFB86B,#FF8FB1,#B79BFF,#8FD9FF);
  background-size:400% 400%;
  animation:bgshift 20s ease infinite;
}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(26,16,48,.16) 1.6px,transparent 1.9px);
  background-size:15px 15px;opacity:.55;mix-blend-mode:multiply;
}
.shape{position:fixed;z-index:0;pointer-events:none;border:6px solid rgba(26,16,48,.22);opacity:.55}
.s1{width:120px;height:120px;border-radius:50%;left:3vw;top:8vh;background:rgba(255,209,102,.55);animation:fl1 11s ease-in-out infinite}
.s2{width:90px;height:90px;left:88vw;top:70vh;background:rgba(143,217,255,.6);border-radius:18px;transform:rotate(18deg);animation:fl2 14s ease-in-out infinite}
.s3{width:0;height:0;border:none;border-left:55px solid transparent;border-right:55px solid transparent;border-bottom:95px solid rgba(198,160,255,.5);left:80vw;top:6vh;animation:fl1 16s ease-in-out infinite}
.s4{width:150px;height:60px;border-radius:40px;left:6vw;top:78vh;background:rgba(255,126,179,.45);animation:fl2 12s ease-in-out infinite}
@keyframes fl1{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-34px) rotate(10deg)}}
@keyframes fl2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(30px) rotate(-12deg)}}

#stage{
  position:relative;z-index:2;height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:3vh 3vw;
}

#card{
  position:relative;flex:1 1 auto;max-width:1240px;height:90vh;
  background:
    radial-gradient(circle at 13px 13px,rgba(255,150,40,.5) 3px,transparent 3.6px) 0 0/28px 28px,
    linear-gradient(160deg,#FFF6CC,#FFE7A0 55%,#FFD98A);
  border:7px solid #1a1030;border-radius:30px;
  box-shadow:15px 17px 0 rgba(26,16,48,.26), inset 0 0 0 9px rgba(255,255,255,.32);
  padding:9vh 4vw 2.4vh;
  display:flex;flex-direction:column;
  transform:rotate(-.4deg);
}
#card::before,#card::after{
  content:'';position:absolute;width:130px;height:36px;z-index:5;
  background:repeating-linear-gradient(45deg,#FFD166,#FFD166 9px,#FFB84D 9px,#FFB84D 18px);
  border:3px solid rgba(26,16,48,.55);border-radius:4px;
}
#card::before{left:6%;top:-20px;transform:rotate(-9deg)}
#card::after{right:6%;top:-20px;transform:rotate(8deg)}

#sentence{
  flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 1vw;min-height:0;
}
#line{
  font-size:clamp(22px,2.5vw,50px);
  font-weight:700;color:#1a1030;line-height:1.6;
  letter-spacing:.2px;
}

.blank{
  position:relative;display:inline-block;vertical-align:middle;
  min-width:2.6em;padding:.02em .5em .06em;margin:0 .16em;
  border:4px solid #1a1030;border-radius:16px;
  background:linear-gradient(180deg,#C4EDFF,#6CCBF5);
  box-shadow:inset 0 -7px 0 rgba(26,16,48,.15),4px 5px 0 rgba(26,16,48,.22);
  line-height:1.15;
}
.caret{
  display:inline-block;width:3px;height:.95em;background:#1a1030;
  vertical-align:middle;margin-left:3px;border-radius:2px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

#keyboard{display:flex;flex-direction:column;gap:.75vh;margin-top:1.6vh}
.krow{display:flex;gap:.55vw;justify-content:center}
.key{
  flex:1 1 0;min-width:0;
  height:5.6vh;min-height:36px;
  border:3px solid #1a1030;border-radius:13px;
  font-family:inherit;font-weight:700;
  font-size:clamp(14px,1.5vw,26px);
  color:#1a1030;cursor:pointer;
  box-shadow:0 5px 0 rgba(26,16,48,.45);
  transition:transform .07s,box-shadow .07s,filter .12s;
  padding:0;
}
.key:hover{filter:brightness(1.07)}
.key:active{transform:translateY(5px);box-shadow:0 0 0 rgba(26,16,48,.45)}
.key.wide{flex:0 0 15%;max-width:15%}
.key.space{flex:1 1 auto;max-width:none}
.key.shiftOn{background:linear-gradient(180deg,#FFD166,#F5A623)!important}

.navBtn{
  position:absolute;top:14px;z-index:6;
  width:52px;height:52px;border-radius:50%;
  border:4px solid #1a1030;background:rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 0 rgba(26,16,48,.4);
  transition:transform .1s,box-shadow .1s,background .2s,opacity .2s;
  padding:0;
}
.navBtn:hover{background:rgba(255,255,255,.6)}
.navBtn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(26,16,48,.4)}
.navBtn svg{width:24px;height:24px}
.navBtn.off{opacity:.28;pointer-events:none}
#backBtn{left:14px}
#nextBtn{right:14px}

#langBtn{
  position:fixed;left:10px;bottom:10px;z-index:60;
  border:2px solid rgba(26,16,48,.35);border-radius:10px;
  background:rgba(255,255,255,.22);
  font-family:inherit;font-weight:700;font-size:12px;color:rgba(26,16,48,.55);
  padding:4px 8px;cursor:pointer;opacity:.35;
  transition:opacity .2s;
}
#langBtn:hover{opacity:.85}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark{position:absolute;border-radius:50%;border:2px solid rgba(26,16,48,.5)}
</style>
</head>
<body>

<div class="shape s1"></div>
<div class="shape s2"></div>
<div class="shape s3"></div>
<div class="shape s4"></div>

<div id="stage">
  <div id="card">
    <button id="backBtn" class="navBtn" aria-label="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a1030" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H6M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <button id="nextBtn" class="navBtn" aria-label="next">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a1030" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M12 5l7 7-7 7"/>
      </svg>
    </button>
    <div id="sentence"><span id="line"></span></div>
    <div id="keyboard"></div>
  </div>
</div>

<button id="langBtn">RU</button>
<div id="fx"></div>

<script>
/* ============ DATA ============ */
const DATA = {
  uk: {
    rows: [
      "йцукенгшщзхї".split(""),
      "фівапролджє".split(""),
      "ячсмитьбюґ".split("")
    ],
    questions: [
      {b:"Моє ім'я — ", a:".", w:"олена"},
      {b:"Зранку я завжди вигулюю ", a:".", w:"собаку"},
      {b:"Я живу в місті ", a:".", w:"київ"},
      {b:"Цукерки я купляю в ", a:".", w:"магазині"},
      {b:"Мою маму звати ", a:".", w:"наталя"},
      {b:"Мій улюблений фрукт — ", a:".", w:"яблуко"},
      {b:"Мого пса звати ", a:".", w:"бім"},
      {b:"На сніданок я їм ", a:".", w:"кашу"},
      {b:"Моє прізвище — ", a:".", w:"шевченко"},
      {b:"У мене в рюкзаку лежить ", a:".", w:"зошит"},
      {b:"Мій найкращий друг — ", a:".", w:"максим"},
      {b:"Я люблю малювати ", a:".", w:"сонце"},
      {b:"Моє улюблене місто — ", a:".", w:"львів"},
      {b:"Я купую хліб у ", a:".", w:"пекарні"},
      {b:"Наша річка зветься ", a:".", w:"дніпро"},
      {b:"Мій день народження в ", a:".", w:"травні"},
      {b:"Моя сестра живе в ", a:".", w:"одесі"},
      {b:"Я мрію про ", a:".", w:"подорож"},
      {b:"Мій улюблений мультфільм — ", a:".", w:"мауглі"},
      {b:"Увечері я читаю ", a:".", w:"книжку"},
      {b:"Я живу на вулиці ", a:".", w:"садова"},
      {b:"Я п'ю чай з ", a:".", w:"медом"}
    ]
  },
  ru: {
    rows: [
      "йцукенгшщзхъ".split(""),
      "фывапролджэ".split(""),
      "ячсмитьбюё".split("")
    ],
    questions: [
      {b:"Моё имя — ", a:".", w:"олена"},
      {b:"Утром я всегда выгуливаю ", a:".", w:"собаку"},
      {b:"Я живу в городе ", a:".", w:"прага"},
      {b:"Конфеты я покупаю в ", a:".", w:"магазине"},
      {b:"Мою маму зовут ", a:".", w:"наталья"},
      {b:"Мой любимый фрукт — ", a:".", w:"яблоко"},
      {b:"Моего пса зовут ", a:".", w:"бим"},
      {b:"На завтрак я ем ", a:".", w:"кашу"},
      {b:"Моя фамилия — ", a:".", w:"иванов"},
      {b:"У меня в рюкзаке лежит ", a:".", w:"тетрадь"},
      {b:"Мой лучший друг — ", a:".", w:"максим"},
      {b:"Я люблю рисовать ", a:".", w:"солнце"},
      {b:"Мой любимый город — ", a:".", w:"рига"},
      {b:"Я покупаю хлеб в ", a:".", w:"пекарне"},
      {b:"Наша река называется ", a:".", w:"волга"},
      {b:"Мой день рождения в ", a:".", w:"мае"},
      {b:"Моя сестра живёт в ", a:".", w:"казани"},
      {b:"Я мечтаю о ", a:".", w:"путешествии"},
      {b:"Мой любимый мультфильм — ", a:".", w:"карлсон"},
      {b:"Вечером я читаю ", a:".", w:"книжку"},
      {b:"Я живу на улице ", a:".", w:"садовая"},
      {b:"Я пью чай с ", a:".", w:"мёдом"}
    ]
  }
};

const KEYCOLORS = ['#FFD166','#FF9F68','#FF7EB3','#C6A0FF','#8FD9FF','#9BE7A8','#FFE066','#FFA8D6','#A8E6FF','#FFC98F'];

/* ============ STATE ============ */
let lang = 'uk';
let pool = [];
let history = [];
let idx = -1;
let typed = '';
let shift = false;
let keyEls = [];
let shiftEl = null;

/* ============ AUDIO ============ */
let actx = null;
function AC(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, delay, dur, type, vol){
  const a = AC(); if(!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || .15, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.06);
}
function sfxKey(){ tone(520 + Math.random()*320, 0, .055, 'square', .05); }
function sfxNext(){ tone(700, 0, .07, 'sine', .09); tone(1050, .06, .12, 'sine', .07); }
function sfxBack(){ tone(620, 0, .07, 'sine', .08); tone(420, .06, .12, 'sine', .07); }
function sfxShift(){ tone(760, 0, .06, 'triangle', .06); }

/* ============ ELEMENTS ============ */
const lineEl = document.getElementById('line');
const kbEl = document.getElementById('keyboard');
const fxEl = document.getElementById('fx');
const langBtn = document.getElementById('langBtn');
const nextBtn = document.getElementById('nextBtn');
const backBtn = document.getElementById('backBtn');

/* ============ HELPERS ============ */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function pickQuestion(){
  if(!pool.length) pool = shuffle(DATA[lang].questions.slice());
  return pool.pop();
}

/* ============ KEYBOARD ============ */
function svgIcon(kind){
  if(kind === 'shift') return '<svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#1a1030" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V6M6 12l6-6 6 6"/></svg>';
  if(kind === 'back') return '<svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#1a1030" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6H9L3 12l6 6h11z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>';
  return '';
}

function buildKeyboard(){
  kbEl.innerHTML = '';
  keyEls = [];
  const rows = DATA[lang].rows;

  rows.forEach((row, ri)=>{
    const r = document.createElement('div');
    r.className = 'krow';
    row.forEach((ch, ci)=>{
      const k = document.createElement('button');
      k.className = 'key';
      k.type = 'button';
      k.dataset.ch = ch;
      k.textContent = shift ? ch.toUpperCase() : ch;
      const col = KEYCOLORS[(ri*7 + ci*3) % KEYCOLORS.length];
      k.style.background = 'linear-gradient(180deg,' + col + ',' + col + ')';
      k.addEventListener('click', ()=>pressLetter(ch));
      r.appendChild(k);
      keyEls.push(k);
    });
    kbEl.appendChild(r);
  });

  const bottom = document.createElement('div');
  bottom.className = 'krow';

  shiftEl = document.createElement('button');
  shiftEl.className = 'key wide';
  shiftEl.type = 'button';
  shiftEl.style.background = shift ? 'linear-gradient(180deg,#FFD166,#F5A623)' : 'linear-gradient(180deg,#C6A0FF,#A377F0)';
  shiftEl.innerHTML = svgIcon('shift');
  shiftEl.addEventListener('click', ()=>{
    shift = !shift;
    sfxShift();
    updateShiftUI();
  });

  const spaceEl = document.createElement('button');
  spaceEl.className = 'key space';
  spaceEl.type = 'button';
  spaceEl.style.background = 'linear-gradient(180deg,#FFFFFF,#E6E6F0)';
  spaceEl.textContent = '';
  spaceEl.addEventListener('click', ()=>addChar(' '));

  const backEl = document.createElement('button');
  backEl.className = 'key wide';
  backEl.type = 'button';
  backEl.style.background = 'linear-gradient(180deg,#FFB3B3,#FF7B7B)';
  backEl.innerHTML = svgIcon('back');
  backEl.addEventListener('click', delChar);

  bottom.append(shiftEl, spaceEl, backEl);
  kbEl.appendChild(bottom);
}

function updateShiftUI(){
  keyEls.forEach(k=>{
    const ch = k.dataset.ch;
    k.textContent = shift ? ch.toUpperCase() : ch;
  });
  if(shiftEl){
    shiftEl.style.background = shift
      ? 'linear-gradient(180deg,#FFD166,#F5A623)'
      : 'linear-gradient(180deg,#C6A0FF,#A377F0)';
  }
}

/* ============ INPUT ============ */
function setTyped(v){
  typed = v;
  if(idx >= 0 && history[idx]) history[idx].typed = v;
}
function pressLetter(ch){
  AC();
  if(typed.length >= 40) return;
  setTyped(typed + (shift ? ch.toUpperCase() : ch));
  if(shift){ shift = false; updateShiftUI(); }
  sfxKey();
  updateAnswer();
  popBlank();
}
function addChar(ch){
  AC();
  if(typed.length >= 40) return;
  setTyped(typed + ch);
  sfxKey();
  updateAnswer();
  popBlank();
}
function delChar(){
  if(!typed) return;
  setTyped(typed.slice(0, -1));
  tone(320, 0, .06, 'square', .05);
  updateAnswer();
}
function popBlank(){
  const b = document.getElementById('blank');
  if(!b) return;
  b.animate(
    [{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],
    {duration:130, easing:'ease-out'}
  );
}

/* ============ RENDER ============ */
function renderQuestion(){
  const q = history[idx].q;
  lineEl.innerHTML = '';

  const before = document.createElement('span');
  before.textContent = q.b;

  const blank = document.createElement('span');
  blank.className = 'blank';
  blank.id = 'blank';

  const ans = document.createElement('span');
  ans.className = 'answer';
  ans.id = 'answerText';

  const caret = document.createElement('span');
  caret.className = 'caret';

  blank.append(ans, caret);

  const after = document.createElement('span');
  after.textContent = q.a;

  lineEl.append(before, blank, after);
  updateAnswer();
}
function updateAnswer(){
  const el = document.getElementById('answerText');
  if(el) el.textContent = typed;
}

/* ============ NAVIGATION ============ */
function goNext(silent){
  if(idx >= 0 && history[idx]) history[idx].typed = typed;
  if(idx < history.length - 1){
    idx++;
  } else {
    history.push({q: pickQuestion(), typed: ''});
    idx = history.length - 1;
  }
  typed = history[idx].typed;
  shift = false;
  updateShiftUI();
  renderQuestion();
  updateNav();
  if(!silent) sfxNext();
}
function goBack(){
  if(idx <= 0) return;
  if(history[idx]) history[idx].typed = typed;
  idx--;
  typed = history[idx].typed;
  renderQuestion();
  updateNav();
  sfxBack();
}
function updateNav(){
  backBtn.classList.toggle('off', idx <= 0);
}

/* ============ SPARKLE (на перехід) ============ */
function sparkles(){
  const colors = ['#FFD166','#FF7EB3','#8FD9FF','#9BE7A8','#C6A0FF','#FF9F68'];
  for(let i = 0; i < 12; i++){
    const s = document.createElement('i');
    s.className = 'spark';
    const size = 7 + Math.random()*10;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (15 + Math.random()*70) + 'vw';
    s.style.top = (35 + Math.random()*30) + 'vh';
    s.style.background = colors[i % colors.length];
    fxEl.appendChild(s);
    const dur = 620 + Math.random()*420;
    const anim = s.animate([
      {transform:'scale(.2)', opacity:1},
      {transform:'scale(1.8) translateY(-30px)', opacity:0}
    ], {duration: dur, easing:'cubic-bezier(.2,.8,.4,1)'});
    anim.onfinish = ()=> s.remove();
  }
}

/* ============ PHYSICAL KEYBOARD ============ */
window.addEventListener('keydown', e=>{
  if(e.key === 'Tab') return;
  if(e.key === 'Backspace'){
    e.preventDefault();
    AC();
    delChar();
    return;
  }
  if(e.key === 'Enter'){
    e.preventDefault();
    AC();
    goNext();
    return;
  }
  if(e.key.length === 1){
    const isCyr = /^[а-яёіїєґъыэ]$/i.test(e.key);
    const isAllowed = isCyr || e.key === ' ' || e.key === "'" || e.key === '’' || e.key === '-' || e.key === '’';
    if(isAllowed){
      e.preventDefault();
      AC();
      addChar(e.key);
    }
  }
});

/* ============ BUTTONS ============ */
nextBtn.addEventListener('click', ()=>{
  AC();
  sparkles();
  goNext();
});
backBtn.addEventListener('click', ()=>{
  AC();
  goBack();
});

langBtn.addEventListener('click', ()=>{
  AC();
  lang = (lang === 'uk') ? 'ru' : 'uk';
  langBtn.textContent = (lang === 'uk') ? 'RU' : 'UA';
  document.documentElement.lang = lang;
  history = [];
  idx = -1;
  pool = [];
  typed = '';
  buildKeyboard();
  goNext(true);
  sfxNext();
});

/* ============ INIT ============ */
buildKeyboard();
goNext(true);

document.addEventListener('pointerdown', ()=>{ AC(); }, {once:true});
</script>
</body>
</html>
