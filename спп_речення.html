<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jungle Expedition</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #072118;
    font-family: 'Rubik', sans-serif;
    touch-action: none;
  }

  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Full-screen living background canvas */
  #bg-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Foreground celebration & particle canvas */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 35;
    pointer-events: none;
  }

  /* Main 16:9 Widescreen Interactive Stage */
  #stage-container {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    max-width: 177.78vh; /* 16:9 aspect ratio cap when height-constrained */
    max-height: 56.25vw; /* 16:9 aspect ratio cap when width-constrained */
    aspect-ratio: 16 / 9;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5% 2.5%;
  }

  @media (max-aspect-ratio: 4/3) {
    #stage-container {
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: auto;
      padding: 2% 2%;
    }
  }

  /* Top bar with sentence plank and minimalist controls */
  .top-hud {
    position: relative;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1.2vw;
    z-index: 25;
  }

  /* Carved wooden sentence board - NO white rectangles! */
  .sentence-board-wrap {
    flex: 1;
    position: relative;
    filter: drop-shadow(0 12px 20px rgba(4, 22, 14, 0.75));
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .sentence-svg-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .sentence-content {
    position: relative;
    z-index: 2;
    padding: clamp(14px, 2.1vh, 28px) clamp(24px, 3.2vw, 54px);
    min-height: clamp(74px, 12.5vh, 130px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.45em 0.38em;
    font-size: clamp(1.05rem, 2.05vw, 2.05rem);
    font-weight: 800;
    color: #fff6d6;
    text-shadow: 0 3px 0 #3a1f0b, 0 5px 10px rgba(0,0,0,0.65);
    line-height: 1.35;
    text-align: center;
  }

  /* Interactive carved slot inside sentence */
  .word-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: clamp(135px, 14.5vw, 250px);
    height: clamp(38px, 5.6vh, 62px);
    padding: 0 18px;
    margin: 0 4px;
    border-radius: 18px;
    background: radial-gradient(ellipse at center, #261407 0%, #160b03 100%);
    border: 3px dashed #f59e0b;
    box-shadow: inset 0 5px 12px rgba(0,0,0,0.85), 0 0 16px rgba(245, 158, 11, 0.4);
    color: #fde68a;
    font-weight: 900;
    letter-spacing: 0.02em;
    transition: all 0.25s ease;
    position: relative;
    vertical-align: middle;
  }

  .word-slot.highlight-drop {
    transform: scale(1.09);
    border-color: #4ade80;
    background: radial-gradient(ellipse at center, #144225 0%, #0a2614 100%);
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.7), 0 0 26px rgba(74, 222, 128, 0.85);
  }

  .word-slot.filled {
    background: linear-gradient(135deg, #f59e0b 0%, #d97706 55%, #b45309 100%);
    border: 3px solid #fef08a;
    color: #291303;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    box-shadow: 0 5px 0 #78350f, 0 0 28px rgba(253, 224, 71, 0.85);
    transform: scale(1.06);
  }

  /* Minimalist Top-Right Carved Stone / Wood Buttons */
  .hud-controls {
    display: flex;
    flex-direction: row;
    gap: clamp(8px, 1vw, 16px);
    align-items: center;
    padding-top: 4px;
  }

  .jungle-btn {
    position: relative;
    width: clamp(54px, 5.2vw, 78px);
    height: clamp(54px, 5.2vw, 78px);
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.6));
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
  }

  .jungle-btn:hover {
    transform: translateY(-3px) scale(1.07);
    filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.75)) brightness(1.08);
  }

  .jungle-btn:active {
    transform: translateY(2px) scale(0.95);
  }

  /* Middle Interactive Story Scene SVG */
  #scene-stage {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #scene-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Interactive animal group inside SVG */
  .animal-actor {
    cursor: pointer;
    transition: filter 0.25s ease;
  }

  .animal-actor:hover {
    filter: drop-shadow(0 0 18px rgba(253, 224, 71, 0.55));
  }

  /* Bottom Interactive Story Options (Lotus pads / Tribal Drums / Tropical Fruits) */
  .options-dock {
    position: relative;
    z-index: 30;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: clamp(12px, 2.5vw, 42px);
    padding: 0.4vh 2vw 0.8vh;
  }

  .option-card {
    position: relative;
    width: clamp(200px, 26vw, 390px);
    height: clamp(78px, 12.5vh, 128px);
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 10px 16px rgba(3, 18, 12, 0.75));
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
    touch-action: none;
  }

  .option-card:hover {
    transform: translateY(-8px) scale(1.05);
    filter: drop-shadow(0 16px 24px rgba(3, 18, 12, 0.85)) brightness(1.06);
  }

  .option-card:active {
    cursor: grabbing;
  }

  .option-card.dragging {
    z-index: 100;
    transition: none;
    filter: drop-shadow(0 24px 32px rgba(0, 0, 0, 0.85)) brightness(1.12);
  }

  .option-card.wrong-shake {
    animation: comicalWobble 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  .option-svg-art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .option-label {
    position: relative;
    z-index: 2;
    font-size: clamp(1.1rem, 2vw, 2rem);
    font-weight: 900;
    color: #fffbeb;
    text-shadow: 0 3px 0 #1f1206, 0 4px 10px rgba(0,0,0,0.8);
    padding: 0 18px;
    text-align: center;
    pointer-events: none;
    line-height: 1.1;
  }

  @keyframes comicalWobble {
    0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
    15% { transform: translateX(-16px) rotate(-7deg) scale(0.95); }
    30% { transform: translateX(14px) rotate(6deg) scale(1.04); }
    45% { transform: translateX(-12px) rotate(-5deg) scale(0.97); }
    60% { transform: translateX(9px) rotate(4deg) scale(1.02); }
    75% { transform: translateX(-5px) rotate(-2deg) scale(0.99); }
  }

  @keyframes floatPulse {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }

  .floating-anim {
    animation: floatPulse 3.2s ease-in-out infinite;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <!-- Multi-layer living tropical waterfall & river background canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Main Widescreen Interactive Stage -->
  <div id="stage-container">
    <!-- Top HUD: Carved Wooden Sentence Board + Minimalist Language & Next Buttons -->
    <div class="top-hud">
      <div class="sentence-board-wrap" id="sentence-board">
        <!-- Rich SVG Wood & Vine Texture Background (Zero White Rectangles) -->
        <svg class="sentence-svg-bg" viewBox="0 0 1200 160" preserveAspectRatio="none">
          <defs>
            <linearGradient id="woodPlankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#6b3e1b"/>
              <stop offset="25%" stop-color="#542e11"/>
              <stop offset="75%" stop-color="#42220b"/>
              <stop offset="100%" stop-color="#2b1405"/>
            </linearGradient>
            <linearGradient id="woodRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#9c5f2d"/>
              <stop offset="50%" stop-color="#754219"/>
              <stop offset="100%" stop-color="#3d1e07"/>
            </linearGradient>
            <linearGradient id="leafVineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4ade80"/>
              <stop offset="60%" stop-color="#16a34a"/>
              <stop offset="100%" stop-color="#14532d"/>
            </linearGradient>
          </defs>
          <!-- Outer carved timber frame -->
          <path d="M 28,12 Q 600,2 1172,12 Q 1194,25 1190,80 Q 1194,135 1172,148 Q 600,158 28,148 Q 6,135 10,80 Q 6,25 28,12 Z"
                fill="url(#woodRimGrad)" stroke="#1f0d02" stroke-width="5"/>
          <!-- Inner recessed dark mahogany face -->
          <path d="M 38,22 Q 600,14 1162,22 Q 1180,34 1176,80 Q 1180,126 1162,138 Q 600,146 38,138 Q 20,126 24,80 Q 20,34 38,22 Z"
                fill="url(#woodPlankGrad)" stroke="#854d23" stroke-width="2.5"/>
          <!-- Wood grain grooves -->
          <path d="M 55,42 Q 350,32 680,45 T 1145,40" fill="none" stroke="#2f1706" stroke-width="2.2" opacity="0.65"/>
          <path d="M 45,115 Q 420,126 790,112 T 1150,120" fill="none" stroke="#2f1706" stroke-width="2.5" opacity="0.65"/>
          <path d="M 90,78 Q 280,68 490,82" fill="none" stroke="#854d23" stroke-width="1.5" opacity="0.35"/>
          <!-- Corner gold rivets & tropical vine wraps -->
          <circle cx="48" cy="42" r="7" fill="#d97706" stroke="#451a03" stroke-width="2"/>
          <circle cx="1152" cy="42" r="7" fill="#d97706" stroke="#451a03" stroke-width="2"/>
          <circle cx="48" cy="118" r="7" fill="#d97706" stroke="#451a03" stroke-width="2"/>
          <circle cx="1152" cy="118" r="7" fill="#d97706" stroke="#451a03" stroke-width="2"/>
          <!-- Decorative tropical vine & leaves on left/right edges -->
          <path d="M 12,35 Q 45,10 95,22 Q 60,42 12,35 Z" fill="url(#leafVineGrad)" stroke="#052e16" stroke-width="2"/>
          <path d="M 18,45 Q 68,38 78,68 Q 38,68 18,45 Z" fill="url(#leafVineGrad)" stroke="#052e16" stroke-width="2"/>
          <path d="M 1188,35 Q 1155,10 1105,22 Q 1140,42 1188,35 Z" fill="url(#leafVineGrad)" stroke="#052e16" stroke-width="2"/>
          <path d="M 1182,125 Q 1135,148 1095,134 Q 1135,112 1182,125 Z" fill="url(#leafVineGrad)" stroke="#052e16" stroke-width="2"/>
          <!-- Small hibiscus flower accent on top-left corner -->
          <g transform="translate(30, 22)">
            <circle cx="-6" cy="-4" r="8" fill="#f43f5e"/>
            <circle cx="6" cy="-4" r="8" fill="#fb7185"/>
            <circle cx="7" cy="6" r="8" fill="#e11d48"/>
            <circle cx="-5" cy="7" r="8" fill="#f43f5e"/>
            <circle cx="0" cy="1" r="5" fill="#fde047"/>
          </g>
        </svg>

        <!-- Dynamic Sentence Container -->
        <div class="sentence-content" id="sentence-text"></div>
      </div>

      <!-- Minimalist Controls: Language Button (УКР / РУС) & Next Button (Arrow Icon Only) -->
      <div class="hud-controls">
        <!-- Language Toggle Button -->
        <button class="jungle-btn" id="lang-btn" aria-label="Language">
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <defs>
              <radialGradient id="amberStoneGrad" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#fbbf24"/>
                <stop offset="55%" stop-color="#d97706"/>
                <stop offset="100%" stop-color="#78350f"/>
              </radialGradient>
            </defs>
            <!-- Carved hexagonal jungle medallion -->
            <polygon points="50,5 90,24 94,70 50,95 6,70 10,24" fill="url(#amberStoneGrad)" stroke="#2c1203" stroke-width="5" stroke-linejoin="round"/>
            <polygon points="50,13 82,29 85,66 50,86 15,66 18,29" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.55"/>
            <!-- Small leaf crown -->
            <path d="M 32,12 Q 50,0 68,12 Q 50,20 32,12 Z" fill="#22c55e" stroke="#052e16" stroke-width="2.5"/>
            <text id="lang-label" x="50" y="61" text-anchor="middle" fill="#291002" font-family="Rubik, sans-serif" font-weight="900" font-size="28" stroke="#fef3c7" stroke-width="1" paint-order="stroke">УКР</text>
          </svg>
        </button>

        <!-- Minimalist "Next" Button (Icon only, no text) -->
        <button class="jungle-btn" id="next-btn" aria-label="Next">
          <svg viewBox="0 0 100 100" width="100%" height="100%">
            <defs>
              <radialGradient id="emeraldStoneGrad" cx="35%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#4ade80"/>
                <stop offset="55%" stop-color="#16a34a"/>
                <stop offset="100%" stop-color="#064e3b"/>
              </radialGradient>
            </defs>
            <polygon points="50,5 90,24 94,70 50,95 6,70 10,24" fill="url(#emeraldStoneGrad)" stroke="#042f1d" stroke-width="5" stroke-linejoin="round"/>
            <polygon points="50,13 82,29 85,66 50,86 15,66 18,29" fill="none" stroke="#bbf7d0" stroke-width="2" opacity="0.55"/>
            <!-- Carved Golden Arrow Icon -->
            <path d="M 26,42 L 54,42 L 54,27 L 80,50 L 54,73 L 54,58 L 26,58 Z"
                  fill="#fde047" stroke="#422006" stroke-width="4" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Center Interactive Story Stage (Animals, Rocks, Bridges, Bamboo, Waterfalls) -->
    <div id="scene-stage">
      <svg id="scene-svg" viewBox="0 0 1600 620" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <!-- Bottom Interactive Options Dock (3 Degrees of Comparison on Jungle Objects) -->
    <div class="options-dock" id="options-dock"></div>
  </div>

  <!-- Foreground Celebration & Leaf/Mango/Splash Particle Canvas -->
  <canvas id="fx-canvas"></canvas>
</div>

<script>
/* ============================================================================
   1. SYNTHESIZED WEB AUDIO API SOUND ENGINE (Rich Tropical Marimba, Birds, Water)
   ============================================================================ */
class JungleAudioEngine {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Wooden marimba / xylophone strike
  playMarimba(freq, startTime = 0, duration = 0.28, vol = 0.22) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime + startTime;
    const osc = this.ctx.createOscillator();
    const overtone = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    // 4th harmonic gives authentic rosewood marimba timbre
    overtone.type = 'triangle';
    overtone.frequency.setValueAtTime(freq * 4, now);

    const overGain = this.ctx.createGain();
    overGain.gain.setValueAtTime(vol * 0.25, now);
    overGain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.35);

    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(gain);
    overtone.connect(overGain);
    overGain.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    overtone.start(now);
    osc.stop(now + duration + 0.02);
    overtone.stop(now + duration + 0.02);
  }

  // Hover subtle wooden click / drum tap
  playHover() {
    this.playMarimba(523.25, 0, 0.09, 0.09);
  }

  // Animal pet / poke chirp
  playAnimalVoice(animalType) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    if (animalType === 'frog') {
      // Ribbit croak
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.09);
      osc.frequency.setValueAtTime(210, now + 0.12);
      osc.frequency.exponentialRampToValueAtTime(480, now + 0.22);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.26);
    } else if (animalType === 'toucan' || animalType === 'macaw') {
      // Tropical bird whistle
      osc.type = 'sine';
      osc.frequency.setValueAtTime(950, now);
      osc.frequency.exponentialRampToValueAtTime(1750, now + 0.11);
      osc.frequency.exponentialRampToValueAtTime(1120, now + 0.24);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    } else if (animalType === 'monkey') {
      // Playful ooh-aah
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.1);
      osc.frequency.setValueAtTime(520, now + 0.13);
      osc.frequency.exponentialRampToValueAtTime(860, now + 0.25);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    } else {
      // Warm bongo & purr
      this.playMarimba(293.66, 0, 0.18, 0.2);
      this.playMarimba(440.0, 0.07, 0.22, 0.2);
    }
  }

  // Water splash noise burst
  playSplash(delay = 0) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const bufferSize = this.ctx.sampleRate * 0.38;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.12));
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(900, now);
    filter.frequency.exponentialRampToValueAtTime(2400, now + 0.35);
    filter.Q.value = 1.8;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }

  // Comical non-verbal wrong feedback sound (boing + slide)
  playWrongBoing() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(310, now);
    osc.frequency.exponentialRampToValueAtTime(145, now + 0.18);
    osc.frequency.exponentialRampToValueAtTime(230, now + 0.28);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.45);

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(900, now);

    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.47);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.48);

    // Add hollow wood knock
    this.playMarimba(175, 0.05, 0.15, 0.2);
  }

  // 4 Distinct Celebratory Fanfares matching the 4 visual celebration modes
  playCelebrationFanfare(modeIndex) {
    this.init();
    if (!this.ctx) return;

    if (modeIndex === 0) {
      // 1. Waterfall Rainbow Calypso Marimba + Splash
      const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50, 1318.51];
      notes.forEach((n, i) => this.playMarimba(n, i * 0.085, 0.32, 0.24));
      this.playSplash(0.15);
      this.playSplash(0.45);
    } else if (modeIndex === 1) {
      // 2. Golden Mango Shower & Jungle Flute / Drum Riff
      const notes = [440, 554.37, 659.25, 880, 659.25, 880, 1108.73];
      notes.forEach((n, i) => this.playMarimba(n, i * 0.08, 0.3, 0.24));
      this.playAnimalVoice('monkey');
    } else if (modeIndex === 2) {
      // 3. Bioluminescent Orchid Magical Kalimba Arpeggio
      const notes = [587.33, 739.99, 880, 1174.66, 1479.98, 1760.0];
      notes.forEach((n, i) => this.playMarimba(n, i * 0.09, 0.42, 0.22));
    } else {
      // 4. Scarlet Macaw Flyover & Tribal Sun Totem Fanfare
      const notes = [392.00, 493.88, 587.33, 783.99, 987.77, 1174.66];
      notes.forEach((n, i) => this.playMarimba(n, i * 0.085, 0.35, 0.25));
      setTimeout(() => this.playAnimalVoice('macaw'), 220);
    }
  }
}

// Helper: Carved Mayan/Jungle Mossy Pedestal Stone
function buildMossyStone(x, y, width = 260, height = 110, badgeCount = 0) {
  const hw = width / 2;
  let starsMarkup = '';
  for (let i = 0; i < badgeCount; i++) {
    const sx = (i - (badgeCount - 1) / 2) * 34;
    starsMarkup += `
      <g transform="translate(${sx}, ${height * 0.48})">
        <polygon points="0,-13 4,-4 14,-4 6,2 9,12 0,6 -9,12 -6,2 -14,-4 -4,-4"
                 fill="#fde047" stroke="#78350f" stroke-width="2"/>
      </g>`;
  }

  return `
  <g transform="translate(${x}, ${y})">
    <!-- Water ripples around base -->
    <ellipse cx="0" cy="${height - 8}" rx="${hw + 35}" ry="18" fill="none" stroke="rgba(186,230,253,0.45)" stroke-width="3"/>

/* ============================================================================
   6. GAME STATE, ENDLESS GENERATOR, DRAG & DROP + CLICK CONTROLLER
   ============================================================================ */
let currentLang = 'uk'; // 'uk' or 'ru'
let taskQueue = [];
let currentTask = null;
let isLocked = false;
let celebrationCycle = 0;

// Pointer tracking for animal eyes & drag-and-drop
const pointerPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function getNextTaskFromGenerator() {
  if (taskQueue.length === 0) {
    // Endless shuffled generator ensuring balanced distribution across all 21 tasks
    taskQueue = shuffleArray(TASKS_DB);
    // Avoid immediate repeat of the very last task
    if (currentTask && taskQueue[0].id === currentTask.id) {
      taskQueue.push(taskQueue.shift());
    }
  }
  const rawTask = taskQueue.shift();
  // Create a shuffled option order so the correct degree isn't always in the same slot
  const indices = shuffleArray([0, 1, 2]);
  return {
    ...rawTask,
    shuffledIndices: indices
  };
}

function renderSentenceBoard(task, filledWord = null) {
  const langData = task[currentLang];
  const container = document.getElementById('sentence-text');

  const slotClasses = filledWord ? 'word-slot filled' : 'word-slot';
  const slotContent = filledWord ? filledWord : '• • •';

  container.innerHTML = `
    <span>${langData.before}</span>
    <span class="${slotClasses}" id="target-slot">${slotContent}</span>
    <span>${langData.after}</span>
  `;
}

function renderOptionsDock(task) {
  const dock = document.getElementById('options-dock');
  const langData = task[currentLang];
  dock.innerHTML = '';

  task.shuffledIndices.forEach((origIdx, visualPos) => {
    const wordText = langData.options[origIdx];
    const card = document.createElement('div');
    card.className = 'option-card';
    card.dataset.origIndex = origIdx;
    card.innerHTML = `
      ${buildOptionSVG(task.propType, visualPos)}
      <span class="option-label">${wordText}</span>
    `;

    // Hover sound & expectant animal head/eye attention
    card.addEventListener('pointerenter', () => {
      if (!isLocked) sound.playHover();
    });

    // Support both click/tap AND drag-and-drop onto the sentence slot or hero animal!
    setupOptionInteraction(card, origIdx);
    dock.appendChild(card);
  });
}

function setupOptionInteraction(card, origIdx) {
  let startX = 0;
  let startY = 0;
  let isDragging = false;

  const onPointerDown = (e) => {
    if (isLocked) return;
    sound.init();
    startX = e.clientX;
    startY = e.clientY;
    isDragging = true;
    card.setPointerCapture(e.pointerId);
    card.classList.add('dragging');
  };

  const onPointerMove = (e) => {
    if (!isDragging || isLocked) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    card.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`;

    // Check proximity to sentence slot or hero animal for highlight feedback
    const slotEl = document.getElementById('target-slot');
    if (slotEl) {
      const slotRect = slotEl.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      const dist = Math.hypot(
        (cardRect.left + cardRect.width / 2) - (slotRect.left + slotRect.width / 2),
        (cardRect.top + cardRect.height / 2) - (slotRect.top + slotRect.height / 2)
      );
      if (dist < 170) {
        slotEl.classList.add('highlight-drop');
      } else {
        slotEl.classList.remove('highlight-drop');
      }
    }
  };

  const onPointerUp = (e) => {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove('dragging');
    const slotEl = document.getElementById('target-slot');
    if (slotEl) slotEl.classList.remove('highlight-drop');

    const moveDist = Math.hypot(e.clientX - startX, e.clientY - startY);
    let shouldEvaluate = false;

    if (moveDist < 18) {
      // Quick click / tap!
      shouldEvaluate = true;
    } else {
      // Released after dragging: check if dropped near the upper 72% of screen (scene or sentence board)
      if (e.clientY < window.innerHeight * 0.76) {
        shouldEvaluate = true;
      }
    }

    card.style.transform = '';
    if (shouldEvaluate && !isLocked) {
      evaluateChoice(card, origIdx);
    }
  };

  card.addEventListener('pointerdown', onPointerDown);
  card.addEventListener('pointermove', onPointerMove);
  card.addEventListener('pointerup', onPointerUp);
  card.addEventListener('pointercancel', onPointerUp);
}

function evaluateChoice(cardEl, chosenOrigIndex) {
  if (isLocked) return;
  const langData = currentTask[currentLang];
  const chosenWord = langData.options[chosenOrigIndex];

  if (chosenOrigIndex === currentTask.correctIndex) {
    // CORRECT CHOICE!
    isLocked = true;
    renderSentenceBoard(currentTask, chosenWord);

    // Hide dock options gracefully
    document.querySelectorAll('.option-card').forEach(el => {
      el.style.pointerEvents = 'none';
      if (el === cardEl) {
        el.style.transform = 'scale(0.1)';
        el.style.opacity = '0';
      } else {
        el.style.opacity = '0.35';
      }
    });

    // Trigger one of the 4 rich visual + Web Audio celebrations!
    const mode = celebrationCycle % 4;
    celebrationCycle++;
    sound.playCelebrationFanfare(mode);
    triggerCelebrationSequence(mode);

    setTimeout(() => {
      loadNextTask();
    }, 2500);

  } else {
    // WRONG CHOICE: Comical non-verbal physical reaction + leaf confetti burst
    sound.playWrongBoing();
    cardEl.classList.remove('wrong-shake');
    void cardEl.offsetWidth;
    cardEl.classList.add('wrong-shake');

    // Spawn harmless falling jungle leaf confetti from the wobbling option card
    const rect = cardEl.getBoundingClientRect();
    spawnLeafBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 16);

    // Comical animal head shake / cheek puff reaction
    const heroActor = document.getElementById('hero-actor');
    if (heroActor) {
      heroActor.animate([
        { transform: heroActor.getAttribute('transform') + ' rotate(0deg) scale(1)' },
        { transform: heroActor.getAttribute('transform') + ' rotate(-9deg) scale(1.06, 0.92)' },
        { transform: heroActor.getAttribute('transform') + ' rotate(9deg) scale(0.95, 1.05)' },
        { transform: heroActor.getAttribute('transform') + ' rotate(-6deg) scale(1.03, 0.97)' },
        { transform: heroActor.getAttribute('transform') + ' rotate(0deg) scale(1)' }
      ], { duration: 540, easing: 'ease-in-out' });
    }
  }
}

function loadNextTask() {
  isLocked = false;
  activeCelebration = null;
  currentTask = getNextTaskFromGenerator();
  // Shift atmospheric jungle lighting subtly per task
  cycleJunglePalette();
  renderSentenceBoard(currentTask, null);
  renderTaskScene(currentTask);
  renderOptionsDock(currentTask);
}

// Foreground celebration particles
let fxParticles = [];

function spawnLeafBurst(x, y, count = 16) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
    const speed = 3 + Math.random() * 7;
    fxParticles.push({
      type: 'leaf',
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.18,
      size: 11 + Math.random() * 10,
      color: ['#4ade80', '#22c55e', '#a3e635', '#facc15'][i % 4],
      life: 1.0
    });
  }
}

// Triggers 1 of 4 rich non-verbal celebratory animations!
function triggerCelebrationSequence(mode) {
  activeCelebration = {
    mode,
    startTime: performance.now(),
    duration: 2400
  };

  // Animate all animals in the scene with joyful synchronized backflips / hops
  document.querySelectorAll('.animal-actor').forEach((actor, idx) => {
    const body = actor.querySelector('.animal-body-group');
    if (body) {
      body.animate([
        { transform: 'translateY(0) scale(1)' },
        { transform: 'translateY(-75px) rotate(-180deg) scale(1.15)' },
        { transform: 'translateY(-95px) rotate(-360deg) scale(1.18)' },
        { transform: 'translateY(0) rotate(-360deg) scale(1)' }
      ], {
        duration: 850,
        delay: idx * 110,
        iterations: 2,
        easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
      });
    }
    // If chameleon is present, shoot its tongue playfully!
    const tongue = actor.querySelector('.cham-tongue');
    if (tongue) {
      tongue.animate([
        { d: 'path("M 28,12 L 32,12")' },
        { d: 'path("M 28,12 L 165,-35")' },
        { d: 'path("M 28,12 L 32,12")' }
      ], { duration: 600 });
    }
  });

  if (mode === 0) {
    // Mode 0: Waterfall Rainbow + Fountain Splash Droplets
    for (let i = 0; i < 65; i++) {
      fxParticles.push({
        type: 'droplet',
        x: cw * (0.2 + Math.random() * 0.6),
        y: ch * 0.72,
        vx: (Math.random() - 0.5) * 9,
        vy: -9 - Math.random() * 11,
        size: 6 + Math.random() * 9,
        color: ['#38bdf8', '#bae6fd', '#fde047', '#4ade80'][i % 4],
        life: 1.0
      });
    }
  } else if (mode === 1) {
    // Mode 1: Golden Mango, Starfruit & Hibiscus Canopy Shower
    for (let i = 0; i < 38; i++) {
      fxParticles.push({
        type: i % 2 === 0 ? 'mango' : 'flower',
        x: cw * (0.08 + Math.random() * 0.84),
        y: -30 - Math.random() * 180,
        vx: (Math.random() - 0.5) * 3,
        vy: 3 + Math.random() * 5,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.1,
        size: 16 + Math.random() * 12,
        color: ['#f97316', '#facc15', '#fb7185', '#f43f5e'][i % 4],
        life: 1.0
      });
    }
  } else if (mode === 2) {
    // Mode 2: Blooming Bioluminescent Orchids & Firefly Vortex
    for (let i = 0; i < 70; i++) {
      const angle = Math.random() * Math.PI * 2;
      fxParticles.push({
        type: 'firefly',
        x: cw * 0.5 + Math.cos(angle) * (50 + Math.random() * 350),
        y: ch * 0.55 + Math.sin(angle) * (40 + Math.random() * 200),
        vx: (Math.random() - 0.5) * 4,
        vy: -1.5 - Math.random() * 3.5,
        size: 5 + Math.random() * 8,
        color: ['#fde047', '#bef264', '#2dd4bf', '#f472b6'][i % 4],
        life: 1.0
      });
    }
  } else {
    // Mode 3: Scarlet Macaw Parade & Golden Sunburst Feathers
    for (let i = 0; i < 45; i++) {
      fxParticles.push({
        type: 'leaf',
        x: cw * 0.5 + (Math.random() - 0.5) * 500,
        y: ch * 0.45 + (Math.random() - 0.5) * 200,
        vx: (Math.random() - 0.5) * 10,
        vy: -4 - Math.random() * 7,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.15,
        size: 14 + Math.random() * 12,
        color: ['#ef4444', '#facc15', '#3b82f6', '#22c55e'][i % 4],
        life: 1.0
      });
    }
  }
}

function drawBackground(time) {
  const pal = JUNGLE_PALETTES[paletteIdx];

  // 1. Lush Jungle Canopy Sky Gradient
  const skyGrad = bgCtx.createLinearGradient(0, 0, 0, ch * 0.68);
  skyGrad.addColorStop(0, pal.skyTop);
  skyGrad.addColorStop(1, pal.skyBot);
  bgCtx.fillStyle = skyGrad;
  bgCtx.fillRect(0, 0, cw, ch);

  // 2. Shimmering Golden Sunbeams filtering through canopy
  bgCtx.save();
  bgCtx.fillStyle = pal.rayColor;
  for (let i = 0; i < 4; i++) {
    const sway = Math.sin(time * 0.0007 + i) * 35;
    const rx = cw * (0.15 + i * 0.24) + sway;
    bgCtx.beginPath();
    bgCtx.moveTo(rx, 0);
    bgCtx.lineTo(rx + 95, 0);
    bgCtx.lineTo(rx + 260, ch);
    bgCtx.lineTo(rx + 80, ch);
    bgCtx.closePath();
    bgCtx.fill();
  }
  bgCtx.restore();

  // 3. Distant Jungle Cliffs & Lush Foliage Silhouettes
  bgCtx.fillStyle = '#063726';
  bgCtx.beginPath();
  bgCtx.moveTo(0, ch * 0.62);
  bgCtx.quadraticCurveTo(cw * 0.18, ch * 0.25, cw * 0.36, ch * 0.52);
  bgCtx.quadraticCurveTo(cw * 0.5, ch * 0.18, cw * 0.66, ch * 0.52);
  bgCtx.quadraticCurveTo(cw * 0.84, ch * 0.24, cw, ch * 0.58);
  bgCtx.lineTo(cw, ch);
  bgCtx.lineTo(0, ch);
  bgCtx.closePath();
  bgCtx.fill();

  // 4. Center Grand Cascading Waterfall
  const wfX = cw * 0.5;
  const wfTop = ch * 0.26;
  const wfBot = ch * 0.64;
  const wfGrad = bgCtx.createLinearGradient(wfX, wfTop, wfX, wfBot);
  wfGrad.addColorStop(0, 'rgba(186, 230, 253, 0.75)');
  wfGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.65)');
  wfGrad.addColorStop(1, 'rgba(14, 165, 233, 0.85)');
  bgCtx.fillStyle = wfGrad;
  bgCtx.beginPath();
  bgCtx.moveTo(wfX - 95, wfTop);
  bgCtx.lineTo(wfX + 95, wfTop);
  bgCtx.lineTo(wfX + 130, wfBot);
  bgCtx.lineTo(wfX - 130, wfBot);
  bgCtx.closePath();
  bgCtx.fill();

  // Animated Waterfall Streams
  bgCtx.strokeStyle = 'rgba(240, 249, 255, 0.7)';
  bgCtx.lineWidth = 4;
  bgCtx.lineCap = 'round';
  waterfallDrops.forEach(d => {
    d.yRatio = (d.yRatio + d.speed) % 1;
    const x = wfX + d.xOffset * (0.85 + d.yRatio * 0.3);
    const y = wfTop + d.yRatio * (wfBot - wfTop);
    bgCtx.globalAlpha = d.alpha;
    bgCtx.beginPath();
    bgCtx.moveTo(x, y);
    bgCtx.lineTo(x, Math.min(wfBot, y + d.length));
    bgCtx.stroke();
  });
  bgCtx.globalAlpha = 1;

  // Waterfall Plunge Foam Clouds
  for (let i = -4; i <= 4; i++) {
    const pulse = Math.sin(time * 0.004 + i) * 5;
    bgCtx.fillStyle = 'rgba(224, 242, 254, 0.65)';
    bgCtx.beginPath();
    bgCtx.arc(wfX + i * 32, wfBot + pulse, 18 + Math.abs(pulse), 0, Math.PI * 2);
    bgCtx.fill();
  }

  // 5. Tropical River Lagoon in Foreground
  const riverGrad = bgCtx.createLinearGradient(0, ch * 0.6, 0, ch);
  riverGrad.addColorStop(0, pal.waterTop);
  riverGrad.addColorStop(1, pal.waterBot);
  bgCtx.fillStyle = riverGrad;
  bgCtx.fillRect(0, ch * 0.61, cw, ch * 0.39);

  // Shimmering Water Current Ripples
  bgCtx.strokeStyle = 'rgba(186, 230, 253, 0.25)';
  bgCtx.lineWidth = 3;
  for (let i = 0; i < 9; i++) {
    const ry = ch * (0.65 + i * 0.038);
    const rx = ((time * 0.04 * (i % 2 === 0 ? 1 : -1) + i * 210) % (cw + 200)) - 100;
    bgCtx.beginPath();
    bgCtx.moveTo(rx - 70, ry);
    bgCtx.quadraticCurveTo(rx, ry - 6, rx + 70, ry);
    bgCtx.stroke();
  }

  // 6. Swaying Tropical Palm & Monstera Fronds on Left & Right Sides
  drawJungleFoliageBorder(time);

  // 7. Ambient Flying Morpho Butterflies
  butterflies.forEach(b => {
    b.x += b.vx;
    if (b.x > cw + 40) b.x = -40;
    if (b.x < -40) b.x = cw + 40;
    const by = b.y + Math.sin(time * 0.004 + b.phase) * 22;
    const wing = Math.abs(Math.sin(time * 0.015 + b.phase)) * 11;

    bgCtx.save();
    bgCtx.translate(b.x, by);
    bgCtx.fillStyle = b.hue;
    bgCtx.beginPath();
    bgCtx.ellipse(-5, -2, wing, 8, -0.3, 0, Math.PI * 2);
    bgCtx.ellipse(5, -2, wing, 8, 0.3, 0, Math.PI * 2);
    bgCtx.fill();
    bgCtx.restore();
  });
}

function drawJungleFoliageBorder(time) {
  const sway = Math.sin(time * 0.0018) * 14;
  bgCtx.fillStyle = '#052e16';

  // Left giant palm fronds
  for (let i = 0; i < 4; i++) {
    bgCtx.save();
    bgCtx.translate(-20, ch * (0.15 + i * 0.22));
    bgCtx.rotate((i * 0.12 - 0.2) + sway * 0.004);
    bgCtx.beginPath();
    bgCtx.moveTo(0, 0);
    bgCtx.quadraticCurveTo(95, -45, 185, 10);
    bgCtx.quadraticCurveTo(95, 35, 0, 0);
    bgCtx.fill();
    bgCtx.restore();

    // Right giant palm fronds
    bgCtx.save();
    bgCtx.translate(cw + 20, ch * (0.15 + i * 0.22));
    bgCtx.scale(-1, 1);
    bgCtx.rotate((i * 0.12 - 0.2) - sway * 0.004);
    bgCtx.beginPath();
    bgCtx.moveTo(0, 0);
    bgCtx.quadraticCurveTo(95, -45, 185, 10);
    bgCtx.quadraticCurveTo(95, 35, 0, 0);
    bgCtx.fill();
    bgCtx.restore();
  }
}

function drawCelebrationFX(time) {
  fxCtx.clearRect(0, 0, cw, ch);

  if (activeCelebration) {
    const elapsed = time - activeCelebration.startTime;
    const progress = Math.min(1, elapsed / activeCelebration.duration);
    const alpha = Math.sin(progress * Math.PI);

    if (activeCelebration.mode === 0) {
      // Double Rainbow Arch over the Waterfall!
      const rainbowColors = ['#ef4444', '#f97316', '#facc15', '#22c55e', '#38bdf8', '#a855f7'];
      fxCtx.save();
      fxCtx.globalAlpha = alpha * 0.72;
      rainbowColors.forEach((col, i) => {
        fxCtx.strokeStyle = col;
        fxCtx.lineWidth = 11;
        fxCtx.beginPath();
        fxCtx.arc(cw * 0.5, ch * 0.72, Math.min(cw, ch) * 0.46 - i * 11, Math.PI, 0);
        fxCtx.stroke();
      });
      fxCtx.restore();
    } else if (activeCelebration.mode === 2) {
      // Glowing Bioluminescent Orchids blooming along the borders
      fxCtx.save();
      fxCtx.globalAlpha = alpha;
      const orchidSpots = [
        [cw * 0.12, ch * 0.45], [cw * 0.88, ch * 0.45],
        [cw * 0.22, ch * 0.28], [cw * 0.78, ch * 0.28]
      ];
      orchidSpots.forEach(([ox, oy], idx) => {
        const s = (0.5 + Math.sin(progress * Math.PI) * 0.7) * 32;
        fxCtx.translate(ox, oy);
        for (let p = 0; p < 5; p++) {
          fxCtx.rotate((Math.PI * 2) / 5);
          fxCtx.fillStyle = idx % 2 === 0 ? '#f472b6' : '#2dd4bf';
          fxCtx.beginPath();
          fxCtx.ellipse(0, -s * 0.7, s * 0.42, s * 0.75, 0, 0, Math.PI * 2);
          fxCtx.fill();
        }
        fxCtx.fillStyle = '#fde047';
        fxCtx.beginPath();
        fxCtx.arc(0, 0, s * 0.3, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.setTransform(1, 0, 0, 1, 0, 0);
      });
      fxCtx.restore();
    } else if (activeCelebration.mode === 3) {
      // Scarlet Macaw Flyover across the top sky!
      fxCtx.save();
      for (let m = 0; m < 3; m++) {
        const mx = -120 + (cw + 280) * progress - m * 110;
        const my = ch * (0.22 + m * 0.07) + Math.sin(time * 0.015 + m) * 18;
        const flap = Math.sin(time * 0.025 + m) * 26;
        fxCtx.fillStyle = ['#ef4444', '#facc15', '#38bdf8'][m];
        fxCtx.beginPath();
        fxCtx.moveTo(mx, my);
        fxCtx.quadraticCurveTo(mx - 25, my - flap, mx - 48, my - flap * 0.6);
        fxCtx.quadraticCurveTo(mx - 15, my + 8, mx, my);
        fxCtx.fill();
        fxCtx.beginPath();
        fxCtx.ellipse(mx, my, 24, 9, -0.1, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }
  }

  // Update & Draw Foreground Particles (Mangoes, Splash Droplets, Fireflies, Leaves)
  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const p = fxParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.014;

    if (p.type === 'droplet' || p.type === 'mango' || p.type === 'flower') {
      p.vy += 0.28; // gravity
    } else if (p.type === 'leaf') {
      p.vy += 0.12;
      p.rot += p.vRot;
    }

    if (p.life <= 0) {
      fxParticles.splice(i, 1);
      continue;
    }

    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.translate(p.x, p.y);
    if (p.rot) fxCtx.rotate(p.rot);

    if (p.type === 'mango') {
      fxCtx.fillStyle = p.color;
      fxCtx.beginPath();
      fxCtx.ellipse(0, 0, p.size, p.size * 0.72, 0.3, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.fillStyle = '#22c55e';
      fxCtx.fillRect(-3, -p.size, 6, 7);
    } else if (p.type === 'flower') {
      fxCtx.fillStyle = p.color;
      for (let k = 0; k < 5; k++) {
        fxCtx.rotate((Math.PI * 2) / 5);
        fxCtx.beginPath();
        fxCtx.arc(0, -p.size * 0.5, p.size * 0.42, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.fillStyle = '#fef08a';
      fxCtx.beginPath();
      fxCtx.arc(0, 0, p.size * 0.28, 0, Math.PI * 2);
      fxCtx.fill();
    } else if (p.type === 'leaf') {
      fxCtx.fillStyle = p.color;
      fxCtx.beginPath();
      fxCtx.moveTo(-p.size, 0);
      fxCtx.quadraticCurveTo(0, -p.size * 0.75, p.size, 0);
      fxCtx.quadraticCurveTo(0, p.size * 0.75, -p.size, 0);
      fxCtx.fill();
    } else {
      // Droplet or Glowing Firefly
      fxCtx.fillStyle = p.color;
      fxCtx.beginPath();
      fxCtx.arc(0, 0, p.size, 0, Math.PI * 2);
      fxCtx.fill();
    }
    fxCtx.restore();
  }
}

// Update Animal Eye Tracking & Subtle Breathing every frame
function updateAnimalRigAnimations(time) {
  const breath = Math.sin(time * 0.0032) * 0.025;
  const headTilt = ((pointerPos.x / cw) - 0.5) * 6;

  document.querySelectorAll('.animal-rig').forEach((rig, idx) => {
    const head = rig.querySelector('.animal-head');
    if (head) {
      const baseTransform = head.getAttribute('data-base-transform') || head.getAttribute('transform') || '';
      if (!head.hasAttribute('data-base-transform')) {
        head.setAttribute('data-base-transform', baseTransform);
      }
      head.setAttribute('transform', `${baseTransform} rotate(${headTilt.toFixed(2)}) scale(${1 + breath})`);
    }
  });

  // Shift pupils toward cursor
  const dx = ((pointerPos.x / cw) - 0.5) * 4.2;
  const dy = ((pointerPos.y / ch) - 0.5) * 3.2;
  document.querySelectorAll('.animal-pupil').forEach(pupil => {
    pupil.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
  });
}

function mainLoop(time) {
  drawBackground(time);
  drawCelebrationFX(time);
  updateAnimalRigAnimations(time);
  requestAnimationFrame(mainLoop);
}

window.onload = () => {
  loadNextTask();
  requestAnimationFrame(mainLoop);
};
</script>
