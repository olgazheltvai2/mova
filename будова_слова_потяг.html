      // Графічна іконка турбо-прискорення (Золота блискавка + подвійне крило швидкості)
      ctx.fillStyle = '#fffde7';
      ctx.beginPath();
      ctx.moveTo(6, -38);
      ctx.lineTo(-22, 4);
      ctx.lineTo(0, 4);
      ctx.lineTo(-10, 38);
      ctx.lineTo(24, -6);
      ctx.lineTo(2, -6);
      ctx.closePath();
      ctx.fill();

      // Стрілки-імпульси праворуч від блискавки
      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      [18, 32].forEach(ox => {
        ctx.beginPath();
        ctx.moveTo(ox, -18);
        ctx.lineTo(ox + 11, 0);
        ctx.lineTo(ox, 18);
        ctx.stroke();
      });

      ctx.restore();

      uiButtons.push({
        ...boostBtn,
        onClick: () => triggerSmoothBoost()
      });
    }

    /* =========================================================================
       16. РЕНДЕРИНГ ЧАСТИНОК ТА СВЯТКОВИХ САЛЮТІВ
       ========================================================================= */
    function drawAllParticlesAndCelebrations() {
      // 1. Клуби диму та веселкові кільця пари
      smokeParticles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        if (p.isRing) {
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // 2. Іскри з-під коліс
      sparkParticles.forEach(sp => {
        const alpha = 1 - sp.life / sp.maxLife;
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 3. Квітучі соняшники та маки під час святкування Mode 1
      bloomingFlowers.forEach(bf => {
        const fade = bf.life > bf.maxLife - 0.3 ? (bf.maxLife - bf.life) / 0.3 : 1;
        ctx.save();
        ctx.globalAlpha = Math.max(0, fade);
        const topY = bf.y - bf.currentH;

        // Стебло і листочки
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bf.x, bf.y);
        ctx.quadraticCurveTo(bf.x + 12, bf.y - bf.currentH * 0.5, bf.x, topY);
        ctx.stroke();

        // Квітка
        ctx.translate(bf.x, topY);
        if (bf.type === 'sunflower') {
          ctx.fillStyle = '#ffca28';
          for (let p = 0; p < 12; p++) {
            ctx.rotate(Math.PI / 6);
            ctx.beginPath();
            ctx.ellipse(0, -24, 8, 16, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#4e342e';
          ctx.beginPath();
          ctx.arc(0, 0, 16, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#e53935';
          for (let p = 0; p < 5; p++) {
            ctx.rotate((Math.PI * 2) / 5);
            ctx.beginPath();
            ctx.arc(0, -16, 15, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#212121';
          ctx.beginPath();
          ctx.arc(0, 0, 9, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // 4. Метелики (Mode 1)
      butterflyParticles.forEach(bt => {
        const alpha = 1 - bt.life / bt.maxLife;
        const wingW = Math.abs(Math.cos(bt.wingPhase)) * bt.size;
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.translate(bt.x, bt.y);
        ctx.fillStyle = bt.color;
        ctx.beginPath();
        ctx.ellipse(-wingW * 0.6, -4, wingW, bt.size * 0.7, -0.3, 0, Math.PI * 2);
        ctx.ellipse(wingW * 0.6, -4, wingW, bt.size * 0.7, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#263238';
        ctx.fillRect(-2, -bt.size * 0.6, 4, bt.size * 1.2);
        ctx.restore();
      });

      // 5. Конфеті-стрічки (Mode 2)
      confettiParticles.forEach(cf => {
        const alpha = 1 - cf.life / cf.maxLife;
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.translate(cf.x, cf.y);
        ctx.rotate(cf.rot);
        ctx.fillStyle = cf.color;
        ctx.fillRect(-cf.w / 2, -cf.h / 2, cf.w, cf.h);
        ctx.restore();
      });

      // 6. Зіркові салюти
      starParticles.forEach(st => {
        const alpha = 1 - st.life / st.maxLife;
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        drawStar(st.x, st.y, st.size, st.size * 0.45, st.rot, st.color);
        ctx.restore();
      });
    }

    /* =========================================================================
       17. ЗАПУСК ГРИ ТА ГОЛОВНИЙ ІГРОВИЙ ЦИКЛ
       ========================================================================= */
    pickNextWordTask(false);

    let lastTime = performance.now();

    function gameLoop(now) {
      const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
      lastTime = now;

      updateGame(dt);

      uiButtons.length = 0;

      ctx.save();
      ctx.scale(renderScale, renderScale);

      if (screenShakeTimer > 0) {
        const sx = (Math.random() - 0.5) * 10;
        const sy = (Math.random() - 0.5) * 10;
        ctx.translate(sx, sy);
      }

      // 1. Живий сюжетний паралакс-фон та 3 колії
      drawLivingBackground();

      // 2. Медальйони зі значками будови слова на коліях
      drawSymbolMedallions();

      // 3. Казковий локомотив
      drawLocomotive();

      // 4. Частинки та святкові салюти
      drawAllParticlesAndCelebrations();

      // 5. Величезне слово з підсвіченою морфемою зверху
      drawTopWordBanner();

      // 6. Графічні кнопки керування без зайвих слів
      drawGraphicalControls();

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
