<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Словопотяг: Експрес Будови Слова (НУШ, 4 клас)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b2838 0%, #090d16 100%);
      font-family: 'Trebuchet MS', 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9), 0 0 0 4px #d49b35;
      border-radius: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    'use strict';

    /* =========================================================================
       1. БАЗА МОВНОГО МАТЕРІАЛУ (РІВНО 50 СЛІВ ДЛЯ 4 КЛАСУ НУШ)
       Кожне слово точно складається з prefix + root + suffix + ending
       ========================================================================= */
    const WORDS_DATABASE = [
      // 1-10: Повний набір (префікс + корінь + суфікс + закінчення)
      { word: "підводний", prefix: "під", root: "вод", suffix: "н", ending: "ий" },
      { word: "придорожній", prefix: "при", root: "дорож", suffix: "н", ending: "ій" },
      { word: "залізничний", prefix: "за", root: "ліз", suffix: "ничн", ending: "ий" },
      { word: "посаджений", prefix: "по", root: "сад", suffix: "жен", ending: "ий" },
      { word: "безхмарний", prefix: "без", root: "хмар", suffix: "н", ending: "ий" },
      { word: "відлітний", prefix: "від", root: "літ", suffix: "н", ending: "ий" },
      { word: "пролісок", prefix: "про", root: "ліс", suffix: "ок", ending: "" },
      { word: "настільний", prefix: "на", root: "стіль", suffix: "н", ending: "ий" },
      { word: "розмовний", prefix: "роз", root: "мов", suffix: "н", ending: "ий" },
      { word: "дошкільний", prefix: "до", root: "шкіль", suffix: "н", ending: "ий" },

      // 11-20: Без префікса (корінь + суфікс + закінчення)
      { word: "казковий", prefix: "", root: "каз", suffix: "ков", ending: "ий" },
      { word: "лісовик", prefix: "", root: "ліс", suffix: "овик", ending: "" },
      { word: "веснянка", prefix: "", root: "весн", suffix: "янк", ending: "а" },
      { word: "сонячний", prefix: "", root: "сон", suffix: "ячн", ending: "ий" },
      { word: "рибний", prefix: "", root: "риб", suffix: "н", ending: "ий" },
      { word: "зернятко", prefix: "", root: "зерн", suffix: "ятк", ending: "о" },
      { word: "ніченька", prefix: "", root: "ніч", suffix: "еньк", ending: "а" },
      { word: "дубовий", prefix: "", root: "дуб", suffix: "ов", ending: "ий" },
      { word: "зимовий", prefix: "", root: "зим", suffix: "ов", ending: "ий" },
      { word: "квітник", prefix: "", root: "квіт", suffix: "ник", ending: "" },

      // 21-30: Префікси пре-, при-, прі- та чергування
      { word: "предобрий", prefix: "пре", root: "добр", suffix: "", ending: "ий" },
      { word: "премудрий", prefix: "пре", root: "мудр", suffix: "", ending: "ий" },
      { word: "прикордонник", prefix: "при", root: "кордон", suffix: "ник", ending: "" },
      { word: "прізвище", prefix: "прі", root: "звищ", suffix: "", ending: "е" },
      { word: "прірва", prefix: "прі", root: "рв", suffix: "", ending: "а" },
      { word: "прибережний", prefix: "при", root: "береж", suffix: "н", ending: "ий" },
      { word: "перевізник", prefix: "пере", root: "віз", suffix: "ник", ending: "" },
      { word: "підсніжник", prefix: "під", root: "сніж", suffix: "ник", ending: "" },
      { word: "безстрашний", prefix: "без", root: "страш", suffix: "н", ending: "ий" },
      { word: "розквітлий", prefix: "роз", root: "квіт", suffix: "л", ending: "ий" },

      // 31-40: Дієслівні форми та віддієслівні іменники
      { word: "заспів", prefix: "за", root: "спів", suffix: "", ending: "" },
      { word: "переказ", prefix: "пере", root: "каз", suffix: "", ending: "" },
      { word: "допис", prefix: "до", root: "пис", suffix: "", ending: "" },
      { word: "політ", prefix: "по", root: "літ", suffix: "", ending: "" },
      { word: "вихід", prefix: "ви", root: "хід", suffix: "", ending: "" },
      { word: "розпис", prefix: "роз", root: "пис", suffix: "", ending: "" },
      { word: "вдих", prefix: "в", root: "дих", suffix: "", ending: "" },
      { word: "напис", prefix: "на", root: "пис", suffix: "", ending: "" },
      { word: "відчит", prefix: "від", root: "чит", suffix: "", ending: "" },
      { word: "прохід", prefix: "про", root: "хід", suffix: "", ending: "" },

      // 41-50: Зменшено-пестливі форми та складні суфікси
      { word: "стежечка", prefix: "", root: "стеж", suffix: "ечк", ending: "а" },
      { word: "хмаринка", prefix: "", root: "хмар", suffix: "инк", ending: "а" },
      { word: "рученька", prefix: "", root: "руч", suffix: "еньк", ending: "а" },
      { word: "берізка", prefix: "", root: "беріз", suffix: "к", ending: "а" },
      { word: "дощовий", prefix: "", root: "дощ", suffix: "ов", ending: "ий" },
      { word: "садочок", prefix: "", root: "сад", suffix: "очок", ending: "" },
      { word: "вітерець", prefix: "", root: "вітер", suffix: "ець", ending: "" },
      { word: "книжечка", prefix: "", root: "книж", suffix: "ечк", ending: "а" },
      { word: "дружній", prefix: "", root: "друж", suffix: "н", ending: "ій" },
      { word: "гірський", prefix: "", root: "гір", suffix: "ськ", ending: "ий" }
    ];

    /* =========================================================================
       2. КОЛЬОРОВА ГАМА ТА ТИПИ МОРФЕМ (БЕЗ ЗАЙВИХ СЛІВ)
       ========================================================================= */
    const MORPHEME_TYPES = {
      prefix: {
        key: 'prefix',
        cTop: '#1e88e5',
        cBot: '#0d47a1',
        rim: '#90caf9',
        glow: '#42a5f5'
      },
      root: {
        key: 'root',
        cTop: '#43a047',
        cBot: '#1b5e20',
        rim: '#a5d6a7',
        glow: '#66bb6a'
      },
      suffix: {
        key: 'suffix',
        cTop: '#fb8c00',
        cBot: '#e65100',
        rim: '#ffe082',
        glow: '#ffa726'
      },
      ending: {
        key: 'ending',
        cTop: '#8e24aa',
        cBot: '#4a148c',
        rim: '#ce93d8',
        glow: '#ab47bc'
      }
    };

    const ALL_MORPHEME_KEYS = ['prefix', 'root', 'suffix', 'ending'];

    /* =========================================================================
       3. ЗВУКОВИЙ РУШІЙ (WEB AUDIO API — АКТИВНІ РІЗНОМАНІТНІ ФІДБЕКИ)
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.chugTimer = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // М'який ритмічний стукіт коліс (прискорюється під час бусту)
      playChug(speedFactor = 1) {
        if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
        const now = this.ctx.currentTime;

        const beat = (offset, freq, gainVal) => {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + offset);
          osc.frequency.exponentialRampToValueAtTime(30, now + offset + 0.06);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(160 + speedFactor * 50, now + offset);

          gain.gain.setValueAtTime(gainVal, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.07);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + offset);
          osc.stop(now + offset + 0.08);
        };

        beat(0, 74, 0.06);
        beat(0.14 / Math.max(0.7, speedFactor), 62, 0.045);
      }

      // Звук активації плавного прискорення (паровий турбо-імпульс + свисток)
      playBoostWhoosh() {
        if (this.muted || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.35);
        osc.frequency.exponentialRampToValueAtTime(340, now + 0.75);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.14, now + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.78);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
      }

      // Перемикання колії
      playTrackSwitch() {
        if (this.muted || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(310, now);
        osc.frequency.exponentialRampToValueAtTime(490, now + 0.08);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      // Кнопка "Далі" (перехід на нове слово)
      playSkipTransition() {
        if (this.muted || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;
        [392, 523.25, 659.25].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const st = now + idx * 0.05;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, st);
          gain.gain.setValueAtTime(0.09, st);
          gain.gain.exponentialRampToValueAtTime(0.001, st + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(st);
          osc.stop(st + 0.2);
        });
      }

      // 4 РІЗНОМАНІТНІ МУЗИЧНІ ФІДБЕКИ УСПІХУ (БЕЗ СЛІВ)
      playCelebrationSound(modeIndex) {
        if (this.muted || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;

        if (modeIndex === 0) {
          // Mode 0: Урочиста мідна фанфара (C5 - E5 - G5 - C6)
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const st = now + i * 0.09;
            const dur = i === 3 ? 0.55 : 0.22;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, st);
            gain.gain.setValueAtTime(0.001, st);
            gain.gain.linearRampToValueAtTime(0.2, st + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, st + dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(st);
            osc.stop(st + dur + 0.02);
          });
        } else if (modeIndex === 1) {
          // Mode 1: Веселий ксилофон / маримба
          const notes = [587.33, 659.25, 783.99, 880, 1174.66];
          notes.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const st = now + i * 0.075;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, st);
            gain.gain.setValueAtTime(0.22, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(st);
            osc.stop(st + 0.3);
          });
        } else if (modeIndex === 2) {
          // Mode 2: Подвійний святковий гудок потяга + мажорний акорд
          const blow = (offset, dur) => {
            [440, 554.37, 659.25].forEach((f, idx) => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, now + offset);
              gain.gain.setValueAtTime(0.001, now + offset);
              gain.gain.linearRampToValueAtTime(0.11 - idx * 0.02, now + offset + 0.03);
              gain.gain.exponentialRampToValueAtTime(0.001, now + offset + dur);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + offset);
              osc.stop(now + offset + dur + 0.02);
            });
          };
          blow(0, 0.22);
          blow(0.26, 0.45);
        } else {
          // Mode 3: Кришталевий передзвін-каскад
          const notes = [659.25, 783.99, 987.77, 1318.51, 1567.98];
          notes.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const st = now + i * 0.065;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, st);
            gain.gain.setValueAtTime(0.16, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 0.45);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(st);
            osc.stop(st + 0.47);
          });
        }
      }

      // Кумедний пружний звук при помилці ("боінг" без жодного негативу)
      playFunnyBoing() {
        if (this.muted || !this.ctx) return;
        this.init();
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(135, now + 0.18);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.34);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.48);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.52);
      }
    }

    const sound = new SoundEngine();

    /* =========================================================================
       4. НАЛАШТУВАННЯ CANVAS (16:9 WIDESCREEN 1920x1080 + HIGH-DPI)
       ========================================================================= */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const LOGICAL_WIDTH = 1920;
    const LOGICAL_HEIGHT = 1080;
    let renderScale = 1;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const targetRatio = LOGICAL_WIDTH / LOGICAL_HEIGHT;
      const winRatio = winW / winH;

      let cssW, cssH;
      if (winRatio > targetRatio) {
        cssH = winH;
        cssW = cssH * targetRatio;
      } else {
        cssW = winW;
        cssH = cssW / targetRatio;
      }

      canvas.style.width = `${Math.floor(cssW)}px`;
      canvas.style.height = `${Math.floor(cssH)}px`;
      canvas.width = Math.floor(cssW * dpr);
      canvas.height = Math.floor(cssH * dpr);

      renderScale = (cssW * dpr) / LOGICAL_WIDTH;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    /* =========================================================================
       5. СТАН ГРИ, ПОВІЛЬНИЙ РУХ + ПЛАВНЕ ПРИСКОРЕННЯ (BOOST)
       ========================================================================= */
    const TRACK_Y = [600, 775, 950]; // 3 широкі колії для 1920x1080
    const TRAIN_X = 350;

    // Потяг рухається ДУЖЕ ПОВІЛЬНО за замовчуванням (125 пікселів/с),
    // а при натисканні на кнопку прискорення плавно розганяється і знову стишує хід
    const BASE_SLOW_SPEED = 128;
    let boostTimer = 0;          // Залишок часу імпульсу прискорення
    let currentSpeedFactor = 1;  // Плавний множник швидкості (1.0 -> 3.8 -> 1.0)

    const train = {
      trackIndex: 1,
      currentY: TRACK_Y[1],
      targetY: TRACK_Y[1],
      wheelAngle: 0,
      squashX: 1,
      squashY: 1,
      wobblePhase: 0,
      jumpOffsetY: 0,
      headlightPulse: 0
    };

    // Поточне завдання (слово + підсвічена морфема)
    let usedTaskKeys = [];
    let currentTask = null;
    // Структура currentTask:
    // { wordObj, targetKey ('prefix'|'root'|'suffix'|'ending'), segments: [{key, text, highlight}], crowned: false }

    // Медальйони зі значками будови слова на 3 коліях
    let medallions = [];
    let waveSpawnTimer = 0.2;

    // Летючий значок, який після правильного вибору летить від потяга на підсвічену частину слова
    let flyingSymbol = null;

    // 4 різноманітні святкові салюти без слів
    let celebrationModeCounter = 0;
    let activeCelebration = {
      active: false,
      mode: 0,
      timer: 0,
      duration: 1.4
    };

    // Ефекти (частинки диму, іскри, зірочки, квіти, метелики, стрічки, хвилі колії)
    let smokeParticles = [];
    let sparkParticles = [];
    let starParticles = [];
    let confettiParticles = [];
    let bloomingFlowers = [];
    let butterflyParticles = [];
    let trackEnergyWaves = [];
    let speedLines = [];
    let screenShakeTimer = 0;

    // Інтерактивні кнопки (без тексту, лише іконки)
    const uiButtons = [];

    /* =========================================================================
       6. СЮЖЕТНИЙ ЖИВИЙ ПАРАЛАКС-ФОН (ГОРИ, ВІТРЯК, ВІАДУК, РІЧКА, ХАТИНКИ)
       ========================================================================= */
    const world = {
      clouds: [],
      birds: [],
      farMountainsX: 0,
      windmillBladeAngle: 0,
      midHillsX: 0,
      riverRipplePhase: 0,
      scenicItems: [],
      sleeperOffset: 0,
      foregroundFlowers: []
    };

    function initLivingWorld() {
      world.clouds = [];
      for (let i = 0; i < 9; i++) {
        world.clouds.push({
          x: i * 240 + Math.random() * 80,
          y: 70 + (i % 3) * 58,
          scale: 0.75 + (i % 4) * 0.2,
          speed: 12 + (i % 3) * 6
        });
      }

      world.birds = [];
      for (let i = 0; i < 7; i++) {
        world.birds.push({
          x: Math.random() * LOGICAL_WIDTH,
          y: 95 + Math.random() * 140,
          speed: 28 + Math.random() * 20,
          wingPhase: Math.random() * Math.PI * 2
        });
      }

      world.scenicItems = [];
      const types = ['pine', 'cottage', 'sunflowers', 'oak', 'windmill', 'pine', 'cottage', 'sunflowers'];
      for (let i = 0; i < 24; i++) {
        world.scenicItems.push({
          x: i * 115 + Math.random() * 25,
          y: 448 + (i % 3) * 14,
          type: types[i % types.length],
          scale: 0.85 + (i % 3) * 0.14,
          variant: i % 3,
          swayOffset: Math.random() * Math.PI * 2
        });
      }

      world.foregroundFlowers = [];
      for (let i = 0; i < 34; i++) {
        world.foregroundFlowers.push({
          x: i * 62 + Math.random() * 20,
          row: i % 4,
          kind: i % 3 === 0 ? 'sunflower' : (i % 2 === 0 ? 'poppy' : 'chamomile')
        });
      }
    }

    initLivingWorld();

    /* =========================================================================
       7. ВИБІР СЛОВА ТА ПІДСВІЧЕНОЇ ЧАСТИНИ СЛОВА
       ========================================================================= */
    function pickNextWordTask(isManualSkip = false) {
      // Формуємо всі можливі пари (слово + непорожня морфема в ньому)
      const allPossibleTasks = [];
      WORDS_DATABASE.forEach((wObj, wIdx) => {
        ALL_MORPHEME_KEYS.forEach(mKey => {
          if (wObj[mKey] && wObj[mKey].trim().length > 0) {
            allPossibleTasks.push({ wIdx, mKey, id: `${wIdx}_${mKey}` });
          }
        });
      });

      if (usedTaskKeys.length >= allPossibleTasks.length) {
        usedTaskKeys = [];
      }

      const available = allPossibleTasks.filter(t => !usedTaskKeys.includes(t.id));
      const chosen = available[Math.floor(Math.random() * available.length)];
      usedTaskKeys.push(chosen.id);

      const wordObj = WORDS_DATABASE[chosen.wIdx];
      const targetKey = chosen.mKey;

      // Розбиваємо слово на сегменти для точного рендеру і підсвічування
      const segments = [];
      ALL_MORPHEME_KEYS.forEach(k => {
        const txt = wordObj[k];
        if (txt && txt.length > 0) {
          segments.push({
            key: k,
            text: txt.toUpperCase(),
            highlight: (k === targetKey)
          });
        }
      });

      currentTask = {
        wordObj,
        targetKey,
        segments,
        crowned: false,
        crownPulse: 0,
        targetCenterX: LOGICAL_WIDTH / 2,
        targetTopY: 115,
        targetWidth: 160
      };

      medallions = [];
      flyingSymbol = null;
      activeCelebration.active = false;
      waveSpawnTimer = 0.15;

      if (isManualSkip) {
        sound.playSkipTransition();
        spawnStarBurst(LOGICAL_WIDTH / 2, 135, 22);
      }
    }

    // Створення хвилі з 3 медальйонів зі значками будови слова (1 правильний + 2 дистрактори)
    function spawnSymbolMedallions() {
      if (!currentTask || currentTask.crowned) return;

      const correctKey = currentTask.targetKey;
      const otherKeys = ALL_MORPHEME_KEYS.filter(k => k !== correctKey);

      // Перемішуємо інші 3 типи морфем і беремо 2 різних дистрактори
      for (let i = otherKeys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [otherKeys[i], otherKeys[j]] = [otherKeys[j], otherKeys[i]];
      }

      const waveKeys = [correctKey, otherKeys[0], otherKeys[1]];

      // Випадковий розподіл по 3 коліях
      const trackIndices = [0, 1, 2];
      for (let i = trackIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [trackIndices[i], trackIndices[j]] = [trackIndices[j], trackIndices[i]];
      }

      const spawnX = LOGICAL_WIDTH + 130;
      medallions = waveKeys.map((mKey, i) => {
        const tIdx = trackIndices[i];
        return {
          trackIndex: tIdx,
          x: spawnX,
          y: TRACK_Y[tIdx],
          radius: 56,
          morphemeKey: mKey,
          isCorrect: (mKey === correctKey),
          evaluated: false,
          bouncingOff: false,
          vx: 0,
          vy: 0,
          rot: 0,
          wheelAngle: 0,
          pulsePhase: Math.random() * Math.PI * 2
        };
      });
    }

    /* =========================================================================
       8. АКТИВАЦІЯ ПЛАВНОГО ПРИСКОРЕННЯ ТА СПЕЦЕФЕКТІВ
       ========================================================================= */
    function triggerSmoothBoost() {
      sound.init();
      sound.playBoostWhoosh();
      boostTimer = 1.45; // Потяг плавно розганяється протягом цього часу і потім плавно сповільнюється

      // Додаткові клуби кольорової пари та іскор з-під коліс
      for (let i = 0; i < 12; i++) {
        spawnSmokePuff(TRAIN_X + 88, train.currentY - 115, true);
      }
      spawnWheelSparks(TRAIN_X, train.currentY + 28, 16);

      // Лінії потоку вітру
      for (let i = 0; i < 10; i++) {
        speedLines.push({
          x: LOGICAL_WIDTH * 0.3 + Math.random() * LOGICAL_WIDTH * 0.7,
          y: 480 + Math.random() * 520,
          length: 120 + Math.random() * 160,
          life: 0,
          maxLife: 0.45 + Math.random() * 0.35
        });
      }
    }

    function spawnSmokePuff(x, y, isRainbow = false) {
      const rainbowColors = ['#ffd54f', '#80deea', '#ffab91', '#ce93d8', '#a5d6a7'];
      smokeParticles.push({
        x: x + (Math.random() - 0.5) * 14,
        y: y,
        vx: -70 - Math.random() * 55 * currentSpeedFactor,
        vy: -55 - Math.random() * 40,
        radius: 11 + Math.random() * 6,
        maxRadius: 38 + Math.random() * 20,
        alpha: 0.8,
        life: 0,
        maxLife: 0.95 + Math.random() * 0.45,
        color: isRainbow
          ? rainbowColors[Math.floor(Math.random() * rainbowColors.length)]
          : (Math.random() > 0.4 ? '#fff8e7' : '#dce7f7'),
        isRing: isRainbow && Math.random() > 0.35
      });
    }

    function spawnWheelSparks(x, y, count = 6) {
      for (let i = 0; i < count; i++) {
        sparkParticles.push({
          x: x + (Math.random() - 0.5) * 95,
          y: y + (Math.random() - 0.5) * 8,
          vx: -120 - Math.random() * 180,
          vy: -35 - Math.random() * 110,
          size: 3.5 + Math.random() * 4,
          life: 0,
          maxLife: 0.28 + Math.random() * 0.25,
          color: Math.random() > 0.35 ? '#ffd54f' : '#ff7043'
        });
      }
    }

    function spawnStarBurst(x, y, count = 26) {
      const colors = ['#ffd700', '#00e676', '#40c4ff', '#ff5252', '#ffab00', '#e040fb'];
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
        const speed = 95 + Math.random() * 280;
        starParticles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 50,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 9,
          size: 9 + Math.random() * 11,
          life: 0,
          maxLife: 0.75 + Math.random() * 0.45,
          color: colors[i % colors.length]
        });
      }
    }

    // Запуск одного з 4 активних безсловесних святкових салютів
    function triggerNonVerbalCelebration() {
      const mode = celebrationModeCounter % 4;
      celebrationModeCounter++;

      activeCelebration.active = true;
      activeCelebration.mode = mode;
      activeCelebration.timer = 0;
      activeCelebration.duration = 1.38;

      sound.playCelebrationSound(mode);

      if (mode === 0) {
        // Mode 0: Мульти-салют золотих та смарагдових зірок + веселкові кільця пари з димаря
        spawnStarBurst(currentTask.targetCenterX, currentTask.targetTopY, 30);
        spawnStarBurst(LOGICAL_WIDTH * 0.25, 280, 22);
        spawnStarBurst(LOGICAL_WIDTH * 0.75, 280, 22);
        for (let i = 0; i < 16; i++) {
          spawnSmokePuff(TRAIN_X + 88, train.currentY - 115, true);
        }
      } else if (mode === 1) {
        // Mode 1: Гігантські соняшники та маки виростають уздовж екрана + зграйка яскравих метеликів
        bloomingFlowers = [];
        for (let i = 0; i < 14; i++) {
          bloomingFlowers.push({
            x: 130 + i * 128 + (Math.random() - 0.5) * 30,
            y: LOGICAL_HEIGHT + 10,
            targetH: 130 + Math.random() * 95,
            currentH: 0,
            type: i % 2 === 0 ? 'sunflower' : 'poppy',
            life: 0,
            maxLife: 1.35
          });
        }
        butterflyParticles = [];
        const bColors = ['#ffca28', '#ff5252', '#40c4ff', '#e040fb', '#69f0ae'];
        for (let i = 0; i < 18; i++) {
          butterflyParticles.push({
            x: 200 + Math.random() * (LOGICAL_WIDTH - 400),
            y: LOGICAL_HEIGHT - 120 - Math.random() * 200,
            vx: (Math.random() - 0.5) * 160,
            vy: -140 - Math.random() * 140,
            wingPhase: Math.random() * Math.PI * 2,
            color: bColors[i % bColors.length],
            size: 14 + Math.random() * 8,
            life: 0,
            maxLife: 1.3
          });
        }
      } else if (mode === 2) {
        // Mode 2: Сонячні промені + дощ із різнокольорових стрічок-конфеті
        confettiParticles = [];
        const cColors = ['#ffd700', '#ff5252', '#00e676', '#29b6f6', '#ab47bc', '#ff9100'];
        for (let i = 0; i < 55; i++) {
          confettiParticles.push({
            x: Math.random() * LOGICAL_WIDTH,
            y: -20 - Math.random() * 180,
            vx: (Math.random() - 0.5) * 120,
            vy: 240 + Math.random() * 220,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 10,
            w: 16 + Math.random() * 10,
            h: 8 + Math.random() * 6,
            color: cColors[i % cColors.length],
            life: 0,
            maxLife: 1.35
          });
        }
        spawnStarBurst(currentTask.targetCenterX, currentTask.targetTopY, 24);
      } else {
        // Mode 3: Золота світлова хвиля вздовж усіх 3 колій + радісний стрибок локомотива
        trackEnergyWaves = [0, 1, 2].map(tIdx => ({
          trackIndex: tIdx,
          x: TRAIN_X,
          y: TRACK_Y[tIdx],
          life: 0,
          maxLife: 1.2
        }));
        train.jumpOffsetY = -52;
        spawnStarBurst(TRAIN_X + 40, train.currentY - 70, 28);
        spawnStarBurst(currentTask.targetCenterX, currentTask.targetTopY, 24);
      }
    }

    /* =========================================================================
       9. КЕРУВАННЯ (КЛАВІАТУРА, МИША, СЕНСОРНИЙ ЕКРАН)
       ========================================================================= */
    function switchTrack(newTrackIndex) {
      const clamped = Math.max(0, Math.min(2, newTrackIndex));
      if (clamped !== train.trackIndex) {
        train.trackIndex = clamped;
        train.targetY = TRACK_Y[clamped];
        sound.playTrackSwitch();
        spawnWheelSparks(TRAIN_X, train.currentY + 28, 10);
      }
    }

    window.addEventListener('keydown', (e) => {
      sound.init();
      if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        switchTrack(train.trackIndex - 1);
      } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
        e.preventDefault();
        switchTrack(train.trackIndex + 1);
      } else if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'KeyD') {
        e.preventDefault();
        triggerSmoothBoost();
      } else if (e.code === 'KeyN' || e.code === 'Enter') {
        e.preventDefault();
        pickNextWordTask(true);
      }
    });

    function handlePointerDown(clientX, clientY) {
      sound.init();
      const rect = canvas.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * LOGICAL_WIDTH;
      const y = ((clientY - rect.top) / rect.height) * LOGICAL_HEIGHT;

      // Перевіряємо натискання на графічні кнопки
      for (let i = 0; i < uiButtons.length; i++) {
        const b = uiButtons[i];
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
          b.onClick();
          return;
        }
      }

      // Натискання на саму верхню дошку зі словом також дозволяє дитині увімкнути прискорення
      if (y >= 490) {
        let closestTrack = 0;
        let minDiff = Infinity;
        for (let t = 0; t < TRACK_Y.length; t++) {
          const diff = Math.abs(y - (TRACK_Y[t] - 20));
          if (diff < minDiff) {
            minDiff = diff;
            closestTrack = t;
          }
        }
        switchTrack(closestTrack);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handlePointerDown(e.clientX, e.clientY);
    });

    /* =========================================================================
       10. ОНОВЛЕННЯ ІГРОВОГО СВІТУ (UPDATE LOOP)
       ========================================================================= */
    let smokeAccum = 0;

    function updateGame(dt) {
      // Плавне прискорення і плавне сповільнення (Smooth Speed Boost)
      if (boostTimer > 0) {
        boostTimer = Math.max(0, boostTimer - dt);
      }
      const targetSpeedFactor = boostTimer > 0 ? 3.85 : 1.0;
      // Плавна інтерполяція швидкості: швидко набирає обертів і м'яко гальмує до спокійного темпу
      const accelRate = boostTimer > 0 ? 4.2 : 2.4;
      currentSpeedFactor += (targetSpeedFactor - currentSpeedFactor) * Math.min(1, dt * accelRate);

      const effectiveWaveSpeed = BASE_SLOW_SPEED * currentSpeedFactor;

      // 1. Оновлення живого паралакс-фону
      world.clouds.forEach(c => {
        c.x -= c.speed * (0.7 + currentSpeedFactor * 0.3) * dt;
        if (c.x < -260) c.x = LOGICAL_WIDTH + 220;
      });

      world.birds.forEach(b => {
        b.x -= b.speed * dt;
        b.wingPhase += dt * 8.5;
        if (b.x < -90) {
          b.x = LOGICAL_WIDTH + 90 + Math.random() * 180;
          b.y = 85 + Math.random() * 140;
        }
      });

      world.windmillBladeAngle += dt * 1.1;
      world.riverRipplePhase += dt * 3.2;
      world.farMountainsX = (world.farMountainsX + 18 * currentSpeedFactor * dt) % 960;
      world.midHillsX = (world.midHillsX + 48 * currentSpeedFactor * dt) % 800;

      world.scenicItems.forEach(item => {
        item.x -= 75 * currentSpeedFactor * dt;
        if (item.x < -160) item.x += 24 * 115;
      });

      world.sleeperOffset = (world.sleeperOffset + effectiveWaveSpeed * dt) % 52;

      world.foregroundFlowers.forEach(fl => {
        fl.x -= effectiveWaveSpeed * dt;
        if (fl.x < -70) fl.x += 34 * 62;
      });

      // 2. Оновлення локомотива
      const lerpY = 1 - Math.pow(1 - 0.14, dt * 60);
      train.currentY += (train.targetY - train.currentY) * lerpY;

      if (Math.abs(train.targetY - train.currentY) > 5) {
        spawnWheelSparks(TRAIN_X - 10, train.currentY + 28, 1);
      }

      train.wheelAngle += dt * 4.8 * currentSpeedFactor;
      train.headlightPulse += dt * 4;
      train.wobblePhase += dt * 14;

      // Пружне відновлення форми локомотива
      train.squashX += (1 - train.squashX) * Math.min(1, dt * 8);
      train.squashY += (1 - train.squashY) * Math.min(1, dt * 8);
      train.jumpOffsetY += (0 - train.jumpOffsetY) * Math.min(1, dt * 7);

      // Ритмічний звук коліс та пара з труби
      sound.chugTimer += dt * currentSpeedFactor;
      if (sound.chugTimer >= 0.48) {
        sound.chugTimer = 0;
        sound.playChug(currentSpeedFactor);
      }

      smokeAccum += dt * currentSpeedFactor;
      if (smokeAccum >= 0.14) {
        smokeAccum = 0;
        spawnSmokePuff(TRAIN_X + 88, train.currentY - 115 + train.jumpOffsetY, currentSpeedFactor > 1.8);
      }

      if (screenShakeTimer > 0) {
        screenShakeTimer = Math.max(0, screenShakeTimer - dt);
      }

      // 3. Оновлення частинок
      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const p = smokeParticles[i];
        p.life += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        const t = p.life / p.maxLife;
        p.radius = 11 + (p.maxRadius - 11) * t;
        p.alpha = Math.max(0, 0.8 * (1 - t));
        if (p.life >= p.maxLife) smokeParticles.splice(i, 1);
      }

      for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const sp = sparkParticles[i];
        sp.life += dt;
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.vy += 340 * dt;
        if (sp.life >= sp.maxLife) sparkParticles.splice(i, 1);
      }

      for (let i = starParticles.length - 1; i >= 0; i--) {
        const st = starParticles[i];
        st.life += dt;
        st.x += st.vx * dt;
        st.y += st.vy * dt;
        st.vy += 240 * dt;
        st.rot += st.vRot * dt;
        if (st.life >= st.maxLife) starParticles.splice(i, 1);
      }

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const cf = confettiParticles[i];
        cf.life += dt;
        cf.x += cf.vx * dt + Math.sin(cf.life * 8) * 60 * dt;
        cf.y += cf.vy * dt;
        cf.rot += cf.vRot * dt;
        if (cf.life >= cf.maxLife) confettiParticles.splice(i, 1);
      }

      for (let i = bloomingFlowers.length - 1; i >= 0; i--) {
        const bf = bloomingFlowers[i];
        bf.life += dt;
        const growT = Math.min(1, bf.life / 0.35);
        bf.currentH = bf.targetH * (1 - Math.pow(1 - growT, 3));
        if (bf.life >= bf.maxLife) bloomingFlowers.splice(i, 1);
      }

      for (let i = butterflyParticles.length - 1; i >= 0; i--) {
        const bt = butterflyParticles[i];
        bt.life += dt;
        bt.wingPhase += dt * 22;
        bt.x += bt.vx * dt + Math.sin(bt.life * 7) * 90 * dt;
        bt.y += bt.vy * dt;
        if (bt.life >= bt.maxLife) butterflyParticles.splice(i, 1);
      }

      for (let i = trackEnergyWaves.length - 1; i >= 0; i--) {
        const tw = trackEnergyWaves[i];
        tw.life += dt;
        tw.x += 1350 * dt;
        if (tw.life >= tw.maxLife) trackEnergyWaves.splice(i, 1);
      }

      for (let i = speedLines.length - 1; i >= 0; i--) {
        const sl = speedLines[i];
        sl.life += dt;
        sl.x -= 1400 * dt;
        if (sl.life >= sl.maxLife) speedLines.splice(i, 1);
      }

      // 4. Анімація польоту спійманого значка будови слова до підсвіченої морфеми зверху
      if (flyingSymbol) {
        flyingSymbol.t = Math.min(1, flyingSymbol.t + dt * 2.6);
        const ease = 1 - Math.pow(1 - flyingSymbol.t, 3);
        flyingSymbol.x = flyingSymbol.startX + (flyingSymbol.targetX - flyingSymbol.startX) * ease;
        flyingSymbol.y = flyingSymbol.startY + (flyingSymbol.targetY - flyingSymbol.startY) * ease - Math.sin(ease * Math.PI) * 140;

        if (flyingSymbol.t >= 1) {
          flyingSymbol = null;
          if (currentTask) {
            currentTask.crowned = true;
            currentTask.crownPulse = 1.0;
          }
          triggerNonVerbalCelebration();
        }
        return;
      }

      // 5. Таймер святкування перед переходом до наступного слова
      if (activeCelebration.active) {
        activeCelebration.timer += dt;
        if (currentTask && currentTask.crownPulse > 0) {
          currentTask.crownPulse = Math.max(0, currentTask.crownPulse - dt * 1.2);
        }
        if (activeCelebration.timer >= activeCelebration.duration) {
          activeCelebration.active = false;
          pickNextWordTask(false);
        }
        return;
      }

      // 6. Рух медальйонів зі значками будови слова на 3 коліях
      if (medallions.length === 0) {
        waveSpawnTimer -= dt;
        if (waveSpawnTimer <= 0) {
          spawnSymbolMedallions();
        }
      } else {
        const hitLeft = TRAIN_X - 95;
        const hitRight = TRAIN_X + 115;

        for (let i = 0; i < medallions.length; i++) {
          const m = medallions[i];
          m.pulsePhase += dt * 4.5;

          if (m.bouncingOff) {
            m.x += m.vx * dt;
            m.y += m.vy * dt;
            m.vy += 650 * dt;
            m.rot += 9 * dt;
            continue;
          }

          m.x -= effectiveWaveSpeed * dt;
          m.wheelAngle -= dt * 4.5 * currentSpeedFactor;

          if (!m.evaluated && m.x - m.radius <= hitRight && m.x + m.radius >= hitLeft) {
            if (Math.abs(train.currentY - m.y) < 62) {
              handleMedallionCatch(m);
              break;
            }
          }
        }

        // Якщо всі медальйони проїхали лівий край — генеруємо нову хвилю для цього ж слова
        const activeRemaining = medallions.some(m => !m.bouncingOff && m.x > -140);
        if (!activeRemaining) {
          medallions = [];
          waveSpawnTimer = 0.25;
        }
      }
    }

    function handleMedallionCatch(caughtMedallion) {
      if (caughtMedallion.isCorrect) {
        // ПРАВИЛЬНИЙ ЗНАЧОК МОРФЕМИ!
        medallions = [];
        boostTimer = 0; // Плавно повертаємося до спокійної швидкості

        train.squashX = 1.22;
        train.squashY = 0.82;
        spawnStarBurst(caughtMedallion.x, caughtMedallion.y - 30, 20);

        // Запускаємо політ значка від потяга прямо над підсвіченою морфемою у слові
        flyingSymbol = {
          key: caughtMedallion.morphemeKey,
          startX: caughtMedallion.x,
          startY: caughtMedallion.y - 30,
          x: caughtMedallion.x,
          y: caughtMedallion.y - 30,
          targetX: currentTask.targetCenterX,
          targetY: currentTask.targetTopY,
          t: 0
        };
      } else {
        // НЕПРАВИЛЬНИЙ ЗНАЧОК — кумедний пружний відскок без слів
        sound.playFunnyBoing();
        boostTimer = 0;
        screenShakeTimer = 0.18;

        // Локомотив смішно стискається як пружинка і випускає фіолетові кільця диму
        train.squashX = 0.72;
        train.squashY = 1.32;
        for (let i = 0; i < 8; i++) {
          spawnSmokePuff(TRAIN_X + 88, train.currentY - 115, true);
        }

        // Всі медальйони цієї хвилі пружно відскакують, звільняючи колії для нової спроби
        medallions.forEach(m => {
          m.evaluated = true;
          m.bouncingOff = true;
          m.vx = 180 + Math.random() * 140;
          m.vy = -260 - Math.random() * 120;
        });
      }
    }

    /* =========================================================================
       11. БАЗОВІ ГРАФІЧНІ ПРИМІТИВИ ТА УКРАЇНСЬКІ ГРАМАТИЧНІ ЗНАЧКИ
       ========================================================================= */
    function drawRoundedRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // Багата стилізована панель (різьблене дерево, латунь, коштовне каміння, український орнамент)
    function drawStylizedBoard(x, y, w, h, radius, cTop, cBot, borderCol = '#f4b446', withFolkPattern = true) {
      ctx.save();

      // Глибока тінь
      ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
      drawRoundedRect(x + 5, y + 8, w, h, radius);
      ctx.fill();

      // Основний градієнт
      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, cTop);
      grad.addColorStop(1, cBot);
      ctx.fillStyle = grad;
      drawRoundedRect(x, y, w, h, radius);
      ctx.fill();

      // Внутрішня текстура та вишитий геометричний орнамент
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.045)';
      ctx.lineWidth = 10;
      for (let sx = x - h; sx < x + w + h; sx += 30) {
        ctx.beginPath();
        ctx.moveTo(sx, y);
        ctx.lineTo(sx + h, y + h);
        ctx.stroke();
      }

      if (withFolkPattern) {
        ctx.fillStyle = 'rgba(255, 213, 79, 0.18)';
        for (let rx = x + 22; rx < x + w - 18; rx += 26) {
          // Верхні та нижні ромбики орнаменту
          [y + 11, y + h - 11].forEach(ry => {
            ctx.beginPath();
            ctx.moveTo(rx, ry - 6);
            ctx.lineTo(rx + 7, ry);
            ctx.lineTo(rx, ry + 6);
            ctx.lineTo(rx - 7, ry);
            ctx.closePath();
            ctx.fill();
          });
        }
      }
      ctx.restore();

      // Внутрішній золотистий кант
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';
      ctx.lineWidth = 2.5;
      drawRoundedRect(x + 3, y + 3, w - 6, h - 6, Math.max(3, radius - 3));
      ctx.stroke();

      // Зовнішня металева оправа
      ctx.strokeStyle = borderCol;
      ctx.lineWidth = 4;
      drawRoundedRect(x, y, w, h, radius);
      ctx.stroke();

      // Кутові латунні заклепки
      const off = 12;
      [[x + off, y + off], [x + w - off, y + off], [x + off, y + h - off], [x + w - off, y + h - off]].forEach(([rx, ry]) => {
        ctx.fillStyle = borderCol;
        ctx.beginPath();
        ctx.arc(rx, ry, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();
    }

    /**
     * Малювання офіційних шкільних графічних значків будови слова (НУШ):
     * - prefix: ¬ (горизонтальна риска зверху і вертикальний гачок праворуч вниз)
     * - root:   ⌒ (плавна дуга-місточок)
     * - suffix: ^ (чіткий симетричний дашок /\)
     * - ending: □ (прямокутна рамочка/віконечко)
     */
    function drawMorphemeSymbolGraphic(key, cx, cy, w, h, strokeColor = '#fff8e1', lineWidth = 8) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const halfW = w / 2;
      const halfH = h / 2;

      // Темна підкладка-контур для бездоганної читабельності
      const drawPath = () => {
        ctx.beginPath();
        if (key === 'prefix') {
          // Значок префікса: ¬
          ctx.moveTo(cx - halfW, cy - halfH * 0.55);
          ctx.lineTo(cx + halfW, cy - halfH * 0.55);
          ctx.lineTo(cx + halfW, cy + halfH * 0.85);
        } else if (key === 'root') {
          // Значок кореня: ⌒
          ctx.moveTo(cx - halfW, cy + halfH * 0.65);
          ctx.quadraticCurveTo(cx, cy - halfH * 1.15, cx + halfW, cy + halfH * 0.65);
        } else if (key === 'suffix') {
          // Значок суфікса: ^
          ctx.moveTo(cx - halfW, cy + halfH * 0.7);
          ctx.lineTo(cx, cy - halfH * 0.85);
          ctx.lineTo(cx + halfW, cy + halfH * 0.7);
        } else if (key === 'ending') {
          // Значок закінчення: □
          drawRoundedRect(cx - halfW * 0.78, cy - halfH * 0.78, w * 0.78, h * 1.56, 6);
        }
      };

      ctx.strokeStyle = 'rgba(15, 20, 35, 0.75)';
      ctx.lineWidth = lineWidth + 5;
      drawPath();
      ctx.stroke();

      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = lineWidth;
      drawPath();
      ctx.stroke();

      ctx.restore();
    }

    function drawStar(cx, cy, outerR, innerR, rot, fillCol) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (i * Math.PI) / 5 - Math.PI / 2;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = fillCol;
      ctx.fill();
      ctx.strokeStyle = '#fffde7';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();
    }

    /* =========================================================================
       12. РЕНДЕРИНГ СЮЖЕТНОГО ЖИВОГО ФОНУ ТА КОЛІЙ
       ========================================================================= */
    function drawLivingBackground() {
      // 1. Тепле сонячне небо
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 500);
      skyGrad.addColorStop(0, '#1a3668');
      skyGrad.addColorStop(0.48, '#2c5aa0');
      skyGrad.addColorStop(0.82, '#f59f5b');
      skyGrad.addColorStop(1, '#fde08d');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, LOGICAL_WIDTH, 500);

      // Живе сонце з променями (пульсує сильніше під час святкування Mode 2)
      const sunX = 1620;
      const sunY = 230;
      const extraSunPulse = (activeCelebration.active && activeCelebration.mode === 2) ? 1.35 : 1.0;

      ctx.save();
      ctx.translate(sunX, sunY);
      ctx.rotate(performance.now() * 0.0002);
      ctx.fillStyle = activeCelebration.active && activeCelebration.mode === 2
        ? 'rgba(255, 245, 157, 0.28)'
        : 'rgba(255, 236, 153, 0.15)';
      for (let i = 0; i < 14; i++) {
        ctx.rotate(Math.PI / 7);
        ctx.beginPath();
        ctx.moveTo(-18 * extraSunPulse, 0);
        ctx.lineTo(0, -210 * extraSunPulse);
        ctx.lineTo(18 * extraSunPulse, 0);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      const sunGrad = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, 88 * extraSunPulse);
      sunGrad.addColorStop(0, '#fffde7');
      sunGrad.addColorStop(0.55, '#ffd54f');
      sunGrad.addColorStop(1, 'rgba(255, 183, 77, 0)');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 88 * extraSunPulse, 0, Math.PI * 2);
      ctx.fill();

      // Хмаринки
      world.clouds.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        const cGrad = ctx.createLinearGradient(0, -32, 0, 28);
        cGrad.addColorStop(0, '#fff9eb');
        cGrad.addColorStop(1, '#f5c79e');
        ctx.fillStyle = cGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.arc(32, -10, 36, 0, Math.PI * 2);
        ctx.arc(68, -2, 30, 0, Math.PI * 2);
        ctx.arc(96, 8, 22, 0, Math.PI * 2);
        ctx.arc(-26, 8, 22, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Зграйки птахів
      ctx.strokeStyle = '#263859';
      ctx.lineWidth = 2.8;
      world.birds.forEach(b => {
        const wy = Math.sin(b.wingPhase) * 8;
        ctx.beginPath();
        ctx.moveTo(b.x - 13, b.y + wy);
        ctx.quadraticCurveTo(b.x - 5, b.y - 6, b.x, b.y);
        ctx.quadraticCurveTo(b.x + 5, b.y - 6, b.x + 13, b.y + wy);
        ctx.stroke();
      });

      // 2. Далекі Карпатські гори та кам'яний віадук
      ctx.fillStyle = '#3b527b';
      ctx.beginPath();
      ctx.moveTo(0, 500);
      for (let x = -960; x <= LOGICAL_WIDTH + 960; x += 480) {
        const dx = x - world.farMountainsX;
        ctx.lineTo(dx, 415);
        ctx.quadraticCurveTo(dx + 120, 275, dx + 240, 365);
        ctx.quadraticCurveTo(dx + 360, 255, dx + 480, 415);
      }
      ctx.lineTo(LOGICAL_WIDTH, 500);
      ctx.closePath();
      ctx.fill();

      // 3. Середні смарагдові пагорби з блискучою річкою
      const hillGrad = ctx.createLinearGradient(0, 345, 0, 500);
      hillGrad.addColorStop(0, '#43a047');
      hillGrad.addColorStop(1, '#1b5e20');
      ctx.fillStyle = hillGrad;
      ctx.beginPath();
      ctx.moveTo(0, 500);
      for (let x = -800; x <= LOGICAL_WIDTH + 800; x += 400) {
        const dx = x - world.midHillsX;
        ctx.quadraticCurveTo(dx + 100, 355, dx + 200, 415);
        ctx.quadraticCurveTo(dx + 300, 460, dx + 400, 395);
      }
      ctx.lineTo(LOGICAL_WIDTH, 500);
      ctx.closePath();
      ctx.fill();

      // Блискуча синя стрічка річки вздовж долини
      const riverGrad = ctx.createLinearGradient(0, 452, 0, 492);
      riverGrad.addColorStop(0, '#29b6f6');
      riverGrad.addColorStop(1, '#0277bd');
      ctx.fillStyle = riverGrad;
      ctx.fillRect(0, 456, LOGICAL_WIDTH, 34);

      // Хвильки на воді
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
      ctx.lineWidth = 2.5;
      for (let rx = 20; rx < LOGICAL_WIDTH; rx += 95) {
        const waveShift = Math.sin(world.riverRipplePhase + rx * 0.05) * 14;
        ctx.beginPath();
        ctx.moveTo(rx + waveShift, 468);
        ctx.lineTo(rx + 36 + waveShift, 468);
        ctx.stroke();
      }

      // 4. Сюжетні елементи на пагорбах (смереки, мальовничі хатинки, вітряки, соняшники)
      world.scenicItems.forEach(item => {
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.scale(item.scale, item.scale);

        if (item.type === 'pine') {
          ctx.fillStyle = '#4e342e';
          ctx.fillRect(-5, 0, 10, 24);
          const cols = ['#1b5e20', '#2e7d32', '#388e3c'];
          ctx.fillStyle = cols[item.variant];
          for (let t = 0; t < 3; t++) {
            ctx.beginPath();
            ctx.moveTo(0, -60 + t * 17);
            ctx.lineTo(-26 + t * 3, -18 + t * 17);
            ctx.lineTo(26 - t * 3, -18 + t * 17);
            ctx.closePath();
            ctx.fill();
          }
        } else if (item.type === 'oak') {
          ctx.fillStyle = '#5d4037';
          ctx.fillRect(-6, -4, 12, 28);
          ctx.fillStyle = item.variant === 0 ? '#66bb6a' : '#ffa726';
          ctx.beginPath();
          ctx.arc(0, -28, 24, 0, Math.PI * 2);
          ctx.arc(-17, -16, 18, 0, Math.PI * 2);
          ctx.arc(17, -16, 18, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'cottage') {
          // Українська чепурна хатинка з розписом
          ctx.fillStyle = '#fff3e0';
          ctx.fillRect(-22, -18, 44, 30);
          ctx.fillStyle = '#d84315';
          ctx.fillRect(-22, 6, 44, 6);
          ctx.fillStyle = '#6d4c41';
          ctx.beginPath();
          ctx.moveTo(-28, -18);
          ctx.lineTo(0, -42);
          ctx.lineTo(28, -18);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#ffd54f';
          ctx.fillRect(-7, -9, 14, 12);
        } else if (item.type === 'windmill') {
          // Дерев'яний вітряк із крилами, що обертаються
          ctx.fillStyle = '#8d6e63';
          ctx.beginPath();
          ctx.moveTo(-16, 14);
          ctx.lineTo(-10, -38);
          ctx.lineTo(10, -38);
          ctx.lineTo(16, 14);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#5d4037';
          ctx.beginPath();
          ctx.arc(0, -38, 11, Math.PI, 0);
          ctx.fill();

          ctx.save();
          ctx.translate(0, -28);
          ctx.rotate(world.windmillBladeAngle);
          ctx.strokeStyle = '#ffd54f';
          ctx.lineWidth = 3;
          for (let b = 0; b < 4; b++) {
            ctx.rotate(Math.PI / 2);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -30);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255, 248, 225, 0.75)';
            ctx.fillRect(0, -28, 7, 18);
          }
          ctx.restore();
        } else if (item.type === 'sunflowers') {
          // Кущик золотих соняшників
          [-10, 0, 11].forEach((sx, sIdx) => {
            const sh = 18 + (sIdx % 2) * 7;
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(sx - 1.5, -sh, 3, sh + 10);
            ctx.fillStyle = '#ffd54f';
            ctx.beginPath();
            ctx.arc(sx, -sh, 7.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#4e342e';
            ctx.beginPath();
            ctx.arc(sx, -sh, 4, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.restore();
      });

      // 5. Залізничний насип та 3 паралельні сталеві колії
      const embankmentGrad = ctx.createLinearGradient(0, 485, 0, LOGICAL_HEIGHT);
      embankmentGrad.addColorStop(0, '#3e2723');
      embankmentGrad.addColorStop(0.12, '#2b1c19');
      embankmentGrad.addColorStop(1, '#160d0c');
      ctx.fillStyle = embankmentGrad;
      ctx.fillRect(0, 485, LOGICAL_WIDTH, LOGICAL_HEIGHT - 485);

      // Смарагдова трава на узбіччі насипу
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, 480, LOGICAL_WIDTH, 18);

      // Квіти на узбіччі (соняшники, маки, ромашки)
      world.foregroundFlowers.forEach(fl => {
        const fy = 510 + fl.row * 172;
        ctx.fillStyle = '#43a047';
        ctx.fillRect(fl.x - 1.5, fy - 10, 3, 12);
        if (fl.kind === 'sunflower') {
          ctx.fillStyle = '#ffd54f';
          ctx.beginPath();
          ctx.arc(fl.x, fy - 12, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#3e2723';
          ctx.beginPath();
          ctx.arc(fl.x, fy - 12, 3.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (fl.kind === 'poppy') {
          ctx.fillStyle = '#e53935';
          ctx.beginPath();
          ctx.arc(fl.x, fy - 11, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#212121';
          ctx.beginPath();
          ctx.arc(fl.x, fy - 11, 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#fff59d';
          ctx.beginPath();
          ctx.arc(fl.x, fy - 10, 5.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Малюємо 3 колії
      TRACK_Y.forEach((ty, idx) => {
        const isCurrent = (idx === train.trackIndex);

        const bedGrad = ctx.createLinearGradient(0, ty - 42, 0, ty + 52);
        bedGrad.addColorStop(0, isCurrent ? '#5d4037' : '#43302b');
        bedGrad.addColorStop(0.5, isCurrent ? '#6d4c41' : '#4e342e');
        bedGrad.addColorStop(1, '#261815');
        ctx.fillStyle = bedGrad;
        ctx.fillRect(0, ty - 38, LOGICAL_WIDTH, 82);

        if (isCurrent) {
          ctx.fillStyle = 'rgba(255, 213, 79, 0.09)';
          ctx.fillRect(0, ty - 40, LOGICAL_WIDTH, 86);
        }

        // Дерев'яні шпали
        for (let x = -world.sleeperOffset; x < LOGICAL_WIDTH + 52; x += 52) {
          ctx.fillStyle = '#3e2723';
          ctx.fillRect(x, ty - 30, 18, 68);
          ctx.fillStyle = '#5d4037';
          ctx.fillRect(x + 2, ty - 28, 14, 64);
          ctx.fillStyle = '#90a4ae';
          ctx.fillRect(x + 3, ty - 20, 12, 4);
          ctx.fillRect(x + 3, ty + 20, 12, 4);
        }

        // Рейки
        [-18, 22].forEach(rOff => {
          ctx.fillStyle = '#37474f';
          ctx.fillRect(0, ty + rOff, LOGICAL_WIDTH, 8);
          ctx.fillStyle = isCurrent ? '#fff8e1' : '#b0bec5';
          ctx.fillRect(0, ty + rOff, LOGICAL_WIDTH, 3.5);
        });
      });

      // Світлові хвилі вздовж колій під час салюту Mode 3
      trackEnergyWaves.forEach(tw => {
        const alpha = 1 - tw.life / tw.maxLife;
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        const wGrad = ctx.createRadialGradient(tw.x, tw.y, 10, tw.x, tw.y, 110);
        wGrad.addColorStop(0, '#fffde7');
        wGrad.addColorStop(0.5, '#ffd700');
        wGrad.addColorStop(1, 'rgba(255, 215, 0, 0)');
        ctx.fillStyle = wGrad;
        ctx.beginPath();
        ctx.arc(tw.x, tw.y, 110, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Лінії потоку вітру при плавному прискоренні
      speedLines.forEach(sl => {
        const alpha = (1 - sl.life / sl.maxLife) * 0.45;
        ctx.save();
        ctx.strokeStyle = `rgba(255, 248, 225, ${alpha})`;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sl.x, sl.y);
        ctx.lineTo(sl.x + sl.length, sl.y);
        ctx.stroke();
        ctx.restore();
      });
    }

    /* =========================================================================
       13. РЕНДЕРИНГ МЕДАЛЬЙОНІВ ІЗ ГРАФІЧНИМИ ЗНАЧКАМИ БУДОВИ СЛОВА
       ========================================================================= */
    function drawSymbolMedallions() {
      medallions.forEach(m => {
        const meta = MORPHEME_TYPES[m.morphemeKey];
        const pulse = 1 + Math.sin(m.pulsePhase) * 0.045;

        ctx.save();
        ctx.translate(m.x, m.y - 26);
        ctx.rotate(m.rot);
        ctx.scale(pulse, pulse);

        // Два маленьких колеса вагончика-платформи внизу медальйона
        [-34, 34].forEach(wx => {
          ctx.save();
          ctx.translate(wx, 48);
          ctx.rotate(m.wheelAngle);
          ctx.fillStyle = '#263238';
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#ffd54f';
          ctx.stroke();
          ctx.restore();
        });

        // Різьблена підставка під медальйоном
        drawStylizedBoard(-64, 24, 128, 24, 10, '#4e342e', '#271815', '#f4b446', false);

        // Тінь круглого медальйона
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.beginPath();
        ctx.arc(4, -10, m.radius + 4, 0, Math.PI * 2);
        ctx.fill();

        // Зовнішній золотий обід медальйона
        const rimGrad = ctx.createLinearGradient(0, -14 - m.radius, 0, -14 + m.radius);
        rimGrad.addColorStop(0, '#ffe082');
        rimGrad.addColorStop(0.5, '#f4b446');
        rimGrad.addColorStop(1, '#b26a00');
        ctx.fillStyle = rimGrad;
        ctx.beginPath();
        ctx.arc(0, -14, m.radius + 4, 0, Math.PI * 2);
        ctx.fill();

        // Внутрішній коштовний щит (усі 3 медальйони мають благородний темно-смарагдово-сапфіровий фон,
        // щоб дитина обирала саме за формою значка будови слова!)
        const innerGrad = ctx.createRadialGradient(-14, -28, 6, 0, -14, m.radius - 4);
        innerGrad.addColorStop(0, '#304769');
        innerGrad.addColorStop(0.7, '#1b2b44');
        innerGrad.addColorStop(1, '#0f1829');
        ctx.fillStyle = innerGrad;
        ctx.beginPath();
        ctx.arc(0, -14, m.radius - 5, 0, Math.PI * 2);
        ctx.fill();

        // Декоративні заклепки по колу медальйона
        ctx.fillStyle = '#fff8e1';
        for (let a = 0; a < 8; a++) {
          const ang = (a * Math.PI) / 4;
          ctx.beginPath();
          ctx.arc(Math.cos(ang) * (m.radius - 1), -14 + Math.sin(ang) * (m.radius - 1), 2.8, 0, Math.PI * 2);
          ctx.fill();
        }

        // КРУПНИЙ ГРАФІЧНИЙ ЗНАЧОК БУДОВИ СЛОВА ВСЕРЕДИНІ МЕДАЛЬЙОНА (Префікс ¬, Корінь ⌒, Суфікс ^, Закінчення □)
        drawMorphemeSymbolGraphic(m.morphemeKey, 0, -14, 58, 34, '#ffd54f', 8.5);

        ctx.restore();
      });
    }

    /* =========================================================================
       14. РЕНДЕРИНГ КАЗКОВОГО ЛОКОМОТИВА
       ========================================================================= */
    function drawLocomotive() {
      ctx.save();
      ctx.translate(TRAIN_X, train.currentY + train.jumpOffsetY);

      // Легкий нахил вперед під час плавного прискорення
      const boostLean = (currentSpeedFactor - 1) * 0.025;
      ctx.rotate(boostLean);
      ctx.scale(train.squashX, train.squashY);

      // Промінь прожектора
      const beamAlpha = 0.2 + Math.sin(train.headlightPulse) * 0.05;
      const beamGrad = ctx.createLinearGradient(115, -42, 410, -42);
      beamGrad.addColorStop(0, `rgba(255, 245, 157, ${beamAlpha})`);
      beamGrad.addColorStop(1, 'rgba(255, 245, 157, 0)');
      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(115, -50);
      ctx.lineTo(410, -110);
      ctx.lineTo(410, 26);

      // Тінь під колесами

      // 1. Передній відбійник (Cowcatcher)

      ctx.beginPath();

      ctx.closePath();

      // 2. Рама шасі

      // 3. Циліндричний котел з латунними поясами

      boilerGrad.addColorStop(0, '#26a69a');
      boilerGrad.addColorStop(0.5, '#00796b');
      boilerGrad.addColorStop(1, '#004d40');
      ctx.fillStyle = boilerGrad;
      drawRoundedRect(-30, -78, 140, 66, 16);
      ctx.fill();
      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffd54f';
      [6, 48, 88].forEach(bx => {
        ctx.fillRect(bx, -78, 7, 66);
      });

      // Носова кришка котла та золотий прожектор
      ctx.fillStyle = '#c62828';
      ctx.beginPath();
      ctx.arc(108, -45, 33, -Math.PI / 2, Math.PI / 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 3.5;
      ctx.stroke();

      ctx.fillStyle = '#fff59d';
      ctx.beginPath();
      ctx.arc(122, -45, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#f57f17';
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // 4. Димар з золотою короною
      ctx.fillStyle = '#263238';
      ctx.beginPath();
      ctx.moveTo(72, -78);
      ctx.lineTo(62, -120);
      ctx.lineTo(102, -120);
      ctx.lineTo(92, -78);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffd54f';
      drawRoundedRect(57, -127, 50, 10, 5);
      ctx.fill();

      // Золотий купол пари
      const domeGrad = ctx.createRadialGradient(22, -88, 2, 26, -78, 20);
      domeGrad.addColorStop(0, '#fff59d');
      domeGrad.addColorStop(1, '#f57f17');
      ctx.fillStyle = domeGrad;
      ctx.beginPath();
      ctx.arc(26, -78, 19, Math.PI, 0);
      ctx.closePath();
      ctx.fill();

      // 5. Кабіна машиніста з орнаментом-вишиванкою
      drawStylizedBoard(-120, -110, 98, 96, 12, '#e53935', '#8e0000', '#ffd54f', true);

      // Дашок кабіни
      ctx.fillStyle = '#f57f17';
      drawRoundedRect(-130, -120, 118, 14, 7);
      ctx.fill();
      ctx.strokeStyle = '#fff59d';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Вікно кабіни та усміхнений машиніст
      ctx.fillStyle = '#81d4fa';
      drawRoundedRect(-100, -96, 58, 44, 9);
      ctx.fill();
      ctx.strokeStyle = '#ffd54f';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffccbc';
      ctx.beginPath();
      ctx.arc(-71, -70, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#263238';
      ctx.beginPath();
      ctx.arc(-66, -72, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#263238';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(-67, -67, 5.5, 0.1, Math.PI - 0.2);
      ctx.stroke();

      ctx.fillStyle = '#1565c0';
      ctx.beginPath();
      ctx.arc(-72, -78, 13, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#ffd54f';
      ctx.fillRect(-85, -79, 28, 3.5);

      // 6. Три ведучі колеса з шатуном
      const wheelX = [-84, -14, 56];
      wheelX.forEach((wx, idx) => {
        const wy = 16;
        const r = idx === 2 ? 22 : 27;
        ctx.save();
        ctx.translate(wx, wy);
        ctx.rotate(train.wheelAngle);

        ctx.fillStyle = '#b71c1c';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4.5;
        ctx.strokeStyle = '#eceff1';
        ctx.stroke();

        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 2.8;
        for (let s = 0; s < 6; s++) {
          const a = (s * Math.PI) / 3;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * (r - 3), Math.sin(a) * (r - 3));
          ctx.stroke();
        }

        ctx.fillStyle = '#ffd54f';
        ctx.beginPath();
        ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      const rodX = Math.cos(train.wheelAngle) * 12;
      const rodY = Math.sin(train.wheelAngle) * 12;
      ctx.strokeStyle = '#cfd8dc';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-84 + rodX, 16 + rodY);
      ctx.lineTo(56 + rodX, 16 + rodY);
      ctx.stroke();

      ctx.restore();
    }

    /* =========================================================================
       15. ВЕЛИЧЕЗНЕ СЛОВО З ПІДСВІЧЕНОЮ ЧАСТИНОЮ ТА ГРАФІЧНІ КНОПКИ
       (ЖОДНИХ ЗАЙВИХ СЛІВ НА ЕКРАНІ — ЛИШЕ ЦІЛЬОВЕ СЛОВО!)
       ========================================================================= */
    function drawTopWordBanner() {
      if (!currentTask) return;

      // Крупний шрифт для 4 класу (106px!)
      ctx.font = 'bold 106px "Trebuchet MS", "Segoe UI", sans-serif';
      ctx.textBaseline = 'middle';

      // Обчислюємо ширину кожного сегмента слова для бездоганного стикування
      const segMetrics = currentTask.segments.map(seg => ({
        ...seg,
        width: ctx.measureText(seg.text).width
      }));

      const totalWordWidth = segMetrics.reduce((acc, s) => acc + s.width, 0);
      const bannerW = Math.max(820, totalWordWidth + 190);
      const bannerH = 236;
      const bannerX = (LOGICAL_WIDTH - bannerW) / 2;
      const bannerY = 22;

      // Зовнішня різьблена дерев'яно-золота рама та внутрішнє темно-сапфірове полотно
      drawStylizedBoard(bannerX, bannerY, bannerW, bannerH, 32, '#4e342e', '#241411', '#f4b446', true);
      drawStylizedBoard(bannerX + 22, bannerY + 22, bannerW - 44, bannerH - 44, 22, '#1c2b45', '#0e1726', '#d49b35', false);

      // Золоті ланцюжки кріплення зверху
      [bannerX + 95, bannerX + bannerW - 95].forEach(cx => {
        ctx.strokeStyle = '#f4b446';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(cx, 0);
        ctx.lineTo(cx, bannerY + 12);
        ctx.stroke();
      });

      const wordStartX = (LOGICAL_WIDTH - totalWordWidth) / 2;
      const wordCenterY = bannerY + 138;
      let cursorX = wordStartX;

      segMetrics.forEach(seg => {
        const segCenterX = cursorX + seg.width / 2;

        if (seg.highlight) {
          // Зберігаємо координати підсвіченої частини слова для прильоту значка
          currentTask.targetCenterX = segCenterX;
          currentTask.targetTopY = wordCenterY - 74;
          currentTask.targetWidth = seg.width;

          const meta = MORPHEME_TYPES[seg.key];
          const pulse = 0.5 + Math.sin(performance.now() * 0.006) * 0.5;
          const padX = 10;
          const plateX = cursorX - padX;
          const plateY = wordCenterY - 64;
          const plateW = seg.width + padX * 2;
          const plateH = 124;

          // Сяюча коштовна підкладка під виділеною частиною слова
          ctx.save();
          ctx.shadowColor = meta.glow;
          ctx.shadowBlur = 24 + pulse * 14;
          drawStylizedBoard(plateX, plateY, plateW, plateH, 20, meta.cTop, meta.cBot, meta.rim, false);
          ctx.restore();

          // Якщо дитина вже зловила правильний значок — малюємо його короною над цією морфемою!
          if (currentTask.crowned) {
            const cScale = 1 + currentTask.crownPulse * 0.28;
            ctx.save();
            ctx.translate(segCenterX, wordCenterY - 82);
            ctx.scale(cScale, cScale);
            drawMorphemeSymbolGraphic(
              seg.key,
              0,
              0,
              Math.max(68, Math.min(240, seg.width + 16)),
              38,
              '#ffd700',
              9
            );
            ctx.restore();
          } else {
            // Делікатні золоті іскорки над виділеною частиною слова, що привертають увагу дитини
            const sparkY = wordCenterY - 78 + Math.sin(performance.now() * 0.008) * 5;
            drawStar(segCenterX - 28, sparkY, 7, 3, performance.now() * 0.003, '#ffd54f');
            drawStar(segCenterX, sparkY - 6, 9, 4, -performance.now() * 0.003, '#fff59d');
            drawStar(segCenterX + 28, sparkY, 7, 3, performance.now() * 0.003, '#ffd54f');
          }
        }

        // Рендеримо літери сегмента величезним чітким шрифтом
        ctx.font = 'bold 106px "Trebuchet MS", "Segoe UI", sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        ctx.strokeStyle = '#090e17';
        ctx.lineWidth = 12;
        ctx.lineJoin = 'round';
        ctx.strokeText(seg.text, cursorX, wordCenterY);

        ctx.fillStyle = seg.highlight ? '#fffde7' : '#cfd8dc';
        ctx.fillText(seg.text, cursorX, wordCenterY);

        cursorX += seg.width;
      });

      // Якщо значок зараз летить від потяга до підсвіченої частини слова
      if (flyingSymbol) {
        ctx.save();
        ctx.translate(flyingSymbol.x, flyingSymbol.y);
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 22;
        drawMorphemeSymbolGraphic(flyingSymbol.key, 0, 0, 82, 44, '#ffd700', 10);
        ctx.restore();
      }
    }

    // Рендеринг виключно графічних кнопок (Звук, Далі ➔➔, Вгору ▲, Вниз ▼, Плавне прискорення ⚡)
    function drawGraphicalControls() {
      // 1. ВЕРХНІЙ ЛІВИЙ КУТ: Кнопка Звуку (іконка золотого грамофона/динаміка)
      const soundBtn = { x: 34, y: 34, w: 86, h: 86 };
      drawStylizedBoard(
        soundBtn.x,
        soundBtn.y,
        soundBtn.w,
        soundBtn.h,
        22,
        sound.muted ? '#455a64' : '#00796b',
        sound.muted ? '#263238' : '#004d40',
        '#ffd54f',
        false
      );
      ctx.save();
      ctx.translate(soundBtn.x + 43, soundBtn.y + 43);
      ctx.fillStyle = '#fff8e1';
      ctx.beginPath();
      ctx.moveTo(-18, -9);
      ctx.lineTo(-6, -9);
      ctx.lineTo(8, -21);
      ctx.lineTo(8, 21);
      ctx.lineTo(-6, 9);
      ctx.lineTo(-18, 9);
      ctx.closePath();
      ctx.fill();

      if (sound.muted) {
        ctx.strokeStyle = '#ff5252';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(13, -10);
        ctx.lineTo(25, 10);
        ctx.moveTo(25, -10);
        ctx.lineTo(13, 10);
        ctx.stroke();
      } else {
        ctx.strokeStyle = '#ffd54f';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(9, 0, 10, -0.7, 0.7);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(9, 0, 17, -0.7, 0.7);
        ctx.stroke();
      }
      ctx.restore();
      uiButtons.push({
        ...soundBtn,
        onClick: () => { sound.muted = !sound.muted; }
      });

      // 2. ВЕРХНІЙ ПРАВИЙ КУТ: Мінімалістична кнопка «Далі» (подвійна стрілка вперед без слів)
      const nextBtn = { x: LOGICAL_WIDTH - 134, y: 34, w: 100, h: 86 };
      drawStylizedBoard(nextBtn.x, nextBtn.y, nextBtn.w, nextBtn.h, 22, '#00897b', '#004d40', '#ffd54f', false);
      ctx.save();
      ctx.translate(nextBtn.x + 50, nextBtn.y + 43);
      ctx.fillStyle = '#fff8e1';
      // Перший шеврон-стрілка
      ctx.beginPath();
      ctx.moveTo(-22, -18);
      ctx.lineTo(0, 0);
      ctx.lineTo(-22, 18);
      ctx.lineTo(-14, 0);
      ctx.closePath();
      ctx.fill();
      // Другий шеврон-стрілка
      ctx.beginPath();
      ctx.moveTo(2, -18);
      ctx.lineTo(24, 0);
      ctx.lineTo(2, 18);
      ctx.lineTo(10, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      uiButtons.push({
        ...nextBtn,
        onClick: () => pickNextWordTask(true)
      });

      // 3. ЛІВИЙ НИЖНІЙ КУТ: Кнопки зміни колії Вгору (▲) та Вниз (▼)
      const upBtn = { x: 34, y: 825, w: 96, h: 96 };
      const downBtn = { x: 34, y: 940, w: 96, h: 96 };

      drawStylizedBoard(upBtn.x, upBtn.y, upBtn.w, upBtn.h, 24, '#283593', '#1a237e', '#ffd54f', false);
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath();
      ctx.moveTo(upBtn.x + 48, upBtn.y + 24);
      ctx.lineTo(upBtn.x + 74, upBtn.y + 66);
      ctx.lineTo(upBtn.x + 22, upBtn.y + 66);
      ctx.closePath();
      ctx.fill();

      drawStylizedBoard(downBtn.x, downBtn.y, downBtn.w, downBtn.h, 24, '#283593', '#1a237e', '#ffd54f', false);
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath();
      ctx.moveTo(downBtn.x + 48, downBtn.y + 72);
      ctx.lineTo(downBtn.x + 74, downBtn.y + 30);
      ctx.lineTo(downBtn.x + 22, downBtn.y + 30);
      ctx.closePath();
      ctx.fill();

      uiButtons.push({
        ...upBtn,
        onClick: () => switchTrack(train.trackIndex - 1)
      });
      uiButtons.push({
        ...downBtn,
        onClick: () => switchTrack(train.trackIndex + 1)
      });

      // 4. ПРАВИЙ НИЖНІЙ КУТ: Велика стилізована кнопка ПЛАВНОГО ПРИСКОРЕННЯ (Турбо-пара / Блискавка + Стрілки)
      const isBoosting = boostTimer > 0;
      const boostBtn = { x: LOGICAL_WIDTH - 168, y: 892, w: 134, h: 134 };
      const bPulse = isBoosting ? 1 + Math.sin(performance.now() * 0.02) * 0.06 : 1;

      ctx.save();
      ctx.translate(boostBtn.x + boostBtn.w / 2, boostBtn.y + boostBtn.h / 2);
      ctx.scale(bPulse, bPulse);

      if (isBoosting) {
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 28;
      }

      drawStylizedBoard(
        -boostBtn.w / 2,
        -boostBtn.h / 2,
        boostBtn.w,
        boostBtn.h,
        34,
        isBoosting ? '#ff8f00' : '#d84315',
        isBoosting ? '#e65100' : '#7f1d00',
        '#ffd54f',
        false
