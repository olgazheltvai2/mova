 * Повністю процедурна інтерактивна гра без зайвих слів, білих прямокутників чи емодзі.
 * Вивчаємо вживання апострофа (УКР) та розділових знаків (РУС) у словах з Я, Ю, Є, Ї (Е, Ё).

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Віртуальна широкоформатна роздільна здатність 16:9
const VW = 1920;
const VH = 1080;
let scale = 1;
let offsetX = 0;
let offsetY = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const scaleX = canvas.width / VW;
  const scaleY = canvas.height / VH;
  scale = Math.max(scaleX, scaleY); // Заповнюємо весь екран без полів, зберігаючи 16:9 у безпечній зоні
  // Використовуємо комбінований масштаб, щоб безпечна зона 1920x1080 завжди була видимою
  const safeScale = Math.min(scaleX, scaleY);
  scale = safeScale;
  offsetX = (canvas.width - VW * scale) / 2;
  offsetY = (canvas.height - VH * scale) / 2;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// WEB AUDIO SYNTHESIZER (БЕЗ ЗОВНІШНІХ ФАЙЛІВ)
// ==========================================
class SoundEngine {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playTone(freq, type, duration, delay = 0, vol = 0.16, slideTo = null) {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    }
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  playNoise(duration, delay = 0, vol = 0.08, filterFreq = 900) {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(filterFreq, t);
    filter.Q.setValueAtTime(1.8, t);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(t);
    noise.stop(t + duration);
  }

  // Дерев'яний клік
  woodClick(pitch = 1) {
    this.playTone(280 * pitch, 'triangle', 0.09, 0, 0.2, 140 * pitch);
    this.playTone(560 * pitch, 'sine', 0.05, 0.01, 0.12, 290 * pitch);
  }

  // Опускання бурштинового апострофа (кришталево-дерев'яний звук + пауза-розділення)
  dropAmber() {
    this.playTone(880, 'sine', 0.16, 0, 0.18, 1174);
    this.playTone(1318, 'triangle', 0.22, 0.08, 0.16, 1760);
    this.woodClick(1.1);
  }

  // З'єднання двох плотів разом ліаною (м'яке злиття)
  fuseRafts() {
    this.playNoise(0.18, 0, 0.1, 600);
    this.playTone(220, 'triangle', 0.15, 0.05, 0.22, 330);
    this.playTone(330, 'sine', 0.18, 0.12, 0.2, 440);
  }

  // Стрибки білочки по колодах
  squirrelHop(stepIndex) {
    const freqs = [392, 493.88, 587.33, 783.99];
    const f = freqs[stepIndex % freqs.length];
    this.playTone(f, 'sine', 0.11, 0, 0.15, f * 1.35);
    this.woodClick(0.9 + stepIndex * 0.12);
  }

  // 5 різних святкових звукових фідбеків при правильній відповіді
  celebrate(typeIndex) {
    if (typeIndex === 0) {
      // 1. Срібна форель і веселковий сплеск (Арфа + плескіт води)
      this.playNoise(0.35, 0.05, 0.14, 1100);
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
      notes.forEach((n, i) => this.playTone(n, 'sine', 0.38, i * 0.07, 0.15));
    } else if (typeIndex === 1) {
      // 2. Калейдоскоп метеликів (Дзвіночки + пташиний переспів)
      const notes = [659.25, 783.99, 987.77, 1174.66, 1318.5, 1567.98];
      notes.forEach((n, i) => {
        this.playTone(n, 'triangle', 0.3, i * 0.08, 0.13);
        this.playTone(n * 1.5, 'sine', 0.2, i * 0.08 + 0.03, 0.07);
      });
    } else if (typeIndex === 2) {
      // 3. Розквіт латаття (Лісова флейта)
      const notes = [440, 554.37, 659.25, 880, 1108.73];
      notes.forEach((n, i) => this.playTone(n, 'sine', 0.42, i * 0.09, 0.16, n * 1.02));
    } else if (typeIndex === 3) {
      // 4. Сонячні промені та світлячки (Маримба)
      const notes = [392, 493.88, 587.33, 783.99, 987.77, 1174.66];
      notes.forEach((n, i) => {
        this.playTone(n, 'sine', 0.22, i * 0.07, 0.2, n * 0.98);
      });
    } else {
      // 5. Річкова видра плескає в долоні (Ксилофон + веселий плескіт)
      this.playNoise(0.25, 0.1, 0.12, 850);
      this.playNoise(0.25, 0.3, 0.12, 950);
      const notes = [587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
      notes.forEach((n, i) => this.playTone(n, 'triangle', 0.2, i * 0.06, 0.17));
    }
  }

  // Кумедний звук жабки та булькання при помилці
  frogBoing() {
    this.playTone(170, 'sawtooth', 0.22, 0, 0.14, 95);
    this.playTone(135, 'triangle', 0.28, 0.14, 0.18, 290);
    this.playTone(290, 'sine', 0.22, 0.32, 0.15, 120);
    this.playNoise(0.22, 0.1, 0.1, 500);
  }

  // Фокус-підказка при кліку на медальйон-ілюстрацію (ритмічний звуковий натяк: з паузою або злито)
  rhythmHint(needsApostrophe) {
    if (needsApostrophe) {
      // Два чітко розділені дерев'яно-флейтові тони з паузою
      this.playTone(523.25, 'triangle', 0.11, 0, 0.18, 480);
      this.playTone(783.99, 'sine', 0.24, 0.24, 0.2, 880);
    } else {
      // Плавне злите глісандо без паузи
      this.playTone(440, 'sine', 0.34, 0, 0.2, 740);
    }
  }
}

// ==========================================
// ГЕНЕРАТОР ЗАВДАНЬ
// ==========================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nextWord(immediate = false) {
  if (deck.length === 0) {
    deck = shuffle(WORD_POOL[currentLang]);
  }
  const candidate = deck.pop();
  if (currentWord && candidate.left === currentWord.left && candidate.right === currentWord.right && deck.length > 0) {
    const alt = deck.pop();
    deck.unshift(candidate);
    currentWord = alt;
  } else {
    currentWord = candidate;
  }

  // Скидаємо стан плотів та персонажів
  raftState.yOffset = immediate ? -350 : -350;
  raftState.gap = 175;
  raftState.targetGap = 175;
  raftState.amberY = 315;
  raftState.targetAmberY = 315;
  raftState.amberScale = 1;
  raftState.shakeX = 0;
  raftState.tilt = 0;

  squirrel.x = squirrel.baseX;
  squirrel.y = squirrel.baseY;
  squirrel.jumpArc = 0;
  squirrel.hasNut = false;
  squirrel.facing = 1;

  bird.holdingAmber = true;
  activeParticles = [];
  celebrationActors = [];
  gameState = 'entering';
  stateTimer = 0;
}

// ==========================================
// ПЕРЕВІРКА ВИБОРУ ДИТИНИ
// ==========================================
function handleChoice(choseApostrophe) {
  if (gameState !== 'ready') return;
  sfx.init();

  const isCorrect = (choseApostrophe === currentWord.apo);

  if (isCorrect) {
    gameState = 'resolving_correct';
    stateTimer = 0;

    if (choseApostrophe) {
      // Зимородок опускає золотий бурштиновий апостроф прямо між плотами
      sfx.dropAmber();
      bird.holdingAmber = false;
      bird.wingFlap = 1.2;
      raftState.targetAmberY = 668;
      raftState.targetGap = 148;
      spawnSplashParticles(960, 680, '#ffcf40', 22);
    } else {
      // Зелена ліана стягує два плоти в одну міцну суцільну колоду
      sfx.fuseRafts();
      raftState.targetGap = 0;
      spawnSplashParticles(960, 695, '#68e370', 22);
    }
  } else {
    // Помилка: активний та кумедний невербальний фідбек з жабкою і хитанням плотів
    gameState = 'wrong_shake';
    stateTimer = 0;
    sfx.frogBoing();
    frog.throatScale = 1.4;
    frog.jumpY = -28;
    bird.wingFlap = 1.0;

    if (choseApostrophe) {
      // Бурштин опускається трохи й пружинить назад
      raftState.amberY = 470;
      raftState.targetAmberY = 315;
      spawnSplashParticles(960, 470, '#ffaa33', 14);
    } else {
      // Плоти стукаються і відскакують назад з бризками води
      raftState.gap = 65;
      raftState.targetGap = 175;
      spawnSplashParticles(960, 710, '#8be4ff', 18);
    }
  }
}

function spawnSplashParticles(x, y, color, count = 20) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 7;
    activeParticles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      r: 4 + Math.random() * 6,
      color,
      life: 1,
      decay: 0.018 + Math.random() * 0.015
    });
  }
}

  if (celebrationType === 0) {

        startX: 680 + i * 220,

        progress: -i * 0.18,
        dir: i % 2 === 0 ? 1 : -1

  } else if (celebrationType === 1) {
    // 2. Калейдоскоп яскравих лісових метеликів
    const colors = ['#ff7b3b', '#38d6ff', '#ffdf3b', '#ff5ca8', '#7bff6b'];

      celebrationActors.push({

        y: 780 + Math.random() * 140,

        vy: -3.5 - Math.random() * 3.5,
        color: colors[i % colors.length],
        size: 16 + Math.random() * 10,
        phase: Math.random() * Math.PI * 2
      });
    }
  } else if (celebrationType === 2) {
    // 3. Рожеве водяне латаття розквітає на воді із золотим пилком
    const positions = [
      { x: 640, y: 560 },
      { x: 960, y: 520 },
      { x: 1280, y: 565 },
      { x: 760, y: 850 },
      { x: 1180, y: 845 }
    ];
    positions.forEach((pos, idx) => {
      celebrationActors.push({
        kind: 'bloom_lily',
        x: pos.x,
        y: pos.y,
        bloom: 0,
        delay: idx * 0.08
      });
      spawnSplashParticles(pos.x, pos.y, '#ffe66d', 10);
    });
  } else if (celebrationType === 3) {
    // 4. Золоті сонячні промені крізь крони та танок світлячків
    celebrationActors.push({
      kind: 'sunbeams',
      intensity: 0
    });
    for (let i = 0; i < 40; i++) {
      spawnSplashParticles(550 + Math.random() * 820, 350 + Math.random() * 450, '#ffe95c', 1);
    }
  } else {
    // 5. Весела річкова видра виринає з води та плескає лапками
    celebrationActors.push({
      kind: 'otter',
      x: 960,
      y: 865,
      pop: 0
    });
    spawnSplashParticles(960, 865, '#8ee8ff', 30);
  }

  celebrationType = (celebrationType + 1) % 5;
}

// ==========================================
// МАЛЮВАННЯ ПРОЦЕДУРНИХ ІЛЮСТРАЦІЙ ДО СЛІВ
// ==========================================
function drawWordIllustration(ctx, icon, cx, cy, r, time) {
  ctx.save();
  ctx.translate(cx, cy);
  const scaleFactor = r / 70;
  ctx.scale(scaleFactor, scaleFactor);

  switch (icon) {
    case 'ball': {
      // Яскравий шкіряний м'яч зі смугами
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.clip();

      ctx.fillStyle = '#ff5238';
      ctx.fillRect(-45, -45, 90, 90);

      ctx.fillStyle = '#ffd438';
      ctx.beginPath();
      ctx.arc(-28, 0, 38, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2998ff';
      ctx.beginPath();
      ctx.arc(30, 0, 36, 0, Math.PI * 2);
      ctx.fill();

      // Відблиск
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.ellipse(-14, -18, 16, 9, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = '#5c2812';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.stroke();
      break;
    }

    case 'family': {
      // Родина їжачків / силуети тата, мами й малюка під теплим серцем
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.bezierCurveTo(-14, -36, -36, -20, 0, 4);
      ctx.bezierCurveTo(36, -20, 14, -36, 0, -18);
      ctx.fill();

      const members = [
        { x: -24, y: 16, s: 1.05, c: '#3b82f6' },
        { x: 24, y: 16, s: 1.0, c: '#ec4899' },
        { x: 0, y: 24, s: 0.78, c: '#f59e0b' }
      ];
      members.forEach(m => {
        ctx.fillStyle = m.c;
        ctx.beginPath();
        ctx.arc(m.x, m.y + 18, 16 * m.s, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#ffdbb5';
        ctx.beginPath();
        ctx.arc(m.x, m.y, 11 * m.s, 0, Math.PI * 2);
        ctx.fill();
      });
      break;
    }

    case 'five': {
      // Розкрита долонька (5 пальців) та 5 лісових ягід
      ctx.fillStyle = '#ffcc99';
      ctx.strokeStyle = '#9c5a25';
      ctx.lineWidth = 2.5;
      // Долоня
      ctx.beginPath();
      ctx.arc(0, 14, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      const fingers = [-0.85, -0.42, 0, 0.42, 0.85];
      fingers.forEach((ang, idx) => {
        ctx.save();
        ctx.rotate(ang);
        const len = idx === 2 ? 34 : (idx === 0 || idx === 4 ? 24 : 30);
        ctx.fillStyle = '#ffcc99';
        ctx.beginPath();
        ctx.roundRect(-5.5, -len, 11, len + 10, 5);
        ctx.fill();
        ctx.stroke();
        // Ягідка на кінчику
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(0, -len - 7, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      break;
    }

    case 'loach': {
      // В'юн (гнучка смугаста рибка, що звивається)
      ctx.strokeStyle = '#c97a2b';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-36, 15);
      ctx.bezierCurveTo(-18, -28, 18, 28, 34, -12);
      ctx.stroke();

      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 7;
      ctx.stroke();

      // Голова та вусики в'юна
      ctx.fillStyle = '#3d2512';
      ctx.beginPath();
      ctx.arc(34, -13, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#7a4419';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(39, -12);
      ctx.quadraticCurveTo(48, -20, 50, -8);
      ctx.moveTo(39, -10);
      ctx.quadraticCurveTo(48, -2, 46, 6);
      ctx.stroke();
      break;
    }

    case 'mint': {
      // Запашні листочки м'яти з прожилками
      const leaves = [
        { rot: -0.5, scale: 0.95, color: '#2ec4b6' },
        { rot: 0.5, scale: 0.95, color: '#20a39e' },
        { rot: 0, scale: 1.15, color: '#38ef7d' }
      ];
      leaves.forEach(l => {
        ctx.save();
        ctx.rotate(l.rot);
        ctx.scale(l.scale, l.scale);
        ctx.fillStyle = l.color;
        ctx.strokeStyle = '#0f5233';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, 26);
        ctx.bezierCurveTo(-26, 10, -24, -22, 0, -36);
        ctx.bezierCurveTo(24, -22, 26, 10, 0, 26);
        ctx.fill();
        ctx.stroke();
        // Прожилки
        ctx.beginPath();
        ctx.moveTo(0, 22);
        ctx.lineTo(0, -30);
        ctx.moveTo(0, 5);
        ctx.lineTo(-11, -5);
        ctx.moveTo(0, -5);
        ctx.lineTo(11, -15);
        ctx.stroke();
        ctx.restore();
      });
      break;
    }

    case 'feather': {
      // Барвисте пташине перо
      ctx.save();
      ctx.rotate(-0.45);
      const grad = ctx.createLinearGradient(0, -42, 0, 38);
      grad.addColorStop(0, '#38bdf8');
      grad.addColorStop(0.6, '#818cf8');
      grad.addColorStop(1, '#fbbf24');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 35);
      ctx.bezierCurveTo(-24, 10, -20, -28, 0, -44);
      ctx.bezierCurveTo(20, -28, 24, 10, 0, 35);
      ctx.fill();
      // Стрижень пера
      ctx.strokeStyle = '#fef3c7';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(0, 45);
      ctx.lineTo(0, -40);
      ctx.stroke();
      ctx.restore();
      break;
    }

    case 'weed': {
      // Колючий бур'ян (будяк з фіолетовою квіткою)
      ctx.strokeStyle = '#3a7d2c';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 38);
      ctx.lineTo(0, -10);
      ctx.stroke();
      // Колюче листя
      ctx.fillStyle = '#4f9d3a';
      [-1, 1].forEach(dir => {
        ctx.beginPath();
        ctx.moveTo(0, 20);
        ctx.lineTo(dir * 28, 6);
        ctx.lineTo(dir * 16, 22);
        ctx.lineTo(dir * 32, 26);
        ctx.lineTo(0, 32);
        ctx.fill();
      });
      // Пухнаста фіолетова шапка будяка
      ctx.fillStyle = '#c026d3';
      for (let i = -5; i <= 5; i++) {
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(i * 4.5, -36 - Math.abs(i % 2) * 5);
        ctx.strokeStyle = '#d946ef';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
      ctx.fillStyle = '#4d7c0f';
      ctx.beginPath();
      ctx.arc(0, -10, 12, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'nightingale': {
      // Соловейко співає на гілці (з нотками)
      ctx.strokeStyle = '#5c3a21';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-40, 24);
      ctx.lineTo(35, 16);
      ctx.stroke();
      // Тіло пташки
      ctx.fillStyle = '#9a6b41';
      ctx.beginPath();
      ctx.ellipse(-4, 4, 20, 14, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e6ccb2';
      ctx.beginPath();
      ctx.ellipse(2, 8, 13, 9, -0.1, 0, Math.PI * 2);
      ctx.fill();
      // Голова та відкритий у співі дзьоб
      ctx.fillStyle = '#9a6b41';
      ctx.beginPath();
      ctx.arc(12, -8, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(20, -12);
      ctx.lineTo(32, -16);
      ctx.lineTo(22, -7);
      ctx.moveTo(20, -7);
      ctx.lineTo(31, -4);
      ctx.lineTo(20, -3);
      ctx.fill();
      // Музичні нотки
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(28, -26, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(32, -26);
      ctx.lineTo(32, -40);
      ctx.lineTo(40, -37);
      ctx.stroke();
      break;
    }

    case 'nine': {
      // Гроно з 9 золотих жолудів / ягід у формі спіралі 9
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, -10, 16, 0, Math.PI * 2);
      ctx.moveTo(16, -10);
      ctx.quadraticCurveTo(18, 28, -14, 30);
      ctx.stroke();
      // 9 яскравих крапок-намистин
      ctx.fillStyle = '#ef476f';
      for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 34, Math.sin(a) * 34, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }

    case 'worm': {
      // Веселий рожевий черв'ячок виглядає з листка
      ctx.strokeStyle = '#f472b6';
      ctx.lineWidth = 15;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-28, 22);
      ctx.bezierCurveTo(-12, 22, -14, -8, 4, -4);
      ctx.bezierCurveTo(20, 0, 18, -22, 24, -26);
      ctx.stroke();
      // Очі черв'ячка
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(21, -28, 4, 0, Math.PI * 2);
      ctx.arc(29, -26, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(22, -28, 2, 0, Math.PI * 2);
      ctx.arc(30, -26, 2, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'hamster': {
      // Пухкенький хом'ячок із повними щічками
      ctx.fillStyle = '#e09f3e';
      // Вушка
      ctx.beginPath();
      ctx.arc(-20, -24, 9, 0, Math.PI * 2);
      ctx.arc(20, -24, 9, 0, Math.PI * 2);
      ctx.fill();
      // Голова та великі щічки
      ctx.beginPath();
      ctx.arc(0, -4, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff3b0';
      ctx.beginPath();
      ctx.arc(-18, 6, 15, 0, Math.PI * 2);
      ctx.arc(18, 6, 15, 0, Math.PI * 2);
      ctx.fill();
      // Очі й носик
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-10, -8, 3.5, 0, Math.PI * 2);
      ctx.arc(10, -8, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff758f';
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'yard': {
      // Затишне подвір'я з дерев'яним парканом і деревом
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(14, -14, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#78350f';
      ctx.fillRect(11, 2, 6, 22);
      // Будиночок
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(-30, -4, 28, 26);
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(-35, -4);
      ctx.lineTo(-16, -24);
      ctx.lineTo(3, -4);
      ctx.fill();
      // Парканчик
      ctx.fillStyle = '#d97706';
      for (let x = -32; x <= 30; x += 12) {
        ctx.fillRect(x, 12, 7, 18);
      }
      ctx.fillRect(-34, 18, 68, 4);
      break;
    }

    case 'health': {
      // Румяне яблучко та зелене серце здоров'я
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.bezierCurveTo(-24, -34, -42, 4, 0, 32);
      ctx.bezierCurveTo(42, 4, 24, -34, 0, -14);
      ctx.fill();
      // Зелений листочок зверху
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.ellipse(10, -24, 12, 6, -0.5, 0, Math.PI * 2);
      ctx.fill();
      // Світлий пульс
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-20, 2);
      ctx.lineTo(-8, 2);
      ctx.lineTo(-3, -10);
      ctx.lineTo(4, 12);
      ctx.lineTo(9, 2);
      ctx.lineTo(20, 2);
      ctx.stroke();
      break;
    }

    case 'finch': {
      // Два яскраві лісові в'юрки / крила в польоті
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(-18, -28, -42, -18, -32, 8);
      ctx.bezierCurveTo(-20, 16, -8, 14, 0, 6);
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(18, -28, 42, -18, 32, 8);
      ctx.bezierCurveTo(20, 16, 8, 14, 0, 6);
      ctx.fill();
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(0, 2, 10, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'storm': {
      // Грозова хмара з блискавкою та косим дощем (буря)
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.arc(-16, -8, 18, 0, Math.PI * 2);
      ctx.arc(4, -16, 22, 0, Math.PI * 2);
      ctx.arc(22, -6, 16, 0, Math.PI * 2);
      ctx.fill();
      // Блискавка
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.moveTo(4, 4);
      ctx.lineTo(-10, 20);
      ctx.lineTo(0, 20);
      ctx.lineTo(-6, 38);
      ctx.lineTo(14, 15);
      ctx.lineTo(3, 15);
      ctx.closePath();
      ctx.fill();
      break;
    }

    case 'star': {
      // Сяюча ранкова зоря
      ctx.fillStyle = '#fde047';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rad = i % 2 === 0 ? 38 : 16;
        const a = (i * Math.PI) / 5 - Math.PI / 2;
        const x = Math.cos(a) * rad;
        const y = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      break;
    }

    case 'calf': {
      // Миле плямисте телятко
      ctx.fillStyle = '#fde68a';
      // Вушка та ріжки
      ctx.beginPath();
      ctx.ellipse(-28, -10, 10, 5, -0.4, 0, Math.PI * 2);
      ctx.ellipse(28, -10, 10, 5, 0.4, 0, Math.PI * 2);
      ctx.fill();
      // Голова
      ctx.beginPath();
      ctx.arc(0, -4, 22, 0, Math.PI * 2);
      ctx.fill();
      // Плямка
      ctx.fillStyle = '#92400e';
      ctx.beginPath();
      ctx.arc(-8, -12, 9, 0, Math.PI * 2);
      ctx.fill();
      // Рожевий писок
      ctx.fillStyle = '#fda4af';
      ctx.beginPath();
      ctx.ellipse(0, 12, 18, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      // Очі та ніздрі
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(-8, -4, 3.5, 0, Math.PI * 2);
      ctx.arc(8, -4, 3.5, 0, Math.PI * 2);
      ctx.arc(-6, 12, 2.5, 0, Math.PI * 2);
      ctx.arc(6, 12, 2.5, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'baby': {
      // Усміхнене маля з кучериком
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(0, 2, 26, 0, Math.PI * 2);
      ctx.fill();
      // Кучерик
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, -24, 7, 0, Math.PI * 1.5);
      ctx.stroke();
      // Очі
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(-9, -2, 3.5, 0, Math.PI * 2);
      ctx.arc(9, -2, 3.5, 0, Math.PI * 2);
      ctx.fill();
      // Пустушка / усмішка
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(0, 11, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 15, 6, 0, Math.PI);
      ctx.stroke();
      break;
    }

    case 'holiday': {
      // Святкові повітряні кульки та прапорці
      const balloons = [
        { x: -16, y: -10, c: '#ef4444' },
        { x: 16, y: -12, c: '#3b82f6' },
        { x: 0, y: -20, c: '#eab308' }
      ];
      balloons.forEach(b => {
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + 16);
        ctx.lineTo(0, 34);
        ctx.stroke();
        ctx.fillStyle = b.c;
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, 13, 16, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      break;
    }

    case 'nail': {
      // Металевий цвях
      ctx.save();
      ctx.rotate(0.6);
      ctx.fillStyle = '#94a3b8';
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2.5;
      // Шапка цвяха
      ctx.beginPath();
      ctx.roundRect(-18, -36, 36, 9, 4);
      ctx.fill();
      ctx.stroke();
      // Стрижень і вістря
      ctx.beginPath();
      ctx.moveTo(-6, -27);
      ctx.lineTo(6, -27);
      ctx.lineTo(6, 22);
      ctx.lineTo(0, 38);
      ctx.lineTo(-6, 22);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      break;
    }

    case 'puree': {
      // Глиняна мисочка з теплим картопляним пюре
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(-10, -2, 16, Math.PI, 0);
      ctx.arc(10, -2, 16, Math.PI, 0);
      ctx.arc(0, -10, 18, Math.PI, 0);
      ctx.fill();
      // Миска
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.arc(0, -2, 32, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
      // Пара зверху
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 3;
      [-12, 0, 12].forEach(x => {
        ctx.beginPath();
        ctx.moveTo(x, -22);
        ctx.quadraticCurveTo(x - 5, -30, x + 3, -38);
        ctx.stroke();
      });
      break;
    }

    case 'people': {
      // Дружні люди тримаються за руки
      const p = [
        { x: -20, c: '#10b981' },
        { x: 0, c: '#f59e0b' },
        { x: 20, c: '#6366f1' }
      ];
      p.forEach(item => {
        ctx.fillStyle = item.c;
        ctx.beginPath();
        ctx.roundRect(item.x - 8, 0, 16, 26, 6);
        ctx.fill();
        ctx.fillStyle = '#fed7aa';
        ctx.beginPath();
        ctx.arc(item.x, -10, 9, 0, Math.PI * 2);
        ctx.fill();
      });
      break;
    }

    case 'woodpecker': {
      // Дятел у червоній шапочці на стовбурі дерева
      ctx.fillStyle = '#78350f';
      ctx.fillRect(-36, -40, 18, 80);
      // Тіло дятла
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.ellipse(4, 6, 14, 22, 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.ellipse(-2, 6, 8, 15, 0.2, 0, Math.PI * 2);
      ctx.fill();
      // Голова та червоний чубчик
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(4, -18, 11, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(2, -16, 9, 0, Math.PI);
      ctx.fill();
      // Міцний дзьоб до дерева
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.moveTo(-6, -18);
      ctx.lineTo(-22, -15);
      ctx.lineTo(-6, -12);
      ctx.fill();
      break;
    }

    case 'earth': {
      // Зелена планета Земля з материками
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(-12, -8, 16, 0, Math.PI * 2);
      ctx.arc(14, 10, 14, 0, Math.PI * 2);
      ctx.arc(8, -16, 10, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'wave': {
      // Блакитна річкова хвиля з білим гребенем
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.moveTo(-36, 20);
      ctx.bezierCurveTo(-24, -26, 12, -32, 24, -8);
      ctx.bezierCurveTo(10, -14, -4, 4, 8, 14);
      ctx.lineTo(36, 20);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(12, -10, 12, Math.PI * 0.9, Math.PI * 2.1);
      ctx.stroke();
      break;
    }

    case 'song': {
      // Золота арфа / мелодійна пісня з нотами
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-22, 16);
      ctx.lineTo(-22, -20);
      ctx.lineTo(18, -28);
      ctx.lineTo(18, 10);
      ctx.stroke();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(-28, 16, 9, 7, -0.3, 0, Math.PI * 2);
      ctx.ellipse(12, 10, 9, 7, -0.3, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'cherry': {
      // Дві стиглі вишеньки на гілочці
      ctx.strokeStyle = '#15803d';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-18, 14);
      ctx.quadraticCurveTo(-8, -15, 4, -28);
      ctx.moveTo(18, 16);
      ctx.quadraticCurveTo(12, -10, 4, -28);
      ctx.stroke();
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.ellipse(14, -26, 12, 6, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(-18, 18, 14, 0, Math.PI * 2);
      ctx.arc(18, 20, 14, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'clover': {
      // Трилисник конюшини з рожевою квіткою
      ctx.fillStyle = '#16a34a';
      [0, 2.1, 4.2].forEach(a => {
        ctx.save();
        ctx.rotate(a);
        ctx.beginPath();
        ctx.arc(-6, -18, 10, 0, Math.PI * 2);
        ctx.arc(6, -18, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.fill();
      break;
    }

    case 'crane': {
      // Стріла підйомного крана / підйом угору
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-24, 28);
      ctx.lineTo(-24, -18);
      ctx.lineTo(24, -28);
      ctx.stroke();
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(18, -26);
      ctx.lineTo(18, 8);
      ctx.stroke();
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(6, 8, 24, 18);
      break;
    }
  }

  ctx.restore();
}

// ==========================================
// МАЛЮВАННЯ СЮЖЕТНОГО ЖИВОГО СВІТУ
// ==========================================
function drawBackground(time) {
  // 1. Лісове небо та далекий каньйон
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 520);
  skyGrad.addColorStop(0, '#163828');
  skyGrad.addColorStop(0.55, '#2b6142');
  skyGrad.addColorStop(1, '#589e67');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, VW, 520);

  // М'яке сонячне сяйво в глибині лісу
  const sunGlow = ctx.createRadialGradient(960, 180, 30, 960, 180, 620);
  sunGlow.addColorStop(0, 'rgba(255, 243, 168, 0.55)');
  sunGlow.addColorStop(0.5, 'rgba(182, 232, 142, 0.2)');
  sunGlow.addColorStop(1, 'rgba(43, 97, 66, 0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, VW, 550);

  // Далекі силуети сосен на обрії
  ctx.fillStyle = '#204a33';
  for (let i = 0; i < 24; i++) {
    const tx = i * 88 - 20;
    const th = 160 + (i % 4) * 45;
    const sway = Math.sin(time * 0.8 + i) * 4;
    ctx.beginPath();
    ctx.moveTo(tx + sway, 460 - th);
    ctx.lineTo(tx - 48, 480);
    ctx.lineTo(tx + 48, 480);
    ctx.closePath();
    ctx.fill();
  }

  // 2. Гірська лісова річка (глибока бірюзова вода)
  const riverGrad = ctx.createLinearGradient(420, 440, 1500, VH);
  riverGrad.addColorStop(0, '#136f7a');
  riverGrad.addColorStop(0.45, '#0d5669');
  riverGrad.addColorStop(1, '#083344');
  ctx.fillStyle = riverGrad;
  ctx.fillRect(0, 440, VW, VH - 440);

  // Підводні тіні форелі, що плавають у річці
  riverFish.forEach(f => {
    f.x += f.speed * f.dir;
    if (f.dir === 1 && f.x > 1360) f.dir = -1;
    if (f.dir === -1 && f.x < 560) f.dir = 1;
    const wag = Math.sin(time * 6 + f.phase) * 5;

    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(f.dir, 1);
    ctx.fillStyle = 'rgba(4, 32, 44, 0.36)';
    ctx.beginPath();
    ctx.ellipse(0, 0, f.size, f.size * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-f.size + 2, 0);
    ctx.lineTo(-f.size - 12, -8 + wag);
    ctx.lineTo(-f.size - 12, 8 + wag);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // Хвильки та сонячні відблиски на воді
  ctx.lineCap = 'round';
  waterRipples.forEach(w => {
    w.y += w.speed;
    if (w.y > VH + 20) {
      w.y = 460;
      w.x = 480 + Math.random() * 960;
    }
    ctx.strokeStyle = `rgba(165, 243, 252, ${w.alpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(w.x - w.len / 2, w.y);
    ctx.quadraticCurveTo(w.x, w.y + Math.sin(time * 3 + w.x) * 4, w.x + w.len / 2, w.y);
    ctx.stroke();
  });

  // 3. Лівий та правий мшисті береги річки
  drawRiverBanks(time);
}

function drawRiverBanks(time) {
  // ЛІВИЙ БЕРЕГ (де чекає білочка)
  const leftBankGrad = ctx.createLinearGradient(0, 420, 520, VH);
  leftBankGrad.addColorStop(0, '#3a6b33');
  leftBankGrad.addColorStop(0.6, '#274e23');
  leftBankGrad.addColorStop(1, '#1a3618');
  ctx.fillStyle = leftBankGrad;
  ctx.beginPath();
  ctx.moveTo(0, 410);
  ctx.bezierCurveTo(320, 420, 490, 520, 470, 720);
  ctx.bezierCurveTo(450, 890, 530, 980, 490, VH);
  ctx.lineTo(0, VH);
  ctx.closePath();
  ctx.fill();

  // Кам'яний береговий виступ зліва
  ctx.fillStyle = '#57534e';
  ctx.beginPath();
  ctx.ellipse(270, 675, 195, 58, 0.04, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4d7c0f';
  ctx.beginPath();
  ctx.ellipse(265, 660, 185, 44, 0.04, 0, Math.PI * 2);
  ctx.fill();

  // ПРАВИЙ БЕРЕГ (де лежать горішки та ягоди)
  const rightBankGrad = ctx.createLinearGradient(1400, 420, VW, VH);
  rightBankGrad.addColorStop(0, '#3a6b33');
  rightBankGrad.addColorStop(0.6, '#274e23');
  rightBankGrad.addColorStop(1, '#1a3618');
  ctx.fillStyle = rightBankGrad;
  ctx.beginPath();
  ctx.moveTo(VW, 410);
  ctx.bezierCurveTo(1600, 420, 1430, 520, 1450, 720);
  ctx.bezierCurveTo(1470, 890, 1390, 980, 1430, VH);
  ctx.lineTo(VW, VH);
  ctx.closePath();
  ctx.fill();

  // Кам'яний виступ справа
  ctx.fillStyle = '#57534e';
  ctx.beginPath();
  ctx.ellipse(1650, 675, 195, 58, -0.04, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4d7c0f';
  ctx.beginPath();
  ctx.ellipse(1655, 660, 185, 44, -0.04, 0, Math.PI * 2);
  ctx.fill();

  // Скарбниця лісових горішків та ягід на правому березі
  drawRightBankTreats(1640, 645);

  // Могутнє дерево зліва та гілка, що простягається над центром річки (для пташки-зимородка)
  ctx.fillStyle = '#3e2413';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(160, 0);
  ctx.quadraticCurveTo(130, 320, 180, 580);
  ctx.lineTo(0, 580);
  ctx.closePath();
  ctx.fill();

  // Велика верхня гілка над річкою
  const branchSway = Math.sin(time * 1.4) * 3;
  ctx.strokeStyle = '#4a2c16';
  ctx.lineWidth = 28;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(90, 140);
  ctx.bezierCurveTo(420, 120 + branchSway, 720, 195 + branchSway, 1120, 175 + branchSway);
  ctx.stroke();

  // Пишне різьблене листя вздовж верхньої гілки
  const leafClusters = [220, 380, 540, 720, 1080];
  leafClusters.forEach((lx, idx) => {
    ctx.save();
    ctx.translate(lx, 155 + (idx % 2) * 20 + branchSway);
    ctx.rotate(Math.sin(time * 1.8 + idx) * 0.06);
    ctx.fillStyle = idx % 2 === 0 ? '#2d6a3e' : '#3f8545';
    for (let j = -2; j <= 2; j++) {
      ctx.beginPath();
      ctx.ellipse(j * 18, Math.abs(j) * 6, 16, 32, j * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawRightBankTreats(bx, by) {
  // Різьблений дубовий листок-підставка під горішки
  ctx.save();
  ctx.translate(bx, by);
  ctx.fillStyle = '#65a30d';
  ctx.beginPath();
  ctx.ellipse(0, 8, 65, 24, 0, 0, Math.PI * 2);
  ctx.fill();

  rightBankTreats.forEach(t => {
    ctx.save();
    ctx.translate(t.dx, t.dy);
    if (t.type === 'acorn') {
      // Лісовий жолудь
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.ellipse(0, 2, 14, 18, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.arc(-2, -10, 15, Math.PI, 0);
      ctx.fill();
    } else if (t.type === 'berry') {
      // Червона лісова ягода
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(-4, -4, 4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Лісовий горіх (фундук)
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.arc(0, -7, 10, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
  ctx.restore();
}

// ==========================================
// МАЛЮВАННЯ МЕДАЛЬЙОНА З ІЛЮСТРАЦІЄЮ СЛОВА
// ==========================================
function drawWordMedallion(time) {
  if (!currentWord) return;
  const mx = 235;
  const my = 245;
  const r = 92;
  const isHovered = pointer.hoverTarget === 'medallion';
  const pulse = isHovered ? 1.06 : 1 + Math.sin(time * 2.5) * 0.015;

  ctx.save();
  ctx.translate(mx, my);
  ctx.scale(pulse, pulse);

  // Ліана, на якій висить медальйон з дерева
  ctx.strokeStyle = '#3f6212';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(0, -250);
  ctx.lineTo(0, -r);
  ctx.stroke();

  // Вінок із зеленого листя навколо дерев'яного медальйона
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + time * 0.15;
    ctx.save();
    ctx.rotate(a);
    ctx.fillStyle = i % 2 === 0 ? '#4d7c0f' : '#65a30d';
    ctx.beginPath();
    ctx.ellipse(0, -r - 6, 12, 22, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Дерев'яний зріз дерева (без жодних білих прямокутників!)
  const woodGrad = ctx.createRadialGradient(-15, -15, 10, 0, 0, r);
  woodGrad.addColorStop(0, '#fef3c7');
  woodGrad.addColorStop(0.75, '#fcd34d');
  woodGrad.addColorStop(0.9, '#b45309');
  woodGrad.addColorStop(1, '#78350f');
  ctx.fillStyle = woodGrad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Річні кільця деревини
  ctx.strokeStyle = 'rgba(180, 83, 9, 0.22)';
  ctx.lineWidth = 2.5;
  [r * 0.45, r * 0.72].forEach(ringR => {
    ctx.beginPath();
    ctx.arc(0, 0, ringR, 0, Math.PI * 2);
    ctx.stroke();
  });

  // Малюємо кастомну процедурну ілюстрацію слова
  drawWordIllustration(ctx, currentWord.icon, 0, 0, r * 0.85, time);

  ctx.restore();
}

// ==========================================
// МАЛЮВАННЯ ПЛОТІВ ТА ІНТЕРАКТИВНИХ ЗОН ВИБОРУ
// ==========================================
function drawRaftsAndChoices(time) {
  if (!currentWord) return;

  const centerX = 960 + raftState.shakeX;
  const baseY = 685 + raftState.yOffset + Math.sin(time * 2.6) * 5;
  const halfGap = raftState.gap / 2;

  const raftW = 305;
  const raftH = 128;

  const leftRaftX = centerX - halfGap - raftW / 2;
  const rightRaftX = centerX + halfGap + raftW / 2;

  // 1. Хвилі-піна під плотами
  ctx.fillStyle = 'rgba(186, 230, 253, 0.28)';
  ctx.beginPath();
  ctx.ellipse(leftRaftX, baseY + 14, raftW * 0.56, raftH * 0.58, 0, 0, Math.PI * 2);
  ctx.ellipse(rightRaftX, baseY + 14, raftW * 0.56, raftH * 0.58, 0, 0, Math.PI * 2);
  ctx.fill();

  // 2. ІНТЕРАКТИВНА ЗОНА №2: ЖИВА ЗЕЛЕНА ЛІАНА МІЖ ПЛОТАМИ (З'єднати плоти БЕЗ апострофа)
  if (raftState.gap > 8) {
    const hoverFuse = pointer.hoverTarget === 'fuse';
    ctx.save();
    ctx.translate(centerX, baseY + 8);

    // Сяюче підсвічування при наведенні на ліану або плоти
    if (hoverFuse && gameState === 'ready') {
      const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 95);
      glow.addColorStop(0, 'rgba(134, 239, 172, 0.75)');
      glow.addColorStop(1, 'rgba(134, 239, 172, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 95, 0, Math.PI * 2);
      ctx.fill();
    }

    // Дві зелені ліани, що тягнуться від лівого і правого плоту до центрального вузла-листка
    ctx.strokeStyle = hoverFuse ? '#86efac' : '#4ade80';
    ctx.lineWidth = hoverFuse ? 9 : 7;
    ctx.beginPath();
    ctx.moveTo(-halfGap - 15, -12);
    ctx.bezierCurveTo(-halfGap * 0.4, -26, halfGap * 0.4, 26, halfGap + 15, -12);
    ctx.moveTo(-halfGap - 15, 14);
    ctx.bezierCurveTo(-halfGap * 0.4, 28, halfGap * 0.4, -24, halfGap + 15, 14);
    ctx.stroke();

    // Центральний смарагдовий вузол-медальйон зі стрілочками стягування плотів (><)
    const knotScale = hoverFuse ? 1.15 : 1 + Math.sin(time * 3.5) * 0.06;
    ctx.scale(knotScale, knotScale);

    const leafGrad = ctx.createRadialGradient(-8, -8, 4, 0, 0, 42);
    leafGrad.addColorStop(0, '#86efac');
    leafGrad.addColorStop(0.65, '#22c55e');
    leafGrad.addColorStop(1, '#14532d');
    ctx.fillStyle = leafGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#dcfce7';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Візуальний знак зближення двох колод (стрілочки назустріч одна одній -> <-)
    ctx.strokeStyle = '#052e16';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // Ліва стрілка вправо
    ctx.beginPath();
    ctx.moveTo(-22, 0);
    ctx.lineTo(-6, 0);
    ctx.moveTo(-14, -9);
    ctx.lineTo(-5, 0);
    ctx.lineTo(-14, 9);
    // Права стрілка вліво
    ctx.moveTo(22, 0);
    ctx.lineTo(6, 0);
    ctx.moveTo(14, -9);
    ctx.lineTo(5, 0);
    ctx.lineTo(14, 9);
    ctx.stroke();

    ctx.restore();
  }

  // 3. Малюємо ЛІВИЙ та ПРАВИЙ різьблені дерев'яні плоти
  const hoverFuse = pointer.hoverTarget === 'fuse';
  const hoverPull = (hoverFuse && gameState === 'ready') ? 12 : 0;

  drawSingleWoodRaft(leftRaftX + hoverPull, baseY, raftW, raftH, currentWord.left, -raftState.tilt, time);
  drawSingleWoodRaft(rightRaftX - hoverPull, baseY, raftW, raftH, currentWord.right, raftState.tilt, time);

  // Якщо плоти вже з'єднані ліаною в єдиний міст — малюємо зелене плетіння посередині
  if (raftState.gap <= 12) {
    ctx.save();
    ctx.translate(centerX, baseY);
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 8;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(-14, i * 20 - 8);
      ctx.lineTo(14, i * 20 + 8);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawSingleWoodRaft(x, y, w, h, text, tilt, time) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);

  // Складаємо пліт із 4 об'ємних соснових колод, перев'язаних канатами
  const logCount = 4;
  const logH = h / logCount;
  for (let i = 0; i < logCount; i++) {
    const ly = -h / 2 + i * logH;
    const logGrad = ctx.createLinearGradient(0, ly, 0, ly + logH);
    logGrad.addColorStop(0, '#b45309');
    logGrad.addColorStop(0.4, '#d97706');
    logGrad.addColorStop(0.85, '#92400e');
    logGrad.addColorStop(1, '#451a03');

    ctx.fillStyle = logGrad;
    ctx.beginPath();
    ctx.roundRect(-w / 2 + (i % 2) * 5, ly + 1, w - (i % 2) * 10, logH - 2, 14);
    ctx.fill();

    // Торці колод (світлі зрізи дерева)
    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.ellipse(-w / 2 + (i % 2) * 5 + 8, ly + logH / 2, 6, logH * 0.38, 0, 0, Math.PI * 2);
    ctx.ellipse(w / 2 - (i % 2) * 5 - 8, ly + logH / 2, 6, logH * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Канати по краях плоту
  ctx.strokeStyle = '#fcd34d';
  ctx.lineWidth = 6;
  [-w / 2 + 28, w / 2 - 28].forEach(rx => {
    ctx.beginPath();
    ctx.moveTo(rx, -h / 2 + 2);
    ctx.lineTo(rx, h / 2 - 2);
    ctx.stroke();
  });

  // Центральна різьблена світло-дубова табличка для літер (щоб літери читались ідеально!)
  const plaqueW = w - 76;
  const plaqueH = h - 26;
  const plaqueGrad = ctx.createLinearGradient(0, -plaqueH / 2, 0, plaqueH / 2);
  plaqueGrad.addColorStop(0, '#fef3c7');
  plaqueGrad.addColorStop(0.5, '#fde68a');
  plaqueGrad.addColorStop(1, '#f59e0b');
  ctx.fillStyle = plaqueGrad;
  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.roundRect(-plaqueW / 2, -plaqueH / 2, plaqueW, plaqueH, 20);
  ctx.fill();
  ctx.stroke();

  // Декоративні волокна деревини на табличці
  ctx.strokeStyle = 'rgba(180, 83, 9, 0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-plaqueW / 2 + 18, -plaqueH / 4);
  ctx.bezierCurveTo(-20, -plaqueH / 4 - 6, 20, -plaqueH / 4 + 6, plaqueW / 2 - 18, -plaqueH / 4);
  ctx.moveTo(-plaqueW / 2 + 22, plaqueH / 4);
  ctx.bezierCurveTo(-20, plaqueH / 4 + 5, 20, plaqueH / 4 - 5, plaqueW / 2 - 22, plaqueH / 4);
  ctx.stroke();

  // Чіткі великі літери частини слова
  const fontSize = text.length > 4 ? 54 : 66;
  ctx.font = `900 ${fontSize}px "Segoe UI", "Trebuchet MS", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Об'ємна тінь літер
  ctx.fillStyle = '#451a03';
  ctx.fillText(text, 0, 4);
  ctx.fillStyle = '#7c2d12';
  ctx.fillText(text, 0, 1);

  ctx.restore();
}

// ==========================================
// ПТАШКА-ЗИМОРОДОК І ЗОЛОТИЙ БУРШТИНОВИЙ АПОСТРОФ
// ==========================================
function drawBirdAndAmberApostrophe(time) {
  if (!currentWord) return;

  const hoverAmber = pointer.hoverTarget === 'amber';
  const branchSway = Math.sin(time * 1.4) * 3;
  const bx = bird.x;
  const by = 175 + branchSway;

  const amberX = 960;
  const amberY = raftState.amberY + (bird.holdingAmber ? Math.sin(time * 3) * 6 : Math.sin(time * 2.6) * 5);

  // Якщо наведено на бурштиновий апостроф, показуємо сяючу золоту доріжку вниз між плотами
  if (hoverAmber && gameState === 'ready') {
    const pathGrad = ctx.createLinearGradient(amberX, amberY, amberX, 680);
    pathGrad.addColorStop(0, 'rgba(251, 191, 36, 0.55)');
    pathGrad.addColorStop(1, 'rgba(251, 191, 36, 0.05)');
    ctx.strokeStyle = pathGrad;
    ctx.lineWidth = 36;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(amberX, amberY + 40);
    ctx.lineTo(amberX, 665);
    ctx.stroke();
  }

  // Шовкова золотиста павутинка/ліана від дзьоба зимородка до бурштинового апострофа
  if (amberY < 580) {
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(bx, by + 22);
    ctx.lineTo(amberX, amberY - 48);
    ctx.stroke();
  }

  // Малюємо реалістичного зимородка (Kingfisher) на гілці
  ctx.save();
  ctx.translate(bx, by);
  const flap = Math.sin(time * 14) * bird.wingFlap;
  if (bird.wingFlap > 0.05) bird.wingFlap *= 0.94;

  // Хвіст
  ctx.fillStyle = '#0284c7';
  ctx.beginPath();
  ctx.moveTo(-18, -6);
  ctx.lineTo(-48, -22);
  ctx.lineTo(-42, -4);
  ctx.closePath();
  ctx.fill();

  // Руді грудки зимородка
  ctx.fillStyle = '#ea580c';
  ctx.beginPath();
  ctx.ellipse(0, -14, 24, 18, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Смарагдово-бірюзова спинка та крило
  ctx.save();
  ctx.translate(-6, -22);
  ctx.rotate(flap * 0.6);
  ctx.fillStyle = '#06b6d4';
  ctx.beginPath();
  ctx.ellipse(0, 0, 26, 13, 0.25, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Голова з чубчиком та довгий дзьоб, спрямований униз до бурштину
  ctx.fillStyle = '#0891b2';
  ctx.beginPath();
  ctx.arc(14, -28, 16, 0, Math.PI * 2);
  ctx.fill();

  // Біла плямка на щоці та око
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(8, -26, 6, 4, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(18, -30, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Довгий дзьоб зимородка
  ctx.fillStyle = '#334155';
  ctx.beginPath();
  ctx.moveTo(10, -16);
  ctx.lineTo(0, 24);
  ctx.lineTo(22, -16);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // ІНТЕРАКТИВНА ЗОНА №1: СЯЮЧИЙ БУРШТИНОВИЙ МЕДАЛЬЙОН З АПОСТРОФОМ (’ або Ъ/Ь)
  ctx.save();
  ctx.translate(amberX, amberY);
  const pulse = hoverAmber ? 1.15 : 1 + Math.sin(time * 3.2) * 0.05;
  ctx.scale(pulse, pulse);

  // Зовнішнє сонячне ореол-сяйво
  const haloGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, hoverAmber ? 98 : 78);
  haloGrad.addColorStop(0, 'rgba(253, 224, 71, 0.75)');
  haloGrad.addColorStop(0.6, 'rgba(245, 158, 11, 0.28)');
  haloGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
  ctx.fillStyle = haloGrad;
  ctx.beginPath();
  ctx.arc(0, 0, hoverAmber ? 98 : 78, 0, Math.PI * 2);
  ctx.fill();

  // Форма краплі медового бурштину в дерев'яній оправі
  ctx.fillStyle = '#78350f';
  ctx.beginPath();
  ctx.moveTo(0, -64);
  ctx.bezierCurveTo(58, -22, 62, 54, 0, 62);
  ctx.bezierCurveTo(-62, 54, -58, -22, 0, -64);
  ctx.fill();

  const amberGrad = ctx.createRadialGradient(-12, -10, 6, 0, 6, 56);
  amberGrad.addColorStop(0, '#fef9c3');
  amberGrad.addColorStop(0.45, '#fbbf24');
  amberGrad.addColorStop(0.85, '#d97706');
  amberGrad.addColorStop(1, '#92400e');
  ctx.fillStyle = amberGrad;
  ctx.beginPath();
  ctx.moveTo(0, -56);
  ctx.bezierCurveTo(50, -18, 54, 48, 0, 55);
  ctx.bezierCurveTo(-54, 48, -50, -18, 0, -56);
  ctx.fill();

  // Скляний відблиск на бурштині
  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.beginPath();
  ctx.ellipse(-15, -14, 12, 22, 0.35, 0, Math.PI * 2);
  ctx.fill();

  // Сам знак всередині бурштину: в УКР — велика виразна кома-апостроф (’), в РУС — Ь або Ъ
  if (currentLang === 'УКР') {
    ctx.fillStyle = '#451a03';
    ctx.beginPath();
    ctx.arc(0, -8, 14, 0, Math.PI * 2);
    ctx.moveTo(14, -8);
    ctx.quadraticCurveTo(16, 22, -10, 32);
    ctx.quadraticCurveTo(2, 14, 0, 4);
    ctx.fill();
  } else {
    ctx.font = '900 54px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#451a03';
    ctx.fillText(currentWord.sign, 0, 6);
  }

  ctx.restore();
}

// ==========================================
// РЕАЛІСТИЧНА АНІМОВАНА РУДА БІЛОЧКА
// ==========================================
function drawSquirrel(time) {
  ctx.save();
  ctx.translate(squirrel.x, squirrel.y - squirrel.jumpArc);
  ctx.scale(squirrel.facing, 1);

  const breath = Math.sin(time * 4.5) * 2.5;
  const jumping = squirrel.jumpArc > 5;
  const bodyAngle = jumping ? -0.25 : 0.05;
  ctx.rotate(bodyAngle);

  // 1. Пишний багатосегментний пухнастий хвіст (фізика коливання)
  ctx.save();
  ctx.translate(-32, 12);
  const tailWave = Math.sin(time * 5.2) * 0.14 + (jumping ? -0.45 : 0);
  ctx.rotate(tailWave);

  const tailGrad = ctx.createLinearGradient(-50, -90, 10, 20);
  tailGrad.addColorStop(0, '#f97316');
  tailGrad.addColorStop(0.6, '#ea580c');
  tailGrad.addColorStop(1, '#9a3412');
  ctx.fillStyle = tailGrad;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-55, -10, -75, -75, -25, -105);
  ctx.bezierCurveTo(15, -120, 28, -55, 6, -5);
  ctx.closePath();
  ctx.fill();

  // Світлий кінчик хвоста
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath();
  ctx.arc(-22, -96, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 2. Задні лапки
  ctx.fillStyle = '#c2410c';
  ctx.beginPath();
  ctx.ellipse(-14, 18, 20, 14, jumping ? 0.5 : 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#9a3412';
  ctx.beginPath();
  ctx.ellipse(-4, 30, 16, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // 3. Гнучке тіло та світлий животик з диханням
  ctx.fillStyle = '#ea580c';
  ctx.beginPath();
  ctx.ellipse(0, 0, 28 + breath * 0.4, 22 + breath * 0.5, -0.35, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffedd5';
  ctx.beginPath();
  ctx.ellipse(8, 4, 18, 13 + breath * 0.4, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // 4. Передні лапки (тримають лісовий горішок після переправи!)
  ctx.fillStyle = '#ea580c';
  ctx.beginPath();
  ctx.ellipse(18, 4, 12, 6, 0.3, 0, Math.PI * 2);
  ctx.fill();

  if (squirrel.hasNut) {
    ctx.fillStyle = '#b45309';
    ctx.beginPath();
    ctx.arc(30, 2, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#78350f';
    ctx.beginPath();
    ctx.arc(28, -4, 11, Math.PI, 0);
    ctx.fill();
  }

  // 5. Голова, гострі вушка з китичками та живе око, що кліпає
  ctx.save();
  ctx.translate(18, -22 + breath * 0.3);

  // Вушка з китичками
  const earTwitch = Math.sin(time * 9) > 0.92 ? 0.18 : 0;
  ctx.save();
  ctx.rotate(earTwitch);
  ctx.fillStyle = '#c2410c';
  ctx.beginPath();
  ctx.moveTo(-8, -10);
  ctx.lineTo(-14, -36);
  ctx.lineTo(2, -16);
  ctx.closePath();
  ctx.fill();
  // Китичка на вусі
  ctx.strokeStyle = '#7c2d12';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-14, -36);
  ctx.lineTo(-18, -45);
  ctx.stroke();
  ctx.restore();

  // Мордочка
  ctx.fillStyle = '#ea580c';
  ctx.beginPath();
  ctx.ellipse(4, 0, 19, 15, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Щічка
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath();
  ctx.ellipse(10, 5, 11, 8, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Око (періодичне кліпання)
  const isBlinking = (time % 4.2) < 0.14;
  if (isBlinking) {
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(4, -3);
    ctx.lineTo(12, -3);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(8, -3, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(9.5, -4.5, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Темний носик
  ctx.fillStyle = '#292524';
  ctx.beginPath();
  ctx.arc(22, 1, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
  ctx.restore();
}

// ==========================================
// КУМЕДНА РІЧКОВА ЖАБКА НА ЛАТАТТІ
// ==========================================
function drawFrogOnLilypad(time) {
  const fx = frog.x;
  const fy = frog.y + Math.sin(time * 2.2) * 4;

  // Листок латаття
  ctx.save();
  ctx.translate(fx, fy);
  ctx.fillStyle = '#15803d';
  ctx.beginPath();
  ctx.arc(0, 12, 56, 0.2, Math.PI * 1.9);
  ctx.lineTo(0, 12);
  ctx.closePath();
  ctx.fill();

  // Сама жабка
  ctx.translate(0, frog.jumpY);
  if (frog.jumpY < 0) frog.jumpY *= 0.88;
  if (frog.throatScale > 0.02) frog.throatScale *= 0.94;

  // Задні лапки
  ctx.fillStyle = '#16a34a';
  ctx.beginPath();
  ctx.ellipse(-22, 6, 14, 8, -0.4, 0, Math.PI * 2);
  ctx.ellipse(22, 6, 14, 8, 0.4, 0, Math.PI * 2);
  ctx.fill();

  // Тіло
  ctx.fillStyle = '#22c55e';
  ctx.beginPath();
  ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  // Надутий горловий мішок при помилці (кумедна реакція!)
  if (frog.throatScale > 0.05) {
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(0, 2, 16 * frog.throatScale, 0, Math.PI * 2);
    ctx.fill();
  }

  // Очі жабки
  [-11, 11].forEach(ex => {
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(ex, -16, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fef9c3';
    ctx.beginPath();
    ctx.arc(ex, -16, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(ex, -16, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

// ==========================================
// 5 АКТИВНИХ ПРИРОДНИХ СВЯТКУВАНЬ ТА ЧАСТИНКИ
// ==========================================
function drawCelebrationsAndParticles(time) {
  // Святкові актори
  celebrationActors.forEach(a => {
    if (a.kind === 'jumping_fish') {
      a.progress += 0.022;
      if (a.progress >= 0 && a.progress <= 1) {
        const p = a.progress;
        const x = a.startX + (p - 0.5) * 320 * a.dir;
        const y = a.startY - Math.sin(p * Math.PI) * 340;
        const angle = Math.cos(p * Math.PI) * -0.8 * a.dir;

        // Веселкова дуга слідом за рибкою
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(a.startX, a.startY, 160, Math.PI, 0);
        ctx.stroke();

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.scale(a.dir, 1);
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.ellipse(0, 0, 34, 14, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.moveTo(-30, 0);
        ctx.lineTo(-48, -14);
        ctx.lineTo(-48, 14);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    } else if (a.kind === 'butterfly') {
      a.x += a.vx + Math.sin(time * 5 + a.phase) * 2;
      a.y += a.vy;
      const wingW = Math.abs(Math.sin(time * 18 + a.phase)) * a.size;
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.fillStyle = a.color;
      ctx.beginPath();
      ctx.ellipse(-wingW * 0.5, -4, wingW, a.size * 0.7, -0.3, 0, Math.PI * 2);
      ctx.ellipse(wingW * 0.5, -4, wingW, a.size * 0.7, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (a.kind === 'bloom_lily') {
      if (stateTimer > a.delay) {
        a.bloom = Math.min(1, a.bloom + 0.05);
      }
      if (a.bloom > 0) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.scale(a.bloom, a.bloom);
        // Зелений листок
        ctx.fillStyle = '#16a34a';
        ctx.beginPath();
        ctx.arc(0, 4, 38, 0, Math.PI * 2);
        ctx.fill();
        // Пелюстки лотоса
        for (let i = 0; i < 8; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI) / 4 + time * 0.3);
          ctx.fillStyle = i % 2 === 0 ? '#f472b6' : '#fbcfe8';
          ctx.beginPath();
          ctx.ellipse(0, -18, 10, 22, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    } else if (a.kind === 'sunbeams') {
      a.intensity = Math.sin(Math.min(1, stateTimer / 1.6) * Math.PI);
      ctx.save();
      for (let i = 0; i < 5; i++) {
        const grad = ctx.createLinearGradient(600 + i * 180, 0, 480 + i * 210, 950);
        grad.addColorStop(0, `rgba(254, 240, 138, ${0.32 * a.intensity})`);
        grad.addColorStop(1, 'rgba(254, 240, 138, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(560 + i * 180, 0);
        ctx.lineTo(660 + i * 180, 0);
        ctx.lineTo(580 + i * 210, 950);
        ctx.lineTo(420 + i * 210, 950);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    } else if (a.kind === 'otter') {
      a.pop = Math.sin(Math.min(1, stateTimer / 1.6) * Math.PI);
      ctx.save();
      ctx.translate(a.x, a.y + (1 - a.pop) * 90);
      // Водяні бризки навколо видри
      ctx.fillStyle = 'rgba(186, 230, 253, 0.5)';
      ctx.beginPath();
      ctx.ellipse(0, 32, 54, 16, 0, 0, Math.PI * 2);
      ctx.fill();
      // Тіло та голова річкової видри
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.roundRect(-26, -24, 52, 60, 24);
      ctx.fill();
      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.ellipse(0, -6, 18, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      // Очі та носик
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(-9, -14, 3.5, 0, Math.PI * 2);
      ctx.arc(9, -14, 3.5, 0, Math.PI * 2);
      ctx.arc(0, -8, 4.5, 0, Math.PI * 2);
      ctx.fill();
      // Лапки плескають від радості
      const clap = Math.abs(Math.sin(time * 18)) * 14;
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.ellipse(-8 - clap, 12, 12, 7, 0.3, 0, Math.PI * 2);
      ctx.ellipse(8 + clap, 12, 12, 7, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });

  // Бризки та золотий пилок
  for (let i = activeParticles.length - 1; i >= 0; i--) {
    const p = activeParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.18;
    p.life -= p.decay;
    if (p.life <= 0) {
      activeParticles.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Лісові світлячки
  fireflies.forEach(f => {
    f.x += f.vx;
    f.y += f.vy;
    if (f.x < 0) f.x = VW;
    if (f.x > VW) f.x = 0;
    if (f.y < 0) f.y = VH * 0.85;
    if (f.y > VH * 0.85) f.y = 0;

    const alpha = 0.35 + Math.sin(time * 3 + f.phase) * 0.3;
    ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ==========================================
// МІНІМАЛІСТИЧНІ ОРГАНІЧНІ КНОПКИ В ПРАВОМУ ВЕРХНЬОМУ КУТІ
// 1) Перемикач мови (УКР / РУС)
// 2) Кнопка "Далі" (стилізований листок зі стрілкою »»)
// ==========================================
function drawMinimalistControls(time) {
  // 1. Кнопка перемикання мови (Різьблений дерев'яний жолудь-жетон УКР / РУС)
  const langX = 1660;
  const langY = 78;
  const hoverLang = pointer.hoverTarget === 'lang';

  ctx.save();
  ctx.translate(langX, langY);
  if (hoverLang) ctx.scale(1.08, 1.08);

  const woodGrad = ctx.createLinearGradient(0, -34, 0, 34);
  woodGrad.addColorStop(0, '#d97706');
  woodGrad.addColorStop(1, '#78350f');
  ctx.fillStyle = woodGrad;
  ctx.strokeStyle = '#fde68a';
  ctx.lineWidth = 3.5;

  ctx.beginPath();
  ctx.ellipse(0, 0, 62, 34, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.font = '900 28px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fef3c7';
  ctx.fillText(currentLang, 0, 2);
  ctx.restore();

  // 2. Мінімалістична кнопка "Далі" (Різьблений лісовий листок з подвійною стрілкою вперед)
  const nextX = 1815;
  const nextY = 78;
  const hoverNext = pointer.hoverTarget === 'next';

  ctx.save();
  ctx.translate(nextX, nextY);
  if (hoverNext) ctx.scale(1.09, 1.09);

  const leafGrad = ctx.createLinearGradient(-50, -30, 50, 30);
  leafGrad.addColorStop(0, '#65a30d');
  leafGrad.addColorStop(1, '#365314');
  ctx.fillStyle = leafGrad;
  ctx.strokeStyle = '#d9f99d';
  ctx.lineWidth = 3.5;

  // Форма лісового листка
  ctx.beginPath();
  ctx.moveTo(-54, 0);
  ctx.bezierCurveTo(-30, -38, 28, -38, 56, 0);
  ctx.bezierCurveTo(28, 38, -30, 38, -54, 0);
  ctx.fill();
  ctx.stroke();

  // Стрілочки переходу "Далі" (»») без слів
  ctx.strokeStyle = '#ecfccb';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  [-12, 8].forEach(ox => {
    ctx.beginPath();
    ctx.moveTo(ox - 6, -12);
    ctx.lineTo(ox + 8, 0);
    ctx.lineTo(ox - 6, 12);
    ctx.stroke();
  });

  ctx.restore();
}

// ==========================================
// ОНОВЛЕННЯ ФІЗИКИ ТА АНІМАЦІЙ
// ==========================================
let lastTime = performance.now();

function update(dt, time) {
  stateTimer += dt;

  // Плавний рух плотів та бурштину до цільових позицій
  raftState.gap += (raftState.targetGap - raftState.gap) * 0.16;
  raftState.amberY += (raftState.targetAmberY - raftState.amberY) * 0.18;

  if (gameState === 'entering') {
    raftState.yOffset += (0 - raftState.yOffset) * 0.12;
    if (Math.abs(raftState.yOffset) < 2) {
      raftState.yOffset = 0;
      gameState = 'ready';
    }
  } else if (gameState === 'wrong_shake') {
    raftState.shakeX = Math.sin(stateTimer * 38) * 18 * Math.max(0, 1 - stateTimer * 1.4);
    raftState.tilt = Math.sin(stateTimer * 30) * 0.08 * Math.max(0, 1 - stateTimer * 1.4);
    if (stateTimer > 0.72) {
      raftState.shakeX = 0;
      raftState.tilt = 0;
      gameState = 'ready';
    }
  } else if (gameState === 'resolving_correct') {
    // Коли міст із плотів готовий, білочка стрибає по колодах на правий берег
    const waypoints = currentWord.apo
      ? [
          { x: 245, y: 615 },
          { x: 690, y: 635 },
          { x: 960, y: 615 },
          { x: 1230, y: 635 },
          { x: 1585, y: 615 }
        ]
      : [
          { x: 245, y: 615 },
          { x: 805, y: 635 },
          { x: 1115, y: 635 },
          { x: 1585, y: 615 }
        ];

    const totalJumpDuration = 0.95;
    const progress = Math.min(1, stateTimer / totalJumpDuration);
    const segCount = waypoints.length - 1;
    const exactSeg = progress * segCount;
    const segIdx = Math.min(segCount - 1, Math.floor(exactSeg));
    const localT = exactSeg - segIdx;

    const prevSeg = Math.floor(((stateTimer - dt) / totalJumpDuration) * segCount);
    if (segIdx !== prevSeg && segIdx >= 0 && segIdx < segCount) {
      sfx.squirrelHop(segIdx);
    }

    const p0 = waypoints[segIdx];
    const p1 = waypoints[segIdx + 1];
    squirrel.x = p0.x + (p1.x - p0.x) * localT;
    squirrel.y = p0.y + (p1.y - p0.y) * localT;
    squirrel.jumpArc = Math.sin(localT * Math.PI) * 95;

    if (progress >= 1) {
      squirrel.jumpArc = 0;
      squirrel.hasNut = true;
      startCelebration();
    }
  } else if (gameState === 'celebrating') {
    // Білочка радісно підстрибує з горішком на правому березі
    squirrel.jumpArc = Math.abs(Math.sin(stateTimer * 10)) * 28;
    if (stateTimer > 1.75) {
      nextWord(false);
    }
  }
}

// ==========================================
// ОБРОБКА МИШІ, ТАЧСКРІНУ ТА КЛАВІАТУРИ
// ==========================================
function screenToVirtual(clientX, clientY) {
  return {
    x: (clientX - offsetX) / scale,
    y: (clientY - offsetY) / scale
  };
}

function getHitTarget(vx, vy) {
  // 1. Кнопка "Далі"
  if (Math.hypot(vx - 1815, vy - 78) < 62) return 'next';
  // 2. Кнопка мови (УКР / РУС)
  if (Math.hypot(vx - 1660, vy - 78) < 64) return 'lang';
  // 3. Медальйон з ілюстрацією слова
  if (Math.hypot(vx - 235, vy - 245) < 98) return 'medallion';

  if (gameState === 'ready') {
    // 4. Золотий бурштиновий апостроф (або сам птах / верхня зона над щілиною)
    if (Math.hypot(vx - 960, vy - raftState.amberY) < 95 || (vx > 840 && vx < 1080 && vy > 150 && vy < 515)) {
      return 'amber';
    }
    // 5. Зелена ліана між плотами або самі плоти (з'єднати разом без апострофа)
    if (vx > 540 && vx < 1380 && vy >= 540 && vy < 800) {
      return 'fuse';
    }
  }
  return null;
}

canvas.addEventListener('pointermove', e => {
  const pos = screenToVirtual(e.clientX, e.clientY);
  pointer.x = pos.x;
  pointer.y = pos.y;
  pointer.hoverTarget = getHitTarget(pos.x, pos.y);
});

canvas.addEventListener('pointerdown', e => {
  sfx.init();
  const pos = screenToVirtual(e.clientX, e.clientY);
  const target = getHitTarget(pos.x, pos.y);

  if (target === 'next') {
    sfx.woodClick(1.25);
    nextWord(true);
  } else if (target === 'lang') {
    sfx.woodClick(0.95);
    currentLang = currentLang === 'УКР' ? 'РУС' : 'УКР';
    deck = [];
    nextWord(true);
  } else if (target === 'medallion') {
    if (currentWord) {
      sfx.rhythmHint(currentWord.apo);
      spawnSplashParticles(235, 245, '#fde047', 12);
    }
  } else if (target === 'amber') {
    handleChoice(true);
  } else if (target === 'fuse') {
    handleChoice(false);
  }
});

// Підтримка клавіатури для інтерактивних дошок та комп'ютерів
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === ' ') {
    e.preventDefault();
    handleChoice(true);
  } else if (e.key === 'ArrowDown' || e.key === 'Enter') {
    e.preventDefault();
    handleChoice(false);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    sfx.woodClick(1.25);
    nextWord(true);
  }
});

// ==========================================
// ГОЛОВНИЙ ЦИКЛ РЕНДЕРИНГУ
// ==========================================
function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const time = now / 1000;

  update(dt, time);

  // Очищуємо весь екран глибоким лісовим відтінком
  ctx.fillStyle = '#0d1f14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // 1. Живий фон лісового каньйону та річки
  drawBackground(time);

  // 2. Кумедна жабка на лататті
  drawFrogOnLilypad(time);

  // 3. Різьблені дерев'яні плоти та зелена ліана з'єднання
  drawRaftsAndChoices(time);

  // 4. Пташка-зимородок та золотий бурштиновий апостроф
  drawBirdAndAmberApostrophe(time);

  // 5. Реалістична руда білочка
  drawSquirrel(time);

  // 6. Дерев'яний медальйон із кастомною ілюстрацією слова
  drawWordMedallion(time);

  // 7. Святкові природні ефекти та світлячки
  drawCelebrationsAndParticles(time);

  // 8. Мінімалістичні органічні кнопки (УКР/РУС та »»)
  drawMinimalistControls(time);

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

window.onload = function () {
  nextWord(true);
  requestAnimationFrame(gameLoop);
};
</script>
