<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Версія гри: v1.8.0 (Forest Adventure Nouns - Text Question Parsing & House Fix) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b1a10; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
            transition: background-image 0.5s ease;
        }

        /* Керування шрифтом */
        #font-controls {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            display: flex; gap: 10px;
        }
        .font-btn {
            background: rgba(30, 20, 10, 0.8); border: 2px solid #8c6a4b; color: #eaddc5;
            padding: 5px 15px; font-size: 20px; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .font-btn:active { transform: scale(0.9); }

        /* Секретне поле та панель вчителя */
        #admin-panel {
            position: fixed; top: 15px; left: 130px; z-index: 1000;
            display: flex; gap: 5px; align-items: center;
            background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 8px; border: 1px solid #555;
        }
        .secret-input {
            background: rgba(255,255,255,0.1); border: 1px solid #888; border-radius: 5px; padding: 5px; outline: none; width: 120px;
        }
        .secret-input.hidden-text {
            color: transparent; text-shadow: 0 0 0 transparent; selection-color: transparent;
        }
        .secret-input.hidden-text::selection { background: transparent; color: transparent; }
        .toggle-visibility-btn {
            background: #555; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .toggle-visibility-btn:hover { background: #777; }

        /* Модальне вікно редагування питань */
        #admin-questions-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; max-width: 700px; background: rgba(35, 25, 15, 0.98);
            border: 4px solid #5a3c24; border-radius: 8px; padding: 20px; z-index: 10005;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); font-family: Arial, sans-serif; color: #eaddc5;
        }
        #admin-questions-modal h3 { margin-top: 0; text-align: center; }
        #admin-questions-modal p.hint {
            font-size: 13px; margin-bottom: 8px; color: #ccc; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px;
        }
        #admin-questions-text {
            width: 100%; height: 300px; background: rgba(0,0,0,0.6); color: #a8e6cf; border: 1px solid #8c6a4b;
            font-family: Arial, sans-serif; padding: 10px; border-radius: 5px; box-sizing: border-box; font-size: 14px;
            resize: vertical;
        }
        .admin-modal-btns { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .admin-modal-btns button {
            background: #5a7d36; color: white; border: 2px solid #1f300f; padding: 10px 20px;
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px;
        }
        .admin-modal-btns button.cancel { background: #c0392b; border-color: #7b241c; }

        /* Модальне вікно гри (питання) */
        #questionModal {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: linear-gradient(135deg, #eaddc5 0%, #c4aa7d 100%);
            padding: 40px; border-radius: 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(100,60,20,0.4);
            border: 12px solid #3d2314;
            border-image: repeating-linear-gradient(45deg, #4a2e1b, #4a2e1b 10px, #3d2314 10px, #3d2314 20px) 12;
            z-index: 2000; text-align: center;
            opacity: 0; transition: opacity 0.5s, transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3);
            width: 500px; max-width: 90vw;
        }
        #questionModal::before {
            content: ''; position: absolute; top: -12px; left: -12px; right: -12px; bottom: -12px;
            border: 2px solid #201108; pointer-events: none; border-radius: 12px;
        }
        #questionModal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }

        #qText {
            color: #2c1a0e; font-size: 26px; line-height: 1.5; text-shadow: 1px 1px 0px rgba(255,255,255,0.4);
            margin-top: 0; margin-bottom: 25px; background: rgba(255, 255, 255, 0.2); padding: 20px;
            border-radius: 5px; border-top: 2px solid rgba(0,0,0,0.1); border-bottom: 2px solid rgba(255,255,255,0.5); font-weight: bold;
        }

        .options-container { display: flex; flex-direction: column; gap: 15px; }
        .opt-btn {
            background: linear-gradient(to bottom, #5a7d36, #364f1e);
            border: 2px solid #1f300f; color: #eaddc5; padding: 15px; border-radius: 8px; cursor: pointer;
            font-size: 20px; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 6px 0 #1f300f, 0 10px 20px rgba(0,0,0,0.5); transition: all 0.1s; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .opt-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #1f300f; }

        #gameCanvas { display: block; width: 100vw; height: 100vh; background: transparent; }

        /* Мобільні контроли */
        #mobileControls {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: flex-end;
            z-index: 1000; pointer-events: none;
        }
        #mobileControls .dpad { display: flex; gap: 10px; }
        #mobileControls .action-pad { margin-right: 80px; }
        #mobileControls button {
            width: 65px; height: 65px; border-radius: 35px;
            background: linear-gradient(135deg, rgba(80, 100, 60, 0.8), rgba(40, 50, 30, 0.9));
            border: 2px solid rgba(150, 180, 120, 0.6); color: #fff; font-size: 24px;
            pointer-events: auto; user-select: none; touch-action: manipulation;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
        }
        #mobileControls button:active { background: rgba(100, 120, 80, 0.9); transform: translateY(3px); }
        #mobileControls .jump-btn {
            width: 90px; height: 90px; border-radius: 45px; font-size: 16px; font-weight: bold;
            background: linear-gradient(135deg, rgba(160, 90, 40, 0.9), rgba(90, 40, 10, 0.9)); border: 2px solid rgba(255, 180, 120, 0.6);
        }
        @media (min-width: 1400px) { #mobileControls { display: none; } }
        @media (max-width: 768px) { #mobileControls .action-pad { margin-right: 60px; } }

        /* Theme Manager */
        #theme-btn {
            position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px;
            background: rgba(30, 20, 10, 0.9); color: #eaddc5; border-radius: 5px;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            cursor: pointer; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.8); border: 2px solid #8c6a4b; transition: transform 0.2s;
        }
        #theme-btn:hover { transform: scale(1.1); }
        #theme-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; max-width: 700px; background: rgba(35, 25, 15, 0.98);
            border: 4px solid #5a3c24; border-radius: 8px; padding: 20px; z-index: 10000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); font-family: Arial, sans-serif;
        }
        #theme-modal h3 { color: #eaddc5; margin-top: 0; text-align: center; }
        #theme-close { position: absolute; top: 10px; right: 15px; color: #eaddc5; font-size: 24px; cursor: pointer; }
        #theme-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px;
            max-height: 60vh; overflow-y: auto; padding: 10px 0;
        }
        .theme-item {
            position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 5px; cursor: pointer;
            overflow: hidden; border: 2px solid #5a3c24; transition: all 0.2s; background: #000;
        }
        .theme-item:hover { border-color: #a37c56; transform: scale(1.05); }
        .theme-item img { width: 100%; height: 100%; object-fit: cover; }
        .theme-item span {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.7); color: #fff; text-align: center; font-size: 14px; padding: 5px 0; font-weight: bold;
        }

        /* Глобальне малювання */
        #global-draw-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 90000;
        }
        #toggle-draw-btn-global {
            position: fixed; bottom: 85px; right: 20px; width: 50px; height: 50px;
            background: #8e44ad; color: #fff; border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: pointer; z-index: 90001; box-shadow: 0 5px 15px rgba(0,0,0,0.8); border: 2px solid #732d91;
        }
        #draw-panel-global {
            display: none; position: fixed; top: 20px; right: 20px; background: rgba(30, 30, 30, 0.95);
            border: 2px solid #555; border-radius: 8px; padding: 10px; z-index: 90002; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 150px; touch-action: none;
        }
        .draw-handle { background: #555; height: 15px; border-radius: 4px; cursor: grab; margin-bottom: 5px; }
        .draw-btn-row { display: flex; gap: 5px; }
        .draw-btn-row button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .active-tool { background: #8e44ad; color: white; }
        .inactive-tool { background: #bbb; color: black; }
        #draw-color { width: 100%; height: 30px; border: none; cursor: pointer; border-radius: 4px; }
        #draw-size { width: 100%; }
        #draw-clear-btn { background: #c0392b; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #draw-close { position: absolute; top: -10px; right: -10px; background: #fff; color: #000; width: 25px; height: 25px; border-radius: 15px; text-align: center; line-height: 25px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="font-controls">
        <button class="font-btn" onclick="adjustFontSize(2)">А+</button>
        <button class="font-btn" onclick="adjustFontSize(-2)">А-</button>
    </div>

    <!-- Секретна панель вчителя -->
    <div id="admin-panel">
        <input type="text" class="secret-input hidden-text" id="secret-word" placeholder="Секретне слово">
        <button class="toggle-visibility-btn" id="toggle-secret" onclick="toggleSecretVisibility()">👁️</button>
        <button class="toggle-visibility-btn" onclick="openAdminQuestions()">📝 Питання</button>
    </div>

    <!-- Вікно редагування питань (Парсинг тексту) -->
    <div id="admin-questions-modal">
        <h3>Редагувати питання (Текст)</h3>
        <p class="hint">Формат: Питання ; Правильна відповідь ; Неправильна 1 ; Неправильна 2 | Наступне питання ; ...</p>
        <textarea id="admin-questions-text" placeholder="Монстр у лабіринті біг 3 години зі швидкістю 6 км/год. Яку відстань він подолав? ; 18 км ; 12 км ; 24 км ; 9 км |"></textarea>
        <div class="admin-modal-btns">
            <button onclick="saveAdminQuestions()">Зберегти та Синхронізувати</button>
            <button class="cancel" onclick="closeAdminQuestions()">Скасувати</button>
        </div>
    </div>

    <!-- Theme Manager -->
    <div id="theme-btn">⚙️</div>
    <div id="theme-modal">
        <div id="theme-close">✖</div>
        <h3>Оберіть пейзаж</h3>
        <div id="theme-grid">
            <div class="theme-item" onclick="applyTheme('none');">
                <div style="width:100%; height:100%; background:#0b1a10;"></div>
                <span>Без фону</span>
            </div>
        </div>
    </div>

    <div id="questionModal">
        <h2 id="qText">Питання</h2>
        <div class="options-container" id="qOptions"></div>
    </div>

    <div id="mobileControls">
        <div class="dpad">
            <button id="btnLeft">⬅️</button>
            <button id="btnDown">🔽</button>
            <button id="btnRight">➡️</button>
        </div>
        <div class="action-pad">
            <button id="btnUp" class="jump-btn">СТРИБНУТИ</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const CONFIG = { gameId: 'forest_nouns_adventure_v4' };

        // Секретне поле
        function toggleSecretVisibility() {
            const input = document.getElementById('secret-word');
            input.classList.toggle('hidden-text');
        }

        // Шрифти
        let currentFontSize = 26;
        function adjustFontSize(delta) {
            currentFontSize += delta;
            if(currentFontSize < 16) currentFontSize = 16;
            if(currentFontSize > 50) currentFontSize = 50;
            document.getElementById('qText').style.fontSize = currentFontSize + 'px';
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.style.fontSize = (currentFontSize - 6) + 'px');
        }

        // Функції для парсингу тексту питань
        function parseQuestionsText(text) {
            let parsed = [];
            let blocks = text.split('|').map(s => s.trim()).filter(s => s.length > 0);
            for(let block of blocks) {
                let parts = block.split(';').map(s => s.trim()).filter(s => s.length > 0);
                if(parts.length >= 2) {
                    let qText = parts[0];
                    let correctAns = parts[1];
                    let options = parts.slice(1); 
                    
                    // Перемішування варіантів відповідей
                    for (let i = options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [options[i], options[j]] = [options[j], options[i]];
                    }
                    let correctIdx = options.indexOf(correctAns);
                    parsed.push({ text: qText, options: options, correct: correctIdx });
                }
            }
            return parsed;
        }

        function formatQuestionsText(questions) {
            return questions.map(q => {
                let correctOpt = q.options[q.correct];
                let wrongOpts = q.options.filter((_, i) => i !== q.correct);
                return [q.text, correctOpt, ...wrongOpts].join(' ; ');
            }).join(' | \n') + ' |';
        }

        // Базові питання
        let defaultQuestionsText = "Знайди іменник чоловічого роду: ; Дуб ; Береза ; Сонце | Знайди іменник жіночого роду: ; Хмара ; Вітер ; Озеро | Знайди іменник середнього роду: ; Поле ; Ліс ; Квітка | Знайди іменник чоловічого роду: ; Ведмідь ; Лисиця ; Білченя | Знайди іменник жіночого роду: ; Земля ; Дощ ; Небо |";
        let activeQuestions = parseQuestionsText(defaultQuestionsText);

        const firebaseConfig = { databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/", projectId: "lesson-13c44" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        let myName = sessionStorage.getItem('myName') || 'Гість_' + Math.floor(Math.random() * 1000);
        let isRemoteAction = false;
        
        let currentLeaderId = null; 
        db.ref('game_leader').on('value', snap => { currentLeaderId = snap.val(); });
        function claimLeadership() { if (currentLeaderId !== myName) { currentLeaderId = myName; db.ref('game_leader').set(myName); } }

        // Синхронізація питань з Firebase
        db.ref('game_questions_nouns_txt').on('value', snap => {
            if(snap.exists()) { activeQuestions = snap.val(); }
        });

        // Редактор питань (Текстовий інтерфейс)
        function openAdminQuestions() {
            document.getElementById('admin-questions-text').value = formatQuestionsText(activeQuestions);
            document.getElementById('admin-questions-modal').style.display = 'block';
        }
        function closeAdminQuestions() {
            document.getElementById('admin-questions-modal').style.display = 'none';
        }
        function saveAdminQuestions() {
            let rawText = document.getElementById('admin-questions-text').value;
            let parsed = parseQuestionsText(rawText);
            if (parsed.length > 0) {
                db.ref('game_questions_nouns_txt').set(parsed);
                closeAdminQuestions();
                alert("Питання успішно оновлено та синхронізовано!");
            } else {
                alert("Помилка: Не вдалося розпізнати питання. Перевірте формат (наявність розділювачів '|' та ';').");
            }
        }

        // Theme Manager
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeClose = document.getElementById('theme-close');
        const themeGrid = document.getElementById('theme-grid');
        themeBtn.addEventListener('click', () => { themeModal.style.display = 'block'; });
        themeClose.addEventListener('click', () => { themeModal.style.display = 'none'; });

        async function loadThemes() {
            let i = 1; let consecutiveErrors = 0;
            while(i <= 1000 && consecutiveErrors < 3) {
                let url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                try {
                    let response = await fetch(url, { method: 'HEAD' });
                    if(response.ok) {
                        consecutiveErrors = 0;
                        let div = document.createElement('div');
                        div.className = 'theme-item';
                        div.innerHTML = `<img src="${url}" alt="Фон ${i}"><span>Фон ${i}</span>`;
                        div.onclick = () => { applyTheme(url); };
                        themeGrid.appendChild(div);
                    } else { consecutiveErrors++; }
                } catch(e) { consecutiveErrors++; }
                i++;
            }
        }
        
        function applyTheme(url) {
            if (url === 'none') { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = '#0b1a10'; } 
            else { document.body.style.backgroundImage = `url('${url}')`; }
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            db.ref('game_theme').set({ url: url, timestamp: Date.now() });
            themeModal.style.display = 'none';
        }
        
        let savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
        if(savedBg) applyTheme(savedBg);
        
        db.ref('game_theme').on('value', snap => {
            const data = snap.val();
            if(data && data.url) {
                if (data.url === 'none') { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = '#0b1a10'; }
                else { document.body.style.backgroundImage = `url('${data.url}')`; }
            }
        });
        
        loadThemes();

        // Ігрові дії
        function sendAction(type, data) {
            try { db.ref('game_action').set({ senderId: myName, timestamp: firebase.database.ServerValue.TIMESTAMP, type: type, data: data }); } catch (e) {}
        }

        db.ref('game_action').on('value', snap => {
            const val = snap.val();
            if (!val || val.senderId === myName) return; 
            const age = Date.now() - (val.timestamp || 0);
            if (age > 5000) return; 
            isRemoteAction = true;
            if (val.type === 'QUESTION_OPEN') { let obs = levelData.obstacles.find(o => o.qIdx === val.data.qIdx); if (obs) triggerQuestion(obs, true); } 
            else if (val.type === 'QUESTION_CLOSE') { closeQuestion(true); } 
            else if (val.type === 'ENTER_HOUSE') { triggerHouseEnter(true); } 
            else if (val.type === 'FINISH') { triggerFinish(true); } 
            else if (val.type === 'CANDY_COLLECT') { if (levelData.candies[val.data.idx]) { levelData.candies[val.data.idx].collected = true; playSound('candy'); } } 
            else if (val.type === 'ENEMY_KILL') { if (levelData.enemies[val.data.idx]) { levelData.enemies[val.data.idx].active = false; } }
            isRemoteAction = false;
        });

        setInterval(() => {
            if (currentLeaderId === myName && gameState === 'PLAYING') {
                db.ref('player_sync').set({
                    senderId: myName, x: player.x, y: player.y, vx: player.vx, vy: player.vy,
                    state: player.state, facingRight: player.facingRight, isClimbing: player.isClimbing, timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }, 50);

        db.ref('player_sync').on('value', snap => {
            const data = snap.val();
            if (!data || data.senderId === myName || currentLeaderId === myName || Date.now() - (data.timestamp || 0) > 2000) return;
            player.targetX = data.x; player.targetY = data.y; player.state = data.state;
            player.facingRight = data.facingRight; player.isClimbing = data.isClimbing;
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: true }); 
        let width, height;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime; gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.04, now + 0.02); 
            
            switch (type) {
                case 'jump': osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(500, now + 0.3); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
                case 'candy': osc.type = 'triangle'; osc.frequency.setValueAtTime(1000, now); osc.frequency.setValueAtTime(1500, now + 0.1); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
                case 'question_appear': osc.type = 'sine'; filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, now); filter.frequency.linearRampToValueAtTime(800, now + 0.4); osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(200, now + 0.4); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6); osc.start(now); osc.stop(now + 0.6); break;

            respawn() {

        const levelData = { platforms: [], vines: [], clouds: [], obstacles: [], candies: [], windZones: [], enemies: [], house: null };

        function buildLevel() {
            let cx = 0, cy = 600;
            // Стартова земля

            levelData.platforms.push({ x: cx+200, y: cy+20, w: 200, h: 400, type: 'ground' });
            levelData.platforms.push({ x: cx+400, y: cy-20, w: 100, h: 400, type: 'ground' });
            
            for(let i = 0; i < 10; i++) {
                let layoutType = i % 4; 
                if (layoutType === 0) {
                    cx += 600; // Рухливі платформи - без вітру!
                    levelData.platforms.push({ x: cx + 100, y: cy - 50, w: 100, h: 50, type: 'floating' });
                    levelData.platforms.push({ x: cx + 300, y: cy - 100, w: 150, h: 50, type: 'moving', startX: cx + 250, endX: cx + 500, timeOffset: i * 1000 });
                    levelData.candies.push({ x: cx + 350, y: cy - 150, collected: false });
                    
                    cx += 700; cy -= 100;
                    levelData.platforms.push({ x: cx, y: cy, w: 400, h: 400, type: 'ground' });
                    levelData.platforms.push({ x: cx+400, y: cy-30, w: 400, h: 430, type: 'ground' }); // Рельєф
                    
                    // Ворог тепер розташований виключно на землі!
                    levelData.enemies.push({ x: cx + 100, y: cy - 40, w: 30, h: 40, startX: cx, endX: cx + 300, vx: 2, active: true, type: 'slime' });
                } else if (layoutType === 1) {

                    levelData.platforms.push({ x: cx + 150, y: cy - 50, w: 80, h: 40, type: 'floating' });
                    levelData.candies.push({ x: cx + 200, y: cy - 100, collected: false });
                    levelData.platforms.push({ x: cx + 450, y: cy - 100, w: 80, h: 40, type: 'floating' });
                    cx += 700; cy -= 100;
                    levelData.platforms.push({ x: cx, y: cy, w: 600, h: 400, type: 'ground' });
                } else if (layoutType === 2) {
                    cx += 600;
                    levelData.vines.push({ x: cx + 200, y: cy - 250, w: 40, h: 400 });
                    levelData.candies.push({ x: cx + 200, y: cy - 100, collected: false });

        function updateLevelEnvironment() {
            const now = Date.now();
            levelData.platforms.forEach(p => {
                if (p.type === 'moving') {
                    let cycle = 4000, prog = ((now + p.timeOffset) % cycle) / cycle;
                    let factor = prog < 0.5 ? prog * 2 : (1 - prog) * 2;
                    let newX = p.startX + (p.endX - p.startX) * factor; p.vx = newX - p.x; p.x = newX;
                }
            });
            levelData.enemies.forEach(e => {
                if(e.active) { e.x += e.vx; if(e.x > e.endX || e.x < e.startX) e.vx *= -1; }
            });
            levelData.clouds.forEach(c => {
                let cycle = 8000, prog = ((now + c.timeOffset) % cycle) / cycle;
                c.isRaining = prog < 0.4; 
            });
        }

        function drawLevel() {
            // Візуалізація вітру
            ctx.fillStyle = 'rgba(200, 200, 200, 0.4)';
            levelData.windZones.forEach(w => {
                let dX = w.x - cameraX;
                for(let i=0; i<15; i++) {
                    let wx = dX + (frameCount*Math.abs(w.speed)*2 + i*40) % w.w;
                    let wy = height/2 + Math.sin(frameCount*0.05 + i)*80;
                    ctx.beginPath(); ctx.arc(wx, wy, 2, 0, Math.PI*2); ctx.fill();
                    ctx.fillRect(wx, wy-1, w.speed > 0 ? -40 : 40, 2);
                }
            });

            levelData.platforms.forEach(p => {
                if (p.type === 'water') {
                    let dX = p.x - cameraX, dY = p.y - cameraY;
                    if(dX + p.w < -100 || dX > width + 100) return;
                    let wg = ctx.createLinearGradient(0, dY, 0, dY+p.h); wg.addColorStop(0, 'rgba(40, 120, 110, 0.7)'); wg.addColorStop(1, 'rgba(10, 40, 40, 0.9)');
                    ctx.fillStyle = wg; ctx.fillRect(dX, dY + 20, p.w, p.h);
                    ctx.fillStyle = 'rgba(180, 240, 230, 0.5)'; ctx.beginPath();
                    for(let x = 0; x <= p.w; x += 25) { let yOff = Math.sin(frameCount * 0.05 + x * 0.08) * 8; if(x === 0) ctx.moveTo(dX + x, dY + 20 + yOff); else ctx.lineTo(dX + x, dY + 20 + yOff); }
                    ctx.lineTo(dX + p.w, dY + p.h); ctx.lineTo(dX, dY + p.h); ctx.fill();
                }
            });

            levelData.vines.forEach(v => {
                let dX = v.x - cameraX, dY = v.y - cameraY;
                ctx.strokeStyle = '#3a2311'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath();
                for(let y = 0; y <= v.h; y+=20) { let w = Math.sin(y*0.03 + frameCount*0.02) * 8; if(y===0) ctx.moveTo(dX + v.w/2 + w, dY + y); else ctx.lineTo(dX + v.w/2 + w, dY + y); } ctx.stroke();
                ctx.fillStyle = '#4a6b2c';
                for(let y = 30; y < v.h; y+=35) { let side = (y%70===30) ? 1 : -1; let px = dX + v.w/2 + Math.sin(y*0.03 + frameCount*0.02)*8; ctx.beginPath(); ctx.ellipse(px + side*12, dY + y, 10, 4, side*Math.PI/6, 0, Math.PI*2); ctx.fill(); }
            });

            levelData.platforms.forEach(p => {
                if (p.type === 'water') return;
                let dX = p.x - cameraX, dY = p.y - cameraY;
                if(dX + p.w < -100 || dX > width + 100 || dY > height + 100 || dY + p.h < -100) return;

                if (p.type === 'ground' || p.type === 'floating' || p.type === 'moving') {
                    let dirtG = ctx.createLinearGradient(0, dY, 0, dY + p.h); dirtG.addColorStop(0, '#362213'); dirtG.addColorStop(1, '#170c05');
                    ctx.fillStyle = dirtG;
                    if(p.type === 'ground') { ctx.fillRect(dX, dY+10, p.w, p.h); } else { ctx.beginPath(); ctx.roundRect(dX, dY+10, p.w, p.h-10, 20); ctx.fill(); }

                        let yOff = Math.sin(x*0.4 + p.x)*8; 
                        ctx.quadraticCurveTo(dX+x-7, dY+yOff-2, dX+x, dY+yOff+8); 
                    }
                    ctx.lineTo(dX+p.w, dY+30); ctx.lineTo(dX, dY+30); ctx.fill();
                } else if (p.type === 'ruins') {
                    ctx.fillStyle = '#5e635c'; ctx.fillRect(dX, dY+10, p.w, p.h);
                }
            });

            levelData.enemies.forEach(e => {
                if(e.active) {
                    let dX = e.x - cameraX, dY = e.y - cameraY;
                    ctx.fillStyle = '#8e44ad'; ctx.beginPath();
                    let squish = Math.sin(frameCount*0.2)*5;
                    ctx.ellipse(dX+e.w/2, dY+e.h-squish, e.w/2+squish/2, e.h/2-squish/2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(dX+10, dY+15-squish, 3, 0, Math.PI*2); ctx.arc(dX+20, dY+15-squish, 3, 0, Math.PI*2); ctx.fill();
                }
            });

            levelData.candies.forEach((c) => {
                if (!c.collected) {
                    let floatY = Math.sin(frameCount * 0.05 + c.x) * 6;
                    ctx.save(); ctx.translate(c.x - cameraX + 20, c.y - cameraY + 20 + floatY); ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 15;
                    ctx.fillStyle = '#dbeae8'; ctx.beginPath(); ctx.moveTo(-3, 10); ctx.quadraticCurveTo(0, -5, 3, 10); ctx.fill();
                    ctx.fillStyle = '#00ced1'; ctx.beginPath(); ctx.moveTo(-15, 0); ctx.quadraticCurveTo(0, -18, 15, 0); ctx.quadraticCurveTo(0, 5, -15, 0); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-5, -5, 2, 0, Math.PI*2); ctx.arc(6, -3, 1.5, 0, Math.PI*2); ctx.fill(); ctx.restore();

            levelData.clouds.forEach(c => {

                if (c.isRaining) {
                    ctx.strokeStyle = 'rgba(150, 200, 255, 0.5)'; ctx.lineWidth = 1.5;
                    for(let i = 10; i < c.w; i += 15) {
                        let dropY = (frameCount * 25 + i * 20) % 600; 
                        ctx.beginPath(); ctx.moveTo(dX + i, dY + 40 + dropY); ctx.lineTo(dX + i - 5, dY + 60 + dropY); ctx.stroke();
                    }
                }
                ctx.fillStyle = c.isRaining ? 'rgba(70, 80, 90, 0.9)' : 'rgba(200, 210, 220, 0.8)';
                ctx.beginPath(); ctx.arc(dX+c.w*0.2, dY+30, 40, 0, Math.PI*2); ctx.arc(dX+c.w*0.5, dY+15, 60, 0, Math.PI*2); ctx.arc(dX+c.w*0.8, dY+30, 40, 0, Math.PI*2); ctx.fill();
            });

            if (levelData.house) {
                let hx = levelData.house.x - cameraX, hy = levelData.house.y - cameraY;
                if (hx < width && hx + levelData.house.w > 0) {
                    ctx.save(); ctx.translate(hx, hy);
                    ctx.fillStyle = '#4a2e1b'; ctx.beginPath(); ctx.moveTo(20, 300); ctx.quadraticCurveTo(50, 100, 30, -50); ctx.lineTo(270, -50); ctx.quadraticCurveTo(250, 100, 280, 300); ctx.fill();
                    ctx.fillStyle = '#2c4217'; ctx.beginPath(); ctx.arc(150, -30, 160, 0, Math.PI*2); ctx.fill();
                    let doorW = 80, openOff = (doorW/2) * levelData.house.doorState;
                    ctx.fillStyle = '#110804'; ctx.beginPath(); ctx.ellipse(150, 220, doorW/2, 60, 0, 0, Math.PI, true); ctx.lineTo(150+doorW/2, 280); ctx.lineTo(150-doorW/2, 280); ctx.fill();
                    ctx.fillStyle = '#5c3a21'; ctx.beginPath(); ctx.moveTo(150-doorW/2, 280); ctx.lineTo(150-openOff, 280); ctx.lineTo(150-openOff, 160); ctx.quadraticCurveTo(150-doorW/2, 160, 150-doorW/2, 220); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(150+doorW/2, 280); ctx.lineTo(150+openOff, 280); ctx.lineTo(150+openOff, 160); ctx.quadraticCurveTo(150+doorW/2, 160, 150+doorW/2, 220); ctx.fill();
                    ctx.restore();
                }
            }

            levelData.obstacles.forEach(o => {
                if (!o.active) return;
                let dX = o.x - cameraX, dY = o.y - cameraY;
                ctx.save(); ctx.translate(dX + o.w/2, dY + o.h);
                
                if (o.type === 'flower') {
                    // Венерина мухоловка
                    let breath = Math.sin(frameCount * 0.05 + o.x) * 5;
                    ctx.translate(0, -o.h + 60 + breath);
                    ctx.strokeStyle = '#4a7c2a'; ctx.lineWidth = 14; ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-20, 30, 0, 70); ctx.stroke();
                    let chomp = Math.abs(Math.sin(frameCount * 0.08)) * 0.5; 
                    ctx.fillStyle = '#a82c38'; ctx.strokeStyle = '#578a34'; ctx.lineWidth = 6;
                    ctx.save(); ctx.rotate(chomp);
                    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.quadraticCurveTo(0, 40, 30, 0); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#eaddc5'; for(let i=-25; i<=25; i+=10) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+3, -15); ctx.lineTo(i+6, 0); ctx.fill(); }
                    ctx.restore();
                    ctx.save(); ctx.rotate(-chomp);
                    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.quadraticCurveTo(0, -40, 30, 0); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#eaddc5'; for(let i=-25; i<=25; i+=10) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+3, 15); ctx.lineTo(i+6, 0); ctx.fill(); }
                    ctx.restore();
                } else {
                    // Сова
                    let bob = Math.sin(frameCount * 0.03 + o.x) * 4;
                    ctx.translate(0, -o.h + 50 + bob);
                    ctx.strokeStyle = '#3a2311'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-40, 20); ctx.quadraticCurveTo(0, 30, 40, 10); ctx.stroke();
                    ctx.fillStyle = '#5c4533'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 30, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#8a6e56'; ctx.beginPath(); ctx.ellipse(0, 5, 15, 20, 0, 0, Math.PI*2); ctx.fill(); 
                    ctx.fillStyle = '#423124'; ctx.beginPath(); ctx.ellipse(-20, 0, 8, 25, Math.PI/8, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(20, 0, 8, 25, -Math.PI/8, 0, Math.PI*2); ctx.fill();
                    let headTurn = Math.sin(frameCount*0.02 + o.x) * 5;
                    ctx.save(); ctx.translate(headTurn, -25);
                    ctx.fillStyle = '#5c4533'; ctx.beginPath(); ctx.ellipse(0, 0, 20, 18, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#f5c81d'; ctx.beginPath(); ctx.arc(-8, -2, 7, 0, Math.PI*2); ctx.arc(8, -2, 7, 0, Math.PI*2); ctx.fill();
                    let pupilX = player.x > o.x ? 2 : -2;
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-8+pupilX, -2, 3, 0, Math.PI*2); ctx.arc(8+pupilX, -2, 3, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#d1941f'; ctx.beginPath(); ctx.moveTo(-4, 5); ctx.lineTo(4, 5); ctx.lineTo(0, 12); ctx.fill();
                    ctx.fillStyle = '#423124'; ctx.beginPath(); ctx.moveTo(-10,-15); ctx.lineTo(-18,-25); ctx.lineTo(-16,-12); ctx.fill(); ctx.beginPath(); ctx.moveTo(10,-15); ctx.lineTo(18,-25); ctx.lineTo(16,-12); ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
            });
        }

        function checkCollisions() {
            if (currentLeaderId !== myName && currentLeaderId !== null) return;
            player.grounded = false; player.currentPlatform = null; player.windForce = 0;

            levelData.windZones.forEach(w => {
                if (player.x + player.width > w.x && player.x < w.x + w.w) { 
                    if(player.grounded || player.vy > 0) player.windForce = w.speed; 
                }
            });

            if(!player.isClimbing) {
                for(let p of levelData.platforms) {
                    if (p.type === 'water') {
                        if (player.x + player.width > p.x && player.x < p.x + p.w && player.y + player.height > p.y + 20 && player.y < p.y + p.h) player.respawn();
                    } else {
                        if (player.x + player.width > p.x && player.x < p.x + p.w && player.y + player.height >= p.y && player.y + player.height <= p.y + 25 && player.vy >= 0) {
                            player.y = p.y - player.height; player.vy = 0; player.grounded = true; player.currentPlatform = p;
                        }
                    }
                }
            }

            levelData.clouds.forEach(c => {
                if (c.isRaining) {
                    if (player.x + player.width > c.x + 10 && player.x < c.x + c.w - 10 && player.y + player.height > c.y + 40 && player.y < c.y + 1000) {
                        player.respawn();
                    }
                }
            });

            levelData.enemies.forEach(e => {
                if (e.active && player.x + player.width > e.x && player.x < e.x + e.w && player.y + player.height > e.y && player.y < e.y + e.h) {
                    player.respawn();
                }
            });

            levelData.candies.forEach((c, idx) => {
                if (!c.collected) {
                    let dx = (player.x + player.width/2) - (c.x + 20), dy = (player.y + player.height/2) - (c.y + 20);
                    if (Math.sqrt(dx*dx + dy*dy) < 45) { c.collected = true; player.glowTimer = 20; playSound('candy'); sendAction('CANDY_COLLECT', { idx: idx }); }
                }
            });

            for(let o of levelData.obstacles) {
                if (o.active) {
                    if (player.x + player.width > o.x && player.x < o.x + o.w && player.y + player.height > o.y && player.y < o.y + o.h) {
                        player.vx = 0; player.vy = 0;
                        if (player.x < o.x) player.x = o.x - player.width - 2; else player.x = o.x + o.w + 2;
                        triggerQuestion(o, false);
                    }
                }
            }

            if (levelData.house && gameState === 'PLAYING') {
                if (player.x > levelData.house.x + levelData.house.w/2 - 60) triggerHouseEnter(false);
            }
        }

        const modal = document.getElementById('questionModal'), qText = document.getElementById('qText'), qOptions = document.getElementById('qOptions');

        function triggerQuestion(obstacle, fromRemote = false) {
            if (gameState === 'QUESTION') return;
            gameState = 'QUESTION'; currentObstacle = obstacle; playSound('question_appear');
            keys.right = false; keys.left = false; keys.up = false; keys.down = false;
            
            // Якщо питань немає, беремо дефолтне (захист)
            if (!activeQuestions || activeQuestions.length === 0) activeQuestions = parseQuestionsText(defaultQuestionsText);
            
            // Динамічний вибір питання з оновленого масиву
            let qd = activeQuestions[obstacle.qIdx % activeQuestions.length];
            qText.innerText = qd.text;
            qText.style.fontSize = currentFontSize + 'px';
            
            qOptions.innerHTML = '';
            qd.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn'; btn.innerText = opt;
                btn.style.fontSize = (currentFontSize - 6) + 'px';
                btn.onclick = () => {
                    if(idx === qd.correct) closeQuestion(false);
                    else { playSound('wrong'); btn.style.background = '#8a2b2b'; }
                };
                qOptions.appendChild(btn);
            });
            modal.classList.add('active');
            if (!fromRemote) sendAction('QUESTION_OPEN', { qIdx: obstacle.qIdx });
        }

        function closeQuestion(fromRemote = false) {
            if (gameState !== 'QUESTION') return;
            playSound('next'); modal.classList.remove('active');
            if(currentObstacle) currentObstacle.active = false;
            setTimeout(() => { if (gameState !== 'FINISHED') gameState = 'PLAYING'; }, 300);
            if (!fromRemote) sendAction('QUESTION_CLOSE', {});
        }

        function triggerHouseEnter(fromRemote = false) {
            if (gameState === 'ENTERING_HOUSE' || gameState === 'FINISHED') return;
            gameState = 'ENTERING_HOUSE'; levelData.house.doorState = 0; player.vx = 0; keys.right = false; keys.left = false;
            if (!fromRemote) sendAction('ENTER_HOUSE', {});
        }
        function triggerFinish(fromRemote = false) {
            if (gameState === 'FINISHED') return;
            gameState = 'FINISHED'; keys.right = false; keys.left = false;
            if (!fromRemote) sendAction('FINISH', {});
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);
            if (gameState === 'PLAYING' || gameState === 'QUESTION') updateLevelEnvironment();
            
            player.update();
            if (gameState === 'PLAYING') checkCollisions();

            if (gameState === 'ENTERING_HOUSE') {
                if (levelData.house.doorState < 1 && !player.entered) { levelData.house.doorState += 0.02; } 
                else if (!player.entered) { let targetX = levelData.house.x + levelData.house.w/2 - player.width/2; if (player.x < targetX) { player.x += 1.5; player.state = 'walk'; } else { player.entered = true; } } 
                else if (player.entered) { if (levelData.house.doorState > 0) { levelData.house.doorState -= 0.03; } else { triggerFinish(false); } }
            }

            let targetCamX = player.x - width / 2.5, targetCamY = player.y - height / 1.5;
            if(targetCamY > 500) targetCamY = 500;
            if(gameState === 'ENTERING_HOUSE' || gameState === 'FINISHED') { targetCamX = levelData.house.x + levelData.house.w/2 - width/2; targetCamY = levelData.house.y - height/2 + 100; }
            cameraX += (targetCamX - cameraX) * 0.1; cameraY += (targetCamY - cameraY) * 0.1;

            drawLevel();
            player.draw();
            frameCount++; requestAnimationFrame(gameLoop);
        }

        buildLevel(); gameLoop();
    </script>

    <!-- ГЛОБАЛЬНИЙ ІНСТРУМЕНТ МАЛЮВАННЯ -->
    <div id="toggle-draw-btn-global">✏️</div>
    <div id="draw-panel-global">
        <div id="draw-close">✕</div>
        <div class="draw-handle"></div>
        <div class="draw-btn-row">
            <button id="draw-pencil" class="active-tool">✏️</button>
            <button id="draw-eraser" class="inactive-tool">🧽</button>
        </div>
        <input type="color" id="draw-color" value="#ff0000">
        <input type="range" id="draw-size" min="1" max="50" value="5">
        <button id="draw-clear-btn">🗑️ Очистити</button>
    </div>
    <canvas id="global-draw-canvas"></canvas>

    <script>
        (function() {
            const drawCanvas = document.getElementById('global-draw-canvas');
            const dCtx = drawCanvas.getContext('2d');
            const toggleDraw = document.getElementById('toggle-draw-btn-global');
            const panel = document.getElementById('draw-panel-global');
            const closePanel = document.getElementById('draw-close');
            let isDrawingMode = false;
            let isDrawing = false;
            let tool = 'pencil';
            
            function resizeDrawCanvas() {
                drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeDrawCanvas); resizeDrawCanvas();

            toggleDraw.addEventListener('click', () => {
                panel.style.display = 'flex'; drawCanvas.style.pointerEvents = 'auto'; isDrawingMode = true;
            });
            closePanel.addEventListener('click', () => {
                panel.style.display = 'none'; drawCanvas.style.pointerEvents = 'none'; isDrawingMode = false;
            });

            document.getElementById('draw-pencil').onclick = function() { tool = 'pencil'; this.className = 'active-tool'; document.getElementById('draw-eraser').className = 'inactive-tool'; };
            document.getElementById('draw-eraser').onclick = function() { tool = 'eraser'; this.className = 'active-tool'; document.getElementById('draw-pencil').className = 'inactive-tool'; };

            document.getElementById('draw-clear-btn').onclick = () => { dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); sendDrawAction('clear_canvas', {}); };

            function getPos(e) {
                const rect = drawCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { nx: (clientX - rect.left) / rect.width, ny: (clientY - rect.top) / rect.height };
            }

            let lastPos = null;
            function startDraw(e) { if(!isDrawingMode) return; isDrawing = true; lastPos = getPos(e); }
            function endDraw() { isDrawing = false; lastPos = null; }
            function draw(e) {
                if(!isDrawing || !isDrawingMode) return;
                e.preventDefault();
                const pos = getPos(e);
                const color = tool === 'pencil' ? document.getElementById('draw-color').value : null;
                const size = document.getElementById('draw-size').value;
                drawLine(lastPos.nx, lastPos.ny, pos.nx, pos.ny, color, size, false);
                sendDrawAction('draw_line', { x1: lastPos.nx, y1: lastPos.ny, x2: pos.nx, y2: pos.ny, color, size });
                lastPos = pos;
            }

            function drawLine(nx1, ny1, nx2, ny2, color, size, isRemote) {
                const x1 = nx1 * drawCanvas.width, y1 = ny1 * drawCanvas.height;
                const x2 = nx2 * drawCanvas.width, y2 = ny2 * drawCanvas.height;
                dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.lineWidth = size;
                if(color === null) { dCtx.globalCompositeOperation = 'destination-out'; dCtx.strokeStyle = 'rgba(0,0,0,1)'; } 
                else { dCtx.globalCompositeOperation = 'source-over'; dCtx.strokeStyle = color; }
                dCtx.beginPath(); dCtx.moveTo(x1, y1); dCtx.lineTo(x2, y2); dCtx.stroke();
            }

            drawCanvas.addEventListener('mousedown', startDraw); drawCanvas.addEventListener('mousemove', draw); drawCanvas.addEventListener('mouseup', endDraw); drawCanvas.addEventListener('mouseout', endDraw);
            drawCanvas.addEventListener('touchstart', startDraw, {passive:false}); drawCanvas.addEventListener('touchmove', draw, {passive:false}); drawCanvas.addEventListener('touchend', endDraw);

            function sendDrawAction(type, data) { try { db.ref('game_action').set({ senderId: myName, timestamp: firebase.database.ServerValue.TIMESTAMP, type: type, data: data }); } catch(e){} }
            
            db.ref('game_action').on('value', snap => {
                const val = snap.val(); if (!val || val.senderId === myName || Date.now() - (val.timestamp || 0) > 5000) return;
                if (val.type === 'draw_line') drawLine(val.data.x1, val.data.y1, val.data.x2, val.data.y2, val.data.color, val.data.size, true);
                if (val.type === 'clear_canvas') dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            });

            let isDraggingPanel = false, panelOffX, panelOffY;
            const handle = document.querySelector('.draw-handle');
            handle.addEventListener('mousedown', e => { isDraggingPanel = true; panelOffX = e.clientX - panel.offsetLeft; panelOffY = e.clientY - panel.offsetTop; });
            document.addEventListener('mousemove', e => { if(isDraggingPanel) { panel.style.left = (e.clientX - panelOffX) + 'px'; panel.style.top = (e.clientY - panelOffY) + 'px'; panel.style.right = 'auto'; } });
            document.addEventListener('mouseup', () => { isDraggingPanel = false; });
            handle.addEventListener('touchstart', e => { isDraggingPanel = true; panelOffX = e.touches[0].clientX - panel.offsetLeft; panelOffY = e.touches[0].clientY - panel.offsetTop; }, {passive:false});
            document.addEventListener('touchmove', e => { if(isDraggingPanel) { panel.style.left = (e.touches[0].clientX - panelOffX) + 'px'; panel.style.top = (e.touches[0].clientY - panelOffY) + 'px'; panel.style.right = 'auto'; } }, {passive:false});
            document.addEventListener('touchend', () => { isDraggingPanel = false; });
        })();
    </script>

    <!-- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛУ -->
    <div id="block-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 99999; color: #ff3333; font-size: 5vw; text-align: center; line-height: 100vh; font-family: 'Arial', sans-serif; font-weight: bold; pointer-events: none; user-select: none;">Зачекай! Зараз не твій урок.</div>
    <script>
        (function() {
            try {
                if (!window.db) window.db = firebase.database();
                const urlParams = new URLSearchParams(window.location.search);
                let myName = urlParams.get('user');
                if (myName) { sessionStorage.setItem('myName', myName); } 
                else {
                    myName = sessionStorage.getItem('myName');
                    if (!myName) { myName = 'Гість_' + Math.floor(Math.random() * 1000); sessionStorage.setItem('myName', myName); }
                }
                const tabId = 'tab_' + Math.random().toString(36).substr(2, 9);
                const userRef = window.db.ref('online_users/' + myName + '/' + tabId);
                const blockRef = window.db.ref('blocked_users/' + myName);
                const activityRef = window.db.ref('current_activity');
                const forceRefreshRef = window.db.ref('force_refresh');
                
                window.db.ref('.info/connected').on('value', (snap) => { if (snap.val() === true) { userRef.set(true); userRef.onDisconnect().remove(); } });
                window.addEventListener('beforeunload', () => { userRef.remove(); });
                
                const blockOverlay = document.getElementById('block-overlay');
                blockRef.on('value', (snap) => { blockOverlay.style.display = snap.val() === true ? 'block' : 'none'; });
                
                let immunity = true; setTimeout(() => { immunity = false; }, 1000);
                activityRef.on('value', (snap) => {
                    if (immunity) return;
                    if (snap.val() === 'lobby') window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                });
                
                let firstLoad = true;
                forceRefreshRef.on('value', (snap) => {
                    if (firstLoad) { firstLoad = false; return; }
                    if (snap.val()) window.location.reload();
                });
            } catch (err) {}
        })();
    </script>
