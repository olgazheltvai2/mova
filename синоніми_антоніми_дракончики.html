<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дракончики: Синоніми та Антоніми</title>
  <style>
    /* ==========================================================================
       ОСНОВНІ СТИЛІ ТА СКИДАННЯ (ЖОДНИХ БІЛИХ ПРЯМОКУТНИКІВ)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
      background: #140f26;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Фонове полотно замку на весь екран */
    #castle-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================================================
       ВЕРХНЯ ПАНЕЛЬ НАВІГАЦІЇ (НАЗАД, ДАЛІ, МОВА)
       ========================================================================== */
    .top-bar {
      position: relative;
      z-index: 30;
      width: 100%;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .nav-group {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }

    /* Мінімалістичні кам'яно-золоті кнопки навігації */
    .stone-btn {
      pointer-events: auto;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid #f6c760;
      background: radial-gradient(circle at 30% 30%, #5c4b7d 0%, #34284a 65%, #201730 100%);
      box-shadow:
        0 6px 0 #160e24,
        0 10px 20px rgba(0, 0, 0, 0.55),
        inset 0 2px 4px rgba(255, 255, 255, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, filter 0.15s ease;
    }

    .stone-btn:hover {
      transform: translateY(-3px) scale(1.06);
      filter: brightness(1.15);
    }

    .stone-btn:active {
      transform: translateY(4px) scale(0.96);
      box-shadow: 0 2px 0 #160e24, 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .stone-btn svg {
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.6));
    }

    /* Кнопка перемикання мови (одна кнопка: УКР або РУС) */
    #lang-btn {
      width: auto;
      min-width: 82px;
      padding: 0 18px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffe89e;
      text-shadow: 0 2px 4px #000;
    }

    /* ==========================================================================
       ДОШКА НА ЛАНЦЮГАХ ЗІ СЛОВАМИ (ЗВЕРХУ)
       ========================================================================== */
    #chain-rig {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(-420px);
      z-index: 20;
      width: min(760px, 92vw);
      transition: transform 0.75s cubic-bezier(0.22, 1.35, 0.5, 1);
      pointer-events: none;
    }

    /* Стан, коли дошка опущена */
    #chain-rig.dropped {
      transform: translateX(-50%) translateY(0px);
    }

    /* Стан похитування при помилці */
    #chain-rig.shake {
      animation: signShake 0.6s ease-in-out;
    }

    @keyframes signShake {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
      20% { transform: translateX(-53%) translateY(4px) rotate(-3deg); }
      40% { transform: translateX(-47%) translateY(-3px) rotate(3deg); }
      60% { transform: translateX(-52%) translateY(2px) rotate(-2deg); }
      80% { transform: translateX(-48%) translateY(0) rotate(2deg); }
    }

    /* Легке природне погойдування на ланцюгах */
    #sign-swing-group {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: gentleSwing 5s ease-in-out infinite;
    }

    @keyframes gentleSwing {
      0%, 100% { transform: rotate(-0.6deg); }
      50% { transform: rotate(0.6deg); }
    }

    /* Стилі тексту слів на дерев'яно-кованій дошці */
    .word-text {
      font-family: 'Segoe UI', 'Arial Black', sans-serif;
      font-weight: 900;
      fill: #fff6d6;
      text-anchor: middle;
      dominant-baseline: central;
      paint-order: stroke fill;
      stroke: #2b1506;
      stroke-width: 8px;
      stroke-linejoin: round;
      filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.65));
      letter-spacing: 1px;
    }

    /* ==========================================================================
       СЦЕНА З ДВОМА ДРАКОНЧИКАМИ НА КАМ'ЯНОМУ ПОМОСТІ
       ========================================================================== */
    #stage-area {
      position: relative;
      z-index: 15;
      width: 100vw;
      height: 62vh;
      margin-top: auto;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      pointer-events: none;
    }

    #dragons-svg {
      width: min(1240px, 100vw);
      height: 100%;
      overflow: visible;
    }

    /* Плавний строго горизонтальний рух дракончиків по кам'яній підлозі */
    #dragon-left-mover,
    #dragon-right-mover {
      transition: transform 0.75s cubic-bezier(0.34, 1.35, 0.64, 1);
    }

    /* Дихання дракончиків у спокої (від нижньої точки лапок, щоб не відривалися від підлоги) */
    .dragon-breathe-left {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: breatheLeft 2.8s ease-in-out infinite;
    }

    .dragon-breathe-right {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: breatheRight 3.1s ease-in-out infinite;
    }

    @keyframes breatheLeft {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(1.028) scaleX(0.985); }
    }

    @keyframes breatheRight {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(1.032) scaleX(0.982); }
    }

    /* Махання крилами (локальна точка кріплення крила) */
    .wing-left-anim {
      transform-box: fill-box;
      transform-origin: 90% 70%;
      animation: flapLeft 1.9s ease-in-out infinite;
    }

    .wing-right-anim {
      transform-box: fill-box;
      transform-origin: 10% 70%;
      animation: flapRight 2.1s ease-in-out infinite;
    }

    @keyframes flapLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-13deg) scaleY(1.04); }
    }

    @keyframes flapRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(14deg) scaleY(1.04); }
    }

    /* Помахування хвостами */
    .tail-left-anim {
      transform-box: fill-box;
      transform-origin: 95% 80%;
      animation: tailWagLeft 2.4s ease-in-out infinite;
    }

    .tail-right-anim {
      transform-box: fill-box;
      transform-origin: 5% 80%;
      animation: tailWagRight 2.2s ease-in-out infinite;
    }

    @keyframes tailWagLeft {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(9deg); }
    }

    @keyframes tailWagRight {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-10deg); }
    }

    /* Моргання очей */
    .eyelid-blink {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: blinkEyes 4.5s infinite;
    }

    @keyframes blinkEyes {
      0%, 92%, 100% { transform: scaleY(0); }
      96% { transform: scaleY(1); }
    }

    /* ==========================================================================
       СТАН ОБІЙМІВ (СИНОНІМИ) — СТРОГО ГОРИЗОНТАЛЬНО ПО ПІДЛОЗІ
       ========================================================================== */
    /* Лівий дракончик підходить вправо строго по підлозі (Y = 0) */
    #dragons-svg.state-hug #dragon-left-mover {
      transform: translate(104px, 0px);
    }

    /* Правий дракончик підходить вліво строго по підлозі (Y = 0) */
    #dragons-svg.state-hug #dragon-right-mover {
      transform: translate(-104px, 0px);
    }

    /* Голови ніжно нахиляються одна до одної в обіймах */
    #dragon-left-head,
    #dragon-right-head {
      transform-box: fill-box;
      transform-origin: 50% 90%;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #dragons-svg.state-hug #dragon-left-head {
      transform: rotate(7deg) translate(6px, 4px);
    }

    #dragons-svg.state-hug #dragon-right-head {
      transform: rotate(-7deg) translate(-6px, 4px);
    }

    /* Лапки простягаються вперед для обіймів */
    #dragon-left-arm-front {
      transform-box: fill-box;
      transform-origin: 15% 50%;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #dragon-right-arm-front {
      transform-box: fill-box;
      transform-origin: 85% 50%;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #dragons-svg.state-hug #dragon-left-arm-front {
      transform: translate(22px, -12px) rotate(-25deg) scaleX(1.18);
    }

    #dragons-svg.state-hug #dragon-right-arm-front {
      transform: translate(-22px, -12px) rotate(25deg) scaleX(1.18);
    }

    /* Щасливі примружені очі під час обіймів */
    .happy-eyes {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #dragons-svg.state-hug .happy-eyes {
      opacity: 1;
    }

    #dragons-svg.state-hug .normal-eyes {
      opacity: 0;
    }

    /* ==========================================================================
       СТАН РОЗХОДЖЕННЯ В РІЗНІ СТОРОНИ (АНТОНІМИ) — СТРОГО ГОРИЗОНТАЛЬНО
       ========================================================================== */
    /* Лівий дракончик відходить далеко вліво по рівній підлозі (Y = 0) */
    #dragons-svg.state-apart #dragon-left-mover {
      transform: translate(-225px, 0px);
    }

    /* Правий дракончик відходить далеко вправо по рівній підлозі (Y = 0) */
    #dragons-svg.state-apart #dragon-right-mover {
      transform: translate(225px, 0px);
    }

    /* Кумедно задирають носики в різні боки */
    #dragons-svg.state-apart #dragon-left-head {
      transform: rotate(-8deg) translate(-6px, -2px);
    }

    #dragons-svg.state-apart #dragon-right-head {
      transform: rotate(8deg) translate(6px, -2px);
    }

    #dragons-svg.state-apart #dragon-left-arm-front {
      transform: rotate(18deg);
    }

    #dragons-svg.state-apart #dragon-right-arm-front {
      transform: rotate(-18deg);
    }

    /* ==========================================================================
       СТАН ПОМИЛКИ (ЗДИВУВАННЯ ТА ХИТАННЯ ПО ГОРИЗОНТАЛІ)
       ========================================================================== */
    #dragons-svg.state-wrong #dragon-left-mover {
      animation: dragonNoLeft 0.55s ease-in-out;
    }

    #dragons-svg.state-wrong #dragon-right-mover {
      animation: dragonNoRight 0.55s ease-in-out;
    }

    @keyframes dragonNoLeft {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-18px, 0); }
      50% { transform: translate(14px, 0); }
      75% { transform: translate(-10px, 0); }
    }

    @keyframes dragonNoRight {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(18px, 0); }
      50% { transform: translate(-14px, 0); }
      75% { transform: translate(10px, 0); }
    }

    /* ==========================================================================
       НИЖНЯ ПАНЕЛЬ ВИБОРУ (ДВА ГЕРАЛЬДИЧНІ ЩИТИ: СИНОНІМИ ТА АНТОНІМИ)
       ========================================================================== */
    .bottom-controls {
      position: relative;
      z-index: 25;
      width: min(860px, 94vw);
      padding-bottom: 14px;
      margin-top: -12px;
      display: flex;
      justify-content: center;
      gap: clamp(20px, 5vw, 64px);
    }

    .choice-shield {
      position: relative;
      flex: 1;
      max-width: 370px;
      height: 108px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.65));
    }

    .choice-shield:hover:not(:disabled) {
      transform: translateY(-6px) scale(1.04);
      filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.75)) brightness(1.1);
    }

    .choice-shield:active:not(:disabled) {
      transform: translateY(3px) scale(0.97);
    }

    .choice-shield:disabled {
      cursor: default;
    }

    .choice-shield svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .shield-label {
      font-family: 'Segoe UI', 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 27px;
      fill: #fff8dc;
      stroke: #1e1105;
      stroke-width: 6px;
      paint-order: stroke fill;
      letter-spacing: 1.5px;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* ==========================================================================
       АНІМАЦІЯ ПОЛУМ'Я СМОЛОСКИПІВ (СТРОГО В МЕЖАХ ФАКЕЛА!)
       Використано transform-box: fill-box, щоб вогонь ніколи не зсувався з чаші
       ========================================================================== */
    .torch-flame-outer {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flameFlickerOuter 0.45s ease-in-out infinite alternate;
    }

    .torch-flame-inner {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flameFlickerInner 0.32s ease-in-out infinite alternate;
    }

    @keyframes flameFlickerOuter {
      0% { transform: scaleX(0.93) scaleY(0.94) rotate(-2deg); }
      100% { transform: scaleX(1.06) scaleY(1.07) rotate(2deg); }
    }

    @keyframes flameFlickerInner {
      0% { transform: scaleX(1.04) scaleY(0.92) rotate(2deg); }
      100% { transform: scaleX(0.92) scaleY(1.08) rotate(-2deg); }
    }

    /* Анімація хмар у небі */
    .cloud-drift-1 {
      animation: driftCloud1 42s linear infinite;
    }
    .cloud-drift-2 {
      animation: driftCloud2 56s linear infinite;
    }

    @keyframes driftCloud1 {
      0% { transform: translateX(-250px); }
      100% { transform: translateX(1450px); }
    }

    @keyframes driftCloud2 {
      0% { transform: translateX(1400px); }
      100% { transform: translateX(-300px); }
    }

    /* Анімація прапорів на вежах замку (локальна прив'язка до древка) */
    .castle-banner {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: bannerWave 2.2s ease-in-out infinite alternate;
    }

    @keyframes bannerWave {
      0% { transform: scaleX(0.95) skewY(-3deg); }
      100% { transform: scaleX(1.04) skewY(4deg); }
    }

    /* Адаптивність для менших екранів */
    @media (max-width: 720px) {
      .choice-shield {
        height: 90px;
      }
      #stage-area {
        height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">

    <!-- ========================================================================
         ЖИВИЙ СЮЖЕТНИЙ ФОН: КАМ'ЯНИЙ ЗАМОК З ВЕЖАМИ, ПРАПОРАМИ ТА СМОЛОСКИПАМИ
         ======================================================================== -->
    <svg id="castle-bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- Градієнт вечірнього неба -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#191338" />
          <stop offset="45%" stop-color="#352563" />
          <stop offset="80%" stop-color="#6b3b78" />
          <stop offset="100%" stop-color="#b85d6f" />
        </linearGradient>

        <!-- Сяйво за замком -->
        <radialGradient id="sunGlow" cx="50%" cy="44%" r="42%">
          <stop offset="0%" stop-color="#ffcf75" stop-opacity="0.65" />
          <stop offset="45%" stop-color="#eb786b" stop-opacity="0.28" />
          <stop offset="100%" stop-color="#352563" stop-opacity="0" />
        </radialGradient>

        <!-- Градієнти каменю замку -->
        <linearGradient id="stoneWallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5d5875" />
          <stop offset="50%" stop-color="#454059" />
          <stop offset="100%" stop-color="#2c283b" />
        </linearGradient>

        <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#39344a" />
          <stop offset="45%" stop-color="#635d7a" />
          <stop offset="85%" stop-color="#433e57" />
          <stop offset="100%" stop-color="#2b2738" />
        </linearGradient>

        <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9e2a45" />
          <stop offset="55%" stop-color="#6e1930" />
          <stop offset="100%" stop-color="#3d0b1a" />
        </linearGradient>

        <!-- Візерунок кам'яної кладки -->
        <pattern id="brickPattern" width="90" height="48" patternUnits="userSpaceOnUse">
          <rect width="90" height="48" fill="#49435e" />
          <rect x="2" y="2" width="41" height="20" rx="3" fill="#595270" />
          <rect x="46" y="2" width="42" height="20" rx="3" fill="#524b69" />
          <rect x="2" y="26" width="24" height="20" rx="3" fill="#4f4863" />
          <rect x="29" y="26" width="42" height="20" rx="3" fill="#5d5675" />
          <rect x="74" y="26" width="14" height="20" rx="3" fill="#514b66" />
          <path d="M 8,8 L 32,8 M 55,14 L 78,14 M 36,34 L 60,34" stroke="#6c6587" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
        </pattern>

        <!-- Візерунок бруківки двору замку -->
        <linearGradient id="floorStoneGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5d5370" />
          <stop offset="35%" stop-color="#413a52" />
          <stop offset="100%" stop-color="#231e2e" />
        </linearGradient>

        <!-- Сяйво смолоскипів -->
        <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffae33" stop-opacity="0.65" />
          <stop offset="45%" stop-color="#ff5e1a" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#ff5e1a" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Небо та світило -->
      <rect width="1440" height="900" fill="url(#skyGrad)" />
      <circle cx="720" cy="380" r="520" fill="url(#sunGlow)" />

      <!-- Зірки на небі -->
      <g fill="#fff6cc" opacity="0.75">
        <circle cx="150" cy="95" r="2.2" />
        <circle cx="290" cy="60" r="1.6" />
        <circle cx="480" cy="110" r="2.5" />
        <circle cx="960" cy="75" r="2" />
        <circle cx="1170" cy="105" r="2.6" />
        <circle cx="1330" cy="65" r="1.8" />
        <circle cx="740" cy="50" r="2.2" />
      </g>

      <!-- Рухомі хмари -->
      <g class="cloud-drift-1" opacity="0.32" fill="#f7c5b4">
        <path d="M50,140 Q80,110 120,125 Q155,95 200,120 Q240,115 255,145 Q275,165 245,180 L55,180 Q25,165 50,140 Z" />
      </g>
      <g class="cloud-drift-2" opacity="0.25" fill="#e5a4cb">
        <path d="M100,200 Q135,170 175,185 Q215,160 255,185 Q290,185 295,212 L95,212 Q70,208 100,200 Z" />
      </g>

      <!-- Далекі гори -->
      <path d="M0,540 L140,360 L290,465 L470,310 L650,450 L820,330 L1020,460 L1210,300 L1370,425 L1440,370 L1440,650 L0,650 Z" fill="#2c2147" />
      <path d="M0,570 L210,430 L380,510 L570,400 L760,500 L950,390 L1140,505 L1310,415 L1440,490 L1440,660 L0,660 Z" fill="#3b2d5c" />

      <!-- ================= ЗАМОК НА ЗАДНЬОМУ ПЛАНІ ================= -->
      <!-- Ліва висока вежа -->
      <g transform="translate(65, 130)">
        <line x1="95" y1="-75" x2="95" y2="5" stroke="#d4af37" stroke-width="5" />
        <path class="castle-banner" d="M97,-72 L175,-56 L152,-38 L175,-20 L97,-32 Z" fill="#e63956" stroke="#ffcb69" stroke-width="2" />
        <polygon points="95,-15 -10,120 200,120" fill="url(#roofGrad)" stroke="#290913" stroke-width="4" />

      { type: 'ant', uk: ['ВАЖКИЙ', 'ЛЕГКИЙ'], ru: ['ТЯЖЁЛЫЙ', 'ЛЁГКИЙ'] },
      { type: 'ant', uk: ['ГОСТРИЙ', 'ТУПИЙ'], ru: ['ОСТРЫЙ', 'ТУПОЙ'] },
      { type: 'ant', uk: ['ЧИСТИЙ', 'БРУДНИЙ'], ru: ['ЧИСТЫЙ', 'ГРЯЗНЫЙ'] },
      { type: 'ant', uk: ['ТВЕРДИЙ', "М'ЯКИЙ"], ru: ['ТВЁРДЫЙ', 'МЯГКИЙ'] },
      { type: 'ant', uk: ['ГЛИБОКИЙ', 'МІЛКИЙ'], ru: ['ГЛУБОКИЙ', 'МЕЛКИЙ'] },
      { type: 'ant', uk: ['ГУЧНИЙ', 'ТИХИЙ'], ru: ['ГРОМКИЙ', 'ТИХИЙ'] },
      { type: 'ant', uk: ['СУХИЙ', 'МОКРИЙ'], ru: ['СУХОЙ', 'МОКРЫЙ'] },
      { type: 'ant', uk: ['ДОВГИЙ', 'КОРОТКИЙ'], ru: ['ДЛИННЫЙ', 'КОРОТКИЙ'] },
      { type: 'ant', uk: ['СВІТЛО', 'ТЕМРЯВА'], ru: ['СВЕТ', 'ТЕМНОТА'] },
      { type: 'ant', uk: ['ЛІТО', 'ЗИМА'], ru: ['ЛЕТО', 'ЗИМА'] },
      { type: 'ant', uk: ['КУПУВАТИ', 'ПРОДАВАТИ'], ru: ['ПОКУПАТЬ', 'ПРОДАВАТЬ'] },
      { type: 'ant', uk: ['ПЛАКАТИ', 'СМІЯТИСЯ'], ru: ['ПЛАКАТЬ', 'СМЕЯТЬСЯ'] },
      { type: 'ant', uk: ['ВІДКРИТИ', 'ЗАКРИТИ'], ru: ['ОТКРЫТЬ', 'ЗАКРЫТЬ'] },
      { type: 'ant', uk: ['БАГАТИЙ', 'БІДНИЙ'], ru: ['БОГАТЫЙ', 'БЕДНЫЙ'] },
      { type: 'ant', uk: ['РАНОК', 'ВЕЧІР'], ru: ['УТРО', 'ВЕЧЕР'] },
      { type: 'ant', uk: ['МИР', 'ВІЙНА'], ru: ['МИР', 'ВОЙНА'] },
      { type: 'ant', uk: ['ЩЕДРИЙ', 'СКУПИЙ'], ru: ['ЩЕДРЫЙ', 'ЖАДНЫЙ'] }
    ];

    /* ==========================================================================
       РОЗУМНЕ ПЕРЕМІШУВАННЯ СЛІВ
       1) Окремо ретельно тасуємо синоніми і антоніми.
       2) Випадково міняємо місцями ліве і праве слово всередині пар.
       3) Формуємо колоду так, щоб синоніми й антоніми чергувалися живо і ніколи
          не йшли довгими одноманітними серіями (максимум 1-2 підряд одного типу).
       ========================================================================== */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildSmartShuffledDeck() {
      const syns = shuffleArray(SYNONYM_PAIRS);
      const ants = shuffleArray(ANTONYM_PAIRS);
      const result = [];

      let sIdx = 0;
      let aIdx = 0;
      let lastType = null;
      let streak = 0;

      while (sIdx < syns.length || aIdx < ants.length) {
        let pickSyn;

        if (sIdx >= syns.length) {
          pickSyn = false;
        } else if (aIdx >= ants.length) {
          pickSyn = true;
        } else if (streak >= 2) {
          // Забороняємо більше ніж 2 однакових типи підряд
          pickSyn = lastType !== 'syn';
        } else {
          // Збалансована випадкова ймовірність з урахуванням залишку
          const synRemaining = syns.length - sIdx;
          const antRemaining = ants.length - aIdx;
          pickSyn = Math.random() < synRemaining / (synRemaining + antRemaining);
        }

        const rawItem = pickSyn ? syns[sIdx++] : ants[aIdx++];
        // Випадково міняємо порядок слів у парі (ліве <-> праве)
        const swapOrder = Math.random() < 0.5;
        const item = {
          type: rawItem.type,
          uk: swapOrder ? [rawItem.uk[1], rawItem.uk[0]] : [...rawItem.uk],
          ru: swapOrder ? [rawItem.ru[1], rawItem.ru[0]] : [...rawItem.ru]
        };

        if (item.type === lastType) {
          streak++;
        } else {
          lastType = item.type;
          streak = 1;
        }

        result.push(item);
      }

      return result;
    }

    const deck = buildSmartShuffledDeck();

    /* ==========================================================================
       ЗВУКОВИЙ СИНТЕЗАТОР (Web Audio API — активні звукові ефекти без зовнішніх файлів)
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Звук металевого ланцюга, коли спускається дошка зі словами
      playChainDrop() {
        this.init();
        const now = this.ctx.currentTime;
        for (let i = 0; i < 6; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520 + (i % 2) * 190 + i * 35, now + i * 0.065);
          osc.frequency.exponentialRampToValueAtTime(160, now + i * 0.065 + 0.05);

          gain.gain.setValueAtTime(0.11, now + i * 0.065);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.065 + 0.055);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.065);
          osc.stop(now + i * 0.065 + 0.06);
        }
      }

      // Радісний звук обіймів для СИНОНІМІВ
      playHugSuccess() {
        this.init();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.03, now + idx * 0.08 + 0.35);

          gain.gain.setValueAtTime(0.18, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.45);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.46);
        });
      }

      // Бадьорий звук розходження в різні сторони для АНТОНІМІВ
      playApartSuccess() {
        this.init();
        const now = this.ctx.currentTime;
        const steps = [
          { f1: 330, f2: 440, t: 0 },
          { f1: 392, f2: 523, t: 0.12 },
          { f1: 493, f2: 659, t: 0.24 },
          { f1: 587, f2: 880, t: 0.38 }
        ];
        steps.forEach((s) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(s.f1, now + s.t);
          osc.frequency.exponentialRampToValueAtTime(s.f2, now + s.t + 0.11);

          gain.gain.setValueAtTime(0.22, now + s.t);
          gain.gain.exponentialRampToValueAtTime(0.001, now + s.t + 0.14);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + s.t);
          osc.stop(now + s.t + 0.15);
        });
      }

      // Звук помилки
      playWrong() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(145, now + 0.22);
        osc.frequency.linearRampToValueAtTime(180, now + 0.32);
        osc.frequency.linearRampToValueAtTime(115, now + 0.52);

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.56);
      }

      // Короткий клік по кнопці
      playClick() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(680, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.05);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================================
       СТАН ГРИ ТА КЕРУВАННЯ ЕЛЕМЕНТАМИ
       ========================================================================== */
    let currentLang = 'uk'; // 'uk' або 'ru'
    let currentIndex = 0;
    let isBusy = false;
    let nextTimer = null;

    const chainRig = document.getElementById('chain-rig');
    const wordLeftEl = document.getElementById('word-left');
    const wordRightEl = document.getElementById('word-right');
    const dragonsSvg = document.getElementById('dragons-svg');
    const fxLayer = document.getElementById('fx-layer');
    const btnSyn = document.getElementById('btn-syn');
    const btnAnt = document.getElementById('btn-ant');
    const labelSyn = document.getElementById('label-syn');
    const labelAnt = document.getElementById('label-ant');
    const langBtn = document.getElementById('lang-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    /* ==========================================================================
       ВІДОБРАЖЕННЯ ТЕКСТУ ТА АВТОМАТИЧНЕ МАСШТАБУВАННЯ ДОВГИХ СЛІВ
       ========================================================================== */
    function updateWordsText() {
      const item = deck[currentIndex];
      const pair = currentLang === 'uk' ? item.uk : item.ru;

      wordLeftEl.textContent = pair[0];
      wordRightEl.textContent = pair[1];

      const sizeLeft = pair[0].length > 10 ? 30 : pair[0].length > 8 ? 34 : 38;
      const sizeRight = pair[1].length > 10 ? 30 : pair[1].length > 8 ? 34 : 38;

      wordLeftEl.setAttribute('font-size', sizeLeft);
      wordRightEl.setAttribute('font-size', sizeRight);

      if (currentLang === 'uk') {
        langBtn.textContent = 'УКР';
        labelSyn.textContent = 'СИНОНІМИ';
        labelAnt.textContent = 'АНТОНІМИ';
      } else {
        langBtn.textContent = 'РУС';
        labelSyn.textContent = 'СИНОНИМЫ';
        labelAnt.textContent = 'АНТОНИМЫ';
      }
    }

    /* ==========================================================================
       ВІЗУАЛЬНІ SVG-ЕФЕКТИ БЕЗ СЛІВ (СЕРДЕЧКА ОБІЙМІВ, ХМАРИНКИ ДИМУ, ІСКРИ)
       ========================================================================== */
    function clearEffects() {
      fxLayer.innerHTML = '';
    }

    // Ефект сердечок, коли дракончики обіймаються (Синоніми)
    function spawnHugEffects() {
      clearEffects();
      const colors = ['#ff477e', '#ff85a9', '#ffd166', '#ff5e5b'];
      for (let i = 0; i < 12; i++) {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const startX = 575 + (Math.random() - 0.5) * 160;
        const startY = 210 + (Math.random() - 0.5) * 80;
        const scale = 0.55 + Math.random() * 0.65;
        const color = colors[i % colors.length];

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute(
          'd',
          'M0,-8 C-10,-22 -28,-10 -28,6 C-28,18 -8,28 0,34 C8,28 28,18 28,6 C28,-10 10,-22 0,-8 Z'
        );
        path.setAttribute('fill', color);
        path.setAttribute('stroke', '#fff8d6');
        path.setAttribute('stroke-width', '2.5');

        g.appendChild(path);
        fxLayer.appendChild(g);

        const dx = (Math.random() - 0.5) * 140;
        const dy = -90 - Math.random() * 110;
        g.animate(
          [
            { transform: `translate(${startX}px, ${startY}px) scale(0)`, opacity: 0 },
            { transform: `translate(${startX + dx * 0.4}px, ${startY + dy * 0.4}px) scale(${scale})`, opacity: 1, offset: 0.35 },
            { transform: `translate(${startX + dx}px, ${startY + dy}px) scale(0.2)`, opacity: 0 }
          ],
          {
            duration: 1400 + Math.random() * 500,
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
            fill: 'forwards'
          }
        );
      }
    }

    // Ефект іскор на кам'яній підлозі, коли дракончики розходяться врізнобіч (Антоніми)
    function spawnApartEffects() {
      clearEffects();
      for (let i = 0; i < 14; i++) {
        const dir = i % 2 === 0 ? -1 : 1;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        const startX = 575 + dir * 40;
        const startY = 360 + (Math.random() - 0.5) * 60;
        circle.setAttribute('cx', '0');
        circle.setAttribute('cy', '0');
        circle.setAttribute('r', String(7 + Math.random() * 11));
        circle.setAttribute('fill', dir === -1 ? '#3ce8a0' : '#ff8c52');
        circle.setAttribute('stroke', '#fff6cc');
        circle.setAttribute('stroke-width', '2.5');
        fxLayer.appendChild(circle);

        const moveX = dir * (120 + Math.random() * 180);
        const moveY = (Math.random() - 0.6) * 55;

        circle.animate(
          [
            { transform: `translate(${startX}px, ${startY}px) scale(0.3)`, opacity: 1 },
            { transform: `translate(${startX + moveX}px, ${startY + moveY}px) scale(1.2)`, opacity: 0 }
          ],
          {
            duration: 950 + Math.random() * 400,
            easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
            fill: 'forwards'
          }
        );
      }
    }

    // Ефект димків з ніздрів при неправильній відповіді
    function spawnWrongPuffs() {
      clearEffects();
      const puffs = [
        { x: 505, y: 195, dir: 1 },
        { x: 645, y: 195, dir: -1 }
      ];
      puffs.forEach((p) => {
        for (let i = 0; i < 4; i++) {
          const cloud = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          cloud.setAttribute('cx', '0');
          cloud.setAttribute('cy', '0');
          cloud.setAttribute('r', String(10 + i * 4));
          cloud.setAttribute('fill', '#d9d2e9');
          cloud.setAttribute('opacity', '0.75');
          fxLayer.appendChild(cloud);

          cloud.animate(
            [
              { transform: `translate(${p.x}px, ${p.y}px) scale(0.3)`, opacity: 0.85 },
              {
                transform: `translate(${p.x + p.dir * (35 + i * 18)}px, ${p.y - 35 - i * 14}px) scale(1.5)`,
                opacity: 0
              }
            ],
            { duration: 650 + i * 100, easing: 'ease-out', fill: 'forwards' }
          );
        }
      });
    }

    /* ==========================================================================
       ПЕРЕХІД МІЖ ЗАВДАННЯМИ (ДРАКОНЧИКИ СХОДЯТЬСЯ ПО ПІДЛОЗІ, СПУСКАЄТЬСЯ ЛАНЦЮГ)
       ========================================================================== */
    function loadLevel(index) {
      if (nextTimer) {
        clearTimeout(nextTimer);
        nextTimer = null;
      }

      isBusy = true;
      btnSyn.disabled = true;
      btnAnt.disabled = true;

      // Піднімаємо ланцюг угору та повертаємо дракончиків докупи по горизонталі
      chainRig.classList.remove('dropped', 'shake');
      dragonsSvg.classList.remove('state-hug', 'state-apart', 'state-wrong');
      clearEffects();

      currentIndex = (index + deck.length) % deck.length;

      setTimeout(() => {
        updateWordsText();
        chainRig.classList.add('dropped');
        sound.playChainDrop();

        setTimeout(() => {
          isBusy = false;
          btnSyn.disabled = false;
          btnAnt.disabled = false;
        }, 450);
      }, 420);
    }

    /* ==========================================================================
       ПЕРЕВІРКА ВІДПОВІДІ ДИТИНИ
       ========================================================================== */
    function handleAnswer(chosenType) {
      if (isBusy) return;

      const currentPair = deck[currentIndex];

      if (chosenType === currentPair.type) {
        isBusy = true;
        btnSyn.disabled = true;
        btnAnt.disabled = true;
        dragonsSvg.classList.remove('state-wrong');

        if (chosenType === 'syn') {
          // Синоніми — дракончики підходять один до одного по підлозі та обіймаються
          dragonsSvg.classList.add('state-hug');
          sound.playHugSuccess();
          spawnHugEffects();
        } else {
          // Антоніми — дракончики розходяться в різні сторони по підлозі
          dragonsSvg.classList.add('state-apart');
          sound.playApartSuccess();
          spawnApartEffects();
        }

        // Перед наступним завданням знову сходяться і спускається нова пара слів
        nextTimer = setTimeout(() => {
          loadLevel(currentIndex + 1);
        }, 2100);
      } else {
        // Помилка — активний невербальний фідбек
        sound.playWrong();
        chainRig.classList.remove('shake');
        dragonsSvg.classList.remove('state-wrong');
        void chainRig.offsetWidth;
        chainRig.classList.add('shake');
        dragonsSvg.classList.add('state-wrong');
        spawnWrongPuffs();
      }
    }

    /* ==========================================================================
       ОБРОБНИКИ ПОДІЙ (КНОПКИ ВИБОРУ, НАЗАД/ДАЛІ, МОВА, СТЕЖЕННЯ ОЧЕЙ)
       ========================================================================== */
    btnSyn.addEventListener('click', () => handleAnswer('syn'));
    btnAnt.addEventListener('click', () => handleAnswer('ant'));

    prevBtn.addEventListener('click', () => {
      sound.playClick();
      loadLevel(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
      sound.playClick();
      loadLevel(currentIndex + 1);
    });

    langBtn.addEventListener('click', () => {
      sound.playClick();
      currentLang = currentLang === 'uk' ? 'ru' : 'uk';
      updateWordsText();
    });

    // Зіниці дракончиків стежать за курсором
    const pupils = document.querySelectorAll('.pupil-track');
    window.addEventListener('pointermove', (e) => {
      const normX = (e.clientX / window.innerWidth - 0.5) * 7;
      const normY = (e.clientY / window.innerHeight - 0.5) * 6;
      pupils.forEach((pupil) => {
        pupil.style.transform = `translate(${normX}px, ${normY}px)`;
      });
    });

    // Старт гри
    window.addEventListener('DOMContentLoaded', () => {
      updateWordsText();
      setTimeout(() => {
        chainRig.classList.add('dropped');
      }, 200);
    });
  </script>
</body>
