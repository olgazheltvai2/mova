<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гра: Бобер на мості</title>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* Скидання стилів та базові налаштування */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 60%, #81C784 60%, #388E3C 100%);
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            user-select: none;
            transition: background-image 0.5s ease;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            transition: transform 0.2s ease;
        }

        /* Декоративний фон - Сонце та хмари */
        .sun {
            position: absolute;
            top: 5%;
            right: 10%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #FFF59D 0%, #FBC02D 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #FFEB3B;
            animation: pulse 4s infinite alternate;
            z-index: 0;
        }

        .cloud {
            position: absolute;
            fill: #FFFFFF;
            opacity: 0.9;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
            z-index: 0;
        }

        .cloud-1 { top: 10%; left: -20%; width: 200px; animation: floatCloud 40s linear infinite; }
        .cloud-2 { top: 25%; left: -30%; width: 150px; animation: floatCloud 30s linear infinite 15s; }

        @keyframes floatCloud {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Річка та міст */
        #landscape {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50%;
            z-index: 1;
        }

        .river {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to bottom, rgba(77,208,225,0.7), rgba(2,136,209,0.7));
            border-top: 15px solid rgba(76,175,80,0.8);
            border-top-left-radius: 50% 20px;
            border-top-right-radius: 50% 20px;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background: repeating-radial-gradient(ellipse at center, transparent, transparent 40px, rgba(255,255,255,0.2) 42px, transparent 45px);
            animation: waveMove 10s linear infinite;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .bridge-container {
            position: absolute;
            bottom: 25%;
            left: 10%;
            width: 80%;
            height: 120px;
            z-index: 2;
        }

        /* Бобер */
        #beaver-container {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 150px;
            height: 150px;
            z-index: 10;
            transition: left 1s cubic-bezier(0.25, 0.1, 0.25, 1), bottom 1s ease;
        }

        @keyframes victoryJump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-80px); }
        }

        .jumping {
            /* Бобер стрибає рівно 5 разів і зупиняється */
            animation: victoryJump 0.6s ease-in-out 5;
        }

        /* UI Елементи */
        #task-board {
            position: absolute;
            top: 15%;
            width: 70%;
            max-width: 900px;
            /* Прозорий контейнер без білого фону */
            background: rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            z-index: 20;
            text-align: center;
            font-size: 42px;
            color: #3E2723;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            transition: opacity 0.5s, transform 0.5s;
        }

        .sentence-input {
            border: none;
            border-bottom: 4px dashed #795548;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            font-family: inherit;
            font-size: 42px;
            color: #E64A19;
            text-align: center;
            width: 320px;
            margin: 0 15px;
            padding: 5px;
            outline: none;
            transition: background 0.3s;
        }
        
        .sentence-input:focus {
            background: rgba(255,255,255,0.7);
            border-bottom-style: solid;
        }

        /* Секретне поле вводу */
        .secret-mode {
            color: transparent !important;
            caret-color: #E64A19;
        }
        .secret-mode::selection {
            background: transparent !important;
            color: transparent !important;
        }
        #toggle-secret-btn {
            background: rgba(255,255,255,0.5);
            border: 2px solid #795548;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Навігація */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 70px;
            height: 70px;
            background: rgba(255, 179, 0, 0.8);
            border: 5px solid rgba(255, 143, 0, 0.8);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .nav-btn:active { transform: translateY(-50%) scale(0.9); }
        .nav-btn svg { width: 40px; height: 40px; fill: #FFF; }
        #btn-prev { left: 3%; }
        #btn-next { right: 3%; }

        /* Перемикач мови - Малопомітний */
        #lang-switch {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 5px;
            z-index: 30;
            opacity: 0.05; /* Дуже малопомітні */
            transition: opacity 0.3s;
        }
        #lang-switch:hover {
            opacity: 0.5;
        }
        .lang-btn {
            background: #4CAF50;
            border: none;
            border-radius: 10px;
            padding: 5px 10px;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .lang-btn.active { background: #FF9800; }

        /* Вчительські кнопки (непомітні) */
        #teacher-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 40;
            opacity: 0.05;
            transition: opacity 0.3s;
        }
        #teacher-controls:hover { opacity: 0.5; }

        .teacher-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        #btn-approve { background: #4CAF50; }
        #btn-error { background: #F44336; }

        /* ================= БЛОК ДОСТУПУ ================= */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: red;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            line-height: 100vh;
            z-index: 999999;
        }

        /* ================= ГЛОБАЛЬНІ ІНСТРУМЕНТИ ================= */
        .global-tools-container {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column-reverse;
            gap: 15px;
            z-index: 80000;
        }

        .tool-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .tool-btn:active { transform: scale(0.9); }
        
        #btn-theme { background: #3498db; }
        #toggle-draw-btn-global { background: #8e44ad; }
        #btn-zoom-in { background: #e67e22; }
        #btn-zoom-out { background: #e67e22; }

        /* ================= ТЕМИ (Theme Manager) ================= */
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 800px;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            z-index: 100000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .theme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
        }
        .close-modal {
            cursor: pointer;
            color: #e74c3c;
            font-size: 30px;
        }
        .theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .theme-card {
            position: relative;
            height: 100px;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            border: 3px solid transparent;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
        }
        .theme-card:hover { border-color: #3498db; }
        .theme-card span {
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        #theme-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99999;
        }

        /* ================= МАЛЮВАННЯ ================= */
        #draw-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 90000;
            pointer-events: none;
        }
        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 90001;
            padding: 10px;
            border: 2px solid #8e44ad;
        }
        .draw-header {
            width: 100%; height: 20px;
            background: #e0e0e0;
            cursor: grab;
            border-radius: 10px 10px 0 0;
            margin-bottom: 10px;
        }
        .draw-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .draw-btn {
            padding: 5px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #eee;
        }
        .draw-btn.active { background: #8e44ad; color: #fff; }
        #draw-clear { background: #e74c3c; color: white; }
        #draw-close { background: transparent; font-size: 20px; cursor: pointer; border: none; }

        @media (max-width: 768px) {
            #task-board { font-size: 28px; width: 85%; padding: 20px; }
            .sentence-input { font-size: 28px; width: 200px; }
            .global-tools-container { right: 5px; bottom: 5px; }
            .tool-btn { width: 50px; height: 50px; font-size: 22px; }
            #lang-switch { top: 5px; left: 5px; }
            .nav-btn { width: 50px; height: 50px; }
            .nav-btn svg { width: 25px; height: 25px; }
            #draw-panel-global { flex-direction: column; width: 90%; left: 5%; transform: none; top: 10px; }
            .draw-controls { flex-wrap: wrap; justify-content: center; }
        }

    </style>
</head>
<body>

<div id="block-overlay">Зачекай! Зараз не твій урок.</div>
<canvas id="draw-canvas"></canvas>

<div id="draw-panel-global">
    <div class="draw-header" id="draw-drag-handle"></div>
    <div class="draw-controls">
        <button class="draw-btn active" id="draw-pencil">✏️ Олівець</button>
        <button class="draw-btn" id="draw-eraser">🧽 Гумка</button>
        <input type="color" id="draw-color" value="#ff0000">
        <input type="range" id="draw-size" min="1" max="50" value="5">
        <button class="draw-btn" id="draw-clear">🗑️ Очистити</button>
        <button id="draw-close">✕</button>
    </div>
</div>

<div id="theme-backdrop" onclick="closeThemeModal()"></div>
<div id="theme-modal">
    <div class="theme-header">
        <span>Вибір фону</span>
        <span class="close-modal" onclick="closeThemeModal()">✕</span>
    </div>
    <div class="theme-gallery" id="theme-gallery"></div>
</div>

<!-- ІГРОВИЙ КОНТЕЙНЕР -->
<div id="game-container">
    <div class="sun"></div>
    
    <svg class="cloud cloud-1" viewBox="0 0 100 50">
        <path d="M 20 40 Q 10 40 10 30 Q 10 15 25 20 Q 35 5 55 15 Q 75 0 85 20 Q 95 20 90 35 Q 90 40 80 40 Z" />
    </svg>
    <svg class="cloud cloud-2" viewBox="0 0 100 50">
        <path d="M 20 40 Q 10 40 10 30 Q 10 15 25 20 Q 35 5 55 15 Q 75 0 85 20 Q 95 20 90 35 Q 90 40 80 40 Z" />
    </svg>

    <div id="landscape">
        <div class="river">
            <div class="wave"></div>
        </div>
        
        <div class="bridge-container">
            <svg width="100%" height="100%" preserveAspectRatio="none">
                <rect x="10%" y="20%" width="3%" height="80%" fill="#5D4037" />
                <rect x="48%" y="20%" width="3%" height="80%" fill="#5D4037" />
                <rect x="87%" y="20%" width="3%" height="80%" fill="#5D4037" />
                <path d="M 0 30 Q 25 60 50 30 T 100 30" fill="none" stroke="#795548" stroke-width="6" />
                <path d="M 0 90 Q 25 120 50 90 T 100 90" fill="none" stroke="#795548" stroke-width="6" />
                <g id="bridge-planks"></g>
            </svg>

            <div id="beaver-container">
                <svg viewBox="0 0 150 150" width="100%" height="100%">
                    <path d="M 30 110 C 5 110, -5 70, 20 60 C 40 50, 50 80, 50 100 Z" fill="#3E2723" />
                    <ellipse cx="75" cy="95" rx="45" ry="50" fill="#795548" />
                    <ellipse cx="75" cy="105" rx="30" ry="35" fill="#8D6E63" />
                    <circle cx="45" cy="135" r="12" fill="#4E342E" />
                    <circle cx="105" cy="135" r="12" fill="#4E342E" />
                    <circle cx="40" cy="85" r="10" fill="#5D4037" />
                    <circle cx="110" cy="85" r="10" fill="#5D4037" />
                    <circle cx="75" cy="50" r="35" fill="#795548" />
                    <circle cx="50" cy="25" r="12" fill="#4E342E" />
                    <circle cx="100" cy="25" r="12" fill="#4E342E" />
                    <circle cx="50" cy="25" r="6" fill="#3E2723" />
                    <circle cx="100" cy="25" r="6" fill="#3E2723" />
                    <circle cx="63" cy="42" r="9" fill="#FFF" />
                    <circle cx="87" cy="42" r="9" fill="#FFF" />
                    <circle id="pupil-l" cx="63" cy="42" r="4" fill="#000" />
                    <circle id="pupil-r" cx="87" cy="42" r="4" fill="#000" />
                    <ellipse cx="75" cy="55" rx="8" ry="6" fill="#000" />
                    <circle cx="62" cy="62" r="10" fill="#8D6E63" />
                    <circle cx="88" cy="62" r="10" fill="#8D6E63" />
                    <rect x="71" y="66" width="8" height="10" fill="#FFF" rx="2" />
                    <line x1="75" y1="66" x2="75" y2="76" stroke="#CCC" stroke-width="1" />
                    <path id="mouth" d="M 65 68 Q 75 75 85 68" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- UI -->
    <div id="lang-switch">
        <button class="lang-btn active" onclick="setLang('ua')">УКР</button>
        <button class="lang-btn" onclick="setLang('ru')">РУС</button>
    </div>

    <div id="task-board">
        <span id="sentence-part1"></span>
        <input type="text" id="sentence-input" class="sentence-input secret-mode" autocomplete="off" oninput="syncInput(this.value)">
        <button id="toggle-secret-btn" onclick="toggleSecret()">👁️</button>
        <span id="sentence-part2"></span>
    </div>

    <div class="nav-btn" id="btn-prev" onclick="prevTask()">
        <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
    </div>
    <div class="nav-btn" id="btn-next" onclick="nextTask()">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
    </div>

    <div id="teacher-controls">
        <button class="teacher-btn" id="btn-approve" onclick="approveTask()"></button>
        <button class="teacher-btn" id="btn-error" onclick="errorTask()"></button>
    </div>
</div>

<!-- Глобальні інструменти -->
<div class="global-tools-container">
    <button class="tool-btn" id="btn-theme" onclick="openThemeModal()">⚙️</button>
    <button class="tool-btn" id="toggle-draw-btn-global">✏️</button>
    <button class="tool-btn" id="btn-zoom-in" onclick="changeZoom(0.1)">🔍+</button>
    <button class="tool-btn" id="btn-zoom-out" onclick="changeZoom(-0.1)">🔍-</button>
</div>

<script>
    // ==========================================
    // НАЛАШТУВАННЯ ТА ІДЕНТИФІКАЦІЯ (Firebase)
    // ==========================================
    const CONFIG = {
        gameId: 'BeaverBridge_02', 
        projectId: 'lesson-13c44'
    };

    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
        projectId: CONFIG.projectId
    };

    let db;
    let isFirebaseReady = false;
    let myName = "";
    let tabId = "";

    function initUser() {
        const urlParams = new URLSearchParams(window.location.search);
        let urlName = urlParams.get('user');
        if (urlName) {
            myName = urlName;
            sessionStorage.setItem('userName', myName);
        } else {
            myName = sessionStorage.getItem('userName');
            if (!myName) {
                myName = 'Гість_' + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('userName', myName);
            }
        }
        tabId = Math.random().toString(36).substr(2, 9);
    }

    initUser();

    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        isFirebaseReady = true;
        initRadar();
    } catch (e) {
        console.warn("Firebase не завантажено. Гра працює локально.");
    }

    // ==========================================
    // РАДАР ТА КОНТРОЛЬ ДОСТУПУ
    // ==========================================
    let immunity = true;
    setTimeout(() => { immunity = false; }, 1000);

    function initRadar() {
        const connectedRef = db.ref('.info/connected');
        const myPresenceRef = db.ref(`online_users/${myName}/${tabId}`);

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                myPresenceRef.set(true);
                myPresenceRef.onDisconnect().remove();
            }
        });

        window.addEventListener('beforeunload', () => {
            myPresenceRef.remove();
        });

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'block' : 'none';
        });

        db.ref('force_refresh').on('value', snap => {
            if (snap.val() && !immunity) window.location.reload();
        });

        db.ref('current_activity').on('value', snap => {
            if (!immunity && snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        db.ref(`game_action/${CONFIG.gameId}`).on('value', snap => {
            const data = snap.val();
            if (data && data.senderId !== tabId) {
                handleRemoteAction(data);
            }
        });

        db.ref(`game_theme/${CONFIG.gameId}`).on('value', snap => {
            const url = snap.val();
            if (url) applyTheme(url, false);
        });
    }

    function sendGameAction(type, data = {}) {
        if (!isFirebaseReady) return;
        db.ref(`game_action/${CONFIG.gameId}`).set({
            senderId: tabId,
            timestamp: Date.now(),
            type: type,
            data: data
        });
    }

    // ==========================================
    // ЗУМ ТА СЕКРЕТНИЙ ВВІД
    // ==========================================
    let currentZoom = 1;
    function changeZoom(delta) {
        currentZoom += delta;
        if (currentZoom < 0.3) currentZoom = 0.3;
        if (currentZoom > 2.5) currentZoom = 2.5;
        document.getElementById('game-container').style.transform = `scale(${currentZoom})`;
    }

    function toggleSecret() {
        const input = document.getElementById('sentence-input');
        input.classList.toggle('secret-mode');
    }

    // ==========================================
    // THEME MANAGER (Динамічні фони)
    // ==========================================
    let availableThemes = [];
    let themesLoaded = false;

    async function loadThemesSequential() {
        if (themesLoaded) return;
        availableThemes = [];
        let i = 1;
        while (true) {
            const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
            try {
                const response = await fetch(url, { method: 'HEAD' });
                if (response.ok) {
                    availableThemes.push(url);
                    i++;
                } else {
                    break;
                }
            } catch (e) {
                break;
            }
        }
        themesLoaded = true;
        renderThemeGallery();
    }

    function renderThemeGallery() {
        const gallery = document.getElementById('theme-gallery');
        gallery.innerHTML = '';
        
        const noBgCard = document.createElement('div');
        noBgCard.className = 'theme-card';
        noBgCard.innerHTML = '<span>Без фону</span>';
        noBgCard.onclick = () => selectTheme('none');
        gallery.appendChild(noBgCard);

        availableThemes.forEach((url, index) => {
            const card = document.createElement('div');
            card.className = 'theme-card';
            card.style.backgroundImage = `url(${url})`;
            card.innerHTML = `<span>Фон ${index + 1}</span>`;
            card.onclick = () => selectTheme(url);
            gallery.appendChild(card);
        });
    }

    function openThemeModal() {
        document.getElementById('theme-backdrop').style.display = 'block';
        document.getElementById('theme-modal').style.display = 'block';
        if (!themesLoaded) loadThemesSequential();
    }

    function closeThemeModal() {
        document.getElementById('theme-backdrop').style.display = 'none';
        document.getElementById('theme-modal').style.display = 'none';
    }

    function selectTheme(url) {
        applyTheme(url, true);
        closeThemeModal();
    }

    function applyTheme(url, isLocalChange) {
        if (url === 'none') {
            document.body.style.backgroundImage = 'none';
        } else {
            document.body.style.backgroundImage = `url(${url})`;
        }
        
        localStorage.setItem(`mySavedBg_${CONFIG.gameId}`, url);

        if (isLocalChange && isFirebaseReady) {
            db.ref(`game_theme/${CONFIG.gameId}`).set(url);
        }
    }

    const savedTheme = localStorage.getItem(`mySavedBg_${CONFIG.gameId}`);
    if (savedTheme) applyTheme(savedTheme, false);


    // ==========================================
    // ГЛОБАЛЬНЕ МАЛЮВАННЯ (Canvas)
    // ==========================================
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let drawMode = 'pencil';
    let lastX = 0, lastY = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const drawPanel = document.getElementById('draw-panel-global');
    const btnToggleDraw = document.getElementById('toggle-draw-btn-global');
    const btnCloseDraw = document.getElementById('draw-close');

    btnToggleDraw.onclick = () => {
        drawPanel.style.display = 'flex';
        canvas.style.pointerEvents = 'auto';
    };

    btnCloseDraw.onclick = () => {
        drawPanel.style.display = 'none';
        canvas.style.pointerEvents = 'none';
    };

    document.getElementById('draw-pencil').onclick = () => {
        drawMode = 'pencil';
        document.getElementById('draw-pencil').classList.add('active');
        document.getElementById('draw-eraser').classList.remove('active');
    };
    document.getElementById('draw-eraser').onclick = () => {
        drawMode = 'eraser';
        document.getElementById('draw-eraser').classList.add('active');
        document.getElementById('draw-pencil').classList.remove('active');
    };
    document.getElementById('draw-clear').onclick = () => {
        clearCanvas();
        sendGameAction('clear_canvas');
    };

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function startDraw(e) {
        if(canvas.style.pointerEvents === 'none') return;
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        lastX = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        lastY = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    }

    function draw(e) {
        if (!isDrawing || canvas.style.pointerEvents === 'none') return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        
        const color = drawMode === 'eraser' ? null : document.getElementById('draw-color').value;
        const size = document.getElementById('draw-size').value;

        drawLine(lastX, lastY, x, y, color, size, true);
        
        lastX = x;
        lastY = y;
    }

    function stopDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseout', stopDraw);
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDraw);

    function drawLine(x1, y1, x2, y2, color, size, isLocal) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        
        if (color) {
            ctx.globalCompositeOperation="source-over";
            ctx.strokeStyle = color;
        } else {
            ctx.globalCompositeOperation="destination-out";
            ctx.strokeStyle = "rgba(0,0,0,1)";
        }
        
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.stroke();

        if (isLocal) {
            const nx1 = x1 / canvas.width;
            const ny1 = y1 / canvas.height;
            const nx2 = x2 / canvas.width;
            const ny2 = y2 / canvas.height;
            sendGameAction('draw_line', { nx1, ny1, nx2, ny2, color, size });
        }
    }

    const dragHandle = document.getElementById('draw-drag-handle');
    let isDraggingPanel = false, panOffsetX = 0, panOffsetY = 0;
    dragHandle.addEventListener('mousedown', startPanDrag);
    dragHandle.addEventListener('touchstart', startPanDrag, {passive: false});
    document.addEventListener('mousemove', panDrag);
    document.addEventListener('touchmove', panDrag, {passive: false});
    document.addEventListener('mouseup', stopPanDrag);
    document.addEventListener('touchend', stopPanDrag);

    function startPanDrag(e) {
        isDraggingPanel = true;
        const ev = e.touches ? e.touches[0] : e;
        const rect = drawPanel.getBoundingClientRect();
        panOffsetX = ev.clientX - rect.left;
        panOffsetY = ev.clientY - rect.top;
    }
    function panDrag(e) {
        if (!isDraggingPanel) return;
        e.preventDefault();
        const ev = e.touches ? e.touches[0] : e;
        drawPanel.style.left = (ev.clientX - panOffsetX + drawPanel.offsetWidth/2) + 'px';
        drawPanel.style.top = (ev.clientY - panOffsetY) + 'px';
        drawPanel.style.transform = 'translateX(-50%)';
    }
    function stopPanDrag() { isDraggingPanel = false; }


    // ==========================================
    // ЛОГІКА ГРИ (Оригінальна + Синхронізація)
    // ==========================================
    const tasks = [
        { ua: ["Сьогодні був дуже", "день."], ru: ["Сегодня был очень", "день."] },
        { ua: ["У лісі росте", "дерево."], ru: ["В лесу растет", "дерево."] },
        { ua: ["Мама спекла", "пиріг."], ru: ["Мама испекла", "пирог."] },
        { ua: ["Ми бачили", "кота."], ru: ["Мы видели", "кота."] },
        { ua: ["На небі світить", "сонце."], ru: ["На небе светит", "солнце."] },
        { ua: ["Друзі вирушили в", "подорож."], ru: ["Друзья отправились в", "путешествие."] },
        { ua: ["В озері плаває", "риба."], ru: ["В озере плавает", "рыба."] },
        { ua: ["Подув", "вітер."], ru: ["Подул", "ветер."] },
        { ua: ["У бабусі є", "скриня."], ru: ["У бабушки есть", "сундук."] },
        { ua: ["Ми читали", "книгу."], ru: ["Мы читали", "книгу."] },
        { ua: ["На столі лежить", "яблуко."], ru: ["На столе лежит", "яблоко."] },
        { ua: ["За вікном чути", "спів."], ru: ["За окном слышно", "пение."] }
    ];

    let currentLang = 'ua';
    let currentTaskIndex = 0;
    let score = 0; 
    const maxTasks = 12;

    const elPart1 = document.getElementById('sentence-part1');
    const elPart2 = document.getElementById('sentence-part2');
    const elInput = document.getElementById('sentence-input');
    const elBoard = document.getElementById('task-board');
    const elBeaver = document.getElementById('beaver-container');
    const elPupilL = document.getElementById('pupil-l');
    const elPupilR = document.getElementById('pupil-r');
    const elMouth = document.getElementById('mouth');

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(frequency, type, duration, delay = 0) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime + delay);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
        osc.stop(audioCtx.currentTime + delay + duration);
    }

    function soundApprove() {
        playTone(440, 'sine', 0.2, 0);
        playTone(554, 'sine', 0.2, 0.1);
        playTone(659, 'sine', 0.3, 0.2);
    }

    function soundError() {
        playTone(300, 'triangle', 0.3, 0);
        playTone(250, 'triangle', 0.4, 0.2);
    }

    function soundJump() {
        playTone(600, 'sine', 0.1, 0);
        playTone(800, 'sine', 0.2, 0.1);
    }

    function generateBridge() {
        const planksGroup = document.getElementById('bridge-planks');
        const numPlanks = 20;
        let html = '';
        for (let i = 0; i < numPlanks; i++) {
            const x = 5 + (i * (90 / numPlanks));
            const yOffset = Math.sin((i / numPlanks) * Math.PI) * 15;
            const rotation = (Math.random() - 0.5) * 10;
            html += `<rect x="${x}%" y="${40 + yOffset}%" width="3%" height="40%" fill="#8D6E63" stroke="#5D4037" stroke-width="1" transform="rotate(${rotation} ${x*10} 50)"/>`;
        }
        planksGroup.innerHTML = html;
    }

    function setLang(lang, isRemote = false) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if(lang === 'ua') document.querySelectorAll('.lang-btn')[0].classList.add('active');
        if(lang === 'ru') document.querySelectorAll('.lang-btn')[1].classList.add('active');
        renderTask();
        if(!isRemote) sendGameAction('setLang', { lang });
    }

    function syncInput(val, isRemote = false) {
        if (!isRemote) sendGameAction('input_sync', { text: val });
    }

    function renderTask() {
        if (currentTaskIndex >= maxTasks) currentTaskIndex = maxTasks - 1;
        if (currentTaskIndex < 0) currentTaskIndex = 0;

        const task = tasks[currentTaskIndex];
        elPart1.innerText = task[currentLang][0] + ' ';
        elPart2.innerText = ' ' + task[currentLang][1];
        elInput.value = '';
        elBoard.style.opacity = 1;
        elBoard.style.transform = 'scale(1)';
        resetBeaverFace();
    }

    function nextTask(isRemote = false) {
        if (currentTaskIndex < maxTasks - 1) {
            currentTaskIndex++;
            renderTask();
            if(!isRemote) sendGameAction('nextTask');
        }
    }

    function prevTask(isRemote = false) {
        if (currentTaskIndex > 0) {
            currentTaskIndex--;
            renderTask();
            if(!isRemote) sendGameAction('prevTask');
        }
    }

    function approveTask(isRemote = false) {
        soundApprove();
        elBoard.style.opacity = 0;
        elBoard.style.transform = 'scale(0.8)';
        
        elMouth.setAttribute('d', 'M 60 70 Q 75 85 90 70');
        elPupilL.setAttribute('cy', '40');
        elPupilR.setAttribute('cy', '40');

        if (score < maxTasks) score++;
        updateBeaverPosition();

        if(!isRemote) sendGameAction('approveTask');

        setTimeout(() => {
            if (score >= maxTasks) {
                triggerVictory();
            } else {
                nextTask(true);
            }
        }, 1500);
    }

    function errorTask(isRemote = false) {
        soundError();
        elMouth.setAttribute('d', 'M 65 75 Q 75 68 85 75');
        elPupilL.setAttribute('cy', '45');
        elPupilR.setAttribute('cy', '45');
        
        elBoard.animate([
            { transform: 'translate(0px, 0px) scale(1)' },
            { transform: 'translate(-10px, 0px) scale(1)' },
            { transform: 'translate(10px, 0px) scale(1)' },
            { transform: 'translate(-10px, 0px) scale(1)' },
            { transform: 'translate(0px, 0px) scale(1)' }
        ], { duration: 400 });

        if(!isRemote) sendGameAction('errorTask');
        setTimeout(resetBeaverFace, 2000);
    }

    function updateBeaverPosition() {
        const progress = (score / maxTasks) * 85; 
        elBeaver.style.left = `${progress}%`;
        
        const yOffset = Math.sin((score / maxTasks) * Math.PI) * 20;
        elBeaver.style.bottom = `${40 - yOffset}px`;
    }

    function triggerVictory() {
        elBoard.style.display = 'none';
        elBeaver.classList.add('jumping');
        
        let jumpCount = 0;
        const jumpInterval = setInterval(() => {
            soundJump();
            jumpCount++;
            if(jumpCount >= 5) clearInterval(jumpInterval);
        }, 600);
        
        elMouth.setAttribute('d', 'M 70 70 Q 75 85 80 70 Z');
    }

    function resetBeaverFace() {
        elMouth.setAttribute('d', 'M 65 68 Q 75 75 85 68');
        elPupilL.setAttribute('cy', '42');
        elPupilR.setAttribute('cy', '42');
        elPupilL.setAttribute('cx', '63');
        elPupilR.setAttribute('cx', '87');
    }

    setInterval(() => {
        if (score >= maxTasks || elBoard.style.opacity === '0') return; 
        
        const rand = Math.random();
        if (rand < 0.3) {
            elPupilL.setAttribute('cx', '60');
            elPupilR.setAttribute('cx', '84');
        } else if (rand < 0.6) {
            elPupilL.setAttribute('cx', '66');
            elPupilR.setAttribute('cx', '90');
        } else if (rand < 0.8) {
            elPupilL.setAttribute('cy', '39');
            elPupilR.setAttribute('cy', '39');
            elMouth.setAttribute('d', 'M 70 72 Q 75 80 80 72 Z');
        } else {
            resetBeaverFace();
        }
        
        setTimeout(() => {
            if (score < maxTasks && elBoard.style.opacity !== '0') resetBeaverFace();
        }, 1500);
        
    }, 4000);

    function handleRemoteAction(data) {
        const { type, data: payload } = data;
        switch (type) {
            case 'nextTask': nextTask(true); break;
            case 'prevTask': prevTask(true); break;
            case 'approveTask': approveTask(true); break;
            case 'errorTask': errorTask(true); break;
            case 'setLang': setLang(payload.lang, true); break;
            case 'input_sync': elInput.value = payload.text; break;
            case 'draw_line':
                drawLine(
                    payload.nx1 * canvas.width, 
                    payload.ny1 * canvas.height, 
                    payload.nx2 * canvas.width, 
                    payload.ny2 * canvas.height, 
                    payload.color, payload.size, false
                );
                break;
            case 'clear_canvas': clearCanvas(); break;
        }
    }

    generateBridge();
    renderTask();
    
    document.body.addEventListener('click', initAudio, { once: true });

</script>
</body>
</html>
