<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Grid Puzzle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood-dark: #3d2314;
      --wood-mid: #5c3822;
      --wood-light: #8a5636;
      --amber-glow: #ffbf47;
      --parchment-bg: #e8d5b5;
      --parchment-dark: #cbb085;
      --ruby-dark: #7a1414;
      --ruby-bright: #c92a2a;
      --emerald-bright: #2b8a3e;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Rubik', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a2e1d;
    }

    /* Wood & Natural Pattern Textures (No white rectangles anywhere) */
    .wood-panel {
      background: 
        repeating-linear-gradient(
          90deg,
          rgba(35, 16, 6, 0.14) 0px,
          rgba(35, 16, 6, 0.14) 3px,
          transparent 3px,
          transparent 11px
        ),
        radial-gradient(ellipse at 20% 20%, rgba(168, 108, 62, 0.35), transparent 60%),
        linear-gradient(145deg, #633b22 0%, #442715 55%, #301a0d 100%);
      border: 4px solid #8c5835;
      box-shadow: 
        0 18px 38px rgba(0, 0, 0, 0.65),
        inset 0 2px 4px rgba(255, 215, 155, 0.35),
        inset 0 -6px 14px rgba(18, 8, 3, 0.8);
      position: relative;
    }

    .wood-panel::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1.5px dashed rgba(227, 178, 113, 0.28);
      border-radius: inherit;
      pointer-events: none;
    }

    /* Brass corner rivets */
    .brass-rivets::after {
      content: '';
      position: absolute;
      inset: 10px;
      background-image: 
        radial-gradient(circle at 0% 0%, #ffd97d 0px, #b57c1e 4px, #3b220c 5px, transparent 6px),
        radial-gradient(circle at 100% 0%, #ffd97d 0px, #b57c1e 4px, #3b220c 5px, transparent 6px),
        radial-gradient(circle at 0% 100%, #ffd97d 0px, #b57c1e 4px, #3b220c 5px, transparent 6px),
        radial-gradient(circle at 100% 100%, #ffd97d 0px, #b57c1e 4px, #3b220c 5px, transparent 6px);
      pointer-events: none;
    }

    /* Carved Grid Cells */
    .grid-slot {
      background: 
        radial-gradient(circle at 30% 25%, #edd9b4 0%, #d8bc8c 65%, #bda06e 100%);
      border: 3px solid #754b29;
      box-shadow: 
        inset 0 4px 8px rgba(56, 32, 12, 0.45),
        inset 0 -2px 4px rgba(255, 240, 200, 0.5),
        0 4px 8px rgba(0, 0, 0, 0.35);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .grid-slot::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(120, 82, 42, 0.05) 0px,
        rgba(120, 82, 42, 0.05) 2px,
        transparent 2px,
        transparent 8px
      );
      pointer-events: none;
    }

    .grid-slot.selected-slot {
      border-color: #ffae00;
      background: radial-gradient(circle at 50% 50%, #ffefc2 0%, #e8c77b 100%);
      box-shadow: 
        0 0 18px rgba(255, 187, 0, 0.85),
        inset 0 0 12px rgba(255, 166, 0, 0.55);
      transform: scale(1.05);
      z-index: 10;
    }

    .grid-slot.row-hint-glow {
      box-shadow: 0 0 22px #52ff9a, inset 0 0 12px #52ff9a;
      border-color: #2ce679;
    }

    /* Pre-filled Ruby Diagonal Tile */
    .grid-slot.diagonal-fixed {
      background: 
        radial-gradient(circle at 30% 25%, #eb4d4b 0%, #b32424 65%, #781212 100%);
      border: 3px solid #f7b731;
      color: #fff3d1;
      text-shadow: 0 2px 4px rgba(50, 0, 0, 0.85);
      box-shadow: 
        0 5px 12px rgba(0, 0, 0, 0.5),
        inset 0 2px 5px rgba(255, 200, 180, 0.55),
        inset 0 -4px 8px rgba(60, 0, 0, 0.7);
      cursor: default;
    }

    /* Filled User Letter Tile in Grid */
    .grid-slot.filled-user {
      background: 
        radial-gradient(circle at 30% 25%, #f7dca1 0%, #dfb468 70%, #b8873b 100%);
      border: 3px solid #966122;
      color: #3b1e08;
      text-shadow: 0 1px 0 rgba(255, 240, 200, 0.7);
      box-shadow: 
        0 5px 10px rgba(0, 0, 0, 0.4),
        inset 0 2px 3px rgba(255, 245, 215, 0.8),
        inset 0 -4px 6px rgba(99, 59, 18, 0.5);
      cursor: pointer;
    }

    /* Completed Row Tile State */
    .grid-slot.row-solved {
      background: 
        radial-gradient(circle at 30% 25%, #74d680 0%, #379b47 65%, #1e6b2b 100%) !important;
      border: 3px solid #ffe066 !important;
      color: #fff9db !important;
      text-shadow: 0 2px 4px rgba(8, 54, 16, 0.8) !important;
      box-shadow: 
        0 0 16px rgba(116, 214, 128, 0.65),
        inset 0 2px 5px rgba(230, 255, 210, 0.65),
        inset 0 -4px 8px rgba(10, 56, 20, 0.7) !important;
      cursor: default !important;
    }

    .grid-slot.diagonal-fixed.row-solved {
      background: 
        radial-gradient(circle at 30% 25%, #ff6b6b 0%, #c92a2a 60%, #8a1515 100%) !important;
      border: 3px solid #ffe066 !important;
      box-shadow: 0 0 20px rgba(255, 212, 59, 0.85), inset 0 2px 6px rgba(255, 230, 180, 0.75) !important;
    }

    /* Showcase Illustration Cards */
    .illustration-card {
      background: 
        radial-gradient(circle at 50% 35%, #f2dfc1 0%, #dcc096 68%, #bfa072 100%);
      border: 4px solid #784c28;
      box-shadow: 
        0 8px 18px rgba(0, 0, 0, 0.45),
        inset 0 2px 6px rgba(255, 245, 220, 0.65),
        inset 0 -5px 12px rgba(87, 52, 22, 0.45);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .illustration-card::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1.5px solid rgba(120, 76, 40, 0.3);
      border-radius: 14px;
      pointer-events: none;
      z-index: 2;
    }

    .illustration-card:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: #d99b38;
      box-shadow: 
        0 14px 26px rgba(0, 0, 0, 0.55),
        0 0 18px rgba(255, 196, 77, 0.45),
        inset 0 2px 8px rgba(255, 245, 220, 0.8);
    }

    .illustration-card.card-solved {
      background: 
        radial-gradient(circle at 50% 35%, #fff3c4 0%, #f5d376 68%, #d49e35 100%);
      border-color: #ffe066;
      box-shadow: 
        0 0 28px rgba(255, 215, 70, 0.85),
        inset 0 0 18px rgba(255, 250, 210, 0.75);
      animation: cardCelebrate 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Bottom Carved Letter Bank Tiles */
    .bank-tile {
      background: 
        repeating-linear-gradient(
          90deg,
          rgba(120, 68, 22, 0.08) 0px,
          rgba(120, 68, 22, 0.08) 2px,
          transparent 2px,
          transparent 7px
        ),
        radial-gradient(circle at 35% 25%, #ffeaad 0%, #e5b965 65%, #bf8837 100%);
      border: 3px solid #6b3e17;
      border-bottom-width: 6px;
      color: #3d1e05;
      text-shadow: 0 1px 0 rgba(255, 245, 215, 0.75);
      box-shadow: 
        0 6px 12px rgba(0, 0, 0, 0.5),
        inset 0 2px 3px rgba(255, 250, 225, 0.85);
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, opacity 0.2s ease;
      cursor: grab;
      touch-action: none;
    }

    .bank-tile:hover:not(.tile-used) {
      transform: translateY(-5px) scale(1.08);
      border-color: #ffd452;
      box-shadow: 
        0 12px 20px rgba(0, 0, 0, 0.55),
        0 0 15px rgba(255, 204, 51, 0.6),
        inset 0 2px 4px rgba(255, 250, 225, 0.95);
    }

    .bank-tile:active:not(.tile-used) {
      transform: translateY(1px) scale(0.96);
      border-bottom-width: 3px;
      cursor: grabbing;
    }

    .bank-tile.tile-used {
      opacity: 0.22;
      transform: scale(0.88);
      pointer-events: none;
      filter: grayscale(0.5);
    }

    /* Animations */
    @keyframes rowShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px) rotate(-2deg); }
      40% { transform: translateX(10px) rotate(2deg); }
      60% { transform: translateX(-8px) rotate(-1deg); }
      80% { transform: translateX(8px) rotate(1deg); }
    }

    .shake-error {
      animation: rowShake 0.48s ease-in-out;
      border-color: #ff4d4d !important;
      background: radial-gradient(circle, #ffcccc 0%, #e07a7a 100%) !important;
    }

    @keyframes cardCelebrate {
      0% { transform: scale(1); }
      35% { transform: scale(1.14) rotate(-3deg); }
      70% { transform: scale(1.08) rotate(3deg); }
      100% { transform: scale(1); }
    }

    @keyframes tilePopIn {
      0% { transform: scale(0.4) rotate(-12deg); opacity: 0; }
      70% { transform: scale(1.12) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .pop-in {
      animation: tilePopIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Ambient Forest Sway Animations */
    @keyframes swaySlow {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.8deg); }
    }
    @keyframes swayMedium {
      0%, 100% { transform: rotate(2deg) translateX(0px); }
      50% { transform: rotate(-2.5deg) translateX(4px); }
    }
    @keyframes sunbeamPulse {
      0%, 100% { opacity: 0.22; transform: translateX(0) scaleX(1); }
      50% { opacity: 0.38; transform: translateX(12px) scaleX(1.08); }
    }
    @keyframes waterFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes floatCloud {
      0% { transform: translateX(-15%); }
      100% { transform: translateX(115%); }
    }

    .tree-sway-1 { transform-origin: bottom center; animation: swaySlow 7s ease-in-out infinite; }
    .tree-sway-2 { transform-origin: bottom center; animation: swayMedium 5.5s ease-in-out infinite; }
    .sunbeam { animation: sunbeamPulse 8s ease-in-out infinite; }
    .water-ripple { stroke-dasharray: 28 32; animation: waterFlow 4s linear infinite; }

    /* Styled Top Controls */
    .wooden-btn {
      background: linear-gradient(180deg, #7d4b28 0%, #4d2c15 100%);
      border: 3px solid #b87c44;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,220,165,0.4);
      color: #ffebd2;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .wooden-btn:hover {
      transform: translateY(-2px) scale(1.05);
      border-color: #ffd166;
      box-shadow: 0 8px 18px rgba(0,0,0,0.6), 0 0 14px rgba(255, 200, 70, 0.5);
    }

    .wooden-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .lang-pill.active-lang {
      background: linear-gradient(180deg, #ffbe3b 0%, #d47a00 100%);
      color: #2e1502;
      border-color: #fff0b3;
      box-shadow: 0 0 12px rgba(255, 190, 59, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    /* Drag Ghost Element */
    #drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      transform: translate(-50%, -50%) scale(1.15) rotate(-4deg);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden flex flex-col justify-between select-none">

  <!-- LIVING FOREST GLADE & STREAM SCENIC BACKGROUND (SVG) -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" class="w-full h-full">
      <defs>
        <!-- Sky & Sunlit Canopy Gradients -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#6ec6ca" />
          <stop offset="45%" stop-color="#a8e0b8" />
          <stop offset="100%" stop-color="#e9f5be" />
        </linearGradient>
        <linearGradient id="sunRayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#fff9c4" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="distantHill1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#5d9c76" />
          <stop offset="100%" stop-color="#376b4d" />
        </linearGradient>
        <linearGradient id="distantHill2" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#488253" />
          <stop offset="100%" stop-color="#265232" />
        </linearGradient>
        <linearGradient id="meadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#68ab48" />
          <stop offset="50%" stop-color="#427d2c" />
          <stop offset="100%" stop-color="#254f1a" />
        </linearGradient>
        <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#63d2de" />
          <stop offset="45%" stop-color="#2b9eb3" />
          <stop offset="100%" stop-color="#176178" />
        </linearGradient>
        <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#593a25" />
          <stop offset="50%" stop-color="#3d2616" />
          <stop offset="100%" stop-color="#24150b" />
        </linearGradient>
      </defs>

      <!-- Sky -->
      <rect width="1920" height="1080" fill="url(#skyGrad)" />

      <!-- Warm Sun Glow -->
      <circle cx="320" cy="140" r="240" fill="#fff7b2" opacity="0.45" />
      <circle cx="320" cy="140" r="110" fill="#fffde0" opacity="0.7" />

      <!-- Drifting Soft Clouds -->
      <g opacity="0.55" style="animation: floatCloud 65s linear infinite;">
        <path d="M180 140 Q210 100 260 115 Q300 85 350 115 Q390 110 405 145 Q410 170 370 175 L190 175 Q155 170 180 140 Z" fill="#ffffff" />
      </g>
      <g opacity="0.4" style="animation: floatCloud 90s linear infinite; animation-delay: -30s;">
        <path d="M980 95 Q1020 55 1080 75 Q1130 45 1185 80 Q1225 85 1235 120 L970 120 Z" fill="#ffffff" />
      </g>

      <!-- Distant Mountain Ridge & Pine Silhouettes -->
      <path d="M0 580 Q280 410 620 510 T1280 460 T1920 530 L1920 750 L0 750 Z" fill="url(#distantHill1)" />
      <path d="M0 640 Q420 510 890 595 T1620 540 T1920 600 L1920 820 L0 820 Z" fill="url(#distantHill2)" />

      <!-- Background Pine Forest Layer -->
      <g fill="#2e5e39" opacity="0.85">
        <polygon points="150,450 110,590 190,590" />
        <polygon points="150,400 120,510 180,510" />
        <polygon points="220,470 185,600 255,600" />
        <polygon points="1650,430 1605,580 1695,580" />
        <polygon points="1650,380 1615,500 1685,500" />
        <polygon points="1735,450 1695,590 1775,590" />
      </g>

      <!-- Rolling Sunlit Meadow Hills -->
      <path d="M0 680 Q540 590 1050 675 T1920 640 L1920 1080 L0 1080 Z" fill="url(#meadowGrad)" />

      <!-- Winding Mountain Stream -->
      <path d="M920 665 Q1020 730 860 810 Q680 895 880 985 Q1060 1055 1190 1080 L1650 1080 Q1390 985 1180 915 Q990 845 1110 755 Q1200 695 1040 660 Z" fill="url(#streamGrad)" />
      <!-- Stream Mossy Stones & Banks -->
      <ellipse cx="865" cy="795" rx="45" ry="18" fill="#5e6b5c" />
      <ellipse cx="855" cy="791" rx="34" ry="12" fill="#7c8c79" />
      <ellipse cx="1145" cy="875" rx="58" ry="22" fill="#4f5e4d" />
      <ellipse cx="1138" cy="870" rx="44" ry="15" fill="#70826d" />
      <ellipse cx="810" cy="945" rx="50" ry="20" fill="#556353" />

      <!-- Animated Water Ripples -->
      <path class="water-ripple" d="M975 695 Q1040 745 920 815 Q790 885 950 965 Q1090 1030 1240 1065" fill="none" stroke="#c8f7ff" stroke-width="4" stroke-linecap="round" opacity="0.65" />
      <path class="water-ripple" style="animation-delay: -1.8s;" d="M1015 710 Q1080 760 980 830 Q870 900 1050 975 Q1210 1040 1390 1070" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />

      <!-- Left Ancient Oak & Pine Framing Trees -->
      <g class="tree-sway-1">
        <path d="M-20 1080 L-20 120 L95 120 Q85 480 120 790 Q145 960 195 1080 Z" fill="url(#trunkGrad)" />
        <path d="M60 320 Q180 260 270 190 L285 215 Q190 300 75 375 Z" fill="url(#trunkGrad)" />
        <circle cx="80" cy="140" r="145" fill="#235728" />
        <circle cx="210" cy="160" r="120" fill="#2f6e33" />
        <circle cx="140" cy="240" r="110" fill="#3f873e" />
        <circle cx="265" cy="220" r="85" fill="#55a349" opacity="0.9" />
        <circle cx="55" cy="290" r="105" fill="#2c6930" />
      </g>

      <!-- Right Framing Birch & Oak Trees -->
      <g class="tree-sway-2">
        <path d="M1940 1080 L1940 100 L1835 100 Q1845 510 1810 810 Q1785 960 1735 1080 Z" fill="url(#trunkGrad)" />
        <circle cx="1840" cy="150" r="150" fill="#215226" />
        <circle cx="1710" cy="180" r="125" fill="#2e6b32" />
        <circle cx="1780" cy="260" r="115" fill="#3e853d" />
        <circle cx="1665" cy="245" r="85" fill="#56a34b" opacity="0.9" />
      </g>

      <!-- Foreground Ferns, Wildflowers & Berry Bushes -->
      <g class="tree-sway-2" fill="#1d4518">
        <path d="M0 1080 Q60 940 190 920 Q110 990 130 1080 Z" />
        <path d="M40 1080 Q140 930 280 950 Q180 1010 190 1080 Z" fill="#285920" />
        <circle cx="160" cy="965" r="7" fill="#ff6b6b" />
        <circle cx="185" cy="980" r="6" fill="#ffd166" />
        <circle cx="220" cy="960" r="7" fill="#ff6b6b" />
      </g>
      <g class="tree-sway-1" fill="#1d4518">
        <path d="M1920 1080 Q1850 935 1720 915 Q1800 990 1790 1080 Z" />
        <path d="M1880 1080 Q1770 925 1640 950 Q1740 1015 1730 1080 Z" fill="#285920" />
        <circle cx="1750" cy="965" r="7" fill="#ffd166" />
        <circle cx="1710" cy="975" r="6" fill="#ff6b6b" />
        <circle cx="1685" cy="955" r="7" fill="#ffd166" />
      </g>

      <!-- Diagonal Sunbeams -->
      <polygon class="sunbeam" points="180,0 480,0 1120,1080 680,1080" fill="url(#sunRayGrad)" />
      <polygon class="sunbeam" style="animation-delay: -4s;" points="580,0 820,0 1540,1080 1180,1080" fill="url(#sunRayGrad)" />
    </svg>
  </div>

  <!-- INTERACTIVE BUTTERFLIES / FIREFLIES / CELEBRATION PARTICLE CANVAS -->
  <canvas id="fx-canvas" class="fixed inset-0 pointer-events-none z-30"></canvas>

  <!-- TOP NAVIGATION BAR (Minimalist, No Extra Text, Language Switch + Level Gems + Next Button) -->
  <header class="relative z-20 w-full px-4 sm:px-8 pt-3 pb-1 flex items-center justify-between">
    <!-- Language Switcher (УКР / РУС) -->
    <div class="wood-panel rounded-2xl p-1.5 flex items-center gap-1.5 shadow-xl">
      <button id="btn-lang-uk" onclick="switchLanguage('uk')" class="lang-pill active-lang px-3.5 py-1.5 rounded-xl font-black text-sm sm:text-base tracking-wider border-2 border-amber-700 transition-all">
        УКР
      </button>
      <button id="btn-lang-ru" onclick="switchLanguage('ru')" class="lang-pill px-3.5 py-1.5 rounded-xl font-black text-sm sm:text-base tracking-wider text-amber-100 border-2 border-transparent hover:border-amber-600 transition-all">
        РУС
      </button>
    </div>

    <!-- 4 Task Amber Gem Dots -->
    <div id="level-gems" class="wood-panel rounded-full px-4 py-2 flex items-center gap-3 shadow-xl">
      <!-- Dynamically populated 4 gem indicators -->
    </div>

    <!-- Sound Mute Toggle + Immediate "Next" Button -->
    <div class="flex items-center gap-3">
      <button id="btn-sound" onclick="toggleSound()" class="wooden-btn w-11 h-11 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center shadow-xl" aria-label="Toggle Sound">
        <svg id="icon-sound-on" viewBox="0 0 24 24" class="w-6 h-6 fill-current text-amber-200">
          <path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07l1.41 1.41a7 7 0 0 0 0-9.9l-1.41 1.42zM19.07 4.93l-1.41 1.41a9 9 0 0 1 0 12.73l1.41 1.41a11 11 0 0 0 0-15.55z"/>
        </svg>
        <svg id="icon-sound-off" viewBox="0 0 24 24" class="w-6 h-6 fill-current text-rose-300 hidden">
          <path d="M11 5L6 9H2v6h4l5 4V5zM22 9l-6 6M16 9l6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Minimalist Always-Active NEXT Button -->
      <button id="btn-next" onclick="nextTask()" class="wooden-btn px-4 sm:px-5 h-11 sm:h-12 rounded-2xl flex items-center justify-center gap-2 shadow-xl group">
        <svg viewBox="0 0 32 24" class="w-7 h-6 transition-transform duration-200 group-hover:translate-x-1">
          <path d="M2 12h24M18 4l9 8-9 8" fill="none" stroke="#ffdf80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

    /********************************************************************
     * 3. WEB AUDIO API PROCEDURAL SOUND ENGINE (Rich Non-Verbal Audio)
     ********************************************************************/
    let audioCtx = null;
    let soundMuted = false;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.18, delay = 0, vol = 0.22, slideTo = null) {
      if (soundMuted) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const startTime = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, startTime + duration);
      }

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(vol, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    /********************************************************************

    let currentLang = 'uk';

    let cycleCount = 0;       // Tracks infinite generator cycles

    // Shuffled order of the 4 illustration cards on the right

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeChar(ch) {
      if (!ch) return '';
      const up = ch.toUpperCase();
      if (up === 'Ё') return 'Е';
      return up;
    }

    function initTask() {
      const levelList = LEVEL_SETS[currentLang];
      const taskData = levelList[currentTaskIndex % levelList.length];

      rowSolved = [false, false, false, false];
      gridState = [];
      const neededLetters = [];

      for (let r = 0; r < 4; r++) {
        const rowCells = [];
        const targetWord = taskData.rows[r].word;
        for (let c = 0; c < 4; c++) {
          if (r === c) {
            rowCells.push({
              char: taskData.diag,
              fixed: true,
              bankTileId: null
            });
          } else {
            rowCells.push({
              char: '',
              fixed: false,
              bankTileId: null
            });
            neededLetters.push(targetWord[c]);
          }
        }
        gridState.push(rowCells);
      }

      // Shuffle bank letters
      const shuffledChars = shuffleArray(neededLetters);
      bankTiles = shuffledChars.map((ch, idx) => ({
        id: `tile-${idx}`,
        char: ch,
        used: false
      }));

      // Shuffle right-hand 2x2 showcase cards so it's a true matching challenge
      picOrder = shuffleArray([0, 1, 2, 3]);

      // Select first available empty cell
      selectedCell = { r: 0, c: 1 };

      renderLevelGems();
      renderGrid();
      renderPictures();
      renderBank();

        for (let c = 0; c < 4; c++) {

    /********************************************************************
     * 5. INTERACTION: CLICK, DRAG-AND-DROP & KEYBOARD SUPPORT
     ********************************************************************/
    function handleCellClick(r, c) {
      if (rowSolved[r]) return;
      const cell = gridState[r][c];
      if (cell.fixed) return;

      // If cell already has a user-placed letter, pop it back to the bank and select this cell
      if (cell.char) {
        SFX.removeLetter();
        if (cell.bankTileId) {
          const t = bankTiles.find(b => b.id === cell.bankTileId);
          if (t) t.used = false;
        }
        cell.char = '';
        cell.bankTileId = null;
        selectedCell = { r, c };
        renderGrid();
        renderBank();
        return;
      }

      // Select this empty cell
      SFX.woodTap();
      selectedCell = { r, c };
      renderGrid();
    }

    function placeTileIntoCell(tile, r, c) {
      if (rowSolved[r]) return;
      const targetCell = gridState[r][c];
      if (targetCell.fixed) return;

      // If target cell already has a tile, return previous tile to bank first
      if (targetCell.bankTileId) {
        const prev = bankTiles.find(b => b.id === targetCell.bankTileId);
        if (prev) prev.used = false;
      }

      tile.used = true;
      targetCell.char = tile.char;
      targetCell.bankTileId = tile.id;

      SFX.placeLetter();

      const cellDom = document.getElementById(`cell-${r}-${c}`);
      if (cellDom) {
        const rect = cellDom.getBoundingClientRect();
        spawnSparkleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#ffdf80', 10);
      }

      advanceSelectionFrom(r, c);
      renderGrid();
      renderBank();

      checkRowCompletion(r);
    }

    function advanceSelectionFrom(r, c) {
      // First check remaining empty cells in the same row
      for (let col = 0; col < 4; col++) {
        if (!gridState[r][col].fixed && !gridState[r][col].char) {
          selectedCell = { r, c: col };
          return;
        }
      }
      // Otherwise find next empty cell across the whole 4x4 board
      for (let row = 0; row < 4; row++) {
        if (rowSolved[row]) continue;
        for (let col = 0; col < 4; col++) {
          if (!gridState[row][col].fixed && !gridState[row][col].char) {
            selectedCell = { r: row, c: col };
            return;
          }
        }
      }
      selectedCell = null;
    }

    function checkRowCompletion(r) {
      if (rowSolved[r]) return;
      // Check if all 4 cells in row r are filled
      const chars = gridState[r].map(cell => cell.char);
      if (chars.some(ch => !ch)) return;

      const formedWord = chars.join('');
      const taskData = LEVEL_SETS[currentLang][currentTaskIndex % 4];
      const targetObj = taskData.rows[r];
      const validWords = [targetObj.word, ...(targetObj.alt || [])];

      const isMatch = validWords.some(
        w => w.toUpperCase() === formedWord.toUpperCase() ||
             w.split('').map(normalizeChar).join('') === formedWord.split('').map(normalizeChar).join('')
      );

      if (isMatch) {
        // Lock row & celebrate!
        rowSolved[r] = true;
        // Normalize displayed word to canonical target word
        for (let c = 0; c < 4; c++) {
          gridState[r][c].char = targetObj.word[c];
        }
        SFX.rowSuccess();
        renderGrid();
        renderPictures();

        // Particle burst along solved row and matching picture card
        for (let c = 0; c < 4; c++) {
          const dom = document.getElementById(`cell-${r}-${c}`);

            const rect = dom.getBoundingClientRect();
            spawnSparkleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#69db7c', 12);
          }
        }
        const picDom = document.getElementById(`pic-card-${r}`);
        if (picDom) {
          const pRect = picDom.getBoundingClientRect();
          spawnSparkleBurst(pRect.left + pRect.width / 2, pRect.top + pRect.height / 2, '#ffd43b', 28);
        }

        // Check if all 4 rows are completed
        if (rowSolved.every(Boolean)) {
          setTimeout(() => {
            SFX.tableComplete();
            triggerGrandCelebration();
          }, 320);
        }
      } else {
        // Row filled with wrong word -> tactile shake & return wrong letters to bank
        SFX.rowError();
        for (let c = 0; c < 4; c++) {
          if (!gridState[r][c].fixed) {
            const dom = document.getElementById(`cell-${r}-${c}`);
            if (dom) dom.classList.add('shake-error');
          }
        }

        setTimeout(() => {
          for (let c = 0; c < 4; c++) {
            const cell = gridState[r][c];
            if (!cell.fixed) {
              // Keep letters that happen to be in the exact right spot, return only wrong ones!
              if (normalizeChar(cell.char) !== normalizeChar(targetObj.word[c])) {
                if (cell.bankTileId) {
                  const bTile = bankTiles.find(b => b.id === cell.bankTileId);
                  if (bTile) bTile.used = false;
                }
                cell.char = '';
                cell.bankTileId = null;
              }
            }
          }
          advanceSelectionFrom(r, 0);
          renderGrid();
          renderBank();
        }, 520);
      }
    }

    function highlightTargetRow(r) {
      if (!rowSolved[r]) {
        // Select first empty slot in that row
        for (let c = 0; c < 4; c++) {
          if (!gridState[r][c].fixed && !gridState[r][c].char) {
            selectedCell = { r, c };
            break;
          }
        }
        renderGrid();
      }
      for (let c = 0; c < 4; c++) {
        const dom = document.getElementById(`cell-${r}-${c}`);
        if (dom) {
          dom.classList.add('row-hint-glow');
          setTimeout(() => dom.classList.remove('row-hint-glow'), 700);
        }
      }
    }

    // Unified Pointer Drag & Click for Bank Tiles
    let activeDrag = null;
    const ghostEl = document.getElementById('drag-ghost');

    function startTilePointer(e, tile) {
      if (tile.used) return;
      e.preventDefault();
      activeDrag = {
        tile,
        startX: e.clientX,
        startY: e.clientY,
        isDragging: false
      };

      const onMove = (moveEvent) => {
        if (!activeDrag) return;
        const dx = moveEvent.clientX - activeDrag.startX;
        const dy = moveEvent.clientY - activeDrag.startY;
        if (!activeDrag.isDragging && Math.hypot(dx, dy) > 8) {
          activeDrag.isDragging = true;
          ghostEl.textContent = tile.char;
          ghostEl.style.display = 'flex';
        }
        if (activeDrag.isDragging) {
          ghostEl.style.left = `${moveEvent.clientX}px`;
          ghostEl.style.top = `${moveEvent.clientY}px`;
        }
      };

      const onUp = (upEvent) => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        if (!activeDrag) return;

        ghostEl.style.display = 'none';

        if (activeDrag.isDragging) {
          // Check if dropped onto a grid slot
          const dropTarget = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
          const cellDom = dropTarget ? dropTarget.closest('.grid-slot') : null;
          if (cellDom && cellDom.dataset.r !== undefined) {
            const r = parseInt(cellDom.dataset.r, 10);
            const c = parseInt(cellDom.dataset.c, 10);
            if (!gridState[r][c].fixed && !rowSolved[r]) {
              placeTileIntoCell(tile, r, c);
              activeDrag = null;
              return;
            }
          }
        } else {
          // Simple click/tap -> auto-place into currently selected cell
          if (!selectedCell) advanceSelectionFrom(0, 0);
          if (selectedCell) {
            placeTileIntoCell(tile, selectedCell.r, selectedCell.c);
          }
        }
        activeDrag = null;
      };

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }

    // Physical Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        moveSelection(0, 1);
        return;
      }
      if (e.key === 'ArrowLeft') {
        moveSelection(0, -1);
        return;
      }
      if (e.key === 'ArrowDown') {
        moveSelection(1, 0);
        return;
      }
      if (e.key === 'ArrowUp') {
        moveSelection(-1, 0);
        return;
      }
      if (e.key === 'Backspace' || e.key === 'Delete') {
        if (selectedCell && !rowSolved[selectedCell.r]) {
          const cell = gridState[selectedCell.r][selectedCell.c];
          if (!cell.fixed && cell.char) {
            handleCellClick(selectedCell.r, selectedCell.c);
          }
        }
        return;
      }

      if (e.key.length === 1 && /[а-яА-ЯіїєґІЇЄҐёЁ]/.test(e.key)) {
        const typed = e.key.toUpperCase();
        if (!selectedCell) advanceSelectionFrom(0, 0);
        if (!selectedCell) return;

        // Find matching unused tile in bank, or create virtual placement if typing valid alternative (like ЁЛКА)
        let matchTile = bankTiles.find(
          t => !t.used && (t.char === typed || normalizeChar(t.char) === normalizeChar(typed))
        );
        if (matchTile) {
          placeTileIntoCell(matchTile, selectedCell.r, selectedCell.c);
        } else {
          // Allow direct keyboard entry even if using alternative spelling
          const r = selectedCell.r;
          const c = selectedCell.c;
          if (!rowSolved[r] && !gridState[r][c].fixed) {
            gridState[r][c].char = typed;
            SFX.placeLetter();
            advanceSelectionFrom(r, c);
            renderGrid();
            checkRowCompletion(r);
          }
        }
      }
    });

    function moveSelection(dr, dc) {
      if (!selectedCell) {
        advanceSelectionFrom(0, 0);
        renderGrid();
        return;
      }
      let r = (selectedCell.r + dr + 4) % 4;
      let c = (selectedCell.c + dc + 4) % 4;
      if (gridState[r][c].fixed) {
        c = (c + (dc !== 0 ? dc : 1) + 4) % 4;
      }
      selectedCell = { r, c };
      SFX.woodTap();
      renderGrid();
    }

    /********************************************************************
     * 6. LANGUAGE SWITCH & ALWAYS-VISIBLE "NEXT" GENERATOR BUTTON
     ********************************************************************/
    function switchLanguage(lang) {
      if (currentLang === lang) return;
      currentLang = lang;
      currentTaskIndex = 0;
      SFX.woodTap();

      document.getElementById('btn-lang-uk').classList.toggle('active-lang', lang === 'uk');
      document.getElementById('btn-lang-ru').classList.toggle('active-lang', lang === 'ru');

      initTask();
    }

    function nextTask() {
      SFX.woodTap();
      currentTaskIndex++;
      if (currentTaskIndex % 4 === 0) {
        cycleCount++;
      }
      const btn = document.getElementById('btn-next');
      const rect = btn.getBoundingClientRect();
      spawnSparkleBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, '#ffdf80', 16);
      initTask();
    }

    /********************************************************************
     * 7. LIVING FOREST AMBIENT BUTTERFLIES & PARTICLE CELEBRATION ENGINE
     ********************************************************************/
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let butterflies = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Initialize ambient fluttering forest butterflies & golden fireflies
    function initAmbientLife() {
      butterflies = [];
      const colors = ['#ffbe0b', '#ff6b6b', '#4cc9f0', '#f72585', '#aacc00'];
      for (let i = 0; i < 6; i++) {
        butterflies.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height * 0.75 + 40,
          vx: (Math.random() * 1.2 + 0.5) * (Math.random() < 0.5 ? 1 : -1),
          vy: (Math.random() - 0.5) * 0.6,
          phase: Math.random() * Math.PI * 2,
          color: colors[i % colors.length],
          scale: Math.random() * 0.4 + 0.65
        });
      }
    }
    initAmbientLife();

    function spawnSparkleBurst(x, y, color = '#ffd166', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = Math.random() * 6 + 2.5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: Math.random() * 6 + 4,
          color,
          alpha: 1,
          rotation: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.2,
          shape: Math.random() < 0.5 ? 'star' : 'leaf'
        });
      }
    }

    function triggerGrandCelebration() {
      const colors = ['#ffbe0b', '#fb5607', '#ff006e', '#52b788', '#4cc9f0', '#fff3b0'];
      for (let b = 0; b < 6; b++) {
        setTimeout(() => {
          const rx = canvas.width * (0.2 + Math.random() * 0.6);
          const ry = canvas.height * (0.25 + Math.random() * 0.45);
          spawnSparkleBurst(rx, ry, colors[b % colors.length], 32);
        }, b * 140);
      }
    }

    function drawStar(c, x, y, r, rot) {
      c.save();
      c.translate(x, y);
      c.rotate(rot);
      c.beginPath();
      for (let i = 0; i < 5; i++) {
        c.lineTo(Math.cos(((18 + i * 72) * Math.PI) / 180) * r, -Math.sin(((18 + i * 72) * Math.PI) / 180) * r);
        c.lineTo(Math.cos(((54 + i * 72) * Math.PI) / 180) * (r * 0.45), -Math.sin(((54 + i * 72) * Math.PI) / 180) * (r * 0.45));
      }
      c.closePath();
      c.fill();
      c.restore();
    }

    function animateFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Ambient Butterflies
      butterflies.forEach((b) => {
        b.x += b.vx;
        b.y += b.vy + Math.sin(b.phase * 0.5) * 0.4;
        b.phase += 0.22;

        if (b.x < -40) b.x = canvas.width + 40;
        if (b.x > canvas.width + 40) b.x = -40;
        if (b.y < 30 || b.y > canvas.height - 80) b.vy *= -1;

        const wingFlap = Math.abs(Math.sin(b.phase)) * 0.85 + 0.15;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(b.vx >= 0 ? b.scale : -b.scale, b.scale);
        ctx.fillStyle = b.color;
        ctx.globalAlpha = 0.82;

        // Upper & lower butterfly wing
        ctx.beginPath();
        ctx.ellipse(0, -4 * wingFlap, 9, 12 * wingFlap, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-4, 4 * wingFlap, 6, 8 * wingFlap, -0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      // Draw Burst Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.16; // gentle gravity
        p.alpha -= 0.018;
        p.rotation += p.vRot;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        if (p.shape === 'star') {
          drawStar(ctx, p.x, p.y, p.size, p.rotation);
        } else {
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      requestAnimationFrame(animateFX);
    }

    window.onload = () => {
      initTask();
      animateFX();
    };
  </script>
</body>
</html>
