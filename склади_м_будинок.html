<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Будинок із віконницями — Хто чим зайнятий</title>
<style>
  /* Базове скидання стилів */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1b2e4b;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
  }

  /* Головна сцена на весь екран */
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Сюжетний живий фон саду та неба */
  #bg-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  /* Контейнер будинку із фіксованими пропорціями (4:3), щоб нічого не сплющувалося */
  #scene-container {
    position: relative;
    width: min(94vw, calc(93vh * 1.32));
    height: min(93vh, calc(94vw / 1.32));
    z-index: 5;
  }

  /* SVG фасаду будинку */
  #house-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }

  /* Сітка 6 вікон (2 колонки х 3 поверхи) */
  #windows-grid {
    position: absolute;
    top: 23.5%;
    left: 14.5%;
    width: 71%;
    height: 69.5%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 5.5% 13%;
    z-index: 10;
  }

  /* Окреме вікно з 3D-перспективою */
  .window-box {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 1200px;
    cursor: pointer;
  }

  /* Внутрішній простір кімнати */
  .room-viewport {
    position: absolute;
    inset: 3%;
    border-radius: 10px 10px 4px 4px;
    overflow: hidden;
    background: #141923;
    filter: brightness(0.16) saturate(0.35);
    transition: filter 0.65s ease, box-shadow 0.65s ease;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
  }

  /* Ввімкнення теплого світла у відкритій кімнаті */
  .window-box.open .room-viewport {
    filter: brightness(1.03) saturate(1.08);
    box-shadow:
      inset 0 0 22px rgba(255, 200, 110, 0.45),
      0 0 35px rgba(255, 215, 130, 0.55);
  }

  /* Теплий ореол світла на фасаді */
  .warm-halo {
    position: absolute;
    inset: -12%;
    border-radius: 24px;
    background: radial-gradient(circle, rgba(255,215,120,0.45) 0%, rgba(255,175,60,0) 70%);
    opacity: 0;
    transition: opacity 0.65s ease;
    pointer-events: none;
    z-index: 1;
  }

  .window-box.open .warm-halo {
    opacity: 1;
  }

  /* Зовнішня дерев'яна рама вікна та підвіконня */
  .window-frame {
    position: absolute;
    inset: -3%;
    width: 106%;
    height: 108%;
    pointer-events: none;
    z-index: 12;
    filter: drop-shadow(0 5px 7px rgba(0,0,0,0.45));
  }

  /* Стулки віконниць (складаються гармошкою при відкритті, не перекриваючи сусідні кімнати) */
  .shutter-wing {
    position: absolute;
    top: 2%;
    bottom: 3%;
    width: 48.5%;
    z-index: 15;
    transform-style: preserve-3d;
    transition: transform 0.85s cubic-bezier(0.32, 1.28, 0.62, 1);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
  }

  .shutter-left {
    left: 1.5%;
    transform-origin: left center;
  }

  .shutter-right {
    right: 1.5%;
    transform-origin: right center;
  }

  .window-box.open .shutter-left {
    transform: rotateY(-122deg) scaleX(0.42);
  }

  .window-box.open .shutter-right {
    transform: rotateY(122deg) scaleX(0.42);
  }

  /* Цільна табличка зі складом по центру віконниць */
  .syllable-cartouche {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58%;
    height: 44%;
    transform: translate(-50%, -50%) translateZ(4px);
    z-index: 20;
    transition: transform 0.7s cubic-bezier(0.34, 1.3, 0.64, 1);
    filter: drop-shadow(0 5px 8px rgba(0,0,0,0.55));
    pointer-events: none;
  }

  .window-box.open .syllable-cartouche {
    transform: translate(-50%, -148%) scale(0.56);
  }

  .window-box:not(.open):hover .shutter-left {
    transform: rotateY(-8deg);
  }
  .window-box:not(.open):hover .shutter-right {
    transform: rotateY(8deg);
  }
  .window-box:not(.open):hover .syllable-cartouche {
    transform: translate(-50%, -50%) scale(1.06);
  }

  /* Живий персонаж — пухнастий рудий кіт Мурчик у саду */
  #garden-cat {
    position: absolute;
    right: -6%;
    bottom: 0%;
    width: 21%;
    height: 32%;
    z-index: 30;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  #garden-cat:hover {
    transform: scale(1.05);
  }

  /* Мінімалістичні дерев'яні кнопки навігації (Назад / Далі) */
  .nav-btn {
    position: absolute;
    bottom: 2.2vh;
    width: clamp(54px, 7.2vh, 72px);
    height: clamp(54px, 7.2vh, 72px);
    cursor: pointer;
    z-index: 50;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    filter: drop-shadow(0 6px 9px rgba(0,0,0,0.5));
  }

  .nav-btn:hover {
    transform: scale(1.1) translateY(-2px);
    filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6)) brightness(1.08);
  }

  .nav-btn:active {
    transform: scale(0.94);
  }

  #btn-prev { left: 2vw; }
  #btn-next { left: calc(2vw + clamp(64px, 8.5vh, 86px)); }

  /* Шар для святкових іскор */
  #fx-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 45;
  }

  /* Анімації фону, персонажів та предметів (обертання строго навколо плечового суглоба) */
  @keyframes chimneySmoke {
    0% { transform: translate(0, 0) scale(0.6); opacity: 0.7; }
    50% { transform: translate(15px, -32px) scale(1.1); opacity: 0.45; }
    100% { transform: translate(34px, -68px) scale(1.65); opacity: 0; }
  }
  @keyframes treeBreeze {
    0%, 100% { transform: rotate(-1.3deg); }
    50% { transform: rotate(1.5deg); }
  }
  @keyframes shoulderSwing {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(7deg); }
  }
  @keyframes shoulderSwingOpposite {
    0%, 100% { transform: rotate(5deg); }
    50% { transform: rotate(-6deg); }
  }
  @keyframes actionVertical {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes steamFloat {
    0% { transform: translateY(0) scaleX(0.9); opacity: 0.75; }
    100% { transform: translateY(-22px) scaleX(1.3); opacity: 0; }
  }
  @keyframes pendulumSwing {
    0%, 100% { transform: rotate(-13deg); }
    50% { transform: rotate(13deg); }
  }
  @keyframes pancakeFlip {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-24px) rotate(180deg); }
  }
  @keyframes catTailWag {
    0%, 100% { transform: rotate(-9deg); }
    50% { transform: rotate(13deg); }
  }
  @keyframes catBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-16px) scale(1.04, 0.96); }
  }

  .smoke-c { animation: chimneySmoke 4.4s infinite ease-out; }
  .smoke-c:nth-child(2) { animation-delay: 1.4s; }
  .smoke-c:nth-child(3) { animation-delay: 2.8s; }
  .breeze { transform-origin: bottom center; animation: treeBreeze 5.5s infinite ease-in-out; }
  .arm-left-anim { animation: shoulderSwing 1.6s infinite ease-in-out; }
  .arm-right-anim { animation: shoulderSwingOpposite 1.6s infinite ease-in-out; }
  .anim-updown { animation: actionVertical 1.4s infinite ease-in-out; }
  .anim-steam { animation: steamFloat 2.2s infinite ease-out; }
  .anim-pendulum { animation: pendulumSwing 1.5s infinite ease-in-out; }
  .anim-pancake { animation: pancakeFlip 1.6s infinite ease-in-out; }
  .cat-bounce { animation: catBounce 0.6s ease; }
</style>
</head>

<script>
  /* =========================================================================
     ЗВУКОВИЙ СИНТЕЗАТОР (Web Audio API) — скрип віконниць та звуки 18 кімнат
     ========================================================================= */
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playShutterCreak(open = true) {
    const ctx = getAudio();
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(open ? 140 : 210, now);
    osc.frequency.exponentialRampToValueAtTime(open ? 255 : 125, now + 0.24);
    osc.frequency.exponentialRampToValueAtTime(open ? 185 : 155, now + 0.48);

    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(510, now);
    filter.Q.setValueAtTime(4.2, now);

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.13, now + 0.07);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.52);

    if (open) {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const ch = ctx.createOscillator();
        const cg = ctx.createGain();
        ch.type = 'triangle';
        ch.frequency.setValueAtTime(freq, now + 0.16 + i * 0.06);
        cg.gain.setValueAtTime(0.001, now + 0.16 + i * 0.06);
        cg.gain.linearRampToValueAtTime(0.1, now + 0.2 + i * 0.06);
        cg.gain.exponentialRampToValueAtTime(0.001, now + 0.72 + i * 0.06);
        ch.connect(cg);
        cg.connect(ctx.destination);
        ch.start(now + 0.16 + i * 0.06);
        ch.stop(now + 0.75 + i * 0.06);
      });
    }
  }

  function playRoomSound(index) {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const scales = [
      [440, 554.37, 659.25, 880],
      [392, 493.88, 587.33, 783.99],
      [523.25, 659.25, 783.99, 1046.5],
      [349.23, 440, 523.25, 698.46],
      [493.88, 622.25, 739.99, 987.77],
      [587.33, 739.99, 880, 1174.66]
    ];
    const notes = scales[index % scales.length];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = i % 2 === 0 ? 'sine' : 'triangle';
      o.frequency.setValueAtTime(f, now + i * 0.08);
      o.frequency.exponentialRampToValueAtTime(f * 1.06, now + i * 0.08 + 0.18);
      g.gain.setValueAtTime(0.11, now + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.22);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(now + i * 0.08);
      o.stop(now + i * 0.08 + 0.24);
    });
  }

  function playCatMeow() {
    const ctx = getAudio();
    const now = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(460, now);
    o.frequency.exponentialRampToValueAtTime(780, now + 0.16);
    o.frequency.exponentialRampToValueAtTime(410, now + 0.42);
    g.gain.setValueAtTime(0.01, now);
    g.gain.linearRampToValueAtTime(0.15, now + 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.44);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(now);
    o.stop(now + 0.45);
  }

  /* =========================================================================
     ГЕНЕРАТОР АНАТОМІЧНИХ ПЕРСОНАЖІВ ІЗ ПРИКРІПЛЕНИМИ ДО ПЛЕЧЕЙ РУКАМИ
     ========================================================================= */
  // Малює суцільну руку (від плеча через лікоть і передпліччя до кисті з пальчиком)
  function drawLimb({
    sx, sy, ex, ey, hx, hy,
    shirtColor, skin = '#ffdfc4', skinShadow = '#d9a17c',
    toolSVG = '', animClass = ''
  }) {
    // Проміжна точка манжети рукава (60% від ліктя до кисті або на лікті)
    const cx = ex + (hx - ex) * 0.28;
    const cy = ey + (hy - ey) * 0.28;
    return `
      <g class="${animClass}" style="transform-origin: ${sx}px ${sy}px;">
        <!-- Тінь/контур оголеного передпліччя -->
        <path d="M${ex},${ey} L${hx},${hy}" stroke="${skinShadow}" stroke-width="12.5" stroke-linecap="round" fill="none"/>
        <!-- Оголене передпліччя -->
        <path d="M${ex},${ey} L${hx},${hy}" stroke="${skin}" stroke-width="9.5" stroke-linecap="round" fill="none"/>
        <!-- Контур рукава від плечового суглоба до ліктя -->
        <path d="M${sx},${sy} Q${ex},${ey} ${cx},${cy}" stroke="rgba(0,0,0,0.32)" stroke-width="16.5" stroke-linecap="round" fill="none"/>
        <!-- Тканина рукава від плеча -->
        <path d="M${sx},${sy} Q${ex},${ey} ${cx},${cy}" stroke="${shirtColor}" stroke-width="13.5" stroke-linecap="round" fill="none"/>
        <!-- Долоня та великий пальчик -->
        <circle cx="${hx}" cy="${hy}" r="6.8" fill="${skin}" stroke="${skinShadow}" stroke-width="1.8"/>
        <circle cx="${hx - 3}" cy="${hy - 3}" r="2.8" fill="${skin}" stroke="${skinShadow}" stroke-width="1.2"/>
        <!-- Інструмент або предмет безпосередньо в долоні -->
        ${toolSVG}
      </g>
    `;
  }

  // Малює тулуб і голову персонажа (у локальних координатах плечі розташовані в точках (10, 70) та (60, 70))
  function renderHumanBody({
    x = 185, y = 42,
    skin = '#ffdfc4', skinShadow = '#d9a17c',
    hairColor = '#5c3317', hairStyle = 'short',
    shirtColor = '#3a7ca5', apronColor = null,
    glasses = false, hat = null,
    lookDir = -1
  }) {
    const eyeShift = lookDir * 2.5;
    let hairBack = '';
    let hairFront = '';

    if (hairStyle === 'bun') {
      hairBack = `<circle cx="${35 - lookDir * 18}" cy="14" r="14" fill="${hairColor}"/>`;
      hairFront = `<path d="M12,30 C12,6 58,6 58,30 C50,18 22,18 12,30 Z" fill="${hairColor}"/>`;
    } else if (hairStyle === 'long') {
      hairBack = `<path d="M10,28 C6,55 8,85 16,95 H54 C62,85 64,55 60,28 Z" fill="${hairColor}"/>`;
      hairFront = `<path d="M11,32 C12,5 58,5 59,32 C46,16 24,18 11,32 Z" fill="${hairColor}"/>`;
    } else if (hairStyle === 'curly') {
      hairBack = `<circle cx="14" cy="24" r="12" fill="${hairColor}"/><circle cx="56" cy="24" r="12" fill="${hairColor}"/><circle cx="35" cy="12" r="14" fill="${hairColor}"/>`;
      hairFront = `<path d="M14,28 Q25,14 35,22 Q45,14 56,28" fill="none" stroke="${hairColor}" stroke-width="8" stroke-linecap="round"/>`;
    } else {
      hairFront = `<path d="M12,31 C11,6 59,6 58,31 C48,17 24,17 12,31 Z" fill="${hairColor}"/>`;
    }

    let hatSVG = '';
    if (hat === 'chef') {
      hatSVG = `
        <path d="M11,20 C2,2 22,-6 35,2 C48,-6 68,2 59,20 Z" fill="#ffffff" stroke="#c2c8cf" stroke-width="2"/>
        <rect x="13" y="17" width="44" height="9" rx="3" fill="#ffffff" stroke="#c2c8cf" stroke-width="2"/>
      `;
    } else if (hat === 'beret') {
      hatSVG = `<path d="M8,22 C12,6 55,4 64,18 C52,24 20,24 8,22 Z" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>`;
    } else if (hat === 'straw') {
      hatSVG = `
        <ellipse cx="35" cy="20" rx="32" ry="7" fill="#f3c65f" stroke="#9e7219" stroke-width="2"/>
        <path d="M17,20 C19,3 51,3 53,20 Z" fill="#f3c65f" stroke="#9e7219" stroke-width="2"/>
        <path d="M18,18 H52" stroke="#e63946" stroke-width="3.5"/>
      `;
    }

    const glassesSVG = glasses ? `
      <g stroke="#4a3520" stroke-width="2" fill="rgba(255,255,255,0.28)">
        <circle cx="${26 + eyeShift}" cy="38" r="6.5"/>
        <circle cx="${44 + eyeShift}" cy="38" r="6.5"/>
        <line x1="${32.5 + eyeShift}" y1="38" x2="${37.5 + eyeShift}" y2="38"/>
      </g>
    ` : '';

    const apronSVG = apronColor ? `
      <path d="M15,69 H55 L59,145 H11 Z" fill="${apronColor}" stroke="rgba(0,0,0,0.25)" stroke-width="1.8"/>
      <path d="M24,69 V58 M46,69 V58" stroke="${apronColor}" stroke-width="3.5"/>
    ` : '';

    return `
      <g transform="translate(${x}, ${y})">
        ${hairBack}
        <rect x="27" y="54" width="16" height="16" rx="5" fill="${skinShadow}"/>
        <!-- Тулуб із плечовими суглобами в (10,70) та (60,70) -->
        <path d="M6,72 C6,61 20,60 35,60 C50,60 64,61 64,72 L70,145 H0 Z" fill="${shirtColor}" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>
        <polygon points="24,60 35,71 46,60" fill="#fff8eb" stroke="rgba(0,0,0,0.2)" stroke-width="1.5"/>
        ${apronSVG}
        <ellipse cx="12" cy="40" rx="4.5" ry="7" fill="${skin}" stroke="${skinShadow}" stroke-width="1.8"/>
        <ellipse cx="58" cy="40" rx="4.5" ry="7" fill="${skin}" stroke="${skinShadow}" stroke-width="1.8"/>
        <path d="M13,32 C13,14 57,14 57,32 C57,47 47,60 35,60 C23,60 13,47 13,32 Z" fill="${skin}" stroke="${skinShadow}" stroke-width="2"/>
        <ellipse cx="21" cy="45" rx="5" ry="3" fill="#ff8fa3" opacity="0.45"/>
        <ellipse cx="49" cy="45" rx="5" ry="3" fill="#ff8fa3" opacity="0.45"/>
        <path d="M${21 + eyeShift},31 Q${26 + eyeShift},28 ${31 + eyeShift},31 M${39 + eyeShift},31 Q${44 + eyeShift},28 ${49 + eyeShift},31" fill="none" stroke="${hairColor}" stroke-width="2.2" stroke-linecap="round"/>
        <ellipse cx="${26 + eyeShift}" cy="38" rx="4.2" ry="4.5" fill="#ffffff" stroke="#3b2314" stroke-width="1.4"/>
        <circle cx="${26 + eyeShift * 1.2}" cy="38" r="2.6" fill="#2b1d12"/>
        <circle cx="${25 + eyeShift}" cy="36.8" r="1.1" fill="#ffffff"/>
        <ellipse cx="${44 + eyeShift}" cy="38" rx="4.2" ry="4.5" fill="#ffffff" stroke="#3b2314" stroke-width="1.4"/>
        <circle cx="${44 + eyeShift * 1.2}" cy="38" r="2.6" fill="#2b1d12"/>
        <circle cx="${43 + eyeShift}" cy="36.8" r="1.1" fill="#ffffff"/>
        <path d="M${35 + eyeShift * 0.6},36 L${33 + eyeShift},44 Q35,46 ${37 + eyeShift * 0.5},44" fill="none" stroke="${skinShadow}" stroke-width="2" stroke-linecap="round"/>
        <path d="M28,49 Q35,55 42,49" fill="none" stroke="#8f3929" stroke-width="2.4" stroke-linecap="round"/>
        ${glassesSVG}
        ${hairFront}
        ${hatSVG}
      </g>
    `;
  }

  // Малює обидві прикріплені до плечей руки поверх столу/предметів у тих самих координатах (x, y)
  function renderAttachedArms({ x = 185, y = 42, shirtColor, leftArm, rightArm }) {
    return `
      <g transform="translate(${x}, ${y})">
        ${leftArm ? drawLimb({ sx: 11, sy: 70, shirtColor, ...leftArm }) : ''}
        ${rightArm ? drawLimb({ sx: 59, sy: 70, shirtColor, ...rightArm }) : ''}
      </g>
    `;
  }

  // Базова об'ємна кімната
  function renderRoomBase({ wallColor, sideWallColor, floorColor, rugColor = null }) {
    return `
      <rect width="320" height="220" fill="${wallColor}"/>
      <polygon points="0,0 34,24 34,168 0,220" fill="${sideWallColor}"/>
      <polygon points="320,0 286,24 286,168 320,220" fill="${sideWallColor}"/>
      <polygon points="0,0 320,0 286,24 34,24" fill="#fff6e3" opacity="0.65"/>
      <line x1="160" y1="0" x2="160" y2="18" stroke="#5c3a1e" stroke-width="2.5"/>
      <path d="M142,22 C142,10 178,10 178,22 Z" fill="#ffbe0b" stroke="#8c5800" stroke-width="2"/>
      <polygon points="145,22 175,22 250,175 70,175" fill="rgba(255,235,150,0.16)"/>
      <polygon points="34,168 286,168 320,220 0,220" fill="${floorColor}" stroke="#593518" stroke-width="2"/>
      ${rugColor ? `<ellipse cx="160" cy="196" rx="95" ry="16" fill="${rugColor}" stroke="#fff3d1" stroke-width="2.5"/>` : ''}
    `;
  }

  /* =========================================================================
     КАТАЛОГ ІЗ 18 УНІКАЛЬНИХ КІМНАТ (УСІ РУКИ ПРИЄДНАНІ ДО ПЛЕЧЕЙ!)
     ========================================================================= */
  const LEVELS = [
    /* ================= СЛАЙД 1: ПРЯМІ СКЛАДИ З М ================= */
    [
      {
        syl: 'МА', color: '#2b7a4b', border: '#144527', flower: '#ff6b8b',
        scene: () => `
          <svg viewBox="0 0 320 220" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
            ${renderRoomBase({ wallColor: '#faedcd', sideWallColor: '#e9d8a6', floorColor: '#bc6c25' })}

            <rect x="46" y="42" width="110" height="7" rx="3" fill="#7f4f24"/>
            <rect x="56" y="24" width="18" height="18" rx="3" fill="#e63946" stroke="#780000" stroke-width="1.5"/>
            <rect x="82" y="20" width="20" height="22" rx="4" fill="#52b788" stroke="#1b4332" stroke-width="1.5"/>
            <rect x="110" y="25" width="16" height="17" rx="3" fill="#ffb703" stroke="#7f5539" stroke-width="1.5"/>
            <!-- Кухар (тіло) -->
            ${renderHumanBody({ x: 185, y: 42, hairColor: '#4a2c11', shirtColor: '#e63946', apronColor: '#ffffff', hat: 'chef' })}
            <!-- Кухонна плита та ронделик із супом -->
            <rect x="25" y="152" width="270" height="68" fill="#7f4f24" stroke="#432818" stroke-width="2.5"/>
            <rect x="20" y="144" width="280" height="10" rx="3" fill="#ddb892" stroke="#432818" stroke-width="2"/>
            <ellipse cx="118" cy="143" rx="26" ry="5" fill="#00b4d8"/>
            <g transform="translate(80, 102)">
              <rect x="-34" y="12" width="38" height="7" rx="3" fill="#2b1d12"/>
              <rect x="0" y="8" width="76" height="33" rx="7" fill="#d96b27" stroke="#5c2808" stroke-width="2.2"/>
              <ellipse cx="38" cy="10" rx="38" ry="8" fill="#ff9f1c" stroke="#5c2808" stroke-width="2"/>
              <circle cx="24" cy="10" r="4.5" fill="#e63946"/><circle cx="48" cy="11" r="4" fill="#52b788"/><circle cx="36" cy="8" r="4" fill="#ffca3a"/>
              <path class="anim-steam" d="M22,-2 Q16,-16 25,-26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
              <path class="anim-steam" style="animation-delay:0.8s" d="M46,-2 Q52,-16 42,-26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            </g>
            <!-- Приєднані до плечей руки кухаря: ліва рука мішає суп дерев'яною ложкою, права тримає сільничку -->
            ${renderAttachedArms({
              x: 185, y: 42, shirtColor: '#e63946',
              leftArm: {
                ex: -16, ey: 76, hx: -44, hy: 58, animClass: 'arm-left-anim',
                toolSVG: `<line x1="-44" y1="58" x2="-68" y2="73" stroke="#8d5524" stroke-width="5" stroke-linecap="round"/>`
              },

  let currentSlide = 0;

  /* =========================================================================

  function createShutterWing(color, border, flower) {

      <svg viewBox="0 0 120 190" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">

          <ellipse cx="18" cy="2" rx="10" ry="5" transform="rotate(24 18 2)" fill="#52b788"/>
          <circle cx="0" cy="0" r="10" fill="${flower}" stroke="#fff" stroke-width="1.8"/>
          <circle cx="0" cy="0" r="4" fill="#fff3b0"/>
        </g>
        <g transform="translate(60, 154)">
          <ellipse cx="-18" cy="-2" rx="10" ry="5" transform="rotate(24 -18 -2)" fill="#52b788"/>
          <ellipse cx="18" cy="-2" rx="10" ry="5" transform="rotate(-24 18 -2)" fill="#52b788"/>
          <circle cx="0" cy="0" r="10" fill="${flower}" stroke="#fff" stroke-width="1.8"/>
          <circle cx="0" cy="0" r="4" fill="#fff3b0"/>
        </g>
      </svg>
    `;
  }

  function createSyllablePlaque(syllable, flower) {
    return `
      <svg viewBox="0 0 180 86" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="plaqueG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7a4319"/>
            <stop offset="100%" stop-color="#472207"/>
          </linearGradient>
        </defs>
        <rect x="5" y="5" width="170" height="76" rx="18" fill="url(#plaqueG)" stroke="#ffd699" stroke-width="4"/>
        <rect x="11" y="11" width="158" height="64" rx="13" fill="none" stroke="#b5763c" stroke-width="1.8" stroke-dasharray="5 3"/>
        <circle cx="22" cy="43" r="5" fill="${flower}"/>
        <circle cx="158" cy="43" r="5" fill="${flower}"/>
        <text x="90" y="58" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#fff8e8" stroke="#2b1200" stroke-width="2.5" paint-order="stroke fill">${syllable}</text>
      </svg>
    `;
  }

  function createWindowFrame() {
    return `
      <svg class="window-frame" viewBox="0 0 320 220" preserveAspectRatio="none">
        <rect x="6" y="6" width="308" height="196" rx="12" fill="none" stroke="#6e3a14" stroke-width="10"/>
        <rect x="9" y="9" width="302" height="190" rx="9" fill="none" stroke="#dba267" stroke-width="2.5"/>
        <rect x="0" y="198" width="320" height="18" rx="5" fill="#94501f" stroke="#472105" stroke-width="3"/>
      </svg>
    `;
  }

  /* =========================================================================
     ВІДОБРАЖЕННЯ ПОТОЧНОГО РІВНЯ ТА ОБРОБКА КЛІКІВ
     ========================================================================= */
  function renderSlide(slideIdx) {
    gridEl.innerHTML = '';
    const rooms = LEVELS[slideIdx];

    rooms.forEach((item, idx) => {
      const box = document.createElement('div');
      box.className = 'window-box';

      box.innerHTML = `
        <div class="warm-halo"></div>
        <div class="room-viewport">${item.scene()}</div>
        ${createWindowFrame()}
        <div class="shutter-wing shutter-left">${createShutterWing(item.color, item.border, item.flower)}</div>
        <div class="shutter-wing shutter-right">${createShutterWing(item.color, item.border, item.flower)}</div>
        <div class="syllable-cartouche">${createSyllablePlaque(item.syl, item.flower)}</div>
      `;

      box.addEventListener('click', (e) => {
        const clickedShutter = e.target.closest('.shutter-wing');
        if (!box.classList.contains('open')) {
          box.classList.add('open');
          playShutterCreak(true);
          setTimeout(() => playRoomSound(idx), 280);
          spawnSparkles(box, item.flower);
          animateCatReaction(idx);
        } else if (clickedShutter) {
          box.classList.remove('open');
          playShutterCreak(false);
        } else {
          playRoomSound(idx);
          spawnSparkles(box, '#ffd166');
          animateCatReaction(idx);
        }
      });

      gridEl.appendChild(box);
    });
  }

  function spawnSparkles(targetEl, color) {
    const r = targetEl.getBoundingClientRect();
    const cx = ((r.left + r.width / 2) / window.innerWidth) * 1920;
    const cy = ((r.top + r.height / 2) / window.innerHeight) * 1080;

    for (let i = 0; i < 14; i++) {
      const star = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      star.setAttribute('points', '0,-11 3.5,-3.5 11,0 3.5,3.5 0,11 -3.5,3.5 -11,0 -3.5,-3.5');
      star.setAttribute('fill', i % 2 === 0 ? '#fff3b0' : color);

      const angle = (Math.PI * 2 * i) / 14;
      const dist = 75 + Math.random() * 85;
      const tx = cx + Math.cos(angle) * dist;
      const ty = cy + Math.sin(angle) * dist;

      star.setAttribute('transform', `translate(${cx}, ${cy}) scale(0.4)`);
      star.style.transition = 'transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.75s ease';
      fxLayer.appendChild(star);

      requestAnimationFrame(() => {
        star.setAttribute('transform', `translate(${tx}, ${ty}) scale(1.3) rotate(90)`);
        star.style.opacity = '0';
      });
      setTimeout(() => star.remove(), 800);
    }
  }

  function animateCatReaction(winIdx) {
    const tilts = [-14, -7, -11, -4, -7, 3];
    catHead.style.transform = `rotate(${tilts[winIdx] || -8}deg) translateY(-4px)`;
    gardenCat.classList.remove('cat-bounce');
    void gardenCat.offsetWidth;
    gardenCat.classList.add('cat-bounce');
    setTimeout(() => { catHead.style.transform = 'rotate(0deg)'; }, 1100);
  }

  gardenCat.addEventListener('click', () => {
    playCatMeow();
    spawnSparkles(gardenCat, '#ffaa45');
    animateCatReaction(0);
  });

  document.getElementById('btn-prev').addEventListener('click', () => {
    currentSlide = (currentSlide - 1 + LEVELS.length) % LEVELS.length;
    playShutterCreak(false);
    renderSlide(currentSlide);
  });

  document.getElementById('btn-next').addEventListener('click', () => {
    currentSlide = (currentSlide + 1) % LEVELS.length;
    playShutterCreak(true);
    renderSlide(currentSlide);
  });

  renderSlide(currentSlide);
