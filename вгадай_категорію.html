<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космічний Зв'язок: Вгадай Категорію</title>
    
    <!-- Підключення Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Базові стилі та Шрифт */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1a1a24;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Табло рахунку (Зірочки) */
        #scoreboard {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            font-size: 1.2rem;
            color: #ffd700;
            pointer-events: none; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 0 10px;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }

        /* Контейнер гри - прозорий, без фону */
        #game-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            justify-content: center;
            z-index: 10;
            margin-top: 50px;
        }

        h1 { font-size: 2.2rem; margin-bottom: 10px; color: #ffffff; font-weight: normal; }
        h2 { font-size: 1.8rem; color: #cccccc; font-weight: normal; }
        p { font-size: 1.2rem; color: #bbbbbb; }
        
        .word-display { 
            font-size: 2.2rem; 
            color: #ffd700; 
            margin: 15px 0; 
            font-weight: bold;
            letter-spacing: 1px;
        }
        .category-text { 
            font-size: 1.8rem; 
            color: #4caf50; 
            margin: 10px 0;
        }

        /* Кнопки - мінімалістичні */
        button {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00bcd4;
            color: #00bcd4;
            font-size: 1.2rem;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s, transform 0.1s;
            margin: 8px;
        }
        button:active {
            transform: scale(0.97);
            background: rgba(0, 188, 212, 0.2);
        }
        
        button.buzz-btn {
            border: 2px solid #ff5252;
            color: #ffffff;
            background: rgba(255, 82, 82, 0.2);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            font-size: 2rem;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
        }
        button.buzz-btn:active {
            background: rgba(255, 82, 82, 0.4);
        }
        
        #btn-reset-scores {
            font-size: 1rem;
            padding: 8px 15px;
            border-color: #9e9e9e;
            color: #9e9e9e;
        }

        /* Поля вводу */
        input[type="text"] {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00bcd4;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1.2rem;
            padding: 12px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            outline: none;
            margin: 5px 0;
        }
        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Секретний ввід для вчителя */
        .secret-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 1rem;
            color: #ba68c8;
        }
        input[type="checkbox"] {
            transform: scale(1.3);
            accent-color: #ba68c8;
        }
        input.secret {
            color: transparent !important;
        }
        input.secret::selection {
            background: transparent !important;
            color: transparent !important;
        }

        /* Центрування сигналу */
        .signal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            margin: 0 auto;
        }

        /* Менеджер Тем (Theme Manager) та Мови */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00bcd4;
            color: #00bcd4;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            padding: 0;
            margin: 0;
        }
        
        #lang-btn {
            position: fixed;
            bottom: 20px;
            right: 80px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00bcd4;
            color: #00bcd4;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            padding: 0;
            margin: 0;
        }

        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            max-height: 60vh;
            background: rgba(15, 15, 25, 0.98);
            border: 1px solid #00bcd4;
            border-radius: 12px;
            z-index: 1001;
            padding: 20px;
            overflow-y: auto;
        }
        #theme-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ff5252;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }
        #theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .theme-item {
            position: relative;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s;
            height: 70px;
        }
        .theme-item:hover {
            border-color: #00bcd4;
        }
        .theme-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-item span {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            text-align: center;
            font-size: 11px;
            padding: 4px 0;
        }

        /* Універсальний Блок Контролю */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #block-overlay h1 {
            color: #ff5252;
            font-size: 3rem;
            text-align: center;
            padding: 20px;
        }

        /* Адаптивність */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1.5rem; }
            .word-display { font-size: 1.8rem; }
            button { font-size: 1rem; padding: 10px 20px; }
            button.buzz-btn { width: 180px; height: 180px; font-size: 1.6rem; }
            input[type="text"] { font-size: 1rem; }
            #scoreboard { font-size: 1rem; }
            #game-container { padding: 10px; margin-top: 40px; }
        }
    </style>
</head>
<body>

    <!-- Табло рахунку (Зірочки) -->
    <div id="scoreboard"></div>

    <!-- Головний контейнер гри -->
    <div id="game-container">
        <!-- Контент буде генеруватися через JS -->
    </div>

    <!-- Перемикач Мови та Менеджер Тем -->
    <button id="lang-btn">UK</button>
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal">
        <button id="theme-modal-close">✖</button>
        <h2 id="theme-modal-title" style="text-align: center; font-size: 1.2rem; color: #fff;">Галерея Фонів</h2>
        <div id="theme-grid"></div>
    </div>

    <!-- Універсальний Блок Контролю (Екран-заглушка) -->
    <div id="block-overlay">
        <h1 id="overlay-msg">Зачекай! Зараз не твій урок.</h1>
    </div>

    <script>
        // Ініціалізація Firebase
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Універсальний блок контролю (Ідентифікація, Радар та Блокування)
        let myName = new URLSearchParams(window.location.search).get('user');
        if (!myName) myName = sessionStorage.getItem('myName');
        if (!myName) {
            myName = "Гість_" + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('myName', myName);

        const tabId = Date.now().toString() + Math.random().toString(36).substr(2, 9);
        const presenceRef = db.ref(`online_users/${myName}/${tabId}`);
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', snap => {
            if (snap.val() === true) {
                presenceRef.set(true);
                presenceRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => presenceRef.remove());

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            const overlay = document.getElementById('block-overlay');
            if (overlay) overlay.style.display = snap.val() ? 'flex' : 'none';
        });

        let initTime = Date.now();
        db.ref('current_activity').on('value', snap => {
            if (Date.now() - initTime < 1000) return; // Імунітет першої секунди
            if (snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        db.ref('force_refresh').on('value', snap => {
            if (snap.val() && Date.now() - initTime > 1000) {
                window.location.reload();
            }
        });

        // Словник перекладів та логіка зміни мови
        const translations = {
            uk: {
                docTitle: "Космічний Зв'язок: Вгадай Категорію",
                galleryTitle: "Галерея Фонів",
                waitMsg: "Зачекай! Зараз не твій урок.",
                mainTitle: "КОСМІЧНИЙ ЗВ'ЯЗОК",
                whoNext: "Хто буде передавати сигнал наступним?",
                btnHost: "Я ведучий!",
                btnResetScores: "Скинути всі зірочки",
                youAreHost: "ТИ ВЕДУЧИЙ!",
                yourCategory: "Твоя категорія для екіпажу:",
                secretInput: "Секретний ввід (сховати текст)",
                word1: "Слово 1",
                word2: "Слово 2",
                word3: "Слово 3",
                btnSubmit: "Відправити сигнал",
                alertWords: "Введи всі 3 слова!",
                waitingSignal: "ЧЕКАЄМО СИГНАЛ...",
                hostPrepares: "Ведучий <b>{host}</b> зараз готує слова.",
                getReady: "Готуйся швидко тиснути кнопку!",
                signalReceived: "ПРИЙНЯТО СИГНАЛ:",
                waitGuess: "Чекай, поки хтось із екіпажу відгадає категорію...",
                btnBuzz: "Я ЗНАЮ<br>КАТЕГОРІЮ!",
                stopGame: "СТОП ГРА!",
                winnerIs: "Гравець <span style='color:#ba68c8'>{winner}</span> зреагував першим і отримує ⭐!",
                categoryWas: "Загадана категорія була:",
                btnNext: "Наступний раунд",
                confirmReset: "Точно скинути всі зірочки екіпажу?",
                bgLabel: "Фон"
            },
            ru: {
                docTitle: "Космическая Связь: Угадай Категорию",
                galleryTitle: "Галерея Фонов",
                waitMsg: "Подожди! Сейчас не твой урок.",
                mainTitle: "КОСМИЧЕСКАЯ СВЯЗЬ",
                whoNext: "Кто будет передавать сигнал следующим?",
                btnHost: "Я ведущий!",

                youAreHost: "ТЫ ВЕДУЩИЙ!",
                yourCategory: "Твоя категория для экипажа:",
                secretInput: "Секретный ввод (скрыть текст)",
                word1: "Слово 1",
                word2: "Слово 2",
                word3: "Слово 3",
                btnSubmit: "Отправить сигнал",
                alertWords: "Введи все 3 слова!",
                waitingSignal: "ЖДЕМ СИГНАЛ...",
                hostPrepares: "Ведущий <b>{host}</b> сейчас готовит слова.",
                getReady: "Готовься быстро нажимать кнопку!",
                signalReceived: "ПРИНЯТ СИГНАЛ:",
                waitGuess: "Жди, пока кто-то из экипажа угадает категорию...",
                btnBuzz: "Я ЗНАЮ<br>КАТЕГОРИЮ!",
                stopGame: "СТОП ИГРА!",
                winnerIs: "Игрок <span style='color:#ba68c8'>{winner}</span> среагировал первым и получает ⭐!",
                categoryWas: "Загаданная категория была:",
                btnNext: "Следующий раунд",
                confirmReset: "Точно сбросить все звездочки экипажа?",
                bgLabel: "Фон"
            }
        };

        let currentLang = localStorage.getItem('myAppLang') || 'uk';

        function applyLanguage() {
            document.title = translations[currentLang].docTitle;
            document.getElementById('lang-btn').innerText = currentLang.toUpperCase();
            document.getElementById('theme-modal-title').innerText = translations[currentLang].galleryTitle;
            document.getElementById('overlay-msg').innerText = translations[currentLang].waitMsg;
            renderGame();
            loadThemes(); // Оновлюємо написи "Фон" у галереї
        }

        document.getElementById('lang-btn').onclick = () => {
            currentLang = currentLang === 'uk' ? 'ru' : 'uk';
            localStorage.setItem('myAppLang', currentLang);
            applyLanguage();
        };

        // Система динамічних фонів (Theme Manager) з дефолтним фоном 23
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeModalClose = document.getElementById('theme-modal-close');
        const themeGrid = document.getElementById('theme-grid');
        const themeRef = db.ref('game_theme');

        themeBtn.onclick = () => themeModal.style.display = 'block';
        themeModalClose.onclick = () => themeModal.style.display = 'none';

        // Відновлення локального фону або встановлення 23 за замовчуванням
        const defaultBg = 'https://olgazheltvai2.github.io/images/backgrounds/background_23.webp';
        document.body.style.backgroundImage = `url('${defaultBg}')`; // Відразу ставимо дефолт

        const savedTheme = localStorage.getItem('mySavedGameBg');
        if (savedTheme) {
            document.body.style.backgroundImage = `url('${savedTheme}')`;
        } else {
            localStorage.setItem('mySavedGameBg', defaultBg);
        }

        // Синхронізація фону
        themeRef.on('value', snap => {
            const url = snap.val();
            if (url) {
                document.body.style.backgroundImage = `url('${url}')`;
                localStorage.setItem('mySavedGameBg', url);
            }
        });

        // Асинхронне завантаження галереї фонів
        async function loadThemes() {
            themeGrid.innerHTML = ''; // Очищаємо перед рендером
            const t = translations[currentLang];
            let consecutiveErrors = 0;
            const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/background_';
            
            for (let i = 1; i <= 100; i++) {
                if (consecutiveErrors > 5) break; 
                
                let url = `${baseUrl}${i}.webp`;
                
                try {
                    await new Promise((resolve, reject) => {
                        let img = new Image();
                        
                        img.onload = () => {
                            consecutiveErrors = 0;
                            let div = document.createElement('div');
                            div.className = 'theme-item';
                            div.innerHTML = `<img src="${url}" alt="${t.bgLabel} ${i}"><span>${t.bgLabel} ${i}</span>`;
                            div.onclick = () => {
                                themeRef.set(url);
                                themeModal.style.display = 'none';
                            };
                            themeGrid.appendChild(div);
                            resolve(); 
                        };
                        
                        img.onerror = () => {
                            consecutiveErrors++;
                            reject(); 
                        };
                        
                        img.src = url;
                    });
                } catch (error) {
                    // Продовжуємо цикл
                }
            }
        }

        // Слухач балів (Зірочки)
        let globalScores = {};
        db.ref('game_scores').on('value', snap => {
            globalScores = snap.val() || {};
            renderScoreboard();
        });

        function renderScoreboard() {
            const sb = document.getElementById('scoreboard');
            if(!sb) return;
            let html = '';
            for(let player in globalScores) {
                if(globalScores[player] > 0) {
                    let stars = '⭐'.repeat(globalScores[player]);
                    html += `<div class="score-item">${player}: ${stars}</div>`;
                }
            }
            sb.innerHTML = html;
        }

        // Логіка гри (Двомовні категорії)
        const categoriesData = {

                "Месяцы", "Части тела", "Профессии", "Спорт", "Спортивный инвентарь", "Музыкальные инструменты", "Игрушки", "Сказки", "Мультфильмы", "Эмоции",
                "Посуда", "Кухонные принадлежности", "Напитки", "Сладости", "Молочные продукты", "Мясные продукты", "Хлебобулочные изделия", "Овощные блюда", "Геометрические фигуры", "Здания",
                "Комнаты", "Семья", "Праздники", "Природные явления", "Погода", "Космос", "Планеты", "Игры на улице", "Настольные игры", "Компьютерные игры",
                "Хобби", "Домашние питомцы", "Динозавры", "Сказочные герои", "Супергерои", "Электроника", "Инструменты", "Канцелярские товары", "Грибы", "Комнатные растения",
                "Города", "Страны", "Водный транспорт", "Воздушный транспорт", "Наземный транспорт", "Дорожные знаки", "Парки развлечений", "Цирк", "Театр", "Музей",
                "Библиотека", "Магазины", "Деньги", "Украшения", "Предметы гигиены", "Летние развлечения", "Зимние развлечения", "Водоемы", "Горы", "Лес",
                "Зоопарк", "Ферма", "Город", "Деревня", "Спасательные службы", "Врачи", "Магазин игрушек", "Магазин продуктов", "Парк", "Детская площадка",
                "Утренняя рутина", "Школьные уроки", "Оценки", "Школьная перемена", "Каникулы", "Путешествия", "Транспорт будущего", "Профессии будущего", "Моя комната", "Полезная еда"
            ]
        };
        
        let gameState = {
            phase: 'idle',
            hostId: '',
            category: '',
            words: [],
            winner: ''
        };

        const actionRef = db.ref('game_action');
        let lastTimestamp = 0;
        let isRemoteAction = false;

        function sendAction(type, data = {}) {
            actionRef.set({
                senderId: myName,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            });
        }

        actionRef.on('value', snap => {
            const val = snap.val();
            if (!val) return;
            if (val.timestamp <= lastTimestamp) return; 
            lastTimestamp = val.timestamp;
            isRemoteAction = val.senderId !== myName;

            processAction(val);
        });

        function processAction(action) {
            switch(action.type) {
                case 'BECOME_HOST':
                    gameState.phase = 'hosting';
                    gameState.hostId = action.senderId;
                    gameState.category = action.data.category;
                    gameState.words = [];
                    gameState.winner = '';
                    break;
                case 'SUBMIT_WORDS':
                    gameState.phase = 'guessing';
                    gameState.words = action.data.words;
                    break;
                case 'BUZZ':
                    if (gameState.phase === 'guessing') {
                        gameState.phase = 'result';
                        gameState.winner = action.senderId;
                        
                        if (action.senderId === myName) {
                            db.ref(`game_scores/${myName}`).transaction(currentScore => {
                                return (currentScore || 0) + 1;
                            });
                        }
                    }
                    break;
                case 'RESET':
                    gameState.phase = 'idle';
                    gameState.hostId = '';
                    gameState.category = '';
                    gameState.words = [];
                    gameState.winner = '';
                    break;
            }
            renderGame();
        }

        function renderGame() {
            const container = document.getElementById('game-container');
            if(!container) return;
            container.innerHTML = '';
            
            const t = translations[currentLang];

            if (gameState.phase === 'idle') {
                container.innerHTML = `
                    <h1>${t.mainTitle}</h1>
                    <p>${t.whoNext}</p>
                    <button id="btn-host">${t.btnHost}</button>
                    <button id="btn-reset-scores" style="margin-top:30px;">${t.btnResetScores}</button>
                `;
                document.getElementById('btn-host').onclick = () => {
                    const currentCats = categoriesData[currentLang];
                    const randomCategory = currentCats[Math.floor(Math.random() * currentCats.length)];
                    sendAction('BECOME_HOST', { category: randomCategory });
                };
                document.getElementById('btn-reset-scores').onclick = () => {
                    if(confirm(t.confirmReset)) {
                        db.ref('game_scores').remove();
                    }
                };
            } 
            
            else if (gameState.phase === 'hosting') {
                if (gameState.hostId === myName) {
                    container.innerHTML = `
                        <h2>${t.youAreHost}</h2>
                        <p>${t.yourCategory}</p>
                        <div class="category-text">${gameState.category}</div>
                        
                        <div class="secret-container">
                            <input type="checkbox" id="secret-toggle">
                            <label for="secret-toggle">${t.secretInput}</label>
                        </div>

                        <input type="text" id="w1" placeholder="${t.word1}" autocomplete="off">
                        <input type="text" id="w2" placeholder="${t.word2}" autocomplete="off">
                        <input type="text" id="w3" placeholder="${t.word3}" autocomplete="off">
                        <button id="btn-submit" style="margin-top:15px;">${t.btnSubmit}</button>
                    `;
                    
                    const toggle = document.getElementById('secret-toggle');
                    const inputs = [document.getElementById('w1'), document.getElementById('w2'), document.getElementById('w3')];
                    
                    toggle.onchange = (e) => {
                        inputs.forEach(input => {
                            if(e.target.checked) input.classList.add('secret');
                            else input.classList.remove('secret');
                        });
                    };

                    document.getElementById('btn-submit').onclick = () => {
                        const words = inputs.map(i => i.value.trim()).filter(v => v !== '');
                        if(words.length < 3) {
                            alert(t.alertWords);
                            return;
                        }
                        sendAction('SUBMIT_WORDS', { words: words });
                    };
                } else {
                    const hostText = t.hostPrepares.replace('{host}', gameState.hostId);
                    container.innerHTML = `
                        <h2>${t.waitingSignal}</h2>
                        <p>${hostText}</p>
                        <p>${t.getReady}</p>
                    `;
                }
            } 
            
            else if (gameState.phase === 'guessing') {
                container.innerHTML = `
                    <div class="signal-container">
                        <h2>${t.signalReceived}</h2>
                        <div class="word-display">${gameState.words.join(' • ')}</div>
                    </div>
                `;

                if (gameState.hostId === myName) {
                    container.innerHTML += `<p style="margin-top:20px;">${t.waitGuess}</p>`;
                } else {
                    container.innerHTML += `
                        <button class="buzz-btn" id="btn-buzz">${t.btnBuzz}</button>
                    `;
                    document.getElementById('btn-buzz').onclick = () => {
                        sendAction('BUZZ');
                    };
                }
            } 
            
            else if (gameState.phase === 'result') {
                const winnerText = t.winnerIs.replace('{winner}', gameState.winner);
                container.innerHTML = `
                    <h1>${t.stopGame}</h1>
                    <h2>${winnerText}</h2>
                    <p style="margin-top: 15px;">${t.categoryWas}</p>
                    <div class="category-text">${gameState.category}</div>
                    <div class="word-display" style="font-size: 1.5rem; color: #fff;">(${gameState.words.join(', ')})</div>
                    <button id="btn-next" style="margin-top:20px;">${t.btnNext}</button>
                `;
                document.getElementById('btn-next').onclick = () => {
                    sendAction('RESET');
                };
            }
        }

        // Запуск (застосовуємо мову та рендеримо)
        applyLanguage();

    </script>
</body>
</html>
