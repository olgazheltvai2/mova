<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Космічний Зв'язок: Вгадай Категорію</title>
    
    <!-- Підключення Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Базові стилі та Шрифт */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #050510;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Табло рахунку (Зірочки) */
        #scoreboard {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 100;
            font-size: 1.5rem;
            color: #ff0;
            text-shadow: 0 0 10px #f90;
            pointer-events: none; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 0 10px;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ff0;
            box-shadow: 0 0 10px inset #ff0;
        }

        /* Жодних фонових прямокутників. Використовуємо лише світіння тексту та рамок */
        #game-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
            z-index: 10;
            margin-top: 60px; /* Відступ під табло */
        }

        h1, h2, h3, p {
            text-shadow: 0 0 10px #0ff, 0 0 20px #00f;
            letter-spacing: 2px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        h2 { font-size: 2rem; color: #fff; }
        .word-display { font-size: 2.5rem; color: #ff0; text-shadow: 0 0 10px #f90, 0 0 20px #f00; margin: 10px 0; font-weight: bold;}
        .category-text { font-size: 2.2rem; color: #0f0; text-shadow: 0 0 10px #0f0; }

        /* Кнопки */
        button {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            font-size: 1.5rem;
            padding: 15px 30px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 15px inset #0ff, 0 0 15px #0ff;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.2s;
            margin: 10px;
            text-align: center;
        }
        button:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px inset #0ff, 0 0 30px #0ff;
        }
        
        button.buzz-btn {
            border: 4px solid #fff;
            color: #fff;
            background: radial-gradient(circle, rgba(255,0,0,0.3) 0%, transparent 70%);
            box-shadow: 0 0 40px #f00, 0 0 40px inset #f00;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            font-size: 2.5rem;
            margin-top: 30px;
            /* ВИПРАВЛЕННЯ: Гарантоване центрування тексту всередині кола */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        button.buzz-btn:active {
            background: radial-gradient(circle, rgba(255,0,0,0.6) 0%, transparent 70%);
            box-shadow: 0 0 60px #f00, 0 0 60px inset #f00;
        }
        
        #btn-reset-scores {
            font-size: 1rem;
            padding: 10px 15px;
            border-color: #f0f;
            color: #f0f;
            box-shadow: 0 0 10px inset #f0f, 0 0 10px #f0f;
        }

        /* Поля вводу */
        input[type="text"] {
            background: transparent;
            border: 2px solid #0ff;
            border-radius: 10px;
            color: #fff;
            font-size: 1.5rem;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 10px #0ff inset;
            outline: none;
            margin: 5px 0;
        }
        input[type="text"]::placeholder {
            color: rgba(0, 255, 255, 0.4);
        }

        /* Секретний ввід для вчителя */
        .secret-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            color: #f0f;
            text-shadow: 0 0 5px #f0f;
        }
        input[type="checkbox"] {
            transform: scale(1.5);
            accent-color: #f0f;
        }
        input.secret {
            color: transparent !important;
            text-shadow: none !important;
        }
        input.secret::selection {
            background: transparent !important;
            color: transparent !important;
        }

        /* Центрування сигналу */
        .signal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            margin: 0 auto;
        }

        /* Менеджер Тем (Theme Manager) */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px inset #0ff, 0 0 15px #0ff;
            cursor: pointer;
            z-index: 1000;
            padding: 0;
            margin: 0;
        }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            max-height: 60vh;
            background: rgba(0, 0, 20, 0.95);
            border: 2px solid #0ff;
            box-shadow: 0 0 30px #0ff;
            border-radius: 15px;
            z-index: 1001;
            padding: 20px;
            overflow-y: auto;
        }
        #theme-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #f00;
            font-size: 24px;
            cursor: pointer;
            box-shadow: none;
            padding: 0;
            margin: 0;
            text-shadow: 0 0 5px #f00;
        }
        #theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .theme-item {
            position: relative;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s;
            height: 80px;
        }
        .theme-item:hover {
            border-color: #0ff;
            box-shadow: 0 0 15px #0ff;
            transform: scale(1.05);
        }
        .theme-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-item span {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            text-align: center;
            font-size: 12px;
            padding: 5px 0;
            text-shadow: none;
        }

        /* Універсальний Блок Контролю */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #block-overlay h1 {
            color: red;
            font-size: 4rem;
            text-shadow: 0 0 20px red;
            text-align: center;
        }

        /* Адаптивність */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            h2 { font-size: 1.5rem; }
            .word-display { font-size: 1.8rem; }
            button { font-size: 1.2rem; padding: 10px 20px; }
            button.buzz-btn { width: 180px; height: 180px; font-size: 1.8rem; }
            input[type="text"] { font-size: 1.2rem; }
            #scoreboard { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Табло рахунку (Зірочки) -->
    <div id="scoreboard"></div>

    <!-- Головний контейнер гри -->
    <div id="game-container">
        <!-- Контент буде генеруватися через JS -->
    </div>

    <!-- Менеджер Тем -->
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal">
        <button id="theme-modal-close">✖</button>
        <h2 style="text-align: center; font-size: 1.5rem;">Галерея Фонів</h2>
        <div id="theme-grid"></div>
    </div>

    <!-- Універсальний Блок Контролю (Екран-заглушка) -->
    <div id="block-overlay">
        <h1>Зачекай! Зараз не твій урок.</h1>
    </div>

    <script>
        // Ініціалізація Firebase
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
