<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Monster Dress-Up</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0d1f14;
    font-family: sans-serif;
  }

  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2vh 3vw;
  }

  /* Живий фон */
  #bg-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Канвас для ефектів (іскри, листочки, ноти) */
  #fx-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
  }

  /* Ліва панель - Вибір одягу (Хлопчик / Дівчинка) */
  .side-panel {
    position: relative;
    z-index: 5;
    background: linear-gradient(145deg, rgba(68, 43, 25, 0.92), rgba(38, 22, 11, 0.95));
    border: 4px solid #8c5a32;
    border-radius: 32px;
    box-shadow: 
      0 18px 40px rgba(0,0,0,0.65),
      inset 0 2px 6px rgba(255, 210, 160, 0.35),
      inset 0 -6px 12px rgba(0,0,0,0.6);
    padding: 2.2vh 1.5vw;
    display: flex;
    flex-direction: column;
    gap: 2.5vh;
    align-items: center;
    backdrop-filter: blur(6px);
  }

  .wood-btn {
    width: 7.5vw;
    height: 7.5vw;
    min-width: 78px;
    min-height: 78px;
    max-width: 120px;
    max-height: 120px;
    border-radius: 24px;
    background: radial-gradient(circle at 30% 30%, #734827, #3e2310);
    border: 3px solid #a87042;
    box-shadow: 
      0 8px 16px rgba(0,0,0,0.5),
      inset 0 3px 5px rgba(255,220,180,0.3);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s, border-color 0.2s;
    position: relative;
  }

  .wood-btn:hover {
    transform: scale(1.08) translateY(-3px);
    border-color: #ffd27d;
  }

  .wood-btn.active {
    background: radial-gradient(circle at 30% 30%, #9c6638, #573216);
    border-color: #ffea85;
    box-shadow: 
      0 0 22px rgba(255, 215, 100, 0.75),
      inset 0 3px 8px rgba(255,240,200,0.5);
    transform: scale(1.1);
  }

  .wood-btn svg {
    width: 76%;
    height: 76%;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));
  }

  /* Права панель - Палітра кольорів */
  #color-panel {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.8vh 1.2vw;
    padding: 2.5vh 1.6vw;
  }

  .color-swatch {
    width: 4.8vw;
    height: 4.8vw;
    min-width: 54px;
    min-height: 54px;
    max-width: 78px;
    max-height: 78px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid rgba(255, 235, 200, 0.45);
    box-shadow: 
      0 6px 14px rgba(0,0,0,0.55),
      inset 0 4px 8px rgba(255,255,255,0.45),
      inset 0 -5px 8px rgba(0,0,0,0.4);
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s, border-color 0.22s;
    position: relative;
  }

  .color-swatch:hover {
    transform: scale(1.14);
  }

  .color-swatch.active {
    transform: scale(1.18);
    border-color: #fff6b3;
    box-shadow: 
      0 0 20px rgba(255, 240, 150, 0.9),
      inset 0 4px 8px rgba(255,255,255,0.6),
      inset 0 -5px 8px rgba(0,0,0,0.45);
  }

  /* Центральна сцена з монстриком */
  #stage-area {
    position: relative;
    z-index: 3;
    width: 55vw;
    height: 86vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #monster-svg {
    width: 100%;
    height: 100%;
    max-width: 680px;
    max-height: 680px;
    overflow: visible;
    filter: drop-shadow(0 18px 22px rgba(0,0,0,0.45));
    transform-origin: 50% 82%;
  }

  /* Мінімалістична кнопка "Далі" */
  #next-btn {
    position: absolute;
    bottom: 3.2vh;
    right: 3.2vw;
    z-index: 10;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #68a347, #2d5918);
    border: 3px solid #b7e887;
    box-shadow: 
      0 8px 20px rgba(0,0,0,0.6),
      inset 0 3px 6px rgba(255,255,255,0.45);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
  }

  #next-btn:hover {
    transform: scale(1.12) rotate(6deg);
    box-shadow: 0 0 24px rgba(168, 255, 110, 0.8), inset 0 3px 6px rgba(255,255,255,0.6);
  }

  #next-btn:active {
    transform: scale(0.95);
  }

  #next-btn svg {
    width: 55%;
    height: 55%;
    fill: #f3ffe6;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }

  /* Анімації танців */
  @keyframes danceTwist {
    0%, 100% { transform: rotate(0deg) scale(1, 1) translateY(0); }
    20% { transform: rotate(-9deg) scale(1.04, 0.95) translateY(8px) skewX(-5deg); }
    40% { transform: rotate(9deg) scale(0.96, 1.05) translateY(-22px) skewX(5deg); }
    60% { transform: rotate(-11deg) scale(1.05, 0.94) translateY(6px) skewX(-6deg); }
    80% { transform: rotate(8deg) scale(0.97, 1.04) translateY(-18px) skewX(4deg); }
  }

  @keyframes danceBounce {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    15% { transform: translateY(16px) scale(1.12, 0.88); }
    35% { transform: translateY(-48px) scale(0.92, 1.1) rotate(-6deg); }
    50% { transform: translateY(14px) scale(1.14, 0.86); }
    70% { transform: translateY(-52px) scale(0.9, 1.12) rotate(6deg); }
    85% { transform: translateY(10px) scale(1.08, 0.92); }
  }

  @keyframes danceSalsa {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-32px) translateY(-12px) rotate(-10deg) scale(1.03, 0.97); }
    40% { transform: translateX(-10px) translateY(8px) rotate(4deg) scale(0.97, 1.03); }
    60% { transform: translateX(32px) translateY(-12px) rotate(10deg) scale(1.03, 0.97); }
    80% { transform: translateX(10px) translateY(8px) rotate(-4deg) scale(0.97, 1.03); }
  }

  @keyframes danceSpinJump {
    0%, 100% { transform: translateY(0) scaleX(1); }
    20% { transform: translateY(18px) scale(1.15, 0.85); }
    45% { transform: translateY(-60px) scaleX(-0.9) scaleY(1.08); }
    70% { transform: translateY(-25px) scaleX(1) rotate(12deg); }
    85% { transform: translateY(12px) scale(1.1, 0.9); }
  }

  @keyframes danceGroove {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    25% { transform: translate(-20px, -25px) rotate(-12deg) scale(1.06, 0.95); }
    50% { transform: translate(0, 12px) rotate(0deg) scale(1.12, 0.88); }
    75% { transform: translate(20px, -25px) rotate(12deg) scale(1.06, 0.95); }
  }

  .dance-1 { animation: danceTwist 0.75s infinite ease-in-out; }
  .dance-2 { animation: danceBounce 0.7s infinite ease-in-out; }
  .dance-3 { animation: danceSalsa 0.8s infinite ease-in-out; }
  .dance-4 { animation: danceSpinJump 0.85s infinite ease-in-out; }
  .dance-5 { animation: danceGroove 0.72s infinite ease-in-out; }

  /* Анімація фонових елементів */
  @keyframes swaySlow {
    0%, 100% { transform: rotate(-2.5deg); }
    50% { transform: rotate(2.5deg); }
  }
  .sway-tree {
    transform-origin: 50% 100%;
    animation: swaySlow 7s infinite ease-in-out;
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- Живий сюжетний фон: лісова сцена з деревом, травою, сонячним промінням -->
  <svg id="bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a4731"/>
        <stop offset="45%" stop-color="#2e734c"/>
        <stop offset="80%" stop-color="#68b06c"/>
        <stop offset="100%" stop-color="#234d29"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="0.5" cy="0.2" r="0.6">
        <stop offset="0%" stop-color="rgba(255, 248, 185, 0.55)"/>
        <stop offset="50%" stop-color="rgba(200, 240, 140, 0.2)"/>
        <stop offset="100%" stop-color="rgba(30, 80, 45, 0)"/>
      </radialGradient>
      <linearGradient id="woodStage" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9e6b3b"/>
        <stop offset="25%" stop-color="#7c4e25"/>
        <stop offset="100%" stop-color="#40230d"/>
      </linearGradient>
      <linearGradient id="woodSide" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4d2c12"/>
        <stop offset="25%" stop-color="#87572c"/>
        <stop offset="50%" stop-color="#a36d3d"/>
        <stop offset="75%" stop-color="#754720"/>
        <stop offset="100%" stop-color="#3d210b"/>
      </linearGradient>
      <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a7d4c"/>
        <stop offset="100%" stop-color="#193d24"/>
      </linearGradient>
      <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4b9947"/>
        <stop offset="100%" stop-color="#173819"/>
      </linearGradient>
      <radialGradient id="bushGrad" cx="0.4" cy="0.3" r="0.7">
        <stop offset="0%" stop-color="#76c458"/>
        <stop offset="60%" stop-color="#3a782c"/>
        <stop offset="100%" stop-color="#1b4214"/>
      </radialGradient>
    </defs>

    <!-- Небо та сонячне сяйво -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>
    <rect width="1920" height="1080" fill="url(#sunGlow)"/>

    <!-- Сонячні промені -->
    <g opacity="0.22" id="sun-rays">
      <polygon points="960,-50 450,1080 680,1080" fill="#fff9c4"/>
      <polygon points="960,-50 820,1080 1100,1080" fill="#fff9c4"/>
      <polygon points="960,-50 1240,1080 1470,1080" fill="#fff9c4"/>
    </g>

    <!-- Далекі дерева та пагорби -->
    <path d="M0,740 Q420,580 960,700 T1920,660 L1920,1080 L0,1080 Z" fill="url(#hillFar)"/>

    <!-- Великі дерева на фоні -->
    <g class="sway-tree">
      <path d="M220,760 Q245,450 200,200 L290,200 Q265,450 310,760 Z" fill="#3a2312"/>
      <circle cx="240" cy="200" r="180" fill="url(#bushGrad)"/>
      <circle cx="140" cy="260" r="140" fill="url(#bushGrad)"/>
      <circle cx="340" cy="250" r="150" fill="url(#bushGrad)"/>
    </g>
    <g class="sway-tree" style="animation-delay: -3.5s;">
      <path d="M1620,740 Q1645,450 1600,180 L1690,180 Q1665,450 1710,740 Z" fill="#3a2312"/>
      <circle cx="1650" cy="180" r="190" fill="url(#bushGrad)"/>
      <circle cx="1530" cy="250" r="150" fill="url(#bushGrad)"/>
      <circle cx="1760" cy="240" r="140" fill="url(#bushGrad)"/>
    </g>

    <!-- Ближні пагорби -->
    <path d="M0,800 Q520,670 1050,780 T1920,750 L1920,1080 L0,1080 Z" fill="url(#hillNear)"/>

    <!-- Кущі та квіти -->
    <circle cx="420" cy="820" r="95" fill="url(#bushGrad)"/>
    <circle cx="510" cy="845" r="75" fill="url(#bushGrad)"/>
    <circle cx="1480" cy="810" r="105" fill="url(#bushGrad)"/>
    <circle cx="1380" cy="845" r="80" fill="url(#bushGrad)"/>

    <!-- Дерев'яний подіум-пеньок у центрі -->
    <g transform="translate(960, 895)">
      <!-- Тінь під подіумом -->
      <ellipse cx="0" cy="55" rx="390" ry="70" fill="rgba(0,0,0,0.55)"/>
      <!-- Основа пенька -->
      <path d="M-340,-15 L-370,55 Q0,115 370,55 L340,-15 Z" fill="url(#woodSide)"/>
      <!-- Кора та тріщинки на пеньку -->
      <path d="M-240,-5 L-250,62 M-110,5 L-115,75 M40,8 L45,78 M190,0 L205,65" stroke="#291507" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <!-- Верхня поверхня сцени -->
      <ellipse cx="0" cy="-15" rx="340" ry="64" fill="url(#woodStage)" stroke="#593516" stroke-width="6"/>
      <ellipse cx="0" cy="-15" rx="300" ry="52" fill="none" stroke="#b8824d" stroke-width="3" opacity="0.45"/>
      <ellipse cx="0" cy="-15" rx="220" ry="38" fill="none" stroke="#b8824d" stroke-width="2.5" opacity="0.35"/>
      <ellipse cx="0" cy="-15" rx="130" ry="22" fill="none" stroke="#b8824d" stroke-width="2" opacity="0.3"/>
    </g>
  </svg>

  <!-- Ліва панель: вибір Хлопчик (штани) або Дівчинка (сукня) -->
  <div class="side-panel" id="gender-panel">
    <!-- Кнопка: Штани (Хлопчик) -->
    <div class="wood-btn" id="btn-boy" data-gender="boy">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="iconPantsGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6ec6ff"/>
            <stop offset="55%" stop-color="#2b7de9"/>
            <stop offset="100%" stop-color="#144999"/>
          </linearGradient>
        </defs>
        <!-- Підтяжки та метелик -->
        <path d="M32,18 L36,42 M68,18 L64,42" stroke="#d49b56" stroke-width="5" stroke-linecap="round"/>
        <!-- Штани -->
        <path d="M24,38 L76,38 L82,88 L55,88 L50,58 L45,88 L18,88 Z" fill="url(#iconPantsGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        <!-- Пояс -->
        <rect x="23" y="36" width="54" height="9" rx="3" fill="#4f2d12"/>
        <rect x="44" y="35" width="12" height="11" rx="2" fill="#ffd54f"/>
        <!-- Метелик зверху -->
        <path d="M36,14 L50,21 L36,28 Z M64,14 L50,21 L64,28 Z" fill="#ff5252"/>
        <circle cx="50" cy="21" r="4" fill="#ff8a80"/>
      </svg>
    </div>

    <!-- Кнопка: Сукня (Дівчинка) -->
    <div class="wood-btn" id="btn-girl" data-gender="girl">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="iconDressGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff94c2"/>
            <stop offset="55%" stop-color="#e91e63"/>
            <stop offset="100%" stop-color="#880e4f"/>
          </linearGradient>
        </defs>
        <!-- Бантик -->
        <path d="M35,10 C28,4 28,22 35,16 L50,14 L35,10 Z M65,10 C72,4 72,22 65,16 L50,14 L65,10 Z" fill="#ffeb3b" stroke="#fbc02d" stroke-width="2"/>
        <circle cx="50" cy="14" r="4" fill="#fff59d"/>
        <!-- Верх сукні та пишна спідниця -->
        <path d="M35,24 L65,24 L60,46 L88,86 Q50,96 12,86 L40,46 Z" fill="url(#iconDressGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        <!-- Складки на сукні -->
        <path d="M44,48 L32,86 M56,48 L68,86 M50,48 L50,89" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Поясок -->
        <rect x="38" y="42" width="24" height="7" rx="3" fill="#fff59d"/>
      </svg>
    </div>
  </div>

  <!-- Центральна сцена з монстриком -->
  <div id="stage-area">
    <svg id="monster-svg" viewBox="0 0 500 560"></svg>
  </div>

  <!-- Права панель: 10 кольорів -->
  <div class="side-panel" id="color-panel"></div>

  <!-- Канвас для партиклів та візуальних ефектів -->
  <canvas id="fx-canvas"></canvas>

  <!-- Мінімалістична кнопка "Далі" -->
  <button id="next-btn" aria-label="Next">
    <svg viewBox="0 0 24 24">
      <path d="M5 4l10 8-10 8V4zm11 0h3v16h-3V4z"/>
    </svg>
  </button>
</div>

<script>
(() => {
  // 10 кольорів за умовою: чорний, білий, червоний, синій, зелений, жовтий, блакитний, рожевий, фіолетовий, сірий
  const CLOTHING_COLORS = [
    { id: 'black',  light: '#52525c', main: '#232329', dark: '#0c0c0f', accent: '#7c7c8a' },
    { id: 'white',  light: '#ffffff', main: '#f0f2f7', dark: '#b8c0d4', accent: '#ffffff' },
    { id: 'red',    light: '#ff7575', main: '#e01e2b', dark: '#7d0810', accent: '#ffb3b3' },
    { id: 'blue',   light: '#5e9bff', main: '#1554d1', dark: '#08256b', accent: '#9ec2ff' },
    { id: 'green',  light: '#72eb78', main: '#1fa637', dark: '#0b5218', accent: '#b4f7b8' },
    { id: 'yellow', light: '#fff380', main: '#f5c400', dark: '#9e7400', accent: '#fff9bd' },
    { id: 'cyan',   light: '#8cf2ff', main: '#00bcd4', dark: '#006378', accent: '#c9faff' },
    { id: 'pink',   light: '#ff9ed2', main: '#f03e94', dark: '#8c114c', accent: '#ffcce8' },
    { id: 'purple', light: '#c38aff', main: '#7b2cbf', dark: '#3c096c', accent: '#e3c4ff' },
    { id: 'grey',   light: '#b8c0c8', main: '#7d8590', dark: '#42474f', accent: '#dde3ea' }
  ];

  // Палітри хутра/шкіри самого монстрика
  const MONSTER_PALETTES = [
    { light: '#ffbe76', main: '#eb7d34', dark: '#8f3b08', belly: '#ffe6bd', horn: '#f7e4b2' },
    { light: '#7ed6df', main: '#22a6b3', dark: '#0c565e', belly: '#dff9fb', horn: '#ffeaa7' },
    { light: '#badc58', main: '#6ab04c', dark: '#2d591a', belly: '#f6ffd9', horn: '#f9ca24' },
    { light: '#e082eb', main: '#9b42ad', dark: '#4c1459', belly: '#f8deff', horn: '#ffd89e' },
    { light: '#ff9ff3', main: '#d9538f', dark: '#751842', belly: '#ffe3f1', horn: '#fff2b2' },
    { light: '#a29bfe', main: '#5f52d9', dark: '#271e7d', belly: '#e4e0ff', horn: '#ffeaa7' },
    { light: '#ffeaa7', main: '#e69f2e', dark: '#824d06', belly: '#fff8de', horn: '#fffdf2' }
  ];

  // Стан гри
  let currentMonster = null;
  let selectedGender = null; // 'boy' | 'girl'
  let selectedColor = null;  // об'єкт з CLOTHING_COLORS
  let emotionTimer = null;
  let danceTimeout = null;
  let isDancing = false;
  let audioCtx = null;
  let melodyTimers = [];

  const monsterSvg = document.getElementById('monster-svg');
  const colorPanel = document.getElementById('color-panel');
  const btnBoy = document.getElementById('btn-boy');
  const btnGirl = document.getElementById('btn-girl');
  const nextBtn = document.getElementById('next-btn');

  // --- Ініціалізація звукової системи (Web Audio API) ---
  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function stopCurrentMelody() {
    melodyTimers.forEach(t => clearTimeout(t));
    melodyTimers = [];
  }

  // Короткий звук кліку / вибору
  function playPopSound(freq = 480) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.6, audioCtx.currentTime + 0.12);

    gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.14);
  }

  // Звук появи нового монстрика
  function playAppearSound() {
    initAudio();
    const now = audioCtx.currentTime;
    const notes = [320, 420, 540, 680];
    notes.forEach((n, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n, now + idx * 0.055);
      gain.gain.setValueAtTime(0.18, now + idx * 0.055);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.055);
      osc.stop(now + idx * 0.055 + 0.16);
    });

  // Звук емоції монстрика (муркотіння / хихотіння)
  function playEmotionSound(type) {
    if (!audioCtx || isDancing) return;
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';

    if (type === 'happy' || type === 'laugh') {
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(620, now + 0.09);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);
    } else if (type === 'surprised') {
      osc.frequency.setValueAtTime(350, now);
      osc.frequency.exponentialRampToValueAtTime(740, now + 0.16);
    } else {
      osc.frequency.setValueAtTime(480, now);
      osc.frequency.exponentialRampToValueAtTime(390, now + 0.14);
    }

    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.21);
  }

  const MELODIES = [

  function playDanceMelody(melodyIndex) {
    initAudio();
    stopCurrentMelody();
    const seq = MELODIES[melodyIndex % MELODIES.length];
    let offset = 0;

    seq.forEach((note, idx) => {
      const timer = setTimeout(() => {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        // Основний лід-синтезатор
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx % 2 === 0 ? 'triangle' : 'square';
        osc.frequency.setValueAtTime(note.f, now);

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + note.d * 0.95);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + note.d);

        // М'який бас на кожну другу ноту
        if (idx % 2 === 0) {
          const bass = audioCtx.createOscillator();
          const bGain = audioCtx.createGain();
          bass.type = 'sine';
          bass.frequency.setValueAtTime(note.f * 0.5, now);
          bGain.gain.setValueAtTime(0.2, now);
          bGain.gain.exponentialRampToValueAtTime(0.001, now + note.d * 1.1);
          bass.connect(bGain);
          bGain.connect(audioCtx.destination);
          bass.start(now);
          bass.stop(now + note.d * 1.15);
        }

        // Випускаємо музичну нотку в партикли
        spawnMusicNote();
      }, offset * 1000);

      melodyTimers.push(timer);
      offset += note.d;
    });

    return offset * 1000;
  }

    const positions = count === 1

        : [{ x: 192, y: 182, r: 21 }, { x: 250, y: 158, r: 23 }, { x: 308, y: 182, r: 21 }];

    // Зміщення зіниць залежно від емоції
    let pupilDx = 0, pupilDy = 0;
    if (emotion === 'curious') { pupilDx = 5; pupilDy = -3; }
    if (emotion === 'silly') { pupilDy = 4; }

    return positions.map((pos, idx) => {
      const isWink = (emotion === 'wink' && idx === 1) || (emotion === 'blink');
      if (isWink) {
        return `
          <g>
            <path d="M ${pos.x - pos.r},${pos.y} Q ${pos.x},${pos.y + pos.r * 0.55} ${pos.x + pos.r},${pos.y}" stroke="#2b1608" stroke-width="6" stroke-linecap="round" fill="none"/>
          </g>`;
      }

      const sDx = emotion === 'silly' && idx === 0 ? 6 : (emotion === 'silly' && idx === 1 ? -6 : pupilDx);
      const irisR = pos.r * 0.62;
      const pupilR = pos.r * 0.34;

      // Брова
      let browY = pos.y - pos.r - 10;
      let browRot = 0;
      if (emotion === 'surprised') browY -= 8;
      if (emotion === 'curious' && idx === 0) { browY -= 7; browRot = -12; }
      if (emotion === 'laugh') browRot = idx === 0 ? -8 : 8;

      return `

          <circle cx="${pos.x}" cy="${pos.y + 4}" r="${pos.r + 3}" fill="rgba(0,0,0,0.22)"/>

          <circle cx="${pos.x + sDx - irisR * 0.35}" cy="${pos.y + pupilDy - irisR * 0.35}" r="${pos.r * 0.22}" fill="#ffffff"/>

          <!-- Брова -->
          <path d="M ${pos.x - pos.r * 0.8},${browY} Q ${pos.x},${browY - 10} ${pos.x + pos.r * 0.8},${browY}"
                transform="rotate(${browRot}, ${pos.x}, ${browY})"
                stroke="#2b1608" stroke-width="5.5" stroke-linecap="round" fill="none"/>
        </g>`;
    }).join('');
  }

          <path d="M 314,245 Q 322,295 318,340" stroke="${colorObj.accent}" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.7"/>

          <!-- Основна частина штанів -->
          <path d="M 132,332 Q 250,346 368,332 L 358,432 C 350,458 292,462 272,448 L 250,398 L 228,448 C 208,462 150,458 142,432 Z"
                fill="url(#clothMainGrad)" stroke="${colorObj.dark}" stroke-width="4" stroke-linejoin="round"/>

          <!-- Відвороти штанин знизу -->
          <path d="M 140,425 Q 185,442 230,432 L 228,448 Q 182,458 142,438 Z" fill="${colorObj.accent}" stroke="${colorObj.dark}" stroke-width="2.5"/>
          <path d="M 270,432 Q 315,442 360,425 L 358,438 Q 318,458 272,448 Z" fill="${colorObj.accent}" stroke="${colorObj.dark}" stroke-width="2.5"/>

          <!-- Кишені та реалістичні складки тканини -->
          <path d="M 148,358 Q 175,380 198,358" stroke="${colorObj.dark}" stroke-width="3.5" fill="none"/>
          <path d="M 352,358 Q 325,380 302,358" stroke="${colorObj.dark}" stroke-width="3.5" fill="none"/>
          <path d="M 250,345 L 250,396" stroke="${colorObj.dark}" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M 190,395 Q 215,382 232,402 M 310,395 Q 285,382 268,402" stroke="${colorObj.dark}" stroke-width="2.5" opacity="0.55" fill="none"/>

          <!-- Шкіряний ремінь з металевою пряжкою -->
          <path d="M 131,330 Q 250,345 369,330 L 369,348 Q 250,363 131,348 Z" fill="#3d2210" stroke="#1f1006" stroke-width="2.5"/>
          <rect x="234" y="332" width="32" height="22" rx="5" fill="#ffd54f" stroke="#b28900" stroke-width="3"/>
          <rect x="241" y="337" width="18" height="12" rx="2" fill="#3d2210"/>

          <!-- Ґудзики на підтяжках -->
          <circle cx="182" cy="340" r="8" fill="#ffd54f" stroke="#8f6b00" stroke-width="2"/>
          <circle cx="318" cy="340" r="8" fill="#ffd54f" stroke="#8f6b00" stroke-width="2"/>

          <!-- Стильний метелик на шиї в колір одягу -->
          <g transform="translate(250, 266)">
            <path d="M -34,-16 L 0,0 L -34,16 Q -40,0 -34,-16 Z" fill="url(#clothMainGrad)" stroke="${colorObj.dark}" stroke-width="2.5"/>
            <path d="M 34,-16 L 0,0 L 34,16 Q 40,0 34,-16 Z" fill="url(#clothMainGrad)" stroke="${colorObj.dark}" stroke-width="2.5"/>
            <circle cx="0" cy="0" r="8" fill="${colorObj.accent}" stroke="${colorObj.dark}" stroke-width="2"/>
          </g>
        </g>`;
    } else {
      // Реалістична пишна сукня з ліфом, складками, мереживом, поясом та бантиком на голові
      return `
        <g id="monster-clothes">
          <defs>
            <linearGradient id="dressTopGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${colorObj.light}"/>
              <stop offset="55%" stop-color="${colorObj.main}"/>
              <stop offset="100%" stop-color="${colorObj.dark}"/>
            </linearGradient>
            <linearGradient id="dressSkirtGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${colorObj.light}"/>
              <stop offset="45%" stop-color="${colorObj.main}"/>
              <stop offset="100%" stop-color="${colorObj.dark}"/>
            </linearGradient>
          </defs>

          <!-- Верх сукні (ліф з бретелями та крильцями-рукавчиками) -->
          <path d="M 162,258 Q 140,268 148,292 Q 168,288 178,275 Z" fill="${colorObj.accent}" stroke="${colorObj.dark}" stroke-width="2.5"/>
          <path d="M 338,258 Q 360,268 352,292 Q 332,288 322,275 Z" fill="${colorObj.accent}" stroke="${colorObj.dark}" stroke-width="2.5"/>
          <path d="M 172,258 Q 250,278 328,258 L 342,328 Q 250,342 158,328 Z"
                fill="url(#dressTopGrad)" stroke="${colorObj.dark}" stroke-width="3.5" stroke-linejoin="round"/>

          <!-- Мереживна оборка знизу спідниці -->
          <path d="M 105,432 Q 125,454 148,436 Q 172,458 198,438 Q 225,460 250,440 Q 275,460 302,438 Q 328,458 352,436 Q 375,454 395,432 L 385,415 L 115,415 Z"
                fill="#ffffff" stroke="#d0d7de" stroke-width="2.5"/>

          <!-- Пишна спідниця зі складками -->
          <path d="M 155,326 Q 250,340 345,326 L 398,426 Q 250,456 102,426 Z"
                fill="url(#dressSkirtGrad)" stroke="${colorObj.dark}" stroke-width="4" stroke-linejoin="round"/>

          <!-- Об'ємні складки на спідниці -->
          <path d="M 192,334 L 152,430 M 228,338 L 210,438 M 272,338 L 290,438 M 308,334 L 348,430"
                stroke="${colorObj.dark}" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
          <path d="M 205,336 L 178,432 M 250,340 L 250,440 M 295,336 L 322,432"
                stroke="${colorObj.accent}" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

          <!-- Шовковий поясок з бантом на талії -->
          <path d="M 154,320 Q 250,336 346,320 L 348,336 Q 250,352 152,336 Z" fill="${colorObj.accent}" stroke="${colorObj.dark}" stroke-width="2.5"/>
          <circle cx="250" cy="332" r="9" fill="#fff59d" stroke="${colorObj.dark}" stroke-width="2"/>

          <!-- Святковий бантик на маківці -->
          <g transform="translate(250, 106)">
            <path d="M -42,-18 C -58,-30 -58,24 -42,14 L 0,0 Z" fill="url(#dressTopGrad)" stroke="${colorObj.dark}" stroke-width="3"/>
            <path d="M 42,-18 C 58,-30 58,24 42,14 L 0,0 Z" fill="url(#dressTopGrad)" stroke="${colorObj.dark}" stroke-width="3"/>
            <circle cx="0" cy="0" r="10" fill="${colorObj.accent}" stroke="${colorObj.dark}" stroke-width="2.5"/>
          </g>
        </g>`;
    }
  }

  function renderMonster() {
    if (!currentMonster) return;
    const { palette, bodyShape, headFeature, eyeCount, patternType, emotion } = currentMonster;
    const paths = getBodyPath(bodyShape);

    monsterSvg.innerHTML = `
      <defs>
        <!-- 3D градієнт хутра/шкіри -->
        <radialGradient id="furGrad" cx="0.38" cy="0.28" r="0.68">
          <stop offset="0%" stop-color="${palette.light}"/>
          <stop offset="58%" stop-color="${palette.main}"/>
          <stop offset="100%" stop-color="${palette.dark}"/>
        </radialGradient>
        <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${palette.main}"/>
          <stop offset="100%" stop-color="${palette.dark}"/>
        </linearGradient>
        <radialGradient id="bellyGrad" cx="0.5" cy="0.4" r="0.6">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="40%" stop-color="${palette.belly}"/>
          <stop offset="100%" stop-color="${palette.light}"/>
        </radialGradient>
        <linearGradient id="hornGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fffdf5"/>
          <stop offset="60%" stop-color="${palette.horn}"/>
          <stop offset="100%" stop-color="#8c673a"/>
        </linearGradient>
        <radialGradient id="eyeScleraGrad" cx="0.35" cy="0.3" r="0.7">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="75%" stop-color="#f2f6fa"/>
          <stop offset="100%" stop-color="#c3ced9"/>
        </radialGradient>
        <radialGradient id="irisGrad" cx="0.4" cy="0.4" r="0.6">
          <stop offset="0%" stop-color="#70e1f5"/>
          <stop offset="65%" stop-color="#1e62d0"/>
          <stop offset="100%" stop-color="#092047"/>
        </radialGradient>
      </defs>

      <!-- Тінь монстрика на сцені -->
      <ellipse cx="250" cy="495" rx="135" ry="26" fill="rgba(0,0,0,0.38)"/>

      <!-- Задні лапки / ніжки з кігтиками -->
      <g id="monster-legs">
        <!-- Ліва ніжка -->
        <path d="M 168,415 C 155,455 142,488 165,495 C 195,502 222,492 218,465 L 215,420 Z"
              fill="url(#furGrad)" stroke="url(#furDark)" stroke-width="3.5"/>
        <circle cx="158" cy="490" r="8" fill="url(#hornGrad)" stroke="#5c3d1e" stroke-width="1.5"/>
        <circle cx="176" cy="494" r="8.5" fill="url(#hornGrad)" stroke="#5c3d1e" stroke-width="1.5"/>
        <circle cx="195" cy="492" r="8" fill="url(#hornGrad)" stroke="#5c3d1e" stroke-width="1.5"/>

        <!-- Права ніжка -->
        <path d="M 332,415 C 345,455 358,488 335,495 C 305,502 278,492 282,465 L 285,420 Z"
              fill="url(#furGrad)" stroke="url(#furDark)" stroke-width="3.5"/>
        <circle cx="305" cy="492" r="8" fill="url(#hornGrad)" stroke="#5c3d1e" stroke-width="1.5"/>
        <circle cx="324" cy="494" r="8.5" fill="url(#hornGrad)" stroke="#5c3d1e" stroke-width="1.5"/>
        <circle cx="342" cy="490" r="8" fill="url(#hornGrad)" stroke="#5c3d1e" stroke-width="1.5"/>
      </g>

      <!-- Ріжки або вушка -->
      ${renderHeadFeature(headFeature)}

      <!-- Ручки (позаду тіла) -->
      <path d="${paths.leftArm}" fill="url(#furGrad)" stroke="url(#furDark)" stroke-width="4" stroke-linecap="round"/>
      <path d="${paths.rightArm}" fill="url(#furGrad)" stroke="url(#furDark)" stroke-width="4" stroke-linecap="round"/>

      <!-- Основне тіло монстрика -->
      <path d="${paths.body}" fill="url(#furGrad)" stroke="url(#furDark)" stroke-width="4"/>

      <!-- Животик -->
      <path d="${paths.belly}" fill="url(#bellyGrad)" opacity="0.88"/>

      <!-- Візерунок на хутрі -->
      ${renderPattern(patternType)}

      <!-- Рум'янець на щічках -->
      <ellipse cx="172" cy="212" rx="18" ry="10" fill="#ff6b8b" opacity="0.38"/>
      <ellipse cx="328" cy="212" rx="18" ry="10" fill="#ff6b8b" opacity="0.38"/>

      <!-- Одяг (якщо обрано) -->
      ${renderClothing(selectedGender, selectedColor)}

      <!-- Очі та вираз обличчя -->
      <g id="monster-face">
        ${renderEyes(eyeCount, emotion)}
        ${renderMouth(emotion)}
      </g>
    `;
  }

  // --- Постійна зміна емоцій монстрика ---
  const EMOTIONS = ['happy', 'laugh', 'surprised', 'wink', 'curious', 'silly', 'blink'];

  function startEmotionCycle() {
    if (emotionTimer) clearInterval(emotionTimer);
    emotionTimer = setInterval(() => {
      if (!currentMonster) return;
      const nextEmotion = EMOTIONS[Math.floor(Math.random() * EMOTIONS.length)];
      currentMonster.emotion = nextEmotion;
      renderMonster();
      if (Math.random() < 0.45) {
        playEmotionSound(nextEmotion);
      }
      // Якщо кліпнув очима, через 220мс відкриваємо очі назад
      if (nextEmotion === 'blink') {
        setTimeout(() => {
          if (currentMonster && currentMonster.emotion === 'blink') {
            currentMonster.emotion = 'happy';
            renderMonster();
          }
        }, 220);
      }
    }, 1700);
  }

  // --- Одягання та запуск танцю ---
  function applyClothingAndDance() {
    if (!selectedGender || !selectedColor) return;

    // Святкова емоція при переодяганні
    currentMonster.emotion = Math.random() > 0.5 ? 'laugh' : 'silly';
    renderMonster();

    // Вибух конфеті та зірочок навколо монстрика
    spawnSparkleBurst();

    // Обираємо випадковий танець та мелодію (уникаючи повторення попереднього)
    const danceIdx = Math.floor(Math.random() * 5) + 1;
    const melodyIdx = Math.floor(Math.random() * MELODIES.length);

    monsterSvg.className.baseVal = '';
    void monsterSvg.offsetWidth; // примусовий рефлоу для перезапуску анімації
    monsterSvg.classList.add(`dance-${danceIdx}`);
    isDancing = true;

    if (danceTimeout) clearTimeout(danceTimeout);
    const duration = playDanceMelody(melodyIdx);

    danceTimeout = setTimeout(() => {
      monsterSvg.className.baseVal = '';
      isDancing = false;
      // Після завершення танцю автоматично виходить новий монстрик!
      spawnNewMonster(true);
    }, duration + 350);
  }

  // --- Поява нового монстрика ---
  function spawnNewMonster(withEntrance = true) {
    stopCurrentMelody();
    if (danceTimeout) clearTimeout(danceTimeout);
    isDancing = false;
    monsterSvg.className.baseVal = '';

    // Скидаємо вибір одягу для нового монстрика
    selectedGender = null;
    selectedColor = null;
    btnBoy.classList.remove('active');
    btnGirl.classList.remove('active');
    document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));

    currentMonster = generateMonsterConfig();
    renderMonster();

    if (withEntrance) {
      playAppearSound();
      spawnSparkleBurst(22);
      monsterSvg.animate([
        { transform: 'scale(0.2) translateY(180px)', opacity: 0 },
        { transform: 'scale(1.08) translateY(-18px)', opacity: 1, offset: 0.7 },
        { transform: 'scale(1) translateY(0)', opacity: 1 }
      ], { duration: 520, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)' });
    }
  }

  // Кнопка "Далі" (одразу без проходження переходимо на наступного монстрика)
  nextBtn.addEventListener('click', () => {
    spawnNewMonster(true);
  });

  // Клік по самому монстрику викликає кумедну емоцію та звук
  monsterSvg.style.cursor = 'pointer';
  monsterSvg.addEventListener('click', () => {
    if (!currentMonster) return;
    const funEmotions = ['laugh', 'surprised', 'silly', 'wink'];
    currentMonster.emotion = funEmotions[Math.floor(Math.random() * funEmotions.length)];
    renderMonster();
    playPopSound(620);
    monsterSvg.animate([
      { transform: 'scale(1, 1)' },
      { transform: 'scale(1.12, 0.88)' },
      { transform: 'scale(0.94, 1.06)' },
      { transform: 'scale(1, 1)' }
    ], { duration: 380, easing: 'ease-out' });
  });

  // --- Система живих фонових частинок та ефектів (Canvas) ---
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Фонові світлячки / кульбабки
  const fireflies = Array.from({ length: 28 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 2 + Math.random() * 4,
    vx: (Math.random() - 0.5) * 0.6,
    vy: -0.2 - Math.random() * 0.5,
    alpha: Math.random(),
    dAlpha: 0.008 + Math.random() * 0.015
  }));

  // Святкові іскри та музичні ноти
  const particles = [];

  function spawnSparkleBurst(count = 42) {
    const cx = W * 0.5;
    const cy = H * 0.52;
    const palette = ['#ffe66d', '#ff6b6b', '#4ecdc4', '#a8e6cf', '#ff8b94', '#c7ceea'];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 9;
      particles.push({
        type: 'star',
        x: cx + (Math.random() - 0.5) * 90,
        y: cy + (Math.random() - 0.5) * 90,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 6 + Math.random() * 10,
        color: palette[Math.floor(Math.random() * palette.length)],
        alpha: 1,
        rot: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.15
      });
    }
  }

  function spawnMusicNote() {
    const cx = W * 0.5 + (Math.random() - 0.5) * 260;
    const cy = H * 0.38 + (Math.random() - 0.5) * 80;
    const colors = ['#ffea79', '#ff7eb3', '#7afcff', '#a8ff78'];
    particles.push({
      type: 'note',
      x: cx,
      y: cy,
      vx: (Math.random() - 0.5) * 2.2,
      vy: -2.2 - Math.random() * 2,
      size: 14 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1
    });
  }

  function drawStar(x, y, radius, rot, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * radius,
                 -Math.sin((18 + i * 72) * Math.PI / 180) * radius);
      ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (radius * 0.45),
                 -Math.sin((54 + i * 72) * Math.PI / 180) * (radius * 0.45));
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawMusicalNote(x, y, size, color, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    // голівка ноти
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.45, size * 0.32, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // штиль
    ctx.beginPath();
    ctx.moveTo(size * 0.35, 0);
    ctx.lineTo(size * 0.35, -size * 1.2);
    ctx.lineTo(size * 0.85, -size * 0.9);
    ctx.stroke();
    ctx.restore();
  }

  function animateCanvas() {
    ctx.clearRect(0, 0, W, H);

    // Живі світлячки
    fireflies.forEach(f => {
      f.x += f.vx;
      f.y += f.vy;
      f.alpha += f.dAlpha;
      if (f.alpha > 0.9 || f.alpha < 0.15) f.dAlpha *= -1;
      if (f.y < -10) f.y = H + 10;
      if (f.x < -10) f.x = W + 10;
      if (f.x > W + 10) f.x = -10;

      ctx.save();
      ctx.globalAlpha = Math.max(0.1, Math.min(0.9, f.alpha));
      const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 3);
      grad.addColorStop(0, '#fff9c4');
      grad.addColorStop(0.5, 'rgba(212, 255, 130, 0.6)');
      grad.addColorStop(1, 'rgba(212, 255, 130, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Активні ефекти (іскри, ноти)
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.type === 'star') {
        p.vy += 0.18;
        p.rot += p.vRot;
        p.alpha -= 0.022;
        drawStar(p.x, p.y, p.size, p.rot, p.color, p.alpha);
      } else {
        p.alpha -= 0.018;
        drawMusicalNote(p.x, p.y, p.size, p.color, p.alpha);
      }
      if (p.alpha <= 0) {
        particles.splice(i, 1);
      }
    }

    requestAnimationFrame(animateCanvas);
  }

  // Старт гри
  spawnNewMonster(false);
  startEmotionCycle();
  animateCanvas();
})();
</script>
</body>
