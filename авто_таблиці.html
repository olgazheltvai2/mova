<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workshop Syllable Cipher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Russo+One&display=swap');

    :root {
      --metal-dark: #141923;
      --metal-mid: #232b3a;
      --metal-light: #38455c;
      --neon-cyan: #00f0ff;
      --neon-amber: #ffaa00;
      --neon-green: #00ff88;
      --neon-red: #ff2a55;
      --tool-red: #b91c1c;
      --tool-red-dark: #7f1d1d;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d1117;
      font-family: 'Montserrat', sans-serif;
    }

    /* Custom industrial metallic patterns - NO WHITE RECTANGLES ANYWHERE */
    .carbon-panel {
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.08), transparent 55%),
        repeating-linear-gradient(
          45deg,
          #161c28 0px,
          #161c28 4px,
          #1d2536 4px,
          #1d2536 8px
        );
      border: 3px solid #3b4963;
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.7),
        inset 0 2px 4px rgba(255, 255, 255, 0.15),
        inset 0 -4px 8px rgba(0, 0, 0, 0.6);
    }

    .diamond-plate {
      background-color: #1c2433;
      background-image:
        radial-gradient(#334155 15%, transparent 16%),
        radial-gradient(#334155 15%, transparent 16%);
      background-size: 18px 18px;
      background-position: 0 0, 9px 9px;
      border: 3px solid #475569;
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.65),
        inset 0 2px 5px rgba(255, 255, 255, 0.18);
    }

    .hazard-trim {
      background: repeating-linear-gradient(
        -45deg,
        #f59e0b,
        #f59e0b 14px,
        #1e293b 14px,
        #1e293b 28px
      );
    }

    /* Tool Cabinet Styling for the Coordinate Matrix */
    .tool-cabinet {
      background:
        linear-gradient(145deg, #991b1b 0%, #7f1d1d 45%, #450a0a 100%);
      border: 4px solid #f87171;
      border-bottom-color: #450a0a;
      border-right-color: #450a0a;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.85),
        inset 0 3px 6px rgba(255, 255, 255, 0.28),
        inset 0 -6px 14px rgba(0, 0, 0, 0.65);
      position: relative;
    }

    .cabinet-inner-recess {
      background:
        repeating-linear-gradient(
          90deg,
          #0f172a 0px,
          #0f172a 6px,
          #162032 6px,
          #162032 12px
        );
      border: 3px solid #334155;
      box-shadow: inset 0 8px 20px rgba(0, 0, 0, 0.9);
    }

    /* Column & Row Coordinate Header Plates */
    .coord-header-plate {
      background: linear-gradient(180deg, #334155 0%, #1e293b 55%, #0f172a 100%);
      border: 2px solid #64748b;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.6),
        inset 0 2px 2px rgba(255, 255, 255, 0.25);
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      font-family: 'Russo One', sans-serif;
      position: relative;
    }

    .coord-header-plate.highlight-axis {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 60%, #92400e 100%);
      border-color: #fde68a;
      color: #0f172a;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.85), inset 0 2px 3px rgba(255, 255, 255, 0.6);
    }

    /* Syllable Matrix Drawer Cells */
    .syllable-cell {
      background:
        linear-gradient(165deg, #3b485e 0%, #252f42 50%, #182030 100%);
      border: 3px solid #64748b;
      border-bottom: 5px solid #0f172a;
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.65),
        inset 0 2px 3px rgba(255, 255, 255, 0.25),
        inset 0 -3px 6px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.14s ease,
                  border-color 0.14s ease,
                  background 0.14s ease;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .syllable-cell::before {
      content: '';
      position: absolute;
      top: 5px;
      left: 12%;
      right: 12%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.55), transparent);
      pointer-events: none;
    }

    .syllable-cell:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: #38bdf8;
      background: linear-gradient(165deg, #475569 0%, #2d3b52 50%, #1e293b 100%);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.75),
        0 0 16px rgba(56, 189, 248, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 0.35);
    }

    .syllable-cell:active {
      transform: translateY(2px) scale(0.97);
    }

    .syllable-cell.cell-used {
      background: linear-gradient(165deg, #064e3b 0%, #065f46 50%, #022c22 100%);
      border-color: #10b981;
      color: #a7f3d0;
      box-shadow:
        0 0 18px rgba(16, 185, 129, 0.45),
        inset 0 2px 5px rgba(255, 255, 255, 0.25);
    }

    .syllable-cell.cell-wrong {
      animation: wrongShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      background: linear-gradient(165deg, #991b1b 0%, #7f1d1d 50%, #450a0a 100%) !important;
      border-color: #ff2a55 !important;
      box-shadow: 0 0 24px rgba(255, 42, 85, 0.85) !important;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px) rotate(-2deg); }
      40% { transform: translateX(9px) rotate(2deg); }
      60% { transform: translateX(-7px) rotate(-1deg); }
      80% { transform: translateX(7px) rotate(1deg); }
    }

    /* Key Cipher Slots (Top Assembly Bay) */
    .cipher-slot {
      background:
        radial-gradient(circle at 50% 25%, #273549 0%, #131c29 85%);
      border: 3px solid #475569;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.7),
        inset 0 2px 6px rgba(255, 255, 255, 0.15),
        inset 0 -4px 8px rgba(0, 0, 0, 0.8);
      transition: all 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      cursor: pointer;
    }

    .cipher-slot.slot-active {
      border-color: #ffaa00;
      background:
        radial-gradient(circle at 50% 25%, #3b2f1e 0%, #1c1610 90%);
      box-shadow:
        0 0 24px rgba(255, 170, 0, 0.75),
        inset 0 0 14px rgba(255, 170, 0, 0.35);
      animation: pulseActiveSlot 1.4s infinite ease-in-out;
    }

    @keyframes pulseActiveSlot {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255, 170, 0, 0.65), inset 0 0 12px rgba(255, 170, 0, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 32px rgba(255, 200, 0, 0.95), inset 0 0 20px rgba(255, 180, 0, 0.5);
      }
    }

    .cipher-slot.slot-solved {
      background:
        linear-gradient(180deg, #0f766e 0%, #115e59 50%, #042f2e 100%);
      border-color: #2dd4bf;
      box-shadow:
        0 0 22px rgba(45, 212, 191, 0.6),
        inset 0 2px 5px rgba(255, 255, 255, 0.35);
      cursor: default;
    }

    /* Completed united word state with vertical syllable division bars */
    .word-united .cipher-slot.slot-solved {
      background:
        linear-gradient(180deg, #0284c7 0%, #0369a1 50%, #0c4a6e 100%);
      border-color: #38bdf8;
      border-radius: 8px;
      box-shadow:
        0 0 30px rgba(56, 189, 248, 0.8),
        inset 0 3px 6px rgba(255, 255, 255, 0.45);
      transform: scale(1.05);
    }

    /* Connector between slots: '+' initially, transforms into vertical bar '|' on completion */
    .slot-connector {
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Corner Rivets */
    .rivet {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #cbd5e1, #475569 70%, #0f172a 100%);
      box-shadow: 0 1px 2px rgba(0,0,0,0.8);
      position: absolute;
      pointer-events: none;
    }

    /* Industrial Control Buttons */
    .mech-btn {
      background: linear-gradient(180deg, #334155 0%, #1e293b 55%, #0f172a 100%);
      border: 3px solid #64748b;
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.7),
        inset 0 2px 3px rgba(255, 255, 255, 0.25);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .mech-btn:hover {
      border-color: #38bdf8;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.8),
        0 0 16px rgba(56, 189, 248, 0.6),
        inset 0 2px 4px rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    .mech-btn:active {
      transform: translateY(2px);
    }

    .next-btn-special {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 55%, #b45309 100%);
      border: 3px solid #fde68a;
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.75),
        0 0 15px rgba(245, 158, 11, 0.45),
        inset 0 2px 4px rgba(255, 255, 255, 0.5);
    }

    .next-btn-special:hover {
      border-color: #ffffff;
      box-shadow:
        0 8px 24px rgba(245, 158, 11, 0.8),
        0 0 24px rgba(251, 191, 36, 0.85),
        inset 0 2px 4px rgba(255, 255, 255, 0.7);
    }

    /* Workshop Fan Spin */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .fan-blades {
      transform-origin: center;
      animation: spinSlow 4.5s linear infinite;
    }
    .fan-blades.fast {
      animation-duration: 0.55s;
    }

    /* Wheel spin strictly in place on the car axle (0,0 local coords) */
    @keyframes wheelSpinInPlace {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .car-wheel-spin {
      transform-origin: 0px 0px;
      animation: wheelSpinInPlace 0.16s linear infinite;
    }

    /* Suspension bounce on the car body */
    @keyframes suspensionBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-10px) rotate(-1.2deg); }
      50% { transform: translateY(4px) rotate(0.8deg); }
      75% { transform: translateY(-7px) rotate(-0.6deg); }
    }
    .car-suspension-bounce {
      transform-origin: 390px 350px;
      animation: suspensionBounce 0.45s ease-in-out infinite;
    }

    /* Gauge needle oscillation */
    @keyframes needleIdle {
      0%, 100% { transform: rotate(-28deg); }
      50% { transform: rotate(12deg); }
    }
    .gauge-needle {
      transform-origin: 50px 55px;
      animation: needleIdle 3.2s ease-in-out infinite;
      transition: transform 0.3s ease;
    }
    .gauge-needle.redline {
      animation: none !important;
      transform: rotate(75deg) !important;
    }

    /* Flying Syllable Plate Animation */
    .flying-plate {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0ea5e9, #0369a1);
      border: 3px solid #bae6fd;
      border-radius: 14px;
      color: #ffffff;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.95);
      transition: all 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- =========================================================================
       LAYER 1: SCENIC LIVING AUTO WORKSHOP BACKGROUND (SVG ARCHITECTURE)
       ========================================================================= -->
  <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" class="w-full h-full">
      <defs>
        <!-- Workshop Wall Gradient -->
        <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="55%" stop-color="#1e293b" />
          <stop offset="100%" stop-color="#111827" />
        </linearGradient>

        <!-- Steel Corrugated Wall Pattern -->
        <pattern id="corrugatedSteel" width="40" height="40" patternUnits="userSpaceOnUse">
          <rect width="40" height="40" fill="#182234" />
          <rect x="0" y="0" width="18" height="40" fill="#1e293b" />
          <line x1="18" y1="0" x2="18" y2="40" stroke="#0f172a" stroke-width="3" />
          <line x1="38" y1="0" x2="38" y2="40" stroke="#334155" stroke-width="1.5" />
        </pattern>

        <!-- Brick/Tile Lower Workshop Wall -->
        <pattern id="workshopTile" width="60" height="30" patternUnits="userSpaceOnUse">
          <rect width="60" height="30" fill="#162032" />
          <path d="M 60 0 L 0 0 0 30" fill="none" stroke="#0b111e" stroke-width="3" />
          <rect x="3" y="3" width="54" height="24" fill="#1e2b42" opacity="0.5" />
        </pattern>

        <!-- Checkered Garage Floor Pattern -->
        <pattern id="garageFloor" width="120" height="60" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
          <rect width="60" height="30" fill="#172030" />
          <rect x="60" y="0" width="60" height="30" fill="#222f46" />
          <rect x="0" y="30" width="60" height="30" fill="#222f46" />
          <rect x="60" y="30" width="60" height="30" fill="#172030" />
          <path d="M0 0 H120 M0 30 H120 M60 0 V60" stroke="#0d131f" stroke-width="2" />
        </pattern>

        <!-- Pegboard Pattern -->
        <pattern id="pegHoles" width="22" height="22" patternUnits="userSpaceOnUse">
          <rect width="22" height="22" fill="#111827" />
          <circle cx="11" cy="11" r="3" fill="#334155" />
        </pattern>

        <!-- Overhead Lamp Light Cone -->
        <linearGradient id="lampCone" x1="0.5" y1="0" x2="0.5" y2="1">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
          <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.10" />
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
        </linearGradient>

        <!-- Hazard Stripe Pattern -->
        <pattern id="hazardPattern" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="20" height="40" fill="#f59e0b" />
          <rect x="20" width="20" height="40" fill="#111827" />
        </pattern>
      </defs>

      <!-- Upper Corrugated Wall -->
      <rect x="0" y="0" width="1920" height="580" fill="url(#corrugatedSteel)" />

      <!-- Steel Girder Beams -->
      <g stroke="#0b0f19" stroke-width="4">
        <rect x="0" y="70" width="1920" height="28" fill="#1e293b" />
        <rect x="0" y="560" width="1920" height="22" fill="url(#hazardPattern)" />
        <!-- Structural Trusses -->
        <path d="M 100 0 L 180 70 L 260 0 L 340 70 L 420 0 L 500 70 L 580 0 L 660 70 L 740 0 L 820 70 L 900 0 L 980 70 L 1060 0 L 1140 70 L 1220 0 L 1300 70 L 1380 0 L 1460 70 L 1540 0 L 1620 70 L 1700 0 L 1780 70" fill="none" stroke="#334155" stroke-width="8" />
      </g>

      <!-- Lower Tiled Wall -->
      <rect x="0" y="582" width="1920" height="220" fill="url(#workshopTile)" />

      <!-- Ventilation Fans in Upper Left & Right Wall -->
      <g transform="translate(155, 220)">
        <circle cx="0" cy="0" r="76" fill="#0b0f19" stroke="#475569" stroke-width="10" />
        <circle cx="0" cy="0" r="66" fill="#111827" />
        <g id="fanBlades1" class="fan-blades">
          <path d="M -12 -58 L 12 -58 L 6 0 L -6 0 Z" fill="#64748b" />
          <path d="M -12 -58 L 12 -58 L 6 0 L -6 0 Z" fill="#64748b" transform="rotate(60)" />

          <path d="M -12 -58 L 12 -58 L 6 0 L -6 0 Z" fill="#64748b" transform="rotate(240)" />

        <!-- Protective Grill -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#334155" stroke-width="2.5" />
        <line x1="-70" y1="0" x2="70" y2="0" stroke="#334155" stroke-width="3" />
        <line x1="0" y1="-70" x2="0" y2="70" stroke="#334155" stroke-width="3" />
      </g>

      <!-- Industrial Pipes & Conduits on Wall -->

        <path d="M 0 375 H 255 V 620" stroke="#f87171" stroke-width="3" opacity="0.5" />
      </g>

      <!-- Tool Pegboard on Wall (Left-Center) -->
      <g transform="translate(340, 290)">
        <rect x="0" y="0" width="380" height="230" rx="12" fill="url(#pegHoles)" stroke="#475569" stroke-width="8" />
        <rect x="8" y="8" width="364" height="214" rx="8" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6" />
        <!-- Custom SVG Hanging Wrenches -->
        <g transform="translate(45, 32)" fill="#94a3b8" stroke="#0f172a" stroke-width="3">
          <path d="M 15 20 C 2 20 0 38 12 45 L 12 140 C 5 148 8 164 20 164 C 32 164 35 148 28 140 L 28 45 C 40 38 38 20 25 20 L 25 32 L 15 32 Z" />
          <path d="M 65 26 C 54 26 52 40 62 46 L 62 125 C 56 132 58 145 69 145 C 80 145 82 132 76 125 L 76 46 C 86 40 84 26 73 26 L 73 36 L 65 36 Z" />
        </g>
        <!-- Custom SVG Screwdrivers -->

          <rect x="10" y="0" width="22" height="58" rx="8" fill="#ef4444" stroke="#0f172a" stroke-width="3" />

        <!-- Hanging Decorative Gears on Pegboard -->
        <g id="pegGear1" transform="translate(305, 85)">

          </g>
        </g>
        <g id="pegGear2" transform="translate(275, 168)">
          <circle cx="0" cy="0" r="24" fill="#f59e0b" stroke="#0f172a" stroke-width="3" />
          <circle cx="0" cy="0" r="10" fill="#111827" />
        </g>
      </g>

      <!-- Dual Animated Pressure Gauges on Wall -->
      <g transform="translate(48, 430)">
        <!-- Gauge 1 -->
        <g transform="translate(0, 0)">
          <circle cx="50" cy="50" r="46" fill="#1e293b" stroke="#64748b" stroke-width="6" />
          <circle cx="50" cy="50" r="38" fill="#0f172a" />

          <g id="gaugeNeedle1" class="gauge-needle">

        <!-- Gauge 2 -->
        <g transform="translate(115, 0)">
          <circle cx="50" cy="50" r="46" fill="#1e293b" stroke="#64748b" stroke-width="6" />
          <circle cx="50" cy="50" r="38" fill="#0f172a" />
          <path d="M 22 68 A 32 32 0 1 1 78 68" fill="none" stroke="#38bdf8" stroke-width="6" />
          <path d="M 68 24 A 32 32 0 0 1 78 68" fill="none" stroke="#f59e0b" stroke-width="6" />
          <g id="gaugeNeedle2" class="gauge-needle" style="animation-delay: -1.4s;">
            <polygon points="47,55 53,55 50,18" fill="#ef4444" />
            <circle cx="50" cy="55" r="7" fill="#cbd5e1" />
          </g>
        </g>
      </g>

    /***************************************************************************
     * 2. SYNTHESIZED WEB AUDIO WORKSHOP SOUND ENGINE (Zero External Files)
     ***************************************************************************/
    class WorkshopAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Metallic ratchet click + rising chime when decoding a syllable
      playRatchetSuccess(stepIndex = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;

        // 1) Crisp mechanical ratchet clicks
        for (let i = 0; i < 3; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220 + i * 90, now + i * 0.035);
          osc.frequency.exponentialRampToValueAtTime(90, now + i * 0.035 + 0.03);

          gain.gain.setValueAtTime(0.18, now + i * 0.035);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.035 + 0.03);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.035);
          osc.stop(now + i * 0.035 + 0.032);
        }

        // 2) Harmonic synth tone rising with each syllable
        const notes = [440, 554.37, 659.25, 880];
        const freq = notes[stepIndex % notes.length];
        const bell = this.ctx.createOscillator();
        const bellGain = this.ctx.createGain();
        bell.type = 'sine';
        bell.frequency.setValueAtTime(freq, now + 0.06);
        bell.frequency.exponentialRampToValueAtTime(freq * 1.02, now + 0.35);

        bellGain.gain.setValueAtTime(0.25, now + 0.06);
        bellGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

        bell.connect(bellGain);
        bellGain.connect(this.ctx.destination);
        bell.start(now + 0.06);
        bell.stop(now + 0.4);
      }

      // Soft mechanical clunk when clicking wrong coordinate
      playWrongClunk() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(145, now);
        osc.frequency.linearRampToValueAtTime(75, now + 0.22);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }

      // Pneumatic air hiss for transitions & hydraulic lift
      playPneumaticHiss(duration = 0.35) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2400, now);
        filter.Q.setValueAtTime(1.8, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
        noise.stop(now + duration);
      }

      // Celebration 1: Turbo Engine Rev + Blow-off Hiss
      playCelebrationTurbo() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(65, now);
        osc1.frequency.exponentialRampToValueAtTime(220, now + 0.65);
        osc1.frequency.exponentialRampToValueAtTime(130, now + 0.9);
        osc1.frequency.exponentialRampToValueAtTime(290, now + 1.55);
        osc1.frequency.exponentialRampToValueAtTime(80, now + 2.0);

        osc2.frequency.setValueAtTime(130, now);
        osc2.frequency.exponentialRampToValueAtTime(440, now + 0.65);
        osc2.frequency.exponentialRampToValueAtTime(260, now + 0.9);
        osc2.frequency.exponentialRampToValueAtTime(580, now + 1.55);
        osc2.frequency.exponentialRampToValueAtTime(160, now + 2.0);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.setValueAtTime(0.24, now + 1.4);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.05);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 2.1);
        osc2.stop(now + 2.1);

        setTimeout(() => this.playPneumaticHiss(0.45), 1450);
      }

      // Celebration 2: Musical Car Horn Fanfare + Pneumatic Lift
      playCelebrationHornFanfare() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        this.playPneumaticHiss(0.5);
        const now = this.ctx.currentTime;
        const melody = [
          { f: 523.25, t: 0.0, d: 0.16 },
          { f: 659.25, t: 0.18, d: 0.16 },
          { f: 783.99, t: 0.36, d: 0.16 },
          { f: 1046.5, t: 0.56, d: 0.42 },
          { f: 783.99, t: 1.02, d: 0.16 },
          { f: 1046.5, t: 1.22, d: 0.55 }
        ];

        melody.forEach(n => {
          const oscA = this.ctx.createOscillator();
          const oscB = this.ctx.createOscillator();
          const g = this.ctx.createGain();

          oscA.type = 'sawtooth';
          oscB.type = 'square';
          oscA.frequency.setValueAtTime(n.f, now + n.t);
          oscB.frequency.setValueAtTime(n.f * 1.25, now + n.t);

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2200, now + n.t);

          g.gain.setValueAtTime(0.14, now + n.t);
          g.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);

          oscA.connect(filter);
          oscB.connect(filter);
          filter.connect(g);
          g.connect(this.ctx.destination);

          oscA.start(now + n.t);
          oscB.start(now + n.t);
          oscA.stop(now + n.t + n.d + 0.02);
          oscB.stop(now + n.t + n.d + 0.02);
        });
      }

      // Celebration 3: Electric Synth Arpeggio & Gear Ratchet Symphony
      playCelebrationGearSymphony() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const freqs = [392.00, 493.88, 587.33, 783.99, 987.77, 1174.66, 1567.98];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.12);

          gain.gain.setValueAtTime(0.22, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.45);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.48);
        });
      }
    }

    const audio = new WorkshopAudio();

    /***************************************************************************
     * 3. HTML5 CANVAS PARTICLE & CELEBRATION FX ENGINE
     *    (Welding Sparks, Spinning Nuts/Bolts, Smoke Puffs, Electric Arcs)
     ***************************************************************************/
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let electricArcTimer = 0;
    let activeArcTarget = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Ambient tiny workshop sparks
    function spawnAmbientSpark() {
      if (particles.length > 160) return;
      particles.push({
        type: 'spark',
        x: Math.random() * canvas.width * 0.45,
        y: canvas.height * (0.45 + Math.random() * 0.4),
        vx: (Math.random() - 0.5) * 2.2,
        vy: -Math.random() * 2.5 - 0.5,
        gravity: 0.08,
        size: Math.random() * 2.5 + 1,
        color: Math.random() > 0.4 ? '#ffaa00' : '#38bdf8',
        alpha: 0.85,
        decay: 0.018
      });
    }

    // Burst of bright welding sparks at (x, y)
    function spawnWeldingSparks(x, y, count = 36, palette = ['#fef08a', '#f59e0b', '#38bdf8', '#fb7185']) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 11 + 3;
        particles.push({
          type: 'spark',
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          gravity: 0.28,
          size: Math.random() * 4 + 2,
          color: palette[Math.floor(Math.random() * palette.length)],
          alpha: 1,
          decay: Math.random() * 0.02 + 0.014
        });
      }
    }

    // Puff of dark exhaust/wrong-click smoke
    function spawnSmokePuff(x, y, count = 14) {
      for (let i = 0; i < count; i++) {
        particles.push({
          type: 'smoke',
          x: x + (Math.random() - 0.5) * 24,
          y: y + (Math.random() - 0.5) * 24,
          vx: (Math.random() - 0.5) * 3,
          vy: -Math.random() * 2.5 - 1,
          radius: Math.random() * 14 + 10,
          alpha: 0.65,
          decay: 0.022
        });
      }
    }

    // Burst of 4-point light sparkles (no wheel-like shapes ever fly!)
    function spawnSparkleBurst(x, y, count = 24) {
      const colors = ['#38bdf8', '#f59e0b', '#10b981', '#fef08a'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 11 + 3;
        particles.push({
          type: 'star',
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          gravity: 0.2,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.18,
          size: Math.random() * 9 + 7,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: 0.015
        });
      }
    }

    function drawFourPointSparkle(ctx, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const r = i % 2 === 0 ? size : size * 0.35;
        const a = (i * Math.PI) / 4;
        const px = Math.cos(a) * r;
        const py = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }

    function drawElectricArcs(rect) {
      const corners = [
        { x: rect.left, y: rect.top },
        { x: rect.right, y: rect.top },
        { x: rect.right, y: rect.bottom },
        { x: rect.left, y: rect.bottom }
      ];
      ctx.save();
      ctx.strokeStyle = '#38bdf8';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 16;
      ctx.lineWidth = 3;

      for (let c = 0; c < corners.length; c++) {
        const start = corners[c];
        const end = corners[(c + 1) % corners.length];
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        const steps = 8;
        for (let s = 1; s < steps; s++) {
          const t = s / steps;
          const mx = start.x + (end.x - start.x) * t + (Math.random() - 0.5) * 18;
          const my = start.y + (end.y - start.y) * t + (Math.random() - 0.5) * 18;
          ctx.lineTo(mx, my);
        }
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.25) {
        spawnAmbientSpark();
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.gravity) p.vy += p.gravity;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);

        if (p.type === 'spark') {
          ctx.strokeStyle = p.color;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.lineWidth = p.size;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 1.6, p.y - p.vy * 1.6);
          ctx.stroke();
        } else if (p.type === 'smoke') {
          p.radius += 0.4;
          ctx.fillStyle = '#475569';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'star') {
          p.rot += p.vRot;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          drawFourPointSparkle(ctx, p.size, p.color);
        }

        ctx.restore();
      }

      if (electricArcTimer > 0 && activeArcTarget) {
        electricArcTimer--;
        const rect = activeArcTarget.getBoundingClientRect();
        drawElectricArcs(rect);
      }

      requestAnimationFrame(animateCanvas);
    }

    /***************************************************************************
     * 4. CORE GAME STATE & ROUND GENERATOR
     ***************************************************************************/
    let currentLang = 'UA';
    let lastWordKey = '';
    let currentWordSyllables = [];
    let targetSlots = []; // [{ coord: 'Б2', syllable: 'МА', solved: false }, ...]
    let activeSlotIndex = 0;

    const cipherSlotsRow = document.getElementById('cipherSlotsRow');
    const cipherBayContainer = document.getElementById('cipherBayContainer');
    const cellButtons = Array.from(document.querySelectorAll('.syllable-cell'));

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function highlightActiveAxes() {
      // Clear previous axis highlights
      ROWS.forEach(r => {
        const el = document.getElementById(`rowHeader-${r}`);
        if (el) el.classList.remove('highlight-axis');
      });
      COLS.forEach(c => {
        const el = document.getElementById(`colHeader-${c}`);
        if (el) el.classList.remove('highlight-axis');
      });

      const activeSlot = targetSlots[activeSlotIndex];
      if (!activeSlot || activeSlot.solved) return;

      const rowChar = activeSlot.coord[0];
      const colChar = activeSlot.coord[1];
      const rEl = document.getElementById(`rowHeader-${rowChar}`);
      const cEl = document.getElementById(`colHeader-${colChar}`);
      if (rEl) rEl.classList.add('highlight-axis');
      if (cEl) cEl.classList.add('highlight-axis');
    }

    function renderCipherSlots(isUnited = false) {
      cipherSlotsRow.innerHTML = '';
      if (isUnited) {
        cipherBayContainer.classList.add('word-united');
      } else {
        cipherBayContainer.classList.remove('word-united');
      }

      targetSlots.forEach((slot, idx) => {
        // Create Slot Plate
        const slotEl = document.createElement('button');
        slotEl.type = 'button';
        slotEl.id = `cipher-slot-${idx}`;
        slotEl.className = `cipher-slot h-14 sm:h-20 px-4 sm:px-7 rounded-2xl flex items-center justify-center min-w-[82px] sm:min-w-[126px] ${
          slot.solved
            ? 'slot-solved'
            : idx === activeSlotIndex
            ? 'slot-active'
            : ''
        }`;

        // Corner rivets inside slot
        slotEl.innerHTML = `
          <span class="rivet top-1.5 left-1.5"></span>
          <span class="rivet top-1.5 right-1.5"></span>
          <span class="rivet bottom-1.5 left-1.5"></span>
          <span class="rivet bottom-1.5 right-1.5"></span>
          <span class="font-black tracking-wider text-white drop-shadow-[0_3px_4px_rgba(0,0,0,0.85)]"
                style="font-size: clamp(26px, 3.3vw, 50px); font-family: ${slot.solved ? "'Montserrat', sans-serif" : "'Russo One', sans-serif"}; color: ${slot.solved ? '#ffffff' : idx === activeSlotIndex ? '#ffaa00' : '#94a3b8'};">
            ${slot.solved ? slot.syllable : slot.coord}
          </span>
        `;

        // Allow clicking an unrevealed slot to focus it
        slotEl.addEventListener('click', () => {
          if (roundLocked || slot.solved) return;
          activeSlotIndex = idx;
          audio.playRatchetSuccess(0);
          renderCipherSlots(false);
          highlightActiveAxes();
        });

        cipherSlotsRow.appendChild(slotEl);

        // Connector between slots: '+' while decoding, vertical bar '|' when word is united
        if (idx < targetSlots.length - 1) {
          const conn = document.createElement('div');
          conn.className = 'slot-connector flex items-center justify-center px-0.5 sm:px-1';
          if (isUnited) {
            // Vertical Syllable Division Bar ("вертикальні риски")
            conn.innerHTML = `
              <div class="w-2 sm:w-2.5 h-12 sm:h-16 rounded-full bg-amber-400 shadow-[0_0_16px_#f59e0b]"></div>
            `;
          } else {
            conn.innerHTML = `
              <svg viewBox="0 0 32 32" class="w-6 h-6 sm:w-8 sm:h-8">
                <path d="M16 5 V27 M5 16 H27" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
              </svg>
            `;
          }
          cipherSlotsRow.appendChild(conn);
        }
      });
    }

    function generateNewRound() {
      if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
        autoAdvanceTimeout = null;
      }
      roundLocked = false;
      resetWorkshopStage();

      const bank = WORD_BANKS[currentLang];
      let chosenSyllables = bank[Math.floor(Math.random() * bank.length)];
      while (chosenSyllables.join('-') === lastWordKey && bank.length > 1) {
        chosenSyllables = bank[Math.floor(Math.random() * bank.length)];
      }
      lastWordKey = chosenSyllables.join('-');
      currentWordSyllables = [...chosenSyllables];

      // Pick unique coordinates for each syllable of the target noun
      const shuffledCoords = shuffleArray(ALL_COORDS);
      targetSlots = currentWordSyllables.map((syl, i) => ({
        coord: shuffledCoords[i],
        syllable: syl,
        solved: false
      }));
      activeSlotIndex = 0;

      // Gather distractor syllables from other words + extra syllable pool
      const allBankSyllables = bank.flat().concat(EXTRA_SYLLABLES[currentLang]);
      const usedSyllables = new Set(currentWordSyllables);
      const distractorPool = shuffleArray(
        allBankSyllables.filter(s => !usedSyllables.has(s))
      );

      gridMap = {};
      targetSlots.forEach(slot => {
        gridMap[slot.coord] = slot.syllable;
      });

      let dIdx = 0;
      ALL_COORDS.forEach(coord => {
        if (!gridMap[coord]) {
          // Ensure unique distractors where possible
          while (dIdx < distractorPool.length && usedSyllables.has(distractorPool[dIdx])) {
            dIdx++;
          }
          const syl = distractorPool[dIdx] || EXTRA_SYLLABLES[currentLang][dIdx % EXTRA_SYLLABLES[currentLang].length];
          usedSyllables.add(syl);
          gridMap[coord] = syl;
          dIdx++;
        }
      });

      // Render 3x4 Coordinate Table Cells
      cellButtons.forEach(btn => {
        const coord = btn.getAttribute('data-coord');
        const syl = gridMap[coord];
        btn.classList.remove('cell-used', 'cell-wrong');
        btn.innerHTML = `
          <span class="rivet top-1.5 left-1.5"></span>
          <span class="rivet top-1.5 right-1.5"></span>
          <span class="rivet bottom-1.5 left-1.5"></span>
          <span class="rivet bottom-1.5 right-1.5"></span>
          <span class="pointer-events-none select-none" style="font-size: clamp(26px, 3.2vw, 48px);">
            ${syl}
          </span>
        `;
      });

      // Rotate corner gear for visual polish
      gearAngle += 90;
      const cornerGear = document.getElementById('matrixCornerGear');
      if (cornerGear) {
        cornerGear.style.transform = `rotate(${gearAngle}deg)`;
      }

      renderCipherSlots(false);
      highlightActiveAxes();
    }

    /***************************************************************************
     * 5. INTERACTION & FLYING SYLLABLE ANIMATION
     ***************************************************************************/
    function animateFlyingPlate(fromEl, toEl, text, onComplete) {
      const fromRect = fromEl.getBoundingClientRect();
      const toRect = toEl.getBoundingClientRect();

      const flyer = document.createElement('div');
      flyer.className = 'flying-plate';
      flyer.style.width = `${fromRect.width}px`;
      flyer.style.height = `${fromRect.height}px`;
      flyer.style.left = `${fromRect.left}px`;
      flyer.style.top = `${fromRect.top}px`;
      flyer.style.fontSize = 'clamp(26px, 3.2vw, 46px)';
      flyer.textContent = text;
      document.body.appendChild(flyer);

      // Trigger reflow & animate to target slot
      requestAnimationFrame(() => {
        flyer.style.left = `${toRect.left}px`;
        flyer.style.top = `${toRect.top}px`;
        flyer.style.width = `${toRect.width}px`;
        flyer.style.height = `${toRect.height}px`;
        flyer.style.transform = 'scale(1.08)';
      });

      setTimeout(() => {
        flyer.remove();
        if (onComplete) onComplete();
      }, 390);
    }

    function handleCellClick(btn) {
      if (roundLocked) return;

      const clickedCoord = btn.getAttribute('data-coord');
      const btnRect = btn.getBoundingClientRect();
      const centerX = btnRect.left + btnRect.width / 2;
      const centerY = btnRect.top + btnRect.height / 2;

      // Check if clickedCoord matches the currently active slot first, or any unrevealed slot
      let matchedIndex = -1;
      if (
        targetSlots[activeSlotIndex] &&
        !targetSlots[activeSlotIndex].solved &&
        targetSlots[activeSlotIndex].coord === clickedCoord
      ) {
        matchedIndex = activeSlotIndex;
      } else {
        matchedIndex = targetSlots.findIndex(
          s => !s.solved && s.coord === clickedCoord
        );
      }

      if (matchedIndex !== -1) {
        // Correct coordinate!
        const solvedCount = targetSlots.filter(s => s.solved).length;
        audio.playRatchetSuccess(solvedCount);
        spawnWeldingSparks(centerX, centerY, 28);

        btn.classList.add('cell-used');
        targetSlots[matchedIndex].solved = true;

        // Advance activeSlotIndex to next unsolved slot
        const nextUnsolved = targetSlots.findIndex(s => !s.solved);
        if (nextUnsolved !== -1) {
          activeSlotIndex = nextUnsolved;
        }

        const slotDom = document.getElementById(`cipher-slot-${matchedIndex}`);
        if (slotDom) {
          animateFlyingPlate(btn, slotDom, targetSlots[matchedIndex].syllable, () => {
            const allSolved = targetSlots.every(s => s.solved);
            renderCipherSlots(allSolved);
            highlightActiveAxes();

            const slotRect = cipherBayContainer.getBoundingClientRect();
            spawnWeldingSparks(
              slotRect.left + slotRect.width / 2,
              slotRect.top + slotRect.height / 2,
              22
            );

            if (allSolved) {
              triggerWorkshopCelebration();
            }
          });
        } else {
          const allSolved = targetSlots.every(s => s.solved);
          renderCipherSlots(allSolved);
          highlightActiveAxes();
          if (allSolved) triggerWorkshopCelebration();
        }
      } else {
        // Wrong coordinate cell clicked
        audio.playWrongClunk();
        btn.classList.remove('cell-wrong');
        void btn.offsetWidth; // reflow
        btn.classList.add('cell-wrong');
        spawnSmokePuff(centerX, centerY, 12);
      }
    }

    cellButtons.forEach(btn => {
      btn.addEventListener('click', () => handleCellClick(btn));
    });

    /***************************************************************************
     * 6. FOUR ELABORATE NON-VERBAL WORKSHOP CELEBRATIONS
     ***************************************************************************/
    function setCarPalette(palette) {
      document.getElementById('carStop1').setAttribute('stop-color', palette[0]);
      document.getElementById('carStop2').setAttribute('stop-color', palette[1]);
      document.getElementById('carStop3').setAttribute('stop-color', palette[2]);
    }

    function resetWorkshopStage() {
      const liftGroup = document.getElementById('carLiftGroup');
      const sportsCar = document.getElementById('sportsCar');
      const turboFlame = document.getElementById('turboFlameGroup');
      const headlightBeam = document.getElementById('headlightBeamGroup');
      const sprayArms = document.getElementById('sprayArmsGroup');
      const rearWheel = document.getElementById('rearWheelGroup');
      const frontWheel = document.getElementById('frontWheelGroup');
      const fan1 = document.getElementById('fanBlades1');
      const needle1 = document.getElementById('gaugeNeedle1');
      const needle2 = document.getElementById('gaugeNeedle2');

      if (liftGroup) liftGroup.setAttribute('transform', 'translate(0, 0)');
      if (sportsCar) sportsCar.classList.remove('car-suspension-bounce');
      if (turboFlame) turboFlame.setAttribute('opacity', '0');
      if (headlightBeam) headlightBeam.setAttribute('opacity', '0');
      if (sprayArms) sprayArms.setAttribute('opacity', '0');
      if (rearWheel) rearWheel.classList.remove('car-wheel-spin');
      if (frontWheel) frontWheel.classList.remove('car-wheel-spin');
      if (fan1) fan1.classList.remove('fast');
      if (needle1) needle1.classList.remove('redline');
      if (needle2) needle2.classList.remove('redline');
      electricArcTimer = 0;
      activeArcTarget = null;
    }

    function triggerWorkshopCelebration() {
      roundLocked = true;
      const mode = celebrationIndex % 4;
      celebrationIndex++;

      const bayRect = cipherBayContainer.getBoundingClientRect();
      const bayCenterX = bayRect.left + bayRect.width / 2;
      const bayCenterY = bayRect.top + bayRect.height / 2;

      // Always spin the car's wheels strictly in place on the car axles during celebration
      const rearWheel = document.getElementById('rearWheelGroup');
      const frontWheel = document.getElementById('frontWheelGroup');
      if (rearWheel) rearWheel.classList.add('car-wheel-spin');
      if (frontWheel) frontWheel.classList.add('car-wheel-spin');

      if (mode === 0) {
        // 1) TURBO DYNO RUN: Wheels spin in place on the car, nitro exhaust flame, gauge redline
        audio.playCelebrationTurbo();
        document.getElementById('turboFlameGroup').setAttribute('opacity', '1');
        document.getElementById('fanBlades1').classList.add('fast');
        document.getElementById('gaugeNeedle1').classList.add('redline');
        document.getElementById('gaugeNeedle2').classList.add('redline');

        spawnWeldingSparks(bayCenterX, bayCenterY, 50);

      } else if (mode === 1) {
        // 2) HYDRAULIC LIFT & HEADLIGHT FLASH: Lift raises & lowers while wheels spin on the car
        audio.playCelebrationHornFanfare();
        const liftGroup = document.getElementById('carLiftGroup');
        const headlightBeam = document.getElementById('headlightBeamGroup');

        liftGroup.setAttribute('transform', 'translate(0, -82)');
        headlightBeam.setAttribute('opacity', '1');
        spawnSparkleBurst(bayCenterX, bayCenterY, 32);

        setTimeout(() => {
          headlightBeam.setAttribute('opacity', '0.2');
        }, 450);
        setTimeout(() => {
          headlightBeam.setAttribute('opacity', '1');
          liftGroup.setAttribute('transform', 'translate(0, 0)');
        }, 950);

      } else if (mode === 2) {
        // 3) SUSPENSION BOUNCE & PAINT TUNING: Car bounces on suspension, wheels spin in place, color changes
        audio.playCelebrationHornFanfare();
        const sportsCar = document.getElementById('sportsCar');
        const sprayArms = document.getElementById('sprayArmsGroup');
        if (sportsCar) sportsCar.classList.add('car-suspension-bounce');
        sprayArms.setAttribute('opacity', '1');

        carColorIdx = (carColorIdx + 1) % CAR_PALETTES.length;
        setTimeout(() => {
          setCarPalette(CAR_PALETTES[carColorIdx]);
          spawnSparkleBurst(bayCenterX, bayCenterY, 36);
        }, 380);

      } else {
        // 4) MASTER MECHANIC GEAR SYMPHONY: Wheels spin on car, electric arcs on key bay, gauges redline
        audio.playCelebrationGearSymphony();
        activeArcTarget = cipherBayContainer;
        electricArcTimer = 95;
        document.getElementById('fanBlades1').classList.add('fast');
        document.getElementById('headlightBeamGroup').setAttribute('opacity', '1');

        gearAngle += 360;
        const cornerGear = document.getElementById('matrixCornerGear');
        if (cornerGear) cornerGear.style.transform = `rotate(${gearAngle}deg)`;

        spawnWeldingSparks(bayCenterX, bayCenterY, 45);
      }

      // Automatically transition to next word after celebration
      autoAdvanceTimeout = setTimeout(() => {
        audio.playPneumaticHiss(0.28);
        generateNewRound();
      }, 2400);
    }

    /***************************************************************************
     * 7. TOP-BAR CONTROLS (Language Toggle, Sound Mute, Instant Next Button)
     ***************************************************************************/
    const langToggleBtn = document.getElementById('langToggleBtn');
    const langBadgeText = document.getElementById('langBadgeText');

    langToggleBtn.addEventListener('click', () => {
      currentLang = currentLang === 'UA' ? 'RU' : 'UA';
      langBadgeText.textContent = currentLang;
      audio.playPneumaticHiss(0.22);
      const rect = langToggleBtn.getBoundingClientRect();
      spawnWeldingSparks(rect.left + rect.width / 2, rect.top + rect.height / 2, 18);
      generateNewRound();
    });

    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundOnIcon = document.getElementById('soundOnIcon');
    const soundOffIcon = document.getElementById('soundOffIcon');

    soundToggleBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      soundOnIcon.classList.toggle('hidden', audio.muted);
      soundOffIcon.classList.toggle('hidden', !audio.muted);
      if (!audio.muted) {
        audio.playRatchetSuccess(0);
      }
    });

    const nextWordBtn = document.getElementById('nextWordBtn');
    nextWordBtn.addEventListener('click', () => {
      audio.playPneumaticHiss(0.25);
      const rect = nextWordBtn.getBoundingClientRect();
      spawnWeldingSparks(rect.left + rect.width / 2, rect.top + rect.height / 2, 22);
      generateNewRound();
    });

    // Start Workshop Loop & Initial Task on Load
    window.onload = function () {
      animateCanvas();
      generateNewRound();
    };
  </script>
