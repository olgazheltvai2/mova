<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор карток</title>

    <!-- Firebase Compat Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #2c3e50;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Ігрове поле */
        .cards-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 95vw;
            max-width: 1400px;
            height: 80vh;
            flex-wrap: wrap;
        }

        /* Стилі об'ємних карток зі скругленими кутами */
        .card {
            width: calc(18% - 10px);
            max-width: 240px;
            aspect-ratio: 3 / 4;
            background-size: cover;
            background-position: center;
            border-radius: 14px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 
                        0 6px 6px rgba(0, 0, 0, 0.23),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35), 
                        0 10px 10px rgba(0, 0, 0, 0.22),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        /* Адаптивність для мобільних пристроїв */
        @media (max-width: 768px) {
            .cards-container {
                gap: 10px;
                height: 90vh;
            }
            .card {
                width: calc(30% - 10px);
            }
        }

        @media (max-width: 480px) {
            .card {
                width: calc(45% - 10px);
            }
        }

        /* Theme Manager UI */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #333;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        #theme-btn:hover {
            transform: rotate(45deg);
        }

        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            max-height: 60vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            padding: 20px;
            z-index: 1000;
            overflow-y: auto;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .theme-card {
            position: relative;
            width: 100%;
            height: 80px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            border: 2px solid #ccc;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .theme-card span {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Екран-заглушка контролю доступу */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="cards-container" id="cards-container"></div>

    <!-- Theme Manager Controls -->
    <div id="theme-btn" onclick="event.stopPropagation(); toggleThemeModal();">⚙️</div>
    <div id="theme-modal" onclick="event.stopPropagation();">
        <h3 style="text-align: center;">Оберіть фон</h3>
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <!-- Блок контролю доступу -->
    <div id="block-overlay">
        <div>Зачекай! Зараз не твій урок.</div>
    </div>

    <script>
        // --- 1. ПІДКТЮЧЕННЯ FIREBASE ТА НАЛАШТУВАННЯ ---
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };

        let db = null;
        let isFirebaseAvailable = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            isFirebaseAvailable = true;
        } catch (e) {
            console.warn("Firebase не ініціалізовано. Гра працює в автономному режимі.");
        }

        const TOTAL_CARDS_IN_DECK = 36;
        const CARDS_TO_SHOW = 5;
        const container = document.getElementById('cards-container');
        let isRemoteAction = false;

        // --- 2. ЛОГІКА КАРТОК (ВІДОБРАЖЕННЯ ТА РАНДОМ) ---
        function dealCards(seedArray = null) {
            container.innerHTML = '';
            let selectedNumbers = [];

            if (seedArray && Array.isArray(seedArray)) {
                selectedNumbers = seedArray;
            } else {
                const numbers = Array.from({ length: TOTAL_CARDS_IN_DECK }, (_, i) => i + 1);
                for (let i = 0; i < CARDS_TO_SHOW; i++) {
                    const randomIndex = Math.floor(Math.random() * numbers.length);
                    selectedNumbers.push(numbers.splice(randomIndex, 1)[0]);
                }
            }

            selectedNumbers.forEach(num => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.backgroundImage = `url('./kartka_${num}.webp')`;
                container.appendChild(card);
            });

            return selectedNumbers;
        }

        // Обробка кліку по екрану
        document.body.addEventListener('click', (e) => {
            // Ігноруємо кліки по модальному вікну фонів
            if (e.target.closest('#theme-modal') || e.target.closest('#theme-btn')) return;

            const newCards = dealCards();

            // Синхронізація дій через Firebase (якщо доступний)
            if (isFirebaseAvailable && db && !isRemoteAction) {
                db.ref('game_action').set({
                    senderId: tabId,
                    timestamp: Date.now(),
                    type: 'DEAL_CARDS',
                    cards: newCards
                });
            }
        });

        // Викликаємо початковий роздачу карток
        dealCards();

        // --- 3. СИНХРОНІЗАЦІЯ FIREBASE (ГАРІЯ ГРИ) ---
        if (isFirebaseAvailable && db) {
            db.ref('game_action').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (data.senderId !== tabId) {
                    isRemoteAction = true;
                    if (data.type === 'DEAL_CARDS' && data.cards) {
                        dealCards(data.cards);
                    }
                    isRemoteAction = false;
                }
            });
        }

        // --- 4. СИСТЕМА ДИНАМІЧНИХ ФОНІВ (THEME MANAGER) ---
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeGrid = document.getElementById('theme-grid');
        const savedBg = localStorage.getItem('mySavedGameBg');

        if (savedBg) {
            document.body.style.backgroundImage = `url('${savedBg}')`;
        }

        function toggleThemeModal() {
            themeModal.style.display = themeModal.style.display === 'block' ? 'none' : 'block';
        }

        // Автоматична перевірка карток фонів
        async function loadThemes() {
            const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
            for (let i = 1; i <= 1000; i++) {
                const imgUrl = `${baseUrl}background_${i}.webp`;
                const exists = await checkImageExists(imgUrl);
                if (exists) {
                    createThemeCard(i, imgUrl);
                } else {
                    if (i > 10) break; // Зупиняємо перевірку, якщо підряд немає файлів
                }
            }
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function createThemeCard(index, url) {
            const card = document.createElement('div');
            card.className = 'theme-card';
            card.style.backgroundImage = `url('${url}')`;
            
            const title = document.createElement('span');
            title.textContent = `Фон ${index}`;
            card.appendChild(title);

            card.onclick = () => {
                applyTheme(url);
                if (isFirebaseAvailable && db) {
                    db.ref('game_theme').set(url);
                }
                toggleThemeModal();
            };

            themeGrid.appendChild(card);
        }

        function applyTheme(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
        }

        if (isFirebaseAvailable && db) {
            db.ref('game_theme').on('value', (snapshot) => {
                const url = snapshot.val();
                if (url) {
                    applyTheme(url);
                }
            });
        }

        loadThemes();

        // --- 5. УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ ДОСТУПУ ТА РАДАР ---
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user');

        if (myName) {
            sessionStorage.setItem('gameUserName', myName);
        } else {
            myName = sessionStorage.getItem('gameUserName');
        }

        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('gameUserName', myName);
        }

        const tabId = 'tab_' + Math.random().toString(36).substr(2, 9);
        const startTime = Date.now();

        if (isFirebaseAvailable && db) {
            // Радар онлайн-користувачів
            const userTabRef = db.ref(`online_users/${myName}/${tabId}`);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userTabRef.onDisconnect().remove();
                    userTabRef.set({
                        online: true,
                        lastSeen: Date.now()
                    });
                }
            });

            window.addEventListener('beforeunload', () => {
                userTabRef.remove();
            });

            // Перезавантаження
            db.ref(`force_refresh/${myName}`).on('value', (snap) => {
                if (snap.val()) {
                    window.location.reload();
                }
            });

            // Блокування
            const blockOverlay = document.getElementById('block-overlay');
            db.ref(`blocked_users/${myName}`).on('value', (snap) => {
                if (snap.val() === true) {
                    blockOverlay.style.display = 'flex';
                } else {
                    blockOverlay.style.display = 'none';
                }
            });

            // Повернення в Лобі з імунітетом
            db.ref('current_activity').on('value', (snap) => {
                const activity = snap.val();
                if (Date.now() - startTime < 1000) return; // Імунітет 1 секунда

                if (activity === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            });
        }
    </script>
<script src="https://olgazheltvai2.github.io/rizne/pencil.js"></script></body>
</html>
