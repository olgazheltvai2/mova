<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Castle Syllables</title>
  <style>
    /* Full-viewport lock with zero scrollbars and crisp rendering */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b2838;
      font-family: Arial, Helvetica, sans-serif;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    /* Top HUD Controls (Medieval Stone & Wood Aesthetic, No White Rectangles) */
    .hud-bar {
      position: fixed;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 20;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .med-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 46px;
      min-width: 46px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid #c99a49;
      background: linear-gradient(180deg, #4b3424 0%, #2d1e14 100%);
      color: #f6e2b3;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 224, 150, 0.35),
        inset 0 -2px 4px rgba(0, 0, 0, 0.5);
      transition: transform 0.14s ease, filter 0.14s ease, border-color 0.14s ease;
    }

    .med-btn:hover {
      filter: brightness(1.14);
      border-color: #f5cc78;
      transform: translateY(-1px);
    }

    .med-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    .med-btn.round {
      border-radius: 50%;
      width: 48px;
      height: 48px;
      padding: 0;
    }

    .med-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6));
    }

    .consonant-badge {
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      color: #ffe299;
    }

    /* Stylized Dark-Wood & Aged-Parchment Floating Consonant Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 9, 6, 0.35);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-panel {
      position: fixed;
      top: 72px;
      left: 16px;
      width: min(390px, calc(100vw - 32px));
      padding: 16px;
      border-radius: 16px;
      border: 2.5px solid #c99a49;
      background: linear-gradient(165deg, #3c291d 0%, #241710 100%);
      box-shadow:
        0 16px 36px rgba(0, 0, 0, 0.65),
        inset 0 1px 2px rgba(255, 224, 150, 0.28);
      z-index: 30;
      transform: translateY(-12px) scale(0.97);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
    }

    .settings-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    /* Mode Pills (МА / АМ / МА / АМ) */
    .mode-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-pill {
      padding: 9px 6px;
      border-radius: 10px;
      border: 2px solid #6e5239;
      background: linear-gradient(180deg, #35251b 0%, #241811 100%);
      color: #c9b28e;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.14s ease;
      box-shadow: inset 0 -2px 3px rgba(0,0,0,0.45);
    }

    .mode-pill:hover {
      border-color: #b58947;
      color: #f6e2b3;
    }

    .mode-pill.active {
      border-color: #f5cc78;
      background: linear-gradient(180deg, #b87e28 0%, #7d4f14 100%);
      color: #fff6dc;
      box-shadow:
        0 0 10px rgba(245, 204, 120, 0.35),
        inset 0 1px 1px rgba(255, 240, 200, 0.5);
    }

    /* Custom Consonant Input (Aged Dark Parchment Style) */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .parchment-input {
      flex: 1;
      height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      border: 2px solid #8a6943;
      background: linear-gradient(180deg, #2b1e16 0%, #1e140e 100%);
      color: #ffe5a3;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      outline: none;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }

    .parchment-input:focus {
      border-color: #f5cc78;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), 0 0 8px rgba(245, 204, 120, 0.3);
    }

    .parchment-input::placeholder {
      color: #7c6248;
      letter-spacing: 2px;
    }

    /* Engraved Stone Consonant Grid */
    .consonant-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .letter-stone {
      aspect-ratio: 1 / 1;
      border-radius: 9px;
      border: 2px solid #5c5752;
      background: linear-gradient(160deg, #6b665f 0%, #46423d 100%);
      color: #ded6c8;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.22),
        inset 0 -2px 3px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .letter-stone:hover {
      transform: translateY(-1px);
      border-color: #c9a461;
    }

    .letter-stone.selected {
      border-color: #ffd97d;
      background: linear-gradient(160deg, #d49635 0%, #8f5714 100%);
      color: #fff9e6;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      box-shadow:
        0 0 10px rgba(255, 205, 92, 0.45),
        inset 0 1px 2px rgba(255, 245, 205, 0.55);
    }

    @media (max-width: 600px) {
      .hud-bar {
        top: 10px;
        left: 10px;
        right: 10px;
      }
      .med-btn {
        min-height: 42px;
        min-width: 42px;
        padding: 6px 11px;
        font-size: 14px;
      }
      .med-btn.round {
        width: 42px;
        height: 42px;
      }
      .settings-panel {
        top: 60px;
        left: 10px;
      }
      .consonant-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Main High-DPI Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Minimalistic Medieval HUD Controls -->
  <div class="hud-bar">
    <div class="hud-group">
      <!-- Consonant Selector Toggle -->
      <button id="consonantToggleBtn" class="med-btn" aria-label="Consonants">
        <!-- Custom Quill/Gear SVG Icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span id="activeConsonantsLabel" class="consonant-badge">М</span>
      </button>

      <!-- Bilingual Toggle (укр / рус) -->
      <button id="langToggleBtn" class="med-btn" aria-label="Language">укр</button>
    </div>

    <div class="hud-group">
      <!-- Mute / Unmute Button -->
      <button id="soundToggleBtn" class="med-btn round" aria-label="Sound">
        <svg id="soundOnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" fill-opacity="0.25"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="soundOffIcon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" fill-opacity="0.2"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>

      <!-- Next / New Round Button -->
      <button id="nextRoundBtn" class="med-btn round" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- Backdrop & Floating Consonant / Mode Panel -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>
  <div id="settingsPanel" class="settings-panel">
    <div class="mode-row">
      <button class="mode-pill" data-mode="open">МА</button>
      <button class="mode-pill" data-mode="closed">АМ</button>
      <button class="mode-pill active" data-mode="mixed">МА / АМ</button>
    </div>
    <div class="input-row">
      <input id="consonantInput" class="parchment-input" type="text" maxlength="24" autocomplete="off" spellcheck="false" placeholder="М, С, Л..." />
    </div>
    <div id="consonantGrid" class="consonant-grid"></div>
  </div>

  <script>
    (() => {
      'use strict';

      /* =====================================================================
         1. LANGUAGE & SYLLABLE CONFIGURATION
      ===================================================================== */
      const LANG_CONFIG = {
        uk: {
          label: 'укр',
          vowels: ['А', 'О', 'У', 'И', 'Е', 'І'],
          consonants: ['Б', 'В', 'Г', 'Ґ', 'Д', 'Ж', 'З', 'Й', 'К', 'Л', 'М', 'Н', 'П', 'Р', 'С', 'Т', 'Ф', 'Х', 'Ц', 'Ч', 'Ш', 'Щ']
        },
        ru: {
          label: 'рус',
          vowels: ['А', 'О', 'У', 'Ы', 'Е', 'И'],
          consonants: ['Б', 'В', 'Г', 'Д', 'Ж', 'З', 'Й', 'К', 'Л', 'М', 'Н', 'П', 'Р', 'С', 'Т', 'Ф', 'Х', 'Ц', 'Ч', 'Ш', 'Щ']
        }
      };

      const state = {
        lang: 'uk',
        selectedConsonants: ['М'],
        syllableMode: 'mixed', // 'open' | 'closed' | 'mixed'
        muted: false,
        phase: 'PLAYING', // 'PLAYING' | 'VICTORY_CELEBRATE' | 'VICTORY_MOUNT' | 'VICTORY_GALLOP' | 'RESETTING'
        phaseTime: 0,
        time: 0,
        stones: [],
        removedCount: 0,
        hoveredIndex: -1,
        dragonRage: 0,        // 0..1 intensity of fire-breathing & anger
        dragonFireTimer: 0,   // seconds remaining for active flame stream
        dragonEscapeX: 0,
        dragonEscapeY: 0,
        castleGlow: 0,        // warm orange firelight cast on castle
        knightXOffset: 0,
        knightGallopPhase: 0,
        princessInWindow: true,
        princessWalkProgress: 0, // 0..1 walking from gate to horse
        princessMounted: false,
        stoneAppearProgress: 1
      };

      /* =====================================================================
         2. WEB AUDIO API SYNTHESIZER (No external audio files)
      ===================================================================== */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.noiseBuffer = null;
          this.noteIndex = 0;
          // Uplifting medieval harp/glockenspiel major pentatonic scale
          this.scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51];
        }

        ensureContext() {
          if (state.muted) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            this.ctx = new AudioCtx();
            this.createNoiseBuffer();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        }

        createNoiseBuffer() {
          if (!this.ctx) return;
          const length = this.ctx.sampleRate * 2.0;
          const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          this.noiseBuffer = buffer;
        }

        playStoneBreak() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          // 1. Stone crumble thud
          const osc = ctx.createOscillator();
          const oscGain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(145 + Math.random() * 35, now);
          osc.frequency.exponentialRampToValueAtTime(38, now + 0.16);
          oscGain.gain.setValueAtTime(0.32, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(oscGain).connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.19);

          // 2. Gravel / rock crackle burst
          if (this.noiseBuffer) {
            const src = ctx.createBufferSource();
            src.buffer = this.noiseBuffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(900 + Math.random() * 500, now);
            filter.Q.value = 1.4;
            const nGain = ctx.createGain();
            nGain.gain.setValueAtTime(0.24, now);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            src.connect(filter).connect(nGain).connect(ctx.destination);
            src.start(now);
            src.stop(now + 0.24);
          }

          // 3. Bright musical chime (harp/bell)
          const freq = this.scale[this.noteIndex % this.scale.length];
          this.noteIndex++;
          const bell = ctx.createOscillator();
          const bellOver = ctx.createOscillator();
          const bellGain = ctx.createGain();
          bell.type = 'sine';
          bellOver.type = 'triangle';
          bell.frequency.setValueAtTime(freq, now + 0.02);
          bellOver.frequency.setValueAtTime(freq * 2, now + 0.02);
          bellGain.gain.setValueAtTime(0.001, now);
          bellGain.gain.linearRampToValueAtTime(0.16, now + 0.03);
          bellGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          bell.connect(bellGain);
          bellOver.connect(bellGain);
          bellGain.connect(ctx.destination);
          bell.start(now + 0.02);
          bellOver.start(now + 0.02);
          bell.stop(now + 0.58);
          bellOver.stop(now + 0.58);
        }

        playDragonFire() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          // 1. Dragon angry growl
          const growl = ctx.createOscillator();
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          const growlFilter = ctx.createBiquadFilter();
          const growlGain = ctx.createGain();

          growl.type = 'sawtooth';
          growl.frequency.setValueAtTime(115 + Math.random() * 20, now);
          growl.frequency.exponentialRampToValueAtTime(62, now + 0.55);

          lfo.frequency.setValueAtTime(26, now);
          lfoGain.gain.setValueAtTime(18, now);
          lfo.connect(lfoGain).connect(growl.frequency);

          growlFilter.type = 'lowpass';
          growlFilter.frequency.setValueAtTime(480, now);
          growlFilter.frequency.exponentialRampToValueAtTime(180, now + 0.55);

          growlGain.gain.setValueAtTime(0.001, now);
          growlGain.gain.linearRampToValueAtTime(0.16, now + 0.06);
          growlGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

          growl.connect(growlFilter).connect(growlGain).connect(ctx.destination);
          growl.start(now);
          lfo.start(now);
          growl.stop(now + 0.62);
          lfo.stop(now + 0.62);

          // 2. Fire-breath whoosh & roar
          if (this.noiseBuffer) {
            const fireSrc = ctx.createBufferSource();
            fireSrc.buffer = this.noiseBuffer;
            const fireFilter = ctx.createBiquadFilter();
            fireFilter.type = 'bandpass';
            fireFilter.frequency.setValueAtTime(320, now + 0.05);
            fireFilter.frequency.exponentialRampToValueAtTime(1350, now + 0.25);
            fireFilter.frequency.exponentialRampToValueAtTime(260, now + 0.95);
            fireFilter.Q.value = 0.9;

            const fireGain = ctx.createGain();
            fireGain.gain.setValueAtTime(0.001, now + 0.04);
            fireGain.gain.linearRampToValueAtTime(0.26, now + 0.18);
            fireGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);

            fireSrc.connect(fireFilter).connect(fireGain).connect(ctx.destination);
            fireSrc.start(now + 0.04);
            fireSrc.stop(now + 1.02);
          }
        }

        playVictoryFanfare() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          // Medieval royal trumpet fanfare notes (C5, E5, G5, C6, G5, C6)
          const notes = [
            { f: 523.25, t: 0.00, d: 0.18 },
            { f: 659.25, t: 0.18, d: 0.18 },
            { f: 783.99, t: 0.36, d: 0.18 },
            { f: 1046.5, t: 0.56, d: 0.36 },
            { f: 783.99, t: 0.94, d: 0.18 },
            { f: 1046.5, t: 1.14, d: 0.65 }
          ];

          notes.forEach(n => {
            const osc = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const filter = ctx.createBiquadFilter();
            const gain = ctx.createGain();

            osc.type = 'sawtooth';
            osc2.type = 'triangle';
            osc.frequency.setValueAtTime(n.f, now + n.t);
            osc2.frequency.setValueAtTime(n.f * 0.5, now + n.t);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1900, now + n.t);
            filter.frequency.exponentialRampToValueAtTime(950, now + n.t + n.d);

            gain.gain.setValueAtTime(0.001, now + n.t);
            gain.gain.linearRampToValueAtTime(0.14, now + n.t + 0.03);
            gain.gain.setValueAtTime(0.12, now + n.t + n.d * 0.7);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);

            osc.connect(filter);
            osc2.connect(filter);
            filter.connect(gain).connect(ctx.destination);
            osc.start(now + n.t);
            osc2.start(now + n.t);
            osc.stop(now + n.t + n.d + 0.02);
            osc2.stop(now + n.t + n.d + 0.02);
          });
        }

        playHoofbeat() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          // Triple-beat gallop clip-clop
          [0, 0.085, 0.17].forEach((offset, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            const startFreq = idx === 1 ? 210 : 165;
            osc.frequency.setValueAtTime(startFreq, now + offset);
            osc.frequency.exponentialRampToValueAtTime(65, now + offset + 0.05);
            gain.gain.setValueAtTime(0.12, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.07);
          });
        }
      }

      const sound = new SoundEngine();

      /* =====================================================================
         3. PARTICLE SYSTEMS & SCENERY DATA
      ===================================================================== */
      const clouds = [];
      const debris = [];
      const sparkles = [];
      const flames = [];
      const smokePuffs = [];
      const petals = [];
      const ambientMotes = [];
      const wildflowers = [];
      const grassBlades = [];
      const castleBushes = [];

      function initScenery() {
        clouds.length = 0;
        for (let i = 0; i < 7; i++) {
          clouds.push({
            x: (i / 7) * 1.3 - 0.15, // normalized 0..1
            y: 0.05 + (i % 3) * 0.075 + Math.random() * 0.03,
            scale: 0.65 + Math.random() * 0.65,
            speed: 0.006 + Math.random() * 0.009,
            puffs: 4 + Math.floor(Math.random() * 3)
          });
        }

        wildflowers.length = 0;
        const flowerColors = ['#fff275', '#ff7aa2', '#ffffff', '#7ec8ff', '#ffb347', '#e08aff'];
        for (let i = 0; i < 75; i++) {
          wildflowers.push({
            x: Math.random(),
            y: 0.72 + Math.random() * 0.26,
            size: 2.2 + Math.random() * 2.8,
            color: flowerColors[Math.floor(Math.random() * flowerColors.length)],
            phase: Math.random() * Math.PI * 2
          });
        }

        grassBlades.length = 0;
        for (let i = 0; i < 120; i++) {
          grassBlades.push({
            x: Math.random(),
            y: 0.74 + Math.random() * 0.26,
            h: 10 + Math.random() * 16,
            phase: Math.random() * Math.PI * 2,
            shade: Math.random()
          });
        }

        // Gentle sunlit pollen / floating petals drifting across the sky
        ambientMotes.length = 0;
        for (let i = 0; i < 24; i++) {
          ambientMotes.push({
            x: Math.random(),
            y: Math.random() * 0.85,
            size: 2 + Math.random() * 3.2,
            speedX: 0.008 + Math.random() * 0.014,
            speedY: 0.004 + Math.random() * 0.008,
            phase: Math.random() * Math.PI * 2,
            isPetal: i % 3 === 0,
            color: i % 3 === 0 ? 'rgba(255, 224, 235, 0.75)' : 'rgba(255, 248, 200, 0.65)'
          });
        }

        // Pre-generated lush foreground bush clusters along the castle base
        castleBushes.length = 0;
        const bushPresets = [
          // Left wing & corner bushes
          { relX: -0.34, yOff: 6, r: 30, flowers: 4 },
          { relX: -0.22, yOff: 9, r: 24, flowers: 3 },
          { relX: -0.10, yOff: 8, r: 28, flowers: 4 },
          // Flanking the central castle walls & gate
          { relX: 0.02, yOff: 10, r: 32, flowers: 5 },
          { relX: 0.14, yOff: 11, r: 24, flowers: 3 },
          { relX: 0.25, yOff: 12, r: 20, flowers: 2 },
          { relX: 0.75, yOff: 12, r: 20, flowers: 2 },
          { relX: 0.86, yOff: 11, r: 25, flowers: 3 },
          { relX: 0.98, yOff: 10, r: 33, flowers: 5 },
          // Right wing & outer turret bushes
          { relX: 1.10, yOff: 8, r: 28, flowers: 4 },
          { relX: 1.22, yOff: 9, r: 25, flowers: 3 },
          { relX: 1.34, yOff: 6, r: 31, flowers: 4 }
        ];
        bushPresets.forEach((bp, idx) => {
          const fl = [];
          for (let f = 0; f < bp.flowers; f++) {
            fl.push({
              ox: (Math.random() - 0.5) * bp.r * 1.4,
              oy: -bp.r * 0.25 - Math.random() * bp.r * 0.65,
              c: flowerColors[(idx + f * 2) % flowerColors.length]
            });
          }
          castleBushes.push({ ...bp, flowerList: fl, phase: idx * 0.8 });
        });
      }

      /* =====================================================================
         4. SYLLABLE GENERATOR & 4x4 STONE BOARD MANAGEMENT
      ===================================================================== */
      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function generateSyllables() {
        const cfg = LANG_CONFIG[state.lang];
        const consonants = state.selectedConsonants.length ? state.selectedConsonants : ['М'];
        const vowels = cfg.vowels;
        const pool = [];

        for (const c of consonants) {
          for (const v of vowels) {
            if (state.syllableMode === 'open' || state.syllableMode === 'mixed') {
              pool.push(c + v);
            }
            if (state.syllableMode === 'closed' || state.syllableMode === 'mixed') {
              pool.push(v + c);
            }
          }
        }

        const result = [];
        while (result.length < 16) {
          const batch = shuffleArray([...pool]);
          for (const syl of batch) {
            if (result.length < 16) result.push(syl);
          }
        }
        return shuffleArray(result);
      }

      function buildStones() {
        const syllables = generateSyllables();
        state.stones = [];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            const idx = r * 4 + c;
            state.stones.push({
              row: r,
              col: c,
              syllable: syllables[idx],
              removed: false,
              hoverAnim: 0,
              shade: (Math.random() - 0.5) * 18,
              warmth: (Math.random() - 0.5) * 14,
              crackSeed: Math.random(),
              hasMoss: Math.random() < 0.35,
              mossCorner: Math.floor(Math.random() * 4)
            });
          }
        }
      }

      function resetRound(instant) {
        state.phase = 'PLAYING';
        state.phaseTime = 0;
        state.removedCount = 0;
        state.hoveredIndex = -1;
        state.dragonRage = 0;
        state.dragonFireTimer = 0;
        state.dragonEscapeX = 0;
        state.dragonEscapeY = 0;
        state.castleGlow = 0;
        state.knightXOffset = 0;
        state.knightGallopPhase = 0;
        state.princessInWindow = true;
        state.princessWalkProgress = 0;
        state.princessMounted = false;
        state.stoneAppearProgress = instant ? 1 : 0;

        debris.length = 0;
        sparkles.length = 0;
        flames.length = 0;
        smokePuffs.length = 0;
        petals.length = 0;

        buildStones();
      }

      /* =====================================================================
         5. HUD & SETTINGS PANEL BINDINGS
      ===================================================================== */
      const consonantToggleBtn = document.getElementById('consonantToggleBtn');
      const activeConsonantsLabel = document.getElementById('activeConsonantsLabel');
      const langToggleBtn = document.getElementById('langToggleBtn');
      const soundToggleBtn = document.getElementById('soundToggleBtn');
      const soundOnIcon = document.getElementById('soundOnIcon');
      const soundOffIcon = document.getElementById('soundOffIcon');
      const nextRoundBtn = document.getElementById('nextRoundBtn');
      const settingsPanel = document.getElementById('settingsPanel');
      const drawerBackdrop = document.getElementById('drawerBackdrop');
      const consonantInput = document.getElementById('consonantInput');
      const consonantGrid = document.getElementById('consonantGrid');
      const modePills = document.querySelectorAll('.mode-pill');

      function updateConsonantUI() {
        const cfg = LANG_CONFIG[state.lang];
        activeConsonantsLabel.textContent = state.selectedConsonants.join(', ');
        consonantInput.value = state.selectedConsonants.join('');

        consonantGrid.innerHTML = '';
        for (const letter of cfg.consonants) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'letter-stone' + (state.selectedConsonants.includes(letter) ? ' selected' : '');
          btn.textContent = letter;
          btn.addEventListener('click', () => toggleConsonant(letter));
          consonantGrid.appendChild(btn);
        }
      }

      function toggleConsonant(letter) {
        const idx = state.selectedConsonants.indexOf(letter);
        if (idx >= 0) {
          if (state.selectedConsonants.length > 1) {
            state.selectedConsonants.splice(idx, 1);
          }
        } else {
          state.selectedConsonants.push(letter);
        }
        updateConsonantUI();
        resetRound(true);
      }

      function openPanel(open) {
        settingsPanel.classList.toggle('open', open);
        drawerBackdrop.classList.toggle('open', open);
      }

      consonantToggleBtn.addEventListener('click', () => {
        const isOpen = settingsPanel.classList.contains('open');
        openPanel(!isOpen);
      });

      drawerBackdrop.addEventListener('click', () => openPanel(false));

      langToggleBtn.addEventListener('click', () => {
        state.lang = state.lang === 'uk' ? 'ru' : 'uk';
        const cfg = LANG_CONFIG[state.lang];
        langToggleBtn.textContent = cfg.label;
        // Filter selected consonants to valid ones in new language
        state.selectedConsonants = state.selectedConsonants.filter(c => cfg.consonants.includes(c));
        if (state.selectedConsonants.length === 0) {
          state.selectedConsonants = ['М'];
        }
        updateConsonantUI();
        resetRound(true);
      });

      soundToggleBtn.addEventListener('click', () => {
        state.muted = !state.muted;
        soundOnIcon.style.display = state.muted ? 'none' : 'block';
        soundOffIcon.style.display = state.muted ? 'block' : 'none';
      });

      nextRoundBtn.addEventListener('click', () => {
        openPanel(false);
        resetRound(false);
      });

      modePills.forEach(pill => {
        pill.addEventListener('click', () => {
          state.syllableMode = pill.dataset.mode;
          modePills.forEach(p => p.classList.toggle('active', p === pill));
          resetRound(true);
        });
      });

      consonantInput.addEventListener('input', () => {
        const cfg = LANG_CONFIG[state.lang];
        const raw = consonantInput.value.toUpperCase();
        const found = [];
        for (const ch of raw) {
          if (cfg.consonants.includes(ch) && !found.includes(ch)) {
            found.push(ch);
          }
        }
        if (found.length > 0) {
          state.selectedConsonants = found;
          activeConsonantsLabel.textContent = state.selectedConsonants.join(', ');
          // Highlight matching stone buttons
          Array.from(consonantGrid.children).forEach(btn => {
            btn.classList.toggle('selected', state.selectedConsonants.includes(btn.textContent));
          });
          resetRound(true);
        }
      });

      /* =====================================================================
         6. CANVAS SETUP & RESPONSIVE LAYOUT METRICS
      ===================================================================== */
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let W = window.innerWidth;
      let H = window.innerHeight;
      let DPR = Math.min(window.devicePixelRatio || 1, 2);

      // Computed scene layout bounds updated on resize
      const layout = {
        horizonY: 0,
        castleX: 0,
        castleY: 0,
        castleW: 0,
        castleH: 0,
        wingW: 0,
        wingH: 0,
        winX: 0,
        winY: 0,
        winW: 0,
        winH: 0,
        dragonX: 0,
        dragonY: 0,
        dragonScale: 1,
        knightBaseX: 0,
        knightBaseY: 0,
        knightScale: 1
      };

      function computeLayout() {
        W = window.innerWidth;
        H = window.innerHeight;
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';

        layout.horizonY = H * 0.61;

        // Generous central castle keep + side wings spanning across the composition
        const unit = Math.min(W / 16, H / 9);
        layout.castleW = Math.min(W * 0.44, unit * 7.3);
        layout.castleH = Math.min(H * 0.72, unit * 6.55);
        layout.castleX = W * 0.50 - layout.castleW * 0.5;
        layout.castleY = H * 0.835 - layout.castleH;

        // Left & right architectural castle wings (прибудови)
        layout.wingW = Math.min(W * 0.16, layout.castleW * 0.36);
        layout.wingH = layout.castleH * 0.62;

        // 4x4 Window centered in the main castle keep
        const winSize = Math.min(layout.castleW * 0.62, layout.castleH * 0.59);
        layout.winW = winSize;
        layout.winH = winSize;
        layout.winX = layout.castleX + (layout.castleW - winSize) * 0.5;
        layout.winY = layout.castleY + layout.castleH * 0.18;

        // Large, majestic Dragon perched on the right castle wing/turret (~1.9x larger!)
        layout.dragonScale = Math.max(1.05, Math.min(2.15, unit / 38));
        layout.dragonX = layout.castleX + layout.castleW + layout.wingW * 0.38;
        layout.dragonY = layout.castleY + layout.castleH - layout.wingH - 36 * layout.dragonScale;

        // Large, heroic Knight on horseback in the left foreground (~1.9x larger!)
        layout.knightScale = Math.max(1.05, Math.min(2.15, unit / 39));
        layout.knightBaseX = Math.max(W * 0.135, layout.castleX - layout.wingW * 0.68);
        layout.knightBaseY = H * 0.835;
      }

      window.addEventListener('resize', computeLayout);

      /* =====================================================================
         7. INTERACTION (CLICK / TAP / HOVER ON 4x4 STONES)
      ===================================================================== */
      function getStoneRect(stone) {
        const pad = 4;
        const cellW = layout.winW / 4;
        const cellH = layout.winH / 4;
        return {
          x: layout.winX + stone.col * cellW + pad * 0.5,
          y: layout.winY + stone.row * cellH + pad * 0.5,
          w: cellW - pad,
          h: cellH - pad
        };
      }

      function hitTestStone(px, py) {
        if (state.phase !== 'PLAYING' || state.stoneAppearProgress < 0.7) return -1;
        for (let i = 0; i < state.stones.length; i++) {
          const s = state.stones[i];
          if (s.removed) continue;
          const r = getStoneRect(s);
          if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) {
            return i;
          }
        }
        return -1;
      }

      function spawnStoneBreakParticles(rect) {
        const cx = rect.x + rect.w * 0.5;
        const cy = rect.y + rect.h * 0.5;

        // Rock debris chunks
        for (let i = 0; i < 16; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 70 + Math.random() * 210;
          debris.push({
            x: cx + (Math.random() - 0.5) * rect.w * 0.7,
            y: cy + (Math.random() - 0.5) * rect.h * 0.7,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 120,
            size: 5 + Math.random() * 11,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 10,
            color: i % 3 === 0 ? '#7d756b' : (i % 3 === 1 ? '#5e5850' : '#968d82'),
            life: 1.0
          });
        }

        // Dust puffs
        for (let i = 0; i < 9; i++) {
          smokePuffs.push({
            x: cx + (Math.random() - 0.5) * rect.w * 0.6,
            y: cy + (Math.random() - 0.5) * rect.h * 0.6,
            vx: (Math.random() - 0.5) * 60,
            vy: -20 - Math.random() * 45,
            r: 12 + Math.random() * 18,
            alpha: 0.55,
            color: 'rgba(218, 208, 192,',
            life: 0.75 + Math.random() * 0.35
          });
        }

        // Golden sparkles
        for (let i = 0; i < 14; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 40 + Math.random() * 140;
          sparkles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 40,
            size: 3 + Math.random() * 4.5,
            life: 0.7 + Math.random() * 0.5,
            maxLife: 1.2,
            color: i % 2 === 0 ? '#ffe57f' : '#fff7d6'
          });
        }
      }

      function spawnVictoryPetals() {
        const colors = ['#ff85a2', '#ffd166', '#ffffff', '#ff9ebb', '#ffe57f'];
        for (let i = 0; i < 55; i++) {
          petals.push({
            x: layout.winX + Math.random() * layout.winW,
            y: layout.winY + Math.random() * layout.winH,
            vx: (Math.random() - 0.5) * 180,
            vy: -120 - Math.random() * 180,
            size: 5 + Math.random() * 6,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 2.5 + Math.random() * 2.0
          });
        }
      }

      function triggerStoneClick(index) {
        const stone = state.stones[index];
        if (!stone || stone.removed) return;

        stone.removed = true;
        state.removedCount++;
        const rect = getStoneRect(stone);
        spawnStoneBreakParticles(rect);
        sound.playStoneBreak();

        // Dragon reacts angrily and breathes fire!
        state.dragonRage = 1.0;
        state.dragonFireTimer = 1.05;
        state.castleGlow = 1.0;
        sound.playDragonFire();

        // Check for victory (all 16 stones cleared)
        if (state.removedCount >= 16) {
          state.phase = 'VICTORY_CELEBRATE';
          state.phaseTime = 0;
          spawnVictoryPetals();
          setTimeout(() => {
            if (state.phase !== 'PLAYING') {
              sound.playVictoryFanfare();
            }
          }, 260);
        }
      }

      canvas.addEventListener('pointermove', e => {
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const idx = hitTestStone(px, py);
        state.hoveredIndex = idx;
        canvas.style.cursor = idx >= 0 ? 'pointer' : 'default';
      });

      canvas.addEventListener('pointerdown', e => {
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const idx = hitTestStone(px, py);
        if (idx >= 0) {
          triggerStoneClick(idx);
        }
      });

      /* =====================================================================
         8. UPDATE LOOP (60FPS DELTA-TIME SIMULATION)
      ===================================================================== */
      let hoofTimer = 0;

      function update(dt) {
        state.time += dt;

        // Smooth stone appearance on round reset
        if (state.stoneAppearProgress < 1) {
          state.stoneAppearProgress = Math.min(1, state.stoneAppearProgress + dt * 2.4);
        }

        // Hover animation on stones
        for (let i = 0; i < state.stones.length; i++) {
          const s = state.stones[i];
          const target = (i === state.hoveredIndex && !s.removed) ? 1 : 0;
          s.hoverAnim += (target - s.hoverAnim) * Math.min(1, dt * 14);
        }

        // Drift clouds
        for (const c of clouds) {
          c.x += c.speed * dt;
          if (c.x > 1.2) c.x = -0.22;
        }

        // Drift ambient sunlit motes & petals
        for (const m of ambientMotes) {
          m.x += m.speedX * dt;
          m.y += (m.speedY + Math.sin(state.time * 1.8 + m.phase) * 0.004) * dt;
          if (m.x > 1.05) m.x = -0.05;
          if (m.y > 0.92) m.y = -0.04;
        }

        // Dragon anger & fire breath particles
        if (state.dragonFireTimer > 0) {
          state.dragonFireTimer = Math.max(0, state.dragonFireTimer - dt);
          // Emit powerful layered fire particles from the enlarged dragon's jaws
          const mouthX = layout.dragonX + state.dragonEscapeX - 60 * layout.dragonScale;
          const mouthY = layout.dragonY + state.dragonEscapeY - 4 * layout.dragonScale;

          for (let i = 0; i < 8; i++) {
            const spread = (Math.random() - 0.5) * 0.34;
            const angle = Math.PI + 0.14 + spread; // aiming left and slightly upward across sky
            const speed = (250 + Math.random() * 240) * layout.dragonScale;
            flames.push({
              x: mouthX,
              y: mouthY,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 18,
              r: (11 + Math.random() * 14) * layout.dragonScale,
              life: 0.45 + Math.random() * 0.38,
              maxLife: 0.83
            });
          }

          // Bright fire sparks shooting out with the flame
          if (Math.random() < 0.75) {
            const spAngle = Math.PI + 0.14 + (Math.random() - 0.5) * 0.5;
            const spSpeed = (320 + Math.random() * 220) * layout.dragonScale;
            sparkles.push({
              x: mouthX,
              y: mouthY,
              vx: Math.cos(spAngle) * spSpeed,
              vy: Math.sin(spAngle) * spSpeed,
              size: (2.8 + Math.random() * 3.5) * Math.min(1.4, layout.dragonScale),
              life: 0.5 + Math.random() * 0.4,
              maxLife: 0.9,
              color: Math.random() < 0.5 ? '#fff280' : '#ff9421'
            });
          }

          if (Math.random() < 0.55) {
            smokePuffs.push({
              x: mouthX - 35 * layout.dragonScale,
              y: mouthY - 12 * layout.dragonScale,
              vx: -130 - Math.random() * 90,
              vy: -55 - Math.random() * 55,
              r: (13 + Math.random() * 14) * layout.dragonScale,
              alpha: 0.38,
              color: 'rgba(42, 34, 32,',
              life: 0.9 + Math.random() * 0.5
            });
          }
        } else {
          // Occasional idle nostril smoke wisp
          if (state.phase === 'PLAYING' && Math.random() < dt * 2.4) {
            const nostrilX = layout.dragonX - 58 * layout.dragonScale;
            const nostrilY = layout.dragonY - 10 * layout.dragonScale;
            smokePuffs.push({
              x: nostrilX,
              y: nostrilY,
              vx: -12 - Math.random() * 14,
              vy: -24 - Math.random() * 18,
              r: 4.5 * layout.dragonScale,
              alpha: 0.32,
              color: 'rgba(130, 125, 120,',
              life: 1.1
            });
          }
        }

        state.dragonRage = Math.max(0, state.dragonRage - dt * 0.85);
        state.castleGlow = Math.max(0, state.castleGlow - dt * 1.1);

        // Victory Sequence State Machine
        if (state.phase === 'VICTORY_CELEBRATE') {
          state.phaseTime += dt;
          // Dragon recoils and flies off screen to upper right in defeat
          state.dragonEscapeX += dt * W * 0.32;
          state.dragonEscapeY -= dt * H * 0.28;
          if (Math.random() < dt * 14) {
            smokePuffs.push({
              x: layout.dragonX + state.dragonEscapeX,
              y: layout.dragonY + state.dragonEscapeY,
              vx: -30,
              vy: -20,
              r: 18 * layout.dragonScale,
              alpha: 0.4,
              color: 'rgba(65, 58, 55,',
              life: 0.8
            });
          }
          if (state.phaseTime >= 1.45) {
            state.phase = 'VICTORY_MOUNT';
            state.phaseTime = 0;
            state.princessInWindow = false;
          }
        } else if (state.phase === 'VICTORY_MOUNT') {
          state.phaseTime += dt;
          state.dragonEscapeX += dt * W * 0.32;
          state.dragonEscapeY -= dt * H * 0.28;
          state.princessWalkProgress = Math.min(1, state.phaseTime / 1.25);
          if (state.phaseTime >= 1.3) {
            state.princessMounted = true;
            state.phase = 'VICTORY_GALLOP';
            state.phaseTime = 0;
            hoofTimer = 0;
          }
        } else if (state.phase === 'VICTORY_GALLOP') {
          state.phaseTime += dt;
          state.knightGallopPhase += dt * 13;
          state.knightXOffset += dt * (W * 0.36);

          // Hoofbeats sound & dust puffs
          hoofTimer -= dt;
          if (hoofTimer <= 0) {
            sound.playHoofbeat();
            hoofTimer = 0.36;
          }
          if (Math.random() < dt * 22) {
            smokePuffs.push({
              x: layout.knightBaseX + state.knightXOffset - 22 * layout.knightScale,
              y: layout.knightBaseY + 14 * layout.knightScale,
              vx: -45 - Math.random() * 40,
              vy: -15 - Math.random() * 25,
              r: 9 + Math.random() * 10,
              alpha: 0.42,
              color: 'rgba(186, 165, 134,',
              life: 0.55
            });
          }

          if (layout.knightBaseX + state.knightXOffset > W + 220) {
            state.phase = 'RESETTING';
            state.phaseTime = 0;
            buildStones();
            state.princessInWindow = true;
            state.princessMounted = false;
            state.princessWalkProgress = 0;
            state.stoneAppearProgress = 0;
            state.knightXOffset = -(layout.knightBaseX + 180);
            state.dragonEscapeX = W * 0.35;
            state.dragonEscapeY = -H * 0.35;
          }
        } else if (state.phase === 'RESETTING') {
          state.phaseTime += dt;
          // Knight rides back in smoothly, dragon returns to turret
          state.knightXOffset += (0 - state.knightXOffset) * Math.min(1, dt * 4.5);
          state.knightGallopPhase += dt * 10;
          state.dragonEscapeX += (0 - state.dragonEscapeX) * Math.min(1, dt * 3.8);
          state.dragonEscapeY += (0 - state.dragonEscapeY) * Math.min(1, dt * 3.8);

          if (state.phaseTime >= 1.35) {
            state.knightXOffset = 0;
            state.dragonEscapeX = 0;
            state.dragonEscapeY = 0;
            state.phase = 'PLAYING';
            state.phaseTime = 0;
          }
        }

        // Update debris particles
        for (let i = debris.length - 1; i >= 0; i--) {
          const p = debris[i];
          p.vy += 680 * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vrot * dt;
          p.life -= dt * 0.9;
          if (p.life <= 0 || p.y > H + 40) debris.splice(i, 1);
        }

        // Update sparkles
        for (let i = sparkles.length - 1; i >= 0; i--) {
          const s = sparkles[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.vy += 60 * dt;
          s.life -= dt;
          if (s.life <= 0) sparkles.splice(i, 1);
        }

        // Update flames
        for (let i = flames.length - 1; i >= 0; i--) {
          const f = flames[i];
          f.x += f.vx * dt;
          f.y += f.vy * dt;
          f.vy -= 45 * dt; // flames rise slightly
          f.r += 26 * dt;
          f.life -= dt;
          if (f.life <= 0) flames.splice(i, 1);
        }

        // Update smoke puffs
        for (let i = smokePuffs.length - 1; i >= 0; i--) {
          const sm = smokePuffs[i];
          sm.x += sm.vx * dt;
          sm.y += sm.vy * dt;
          sm.r += 14 * dt;
          sm.life -= dt;
          if (sm.life <= 0) smokePuffs.splice(i, 1);
        }

        // Update victory petals
        for (let i = petals.length - 1; i >= 0; i--) {
          const pt = petals[i];
          pt.vy += 120 * dt;
          pt.vx += Math.sin(state.time * 4 + i) * 35 * dt;
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.rot += pt.vrot * dt;
          pt.life -= dt;
          if (pt.life <= 0 || pt.y > H + 30) petals.splice(i, 1);
        }
      }

      /* =====================================================================
         9. CUSTOM CANVAS RENDERING (100% PROCEDURAL ART)
      ===================================================================== */

      function drawSkyAndSun() {
        // Lush daytime sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, layout.horizonY);
        skyGrad.addColorStop(0, '#3a88d6');
        skyGrad.addColorStop(0.55, '#7cc0f0');
        skyGrad.addColorStop(1, '#d7effb');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, layout.horizonY + 20);

        // Warm sun & sunlight rays in upper left
        const sunX = W * 0.14;
        const sunY = H * 0.14;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, W * 0.34);
        sunGlow.addColorStop(0, 'rgba(255, 250, 210, 0.95)');
        sunGlow.addColorStop(0.18, 'rgba(255, 236, 165, 0.45)');
        sunGlow.addColorStop(0.55, 'rgba(255, 232, 160, 0.12)');
        sunGlow.addColorStop(1, 'rgba(255, 232, 160, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, W, layout.horizonY);

        // Soft diagonal sunbeams
        ctx.save();
        ctx.translate(sunX, sunY);
        for (let i = 0; i < 5; i++) {
          ctx.save();
          ctx.rotate(0.25 + i * 0.22 + Math.sin(state.time * 0.3 + i) * 0.02);
          const rayGrad = ctx.createLinearGradient(0, 0, W * 0.55, 0);
          rayGrad.addColorStop(0, 'rgba(255, 246, 200, 0.16)');
          rayGrad.addColorStop(1, 'rgba(255, 246, 200, 0)');
          ctx.fillStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(0, -14);
          ctx.lineTo(W * 0.55, -55);
          ctx.lineTo(W * 0.55, 55);
          ctx.lineTo(0, 14);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();

        // Drifting softly shaded layered clouds
        for (const c of clouds) {
          const cx = c.x * W;
          const cy = c.y * H;
          const s = c.scale * Math.min(W, H) * 0.085;
          ctx.save();
          ctx.translate(cx, cy);

          // Underside soft blue-grey shadow
          ctx.fillStyle = 'rgba(182, 209, 232, 0.72)';
          ctx.beginPath();
          ctx.ellipse(0, s * 0.18, s * 1.35, s * 0.44, 0, 0, Math.PI * 2);
          ctx.fill();

          // Fluffy sunlit puffs
          const grad = ctx.createLinearGradient(0, -s * 0.8, 0, s * 0.4);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.96)');
          grad.addColorStop(1, 'rgba(232, 244, 255, 0.9)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(-s * 0.75, s * 0.05, s * 0.48, 0, Math.PI * 2);
          ctx.arc(-s * 0.22, -s * 0.18, s * 0.62, 0, Math.PI * 2);
          ctx.arc(s * 0.4, -s * 0.1, s * 0.55, 0, Math.PI * 2);
          ctx.arc(s * 0.88, s * 0.08, s * 0.42, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawTree(x, y, scale, swayOffset) {
        const sway = Math.sin(state.time * 1.4 + swayOffset) * 4 * scale;
        ctx.save();
        ctx.translate(x, y);

        // Trunk
        ctx.fillStyle = '#5a3d28';
        ctx.beginPath();
        ctx.moveTo(-10 * scale, 0);
        ctx.lineTo(-6 * scale + sway * 0.25, -56 * scale);
        ctx.lineTo(6 * scale + sway * 0.25, -56 * scale);
        ctx.lineTo(12 * scale, 0);
        ctx.closePath();
        ctx.fill();

        // Deep canopy shadow
        ctx.fillStyle = '#245e27';
        ctx.beginPath();
        ctx.arc(-22 * scale + sway * 0.7, -64 * scale, 26 * scale, 0, Math.PI * 2);
        ctx.arc(22 * scale + sway * 0.7, -60 * scale, 24 * scale, 0, Math.PI * 2);
        ctx.arc(sway, -88 * scale, 32 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Mid sunlit canopy
        ctx.fillStyle = '#388535';
        ctx.beginPath();
        ctx.arc(-16 * scale + sway * 0.85, -72 * scale, 22 * scale, 0, Math.PI * 2);
        ctx.arc(16 * scale + sway * 0.85, -68 * scale, 20 * scale, 0, Math.PI * 2);
        ctx.arc(sway * 1.05, -94 * scale, 26 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Top leaf highlight
        ctx.fillStyle = '#59ab46';
        ctx.beginPath();
        ctx.arc(-6 * scale + sway, -100 * scale, 15 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawLandscape() {
        const hy = layout.horizonY;

        // Distant rolling hills
        const farHillGrad = ctx.createLinearGradient(0, hy - 55, 0, hy + 80);
        farHillGrad.addColorStop(0, '#6bb359');
        farHillGrad.addColorStop(1, '#4d9142');
        ctx.fillStyle = farHillGrad;
        ctx.beginPath();
        ctx.moveTo(0, hy + 18);
        ctx.quadraticCurveTo(W * 0.18, hy - 44, W * 0.38, hy + 6);
        ctx.quadraticCurveTo(W * 0.62, hy - 38, W * 0.82, hy - 8);
        ctx.quadraticCurveTo(W * 0.92, hy - 22, W, hy + 8);
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.closePath();
        ctx.fill();

        // Midground sunlit meadow
        const meadowGrad = ctx.createLinearGradient(0, hy, 0, H);
        meadowGrad.addColorStop(0, '#5fb043');
        meadowGrad.addColorStop(0.5, '#469132');
        meadowGrad.addColorStop(1, '#2f6e24');
        ctx.fillStyle = meadowGrad;
        ctx.beginPath();
        ctx.moveTo(0, hy + 42);
        ctx.quadraticCurveTo(W * 0.25, hy + 10, W * 0.5, hy + 36);
        ctx.quadraticCurveTo(W * 0.78, hy + 12, W, hy + 38);
        ctx.lineTo(W, H);
        ctx.lineTo(0, H);
        ctx.closePath();
        ctx.fill();

        // Background trees framing the castle (strictly BEHIND the castle)
        const treeScale = Math.min(W, H) / 680;
        drawTree(W * 0.05, hy + H * 0.11, treeScale * 1.18, 0.2);
        drawTree(W * 0.14, hy + H * 0.08, treeScale * 0.88, 1.4);
        drawTree(W * 0.86, hy + H * 0.09, treeScale * 0.92, 2.3);
        drawTree(W * 0.95, hy + H * 0.13, treeScale * 1.22, 3.6);

        // Winding sunlit dirt/cobblestone road in front of the castle
        const roadY = H * 0.85;
        const roadGrad = ctx.createLinearGradient(0, roadY - 28, 0, roadY + 46);
        roadGrad.addColorStop(0, '#c8b08a');
        roadGrad.addColorStop(0.55, '#b1966d');
        roadGrad.addColorStop(1, '#8c7450');
        ctx.fillStyle = roadGrad;
        ctx.beginPath();
        ctx.moveTo(0, roadY + 6);
        ctx.quadraticCurveTo(W * 0.35, roadY - 18, W * 0.55, roadY - 6);
        ctx.quadraticCurveTo(W * 0.78, roadY + 6, W, roadY - 8);
        ctx.lineTo(W, roadY + 48);
        ctx.quadraticCurveTo(W * 0.75, roadY + 56, W * 0.5, roadY + 40);
        ctx.quadraticCurveTo(W * 0.25, roadY + 30, 0, roadY + 52);
        ctx.closePath();
        ctx.fill();
      }

      /* Lush green bushes, ferns, flowers & pebbles drawn IN FRONT OF the castle walls */
      function drawCastleForegroundBushes() {
        const baseY = layout.castleY + layout.castleH;
        const scale = Math.min(W, H) / 760;

        for (const b of castleBushes) {
          const bx = layout.castleX + b.relX * layout.castleW;
          const by = baseY + b.yOff * scale;
          const r = b.r * scale;
          const sway = Math.sin(state.time * 1.9 + b.phase) * 2.2 * scale;

          ctx.save();
          ctx.translate(bx, by);

          // Soft contact shadow on ground
          ctx.fillStyle = 'rgba(18, 42, 14, 0.32)';
          ctx.beginPath();
          ctx.ellipse(0, r * 0.12, r * 1.25, r * 0.28, 0, 0, Math.PI * 2);
          ctx.fill();

          // Fern fronds peeking behind/beside bush
          ctx.strokeStyle = '#256124';
          ctx.lineWidth = 2.4 * scale;
          [-1, 1].forEach(dir => {
            ctx.beginPath();
            ctx.moveTo(dir * r * 0.65, 0);
            ctx.quadraticCurveTo(dir * r * 1.15 + sway, -r * 0.5, dir * r * 1.35 + sway, -r * 0.85);
            ctx.stroke();
          });

          // Deep back foliage layer
          ctx.fillStyle = '#245e25';
          ctx.beginPath();
          ctx.arc(-r * 0.45 + sway * 0.4, -r * 0.22, r * 0.78, 0, Math.PI * 2);
          ctx.arc(r * 0.48 + sway * 0.4, -r * 0.2, r * 0.74, 0, Math.PI * 2);
          ctx.arc(sway * 0.5, -r * 0.52, r * 0.88, 0, Math.PI * 2);
          ctx.fill();

          // Mid-tone sunlit bush puffs
          ctx.fillStyle = '#368233';
          ctx.beginPath();
          ctx.arc(-r * 0.35 + sway * 0.6, -r * 0.36, r * 0.62, 0, Math.PI * 2);
          ctx.arc(r * 0.34 + sway * 0.6, -r * 0.32, r * 0.58, 0, Math.PI * 2);
          ctx.arc(sway * 0.7, -r * 0.62, r * 0.66, 0, Math.PI * 2);
          ctx.fill();

          // Bright leaf highlights
          ctx.fillStyle = '#53a845';
          ctx.beginPath();
          ctx.arc(-r * 0.22 + sway * 0.8, -r * 0.68, r * 0.36, 0, Math.PI * 2);
          ctx.arc(r * 0.18 + sway * 0.8, -r * 0.5, r * 0.3, 0, Math.PI * 2);
          ctx.fill();

          // Little blossoms on the bushes
          for (const fl of b.flowerList) {
            ctx.fillStyle = fl.c;
            ctx.beginPath();
            ctx.arc(fl.ox * scale + sway * 0.7, fl.oy * scale, 3.2 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffd94d';
            ctx.beginPath();
            ctx.arc(fl.ox * scale + sway * 0.7, fl.oy * scale, 1.2 * scale, 0, Math.PI * 2);
            ctx.fill();
          }

          // Small decorative garden pebbles at the base of the bush
          ctx.fillStyle = '#7e7870';
          ctx.beginPath();
          ctx.ellipse(-r * 0.7, r * 0.08, 6 * scale, 3.5 * scale, 0.1, 0, Math.PI * 2);
          ctx.ellipse(r * 0.65, r * 0.1, 5 * scale, 3 * scale, -0.15, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      function drawForegroundMeadow() {
        // Swaying grass blades & wildflowers in the foreground
        for (const g of grassBlades) {
          const gx = g.x * W;
          const gy = g.y * H;
          // Keep road slightly clearer
          if (gy > H * 0.81 && gy < H * 0.90) continue;
          const sway = Math.sin(state.time * 2.4 + g.phase) * 4.5;
          ctx.strokeStyle = g.shade > 0.5 ? '#3d8a2d' : '#58a83e';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(gx, gy);
          ctx.quadraticCurveTo(gx + sway * 0.5, gy - g.h * 0.6, gx + sway, gy - g.h);
          ctx.stroke();
        }

        for (const f of wildflowers) {
          const fx = f.x * W;
          const fy = f.y * H;
          if (fy > H * 0.81 && fy < H * 0.90) continue;
          const sway = Math.sin(state.time * 2.2 + f.phase) * 3;
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.arc(fx + sway, fy, f.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPennant(x, y, scale, color) {
        const wave1 = Math.sin(state.time * 6.5) * 6 * scale;
        const wave2 = Math.sin(state.time * 6.5 - 1.4) * 10 * scale;
        ctx.save();
        ctx.translate(x, y);
        // Pole
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2.5 * scale;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -34 * scale);
        ctx.stroke();

        // Fluttering flag
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -33 * scale);
        ctx.quadraticCurveTo(18 * scale, -33 * scale + wave1, 36 * scale, -27 * scale + wave2);
        ctx.lineTo(28 * scale, -22 * scale + wave2 * 0.8);
        ctx.lineTo(36 * scale, -17 * scale + wave2);
        ctx.quadraticCurveTo(18 * scale, -18 * scale + wave1, 0, -17 * scale);
        ctx.closePath();
        ctx.fill();

        // Gold finial
        ctx.fillStyle = '#ffd966';
        ctx.beginPath();
        ctx.arc(0, -35 * scale, 3.2 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCastle() {
        const { castleX: cx, castleY: cy, castleW: cw, castleH: ch, wingW, wingH } = layout;
        const towerW = cw * 0.20;
        const towerH = ch * 0.90;
        const keepX = cx + towerW * 0.62;
        const keepW = cw - towerW * 1.24;
        const keepY = cy + ch * 0.08;
        const keepH = ch * 0.92;
        const baseY = cy + ch;

        // Ground shadow beneath entire castle complex (including wings)
        ctx.fillStyle = 'rgba(20, 40, 15, 0.34)';
        ctx.beginPath();
        ctx.ellipse(cx + cw * 0.5, baseY + 5, cw * 0.56 + wingW * 1.12, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        // Helper to draw textured stone wall
        function drawStoneRect(x, y, w, h, baseLight, baseDark) {
          const grad = ctx.createLinearGradient(x, y, x + w, y);
          grad.addColorStop(0, baseLight);
          grad.addColorStop(0.65, baseDark);
          grad.addColorStop(1, '#5d5955');
          ctx.fillStyle = grad;
          ctx.fillRect(x, y, w, h);

          // Subtle brick masonry lines
          ctx.strokeStyle = 'rgba(45, 40, 36, 0.25)';
          ctx.lineWidth = 1.2;
          const rows = Math.max(5, Math.floor(h / 24));
          const rowH = h / rows;
          for (let r = 1; r < rows; r++) {
            const ry = y + r * rowH;
            ctx.beginPath();
            ctx.moveTo(x, ry);
            ctx.lineTo(x + w, ry);
            ctx.stroke();

            const cols = Math.max(2, Math.floor(w / 40));
            const colW = w / cols;
            const offset = (r % 2) * (colW * 0.5);
            for (let c = 0; c <= cols; c++) {
              const bx = x + c * colW + offset;
              if (bx > x + 4 && bx < x + w - 4) {
                ctx.beginPath();
                ctx.moveTo(bx, ry - rowH);
                ctx.lineTo(bx, ry);
                ctx.stroke();
              }
            }
          }
        }

        // Helper to draw small arched arrow-slit window
        function drawArchedSlit(x, y, w, h) {
          ctx.fillStyle = '#2d2926';
          ctx.beginPath();
          ctx.arc(x + w * 0.5, y + w * 0.5, w * 0.5, Math.PI, 0);
          ctx.lineTo(x + w, y + h);
          ctx.lineTo(x, y + h);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#635d55';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Helper to draw conical slate-blue tower roof with gold rim & pennant
        function drawRoof(tx, ty, tw, roofScale = 0.82, flagColor = '#c92a2a') {
          const roofH = tw * roofScale;
          const rGrad = ctx.createLinearGradient(tx, ty - roofH, tx + tw, ty);
          rGrad.addColorStop(0, '#446596');
          rGrad.addColorStop(0.55, '#294063');
          rGrad.addColorStop(1, '#18273e');
          ctx.fillStyle = rGrad;
          ctx.beginPath();
          ctx.moveTo(tx - tw * 0.12, ty + 4);
          ctx.lineTo(tx + tw * 0.5, ty - roofH);
          ctx.lineTo(tx + tw * 1.12, ty + 4);
          ctx.closePath();
          ctx.fill();

          // Slate roof shingle lines
          ctx.strokeStyle = 'rgba(180, 205, 240, 0.14)';
          ctx.lineWidth = 1.2;
          for (let i = 1; i <= 3; i++) {
            const frac = i / 4;
            const ry = ty - roofH * (1 - frac);
            const hw = (tw * 0.62) * frac;
            ctx.beginPath();
            ctx.moveTo(tx + tw * 0.5 - hw, ry);
            ctx.lineTo(tx + tw * 0.5 + hw, ry);
            ctx.stroke();
          }

          // Gold rim trim
          ctx.strokeStyle = '#c9a050';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(tx - tw * 0.12, ty + 4);
          ctx.lineTo(tx + tw * 1.12, ty + 4);
          ctx.stroke();

          drawPennant(tx + tw * 0.5, ty - roofH + 2, Math.min(1.05, tw / 85), flagColor);
        }

        // =====================================================================
        // LEFT & RIGHT ARCHITECTURAL CASTLE WINGS (ПРИБУДОВИ ПО КРАЯХ)
        // =====================================================================
        const wingY = baseY - wingH;
        const outerTurretW = wingW * 0.48;
        const outerTurretH = wingH * 1.18;
        const outerTurretY = baseY - outerTurretH;

        // --- LEFT WING ---
        const leftWingX = cx - wingW + 10;
        drawStoneRect(leftWingX, wingY, wingW, wingH, '#918b81', '#736d65');
        // Left wing battlements
        const lwBatts = 4;
        const lwBattW = (wingW - outerTurretW * 0.5) / (lwBatts * 2 - 1);
        ctx.fillStyle = '#8b857b';
        for (let i = 0; i < lwBatts; i++) {
          ctx.fillRect(leftWingX + outerTurretW * 0.4 + i * lwBattW * 2, wingY - 14, lwBattW + 1, 16);
        }
        // Left wing arched window & sloped stone buttress (контрфорс)
        drawArchedSlit(leftWingX + wingW * 0.54, wingY + wingH * 0.22, wingW * 0.14, wingH * 0.24);
        ctx.fillStyle = '#7c766d';
        ctx.beginPath();
        ctx.moveTo(leftWingX + wingW * 0.34, wingY + wingH * 0.42);
        ctx.lineTo(leftWingX + wingW * 0.44, wingY + wingH * 0.42);
        ctx.lineTo(leftWingX + wingW * 0.46, baseY);
        ctx.lineTo(leftWingX + wingW * 0.26, baseY);
        ctx.closePath();
        ctx.fill();

        // Left outer turret with conical roof & pennant
        const leftTurretX = leftWingX - outerTurretW * 0.45;
        drawStoneRect(leftTurretX, outerTurretY, outerTurretW, outerTurretH, '#9b958b', '#756f66');
        drawArchedSlit(leftTurretX + outerTurretW * 0.38, outerTurretY + outerTurretH * 0.25, outerTurretW * 0.24, outerTurretH * 0.18);
        drawRoof(leftTurretX, outerTurretY, outerTurretW, 0.92, '#2b6cb0');

        // --- RIGHT WING ---
        const rightWingX = cx + cw - 10;
        drawStoneRect(rightWingX, wingY, wingW, wingH, '#8d877d', '#6b655d');
        // Right wing battlements (perch platform for the big dragon!)
        ctx.fillStyle = '#827c73';
        for (let i = 0; i < lwBatts; i++) {
          ctx.fillRect(rightWingX + 6 + i * lwBattW * 2, wingY - 14, lwBattW + 1, 16);
        }
        // Right wing arched window & stone buttress
        drawArchedSlit(rightWingX + wingW * 0.32, wingY + wingH * 0.22, wingW * 0.14, wingH * 0.24);
        ctx.fillStyle = '#736d64';
        ctx.beginPath();
        ctx.moveTo(rightWingX + wingW * 0.56, wingY + wingH * 0.42);
        ctx.lineTo(rightWingX + wingW * 0.66, wingY + wingH * 0.42);
        ctx.lineTo(rightWingX + wingW * 0.74, baseY);
        ctx.lineTo(rightWingX + wingW * 0.54, baseY);
        ctx.closePath();
        ctx.fill();

        // Right outer turret with conical roof & pennant
        const rightTurretX = rightWingX + wingW - outerTurretW * 0.55;
        drawStoneRect(rightTurretX, outerTurretY, outerTurretW, outerTurretH, '#938d83', '#6c665e');
        drawArchedSlit(rightTurretX + outerTurretW * 0.38, outerTurretY + outerTurretH * 0.25, outerTurretW * 0.24, outerTurretH * 0.18);
        drawRoof(rightTurretX, outerTurretY, outerTurretW, 0.92, '#c92a2a');

        // =====================================================================
        // INNER TOWERS & MAIN CENTRAL CASTLE KEEP
        // =====================================================================
        const leftTowerX = cx;
        const rightTowerX = cx + cw - towerW;
        const towerY = baseY - towerH;

        drawStoneRect(leftTowerX, towerY, towerW, towerH, '#9b958b', '#7b756c');
        drawStoneRect(rightTowerX, towerY, towerW, towerH, '#948e84', '#706a62');

        drawRoof(leftTowerX, towerY, towerW, 0.76, '#c92a2a');
        drawRoof(rightTowerX, towerY, towerW, 0.76, '#2b6cb0');

        // Main Central Castle Keep
        drawStoneRect(keepX, keepY, keepW, keepH, '#aba499', '#878076');

        // Keep Battlements / Crenellations
        const kBatts = 7;
        const kBattW = keepW / (kBatts * 2 - 1);
        for (let i = 0; i < kBatts; i++) {
          const bx = keepX + i * kBattW * 2;
          ctx.fillStyle = '#9c958a';
          ctx.fillRect(bx, keepY - 20, kBattW + 2, 22);
          ctx.strokeStyle = 'rgba(40,35,30,0.35)';
          ctx.strokeRect(bx, keepY - 20, kBattW + 2, 22);
        }

        // Climbing Ivy on Castle Keep Edges
        ctx.save();
        ctx.strokeStyle = '#2d6329';
        ctx.lineWidth = 3;
        const drawIvy = (startX, dir) => {
          ctx.beginPath();
          ctx.moveTo(startX, keepY + keepH);
          for (let y = keepY + keepH; y > keepY + keepH * 0.25; y -= 22) {
            const wx = startX + dir * (10 + Math.sin(y * 0.06) * 8);
            ctx.lineTo(wx, y);
            ctx.fillStyle = (Math.floor(y) % 2 === 0) ? '#3d8237' : '#2c6628';
            ctx.beginPath();
            ctx.ellipse(wx + dir * 6, y, 6, 3.5, dir * 0.4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.stroke();
        };
        drawIvy(keepX + 8, 1);
        drawIvy(keepX + keepW - 8, -1);
        ctx.restore();

        // Grand Arched Castle Gate at the bottom center
        const gateW = keepW * 0.30;
        const gateH = keepH * 0.19;
        const gateX = keepX + (keepW - gateW) * 0.5;
        const gateY = keepY + keepH - gateH;

        ctx.fillStyle = '#69635b';
        ctx.beginPath();
        ctx.arc(gateX + gateW * 0.5, gateY + gateW * 0.36, gateW * 0.56, Math.PI, 0);
        ctx.lineTo(gateX + gateW * 1.06, gateY + gateH);
        ctx.lineTo(gateX - gateW * 0.06, gateY + gateH);
        ctx.closePath();
        ctx.fill();

        const doorGrad = ctx.createLinearGradient(gateX, gateY, gateX + gateW, gateY);
        doorGrad.addColorStop(0, '#593720');
        doorGrad.addColorStop(0.5, '#6e4528');
        doorGrad.addColorStop(1, '#472a17');
        ctx.fillStyle = doorGrad;
        ctx.beginPath();
        ctx.arc(gateX + gateW * 0.5, gateY + gateW * 0.36, gateW * 0.48, Math.PI, 0);
        ctx.lineTo(gateX + gateW * 0.98, gateY + gateH);
        ctx.lineTo(gateX + gateW * 0.02, gateY + gateH);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#291a10';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gateX + gateW * 0.5, gateY);
        ctx.lineTo(gateX + gateW * 0.5, gateY + gateH);
        ctx.stroke();

        // Firelight glow cast on castle when dragon breathes fire
        if (state.castleGlow > 0.01) {
          ctx.save();
          const glowGrad = ctx.createRadialGradient(
            layout.dragonX - 60, layout.dragonY + 20, 20,
            cx + cw * 0.5, cy + ch * 0.4, cw * 0.95
          );
          glowGrad.addColorStop(0, `rgba(255, 130, 30, ${0.44 * state.castleGlow})`);
          glowGrad.addColorStop(1, 'rgba(255, 90, 10, 0)');
          ctx.fillStyle = glowGrad;
          ctx.fillRect(cx - wingW - 40, cy - 50, cw + wingW * 2 + 80, ch + 60);
          ctx.restore();
        }
      }

      /* =====================================================================
         10. WINDOW INTERIOR, PRINCESS & 4x4 BRICKED STONES
      ===================================================================== */
      function drawPrincessFigure(x, y, scale, isWaving, happyLevel) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const breathe = Math.sin(state.time * 2.8) * 1.6;
        const excitedBob = happyLevel > 0.5 ? Math.abs(Math.sin(state.time * 5.2)) * -3.5 * happyLevel : 0;
        ctx.translate(0, breathe + excitedBob);

        // Flowing golden-auburn hair (back layer)
        ctx.fillStyle = '#d98a2b';
        ctx.beginPath();
        ctx.ellipse(0, -14, 34, 42, 0, 0, Math.PI * 2);
        ctx.fill();

        // Royal Rose-Crimson Gown & Gold Trim
        const gownGrad = ctx.createLinearGradient(0, 14, 0, 76);
        gownGrad.addColorStop(0, '#d63e6c');
        gownGrad.addColorStop(1, '#991f48');
        ctx.fillStyle = gownGrad;
        ctx.beginPath();
        ctx.moveTo(-22, 18);
        ctx.quadraticCurveTo(-38, 45, -44, 78);
        ctx.lineTo(44, 78);
        ctx.quadraticCurveTo(38, 45, 22, 18);
        ctx.closePath();
        ctx.fill();

        // Gold bodice detail
        ctx.strokeStyle = '#ffd966';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-14, 22);
        ctx.lineTo(0, 44);
        ctx.lineTo(14, 22);
        ctx.stroke();

        // Puffy sleeves
        ctx.fillStyle = '#eb5e88';
        ctx.beginPath();
        ctx.arc(-23, 26, 11, 0, Math.PI * 2);
        ctx.arc(23, 26, 11, 0, Math.PI * 2);
        ctx.fill();

        // Waving right arm when stones are cleared
        if (isWaving) {
          const waveAngle = Math.sin(state.time * 8) * 0.35;
          ctx.save();
          ctx.translate(24, 24);
          ctx.rotate(-0.9 + waveAngle);
          ctx.strokeStyle = '#ffe0c2';
          ctx.lineWidth = 7.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(24, -14);
          ctx.stroke();
          // Hand
          ctx.fillStyle = '#ffe0c2';
          ctx.beginPath();
          ctx.arc(26, -15, 5.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Neck
        ctx.fillStyle = '#f7cfa8';
        ctx.fillRect(-7, 6, 14, 15);

        // Head
        ctx.fillStyle = '#ffe0c2';
        ctx.beginPath();
        ctx.arc(0, -14, 24, 0, Math.PI * 2);
        ctx.fill();

        // Rosy cheeks
        ctx.fillStyle = 'rgba(242, 116, 140, 0.42)';
        ctx.beginPath();
        ctx.ellipse(-13, -8, 5.5, 3.2, 0, 0, Math.PI * 2);
        ctx.ellipse(13, -8, 5.5, 3.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Expressive Blinking Eyes
        const blink = (state.time % 3.8) > 3.65;
        if (blink) {
          ctx.strokeStyle = '#3b2416';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(-9, -15, 4.5, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(9, -15, 4.5, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.stroke();
        } else {
          // Eye whites & royal blue irises
          [-9, 9].forEach(ex => {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(ex, -15, 5.2, 5.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2d6ea8';
            ctx.beginPath();
            ctx.arc(ex, -14.8, 3.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#151c24';
            ctx.beginPath();
            ctx.arc(ex, -14.8, 1.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ex - 1.3, -16.2, 1.3, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        // Smile (grows wider as stones are removed)
        ctx.strokeStyle = '#b84258';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, -6, 6 + happyLevel * 2.5, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        // Front Hair Bangs
        ctx.fillStyle = '#e89c38';
        ctx.beginPath();
        ctx.arc(0, -18, 25, Math.PI * 1.05, Math.PI * 1.95);
        ctx.quadraticCurveTo(8, -22, 0, -28);
        ctx.quadraticCurveTo(-12, -22, -24, -15);
        ctx.closePath();
        ctx.fill();

        // Golden Tiara / Crown with Ruby Gem
        ctx.fillStyle = '#ffd24d';
        ctx.strokeStyle = '#b88214';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-15, -34);
        ctx.lineTo(-18, -48);
        ctx.lineTo(-7, -41);
        ctx.lineTo(0, -53);
        ctx.lineTo(7, -41);
        ctx.lineTo(18, -48);
        ctx.lineTo(15, -34);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Center gem
        ctx.fillStyle = '#e0245e';
        ctx.beginPath();
        ctx.arc(0, -40, 3.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawWindowAndStones() {
        const { winX: wx, winY: wy, winW: ww, winH: wh } = layout;

        // Ornate Gothic Stone Window Frame
        ctx.save();
        const framePad = 12;
        ctx.fillStyle = '#5c564e';
        ctx.beginPath();
        ctx.roundRect(wx - framePad, wy - framePad, ww + framePad * 2, wh + framePad * 2, [22, 22, 8, 8]);
        ctx.fill();
        ctx.strokeStyle = '#3b3630';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Clip interior of window
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(wx, wy, ww, wh, [14, 14, 4, 4]);
        ctx.clip();

        // Warm royal chamber interior backdrop
        const roomGrad = ctx.createRadialGradient(
          wx + ww * 0.5, wy + wh * 0.42, ww * 0.08,
          wx + ww * 0.5, wy + wh * 0.5, ww * 0.72
        );
        roomGrad.addColorStop(0, '#fff0c4');
        roomGrad.addColorStop(0.5, '#e8b36b');
        roomGrad.addColorStop(1, '#6e3d28');
        ctx.fillStyle = roomGrad;
        ctx.fillRect(wx, wy, ww, wh);

        // Royal crimson velvet drapes on left and right of window
        ctx.fillStyle = '#8c1d35';
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.lineTo(wx + ww * 0.22, wy);
        ctx.quadraticCurveTo(wx + ww * 0.14, wy + wh * 0.5, wx + ww * 0.05, wy + wh);
        ctx.lineTo(wx, wy + wh);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(wx + ww, wy);
        ctx.lineTo(wx + ww * 0.78, wy);
        ctx.quadraticCurveTo(wx + ww * 0.86, wy + wh * 0.5, wx + ww * 0.95, wy + wh);
        ctx.lineTo(wx + ww, wy + wh);
        ctx.closePath();
        ctx.fill();

        // Draw Princess inside the window (balanced scale relative to window & enlarged knight)
        if (state.princessInWindow) {
          const pScale = ww / 172;
          const progress = state.removedCount / 16;
          drawPrincessFigure(
            wx + ww * 0.5,
            wy + wh * 0.58,
            pScale,
            state.removedCount >= 4,
            progress
          );
        }

        // Draw the 4x4 Grid of Bricked-up Syllable Stones
        const appear = state.stoneAppearProgress;
        const fontSize = Math.floor((ww / 4) * 0.46);

        for (let i = 0; i < state.stones.length; i++) {
          const s = state.stones[i];
          if (s.removed) continue;

          const r = getStoneRect(s);
          // Smooth stagger pop-in on reset
          const tileScale = Math.min(1, Math.max(0, (appear * 1.4) - (s.row * 0.08 + s.col * 0.04)));
          if (tileScale <= 0.01) continue;

          ctx.save();
          const cx = r.x + r.w * 0.5;
          const cy = r.y + r.h * 0.5 - s.hoverAnim * 3.5;
          ctx.translate(cx, cy);
          ctx.scale(tileScale * (1 + s.hoverAnim * 0.03), tileScale * (1 + s.hoverAnim * 0.03));

          const hw = r.w * 0.5;
          const hh = r.h * 0.5;

          // Stone base gradient with individual shade/warmth
          const baseR = Math.round(138 + s.shade + s.warmth);
          const baseG = Math.round(132 + s.shade + s.warmth * 0.6);
          const baseB = Math.round(123 + s.shade);
          const darkR = Math.max(40, baseR - 38);
          const darkG = Math.max(40, baseG - 38);
          const darkB = Math.max(40, baseB - 36);

          const stGrad = ctx.createLinearGradient(-hw, -hh, hw, hh);
          stGrad.addColorStop(0, `rgb(${baseR + 18}, ${baseG + 16}, ${baseB + 14})`);
          stGrad.addColorStop(0.55, `rgb(${baseR}, ${baseG}, ${baseB})`);
          stGrad.addColorStop(1, `rgb(${darkR}, ${darkG}, ${darkB})`);

          ctx.fillStyle = stGrad;
          ctx.beginPath();
          ctx.roundRect(-hw, -hh, r.w, r.h, 8);
          ctx.fill();

          // Beveled stone highlight & shadow edges
          ctx.strokeStyle = 'rgba(255, 250, 240, 0.34)';
          ctx.lineWidth = 2;
          ctx.beginPath();
