          ctx.moveTo(-hw + 6, hh - 4);
          ctx.lineTo(-hw + 4, -hh + 6);
          ctx.lineTo(hw - 6, -hh + 4);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(30, 26, 22, 0.58)';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(hw - 4, -hh + 6);
          ctx.lineTo(hw - 4, hh - 6);
          ctx.lineTo(-hw + 6, hh - 4);
          ctx.stroke();

          // Subtle crack line for medieval realism
          if (s.crackSeed > 0.45) {
            ctx.strokeStyle = 'rgba(42, 37, 33, 0.36)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-hw + 6, -hh + r.h * 0.28);
            ctx.lineTo(-hw + r.w * 0.22, -hh + r.h * 0.36);
            ctx.lineTo(-hw + r.w * 0.16, -hh + r.h * 0.48);
            ctx.stroke();
          }

          // Subtle moss patch on some stones
          if (s.hasMoss) {
            ctx.fillStyle = 'rgba(72, 118, 52, 0.55)';
            const mx = (s.mossCorner % 2 === 0 ? -hw + 8 : hw - 10);
            const my = (s.mossCorner < 2 ? -hh + 7 : hh - 7);
            ctx.beginPath();
            ctx.ellipse(mx, my, 8, 4.5, 0.3, 0, Math.PI * 2);
            ctx.fill();
          }

          // Golden rim glow on hover
          if (s.hoverAnim > 0.02) {
            ctx.strokeStyle = `rgba(255, 220, 105, ${0.9 * s.hoverAnim})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-hw + 1, -hh + 1, r.w - 2, r.h - 2, 8);
            ctx.stroke();
          }

          // VERY LARGE, BOLD, HIGH-CONTRAST SYLLABLE TEXT (Arial)
          ctx.font = `900 ${fontSize}px Arial, Helvetica, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          // Deep carved outline/shadow for crystal-clear readability
          ctx.lineWidth = Math.max(4, fontSize * 0.14);
          ctx.strokeStyle = '#241b14';
          ctx.lineJoin = 'round';
          ctx.strokeText(s.syllable, 0, 2);

          // Crisp warm ivory-gold fill
          ctx.fillStyle = s.hoverAnim > 0.3 ? '#fff3b0' : '#fff8e7';
          ctx.fillText(s.syllable, 0, 1);

          ctx.restore();
        }

        ctx.restore(); // end clip
        ctx.restore();
      }

      /* =====================================================================
         11. SCARY GUARDIAN DRAGON (PERCHED ON RIGHT TURRET)
      ===================================================================== */
      function drawDragon() {
        const dx = layout.dragonX + state.dragonEscapeX;
        const dy = layout.dragonY + state.dragonEscapeY;
        const sc = layout.dragonScale;
        const rage = state.dragonRage;
        const fleeing = (state.phase === 'VICTORY_CELEBRATE' || state.phase === 'VICTORY_MOUNT');

        ctx.save();
        ctx.translate(dx, dy);
        // If fleeing, flip to fly right & bob wildly
        if (fleeing) {
          ctx.scale(-sc, sc);
          ctx.translate(0, Math.sin(state.time * 18) * 10);
        } else {
          ctx.scale(sc, sc);
        }

        const flapSpeed = fleeing ? 18 : (rage > 0.1 ? 13 : 3.2);
        const wingFlap = Math.sin(state.time * flapSpeed) * (fleeing ? 0.55 : (0.18 + rage * 0.35));
        const headShake = rage > 0.1 ? Math.sin(state.time * 32) * 4 * rage : Math.sin(state.time * 2.2) * 2;
        const tailWave = Math.sin(state.time * 3.5) * 12;

        // Back Leathery Wing
        ctx.save();
        ctx.translate(6, -16);
        ctx.rotate(-0.3 + wingFlap * 0.85);
        ctx.fillStyle = '#521515';
        ctx.strokeStyle = '#2b0909';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(42, -56);
        ctx.lineTo(78, -32);
        ctx.quadraticCurveTo(54, -18, 48, 0);
        ctx.quadraticCurveTo(28, -14, 18, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Spiked Swaying Tail
        ctx.save();
        ctx.strokeStyle = '#731d1d';
        ctx.lineWidth = 13;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(22, 18);
        ctx.quadraticCurveTo(64, 34 + tailWave * 0.5, 84, 8 + tailWave);
        ctx.stroke();
        // Tail barb
        ctx.fillStyle = '#2e0b0b';
        ctx.beginPath();
        ctx.moveTo(80, 6 + tailWave);
        ctx.lineTo(98, 2 + tailWave);
        ctx.lineTo(84, 18 + tailWave);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Muscular Scaly Body
        const bodyGrad = ctx.createLinearGradient(-15, -25, 30, 35);
        bodyGrad.addColorStop(0, '#9e2620');
        bodyGrad.addColorStop(0.6, '#6e1717');
        bodyGrad.addColorStop(1, '#3d0c0c');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(8, 10, 34, 24, -0.25, 0, Math.PI * 2);
        ctx.fill();

        // Ribbed Armored Belly Plates
        ctx.fillStyle = '#c98838';
        ctx.beginPath();
        ctx.ellipse(-4, 16, 18, 13, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // Claws gripping the battlements
        ctx.fillStyle = '#291a16';
        [-10, 14].forEach(cx => {
          ctx.beginPath();
          ctx.moveTo(cx, 28);
          ctx.lineTo(cx - 8, 38);
          ctx.lineTo(cx - 2, 34);
          ctx.lineTo(cx + 3, 39);
          ctx.lineTo(cx + 7, 30);
          ctx.closePath();
          ctx.fill();
        });

        // Curved Neck & Fierce Head
        ctx.save();
        ctx.translate(-18, -8 + headShake);
        ctx.rotate(rage * 0.14);

        // Neck
        ctx.strokeStyle = '#871f1a';
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(14, 10);
        ctx.quadraticCurveTo(-4, -8, -22, -4);
        ctx.stroke();

        // Dorsal spines along neck
        ctx.fillStyle = '#e0a543';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(8 - i * 8, -2 - i * 2);
          ctx.lineTo(4 - i * 8, -14 - i * 2);
          ctx.lineTo(-2 - i * 8, -4 - i * 2);
          ctx.closePath();
          ctx.fill();
        }

        // Dragon Snout & Upper Jaw
        ctx.fillStyle = '#9e2620';
        ctx.beginPath();
        ctx.moveTo(-16, -15);
        ctx.lineTo(-54, -8);
        ctx.lineTo(-52, 4);
        ctx.lineTo(-14, 2);
        ctx.closePath();
        ctx.fill();

        // Lower Jaw (opens wide when breathing fire!)
        const jawOpen = state.dragonFireTimer > 0 ? 0.42 : (0.06 + rage * 0.25);
        ctx.save();
        ctx.translate(-18, 2);
        ctx.rotate(-jawOpen);
        ctx.fillStyle = '#751814';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-32, 6);
        ctx.lineTo(-28, 13);
        ctx.lineTo(4, 9);
        ctx.closePath();
        ctx.fill();
        // Sharp lower fangs
        ctx.fillStyle = '#fff5e0';
        ctx.beginPath();
        ctx.moveTo(-26, 5); ctx.lineTo(-23, -2); ctx.lineTo(-20, 4);
        ctx.moveTo(-16, 4); ctx.lineTo(-13, -2); ctx.lineTo(-10, 3);
        ctx.fill();
        ctx.restore();

        // Upper fangs
        ctx.fillStyle = '#fff5e0';
        ctx.beginPath();
        ctx.moveTo(-48, 3); ctx.lineTo(-45, 11); ctx.lineTo(-42, 3);
        ctx.moveTo(-36, 3); ctx.lineTo(-33, 10); ctx.lineTo(-30, 3);
        ctx.fill();

        // Curved Horns
        ctx.fillStyle = '#2e221d';
        ctx.beginPath();
        ctx.moveTo(-18, -14);
        ctx.quadraticCurveTo(-4, -34, 12, -32);
        ctx.quadraticCurveTo(0, -24, -10, -10);
        ctx.closePath();
        ctx.fill();

        // Glowing Fierce Eye (flashes bright fiery orange/yellow when angry)
        ctx.fillStyle = rage > 0.15 ? '#fff066' : '#ff9914';
        ctx.beginPath();
        ctx.ellipse(-28, -9, 5.5, 3.6, 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a0505';
        ctx.fillRect(-29, -12, 2, 6);

        ctx.restore(); // end head

        // Front Leathery Wing
        ctx.save();
        ctx.translate(14, -8);
        ctx.rotate(0.15 - wingFlap);
        const wGrad = ctx.createLinearGradient(0, -50, 70, 20);
        wGrad.addColorStop(0, '#85201c');
        wGrad.addColorStop(1, '#471010');
        ctx.fillStyle = wGrad;
        ctx.strokeStyle = '#290909';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(36, -64);
        ctx.lineTo(86, -34);
        ctx.quadraticCurveTo(60, -14, 58, 12);
        ctx.quadraticCurveTo(36, -6, 28, 18);
        ctx.quadraticCurveTo(12, 4, 0, 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        ctx.restore();
      }

      /* =====================================================================
         12. KNIGHT ON HORSEBACK (+ PRINCESS MOUNTED ON VICTORY)
      ===================================================================== */
      function drawKnightAndHorse() {
        const kx = layout.knightBaseX + state.knightXOffset;
        const ky = layout.knightBaseY;
        const sc = layout.knightScale;

        const isGalloping = (state.phase === 'VICTORY_GALLOP' || state.phase === 'RESETTING');
        const gPhase = state.knightGallopPhase;
        const gallopBounce = isGalloping ? Math.sin(gPhase * 2) * 6 : Math.sin(state.time * 2.4) * 1.4;
        const gallopTilt = isGalloping ? Math.cos(gPhase) * 0.08 : 0;

        ctx.save();
        ctx.translate(kx, ky + gallopBounce);
        ctx.scale(sc, sc);
        ctx.rotate(gallopTilt);

        // Ground Shadow
        ctx.fillStyle = 'rgba(20, 35, 12, 0.34)';
        ctx.beginPath();
        ctx.ellipse(0, 36 - gallopBounce * 0.5, 56, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Animated Horse Legs
        const drawLeg = (ox, oy, angle, color) => {
          ctx.save();
          ctx.translate(ox, oy);
          ctx.rotate(angle);
          ctx.strokeStyle = color;
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, 26);
          ctx.stroke();
          // Hoof
          ctx.fillStyle = '#2e2926';
          ctx.fillRect(-5.5, 24, 11, 7);
          ctx.restore();
        };

        const backLegA = isGalloping ? Math.sin(gPhase) * 0.55 : Math.sin(state.time * 1.5) * 0.04;
        const backLegB = isGalloping ? Math.sin(gPhase + 0.9) * 0.55 : 0;
        const frontLegA = isGalloping ? -Math.sin(gPhase + 0.4) * 0.62 : Math.sin(state.time * 1.8) * 0.06;
        const frontLegB = isGalloping ? -Math.sin(gPhase + 1.3) * 0.62 : -0.04;

        // Far legs
        drawLeg(-28, 6, backLegB, '#c2beb8');
        drawLeg(26, 6, frontLegB, '#c2beb8');

        // Swishing Horse Tail
        const tailSway = Math.sin(state.time * (isGalloping ? 12 : 3.2)) * 10;
        ctx.fillStyle = '#d9d4cc';
        ctx.beginPath();
        ctx.moveTo(-42, -10);
        ctx.quadraticCurveTo(-64, -2 + tailSway * 0.4, -68, 22 + tailSway);
        ctx.quadraticCurveTo(-50, 18 + tailSway * 0.5, -40, 2);
        ctx.closePath();
        ctx.fill();

        // Steed Body (Noble White/Dappled Horse)
        const horseGrad = ctx.createLinearGradient(-45, -24, 45, 16);
        horseGrad.addColorStop(0, '#f5f2ed');
        horseGrad.addColorStop(0.6, '#e2ddd5');
        horseGrad.addColorStop(1, '#c7c0b7');
        ctx.fillStyle = horseGrad;
        ctx.beginPath();
        ctx.ellipse(0, -6, 44, 21, 0, 0, Math.PI * 2);
        ctx.fill();

        // Royal Blue/Gold Caparison Saddle Blanket
        ctx.fillStyle = '#1f4e8c';
        ctx.beginPath();
        ctx.roundRect(-24, -24, 44, 24, 6);
        ctx.fill();
        ctx.strokeStyle = '#f0c450';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-22, -22, 40, 20);

        // Near legs
        drawLeg(-22, 8, backLegA, '#e6e2dc');
        drawLeg(32, 8, frontLegA, '#e6e2dc');

        // Horse Neck & Head (nodding gently)
        const headNod = isGalloping ? Math.sin(gPhase) * 0.12 : Math.sin(state.time * 2.1) * 0.06;
        ctx.save();
        ctx.translate(32, -14);
        ctx.rotate(headNod);

        // Neck
        ctx.fillStyle = '#edeae4';
        ctx.beginPath();
        ctx.moveTo(-10, 12);
        ctx.quadraticCurveTo(4, -24, 16, -38);
        ctx.lineTo(30, -32);
        ctx.quadraticCurveTo(22, -6, 12, 14);
        ctx.closePath();
        ctx.fill();

        // Flowing Mane
        ctx.fillStyle = '#cfcac0';
        ctx.beginPath();
        ctx.moveTo(-4, -10);
        ctx.quadraticCurveTo(2, -26, 14, -38);
        ctx.lineTo(8, -40);
        ctx.quadraticCurveTo(-6, -26, -10, -8);
        ctx.closePath();
        ctx.fill();

        // Horse Head & Muzzle
        ctx.fillStyle = '#f5f2ed';
        ctx.beginPath();
        ctx.moveTo(14, -40);
        ctx.lineTo(44, -26);
        ctx.lineTo(40, -14);
        ctx.lineTo(16, -20);
        ctx.closePath();
        ctx.fill();

        // Ears
        ctx.beginPath();
        ctx.moveTo(16, -38);
        ctx.lineTo(20, -50);
        ctx.lineTo(26, -37);
        ctx.closePath();
        ctx.fill();

        // Bridle & Reins
        ctx.strokeStyle = '#6e3f1d';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(36, -20);
        ctx.lineTo(22, -32);
        ctx.moveTo(36, -18);
        ctx.quadraticCurveTo(10, -8, -16, -16);
        ctx.stroke();

        // Eye
        ctx.fillStyle = '#241b15';
        ctx.beginPath();
        ctx.arc(27, -30, 2.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // If Princess is mounted behind the Knight during victory gallop (proportional to knight!)
        if (state.princessMounted) {
          drawPrincessFigure(-20, -48, 0.64, true, 1.0);
        }

        // Fluttering Crimson Knight Cape
        const capeWave = Math.sin(state.time * (isGalloping ? 14 : 4.5)) * (isGalloping ? 14 : 6);
        ctx.fillStyle = '#bd2222';
        ctx.beginPath();
        ctx.moveTo(-4, -52);
        ctx.quadraticCurveTo(-36, -42 + capeWave * 0.5, -56, -16 + capeWave);
        ctx.lineTo(-42, -6 + capeWave * 0.7);
        ctx.quadraticCurveTo(-22, -24, -2, -34);
        ctx.closePath();
        ctx.fill();

        // Armored Knight Torso
        const armorGrad = ctx.createLinearGradient(-12, -56, 16, -20);
        armorGrad.addColorStop(0, '#dce3eb');
        armorGrad.addColorStop(0.5, '#9ba8b8');
        armorGrad.addColorStop(1, '#616d7a');
        ctx.fillStyle = armorGrad;
        ctx.beginPath();
        ctx.roundRect(-10, -54, 24, 34, 8);
        ctx.fill();

        // Knight Armored Leg in Stirrup
        ctx.fillStyle = '#8b97a6';
        ctx.beginPath();
        ctx.roundRect(-4, -24, 12, 26, 5);
        ctx.fill();

        // Gleaming Raised Sword / Lance (held proudly)
        ctx.save();
        ctx.translate(12, -40);
        ctx.rotate(isGalloping ? -0.35 : -0.55);
        // Hilt
        ctx.fillStyle = '#d4a338';
        ctx.fillRect(-3, -6, 6, 12);
        ctx.fillRect(-9, -8, 18, 4);
        // Steel blade
        ctx.fillStyle = '#eef4fa';
        ctx.beginPath();
        ctx.moveTo(-3.5, -8);
        ctx.lineTo(0, -52);
        ctx.lineTo(3.5, -8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Royal Heraldic Shield
        ctx.fillStyle = '#224c87';
        ctx.strokeStyle = '#ffd24d';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-4, -44);
        ctx.lineTo(14, -44);
        ctx.lineTo(14, -28);
        ctx.quadraticCurveTo(5, -16, -4, -28);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Steel Helmet & Visor
        ctx.fillStyle = '#ced7e0';
        ctx.beginPath();
        ctx.arc(3, -66, 14, 0, Math.PI * 2);
        ctx.fill();
        // Visor slit
        ctx.fillStyle = '#242b33';
        ctx.fillRect(5, -69, 12, 4);

        // Flowing Crimson Helmet Plume
        const plumeWave = Math.sin(state.time * (isGalloping ? 15 : 5)) * 5;
        ctx.fillStyle = '#d92626';
        ctx.beginPath();
        ctx.moveTo(-2, -79);
        ctx.quadraticCurveTo(-20, -90 + plumeWave, -30, -72 + plumeWave);
        ctx.quadraticCurveTo(-16, -72, -4, -73);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawWalkingPrincess() {
        if (state.phase !== 'VICTORY_MOUNT') return;
        // Princess walks gracefully from castle archway over to the knight's horse
        const startX = layout.castleX + layout.castleW * 0.5;
        const startY = layout.castleY + layout.castleH - 22;
        const endX = layout.knightBaseX + 12;
        const endY = layout.knightBaseY - 26;
        const t = state.princessWalkProgress;
        const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        const px = startX + (endX - startX) * ease;
        const py = startY + (endY - startY) * ease - Math.sin(t * Math.PI) * 20;
        drawPrincessFigure(px, py, layout.knightScale * 0.66, true, 1.0);
      }

      function drawAmbientMotes() {
        for (const m of ambientMotes) {
          const mx = m.x * W;
          const my = m.y * H;
          ctx.save();
          ctx.translate(mx, my);
          ctx.fillStyle = m.color;
          if (m.isPetal) {
            ctx.rotate(state.time * 1.5 + m.phase);
            ctx.beginPath();
            ctx.ellipse(0, 0, m.size * 1.4, m.size * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, m.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      /* =====================================================================
         13. PARTICLES RENDERING (FLAMES, SMOKE, DEBRIS, SPARKLES, PETALS)
      ===================================================================== */
      function drawParticles() {
        // Smoke puffs
        for (const sm of smokePuffs) {
          const a = Math.max(0, Math.min(1, sm.life)) * sm.alpha;
          ctx.fillStyle = `${sm.color}${a})`;
          ctx.beginPath();
          ctx.arc(sm.x, sm.y, sm.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Layered Dragon Flames (outer orange -> yellow -> white-hot core)
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const f of flames) {
          const t = Math.max(0, f.life / f.maxLife);
          const grad = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, f.r);
          if (t > 0.65) {
            grad.addColorStop(0, `rgba(255, 255, 220, ${t})`);
            grad.addColorStop(0.45, `rgba(255, 210, 50, ${t * 0.9})`);
            grad.addColorStop(1, 'rgba(255, 80, 10, 0)');
          } else {
            grad.addColorStop(0, `rgba(255, 190, 40, ${t * 0.9})`);
            grad.addColorStop(0.55, `rgba(255, 85, 15, ${t * 0.7})`);
            grad.addColorStop(1, 'rgba(180, 20, 0, 0)');
          }
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Falling Rock Debris
        for (const p of debris) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.moveTo(-p.size * 0.5, -p.size * 0.4);
          ctx.lineTo(p.size * 0.5, -p.size * 0.3);
          ctx.lineTo(p.size * 0.4, p.size * 0.5);
          ctx.lineTo(-p.size * 0.45, p.size * 0.35);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Golden Sparkles
        for (const s of sparkles) {
          const alpha = Math.max(0, s.life / s.maxLife);
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.moveTo(0, -s.size);
          ctx.lineTo(s.size * 0.3, -s.size * 0.3);
          ctx.lineTo(s.size, 0);
          ctx.lineTo(s.size * 0.3, s.size * 0.3);
          ctx.lineTo(0, s.size);
          ctx.lineTo(-s.size * 0.3, s.size * 0.3);
          ctx.lineTo(-s.size, 0);
          ctx.lineTo(-s.size * 0.3, -s.size * 0.3);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Victory Flower Petals
        for (const pt of petals) {
          ctx.save();
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot);
          ctx.globalAlpha = Math.max(0, Math.min(1, pt.life));
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, pt.size, pt.size * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function render() {
        ctx.save();
        ctx.scale(DPR, DPR);

        drawSkyAndSun();
        drawLandscape();
        drawCastle();
        drawWindowAndStones();
        drawCastleForegroundBushes();
        drawDragon();
        drawWalkingPrincess();
        drawKnightAndHorse();
        drawForegroundMeadow();
        drawAmbientMotes();
        drawParticles();

        ctx.restore();
      }

      /* =====================================================================
         14. MAIN ANIMATION LOOP & BOOTSTRAP
      ===================================================================== */
      let lastTimestamp = 0;

      function gameLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;

        update(dt);
        render();
        requestAnimationFrame(gameLoop);
      }

      window.onload = function () {
        initScenery();
        computeLayout();
        updateConsonantUI();
        resetRound(true);
        requestAnimationFrame(gameLoop);
      };
    })();
  </script>
</body>
