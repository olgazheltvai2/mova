          pGrad.addColorStop(1, '#ff94b8');
          ctx.fillStyle = pGrad;
          ctx.strokeStyle = '#b32456';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.ellipse(0, -r * 0.55, r * 0.44, r * 0.58, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
        // Golden stamen center
        ctx.fillStyle = '#ffd32a';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      /* =========================================================================
       * 12. FIVE HIGHLY RECOGNIZABLE REALISTIC-CARTOON CHARACTERS (Letter П)
       *     Panda (ПА), Tomato (ПО), Poodle (ПУ), Vacuum (ПИ/ПЫ), Cookie (ПЕ)
       * ========================================================================= */
      function drawCharacter(ctx, ch, isDiver = false, swimming = false) {
        const kind = CHARACTER_DEFS[ch.id].kind;
        const t = game.time;
        const ph = ch.idlePhase;

        ctx.save();

        // Ground shadow on beach or pier (not when swimming in water)
        if (!swimming) {
          const groundY = isDiver && game.state === 'DIVING' ? WATER_LAND_Y : ch.homeY;
          const lift = Math.max(0, groundY - ch.y);
          const shScale = Math.max(0.3, 1 - lift / 420) * ch.spawnPop;
          if (!isDiver || game.state === 'RUN_TO_PIER') {
            ctx.fillStyle = 'rgba(120, 75, 22, 0.28)';
            ctx.beginPath();
            ctx.ellipse(ch.x, (isDiver ? ch.y : ch.homeY) + 10, 54 * shScale, 14 * shScale, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Hover glow ring on sandy beach
        if (!isDiver && ch.hoverBoost > 0.02) {
          ctx.save();
          ctx.globalAlpha = ch.hoverBoost * 0.72;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.ellipse(ch.x, ch.y + 8, 64 + ch.hoverBoost * 8, 18, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Idle breathing & weight-shifting transforms
        let ox = 0;
        let oy = 0;
        let rot = ch.rotation;
        let sx = ch.scaleX * ch.spawnPop;
        let sy = ch.scaleY * ch.spawnPop;

        if (!isDiver) {
          const breath = Math.sin(t * 2.8 + ph);
          oy = -Math.abs(breath) * 6;
          rot += Math.sin(t * 1.9 + ph) * 0.04;
          sy *= 1 + breath * 0.025;
          sx *= 1 - breath * 0.02;

          if (ch.hoverBoost > 0.01) {
            sx *= 1 + ch.hoverBoost * 0.11;
            sy *= 1 + ch.hoverBoost * 0.11;
            oy -= ch.hoverBoost * 14;
          }

          if (ch.wrongTimer > 0) {
            const wp = ch.wrongTimer / 0.65;
            ox += Math.sin(wp * Math.PI * 7) * 14 * wp;
            oy -= Math.abs(Math.sin(wp * Math.PI * 3)) * 18 * wp;
            rot += Math.sin(wp * Math.PI * 7) * 0.2 * wp;
          }
        }

        ctx.translate(ch.x + ox, ch.y + oy);
        ctx.rotate(rot);
        ctx.scale(sx, sy);

        // Cursor-tracking gaze vector
        const tx = game.pointer.active ? game.pointer.x : BOARD_TIP_X;
        const ty = game.pointer.active ? game.pointer.y : BOARD_Y;
        const gdx = tx - ch.x;
        const gdy = ty - (ch.y - 80);
        const gdist = Math.hypot(gdx, gdy) || 1;
        const gazeX = (gdx / gdist) * 3.3;
        const gazeY = (gdy / gdist) * 2.6;

        const isExcited = isDiver || ch.hoverBoost > 0.3;
        const isWrong = ch.wrongTimer > 0;
        const pose = isDiver ? game.diver.pose : null;

        // Back half of inflatable flamingo/duck ring when swimming after Super-Bounce!
        if (swimming && game.diver.hasFloatRing) {
          drawFloatRingBack(ctx);
        }

        // Clip bottom neatly below waterline when swimming
        if (swimming) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(-150, -240, 300, 218);
          ctx.clip();
        }

        if (kind === 'panda') {
          drawPanda(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose, swimming);
        } else if (kind === 'tomato') {
          drawTomato(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose, swimming);
        } else if (kind === 'poodle') {
          drawPoodle(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose, swimming);
        } else if (kind === 'vacuum') {
          drawVacuum(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose, swimming);
        } else if (kind === 'cookie') {
          drawCookie(ctx, t, ph, ch.isBlinking, gazeX, gazeY, isExcited, isWrong, pose, swimming);
        }

        // Cute swimming goggles on character when bobbing in the waves!
        if (swimming && game.diver.hasGoggles) {
          const gy = kind === 'panda' || kind === 'poodle' ? -104 : kind === 'tomato' || kind === 'cookie' ? -84 : -90;
          drawSwimGoggles(ctx, 0, gy);
        }

        if (swimming) {
          ctx.restore();
          // Front half of inflatable flamingo/duck swim ring!
          if (game.diver.hasFloatRing) {
            drawFloatRingFront(ctx);
          }
        }

        ctx.restore();
      }

      // Shared expressive face (blinking, cursor-tracking, wide eyes for starfish pause, blush on wrong)
      function drawFace(ctx, x, y, eyeSep, eyeR, blink, gx, gy, excited, wrong, wideEyes = false) {
        // Rosy cheeks
        ctx.fillStyle = wrong ? 'rgba(255, 65, 95, 0.72)' : 'rgba(255, 118, 138, 0.45)';
        ctx.beginPath();
        ctx.ellipse(x - eyeSep - 8, y + eyeR + 4, 9.5, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(x + eyeSep + 8, y + eyeR + 4, 9.5, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        const r = wideEyes ? eyeR * 1.25 : eyeR;
        [-eyeSep, eyeSep].forEach((ex) => {
          if (blink && !wideEyes) {
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(x + ex, y + 2, r * 0.75, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
          } else {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#242424';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.ellipse(x + ex, y, r, r * 1.15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            const px = x + ex + (wideEyes ? 0 : gx);
            const py = y + (wideEyes ? 4 : gy);
            ctx.fillStyle = '#181828';
            ctx.beginPath();
            ctx.arc(px, py, wideEyes ? r * 0.36 : r * 0.54, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(px - r * 0.2, py - r * 0.22, r * 0.22, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // Mouth
        ctx.strokeStyle = '#3b1e1e';
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        if (wideEyes) {
          // Comical "O" surprise mouth
          ctx.fillStyle = '#ff6b81';
          ctx.beginPath();
          ctx.ellipse(x, y + eyeR + 12, 7.5, 9.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (wrong) {
          ctx.beginPath();
          ctx.moveTo(x - 10, y + eyeR + 12);
          ctx.quadraticCurveTo(x - 4, y + eyeR + 7, x, y + eyeR + 12);
          ctx.quadraticCurveTo(x + 4, y + eyeR + 17, x + 10, y + eyeR + 12);
          ctx.stroke();
        } else if (excited) {
          ctx.fillStyle = '#ff6b81';
          ctx.beginPath();
          ctx.arc(x, y + eyeR + 7, 11, 0, Math.PI);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(x, y + eyeR + 5, 9.5, 0.15 * Math.PI, 0.85 * Math.PI);
          ctx.stroke();
        }
      }

      // Shared legs with feet/flippers
      function drawLegs(ctx, legSep, hipY, t, ph, legColor, footColor, excited, wrong, pose, swimming) {
        if (swimming) return;
        const tuck = pose && pose.tuck;
        const split = pose ? (pose.split || 0) : 0;
        const swingL = pose && pose.legL !== undefined ? pose.legL : (wrong ? Math.sin(t * 20) * 0.25 : 0);
        const swingR = pose && pose.legR !== undefined ? pose.legR : (wrong ? -Math.sin(t * 20) * 0.25 : 0);

        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.translate(side * legSep, hipY);
          const ang = tuck ? side * -0.85 : side * split * 1.05 + (side < 0 ? swingL : swingR);
          ctx.rotate(ang);

          ctx.strokeStyle = legColor;
          ctx.lineWidth = 8.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(side * 3, tuck ? 14 : -hipY);
          ctx.stroke();

          ctx.fillStyle = footColor;
          ctx.strokeStyle = '#242424';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.ellipse(side * 8, (tuck ? 16 : -hipY + 2), 14, 8.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });
      }

      // Shared lively cartoon arms with hands
      function drawArms(ctx, shoulderX, shoulderY, t, ph, armColor, handColor, excited, wrong, pose) {
        const tuck = pose && pose.tuck;
        const defaultWave = wrong ? Math.sin(t * 20) * 0.7 : Math.sin(t * 2.8 + ph) * 0.2;
        const rotL = tuck ? 0.95 : (pose && pose.armL !== undefined ? pose.armL : -0.35 + defaultWave);
        const rotR = tuck ? -0.95 : (pose && pose.armR !== undefined ? pose.armR : 0.35 - defaultWave);

        [-1, 1].forEach((side) => {
          ctx.save();
          ctx.translate(side * shoulderX, shoulderY);
          ctx.rotate(side < 0 ? rotL : rotR);

          ctx.strokeStyle = armColor;
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(side * 15, 11, side * 28, 3);
          ctx.stroke();

          ctx.fillStyle = handColor;
          ctx.strokeStyle = '#242424';
          ctx.lineWidth = 2.3;
          ctx.beginPath();
          ctx.arc(side * 31, 3, 8.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });
      }

      // 1. ПА — PANDA (Панда): Realistic-cartoon fluffy panda in bright swimming shorts
      function drawPanda(ctx, t, ph, blink, gx, gy, excited, wrong, pose, swimming) {
        drawLegs(ctx, 18, -30, t, ph, '#242424', '#1a1a1a', excited, wrong, pose, swimming);

        // Chunky fluffy white panda body
        const bGrad = ctx.createRadialGradient(-10, -64, 8, 0, -56, 42);
        bGrad.addColorStop(0, '#ffffff');
        bGrad.addColorStop(0.75, '#f0f2f5');
        bGrad.addColorStop(1, '#cfd6df');
        ctx.fillStyle = bGrad;
        ctx.strokeStyle = '#242424';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.ellipse(0, -56, 37, 36, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Iconic black panda shoulder band
        ctx.fillStyle = '#222429';
        ctx.beginPath();
        ctx.ellipse(0, -76, 32, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cute bright turquoise & coral swimming shorts!
        ctx.fillStyle = '#00d2d3';
        ctx.strokeStyle = '#006e75';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.roundRect(-30, -45, 60, 22, 9);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ff6b6b';
        ctx.fillRect(-29, -39, 58, 5);

        drawArms(ctx, 32, -70, t, ph, '#222429', '#1a1a1a', excited, wrong, pose);

        // Round black panda ears
        [-27, 27].forEach((ex) => {
          ctx.fillStyle = '#222429';
          ctx.strokeStyle = '#111111';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(ex, -128, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });

        // Fluffy white panda head
        const hGrad = ctx.createRadialGradient(-10, -112, 8, 0, -100, 40);
        hGrad.addColorStop(0, '#ffffff');
        hGrad.addColorStop(0.78, '#f1f3f7');
        hGrad.addColorStop(1, '#d3dae3');
        ctx.fillStyle = hGrad;
        ctx.strokeStyle = '#242424';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.ellipse(0, -102, 39, 34, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Iconic angled black eye patches
        ctx.fillStyle = '#222429';
        ctx.beginPath();
        ctx.ellipse(-16, -103, 14, 17, 0.25, 0, Math.PI * 2);
        ctx.ellipse(16, -103, 14, 17, -0.25, 0, Math.PI * 2);
        ctx.fill();

        drawFace(ctx, 0, -104, 15, 9.5, blink, gx, gy, excited, wrong, pose && pose.wideEyes);

        // Cute shiny dark panda snout/nose
        ctx.fillStyle = '#222429';
        ctx.beginPath();
        ctx.ellipse(0, -90, 8, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.ellipse(-2.5, -91.5, 2.5, 1.5, -0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. ПО — TOMATO (Помідор / Помидор): Plump glossy ripe red tomato with leafy green calyx
      function drawTomato(ctx, t, ph, blink, gx, gy, excited, wrong, pose, swimming) {
        drawLegs(ctx, 18, -32, t, ph, '#27ae60', '#2ecc71', excited, wrong, pose, swimming);
        drawArms(ctx, 44, -76, t, ph, '#27ae60', '#58d68d', excited, wrong, pose);

        // Plump glossy ripe tomato body (slightly wider oval with subtle cleft at top)
        const tomGrad = ctx.createRadialGradient(-18, -98, 10, 0, -76, 58);
        tomGrad.addColorStop(0, '#ff8787');
        tomGrad.addColorStop(0.4, '#ee2c2c');
        tomGrad.addColorStop(0.85, '#c41414');
        tomGrad.addColorStop(1, '#8c0c0c');
        ctx.fillStyle = tomGrad;
        ctx.strokeStyle = '#730a0a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -122);
        ctx.bezierCurveTo(36, -130, 56, -102, 52, -70);
        ctx.bezierCurveTo(48, -36, 22, -24, 0, -26);
        ctx.bezierCurveTo(-22, -24, -48, -36, -52, -70);
        ctx.bezierCurveTo(-56, -102, -36, -130, 0, -122);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Crisp glossy light specular highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.ellipse(-25, -96, 10, 20, 0.42, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-14, -112, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Realistic 5-pointed leafy green tomato calyx & curved stem on top
        ctx.fillStyle = '#27ae60';
        ctx.strokeStyle = '#145a32';
        ctx.lineWidth = 2.4;
        const sepals = [
          [-26, -122, -0.45], [-12, -130, -0.15], [0, -124, 0], [12, -130, 0.15], [26, -122, 0.45]
        ];
        sepals.forEach(([sx, sy, sr]) => {
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(sr);
          ctx.beginPath();
          ctx.moveTo(-12, 2);
          ctx.quadraticCurveTo(0, -14, 14, 2);
          ctx.quadraticCurveTo(0, 6, -12, 2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });

        // Curved green stem
        ctx.strokeStyle = '#1b7a43';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -124);
        ctx.quadraticCurveTo(4, -144, 16, -148);
        ctx.stroke();

        drawFace(ctx, 0, -82, 17, 11.5, blink, gx, gy, excited, wrong, pose && pose.wideEyes);
      }

      // 3. ПУ — POODLE (Пудель): Fluffy apricot/cream poodle with curly cloud tufts, pom-pom tail & collar
      function drawPoodle(ctx, t, ph, blink, gx, gy, excited, wrong, pose, swimming) {
        // Pom-pom wagging tail behind
        const wag = Math.sin(t * (excited ? 16 : 6) + ph) * 0.35;
        ctx.save();
        ctx.translate(28, -48);
        ctx.rotate(wag);
        ctx.strokeStyle = '#d99a5b';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(18, -14);
        ctx.stroke();
        ctx.fillStyle = '#ffdfb8';
        ctx.strokeStyle = '#a86b32';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(22, -18, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Legs with cute fluffy ankle pom-poms
        drawLegs(ctx, 16, -32, t, ph, '#d99a5b', '#ffdfb8', excited, wrong, pose, swimming);
        if (!swimming && !(pose && pose.tuck)) {
          ctx.fillStyle = '#ffe5c4';
          ctx.strokeStyle = '#a86b32';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(-18, -10, 9.5, 0, Math.PI * 2);
          ctx.arc(18, -10, 9.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // Fluffy cloud-like chest/body
        const pGrad = ctx.createRadialGradient(-8, -68, 6, 0, -58, 38);
        pGrad.addColorStop(0, '#fff0db');
        pGrad.addColorStop(0.65, '#f6c28b');
        pGrad.addColorStop(1, '#d99552');
        ctx.fillStyle = pGrad;
        ctx.strokeStyle = '#995c24';
        ctx.lineWidth = 2.5;
        const chestPuffs = [
          [-18, -64, 18], [18, -64, 18], [0, -70, 22], [-14, -46, 16], [14, -46, 16], [0, -44, 18]
        ];
        chestPuffs.forEach(([px, py, pr]) => {
          ctx.beginPath();
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.beginPath();
        ctx.ellipse(0, -56, 30, 28, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Bright magenta collar with tiny gold heart/bell
        ctx.strokeStyle = '#ff477e';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, -86, 22, 0.25 * Math.PI, 0.75 * Math.PI);
        ctx.stroke();
        ctx.fillStyle = '#ffd32a';
        ctx.beginPath();
        ctx.arc(0, -72, 6, 0, Math.PI * 2);
        ctx.fill();

        drawArms(ctx, 28, -66, t, ph, '#d99552', '#ffe5c4', excited, wrong, pose);

        // Fluffy drooping curly poodle ears
        const earBounce = Math.sin(t * 5 + ph) * 0.08;
        [-34, 34].forEach((ex, idx) => {
          ctx.save();
          ctx.translate(ex, -106);
          ctx.rotate(idx === 0 ? 0.18 + earBounce : -0.18 - earBounce);
          ctx.fillStyle = '#f3ba7d';
          ctx.strokeStyle = '#995c24';
          ctx.lineWidth = 2.3;
          [[0, 0, 14], [-3, 14, 14], [3, 26, 13]].forEach(([cx, cy, cr]) => {
            ctx.beginPath();
            ctx.arc(cx, cy, cr, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          });
          ctx.restore();
        });

        // Poodle head
        ctx.fillStyle = pGrad;
        ctx.strokeStyle = '#995c24';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.ellipse(0, -100, 32, 29, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Iconic fluffy curly cloud-crown pompadour on top of head!
        ctx.fillStyle = '#ffebd1';
        ctx.strokeStyle = '#995c24';
        ctx.lineWidth = 2.4;
        [[-18, -126, 14], [18, -126, 14], [-8, -135, 15], [8, -135, 15], [0, -128, 16]].forEach(([cx, cy, cr]) => {
          ctx.beginPath();
          ctx.arc(cx, cy, cr, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });

        drawFace(ctx, 0, -103, 14, 10.5, blink, gx, gy, excited, wrong, pose && pose.wideEyes);

        // Cute dark poodle button nose
        ctx.fillStyle = '#3d2210';
        ctx.beginPath();
        ctx.ellipse(0, -88, 7, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // 4. ПИ / ПЫ — VACUUM CLEANER (Пилосос / Пылесос): Bright turquoise & yellow canister vacuum with ribbed hose, silver wand & nozzle!
      function drawVacuum(ctx, t, ph, blink, gx, gy, excited, wrong, pose, swimming) {
        drawLegs(ctx, 18, -28, t, ph, '#2c3e50', '#ff9f43', excited, wrong, pose, swimming);

        // Ribbed flexible hose curling up from top-right with silver metal wand & floor nozzle!
        const hoseSway = Math.sin(t * 4.5 + ph) * 6;
        ctx.save();
        // Ribbed dark-slate hose
        ctx.strokeStyle = '#34495e';
        ctx.lineWidth = 11;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(22, -104);
        ctx.bezierCurveTo(64, -128, 66 + hoseSway, -172, 26 + hoseSway, -162);
        ctx.stroke();
        // Hose ribbing ridges
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([3, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Shiny silver metal wand extending up-right
        ctx.strokeStyle = '#dfe6e9';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(26 + hoseSway, -162);
        ctx.lineTo(68 + hoseSway, -130);
        ctx.stroke();
        ctx.strokeStyle = '#636e72';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Recognizable flat vacuum floor brush nozzle at wand tip
        ctx.save();
        ctx.translate(72 + hoseSway, -126);
        ctx.rotate(0.55);
        ctx.fillStyle = '#2d3436';
        ctx.strokeStyle = '#feca57';
        ctx.lineWidth = 2.5;
        roundRect(ctx, -16, -6, 32, 13, 4);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        ctx.restore();

        drawArms(ctx, 42, -74, t, ph, '#0086b3', '#feca57', excited, wrong, pose);

        // Glossy rounded turquoise & sunny-yellow canister body
        const vGrad = ctx.createRadialGradient(-16, -98, 10, 0, -72, 56);
        vGrad.addColorStop(0, '#55efc4');
        vGrad.addColorStop(0.45, '#00cec9');
        vGrad.addColorStop(1, '#007799');
        ctx.fillStyle = vGrad;
        ctx.strokeStyle = '#004b63';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, -76, 44, 46, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Sunny yellow racing accent lid & bumper
        ctx.fillStyle = '#feca57';
        ctx.strokeStyle = '#b37400';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(0, -110, 28, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Big recognizable red-orange power button on lower front
        ctx.fillStyle = '#ff6b6b';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, -45, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Side canister wheels
        [-43, 43].forEach((wx) => {
          ctx.fillStyle = '#2d3436';
          ctx.strokeStyle = '#feca57';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(wx, -52, 8, 18, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });

        // Glossy reflection on canister
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.beginPath();
        ctx.ellipse(-20, -96, 8, 18, 0.3, 0, Math.PI * 2);
        ctx.fill();

        drawFace(ctx, 0, -84, 15, 11, blink, gx, gy, excited, wrong, pose && pose.wideEyes);
      }

      // 5. ПЕ — CHOCOLATE-CHIP COOKIE (Печиво / Печенье): Realistic golden-brown baked cookie with bumpy edge & glossy choco chips!
      function drawCookie(ctx, t, ph, blink, gx, gy, excited, wrong, pose, swimming) {
        drawLegs(ctx, 18, -30, t, ph, '#8d5524', '#ff6b6b', excited, wrong, pose, swimming);
        drawArms(ctx, 44, -76, t, ph, '#8d5524', '#d99a5b', excited, wrong, pose);

        // Realistic slightly bumpy organic baked cookie silhouette
        const cGrad = ctx.createRadialGradient(-14, -96, 10, 0, -78, 56);
        cGrad.addColorStop(0, '#f3c677');
        cGrad.addColorStop(0.65, '#d99848');
        cGrad.addColorStop(1, '#a66321');
        ctx.fillStyle = cGrad;
        ctx.strokeStyle = '#733e10';
        ctx.lineWidth = 3;

        ctx.beginPath();
        const bumps = 18;
        for (let i = 0; i <= bumps; i++) {
          const a = (i / bumps) * Math.PI * 2;
          const r = 48 + Math.sin(i * 3.7) * 3.2;
          const px = Math.cos(a) * r;
          const py = -78 + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Subtle baked crumb speckles
        ctx.fillStyle = 'rgba(120, 62, 14, 0.25)';
        [[-28, -56], [26, -108], [-12, -40], [32, -62], [-34, -92], [10, -118]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });

        // Glossy dark-chocolate chips scattered around face (never obstructing eyes!)
        const chips = [
          [-26, -112, 7.5], [22, -112, 7], [-34, -74, 6.5],
          [34, -76, 7.5], [-24, -46, 7], [22, -48, 8], [2, -116, 6]
        ];
        chips.forEach(([cx, cy, cr]) => {
          ctx.fillStyle = '#4a2511';
          ctx.strokeStyle = '#2b1307';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.ellipse(cx, cy, cr, cr * 0.82, cx * 0.05, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.beginPath();
          ctx.arc(cx - cr * 0.28, cy - cr * 0.24, cr * 0.25, 0, Math.PI * 2);
          ctx.fill();
        });

        drawFace(ctx, 0, -82, 16, 11.5, blink, gx, gy, excited, wrong, pose && pose.wideEyes);
      }

      // Cute swim goggles drawn when character pops up in the waves
      function drawSwimGoggles(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#ff6b6b';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-36, 0);
        ctx.lineTo(36, 0);
        ctx.stroke();

        [-15, 15].forEach((gx) => {
          ctx.fillStyle = 'rgba(72, 219, 251, 0.48)';
          ctx.strokeStyle = '#ffd32a';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.ellipse(gx, 0, 14, 11, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });
        ctx.restore();
      }

      // Bright pink inflatable flamingo swim ring (back & front layers for realistic seating!)
      function drawFloatRingBack(ctx) {
        ctx.save();
        ctx.fillStyle = '#ff6b9d';
        ctx.strokeStyle = '#c43a68';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, -24, 62, 22, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function drawFloatRingFront(ctx) {
        ctx.save();
        // Front torus arc
        const rGrad = ctx.createLinearGradient(0, -34, 0, 4);
        rGrad.addColorStop(0, '#ff9ec0');
        rGrad.addColorStop(0.5, '#ff5c93');
        rGrad.addColorStop(1, '#d6336c');
        ctx.fillStyle = rGrad;
        ctx.strokeStyle = '#a61e4d';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, -18, 64, 22, 0, 0, Math.PI);
        ctx.bezierCurveTo(-40, -12, 40, -12, 64, -18);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Cute inflatable flamingo neck & head on right side of ring!
        ctx.strokeStyle = '#ff5c93';
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(52, -24);
        ctx.quadraticCurveTo(72, -52, 64, -76);
        ctx.stroke();

        ctx.fillStyle = '#ff5c93';
        ctx.strokeStyle = '#a61e4d';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(64, -78, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Flamingo beak & eye
        ctx.fillStyle = '#2d3436';
        ctx.beginPath();
        ctx.moveTo(74, -80);
        ctx.lineTo(86, -74);
        ctx.lineTo(74, -72);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(67, -80, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111111';
        ctx.beginPath();
        ctx.arc(68, -80, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Utility: safe rounded rectangle
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      /* =========================================================================
       * 13. MAIN RENDER & 60FPS ANIMATION LOOP
       * ========================================================================= */
      function render() {
        const minX = -stageOffsetX / stageScale - 40;
        const maxX = (viewW - stageOffsetX) / stageScale + 40;

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.translate(stageOffsetX, stageOffsetY);
        ctx.scale(stageScale, stageScale);

        // 1. Scenic tropical sky, sun, island, sailboat, waves & sandy beach
        drawTropicalBackdrop(ctx);

        // 2. Painted wooden surfboard syllable signboard
        drawSurfboardSign(ctx);

        // 3. Detailed wooden pier & flexible springy diving board
        drawWoodenPier(ctx);

        // 4. Waiting characters on the sandy beach sorted by Y for natural depth
        const waiting = game.characters
          .filter((c) => c !== game.diver.char)
          .sort((a, b) => a.y - b.y);
        for (const ch of waiting) {
          drawCharacter(ctx, ch, false, false);
        }

        // 5. Active diver (running on pier, flying through the air, or swimming in waves!)
        if (game.diver.char) {
          drawCharacter(ctx, game.diver.char, true, game.state === 'SWIM_OFF');
        }

        // 6. Foreground sea wave crest & foam rings overlapping lower waterline for authentic immersion
        drawFoamRings(ctx);
        drawWaveLayer(ctx, 880, maxX, 724, 10, 0.012, 2.2, 'rgba(0, 150, 199, 0.36)', 'rgba(255,255,255,0.68)');

        // 7. Celebration bouncing beach balls & splash/sparkle/bubble particles
        drawBeachBalls(ctx);
        drawParticles(ctx);

        ctx.restore();
      }

      let lastTime = 0;
      function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
        lastTime = timestamp;

        updateGame(dt);
        render();
        requestAnimationFrame(loop);
      }

      window.onload = function () {
        resizeCanvas();
        createWave();
        requestAnimationFrame(loop);
      };
    })();
  </script>
