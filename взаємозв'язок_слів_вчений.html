<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лабораторія слів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Comfortaa:wght@700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b1017;
            font-family: 'Rubik', sans-serif;
        }

        /* Головна сцена (16:9 широкий екран із чітким зонуванням) */
        #game-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 62% 42%, #243447 0%, #141d28 58%, #090d12 100%);
            display: grid;
            grid-template-columns: 36% 64%;
            grid-template-rows: 100%;
        }

        /* Ефект тремтіння камери під час вибуху */
        .screen-shake {
            animation: shakeAnim 0.72s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-14px, -9px) rotate(-1.3deg); }
            20% { transform: translate(13px, 8px) rotate(1.3deg); }
            30% { transform: translate(-10px, 7px) rotate(-0.9deg); }
            40% { transform: translate(9px, -7px) rotate(0.9deg); }
            50% { transform: translate(-7px, 5px) rotate(-0.5deg); }
            65% { transform: translate(6px, -4px) rotate(0.4deg); }
            80% { transform: translate(-3px, 2px) rotate(-0.2deg); }
        }

        /* Електричний спалах на весь екран */
        #electric-flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 70;
            opacity: 0;
            background: radial-gradient(circle at 60% 50%, rgba(165, 243, 252, 0.85), rgba(56, 189, 248, 0.35) 55%, transparent 85%);
            mix-blend-mode: screen;
            transition: opacity 0.09s ease-out;
        }

        /* Фоновий SVG лабораторії */
        #lab-bg-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Фоновий канвас: бульбашки в колбах, пилинки у світлі, хвиля осцилографа, фонова плазма */
        #bg-effects-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* ЛІВА ЗОНА: Подіум вченого (36% ширини екрана — ніколи не перекривається словами!) */
        #left-scientist-zone {
            position: relative;
            grid-column: 1 / 2;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        #scientist-stage-box {
            position: relative;
            width: 100%;
            height: 92vh;
            max-width: 640px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            filter: drop-shadow(0 20px 28px rgba(0,0,0,0.75));
        }

        /* ПРАВА ЗОНА: Лабораторний пульт із питанням зверху та словами на столі знизу (64% ширини екрана) */
        #right-console-zone {
            position: relative;
            grid-column: 2 / 3;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3vh 3.5vw 4vh 1.5vw;
        }

        /* Верхній ламповий прилад-осцилограф для питання */
        #question-apparatus {
            position: relative;
            margin-top: 1vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.8));
            z-index: 22;
        }

        /* Латунні вакуумні лампи зверху на корпусі питання */
        .vacuum-tubes-row {
            display: flex;
            align-items: flex-end;
            gap: 28px;
            margin-bottom: -6px;
            z-index: 1;
        }

        .question-frame {
            position: relative;
            z-index: 2;
            min-width: clamp(320px, 38vw, 620px);
            padding: 16px 42px 18px 42px;
            border-radius: 28px;
            background:
                linear-gradient(145deg, #c28438 0%, #865117 22%, #e0a958 48%, #65380b 78%, #a66c26 100%);
            border: 4px solid #3d2206;
            box-shadow:
                inset 0 3px 6px rgba(255, 238, 195, 0.7),
                inset 0 -5px 9px rgba(28, 14, 2, 0.9),
                0 12px 28px rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Скляний екран осцилографа */
        .question-screen {
            position: relative;
            width: 100%;
            padding: 14px 32px 16px 32px;
            border-radius: 18px;
            background:
                radial-gradient(ellipse at 50% 42%, #133e38 0%, #082421 66%, #031210 100%);
            border: 3.5px solid #261505;
            box-shadow:
                inset 0 7px 18px rgba(0,0,0,0.92),
                inset 0 0 26px rgba(45, 212, 191, 0.32),
                0 2px 3px rgba(255, 223, 165, 0.45);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* Міліметрова сітка осцилографа */
        .question-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(45, 212, 191, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(45, 212, 191, 0.12) 1px, transparent 1px);
            background-size: 18px 18px;
            pointer-events: none;
        }

        /* Відблиск опуклого скла */
        .question-screen::after {
            content: '';
            position: absolute;
            top: -38%;
            left: -10%;
            width: 120%;
            height: 72%;
            background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.01) 100%);
            transform: rotate(-3deg);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Жива лінія осцилографа під текстом питання */
        #oscilloscope-wave-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.35;
        }

        #question-text {
            position: relative;
            z-index: 3;
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            font-size: clamp(1.55rem, 2.8vw, 2.55rem);
            color: #5eead4;
            text-shadow:
                0 0 14px rgba(45, 212, 191, 0.9),
                0 0 28px rgba(20, 184, 166, 0.6),
                0 2px 3px rgba(0, 0, 0, 0.95);
            letter-spacing: 0.03em;
            text-align: center;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s ease;
        }

        /* Візуальна підказка напрямку (від 1-ї клеми пружиною до 2-ї клеми) */
        .direction-schema {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 24px;
        }

        /* Нижній лабораторний стенд зі словами речення (у правій зоні) */
        #console-workbench-area {
            position: relative;
            width: 100%;
            margin-bottom: 1.5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* Дубово-латунна панель-підставка під словами */
        #words-console-board {
            position: relative;
            width: 100%;
            min-height: clamp(210px, 34vh, 340px);
            padding: clamp(26px, 4vh, 44px) clamp(20px, 2.4vw, 38px) clamp(28px, 4vh, 42px);
            border-radius: 32px;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(251, 191, 36, 0.14) 0%, transparent 70%),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 3px, transparent 3px, transparent 18px),
                linear-gradient(180deg, #43200a 0%, #2c1405 55%, #1a0b02 100%);
            border: 5px solid #854d0e;
            box-shadow:
                inset 0 4px 12px rgba(254, 240, 138, 0.28),
                inset 0 -10px 24px rgba(0, 0, 0, 0.9),
                0 22px 40px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            align-content: center;
            gap: clamp(16px, 2.2vw, 32px) clamp(14px, 1.8vw, 26px);
        }

        /* Латунна окантовка кутів консолі */
        #words-console-board::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 24px;
            border: 2px dashed rgba(217, 119, 6, 0.35);
            pointer-events: none;
        }

        /* Декоративна мідна шина вздовж низу консолі */
        .console-copper-rail {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #78350f 0%, #f59e0b 25%, #fef08a 50%, #d97706 75%, #78350f 100%);
            box-shadow: 0 2px 6px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Окремий блок-ізолятор зі словом */
        .word-node {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
            filter: drop-shadow(0 12px 16px rgba(0,0,0,0.75));
            z-index: 25;
        }

        .word-node:hover {
            transform: translateY(-7px) scale(1.04);
            filter: drop-shadow(0 18px 22px rgba(0,0,0,0.85)) drop-shadow(0 0 14px rgba(251, 191, 36, 0.4));
        }

        .word-node:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Верхня порцеляново-мідна клема слова, куди чіпляється 3D-пружина */
        .terminal-assembly {
            position: relative;
            width: 56px;
            height: 46px;
            margin-bottom: -9px;
            z-index: 3;
            pointer-events: none;
        }

        /* Латунний корпус слова */
        .word-casing {
            position: relative;
            padding: 7px;
            border-radius: 20px;
            background:
                linear-gradient(160deg, #d99b43 0%, #995f18 28%, #eec276 52%, #72430c 82%, #b5792b 100%);
            border: 3px solid #3b2004;
            box-shadow:
                inset 0 2px 4px rgba(255, 240, 200, 0.75),
                inset 0 -4px 6px rgba(40, 18, 2, 0.85);
            transition: all 0.25s ease;
        }

        /* Внутрішня емальована табличка слова */
        .word-plate {
            position: relative;
            padding: clamp(10px, 1.4vh, 16px) clamp(18px, 2vw, 30px);
            border-radius: 13px;
            background:
                radial-gradient(circle at 50% 25%, #2b3c4d 0%, #18232f 70%, #0f171f 100%);
            border: 2px solid #2b1806;
            box-shadow:
                inset 0 4px 10px rgba(0,0,0,0.88),
                inset 0 0 15px rgba(245, 158, 11, 0.14);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Візерунок на пластині */
        .word-plate::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(45deg, rgba(255, 210, 130, 0.045) 0px, rgba(255, 210, 130, 0.045) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 12% 50%, rgba(245, 158, 11, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 88% 50%, rgba(245, 158, 11, 0.16) 0%, transparent 45%);
            pointer-events: none;
        }

        /* Відблиск скла на слові */
        .word-plate::after {
            content: '';
            position: absolute;
            top: 0;
            left: 4%;
            width: 92%;
            height: 44%;
            background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: 10px 10px 40% 40%;
            pointer-events: none;
        }

        .word-label {
            position: relative;
            z-index: 2;
            font-size: clamp(1.2rem, 1.95vw, 1.85rem);
            font-weight: 700;
            color: #fef3c7;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 10px rgba(251, 191, 36, 0.25);
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        /* Заклепки */
        .rivet {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff3d1, #a16207 70%, #3b2104 100%);
            box-shadow: 0 1px 2px rgba(0,0,0,0.85);
            z-index: 4;
            pointer-events: none;
        }
        .rivet.tl { top: 5px; left: 5px; }
        .rivet.tr { top: 5px; right: 5px; }
        .rivet.bl { bottom: 5px; left: 5px; }
        .rivet.br { bottom: 5px; right: 5px; }

        /* Стан вибраного першого слова (від якого ставиться питання) */
        .word-node.selected-source {
            transform: translateY(-10px) scale(1.06);
            filter: drop-shadow(0 18px 24px rgba(0,0,0,0.85)) drop-shadow(0 0 20px rgba(56, 189, 248, 0.85));
        }

        .word-node.selected-source .word-plate {
            background: radial-gradient(circle at 50% 30%, #155e75 0%, #083344 70%, #041e29 100%);
            box-shadow:
                inset 0 4px 10px rgba(0,0,0,0.8),
                inset 0 0 24px rgba(56, 189, 248, 0.65);
        }

        .word-node.selected-source .word-label {
            color: #e0f2fe;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.95), 0 2px 4px rgba(0,0,0,0.95);
        }

        /* Стан правильного з'єднання */
        .word-node.connected-success {
            transform: translateY(-10px) scale(1.07);
            filter: drop-shadow(0 18px 25px rgba(0,0,0,0.85)) drop-shadow(0 0 26px rgba(52, 211, 153, 0.95));
        }

        .word-node.connected-success .word-plate {
            background: radial-gradient(circle at 50% 30%, #065f46 0%, #064e3b 70%, #022c22 100%);
            box-shadow: inset 0 0 28px rgba(52, 211, 153, 0.8);
        }

        /* Стан помилкового з'єднання */
        .word-node.connected-error {
            animation: nodeErrorShake 0.46s ease;
        }

        @keyframes nodeErrorShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-11px) rotate(-2.5deg); }
            40% { transform: translateX(11px) rotate(2.5deg); }
            60% { transform: translateX(-7px) rotate(-1.2deg); }
            80% { transform: translateX(7px) rotate(1.2deg); }
        }

        /* Канвас 3D-пружини, електричних дуг, диму та іскор */
        #spring-fx-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 45;
            pointer-events: none;
        }

        /* Мінімалістична кнопка "Далі" (механічний латунний тумблер-стрілка без слів) */
        #next-btn {
            position: fixed;
            top: 2.4vh;
            right: 2vw;
            z-index: 60;
            width: 66px;
            height: 66px;
            border-radius: 50%;
            cursor: pointer;
            background:
                radial-gradient(circle at 35% 30%, #facc15 0%, #b45309 65%, #78350f 100%);
            border: 4px solid #451a03;
            box-shadow:
                inset 0 3px 6px rgba(254, 240, 138, 0.8),
                inset 0 -4px 6px rgba(69, 26, 3, 0.9),
                0 10px 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
        }

        #next-btn:hover {
            transform: scale(1.1) rotate(8deg);
            filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.75));
        }

        #next-btn:active {
            transform: scale(0.92);
        }

        /* Дуже малопомітний перемикач мов у правому нижньому кутку */
        #lang-toggle {
            position: fixed;
            bottom: 8px;
            right: 12px;
            z-index: 60;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 7px;
            border-radius: 7px;
            background: rgba(15, 23, 42, 0.28);
            border: 1px solid rgba(148, 163, 184, 0.12);
            opacity: 0.24;
            transition: opacity 0.25s ease;
        }

        #lang-toggle:hover {
            opacity: 0.85;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .lang-btn.active {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.12);
        }

        /* Анімаційні трансформації частин тіла вченого */
        #sci-upper-torso {
            transform-origin: 280px 470px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #sci-head-group {
            transform-origin: 280px 295px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #sci-eyebrow-l, #sci-eyebrow-r {
            transition: transform 0.26s ease;
        }
        #sci-pupils {
            transition: transform 0.1s ease-out;
        }
        #sci-glasses-group {
            transform-origin: 280px 235px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #sci-arm-l {
            transform-origin: 205px 355px;
            transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #sci-arm-r {
            transform-origin: 355px 355px;
            transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #control-lever-stick {
            transform-origin: 122px 525px;
            transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body>

<div id="game-stage">
    <!-- Електричний спалах при успіху -->
    <div id="electric-flash"></div>

    <!-- Деталізований сюжетний SVG-фон лабораторії (розділений під ліву зону вченого та праву консоль) -->
    <svg id="lab-bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#101823"/>
                <stop offset="55%" stop-color="#1c2b3b"/>
                <stop offset="100%" stop-color="#0b1118"/>
            </linearGradient>

            <linearGradient id="pipeCopper" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#7c3f12"/>
                <stop offset="35%" stop-color="#d97706"/>
                <stop offset="55%" stop-color="#fde68a"/>
                <stop offset="85%" stop-color="#92400e"/>
                <stop offset="100%" stop-color="#451a03"/>
            </linearGradient>

            <linearGradient id="pipeCopperV" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#5c2d0c"/>
                <stop offset="35%" stop-color="#d97706"/>
                <stop offset="55%" stop-color="#fef08a"/>
                <stop offset="85%" stop-color="#92400e"/>
                <stop offset="100%" stop-color="#3b1704"/>
            </linearGradient>

            <linearGradient id="steelPipe" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1e293b"/>
                <stop offset="42%" stop-color="#64748b"/>
                <stop offset="55%" stop-color="#cbd5e1"/>
                <stop offset="85%" stop-color="#334155"/>
                <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>

            <linearGradient id="woodShelf" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#78350f"/>
                <stop offset="30%" stop-color="#92400e"/>
                <stop offset="70%" stop-color="#451a03"/>
                <stop offset="100%" stop-color="#270e02"/>
            </linearGradient>

            <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
                <stop offset="30%" stop-color="rgba(255,255,255,0.08)"/>
                <stop offset="70%" stop-color="rgba(255,255,255,0.0)"/>
                <stop offset="100%" stop-color="rgba(255,255,255,0.22)"/>
            </linearGradient>

            <radialGradient id="greenLiquid" cx="50%" cy="60%" r="55%">
                <stop offset="0%" stop-color="#4ade80"/>
                <stop offset="60%" stop-color="#16a34a"/>
                <stop offset="100%" stop-color="#064e3b"/>
            </radialGradient>

            <radialGradient id="amberLiquid" cx="50%" cy="60%" r="55%">
                <stop offset="0%" stop-color="#fbbf24"/>
                <stop offset="60%" stop-color="#d97706"/>
                <stop offset="100%" stop-color="#78350f"/>
            </radialGradient>

            <radialGradient id="cyanLiquid" cx="50%" cy="60%" r="55%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="65%" stop-color="#0284c7"/>

/**
 * СИНТЕЗАТОР ЗВУКОВИХ ЕФЕКТІВ ЛАБОРАТОРІЇ (Web Audio API)
 */
class LabAudioEngine {
    constructor() {
        this.ctx = null;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    // Механічний клац + гудіння трансформатора при зачепленні першого слова
    playLatchSound(pitchMultiplier = 1.0) {
        this.init();
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320 * pitchMultiplier, now);
        osc.frequency.exponentialRampToValueAtTime(780 * pitchMultiplier, now + 0.06);
        osc.frequency.exponentialRampToValueAtTime(190 * pitchMultiplier, now + 0.19);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.21);
    }

    // Коротке замикання + пружне "боііінг" відстрілювання пружини при помилці
    playWrongSpringRecoil() {
        this.init();
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        const mainGain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(185, now);
        osc.frequency.exponentialRampToValueAtTime(78, now + 0.52);

        lfo.frequency.setValueAtTime(28, now);
        lfoGain.gain.setValueAtTime(70, now);

        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);

        mainGain.gain.setValueAtTime(0.26, now);
        mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.54);

        osc.connect(mainGain);
        mainGain.connect(this.ctx.destination);

        osc.start(now);
        lfo.start(now);
        osc.stop(now + 0.54);
        lfo.stop(now + 0.54);
    }

    // Високовольтна дуга, лабораторний вибух та радісна електрична фанфара!
    playElectricExplosion() {
        this.init();
        const now = this.ctx.currentTime;

        // 1. Електричний тріск дуги
        const zapOsc = this.ctx.createOscillator();
        const zapMod = this.ctx.createOscillator();
        const zapModGain = this.ctx.createGain();
        const zapGain = this.ctx.createGain();

        zapOsc.type = 'sawtooth';
        zapOsc.frequency.setValueAtTime(150, now);
        zapOsc.frequency.linearRampToValueAtTime(560, now + 0.24);

        zapMod.type = 'square';
        zapMod.frequency.setValueAtTime(60, now);
        zapModGain.gain.setValueAtTime(195, now);

        zapMod.connect(zapModGain);
        zapModGain.connect(zapOsc.frequency);

        zapGain.gain.setValueAtTime(0.28, now);
        zapGain.gain.exponentialRampToValueAtTime(0.01, now + 0.36);

        zapOsc.connect(zapGain);
        zapGain.connect(this.ctx.destination);
        zapOsc.start(now);
        zapMod.start(now);
        zapOsc.stop(now + 0.36);
        zapMod.stop(now + 0.36);

        // 2. Гучний комічний "БАБАХ!"
        const boomTime = now + 0.16;
        const bufferSize = this.ctx.sampleRate * 0.95;
        const noiseBuffer = this.ctx.sampleRate ? this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate) : null;
        if (noiseBuffer) {
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const whiteNoise = this.ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, boomTime);
            filter.frequency.exponentialRampToValueAtTime(85, boomTime + 0.88);

            const noiseGain = this.ctx.createGain();
            noiseGain.gain.setValueAtTime(0.68, boomTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, boomTime + 0.9);

            whiteNoise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(this.ctx.destination);
            whiteNoise.start(boomTime);
            whiteNoise.stop(boomTime + 0.92);
        }

        const subOsc = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(135, boomTime);
        subOsc.frequency.exponentialRampToValueAtTime(26, boomTime + 0.58);

        subGain.gain.setValueAtTime(0.62, boomTime);
        subGain.gain.exponentialRampToValueAtTime(0.001, boomTime + 0.62);

        subOsc.connect(subGain);
        subGain.connect(this.ctx.destination);
        subOsc.start(boomTime);
        subOsc.stop(boomTime + 0.62);

        // 3. Радісна фанфара відкриття
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
            const t = boomTime + 0.24 + idx * 0.075;
            const bell = this.ctx.createOscillator();
            const bGain = this.ctx.createGain();
            bell.type = 'triangle';
            bell.frequency.setValueAtTime(freq, t);
            bGain.gain.setValueAtTime(0.18, t);
            bGain.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
            bell.connect(bGain);
            bGain.connect(this.ctx.destination);
            bell.start(t);
            bell.stop(t + 0.36);
        });
    }

    playSwitchClick() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(250, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
    }
}

        this.headGroup.style.transform = 'rotate(0deg) translate(0px, 0px)';
        this.armL.style.transform = 'rotate(0deg)';
        this.armR.style.transform = 'rotate(0deg)';
        this.handRNormal.setAttribute('opacity', '1');
        this.handRThumb.setAttribute('opacity', '0');
        this.leverStick.style.transform = 'rotate(-14deg)';
        this.eyebrowL.style.transform = 'translateY(0px) rotate(0deg)';
        this.eyebrowR.style.transform = 'translateY(0px) rotate(0deg)';
        this.eyelidL.style.transform = 'scale(1, 0)';
        this.eyelidR.style.transform = 'scale(1, 0)';
        this.showMouth('smile');
    }

    // Коли дитина клікає на перше слово: вчений нахиляється вперед до консолі, натискає важіль і зацікавлено дивиться!
    triggerFirstWordSelected() {
        if (this.state === 'shocked-happy') return;
        this.state = 'attentive';
        this.upperTorso.style.transform = 'rotate(3.5deg) translateX(8px)';
        this.headGroup.style.transform = 'rotate(4deg) translateY(-4px)';
        this.leverStick.style.transform = 'rotate(18deg)';
        this.armL.style.transform = 'rotate(-10deg)';
        this.eyebrowL.style.transform = 'translateY(-9px) rotate(-6deg)';
        this.eyebrowR.style.transform = 'translateY(2px) rotate(5deg)';
        this.showMouth('o');
    }

    // Різноманітні кумедні реакції вченого після вибуху (брудний у сажі, волосся дибки, щасливий!)
    triggerExplosionSuccess() {
        this.state = 'shocked-happy';
        this.hairNormal.setAttribute('opacity', '0');
        this.hairShocked.setAttribute('opacity', '1');
        this.sootLayers.forEach(el => el.setAttribute('opacity', '1'));
        this.showMouth('boom');

        const variant = this.reactionIndex % 3;
        this.reactionIndex++;

        if (variant === 0) {
            // Варіант 1: Перекошені окуляри + показує великий палець вгору ("Супер!")
            this.glasses.style.transform = 'rotate(-13deg) translateY(6px)';
            this.headGroup.style.transform = 'rotate(-5deg) translateY(-6px)';
            this.upperTorso.style.transform = 'rotate(-2deg)';
            this.armR.style.transform = 'rotate(-36deg) translate(-12px, -18px)';
            this.handRNormal.setAttribute('opacity', '0');
            this.handRThumb.setAttribute('opacity', '1');
        } else if (variant === 1) {
            // Варіант 2: Тріумфально піднімає обидві руки вгору ("Еврика!") + окуляри набік
            this.glasses.style.transform = 'rotate(12deg) translateY(5px)';
            this.headGroup.style.transform = 'rotate(5deg) translateY(-8px)';
            this.armL.style.transform = 'rotate(48deg) translate(-10px, -20px)';
            this.armR.style.transform = 'rotate(-48deg) translate(10px, -20px)';
            this.handRNormal.setAttribute('opacity', '0');
            this.handRThumb.setAttribute('opacity', '1');
        } else {
            // Варіант 3: Смішно поправляє рукою перекошені димлячі окуляри
            this.glasses.style.transform = 'rotate(-15deg) translateY(7px)';
            this.headGroup.style.transform = 'rotate(6deg)';
            this.armR.style.transform = 'rotate(-62deg) translate(-25px, -35px)';
            setTimeout(() => {
                if (this.state === 'shocked-happy') {
                    this.glasses.style.transform = 'rotate(-3deg) translateY(1px)';
                }
            }, 650);
        }

        this.eyebrowL.style.transform = 'translateY(-11px) rotate(-8deg)';
        this.eyebrowR.style.transform = 'translateY(-11px) rotate(8deg)';
    }

    // Кумедна реакція на помилку: чухає потилицю або знизує плечима з хвилястою гримасою
    triggerPuzzled() {
        if (this.state === 'shocked-happy') return;
        this.state = 'puzzled';
        this.leverStick.style.transform = 'rotate(-14deg)';
        this.upperTorso.style.transform = 'rotate(-3deg)';
        this.headGroup.style.transform = 'rotate(-8deg)';
        this.eyebrowL.style.transform = 'translateY(-10px) rotate(-12deg)';
        this.eyebrowR.style.transform = 'translateY(4px) rotate(-6deg)';
        this.armR.style.transform = 'rotate(-28deg) translate(-8px, -10px)';
        this.showMouth(Math.random() < 0.5 ? 'zigzag' : 'hmm');

        setTimeout(() => {
            if (this.state === 'puzzled') {
                this.resetToCleanIdle();
            }
        }, 1150);
    }

    lookAt(x, y) {
        const rect = document.getElementById('scientist-stage-box').getBoundingClientRect();
        const cx = rect.left + rect.width * 0.5;
        const cy = rect.top + rect.height * 0.35;
        const dx = x - cx;
        const dy = y - cy;
        const dist = Math.hypot(dx, dy) || 1;
        const maxOffset = 7.5;
        const factor = Math.min(dist / 260, 1) * maxOffset;
        const px = (dx / dist) * factor;
        const py = (dy / dist) * factor;
        this.pupils.style.transform = `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px)`;
    }

    blink() {
        this.eyelidL.style.transform = 'scale(1, 1)';
        this.eyelidR.style.transform = 'scale(1, 1)';
        setTimeout(() => {
            this.eyelidL.style.transform = 'scale(1, 0)';
            this.eyelidR.style.transform = 'scale(1, 0)';
        }, 130);
    }

    startRandomEmotions() {
        setInterval(() => {
            if (Math.random() < 0.78) this.blink();
        }, 2700);

        setInterval(() => {
            if (this.state !== 'idle') return;
            const roll = Math.random();
            if (roll < 0.25) {
                this.eyebrowL.style.transform = 'translateY(-8px) rotate(-8deg)';
                this.eyebrowR.style.transform = 'translateY(2px) rotate(4deg)';
                this.headGroup.style.transform = 'rotate(4deg)';
                this.showMouth('hmm');
            } else if (roll < 0.5) {
                this.eyelidL.style.transform = 'scale(1, 0.42)';
                this.eyelidR.style.transform = 'scale(1, 0.42)';
                this.eyebrowL.style.transform = 'translateY(4px)';
                this.eyebrowR.style.transform = 'translateY(4px)';
                this.headGroup.style.transform = 'rotate(-4deg)';
                this.showMouth('hmm');
                setTimeout(() => {
                    if (this.state === 'idle') {
                        this.eyelidL.style.transform = 'scale(1, 0)';
                        this.eyelidR.style.transform = 'scale(1, 0)';
                    }
                }, 1300);
            } else if (roll < 0.75) {
                this.eyebrowL.style.transform = 'translateY(-7px)';
                this.eyebrowR.style.transform = 'translateY(-7px)';
                this.glasses.style.transform = 'translateY(-4px)';
                this.showMouth('o');
                setTimeout(() => {
                    if (this.state === 'idle') {
                        this.glasses.style.transform = 'translateY(0px)';
                        this.showMouth('smile');
                    }
                }, 850);
            } else {
                this.eyebrowL.style.transform = 'translateY(0px) rotate(0deg)';
                this.eyebrowR.style.transform = 'translateY(0px) rotate(0deg)';
                this.headGroup.style.transform = 'rotate(0deg)';
                this.showMouth('smile');
            }
        }, 3000);
    }
}

/**
 * ФОНОВА ЖИВА ЛАБОРАТОРІЯ (Бульбашки в колбах, пилинки у променях світла, осцилограф, манометри, плазма)
 */
class BackgroundEffects {
    constructor() {
        this.canvas = document.getElementById('bg-effects-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.bubbles = [];
        this.dustMotes = [];
        this.time = 0;
        this.gaugeSpinBoost = 0;

        this.oscWavePath = document.getElementById('osc-wave-path');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.initParticles();
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    initParticles() {
        // Координати 4 колб на полицях у пропорціях SVG (1920x1080)
        const emitters = [
            { x: 802 / 1920, y: 355 / 1080, color: 'rgba(134, 239, 172, 0.78)', rMax: 5.5 },
            { x: 917 / 1920, y: 375 / 1080, color: 'rgba(253, 230, 138, 0.78)', rMax: 5 },
            { x: 1639 / 1920, y: 365 / 1080, color: 'rgba(186, 230, 253, 0.82)', rMax: 5 },
            { x: 1748 / 1920, y: 355 / 1080, color: 'rgba(251, 207, 232, 0.78)', rMax: 5.5 }
        ];

        for (let i = 0; i < 40; i++) {
            const em = emitters[i % emitters.length];
            this.bubbles.push({
                emitter: em,
                offsetX: (Math.random() - 0.5) * 22,
                progress: Math.random(),
                speed: 0.005 + Math.random() * 0.006,
                r: 2 + Math.random() * em.rMax
            });
        }

        // Атмосферні пилинки/іскорки у світлі лабораторії
        for (let i = 0; i < 35; i++) {
            this.dustMotes.push({
                x: Math.random(),
                y: Math.random(),
                vx: (Math.random() - 0.5) * 0.0003,
                vy: -0.0002 - Math.random() * 0.0003,
                r: 1 + Math.random() * 2.2,
                alpha: 0.15 + Math.random() * 0.35
            });
        }
    }

    triggerGaugeSpin() {
        this.gaugeSpinBoost = 18;
    }

    updateAndDraw() {
        this.time += 0.035;
        if (this.gaugeSpinBoost > 0.1) {
            this.gaugeSpinBoost *= 0.94;
        } else {
            this.gaugeSpinBoost = 0;
        }

        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.clearRect(0, 0, w, h);

        // 1. Пилинки у променях світла
        for (const m of this.dustMotes) {
            m.x += m.vx;
            m.y += m.vy;
            if (m.y < 0) m.y = 1;
            if (m.x < 0) m.x = 1;
            if (m.x > 1) m.x = 0;

            this.ctx.save();
            this.ctx.globalAlpha = m.alpha * (0.6 + 0.4 * Math.sin(this.time * 2 + m.x * 10));
            this.ctx.fillStyle = '#fef08a';
            this.ctx.beginPath();
            this.ctx.arc(m.x * w, m.y * h, m.r, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
        }

        // 2. Бульбашки в алхімічних колбах
        for (const b of this.bubbles) {
            b.progress += b.speed;
            if (b.progress > 1) {
                b.progress = 0;
                b.offsetX = (Math.random() - 0.5) * 22;
            }
            const bx = b.emitter.x * w + b.offsetX + Math.sin(this.time * 2 + b.progress * 8) * 2.5;
            const by = b.emitter.y * h - b.progress * (h * 0.06);
            const alpha = Math.sin(b.progress * Math.PI);

            this.ctx.save();
            this.ctx.globalAlpha = alpha;
            this.ctx.fillStyle = b.emitter.color;
            this.ctx.beginPath();
            this.ctx.arc(bx, by, b.r, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
        }

        // 3. Плазмова дуга в колоні Тесли біля вченого
        this.drawTeslaColumnArc(w * (610 / 1920), h * (255 / 1080), h * (495 / 1080));

        // 4. Жива синусоїда на екрані питання
        if (this.oscWavePath) {
            let d = 'M 0 50';
            const amp = 14 + this.gaugeSpinBoost * 2.2;
            for (let x = 0; x <= 400; x += 16) {
                const y = 50 + Math.sin(x * 0.045 + this.time * 3.2) * amp * Math.sin(x / 400 * Math.PI);
                d += ` L ${x} ${y.toFixed(1)}`;
            }
            this.oscWavePath.setAttribute('d', d);
        }

        // 5. Стрілки манометрів та індикатори на пульті вченого
        const spinAngle = this.gaugeSpinBoost * 65;
        const n1 = document.getElementById('gauge-needle-1');
        const n2 = document.getElementById('gauge-needle-2');
        const dn = document.getElementById('desk-gauge-needle');
        const vw = document.getElementById('valve-wheel-1');
        const dw = document.getElementById('desk-dial-wheel');

        if (n1) n1.setAttribute('transform', `rotate(${Math.sin(this.time * 1.8) * 35 + spinAngle})`);
        if (n2) n2.setAttribute('transform', `rotate(${Math.cos(this.time * 2.2) * 40 - spinAngle})`);
        if (dn) dn.setAttribute('transform', `rotate(${Math.sin(this.time * 2.6) * 42 + spinAngle * 1.2})`);
        if (vw) vw.setAttribute('transform', `translate(75, 365) rotate(${Math.sin(this.time * 0.6) * 28 + spinAngle * 0.5})`);
        if (dw) dw.setAttribute('transform', `translate(418, 608) rotate(${Math.cos(this.time * 0.8) * 35 - spinAngle * 0.5})`);
    }

    drawTeslaColumnArc(x, yTop, yBottom) {
        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(103, 232, 249, 0.78)';
        this.ctx.shadowColor = '#22d3ee';
        this.ctx.shadowBlur = 12;
        this.ctx.lineWidth = 2.2;
        this.ctx.beginPath();
        this.ctx.moveTo(x, yBottom);
        const steps = 12;
        for (let i = 1; i <= steps; i++) {
            const t = i / steps;
            const py = yBottom - (yBottom - yTop) * t;
            const px = x + (i === steps ? 0 : (Math.random() - 0.5) * 24);
            this.ctx.lineTo(px, py);
        }
        this.ctx.stroke();
        this.ctx.restore();
    }
}

/**
 * ФІЗИКА РЕАЛІСТИЧНОЇ МЕТАЛЕВОЇ 3D-ПРУЖИНИ, ВИСОКОВОЛЬТНОЇ ДУГИ, ІСКОР ТА ДИМУ
 */
class SpringAndFXRenderer {
    constructor() {
        this.canvas = document.getElementById('spring-fx-canvas');
        this.ctx = this.canvas.getContext('2d');

        this.active = false;
        this.state = 'none'; // 'dragging', 'connected-electric', 'recoiling'
        this.startPos = { x: 0, y: 0 };
        this.endPos = { x: 0, y: 0 };
        this.targetEndPos = { x: 0, y: 0 };
        this.endVel = { x: 0, y: 0 };

        this.archLift = 0;
        this.archVel = 0;

        this.sparks = [];
        this.smokePuffs = [];
        this.hairSparks = [];

        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    attachStart(x, y) {
        this.active = true;
        this.state = 'dragging';
        this.startPos = { x, y };
        this.endPos = { x, y };
        this.targetEndPos = { x, y };
        this.endVel = { x: 0, y: 0 };
        this.archLift = -25;
        this.archVel = 0;
        this.spawnTerminalSparks(x, y, 12, '#38bdf8');
    }

    moveTarget(x, y) {
        if (!this.active || this.state !== 'dragging') return;
        this.targetEndPos.x = x;
        this.targetEndPos.y = y;
    }

    latchToTarget(x, y, isCorrect) {
        this.targetEndPos = { x, y };
        this.endPos = { x, y };
        this.archVel = -18;

        if (isCorrect) {
            this.state = 'connected-electric';
            this.spawnTerminalSparks(x, y, 28, '#67e8f9');
        } else {
            // При помилці — клуб фіолетового диму на клемі та пружне відстрілювання назад
            this.spawnTerminalSparks(x, y, 16, '#f87171');
            this.spawnPurpleErrorSmoke(x, y);
            this.state = 'recoiling';
            this.targetEndPos = { x: this.startPos.x, y: this.startPos.y };
        }
    }

    cancelSpring() {
        if (!this.active) return;
        this.state = 'recoiling';
        this.targetEndPos = { x: this.startPos.x, y: this.startPos.y };
    }

    spawnPurpleErrorSmoke(x, y) {
        for (let i = 0; i < 12; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 4;
            this.smokePuffs.push({
                x: x + (Math.random() - 0.5) * 16,
                y: y + (Math.random() - 0.5) * 16,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1.8,
                r: 14 + Math.random() * 18,
                grow: 0.45,
                alpha: 0.75,
                decay: 0.022 + Math.random() * 0.015,
                color: 'rgb(126, 34, 206)'
            });
        }
    }

    triggerLabExplosion() {
        const mx = (this.startPos.x + this.endPos.x) * 0.5;
        const my = (this.startPos.y + this.endPos.y) * 0.5 - 35;

        const sciRect = document.getElementById('scientist-stage-box').getBoundingClientRect();
        const sx = sciRect.left + sciRect.width * 0.5;
        const sy = sciRect.top + sciRect.height * 0.36;

        const centers = [
            { x: mx, y: my, count: 26 },
            { x: sx, y: sy, count: 30 }
        ];

        centers.forEach(c => {
            for (let i = 0; i < c.count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 9;
                const shade = Math.floor(38 + Math.random() * 68);
                this.smokePuffs.push({
                    x: c.x + (Math.random() - 0.5) * 40,
                    y: c.y + (Math.random() - 0.5) * 40,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    r: 22 + Math.random() * 36,
                    grow: 0.65 + Math.random() * 0.75,
                    alpha: 0.85,
                    decay: 0.013 + Math.random() * 0.012,
                    color: `rgb(${shade}, ${shade + 6}, ${shade + 14})`
                });
            }
        });

        for (let i = 0; i < 85; i++) {
            const origin = i % 2 === 0 ? { x: mx, y: my } : { x: sx, y: sy };
            const angle = Math.random() * Math.PI * 2;
            const speed = 4 + Math.random() * 17;
            const colors = ['#fef08a', '#38bdf8', '#f97316', '#ffffff', '#5eead4'];
            this.sparks.push({
                x: origin.x,
                y: origin.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 3,
                len: 8 + Math.random() * 16,
                alpha: 1,
                decay: 0.016 + Math.random() * 0.02,
                color: colors[i % colors.length]
            });
        }

        for (let i = 0; i < 16; i++) {
            this.hairSparks.push({
                angle: Math.random() * Math.PI * 2,
                radius: 75 + Math.random() * 48,
                life: 85 + Math.random() * 45
            });
        }
    }

    spawnTerminalSparks(x, y, count, color) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 7;
            this.sparks.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                len: 5 + Math.random() * 9,
                alpha: 1,
                decay: 0.035 + Math.random() * 0.025,
                color
            });
        }
    }

    updateAndDraw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // 1. Фізика 3D-пружини (вигинається красивою аркою над словами на консолі)
        if (this.active) {
            const stiffness = this.state === 'recoiling' ? 0.25 : 0.28;
            const damping = this.state === 'recoiling' ? 0.72 : 0.68;

            const ax = (this.targetEndPos.x - this.endPos.x) * stiffness;
            const ay = (this.targetEndPos.y - this.endPos.y) * stiffness;
            this.endVel.x = (this.endVel.x + ax) * damping;
            this.endVel.y = (this.endVel.y + ay) * damping;
            this.endPos.x += this.endVel.x;
            this.endPos.y += this.endVel.y;

            const dist = Math.hypot(this.endPos.x - this.startPos.x, this.endPos.y - this.startPos.y);
            // Піднімаємо арку пружини вгору над словами, щоб вона виглядала об'ємно і охайно
            const targetArch = -Math.min(dist * 0.18, 75);
            const archAccel = (targetArch - this.archLift) * 0.18;
            this.archVel = (this.archVel + archAccel) * 0.82;
            this.archLift += this.archVel;

            if (this.state === 'recoiling' && dist < 14) {
                this.active = false;
                this.state = 'none';
            } else {
                this.drawRealisticCoiledSpring(this.startPos.x, this.startPos.y, this.endPos.x, this.endPos.y);
                if (this.state === 'connected-electric') {
                    this.drawHighVoltageArcs(this.startPos.x, this.startPos.y, this.endPos.x, this.endPos.y);
                }
            }
        }

        // 2. Клуби диму
        for (let i = this.smokePuffs.length - 1; i >= 0; i--) {
            const p = this.smokePuffs[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.95;
            p.vy *= 0.95;
            p.r += p.grow;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
                this.smokePuffs.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            const grad = ctx.createRadialGradient(p.x, p.y, p.r * 0.1, p.x, p.y, p.r);
            grad.addColorStop(0, p.color);
            grad.addColorStop(0.6, p.color);
            grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // 3. Іскри
        for (let i = this.sparks.length - 1; i >= 0; i--) {
            const s = this.sparks[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.35;
            s.alpha -= s.decay;

            if (s.alpha <= 0) {
                this.sparks.splice(i, 1);
                continue;
            }

            const angle = Math.atan2(s.vy, s.vx);
            ctx.save();
            ctx.globalAlpha = s.alpha;
            ctx.strokeStyle = s.color;
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 10;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s.x - Math.cos(angle) * s.len, s.y - Math.sin(angle) * s.len);
            ctx.stroke();
            ctx.restore();
        }

        // 4. Іскорки у волоссі вченого після вибуху
        if (this.hairSparks.length > 0) {
            const sciRect = document.getElementById('scientist-stage-box').getBoundingClientRect();
            const hx = sciRect.left + sciRect.width * 0.5;
            const hy = sciRect.top + sciRect.height * 0.28;

            for (let i = this.hairSparks.length - 1; i >= 0; i--) {
                const hs = this.hairSparks[i];
                hs.life--;
                if (hs.life <= 0) {
                    this.hairSparks.splice(i, 1);
                    continue;
                }
                if (Math.random() < 0.45) {
                    const sx = hx + Math.cos(hs.angle) * hs.radius;
                    const sy = hy - Math.abs(Math.sin(hs.angle)) * (hs.radius * 0.85);
                    ctx.save();
                    ctx.strokeStyle = '#67e8f9';
                    ctx.shadowColor = '#22d3ee';
                    ctx.shadowBlur = 8;
                    ctx.lineWidth = 2.2;
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(sx + (Math.random() - 0.5) * 22, sy + (Math.random() - 0.5) * 22);
                    ctx.lineTo(sx + (Math.random() - 0.5) * 30, sy + (Math.random() - 0.5) * 30);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }
    }

    drawRealisticCoiledSpring(x1, y1, x2, y2) {
        const ctx = this.ctx;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const dist = Math.hypot(dx, dy);

        const coils = 16;
        const radius = Math.max(9, Math.min(20, 24 - dist * 0.011));
        const totalSteps = coils * 18;

        const angle = Math.atan2(dy, dx);
        const nx = -Math.sin(angle);
        const ny = Math.cos(angle);

        const points = [];
        for (let i = 0; i <= totalSteps; i++) {
            const t = i / totalSteps;
            const arch = Math.sin(t * Math.PI) * this.archLift;
            const bx = x1 + dx * t;
            const by = y1 + dy * t + arch;

            let env = 1;
            if (t < 0.08) env = t / 0.08;
            else if (t > 0.92) env = (1 - t) / 0.08;

            const phase = t * coils * Math.PI * 2;
            const coilPerp = Math.sin(phase) * radius * env;
            const coilAlong = Math.cos(phase) * (radius * 0.38) * env;

            const px = bx + nx * coilPerp + Math.cos(angle) * coilAlong;
            const py = by + ny * coilPerp + Math.sin(angle) * coilAlong;
            points.push({ x: px, y: py });
        }

        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Тінь під пружиною
        ctx.beginPath();
        points.forEach((p, idx) => {
            if (idx === 0) ctx.moveTo(p.x + 4, p.y + 9);
            else ctx.lineTo(p.x + 4, p.y + 9);
        });
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.lineWidth = 10;
        ctx.stroke();

        // Темний контур металу
        ctx.beginPath();
        points.forEach((p, idx) => {
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        });
        ctx.strokeStyle = this.state === 'connected-electric' ? '#0369a1' : '#334155';
        ctx.lineWidth = 9;
        ctx.stroke();

        // Сталево-мідне тіло витків
        ctx.beginPath();
        points.forEach((p, idx) => {
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        });
        ctx.strokeStyle = this.state === 'connected-electric' ? '#38bdf8' : '#94a3b8';
        ctx.lineWidth = 5.5;
        ctx.stroke();

        // Спекулярний металевий блік
        ctx.beginPath();
        points.forEach((p, idx) => {
            if (idx === 0) ctx.moveTo(p.x - 1.2, p.y - 1.5);
            else ctx.lineTo(p.x - 1.2, p.y - 1.5);
        });
        ctx.strokeStyle = this.state === 'connected-electric' ? '#e0f2fe' : '#f8fafc';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Латунні затискачі на кінцях
        [{ x: x1, y: y1 }, { x: x2, y: y2 }].forEach(end => {
            ctx.beginPath();
            ctx.arc(end.x, end.y, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#f59e0b';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#451a03';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(end.x - 2.5, end.y - 2.5, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#fef08a';
            ctx.fill();
        });

        ctx.restore();
    }

    drawHighVoltageArcs(x1, y1, x2, y2) {
        const ctx = this.ctx;
        for (let branch = 0; branch < 2; branch++) {
            ctx.save();
            ctx.strokeStyle = branch === 0 ? '#ffffff' : '#38bdf8';
            ctx.shadowColor = '#22d3ee';
            ctx.shadowBlur = 18;
            ctx.lineWidth = branch === 0 ? 3.5 : 2;
            ctx.beginPath();
            ctx.moveTo(x1, y1);

            const segments = 14;
            for (let i = 1; i < segments; i++) {
                const t = i / segments;
                const bx = x1 + (x2 - x1) * t;
                const by = y1 + (y2 - y1) * t + Math.sin(t * Math.PI) * this.archLift;
                const jitterX = (Math.random() - 0.5) * 32;
                const jitterY = (Math.random() - 0.5) * 32;
                ctx.lineTo(bx + jitterX, by + jitterY);
            }
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.restore();
        }
    }
}

/**
 * ГОЛОВНИЙ КОНТРОЛЕР ГРИ
 */
class GrammarLabGame {
    constructor() {
        this.lang = 'uk';
        this.taskQueue = [];
        this.currentTask = null;
        this.selectedWordIdx = null;
        this.isLocked = false;
        this.isPointerDragging = false;

        this.wordsRack = document.getElementById('words-rack');
        this.questionText = document.getElementById('question-text');
        this.schemaDot1 = document.getElementById('schema-dot-1');
        this.schemaDot2 = document.getElementById('schema-dot-2');
        this.flashOverlay = document.getElementById('electric-flash');
        this.stage = document.getElementById('game-stage');

        this.scientist = new ScientistController();
        this.bgEffects = new BackgroundEffects();
        this.springFX = new SpringAndFXRenderer();

        this.initEvents();
        this.buildQueue();
        this.loadNextTask();
        this.startMainLoop();
    }

    buildQueue() {
        const list = [];
        const sentences = SENTENCE_DB[this.lang];
        sentences.forEach((sObj) => {
            sObj.tasks.forEach((task) => {
                list.push({
                    words: sObj.words,
                    q: task.q,
                    from: task.from,
                    to: task.to
                });
            });
        });

        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        this.taskQueue = list;
    }

    loadNextTask() {
        this.isLocked = false;
        this.selectedWordIdx = null;
        this.springFX.active = false;
        this.springFX.state = 'none';
        this.scientist.resetToCleanIdle();

        if (this.taskQueue.length === 0) {
            this.buildQueue();
        }
        this.currentTask = this.taskQueue.pop();

        this.questionText.style.transform = 'scale(0.84)';
        this.questionText.textContent = this.currentTask.q;
        setTimeout(() => {
            this.questionText.style.transform = 'scale(1)';
        }, 50);

        this.updateSchemaIndicator(false);
        this.renderSentenceNodes();
    }

    updateSchemaIndicator(firstSelected) {
        if (!firstSelected) {
            this.schemaDot1.setAttribute('fill', '#38bdf8');
            this.schemaDot2.setAttribute('fill', '#0f172a');
        } else {
            this.schemaDot1.setAttribute('fill', '#34d399');
            this.schemaDot2.setAttribute('fill', '#38bdf8');
        }
    }

    getNodeTerminalCoords(idx) {
        const nodeEl = this.wordsRack.querySelector(`.word-node[data-idx="${idx}"]`);
        if (!nodeEl) return { x: window.innerWidth * 0.65, y: window.innerHeight * 0.7 };
        const cap = nodeEl.querySelector('.terminal-cap-target');
        const rect = (cap || nodeEl).getBoundingClientRect();
        return {
            x: rect.left + rect.width * 0.5,
            y: rect.top + rect.height * 0.5
        };
    }

    renderSentenceNodes() {
        this.wordsRack.innerHTML = '';

        this.currentTask.words.forEach((word, idx) => {
            const node = document.createElement('div');
            node.className = 'word-node';
            node.dataset.idx = idx;

            node.innerHTML = `
                <div class="terminal-assembly">
                    <svg viewBox="0 0 56 46" width="56" height="46">
                        <defs>
                            <linearGradient id="insulGrad_${idx}" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#0369a1"/>
                                <stop offset="45%" stop-color="#38bdf8"/>
                                <stop offset="75%" stop-color="#0284c7"/>
                                <stop offset="100%" stop-color="#0c4a6e"/>
                            </linearGradient>
                            <radialGradient id="brassKnob_${idx}" cx="35%" cy="35%" r="65%">
                                <stop offset="0%" stop-color="#fef08a"/>
                                <stop offset="50%" stop-color="#eab308"/>
                                <stop offset="100%" stop-color="#78350f"/>
                            </radialGradient>
                        </defs>
                        <rect x="13" y="29" width="30" height="14" rx="4" fill="url(#insulGrad_${idx})" stroke="#082f49" stroke-width="2"/>
                        <rect x="17" y="19" width="22" height="11" rx="4" fill="url(#insulGrad_${idx})" stroke="#082f49" stroke-width="2"/>
                        <circle class="terminal-cap-target" cx="28" cy="11" r="9.5" fill="url(#brassKnob_${idx})" stroke="#451a03" stroke-width="2.2"/>
                        <circle cx="25" cy="8" r="2.6" fill="#ffffff" opacity="0.82"/>
                    </svg>
                </div>

                <div class="word-casing">
                    <div class="rivet tl"></div>
                    <div class="rivet tr"></div>
                    <div class="rivet bl"></div>
                    <div class="rivet br"></div>
                    <div class="word-plate">
                        <span class="word-label">${word}</span>
                    </div>
                </div>
            `;

            node.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                this.handleWordPointerDown(idx, e);
            });

            this.wordsRack.appendChild(node);
        });
    }

    handleWordPointerDown(idx, e) {
        if (this.isLocked) return;

        if (this.selectedWordIdx === null) {
            this.selectedWordIdx = idx;
            this.isPointerDragging = true;
            const nodeEl = this.wordsRack.querySelector(`.word-node[data-idx="${idx}"]`);
            if (nodeEl) nodeEl.classList.add('selected-source');

            const coords = this.getNodeTerminalCoords(idx);
            this.springFX.attachStart(coords.x, coords.y);
            this.springFX.moveTarget(e.clientX, e.clientY);
            audio.playLatchSound(1.0);
            this.scientist.triggerFirstWordSelected();
            this.updateSchemaIndicator(true);
            return;
        }

        if (this.selectedWordIdx === idx) {
            this.clearSelection();
            audio.playSwitchClick();
            return;
        }

        this.evaluateConnection(this.selectedWordIdx, idx);
    }

    clearSelection() {
        this.selectedWordIdx = null;
        this.isPointerDragging = false;
        this.wordsRack.querySelectorAll('.word-node').forEach(el => {
            el.classList.remove('selected-source');
        });
        this.springFX.cancelSpring();
        this.scientist.resetToCleanIdle();
        this.updateSchemaIndicator(false);
    }

    evaluateConnection(fromIdx, toIdx) {
        const targetCoords = this.getNodeTerminalCoords(toIdx);
        const isCorrect = (fromIdx === this.currentTask.from && toIdx === this.currentTask.to);

        const fromEl = this.wordsRack.querySelector(`.word-node[data-idx="${fromIdx}"]`);
        const toEl = this.wordsRack.querySelector(`.word-node[data-idx="${toIdx}"]`);

        if (isCorrect) {
            this.isLocked = true;
            this.isPointerDragging = false;
            audio.playLatchSound(1.3);

            this.springFX.latchToTarget(targetCoords.x, targetCoords.y, true);

            if (fromEl) {
                fromEl.classList.remove('selected-source');
                fromEl.classList.add('connected-success');
            }
            if (toEl) {
                toEl.classList.add('connected-success');
            }

            audio.playElectricExplosion();
            this.bgEffects.triggerGaugeSpin();

            setTimeout(() => {
                this.flashOverlay.style.opacity = '1';
                this.stage.classList.remove('screen-shake');
                void this.stage.offsetWidth;
                this.stage.classList.add('screen-shake');

                this.springFX.triggerLabExplosion();
                this.scientist.triggerExplosionSuccess();

                setTimeout(() => {
                    this.flashOverlay.style.opacity = '0';
                }, 140);
            }, 160);

            setTimeout(() => {
                if (this.isLocked) {
                    this.loadNextTask();
                }
            }, 2650);

        } else {
            audio.playWrongSpringRecoil();
            this.springFX.latchToTarget(targetCoords.x, targetCoords.y, false);
            this.scientist.triggerPuzzled();

            if (fromEl) {
                fromEl.classList.remove('selected-source');
                fromEl.classList.add('connected-error');
            }
            if (toEl) {
                toEl.classList.add('connected-error');
            }

            setTimeout(() => {
                if (fromEl) fromEl.classList.remove('connected-error');
                if (toEl) toEl.classList.remove('connected-error');
            }, 480);

            this.selectedWordIdx = null;
            this.isPointerDragging = false;
            this.updateSchemaIndicator(false);
        }
    }

    initEvents() {
        window.addEventListener('pointermove', (e) => {
            this.scientist.lookAt(e.clientX, e.clientY);
            if (this.selectedWordIdx !== null && !this.isLocked) {
                this.springFX.moveTarget(e.clientX, e.clientY);
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (!this.isPointerDragging || this.selectedWordIdx === null || this.isLocked) return;
            this.isPointerDragging = false;

            const elUnderPointer = document.elementFromPoint(e.clientX, e.clientY);
            const targetNode = elUnderPointer ? elUnderPointer.closest('.word-node') : null;
            if (targetNode) {
                const targetIdx = parseInt(targetNode.dataset.idx, 10);
                if (!isNaN(targetIdx) && targetIdx !== this.selectedWordIdx) {
                    this.evaluateConnection(this.selectedWordIdx, targetIdx);
                }
            }
        });

        window.addEventListener('pointerdown', (e) => {
            if (this.selectedWordIdx !== null && !this.isLocked) {
                const clickedNode = e.target.closest('.word-node');
                const clickedNext = e.target.closest('#next-btn');
                const clickedLang = e.target.closest('#lang-toggle');
                if (!clickedNode && !clickedNext && !clickedLang) {
                    this.clearSelection();
                }
            }
        });

        window.addEventListener('resize', () => {
            if (this.selectedWordIdx !== null) {
                const c = this.getNodeTerminalCoords(this.selectedWordIdx);
                this.springFX.startPos = c;
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            audio.playSwitchClick();
            this.loadNextTask();
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const newLang = btn.dataset.lang;
                if (newLang === this.lang) return;
                this.lang = newLang;
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
                audio.playSwitchClick();
                this.buildQueue();
                this.loadNextTask();
            });
        });
    }

    startMainLoop() {
        const loop = () => {
            this.bgEffects.updateAndDraw();
            this.springFX.updateAndDraw();
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
    }
}

window.onload = () => {
    new GrammarLabGame();
};
</script>
