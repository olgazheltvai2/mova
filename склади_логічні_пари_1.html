<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1d6ea3;
    touch-action: none;
    font-family: system-ui, sans-serif;
  }
  #game {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
  }

  /* Living scenic backdrop */
  #scene-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .cloud-a { animation: driftA 52s linear infinite; }
  .cloud-b { animation: driftB 68s linear infinite; }
  .cloud-c { animation: driftC 44s linear infinite; }
  @keyframes driftA { from { transform: translateX(-260px); } to { transform: translateX(1780px); } }
  @keyframes driftB { from { transform: translateX(1760px); } to { transform: translateX(-280px); } }
  @keyframes driftC { from { transform: translateX(-200px); } to { transform: translateX(1760px); } }

  .gull-1 { animation: gullFly 26s linear infinite; }
  .gull-2 { animation: gullFly 34s linear infinite 9s; }
  @keyframes gullFly {
    0% { transform: translate(-120px, 0px); }
    50% { transform: translate(820px, -28px); }
    100% { transform: translate(1750px, 8px); }
  }
  .wing-flap { animation: flap 0.72s ease-in-out infinite alternate; transform-origin: 0 0; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-0.55); } }

  .pine-sway { animation: sway 5.2s ease-in-out infinite alternate; transform-origin: bottom center; transform-box: fill-box; }
  .pine-sway-2 { animation: sway 6.4s ease-in-out infinite alternate-reverse; transform-origin: bottom center; transform-box: fill-box; }
  @keyframes sway { from { transform: rotate(-2.2deg); } to { transform: rotate(2.4deg); } }

  .wave-drift { animation: waveMove 7s ease-in-out infinite alternate; }
  .wave-drift-2 { animation: waveMove 9s ease-in-out infinite alternate-reverse; }
  @keyframes waveMove { from { transform: translateX(-26px); } to { transform: translateX(26px); } }

  .lighthouse-beam { animation: beamPulse 4s ease-in-out infinite alternate; transform-origin: 1380px 362px; }
  @keyframes beamPulse { from { opacity: 0.14; transform: rotate(-6deg); } to { opacity: 0.42; transform: rotate(6deg); } }

  /* Minimalist top-right buttons (no words) */
  #controls {
    position: absolute; top: 18px; right: 22px; z-index: 40;
    display: flex; gap: 12px; align-items: center;
  }
  .ctrl-btn {
    width: 56px; height: 56px; border-radius: 50%; border: 3px solid #ffe49e;
    background: radial-gradient(circle at 32% 28%, #ffaa42, #d95816);
    box-shadow: 0 6px 0 #8a2f05, 0 10px 22px rgba(0,0,0,0.32);
    cursor: pointer; display: grid; place-items: center;
    transition: transform 0.14s cubic-bezier(.34,1.56,.64,1), box-shadow 0.14s ease;
  }
  .ctrl-btn:hover { transform: translateY(-2px) scale(1.06); }
  .ctrl-btn:active { transform: translateY(3px) scale(0.95); box-shadow: 0 2px 0 #8a2f05, 0 4px 10px rgba(0,0,0,0.28); }
  .ctrl-btn.sound-btn {
    width: 48px; height: 48px;
    background: radial-gradient(circle at 32% 28%, #3dd4c5, #127a7a);
    box-shadow: 0 5px 0 #0a494a, 0 8px 18px rgba(0,0,0,0.28);
  }
  .ctrl-btn.sound-btn.muted {
    background: radial-gradient(circle at 32% 28%, #8f9ba8, #53606e);
    box-shadow: 0 5px 0 #343d47, 0 8px 18px rgba(0,0,0,0.25);
  }

  /* Main wide-screen matching stage */
  #stage {
    position: relative; z-index: 15;
    width: 100%; height: 73vh;
    padding: clamp(18px, 3vh, 38px) clamp(24px, 4vw, 72px) 0 clamp(170px, 16vw, 250px);
    display: flex; flex-direction: column; justify-content: space-evenly; align-items: center;
  }
  .row {
    width: 100%; max-width: 1120px;
    display: flex; justify-content: space-evenly; align-items: center;
    gap: clamp(14px, 2.4vw, 36px);
  }

  /* Stylized brass-rimmed textured porthole medallions (NO white rectangles!) */
  .slot {
    position: relative;
    width: clamp(118px, 13.5vw, 174px);
    height: clamp(118px, 13.5vw, 174px);
    display: grid; place-items: center;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .slot.entering { animation: popIn 0.52s cubic-bezier(.34,1.56,.64,1) backwards; }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.3) translateY(-30px) rotate(-12deg); }
    100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
  }
  .slot.matched {
    opacity: 0; transform: scale(0.15) translateY(70px); pointer-events: none;
  }

  .medallion {
    position: relative; width: 100%; height: 100%;
    border-radius: 34% 38% 36% 32% / 36% 32% 38% 34%;
    padding: 11px;
    cursor: grab;
    box-shadow:
      0 12px 24px rgba(10, 32, 48, 0.36),
      0 5px 0 rgba(52, 28, 8, 0.45),
      inset 0 3px 5px rgba(255, 248, 220, 0.72),
      inset 0 -5px 8px rgba(0, 0, 0, 0.28);
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease, filter 0.2s ease;
    animation: idleFloat 4.2s ease-in-out infinite;
  }
  .slot:nth-child(2) .medallion { animation-delay: -1.1s; border-radius: 38% 32% 35% 36% / 33% 38% 34% 36%; }
  .slot:nth-child(3) .medallion { animation-delay: -2.2s; border-radius: 33% 37% 32% 38% / 37% 33% 36% 34%; }
  .slot:nth-child(4) .medallion { animation-delay: -3.3s; border-radius: 36% 34% 38% 33% / 35% 36% 33% 37%; }
  @keyframes idleFloat {
    0%, 100% { transform: translateY(0px) rotate(-0.8deg); }
    50% { transform: translateY(-6px) rotate(0.9deg); }
  }
  .medallion:hover {
    transform: translateY(-8px) scale(1.07) !important;
    filter: brightness(1.06);
    z-index: 5;
  }
  .medallion.selected {
    transform: scale(1.1) translateY(-9px) !important;
    box-shadow:
      0 0 0 6px #fff282,
      0 0 28px rgba(255, 224, 71, 0.9),
      0 14px 26px rgba(10, 32, 48, 0.4);
    z-index: 8;
  }
  .medallion.drop-hover {
    transform: scale(1.13) !important;
    box-shadow:
      0 0 0 6px #78ffbe,
      0 0 32px rgba(96, 255, 180, 0.95),
      0 14px 28px rgba(10, 32, 48, 0.4);
  }
  .medallion.dragging-src { opacity: 0.28; transform: scale(0.9) !important; }
  .medallion.wrong { animation: wobbleNo 0.48s ease !important; }
  @keyframes wobbleNo {
    0%,100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-12px) rotate(-7deg); }
    40% { transform: translateX(12px) rotate(7deg); }
    60% { transform: translateX(-8px) rotate(-4deg); }
    80% { transform: translateX(7px) rotate(4deg); }
  }

  /* Colorful patterned medallion rim themes */
  .th-coral  { background: repeating-linear-gradient(135deg, #ff7b54 0 12px, #e85535 12px 24px); }
  .th-teal   { background: repeating-linear-gradient(135deg, #2ec4b6 0 12px, #16948a 12px 24px); }
  .th-amber  { background: repeating-linear-gradient(135deg, #ffbf3f 0 12px, #e38e17 12px 24px); }
  .th-plum   { background: repeating-linear-gradient(135deg, #a663cc 0 12px, #7b3ba3 12px 24px); }
  .th-meadow { background: repeating-linear-gradient(135deg, #62c370 0 12px, #3b994c 12px 24px); }
  .th-cobalt { background: repeating-linear-gradient(135deg, #4b9ce2 0 12px, #256eb5 12px 24px); }
  .th-berry  { background: repeating-linear-gradient(135deg, #ee6c9c 0 12px, #c43f72 12px 24px); }
  .th-ochre  { background: repeating-linear-gradient(135deg, #e09f3e 0 12px, #b57219 12px 24px); }

  /* Rich tinted parchment/sky inner basin (never plain white!) */
  .medallion-well {
    width: 100%; height: 100%;
    border-radius: inherit;
    background:
      radial-gradient(circle at 30% 25%, #fff5d6 0%, #f5dfb0 58%, #dfc088 100%);
    border: 3px solid rgba(255, 245, 205, 0.82);
    box-shadow: inset 0 6px 14px rgba(107, 65, 16, 0.28);
    display: grid; place-items: center;
    padding: 8%;
    position: relative;
    overflow: hidden;
  }
  .medallion-well::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(168, 114, 34, 0.13) 1.5px, transparent 1.5px);
    background-size: 14px 14px;
  }
  .th-teal .medallion-well, .th-cobalt .medallion-well {
    background: radial-gradient(circle at 30% 25%, #e4f8ff 0%, #c0eaf7 60%, #96d2e8 100%);
  }
  .th-meadow .medallion-well {
    background: radial-gradient(circle at 30% 25%, #eefce0 0%, #d2f0b4 60%, #b0db8a 100%);
  }
  .th-plum .medallion-well, .th-berry .medallion-well {
    background: radial-gradient(circle at 30% 25%, #fcebff 0%, #ebd2f7 60%, #d4b0e8 100%);
  }

  .art-svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 5px 6px rgba(34, 24, 12, 0.28));
    position: relative; z-index: 2;
    pointer-events: none;
  }

  /* Animated Captain Otter on the wooden pier */
  #otter-wrap {
    position: absolute; left: clamp(8px, 1.5vw, 28px); bottom: clamp(22px, 4.5vh, 52px);
    width: clamp(148px, 14vw, 215px); height: clamp(178px, 17vw, 255px);
    z-index: 22; cursor: pointer;
    transform-origin: bottom center;
    transition: transform 0.25s ease;
  }
  #otter-wrap:hover { transform: scale(1.04); }
  .otter-breathe { animation: otterBreath 3.1s ease-in-out infinite; transform-origin: 100px 210px; }
  @keyframes otterBreath { 0%,100% { transform: scaleY(1) translateY(0); } 50% { transform: scaleY(1.022) translateY(-2px); } }
  .otter-tail { animation: tailSwish 2.3s ease-in-out infinite alternate; transform-origin: 120px 180px; }
  @keyframes tailSwish { from { transform: rotate(-6deg); } to { transform: rotate(9deg); } }

  #otter-wrap.happy-jump { animation: oJump 0.72s cubic-bezier(.34,1.56,.64,1); }
  @keyframes oJump {
    0% { transform: translateY(0) scale(1); }
    35% { transform: translateY(-34px) scale(1.08) rotate(-5deg); }
    65% { transform: translateY(-10px) scale(1.04) rotate(5deg); }
    100% { transform: translateY(0) scale(1); }
  }
  #otter-wrap.happy-spin { animation: oSpin 0.78s ease-in-out; }
  @keyframes oSpin {
    0% { transform: rotate(0) scale(1); }
    45% { transform: rotate(-11deg) translateY(-22px) scale(1.07); }
    75% { transform: rotate(10deg) translateY(-10px) scale(1.05); }
    100% { transform: rotate(0) scale(1); }
  }
  #otter-wrap.confused { animation: oConfused 0.55s ease; }
  @keyframes oConfused {
    0%,100% { transform: rotate(0); }
    30% { transform: rotate(-10deg) translateX(-6px); }
    65% { transform: rotate(9deg) translateX(6px); }
  }

  /* Wooden River Ferryboat carrying matched pairs */
  #river-lane {
    position: absolute; left: 0; right: 0; bottom: clamp(8px, 1.8vh, 22px);
    height: clamp(122px, 19vh, 178px);
    z-index: 18; pointer-events: none;
    display: flex; justify-content: center; align-items: flex-end;
    padding-left: clamp(135px, 13vw, 200px);
  }
  #ferry {
    position: relative;
    width: clamp(540px, 60vw, 860px);
    height: 100%;
    transition: transform 1.45s cubic-bezier(.22,.82,.25,1);
    will-change: transform;
  }
  #ferry.bobbing { animation: boatBob 3.2s ease-in-out infinite; }
  @keyframes boatBob {
    0%,100% { transform: translateY(0px) rotate(-0.6deg); }
    50% { transform: translateY(-6px) rotate(0.7deg); }
  }
  #ferry.enter-left { transform: translateX(-130vw) !important; transition: none !important; animation: none !important; }
  #ferry.sail-right { transform: translateX(130vw) !important; animation: none !important; }

  .cargo-deck {
    position: absolute; left: 10%; right: 27%; bottom: 42%;
    height: 48%;
    display: flex; justify-content: space-evenly; align-items: flex-end; gap: 8px;
    z-index: 4;
  }
  .cargo-bay {
    width: 23%; height: 92%;
    border-radius: 16px 16px 10px 10px;
    background: linear-gradient(180deg, rgba(255,232,175,0.28), rgba(92,50,18,0.45));
    border: 2.5px dashed rgba(255, 232, 170, 0.55);
    display: flex; justify-content: center; align-items: center; gap: 2px;
    padding: 4px 6px;
    transition: all 0.38s cubic-bezier(.34,1.56,.64,1);
  }
  .cargo-bay.filled {
    background: linear-gradient(180deg, #ffe7a8, #e6a94c);
    border: 2.5px solid #fff5cc;
    box-shadow: 0 6px 12px rgba(45, 22, 6, 0.38);
    animation: crateDrop 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes crateDrop {
    0% { transform: translateY(-48px) scale(0.4); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .cargo-bay svg { width: 47%; height: 88%; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.24)); }

  .paddle-spin { animation: spinWheel 1.6s linear infinite; transform-origin: 86px 114px; }
  #ferry.sailing .paddle-spin { animation-duration: 0.35s; }
  @keyframes spinWheel { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Floating Drag Ghost & FX Canvas */
  #drag-ghost {
    position: fixed; z-index: 60; pointer-events: none; display: none;
    filter: drop-shadow(0 20px 26px rgba(10, 28, 44, 0.42));
  }
  #fx-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 50;
  }
</style>
</head>

<div id="game">
  <!-- Living Sunlit Harbor Scenery -->
  <svg id="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <rect width="1600" height="900" fill="url(#g-sky)"/>

    <!-- Warm Sun & Glow -->
    <circle cx="1310" cy="136" r="142" fill="#fff4b8" opacity="0.28"/>
    <circle cx="1310" cy="136" r="76" fill="#fff099" opacity="0.62"/>
    <circle cx="1310" cy="136" r="46" fill="#fffce0"/>

    <!-- Distant Coastal Mountains -->
    <path d="M-40 570 L210 345 L440 520 L730 305 L1030 510 L1320 330 L1640 550 L1640 690 L-40 690 Z" fill="#7fb2d4" opacity="0.55"/>
    <path d="M210 345 L258 402 L224 410 L204 392 L175 406 Z" fill="#f5fbff" opacity="0.72"/>
    <path d="M730 305 L784 372 L746 380 L724 358 L692 376 Z" fill="#f5fbff" opacity="0.75"/>

    <!-- Drifting Volumetric Clouds -->
    <g class="cloud-a" opacity="0.92">
      <g transform="translate(0, 78)">
        <ellipse cx="90" cy="48" rx="70" ry="26" fill="#fff"/>
        <circle cx="60" cy="36" r="32" fill="#fff"/><circle cx="104" cy="28" r="38" fill="#fff"/><circle cx="140" cy="42" r="25" fill="#eef6ff"/>
      </g>
    </g>
    <g class="cloud-b" opacity="0.84">
      <g transform="translate(0, 166) scale(0.78)">
        <ellipse cx="100" cy="46" rx="78" ry="24" fill="#fff"/>
        <circle cx="70" cy="34" r="30" fill="#fff"/><circle cx="116" cy="28" r="36" fill="#fff"/><circle cx="152" cy="42" r="24" fill="#edf6ff"/>
      </g>
    </g>

  /* =========================================================================

  const Sound = (() => {
    let ctx = null, muted = false;
    function boot() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    }
    function tone(f, type, delay, dur, vol = 0.16, slide = null) {
      if (muted) return;
      boot();
      const t = ctx.currentTime + delay;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.018);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function pick() { tone(520, 'sine', 0, 0.09, 0.13, 760); }
    function wrong() {
      tone(285, 'triangle', 0, 0.14, 0.15, 205);
      tone(215, 'sine', 0.1, 0.17, 0.13, 168);
    }
    function whoosh() {
      if (muted) return; boot();
      const dur = 0.22, buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length);
      const s = ctx.createBufferSource(); s.buffer = buf;
      const flt = ctx.createBiquadFilter(); flt.type = 'bandpass';
      flt.frequency.setValueAtTime(380, ctx.currentTime);
      flt.frequency.exponentialRampToValueAtTime(1500, ctx.currentTime + dur);
      const g = ctx.createGain(); g.gain.value = 0.14;
      s.connect(flt); flt.connect(g); g.connect(ctx.destination); s.start();
    }
    function celebrate(v) {
      const fx = [
        () => [523,659,784,1046].forEach((n,i) => tone(n,'triangle',i*0.065,0.26,0.16)),
        () => [587,740,880,1175].forEach((n,i) => tone(n,'sine',i*0.055,0.3,0.16)),
        () => [523,587,659,784,880,1046].forEach((n,i) => tone(n,'sine',i*0.042,0.22,0.13)),
        () => { tone(960,'sine',0,0.09,0.14,1460); tone(1160,'sine',0.1,0.11,0.15,1740); tone(1320,'triangle',0.21,0.22,0.15,1540); },
        () => [659,831,988,1319].forEach((n,i) => tone(n,'sine',i*0.055,0.33,0.15)),
        () => { tone(580,'sine',0,0.15,0.14,1180); tone(880,'triangle',0.14,0.24,0.16); tone(1175,'triangle',0.21,0.28,0.16); }
      ];
      fx[v % fx.length]();
    }
    function shipHorn() {
      // Cheerful dual-tone harbor ferry horn + ship bell
      [0, 0.36].forEach(t => {
        tone(220, 'sawtooth', t, 0.28, 0.08);
        tone(277.18, 'triangle', t, 0.28, 0.13);
        tone(440, 'sine', t, 0.28, 0.09);
      });
      tone(1318, 'sine', 0.7, 0.38, 0.14);

    }

      tone(860,'sine',0.09,0.1,0.12,1200);

    return { pick, wrong, whoosh, celebrate, shipHorn, giggle, setMuted: m => { muted = m; }, isMuted: () => muted };
  })();

  const canvas = document.getElementById('fx-canvas');

  function fitCanvas() {

  function spawnFX(x, y, styleIdx) {
    const colors = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#4de8d8','#ff75b5'];
    const m = styleIdx % 6;
    if (m === 0) {
      for (let i = 0; i < 34; i++) {
        const a = (Math.PI * 2 * i) / 34 + Math.random() * 0.2, sp = 3 + Math.random() * 8;
        particles.push({ k:'star', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2, s:7+Math.random()*8, r:Math.random()*6, vr:(Math.random()-.5)*0.25, c:colors[i%8], l:1, d:0.015, g:0.16 });
      }
    } else if (m === 1) {
      for (let i = 0; i < 24; i++) {
        particles.push({ k:'bubble', x:x+(Math.random()-.5)*130, y:y+(Math.random()-.5)*60, vx:(Math.random()-.5)*2.4, vy:-(2.5+Math.random()*4.5), s:10+Math.random()*16, c:colors[i%8], l:1, d:0.011, w:Math.random()*6 });
      }
    } else if (m === 2) {
      for (let i = 0; i < 40; i++) {
        const a = Math.random()*Math.PI*2, sp = 2.5+Math.random()*8.5;
        particles.push({ k:'petal', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-4, s:8+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*0.3, c:colors[i%8], l:1, d:0.013, g:0.18 });
      }
    } else if (m === 3) {

      for (let i = 0; i < 16; i++) {

        particles.push({ k:'note', x, y, vx:Math.cos(a)*(2.5+Math.random()*4), vy:Math.sin(a)*3-3.5, s:10+Math.random()*5, c:colors[i%8], l:1, d:0.014, g:0.06 });

        particles.push({ k:i%2?'star':'petal', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, s:8+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*0.26, c:colors[i%8], l:1, d:0.014, g:0.22 });

  function drawStar(c, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r : r * 0.45, ang = (Math.PI * i) / 5 - Math.PI / 2;
      i ? c.lineTo(Math.cos(ang)*rad, Math.sin(ang)*rad) : c.moveTo(Math.cos(ang)*rad, Math.sin(ang)*rad);
    }
    c.closePath(); c.fill();

    ctx.clearRect(0, 0, innerWidth, innerHeight);

      ctx.strokeStyle = '#fff8bd'; ctx.lineWidth = 5; ctx.setLineDash([12, 10]); ctx.lineDashOffset = -performance.now() * 0.06; ctx.stroke();

        p.s += (p.ms - p.s) * 0.12; ctx.strokeStyle = p.c; ctx.lineWidth = 5 * p.l;

        else if (p.k === 'drop') { ctx.beginPath(); ctx.arc(0, 0, p.s, 0, Math.PI * 2); ctx.fill(); }
        else if (p.k === 'petal') { ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, Math.PI * 2); ctx.fill(); }
        else if (p.k === 'diamond') { ctx.beginPath(); ctx.moveTo(0,-p.s); ctx.lineTo(p.s*0.6,0); ctx.lineTo(0,p.s); ctx.lineTo(-p.s*0.6,0); ctx.closePath(); ctx.fill(); }
        else if (p.k === 'note') {
          ctx.beginPath(); ctx.ellipse(-3, 5, 5.5, 4, -0.3, 0, Math.PI*2); ctx.fill(); ctx.fillRect(1, -12, 3, 17);
          ctx.beginPath(); ctx.moveTo(3,-12); ctx.quadraticCurveTo(12,-9,9,-2); ctx.lineWidth = 3; ctx.strokeStyle = p.c; ctx.stroke();
        }
      }
      ctx.restore();
    }
    requestAnimationFrame(fxTick);
  }
  fxTick();

  /* =========================================================================
     4. LIVING CAPTAIN OTTER (EYE TRACKING, BLINKING, JOYFUL REACTIONS)
     ========================================================================= */
  const otterWrap = document.getElementById('otter-wrap');
  const otterPupils = document.getElementById('otter-pupils');
  const otterMouth = document.getElementById('otter-mouth');
  const lidL = document.getElementById('lid-l'), lidR = document.getElementById('lid-r');

  addEventListener('pointermove', e => {
    const r = otterWrap.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width * 0.5), dy = e.clientY - (r.top + r.height * 0.4);
    const a = Math.atan2(dy, dx), d = Math.min(3.4, Math.hypot(dx, dy) / 90);
    otterPupils.setAttribute('transform', `translate(${(Math.cos(a)*d).toFixed(2)},${(Math.sin(a)*d).toFixed(2)})`);
  });

  setInterval(() => {
    lidL.setAttribute('ry','13'); lidR.setAttribute('ry','13');
    setTimeout(() => { lidL.setAttribute('ry','0'); lidR.setAttribute('ry','0'); }, 135);
  }, 3600);

  let otterTimer = null;
  function reactOtter(mood) {
    otterWrap.classList.remove('happy-jump','happy-spin','confused');
    void otterWrap.offsetWidth; clearTimeout(otterTimer);
    if (mood === 'happy') {
      otterWrap.classList.add(Math.random() < 0.5 ? 'happy-jump' : 'happy-spin');
      otterMouth.setAttribute('d', 'M82 122 Q96 138 110 122');
    } else {
      otterWrap.classList.add('confused');
      otterMouth.setAttribute('d', 'M89 128 Q96 123 103 128');
    }
    otterTimer = setTimeout(() => {
      otterWrap.classList.remove('happy-jump','happy-spin','confused');
      otterMouth.setAttribute('d', 'M86 124 Q96 133 106 124');
    }, 850);
  }

  otterWrap.addEventListener('pointerdown', () => {
    Sound.giggle(); reactOtter('happy');
    const r = otterWrap.getBoundingClientRect();
    spawnFX(r.left + r.width * 0.5, r.top + r.height * 0.3, 1);
  });

  /* =========================================================================
     5. INFINITE GENERATOR & GAMEPLAY ENGINE
     ========================================================================= */
  const rowTop = document.getElementById('row-top');
  const rowBottom = document.getElementById('row-bottom');
  const ferry = document.getElementById('ferry');
  const dragGhost = document.getElementById('drag-ghost');
  const nextBtn = document.getElementById('next-btn');
  const soundBtn = document.getElementById('sound-btn');
  const soundWaves = document.getElementById('sound-waves');

  let deck = [], matched = 0, fxIdx = 0, skyIdx = 0, selected = null, busy = false;
  let roundTimer = null, splashTimer = null;

  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function drawFourPairs() {
    const out = [];
    while (out.length < 4) {
      if (!deck.length) deck = shuffle(PAIRS);
      const p = deck.pop();
      if (!out.includes(p)) out.push(p);
    }
    return out;
  }

  function derange(n) {
    let r = shuffle([...Array(n).keys()]), t = 0;
    while (r.filter((v, i) => v === i).length > 1 && t++ < 20) r = shuffle(r);
    return r;
  }

  function svgIcon(key) {
    return `<svg class="art-svg" viewBox="0 0 120 120">${ART[key]}</svg>`;
  }

  function setSky(i) {
    const [c1, c2, c3] = SKIES[i % SKIES.length];
    document.getElementById('sky1').setAttribute('stop-color', c1);
    document.getElementById('sky2').setAttribute('stop-color', c2);
    document.getElementById('sky3').setAttribute('stop-color', c3);
  }

  function startWake() {
    stopWake();
    splashTimer = setInterval(() => {
      const r = ferry.getBoundingClientRect();
      if (r.right > 0 && r.left < innerWidth) spawnSplash(r.left + r.width * 0.1, r.bottom - 14);
    }, 150);
  }
  function stopWake() { if (splashTimer) { clearInterval(splashTimer); splashTimer = null; } }

  function loadRound() {
    clearTimeout(roundTimer);
    busy = false; selected = null; matched = 0; rope = null;
    setSky(skyIdx++);

    for (let i = 0; i < 4; i++) {
      const b = document.getElementById(`bay-${i}`);
      b.classList.remove('filled'); b.innerHTML = '';
    }

    ferry.classList.remove('sail-right', 'bobbing');
    ferry.classList.add('enter-left', 'sailing');
    void ferry.offsetWidth;
    requestAnimationFrame(() => {
      ferry.classList.remove('enter-left');
      startWake();
      setTimeout(() => {
        ferry.classList.remove('sailing');
        ferry.classList.add('bobbing');
        stopWake();
      }, 1350);
    });

    const round = drawFourPairs().map((pair, id) => {
      const flip = Math.random() < 0.5;
      return { id, top: flip ? pair[1] : pair[0], bot: flip ? pair[0] : pair[1] };
    });

    const tThemes = shuffle(THEMES).slice(0, 4);
    const bThemes = shuffle(THEMES).slice(0, 4);
    const bOrder = derange(4);

    rowTop.innerHTML = ''; rowBottom.innerHTML = '';
    round.forEach((item, i) => rowTop.appendChild(makeSlot('top', item.id, item.top, tThemes[i], i * 65)));
    bOrder.forEach((ri, pos) => rowBottom.appendChild(makeSlot('bottom', round[ri].id, round[ri].bot, bThemes[pos], 150 + pos * 65)));
  }

  function makeSlot(row, pairId, key, theme, delay) {
    const slot = document.createElement('div');
    slot.className = 'slot entering';
    slot.style.animationDelay = `${delay}ms`;
    slot.dataset.row = row; slot.dataset.pair = String(pairId); slot.dataset.key = key;

    const card = document.createElement('div');
    card.className = `medallion ${theme}`;
    card.innerHTML = `<div class="medallion-well">${svgIcon(key)}</div>`;
    slot.appendChild(card);

    card.addEventListener('pointerdown', e => onDown(e, slot, card));
    return slot;
  }

  /* =========================================================================
     6. UNIFIED DRAG-AND-DROP + CLICK-TO-MATCH
     ========================================================================= */
  let drag = null;

  function onDown(e, slot, card) {
    if (busy || slot.classList.contains('matched')) return;
    e.preventDefault();
    Sound.pick();
    const r = card.getBoundingClientRect();
    drag = {
      pid: e.pointerId, slot, card,
      sx: e.clientX, sy: e.clientY,
      ox: r.left + r.width / 2, oy: r.top + r.height / 2,
      lx: e.clientX, active: false, hover: null
    };
  }

  addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.active && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 10) {
      drag.active = true;
      clearSel();
      drag.card.classList.add('dragging-src');
      const r = drag.card.getBoundingClientRect();
      dragGhost.innerHTML = '';
      const cl = drag.card.cloneNode(true);
      cl.classList.remove('dragging-src', 'selected', 'wrong');
      cl.style.animation = 'none'; cl.style.width = r.width + 'px'; cl.style.height = r.height + 'px';
      dragGhost.appendChild(cl); dragGhost.style.display = 'block';
    }
    if (drag.active) {
      const tilt = Math.max(-18, Math.min(18, (e.clientX - drag.lx) * 0.9));
      drag.lx = e.clientX;
      dragGhost.style.left = e.clientX + 'px';
      dragGhost.style.top = e.clientY + 'px';
      dragGhost.style.transform = `translate(-50%,-50%) scale(1.08) rotate(${tilt}deg)`;
      rope = { x1: drag.ox, y1: drag.oy, x2: e.clientX, y2: e.clientY };

      const tgtRow = drag.slot.dataset.row === 'top' ? 'bottom' : 'top';
      const hit = hitSlot(e.clientX, e.clientY, tgtRow);
      if (drag.hover && drag.hover !== hit) drag.hover.querySelector('.medallion').classList.remove('drop-hover');
      drag.hover = hit;
      if (hit) hit.querySelector('.medallion').classList.add('drop-hover');
    }
  });

  function onUp(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    if (d.active) {
      dragGhost.style.display = 'none'; dragGhost.innerHTML = '';
      d.card.classList.remove('dragging-src'); rope = null;
      if (d.hover) {
        d.hover.querySelector('.medallion').classList.remove('drop-hover');
        checkPair(d.slot, d.hover);
      } else {
        const near = hitSlot(e.clientX, e.clientY, d.slot.dataset.row === 'top' ? 'bottom' : 'top', 24);
        if (near) checkPair(d.slot, near);
      }
    } else {
      clickSelect(d.slot, d.card);
    }
  }
  addEventListener('pointerup', onUp);
  addEventListener('pointercancel', onUp);

  function hitSlot(x, y, row, pad = 10) {
    for (const s of document.querySelectorAll(`.slot[data-row="${row}"]:not(.matched)`)) {
      const r = s.getBoundingClientRect();
      if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return s;
    }
    return null;
  }

  function clearSel() {
    if (selected) { selected.card.classList.remove('selected'); selected = null; }
  }

  function clickSelect(slot, card) {
    if (!selected) { selected = { slot, card }; card.classList.add('selected'); return; }
    if (selected.slot === slot) { clearSel(); return; }
    if (selected.slot.dataset.row === slot.dataset.row) {
      clearSel(); selected = { slot, card }; card.classList.add('selected'); return;
    }
    const first = selected.slot; clearSel();
    checkPair(first, slot);
  }

  function checkPair(a, b) {
    if (a.dataset.pair === b.dataset.pair) {
      a.classList.add('matched'); b.classList.add('matched');
      const rA = a.getBoundingClientRect(), rB = b.getBoundingClientRect();
      const v = fxIdx++;
      Sound.celebrate(v);
      spawnFX(rB.left + rB.width / 2, rB.top + rB.height / 2, v);
      spawnFX((rA.left + rB.left + rA.width) / 2, (rA.top + rB.top + rA.height) / 2, (v + 2) % 6);
      reactOtter('happy');

      const bay = document.getElementById(`bay-${matched}`);
      if (bay) {
        bay.innerHTML = svgIcon(a.dataset.key) + svgIcon(b.dataset.key);
        requestAnimationFrame(() => {
          bay.classList.add('filled');
          const br = bay.getBoundingClientRect();
          spawnSplash(br.left + br.width / 2, br.bottom + 14);
        });
      }

      if (++matched >= 4) {
        busy = true;
        roundTimer = setTimeout(() => {
          Sound.shipHorn();
          spawnGrandParade();
          reactOtter('happy');
          ferry.classList.remove('bobbing');
          ferry.classList.add('sailing', 'sail-right');
          startWake();
          roundTimer = setTimeout(() => { stopWake(); loadRound(); }, 1650);
        }, 520);
      }
    } else {
      Sound.wrong(); reactOtter('confused');
      [a, b].forEach(s => {
        const c = s.querySelector('.medallion');
        c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong');
        setTimeout(() => c.classList.remove('wrong'), 500);
      });
    }
  }

  nextBtn.addEventListener('click', () => { Sound.whoosh(); stopWake(); loadRound(); });
  soundBtn.addEventListener('click', () => {
    const m = !Sound.isMuted(); Sound.setMuted(m);
    soundBtn.classList.toggle('muted', m);
    soundWaves.style.opacity = m ? '0.18' : '1';
    if (!m) Sound.pick();
  });

  loadRound();
})();
</script>
</body>
</html>
