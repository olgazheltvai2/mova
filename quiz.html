<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вікторина</title>
<style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; height: 100vh; background-color: #f0f0f0; background-size: cover; background-position: center; transition: background-image 0.5s; overflow: hidden; }
    #game-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 15px; width: 90%; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; }
    #question { font-size: 28px; font-weight: bold; margin-bottom: 20px; color: #333; line-height: 1.3; }
    #options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .option-btn { background: #007bff; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 20px; cursor: pointer; transition: all 0.2s; font-family: Arial, sans-serif; word-wrap: break-word; }
    .option-btn:hover { background: #0056b3; transform: scale(1.02); }
    .option-btn.correct { background: #28a745 !important; box-shadow: 0 4px 15px rgba(40,167,69,0.5); }
    .option-btn.incorrect { background: #dc3545 !important; box-shadow: 0 4px 15px rgba(220,53,69,0.5); }
    
    #theme-btn { position: fixed; bottom: 20px; right: 20px; z-index: 9999; width: 50px; height: 50px; border-radius: 50%; background: white; border: 2px solid #ccc; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
    #theme-btn:hover { background: #f8f9fa; transform: scale(1.1); }
    #theme-modal { position: fixed; bottom: 80px; right: 20px; z-index: 9998; width: 320px; max-height: 60vh; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: none; flex-direction: column; overflow: hidden; }
    #theme-modal-header { padding: 12px; background: #343a40; color: white; text-align: center; font-weight: bold; font-size: 16px; }
    #theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; overflow-y: auto; max-height: calc(60vh - 44px); }
    .theme-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
    .theme-thumb:hover { border: 2px solid #007bff; }
    .theme-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; font-size: 12px; padding: 4px 0; text-align: center; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; }
    
    @keyframes flyOut { to { transform: translate(150%, -50%) rotate(45deg) scale(0.5); opacity: 0; } }
    .anim-fly-out { animation: flyOut 0.5s forwards cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
</style>
</head>
<body>
<div id="game-container">
    <div id="quiz-wrapper">
        <div id="question">Завантаження...</div>
        <div id="options"></div>
    </div>
</div>

<button id="theme-btn" title="Налаштування фону">⚙️</button>
<div id="theme-modal">
    <div id="theme-modal-header">Галерея фонів</div>
    <div id="theme-grid"></div>
</div>

<script>
    // --- ЛОГІКА ВІКТОРИНИ ---
    const questions = [
        { q: "Як називається наша планета?", a: "Земля", options: ["Земля", "Марс", "Венера", "Юпітер"] },
        { q: "Скільки буде 2 + 2?", a: "4", options: ["4", "5", "3", "2"] },
        { q: "Який колір у чистого неба?", a: "Блакитний", options: ["Блакитний", "Червоний", "Зелений", "Жовтий"] }
    ];
    
    let currentIndex = 0;
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const quizWrapper = document.getElementById('quiz-wrapper');

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex > 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function loadQuestion() {
        if (currentIndex >= questions.length) {
            questionEl.innerHTML = '<span style="font-size:50px;">🎉</span><br>Вікторину завершено!';
            optionsEl.innerHTML = '<button class="option-btn" style="grid-column: span 2;" onclick="restartQuiz()">Почати знову</button>';
            return;
        }
        quizWrapper.classList.remove('anim-fly-out');
        const item = questions[currentIndex];
        questionEl.innerText = item.q;
        optionsEl.innerHTML = '';
        const shuffledOptions = shuffle([...item.options]);
        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, item.a);
            optionsEl.appendChild(btn);
        });
    }

    function checkAnswer(btn, correctAnswer) {
        const allBtns = optionsEl.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.style.pointerEvents = 'none');
        
        if (btn.innerText === correctAnswer) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('incorrect');
            allBtns.forEach(b => { if(b.innerText === correctAnswer) b.classList.add('correct'); });
        }
        
        setTimeout(() => {
            quizWrapper.classList.add('anim-fly-out');
            setTimeout(() => {
                currentIndex++;
                loadQuestion();
            }, 500);
        }, 1500);
    }

    function restartQuiz() {
        currentIndex = 0;
        loadQuestion();
    }

    // --- THEME MANAGER (Система динамічних фонів) ---
    const themeBtn = document.getElementById('theme-btn');
    const themeModal = document.getElementById('theme-modal');
    const themeGrid = document.getElementById('theme-grid');
    const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
    
    const savedBg = localStorage.getItem('mySavedGameBg') || (baseUrl + 'background_1.webp');
    document.body.style.backgroundImage = `url('${savedBg}')`;

    themeBtn.onclick = () => {
        themeModal.style.display = themeModal.style.display === 'flex' ? 'none' : 'flex';
    };

    function checkImage(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = url;
        });
    }

    async function loadThemes() {
        for (let i = 1; i <= 1000; i++) {
            const url = `${baseUrl}background_${i}.webp`;
            const exists = await checkImage(url);
            if (exists) {
                const thumb = document.createElement('div');
                thumb.className = 'theme-thumb';
                thumb.style.backgroundImage = `url('${url}')`;
                thumb.innerHTML = `<div class="theme-label">Фон ${i}</div>`;
                thumb.onclick = () => {
                    document.body.style.backgroundImage = `url('${url}')`;
                    localStorage.setItem('mySavedGameBg', url);
                    themeModal.style.display = 'none';
                };
                themeGrid.appendChild(thumb);
            } else {
                break;
            }
        }
    }

    loadQuestion();
    loadThemes();
</script>
</body>
</html>
