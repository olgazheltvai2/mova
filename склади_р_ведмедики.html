<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ведмежа Галявина Складів</title>
<style>
  /* ================= ОСНОВНІ СТИЛІ ТА СКИДАННЯ ================= */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
    background: #1a3a2a;
  }

  /* Контейнер всієї гри */
  #game-world {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* Живий лісовий фон (SVG на весь екран) */
  #forest-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  /* Анімації для елементів фону */
  .sway-slow {
    transform-origin: bottom center;
    animation: swayTree 6s ease-in-out infinite alternate;
  }
  .sway-fast {
    transform-origin: bottom center;
    animation: swayGrass 3.5s ease-in-out infinite alternate;
  }
  .cloud-drift-1 {
    animation: drift 45s linear infinite;
  }
  .cloud-drift-2 {
    animation: drift 65s linear infinite reverse;
  }
  .water-shimmer {
    animation: shimmer 3s ease-in-out infinite alternate;
  }

  @keyframes swayTree {
    0% { transform: rotate(-1.5deg); }
    100% { transform: rotate(1.5deg); }
  }
  @keyframes swayGrass {
    0% { transform: rotate(-4deg) scaleY(0.98); }
    100% { transform: rotate(4deg) scaleY(1.02); }
  }
  @keyframes drift {
    0% { transform: translateX(-150px); }
    100% { transform: translateX(150px); }
  }
  @keyframes shimmer {
    0% { opacity: 0.45; transform: translateX(-8px); }
    100% { opacity: 0.85; transform: translateX(8px); }
  }

  /* Шари світлячків / пилку в лісі */
  #ambient-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* ================= НАВІГАЦІЙНІ КНОПКИ (ДЕРЕВ'ЯНІ ЛИСТОЧКИ) ================= */
  .nav-btn {
    position: absolute;
    top: 2.2vh;
    width: clamp(54px, 6vw, 76px);
    height: clamp(54px, 6vw, 76px);
    z-index: 30;
    cursor: pointer;
    background: none;
    border: none;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
  }
  .nav-btn:hover {
    transform: scale(1.14) rotate(4deg);
    filter: drop-shadow(0 8px 14px rgba(255,215,100,0.55));
  }
  .nav-btn:active {
    transform: scale(0.92);
  }
  #btn-prev { left: 2.2vw; }
  #btn-next { right: 2.2vw; }

  /* ================= СЦЕНА З КУБИКОМ (ВЕРХНІЙ ЦЕНТР) ================= */
  #dice-stage {
    position: absolute;
    top: 2vh;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(140px, 18vw, 210px);
    height: clamp(140px, 18vw, 210px);
    z-index: 20;
    perspective: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* Підставка-пеньочок під кубиком */
  #dice-pedestal {
    position: absolute;
    bottom: -18px;
    width: 135%;
    height: 55%;
    z-index: -1;
    pointer-events: none;
    filter: drop-shadow(0 12px 15px rgba(0,0,0,0.5));
  }

  /* 3D Кубик із різьбленого дерева та бурштину */
  #cube-3d {
    width: 78%;
    height: 78%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.95s cubic-bezier(0.22, 1.35, 0.5, 1);
  }

  .cube-face {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 22%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Жодних білих прямокутників: текстура теплого бурштинового дерева з латунною оправою */
    background: 
      radial-gradient(circle at 30% 25%, #ffe699 0%, #f5b942 42%, #c87619 85%, #7a3e06 100%);
    border: 5px solid #5c2c06;
    box-shadow: 
      inset 0 0 18px rgba(92, 44, 6, 0.75),
      inset 4px 4px 10px rgba(255, 245, 200, 0.75),
      0 12px 24px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  /* Декоративний орнамент по кутах граней кубика */
  .cube-face::before {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 17%;
    border: 2.5px dashed rgba(110, 50, 5, 0.55);
    pointer-events: none;
  }

  /* Різьблений текст складу на кубику */
  .syllable-text {
    font-size: clamp(2.6rem, 5.2vw, 4.4rem);
    font-weight: 900;
    letter-spacing: 2px;
    color: #4a1500;
    text-shadow: 
      0 2px 0 #ffd984,
      0 -2px 3px rgba(40, 10, 0, 0.6),
      2px 4px 8px rgba(0, 0, 0, 0.35);
    transform: translateZ(2px);
  }

  /* Анімація кидка кубика */
  .rolling {
    animation: rollDice 0.85s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }

  @keyframes rollDice {
    0% {
      transform: translateY(-140px) scale(0.4) rotateX(0deg) rotateY(0deg) rotateZ(0deg);
    }
    45% {
      transform: translateY(15px) scale(1.12) rotateX(380deg) rotateY(200deg) rotateZ(150deg);
    }
    75% {
      transform: translateY(-12px) scale(0.95) rotateX(700deg) rotateY(340deg) rotateZ(350deg);
    }
    100% {
      transform: translateY(0) scale(1) rotateX(720deg) rotateY(360deg) rotateZ(360deg);
    }
  }

  /* ================= СЦЕНА З ТРЬОМА ВЕДМЕДИКАМИ ================= */
  #bears-stage {
    position: absolute;
    bottom: 2vh;
    left: 50%;
    transform: translateX(-50%);
    width: 96vw;
    max-width: 1380px;
    height: 72vh;
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: end;
    justify-items: center;
    gap: 1.5vw;
    padding-bottom: 1vh;
  }

  /* Картка-контейнер кожного ведмедика */
  .bear-slot {
    position: relative;
    width: 100%;
    max-width: 410px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .bear-slot:hover {
    transform: translateY(-10px) scale(1.03);
  }

  .bear-svg {
    width: 100%;
    height: 100%;
    max-height: 68vh;
    overflow: visible;
    filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.48));
  }

  /* Живе дихання та рухи ведмедиків */
  .bear-breathe {
    transform-origin: center bottom;
    animation: bearBreathe 3.2s ease-in-out infinite alternate;
  }
  .bear-slot:nth-child(2) .bear-breathe {
    animation-delay: -1.1s;
  }
  .bear-slot:nth-child(3) .bear-breathe {
    animation-delay: -2.2s;
  }

  @keyframes bearBreathe {
    0% { transform: scaleY(0.985) scaleX(1.01); }
    100% { transform: scaleY(1.02) scaleX(0.99); }
  }

/* Плавне переведення погляду для кожного ведмедика */
  .bear-eyes {
    transform-origin: center;
    transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Рух вушок */
  .ear-left {
    transform-origin: 70% 80%;
    animation: earTwitchL 5s ease-in-out infinite;
  }
  .ear-right {
    transform-origin: 30% 80%;
    animation: earTwitchR 5s ease-in-out infinite;
  }

  @keyframes earTwitchL {
    0%, 84%, 100% { transform: rotate(0deg); }
    88% { transform: rotate(-10deg); }
    92% { transform: rotate(5deg); }
  }
  @keyframes earTwitchR {
    0%, 84%, 100% { transform: rotate(0deg); }
    88% { transform: rotate(10deg); }
    92% { transform: rotate(-5deg); }
  }

  /* ================= РЕАКЦІЇ ВЕДМЕДИКІВ НА ВІДПОВІДЬ ================= */
  /* Радісний стрибок і танець при правильній відповіді */
  .bear-happy {
    animation: happyDance 0.95s cubic-bezier(0.28, 0.84, 0.42, 1) forwards !important;
  }
  @keyframes happyDance {
    0% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-45px) scale(1.12, 0.92) rotate(-6deg); }
    50% { transform: translateY(-10px) scale(0.95, 1.08) rotate(6deg); }
    75% { transform: translateY(-32px) scale(1.08) rotate(-4deg); }
    100% { transform: translateY(0) scale(1) rotate(0deg); }
  }

  /* Здивування / похитування при помилці */
  .bear-oops {
    animation: oopsShake 0.6s ease-in-out !important;
  }
  @keyframes oopsShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-16px) rotate(-5deg); }
    40% { transform: translateX(15px) rotate(5deg); }
    60% { transform: translateX(-12px) rotate(-3deg); }
    80% { transform: translateX(10px) rotate(3deg); }
  }

  /* Зміна емоції ротика */
  .mouth-happy { opacity: 0; transition: opacity 0.2s; }
  .mouth-sad { opacity: 0; transition: opacity 0.2s; }
  .mouth-normal { opacity: 1; transition: opacity 0.2s; }

  .state-happy .mouth-normal { opacity: 0; }
  .state-happy .mouth-happy { opacity: 1; }
  .state-oops .mouth-normal { opacity: 0; }
  .state-oops .mouth-sad { opacity: 1; }

  /* Полотно для святкових салютів із ягід, жолудів, меду та листя */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 25;
  }
</style>
</head>
<body>

<div id="game-world">
  <!-- ================= ЖИВИЙ ДЕТАЛІЗОВАНИЙ ЛІСОВИЙ ФОН ================= -->
  <svg id="forest-bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт ранкового неба -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4895ef"/>
        <stop offset="45%" stop-color="#80ed99"/>
        <stop offset="85%" stop-color="#fff3b0"/>
        <stop offset="100%" stop-color="#ffca3a"/>
      </linearGradient>
      <!-- Сонячне сяйво -->
      <radialGradient id="sunGlow" cx="0.5" cy="0.22" r="0.45">
        <stop offset="0%" stop-color="#fff9d2" stop-opacity="0.95"/>
        <stop offset="40%" stop-color="#ffe169" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#ffe169" stop-opacity="0"/>
      </radialGradient>
      <!-- Далекі гори/пагорби -->
      <linearGradient id="farHills" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#52b788"/>
        <stop offset="100%" stop-color="#2d6a4f"/>
      </linearGradient>
      <!-- Середні пагорби -->
      <linearGradient id="midHills" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#74c69d"/>
        <stop offset="40%" stop-color="#40916c"/>
        <stop offset="100%" stop-color="#1b4332"/>
      </linearGradient>
      <!-- Передня галявина -->
      <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#95d5b2"/>
        <stop offset="25%" stop-color="#52b788"/>
        <stop offset="70%" stop-color="#2d6a4f"/>
        <stop offset="100%" stop-color="#1b4332"/>
      </linearGradient>
      <!-- Лісовий струмок -->
      <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0077b6"/>
        <stop offset="50%" stop-color="#48cae4"/>
        <stop offset="100%" stop-color="#0096c7"/>
      </linearGradient>
      <!-- Стовбур дерева -->
      <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3d2314"/>
        <stop offset="35%" stop-color="#6f4518"/>
        <stop offset="70%" stop-color="#583101"/>
        <stop offset="100%" stop-color="#2b1704"/>
      </linearGradient>
      <!-- Крона дерева -->
      <radialGradient id="foliageGrad1" cx="0.35" cy="0.3" r="0.7">
        <stop offset="0%" stop-color="#b7e4c7"/>
        <stop offset="45%" stop-color="#52b788"/>
        <stop offset="100%" stop-color="#1b4332"/>
      </radialGradient>
      <radialGradient id="foliageGrad2" cx="0.35" cy="0.3" r="0.7">
        <stop offset="0%" stop-color="#d8f3dc"/>
        <stop offset="40%" stop-color="#74c69d"/>
        <stop offset="100%" stop-color="#2d6a4f"/>
      </radialGradient>
      <!-- Промінь сонця -->
      <linearGradient id="sunRay" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#fff8d6" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- Небо та сонце -->
    <rect width="1920" height="1080" fill="url(#skyGrad)"/>
    <circle cx="960" cy="230" r="520" fill="url(#sunGlow)"/>
    <circle cx="960" cy="210" r="85" fill="#fffbe0" opacity="0.9"/>

    <!-- Хмарки, що пливуть -->
    <g class="cloud-drift-1" opacity="0.75" fill="#fffdf2">
      <path d="M220,170 Q250,130 290,150 Q330,110 380,145 Q420,135 440,170 Q460,195 415,205 L215,205 Q185,195 220,170 Z"/>
      <path d="M1380,120 Q1415,85 1455,105 Q1495,75 1540,110 Q1580,105 1590,135 L1370,135 Z"/>
    </g>
    <g class="cloud-drift-2" opacity="0.55" fill="#fff9db">
      <path d="M680,110 Q710,80 745,95 Q785,70 825,100 Q860,95 875,125 L665,125 Z"/>
      <path d="M1080,220 Q1110,190 1150,205 Q1190,185 1220,215 L1070,215 Z"/>
    </g>

    <!-- Далекі смерекові пагорби -->
    <path d="M0,620 Q320,460 650,550 T1320,510 T1920,580 L1920,1080 L0,1080 Z" fill="url(#farHills)"/>

    <!-- Силуети далеких ялинок -->
    <g fill="#2d6a4f" opacity="0.75">
      <polygon points="150,430 115,540 185,540"/>
      <polygon points="150,390 122,480 178,480"/>
      <polygon points="220,450 190,550 250,550"/>
      <polygon points="480,440 445,560 515,560"/>
      <polygon points="1450,410 1410,540 1490,540"/>
      <polygon points="1450,365 1420,470 1480,470"/>
      <polygon points="1690,440 1650,565 1730,565"/>
    </g>

    <!-- Середні пагорби -->
    <path d="M0,670 Q420,540 890,640 T1920,610 L1920,1080 L0,1080 Z" fill="url(#midHills)"/>

    <!-- Сонячні промені крізь дерева -->
    <polygon points="960,180 350,1080 580,1080" fill="url(#sunRay)"/>
    <polygon points="960,180 820,1080 1100,1080" fill="url(#sunRay)"/>
    <polygon points="960,180 1340,1080 1590,1080" fill="url(#sunRay)"/>

    <!-- Великі могутні дуби зліва та справа (хитаються на вітрі) -->
    <g class="sway-slow">
      <!-- Ліве дерево -->
      <path d="M-30,980 Q60,720 45,420 Q35,240 -20,120 L110,120 Q115,360 135,550 Q165,780 230,980 Z" fill="url(#trunkGrad)"/>
      <path d="M95,430 Q210,330 295,290 L310,315 Q215,375 115,490 Z" fill="url(#trunkGrad)"/>
      <circle cx="110" cy="210" r="170" fill="url(#foliageGrad1)"/>
      <circle cx="260" cy="260" r="145" fill="url(#foliageGrad2)"/>
      <circle cx="40" cy="340" r="135" fill="url(#foliageGrad2)"/>
    </g>

    <g class="sway-slow" style="animation-delay: -2.5s;">
      <!-- Праве дерево -->
      <path d="M1950,980 Q1860,720 1875,420 Q1885,240 1940,120 L1810,120 Q1805,360 1785,550 Q1755,780 1690,980 Z" fill="url(#trunkGrad)"/>
      <path d="M1825,430 Q1710,330 1625,290 L1610,315 Q1705,375 1805,490 Z" fill="url(#trunkGrad)"/>
      <circle cx="1810" cy="210" r="175" fill="url(#foliageGrad1)"/>
      <circle cx="1655" cy="260" r="140" fill="url(#foliageGrad2)"/>
      <circle cx="1880" cy="340" r="135" fill="url(#foliageGrad2)"/>
    </g>

    <!-- Основна сонячна галявина -->
    <path d="M0,740 Q520,660 980,720 T1920,700 L1920,1080 L0,1080 Z" fill="url(#meadowGrad)"/>

    <!-- Лісовий струмок на передньому плані -->
    <path d="M0,995 Q450,930 960,985 T1920,955 L1920,1080 L0,1080 Z" fill="url(#streamGrad)"/>
    <g class="water-shimmer" fill="#caf0f8">
      <ellipse cx="320" cy="1015" rx="85" ry="7"/>
      <ellipse cx="780" cy="1035" rx="110" ry="8"/>
      <ellipse cx="1290" cy="1020" rx="95" ry="7"/>
      <ellipse cx="1650" cy="1040" rx="75" ry="6"/>
    </g>

    <!-- Камінці та травичка біля струмка -->
    <g fill="#7f8c8d">
      <ellipse cx="180" cy="985" rx="34" ry="16" fill="#6c757d"/>
      <ellipse cx="170" cy="981" rx="26" ry="11" fill="#adb5bd"/>
      <ellipse cx="1740" cy="955" rx="40" ry="18" fill="#495057"/>
      <ellipse cx="1732" cy="950" rx="30" ry="12" fill="#ced4da"/>
    </g>

    <!-- Кущики папороті, квіти та суниці на галявині -->
    <g class="sway-fast">
      <path d="M90,890 Q60,830 30,810 Q75,820 100,885 Z" fill="#2d6a4f"/>
      <path d="M105,890 Q110,820 140,795 Q125,840 115,890 Z" fill="#40916c"/>
      <circle cx="125" cy="835" r="9" fill="#e63946"/>
      <circle cx="70" cy="850" r="7" fill="#ffb703"/>
    </g>
    <g class="sway-fast" style="animation-delay: -1.6s;">
      <path d="M1810,885 Q1780,825 1750,805 Q1795,815 1820,880 Z" fill="#2d6a4f"/>
      <path d="M1825,885 Q1830,815 1860,790 Q1845,835 1835,885 Z" fill="#40916c"/>
      <circle cx="1775" cy="835" r="8" fill="#ffb703"/>
      <circle cx="1845" cy="845" r="9" fill="#e63946"/>
    </g>
  </svg>

  <!-- Полотно для фонових світлячків -->
  <canvas id="ambient-particles"></canvas>

  <!-- ================= КНОПКИ НАВІГАЦІЇ (РІЗЬБЛЕНІ ЖОЛУДІ/ЛИСТОЧКИ БЕЗ СЛІВ) ================= -->
  <button id="btn-prev" class="nav-btn" aria-label="Previous">
    <svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="leafBtnGrad" cx="0.3" cy="0.3" r="0.7">
          <stop offset="0%" stop-color="#ffd166"/>
          <stop offset="60%" stop-color="#f77f00"/>
          <stop offset="100%" stop-color="#9b2226"/>
        </radialGradient>
      </defs>
      <path d="M12,50 C12,22 45,10 78,16 C92,18 94,82 78,84 C45,90 12,78 12,50 Z" fill="url(#leafBtnGrad)" stroke="#581808" stroke-width="5"/>
      <path d="M58,28 L32,50 L58,72" fill="none" stroke="#fff3b0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="btn-next" class="nav-btn" aria-label="Next">
    <svg viewBox="0 0 100 100">
      <path d="M88,50 C88,22 55,10 22,16 C8,18 6,82 22,84 C55,90 88,78 88,50 Z" fill="url(#leafBtnGrad)" stroke="#581808" stroke-width="5"/>
      <path d="M42,28 L68,50 L42,72" fill="none" stroke="#fff3b0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- ================= КУБИК НА ПЕНЬОЧКУ (КИДОК СКЛАДУ) ================= -->
  <div id="dice-stage">
    <!-- Моховий пеньочок під кубиком -->
    <svg id="dice-pedestal" viewBox="0 0 300 120">
      <defs>
        <linearGradient id="stumpWood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4a2c11"/>
          <stop offset="30%" stop-color="#7c4d25"/>
          <stop offset="55%" stop-color="#5e3716"/>
          <stop offset="80%" stop-color="#8a5629"/>
          <stop offset="100%" stop-color="#3b2009"/>
        </linearGradient>
        <linearGradient id="stumpTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f3d5a5"/>
          <stop offset="100%" stop-color="#c69658"/>
        </linearGradient>
      </defs>

    richka: `

  /* ============================================================================
   * 2. БАЗА ЗАВДАНЬ (18 РІВНІВ З ПРОСТИМИ СКЛАДАМИ З ЛІТЕРОЮ "Р")
   *    Кожен рівень має склад для кубика, правильну картинку та 2 дистрактори
   * ============================================================================ */
  const LEVELS = [
    { syllable: "РА", correct: "rak",        distractors: ["romashka", "ryba"] },
    { syllable: "РО", correct: "romashka",   distractors: ["rukavychka", "redyska"] },
    { syllable: "РУ", correct: "rukavychka", distractors: ["ripa", "rak"] },
    { syllable: "РИ", correct: "ryba",       distractors: ["ryukzak", "romashka"] },
    { syllable: "РЕ", correct: "redyska",    distractors: ["ravlyk", "ryba"] },
    { syllable: "РІ", correct: "ripa",       distractors: ["rolyk", "rukavychka"] },
    { syllable: "РЯ", correct: "ryat_krug",  distractors: ["rys", "redyska"] },
    { syllable: "РЮ", correct: "ryukzak",    distractors: ["rushnyk", "ripa"] },
    { syllable: "АР", correct: "arfa",       distractors: ["orel", "rak"] },
    { syllable: "ОР", correct: "orel",       distractors: ["irys", "romashka"] },
    { syllable: "ІР", correct: "irys",       distractors: ["uragan", "ryba"] },
    { syllable: "УР", correct: "uragan",     distractors: ["arfa", "ripa"] },
    { syllable: "РА", correct: "ravlyk",     distractors: ["remin", "orel"] },
    { syllable: "РО", correct: "rolyk",      distractors: ["richka", "ryukzak"] },
    { syllable: "РУ", correct: "rushnyk",    distractors: ["rys", "irys"] },
    { syllable: "РИ", correct: "rys",        distractors: ["ravlyk", "uragan"] },
    { syllable: "РЕ", correct: "remin",      distractors: ["rolyk", "arfa"] },
    { syllable: "РІ", correct: "richka",     distractors: ["rushnyk", "ryat_krug"] }
  ];

  /* ============================================================================
   * 3. ЗВУКОВИЙ СИНТЕЗАТОР (Web Audio API) — РІЗНОМАНІТНІ ЗВУКИ БЕЗ СЛІВ
   * ============================================================================ */
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  // Звук дерев'яного кубика при кидку
  function playDiceSound() {
    initAudio();
    const now = audioCtx.currentTime;
    [0, 0.12, 0.28, 0.45].forEach((offset, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(180 + i * 55, now + offset);
      osc.frequency.exponentialRampToValueAtTime(75, now + offset + 0.08);
      gain.gain.setValueAtTime(0.32, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.09);
    });
  }

  // 4 різні святкові мелодії для правильних відповідей
  function playSuccessSound(variant = 0) {
    initAudio();
    const now = audioCtx.currentTime;
    const melodies = [
      [523.25, 659.25, 783.99, 1046.50],         // До-мажорне арпеджіо
      [587.33, 739.99, 880.00, 1174.66],         // Ре-мажорний фанфар
      [440.00, 554.37, 659.25, 880.00, 1108.73], // Лісова арфа
      [659.25, 783.99, 987.77, 1318.51]          // Дзвінкий ксилофон
    ];
    const notes = melodies[variant % melodies.length];

    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = variant % 2 === 0 ? "sine" : "triangle";
      osc.frequency.setValueAtTime(freq, now + idx * 0.09);
      gain.gain.setValueAtTime(0.28, now + idx * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.09 + 0.38);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + idx * 0.09);
      osc.stop(now + idx * 0.09 + 0.4);
    });
  }

  // Кумедний пружний звук при помилці
  function playOopsSound() {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.linearRampToValueAtTime(130, now + 0.18);
    osc.frequency.linearRampToValueAtTime(190, now + 0.28);
    osc.frequency.linearRampToValueAtTime(105, now + 0.45);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.008, now + 0.46);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.47);
  }

  /* ============================================================================
   * 4. СИСТЕМА АКТИВНИХ ВІЗУАЛЬНИХ ФІДБЕКІВ (ЯГОДИ, ЖОЛУДІ, ЛИСТЯ, МЕДОВІ ЗІРКИ)
   * ============================================================================ */
  const fxCanvas = document.getElementById("fx-canvas");
  const fxCtx = fxCanvas.getContext("2d");
  let particles = [];

  function resizeCanvases() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
    ambientCanvas.width = window.innerWidth;
    ambientCanvas.height = window.innerHeight;
  }

  // Запуск фонтану лісових скарбів навколо обраного ведмедика
  function spawnForestCelebration(x, y, styleIndex) {
    const palettes = [
      ["#ffbe0b", "#fb5607", "#ff006e", "#8338ec"], // Ягідний вибух
      ["#ffd166", "#06d6a0", "#118ab2", "#ef476f"], // Смарагдове листя та квіти
      ["#ffea00", "#ff9e00", "#e63946", "#aacc00"]  // Медові краплі та жолуді
    ];
    const colors = palettes[styleIndex % palettes.length];

    for (let i = 0; i < 55; i++) {
      const angle = (Math.PI * 2 * i) / 55 + (Math.random() - 0.5) * 0.3;
      const speed = 4 + Math.random() * 12;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 5,
        size: 8 + Math.random() * 12,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        shape: i % 3, // 0: зірка, 1: листочок, 2: ягідка
        alpha: 1
      });
    }
  }

  function updateFxParticles() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.32; // Гравітація
      p.rotation += p.vRot;
      p.alpha -= 0.015;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.alpha);
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rotation);
      fxCtx.fillStyle = p.color;

      if (p.shape === 0) {
        // Золота зірочка
        fxCtx.beginPath();
        for (let s = 0; s < 5; s++) {
          fxCtx.lineTo(Math.cos((s * 72 * Math.PI) / 180) * p.size, Math.sin((s * 72 * Math.PI) / 180) * p.size);
          fxCtx.lineTo(Math.cos(((s * 72 + 36) * Math.PI) / 180) * (p.size * 0.45), Math.sin(((s * 72 + 36) * Math.PI) / 180) * (p.size * 0.45));
        }
        fxCtx.closePath();
        fxCtx.fill();
      } else if (p.shape === 1) {
        // Лісовий листочок
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
        fxCtx.fill();
      } else {
        // Лісова ягідка з відблиском
        fxCtx.beginPath();
        fxCtx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.fillStyle = "rgba(255,255,255,0.6)";
        fxCtx.beginPath();
        fxCtx.arc(-p.size * 0.2, -p.size * 0.2, p.size * 0.2, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }
    requestAnimationFrame(updateFxParticles);
  }

  /* ============================================================================
   * 5. ФОНОВІ СВІТЛЯЧКИ / СОНЯЧНИЙ ПИЛОК У ЛІСІ
   * ============================================================================ */
  const ambientCanvas = document.getElementById("ambient-particles");
  const ambCtx = ambientCanvas.getContext("2d");
  const fireflies = Array.from({ length: 28 }, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: 2 + Math.random() * 3.5,
    vx: (Math.random() - 0.5) * 0.6,
    vy: -0.2 - Math.random() * 0.5,
    phase: Math.random() * Math.PI * 2
  }));

  function animateAmbient() {
    ambCtx.clearRect(0, 0, ambientCanvas.width, ambientCanvas.height);
    fireflies.forEach(f => {
      f.x += f.vx;
      f.y += f.vy;
      f.phase += 0.04;
      if (f.y < -10) f.y = ambientCanvas.height + 10;
      if (f.x < -10) f.x = ambientCanvas.width + 10;
      if (f.x > ambientCanvas.width + 10) f.x = -10;

      const glow = 0.35 + Math.sin(f.phase) * 0.35;
      ambCtx.save();
      ambCtx.globalAlpha = glow;
      ambCtx.fillStyle = "#fff3b0";
      ambCtx.shadowColor = "#ffd166";
      ambCtx.shadowBlur = 10;
      ambCtx.beginPath();
      ambCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ambCtx.fill();
      ambCtx.restore();
    });
    requestAnimationFrame(animateAmbient);
  }

  /* ============================================================================
   * 6. ЛОГІКА ГРИ, ПЕРЕМИКАННЯ РІВНІВ ТА ВЗАЄМОДІЯ З ВЕДМЕДИКАМИ
   * ============================================================================ */
  let currentLevelIndex = 0;
  let isLocked = false;
  let currentOptions = [];

  const cubeEl = document.getElementById("cube-3d");
  const syllableTextEl = document.getElementById("syllable-display");
  const bearSlots = document.querySelectorAll(".bear-slot");

  // Перемішування масиву
  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Завантаження рівня та кидок кубика
  function loadLevel(index) {
    isLocked = false;
    currentLevelIndex = (index + LEVELS.length) % LEVELS.length;
    const levelData = LEVELS[currentLevelIndex];

    // Анімація кидка кубика
    cubeEl.classList.remove("rolling");
    void cubeEl.offsetWidth;
    cubeEl.classList.add("rolling");
    playDiceSound();

    // Оновлення складу всередині стрибка кубика
    setTimeout(() => {
      syllableTextEl.textContent = levelData.syllable;
    }, 220);

    // Розміщення 3 картинок у лапах трьох ведмедиків
    currentOptions = shuffle([
      { id: levelData.correct, isCorrect: true },
      { id: levelData.distractors[0], isCorrect: false },
      { id: levelData.distractors[1], isCorrect: false }
    ]);

    bearSlots.forEach((slot, idx) => {
      slot.classList.remove("bear-happy", "bear-oops", "state-happy", "state-oops");
      const picGroup = slot.querySelector(".item-picture");
      picGroup.innerHTML = SVG_ARTWORKS[currentOptions[idx].id];
    });
  }

  // Повторний підстриб кубика при кліку на нього
  document.getElementById("dice-stage").addEventListener("click", () => {
    cubeEl.classList.remove("rolling");
    void cubeEl.offsetWidth;
    cubeEl.classList.add("rolling");
    playDiceSound();
  });

  // Обробка вибору ведмедика дитиною
  bearSlots.forEach((slot, idx) => {
    slot.addEventListener("click", () => {
      if (isLocked) return;

      const choice = currentOptions[idx];
      const rect = slot.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height * 0.55;

      if (choice.isCorrect) {
        isLocked = true;
        slot.classList.remove("bear-oops", "state-oops");
        slot.classList.add("bear-happy", "state-happy");

        playSuccessSound(currentLevelIndex);
        spawnForestCelebration(centerX, centerY, idx);

        // Перехід на наступний склад після святкування
        setTimeout(() => {
          loadLevel(currentLevelIndex + 1);
        }, 1350);
      } else {
        slot.classList.remove("bear-oops", "state-oops");
        void slot.offsetWidth;
        slot.classList.add("bear-oops", "state-oops");
        playOopsSound();

        setTimeout(() => {
          slot.classList.remove("bear-oops", "state-oops");
        }, 650);
      }
    });
  });

  // Кнопки "Назад" і "Далі" (миттєвий перехід без обов'язкового проходження)
  document.getElementById("btn-prev").addEventListener("click", () => {
    loadLevel(currentLevelIndex - 1);
  });

  document.getElementById("btn-next").addEventListener("click", () => {
    loadLevel(currentLevelIndex + 1);
  });

  // Запуск гри та анімацій
  window.addEventListener("resize", resizeCanvases);
  resizeCanvases();
  animateAmbient();
  updateFxParticles();
  loadLevel(0);
// Незалежний рандомний рух очей для кожного ведмедика окремо
  const allBearEyes = document.querySelectorAll(".bear-eyes");

  allBearEyes.forEach((eyesGroup) => {
    function moveGazeRandomly() {
      // Із шансом 30% ведмедик дивиться прямо на дитину, інакше — у випадковий бік
      const lookStraight = Math.random() < 0.3;
      const offsetX = lookStraight ? 0 : (Math.random() * 14 - 7).toFixed(1); // вліво-вправо до 7px
      const offsetY = lookStraight ? 0 : (Math.random() * 10 - 5).toFixed(1); // вгору-вниз до 5px

      eyesGroup.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

      // Випадкова затримка до наступного руху очей (від 0.8 до 3.2 секунди)
      const nextTime = 800 + Math.random() * 2400;
      setTimeout(moveGazeRandomly, nextTime);
    }

    // Запускаємо індивідуальний цикл погляду для кожного ведмедика
    moveGazeRandomly();
  });
</script>
