<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лісові Монстрики</title>
<style>
  /* Скидання стилів та базові налаштування сцени */
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
  body, html {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', sans-serif;
    background: #0d2b24;
  }

  /* Контейнер живого сюжетного фону (Тропічні джунглі) */
  #scene {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 12px 20px 18px;
  }
  #bg-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  /* Canvas для святкових частинок (феєрверки, іскри, листочки) */
  #fx-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 25; pointer-events: none;
  }

  /* Верхня панель керування: навігація та єдина кнопка зміни мови */
  .hud {
    position: relative; z-index: 10; width: 100%; max-width: 1180px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .hud-btn {
    pointer-events: auto; cursor: pointer;
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid #f9d976;
    background: radial-gradient(circle at 30% 30%, #3ab795, #135446);
    box-shadow: 0 6px 0 #0a2e26, 0 8px 18px rgba(0,0,0,0.45), inset 0 2px 6px rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), filter 0.15s;
    color: #fff8d6; font-weight: 900; font-size: 20px; letter-spacing: 1px;
    text-shadow: 0 2px 3px rgba(0,0,0,0.6);
  }
  .hud-btn:hover { transform: scale(1.1) translateY(-2px); filter: brightness(1.12); }
  .hud-btn:active { transform: scale(0.95) translateY(3px); box-shadow: 0 2px 0 #0a2e26; }
  .nav-group { display: flex; gap: 14px; }

  /* Таблиця-ключ із 10 монстриками та складами (стилізована дерев'яно-смарагдова дошка) */
  #cipher-board {
    position: relative; z-index: 5;
    width: 100%; max-width: 1080px;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,230,120,0.14), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(80,255,190,0.14), transparent 45%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 8px, transparent 8px, transparent 16px),
      linear-gradient(180deg, #275c4c 0%, #183d33 100%);
    border: 5px solid #d49b4b;
    border-radius: 30px;
    box-shadow: 0 10px 0 #7b4f1d, 0 16px 32px rgba(0,0,0,0.55), inset 0 0 25px rgba(0,0,0,0.45);
    padding: 14px 20px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px 16px;
  }

  /* Картка окремого монстрика у ключі */
  .key-card {
    background: linear-gradient(145deg, rgba(255,245,200,0.16), rgba(20,65,50,0.55));
    border: 2px solid rgba(249,217,118,0.45);
    border-radius: 20px;
    padding: 6px 8px 8px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .key-card:hover {
    transform: translateY(-5px) scale(1.04);
    border-color: #ffe875;
    box-shadow: 0 8px 18px rgba(0,0,0,0.35), 0 0 15px rgba(255,232,117,0.4);
  }
  .key-card:active { transform: scale(0.95); }
  .key-monster { width: 68px; height: 68px; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.4)); }

  /* Плашка зі складом (дерев'яний медальйон із золотою облямівкою) */
  .syllable-pill {
    margin-top: 4px;
    min-width: 78px; padding: 4px 12px;
    border-radius: 14px;
    background: linear-gradient(180deg, #f6cf71 0%, #d8952b 100%);
    border: 2px solid #754408;
    box-shadow: 0 4px 0 #6b3c07, inset 0 2px 2px rgba(255,255,255,0.65);
    color: #3b1d00;
    font-size: 22px; font-weight: 900; text-align: center; letter-spacing: 1.5px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }

  /* Центральна ігрова зона поточного завдання (1 завдання на слайд) */
  #stage-area {
    position: relative; z-index: 6;
    width: 100%; max-width: 1050px; flex: 1;
    display: flex; align-items: center; justify-content: center;
    gap: 28px; margin-top: 8px;
  }

  /* Головний подіум завдання */
  #task-board {
    background:
      radial-gradient(circle at 50% 25%, rgba(255,236,153,0.22), transparent 65%),
      repeating-radial-gradient(circle at 0 0, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 10px, transparent 10px, transparent 20px),
      linear-gradient(180deg, #3c245c 0%, #221238 100%);
    border: 5px solid #e6a94c;
    border-radius: 36px;
    box-shadow: 0 12px 0 #6e4411, 0 20px 38px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.5);
    padding: 20px 34px;
    display: flex; align-items: center; gap: 34px;
    position: relative;
  }

  .pair-wrap { display: flex; gap: 28px; align-items: center; }

  /* Слот монстрика у завданні */
  .target-unit {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .target-monster {
    width: 135px; height: 135px;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5));
    animation: floatMonster 3s ease-in-out infinite;
  }
  .target-unit:nth-child(2) .target-monster { animation-delay: -1.5s; }

  @keyframes floatMonster {
    0%, 100% { transform: translateY(0px) rotate(-1deg); }
    50% { transform: translateY(-9px) rotate(1.5deg); }
  }

  /* Комірка для вставлення складу */
  .slot-box {
    width: 138px; height: 60px;
    border-radius: 20px;
    background: linear-gradient(180deg, #1b0f2e 0%, #2f1b4e 100%);
    border: 3px dashed #c896ff;
    box-shadow: inset 0 5px 12px rgba(0,0,0,0.7), 0 4px 10px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900; color: #3b1d00;
    cursor: pointer; transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }
  .slot-box.active-slot {
    border-style: solid; border-color: #ffe66d;
    box-shadow: 0 0 20px rgba(255,230,109,0.65), inset 0 3px 8px rgba(255,230,109,0.3);
    transform: scale(1.06);
  }
  .slot-box.filled {
    border-style: solid; border-color: #8b5109;
    background: linear-gradient(180deg, #ffe27a 0%, #e09829 100%);
    box-shadow: 0 6px 0 #703f07, 0 0 22px rgba(255,215,90,0.7);
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .slot-box.wrong { animation: shakeErr 0.45s ease; border-color: #ff4d6d; }

  @keyframes popIn {
    0% { transform: scale(0.4); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @keyframes shakeErr {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px) rotate(-4deg); }
    40%, 80% { transform: translateX(10px) rotate(4deg); }
  }

  /* Медальйон із картинкою-відгадкою, який розкривається після складання слова */
  #reward-panel {
    width: 185px; height: 185px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #488b76, #1b4338 75%);
    border: 5px solid #f7ca65;
    box-shadow: 0 8px 0 #7b4f1d, inset 0 6px 18px rgba(0,0,0,0.55), 0 0 25px rgba(247,202,101,0.35);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; cursor: pointer;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s;
  }
  #reward-panel.unlocked {
    background: radial-gradient(circle at 50% 40%, #fff3b0, #f3a833 70%, #b85d19 100%);
    box-shadow: 0 8px 0 #7b4f1d, 0 0 42px rgba(255,230,105,0.95);
    animation: rewardPulse 2s infinite ease-in-out;
  }
  @keyframes rewardPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  #reward-svg-holder {
    width: 145px; height: 145px;
    transform: scale(0) rotate(-25deg);
    transition: transform 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  #reward-panel.unlocked #reward-svg-holder {
    transform: scale(1) rotate(0deg);
  }
  /* Таємничий листочок-завіса до відгадування */
  #mystery-cover {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.4s, transform 0.4s;
  }
  #reward-panel.unlocked #mystery-cover {
    opacity: 0; transform: scale(1.5) rotate(20deg); pointer-events: none;
  }

  /* Живий персонаж-помічник (Хамелеон Чіко) */
  #companion-box {
    width: 195px; height: 215px;
    position: relative; cursor: pointer;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.5));
    transition: transform 0.25s;
  }
  #companion-box.happy { animation: companionJump 0.6s ease 3; }
  #companion-box.oops { animation: shakeErr 0.5s ease; }
  @keyframes companionJump {
    0%, 100% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-22px) scale(1.08, 0.94); }
    70% { transform: translateY(-6px) scale(0.96, 1.05); }
  }

  /* Адаптивність для менших екранів */
  @media (max-width: 900px) {
    #cipher-board { padding: 8px 10px; gap: 8px; }
    .key-monster { width: 50px; height: 50px; }
    .syllable-pill { font-size: 17px; min-width: 60px; }
    #task-board { padding: 14px 18px; gap: 16px; }
    .target-monster { width: 95px; height: 95px; }
    .slot-box { width: 105px; height: 48px; font-size: 22px; }
    #reward-panel { width: 135px; height: 135px; }
    #reward-svg-holder { width: 105px; height: 105px; }
    #companion-box { width: 135px; height: 150px; }
  }
</style>
</head>
<body>

<div id="scene">
  <!-- Деталізований сюжетний SVG-фон тропічної лагуни -->
  <svg id="bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0f382f"/>
        <stop offset="55%" stop-color="#1f6f58"/>
        <stop offset="100%" stop-color="#103329"/>
      </linearGradient>
      <linearGradient id="waterGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4ef2d2"/>
        <stop offset="100%" stop-color="#157a6e"/>
      </linearGradient>
      <linearGradient id="leafG1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4ad66d"/>
        <stop offset="100%" stop-color="#1b6b36"/>
      </linearGradient>
      <linearGradient id="leafG2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#9ef01a"/>
        <stop offset="100%" stop-color="#2b9348"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
        <stop offset="0%" stop-color="#fff3b0" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#fff3b0" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Небо та сонячне сяйво крізь крони -->
    <rect width="1440" height="900" fill="url(#skyGrad)"/>
    <circle cx="720" cy="260" r="550" fill="url(#sunGlow)"/>

    <!-- Сонячні промені -->
    <g opacity="0.14" fill="#fff8c4">
      <polygon points="650,0 780,0 1050,900 420,900"/>
      <polygon points="350,0 460,0 620,900 180,900"/>
      <polygon points="980,0 1080,0 1350,900 890,900"/>
    </g>

    <!-- Далекі пагорби та ліс -->
    <path d="M0,560 Q260,430 550,520 T1120,500 T1440,550 L1440,900 L0,900 Z" fill="#164a3b"/>
    <path d="M0,650 Q380,540 760,630 T1440,610 L1440,900 L0,900 Z" fill="#11382d"/>

    <!-- Тропічний водоспад та лагуна -->
    <path d="M1180,420 Q1230,420 1250,550 L1290,780 L1130,780 Z" fill="url(#waterGrad)" opacity="0.75"/>
    <ellipse cx="1210" cy="785" rx="190" ry="42" fill="url(#waterGrad)" opacity="0.65"/>
    <path d="M1200,430 L1215,770 M1230,460 L1250,760 M1175,470 L1165,765" stroke="#ffffff" stroke-width="4" stroke-dasharray="18 14" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- Ліани та тропічне листя по краях -->
    <g fill="url(#leafG1)">
      <path d="M-40,0 Q140,90 220,260 Q90,220 -40,120 Z"/>
      <path d="M1480,0 Q1300,110 1210,270 Q1340,230 1480,130 Z"/>
      <path d="M-50,920 Q120,730 290,790 Q160,890 -50,920 Z"/>
      <path d="M1490,920 Q1310,720 1140,790 Q1280,890 1490,920 Z"/>
    </g>
    <g fill="url(#leafG2)">
      <path d="M0,180 Q150,210 190,340 Q80,310 0,260 Z"/>
      <path d="M1440,190 Q1290,220 1250,350 Q1360,320 1440,270 Z"/>
      <!-- Квіти гібіскуса -->
      <g transform="translate(110,780)">
        <circle cx="0" cy="-22" r="18" fill="#ff4d6d"/><circle cx="22" cy="-6" r="18" fill="#ff4d6d"/>
        <circle cx="14" cy="20" r="18" fill="#ff4d6d"/><circle cx="-14" cy="20" r="18" fill="#ff4d6d"/>
        <circle cx="-22" cy="-6" r="18" fill="#ff4d6d"/><circle cx="0" cy="0" r="10" fill="#ffd166"/>
      </g>
      <g transform="translate(1340,760) scale(0.85)">
        <circle cx="0" cy="-22" r="18" fill="#ff9f1c"/><circle cx="22" cy="-6" r="18" fill="#ff9f1c"/>
        <circle cx="14" cy="20" r="18" fill="#ff9f1c"/><circle cx="-14" cy="20" r="18" fill="#ff9f1c"/>
        <circle cx="-22" cy="-6" r="18" fill="#ff9f1c"/><circle cx="0" cy="0" r="10" fill="#fff3b0"/>
      </g>
    </g>

    <!-- Живі світлячки -->
    <g fill="#fff89e">
      <circle cx="220" cy="420" r="5" opacity="0.8"><animate attributeName="cy" values="420;390;420" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1280" cy="380" r="6" opacity="0.7"><animate attributeName="cy" values="380;415;380" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="760" r="4" opacity="0.85"><animate attributeName="cy" values="760;725;760" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="720" r="5" opacity="0.75"><animate attributeName="cy" values="720;690;720" dur="4.2s" repeatCount="indefinite"/></circle>
    </g>
  </svg>

  <canvas id="fx-canvas"></canvas>

  <!-- Верхня панель із кнопками "Назад", "Далі" та однією кнопкою перемикання мови -->
  <div class="hud">
    <div class="nav-group">
      <!-- Кнопка Назад -->
      <button class="hud-btn" id="btn-prev" aria-label="prev">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff8d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <!-- Кнопка Далі -->
      <button class="hud-btn" id="btn-next" aria-label="next">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff8d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>

    <!-- Єдина кнопка перемикання мови (UA / RU) -->
    <button class="hud-btn" id="btn-lang">UA</button>
  </div>

  <!-- Таблиця-ключ із 10 монстриками -->
  <div id="cipher-board"></div>

  <!-- Ігрова сцена: завдання + вікно картинки-відгадки + живий персонаж -->
  <div id="stage-area">
    <div id="task-board">
      <div class="pair-wrap" id="pair-container"></div>

      <!-- Круглий медальйон, де з'являється SVG-картинка прочитаного слова -->
      <div id="reward-panel">
        <div id="mystery-cover">
          <svg width="110" height="110" viewBox="0 0 100 100">
            <path d="M50,10 C80,10 90,45 50,90 C10,45 20,10 50,10 Z" fill="#2ec4b6" stroke="#cbf3f0" stroke-width="3"/>
            <path d="M50,20 L50,80 M50,40 L68,28 M50,55 L32,42 M50,65 L66,54" stroke="#cbf3f0" stroke-width="3" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="16" fill="#ffbe0b" stroke="#fb5607" stroke-width="3"/>
            <path d="M45,43 Q50,36 55,43 Q58,48 50,52 L50,56 M50,63 L50,64" stroke="#3a0ca3" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <div id="reward-svg-holder"></div>
      </div>
    </div>

    <!-- Живий персонаж-помічник: Хамелеон Чіко, який стежить очима та реагує емоціями -->
    <div id="companion-box">
      <svg viewBox="0 0 220 240" width="100%" height="100%">
        <defs>
          <linearGradient id="chamBody" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#80ed99"/>
            <stop offset="55%" stop-color="#38b000"/>
            <stop offset="100%" stop-color="#007200"/>
          </linearGradient>
          <linearGradient id="chamBelly" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffea79"/>
            <stop offset="100%" stop-color="#ff9f1c"/>
          </linearGradient>
        </defs>
        <!-- Гілка дерева -->
        <path d="M10,195 Q110,175 215,205" stroke="#7f4f24" stroke-width="18" stroke-linecap="round" fill="none"/>
        <path d="M35,190 Q15,165 8,170" stroke="#582f0e" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M12,168 C0,150 20,140 28,162 Z" fill="#52b788"/>
        <!-- Закручений хвіст -->
        <path d="M155,165 C205,165 210,225 165,225 C135,225 135,190 160,190 C178,190 175,210 162,208" stroke="url(#chamBody)" stroke-width="18" stroke-linecap="round" fill="none"/>
        <!-- Тулуб хамелеона -->
        <path d="M55,155 C50,95 155,85 170,160 C150,180 75,180 55,155 Z" fill="url(#chamBody)" stroke="#004b23" stroke-width="3"/>
        <path d="M70,158 C88,138 135,138 152,162 C130,175 90,175 70,158 Z" fill="url(#chamBelly)"/>
        <!-- Гребінець на спині -->
        <polygon points="85,105 92,90 100,103 110,88 118,103 128,92 135,108" fill="#ffbe0b" stroke="#d97706" stroke-width="2"/>
        <!-- Смужки на тілі -->
        <path d="M95,112 Q90,132 98,145 M120,112 Q118,132 125,145 M142,120 Q142,136 148,148" stroke="#006400" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
        <!-- Лапки -->
        <path d="M72,165 L64,190 M82,168 L76,190 M138,166 L142,190 M148,164 L154,190" stroke="#2b9348" stroke-width="9" stroke-linecap="round"/>
        <!-- Голова з гребенем -->
        <path d="M25,118 C20,65 85,42 108,82 C118,100 105,142 62,144 C35,144 26,132 25,118 Z" fill="url(#chamBody)" stroke="#004b23" stroke-width="3"/>
        <!-- Ротик (змінюється при емоціях) -->
        <path id="cham-mouth" d="M32,126 Q52,138 72,122" stroke="#003519" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <!-- Язичок (вилітає при перемозі) -->
        <path id="cham-tongue" d="M40,127 Q10,125 5,115" stroke="#ff4d6d" stroke-width="0" stroke-linecap="round" fill="none"/>
        <!-- Великі рухливі очі -->
        <g transform="translate(52,92)">
          <circle r="20" fill="#d9ed92" stroke="#004b23" stroke-width="3"/>
          <circle r="13" fill="#ffffff"/>
          <circle class="cham-pupil" cx="0" cy="0" r="7" fill="#1b1b1e"/>
          <circle cx="-3" cy="-3" r="2.5" fill="#ffffff"/>
        </g>
        <g transform="translate(86,90)">
          <circle r="17" fill="#d9ed92" stroke="#004b23" stroke-width="3"/>
          <circle r="11" fill="#ffffff"/>
          <circle class="cham-pupil" cx="0" cy="0" r="6" fill="#1b1b1e"/>
          <circle cx="-2" cy="-2" r="2" fill="#ffffff"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   1. ДАНІ ГРИ НА ДВОХ МОВАХ (УКРАЇНСЬКА ТА РОСІЙСЬКА)

/* ============================================================================
   4. СИНТЕЗАТОР ЗВУКІВ (WEB AUDIO API) — АКТИВНІ МУЗИЧНІ ФІДБЕКИ БЕЗ СЛІВ
   ============================================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type, duration, delay = 0, vol = 0.18) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(audioCtx.currentTime + delay);
  osc.stop(audioCtx.currentTime + delay + duration);
}

// Звук правильного вставлення складу (дзвінкий булькаючий акорд)
function sfxCorrectSlot() {
  playTone(523.25, 'sine', 0.14, 0, 0.22);
  playTone(659.25, 'triangle', 0.18, 0.07, 0.22);
  playTone(783.99, 'sine', 0.22, 0.14, 0.24);
}

// Звук помилки (кумедна пружинка)
function sfxWrong() {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(220, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(95, audioCtx.currentTime + 0.28);
  gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

// Переможна фанфара при розшифруванні всього слова
function sfxWinWord() {
  const notes = [523.25, 659.25, 783.99, 1046.50, 987.77, 1046.50];
  const times = [0, 0.09, 0.18, 0.27, 0.40, 0.52];
  notes.forEach((n, i) => playTone(n, 'triangle', 0.26, times[i], 0.24));
}

// Легкий клік для кнопок навігації
function sfxClick() {
  playTone(440, 'sine', 0.08, 0, 0.14);
}

/* ============================================================================
   5. СИСТЕМА СВЯТКОВИХ ЧАСТИНОК (ФЕЄРВЕРК ЗІРОЧОК ТА КОНФЕТІ)
   ============================================================================ */
const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function spawnBurst(x, y, count = 45) {
  const colors = ['#ffe66d', '#ff4d6d', '#4cc9f0', '#80ed99', '#ff9f1c', '#c77dff'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 9;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: 5 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1,
      decay: 0.015 + Math.random() * 0.018,
      rot: Math.random() * 6,
      vrot: (Math.random() - 0.5) * 0.25
    });
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.22; // гравітація
    p.rot += p.vrot;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(-p.size / 2, -p.size / 2, p.size, p.size, 3);
    ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ============================================================================
   6. ЛОГІКА ГРИ, РЕНДЕРИНГ СЛАЙДІВ ТА ЖИВОГО ПЕРСОНАЖА
   ============================================================================ */
let currentLang = 'UA';
let currentSlide = 0;
let filledSlots = [false, false];
let activeSlotIndex = 0;

const cipherBoard = document.getElementById('cipher-board');
const pairContainer = document.getElementById('pair-container');
const rewardPanel = document.getElementById('reward-panel');
const rewardSvgHolder = document.getElementById('reward-svg-holder');
const companionBox = document.getElementById('companion-box');
const chamMouth = document.getElementById('cham-mouth');
const chamTongue = document.getElementById('cham-tongue');

// Побудова верхньої таблиці-ключа з 10 монстриками
function renderCipherBoard() {
  const data = GAME_DATA[currentLang];
  cipherBoard.innerHTML = '';
  data.syllables.forEach((syl, idx) => {
    const card = document.createElement('div');
    card.className = 'key-card';
    card.innerHTML = `
      <div class="key-monster">${getMonsterSVG(idx)}</div>
      <div class="syllable-pill">${syl}</div>
    `;
    card.addEventListener('click', (e) => handleSelectMonster(idx, e));
    cipherBoard.appendChild(card);
  });
}

// Побудова поточного слайда з одним словом із двох монстриків
function renderSlide() {
  const data = GAME_DATA[currentLang];
  const wordObj = data.words[currentSlide];
  filledSlots = [false, false];
  activeSlotIndex = 0;

  rewardPanel.classList.remove('unlocked');
  rewardSvgHolder.innerHTML = getWordIllustrationSVG(wordObj.icon);

  pairContainer.innerHTML = '';
  wordObj.pair.forEach((monsterIdx, slotIdx) => {
    const unit = document.createElement('div');
    unit.className = 'target-unit';
    unit.innerHTML = `
      <div class="target-monster">${getMonsterSVG(monsterIdx)}</div>
      <div class="slot-box ${slotIdx === 0 ? 'active-slot' : ''}" data-slot="${slotIdx}"></div>
    `;
    const slotBox = unit.querySelector('.slot-box');
    slotBox.addEventListener('click', () => {
      if (!filledSlots[slotIdx]) {
        activeSlotIndex = slotIdx;
        updateActiveSlotHighlight();
        sfxClick();
      }
    });
    pairContainer.appendChild(unit);
  });
}

function updateActiveSlotHighlight() {
  document.querySelectorAll('.slot-box').forEach((el, idx) => {
    el.classList.toggle('active-slot', idx === activeSlotIndex && !filledSlots[idx]);
  });
}

// Обробка вибору складу дитиною
function handleSelectMonster(chosenMonsterIdx, event) {
  if (filledSlots[0] && filledSlots[1]) return;

  const data = GAME_DATA[currentLang];
  const wordObj = data.words[currentSlide];
  const expectedMonsterIdx = wordObj.pair[activeSlotIndex];
  const slotElements = document.querySelectorAll('.slot-box');
  const targetSlot = slotElements[activeSlotIndex];

  // Перевіряємо, чи збігається монстрик (або сам склад)
  if (chosenMonsterIdx === expectedMonsterIdx) {
    filledSlots[activeSlotIndex] = true;
    targetSlot.textContent = data.syllables[chosenMonsterIdx];
    targetSlot.classList.remove('active-slot', 'wrong');
    targetSlot.classList.add('filled');

    const rect = targetSlot.getBoundingClientRect();
    spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 28);
    sfxCorrectSlot();
    triggerCompanionEmotion('happy');

    // Переходимо до іншого вільного слота або відкриваємо картинку слова
    if (!filledSlots[0]) {
      activeSlotIndex = 0;
      updateActiveSlotHighlight();
    } else if (!filledSlots[1]) {
      activeSlotIndex = 1;
      updateActiveSlotHighlight();
    } else {
      // Обидва склади розшифровано — показуємо картинку прочитаного слова!
      setTimeout(() => {
        rewardPanel.classList.add('unlocked');
        const rRect = rewardPanel.getBoundingClientRect();
        spawnBurst(rRect.left + rRect.width / 2, rRect.top + rRect.height / 2, 70);
        sfxWinWord();
      }, 220);
    }
  } else {
    // Помилка — активний візуальний і звуковий фідбек без слів
    targetSlot.classList.remove('wrong');
    void targetSlot.offsetWidth;
    targetSlot.classList.add('wrong');
    sfxWrong();
    triggerCompanionEmotion('oops');
  }
}

// Живі реакції Хамелеона Чіко
function triggerCompanionEmotion(state) {
  companionBox.classList.remove('happy', 'oops');
  void companionBox.offsetWidth;
  if (state === 'happy') {
    companionBox.classList.add('happy');
    chamMouth.setAttribute('d', 'M30,122 Q52,148 74,120');
    chamTongue.setAttribute('stroke-width', '7');
    setTimeout(() => {
      chamTongue.setAttribute('stroke-width', '0');
      chamMouth.setAttribute('d', 'M32,126 Q52,138 72,122');
    }, 900);
  } else {
    companionBox.classList.add('oops');
    chamMouth.setAttribute('d', 'M38,132 Q52,120 66,132');
    setTimeout(() => {
      chamMouth.setAttribute('d', 'M32,126 Q52,138 72,122');
    }, 700);
  }
}

// Очі Хамелеона стежать за курсором мишки
window.addEventListener('mousemove', (e) => {
  document.querySelectorAll('.cham-pupil').forEach((pupil) => {
    const rect = pupil.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
    const dist = Math.min(5, Math.hypot(e.clientX - cx, e.clientY - cy) / 25);
    pupil.setAttribute('cx', (Math.cos(angle) * dist).toFixed(1));
    pupil.setAttribute('cy', (Math.sin(angle) * dist).toFixed(1));
  });
});

// Клік по Хамелеону або відкритій картинці тішить дітей додатковим салютом
companionBox.addEventListener('click', (e) => {
  sfxCorrectSlot();
  triggerCompanionEmotion('happy');
  spawnBurst(e.clientX, e.clientY, 30);
});

rewardPanel.addEventListener('click', (e) => {
  if (rewardPanel.classList.contains('unlocked')) {
    sfxWinWord();
    spawnBurst(e.clientX, e.clientY, 55);
    triggerCompanionEmotion('happy');
  }
});

// Кнопки навігації: Назад, Далі та Перемикання мови (одна кнопка)
document.getElementById('btn-prev').addEventListener('click', () => {
  sfxClick();
  const total = GAME_DATA[currentLang].words.length;
  currentSlide = (currentSlide - 1 + total) % total;
  renderSlide();
});

document.getElementById('btn-next').addEventListener('click', () => {
  sfxClick();
  const total = GAME_DATA[currentLang].words.length;
  currentSlide = (currentSlide + 1) % total;
  renderSlide();
});

const btnLang = document.getElementById('btn-lang');
btnLang.addEventListener('click', () => {
  sfxClick();
  currentLang = currentLang === 'UA' ? 'RU' : 'UA';
  btnLang.textContent = currentLang;
  renderCipherBoard();
  renderSlide();
});

// Запуск гри
renderCipherBoard();
renderSlide();
</script>
