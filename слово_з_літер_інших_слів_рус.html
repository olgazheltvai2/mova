<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разгадай слово: Пропущенные буквы</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e0e0e0;
            transition: background-image 0.5s ease;
            user-select: none;
            overflow: hidden; /* Забороняємо прокрутку всього екрану */
        }

        #game-container {
            background: linear-gradient(135deg, rgba(255, 240, 245, 0.9), rgba(240, 248, 255, 0.9));
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 98vw;
            height: 98vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* Setup Screen */
        #setup-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: auto;
            width: 100%;
            max-width: 1000px;
        }

        #word-input {
            font-size: 36px;
            padding: 15px;
            width: 80%;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: #ffffff;
            color: #ffffff; /* Текст невидимий */
            caret-color: #000000;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #word-input:focus {
            outline: none;
            border-color: #888;
        }

        #start-btn, #restart-btn {
            font-size: 28px;
            padding: 15px 40px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        #start-btn:hover, #restart-btn:hover {
            background-color: #45a049;
        }

        /* Play Screen */
        #play-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            height: 100%;
            width: 100%;
        }

        #slots-area {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Дозволяємо перенесення на новий рядок, щоб комірки не стискалися критично */
            width: 100%;
            gap: 2.5vw; /* Збільшено відступ між комірками для уникнення накладання */
            margin-bottom: 20px;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex: 1 1 auto; /* Змінено на auto, щоб враховувався розмір контенту */
            min-width: 80px; /* Мінімальна ширина, щоб літери не налізали */
            max-width: 140px;
        }

        .slot {
            width: 100%;
            aspect-ratio: 3/4; /* Пропорція замість жорстких пікселів */
            border: 4px dashed #888;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(200, 200, 200, 0.2);
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            box-sizing: border-box;
        }

        .slot.filled {
            border-style: solid;
            border-color: #4CAF50;
            background: transparent;
        }

        .expression {
            font-size: clamp(14px, 1.8vw, 30px); /* Зменшено шрифт для уникнення накладання */
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            letter-spacing: 1px; /* Зменшено відстань між літерами */
        }

        #cards-area {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Карткам дозволено переноситися для зручності */
            gap: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.05);
            border-radius: 20px;
            min-height: 120px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            width: 90px;
            height: 110px;
            background: white;
            border: 3px solid #2196F3;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card.selected {
            border-color: #FF9800;
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 152, 0, 0.4);
        }

        .card .char {
            font-size: 56px;
            font-weight: bold;
            color: #000;
            line-height: 1.1;
        }

        #win-message {
            display: none;
            font-size: 64px;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-anim {
            animation: shake 0.4s;
            border-color: #f44336 !important;
        }

        /* Theme Manager */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid #ccc;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        #theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            width: 320px;
            max-height: 60vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow-y: auto;
            padding: 15px;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .theme-thumb {
            height: 100px;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            border: 3px solid transparent;
        }

        .theme-thumb:hover { border-color: #4CAF50; }
        .theme-thumb span {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 4px 0;
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
        }
    </style>
</head>

            <button id="start-btn">НАЧАТЬ ИГРУ</button>
        </div>

            <div id="win-message"></div>
            <div id="slots-area"></div>
            <div id="cards-area"></div>

        </div>
    </div>

    <button id="theme-btn">⚙️</button>

    <script>
        /* === THEME MANAGER === */
        const baseBgUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        let currentBgIndex = 1;
        const themeModal = document.getElementById('theme-modal');
        const themeBtn = document.getElementById('theme-btn');

        themeBtn.onclick = () => {
            themeModal.style.display = themeModal.style.display === 'grid' ? 'none' : 'grid';
        };

        function setBackground(url) {
            document.body.style.backgroundImage = `url(${url})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundAttachment = 'fixed';
            localStorage.setItem('mySavedGameBg', url);
        }

        function checkAndLoadNextBg() {
            if (currentBgIndex > 1000) return;
            const url = `${baseBgUrl}background_${currentBgIndex}.webp`;
            const img = new Image();
            
            img.onload = () => {
                const thumb = document.createElement('div');
                thumb.className = 'theme-thumb';
                thumb.style.backgroundImage = `url(${url})`;
                
                const label = document.createElement('span');
                label.innerText = `Фон ${currentBgIndex}`;
                
                thumb.appendChild(label);
                thumb.onclick = () => {
                    setBackground(url);
                    themeModal.style.display = 'none';
                };
                
                themeModal.appendChild(thumb);
                currentBgIndex++;
                checkAndLoadNextBg();
            };
            img.onerror = () => {
                // Якщо картинки немає, зупиняємо пошук
            };
            img.src = url;
        }

        setBackground(localStorage.getItem('mySavedGameBg') || `${baseBgUrl}background_1.webp`);
        checkAndLoadNextBg();

        /* === SOUND SYSTEM (Web Audio API) === */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // Ре5
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // Ля5
                    gain.gain.setValueAtTime(0.08, now); // Тихий рівень
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === 'error') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now); // Ля3
                    osc.frequency.linearRampToValueAtTime(110, now + 0.25); // Ля2
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.26);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // До5 - Мі5 - Соль5 - До6
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.type = 'sine';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        noteGain.gain.setValueAtTime(0.06, now + idx * 0.12);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
                        noteOsc.start(now + idx * 0.12);
                        noteOsc.stop(now + idx * 0.12 + 0.45);
                    });
                }
            } catch (e) {
                console.log("Audio failed to play", e);
            }
        }

            "ЩЁТКА", "ЩУКА", "КУСТ", "ТЕНЬ", "КОНЬ", "ТОЛПА", "ЭКРАН", "МЕНЮ", "РИСУНОК", "МАЛЫШ", "КОРОБКА", "ЯЩИК", "СУМКА", "ВЕРЁВКА", "НИТКА", "ИГОЛКА", "ПУГОВИЦА", "УЗЕЛ"
        ];

        /* === GAME LOGIC === */
        let gameWord = "";
        let slotsData = [];
        let cardsData = [];
        let selectedCardId = null;

        const alphabet = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ".split('');

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', resetToSetup);

        function resetToSetup() {
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('win-message').style.display = 'none';
            document.getElementById('slots-area').style.display = 'flex';
            document.getElementById('cards-area').style.display = 'flex';
            slotsData = []; cardsData = []; selectedCardId = null;
        }

        function startGame() {
            const inputEl = document.getElementById('word-input');
            const rawWord = inputEl.value.trim().toUpperCase();
            inputEl.value = ''; 
            
            gameWord = rawWord.replace(/[^А-ЯЁ]/g, '');
            if (gameWord.length === 0) { alert('Введите слово на русском!'); return; }
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('play-screen').style.display = 'flex';

            generateLevel();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateLevel() {
            slotsData = []; cardsData = []; selectedCardId = null;
            let usedWords = new Set();
            let cardIdCounter = 1;

            // Генерація унікальних слів-завдань для кожної літери загаданого слова
            gameWord.split('').forEach((char, index) => {
                // Шукаємо в базі слова, які містять потрібну літеру
                let available = wordDatabase.filter(w => w.includes(char) && !usedWords.has(w));
                
                if (available.length === 0) {
                    // Якщо унікальні слова закінчились, беремо ті, що вже були
                    available = wordDatabase.filter(w => w.includes(char));
                    usedWords.clear();
                }

                let expr = "_";
                
                if (available.length > 0) {
                    const chosenWord = available[Math.floor(Math.random() * available.length)];
                    usedWords.add(chosenWord);
                    
                    // Знаходимо всі позиції нашої літери в обраному слові
                    let indices = [];
                    for (let i = 0; i < chosenWord.length; i++) {
                        if (chosenWord[i] === char) indices.push(i);
                    }
                    
                    // Вибираємо випадкову позицію літери і ховаємо її
                    let dropIndex = indices[Math.floor(Math.random() * indices.length)];
                    let wordArr = chosenWord.split('');
                    wordArr[dropIndex] = '_';
                    expr = wordArr.join('');
                }

                slotsData.push({
                    index: index,
                    char: char,           // Велика літера, яка відкриється в квадраті
                    target: char,         // Літера, яку треба вставити (те саме, що char)
                    expression: expr,     // Слово з пропуском (напр. 'С_БАКА')
                    filledWithId: null
                });

                cardsData.push({
                    id: cardIdCounter++,
                    target: char,         // На картці буде написана потрібна літера
                    placedInSlot: null
                });
            });

            // Додаємо плутаючі літери (декої), які точно не підходять для слова
            const requiredAnswers = slotsData.map(s => s.target);
            const possibleAnswers = alphabet;
            let availableDecoys = possibleAnswers.filter(a => !requiredAnswers.includes(a));
            
            const decoysCount = Math.max(5, Math.floor(gameWord.length / 2));
            let finalDecoyLetters = shuffle(availableDecoys).slice(0, decoysCount);

            finalDecoyLetters.forEach(char => {
                cardsData.push({
                    id: cardIdCounter++,
                    target: char,
                    placedInSlot: null
                });
            });

            cardsData = shuffle(cardsData);
            renderGame();
        }

        function renderGame() {
            const slotsArea = document.getElementById('slots-area');
            const cardsArea = document.getElementById('cards-area');
            
            slotsArea.innerHTML = '';
            cardsArea.innerHTML = '';

            slotsData.forEach((slot, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'slot-wrapper';

                const slotEl = document.createElement('div');
                slotEl.className = 'slot' + (slot.filledWithId ? ' filled' : '');
                
                if (slot.filledWithId) {
                    // Коли дитина правильно вставляє букву, слот відкриває велику літеру загаданого слова
                    slotEl.innerHTML = `
                        <div style="text-align:center;">
                            <div class="char" style="font-size:clamp(40px, 5vw, 64px); font-weight:bold; line-height:1.1; color:#000;">${slot.char}</div>
                        </div>
                    `;
                }

                slotEl.onclick = () => handleSlotClick(idx, slotEl);

                const expEl = document.createElement('div');
                expEl.className = 'expression';
                
                // Рендеримо слово під коміркою з підсвіткою пропуску або вставленої літери
                expEl.innerHTML = slot.filledWithId 
                    ? slot.expression.replace('_', `<span style="color:#4CAF50">${slot.target}</span>`)
                    : slot.expression.replace('_', '<span style="color:#d32f2f">_</span>');

                wrapper.appendChild(slotEl);
                wrapper.appendChild(expEl);
                slotsArea.appendChild(wrapper);
            });

            cardsData.filter(c => c.placedInSlot === null).forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card' + (selectedCardId === card.id ? ' selected' : '');
                
                cardEl.innerHTML = `
                    <div class="char">${card.target}</div>
                `;
                cardEl.onclick = () => handleCardClick(card.id);
                cardsArea.appendChild(cardEl);
            });

            checkWin();
        }

        function handleCardClick(id) {
            selectedCardId = selectedCardId === id ? null : id;
            renderGame();
        }

        function handleSlotClick(slotIndex, slotEl) {
            const slot = slotsData[slotIndex];

            if (slot.filledWithId) {
                const card = cardsData.find(c => c.id === slot.filledWithId);
                card.placedInSlot = null;
                slot.filledWithId = null;
                renderGame();
                return;
            }

            if (selectedCardId) {
                const card = cardsData.find(c => c.id === selectedCardId);
                
                // Якщо обрана літера співпадає з потрібною літерою у слові-прикладі
                if (card.target === slot.target) {
                    card.placedInSlot = slotIndex;
                    slot.filledWithId = card.id;
                    selectedCardId = null;
                    playSound('success'); // Тихий звук успіху
                    renderGame();
                } else {
                    slotEl.classList.add('error-anim');
                    playSound('error'); // М'який звук помилки
                    setTimeout(() => slotEl.classList.remove('error-anim'), 400);
                    selectedCardId = null;
                    renderGame();
                }
            }
        }

        function checkWin() {
            const isWin = slotsData.every(s => s.filledWithId !== null);
            if (isWin && slotsData.length > 0) {
                document.getElementById('win-message').innerText = gameWord;
                document.getElementById('win-message').style.display = 'block';
                document.getElementById('slots-area').style.display = 'none';
                document.getElementById('cards-area').style.display = 'none';
                document.getElementById('restart-btn').style.display = 'block';
                playSound('win'); // Фанфари перемоги
            }
        }
    </script>
