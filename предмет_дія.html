<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Брутальна Книга: Рандомне Сортування</title>
    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: transparent; 
            --paper: #fff9e3; 
            --ink: #101010;
            --accent: #ffff00;
            --btn-next: #50fa7b;
            --btn-prev: #ffb86c;
        }

        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Arial Black', Arial, sans-serif; 
            background-color: #2d3831; /* Fallback */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100vw;
            height: 100vh;
        }

        #game-container-outer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: transparent;
        }

        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transform-origin: center center;
            transition: transform 0.2s ease;
            background: transparent;
        }

        #book-viewport {
            position: relative;
            width: 1000px;
            height: 600px;
            z-index: 2;
        }

        #book-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(20px 20px 0px rgba(0,0,0,0.8));
        }

        #active-word-area {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .sticker {
            padding: 20px 40px;
            background: var(--accent);
            border: 6px solid var(--ink);
            box-shadow: 10px 10px 0px #000;
            font-size: 40px;
            cursor: grab;
            user-select: none;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        .sticker:active { transform: scale(1.1); cursor: grabbing; }

        .placed-sticker {
            position: absolute;
            padding: 12px 24px;
            background: #fff;
            border: 4px solid var(--ink);
            box-shadow: 5px 5px 0px #000;
            font-size: 26px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 5;
            transition: left 0.3s, top 0.3s;
        }

        .nav-btn {
            position: absolute;
            bottom: 30px;
            padding: 15px 35px;
            font-size: 22px;
            font-weight: 900;
            border: 5px solid var(--ink);
            box-shadow: 8px 8px 0px #000;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            z-index: 20;
        }

        .nav-btn:active { transform: translate(4px, 4px); box-shadow: 4px 4px 0px #000; }
        #btn-back { left: -60px; background: var(--btn-prev); }
        #btn-forth { right: -60px; background: var(--btn-next); }

        .drop-zone {
            position: absolute;
            top: 60px;
            width: 430px;
            height: 480px;
            z-index: 4;
        }
        #zone-noun { left: 60px; }
        #zone-verb { left: 510px; }

        @keyframes shake { 
            0%, 100% {transform:translateX(0);} 
            25% {transform:translateX(-15px);} 
            75% {transform:translateX(15px);} 
        }

        /* Адаптивність */
        @media (max-width: 1100px) {
            #game-wrapper { transform: scale(0.8); }
        }
        @media (max-width: 900px) {
            #game-wrapper { transform: scale(0.6); }
        }
        @media (max-width: 600px) {
            #game-wrapper { transform: scale(0.4); }
        }

        /* UI Elements */
        #lang-switcher {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 99999;
            opacity: 0.3;
            transition: opacity 0.3s;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-weight: bold;
            background: rgba(255,255,255,0.8);
            border: 2px solid #000;
            padding: 5px 10px;
            border-radius: 5px;
        }
        #lang-switcher:hover { opacity: 1; }

        #zoom-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 99999;
            display: flex;
            gap: 10px;
        }
        .zoom-btn {
            background: rgba(255,255,255,0.9);
            border: 2px solid #000;
            width: 40px;
            height: 40px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            font-size: 24px;
            border: 2px solid #000;
            cursor: pointer;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            max-height: 60vh;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            z-index: 100000;
            padding: 20px;
            overflow-y: auto;
        }
        .theme-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .theme-modal-close {
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            background: #ff5252;
            color: #fff;
            border: 2px solid #000;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
        }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .theme-card {
            position: relative;
            cursor: pointer;
            border: 2px solid #000;
            border-radius: 5px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #ccc;
        }
        .theme-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-card span {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            text-align: center;
            padding: 5px 0;
            font-size: 14px;
            font-weight: bold;
        }

        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            color: #ff5252;
            font-size: 5vw;
            font-weight: bold;
            z-index: 999999;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            text-align: center;
        }

        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px;
            right: 20px;
            background: #8e44ad;
            color: white;
            border: 2px solid #000;
            border-radius: 5px;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 99999;
        }

        #draw-panel-global {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border: 3px solid #000;
            box-shadow: 5px 5px 0px #000;
            z-index: 100000;
            padding: 10px;
            width: 200px;
            user-select: none;
        }
        .draw-handle {
            background: #ccc;
            cursor: grab;
            padding: 5px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            border: 1px solid #000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .draw-close { cursor: pointer; color: red; font-weight: bold; }
        .draw-tools { display: flex; flex-direction: column; gap: 10px; }
        .draw-btn {
            background: #eee; border: 2px solid #000; padding: 5px; cursor: pointer; font-weight: bold;
        }
        .draw-btn.active { background: #50fa7b; }
        #draw-canvas-global {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 90000;
        }
    </style>
</head>
<body>

<div id="block-overlay">Зачекай! Зараз не твій урок.</div>

<div id="zoom-controls">
    <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
    <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
</div>

<div id="lang-switcher" onclick="toggleLanguage()">УКР</div>

<div id="game-container-outer">
    <div id="game-wrapper">
        <div id="book-viewport">
            <svg id="book-svg" viewBox="0 0 1000 600">
                <rect x="40" y="40" width="920" height="520" fill="#4e342e" stroke="#000" stroke-width="8" rx="10" />
                <rect x="60" y="60" width="430" height="480" fill="#fff9e3" stroke="#000" stroke-width="4" />
                <rect x="510" y="60" width="430" height="480" fill="#fff9e3" stroke="#000" stroke-width="4" />
                <rect x="490" y="40" width="20" height="520" fill="#3e2723" stroke="#000" stroke-width="2" />
                <text id="txt-noun" x="275" y="140" font-family="Arial Black" font-size="50" text-anchor="middle" fill="#000">ПРЕДМЕТ</text>
                <text id="txt-verb" x="725" y="140" font-family="Arial Black" font-size="50" text-anchor="middle" fill="#000">ДІЯ</text>
                <line x1="100" y1="160" x2="450" y2="160" stroke="#000" stroke-width="6" />
                <line x1="550" y1="160" x2="900" y2="160" stroke="#000" stroke-width="6" />
            </svg>

            <div id="zone-noun" class="drop-zone" data-type="noun"></div>
            <div id="zone-verb" class="drop-zone" data-type="verb"></div>
            
            <div id="sticker-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
        </div>

        <div id="active-word-area"></div>

        <button id="btn-back" class="nav-btn" data-uk="НАЗАД" data-ru="НАЗАД">назад</button>
        <button id="btn-forth" class="nav-btn" data-uk="ДАЛІ" data-ru="ДАЛЕЕ">далі</button>
    </div>
</div>

<button id="theme-btn">⚙️</button>
<div id="theme-modal">
    <div class="theme-modal-header">
        <h2>Вибір фону</h2>
        <div class="theme-modal-close" onclick="document.getElementById('theme-modal').style.display='none'">✕</div>
    </div>
    <div id="theme-gallery">
        <div class="theme-card" onclick="setTheme('none')">
            <div style="width:100%; height:100%; background:#2d3831;"></div>
            <span>Без фону</span>
        </div>
    </div>
</div>

<button id="toggle-draw-btn-global">✏️ Малювати</button>
<div id="draw-panel-global">
    <div class="draw-handle" id="draw-handle-global">
        <span>Панель</span>
        <span class="draw-close" id="close-draw-global">✕</span>
    </div>
    <div class="draw-tools">
        <button class="draw-btn active" id="tool-pencil-global">✏️ Олівець</button>
        <button class="draw-btn" id="tool-eraser-global">🧽 Гумка</button>
        <input type="range" id="draw-size-global" min="1" max="50" value="5">
        <input type="color" id="draw-color-global" value="#ff0000">
        <button class="draw-btn" id="tool-clear-global">🗑️ Очистити</button>
    </div>
</div>
<canvas id="draw-canvas-global"></canvas>

<script>
    // CONFIG & FIREBASE SETUP
    const CONFIG = {
        gameId: 'brutal_book_sort',
        firebaseUrl: 'https://lesson-13c44-default-rtdb.firebaseio.com/',
        projectId: 'lesson-13c44'
    };

    let app, db;
    let isConnected = false;
    try {
        app = firebase.initializeApp({ databaseURL: CONFIG.firebaseUrl, projectId: CONFIG.projectId });
        db = firebase.database();
        isConnected = true;
    } catch (e) {
        console.warn("Firebase не підключено, гра працює локально.", e);
    }

    // USER IDENTITY
    function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }
    let myName = getQueryParam('user') || sessionStorage.getItem('username');
    if (!myName) {
        myName = 'Гість_' + Math.floor(Math.random() * 1000);
    }
    sessionStorage.setItem('username', myName);
    const mySenderId = myName + '_' + Math.random().toString(36).substr(2, 9);
    const tabId = 'tab_' + Math.random().toString(36).substr(2, 9);

    // GAME DATA & MULTILINGUAL
    const dictionaries = {
        uk: [
            {w: "Олівець", t: "noun"}, {w: "Малює", t: "verb"}, {w: "Школа", t: "noun"}, {w: "Вчиться", t: "verb"},
            {w: "Друг", t: "noun"}, {w: "Грається", t: "verb"}, {w: "Сонце", t: "noun"}, {w: "Світить", t: "verb"},
            {w: "Дерево", t: "noun"}, {w: "Росте", t: "verb"}, {w: "Кіт", t: "noun"}, {w: "Стрибає", t: "verb"}
        ],
        ru: [
            {w: "Карандаш", t: "noun"}, {w: "Рисует", t: "verb"}, {w: "Школа", t: "noun"}, {w: "Учится", t: "verb"},
            {w: "Друг", t: "noun"}, {w: "Играет", t: "verb"}, {w: "Солнце", t: "noun"}, {w: "Светит", t: "verb"},
            {w: "Дерево", t: "noun"}, {w: "Растет", t: "verb"}, {w: "Кот", t: "noun"}, {w: "Прыгает", t: "verb"}
        ]
    };

    let currentLang = 'uk';
    let dictionary = [...dictionaries.uk];
    // To keep sync random across clients, we seed from Firebase or just let the first user mix it.
    // For simplicity and 100% sync, we will just use the standard order or sync a "shuffle" action.
    dictionary.sort(() => Math.random() - 0.5); 
    
    let currentIdx = 0;
    let placedWords = [];

    // AUDIO
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(freq, dur, type = 'square') {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
    }

    // SYNC HELPER
    function syncAction(type, data) {
        if (!isConnected) return;
        db.ref('game_action').set({
            senderId: mySenderId,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            type: type,
            data: data
        });
    }

    // ZOOM CONTROL
    let currentZoom = 1;
    function adjustZoom(delta) {
        currentZoom += delta;
        if(currentZoom < 0.2) currentZoom = 0.2;
        if(currentZoom > 3) currentZoom = 3;
        document.getElementById('game-wrapper').style.transform = `scale(${currentZoom})`;
    }

    // LANGUAGE SWITCHER
    function toggleLanguage(isRemote = false) {
        currentLang = currentLang === 'uk' ? 'ru' : 'uk';
        document.getElementById('lang-switcher').innerText = currentLang.toUpperCase();
        
        document.getElementById('txt-noun').textContent = currentLang === 'uk' ? 'ПРЕДМЕТ' : 'ПРЕДМЕТ';
        document.getElementById('txt-verb').textContent = currentLang === 'uk' ? 'ДІЯ' : 'ДЕЙСТВИЕ';
        document.getElementById('btn-back').textContent = document.getElementById('btn-back').getAttribute('data-' + currentLang);
        document.getElementById('btn-forth').textContent = document.getElementById('btn-forth').getAttribute('data-' + currentLang);

        // Update dictionary words in place to keep progress
        dictionary.forEach((item, i) => {
            const originalType = item.t;
            const originalIndex = dictionaries.uk.findIndex(u => u.w === item.w) > -1 ? dictionaries.uk.findIndex(u => u.w === item.w) : dictionaries.ru.findIndex(r => r.w === item.w);
            if(originalIndex > -1) {
                item.w = dictionaries[currentLang][originalIndex].w;
            }
        });

        renderActive();
        renderPlacedWords();

        if (!isRemote) {
            syncAction('change_lang', { lang: currentLang });
        }
    }

    // RENDER LOGIC
    function renderActive() {
        const area = document.getElementById('active-word-area');
        area.innerHTML = '';
        if (currentIdx >= dictionary.length) return;

        const item = dictionary[currentIdx];
        const el = document.createElement('div');
        el.className = 'sticker';
        el.textContent = item.w;
        el.dataset.type = item.t;
        el.draggable = true;

        // Mobile touch support for drag
        el.addEventListener('touchstart', handleTouchStart, {passive: false});
        el.addEventListener('touchmove', handleTouchMove, {passive: false});
        el.addEventListener('touchend', handleTouchEnd, {passive: false});

        el.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', 'active');
        });
        area.appendChild(el);
    }

    function renderPlacedWords() {
        const container = document.getElementById('sticker-container');
        container.innerHTML = '';
        placedWords.forEach((pw) => {
            if (pw.idx >= dictionary.length) return;
            const copy = document.createElement('div');
            copy.className = 'placed-sticker';
            copy.textContent = dictionary[pw.idx].w;
            copy.style.left = pw.x + 'px';
            copy.style.top = pw.y + 'px';
            copy.style.transform = `rotate(${pw.rot}deg)`;
            container.appendChild(copy);
        });
    }

    function stickWord(idx, mouseX, mouseY, rot, isRemote = false) {
        const bookRect = document.getElementById('book-viewport').getBoundingClientRect();
        let x = mouseX;
        let y = mouseY;
        
        if (!isRemote) {
            x = (mouseX - bookRect.left - 60) / currentZoom; 
            y = (mouseY - bookRect.top - 20) / currentZoom;
            rot = Math.random() * 16 - 8;
            syncAction('place_word', { idx: idx, x: x, y: y, rot: rot });
        }

        placedWords.push({ idx: idx, x: x, y: y, rot: rot });
        renderPlacedWords();
    }

    // MOUSE DRAG/DROP
    document.querySelectorAll('.drop-zone').forEach(zone => {
        zone.addEventListener('dragover', (e) => e.preventDefault());
        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            handleDropLogic(zone.dataset.type, e.clientX, e.clientY);
        });
    });

    // TOUCH DRAG/DROP
    let dragEl = null;
    function handleTouchStart(e) {
        dragEl = e.target;
        dragEl.style.position = 'absolute';
        dragEl.style.zIndex = 100;
        moveAt(e.touches[0].pageX, e.touches[0].pageY);
    }
    function handleTouchMove(e) {
        if(!dragEl) return;
        e.preventDefault();
        moveAt(e.touches[0].pageX, e.touches[0].pageY);
    }
    function moveAt(pageX, pageY) {
        dragEl.style.left = pageX - dragEl.offsetWidth / 2 + 'px';
        dragEl.style.top = pageY - dragEl.offsetHeight / 2 + 'px';
    }
    function handleTouchEnd(e) {
        if(!dragEl) return;
        dragEl.style.position = 'static';
        dragEl.style.zIndex = '';
        
        let touch = e.changedTouches[0];
        let dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
        
        if(dropTarget && dropTarget.classList.contains('drop-zone')) {
            handleDropLogic(dropTarget.dataset.type, touch.clientX, touch.clientY);
        }
        
        dragEl.style.left = '';
        dragEl.style.top = '';
        dragEl = null;
    }

    function handleDropLogic(zoneType, clientX, clientY) {
        const original = document.querySelector('.sticker');
        if (!original) return;

        if (original.dataset.type === zoneType) {
            stickWord(currentIdx, clientX, clientY, 0, false);
            playSfx(600, 0.2);
            currentIdx++;
            renderActive();
            syncAction('change_idx', { idx: currentIdx });
        } else {
            original.style.animation = 'shake 0.3s';
            setTimeout(() => original.style.animation = '', 300);
            playSfx(150, 0.4, 'sawtooth');
        }
    }

    // NAVIGATION
    document.getElementById('btn-forth').onclick = () => {
        if (currentIdx < dictionary.length) {
            currentIdx++;
            renderActive();
            playSfx(800, 0.05);
            syncAction('change_idx', { idx: currentIdx });
        }
    };

    document.getElementById('btn-back').onclick = () => {
        if (currentIdx > 0) {
            currentIdx--;
            placedWords = placedWords.filter(p => p.idx < currentIdx);
            renderPlacedWords();
            renderActive();
            playSfx(300, 0.05);
            syncAction('change_idx_back', { idx: currentIdx, words: placedWords });
        }
    };


    // FIREBASE ACTION LISTENER
    if (isConnected) {
        db.ref('game_action').on('value', snap => {
            const val = snap.val();
            if (!val || val.senderId === mySenderId) return; // Prevent local loop

            if (val.type === 'change_lang') {
                if (currentLang !== val.data.lang) {
                    currentLang = val.data.lang;
                    toggleLanguage(true);
                }
            } else if (val.type === 'place_word') {
                if (!placedWords.find(p => p.idx === val.data.idx)) {
                    stickWord(val.data.idx, val.data.x, val.data.y, val.data.rot, true);
                }
            } else if (val.type === 'change_idx') {
                currentIdx = val.data.idx;
                renderActive();
                playSfx(600, 0.2);
            } else if (val.type === 'change_idx_back') {
                currentIdx = val.data.idx;
                placedWords = val.data.words || [];
                renderPlacedWords();
                renderActive();
                playSfx(300, 0.05);
            }
        });
    }

    // ==========================================
    // THEME MANAGER (DYNAMIC BACKGROUNDS)
    // ==========================================
    const themeBtn = document.getElementById('theme-btn');
    const themeModal = document.getElementById('theme-modal');
    const themeGallery = document.getElementById('theme-gallery');
    
    themeBtn.onclick = () => {
        themeModal.style.display = 'block';
        loadThemes();
    };

    function setTheme(url, isRemote = false) {
        if(url === 'none') {
            document.body.style.backgroundImage = 'none';
        } else {
            document.body.style.backgroundImage = `url('${url}')`;
        }
        
        if(!isRemote) {
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            if(isConnected) {
                db.ref('game_theme').set({ url: url, senderId: mySenderId });
            }
        }
        themeModal.style.display = 'none';
    }

    let themesLoaded = false;
    async function loadThemes() {
        if(themesLoaded) return;
        themesLoaded = true;
        const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        
        for(let i = 1; i <= 1000; i++) {
            const url = `${baseUrl}background_${i}.webp`;
            try {
                const res = await fetch(url, { method: 'HEAD' });
                if(!res.ok) break; // Stop on 404 per instructions
                
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.onclick = () => setTheme(url);
                card.innerHTML = `<img src="${url}" loading="lazy"><span>Фон ${i}</span>`;
                themeGallery.appendChild(card);
            } catch(e) {
                break;
            }
        }
    }

    // INIT THEME
    const savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
    if(savedBg) setTheme(savedBg, true);

    if(isConnected) {
        db.ref('game_theme').on('value', snap => {
            const val = snap.val();
            if(val && val.senderId !== mySenderId) {
                setTheme(val.url, true);
            }
        });
    }

    // ==========================================
    // RADAR & BLOCKER LOGIC
    // ==========================================
    if(isConnected) {
        const myRef = db.ref(`online_users/${myName}/${tabId}`);
        db.ref('.info/connected').on('value', snap => {
            if (snap.val() === true) {
                myRef.onDisconnect().remove();
                myRef.set({ timestamp: firebase.database.ServerValue.TIMESTAMP });
            }
        });

        window.addEventListener('beforeunload', () => { myRef.remove(); });

        db.ref('force_refresh').on('value', snap => {
            if(snap.val() && snap.val() > Date.now() - 5000) {
                window.location.reload();
            }
        });

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        let startImmunity = true;
        setTimeout(() => startImmunity = false, 1000);
        
        db.ref('current_activity').on('value', snap => {
            if(startImmunity) return;
            const act = snap.val();
            if(act === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });
    }

    // ==========================================
    // GLOBAL DRAWING TOOL
    // ==========================================
    const canvas = document.getElementById('draw-canvas-global');
    const ctx = canvas.getContext('2d');
    const toggleDrawBtn = document.getElementById('toggle-draw-btn-global');
    const drawPanel = document.getElementById('draw-panel-global');
    const closeDrawBtn = document.getElementById('close-draw-global');
    const drawHandle = document.getElementById('draw-handle-global');

    let isDrawingEnabled = false;
    let isDrawing = false;
    let currentTool = 'pencil'; // 'pencil' | 'eraser'
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    toggleDrawBtn.onclick = () => {
        drawPanel.style.display = 'block';
        isDrawingEnabled = true;
        canvas.style.pointerEvents = 'auto';
    };

    closeDrawBtn.onclick = () => {
        drawPanel.style.display = 'none';
        isDrawingEnabled = false;
        canvas.style.pointerEvents = 'none';
    };

    document.getElementById('tool-pencil-global').onclick = (e) => {
        currentTool = 'pencil';
        document.querySelectorAll('.draw-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
    };
    document.getElementById('tool-eraser-global').onclick = (e) => {
        currentTool = 'eraser';
        document.querySelectorAll('.draw-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
    };
    document.getElementById('tool-clear-global').onclick = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if(isConnected) syncAction('clear_canvas', {});
    };

    // Make Panel Draggable
    let isDraggingPanel = false, panelX = 0, panelY = 0;
    drawHandle.onmousedown = (e) => { isDraggingPanel = true; panelX = e.clientX - drawPanel.offsetLeft; panelY = e.clientY - drawPanel.offsetTop; };
    drawHandle.ontouchstart = (e) => { isDraggingPanel = true; panelX = e.touches[0].clientX - drawPanel.offsetLeft; panelY = e.touches[0].clientY - drawPanel.offsetTop; };
    window.addEventListener('mousemove', (e) => { if(isDraggingPanel) { drawPanel.style.left = (e.clientX - panelX) + 'px'; drawPanel.style.top = (e.clientY - panelY) + 'px'; } });
    window.addEventListener('touchmove', (e) => { if(isDraggingPanel) { drawPanel.style.left = (e.touches[0].clientX - panelX) + 'px'; drawPanel.style.top = (e.touches[0].clientY - panelY) + 'px'; } });
    window.addEventListener('mouseup', () => isDraggingPanel = false);
    window.addEventListener('touchend', () => isDraggingPanel = false);

    // Drawing Logic
    let lastX = 0, lastY = 0;
    function getPos(e) {
        if(e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    }

    function startDraw(e) {
        if(!isDrawingEnabled) return;
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x; lastY = pos.y;
    }

    function draw(e) {
        if(!isDrawing || !isDrawingEnabled) return;
        e.preventDefault();
        const pos = getPos(e);
        const color = currentTool === 'eraser' ? null : document.getElementById('draw-color-global').value;
        const size = document.getElementById('draw-size-global').value;
        
        drawLineLocal(lastX, lastY, pos.x, pos.y, color, size, window.innerWidth, window.innerHeight);
        
        if(isConnected) {
            syncAction('draw_line', {
                x0: lastX / window.innerWidth, y0: lastY / window.innerHeight,
                x1: pos.x / window.innerWidth, y1: pos.y / window.innerHeight,
                color: color, size: size
            });
        }
        
        lastX = pos.x; lastY = pos.y;
    }

    function stopDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseout', stopDraw);
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDraw);

    function drawLineLocal(x0, y0, x1, y1, color, size, w, h) {
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        if(color === null) {
            ctx.globalCompositeOperation = "destination-out";
            ctx.lineWidth = size * 2;
            ctx.strokeStyle = "rgba(0,0,0,1)";
        } else {
            ctx.globalCompositeOperation = "source-over";
            ctx.lineWidth = size;
            ctx.strokeStyle = color;
        }
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.globalCompositeOperation = "source-over";
    }

    // Sync Draw
    if(isConnected) {
        db.ref('game_action').on('value', snap => {
            const val = snap.val();
            if(!val || val.senderId === mySenderId) return;
            
            if(val.type === 'draw_line') {
                const w = window.innerWidth;
                const h = window.innerHeight;
                drawLineLocal(val.data.x0 * w, val.data.y0 * h, val.data.x1 * w, val.data.y1 * h, val.data.color, val.data.size, w, h);
            } else if(val.type === 'clear_canvas') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });
    }

    // INITIAL START
    renderActive();

</script>
</body>
</html>
