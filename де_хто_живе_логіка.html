<!DOCTYPE html>
<html lang="und">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Woodland Houses</title>
  <style>
    /* ============================================================
       RESET & FULLSCREEN 16:9 VIEWPORT LOCK (ZERO SCROLL)
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #72c8f5;
      touch-action: none;
    }

    /* ============================================================
       MAIN STAGE & SCENIC BACKGROUND
       ============================================================ */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ============================================================
       AMBIENT STORYBOOK ANIMATIONS
       ============================================================ */
    @keyframes driftSlow {
      0%   { transform: translateX(-240px); }
      100% { transform: translateX(1840px); }
    }

    @keyframes driftMedium {
      0%   { transform: translateX(-280px); }
      100% { transform: translateX(1880px); }
    }

    @keyframes sunSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes sunPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    @keyframes treeSway {
      0%, 100% { transform: rotate(-1.6deg); }
      50%      { transform: rotate(1.9deg); }
    }

    @keyframes flowerBob {
      0%, 100% { transform: rotate(-4deg) scale(1); }
      50%      { transform: rotate(4deg) scale(1.05); }
    }

    @keyframes wingFlap {
      0%, 100% { transform: scaleX(1); }
      50%      { transform: scaleX(0.24); }
    }

    @keyframes butterflyPath1 {
      0%   { transform: translate(-80px, 240px) rotate(6deg); }
      25%  { transform: translate(420px, 165px) rotate(-8deg); }
      50%  { transform: translate(920px, 255px) rotate(5deg); }
      75%  { transform: translate(1360px, 180px) rotate(-6deg); }
      100% { transform: translate(1720px, 240px) rotate(4deg); }
    }

    @keyframes butterflyPath2 {
      0%   { transform: translate(1700px, 430px) scaleX(-1) rotate(5deg); }
      30%  { transform: translate(1160px, 345px) scaleX(-1) rotate(-7deg); }
      65%  { transform: translate(520px, 455px) scaleX(-1) rotate(6deg); }
      100% { transform: translate(-100px, 385px) scaleX(-1) rotate(-4deg); }
    }

    @keyframes butterflyPath3 {
      0%   { transform: translate(-90px, 680px) rotate(-5deg); }
      35%  { transform: translate(540px, 600px) rotate(7deg); }
      70%  { transform: translate(1140px, 695px) rotate(-6deg); }
      100% { transform: translate(1720px, 615px) rotate(5deg); }
    }

    .cloud-1 { animation: driftSlow 60s linear infinite; }
    .cloud-2 { animation: driftMedium 46s linear infinite; animation-delay: -19s; }
    .cloud-3 { animation: driftSlow 68s linear infinite; animation-delay: -36s; }
    .cloud-4 { animation: driftMedium 52s linear infinite; animation-delay: -9s; }

    .sun-rays {
      transform-origin: 138px 108px;
      animation: sunSpin 52s linear infinite;
    }
    .sun-face-group {
      transform-origin: 138px 108px;
      animation: sunPulse 4.2s ease-in-out infinite;
    }

    .sway-tree {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: treeSway 6.4s ease-in-out infinite;
    }
    .sway-tree.alt {
      animation-duration: 7.7s;
      animation-delay: -2.4s;
    }

    .bg-flower {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: flowerBob 3.6s ease-in-out infinite;
    }
    .bg-flower.alt {
      animation-duration: 4.4s;
      animation-delay: -1.5s;
    }

    .bf-1 { animation: butterflyPath1 26s ease-in-out infinite; }
    .bf-2 { animation: butterflyPath2 31s ease-in-out infinite; animation-delay: -10s; }
    .bf-3 { animation: butterflyPath3 24s ease-in-out infinite; animation-delay: -6s; }

    .bf-wings {
      transform-box: fill-box;
      transform-origin: center;
      animation: wingFlap 0.23s ease-in-out infinite;
    }

    /* ============================================================
       TOP-RIGHT MINIMALIST CARVED WOOD CONTROLS (ONLY 2 BUTTONS)
       ============================================================ */
    #top-controls {
      position: absolute;
      top: clamp(12px, 2vh, 24px);
      right: clamp(14px, 2vw, 28px);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: clamp(12px, 1.5vw, 20px);
    }

    .wood-btn {
      position: relative;
      width: clamp(54px, 7vh, 78px);
      height: clamp(54px, 7vh, 78px);
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      outline: none;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
      filter: drop-shadow(0 5px 6px rgba(45, 25, 10, 0.36));
    }

    .wood-btn:hover {
      transform: scale(1.1) translateY(-2px);
      filter: drop-shadow(0 8px 10px rgba(45, 25, 10, 0.42));
    }

    .wood-btn:active {
      transform: scale(0.92) translateY(2px);
    }

    .wood-btn svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ============================================================
       PLAYFIELD: TOP ~60% (3 LARGE HOUSES) + BOTTOM ~35% (1 ANIMAL)
       ============================================================ */
    #playfield {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(8px, 1.5vh, 18px) clamp(18px, 4vw, 64px) clamp(10px, 2vh, 24px);
      transition: opacity 0.4s ease, transform 0.46s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #playfield.round-transition-out {
      opacity: 0;
      transform: scale(0.95) translateY(14px);
    }

    #playfield.round-transition-in {
      animation: roundEnter 0.54s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes roundEnter {
      0%   { opacity: 0; transform: scale(0.94) translateY(14px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ---- TOP ~60%: 3 EXTRA-LARGE FAIRY-TALE HOUSES ---- */
    #houses-row {
      flex: 0 0 60%;
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: clamp(12px, 2.5vw, 42px);
      padding-bottom: clamp(4px, 1vh, 12px);
    }

    .house-slot {
      position: relative;
      flex: 0 1 31%;
      min-width: 190px;
      max-width: 430px;
      height: clamp(235px, 56vh, 520px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.24s ease;
      filter: drop-shadow(0 12px 12px rgba(32, 58, 20, 0.3));
    }

    .house-slot:not(.settled):hover,
    .house-slot.drop-hover {
      transform: scale(1.06) translateY(-7px);
      filter: drop-shadow(0 0 24px rgba(255, 224, 96, 0.96)) drop-shadow(0 14px 14px rgba(32, 58, 20, 0.32));
    }

    .house-slot:not(.settled):hover .door-leaf,
    .house-slot.drop-hover .door-leaf {
      transform: scaleX(0.45);
    }

    .house-slot:not(.settled):hover .door-glow,
    .house-slot.drop-hover .door-glow {
      opacity: 1;
    }

    .house-slot.settled {
      cursor: default;
    }

    .house-slot.settled .house-flowers {
      animation: bloomBounce 0.72s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .house-slot.celebrate-bounce {
      animation: houseCelebrate 0.8s ease-in-out infinite;
    }

    .house-slot.wrong-wobble {
      animation: houseWobble 0.55s ease-in-out;
    }

    .house-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .door-leaf {
      transform-box: fill-box;
      transform-origin: left center;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .house-slot.door-open .door-leaf {
      transform: scaleX(0.1);
    }

    .door-glow {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .house-slot.door-open .door-glow {
      opacity: 1;
    }

    /* Chimney smoke puffs */
    @keyframes smokeRise {
      0%   { transform: translate(0, 0) scale(0.45); opacity: 0; }
      20%  { opacity: 0.9; }
      80%  { opacity: 0.62; }
      100% { transform: translate(20px, -50px) scale(1.42); opacity: 0; }
    }

    .smoke-puff-1 { transform-box: fill-box; transform-origin: center; animation: smokeRise 2.6s ease-out infinite; }
    .smoke-puff-2 { transform-box: fill-box; transform-origin: center; animation: smokeRise 2.6s ease-out infinite 0.85s; }
    .smoke-puff-3 { transform-box: fill-box; transform-origin: center; animation: smokeRise 2.6s ease-out infinite 1.7s; }

    /* Wooden Window Shutters (Swing Wide Open on Settle) */
    .shutter-left {
      transform-box: fill-box;
      transform-origin: left center;
      transition: transform 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .shutter-right {
      transform-box: fill-box;
      transform-origin: right center;
      transition: transform 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .house-slot:not(.settled):hover .shutter-left,
    .house-slot.drop-hover .shutter-left {
      transform: scaleX(0.68);
    }

    .house-slot:not(.settled):hover .shutter-right,
    .house-slot.drop-hover .shutter-right {
      transform: scaleX(0.68);
    }

    .house-slot.settled .shutter-left {
      transform: scaleX(-0.82);
    }

    .house-slot.settled .shutter-right {
      transform: scaleX(-0.82);
    }

    .window-warm-bg {
      opacity: 0.25;
      transition: opacity 0.4s ease;
    }

    .house-slot.settled .window-warm-bg {
      opacity: 1;
    }

    /* Window Peek Happy Animal (Perfectly Framed Inside Window) */
    .window-animal-group {
      transform-box: fill-box;
      transform-origin: bottom center;
      opacity: 0;
      transform: translateY(28px) scale(0.75);
      transition: opacity 0.32s ease, transform 0.46s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .window-animal-group.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      animation: peekWave 2.4s ease-in-out infinite 0.48s;
    }

    .window-paws-group {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(0.5);
      transition: opacity 0.3s ease 0.14s, transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) 0.14s;
    }

    .window-paws-group.visible {
      opacity: 1;
      transform: scale(1);
    }

    .house-slot.celebrate-bounce .window-animal-group.visible {
      animation: peekCelebrate 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    @keyframes peekWave {
      0%, 100% { transform: translateY(0) rotate(-2.2deg); }
      50%      { transform: translateY(-3px) rotate(2.6deg); }
    }

    @keyframes peekCelebrate {
      0%, 100% { transform: translateY(0) scale(1) rotate(-4deg); }
      50%      { transform: translateY(-6px) scale(1.05) rotate(4deg); }
    }

    @keyframes houseWobble {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      18%      { transform: translateX(-11px) rotate(-4deg); }
      38%      { transform: translateX(11px) rotate(4deg); }
      58%      { transform: translateX(-8px) rotate(-2.8deg); }
      78%      { transform: translateX(6px) rotate(2deg); }
    }

    @keyframes bloomBounce {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.32) translateY(-7px); }
      100% { transform: scale(1); }
    }

    @keyframes houseCelebrate {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-9px) scale(1.03); }
    }

    /* ---- BOTTOM ~35%: SINGLE LARGE ANIMAL + LARGE WOODEN CLUE SIGNBOARD ---- */
    #active-stage {
      flex: 0 0 36%;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: clamp(4px, 1vh, 14px);
    }

    .active-duo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3.2vw, 48px);
      animation: animalEnterPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes animalEnterPop {
      0%   { opacity: 0; transform: translateY(34px) scale(0.75); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Large Interactive Animal Actor (130-185px) */
    .animal-actor {
      position: relative;
      width: clamp(128px, 21vh, 195px);
      height: clamp(128px, 21vh, 195px);
      flex-shrink: 0;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      filter: drop-shadow(0 10px 9px rgba(32, 58, 18, 0.34));
    }

    .animal-actor:hover {
      transform: scale(1.08) translateY(-6px);
    }

    .animal-actor:hover .animal-body-anim {
      animation: excitedHop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    .animal-actor.is-dragging {
      opacity: 0.2;
      transform: scale(0.88);
      cursor: grabbing;
    }

    .animal-actor.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .animal-actor.head-shake {
      animation: animalHeadShake 0.58s ease-in-out;
    }

    .animal-actor svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Warm sunny glow cushion beneath active animal */
    .animal-cushion {
      position: absolute;
      bottom: 3%;
      left: 50%;
      width: 88%;
      height: 24%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 240, 145, 0.72) 0%, rgba(255, 210, 75, 0.3) 55%, rgba(255, 210, 75, 0) 78%);
      pointer-events: none;
    }

    /* Extra-Large Carved Wooden Signboard Plaque (Medallions ~100-130px) */
    .clue-plaque {
      position: relative;
      height: clamp(124px, 21vh, 186px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 10px 10px rgba(45, 26, 8, 0.36));
      transition: transform 0.25s ease;
    }

    .clue-plaque.one-clue {
      width: clamp(148px, 22vw, 220px);
    }

    .clue-plaque.two-clues {
      width: clamp(264px, 36vw, 415px);
    }

    .clue-plaque svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Conflicting Clue Medallion Bright Pulse & Hop Hint */
    @keyframes conflictPulse {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 0 rgba(255, 200, 0, 0));
      }
      25% {
        transform: translateY(-10px) scale(1.22);
        filter: drop-shadow(0 0 20px rgba(255, 215, 0, 1)) drop-shadow(0 0 14px rgba(239, 68, 68, 0.95));
      }
      50% {
        transform: translateY(0) scale(1.05);
        filter: drop-shadow(0 0 8px rgba(255, 165, 0, 0.85));
      }
      75% {
        transform: translateY(-8px) scale(1.2);
        filter: drop-shadow(0 0 22px rgba(255, 215, 0, 1)) drop-shadow(0 0 14px rgba(239, 68, 68, 0.95));
      }
    }

    .clue-badge-group {
      transform-box: fill-box;
      transform-origin: center;
    }

    .clue-badge-group.conflict-hint {
      animation: conflictPulse 0.88s ease-in-out 2;
    }

    /* Animal Living Animations */
    @keyframes idleBreathe {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50%      { transform: translateY(-5px) scale(1.025, 0.975); }
    }

    @keyframes excitedHop {
      0%, 100% { transform: translateY(0) scale(1.04, 0.94); }
      45%      { transform: translateY(-16px) scale(0.96, 1.06); }
    }

    @keyframes animalHeadShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      18%      { transform: translateX(-12px) rotate(-11deg); }
      38%      { transform: translateX(12px) rotate(11deg); }
      58%      { transform: translateX(-9px) rotate(-8deg); }
      78%      { transform: translateX(7px) rotate(6deg); }
    }

    @keyframes blinkEyes {
      0%, 92%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(0.08); }
    }

    @keyframes tailWag {
      0%, 100% { transform: rotate(-8deg); }
      50%      { transform: rotate(10deg); }
    }

    @keyframes earWiggle {
      0%, 82%, 100% { transform: rotate(0deg); }
      88%           { transform: rotate(-10deg); }
      94%           { transform: rotate(8deg); }
    }

    .animal-body-anim {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: idleBreathe 2.5s ease-in-out infinite;
    }

    .animal-eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: blinkEyes 4.2s ease-in-out infinite;
    }

    .animal-tail {
      transform-box: fill-box;
      transform-origin: bottom left;
      animation: tailWag 1.7s ease-in-out infinite;
    }

    .animal-ear {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: earWiggle 3.6s ease-in-out infinite;
    }

    /* ============================================================
       FLOATING DRAG / HOP GHOST & PARTICLE FX LAYERS
       ============================================================ */
    #drag-layer {
      position: fixed;
      inset: 0;
      z-index: 80;
      pointer-events: none;
    }

    .drag-ghost {
      position: fixed;
      width: clamp(132px, 21vh, 195px);
      height: clamp(132px, 21vh, 195px);
      transform: translate(-50%, -50%) scale(1.1);
      filter: drop-shadow(0 18px 16px rgba(35, 25, 10, 0.36));
      will-change: left, top, transform;
    }

    .drag-ghost svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #fx-layer {
      position: fixed;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      overflow: hidden;
    }

    .fx-particle {
      position: absolute;
      will-change: transform, opacity;
      pointer-events: none;
    }

    /* Responsive adjustments for smaller tablets / shorter viewports */
    @media (max-height: 620px) {
      .house-slot { height: clamp(190px, 54vh, 330px); }
      .animal-actor { width: clamp(102px, 20vh, 138px); height: clamp(102px, 20vh, 138px); }
      .clue-plaque { height: clamp(92px, 19vh, 128px); }
    }

    @media (max-width: 760px) {
      #playfield { padding: 8px 10px 10px; }
      .house-slot { min-width: 105px; }
      .active-duo { gap: 12px; }
      .clue-plaque.one-clue { width: clamp(120px, 32vw, 175px); }
      .clue-plaque.two-clues { width: clamp(200px, 54vw, 300px); }
    }
  </style>
</head>
<body>
  <div id="game-stage">
    <!-- ============================================================
         SCENIC LIVING WOODLAND MEADOW BACKGROUND (16:9 SVG)
         ============================================================ -->
    <svg id="scene-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop id="sky-stop-1" offset="0%" stop-color="#53c2ff" />
          <stop id="sky-stop-2" offset="56%" stop-color="#a6e3ff" />
          <stop id="sky-stop-3" offset="100%" stop-color="#e8f9d2" />
        </linearGradient>

        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff9b8" stop-opacity="0.95" />
          <stop offset="48%" stop-color="#ffe066" stop-opacity="0.45" />
          <stop offset="100%" stop-color="#ffe066" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="farHillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop id="far-hill-1" offset="0%" stop-color="#84d270" />
          <stop id="far-hill-2" offset="100%" stop-color="#58b050" />
        </linearGradient>

        <linearGradient id="midHillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop id="mid-hill-1" offset="0%" stop-color="#73c859" />
          <stop id="mid-hill-2" offset="100%" stop-color="#499e3c" />
        </linearGradient>

        <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
          <stop id="meadow-1" offset="0%" stop-color="#84d459" />
          <stop id="meadow-2" offset="52%" stop-color="#68be47" />
          <stop id="meadow-3" offset="100%" stop-color="#4a9932" />
        </linearGradient>

        <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f0d9a8" />
          <stop offset="100%" stop-color="#d2af72" />
        </linearGradient>

        <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7a4c2a" />
          <stop offset="55%" stop-color="#966238" />
          <stop offset="100%" stop-color="#643c1f" />
        </linearGradient>

        <!-- Fluffy Cloud -->
        <g id="fluffy-cloud">
          <ellipse cx="68" cy="48" rx="44" ry="24" fill="#ffffff" opacity="0.93" />
          <ellipse cx="114" cy="42" rx="52" ry="30" fill="#ffffff" opacity="0.96" />
          <ellipse cx="164" cy="50" rx="40" ry="22" fill="#ffffff" opacity="0.92" />
          <ellipse cx="114" cy="55" rx="76" ry="18" fill="#f3f9ff" opacity="0.88" />
        </g>

        <!-- Storybook Tree -->

  <script>
    (function () {
      'use strict';

      /* ============================================================
         1. CONSTANTS, PALETTES & SKY THEMES
         ============================================================ */
      const COLORS = ['red', 'blue', 'yellow', 'green'];
      const HEIGHTS = ['tall', 'short'];
      const ROOFS = ['pointy', 'round'];
      const CHIMNEYS = [true, false];
      const ANIMAL_TYPES = ['fox', 'bunny', 'bear', 'hedgehog', 'squirrel', 'kitten', 'puppy', 'owl'];

      const ANIMAL_PAW_COLOR = {
        fox: '#4a2410',
        bunny: '#f7efe4',
        bear: '#824e24',
        hedgehog: '#a87954',
        squirrel: '#c96b2c',
        kitten: '#fff5e0',
        puppy: '#d49b57',
        owl: '#f4a825'
      };

      const COLOR_PALETTE = {
        red:    { main: '#eb4d4b', dark: '#b82d2b', light: '#ff7979', trim: '#fff6e5' },
        blue:   { main: '#2e9df7', dark: '#1a6eb3', light: '#6ec3ff', trim: '#fff8eb' },
        yellow: { main: '#f6c927', dark: '#c7990d', light: '#ffe570', trim: '#fffaf0' },
        green:  { main: '#52c44d', dark: '#318a2d', light: '#88e084', trim: '#fff9eb' }
      };

      const SKY_THEMES = [
        // Bright Spring Morning
        {
          sky: ['#53c2ff', '#a6e3ff', '#e8f9d2'],
          far: ['#84d270', '#58b050'],
          mid: ['#73c859', '#499e3c'],
          meadow: ['#84d459', '#68be47', '#4a9932']
        },
        // Sunny Clear Midday
        {
          sky: ['#3db2f5', '#8ad5ff', '#ddf5e0'],
          far: ['#7bcf78', '#52ab55'],
          mid: ['#6ac45c', '#43963c'],
          meadow: ['#7cd15a', '#61ba45', '#469431']
        },
        // Warm Honey Afternoon
        {
          sky: ['#66b7f0', '#b7e0d6', '#fff0b8'],
          far: ['#96cf68', '#68ab48'],
          mid: ['#84c450', '#589c36'],
          meadow: ['#92cf54', '#76ba42', '#56992e']
        },
        // Gentle Peach Sunset
        {
          sky: ['#789ee8', '#f5b895', '#ffe7aa'],
          far: ['#9ac76a', '#6da14c'],
          mid: ['#85ba54', '#598f38'],
          meadow: ['#8ec756', '#72b042', '#528c30']
        }
      ];

      /* ============================================================
         2. WEB AUDIO API SOUND ENGINE (MULTIPLE CHEERFUL MELODIES)
         ============================================================ */
      const SoundFX = {
        ctx: null,
        muted: false,
        melodyCounter: 0,

        ensureCtx() {
          if (this.muted) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        },

        playTone(freq, startOffset, duration, type = 'sine', volume = 0.16, slideTo = null) {
          const ctx = this.ensureCtx();
          if (!ctx) return;
          try {
            const now = ctx.currentTime + startOffset;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo) {
              osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
            }
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.018);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.025);
          } catch (_) {}
        },

        playPickup() {
          this.playTone(410, 0, 0.09, 'triangle', 0.14, 590);
        },

        playNext() {
          this.playTone(440, 0, 0.08, 'triangle', 0.13, 600);
          this.playTone(660, 0.06, 0.12, 'sine', 0.12, 760);
        },

        playCorrect(animalType) {
          // 4 distinct joyful melodies cycled each correct settle
          const melodies = [
            [523.25, 659.25, 783.99, 1046.5],
            [587.33, 739.99, 880.00, 1174.66],
            [523.25, 587.33, 783.99, 987.77],
            [659.25, 783.99, 987.77, 1318.51]
          ];
          const notes = melodies[this.melodyCounter++ % melodies.length];
          notes.forEach((n, idx) => {
            this.playTone(n, idx * 0.072, 0.24, 'triangle', 0.15);
            this.playTone(n * 2, idx * 0.072, 0.16, 'sine', 0.045);
          });

          // Playful animal-flavored synth chirp
          if (animalType === 'owl') {
            this.playTone(620, 0.26, 0.13, 'sine', 0.11, 470);
            this.playTone(540, 0.41, 0.15, 'sine', 0.11, 420);
          } else if (animalType === 'bear') {
            this.playTone(255, 0.25, 0.18, 'triangle', 0.14, 340);
          } else {
            this.playTone(720, 0.25, 0.12, 'sine', 0.11, 960);
          }
        },

        playWrong() {
          // Comical bouncy spring sound
          this.playTone(230, 0.00, 0.12, 'triangle', 0.18, 135);
          this.playTone(155, 0.10, 0.14, 'sine', 0.16, 265);
          this.playTone(245, 0.22, 0.18, 'triangle', 0.15, 130);
        },

        playWin() {
          const fanfare = [
            { f: 523.25, t: 0.00, d: 0.17 },
            { f: 659.25, t: 0.11, d: 0.17 },
            { f: 783.99, t: 0.22, d: 0.17 },
            { f: 1046.5, t: 0.34, d: 0.34 },
            { f: 880.00, t: 0.50, d: 0.16 },
            { f: 1046.5, t: 0.64, d: 0.58 }
          ];
          fanfare.forEach((m) => {
            this.playTone(m.f, m.t, m.d, 'triangle', 0.16);
            this.playTone(m.f * 2, m.t, m.d * 0.72, 'sine', 0.055);
          });
        }
      };

      /* ============================================================
         3. UTILITY & LOGIC MATCHING HELPERS
         ============================================================ */
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function houseSignature(h) {
        return `${h.color[0]}${h.height[0]}${h.roof[0]}${h.chimney ? '1' : '0'}`;
      }

      function tripletSignature(houses) {
        return houses.map(houseSignature).sort().join('|');
      }

      function matchesClue(house, clue) {
        let base = false;
        if (clue.attr === 'color') base = house.color === clue.value;
        else if (clue.attr === 'height') base = house.height === clue.value;
        else if (clue.attr === 'roof') base = house.roof === clue.value;
        else if (clue.attr === 'chimney') base = house.chimney === true;
        return clue.negated ? !base : base;
      }

      function matchesAllClues(house, clues) {
        return clues.every((c) => matchesClue(house, c));
      }

      /* ============================================================
         4. 35+ GUARANTEED UNIQUE 3-HOUSE COMBINATIONS + INFINITE GEN
         ============================================================ */
      const ALL_HOUSES = [];
      for (const color of COLORS) {
        for (const height of HEIGHTS) {
          for (const roof of ROOFS) {
            for (const chimney of CHIMNEYS) {
              ALL_HOUSES.push({ color, height, roof, chimney });
            }
          }
        }
      }

      function getSatisfiedCluesForHouse(house, allowedAttrs) {
        const list = [];
        if (allowedAttrs.includes('color')) {
          list.push({ attr: 'color', value: house.color, negated: false });
          for (const c of COLORS) {
            if (c !== house.color) {
              list.push({ attr: 'color', value: c, negated: true });
            }
          }
        }
        if (allowedAttrs.includes('height')) {
          list.push({ attr: 'height', value: house.height, negated: false });
          list.push({ attr: 'height', value: house.height === 'tall' ? 'short' : 'tall', negated: true });
        }
        if (allowedAttrs.includes('roof')) {
          list.push({ attr: 'roof', value: house.roof, negated: false });
          list.push({ attr: 'roof', value: house.roof === 'pointy' ? 'round' : 'pointy', negated: true });
        }
        if (allowedAttrs.includes('chimney')) {
          list.push({ attr: 'chimney', value: true, negated: !house.chimney });
        }
        return list;
      }

      function isCleanClueCombo(combo) {
        const attrCounts = {};
        let hasPosColor = false;
        let negColorCount = 0;
        const seenColorVals = new Set();

        for (const c of combo) {
          attrCounts[c.attr] = (attrCounts[c.attr] || 0) + 1;
          if (c.attr === 'color') {
            if (seenColorVals.has(c.value)) return false;
            seenColorVals.add(c.value);
            if (c.negated) negColorCount++;
            else hasPosColor = true;
          } else {
            if (attrCounts[c.attr] > 1) return false;
          }
        }
        // Avoid redundant "red AND not blue"
        if (hasPosColor && negColorCount > 0) return false;
        if (negColorCount > 2) return false;
        return true;
      }

      // STRICT GROUNDED CHECK:
      // - Negative clue ("NOT X") is valid ONLY IF at least one other house on screen HAS feature X.
      // - Positive clue ("IS X") is valid ONLY IF at least one other house on screen LACKS feature X.
      function isGroundedClue(clue, targetHouse, houses) {
        if (!matchesClue(targetHouse, clue)) return false;
        return houses.some((h) => h.id !== targetHouse.id && !matchesClue(h, clue));
      }

      // STRICT MINIMAL & GROUNDED CLUE FINDER:
      // - 1-clue set: uniquely identifies targetHouse alone (eliminates both other houses).
      // - 2-clue set: C1 alone matches EXACTLY 2 houses (target + O1), C2 alone matches EXACTLY 2 houses (target + O2),
      //   and ONLY together they uniquely identify targetHouse! Zero redundant or ungrounded clues!
      function findMinimalGroundedClueSets(targetHouse, houses, allowedAttrs, preferredStyle) {
        const singleClues = getSatisfiedCluesForHouse(targetHouse, allowedAttrs)
          .filter((c) => isGroundedClue(c, targetHouse, houses));

        const results = [];

        // 1. Minimal 1-clue negations (e.g., 2 tall & 1 short -> red frame "tall")
        for (const c of singleClues) {
          const matched = houses.filter((h) => matchesClue(h, c));
          if (matched.length === 1 && matched[0].id === targetHouse.id && c.negated) {
            let score = 28;
            if (preferredStyle === 'singleNot') score += 45;
            results.push({ clues: [c], score });
          }
        }

        // 2. Minimal 2-clue combinations with at least 1 negation
        for (let i = 0; i < singleClues.length; i++) {
          const c1 = singleClues[i];
          const m1 = houses.filter((h) => matchesClue(h, c1));
          if (m1.length !== 2) continue;

          for (let j = i + 1; j < singleClues.length; j++) {
            const c2 = singleClues[j];
            if (!isCleanClueCombo([c1, c2])) continue;

            const negCount = (c1.negated ? 1 : 0) + (c2.negated ? 1 : 0);
            if (negCount < 1) continue;

            const m2 = houses.filter((h) => matchesClue(h, c2));
            if (m2.length !== 2) continue;

            const both = houses.filter((h) => matchesClue(h, c1) && matchesClue(h, c2));
            if (both.length !== 1 || both[0].id !== targetHouse.id) continue;

            const negColorCount =
              (c1.attr === 'color' && c1.negated ? 1 : 0) +
              (c2.attr === 'color' && c2.negated ? 1 : 0);

            let score = 62;
            if (preferredStyle === 'notAndYes' && negCount === 1) score += 30;
            if (preferredStyle === 'yesAndNot' && negCount === 1) score += 30;
            if (preferredStyle === 'doubleNot' && negCount === 2) score += 36;
            if (preferredStyle === 'doubleNotColor' && negColorCount === 2) score += 42;

            let ordered = [c1, c2];
            if (preferredStyle === 'yesAndNot') {
              ordered.sort((a, b) => Number(a.negated) - Number(b.negated));
            } else if (preferredStyle === 'notAndYes') {
              ordered.sort((a, b) => Number(b.negated) - Number(a.negated));
            } else {
              ordered = shuffle(ordered);
            }

            results.push({ clues: ordered, score });
          }
        }

        return results;
      }

      // Track all used 3-house triplet signatures so every round is guaranteed UNIQUE!
      const usedTripletSignatures = new Set();

      // 36 Curated Progression Recipes (guaranteed >= 32 unique 3-house rounds, then infinite!)
      const CURATED_RECIPES = [
        // Stage 1 (Rounds 1–8): Clear Color + Height, Color + Roof, Color + Chimney
        { attrs: ['color', 'height'], styles: ['yesAndNot', 'notAndYes', 'doubleNot'] },
        { attrs: ['color', 'height'], styles: ['doubleNot', 'yesAndNot', 'singleNot'] },
        { attrs: ['color', 'roof'],   styles: ['yesAndNot', 'doubleNot', 'notAndYes'] },

        { attrs: ['color', 'height', 'roof', 'chimney'], styles: ['doubleNot', 'notAndYes', 'doubleNot'] },

        { attrs: ['color', 'height', 'roof', 'chimney'], styles: ['doubleNot', 'doubleNot', 'singleNot'] },

        { attrs: ['color', 'height', 'roof', 'chimney'], styles: ['doubleNot', 'notAndYes', 'yesAndNot'] },
        { attrs: ['color', 'height', 'roof', 'chimney'], styles: ['yesAndNot', 'doubleNot', 'doubleNot'] }
      ];

      function generateUniqueRound(roundIndex) {
        const recipe = roundIndex < CURATED_RECIPES.length
          ? CURATED_RECIPES[roundIndex]
          : {
              attrs: ['color', 'height', 'roof', 'chimney'],
              styles: shuffle(['notAndYes', 'yesAndNot', 'doubleNot', 'doubleNotColor', 'singleNot']).slice(0, 3)
            };

        if (usedTripletSignatures.size > 4000) {
          usedTripletSignatures.clear();
        }

        for (let attempt = 0; attempt < 260; attempt++) {
          const pool = shuffle(ALL_HOUSES);
          const picked = pool.slice(0, 3);
          const sig = tripletSignature(picked);
          if (usedTripletSignatures.has(sig)) continue;

          // Ensure nice visual diversity across the 3 houses
          const uniqueColors = new Set(picked.map((h) => h.color)).size;
          if (uniqueColors < 2) continue;
          if (recipe.attrs.includes('height') && new Set(picked.map((h) => h.height)).size < 2) continue;

          const houses = picked.map((h, i) => ({ ...h, id: `h-${i}` }));
          const animalOrder = shuffle(houses);
          const animalTypes = shuffle(ANIMAL_TYPES).slice(0, 3);

          const animals = [];
          let validAll3 = true;

          for (let i = 0; i < 3; i++) {
            const target = animalOrder[i];
            const stylePref = recipe.styles[i % recipe.styles.length];

            let candidates = findMinimalGroundedClueSets(target, houses, recipe.attrs, stylePref);
            if (candidates.length === 0) {
              candidates = findMinimalGroundedClueSets(target, houses, ['color', 'height', 'roof', 'chimney'], 'doubleNot');
            }
            if (candidates.length === 0) {
              validAll3 = false;
              break;
            }

            candidates.sort((a, b) => (b.score + Math.random() * 7) - (a.score + Math.random() * 7));
            const chosen = candidates[0];

            animals.push({
              id: `a-${i}`,
              animalType: animalTypes[i],
              targetHouseId: target.id,
              clues: chosen.clues,
              settled: false
            });
          }

          if (validAll3) {
            // Strict mathematical verification:
            // 1. Unique match for every animal
            // 2. Every clue is grounded (eliminates >= 1 real house on screen)
            // 3. Every clue set is minimal
            const verified = animals.every((an) => {
              const target = houses.find((h) => h.id === an.targetHouseId);
              const matches = houses.filter((h) => matchesAllClues(h, an.clues));
              if (matches.length !== 1 || matches[0].id !== an.targetHouseId) return false;
              return an.clues.every((c) => isGroundedClue(c, target, houses));
            });

            if (verified) {
              usedTripletSignatures.add(sig);
              return {
                houses: shuffle(houses),
                animals
              };
            }
          }
        }

        // Ultra-safe deterministic grounded & minimal fallback
        const fbHouses = [
          { id: 'h-0', color: 'red',  height: 'short', roof: 'pointy', chimney: true },
          { id: 'h-1', color: 'red',  height: 'tall',  roof: 'round',  chimney: false },
          { id: 'h-2', color: 'blue', height: 'tall',  roof: 'pointy', chimney: true }
        ];
        return {
          houses: fbHouses,
          animals: [
            {
              id: 'a-0',
              animalType: 'fox',
              targetHouseId: 'h-0',
              clues: [
                { attr: 'color', value: 'red', negated: false },
                { attr: 'roof', value: 'round', negated: true }
              ],
              settled: false
            },
            {
              id: 'a-1',
              animalType: 'bunny',
              targetHouseId: 'h-1',
              clues: [
                { attr: 'color', value: 'blue', negated: true },
                { attr: 'height', value: 'short', negated: true }
              ],
              settled: false
            },
            {
              id: 'a-2',
              animalType: 'bear',
              targetHouseId: 'h-2',
              clues: [
                { attr: 'color', value: 'red', negated: true }
              ],
              settled: false
            }
          ]
        };
      }

      // ---- Large Carved Wooden Signboard Plaque (GREEN = YES + ✓, RED = NO + ✕, ZERO OVERLAP!) ----
      function createCluePlaqueSVG(animal) {
        const count = animal.clues.length;
        const viewW = count === 1 ? 186 : 312;
        const viewH = 160;
        const boardX = 14;
        const boardW = viewW - 28;
        const centers = count === 1 ? [93] : [97, 215];

        const badgesSVG = animal.clues.map((clue, idx) => {
          const cx = centers[idx];
          const cy = 80;
          const isNeg = clue.negated;
          const frameMain = isNeg ? '#ef4444' : '#22c55e';
          const frameDark = isNeg ? '#b91c1c' : '#15803d';
          const frameGlow = isNeg ? 'rgba(239, 68, 68, 0.36)' : 'rgba(34, 197, 94, 0.36)';
          const badgeFill = isNeg ? '#dc2626' : '#16a34a';

          const cornerMark = isNeg
            ? `<line x1="-5" y1="-5" x2="5" y2="5" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" />
               <line x1="5" y1="-5" x2="-5" y2="5" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" />`
            : `<polyline points="-6,0.5 -1.5,5 6.5,-4.5" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />`;

          return `
            <g class="clue-badge-group" data-animal="${animal.id}" data-clue-idx="${idx}" transform="translate(${cx}, ${cy})">
              <!-- Soft Colored Outer Halo -->
              <circle cx="0" cy="0" r="52" fill="${frameGlow}" />
              <!-- Thick 3D Colored Frame Ring (Green = YES, Red = NO) -->
              <circle cx="0" cy="0" r="47" fill="${frameMain}" stroke="${frameDark}" stroke-width="4" />
              <!-- Soft Cream-Parchment Interior (100% Clean & Unobstructed Icon) -->
              <circle cx="0" cy="0" r="37.5" fill="#fdf5e2" stroke="${frameDark}" stroke-width="2" />
              <!-- Crisp Centered Visual Icon -->
              ${createClueIconInner(clue)}
              <!-- Small Neat Status Badge on Top-Right Edge of Rim (Does NOT cover icon!) -->
              <g transform="translate(34, -34)">
                <circle cx="0" cy="0" r="14" fill="${badgeFill}" stroke="#ffffff" stroke-width="3" />
                ${cornerMark}
              </g>
            </g>
          `;
        }).join('');

        return `
          <svg viewBox="0 0 ${viewW} ${viewH}" aria-hidden="true">
            <defs>
              <linearGradient id="plaqueWood-${animal.id}" x1="0" y1="0" x2="0" y2="1">

                <stop offset="50%" stop-color="#ab6b33" />

            <ellipse cx="${viewW - 18}" cy="134" rx="16" ry="8" transform="rotate(30 ${viewW - 18} 134)" fill="#58b947" stroke="#2f6e23" stroke-width="2.4" />
            <ellipse cx="${viewW - 34}" cy="144" rx="12" ry="6" transform="rotate(8 ${viewW - 34} 144)" fill="#74cf5e" stroke="#2f6e23" stroke-width="2.2" />

            <!-- Carved Organic Wooden Signboard -->
            <rect x="${boardX}" y="14" width="${boardW}" height="132" rx="32" fill="url(#plaqueWood-${animal.id})" stroke="#542e12" stroke-width="5" />
            <path d="M${boardX + 26},30 Q${viewW / 2},21 ${boardX + boardW - 26},31" fill="none" stroke="#7d481e" stroke-width="2.6" opacity="0.45" />
            <path d="M${boardX + 24},130 Q${viewW / 2},139 ${boardX + boardW - 24},129" fill="none" stroke="#7d481e" stroke-width="2.6" opacity="0.45" />

            <circle cx="${boardX + boardW - 16}" cy="30" r="4.4" fill="#ffd166" stroke="#542e12" stroke-width="2" />

            <circle cx="${boardX + boardW - 16}" cy="130" r="4.4" fill="#ffd166" stroke="#542e12" stroke-width="2" />

            <!-- Cute Pink Flower Accent -->

      /* ============================================================
         6. VARIED PARTICLE & CELEBRATION FX ENGINE (PURE SVG)
         ============================================================ */
      const fxLayer = document.getElementById('fx-layer');
      let burstThemeCounter = 0;

      function spawnBurst(x, y, count = 22) {
        const mode = burstThemeCounter++ % 3;
        const heartSVG = (c) => `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12,21 C12,21 3,14.5 3,8.5 C3,5.2 5.5,3 8.3,3 C10,3 11.4,4 12,5.3 C12.6,4 14,3 15.7,3 C18.5,3 21,5.2 21,8.5 C21,14.5 12,21 12,21 Z" fill="${c}" stroke="#fff" stroke-width="1.3"/></svg>`;
        const starSVG  = (c) => `<svg width="26" height="26" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16.5,14 18.5,21 12,17 5.5,21 7.5,14 2,9 9,9" fill="${c}" stroke="#fff" stroke-width="1.3"/></svg>`;
        const flowerSVG = (c) => `<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="6" r="4.5" fill="${c}"/><circle cx="18" cy="11" r="4.5" fill="${c}"/><circle cx="6" cy="11" r="4.5" fill="${c}"/><circle cx="15" cy="17" r="4.5" fill="${c}"/><circle cx="9" cy="17" r="4.5" fill="${c}"/><circle cx="12" cy="12" r="4" fill="#ffe066"/></svg>`;

        const colors = mode === 0
          ? ['#ff4d6d', '#ff7aa2', '#ffca3a', '#ffffff']
          : mode === 1
            ? ['#ffd166', '#ff9f1c', '#fff3b0', '#70d6ff']
            : ['#ff7aa2', '#8ac926', '#ffca3a', '#68b5ff'];

        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'fx-particle';
          const color = colors[i % colors.length];
          el.innerHTML = mode === 0 ? heartSVG(color) : (mode === 1 ? starSVG(color) : flowerSVG(color));
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          fxLayer.appendChild(el);

          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
          const dist = 75 + Math.random() * 130;
          const dx = Math.cos(angle) * dist;
          const dy = Math.sin(angle) * dist - 55;
          const rot = (Math.random() - 0.5) * 340;
          const dur = 720 + Math.random() * 400;

          const anim = el.animate([
            { transform: 'translate(-50%, -50%) scale(0.3) rotate(0deg)', opacity: 1 },
            { transform: `translate(calc(-50% + ${dx * 0.65}px), calc(-50% + ${dy * 0.7}px)) scale(1.2) rotate(${rot * 0.6}deg)`, opacity: 1, offset: 0.55 },
            { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 45}px)) scale(0.2) rotate(${rot}deg)`, opacity: 0 }
          ], {
            duration: dur,
            easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)'
          });

          anim.onfinish = () => el.remove();
        }
      }

      function spawnCelebrationShower() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const colors = ['#ff595e', '#ffca3a', '#6cc24a', '#3498db', '#ff7aa2', '#a855f7'];
        const count = 48;

        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'fx-particle';
          const color = colors[i % colors.length];
          const shapeIdx = i % 3;
          if (shapeIdx === 0) {
            el.innerHTML = `<svg width="26" height="26" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 16.5,14 18.5,21 12,17 5.5,21 7.5,14 2,9 9,9" fill="${color}" stroke="#fff" stroke-width="1.2"/></svg>`;
          } else if (shapeIdx === 1) {
            el.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12,21 C12,21 3,14.5 3,8.5 C3,5.2 5.5,3 8.3,3 C10,3 11.4,4 12,5.3 C12.6,4 14,3 15.7,3 C18.5,3 21,5.2 21,8.5 C21,14.5 12,21 12,21 Z" fill="${color}" stroke="#fff" stroke-width="1.2"/></svg>`;
          } else {
            el.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5" fill="${color}" stroke="#fff" stroke-width="1.2"/></svg>`;
          }

          el.style.left = `${Math.random() * w}px`;
          el.style.top = `-32px`;
          fxLayer.appendChild(el);

          const driftX = (Math.random() - 0.5) * 190;
          const rot = (Math.random() - 0.5) * 560;
          const delay = Math.random() * 520;
          const dur = 1550 + Math.random() * 750;

          const anim = el.animate([
            { transform: 'translate(0, 0) scale(0.75) rotate(0deg)', opacity: 1 },
            { transform: `translate(${driftX * 0.5}px, ${h * 0.55}px) scale(1.15) rotate(${rot * 0.5}deg)`, opacity: 1, offset: 0.6 },
            { transform: `translate(${driftX}px, ${h + 44}px) scale(0.6) rotate(${rot}deg)`, opacity: 0 }
          ], {
            duration: dur,
            delay,
            easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
          });

          anim.onfinish = () => el.remove();
        }
      }

      /* ============================================================
         7. SEQUENTIAL GAME STATE & RENDERING
         ============================================================ */
      const housesRow = document.getElementById('houses-row');
      const activeStage = document.getElementById('active-stage');
      const playfield = document.getElementById('playfield');
      const dragLayer = document.getElementById('drag-layer');
      const btnSound = document.getElementById('btn-sound');
      const btnNext = document.getElementById('btn-next');

      let currentRoundIndex = 0;
      let currentPuzzle = null;
      let activeAnimalIdx = 0;
      let isBusy = false;
      let roundCompleteTimer = null;
      let nextAnimalTimer = null;
      let dragState = null;

      function applySkyTheme(index) {
        const theme = SKY_THEMES[index % SKY_THEMES.length];
        document.getElementById('sky-stop-1').setAttribute('stop-color', theme.sky[0]);
        document.getElementById('sky-stop-2').setAttribute('stop-color', theme.sky[1]);
        document.getElementById('sky-stop-3').setAttribute('stop-color', theme.sky[2]);
        document.getElementById('far-hill-1').setAttribute('stop-color', theme.far[0]);
        document.getElementById('far-hill-2').setAttribute('stop-color', theme.far[1]);
        document.getElementById('mid-hill-1').setAttribute('stop-color', theme.mid[0]);
        document.getElementById('mid-hill-2').setAttribute('stop-color', theme.mid[1]);
        document.getElementById('meadow-1').setAttribute('stop-color', theme.meadow[0]);
        document.getElementById('meadow-2').setAttribute('stop-color', theme.meadow[1]);
        document.getElementById('meadow-3').setAttribute('stop-color', theme.meadow[2]);
      }

      function renderControls() {
        btnSound.innerHTML = createSoundButtonSVG(SoundFX.muted);
        btnNext.innerHTML = createNextButtonSVG();
      }

      function clearTimers() {
        if (roundCompleteTimer) { clearTimeout(roundCompleteTimer); roundCompleteTimer = null; }
        if (nextAnimalTimer) { clearTimeout(nextAnimalTimer); nextAnimalTimer = null; }
      }

      function loadRound(index, animateTransition = true) {
        clearTimers();
        cleanupDrag();

        const buildAndShow = () => {
          currentRoundIndex = index;
          currentPuzzle = generateUniqueRound(index);
          activeAnimalIdx = 0;
          applySkyTheme(index);
          renderHouses();
          renderActiveAnimal();

          playfield.classList.remove('round-transition-out');
          playfield.classList.remove('round-transition-in');
          void playfield.offsetWidth;
          playfield.classList.add('round-transition-in');
          isBusy = false;
        };

        if (animateTransition) {
          isBusy = true;
          playfield.classList.add('round-transition-out');
          setTimeout(buildAndShow, 300);
        } else {
          buildAndShow();
        }
      }

      function renderHouses() {
        housesRow.innerHTML = '';
        currentPuzzle.houses.forEach((house) => {
          const slot = document.createElement('div');
          slot.className = 'house-slot';
          slot.dataset.houseId = house.id;
          slot.innerHTML = createHouseSVG(house);
          slot.addEventListener('click', () => onHouseClick(house.id));
          housesRow.appendChild(slot);
        });
      }

      function renderActiveAnimal() {
        activeStage.innerHTML = '';
        const animal = currentPuzzle.animals[activeAnimalIdx];
        if (!animal) return;

        const duo = document.createElement('div');
        duo.className = 'active-duo';

        const actor = document.createElement('div');
        actor.className = 'animal-actor';
        actor.dataset.animalId = animal.id;
        actor.innerHTML = `<div class="animal-cushion"></div>${createAnimalSVG(animal.animalType, false)}`;
        actor.addEventListener('pointerdown', (e) => onAnimalPointerDown(e, animal));

        const plaque = document.createElement('div');
        plaque.className = `clue-plaque ${animal.clues.length === 1 ? 'one-clue' : 'two-clues'}`;
        plaque.innerHTML = createCluePlaqueSVG(animal);

        duo.appendChild(actor);
        duo.appendChild(plaque);
        activeStage.appendChild(duo);
      }

      /* ============================================================
         8. INTERACTION: DIRECT HOUSE CLICK + DRAG-AND-DROP
         ============================================================ */
      function onHouseClick(houseId) {
        if (isBusy) return;
        const animal = currentPuzzle.animals[activeAnimalIdx];
        if (!animal || animal.settled) return;

        const houseEl = document.querySelector(`.house-slot[data-house-id="${houseId}"]`);
        if (!houseEl || houseEl.classList.contains('settled')) return;

        SoundFX.ensureCtx();
        const house = currentPuzzle.houses.find((h) => h.id === houseId);
        const isCorrect = matchesAllClues(house, animal.clues);

        if (isCorrect) {
          // Joyful arc hop from bottom meadow into the chosen house!
          animateHopToHouse(animal, houseId);
        } else {
          // Immediate comical wobble + head shake + conflicting clue pulse
          handleWrongAttempt(animal, house, houseEl, null);
        }
      }

      function onAnimalPointerDown(e, animal) {
        if (isBusy || animal.settled) return;
        e.preventDefault();
        SoundFX.ensureCtx();

        const actorEl = e.currentTarget;
        actorEl.setPointerCapture(e.pointerId);

        dragState = {
          animal,
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          lastX: e.clientX,
          isDragging: false,
          ghostEl: null,
          hoveredHouseId: null,
          actorEl
        };

        actorEl.addEventListener('pointermove', onAnimalPointerMove);
        actorEl.addEventListener('pointerup', onAnimalPointerUp);
        actorEl.addEventListener('pointercancel', onAnimalPointerCancel);
      }

      function onAnimalPointerMove(e) {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;

        if (!dragState.isDragging && Math.hypot(dx, dy) > 8) {
          dragState.isDragging = true;
          SoundFX.playPickup();
          dragState.actorEl.classList.add('is-dragging');

          const ghost = document.createElement('div');
          ghost.className = 'drag-ghost';
          ghost.innerHTML = createAnimalSVG(dragState.animal.animalType, false);
          ghost.style.left = `${e.clientX}px`;
          ghost.style.top = `${e.clientY}px`;
          dragLayer.appendChild(ghost);
          dragState.ghostEl = ghost;
        }

        if (dragState.isDragging && dragState.ghostEl) {
          const vx = Math.max(-18, Math.min(18, (e.clientX - dragState.lastX) * 1.1));
          dragState.lastX = e.clientX;
          dragState.ghostEl.style.left = `${e.clientX}px`;
          dragState.ghostEl.style.top = `${e.clientY}px`;
          dragState.ghostEl.style.transform = `translate(-50%, -50%) scale(1.1) rotate(${vx * 0.65}deg)`;

          const hitHouseId = findHouseAtPoint(e.clientX, e.clientY);
          if (hitHouseId !== dragState.hoveredHouseId) {
            if (dragState.hoveredHouseId) {
              const prev = document.querySelector(`.house-slot[data-house-id="${dragState.hoveredHouseId}"]`);
              if (prev) prev.classList.remove('drop-hover');
            }
            dragState.hoveredHouseId = hitHouseId;
            if (hitHouseId) {
              const curr = document.querySelector(`.house-slot[data-house-id="${hitHouseId}"]`);
              if (curr) curr.classList.add('drop-hover');
            }
          }
        }
      }

      function onAnimalPointerUp(e) {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        const state = dragState;
        cleanupDragListeners(state);

        if (!state.isDragging) {
          // Playful little hop chirp if child taps the animal itself
          SoundFX.playPickup();
          dragState = null;
          return;
        }

        const dropHouseId = findHouseAtPoint(e.clientX, e.clientY);
        if (state.hoveredHouseId) {
          const prev = document.querySelector(`.house-slot[data-house-id="${state.hoveredHouseId}"]`);
          if (prev) prev.classList.remove('drop-hover');
        }

        const ghost = state.ghostEl;
        const actor = state.actorEl;
        const animal = state.animal;
        dragState = null;

        if (dropHouseId) {
          if (ghost) ghost.remove();
          actor.classList.remove('is-dragging');
          const house = currentPuzzle.houses.find((h) => h.id === dropHouseId);
          const houseEl = document.querySelector(`.house-slot[data-house-id="${dropHouseId}"]`);
          if (matchesAllClues(house, animal.clues)) {
            settleAnimalIntoHouse(animal, house, houseEl);
          } else {
            handleWrongAttempt(animal, house, houseEl, { x: e.clientX, y: e.clientY });
          }
        } else {
          // Smoothly hop back to meadow spot
          const rect = actor.getBoundingClientRect();
          const tx = rect.left + rect.width / 2;
          const ty = rect.top + rect.height / 2;
          if (ghost) {
            const anim = ghost.animate([
              { left: `${e.clientX}px`, top: `${e.clientY}px`, transform: 'translate(-50%, -50%) scale(1.06)' },
              { left: `${tx}px`, top: `${ty}px`, transform: 'translate(-50%, -50%) scale(1)' }
            ], { duration: 240, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
            anim.onfinish = () => {
              ghost.remove();
              actor.classList.remove('is-dragging');
            };
          } else {
            actor.classList.remove('is-dragging');
          }
        }
      }

      function onAnimalPointerCancel(e) {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        cleanupDrag();
      }

      function cleanupDragListeners(state) {
        if (!state || !state.actorEl) return;
        state.actorEl.removeEventListener('pointermove', onAnimalPointerMove);
        state.actorEl.removeEventListener('pointerup', onAnimalPointerUp);
        state.actorEl.removeEventListener('pointercancel', onAnimalPointerCancel);
      }

      function cleanupDrag() {
        if (!dragState) return;
        cleanupDragListeners(dragState);
        if (dragState.ghostEl) dragState.ghostEl.remove();
        if (dragState.actorEl) dragState.actorEl.classList.remove('is-dragging');
        if (dragState.hoveredHouseId) {
          const prev = document.querySelector(`.house-slot[data-house-id="${dragState.hoveredHouseId}"]`);
          if (prev) prev.classList.remove('drop-hover');
        }
        dragState = null;
      }

      function findHouseAtPoint(x, y) {
        const slots = document.querySelectorAll('.house-slot:not(.settled)');
        for (const slot of slots) {
          const r = slot.getBoundingClientRect();
          const pad = 16;
          if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) {
            return slot.dataset.houseId;
          }
        }
        return null;
      }

      function animateHopToHouse(animal, houseId) {
        isBusy = true;
        const actorEl = document.querySelector(`.animal-actor[data-animal-id="${animal.id}"]`);
        const houseEl = document.querySelector(`.house-slot[data-house-id="${houseId}"]`);
        const house = currentPuzzle.houses.find((h) => h.id === houseId);
        if (!actorEl || !houseEl || !house) { isBusy = false; return; }

        const aRect = actorEl.getBoundingClientRect();
        const hRect = houseEl.getBoundingClientRect();
        const sx = aRect.left + aRect.width / 2;
        const sy = aRect.top + aRect.height / 2;
        const ex = hRect.left + hRect.width / 2;
        const ey = hRect.top + hRect.height * 0.72;
        const mx = (sx + ex) / 2;
        const my = Math.min(sy, ey) - 115;

        actorEl.classList.add('is-hidden');
        houseEl.classList.add('door-open');

        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.innerHTML = createAnimalSVG(animal.animalType, false);
        ghost.style.left = `${sx}px`;
        ghost.style.top = `${sy}px`;
        dragLayer.appendChild(ghost);

        const anim = ghost.animate([
          { left: `${sx}px`, top: `${sy}px`, transform: 'translate(-50%, -50%) scale(1)' },
          { left: `${mx}px`, top: `${my}px`, transform: 'translate(-50%, -50%) scale(1.15)', offset: 0.5 },
          { left: `${ex}px`, top: `${ey}px`, transform: 'translate(-50%, -50%) scale(0.82)' }
        ], { duration: 360, easing: 'cubic-bezier(0.3, 0.72, 0.4, 1)' });

        anim.onfinish = () => {
          ghost.remove();
          settleAnimalIntoHouse(animal, house, houseEl);
        };
      }

      /* ============================================================
         9. CORRECT SETTLEMENT, WRONG FEEDBACK & ROUND CELEBRATION
         ============================================================ */
      function settleAnimalIntoHouse(animal, house, houseEl) {
        isBusy = true;
        animal.settled = true;
        houseEl.classList.add('settled', 'door-open');

        // Hide current bottom duo smoothly
        const actorEl = document.querySelector(`.animal-actor[data-animal-id="${animal.id}"]`);
        if (actorEl) actorEl.classList.add('is-hidden');

        SoundFX.playCorrect(animal.animalType);

        // Place perfectly-scaled smiling animal inside the arched window + paws on sill!
        const peekSvg = houseEl.querySelector(`[data-peek-svg="${house.id}"]`);
        const peekGroup = houseEl.querySelector(`[data-peek-slot="${house.id}"]`);
        const pawsGroup = houseEl.querySelector(`[data-paws-slot="${house.id}"]`);
        if (peekSvg && peekGroup) {
          // Extract inner <g> from headOnly SVG so it renders cleanly inside the 58x58 window SVG
          const rawHead = createAnimalSVG(animal.animalType, true);
          const innerHead = rawHead.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
          peekSvg.innerHTML = innerHead;
          setTimeout(() => peekGroup.classList.add('visible'), 170);
        }
        if (pawsGroup) {
          const pawColor = ANIMAL_PAW_COLOR[animal.animalType] || '#d9a673';
          const pawL = houseEl.querySelector(`[data-paw-left="${house.id}"]`);
          const pawR = houseEl.querySelector(`[data-paw-right="${house.id}"]`);
          if (pawL) pawL.setAttribute('fill', pawColor);
          if (pawR) pawR.setAttribute('fill', pawColor);
          setTimeout(() => pawsGroup.classList.add('visible'), 200);
        }

        // Gently close door after hopping inside
        setTimeout(() => {
          houseEl.classList.remove('door-open');
        }, 680);

        // Colorful burst of hearts/flowers/stars around roof/chimney
        const r = houseEl.getBoundingClientRect();
        spawnBurst(r.left + r.width / 2, r.top + r.height * 0.32, 24);

        // Advance to next animal or celebrate full village!
        activeAnimalIdx++;
        if (activeAnimalIdx < currentPuzzle.animals.length) {
          nextAnimalTimer = setTimeout(() => {
            renderActiveAnimal();
            isBusy = false;
          }, 680);
        } else {
          // All 3 houses settled! Clear bottom stage and celebrate!
          setTimeout(() => { activeStage.innerHTML = ''; }, 360);
          triggerRoundCelebration();
        }
      }

      function handleWrongAttempt(animal, house, houseEl, dropPt) {
        SoundFX.playWrong();

        // House wobbles comically
        houseEl.classList.remove('wrong-wobble');
        void houseEl.offsetWidth;
        houseEl.classList.add('wrong-wobble');

        // Active animal shakes head in surprise
        const actorEl = document.querySelector(`.animal-actor[data-animal-id="${animal.id}"]`);
        if (actorEl && !dropPt) {
          actorEl.classList.remove('head-shake');
          void actorEl.offsetWidth;
          actorEl.classList.add('head-shake');
        }

        // Highlight ONLY the specific conflicting clue medallion(s) on the wooden plaque!
        animal.clues.forEach((clue, idx) => {
          if (!matchesClue(house, clue)) {
            const badge = document.querySelector(`.clue-badge-group[data-animal="${animal.id}"][data-clue-idx="${idx}"]`);
            if (badge) {
              badge.classList.remove('conflict-hint');
              void badge.offsetWidth;
              badge.classList.add('conflict-hint');
            }
          }
        });

        // If dropped from drag, bounce animal back to meadow and then shake head
        if (dropPt && actorEl) {
          const aRect = actorEl.getBoundingClientRect();
          const tx = aRect.left + aRect.width / 2;
          const ty = aRect.top + aRect.height / 2;
          actorEl.classList.add('is-hidden');

          const ghost = document.createElement('div');
          ghost.className = 'drag-ghost';
          ghost.innerHTML = createAnimalSVG(animal.animalType, false);
          ghost.style.left = `${dropPt.x}px`;
          ghost.style.top = `${dropPt.y}px`;
          dragLayer.appendChild(ghost);

          const anim = ghost.animate([
            { left: `${dropPt.x}px`, top: `${dropPt.y}px`, transform: 'translate(-50%, -50%) scale(1.05)' },
            { left: `${(dropPt.x + tx) / 2}px`, top: `${Math.min(dropPt.y, ty) - 48}px`, transform: 'translate(-50%, -50%) scale(1.05)', offset: 0.45 },
            { left: `${tx}px`, top: `${ty}px`, transform: 'translate(-50%, -50%) scale(1)' }
          ], { duration: 340, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });

          anim.onfinish = () => {
            ghost.remove();
            actorEl.classList.remove('is-hidden');
            actorEl.classList.remove('head-shake');
            void actorEl.offsetWidth;
            actorEl.classList.add('head-shake');
          };
        }
      }

      function triggerRoundCelebration() {
        isBusy = true;
        setTimeout(() => {
          SoundFX.playWin();
          spawnCelebrationShower();

          document.querySelectorAll('.house-slot.settled').forEach((el) => {
            el.classList.add('celebrate-bounce');
          });
        }, 280);

        // Smooth automatic transition to next unique 3-house combination after ~2.2s
        roundCompleteTimer = setTimeout(() => {
          loadRound(currentRoundIndex + 1, true);
        }, 2400);
      }

      /* ============================================================
         10. BUTTON HANDLERS & BOOTSTRAP
         ============================================================ */
      btnSound.addEventListener('click', () => {
        SoundFX.muted = !SoundFX.muted;
        renderControls();
        if (!SoundFX.muted) {
          SoundFX.ensureCtx();
          SoundFX.playPickup();
        }
      });

      btnNext.addEventListener('click', () => {
        SoundFX.ensureCtx();
        SoundFX.playNext();
        loadRound(currentRoundIndex + 1, true);
      });

      window.addEventListener('load', () => {
        renderControls();
        loadRound(0, false);
      });
    })();
  </script>
</body>
</html>
