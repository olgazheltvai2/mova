<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Autumn Forest Hedgehog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================================
       GLOBAL RESET & FULL-VIEWPORT WIDESCREEN LAYOUT (ZERO SCROLLBARS)
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #3a230d;
      font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }

    /* =========================================================================
       TOP CARVED WOOD & AMBER CONTROLS (ZERO WHITE RECTANGLES, Z-INDEX 50)
       ========================================================================= */
    .ui-cluster-top {
      position: fixed;
      top: clamp(10px, 1.5vh, 18px);
      right: clamp(12px, 1.8vw, 24px);
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.75vw, 11px);
      z-index: 50;
      pointer-events: auto;
    }

    .wood-bar {
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.45vw, 7px);
      padding: clamp(4px, 0.55vh, 7px) clamp(6px, 0.7vw, 10px);
      border-radius: 999px;
      background:
        repeating-linear-gradient(
          92deg,
          rgba(255, 198, 92, 0.045) 0px,
          rgba(255, 198, 92, 0.045) 2px,
          rgba(26, 12, 4, 0.09) 2px,
          rgba(26, 12, 4, 0.09) 5px
        ),
        linear-gradient(165deg, #6d3d18 0%, #4b270d 55%, #341907 100%);
      border: 2px solid rgba(235, 174, 72, 0.65);
      box-shadow:
        0 8px 20px rgba(32, 14, 3, 0.48),
        inset 0 2px 4px rgba(255, 214, 128, 0.28),
        inset 0 -3px 6px rgba(18, 7, 1, 0.58);
    }

    .wood-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(38px, 3.1vw, 46px);
      height: clamp(38px, 3.1vw, 46px);
      padding: 0 clamp(10px, 0.85vw, 13px);
      border-radius: 999px;
      border: 1.8px solid rgba(242, 188, 86, 0.54);
      background: linear-gradient(180deg, #8b5020 0%, #5c3111 58%, #3f1f08 100%);
      color: #fde7b2;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(16px, 1.3vw, 20px);
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow:
        0 4px 10px rgba(22, 9, 2, 0.45),
        inset 0 2px 3px rgba(255, 224, 150, 0.28),
        inset 0 -2px 4px rgba(24, 9, 2, 0.5);
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.16s ease,
                  background 0.18s ease,
                  border-color 0.18s ease;
    }

    .wood-btn:hover {
      transform: translateY(-2px) scale(1.05);
      border-color: rgba(255, 224, 124, 0.92);
      background: linear-gradient(180deg, #a66227 0%, #723e16 58%, #4d260b 100%);
      box-shadow:
        0 6px 14px rgba(28, 12, 2, 0.54),
        0 0 12px rgba(255, 192, 68, 0.34),
        inset 0 2px 4px rgba(255, 234, 174, 0.38);
    }

    .wood-btn:active {
      transform: translateY(1px) scale(0.95);
    }

    .wood-btn.active {
      background: linear-gradient(180deg, #f8c852 0%, #dc8a1e 55%, #ad580e 100%);
      color: #2b1203;
      border-color: #fff2be;
      box-shadow:
        0 4px 14px rgba(232, 145, 28, 0.58),
        0 0 16px rgba(255, 206, 86, 0.55),
        inset 0 2px 4px rgba(255, 248, 212, 0.68),
        inset 0 -2px 5px rgba(124, 52, 6, 0.45);
    }

    .wood-btn.icon-only {
      padding: 0;
      width: clamp(38px, 3.1vw, 46px);
    }

    .wood-btn svg {
      width: 55%;
      height: 55%;
      display: block;
      pointer-events: none;
    }

    .lang-btn {
      min-width: clamp(54px, 4.2vw, 64px);
      font-size: clamp(14px, 1.15vw, 18px);
      text-transform: lowercase;
    }

    /* Prominent warm-amber carved "Next" skip arrow button in top bar */
    .wood-btn.next-top-btn {
      width: clamp(44px, 3.6vw, 52px);
      border-color: rgba(255, 228, 134, 0.88);
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 238, 162, 0.48), transparent 56%),
        linear-gradient(160deg, #eca62c 0%, #bd6615 58%, #7a380a 100%);
      color: #291103;
      box-shadow:
        0 5px 14px rgba(28, 12, 2, 0.52),
        0 0 14px rgba(246, 182, 56, 0.36),
        inset 0 2px 4px rgba(255, 246, 204, 0.58),
        inset 0 -3px 5px rgba(72, 28, 4, 0.52);
    }

    .wood-btn.next-top-btn:hover {
      background:
        radial-gradient(circle at 32% 28%, rgba(255, 244, 186, 0.6), transparent 56%),
        linear-gradient(160deg, #f8b83a 0%, #cf741a 58%, #8b420d 100%);
      box-shadow:
        0 7px 18px rgba(28, 12, 2, 0.56),
        0 0 20px rgba(255, 206, 78, 0.56),
        inset 0 2px 4px rgba(255, 248, 214, 0.72);
    }

    .wood-btn.next-top-btn svg {
      width: 58%;
      height: 58%;
      transform: translateX(1px);
    }

    /* =========================================================================
       LEVEL 2 FOOLPROOF CARVED OAK CONSONANT SELECTOR TRAY (Z-INDEX 60)
       ========================================================================= */
    .consonant-toggle-wrap {
      display: none;
      align-items: center;
    }

    .consonant-toggle-wrap.visible {
      display: flex;
    }

    .consonant-tray {
      position: fixed;
      top: clamp(66px, 8.2vh, 84px);
      left: 50%;
      transform: translateX(-50%) translateY(-10px) scale(0.96);
      max-width: min(94vw, 1080px);
      padding: clamp(7px, 0.8vw, 11px) clamp(11px, 1.15vw, 16px);
      border-radius: 24px;
      background:
        repeating-linear-gradient(
          91deg,
          rgba(255, 206, 102, 0.04) 0px,
          rgba(255, 206, 102, 0.04) 3px,
          rgba(18, 7, 2, 0.1) 3px,
          rgba(18, 7, 2, 0.1) 7px
        ),
        linear-gradient(170deg, rgba(94, 50, 18, 0.96) 0%, rgba(58, 29, 9, 0.97) 58%, rgba(38, 17, 4, 0.98) 100%);
      border: 2.2px solid rgba(238, 178, 76, 0.74);
      box-shadow:
        0 14px 32px rgba(22, 9, 1, 0.58),
        0 0 0 1px rgba(48, 20, 4, 0.65),
        inset 0 2px 5px rgba(255, 222, 138, 0.28),
        inset 0 -4px 10px rgba(16, 6, 1, 0.62);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: clamp(7px, 0.8vw, 12px);
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.22s ease;
    }

    .consonant-tray.open {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Decorative subtle carved autumn leaf accents on tray corners */
    .tray-leaf-accent {
      flex-shrink: 0;
      width: clamp(18px, 1.5vw, 24px);
      height: clamp(18px, 1.5vw, 24px);
      color: #ebb03c;
      opacity: 0.78;
      pointer-events: none;
    }

    .consonant-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 0.42vw, 6px);
    }

    /* Base consonant wooden tile: default "ALL active" neutral warm-wood state */
    .cons-chip {
      position: relative;
      width: clamp(32px, 2.55vw, 40px);
      height: clamp(32px, 2.55vw, 40px);
      border-radius: 11px;
      border: 1.8px solid rgba(235, 176, 76, 0.48);
      background: linear-gradient(180deg, #7a451b 0%, #562d0f 60%, #3d1d07 100%);
      color: #f8dfa6;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(15px, 1.18vw, 19px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 3px 6px rgba(18, 7, 1, 0.45),
        inset 0 1.5px 2px rgba(255, 224, 150, 0.25);
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1),
                  background 0.16s ease,
                  color 0.16s ease,
                  border-color 0.16s ease,
                  box-shadow 0.16s ease,
                  opacity 0.16s ease;
    }

    .cons-chip:hover {
      transform: translateY(-2px) scale(1.07);
      border-color: rgba(255, 218, 118, 0.9);
      color: #fff3cf;
      opacity: 1;
    }

    .cons-chip:active {
      transform: scale(0.92);
    }

    /* Unselected tiles visibly DIM when user picks 1+ custom consonants */
    .cons-chip.dimmed {
      background: linear-gradient(180deg, #3c1e09 0%, #271104 100%);
      border-color: rgba(154, 102, 42, 0.26);
      color: rgba(214, 174, 114, 0.42);
      box-shadow: inset 0 2px 5px rgba(10, 4, 0, 0.68);
      transform: scale(0.95);
    }

    .cons-chip.dimmed:hover {
      background: linear-gradient(180deg, #653814 0%, #45230a 100%);
      border-color: rgba(242, 188, 86, 0.72);
      color: #fbe5b2;
      transform: translateY(-2px) scale(1.04);
    }

    /* Selected consonant tiles LIGHT UP BRIGHTLY in glowing maple-amber gold */
    .cons-chip.selected {
      background: linear-gradient(180deg, #ffe06b 0%, #f1a424 56%, #c6670f 100%);
      color: #291002;
      border-color: #fff7cf;
      transform: translateY(-2px) scale(1.08);
      box-shadow:
        0 5px 14px rgba(242, 152, 26, 0.65),
        0 0 14px rgba(255, 218, 92, 0.62),
        inset 0 2px 3px rgba(255, 252, 226, 0.85),
        inset 0 -2px 4px rgba(138, 56, 6, 0.45);
      z-index: 2;
      animation: chipPop 0.24s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    .cons-chip.selected:hover {
      color: #210c01;
      transform: translateY(-3px) scale(1.12);
    }

    @keyframes chipPop {
      0% { transform: scale(0.88); }
      55% { transform: translateY(-4px) scale(1.18); }
      100% { transform: translateY(-2px) scale(1.08); }
    }

    .tray-divider {
      width: 1.5px;
      height: 28px;
      background: linear-gradient(180deg, transparent, rgba(242, 188, 86, 0.45), transparent);
      flex-shrink: 0;
    }

    .tray-tool-btn {
      flex-shrink: 0;
      width: clamp(34px, 2.75vw, 42px);
      height: clamp(34px, 2.75vw, 42px);
      border-radius: 12px;
      border: 1.8px solid rgba(235, 176, 76, 0.5);
      background: linear-gradient(180deg, #6e3d16 0%, #46230a 100%);
      color: #fae1a4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow:
        0 3px 8px rgba(18, 7, 1, 0.45),
        inset 0 1.5px 2px rgba(255, 224, 150, 0.25);
      transition: transform 0.14s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .tray-tool-btn:hover {
      transform: translateY(-2px) scale(1.07);
      border-color: #ffe28c;
      background: linear-gradient(180deg, #91521f 0%, #5c300f 100%);
    }

    .tray-tool-btn:active {
      transform: scale(0.92);
    }

    .tray-tool-btn.active {
      background: linear-gradient(180deg, #f3be48 0%, #ce7b19 60%, #9b4b0b 100%);
      color: #291103;
      border-color: #fff2be;
      box-shadow:
        0 3px 11px rgba(235, 146, 26, 0.55),
        inset 0 2px 3px rgba(255, 248, 214, 0.68);
    }

    .tray-tool-btn svg {
      width: 56%;
      height: 56%;
      pointer-events: none;
    }

    @media (max-width: 820px) {
      .tray-leaf-accent {
        display: none;
      }
      .consonant-tray {
        top: 64px;
        max-width: 96vw;
        padding: 7px 9px;
      }
    }
  </style>
</head>
<body>
  <!-- Full-viewport High-DPI Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Minimalist Stylized Wood Controls (Top Edge, Zero extra words, Zero white rectangles) -->
  <div class="ui-cluster-top" id="uiTop">
    <div class="wood-bar">
      <button type="button" class="wood-btn active" id="lvlBtn1" data-level="1" aria-label="1">1</button>
      <button type="button" class="wood-btn" id="lvlBtn2" data-level="2" aria-label="2">2</button>
      <button type="button" class="wood-btn" id="lvlBtn3" data-level="3" aria-label="3">3</button>
    </div>

    <!-- Level 2 ONLY Consonant Tray Collapse/Expand Toggle -->
    <div class="wood-bar consonant-toggle-wrap" id="consToggleWrap">
      <button type="button" class="wood-btn icon-only active" id="consToggleBtn" aria-label="Consonants">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="3.5" width="7" height="7" rx="2.1"></rect>
          <rect x="13.5" y="3.5" width="7" height="7" rx="2.1"></rect>
          <rect x="3.5" y="13.5" width="7" height="7" rx="2.1"></rect>
          <rect x="13.5" y="13.5" width="7" height="7" rx="2.1"></rect>
        </svg>
      </button>
    </div>

    <div class="wood-bar">
      <button type="button" class="wood-btn lang-btn" id="langBtn" aria-label="Language">укр</button>
      <button type="button" class="wood-btn icon-only" id="soundBtn" aria-label="Sound">
        <svg id="soundIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" fill-opacity="0.22"></polygon>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
          <path d="M18.8 5.8a9 9 0 0 1 0 12.4"></path>
        </svg>
        <svg id="soundIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" fill-opacity="0.22"></polygon>
          <line x1="22" y1="9" x2="16" y2="15"></line>
          <line x1="16" y1="9" x2="22" y2="15"></line>
        </svg>
      </button>
      <button type="button" class="wood-btn icon-only next-top-btn" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13"></path>
          <path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Level 2 Carved Oak Consonant Selector Tray (z-index: 60, Foolproof Direct Selection) -->
  <div class="consonant-tray" id="consonantTray">
    <svg class="tray-leaf-accent" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C9.5 6 5 8.2 4 13c-.6 2.8 1.2 5.4 4.2 6.2 1.2.3 2.4.1 3.1-.3v3.1h1.4v-3.1c.7.4 1.9.6 3.1.3 3-.8 4.8-3.4 4.2-6.2C19 8.2 14.5 6 12 2z"></path>
    </svg>

    <div class="consonant-grid" id="consonantGrid"></div>

    <div class="tray-divider"></div>

    <!-- Reset / All Consonants Active Icon Button (No Text) -->
    <button type="button" class="tray-tool-btn active" id="consResetAllBtn" aria-label="All">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.9 4.7L19 9.5l-3.9 3.3 1.2 5.1L12 15.2 7.7 17.9l1.2-5.1L5 9.5l5.1-1.8L12 3z" fill="currentColor" fill-opacity="0.24"></path>
      </svg>
    </button>

    <!-- Collapse Chevron Button -->
    <button type="button" class="tray-tool-btn" id="consCollapseBtn" aria-label="Hide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>

  <script>
    (() => {
      'use strict';

      /* =======================================================================
         1. BILINGUAL PEDAGOGICAL CONTENT (UKRAINIAN & RUSSIAN)
         ======================================================================= */
      const CONTENT = {
        uk: {
          label: 'укр',
          alphabet: [
            'А','Б','В','Г','Ґ','Д','Е','Є','Ж','З','И','І','Ї','Й','К','Л','М',
            'Н','О','П','Р','С','Т','У','Ф','Х','Ц','Ч','Ш','Щ','Ь','Ю','Я'
          ],
          consonants: [
            'Б','В','Г','Ґ','Д','Ж','З','Й','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ'
          ],
          // Pedagogically clean Ukrainian open syllables
          vowelsFor(c) {
            if (c === 'Й') return ['О', 'А', 'У', 'Е'];
            if (['Ж', 'Ч', 'Ш', 'Щ'].includes(c)) return ['А', 'О', 'У', 'И', 'Е', 'І'];
            if (['Г', 'Ґ', 'К', 'Х'].includes(c)) return ['А', 'О', 'У', 'И', 'Е', 'І'];
            return ['А', 'О', 'У', 'И', 'Е', 'І', 'Я', 'Ю', 'Є'];
          },
          // 40 unmistakable kid-friendly semantic triples: [related1, related2, odd]
          triplets: [
            ['яблуко', 'груша', 'шоколад'],
            ['кіт', 'пес', 'стіл'],
            ['троянда', 'тюльпан', 'дуб'],
            ['ложка', 'виделка', 'подушка'],
            ['сонце', 'місяць', 'трактор'],
            ['шапка', 'шарф', 'молоток'],
            ['орел', 'горобець', 'дельфін'],
            ['зима', 'літо', 'понеділок'],
            ['автобус', 'поїзд', 'банан'],
            ['морква', 'буряк', 'зошит'],
            ['чашка', 'тарілка', 'черевик'],
            ['вовк', 'лисиця', 'комар'],
            ['скрипка', 'гітара', 'каструля'],
            ['олівець', 'ручка', 'помідор'],
            ['береза', 'сосна', 'ромашка'],
            ['сир', 'масло', 'камінь'],
            ['річка', 'озеро', 'шафа'],
            ['бджола', 'метелик', 'ведмідь'],
            ['дощ', 'сніг', 'диван'],
            ['корова', 'коза', 'щука'],
            ['сукня', 'сорочка', 'літак'],
            ['малина', 'полуниця', 'огірок'],
            ['стілець', 'ліжко', 'парасоля'],
            ['човен', 'корабель', 'велосипед'],
            ['пилка', 'сокира', 'цукерка'],
            ['гриб', 'мох', 'годинник'],
            ['синій', 'зелений', 'круглий'],
            ['мама', 'тато', 'м’яч'],
            ['хліб', 'булка', 'мило'],
            ['сова', 'дятел', 'жаба'],
            ['ранок', 'вечір', 'осінь'],
            ['рукавиці', 'шкарпетки', 'книга'],
            ['кит', 'акула', 'жираф'],
            ['торт', 'печиво', 'цибуля'],
            ['білка', 'заєць', 'папуга'],
            ['картопля', 'капуста', 'вишня'],
            ['барабан', 'флейта', 'відро'],
            ['чоботи', 'кросівки', 'гребінець'],
            ['хмара', 'веселка', 'рюкзак'],
            ['чай', 'сік', 'капелюх']
          ]
        },
        ru: {
          label: 'рус',
          alphabet: [
            'А','Б','В','Г','Д','Е','Ё','Ж','З','И','Й','К','Л','М','Н','О','П',
            'Р','С','Т','У','Ф','Х','Ц','Ч','Ш','Щ','Ъ','Ы','Ь','Э','Ю','Я'
          ],
          consonants: [
            'Б','В','Г','Д','Ж','З','Й','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ'
          ],
          // Pedagogically clean Russian open syllables respecting orthography rules
          vowelsFor(c) {
            if (c === 'Й') return ['О', 'А', 'У', 'Е'];
            if (['Ж', 'Ш'].includes(c)) return ['А', 'О', 'У', 'И', 'Е', 'Ё'];
            if (['Ч', 'Щ'].includes(c)) return ['А', 'О', 'У', 'И', 'Е', 'Ё'];
            if (c === 'Ц') return ['А', 'О', 'У', 'Ы', 'Е', 'И'];
            if (['Г', 'К', 'Х'].includes(c)) return ['А', 'О', 'У', 'И', 'Е'];
            return ['А', 'О', 'У', 'Ы', 'Е', 'И', 'Я', 'Ю', 'Ё', 'Э'];
          },
          // 40 unmistakable kid-friendly semantic triples: [related1, related2, odd]
          triplets: [
            ['яблоко', 'груша', 'шоколад'],
            ['кот', 'собака', 'стол'],
            ['роза', 'тюльпан', 'дуб'],
            ['ложка', 'вилка', 'подушка'],
            ['солнце', 'луна', 'трактор'],
            ['шапка', 'шарф', 'молоток'],

      /* =======================================================================
         2. PERSISTENT NON-REPEATING SHUFFLE & SHOWN-SET MEMORY MANAGER
         ======================================================================= */
      class MemoryManager {
        constructor() {
          // Independent non-repeating decks for Level 1 & Level 3 per language
          this.decks = new Map();
          // Independent per-language shown-syllables Set for Level 2 (survives consonant filter changes!)
          this.shownSyllables = {
            uk: new Set(),
            ru: new Set()
          };
        }

        shuffle(arr) {
          const copy = arr.slice();
          for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
          }
          return copy;
        }

        /**
         * Draws `count` unseen items from a keyed deck without repeating
         * until every single item in `pool` has been shown once.
         */
        drawFromDeck(key, pool, count = 1) {
          if (!pool || pool.length === 0) return [];
          let deck = this.decks.get(key);
          if (!deck) {
            deck = { remaining: this.shuffle(pool), lastReturned: null };
            this.decks.set(key, deck);
          }

          const result = [];
          const pickedInRound = new Set();

          while (result.length < count) {
            if (deck.remaining.length === 0) {
              let fresh = this.shuffle(pool);
              if (fresh.length > 1 && deck.lastReturned !== null && fresh[fresh.length - 1] === deck.lastReturned) {
                [fresh[0], fresh[fresh.length - 1]] = [fresh[fresh.length - 1], fresh[0]];
              }
              deck.remaining = fresh;
            }

            let idx = deck.remaining.length - 1;
            while (idx >= 0 && pickedInRound.has(deck.remaining[idx])) {
              idx--;
            }

            if (idx >= 0) {
              const item = deck.remaining.splice(idx, 1)[0];
              result.push(item);
              pickedInRound.add(item);
              deck.lastReturned = item;
            } else {
              result.push(pool[result.length % pool.length]);
            }
          }
          return result;
        }

        /**
         * Draws `count` distinct syllables strictly from `activePool`,
         * remembering shown syllables in `this.shownSyllables[lang]` so nothing
         * repeats until EVERY syllable in `activePool` has been shown once.
         */
        drawSyllables(lang, activePool, count = 3) {
          if (!activePool || activePool.length === 0) return [];
          const shown = this.shownSyllables[lang];
          const picked = [];
          const pickedSet = new Set();

          while (picked.length < count) {
            let unseen = activePool.filter((syl) => !shown.has(syl) && !pickedSet.has(syl));
            if (unseen.length === 0) {
              // Every syllable in the active pool has been shown -> clear ONLY activePool items from shown memory
              for (const syl of activePool) {
                shown.delete(syl);
              }
              unseen = activePool.filter((syl) => !pickedSet.has(syl));
              if (unseen.length === 0) {
                unseen = activePool.slice();
              }
            }
            const choice = unseen[Math.floor(Math.random() * unseen.length)];
            picked.push(choice);
            pickedSet.add(choice);
            shown.add(choice);
          }

          return picked;
        }
      }

      /* =======================================================================
         3. PROCEDURAL WEB AUDIO API SOUND ENGINE (ZERO EXTERNAL AUDIO FILES)
         ======================================================================= */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
          this.noiseBuffer = null;
        }

        ensureContext() {
          if (this.muted) return null;
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return null;
              this.ctx = new AudioCtx();
              this.createNoiseBuffer();
            }
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            return this.ctx;
          } catch (e) {
            return null;
          }
        }

        createNoiseBuffer() {
          const sampleRate = this.ctx.sampleRate;
          const length = sampleRate * 1.5;
          const buffer = this.ctx.createBuffer(1, length, sampleRate);
          const data = buffer.getChannelData(0);
          let last = 0;
          for (let i = 0; i < length; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (last + 0.06 * white) / 1.06;
            last = data[i];
            data[i] *= 2.4;
          }
          this.noiseBuffer = buffer;
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        playBreeze(duration = 0.65, volume = 0.13) {
          const ctx = this.ensureContext();
          if (!ctx || !this.noiseBuffer) return;
          const now = ctx.currentTime;

          const src = ctx.createBufferSource();
          src.buffer = this.noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(500, now);
          filter.frequency.exponentialRampToValueAtTime(1180, now + duration * 0.45);
          filter.frequency.exponentialRampToValueAtTime(410, now + duration);
          filter.Q.value = 1.6;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(volume, now + duration * 0.24);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          src.start(now);
          src.stop(now + duration + 0.05);
        }

        playMarimba(freq, delay = 0, duration = 0.42, volume = 0.18) {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime + delay;

          const osc = ctx.createOscillator();
          const oscHarm = ctx.createOscillator();
          const gain = ctx.createGain();
          const gainHarm = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          oscHarm.type = 'triangle';
          oscHarm.frequency.setValueAtTime(freq * 4, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          gainHarm.gain.setValueAtTime(0.0001, now);
          gainHarm.gain.linearRampToValueAtTime(volume * 0.26, now + 0.005);
          gainHarm.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.24);

          osc.connect(gain);
          oscHarm.connect(gainHarm);
          gain.connect(ctx.destination);
          gainHarm.connect(ctx.destination);

          osc.start(now);
          oscHarm.start(now);
          osc.stop(now + duration + 0.03);
          oscHarm.stop(now + duration * 0.3);
        }

        playLeafPluck(leafIndex = 0) {
          const scale = [392.0, 493.88, 587.33, 659.25];
          const freq = scale[leafIndex % scale.length] * (0.98 + Math.random() * 0.04);
          this.playMarimba(freq, 0, 0.44, 0.19);
          this.playBreeze(0.2, 0.055);
        }

        playUiTap(high = false) {
          this.playMarimba(high ? 698.46 : 523.25, 0, 0.14, 0.13);
        }

        playWrongWood() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(232, now);
          osc.frequency.exponentialRampToValueAtTime(145, now + 0.17);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.21, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(170, now + 0.085);
          osc2.frequency.exponentialRampToValueAtTime(122, now + 0.22);
          gain2.gain.setValueAtTime(0.001, now + 0.085);
          gain2.gain.linearRampToValueAtTime(0.14, now + 0.105);
          gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.085);
          osc2.stop(now + 0.26);
        }

        playHedgehogSnuffle(excited = false) {
          const ctx = this.ensureContext();
          if (!ctx || !this.noiseBuffer) return;
          const now = ctx.currentTime;

          const puffs = excited ? 3 : 2;
          for (let i = 0; i < puffs; i++) {
            const t = now + i * 0.082;
            const src = ctx.createBufferSource();
            src.buffer = this.noiseBuffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1580 + i * 240, t);
            filter.Q.value = 3.2;

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.linearRampToValueAtTime(excited ? 0.115 : 0.075, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.068);

            src.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            src.start(t);
            src.stop(t + 0.08);
          }

          if (excited) {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(940, now + 0.04);
            osc.frequency.exponentialRampToValueAtTime(1420, now + 0.13);
            osc.frequency.exponentialRampToValueAtTime(1160, now + 0.22);
            g.gain.setValueAtTime(0.0001, now + 0.04);
            g.gain.linearRampToValueAtTime(0.075, now + 0.08);
            g.gain.exponentialRampToValueAtTime(0.0001, now + 0.23);
            osc.connect(g);
            g.connect(ctx.destination);
            osc.start(now + 0.04);
            osc.stop(now + 0.25);
          }
        }

        // 5 distinct cheerful musical motifs matched 1:1 with the 5 visual celebrations
        playCelebration(variant) {
          const ctx = this.ensureContext();
          if (!ctx) return;

          this.playHedgehogSnuffle(true);

          if (variant === 0) {
            // 1. Ascending Harp / Marimba Arpeggio (paired with Leaf Vortex)
            const notes = [523.25, 587.33, 659.25, 783.99, 1046.5];
            notes.forEach((n, i) => this.playMarimba(n, i * 0.072, 0.68, 0.165));
          } else if (variant === 1) {
            // 2. Warm Glockenspiel Chime Melody (paired with Fireflies & Stardust)
            const notes = [659.25, 783.99, 987.77, 1318.51, 1567.98];
            const now = ctx.currentTime;
            notes.forEach((n, i) => {
              const t = now + i * 0.085;
              const o1 = ctx.createOscillator();
              const o2 = ctx.createOscillator();
              const g = ctx.createGain();
              o1.type = 'sine';
              o2.type = 'sine';
              o1.frequency.setValueAtTime(n, t);
              o2.frequency.setValueAtTime(n * 2.004, t);
              g.gain.setValueAtTime(0.0001, t);
              g.gain.linearRampToValueAtTime(0.11, t + 0.006);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 0.72);
              o1.connect(g);
              o2.connect(g);
              g.connect(ctx.destination);
              o1.start(t);
              o2.start(t);
              o1.stop(t + 0.75);
              o2.stop(t + 0.75);
            });
          } else if (variant === 2) {
            // 3. Cheerful Woodwind / Flute Trill (paired with Bouncing Acorns & Berries)
            const notes = [587.33, 659.25, 739.99, 880.0, 987.77, 1174.66];
            const now = ctx.currentTime;
            notes.forEach((n, i) => {
              const t = now + i * 0.075;
              const osc = ctx.createOscillator();
              const g = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(n, t);
              g.gain.setValueAtTime(0.0001, t);
              g.gain.linearRampToValueAtTime(0.125, t + 0.022);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
              osc.connect(g);
              g.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.38);
            });
          } else if (variant === 3) {
            // 4. Joyful Pentatonic Xylophone Flourish (paired with Sunbeam Burst & Bokeh)
            const seq = [
              [523.25, 0.00], [659.25, 0.065], [783.99, 0.13],

            ];
            seq.forEach(([f, d]) => this.playMarimba(f, d, 0.52, 0.17));
          } else {
            // 5. Lively Pizzicato Chord Progression (paired with Musical Notes & Butterflies)
            const ctxNow = ctx.currentTime;
            const chords = [
              [392.0, 493.88, 587.33],

            ];
            chords.forEach((chord, cIdx) => {
              chord.forEach((f, nIdx) => {
                const t = ctxNow + cIdx * 0.15 + nIdx * 0.018;

                g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
                osc.connect(g);
                g.connect(ctx.destination);
                osc.start(t);
                osc.stop(t + 0.32);
              });
            });

        }

      /* =======================================================================
         4. LIVING REALISTIC GOLDEN AUTUMN FOREST SCENE
         ======================================================================= */
      class ForestScene {
        constructor() {
          this.w = 1280;
          this.h = 720;
          this.cacheCanvas = document.createElement('canvas');
          this.cacheCtx = this.cacheCanvas.getContext('2d');
          this.canopyClusters = [];
          this.ferns = [];
          this.grassBlades = [];
          this.ambientLeaves = [];
          this.pollen = [];
          this.sunbeams = [];
        }

        seededRandom(seed) {
          let s = seed % 2147483647;
          if (s <= 0) s += 2147483646;
          return () => {
            s = (s * 16807) % 2147483647;
            return (s - 1) / 2147483646;
          };
        }

        resize(w, h, dpr) {
          this.w = w;
          this.h = h;
          this.cacheCanvas.width = Math.ceil(w * dpr);
          this.cacheCanvas.height = Math.ceil(h * dpr);
          this.cacheCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          this.buildStaticForest();
          this.buildDynamicElements();
        }

        buildStaticForest() {
          const ctx = this.cacheCtx;
          const w = this.w;
          const h = this.h;
          const rand = this.seededRandom(202611);

          // 1. Golden-Hour Warm Sunlight Sky
          const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.78);
          skyGrad.addColorStop(0.0, '#c66f18');
          skyGrad.addColorStop(0.28, '#e39a2e');
          skyGrad.addColorStop(0.62, '#f6cb64');
          skyGrad.addColorStop(1.0, '#fae4a0');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, w, h);

          // Glowing afternoon sun behind distant autumn canopy
          const sunX = w * 0.68;
          const sunY = h * 0.24;
          const sunR = Math.min(w, h) * 0.35;
          const sunGlow = ctx.createRadialGradient(sunX, sunY, sunR * 0.05, sunX, sunY, sunR);
          sunGlow.addColorStop(0.0, 'rgba(255, 252, 224, 0.92)');
          sunGlow.addColorStop(0.24, 'rgba(255, 236, 152, 0.62)');
          sunGlow.addColorStop(0.56, 'rgba(248, 192, 74, 0.24)');
          sunGlow.addColorStop(1.0, 'rgba(248, 192, 74, 0)');
          ctx.fillStyle = sunGlow;
          ctx.fillRect(0, 0, w, h);

          // 2. Distant Hazy Golden Hills & Multi-Layer Trees
          this.drawDistantRidge(ctx, w, h, 0.56, 0.05, '#cf892c', 0.42, rand);
          this.drawDistantTrees(ctx, w, h, 0.58, '#bc7321', 0.36, 36, rand);
          this.drawDistantRidge(ctx, w, h, 0.64, 0.045, '#b86c1e', 0.68, rand);
          this.drawDistantTrees(ctx, w, h, 0.66, '#965115', 0.58, 28, rand);

          // Atmospheric warm golden haze band
          const haze = ctx.createLinearGradient(0, h * 0.38, 0, h * 0.74);
          haze.addColorStop(0, 'rgba(255, 228, 138, 0)');
          haze.addColorStop(0.5, 'rgba(255, 218, 114, 0.28)');
          haze.addColorStop(1, 'rgba(232, 156, 48, 0.05)');
          ctx.fillStyle = haze;
          ctx.fillRect(0, h * 0.38, w, h * 0.36);

          // 3. Midground Realistic Silver Birches & Gnarly Oak Trunks
          const trees = [
            { x: w * 0.05,  baseY: h * 0.80, width: w * 0.048, type: 'oak',   lean: 0.03 },
            { x: w * 0.145, baseY: h * 0.74, width: w * 0.026, type: 'birch', lean: -0.025 },
            { x: w * 0.24,  baseY: h * 0.70, width: w * 0.019, type: 'birch', lean: 0.02 },
            { x: w * 0.41,  baseY: h * 0.68, width: w * 0.017, type: 'birch', lean: -0.015 },
            { x: w * 0.53,  baseY: h * 0.69, width: w * 0.022, type: 'oak',   lean: 0.025 },
            { x: w * 0.78,  baseY: h * 0.72, width: w * 0.027, type: 'birch', lean: -0.02 },
            { x: w * 0.89,  baseY: h * 0.76, width: w * 0.034, type: 'birch', lean: -0.035 },
            { x: w * 0.965, baseY: h * 0.83, width: w * 0.054, type: 'oak',   lean: -0.02 }
          ];

          this.drawStaticCanopyBackdrop(ctx, w, h, rand);

          for (const t of trees) {
            if (t.type === 'birch') {
              this.drawBirchTrunk(ctx, t.x, t.baseY, t.width, h * 0.82, t.lean, rand);
            } else {
              this.drawOakTrunk(ctx, t.x, t.baseY, t.width, h * 0.86, t.lean, rand);
            }
          }

          // 4. Rolling Mossy Autumn Forest Floor
          const floorY = h * 0.69;
          ctx.beginPath();
          ctx.moveTo(0, h);
          ctx.lineTo(0, floorY + h * 0.02);
          ctx.bezierCurveTo(w * 0.25, floorY - h * 0.03, w * 0.52, floorY + h * 0.04, w * 0.78, floorY - h * 0.015);
          ctx.quadraticCurveTo(w * 0.92, floorY - h * 0.03, w, floorY + h * 0.01);
          ctx.lineTo(w, h);
          ctx.closePath();

          const floorGrad = ctx.createLinearGradient(0, floorY - 20, 0, h);
          floorGrad.addColorStop(0.0, '#9c6e22');
          floorGrad.addColorStop(0.28, '#7b4f18');
          floorGrad.addColorStop(0.62, '#5c3810');
          floorGrad.addColorStop(1.0, '#3a2008');
          ctx.fillStyle = floorGrad;
          ctx.fill();

          // Warm dappled sunlit patches on forest floor
          for (let i = 0; i < 14; i++) {
            const px = rand() * w;
            const py = floorY + rand() * (h - floorY) * 0.85;
            const rx = w * (0.05 + rand() * 0.09);
            const ry = h * (0.018 + rand() * 0.032);
            const patch = ctx.createRadialGradient(px, py, 2, px, py, rx);
            patch.addColorStop(0, 'rgba(245, 194, 76, 0.28)');
            patch.addColorStop(1, 'rgba(245, 194, 76, 0)');
            ctx.save();
            ctx.translate(px, py);
            ctx.scale(1, ry / rx);
            ctx.fillStyle = patch;
            ctx.beginPath();
            ctx.arc(0, 0, rx, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // Rich Mossy Cushions near roots
          const mossSpots = [
            [0.06, 0.82, 0.11, 0.045],
            [0.16, 0.76, 0.08, 0.032],
            [0.48, 0.74, 0.09, 0.028],
            [0.77, 0.76, 0.095, 0.036],
            [0.92, 0.83, 0.13, 0.05]
          ];
          for (const [mx, my, mr, mry] of mossSpots) {
            const gx = w * mx;
            const gy = h * my;
            const grad = ctx.createRadialGradient(gx, gy - h * mry * 0.3, 4, gx, gy, w * mr);
            grad.addColorStop(0, '#7c7b26');
            grad.addColorStop(0.55, '#59591a');
            grad.addColorStop(1, 'rgba(64, 52, 16, 0)');
            ctx.save();
            ctx.translate(gx, gy);
            ctx.scale(1, (h * mry) / (w * mr));
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, w * mr, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 5. Layered Fallen Leaf Carpet on Forest Floor (Perspective & Varied Shapes)
          const leafColors = [
            '#e8a628', '#d9841b', '#c65e14', '#f2c144', '#a84410',
            '#b86b1a', '#df9b26', '#8d3b0e', '#ecc454', '#c94c12'
          ];
          for (let i = 0; i < 360; i++) {
            const depth = Math.pow(rand(), 0.72);
            const lx = rand() * w;
            const ly = floorY + depth * (h - floorY) * 0.98;
            const size = (4.5 + depth * 14.5) * (w / 1400);
            const rot = (rand() - 0.5) * 1.4;
            ctx.save();
            ctx.translate(lx, ly);
            ctx.rotate(rot);
            ctx.scale(1.42, 0.52);
            ctx.fillStyle = leafColors[Math.floor(rand() * leafColors.length)];
            ctx.globalAlpha = 0.55 + depth * 0.42;
            ctx.beginPath();
            ctx.moveTo(-size, 0);
            ctx.quadraticCurveTo(0, -size * 0.9, size, 0);
            ctx.quadraticCurveTo(0, size * 0.85, -size, 0);
            ctx.fill();
            ctx.fillStyle = 'rgba(42, 18, 4, 0.24)';
            ctx.beginPath();
            ctx.ellipse(0, size * 0.22, size * 0.82, size * 0.24, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 6. Realistic Woodland Mushrooms (Porcini & Chanterelles)
          const scale = Math.min(w, h) / 760;
          this.drawPorcini(ctx, w * 0.085, h * 0.87, 1.05 * scale);
          this.drawPorcini(ctx, w * 0.118, h * 0.895, 0.72 * scale);
          this.drawPorcini(ctx, w * 0.865, h * 0.825, 0.88 * scale);
          this.drawChanterelleCluster(ctx, w * 0.47, h * 0.775, 0.64 * scale);
          this.drawChanterelleCluster(ctx, w * 0.735, h * 0.84, 0.90 * scale);
        }

        drawDistantRidge(ctx, w, h, yRatio, ampRatio, color, alpha, rand) {
          ctx.save();
          ctx.fillStyle = color;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.moveTo(0, h);
          const steps = 12;
          for (let i = 0; i <= steps; i++) {
            const x = (w / steps) * i;
            const y = h * yRatio + Math.sin(i * 0.9 + rand() * 0.4) * h * ampRatio;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(w, h);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        drawDistantTrees(ctx, w, h, baseRatio, color, alpha, count, rand) {
          ctx.save();
          ctx.fillStyle = color;
          ctx.globalAlpha = alpha;
          for (let i = 0; i < count; i++) {
            const x = (i / count) * w + (rand() - 0.5) * 35;
            const baseY = h * (baseRatio + (rand() - 0.5) * 0.05);
            const trunkH = h * (0.14 + rand() * 0.16);
            const crownR = (18 + rand() * 34) * (w / 1400);
            ctx.fillRect(x - 1.5, baseY - trunkH, 3, trunkH + 20);
            ctx.beginPath();
            ctx.arc(x, baseY - trunkH, crownR, 0, Math.PI * 2);
            ctx.arc(x - crownR * 0.6, baseY - trunkH + crownR * 0.25, crownR * 0.75, 0, Math.PI * 2);
            ctx.arc(x + crownR * 0.6, baseY - trunkH + crownR * 0.2, crownR * 0.7, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        drawStaticCanopyBackdrop(ctx, w, h, rand) {
          const palette = ['#e4a026', '#f2bd3d', '#cf781b', '#b85c13', '#f7cf5b', '#d98f22', '#bd4711'];
          ctx.save();
          for (let i = 0; i < 70; i++) {
            const cx = rand() * w;
            const cy = rand() * h * 0.26 - h * 0.03;
            const r = (36 + rand() * 68) * (w / 1400);
            ctx.globalAlpha = 0.24 + rand() * 0.25;
            ctx.fillStyle = palette[Math.floor(rand() * palette.length)];
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        drawBirchTrunk(ctx, x, baseY, width, height, lean, rand) {
          ctx.save();
          const topX = x + lean * height;
          const topY = baseY - height;
          const topW = width * 0.56;

          ctx.beginPath();
          ctx.moveTo(x - width * 0.75, baseY + 12);
          ctx.quadraticCurveTo(x - width * 0.5, baseY - height * 0.15, topX - topW * 0.5, topY);
          ctx.lineTo(topX + topW * 0.5, topY);
          ctx.quadraticCurveTo(x + width * 0.5, baseY - height * 0.15, x + width * 0.75, baseY + 12);
          ctx.closePath();

          const barkGrad = ctx.createLinearGradient(x - width * 0.6, baseY, x + width * 0.6, baseY);
          barkGrad.addColorStop(0.0, '#9e8f7b');
          barkGrad.addColorStop(0.28, '#ddd1bc');
          barkGrad.addColorStop(0.68, '#f5ecd8');
          barkGrad.addColorStop(1.0, '#c8ae82');
          ctx.fillStyle = barkGrad;
          ctx.fill();

          ctx.clip();

          const baseGrad = ctx.createLinearGradient(x, baseY + 10, x, baseY - height * 0.18);
          baseGrad.addColorStop(0, '#2c1f16');
          baseGrad.addColorStop(0.55, 'rgba(62, 46, 34, 0.72)');
          baseGrad.addColorStop(1, 'rgba(62, 46, 34, 0)');
          ctx.fillStyle = baseGrad;
          ctx.fillRect(x - width, baseY - height * 0.2, width * 2, height * 0.25);

          const marks = Math.floor(height / 14);
          for (let i = 0; i < marks; i++) {
            const t = rand();
            const my = baseY - t * height;
            const mx = x + lean * height * t + (rand() - 0.5) * width * 0.75;
            const mw = width * (0.22 + rand() * 0.45);
            const mh = 1.2 + rand() * 2.4;
            ctx.fillStyle = rand() > 0.25 ? 'rgba(54, 42, 34, 0.72)' : 'rgba(92, 68, 44, 0.55)';
            ctx.beginPath();
            ctx.ellipse(mx, my, mw * 0.5, mh * 0.5, (rand() - 0.5) * 0.12, 0, Math.PI * 2);
            ctx.fill();

            if (rand() < 0.11) {
              ctx.fillStyle = 'rgba(42, 30, 22, 0.85)';
              ctx.beginPath();
              ctx.moveTo(mx - mw * 0.35, my);
              ctx.lineTo(mx + mw * 0.35, my - 3);
              ctx.lineTo(mx, my + 6);
              ctx.closePath();
              ctx.fill();
            }
          }
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = '#473322';
          ctx.lineCap = 'round';
          for (let b = 0; b < 5; b++) {
            const bt = 0.52 + b * 0.11;
            const bx = x + lean * height * bt;
            const by = baseY - height * bt;
            const dir = b % 2 === 0 ? 1 : -1;
            const len = width * (3.2 + rand() * 2.5);
            ctx.lineWidth = Math.max(1.5, width * 0.12 * (1 - b * 0.12));
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.quadraticCurveTo(bx + dir * len * 0.55, by - len * 0.35, bx + dir * len, by - len * 0.22);
            ctx.stroke();
          }
          ctx.restore();
        }

        drawOakTrunk(ctx, x, baseY, width, height, lean, rand) {
          ctx.save();
          const topX = x + lean * height;
          const topY = baseY - height;
          const topW = width * 0.62;

          ctx.beginPath();
          ctx.moveTo(x - width * 0.9, baseY + 18);
          ctx.bezierCurveTo(x - width * 0.55, baseY - height * 0.2, topX - topW * 0.55, baseY - height * 0.6, topX - topW * 0.5, topY);
          ctx.lineTo(topX + topW * 0.5, topY);
          ctx.bezierCurveTo(topX + topW * 0.55, baseY - height * 0.6, x + width * 0.55, baseY - height * 0.2, x + width * 0.9, baseY + 18);
          ctx.closePath();

          const grad = ctx.createLinearGradient(x - width * 0.7, baseY, x + width * 0.7, baseY);
          grad.addColorStop(0.0, '#362112');
          grad.addColorStop(0.45, '#59371e');
          grad.addColorStop(0.82, '#784c26');
          grad.addColorStop(1.0, '#9e6b34');
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.clip();
          ctx.strokeStyle = 'rgba(28, 15, 6, 0.48)';
          ctx.lineWidth = Math.max(1.2, width * 0.06);
          for (let i = 0; i < 9; i++) {
            const fx = x - width * 0.6 + (width * 1.2) * (i / 8);
            ctx.beginPath();
            ctx.moveTo(fx, baseY + 12);
            ctx.bezierCurveTo(
              fx + (rand() - 0.5) * 10, baseY - height * 0.33,
              fx + lean * height * 0.6 + (rand() - 0.5) * 10, baseY - height * 0.66,
              fx + lean * height, topY
            );
            ctx.stroke();
          }
          ctx.restore();
        }

        drawPorcini(ctx, x, y, s) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(s, s);

          ctx.fillStyle = 'rgba(26, 12, 3, 0.42)';
          ctx.beginPath();
          ctx.ellipse(0, 4, 24, 7, 0, 0, Math.PI * 2);
          ctx.fill();

          const stemGrad = ctx.createLinearGradient(-12, 0, 12, 0);
          stemGrad.addColorStop(0, '#b59467');
          stemGrad.addColorStop(0.45, '#ebd9b4');
          stemGrad.addColorStop(1, '#c8a675');
          ctx.fillStyle = stemGrad;
          ctx.beginPath();
          ctx.moveTo(-11, 3);
          ctx.bezierCurveTo(-15, -10, -10, -24, -8, -32);
          ctx.lineTo(8, -32);
          ctx.bezierCurveTo(10, -24, 15, -10, 11, 3);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#dec68a';
          ctx.beginPath();
          ctx.ellipse(0, -29, 25, 8, 0, 0, Math.PI * 2);
          ctx.fill();

          const capGrad = ctx.createRadialGradient(-7, -46, 3, 0, -35, 30);
          capGrad.addColorStop(0, '#c27932');
          capGrad.addColorStop(0.55, '#8c4918');
          capGrad.addColorStop(1, '#522509');
          ctx.fillStyle = capGrad;
          ctx.beginPath();
          ctx.moveTo(-27, -29);
          ctx.bezierCurveTo(-28, -55, 28, -55, 27, -29);
          ctx.quadraticCurveTo(0, -24, -27, -29);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 228, 165, 0.25)';
          ctx.beginPath();
          ctx.ellipse(-8, -42, 9, 4, -0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        drawChanterelleCluster(ctx, x, y, s) {
          const items = [
            { dx: -16, dy: 2, rot: -0.24, sc: 0.78 },
            { dx: 15, dy: 3, rot: 0.22, sc: 0.72 },
            { dx: 0, dy: 0, rot: -0.04, sc: 1.0 }
          ];
          for (const it of items) {
            ctx.save();
            ctx.translate(x + it.dx * s, y + it.dy * s);
            ctx.rotate(it.rot);
            ctx.scale(s * it.sc, s * it.sc);

            const grad = ctx.createLinearGradient(0, 0, 0, -34);
            grad.addColorStop(0, '#c26c12');
            grad.addColorStop(0.55, '#eb9f21');
            grad.addColorStop(1, '#fad154');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-4, 2);
            ctx.quadraticCurveTo(-5, -14, -18, -26);
            ctx.bezierCurveTo(-10, -33, 10, -33, 18, -26);
            ctx.quadraticCurveTo(5, -14, 4, 2);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(148, 68, 8, 0.35)';
            ctx.lineWidth = 1.1;
            for (let g = -10; g <= 10; g += 5) {
              ctx.beginPath();
              ctx.moveTo(g * 0.25, -4);
              ctx.lineTo(g * 1.1, -24);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        buildDynamicElements() {
          const w = this.w;
          const h = this.h;
          const rand = this.seededRandom(88421);

          this.sunbeams = [];
          for (let i = 0; i < 6; i++) {
            this.sunbeams.push({
              x: w * (0.28 + i * 0.13),
              width: w * (0.045 + rand() * 0.055),
              angle: 0.32 + (rand() - 0.5) * 0.08,
              phase: rand() * Math.PI * 2,
              speed: 0.35 + rand() * 0.25,
              baseAlpha: 0.055 + rand() * 0.055
            });
          }

          this.canopyClusters = [];
          const palette = [
            '#f2c138', '#e8a224', '#d97d19', '#f9d762',
            '#c85e14', '#e39620', '#b54c10', '#f4c948', '#c64612'
          ];
          const boughAnchors = [
            [0.02, 0.04], [0.12, 0.02], [0.22, 0.05], [0.34, 0.01],
            [0.48, 0.02], [0.62, 0.01], [0.78, 0.03], [0.90, 0.02], [0.98, 0.08],
            [0.04, 0.15], [0.14, 0.13], [0.88, 0.16], [0.97, 0.22]
          ];
          for (const [ax, ay] of boughAnchors) {
            const subLeaves = [];
            for (let k = 0; k < 14; k++) {
              subLeaves.push({
                dx: (rand() - 0.5) * w * 0.13,
                dy: (rand() - 0.5) * h * 0.11,
                rx: (10 + rand() * 18) * (w / 1400),
                ry: (6 + rand() * 10) * (w / 1400),
                rot: rand() * Math.PI,
                color: palette[Math.floor(rand() * palette.length)]
              });
            }
            this.canopyClusters.push({
              x: w * ax,
              y: h * ay,
              phase: rand() * Math.PI * 2,
              speed: 0.7 + rand() * 0.55,
              amp: 5 + rand() * 7,
              leaves: subLeaves
            });
          }

          this.ferns = [
            { x: w * 0.02, y: h * 0.99, len: h * 0.23, angle: -1.15, phase: 0.4 },
            { x: w * 0.05, y: h * 1.01, len: h * 0.18, angle: -0.82, phase: 1.7 },
            { x: w * 0.95, y: h * 1.01, len: h * 0.21, angle: -2.15, phase: 2.3 },
            { x: w * 0.98, y: h * 0.98, len: h * 0.25, angle: -1.85, phase: 0.9 }
          ];

          this.grassBlades = [];
          for (let i = 0; i < 42; i++) {
            this.grassBlades.push({
              x: rand() * w,
              y: h * (0.95 + rand() * 0.06),
              len: h * (0.04 + rand() * 0.065),
              lean: (rand() - 0.5) * 0.55,
              phase: rand() * Math.PI * 2,
              color: rand() > 0.45 ? '#6d691d' : '#9c7d22'
            });
          }

          this.ambientLeaves = [];
          for (let i = 0; i < 20; i++) {
            this.ambientLeaves.push({
              x: rand() * w,
              y: rand() * h,
              vx: 14 + rand() * 24,
              vy: 22 + rand() * 30,
              size: (5.5 + rand() * 7.5) * (w / 1400),
              rot: rand() * Math.PI * 2,
              rotSpeed: (rand() - 0.5) * 2.2,
              swayPhase: rand() * Math.PI * 2,
              swayAmp: 18 + rand() * 26,
              color: palette[Math.floor(rand() * palette.length)],
              alpha: 0.45 + rand() * 0.42
            });
          }

          this.pollen = [];
          for (let i = 0; i < 38; i++) {
            this.pollen.push({
              x: rand() * w,
              y: rand() * h * 0.88,
              r: 1.2 + rand() * 2.4,
              vx: 4 + rand() * 10,
              vy: -3 + rand() * 6,
              phase: rand() * Math.PI * 2,
              speed: 1.0 + rand() * 1.6
            });
          }
        }

        update(dt) {
          const w = this.w;
          const h = this.h;
          for (const lf of this.ambientLeaves) {
            lf.swayPhase += dt * 1.6;
            lf.x += (lf.vx + Math.sin(lf.swayPhase) * lf.swayAmp) * dt;
            lf.y += lf.vy * dt;
            lf.rot += lf.rotSpeed * dt;
            if (lf.y > h + 20) {
              lf.y = -20;
              lf.x = Math.random() * w * 1.1 - w * 0.1;
            }
            if (lf.x > w + 30) lf.x = -25;
          }

          for (const p of this.pollen) {
            p.phase += dt * p.speed;
            p.x += (p.vx + Math.cos(p.phase) * 6) * dt;
            p.y += (p.vy + Math.sin(p.phase * 0.8) * 5) * dt;
            if (p.x > w + 10) p.x = -10;
            if (p.y < -10) p.y = h * 0.85;
            if (p.y > h * 0.92) p.y = 10;
          }
        }

        drawBackground(ctx, time) {
          ctx.drawImage(this.cacheCanvas, 0, 0, this.w, this.h);

          // Volumetric Sunbeams (God Rays)
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          for (const b of this.sunbeams) {
            const alpha = b.baseAlpha * (0.65 + 0.35 * Math.sin(time * b.speed + b.phase));
            const driftX = Math.sin(time * 0.22 + b.phase) * 28;
            ctx.save();
            ctx.translate(b.x + driftX, -40);
            ctx.rotate(b.angle);
            const grad = ctx.createLinearGradient(0, 0, 0, this.h * 1.15);
            grad.addColorStop(0, `rgba(255, 240, 168, ${alpha})`);
            grad.addColorStop(0.55, `rgba(255, 214, 108, ${alpha * 0.55})`);
            grad.addColorStop(1, 'rgba(255, 200, 90, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(-b.width * 0.45, 0);
            ctx.lineTo(b.width * 0.45, 0);
            ctx.lineTo(b.width * 1.25, this.h * 1.15);
            ctx.lineTo(-b.width * 0.95, this.h * 1.15);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();

          // Swaying Upper Golden Canopy
          for (const cl of this.canopyClusters) {
            const swayX = Math.sin(time * cl.speed + cl.phase) * cl.amp;
            const swayY = Math.cos(time * cl.speed * 0.7 + cl.phase) * (cl.amp * 0.35);
            ctx.save();
            ctx.translate(cl.x + swayX, cl.y + swayY);
            for (const lf of cl.leaves) {
              ctx.save();
              ctx.translate(lf.dx, lf.dy);
              ctx.rotate(lf.rot + swayX * 0.015);
              ctx.fillStyle = lf.color;
              ctx.globalAlpha = 0.86;
              ctx.beginPath();
              ctx.ellipse(0, 0, lf.rx, lf.ry, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
            ctx.restore();
          }

          // Ambient Drifting Small Autumn Leaves
          for (const lf of this.ambientLeaves) {
            ctx.save();
            ctx.translate(lf.x, lf.y);
            ctx.rotate(lf.rot);
            ctx.scale(1, 0.58 + 0.35 * Math.sin(lf.swayPhase * 1.4));
            ctx.globalAlpha = lf.alpha;
            ctx.fillStyle = lf.color;
            ctx.beginPath();
            ctx.moveTo(-lf.size, 0);
            ctx.quadraticCurveTo(0, -lf.size * 0.85, lf.size, 0);
            ctx.quadraticCurveTo(0, lf.size * 0.85, -lf.size, 0);
            ctx.fill();
            ctx.restore();
          }

          // Floating Sunlit Pollen Motes
          ctx.save();
          for (const p of this.pollen) {
            const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(p.phase * 2));
            ctx.fillStyle = `rgba(255, 246, 186, ${a})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        drawForeground(ctx, time) {
          ctx.save();
          ctx.lineCap = 'round';
          for (const g of this.grassBlades) {
            const sway = Math.sin(time * 1.8 + g.phase) * 0.14;
            const tipX = g.x + Math.sin(g.lean + sway) * g.len;
            const tipY = g.y - Math.cos(g.lean + sway) * g.len;
            ctx.strokeStyle = g.color;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(g.x, g.y);
            ctx.quadraticCurveTo(g.x + (tipX - g.x) * 0.35, g.y - g.len * 0.55, tipX, tipY);
            ctx.stroke();
          }
          ctx.restore();

          for (const f of this.ferns) {
            const sway = Math.sin(time * 1.35 + f.phase) * 0.055;
            this.drawFern(ctx, f.x, f.y, f.len, f.angle + sway);
          }
        }

        drawFern(ctx, x, y, len, angle) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);

          ctx.strokeStyle = '#585c1b';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(len * 0.5, -len * 0.08, len, 0);
          ctx.stroke();

          const leaflets = 14;
          for (let i = 2; i <= leaflets; i++) {
            const t = i / (leaflets + 1);
            const lx = t * len;
            const ly = -Math.sin(t * Math.PI) * len * 0.055;
            const size = Math.sin(t * Math.PI) * len * 0.19;

            for (const side of [-1, 1]) {
              ctx.save();
              ctx.translate(lx, ly);
              ctx.rotate(side * (0.95 - t * 0.35));
              ctx.fillStyle = i % 2 === 0 ? '#696c21' : '#7f7823';
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(size * 0.5, -size * 0.24, size, 0);
              ctx.quadraticCurveTo(size * 0.5, size * 0.24, 0, 0);
              ctx.fill();
              ctx.restore();
            }
          }
          ctx.restore();
        }
      }

      /* =======================================================================
         5. ULTRA-REALISTIC CLOSE-UP HEDGEHOG WITH LOWERED, ATTACHED PAWS
         ======================================================================= */
      class Hedgehog {
        constructor() {
          this.x = -300;
          this.y = 500;
          this.targetX = 320;
          this.exitX = 1600;
          this.scale = 1;
          this.state = 'entering'; // 'entering' | 'idle' | 'excited' | 'exiting'
          this.walkCycle = 0;
          this.breathPhase = 0;
          this.sniffTimer = 0;
          this.sniffStrength = 0;
          this.blinkTimer = 2.4;
          this.blinkAmount = 0;
          this.earTwitch = 0;
          this.earTimer = 3.1;
          this.excitedTimer = 0;
          this.curiousTimer = 0;
          this.hopOffset = 0;
          this.bristle = 0;
          this.hovered = false;
          this.gazeX = 0;
          this.gazeY = -0.35;
          this.stepDustTimer = 0;

          this.variant = this.generateVariant();
          this.quills = this.generateQuillCoat();
        }

        generateVariant() {
          const paletteSet = [
            { furLight: '#e8d0ad', furMid: '#c49d6e', furDark: '#7b5535', pawLight: '#c48d6f', pawDark: '#87573f', quillMid: '#e6cfa3', quillBase: '#331d10', quillTip: '#241208', scaleMul: 1.00 },
            { furLight: '#efd9b8', furMid: '#cca372', furDark: '#865b37', pawLight: '#cb9373', pawDark: '#8f5c41', quillMid: '#edd8b0', quillBase: '#3c2313', quillTip: '#291509', scaleMul: 1.02 },
            { furLight: '#dfc6a4', furMid: '#b58d62', furDark: '#6f4c30', pawLight: '#b98569', pawDark: '#7b4f39', quillMid: '#dcc295', quillBase: '#2c180c', quillTip: '#1e0e06', scaleMul: 0.98 },
            { furLight: '#ead3b0', furMid: '#c99968', furDark: '#7d4f2c', pawLight: '#c68a6a', pawDark: '#845239', quillMid: '#ebd19c', quillBase: '#381e0e', quillTip: '#231106', scaleMul: 1.01 }
          ];
          return paletteSet[Math.floor(Math.random() * paletteSet.length)];
        }

        // Generates ~205 individual layered banded spines across the arched back
        generateQuillCoat() {
          const quills = [];
          const rows = 8;
          for (let r = 0; r < rows; r++) {
            const rowFrac = r / (rows - 1);
            const count = Math.round(29 - rowFrac * 7);
            for (let i = 0; i < count; i++) {
              const t = i / (count - 1);
              const archAngle = Math.PI * (1.06 - t * 0.98);
              const rx = 148 - rowFrac * 36;
              const ry = 102 - rowFrac * 25;
              const bx = -22 + Math.cos(archAngle) * rx + (Math.random() - 0.5) * 9;
              const by = 14 - Math.sin(archAngle) * ry + (Math.random() - 0.5) * 7;

              let qAngle = -archAngle - 0.32 - (1 - t) * 0.35 + (Math.random() - 0.5) * 0.24;
              if (t > 0.78) qAngle += (t - 0.78) * 1.4;

              const length = (42 + (1 - rowFrac * 0.25) * 20) * (0.85 + Math.random() * 0.3);
              const width = 4.6 + Math.random() * 2.2;
              const shade = 0.72 + rowFrac * 0.28 + (Math.random() - 0.5) * 0.12;
              const layer = rowFrac > 0.68 && Math.random() < 0.35 ? 'front' : 'back';

              quills.push({
                bx, by, angle: qAngle, length, width, shade, rowFrac, t, layer,
                jitterPhase: Math.random() * Math.PI * 2
              });
            }
          }
          quills.sort((a, b) => a.rowFrac - b.rowFrac || a.by - b.by);
          return quills;
        }

        configureLayout(w, h, resetPosition = false) {
          const targetWidth = Math.min(w * 0.35, h * 0.60);
          this.scale = (targetWidth / 390) * this.variant.scaleMul;
          this.targetX = w * 0.22;
          // Raised slightly so the newly lowered paws & shadow plant solidly on the leaf carpet
          this.y = h * 0.74;
          this.exitX = w + 260 * this.scale;
          if (resetPosition) {
            this.x = -255 * this.scale;
          } else if (this.state === 'idle' || this.state === 'excited') {
            this.x = this.targetX;
          }
        }

        spawnNew(w, h) {
          this.variant = this.generateVariant();
          this.quills = this.generateQuillCoat();
          this.configureLayout(w, h, true);
          this.state = 'entering';
          this.walkCycle = 0;
          this.hopOffset = 0;
          this.bristle = 0;
          this.excitedTimer = 0;
          this.curiousTimer = 0;
        }

        triggerExcited() {
          this.state = 'excited';
          this.excitedTimer = 0;
          this.sniffStrength = 1;
        }

        triggerCurious() {
          this.curiousTimer = 0.72;
          this.sniffStrength = 1;
          this.earTwitch = 1;
        }

        startExit() {
          this.state = 'exiting';
        }

        getQuillAnchor(slotIndex, totalSlots) {
          const layouts = totalSlots === 1
            ? [{ lx: -32, ly: -88, rot: -0.20 }]
            : [
                { lx: -95, ly: -66, rot: -0.40 },
                { lx: -24, ly: -94, rot: -0.05 },
                { lx: 44,  ly: -76, rot: 0.26 }
              ];
          const slot = layouts[slotIndex % layouts.length];
          const bob = this.getBodyBob();
          return {
            x: this.x + slot.lx * this.scale,
            y: this.y + (slot.ly + bob + this.hopOffset) * this.scale,
            rot: slot.rot
          };
        }

        getBodyBob() {
          if (this.state === 'entering' || this.state === 'exiting') {
            return Math.abs(Math.sin(this.walkCycle)) * -6.5;
          }
          return Math.sin(this.breathPhase * 2.2) * 2.1;
        }

        containsPoint(px, py) {
          if (this.state === 'exiting') return false;
          const lx = (px - this.x) / this.scale;
          const ly = (py - this.y) / this.scale;
          const bodyDist = ((lx + 24) * (lx + 24)) / (178 * 178) + ((ly + 4) * (ly + 4)) / (122 * 122);
          const headDist = ((lx - 135) * (lx - 135)) / (84 * 84) + ((ly - 12) * (ly - 12)) / (66 * 66);
          return bodyDist <= 1 || headDist <= 1;
        }

        update(dt, pointerX, pointerY, onPawStep) {
          this.breathPhase += dt;

          this.blinkTimer -= dt;
          if (this.blinkTimer <= 0) {
            this.blinkAmount = 1;
            if (this.blinkTimer <= -0.14) {
              this.blinkAmount = 0;
              this.blinkTimer = 2.4 + Math.random() * 3.2;
            }
          } else {
            this.blinkAmount = Math.max(0, this.blinkAmount - dt * 10);
          }

          this.sniffTimer -= dt;
          if (this.sniffTimer <= 0) {
            this.sniffStrength = 0.85;
            this.sniffTimer = 1.8 + Math.random() * 2.6;
          }
          if (this.hovered) {
            this.sniffStrength = Math.max(this.sniffStrength, 0.72);
          }
          this.sniffStrength = Math.max(0, this.sniffStrength - dt * 1.9);

          if (this.curiousTimer > 0) {
            this.curiousTimer = Math.max(0, this.curiousTimer - dt);
          }

          this.earTimer -= dt;
          if (this.earTimer <= 0) {
            this.earTwitch = 1;
            this.earTimer = 3.2 + Math.random() * 3.8;
          }
          this.earTwitch = Math.max(0, this.earTwitch - dt * 4.2);

          // Gaze tracking toward pointer or falling leaves
          const eyeWorldX = this.x + 126 * this.scale;
          const eyeWorldY = this.y - 4 * this.scale;
          const dx = (pointerX || this.x + 260) - eyeWorldX;
          const dy = (pointerY || this.y - 190) - eyeWorldY;
          const dist = Math.hypot(dx, dy) || 1;
          const targetGX = Math.max(-0.5, Math.min(0.85, dx / dist));
          const targetGY = Math.max(-0.75, Math.min(0.5, dy / dist));
          this.gazeX += (targetGX - this.gazeX) * Math.min(1, dt * 6);
          this.gazeY += (targetGY - this.gazeY) * Math.min(1, dt * 6);

          if (this.state === 'entering') {
            const speed = Math.max(245, this.targetX * 0.85);
            this.x += speed * dt;
            this.walkCycle += dt * 11.2;
            this.bristle = 0.14;
            this.stepDustTimer -= dt;
            if (this.stepDustTimer <= 0 && onPawStep) {
              this.stepDustTimer = 0.17;
              onPawStep(this.x + (Math.random() - 0.5) * 90 * this.scale, this.y + 102 * this.scale);
            }
            if (this.x >= this.targetX) {
              this.x = this.targetX;
              this.state = 'idle';
              this.sniffStrength = 1;
              this.earTwitch = 0.85;
            }
          } else if (this.state === 'idle') {
            this.walkCycle += (0 - Math.sin(this.walkCycle)) * Math.min(1, dt * 6);
            const targetBristle = this.hovered ? 0.42 : 0;
            this.bristle += (targetBristle - this.bristle) * Math.min(1, dt * 7);
            this.hopOffset *= Math.pow(0.05, dt);
          } else if (this.state === 'excited') {
            this.excitedTimer += dt;
            this.hopOffset = -Math.abs(Math.sin(this.excitedTimer * 8.5)) * 22 * Math.max(0, 1 - this.excitedTimer * 0.72);
            this.bristle = 0.55 + Math.sin(this.excitedTimer * 18) * 0.25;
            this.earTwitch = Math.abs(Math.sin(this.excitedTimer * 12));
          } else if (this.state === 'exiting') {
            const speed = Math.max(365, this.exitX * 0.45);
            this.x += speed * dt;
            this.walkCycle += dt * 13.2;
            this.hopOffset *= Math.pow(0.05, dt);
            this.bristle = 0.18;
            this.stepDustTimer -= dt;
            if (this.stepDustTimer <= 0 && onPawStep) {
              this.stepDustTimer = 0.14;
              onPawStep(this.x - 40 * this.scale, this.y + 102 * this.scale);
            }
          }
        }

        draw(ctx, time, drawAttachedCallback) {
          ctx.save();
          const bob = this.getBodyBob();
          let tilt = 0;
          if (this.state === 'entering' || this.state === 'exiting') {
            tilt = Math.sin(this.walkCycle) * 0.026;
          } else if (this.state === 'excited') {
            tilt = Math.sin(this.excitedTimer * 10) * 0.042;
          } else if (this.curiousTimer > 0) {
            tilt = -Math.sin((this.curiousTimer / 0.72) * Math.PI) * 0.055;
          }

          ctx.translate(this.x, this.y + (bob + this.hopOffset) * this.scale);
          ctx.scale(this.scale, this.scale);

          // 1. Soft Ambient Ground Shadow Anchored Right Beneath the Lowered Paws (y = 104)
          ctx.save();
          ctx.translate(0, -(bob + this.hopOffset));
          const shadowScale = Math.max(0.75, 1 + (this.hopOffset / 110));
          const shadowGrad = ctx.createRadialGradient(-8, 104, 16, -8, 104, 192 * shadowScale);
          shadowGrad.addColorStop(0, 'rgba(26, 11, 2, 0.56)');
          shadowGrad.addColorStop(0.58, 'rgba(34, 15, 4, 0.30)');
          shadowGrad.addColorStop(1, 'rgba(34, 15, 4, 0)');
          ctx.fillStyle = shadowGrad;
          ctx.beginPath();
          ctx.ellipse(-6, 104, 192 * shadowScale, 28 * shadowScale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.rotate(tilt);

          // Stride kinematics for all 4 jointed legs
          const walking = this.state === 'entering' || this.state === 'exiting';
          const walkA = Math.sin(this.walkCycle);
          const walkB = Math.sin(this.walkCycle + Math.PI);
          const liftA = walking ? Math.min(0, Math.cos(this.walkCycle) * 11) : 0;
          const liftB = walking ? Math.min(0, Math.cos(this.walkCycle + Math.PI) * 11) : 0;
          const hopDangle = this.state === 'excited' ? Math.max(0, -this.hopOffset * 0.25) : 0;

          // 2. FAR-SIDE LOWERED JOINTED LEGS & PAWS (Back-Right & Front-Right, shaded darker)
          // Hip roots start well inside the belly (y = 50), feet extend cleanly below belly to y = 93
          this.drawJointedLegAndPaw(ctx, {
            hipX: -58, hipY: 50,
            footX: -56 + (walking ? walkB * 19 : 0),
            footY: 93 + liftB + hopDangle,
            isFar: true,
            isBack: true
          });
          this.drawJointedLegAndPaw(ctx, {
            hipX: 74, hipY: 51,
            footX: 76 + (walking ? walkA * 19 : 0),
            footY: 94 + liftA + hopDangle,
            isFar: true,
            isBack: false
          });

          // 3. Soft Fur Underbelly & Rear Skirt (y spans from -20 to +78)
          const bellyGrad = ctx.createRadialGradient(18, 38, 12, 0, 28, 162);
          bellyGrad.addColorStop(0, this.variant.furLight);
          bellyGrad.addColorStop(0.65, this.variant.furMid);
          bellyGrad.addColorStop(1, this.variant.furDark);
          ctx.fillStyle = bellyGrad;
          ctx.beginPath();
          ctx.ellipse(-8, 30, 150, 48, -0.03, 0, Math.PI * 2);
          ctx.fill();

          // 4. Dark Quill Mantle Base Dome
          const domeGrad = ctx.createRadialGradient(-18, -36, 22, -26, 2, 175);
          domeGrad.addColorStop(0, '#5a3820');
          domeGrad.addColorStop(0.62, '#3a2212');
          domeGrad.addColorStop(1, '#231308');
          ctx.fillStyle = domeGrad;
          ctx.beginPath();
          ctx.ellipse(-28, 4, 152, 100, -0.08, Math.PI * 0.92, Math.PI * 2.08);
          ctx.quadraticCurveTo(100, 40, -172, 32);
          ctx.closePath();
          ctx.fill();

          // 5. Layered Individual Banded Quills (Back Mantle)
          this.drawQuillLayer(ctx, 'back', time);

          // 6. Carried Leaves Nestled Among Quills
          if (drawAttachedCallback) {
            drawAttachedCallback(ctx);
          }

          // 7. Foreground Overlapping Crown Quills
          this.drawQuillLayer(ctx, 'front', time);

          // 8. NEAR-SIDE LOWERED JOINTED LEGS & PAWS (Back-Left & Front-Left)
          // Drawn seamlessly blending from the lower belly fur (y = 48..54) down to y = 98..99
          this.drawJointedLegAndPaw(ctx, {
            hipX: -90, hipY: 48,
            footX: -88 + (walking ? walkA * 21 : 0),
            footY: 98 + liftA + hopDangle,
            isFar: false,
            isBack: true
          });
          this.drawJointedLegAndPaw(ctx, {
            hipX: 46, hipY: 50,
            footX: 50 + (walking ? walkB * 21 : 0),
            footY: 99 + liftB + hopDangle,
            isFar: false,
            isBack: false
          });

          // Soft belly-edge fur blend tuft over the top of the near-side hip joints for 100% organic fusion
          ctx.save();
          const blendGrad = ctx.createLinearGradient(0, 38, 0, 72);
          blendGrad.addColorStop(0, this.variant.furLight);
          blendGrad.addColorStop(0.6, this.variant.furMid);
          blendGrad.addColorStop(1, 'rgba(180, 134, 88, 0)');
          ctx.fillStyle = blendGrad;
          ctx.beginPath();
          ctx.ellipse(-86, 54, 30, 16, 0.12, 0, Math.PI * 2);
          ctx.ellipse(46, 56, 28, 15, -0.08, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 9. Soft Shaded Head, Cheek, Ear & Pointed Snout
          this.drawHeadAndFace(ctx, time);

          ctx.restore();
        }

        /**
         * Draws a realistic continuous furry haunch/upper-leg emerging from inside the lower belly,
         * tapering smoothly into the ankle and planted pinkish-brown paw with toes & tiny claws.
         * Never floats or detaches from the body at any point in the walk or hop cycle!
         */
        drawJointedLegAndPaw(ctx, { hipX, hipY, footX, footY, isFar, isBack }) {
          const v = this.variant;
          const ankleX = footX - 4;
          const ankleY = footY - 8;
          const kneeX = (hipX + ankleX) * 0.5 + (isBack ? -6 : 5);
          const kneeY = (hipY + ankleY) * 0.5 + 3;

          ctx.save();

          // 1. Continuous Furry Upper-Leg / Haunch Column (overlaps deep inside belly at hipY)
          const legGrad = ctx.createLinearGradient(hipX, hipY, ankleX, ankleY + 4);
          if (isFar) {
            legGrad.addColorStop(0.0, v.furDark);
            legGrad.addColorStop(0.55, '#6a462d');
            legGrad.addColorStop(1.0, v.pawDark);
          } else {
            legGrad.addColorStop(0.0, v.furMid);
            legGrad.addColorStop(0.45, '#b68c62');
            legGrad.addColorStop(0.82, '#9b6e4d');
            legGrad.addColorStop(1.0, v.pawLight);
          }

          const topHalfW = isBack ? 24 : 20;
          const botHalfW = 10.5;

          ctx.fillStyle = legGrad;
          ctx.beginPath();
          ctx.moveTo(hipX - topHalfW, hipY);
          ctx.quadraticCurveTo(kneeX - topHalfW * 0.72, kneeY, ankleX - botHalfW, ankleY + 2);
          ctx.lineTo(ankleX + botHalfW, ankleY + 2);
          ctx.quadraticCurveTo(kneeX + topHalfW * 0.68, kneeY, hipX + topHalfW, hipY);
          ctx.closePath();
          ctx.fill();

          // Subtle shadow crease on rear edge of near-side leg for 3D volume
          if (!isFar) {
            ctx.strokeStyle = 'rgba(72, 42, 22, 0.28)';
            ctx.lineWidth = 2.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(hipX - topHalfW * 0.78, hipY + 12);
            ctx.quadraticCurveTo(kneeX - topHalfW * 0.62, kneeY, ankleX - botHalfW * 0.85, ankleY);
            ctx.stroke();

            // Soft fine fur strokes along upper thigh
            ctx.strokeStyle = 'rgba(255, 236, 198, 0.32)';
            ctx.lineWidth = 1.3;
            for (let i = 0; i < 4; i++) {
              const t = 0.2 + i * 0.18;
              const fx = hipX + (ankleX - hipX) * t + (i % 2 === 0 ? -4 : 4);
              const fy = hipY + (ankleY - hipY) * t;
              ctx.beginPath();
              ctx.moveTo(fx, fy);
              ctx.lineTo(fx + 2, fy + 8);
              ctx.stroke();
            }
          }

          // 2. Planted Realistic Pinkish-Brown Paw Footpad & Toes
          ctx.translate(footX, footY);
          const pawGrad = ctx.createLinearGradient(0, -11, 0, 10);
          if (isFar) {
            pawGrad.addColorStop(0, '#784e38');
            pawGrad.addColorStop(1, '#4c2e1f');
