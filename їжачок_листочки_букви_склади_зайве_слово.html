          } else {
            pawGrad.addColorStop(0, v.pawLight);
            pawGrad.addColorStop(0.55, '#9d6a4f');
            pawGrad.addColorStop(1, v.pawDark);
          }
          ctx.fillStyle = pawGrad;
          ctx.beginPath();
          ctx.ellipse(2, 0, 21, 9.5, 0.04, 0, Math.PI * 2);
          ctx.fill();

          // Distinct little rounded toes & delicate curved dark claws
          const toes = [
            { tx: 16, ty: -3.5 },
            { tx: 21, ty: 0.5 },
            { tx: 17.5, ty: 4.8 }
          ];
          for (const toe of toes) {
            ctx.fillStyle = isFar ? '#66402c' : '#b27c60';
            ctx.beginPath();
            ctx.ellipse(toe.tx, toe.ty, 5.8, 3.4, 0.08, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#311d11';
            ctx.lineWidth = 1.65;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(toe.tx + 4.2, toe.ty);
            ctx.quadraticCurveTo(toe.tx + 8.6, toe.ty + 0.8, toe.tx + 8.4, toe.ty + 4.2);
            ctx.stroke();
          }

          ctx.restore();
        }

        drawQuillLayer(ctx, layerName, time) {
          const v = this.variant;
          for (const q of this.quills) {
            if (q.layer !== layerName) continue;
            const liveJitter = Math.sin(time * 3.5 + q.jitterPhase) * (0.018 + this.bristle * 0.06);
            const bristleLift = this.bristle * (0.14 * (0.4 + q.rowFrac * 0.6));
            const ang = q.angle + liveJitter - bristleLift;

            ctx.save();
            ctx.translate(q.bx, q.by);
            ctx.rotate(ang);

            const len = q.length;
            const hw = q.width * 0.5;

            const grad = ctx.createLinearGradient(0, 0, len, 0);
            grad.addColorStop(0.0, v.quillBase);
            grad.addColorStop(0.36, '#5c3b22');
            grad.addColorStop(0.56, v.quillMid);
            grad.addColorStop(0.76, '#f6e7c4');
            grad.addColorStop(0.88, '#4a2b17');
            grad.addColorStop(1.0, v.quillTip);

            ctx.fillStyle = grad;
            ctx.globalAlpha = Math.min(1, q.shade);
            ctx.beginPath();
            ctx.moveTo(0, -hw);
            ctx.quadraticCurveTo(len * 0.55, -hw * 0.72, len, 0);
            ctx.quadraticCurveTo(len * 0.55, hw * 0.72, 0, hw);
            ctx.closePath();
            ctx.fill();

            if (q.rowFrac > 0.52) {
              ctx.strokeStyle = 'rgba(255, 224, 146, 0.22)';
              ctx.lineWidth = 0.85;
              ctx.beginPath();
              ctx.moveTo(len * 0.35, -hw * 0.45);
              ctx.lineTo(len * 0.82, -hw * 0.12);
              ctx.stroke();
            }
            ctx.restore();
          }
          ctx.globalAlpha = 1;
        }

        drawHeadAndFace(ctx, time) {
          const v = this.variant;
          const sniffX = Math.sin(time * 24) * 2.3 * this.sniffStrength;
          const sniffY = Math.cos(time * 28) * 2.7 * this.sniffStrength;

          // Tapered furry head & snout silhouette
          const headGrad = ctx.createRadialGradient(118, 2, 14, 118, 16, 108);
          headGrad.addColorStop(0.0, v.furLight);
          headGrad.addColorStop(0.55, v.furMid);
          headGrad.addColorStop(0.92, v.furDark);
          headGrad.addColorStop(1.0, '#5a3a21');

          ctx.fillStyle = headGrad;
          ctx.beginPath();
          ctx.moveTo(56, -46);
          ctx.bezierCurveTo(106, -44, 148, -16, 206 + sniffX, 14 + sniffY);
          ctx.bezierCurveTo(212 + sniffX, 22 + sniffY, 198 + sniffX, 36 + sniffY, 162, 44);
          ctx.bezierCurveTo(126, 54, 86, 58, 56, 52);
          ctx.bezierCurveTo(42, 22, 42, -18, 56, -46);
          ctx.closePath();
          ctx.fill();

          // Warm darker snout bridge shading
          const bridgeGrad = ctx.createLinearGradient(96, -26, 204, 16);
          bridgeGrad.addColorStop(0, 'rgba(92, 58, 32, 0.42)');
          bridgeGrad.addColorStop(0.65, 'rgba(116, 76, 42, 0.22)');
          bridgeGrad.addColorStop(1, 'rgba(84, 52, 26, 0.45)');
          ctx.fillStyle = bridgeGrad;
          ctx.beginPath();
          ctx.moveTo(74, -38);
          ctx.quadraticCurveTo(140, -20, 204 + sniffX, 12 + sniffY);
          ctx.quadraticCurveTo(154, 10, 106, 4);
          ctx.closePath();
          ctx.fill();

          // Soft pale creamy cheek fur glow
          const cheekGrad = ctx.createRadialGradient(112, 28, 4, 112, 28, 40);
          cheekGrad.addColorStop(0, 'rgba(255, 240, 210, 0.62)');
          cheekGrad.addColorStop(1, 'rgba(255, 240, 210, 0)');
          ctx.fillStyle = cheekGrad;
          ctx.beginPath();
          ctx.ellipse(112, 28, 42, 24, 0.1, 0, Math.PI * 2);
          ctx.fill();

          // Fine procedural fur strokes on cheek & brow
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 238, 204, 0.34)';
          ctx.lineWidth = 1.2;
          ctx.lineCap = 'round';
          for (let i = 0; i < 24; i++) {
            const fx = 66 + (i % 6) * 16 + Math.sin(i * 3.1) * 5;
            const fy = -18 + Math.floor(i / 6) * 18 + Math.cos(i * 2.4) * 4;
            ctx.beginPath();
            ctx.moveTo(fx, fy);
            ctx.lineTo(fx + 9, fy + 3);
            ctx.stroke();
          }
          ctx.restore();

          // Rounded Velvety Ear
          ctx.save();
          ctx.translate(78, -24);
          ctx.rotate(-0.18 + Math.sin(time * 18) * 0.12 * this.earTwitch);
          const earGrad = ctx.createRadialGradient(-4, -4, 3, 0, 0, 24);
          earGrad.addColorStop(0, '#9c7150');
          earGrad.addColorStop(1, '#593922');
          ctx.fillStyle = earGrad;
          ctx.beginPath();
          ctx.ellipse(0, 0, 20, 23, -0.35, 0, Math.PI * 2);
          ctx.fill();

          const innerEarGrad = ctx.createRadialGradient(2, 2, 2, 0, 2, 15);
          innerEarGrad.addColorStop(0, '#dba98b');
          innerEarGrad.addColorStop(1, '#8c5a3e');
          ctx.fillStyle = innerEarGrad;
          ctx.beginPath();
          ctx.ellipse(2, 2, 12.5, 15, -0.35, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(244, 224, 192, 0.55)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(-6, 4);
          ctx.lineTo(5, 1);
          ctx.moveTo(-4, 9);
          ctx.lineTo(6, 7);
          ctx.stroke();
          ctx.restore();

          // Expressive Gentle Smile
          ctx.save();
          ctx.strokeStyle = '#4e2e18';
          ctx.lineWidth = 2.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          const smileLift = this.state === 'excited' ? -6 : (this.hovered ? -3 : 0);
          ctx.moveTo(154, 36);
          ctx.quadraticCurveTo(174, 40 + smileLift, 189 + sniffX * 0.5, 29 + smileLift + sniffY * 0.5);
          ctx.stroke();
          ctx.restore();

          // Delicate Curved Whiskers
          ctx.save();
          ctx.strokeStyle = 'rgba(248, 234, 208, 0.65)';
          ctx.lineWidth = 1.15;
          ctx.lineCap = 'round';
          const wOriginX = 178 + sniffX * 0.65;
          const wOriginY = 24 + sniffY * 0.65;
          const whiskerSpecs = [
            [-22, 8, -42, 18],
            [-20, 12, -38, 28],
            [-14, 15, -26, 36],
            [14, -4, 34, -8],
            [16, 2, 38, 6]
          ];
          for (const [cx, cy, ex, ey] of whiskerSpecs) {
            ctx.beginPath();
            ctx.moveTo(wOriginX, wOriginY);
            ctx.quadraticCurveTo(wOriginX + cx, wOriginY + cy, wOriginX + ex, wOriginY + ey + sniffY);
            ctx.stroke();
          }
          ctx.restore();

          // Glossy Dark Wet Nose
          ctx.save();
          ctx.translate(205 + sniffX, 16 + sniffY);
          const noseGrad = ctx.createRadialGradient(-4, -5, 2, 0, 0, 17);
          noseGrad.addColorStop(0, '#5a4337');
          noseGrad.addColorStop(0.45, '#261710');
          noseGrad.addColorStop(1, '#0d0603');
          ctx.fillStyle = noseGrad;
          ctx.beginPath();
          ctx.ellipse(0, 0, 14.5, 12.2, 0.15, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#070301';
          ctx.beginPath();
          ctx.ellipse(3, 2, 3.6, 2.2, -0.25, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 246, 224, 0.7)';
          ctx.beginPath();
          ctx.ellipse(-4.5, -4.5, 4.5, 2.3, -0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Realistic Glossy Eye with Specular Highlight, Gaze & Blink
          ctx.save();
          ctx.translate(128, -1);

          ctx.fillStyle = 'rgba(72, 42, 22, 0.35)';
          ctx.beginPath();
          ctx.ellipse(0, 1, 16.5, 14.5, 0, 0, Math.PI * 2);
          ctx.fill();

          if (this.state === 'excited' && this.excitedTimer < 0.78) {
            ctx.strokeStyle = '#251208';
            ctx.lineWidth = 4.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(0, 4, 11.5, Math.PI * 1.12, Math.PI * 1.88);
            ctx.stroke();
          } else {
            const eyeGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 13);
            eyeGrad.addColorStop(0, '#3a2214');
            eyeGrad.addColorStop(0.55, '#190c06');
            eyeGrad.addColorStop(1, '#090402');
            ctx.fillStyle = eyeGrad;
            ctx.beginPath();
            ctx.arc(0, 0, 12.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(176, 108, 46, 0.38)';
            ctx.beginPath();
            ctx.arc(this.gazeX * 2.5, 4.5 + this.gazeY * 1.5, 6.2, 0, Math.PI);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 252, 236, 0.94)';
            ctx.beginPath();
            ctx.ellipse(-3.6 + this.gazeX * 2.2, -4.2 + this.gazeY * 2.2, 4.2, 3.3, -0.35, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 236, 178, 0.65)';
            ctx.beginPath();
            ctx.arc(4.2 + this.gazeX * 1.4, 3.8 + this.gazeY * 1.2, 1.8, 0, Math.PI * 2);
            ctx.fill();

            if (this.blinkAmount > 0.02) {
              ctx.fillStyle = v.furMid;
              ctx.beginPath();
              ctx.arc(0, 0, 13.5, Math.PI, Math.PI * 2);
              ctx.rect(-14, -14, 28, 28 * this.blinkAmount);
              ctx.fill();
            }
          }
          ctx.restore();
        }
      }

      /* =======================================================================
         6. REALISTIC LARGE AUTUMN TASK LEAF (MAPLE, OAK, BIRCH)
         ======================================================================= */
      const LEAF_PALETTES = [
        { c1: '#fce26e', c2: '#eaa624', c3: '#bc5c10', vein: '#7c3608', edge: '#8f3f0a', spot: 'rgba(154, 62, 12, 0.20)' },
        { c1: '#fbd45c', c2: '#e1881b', c3: '#a8420c', vein: '#6e2806', edge: '#7d2f08', spot: 'rgba(130, 44, 8, 0.22)' },
        { c1: '#f9c254', c2: '#dc6f1c', c3: '#9a310a', vein: '#631d05', edge: '#732407', spot: 'rgba(108, 32, 8, 0.20)' },
        { c1: '#fdf088', c2: '#e7b42a', c3: '#b46a12', vein: '#733e09', edge: '#8a4c0c', spot: 'rgba(148, 80, 12, 0.19)' },
        { c1: '#f8cd5a', c2: '#da781d', c3: '#99360c', vein: '#612106', edge: '#752908', spot: 'rgba(116, 40, 10, 0.20)' }
      ];

      class TaskLeaf {
        constructor({ text, isOdd, species, palette, slotIndex, targetX, targetY, radius, delay }) {
          this.text = text;
          this.isOdd = isOdd;
          this.species = species;
          this.palette = palette;
          this.slotIndex = slotIndex;
          this.targetX = targetX;
          this.targetY = targetY;
          this.radius = radius;

          this.startX = targetX + (Math.random() - 0.5) * 140;
          this.startY = -radius * 1.45 - Math.random() * 75;
          this.x = this.startX;
          this.y = this.startY;
          this.rot = (Math.random() - 0.5) * 0.5;
          this.targetRot = (Math.random() - 0.5) * 0.15;
          this.scale = 1;
          this.alpha = 1;

          // 'falling' | 'floating' | 'collecting' | 'attached' | 'sweeping' | 'harmonyFloat'
          this.state = 'falling';
          this.delay = delay;
          this.fallProgress = 0;
          this.fallDuration = 1.05 + Math.random() * 0.25;
          this.swayPhase = Math.random() * Math.PI * 2;
          this.hovered = false;
          this.bounceTimer = 0;
          this.wobbleTimer = 0;
          this.glowIntensity = 0;

          this.collectT = 0;
          this.collectStartX = 0;
          this.collectStartY = 0;
          this.collectCtrlX = 0;
          this.collectCtrlY = 0;
          this.collectSlot = 0;
          this.collectTotal = 3;

          this.sweepVx = 0;
          this.sweepVy = 0;
          this.sweepRotV = 0;

          this.spots = [];
          for (let i = 0; i < 8; i++) {
            const ang = Math.random() * Math.PI * 2;
            const d = (0.2 + Math.random() * 0.55) * 0.85;
            this.spots.push({
              x: Math.cos(ang) * d,
              y: Math.sin(ang) * d,
              r: 0.035 + Math.random() * 0.052
            });
          }
        }

        updateTarget(targetX, targetY, radius) {
          this.targetX = targetX;
          this.targetY = targetY;
          this.radius = radius;
          if (this.state === 'floating') {
            this.x = targetX;
            this.y = targetY;
          }
        }

        triggerBounce() {
          this.bounceTimer = 0.52;
          this.glowIntensity = 1;
        }

        triggerWobble() {
          this.wobbleTimer = 0.56;
        }

        startCollect(slot, total, hedgehog) {
          this.state = 'collecting';
          this.collectT = 0;
          this.collectSlot = slot;
          this.collectTotal = total;
          this.collectStartX = this.x;
          this.collectStartY = this.y;
          const anchor = hedgehog.getQuillAnchor(slot, total);
          this.collectCtrlX = (this.x + anchor.x) * 0.5 + (Math.random() - 0.5) * 80;
          this.collectCtrlY = Math.min(this.y, anchor.y) - 110;
          this.glowIntensity = 1.2;
        }

        // Gentle breeze sweep (used when changing consonant filter or skipping)
        startSweep(direction = 1) {
          if (this.state === 'sweeping') return;
          this.state = 'sweeping';
          this.sweepVx = (310 + Math.random() * 220) * direction;
          this.sweepVy = -85 - Math.random() * 120;
          this.sweepRotV = (2.4 + Math.random() * 2.5) * direction;
        }

        // Golden harmony float upward for the 2 matching category leaves in Level 3
        startHarmonyFloat() {
          this.state = 'harmonyFloat';
          this.glowIntensity = 1.4;
          this.sweepVx = (Math.random() - 0.5) * 45;
          this.sweepVy = -95 - Math.random() * 35;
          this.sweepRotV = (Math.random() - 0.5) * 0.8;
        }

        containsPoint(px, py) {
          if (this.state !== 'floating' && this.state !== 'falling') return false;
          const dx = px - this.x;
          const dy = py - this.y;
          const r = this.radius * 0.94 * this.scale;
          return dx * dx + dy * dy <= r * r;
        }

        update(dt, hedgehog) {
          this.swayPhase += dt * 1.9;
          if (this.state !== 'harmonyFloat') {
            this.glowIntensity = Math.max(0, this.glowIntensity - dt * 1.8);
          }
          if (this.bounceTimer > 0) this.bounceTimer = Math.max(0, this.bounceTimer - dt);
          if (this.wobbleTimer > 0) this.wobbleTimer = Math.max(0, this.wobbleTimer - dt);

          if (this.state === 'falling') {
            if (this.delay > 0) {
              this.delay -= dt;
              return;
            }
            this.fallProgress = Math.min(1, this.fallProgress + dt / this.fallDuration);
            const ease = 1 - Math.pow(1 - this.fallProgress, 3);
            const swayAmp = (1 - this.fallProgress) * 60;
            const sway = Math.sin(this.fallProgress * Math.PI * 2.3 + this.swayPhase) * swayAmp;
            this.x = this.startX + (this.targetX - this.startX) * ease + sway;
            this.y = this.startY + (this.targetY - this.startY) * ease;
            this.rot = this.targetRot + Math.cos(this.fallProgress * Math.PI * 2.3 + this.swayPhase) * (1 - this.fallProgress) * 0.36;
            if (this.fallProgress >= 1) {
              this.state = 'floating';
            }
          } else if (this.state === 'floating') {
            const floatX = Math.sin(this.swayPhase * 0.72) * 5;
            const floatY = Math.cos(this.swayPhase * 0.95) * 6;
            this.x += (this.targetX + floatX - this.x) * Math.min(1, dt * 8);
            this.y += (this.targetY + floatY - this.y) * Math.min(1, dt * 8);

            let rotExtra = Math.sin(this.swayPhase * 0.65) * 0.045;
            let scaleTarget = this.hovered ? 1.08 : 1.0;

            if (this.bounceTimer > 0) {
              const p = this.bounceTimer / 0.52;
              scaleTarget += Math.sin(p * Math.PI * 2.5) * 0.14 * p;
              rotExtra += Math.sin(p * Math.PI * 3) * 0.16 * p;
            }
            if (this.wobbleTimer > 0) {
              const p = this.wobbleTimer / 0.56;
              this.x += Math.sin(p * Math.PI * 6) * 14 * p;
              rotExtra += Math.sin(p * Math.PI * 6) * 0.22 * p;
            }

            this.rot += (this.targetRot + rotExtra - this.rot) * Math.min(1, dt * 10);
            this.scale += (scaleTarget - this.scale) * Math.min(1, dt * 10);
          } else if (this.state === 'collecting') {
            this.collectT = Math.min(1, this.collectT + dt / 0.60);
            const t = 1 - Math.pow(1 - this.collectT, 2.4);
            const anchor = hedgehog.getQuillAnchor(this.collectSlot, this.collectTotal);
            const inv = 1 - t;
            this.x = inv * inv * this.collectStartX + 2 * inv * t * this.collectCtrlX + t * t * anchor.x;
            this.y = inv * inv * this.collectStartY + 2 * inv * t * this.collectCtrlY + t * t * anchor.y;
            this.scale = 1 - t * 0.44;
            this.rot = this.targetRot * (1 - t) + anchor.rot * t + Math.sin(t * Math.PI) * 0.65;

            if (this.collectT >= 1) {
              this.state = 'attached';
            }
          } else if (this.state === 'attached') {
            const anchor = hedgehog.getQuillAnchor(this.collectSlot, this.collectTotal);
            this.x = anchor.x;
            this.y = anchor.y;
            this.rot = anchor.rot;
            this.scale = 0.56;
          } else if (this.state === 'sweeping') {
            this.x += this.sweepVx * dt;
            this.y += this.sweepVy * dt;
            this.sweepVy += 190 * dt;
            this.rot += this.sweepRotV * dt;
            this.alpha = Math.max(0, this.alpha - dt * 1.9);
          } else if (this.state === 'harmonyFloat') {
            this.x += (this.sweepVx + Math.sin(this.swayPhase * 1.5) * 18) * dt;
            this.y += this.sweepVy * dt;
            this.rot += this.sweepRotV * dt;
            this.scale += dt * 0.08;
            this.alpha = Math.max(0, this.alpha - dt * 0.95);
          }
        }

        draw(ctx) {
          if (this.alpha <= 0.01) return;
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rot);
          ctx.scale(this.scale, this.scale);

          const r = this.radius;

          const aura = Math.max(this.glowIntensity, this.hovered && this.state === 'floating' ? 0.68 : 0);
          if (aura > 0.02) {
            const glowGrad = ctx.createRadialGradient(0, 0, r * 0.25, 0, 0, r * 1.42);
            glowGrad.addColorStop(0, `rgba(255, 244, 168, ${0.46 * Math.min(1.2, aura)})`);
            glowGrad.addColorStop(0.6, `rgba(255, 202, 76, ${0.24 * Math.min(1.2, aura)})`);
            glowGrad.addColorStop(1, 'rgba(255, 198, 72, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.42, 0, Math.PI * 2);
            ctx.fill();
          }

          // Soft ambient drop shadow
          ctx.save();
          ctx.translate(6, 12);
          ctx.fillStyle = 'rgba(38, 17, 4, 0.28)';
          this.traceLeafSilhouette(ctx, r);
          ctx.fill();
          ctx.restore();

          // Curved Wooden Petiole (Stem)
          ctx.save();
          ctx.strokeStyle = this.palette.edge;
          ctx.lineWidth = Math.max(3, r * 0.052);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, r * 0.72);
          ctx.quadraticCurveTo(r * 0.06, r * 1.05, r * 0.16, r * 1.2);
          ctx.stroke();
          ctx.restore();

          // Main Botanical Leaf Body
          this.traceLeafSilhouette(ctx, r);
          const grad = ctx.createRadialGradient(-r * 0.24, -r * 0.28, r * 0.08, 0, r * 0.08, r * 1.15);
          grad.addColorStop(0.0, this.palette.c1);
          grad.addColorStop(0.56, this.palette.c2);
          grad.addColorStop(1.0, this.palette.c3);
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.save();
          this.traceLeafSilhouette(ctx, r);
          ctx.clip();
          ctx.fillStyle = this.palette.spot;
          for (const sp of this.spots) {
            ctx.beginPath();
            ctx.arc(sp.x * r, sp.y * r, sp.r * r, 0, Math.PI * 2);
            ctx.fill();
          }

          const sheen = ctx.createLinearGradient(-r, -r, r * 0.4, r * 0.4);
          sheen.addColorStop(0, 'rgba(255, 250, 206, 0.34)');
          sheen.addColorStop(0.48, 'rgba(255, 245, 190, 0.06)');
          sheen.addColorStop(1, 'rgba(92, 32, 5, 0.16)');
          ctx.fillStyle = sheen;
          ctx.fillRect(-r * 1.3, -r * 1.3, r * 2.6, r * 2.6);

          this.drawLeafVeins(ctx, r);
          ctx.restore();

          this.traceLeafSilhouette(ctx, r);
          ctx.strokeStyle = this.wobbleTimer > 0 ? '#7d2208' : this.palette.edge;
          ctx.lineWidth = Math.max(1.8, r * 0.022);
          ctx.stroke();

          this.drawLeafText(ctx, r);

          ctx.restore();
        }

        traceLeafSilhouette(ctx, r) {
          ctx.beginPath();
          if (this.species === 'maple') {
            ctx.moveTo(0, r * 0.82);
            ctx.bezierCurveTo(-r * 0.32, r * 0.84, -r * 0.72, r * 0.62, -r * 0.92, r * 0.32);
            ctx.quadraticCurveTo(-r * 0.74, r * 0.18, -r * 1.02, -r * 0.08);
            ctx.bezierCurveTo(-r * 0.76, -r * 0.22, -r * 0.78, -r * 0.56, -r * 0.56, -r * 0.72);
            ctx.quadraticCurveTo(-r * 0.34, -r * 0.56, -r * 0.24, -r * 0.76);
            ctx.quadraticCurveTo(-r * 0.12, -r * 0.94, 0, -r * 1.05);
            ctx.quadraticCurveTo(r * 0.12, -r * 0.94, r * 0.24, -r * 0.76);
            ctx.quadraticCurveTo(r * 0.34, -r * 0.56, r * 0.56, -r * 0.72);
            ctx.bezierCurveTo(r * 0.78, -r * 0.56, r * 0.76, -r * 0.22, r * 1.02, -r * 0.08);
            ctx.quadraticCurveTo(r * 0.74, r * 0.18, r * 0.92, r * 0.32);
            ctx.bezierCurveTo(r * 0.72, r * 0.62, r * 0.32, r * 0.84, 0, r * 0.82);
          } else if (this.species === 'oak') {
            ctx.moveTo(0, r * 0.86);
            ctx.bezierCurveTo(-r * 0.38, r * 0.86, -r * 0.78, r * 0.66, -r * 0.80, r * 0.38);
            ctx.bezierCurveTo(-r * 0.64, r * 0.26, -r * 0.96, r * 0.10, -r * 0.92, -r * 0.14);
            ctx.bezierCurveTo(-r * 0.86, -r * 0.34, -r * 0.64, -r * 0.36, -r * 0.72, -r * 0.58);
            ctx.bezierCurveTo(-r * 0.62, -r * 0.82, -r * 0.34, -r * 0.76, -r * 0.26, -r * 0.94);
            ctx.bezierCurveTo(-r * 0.12, -r * 1.08, r * 0.12, -r * 1.08, r * 0.26, -r * 0.94);
            ctx.bezierCurveTo(r * 0.34, -r * 0.76, r * 0.62, -r * 0.82, r * 0.72, -r * 0.58);
            ctx.bezierCurveTo(r * 0.64, -r * 0.36, r * 0.86, -r * 0.34, r * 0.92, -r * 0.14);
            ctx.bezierCurveTo(r * 0.96, r * 0.10, r * 0.64, r * 0.26, r * 0.80, r * 0.38);
            ctx.bezierCurveTo(r * 0.78, r * 0.66, r * 0.38, r * 0.86, 0, r * 0.86);
          } else {
            ctx.moveTo(0, r * 0.86);
            ctx.bezierCurveTo(-r * 0.66, r * 0.92, -r * 1.02, r * 0.34, -r * 0.88, -r * 0.22);
            ctx.bezierCurveTo(-r * 0.74, -r * 0.66, -r * 0.28, -r * 0.88, 0, -r * 1.06);
            ctx.bezierCurveTo(r * 0.28, -r * 0.88, r * 0.74, -r * 0.66, r * 0.88, -r * 0.22);
            ctx.bezierCurveTo(r * 1.02, r * 0.34, r * 0.66, r * 0.92, 0, r * 0.86);
          }
          ctx.closePath();
        }

        drawLeafVeins(ctx, r) {
          ctx.save();
          ctx.strokeStyle = this.palette.vein;
          ctx.globalAlpha = 0.24;
          ctx.lineCap = 'round';

          ctx.lineWidth = Math.max(1.8, r * 0.028);
          ctx.beginPath();
          ctx.moveTo(0, r * 0.82);
          ctx.quadraticCurveTo(r * 0.02, 0, 0, -r * 0.92);
          ctx.stroke();

          ctx.lineWidth = Math.max(1.1, r * 0.016);
          if (this.species === 'maple') {
            const branches = [
              [-0.78, 0.24], [0.78, 0.24],
              [-0.86, -0.10], [0.86, -0.10],
              [-0.48, -0.62], [0.48, -0.62]
            ];
            for (const [bx, by] of branches) {
              ctx.beginPath();
              ctx.moveTo(0, r * 0.42);
              ctx.quadraticCurveTo(bx * r * 0.45, by * r * 0.45 + r * 0.16, bx * r, by * r);
              ctx.stroke();
            }
          } else {
            for (let i = -2; i <= 2; i++) {
              const sy = i * r * 0.24;
              const span = (1 - Math.abs(i) * 0.18) * r * 0.72;
              for (const side of [-1, 1]) {
                ctx.beginPath();
                ctx.moveTo(0, sy + r * 0.16);
                ctx.quadraticCurveTo(side * span * 0.5, sy + r * 0.02, side * span, sy - r * 0.16);
                ctx.stroke();
              }
            }
          }
          ctx.restore();
        }

        drawLeafText(ctx, r) {
          const text = this.text;
          const len = text.length;
          let fontSize;
          if (len === 1) {
            fontSize = r * 0.96;
          } else if (len === 2) {
            fontSize = r * 0.68;
          } else {
            fontSize = r * 0.39;
          }

          ctx.font = `900 ${fontSize}px 'Nunito', 'Trebuchet MS', sans-serif`;
          const maxWidth = r * 1.48;
          const measured = ctx.measureText(text).width;
          if (measured > maxWidth) {
            fontSize = fontSize * (maxWidth / measured);
            ctx.font = `900 ${fontSize}px 'Nunito', 'Trebuchet MS', sans-serif`;
          }

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const textY = r * 0.04;

          ctx.lineJoin = 'round';
          ctx.lineWidth = Math.max(4, fontSize * 0.16);
          ctx.strokeStyle = 'rgba(255, 242, 184, 0.78)';
          ctx.strokeText(text, 0, textY);

          ctx.fillStyle = '#2A1407';
          ctx.fillText(text, 0, textY);
        }
      }

      /* =======================================================================
         7. 5 DISTINCT ACTIVE NON-VERBAL CELEBRATIONS & PARTICLE SYSTEM
         ======================================================================= */
      class EffectsSystem {
        constructor() {
          this.particles = [];
          this.ripples = [];
          this.sunBurst = null;
          this.lastVariant = -1;
        }

        spawnPawRustle(x, y) {
          const colors = ['#d9841b', '#b85c14', '#ecc048', '#8d3b0e'];
          for (let i = 0; i < 4; i++) {
            this.particles.push({
              kind: 'speck',
              x: x + (Math.random() - 0.5) * 28,
              y: y + (Math.random() - 0.5) * 8,
              vx: -30 - Math.random() * 55,
              vy: -35 - Math.random() * 45,
              size: 3 + Math.random() * 4,
              rot: Math.random() * Math.PI,
              rotV: (Math.random() - 0.5) * 8,
              color: colors[Math.floor(Math.random() * colors.length)],
              life: 0.45 + Math.random() * 0.25,
              maxLife: 0.7,
              gravity: 210
            });
          }
        }

        spawnClickSparkles(x, y, count = 14) {
          const colors = ['#fff3a8', '#ffd24d', '#f59c24', '#ffe780'];
          for (let i = 0; i < count; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 65 + Math.random() * 145;
            this.particles.push({
              kind: 'spark',
              x, y,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd - 35,
              size: 3 + Math.random() * 4.5,
              color: colors[Math.floor(Math.random() * colors.length)],
              life: 0.55 + Math.random() * 0.35,
              maxLife: 0.9,
              gravity: 140
            });
          }
        }

        spawnWrongSpecks(x, y) {
          const colors = ['#a84610', '#80310a', '#d47c22'];
          for (let i = 0; i < 9; i++) {
            this.particles.push({
              kind: 'speck',
              x: x + (Math.random() - 0.5) * 50,
              y: y + (Math.random() - 0.5) * 35,
              vx: (Math.random() - 0.5) * 90,
              vy: 20 + Math.random() * 70,
              size: 3 + Math.random() * 3.5,
              rot: Math.random() * Math.PI,
              rotV: (Math.random() - 0.5) * 7,
              color: colors[Math.floor(Math.random() * colors.length)],
              life: 0.55 + Math.random() * 0.25,
              maxLife: 0.8,
              gravity: 190
            });
          }
        }

        // Picks a non-repeating random celebration variant from 0..4 and returns it for synced audio
        spawnCelebration(x, y, floorY) {
          let variant = Math.floor(Math.random() * 5);
          if (variant === this.lastVariant) {
            variant = (variant + 1 + Math.floor(Math.random() * 3)) % 5;
          }
          this.lastVariant = variant;

          if (variant === 0) {
            // 1. Swirling Golden Autumn Leaf Vortex
            const colors = ['#fce05e', '#f2a826', '#df6d18', '#f9c83c', '#c95012'];
            for (let i = 0; i < 36; i++) {
              const ang = (i / 36) * Math.PI * 2;
              this.particles.push({
                kind: 'vortexLeaf',
                cx: x, cy: y - 20,
                angle: ang,
                radius: 26 + Math.random() * 48,
                radialSpeed: 98 + Math.random() * 92,
                angSpeed: 2.7 + Math.random() * 1.4,
                vy: -88 - Math.random() * 95,
                size: 8.5 + Math.random() * 9,
                rot: Math.random() * Math.PI * 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: 1.4 + Math.random() * 0.45,
                maxLife: 1.85
              });
            }
          } else if (variant === 1) {
            // 2. Shower of Glowing Forest Fireflies & Golden Stardust Sparkles
            for (let i = 0; i < 34; i++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 45 + Math.random() * 115;
              this.particles.push({
                kind: 'firefly',
                x: x + (Math.random() - 0.5) * 150,
                y: y + (Math.random() - 0.5) * 90,
                vx: Math.cos(ang) * spd,
                vy: -80 - Math.random() * 115,
                phase: Math.random() * Math.PI * 2,
                size: 4.5 + Math.random() * 5.5,
                life: 1.55 + Math.random() * 0.5,
                maxLife: 2.05
              });
            }
            for (let i = 0; i < 24; i++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 90 + Math.random() * 180;
              this.particles.push({
                kind: 'spark',
                x, y: y - 25,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 65,
                size: 3.5 + Math.random() * 4.5,
                color: i % 2 === 0 ? '#fff6bd' : '#ffd858',
                life: 1.1 + Math.random() * 0.4,
                maxLife: 1.5,
                gravity: 165
              });
            }
          } else if (variant === 2) {
            // 3. Playful Bouncing Acorns & Woodland Berries Popping Across the Mossy Floor
            const ground = floorY || y + 115;
            for (let i = 0; i < 16; i++) {
              const isAcorn = i % 2 === 0;
              this.particles.push({
                kind: isAcorn ? 'acorn' : 'berry',
                x: x + (Math.random() - 0.5) * 90,
                y: y - 30,
                vx: (Math.random() - 0.5) * 320,
                vy: -220 - Math.random() * 190,
                rot: Math.random() * Math.PI * 2,
                rotV: (Math.random() - 0.5) * 9,
                size: isAcorn ? 10 + Math.random() * 4 : 6.5 + Math.random() * 3.5,
                color: isAcorn ? '#9c5620' : (Math.random() > 0.45 ? '#cc2d1a' : '#e65b1c'),
                groundY: ground + (Math.random() - 0.5) * 24,
                life: 1.75 + Math.random() * 0.4,
                maxLife: 2.15,
                gravity: 680
              });
            }
          } else if (variant === 3) {
            // 4. Radiant Sunbeam Burst & Rainbow-Gold Bokeh Halos
            this.sunBurst = { x, y: y - 28, life: 1.25, maxLife: 1.25 };
            for (let r = 0; r < 3; r++) {
              this.ripples.push({
                x, y: y - 25,
                radius: 26,
                maxRadius: 230 + r * 65,
                delay: r * 0.13,
                life: 1.05,
                maxLife: 1.05
              });
            }
            const bokehColors = [
              'rgba(255, 240, 150, 0.55)',
              'rgba(255, 206, 98, 0.50)',
              'rgba(255, 178, 110, 0.48)',
              'rgba(245, 232, 130, 0.52)',
              'rgba(255, 224, 175, 0.48)'
            ];
            for (let i = 0; i < 24; i++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 55 + Math.random() * 135;
              this.particles.push({
                kind: 'bokeh',
                x: x + (Math.random() - 0.5) * 80,
                y: y - 25 + (Math.random() - 0.5) * 60,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 35,
                size: 12 + Math.random() * 20,
                color: bokehColors[i % bokehColors.length],
                life: 1.35 + Math.random() * 0.45,
                maxLife: 1.8
              });
            }
          } else {
            // 5. Musical Notes & Tiny Fluttering Forest Butterflies
            const butterflyPalettes = [
              ['#ffba38', '#d95414'],
              ['#ffe066', '#e68a1c'],
              ['#f58e2c', '#9c2d0d']
            ];
            for (let i = 0; i < 10; i++) {
              const pal = butterflyPalettes[i % butterflyPalettes.length];
              const ang = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.9;
              const spd = 75 + Math.random() * 105;
              this.particles.push({
                kind: 'butterfly',
                x: x + (Math.random() - 0.5) * 100,
                y: y - 20 + (Math.random() - 0.5) * 50,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 40,
                flapPhase: Math.random() * Math.PI * 2,
                size: 9 + Math.random() * 5,
                c1: pal[0],
                c2: pal[1],
                life: 1.7 + Math.random() * 0.4,
                maxLife: 2.1
              });
            }
            for (let i = 0; i < 14; i++) {
              const ang = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.7;
              const spd = 85 + Math.random() * 120;
              this.particles.push({
                kind: 'note',
                x: x + (Math.random() - 0.5) * 110,
                y: y - 35,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 45,
                swayPhase: Math.random() * Math.PI * 2,
                size: 12 + Math.random() * 6,
                doubleNote: i % 2 === 0,
                color: i % 2 === 0 ? '#ffe57a' : '#ffb838',
                life: 1.45 + Math.random() * 0.4,
                maxLife: 1.85
              });
            }
          }

          return variant;
        }

        update(dt) {
          if (this.sunBurst) {
            this.sunBurst.life -= dt;
            if (this.sunBurst.life <= 0) this.sunBurst = null;
          }

          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life -= dt;
            if (p.life <= 0) {
              this.particles.splice(i, 1);
              continue;
            }

            if (p.kind === 'spark' || p.kind === 'speck') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += p.gravity * dt;
              p.vx *= Math.pow(0.45, dt);
              if (p.rotV) p.rot += p.rotV * dt;
            } else if (p.kind === 'vortexLeaf') {
              p.angle += p.angSpeed * dt;
              p.radius += p.radialSpeed * dt;
              p.cy += p.vy * dt;
              p.x = p.cx + Math.cos(p.angle) * p.radius;
              p.y = p.cy + Math.sin(p.angle) * p.radius * 0.48;
              p.rot += 3.8 * dt;
            } else if (p.kind === 'firefly') {
              p.phase += dt * 5.2;
              p.x += (p.vx + Math.sin(p.phase) * 42) * dt;
              p.y += p.vy * dt;
              p.vx *= Math.pow(0.55, dt);
            } else if (p.kind === 'acorn' || p.kind === 'berry') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += p.gravity * dt;
              p.rot += p.rotV * dt;
              if (p.y > p.groundY) {
                p.y = p.groundY;
                p.vy = -Math.abs(p.vy) * 0.56;
                p.vx *= 0.78;
                p.rotV *= 0.75;
              }
            } else if (p.kind === 'bokeh') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= Math.pow(0.42, dt);
              p.vy *= Math.pow(0.42, dt);
            } else if (p.kind === 'butterfly') {
              p.flapPhase += dt * 16;
              p.x += (p.vx + Math.sin(p.flapPhase * 0.35) * 45) * dt;
              p.y += (p.vy + Math.cos(p.flapPhase * 0.45) * 28) * dt;
              p.vx *= Math.pow(0.75, dt);
            } else if (p.kind === 'note') {
              p.swayPhase += dt * 4.2;
              p.x += (p.vx + Math.sin(p.swayPhase) * 24) * dt;
              p.y += p.vy * dt;
              p.vx *= Math.pow(0.6, dt);
            }
          }

          for (let i = this.ripples.length - 1; i >= 0; i--) {
            const rp = this.ripples[i];
            if (rp.delay > 0) {
              rp.delay -= dt;
              continue;
            }
            rp.life -= dt * 1.1;
            if (rp.life <= 0) {
              this.ripples.splice(i, 1);
              continue;
            }
            const t = 1 - rp.life / rp.maxLife;
            rp.radius = 24 + (rp.maxRadius - 24) * (1 - Math.pow(1 - t, 2.2));
          }
        }

        draw(ctx) {
          // Radiant Rotating Sunbeam Burst (Celebration #4)
          if (this.sunBurst) {
            const sb = this.sunBurst;
            const prog = 1 - sb.life / sb.maxLife;
            const alpha = Math.sin(prog * Math.PI) * 0.45;
            ctx.save();
            ctx.translate(sb.x, sb.y);
            ctx.rotate(prog * 0.65);
            ctx.globalCompositeOperation = 'screen';
            const rays = 12;
            for (let i = 0; i < rays; i++) {
              ctx.rotate((Math.PI * 2) / rays);
              const grad = ctx.createLinearGradient(0, 0, 0, -240);
              grad.addColorStop(0, `rgba(255, 245, 178, ${alpha})`);
              grad.addColorStop(1, 'rgba(255, 210, 90, 0)');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.moveTo(-6, 0);
              ctx.lineTo(-26, -240);
              ctx.lineTo(26, -240);
              ctx.lineTo(6, 0);
              ctx.closePath();
              ctx.fill();
            }
            ctx.restore();
          }

          // Shimmering Honey Ripples
          for (const rp of this.ripples) {
            if (rp.delay > 0) continue;
            const alpha = Math.max(0, rp.life / rp.maxLife) * 0.55;
            ctx.save();
            ctx.strokeStyle = `rgba(255, 224, 114, ${alpha})`;
            ctx.lineWidth = 4 * (rp.life / rp.maxLife) + 1;
            ctx.beginPath();
            ctx.arc(rp.x, rp.y, rp.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          for (const p of this.particles) {
            const alpha = Math.min(1, p.life / (p.maxLife * 0.42));
            ctx.save();
            ctx.globalAlpha = alpha;

            if (p.kind === 'spark') {
              ctx.translate(p.x, p.y);
              ctx.fillStyle = p.color;
              const s = p.size;
              ctx.beginPath();
              ctx.moveTo(0, -s * 1.4);
              ctx.quadraticCurveTo(s * 0.25, -s * 0.25, s * 1.4, 0);
              ctx.quadraticCurveTo(s * 0.25, s * 0.25, 0, s * 1.4);
              ctx.quadraticCurveTo(-s * 0.25, s * 0.25, -s * 1.4, 0);
              ctx.quadraticCurveTo(-s * 0.25, -s * 0.25, 0, -s * 1.4);
              ctx.fill();
            } else if (p.kind === 'firefly') {
              const pulse = 0.65 + 0.35 * Math.sin(p.phase * 2.2);
              const grad = ctx.createRadialGradient(p.x, p.y, 0.5, p.x, p.y, p.size * 2.6);
              grad.addColorStop(0, `rgba(255, 254, 212, ${pulse})`);
              grad.addColorStop(0.45, `rgba(255, 212, 82, ${0.65 * pulse})`);
              grad.addColorStop(1, 'rgba(255, 190, 48, 0)');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size * 2.6, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.kind === 'vortexLeaf' || p.kind === 'speck') {
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rot || 0);
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.moveTo(-p.size, 0);
              ctx.quadraticCurveTo(0, -p.size * 0.65, p.size, 0);
              ctx.quadraticCurveTo(0, p.size * 0.65, -p.size, 0);
              ctx.fill();
            } else if (p.kind === 'acorn') {
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rot);
              const s = p.size;
              // Glossy nut body
              ctx.fillStyle = '#a85f24';
              ctx.beginPath();
              ctx.ellipse(0, s * 0.18, s * 0.62, s * 0.78, 0, 0, Math.PI * 2);
              ctx.fill();
              // Textured dark oak cap
              ctx.fillStyle = '#5c3112';
              ctx.beginPath();
              ctx.ellipse(0, -s * 0.36, s * 0.72, s * 0.42, 0, Math.PI, Math.PI * 2);
              ctx.closePath();
              ctx.fill();
              // Stem nub
              ctx.strokeStyle = '#3d1e08';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(0, -s * 0.74);
              ctx.lineTo(2, -s * 1.05);
              ctx.stroke();
            } else if (p.kind === 'berry') {
              ctx.translate(p.x, p.y);
              const s = p.size;
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(0, 0, s, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = 'rgba(255, 240, 200, 0.55)';
              ctx.beginPath();
              ctx.arc(-s * 0.3, -s * 0.3, s * 0.28, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.kind === 'bokeh') {
              const grad = ctx.createRadialGradient(p.x, p.y, p.size * 0.1, p.x, p.y, p.size);
              grad.addColorStop(0, p.color);
              grad.addColorStop(0.75, p.color);
              grad.addColorStop(1, 'rgba(255, 230, 140, 0)');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.kind === 'butterfly') {
              ctx.translate(p.x, p.y);
              const wingScale = 0.25 + 0.75 * Math.abs(Math.sin(p.flapPhase));
              const s = p.size;
              ctx.fillStyle = p.c1;
              ctx.strokeStyle = p.c2;
              ctx.lineWidth = 1.4;
              for (const side of [-1, 1]) {
                ctx.save();
                ctx.scale(side * wingScale, 1);
                ctx.beginPath();
                ctx.ellipse(s * 0.65, -s * 0.25, s * 0.72, s * 0.48, -0.35, 0, Math.PI * 2);
                ctx.ellipse(s * 0.48, s * 0.35, s * 0.52, s * 0.36, 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
              }
              ctx.fillStyle = '#3b1e0a';
              ctx.beginPath();
              ctx.ellipse(0, 0, 2, s * 0.55, 0, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.kind === 'note') {
              ctx.translate(p.x, p.y);
              ctx.fillStyle = p.color;
              ctx.strokeStyle = '#632e08';
              ctx.lineWidth = 2.2;
              const s = p.size;
              // Drawn procedural musical eighth/beamed note (zero emoji!)
              ctx.beginPath();
              ctx.ellipse(-s * 0.3, s * 0.35, s * 0.36, s * 0.26, -0.35, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(0, s * 0.28);
              ctx.lineTo(0, -s * 0.85);
              if (p.doubleNote) {
                ctx.lineTo(s * 0.75, -s * 1.05);
                ctx.lineTo(s * 0.75, 0.08 * s);
                ctx.stroke();
                ctx.beginPath();
                ctx.ellipse(s * 0.45, s * 0.15, s * 0.36, s * 0.26, -0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
              } else {
                ctx.quadraticCurveTo(s * 0.6, -s * 0.65, s * 0.45, -s * 0.22);
                ctx.stroke();
              }
            }
            ctx.restore();
          }
        }
      }

      /* =======================================================================
         8. MAIN GAME ENGINE & FOOLPROOF CONSONANT SELECTOR CONTROLLER
         ======================================================================= */
      class AutumnHedgehogGame {
        constructor() {
          this.canvas = document.getElementById('gameCanvas');
          this.ctx = this.canvas.getContext('2d');

          this.lang = 'uk';
          this.level = 1;
          // CRITICAL UX FIX: Empty Set means "ALL consonants active"!
          // Clicking any letter (e.g. Р, С) adds it to the Set, lights it up brightly,
          // and immediately dims all unselected letters!
          this.selectedConsonants = {
            uk: new Set(),
            ru: new Set()
          };
          this.trayOpen = false;
          this.filterRefreshTimer = null;

          this.memory = new MemoryManager();
          this.sound = new SoundEngine();
          this.forest = new ForestScene();
          this.hedgehog = new Hedgehog();
          this.effects = new EffectsSystem();

          this.leaves = [];
          this.sweepingLeaves = [];
          this.roundState = 'playing'; // 'playing' | 'collecting' | 'exiting'
          this.collectDelayTimer = 0;

          this.pointerX = 0;
          this.pointerY = 0;
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.dpr = Math.min(window.devicePixelRatio || 1, 2);
          this.lastTime = 0;
          this.elapsed = 0;

          this.bindDOM();
          this.handleResize(true);
          this.buildConsonantTray();
          this.startNewRound(true);

          requestAnimationFrame((t) => this.loop(t));
        }

        stopUiPropagation(el) {
          ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach((ev) => {
            el.addEventListener(ev, (e) => e.stopPropagation());
          });
        }

        bindDOM() {
          const uiTop = document.getElementById('uiTop');
          const consonantTray = document.getElementById('consonantTray');
          this.stopUiPropagation(uiTop);
          this.stopUiPropagation(consonantTray);

          // Level buttons (1, 2, 3)
          for (const lvl of [1, 2, 3]) {
            document.getElementById(`lvlBtn${lvl}`).addEventListener('click', (e) => {
              e.stopPropagation();
              this.sound.playUiTap(true);
              this.setLevel(lvl);
            });
          }

          // Single Language Toggle (укр / рус)
          const langBtn = document.getElementById('langBtn');
          langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.sound.playUiTap(true);
            this.lang = this.lang === 'uk' ? 'ru' : 'uk';
            langBtn.textContent = CONTENT[this.lang].label;
            this.buildConsonantTray();
            this.skipToNextRound();
          });

          // Sound Mute / Unmute
          const soundBtn = document.getElementById('soundBtn');
          soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const muted = this.sound.toggleMute();
            document.getElementById('soundIconOn').style.display = muted ? 'none' : 'block';
            document.getElementById('soundIconOff').style.display = muted ? 'block' : 'none';
            if (!muted) this.sound.playUiTap(true);
          });

          // Level 2 Tray Toggle Button in Top Bar
          document.getElementById('consToggleBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            this.sound.playUiTap(false);
            this.setTrayOpen(!this.trayOpen);
          });

          // Collapse Chevron Inside Tray
          document.getElementById('consCollapseBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            this.sound.playUiTap(false);
            this.setTrayOpen(false);
          });

          // Reset / All Consonants Active SVG Button
          document.getElementById('consResetAllBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            this.sound.playUiTap(true);
            const activeSet = this.selectedConsonants[this.lang];
            if (activeSet.size > 0) {
              activeSet.clear();
              this.refreshConsonantChips();
              this.onConsonantFilterChanged();
            }
          });

          // Minimalist "Next" Skip Button
          document.getElementById('nextBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            this.sound.playUiTap(true);
            this.skipToNextRound();
          });

          // Canvas Pointer Events (Mouse, Touch & Stylus)
          this.canvas.addEventListener('pointermove', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            this.pointerX = e.clientX - rect.left;
            this.pointerY = e.clientY - rect.top;
            this.updateHoverState();
          });

          this.canvas.addEventListener('pointerdown', (e) => {
            this.sound.ensureContext();
            const rect = this.canvas.getBoundingClientRect();
            this.pointerX = e.clientX - rect.left;
            this.pointerY = e.clientY - rect.top;
            this.handleCanvasTap(this.pointerX, this.pointerY);
          });

          this.canvas.addEventListener('pointerleave', () => {
            this.hedgehog.hovered = false;
            for (const lf of this.leaves) lf.hovered = false;
            this.canvas.style.cursor = 'default';
          });

          window.addEventListener('resize', () => this.handleResize(false));
        }

        setLevel(lvl) {
          if (this.level === lvl) return;
          this.level = lvl;
          for (const i of [1, 2, 3]) {
            document.getElementById(`lvlBtn${i}`).classList.toggle('active', i === lvl);
          }
          const wrap = document.getElementById('consToggleWrap');
          wrap.classList.toggle('visible', lvl === 2);

          if (lvl === 2) {
            this.buildConsonantTray();
            this.setTrayOpen(true);
          } else {
            this.setTrayOpen(false);
          }
          this.skipToNextRound();
        }

        setTrayOpen(open) {
          this.trayOpen = open;
          document.getElementById('consonantTray').classList.toggle('open', open);
          document.getElementById('consToggleBtn').classList.toggle('active', open);
          // Smoothly reposition floating leaves if needed so tray never overlaps them
          const slots = this.getLeafSlots();
          this.leaves.forEach((lf, idx) => {
            if (slots[idx]) lf.updateTarget(slots[idx].x, slots[idx].y, slots[idx].r);
          });
        }

        buildConsonantTray() {
          const grid = document.getElementById('consonantGrid');
          grid.innerHTML = '';
          const consonants = CONTENT[this.lang].consonants;

          for (const c of consonants) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cons-chip';
            btn.textContent = c;
            btn.dataset.cons = c;
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              this.toggleConsonant(c);
            });
            grid.appendChild(btn);
          }
          this.refreshConsonantChips();
        }

        toggleConsonant(c) {
          const activeSet = this.selectedConsonants[this.lang];
          if (activeSet.has(c)) {
            activeSet.delete(c);
            this.sound.playUiTap(false);
          } else {
            activeSet.add(c);
            this.sound.playUiTap(true);
          }
          this.refreshConsonantChips();
          this.onConsonantFilterChanged();
        }

        refreshConsonantChips() {
          const activeSet = this.selectedConsonants[this.lang];
          const hasCustom = activeSet.size > 0;
          const chips = document.querySelectorAll('#consonantGrid .cons-chip');

          chips.forEach((chip) => {
            const isSel = activeSet.has(chip.dataset.cons);
            chip.classList.toggle('selected', hasCustom && isSel);
            chip.classList.toggle('dimmed', hasCustom && !isSel);
          });

          const resetBtn = document.getElementById('consResetAllBtn');
          if (resetBtn) {
            resetBtn.classList.toggle('active', !hasCustom);
          }
        }

        /**
         * Immediately checks if current Level 2 leaves match the newly selected consonants.
         * If any visible leaf doesn't start with a selected consonant (or if reset to all),
         * blows old leaves off in a soft breeze and drops 3 fresh matching leaves within ~320ms!
         */
        onConsonantFilterChanged() {
          if (this.level !== 2) return;
          const activeSet = this.selectedConsonants[this.lang];

          // Check whether current leaves are valid for the new filter
          const needsRefresh =
            this.roundState !== 'playing' ||
            this.leaves.length === 0 ||
            (activeSet.size > 0 && this.leaves.some((lf) => !activeSet.has(lf.text[0])));

          if (!needsRefresh && activeSet.size > 0) return;

          if (this.filterRefreshTimer) {
            clearTimeout(this.filterRefreshTimer);
            this.filterRefreshTimer = null;
          }

          // Gently blow away non-matching leaves immediately
          for (const lf of this.leaves) {
            if (lf.state !== 'attached') {
              lf.startSweep(1);
              this.sweepingLeaves.push(lf);
            }
          }
          this.leaves = [];
          this.sound.playBreeze(0.45, 0.11);

          // Drop 3 brand-new leaves matching the newly chosen consonants right away (~260ms)
          this.filterRefreshTimer = setTimeout(() => {
            this.filterRefreshTimer = null;
            if (this.level !== 2) return;
            if (this.roundState === 'exiting' || this.roundState === 'collecting') {
              this.startNewRound(true);
            } else {
              this.roundState = 'playing';
              this.hedgehog.sniffStrength = 0.9;
              this.hedgehog.earTwitch = 0.85;
              this.spawnTaskLeaves();
            }
          }, 260);
        }

        handleResize(initial = false) {
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.dpr = Math.min(window.devicePixelRatio || 1, 2);

          this.canvas.width = Math.ceil(this.width * this.dpr);
          this.canvas.height = Math.ceil(this.height * this.dpr);
          this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

          this.forest.resize(this.width, this.height, this.dpr);
          this.hedgehog.configureLayout(this.width, this.height, initial);

          const slots = this.getLeafSlots();
          this.leaves.forEach((lf, idx) => {
            if (slots[idx]) {
              lf.updateTarget(slots[idx].x, slots[idx].y, slots[idx].r);
            }
          });
        }

        // Well-spaced, large, non-overlapping leaf targets clear of top bar & Level 2 oak tray
        getLeafSlots() {
          const w = this.width;
          const h = this.height;
          const r = Math.min(w * 0.095, h * 0.175);
          const extraTopOffset = (this.level === 2 && this.trayOpen) ? Math.min(58, h * 0.075) : 0;
          const baseY1 = Math.max(h * 0.38 + extraTopOffset, 155 + r * 0.65);
          const baseY2 = Math.max(h * 0.31 + extraTopOffset, 145 + r * 0.62);
          const baseY3 = Math.max(h * 0.41 + extraTopOffset, 165 + r * 0.65);

          return [
            { x: w * 0.38, y: baseY1, r },
            { x: w * 0.61, y: baseY2, r },
            { x: w * 0.83, y: baseY3, r }
          ];
        }

        generateRoundItems() {
          const langData = CONTENT[this.lang];

          if (this.level === 1) {
            const key = `${this.lang}_L1`;
            const letters = this.memory.drawFromDeck(key, langData.alphabet, 3);
            return letters.map((ch) => ({ text: ch, isOdd: false }));
          }

          if (this.level === 2) {
            const activeSet = this.selectedConsonants[this.lang];
            const chosen = activeSet.size > 0
              ? Array.from(activeSet)
              : langData.consonants.slice();

            const pool = [];
            for (const c of chosen) {
              for (const v of langData.vowelsFor(c)) {
                pool.push(c + v);
              }
            }
            const syllables = this.memory.drawSyllables(this.lang, pool, 3);
            return syllables.map((syl) => ({ text: syl, isOdd: false }));
          }

          // Level 3: Semantic triple (2 related + 1 odd placed in random slot)
          const key = `${this.lang}_L3`;
          const [triplet] = this.memory.drawFromDeck(key, langData.triplets, 1);
          const items = [
            { text: triplet[0], isOdd: false },
            { text: triplet[1], isOdd: false },
            { text: triplet[2], isOdd: true }
          ];
          for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
          }
          return items;
        }

        spawnTaskLeaves() {
          const items = this.generateRoundItems();
          const slots = this.getLeafSlots();

          const speciesOrder = ['maple', 'oak', 'birch'].sort(() => Math.random() - 0.5);
          const palettes = LEAF_PALETTES.slice().sort(() => Math.random() - 0.5);

          this.leaves = items.map((item, idx) => new TaskLeaf({
            text: item.text,
            isOdd: item.isOdd,
            species: speciesOrder[idx % speciesOrder.length],
            palette: palettes[idx % palettes.length],
            slotIndex: idx,
            targetX: slots[idx].x,
            targetY: slots[idx].y,
            radius: slots[idx].r,
            delay: idx * 0.14
          }));

          this.sound.playBreeze(0.68, 0.125);
        }

        startNewRound(spawnFreshHedgehog = true) {
          this.roundState = 'playing';
          this.collectDelayTimer = 0;
          if (spawnFreshHedgehog) {
            this.hedgehog.spawnNew(this.width, this.height);
          }
          this.spawnTaskLeaves();
        }

        skipToNextRound() {
          if (this.filterRefreshTimer) {
            clearTimeout(this.filterRefreshTimer);
            this.filterRefreshTimer = null;
          }

          for (const lf of this.leaves) {
            if (lf.state !== 'attached') {
              lf.startSweep(1);
              this.sweepingLeaves.push(lf);
            }
          }
          this.leaves = [];

          if (this.roundState === 'exiting' || this.roundState === 'collecting') {
            this.startNewRound(true);
          } else {
            this.roundState = 'playing';
            this.hedgehog.sniffStrength = 0.9;
            this.hedgehog.earTwitch = 0.85;
            this.spawnTaskLeaves();
          }
        }

        updateHoverState() {
          if (this.roundState !== 'playing') {
            this.hedgehog.hovered = false;
            for (const lf of this.leaves) lf.hovered = false;
            this.canvas.style.cursor = 'default';
            return;
          }

          let hitAny = false;
          for (const lf of this.leaves) {
            const hit = lf.containsPoint(this.pointerX, this.pointerY);
            lf.hovered = hit;
            if (hit) hitAny = true;
          }

          const hitHog = !hitAny && this.hedgehog.containsPoint(this.pointerX, this.pointerY);
          this.hedgehog.hovered = hitHog;
          this.canvas.style.cursor = (hitAny || hitHog) ? 'pointer' : 'default';
        }

        handleCanvasTap(px, py) {
          if (this.roundState !== 'playing') return;

          // 1. Check leaves first
          for (let i = this.leaves.length - 1; i >= 0; i--) {
            const lf = this.leaves[i];
            if (lf.containsPoint(px, py)) {
              if (this.level === 3) {
                if (lf.isOdd) {
                  this.effects.spawnClickSparkles(lf.x, lf.y, 18);
                  this.triggerCollection();
                } else {
                  // Gentle non-verbal spring wobble + soft wooden note + curious hedgehog tilt
                  lf.triggerWobble();
                  this.hedgehog.triggerCurious();
                  this.effects.spawnWrongSpecks(lf.x, lf.y);
                  this.sound.playWrongWood();
                }
              } else {
                // Levels 1 & 2: playful leaf bounce + marimba pluck
                lf.triggerBounce();
                this.effects.spawnClickSparkles(lf.x, lf.y, 14);
                this.sound.playLeafPluck(i);
              }
              return;
            }
          }

          // 2. Check Hedgehog click
          if (this.hedgehog.containsPoint(px, py)) {
            this.triggerCollection();
          }
        }

        triggerCollection() {
          if (this.roundState !== 'playing' || this.leaves.length === 0) return;
          this.roundState = 'collecting';
          this.collectDelayTimer = 0.90;

          this.hedgehog.triggerExcited();
          const variant = this.effects.spawnCelebration(
            this.hedgehog.x + 12 * this.hedgehog.scale,
            this.hedgehog.y - 42 * this.hedgehog.scale,
            this.hedgehog.y + 102 * this.hedgehog.scale
          );
          this.sound.playCelebration(variant);

          if (this.level === 3) {
            // Collect ONLY the odd leaf; the 2 matching leaves shimmer warmly and float upward!
            for (const lf of this.leaves) {
              if (lf.isOdd) {
                lf.startCollect(0, 1, this.hedgehog);
              } else {
                lf.startHarmonyFloat();
                this.effects.spawnClickSparkles(lf.x, lf.y, 8);
                this.sweepingLeaves.push(lf);
              }
            }
            this.leaves = this.leaves.filter((lf) => lf.isOdd);
          } else {
            // Collect ALL 3 leaves onto hedgehog's quills
            this.leaves.forEach((lf, idx) => {
              lf.startCollect(idx, this.leaves.length, this.hedgehog);
            });
          }
        }

        update(dt) {
          this.elapsed += dt;
          this.forest.update(dt);
          this.hedgehog.update(dt, this.pointerX, this.pointerY, (px, py) => {
            this.effects.spawnPawRustle(px, py);
          });
          this.effects.update(dt);

          for (const lf of this.leaves) {
            lf.update(dt, this.hedgehog);
          }

          for (let i = this.sweepingLeaves.length - 1; i >= 0; i--) {
            const lf = this.sweepingLeaves[i];
            lf.update(dt, this.hedgehog);
            if (lf.alpha <= 0.01) {
              this.sweepingLeaves.splice(i, 1);
            }
          }

          if (this.roundState === 'collecting') {
            this.collectDelayTimer -= dt;
            if (this.collectDelayTimer <= 0) {
              this.roundState = 'exiting';
              this.hedgehog.startExit();
            }
          } else if (this.roundState === 'exiting') {
            if (this.hedgehog.x >= this.hedgehog.exitX) {
              this.startNewRound(true);
            }
          }
        }

        draw() {
          const ctx = this.ctx;
          ctx.clearRect(0, 0, this.width, this.height);

          // 1. Living Golden Autumn Forest
          this.forest.drawBackground(ctx, this.elapsed);

          // 2. Sweeping / Harmoniously Floating Leaves
          for (const lf of this.sweepingLeaves) {
            lf.draw(ctx);
          }

          // 3. Large Close-Up Realistic Hedgehog (draws attached leaves nestled among spines!)
          this.hedgehog.draw(ctx, this.elapsed, (c) => {
            c.save();
            c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
            for (const lf of this.leaves) {
              if (lf.state === 'attached') {
                lf.draw(c);
              }
            }
            c.restore();
          });

          // 4. Foreground Swaying Ferns & Grass Blades
          this.forest.drawForeground(ctx, this.elapsed);

          // 5. Active Falling / Floating / Collecting Task Leaves
          for (const lf of this.leaves) {
            if (lf.state !== 'attached') {
              lf.draw(ctx);
            }
          }

          // 6. Active Varied Celebrations & Particle Effects
          this.effects.draw(ctx);
        }

        loop(timestamp) {
          if (!this.lastTime) this.lastTime = timestamp;
          const dt = Math.min(0.05, (timestamp - this.lastTime) / 1000);
          this.lastTime = timestamp;

          this.update(dt);
          this.draw();

          requestAnimationFrame((t) => this.loop(t));
        }
      }

      window.addEventListener('load', () => {
        new AutumnHedgehogGame();
      });
    })();
  </script>
</body>
</html>
