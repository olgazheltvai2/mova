<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Хто де живе</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1a3318;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    cursor: default;
  }

  #game-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 48vw 52vw;
    align-items: center;
    z-index: 1;
  }

  /* Живий панорамний фон */
  #bg-stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Канал частинок та світлячків */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 25;
    pointer-events: none;
  }

  /* Ліва/центральна зона — великий природний пеньок-галявина для однієї тіні / тваринки */
  #stage-zone {
    position: relative;
    z-index: 10;
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 3vw;
  }

  .clearing-stage {
    position: relative;
    width: min(38vw, 66vh);
    height: min(38vw, 66vh);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage-pedestal-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    filter: drop-shadow(0 18px 28px rgba(8, 22, 6, 0.75));
  }

  .mystery-ring {
    animation: rotateRing 18s linear infinite;
    transform-origin: 250px 250px;
  }

  @keyframes rotateRing {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Контейнер самої тваринки (спочатку тінь, після кліку — кольорова) */
  .hero-animal-actor {
    position: relative;
    width: 76%;
    height: 76%;
    z-index: 5;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.45s ease;
    touch-action: none;
  }

  /* Стан 1: Загадкова тінь, яка пульсує та запрошує клікнути */
  .hero-animal-actor.is-shadow {
    filter: drop-shadow(0 0 22px rgba(255, 232, 110, 0.95)) drop-shadow(0 14px 22px rgba(10, 20, 6, 0.85));
    animation: shadowInvitePulse 2.1s infinite ease-in-out;
  }

  .hero-animal-actor.is-shadow:hover {
    transform: scale(1.07);
    filter: drop-shadow(0 0 32px rgba(255, 245, 140, 1)) drop-shadow(0 16px 26px rgba(10, 20, 6, 0.9));
  }

  @keyframes shadowInvitePulse {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.06) translateY(-8px); }
  }

  /* Стан 2: Розкрита кольорова тваринка (можна тягнути в будиночок) */
  .hero-animal-actor.is-revealed {
    cursor: grab;
    filter: drop-shadow(0 16px 22px rgba(12, 28, 8, 0.72)) drop-shadow(0 0 18px rgba(255, 240, 140, 0.55));
    animation: revealPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .hero-animal-actor.is-revealed:hover {
    transform: scale(1.06) translateY(-6px);
  }

  .hero-animal-actor.is-revealed:active {
    cursor: grabbing;
  }

  @keyframes revealPop {
    0% { transform: scale(0.55) rotate(-8deg); opacity: 0.4; }
    65% { transform: scale(1.14) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .hero-animal-actor.entering-stage {
    animation: stageEnter 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes stageEnter {
    0% { transform: scale(0.2) translateY(40px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .hero-animal-actor.homed {
    opacity: 0;
    transform: scale(0.1);
    pointer-events: none;
    transition: transform 0.5s ease, opacity 0.4s ease;
  }

  /* Права зона — 4 будиночки на вибір (з'являються лише після кліку по тіні) */
  #right-zone {
    position: relative;
    z-index: 8;
    height: 84vh;
    margin-top: -2vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2.6vh 2.2vw;
    padding: 2vh 5vw 2vh 1vw;
    align-items: center;
    justify-items: center;
    pointer-events: none;
  }

  #right-zone.houses-active {
    pointer-events: auto;
  }

  .home-card {
    position: relative;
    width: min(18.5vw, 35vh);
    height: min(18.5vw, 35vh);
    cursor: pointer;
    opacity: 0;
    transform: scale(0.25) translateY(35px) rotate(-6deg);
    transition: transform 0.52s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease, filter 0.35s ease;
    filter: drop-shadow(0 12px 20px rgba(12, 26, 8, 0.72));
  }

  .home-card.visible {
    opacity: 1;
    transform: scale(1) translateY(0) rotate(0deg);
  }

  .home-card.visible:hover,
  .home-card.drag-over {
    transform: scale(1.09) rotate(-1.5deg);
    filter: drop-shadow(0 0 28px rgba(255, 232, 95, 0.98)) drop-shadow(0 14px 22px rgba(12, 24, 8, 0.8));
  }

  .home-card.completed {
    pointer-events: none;
    transform: scale(1.08);
    filter: drop-shadow(0 0 32px rgba(155, 255, 110, 0.95)) drop-shadow(0 12px 20px rgba(12, 24, 8, 0.7));
  }

  .home-resident-badge {
    position: absolute;
    width: 64%;
    height: 64%;
    bottom: 8%;
    right: 8%;
    pointer-events: none;
    transform: scale(0);
    transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.7));
  }

  .home-card.completed .home-resident-badge {
    transform: scale(1);
  }

  /* Анімація помилки (м'яке похитування з шелестом листя) */
  .shake-error {
    animation: gentleShake 0.52s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
  }

  /* Живий панорамний фон */
  #bg-stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Канал частинок та світлячків */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 25;
    pointer-events: none;
  }

  /* Ліва зона - медальйони тіней із плетеної лози та кори */
  #left-zone {
    position: relative;
    z-index: 5;
    height: 92vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1.5vh 1vw;
    padding: 2vh 1vw 2vh 1.8vw;
    align-items: center;
    justify-items: center;
  }

  .shadow-medallion {
    position: relative;
    width: min(10.2vw, 21vh);
    height: min(10.2vw, 21vh);
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
    filter: drop-shadow(0 8px 14px rgba(10, 24, 8, 0.65));
  }

  .shadow-medallion:hover {
    transform: scale(1.06);
  }

  .shadow-medallion.active-target {
    transform: scale(1.09);
    filter: drop-shadow(0 0 18px rgba(255, 215, 70, 0.95)) drop-shadow(0 8px 16px rgba(10, 24, 8, 0.7));
    animation: pulseMedallion 2s infinite ease-in-out;
  }

  .shadow-medallion.solved {
    pointer-events: none;
    filter: drop-shadow(0 6px 10px rgba(10, 24, 8, 0.45));
    opacity: 0.92;
  }

  @keyframes pulseMedallion {
    0%, 100% { transform: scale(1.07); }
    50% { transform: scale(1.13); }
  }

  /* Центральна галявина з реалістичними тваринами */
  #center-zone {
    position: relative;
    z-index: 6;
    height: 94vh;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    padding: 4vh 1.5vw 6vh 1.5vw;
    gap: 2vh 1vw;
    align-items: center;
    justify-items: center;
  }

  .animal-spot {
    position: relative;
    width: min(15vw, 29vh);
    height: min(15vw, 29vh);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    filter: drop-shadow(0 10px 14px rgba(15, 32, 10, 0.55));
  }

  .animal-spot:active {
    cursor: grabbing;
  }

  .animal-spot:hover {
    transform: translateY(-6px) scale(1.06);
    filter: drop-shadow(0 14px 18px rgba(15, 32, 10, 0.7)) drop-shadow(0 0 14px rgba(255, 238, 130, 0.55));
  }

  .animal-spot.step2-ready {
    animation: readyBounce 1.5s infinite ease-in-out;
    filter: drop-shadow(0 0 22px rgba(255, 220, 65, 1)) drop-shadow(0 0 36px rgba(120, 255, 100, 0.85));
    z-index: 15;
  }

  .animal-spot.homed {
    opacity: 0;
    transform: scale(0.1);
    pointer-events: none;
    transition: transform 0.55s ease, opacity 0.45s ease;
  }

  @keyframes readyBounce {
    0%, 100% { transform: translateY(0) scale(1.1); }
    50% { transform: translateY(-10px) scale(1.16); }
  }

  /* Права зона - будиночки на дерев'яній корі та камені */
  #right-zone {
    position: relative;
    z-index: 5;
    height: 82vh;
    margin-top: -1vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1.8vh 1vw;
    padding: 2vh 1.8vw 2vh 0.8vw;
    align-items: center;
    justify-items: center;
  }

  .home-card {
    position: relative;
    width: min(12vw, 24vh);
    height: min(12vw, 24vh);
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
    filter: drop-shadow(0 9px 15px rgba(14, 26, 9, 0.65));
  }

  .home-card:hover {
    transform: scale(1.06) rotate(-1deg);
  }

  .home-card.awaiting-home {
    filter: drop-shadow(0 0 15px rgba(255, 224, 100, 0.75)) drop-shadow(0 8px 14px rgba(12, 24, 8, 0.65));
  }

  .home-card.awaiting-home:hover {
    transform: scale(1.1);
    filter: drop-shadow(0 0 24px rgba(255, 235, 110, 1)) drop-shadow(0 10px 18px rgba(12, 24, 8, 0.75));
  }

  .home-card.completed {
    pointer-events: none;
    filter: drop-shadow(0 0 18px rgba(160, 255, 120, 0.8)) drop-shadow(0 8px 14px rgba(12, 24, 8, 0.6));
  }

  .home-resident-badge {
    position: absolute;
    width: 58%;
    height: 58%;
    bottom: 10%;
    right: 10%;
    pointer-events: none;
    transform: scale(0);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.65));
  }

  .home-card.completed .home-resident-badge {
    transform: scale(1);
  }

  /* Анімація помилки (м'яке похитування з шелестом листя) */
  .shake-error {
    animation: gentleShake 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both !important;
  }

  @keyframes gentleShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-9px) rotate(-4deg); }
    40% { transform: translateX(8px) rotate(4deg); }
    60% { transform: translateX(-6px) rotate(-2deg); }
    80% { transform: translateX(5px) rotate(2deg); }
  }

  /* Живі мікродії для тварин */
  .animal-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: breatheIdle 3.4s infinite ease-in-out;
    transform-origin: 50% 80%;
  }

  @keyframes breatheIdle {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    50% { transform: scaleY(1.035) scaleX(0.985) translateY(-2px); }
  }

  .wing-flutter {
    animation: wingFlap 0.22s infinite alternate ease-in-out;
    transform-origin: center;
  }

  @keyframes wingFlap {
    0% { transform: rotate(-8deg) scaleY(0.92); }
    100% { transform: rotate(10deg) scaleY(1.06); }
  }

  .tail-wag {
    animation: wagTail 1.4s infinite alternate ease-in-out;
    transform-origin: 30% 70%;
  }

  @keyframes wagTail {
    0% { transform: rotate(-6deg); }
    100% { transform: rotate(8deg); }
  }

  .eye-blink {
    animation: blinkEye 4.5s infinite;
    transform-origin: center;
  }

  @keyframes blinkEye {
    0%, 92%, 98%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  /* Органічні кнопки керування (без жодних білих прямокутників) */
  #lang-btn {
    position: fixed;
    top: 1.8vh;
    right: 1.8vw;
    z-index: 40;
    width: clamp(86px, 7.5vw, 128px);
    height: clamp(44px, 5.6vh, 64px);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #lang-btn:hover {
    transform: scale(1.08) rotate(-2deg);
  }

  #lang-btn:active {
    transform: scale(0.95);
  }

  #next-btn {
    position: fixed;
    bottom: 2.2vh;
    right: 1.8vw;
    z-index: 40;
    width: clamp(135px, 12vw, 195px);
    height: clamp(54px, 7.2vh, 82px);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    filter: drop-shadow(0 8px 14px rgba(10, 30, 5, 0.65));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
  }

  #next-btn:hover {
    transform: scale(1.08) translateX(3px);
    filter: drop-shadow(0 10px 18px rgba(50, 220, 40, 0.6));
  }

  #next-btn:active {
    transform: scale(0.95);
  }

  /* Літаючий клон тваринки при перельоті в будиночок або перетягуванні */
  .flying-animal {
    position: fixed;
    z-index: 35;
    pointer-events: none;
    transition: all 0.72s cubic-bezier(0.25, 1, 0.4, 1);
    filter: drop-shadow(0 16px 24px rgba(0,0,0,0.55)) drop-shadow(0 0 22px rgba(255, 230, 90, 0.95));
  }

  /* Анімація фонових елементів */
  .sway-slow {
    animation: treeSway 6s infinite alternate ease-in-out;
    transform-origin: bottom center;
  }

  @keyframes treeSway {
    0% { transform: rotate(-1.2deg); }
    100% { transform: rotate(1.4deg); }
  }

  .sun-ray {
    animation: rayShimmer 5s infinite alternate ease-in-out;
  }

  @keyframes rayShimmer {
    0% { opacity: 0.16; }
    100% { opacity: 0.34; }
  }

  .water-ripple {
    animation: rippleMove 4s infinite alternate ease-in-out;
  }

  @keyframes rippleMove {
    0% { transform: translateX(-6px) scaleX(0.97); opacity: 0.45; }
    100% { transform: translateX(6px) scaleX(1.03); opacity: 0.75; }
  }
</style>
</head>
<body>

<!-- Живий панорамний екосистемний фон: ліс, галявина, ставок і сонячні бархани вдалечині -->
<svg id="bg-stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#62c4df"/>
      <stop offset="38%" stop-color="#9be5d2"/>
      <stop offset="75%" stop-color="#e9f5a8"/>
      <stop offset="100%" stop-color="#fbd977"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.62" cy="0.12" r="0.45">
      <stop offset="0%" stop-color="#fffbe0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffe875" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe875" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="distantHills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#73b870"/>
      <stop offset="100%" stop-color="#3f7c44"/>
    </linearGradient>
    <linearGradient id="desertDunes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7d57c"/>
      <stop offset="55%" stop-color="#e4ac48"/>
      <stop offset="100%" stop-color="#c68328"/>
    </linearGradient>
    <linearGradient id="meadowMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ed348"/>
      <stop offset="45%" stop-color="#4ea82f"/>
      <stop offset="100%" stop-color="#225519"/>
    </linearGradient>
    <linearGradient id="pondWater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ae3f4"/>
      <stop offset="50%" stop-color="#2ca8c6"/>
      <stop offset="100%" stop-color="#156682"/>
    </linearGradient>
    <linearGradient id="oakTrunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2212"/>
      <stop offset="45%" stop-color="#5e3a20"/>
      <stop offset="80%" stop-color="#432815"/>
      <stop offset="100%" stop-color="#28160a"/>
    </linearGradient>
    <radialGradient id="canopyLight" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#8ae041"/>
      <stop offset="55%" stop-color="#3f8f29"/>
      <stop offset="100%" stop-color="#1b4d14"/>
    </radialGradient>
    <radialGradient id="canopyDark" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#58b030"/>
      <stop offset="65%" stop-color="#29661b"/>
      <stop offset="100%" stop-color="#12350c"/>
    </radialGradient>
    <linearGradient id="sunbeamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9be" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff9be" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Небо та сонячне сяйво -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  <circle cx="1180" cy="130" r="520" fill="url(#sunGlow)"/>

  <!-- Далекі ліси та пагорби -->
  <path d="M0,560 Q320,430 680,500 T1320,470 L1920,540 L1920,760 L0,760 Z" fill="url(#distantHills)" opacity="0.75"/>

  <!-- Сонячні піщані бархани на горизонті праворуч -->
  <path d="M1060,520 Q1290,390 1560,465 Q1760,410 1920,480 L1920,690 L1020,650 Z" fill="url(#desertDunes)"/>
  <path d="M1220,515 Q1430,430 1690,510 L1920,540 L1920,670 L1180,640 Z" fill="#d99a38" opacity="0.65"/>

  <!-- Середній план - смарагдові пагорби -->
  <path d="M0,580 Q440,460 920,555 Q1380,630 1920,575 L1920,1080 L0,1080 Z" fill="url(#meadowMain)"/>

  <!-- Чистий лісовий ставок праворуч від центру -->
  <ellipse cx="1370" cy="650" rx="340" ry="92" fill="#3b7830"/>
  <ellipse cx="1370" cy="654" rx="320" ry="78" fill="url(#pondWater)"/>
  <ellipse class="water-ripple" cx="1330" cy="638" rx="190" ry="18" fill="#b4f8ff" opacity="0.5"/>
  <ellipse class="water-ripple" cx="1420" cy="672" rx="140" ry="12" fill="#b4f8ff" opacity="0.4"/>
  <!-- Очерет біля ставка -->
  <g stroke="#2c631e" stroke-width="5" fill="none">
    <path d="M1070,640 Q1060,560 1045,515"/>
    <path d="M1085,645 Q1085,555 1095,505"/>
    <path d="M1640,625 Q1655,545 1670,500"/>
    <path d="M1660,635 Q1675,565 1695,525"/>
  </g>
  <ellipse cx="1048" cy="525" rx="6" ry="22" transform="rotate(-12 1048 525)" fill="#5c3416"/>
  <ellipse cx="1093" cy="518" rx="6" ry="22" transform="rotate(8 1093 518)" fill="#5c3416"/>
  <ellipse cx="1667" cy="512" rx="6" ry="22" transform="rotate(14 1667 512)" fill="#5c3416"/>

  <!-- Сонячні промені крізь крони -->
  <polygon class="sun-ray" points="650,0 880,0 520,1080 210,1080" fill="url(#sunbeamGrad)"/>
  <polygon class="sun-ray" points="980,0 1240,0 980,1080 640,1080" fill="url(#sunbeamGrad)"/>
  <polygon class="sun-ray" points="1340,0 1520,0 1390,1080 1120,1080" fill="url(#sunbeamGrad)"/>

  <!-- Могутні дерева ліворуч та праворуч, що створюють затишну арку -->
  <g class="sway-slow">

<script>
(() => {
  /* =========================================================================
   * 1. БАГАТОШАРОВИЙ СИНТЕЗАТОР ЗВУКІВ ПРИРОДИ ТА ТВАРИН (WEB AUDIO API)
   * ========================================================================= */
  class NatureSoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Приємний дерев'яний клік при виборі тіні
    playSelectShadow() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(660, now + 0.11);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    }

    // М'який шелест листя та дерев'яний стукіт при неправильній спробі
    playLeafRustleError() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [210, 165].forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.09);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.72, now + i * 0.09 + 0.12);
        gain.gain.setValueAtTime(0.16, now + i * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.14);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now + i * 0.09);
        osc.stop(now + i * 0.09 + 0.15);
      });
    }

    // Чарівний передзвін + характерний голос тваринки при вгадуванні тіні
    playShadowMatched(animalId) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + idx * 0.065);
        gain.gain.setValueAtTime(0.16, now + idx * 0.065);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.065 + 0.32);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now + idx * 0.065);
        osc.stop(now + idx * 0.065 + 0.34);
      });
      this.playAnimalVoice(animalId, now + 0.18);
    }

    // Реалістичний синтез голосу кожної з 12 тваринок
    playAnimalVoice(id, startTime) {
      if (!this.ctx) return;
      const t = startTime || this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      if (id === 'bee') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(230, t);
        osc.frequency.linearRampToValueAtTime(265, t + 0.15);
        osc.frequency.linearRampToValueAtTime(220, t + 0.32);
        gain.gain.setValueAtTime(0.09, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.36);
      } else if (id === 'dog') {
        // Дзвінкий радісний гавкіт
        [0, 0.18].forEach(offset => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(320, t + offset);
          o.frequency.exponentialRampToValueAtTime(480, t + offset + 0.05);
          o.frequency.exponentialRampToValueAtTime(190, t + offset + 0.14);
          g.gain.setValueAtTime(0.22, t + offset);
          g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.15);
          o.connect(g).connect(this.ctx.destination);
          o.start(t + offset);
          o.stop(t + offset + 0.16);
        });
      } else if (id === 'bear') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(125, t);
        osc.frequency.exponentialRampToValueAtTime(85, t + 0.38);
        gain.gain.setValueAtTime(0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.42);
      } else if (id === 'frog') {
        [0, 0.2].forEach(offset => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(160, t + offset);
          o.frequency.exponentialRampToValueAtTime(360, t + offset + 0.11);
          g.gain.setValueAtTime(0.14, t + offset);
          g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.14);
          o.connect(g).connect(this.ctx.destination);
          o.start(t + offset);
          o.stop(t + offset + 0.15);
        });
      } else if (id === 'bird') {
        [0, 0.14, 0.28].forEach((offset, i) => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(1400 + i * 240, t + offset);
          o.frequency.exponentialRampToValueAtTime(2100 + i * 180, t + offset + 0.1);
          g.gain.setValueAtTime(0.14, t + offset);
          g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.12);
          o.connect(g).connect(this.ctx.destination);
          o.start(t + offset);
          o.stop(t + offset + 0.13);
        });
      } else if (id === 'mouse' || id === 'bat' || id === 'squirrel') {
        [0, 0.12].forEach(offset => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(1750, t + offset);
          o.frequency.exponentialRampToValueAtTime(2450, t + offset + 0.08);
          g.gain.setValueAtTime(0.11, t + offset);
          g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.1);
          o.connect(g).connect(this.ctx.destination);
          o.start(t + offset);
          o.stop(t + offset + 0.11);
        });
      } else {
        // Лисичка, павучок, мурашка, верблюд — тепла маримба-нотка
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.22);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.26);
      }
    }

    // Святковий акорд лісової арфи та маримби при заселенні в будиночок
    playHomeSuccess() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const chord = [523.25, 659.25, 783.99, 987.77, 1318.5];
      chord.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.18, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.55);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.58);
      });
    }

    // Переможна симфонія лісу при завершенні раунду
    playRoundFanfare() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const melody = [523.25, 659.25, 783.99, 1046.5, 987.77, 1046.5, 1318.5, 1567.98];
      melody.forEach((freq, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.085);
        gain.gain.setValueAtTime(0.17, now + i * 0.085);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.085 + 0.5);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now + i * 0.085);
        osc.stop(now + i * 0.085 + 0.52);
      });
    }
  }

  const sound = new NatureSoundEngine();

  /* =========================================================================
   * 2. АВТОРСЬКА ВЕКТОРНА БІБЛІОТЕКА: 12 РЕАЛІСТИЧНИХ ТВАРИН ТА ЇХНІХ ДОМІВОК
   * ========================================================================= */
  // Функція огортає будь-яку тваринку в режим живої ілюстрації або чіткої тіні
  function renderAnimalSVG(id, isShadow = false) {
    const filterDef = isShadow ? `
      <filter id="shadowSil_${id}">
        <feColorMatrix type="matrix" values="
          0 0 0 0 0.14
          0 0 0 0 0.08
          0 0 0 0 0.03
          0 0 0 1 0"/>
      </filter>
    ` : '';
    const groupFilter = isShadow ? `filter="url(#shadowSil_${id})"` : '';
    const animClass = 'animal-svg';

    const art = ANIMAL_ART[id]();
    return `
      <svg class="${animClass}" viewBox="0 0 220 220" width="100%" height="100%">
        <defs>${filterDef}${art.defs || ''}</defs>
        ${!isShadow ? renderNaturalPedestal(id) : ''}
        <g ${groupFilter}>
          ${art.body}
        </g>
      </svg>
    `;
  }

  // Природна підставка під кожну тваринку в центрі (моховитий камінь, пеньок, травичка, пісок)
  function renderNaturalPedestal(id) {
    if (id === 'camel') {
      return `<ellipse cx="110" cy="192" rx="76" ry="18" fill="#e2a84b" opacity="0.9"/>
              <ellipse cx="110" cy="190" rx="64" ry="12" fill="#f7ce72"/>`;
    }
    if (id === 'bee' || id === 'bat' || id === 'bird') {
      return `<ellipse cx="110" cy="196" rx="52" ry="11" fill="#173d10" opacity="0.35"/>`;
    }
    return `
      <ellipse cx="110" cy="192" rx="74" ry="18" fill="#1d4a14" opacity="0.7"/>
      <ellipse cx="110" cy="189" rx="64" ry="13" fill="#4ca62b"/>
      <path d="M54,190 Q60,174 68,189 M150,190 Q158,173 164,189" stroke="#7CE843" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    `;
  }

  const ANIMAL_ART = {
    // 1. БДЖОЛА
    bee: () => ({
      defs: `
        <linearGradient id="beeAbdomen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffe44d"/>
          <stop offset="50%" stop-color="#f5a614"/>
          <stop offset="100%" stop-color="#b56a05"/>
        </linearGradient>
        <linearGradient id="beeWing" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
          <stop offset="100%" stop-color="#baefff" stop-opacity="0.45"/>
        </linearGradient>
      `,
      body: `
        <!-- Ніжки -->
        <g stroke="#2b1908" stroke-width="4.5" stroke-linecap="round" fill="none">
          <path d="M88,136 L72,162 L62,172"/>
          <path d="M112,140 L106,168 L98,178"/>
          <path d="M136,136 L146,164 L158,172"/>
        </g>
        <!-- Крильця -->
        <g class="wing-flutter">
          <ellipse cx="95" cy="70" rx="26" ry="44" transform="rotate(-28 95 70)" fill="url(#beeWing)" stroke="#9ad8eb" stroke-width="2"/>
          <ellipse cx="122" cy="72" rx="22" ry="38" transform="rotate(18 122 72)" fill="url(#beeWing)" stroke="#9ad8eb" stroke-width="2"/>
          <path d="M85,52 Q98,74 104,95 M122,55 Q118,74 114,94" stroke="#7bc5de" stroke-width="1.5" fill="none"/>
        </g>
        <!-- Жало -->
        <polygon points="175,128 196,134 173,139" fill="#231407"/>
        <!-- Черевце зі смужками -->
        <g transform="rotate(14 138 122)">
          <ellipse cx="138" cy="122" rx="42" ry="30" fill="url(#beeAbdomen)"/>
          <path d="M118,95 Q126,122 118,149" stroke="#281606" stroke-width="11" fill="none"/>
          <path d="M140,92 Q148,122 140,152" stroke="#281606" stroke-width="12" fill="none"/>
          <path d="M161,99 Q168,122 161,145" stroke="#281606" stroke-width="10" fill="none"/>
        </g>
        <!-- Пухнасті груди -->
        <ellipse cx="94" cy="112" rx="26" ry="24" fill="#6b441b"/>
        <ellipse cx="92" cy="108" rx="21" ry="18" fill="#8f5d26"/>
        <!-- Голова та вусики -->
        <circle cx="64" cy="108" r="20" fill="#2d1c0b"/>
        <path d="M52,92 Q38,70 26,74 M62,89 Q54,65 42,66" stroke="#231407" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  /* =========================================================================
   * 4. КАНАЛ ЧАСТИНОК: СВІТЛЯЧКИ, ЧАРІВНІ СТЕЖКИ ТА ПРИРОДНІ САЛЮТИ
   * ========================================================================= */
  const fxCanvas = document.getElementById('fx-canvas');
  const fxCtx = fxCanvas.getContext('2d');
  let particles = [];
  let ambientFireflies = [];

  function resizeCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Створюємо фонових лісових світлячків
  for (let i = 0; i < 28; i++) {
    ambientFireflies.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 2 + Math.random() * 3.5,
      vx: (Math.random() - 0.5) * 0.55,
      vy: (Math.random() - 0.5) * 0.45,
      phase: Math.random() * Math.PI * 2
    });
  }

  function spawnSparkleTrail(x1, y1, x2, y2, color = '#ffe552') {
    const steps = 26;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const cx = (x1 + x2) / 2;
      const cy = Math.min(y1, y2) - 90;
      const px = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * cx + t * t * x2;
      const py = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * cy + t * t * y2;
      particles.push({
        x: px + (Math.random() - 0.5) * 18,
        y: py + (Math.random() - 0.5) * 18,
        vx: (Math.random() - 0.5) * 2.4,
        vy: (Math.random() - 0.5) * 2.4,
        size: 4 + Math.random() * 6,
        alpha: 1,
        decay: 0.02 + Math.random() * 0.015,
        color,
        type: 'star'
      });
    }
  }

  function spawnNatureBurst(x, y, count = 36) {
    const palette = ['#ffe84d', '#82f542', '#ff82b2', '#5ce6ff', '#ffb838'];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
      const speed = 2.5 + Math.random() * 7.5;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.5,
        size: 6 + Math.random() * 7,
        alpha: 1,
        decay: 0.016 + Math.random() * 0.014,
        color: palette[i % palette.length],
        type: i % 2 === 0 ? 'leaf' : 'star',
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.15
      });
    }
  }

  function animateFX() {
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    // Фонові світлячки
    ambientFireflies.forEach(f => {
      f.x += f.vx;
      f.y += f.vy;
      f.phase += 0.04;
      if (f.x < 0) f.x = fxCanvas.width;
      if (f.x > fxCanvas.width) f.x = 0;
      if (f.y < 0) f.y = fxCanvas.height;
      if (f.y > fxCanvas.height) f.y = 0;

      const glow = 0.35 + 0.5 * Math.sin(f.phase);
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0.1, glow);
      fxCtx.fillStyle = '#fff599';
      fxCtx.shadowColor = '#ffd93b';
      fxCtx.shadowBlur = 12;
      fxCtx.beginPath();
      fxCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();
    });

    // Активні святкові частинки
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.alpha -= p.decay;
      if (p.rot !== undefined) p.rot += p.vRot;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      fxCtx.save();
      fxCtx.globalAlpha = p.alpha;
      fxCtx.translate(p.x, p.y);
      if (p.rot) fxCtx.rotate(p.rot);
      fxCtx.fillStyle = p.color;
      fxCtx.shadowColor = p.color;
      fxCtx.shadowBlur = 10;

      if (p.type === 'leaf') {
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
        fxCtx.fill();
      } else {
        fxCtx.beginPath();
        fxCtx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
        fxCtx.fill();
      }
      fxCtx.restore();
    }

    requestAnimationFrame(animateFX);
  }
  requestAnimationFrame(animateFX);

  /* =========================================================================
   * 5. ЛОГІКА БЕЗКІНЕЧНОГО ГЕНЕРАТОРА:
   *    КРОК 1: На пеньку-галявині лише ОДНА тінь тваринки (будиночків немає).
   *    КРОК 2: Клік по тіні -> тінь стає кольоровою тваринкою + з'являються 4 будиночки.
   *    КРОК 3: Дитина переносить (або клікає) тваринку у правильний будиночок -> наступна тінь!
   * ========================================================================= */
  const ALL_IDS = [
    'bee', 'dog', 'bear', 'fox',
    'mouse', 'spider', 'bat', 'frog',
    'camel', 'squirrel', 'bird', 'ant'
  ];

  let deckQueue = [];
  let currentAnimalId = null;
  let stepMode = 'SHADOW'; // 'SHADOW' (чекаємо клік по тіні) або 'REVEALED' (обираємо будиночок)
  let isBusy = false;

  const heroActor = document.getElementById('hero-actor');
  const rightZone = document.getElementById('right-zone');

  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Безкінечна черга без повторів підряд
  function pullNextAnimal() {
    if (deckQueue.length === 0) {
      deckQueue = shuffle(ALL_IDS);
      if (deckQueue[0] === currentAnimalId && deckQueue.length > 1) {
        [deckQueue[0], deckQueue[1]] = [deckQueue[1], deckQueue[0]];
      }
    }
    return deckQueue.shift();
  }

  function getCenterCoords(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function generateLevel() {
    isBusy = false;
    stepMode = 'SHADOW';
    currentAnimalId = pullNextAnimal();

    // 1. Очищуємо та ховаємо зону будиночків (на першому кроці є лише одна тінь)
    rightZone.classList.remove('houses-active');
    rightZone.innerHTML = '';

    // 2. Встановлюємо одну загадкову тінь на лісовій галявині
    heroActor.className = 'hero-animal-actor is-shadow entering-stage';
    heroActor.style.opacity = '';
    heroActor.innerHTML = renderAnimalSVG(currentAnimalId, true);

    const stagePos = getCenterCoords(heroActor);
    spawnNatureBurst(stagePos.x, stagePos.y, 20);

    setTimeout(() => {
      heroActor.classList.remove('entering-stage');
    }, 560);
  }

  // Клік по тіні: перетворення на кольорову тваринку + поява 4 будиночків на вибір
  function revealAnimalAndHouses() {
    if (isBusy || stepMode !== 'SHADOW') return;
    stepMode = 'REVEALED';

    sound.playShadowMatched(currentAnimalId);
    const pos = getCenterCoords(heroActor);
    spawnNatureBurst(pos.x, pos.y, 42);

    // Перетворюємо тінь на живу кольорову тваринку
    heroActor.className = 'hero-animal-actor is-revealed';
    heroActor.innerHTML = renderAnimalSVG(currentAnimalId, false);

    // Формуємо 4 будиночки (1 правильний + 3 випадкові)
    const distractors = shuffle(ALL_IDS.filter(id => id !== currentAnimalId)).slice(0, 3);
    const houseOptions = shuffle([currentAnimalId, ...distractors]);

    rightZone.innerHTML = '';
    rightZone.classList.add('houses-active');

    houseOptions.forEach((homeId, idx) => {
      const card = document.createElement('div');
      card.className = 'home-card';
      card.dataset.id = homeId;
      card.innerHTML = `
        ${renderHomeSVG(homeId)}
        <div class="home-resident-badge">${renderAnimalSVG(homeId, false)}</div>
      `;
      card.addEventListener('click', () => onHomeCardSelect(homeId, card));
      rightZone.appendChild(card);

      // Каскадна поява 4 будиночків із легким ефектом світлячків
      setTimeout(() => {
        card.classList.add('visible');
        const cPos = getCenterCoords(card);
        spawnNatureBurst(cPos.x, cPos.y, 10);
      }, 70 + idx * 90);
    });
  }

  // Перевірка обраного будиночка (при перетягуванні або кліку)
  function onHomeCardSelect(homeId, cardEl) {
    if (isBusy || stepMode !== 'REVEALED') return;

    if (homeId === currentAnimalId) {
      // УСПІХ! Тваринка вирушає до свого будиночка
      isBusy = true;
      sound.playHomeSuccess();
      sound.playAnimalVoice(currentAnimalId);

      const startPos = getCenterCoords(heroActor);
      const endPos = getCenterCoords(cardEl);
      spawnSparkleTrail(startPos.x, startPos.y, endPos.x, endPos.y, '#ffe64d');

      const rect = heroActor.getBoundingClientRect();
      const flyer = document.createElement('div');
      flyer.className = 'flying-animal';
      flyer.style.width = `${rect.width}px`;
      flyer.style.height = `${rect.height}px`;
      flyer.style.left = `${rect.left}px`;
      flyer.style.top = `${rect.top}px`;
      flyer.innerHTML = renderAnimalSVG(currentAnimalId, false);
      document.body.appendChild(flyer);

      heroActor.classList.add('homed');

      requestAnimationFrame(() => {
        flyer.style.left = `${endPos.x - rect.width * 0.35}px`;
        flyer.style.top = `${endPos.y - rect.height * 0.35}px`;
        flyer.style.transform = 'scale(0.5)';
      });

      setTimeout(() => {
        flyer.remove();
        cardEl.classList.add('completed');
        spawnNatureBurst(endPos.x, endPos.y, 48);
        sound.playRoundFanfare();

        // Додаткові святкові спалахи природи
        setTimeout(() => {
          spawnNatureBurst(endPos.x + (Math.random() - 0.5) * 160, endPos.y - 60, 32);
        }, 240);

        // Автоматичний перехід до наступної тіні
        setTimeout(() => {
          generateLevel();
        }, 1450);
      }, 680);
    } else {
      // ПОМИЛКА: будиночок хитається, а тваринка заперечливо хитає головою
      triggerGentleError(cardEl);
      triggerGentleError(heroActor);
      const errPos = getCenterCoords(cardEl);
      spawnNatureBurst(errPos.x, errPos.y, 12);
    }
  }

  function triggerGentleError(el) {
    sound.playLeafRustleError();
    el.classList.remove('shake-error');
    void el.offsetWidth;
    el.classList.add('shake-error');
    setTimeout(() => el.classList.remove('shake-error'), 540);
  }

  // Обробка кліку та перетягування (Drag & Drop) для головного персонажа
  function setupHeroInteractions() {
    let draggingClone = null;
    let startX = 0;
    let startY = 0;
    let moved = false;
    let hoveredCard = null;

    heroActor.addEventListener('click', () => {
      if (moved || isBusy) return;
      if (stepMode === 'SHADOW') {
        revealAnimalAndHouses();
      } else if (stepMode === 'REVEALED') {
        // Повторний клік по відкритій тваринці відтворює її голос та іскорки
        sound.playAnimalVoice(currentAnimalId);
        const pos = getCenterCoords(heroActor);
        spawnNatureBurst(pos.x, pos.y, 18);
      }
    });

    heroActor.addEventListener('pointerdown', (e) => {
      if (isBusy || stepMode !== 'REVEALED') return;
      startX = e.clientX;
      startY = e.clientY;
      moved = false;

      const onPointerMove = (ev) => {
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;

        if (!moved && Math.hypot(dx, dy) > 8) {
          moved = true;
          const r = heroActor.getBoundingClientRect();
          draggingClone = document.createElement('div');
          draggingClone.className = 'flying-animal';
          draggingClone.style.transition = 'none';
          draggingClone.style.width = `${r.width * 0.72}px`;
          draggingClone.style.height = `${r.height * 0.72}px`;
          draggingClone.innerHTML = renderAnimalSVG(currentAnimalId, false);
          document.body.appendChild(draggingClone);
          heroActor.style.opacity = '0.28';
        }

        if (moved && draggingClone) {
          const w = parseFloat(draggingClone.style.width);
          const h = parseFloat(draggingClone.style.height);
          draggingClone.style.left = `${ev.clientX - w / 2}px`;
          draggingClone.style.top = `${ev.clientY - h / 2}px`;

          const elUnder = document.elementFromPoint(ev.clientX, ev.clientY);
          const cardUnder = elUnder ? elUnder.closest('.home-card') : null;
          if (hoveredCard && hoveredCard !== cardUnder) {
            hoveredCard.classList.remove('drag-over');
          }
          if (cardUnder) {
            cardUnder.classList.add('drag-over');
          }
          hoveredCard = cardUnder;
        }
      };

      const onPointerUp = (ev) => {
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);

        if (hoveredCard) {
          hoveredCard.classList.remove('drag-over');
          hoveredCard = null;
        }

        if (!moved) return;

        if (draggingClone) {
          draggingClone.remove();
          draggingClone = null;
        }
        heroActor.style.opacity = '';

        const dropTarget = document.elementFromPoint(ev.clientX, ev.clientY);
        const homeEl = dropTarget ? dropTarget.closest('.home-card') : null;
        if (homeEl) {
          onHomeCardSelect(homeEl.dataset.id, homeEl);
        }

        setTimeout(() => { moved = false; }, 50);
      };

      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
    });
  }

  setupHeroInteractions();

  /* =========================================================================
   * 6. КНОПКИ МОВИ ("укр" / "рус") ТА МИТТЄВОГО ПЕРЕХОДУ ("Далі ⮕")
   * ========================================================================= */
  let currentLang = 'uk';
  const langBtn = document.getElementById('lang-btn');
  const langText = document.getElementById('lang-text');
  const nextBtn = document.getElementById('next-btn');
  const nextText = document.getElementById('next-text');

  langBtn.addEventListener('click', () => {
    sound.playSelectShadow();
    currentLang = currentLang === 'uk' ? 'ru' : 'uk';
    langText.textContent = currentLang === 'uk' ? 'укр' : 'рус';
    nextText.textContent = currentLang === 'uk' ? 'Далі' : 'Далее';
    const pos = getCenterCoords(langBtn);
    spawnNatureBurst(pos.x, pos.y, 18);
  });

  nextBtn.addEventListener('click', () => {
    sound.playSelectShadow();
    const pos = getCenterCoords(nextBtn);
    spawnNatureBurst(pos.x, pos.y, 26);
    generateLevel();
  });

  // Запуск першого раунду
  window.addEventListener('load', () => {
    generateLevel();
  });
})();
</script>
</body>
</html>
