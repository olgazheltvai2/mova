<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>• • •</title>
  <style>
    /* Full-bleed viewport setup, zero scrollbars, no selection */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #2b1d12;
      touch-action: none;
    }

    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    /* Stylized wooden / paint-palette circular Next button (zero text) */
    #next-btn {
      position: fixed;
      right: clamp(18px, 2.6vw, 38px);
      bottom: clamp(18px, 2.6vw, 38px);
      width: clamp(66px, 6.2vw, 94px);
      height: clamp(66px, 6.2vw, 94px);
      border-radius: 50%;
      border: 4px solid #fff3d1;
      background: radial-gradient(circle at 32% 28%, #f8c66b 0%, #d9832c 55%, #9c4f18 100%);
      box-shadow:
        0 8px 22px rgba(32, 16, 4, 0.45),
        inset 0 3px 6px rgba(255, 248, 220, 0.65),
        inset 0 -5px 10px rgba(95, 42, 8, 0.65);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
      outline: none;
    }

    /* Decorative paint dots around the palette button */
    #next-btn::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 240, 200, 0.45);
      pointer-events: none;
    }

    #next-btn:hover {
      transform: scale(1.09) rotate(4deg);
      box-shadow:
        0 12px 28px rgba(32, 16, 4, 0.55),
        inset 0 3px 8px rgba(255, 248, 220, 0.8),
        inset 0 -5px 10px rgba(95, 42, 8, 0.65);
    }

    #next-btn:active {
      transform: scale(0.93) rotate(-3deg);
      box-shadow:
        0 4px 12px rgba(32, 16, 4, 0.5),
        inset 0 3px 6px rgba(95, 42, 8, 0.5);
    }

    #next-btn.pulse {
      animation: btnPulse 1.4s ease-in-out infinite;
    }

    @keyframes btnPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.11); }
    }

    #next-btn svg {
      width: 56%;
      height: 56%;
      filter: drop-shadow(0 3px 2px rgba(85, 34, 6, 0.45));
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Minimalist icon-only Next button with hand-drawn arrow SVG -->
  <button id="next-btn" aria-label="Next">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 32C22 31.5 34 31.5 47 32" stroke="#FFF9E6" stroke-width="8.5" stroke-linecap="round"/>
      <path d="M35 16C40 22 46 27.5 51 32C46 36.5 40 42 35 48" stroke="#FFF9E6" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="15" cy="17" r="3.2" fill="#FF6B6B"/>
      <circle cx="23" cy="12" r="2.8" fill="#4ECDC4"/>
      <circle cx="15" cy="48" r="3.0" fill="#FFE66D"/>
    </svg>
  </button>

  <script>
    (() => {
      "use strict";

      /* ============================================================================
         1. CANVAS & VIEWPORT MANAGEMENT (16:9 Virtual Space 1600x900, Full-Bleed)
      ============================================================================ */
      const canvas = document.getElementById("game-canvas");
      const ctx = canvas.getContext("2d");
      const nextBtn = document.getElementById("next-btn");

      const VW = 1600;
      const VH = 900;
      let viewW = window.innerWidth;
      let viewH = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let scale = 1;
      let offsetX = 0;
      let offsetY = 0;

      // Subtle offscreen paper texture for warm storybook feel
      const grainCanvas = document.createElement("canvas");
      grainCanvas.width = 128;
      grainCanvas.height = 128;
      const gCtx = grainCanvas.getContext("2d");
      let grainPattern = null;

      function createGrainPattern() {
        const img = gCtx.createImageData(128, 128);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = 220 + Math.random() * 35;
          img.data[i] = v;
          img.data[i + 1] = v - 6;
          img.data[i + 2] = v - 16;
          img.data[i + 3] = 10;
        }
        gCtx.putImageData(img, 0, 0);
        grainPattern = ctx.createPattern(grainCanvas, "repeat");
      }

      function resizeCanvas() {
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(viewW * dpr);
        canvas.height = Math.round(viewH * dpr);
        scale = Math.min(viewW / VW, viewH / VH);
        offsetX = (viewW - VW * scale) * 0.5;
        offsetY = (viewH - VH * scale) * 0.5;
      }

      window.addEventListener("resize", resizeCanvas);
      createGrainPattern();
      resizeCanvas();

      function screenToVirtual(clientX, clientY) {
        return {
          x: (clientX - offsetX) / scale,
          y: (clientY - offsetY) / scale
        };
      }

      /* ============================================================================
         2. WEB AUDIO API SYNTHESIZER (Zero external audio files)
      ============================================================================ */
      const SoundFX = (() => {
        let ac = null;

        function ensure() {
          if (!ac) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) ac = new AudioCtx();
          }
          if (ac && ac.state === "suspended") {
            ac.resume().catch(() => {});
          }
          return ac;
        }

        function createNoiseBuffer(audioCtx, duration) {
          const bufferSize = Math.floor(audioCtx.sampleRate * duration);
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          return buffer;
        }

        function playTone(freqStart, freqEnd, dur, type = "sine", vol = 0.16, delay = 0) {
          const audioCtx = ensure();
          if (!audioCtx) return;
          const now = audioCtx.currentTime + delay;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, now);
          if (freqEnd !== freqStart) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + dur);
          }
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        }

        return {
          tap() {
            const base = 290 + Math.random() * 90;
            playTone(base, base * 0.72, 0.09, "triangle", 0.12);
          },
          nextClick() {
            playTone(420, 620, 0.08, "triangle", 0.12, 0);
            playTone(640, 820, 0.09, "sine", 0.10, 0.04);
          },
          boing() {
            const audioCtx = ensure();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(170, now);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.14);
            osc.frequency.exponentialRampToValueAtTime(240, now + 0.28);
            osc.frequency.exponentialRampToValueAtTime(430, now + 0.42);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
            this.sparkle(0.18);
          },
          splash() {
            const audioCtx = ensure();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const src = audioCtx.createBufferSource();
            src.buffer = createNoiseBuffer(audioCtx, 0.45);
            const filter = audioCtx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(1400, now);
            filter.frequency.exponentialRampToValueAtTime(320, now + 0.42);
            filter.Q.value = 1.2;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.26, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            src.start(now);
            // Water bubbles
            playTone(320, 680, 0.11, "sine", 0.12, 0.05);
            playTone(440, 890, 0.11, "sine", 0.12, 0.13);
            playTone(540, 1080, 0.12, "sine", 0.11, 0.21);
            this.sparkle(0.24);
          },
          popPop() {
            playTone(300, 740, 0.08, "sine", 0.18, 0.0);
            playTone(360, 860, 0.08, "sine", 0.18, 0.09);
            playTone(430, 980, 0.09, "sine", 0.19, 0.18);
            this.sparkle(0.24);
          },
          whoosh() {
            const audioCtx = ensure();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const src = audioCtx.createBufferSource();
            src.buffer = createNoiseBuffer(audioCtx, 0.36);
            const filter = audioCtx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(280, now);
            filter.frequency.exponentialRampToValueAtTime(1900, now + 0.18);
            filter.frequency.exponentialRampToValueAtTime(450, now + 0.35);
            filter.Q.value = 2.0;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.22, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            src.start(now);
            playTone(340, 780, 0.22, "sine", 0.12, 0.04);
            this.sparkle(0.2);
          },
          chirp() {
            playTone(1200, 2100, 0.09, "sine", 0.14, 0.0);
            playTone(1500, 2500, 0.09, "sine", 0.14, 0.11);
            playTone(1350, 2300, 0.11, "sine", 0.14, 0.22);
            this.sparkle(0.25);
          },
          bell() {
            playTone(1180, 1180, 0.35, "sine", 0.16, 0.0);
            playTone(2360, 2360, 0.25, "sine", 0.09, 0.0);
            playTone(1180, 1180, 0.38, "sine", 0.16, 0.15);
            playTone(2360, 2360, 0.28, "sine", 0.09, 0.15);
            this.sparkle(0.28);
          },
          croak() {
            playTone(135, 240, 0.13, "sawtooth", 0.11, 0.08);
            playTone(145, 265, 0.15, "sawtooth", 0.11, 0.26);
            this.splash();
          },
          sparkle(delay = 0) {
            const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
            notes.forEach((n, idx) => {
              playTone(n, n * 1.01, 0.22, "sine", 0.11, delay + idx * 0.055);
            });
          }
        };
      })();

      /* ============================================================================
         3. PARTICLES & TACTILE RIPPLES (100% Hand-Drawn Vector, No Emojis)
      ============================================================================ */
      const particles = [];
      const ripples = [];

      function spawnRipple(x, y) {
        ripples.push({ x, y, r: 8, maxR: 64, alpha: 0.75 });
      }

      function spawnBurst(x, y, types = ["star", "splatter", "petal"], count = 34) {
        const palette = ["#FF6B6B", "#FFD93D", "#6BCB77", "#4D96FF", "#FF9F1C", "#FF85A1", "#A8E6CF", "#FFFFFF"];
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
          const speed = 170 + Math.random() * 440;
          particles.push({
            x: x + (Math.random() - 0.5) * 40,
            y: y + (Math.random() - 0.5) * 40,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 130,
            size: 10 + Math.random() * 16,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 8,
            life: 0,
            maxLife: 0.75 + Math.random() * 0.65,
            type: types[i % types.length],
            color: palette[Math.floor(Math.random() * palette.length)],
            gravity: types[i % types.length] === "bubble" ? -90 : 520
          });
        }
      }

      function updateAndDrawParticles(dt) {
        // Tactile ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
          const rp = ripples[i];
          rp.r += dt * 165;
          rp.alpha -= dt * 1.9;
          if (rp.alpha <= 0) {
            ripples.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.strokeStyle = `rgba(255, 252, 232, ${rp.alpha})`;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Celebration particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            particles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += p.gravity * dt;
          p.vx *= 0.985;
          p.rot += p.vrot * dt;

          const alpha = Math.max(0, 1 - Math.pow(p.life / p.maxLife, 1.8));
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = alpha;
          drawParticleShape(p.type, p.size, p.color);
          ctx.restore();
        }
      }

      function drawParticleShape(type, s, color) {
        ctx.fillStyle = color;
        if (type === "star") {
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const rad = i % 2 === 0 ? s : s * 0.46;
            const a = (i * Math.PI) / 5 - Math.PI / 2;
            const px = Math.cos(a) * rad;
            const py = Math.sin(a) * rad;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
        } else if (type === "petal") {
          ctx.beginPath();
          ctx.moveTo(0, -s);
          ctx.bezierCurveTo(s * 0.85, -s * 0.4, s * 0.75, s * 0.7, 0, s);
          ctx.bezierCurveTo(-s * 0.75, s * 0.7, -s * 0.85, -s * 0.4, 0, -s);
          ctx.fill();
        } else if (type === "bubble") {
          ctx.strokeStyle = "rgba(255,255,255,0.9)";
          ctx.lineWidth = 2.5;
          ctx.fillStyle = "rgba(180,235,255,0.35)";
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.75, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          ctx.beginPath();
          ctx.arc(-s * 0.24, -s * 0.24, s * 0.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (type === "leaf") {
          ctx.fillStyle = "#52B788";
          ctx.beginPath();
          ctx.moveTo(-s, 0);
          ctx.quadraticCurveTo(0, -s * 0.85, s, 0);
          ctx.quadraticCurveTo(0, s * 0.85, -s, 0);
          ctx.fill();
          ctx.strokeStyle = "#2D6A4F";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(-s * 0.8, 0);
          ctx.lineTo(s * 0.8, 0);
          ctx.stroke();
        } else if (type === "note") {
          ctx.beginPath();
          ctx.ellipse(-s * 0.25, s * 0.35, s * 0.42, s * 0.3, -0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = 3.2;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(s * 0.1, s * 0.28);
          ctx.lineTo(s * 0.1, -s * 0.85);
          ctx.quadraticCurveTo(s * 0.75, -s * 0.65, s * 0.55, -s * 0.15);
          ctx.stroke();
        } else if (type === "heart") {
          ctx.beginPath();
          ctx.moveTo(0, s * 0.75);
          ctx.bezierCurveTo(-s * 1.1, 0, -s * 0.9, -s * 0.95, 0, -s * 0.3);
          ctx.bezierCurveTo(s * 0.9, -s * 0.95, s * 1.1, 0, 0, s * 0.75);
          ctx.fill();
        } else {
          // Organic paint splatter
          ctx.beginPath();
          ctx.arc(0, 0, s * 0.62, 0, Math.PI * 2);
          ctx.arc(s * 0.5, -s * 0.3, s * 0.25, 0, Math.PI * 2);
          ctx.arc(-s * 0.45, s * 0.35, s * 0.22, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      /* ============================================================================
         4. SHARED ILLUSTRATION HELPERS (Skies, Clouds, Sun, Eyes, Trees, Hills)
      ============================================================================ */
      function lerp(a, b, t) { return a + (b - a) * t; }
      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
      function easeOutBack(t) {
        const c1 = 1.70158, c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }
      function easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      // Compute juicy squash/stretch transform during fix animation
      function getMorphScale(anim) {
        if (anim <= 0 || anim >= 1) return { sx: 1, sy: 1 };
        if (anim < 0.22) {
          const p = anim / 0.22;
          return { sx: 1 + 0.24 * Math.sin(p * Math.PI), sy: 1 - 0.26 * Math.sin(p * Math.PI) };
        }
        const p = (anim - 0.22) / 0.78;
        const bounce = easeOutBack(p);
        return { sx: 0.75 + 0.25 * bounce, sy: 0.75 + 0.25 * bounce };
      }

      function drawSky(topColor, midColor, botColor) {
        const grad = ctx.createLinearGradient(0, -350, 0, 1250);
        grad.addColorStop(0, topColor);
        grad.addColorStop(0.55, midColor);
        grad.addColorStop(1, botColor);
        ctx.fillStyle = grad;
        ctx.fillRect(-700, -400, 3000, 1750);
      }

      function drawSun(x, y, r, t, rayColor = "rgba(255, 240, 150, 0.35)") {
        ctx.save();
        ctx.translate(x, y);
        // Rotating sunbeams
        ctx.save();
        ctx.rotate(t * 0.14);
        ctx.fillStyle = rayColor;
        for (let i = 0; i < 12; i++) {
          ctx.rotate((Math.PI * 2) / 12);
          ctx.beginPath();
          ctx.moveTo(-r * 0.18, -r * 1.05);
          ctx.lineTo(0, -r * (1.75 + 0.12 * Math.sin(t * 2 + i)));
          ctx.lineTo(r * 0.18, -r * 1.05);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // Warm glow
        const glow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.1);
        glow.addColorStop(0, "rgba(255, 247, 170, 0.95)");
        glow.addColorStop(0.45, "rgba(255, 215, 90, 0.45)");
        glow.addColorStop(1, "rgba(255, 215, 90, 0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.1, 0, Math.PI * 2);
        ctx.fill();

        // Sun body
        const core = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
        core.addColorStop(0, "#FFFCE0");
        core.addColorStop(0.7, "#FFD94A");
        core.addColorStop(1, "#FFA62B");
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawCloud(x, y, s, alpha = 0.92, tint = "#FFFFFF") {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = tint;
        ctx.beginPath();
        ctx.arc(-44, 12, 28, 0, Math.PI * 2);
        ctx.arc(-14, -6, 38, 0, Math.PI * 2);
        ctx.arc(26, -2, 34, 0, Math.PI * 2);
        ctx.arc(54, 14, 24, 0, Math.PI * 2);
        ctx.rect(-44, 10, 98, 30);
        ctx.fill();
        ctx.restore();
      }

      function drawDriftingClouds(t, count = 4, tint = "#FFFFFF", yMax = 240) {
        for (let i = 0; i < count; i++) {
          const speed = 14 + i * 5;
          const cx = ((i * 460 + t * speed) % 2300) - 350;
          const cy = 95 + (i % 3) * (yMax / 3.2) + Math.sin(t * 0.7 + i) * 7;
          drawCloud(cx, cy, 0.85 + (i % 3) * 0.25, 0.88, tint);
        }
      }

      function drawRollingHills(yBase, color1, color2, color3) {
        // Distant hill
        ctx.fillStyle = color1;
        ctx.beginPath();
        ctx.moveTo(-700, 1300);
        ctx.lineTo(-700, yBase - 40);
        ctx.bezierCurveTo(-100, yBase - 180, 500, yBase - 140, 950, yBase - 30);
        ctx.bezierCurveTo(1350, yBase - 160, 1850, yBase - 110, 2300, yBase - 20);
        ctx.lineTo(2300, 1300);
        ctx.closePath();
        ctx.fill();

        // Mid hill
        ctx.fillStyle = color2;
        ctx.beginPath();
        ctx.moveTo(-700, 1300);
        ctx.lineTo(-700, yBase + 40);
        ctx.bezierCurveTo(150, yBase - 65, 650, yBase + 90, 1180, yBase + 10);
        ctx.bezierCurveTo(1550, yBase - 50, 1950, yBase + 40, 2300, yBase + 20);
        ctx.lineTo(2300, 1300);
        ctx.closePath();
        ctx.fill();

        // Foreground meadow
        const fg = ctx.createLinearGradient(0, yBase + 30, 0, 1100);
        fg.addColorStop(0, color3);
        fg.addColorStop(1, color2);
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(-700, 1300);
        ctx.lineTo(-700, yBase + 95);
        ctx.quadraticCurveTo(800, yBase + 15, 2300, yBase + 105);

              ctx.quadraticCurveTo(mx + s.x * 0.5, my - 160, mx + s.x + sw, my + s.y);
              ctx.stroke();
            });

            // Blossoms on stems
            stems.forEach((s, idx) => {
              ctx.save();
              ctx.translate(mx + s.x + sw, my + s.y);
              ctx.scale(ms.sx, ms.sy);

              if (!st.fixed || st.anim < 0.25) {
                // MISTAKE: Colorful striped socks growing on flower stems!
                ctx.rotate((idx - 1) * 0.25);
                const sockCol = idx === 1 ? "#FF595E" : idx === 0 ? "#1982C4" : "#8338EC";
                ctx.fillStyle = sockCol;
                drawRoundRect(-22, -74, 44, 72, 10); ctx.fill();
                // Sock foot
                ctx.beginPath();
                ctx.ellipse(16, -12, 34, 20, 0.1, 0, Math.PI * 2);
                ctx.fill();
                // Stripes
                ctx.fillStyle = "#FFCA3A";
                ctx.fillRect(-22, -58, 44, 10);
                ctx.fillRect(-22, -38, 44, 10);
              } else {
                // FIXED: Vibrant red & yellow tulips!
                const tCol = idx === 1 ? "#E63946" : "#FFCA3A";
                ctx.fillStyle = tCol;
                ctx.beginPath();
                ctx.moveTo(0, 12);
                ctx.bezierCurveTo(-44, 4, -46, -54, -28, -74);
                ctx.lineTo(-10, -46);
                ctx.lineTo(0, -82);
                ctx.lineTo(10, -46);
                ctx.lineTo(28, -74);
                ctx.bezierCurveTo(46, -54, 44, 4, 0, 12);
                ctx.closePath();
                ctx.fill();
              }
              ctx.restore();
            });

            drawPot(mx, my);
          }
        },

        /* ------------------------------------------------------------------------
           SCENE 19: Sunny Carrot Patch — White bunny with crocodile tail -> Fluffy cotton tail
        ------------------------------------------------------------------------ */
        {
          sound: "boing",
          particles: ["star", "heart", "leaf"],
          hitbox: { x: 840, y: 450, w: 420, h: 270 },
          draw(t, st) {
            drawSky("#74C0FC", "#BDE0FE", "#FFF3B0");
            drawSun(220, 145, 74, t);
            drawDriftingClouds(t, 4, "#FFFFFF", 160);
            drawRollingHills(570, "#95D5B2", "#74C69D", "#52B788");

            // Carrot patch soil rows
            ctx.fillStyle = "#8D5524";
            ctx.beginPath(); ctx.ellipse(420, 775, 290, 56, 0, 0, Math.PI * 2); ctx.fill();
            // Carrots peeking out of ground
            [260, 360, 460, 550].forEach((cx, i) => {
              ctx.fillStyle = "#2B9348";
              ctx.beginPath();
              ctx.ellipse(cx - 8, 722, 7, 22, -0.3, 0, Math.PI * 2);
              ctx.ellipse(cx + 8, 722, 7, 22, 0.3, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#FF7B00";
              ctx.beginPath(); ctx.ellipse(cx, 750, 18, 22, 0, 0, Math.PI * 2); ctx.fill();
            });

            // SUBJECT: Fluffy White Bunny
            const hop = st.fixed ? Math.abs(Math.sin(t * 5.2)) * 28 : 0;
            const bx = 735, by = 710 - hop;
            drawShadowEllipse(bx, 725, 165, 28, 0.22);

            // TAIL (Scaly green crocodile tail -> Fluffy white cotton-ball tail)
            const ms = getMorphScale(st.anim);
            ctx.save();
            ctx.translate(bx + 115, by - 68);
            ctx.scale(ms.sx, ms.sy);

            if (!st.fixed || st.anim < 0.25) {
              // MISTAKE: Long scaly green crocodile tail!
              const swish = Math.sin(t * 3) * 16;
              ctx.fillStyle = "#40916C";
              ctx.beginPath();
              ctx.moveTo(-20, -34);
              ctx.bezierCurveTo(105, -45, 200, -10 + swish, 295, 18 + swish);
              ctx.bezierCurveTo(195, 58 + swish, 95, 55, -20, 36);
              ctx.closePath();
              ctx.fill();
              // Crocodile ridges along top
              ctx.fillStyle = "#1B4332";
              for (let k = 0; k < 6; k++) {
                const rx = 25 + k * 40;
                const ry = -32 + k * 7 + (k / 6) * swish;
                ctx.beginPath();
                ctx.moveTo(rx - 14, ry + 8);
                ctx.lineTo(rx, ry - 18);
                ctx.lineTo(rx + 14, ry + 10);
                ctx.closePath();
                ctx.fill();
              }
            } else {
              // FIXED: Fluffy round white cotton-ball tail!
              ctx.fillStyle = "#FFFFFF";
              ctx.beginPath();
              ctx.arc(16, -4, 34, 0, Math.PI * 2);
              ctx.arc(34, -18, 24, 0, Math.PI * 2);
              ctx.arc(34, 12, 24, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();

            // Bunny body & paws
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath(); ctx.ellipse(bx, by - 95, 118, 96, -0.1, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath();
            ctx.ellipse(bx - 55, by - 4, 46, 20, 0, 0, Math.PI * 2);
            ctx.ellipse(bx + 45, by - 4, 46, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            // Long bunny ears
            ctx.save();
            ctx.translate(bx - 75, by - 235);
            [-0.22, 0.16].forEach(ang => {
              ctx.save();
              ctx.rotate(ang);
              ctx.fillStyle = "#FFFFFF";
              ctx.beginPath(); ctx.ellipse(0, -68, 24, 72, 0, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = "#FFB5C2";
              ctx.beginPath(); ctx.ellipse(0, -64, 12, 52, 0, 0, Math.PI * 2); ctx.fill();
              ctx.restore();
            });
            ctx.restore();

            // Bunny head
            ctx.fillStyle = "#FFFFFF";
            ctx.beginPath(); ctx.arc(bx - 88, by - 195, 68, 0, Math.PI * 2); ctx.fill();
            drawCuteEye(bx - 112, by - 208, 10, t, st.fixed, 22);
            ctx.fillStyle = "#FF85A1";
            ctx.beginPath(); ctx.arc(bx - 150, by - 190, 9, 0, Math.PI * 2); ctx.fill();

            // Carrot nibbled happily when fixed
            if (st.fixed) {
              ctx.save();
              ctx.translate(bx - 158, by - 165);
              ctx.rotate(0.4 + Math.sin(t * 9) * 0.08);
              ctx.fillStyle = "#FF7B00";
              ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(-68, 0); ctx.lineTo(0, 10); ctx.closePath(); ctx.fill();
              ctx.fillStyle = "#2B9348";
              ctx.beginPath(); ctx.ellipse(12, 0, 14, 7, 0, 0, Math.PI * 2); ctx.fill();
              ctx.restore();
            }
          }
        },

        /* ------------------------------------------------------------------------
           SCENE 20: Park Picnic — Muddy rubber boot on plate -> Layered Berry Cake
        ------------------------------------------------------------------------ */
        {
          sound: "sparkle",
          particles: ["star", "petal", "heart"],
          hitbox: { x: 610, y: 390, w: 380, h: 320 },
          draw(t, st) {
            drawSky("#74C0FC", "#BDE0FE", "#FFF3B0");
            drawSun(1370, 140, 74, t);
            drawDriftingClouds(t, 4, "#FFFFFF", 160);
            drawRollingHills(490, "#95D5B2", "#74C69D", "#52B788");

            // Butterflies fluttering above picnic
            drawButterfly(350 + Math.sin(t * 1.5) * 60, 260 + Math.cos(t * 2.1) * 28, 1.05, "#FF9F1C", "#FFD166", t);
            drawButterfly(1210 + Math.cos(t * 1.3) * 55, 240 + Math.sin(t * 2.2) * 25, 1.0, "#FF6B9D", "#FFC2D1", t + 2);

            // Vibrant red-and-white checkered picnic blanket (perspective trapezoid)
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(310, 560); ctx.lineTo(1290, 560);
            ctx.lineTo(1480, 865); ctx.lineTo(120, 865);
            ctx.closePath();
            ctx.clip();
            ctx.fillStyle = "#FFFDF7";
            ctx.fillRect(100, 550, 1400, 330);
            ctx.fillStyle = "rgba(230, 57, 70, 0.78)";
            for (let gx = 100; gx < 1500; gx += 96) ctx.fillRect(gx, 550, 48, 330);
            ctx.fillStyle = "rgba(230, 57, 70, 0.35)";
            for (let gy = 550; gy < 880; gy += 68) ctx.fillRect(100, gy, 1400, 34);
            ctx.restore();

            // Lemonade pitcher on left
            ctx.save();
            ctx.translate(410, 625);
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            drawRoundRect(-46, -98, 92, 128, 22); ctx.fill();
            ctx.fillStyle = "#FFE66D";
            drawRoundRect(-38, -56, 76, 80, 16); ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.85)";
            ctx.lineWidth = 10;
            ctx.beginPath(); ctx.arc(48, -42, 26, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
            ctx.restore();

            // Shiny apples on right
            [1175, 1245].forEach((ax, i) => {
              ctx.fillStyle = i === 0 ? "#E63946" : "#8AC926";
              ctx.beginPath(); ctx.arc(ax, 665 + i * 18, 32, 0, Math.PI * 2); ctx.fill();
              ctx.strokeStyle = "#582F0E"; ctx.lineWidth = 4;
              ctx.beginPath(); ctx.moveTo(ax, 634 + i * 18); ctx.lineTo(ax + 6, 618 + i * 18); ctx.stroke();
            });

            // Main dinner plate, fork & knife in center
            const px = 800, py = 680;
            // Fork (left)
            ctx.fillStyle = "#ADB5BD";
            drawRoundRect(px - 235, py - 58, 14, 125, 6); ctx.fill();
            ctx.fillRect(px - 246, py - 88, 36, 36);
            // Knife (right)
            drawRoundRect(px + 220, py - 78, 16, 145, 7); ctx.fill();

            // Plate
            drawShadowEllipse(px, py + 18, 175, 48, 0.22);
            ctx.fillStyle = "#FFFDF9";
            ctx.beginPath(); ctx.ellipse(px, py, 175, 56, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#48CAE4";
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.ellipse(px, py, 142, 42, 0, 0, Math.PI * 2); ctx.stroke();

            // SUBJECT: Muddy Rubber Boot -> Delicious Layered Berry Cake
            const ms = getMorphScale(st.anim);
            ctx.save();
            ctx.translate(px, py + 4);
            ctx.scale(ms.sx, ms.sy);

            if (!st.fixed || st.anim < 0.25) {
              // MISTAKE: Muddy green rubber rain boot served on plate!
              ctx.fillStyle = "#386641";
              drawRoundRect(-54, -220, 96, 175, 14); ctx.fill();
              ctx.beginPath();
              ctx.ellipse(36, -34, 86, 42, 0, 0, Math.PI * 2);
              ctx.fill();
              // Sole
              ctx.fillStyle = "#2B2D42";
              drawRoundRect(-56, -12, 178, 22, 8); ctx.fill();
              // Mud splatters
              ctx.fillStyle = "#6F4518";
              ctx.beginPath();
              ctx.ellipse(24, -22, 42, 16, 0.1, 0, Math.PI * 2);
              ctx.arc(-22, -64, 15, 0, Math.PI * 2);
              ctx.arc(65, -36, 12, 0, Math.PI * 2);
              ctx.fill();
            } else {
              // FIXED: Delicious layered berry cake with strawberries!
              // Cake base
              ctx.fillStyle = "#F4A261";
              drawRoundRect(-112, -125, 224, 125, 18); ctx.fill();
              // Pink berry cream filling layer
              ctx.fillStyle = "#FF8FA3";
              ctx.fillRect(-112, -72, 224, 24);
              // Glossy white frosting dripping down top
              ctx.fillStyle = "#FFFDF9";
              ctx.beginPath();
              ctx.ellipse(0, -122, 114, 34, 0, 0, Math.PI * 2);
              ctx.fill();
              for (let d = -90; d <= 90; d += 36) {
                ctx.beginPath();
                ctx.arc(d, -108, 18, 0, Math.PI * 2);
                ctx.fill();
              }
              // Bright red strawberries on top
              [-62, 0, 62].forEach((sx, idx) => {
                const sy = idx === 1 ? -144 : -134;
                ctx.fillStyle = "#E63946";
                ctx.beginPath();
                ctx.moveTo(sx - 18, sy - 6);
                ctx.quadraticCurveTo(sx, sy - 38, sx + 18, sy - 6);
                ctx.quadraticCurveTo(sx, sy + 16, sx - 18, sy - 6);
                ctx.fill();
                ctx.fillStyle = "#52B788";
                ctx.beginPath(); ctx.ellipse(sx, sy - 24, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
              });
            }
            ctx.restore();
          }
        },

        /* ------------------------------------------------------------------------
           SCENE 20: Sunny Meadow Hill — Upside-down tree (roots in sky) -> Right-side-up tree
        ------------------------------------------------------------------------ */
        {
          sound: "whoosh",
          particles: ["leaf", "star", "petal"],
          hitbox: { x: 540, y: 120, w: 520, h: 610 },
          draw(t, st) {
            drawSky("#64B5F6", "#BDE0FE", "#FFF8D6");
            drawSun(220, 145, 76, t);
            drawDriftingClouds(t, 4, "#FFFFFF", 165);
            drawRollingHills(590, "#A3D9A5", "#74C69D", "#52B788");

            // Wooden meadow fence in background
            ctx.fillStyle = "#C68B59";
            ctx.fillRect(-200, 600, 2000, 14);
            ctx.fillRect(-200, 642, 2000, 14);
            for (let fx = -80; fx < 1760; fx += 135) {
              drawRoundRect(fx, 570, 22, 110, 6);
              ctx.fill();
            }

            // Meadow flowers & swaying grass
            for (let i = 0; i < 6; i++) {
              drawFlower(160 + i * 260, 790 + (i % 2) * 35, 1.0, i % 2 === 0 ? "#FFD60A" : "#FF85A1", "#FFFFFF", t + i);
            }

            // SUBJECT: Big Tree (Upside-down roots in sky -> Right-side-up lush green tree!)
            const tx = 800, ty = 460;
            const flipP = st.fixed ? easeOutBack(clamp(st.anim, 0, 1)) : 0;
            const rot = lerp(Math.PI, 0, flipP);
            const sway = Math.sin(t * 1.6) * (st.fixed ? 0.025 : 0.01);
            const clickBounce = st.bounce > 0 ? Math.sin(st.bounce * Math.PI) * 18 : 0;

            drawShadowEllipse(tx, 742, 225, 36, 0.22);

            ctx.save();
            ctx.translate(tx, ty - clickBounce);
            ctx.rotate(rot + sway);

            // Sturdy tree trunk
            const trG = ctx.createLinearGradient(-55, 0, 55, 0);
            trG.addColorStop(0, "#6F4518");
            trG.addColorStop(0.5, "#9C6644");
            trG.addColorStop(1, "#582F0E");
            ctx.fillStyle = trG;
            ctx.beginPath();
            ctx.moveTo(-56, 260);
            ctx.quadraticCurveTo(-36, 80, -42, -55);
            ctx.lineTo(42, -55);
            ctx.quadraticCurveTo(36, 80, 56, 260);
            ctx.closePath();
            ctx.fill();

            // Tangled brown roots (sticking up into the sky when upside-down, grounded when fixed!)
            ctx.strokeStyle = "#6F4518";
            ctx.lineWidth = 22;
            ctx.lineCap = "round";
            const roots = [
              [-35, 245, -135, 295, -185, 275],
              [-15, 252, -75, 315, -110, 345],
              [0, 255, 15, 325, 0, 360],
              [22, 252, 85, 315, 128, 340],
              [38, 242, 130, 290, 185, 268]
            ];
            roots.forEach(([x0, y0, cx1, cy1, x2, y2]) => {
              ctx.beginPath();
              ctx.moveTo(x0, y0);
              ctx.quadraticCurveTo(cx1, cy1, x2, y2);
              ctx.stroke();
            });

            // Lush green leafy crown
            const crownPuffs = [
              { x: -135, y: -95, r: 108, c: "#2D6A4F" },
              { x: 135, y: -95, r: 108, c: "#2D6A4F" },
              { x: -85, y: -195, r: 118, c: "#40916C" },
              { x: 85, y: -195, r: 118, c: "#40916C" },
              { x: 0, y: -245, r: 128, c: "#52B788" },
              { x: 0, y: -125, r: 132, c: "#5EC28E" }
            ];
            crownPuffs.forEach(p => {
              ctx.fillStyle = p.c;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
            });
            ctx.restore();

            // Foreground grass mound covering base neatly
            ctx.fillStyle = "#52B788";
            ctx.beginPath();
            ctx.ellipse(tx, 765, 240, 48, 0, Math.PI, 0);
            ctx.fill();
          }
        }
      ];

      /* ============================================================================
         6. GAME STATE, INPUT HANDLING & PAINTERLY FRAME
      ============================================================================ */
      let currentIndex = 0;
      let sceneState = { fixed: false, anim: 0, celebrateTime: 0, bounce: 0 };
      let transitionAlpha = 0; // Smooth warm fade on scene change
      let globalTime = 0;
      let lastFrame = performance.now();

      function advanceScene() {
        SoundFX.nextClick();
        currentIndex = (currentIndex + 1) % SCENES.length;
        sceneState = { fixed: false, anim: 0, celebrateTime: 0, bounce: 0 };
        particles.length = 0;
        ripples.length = 0;
        transitionAlpha = 0.85;
        nextBtn.classList.remove("pulse");
      }

      nextBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        advanceScene();
      });

      function isPointInHitbox(pt, hb) {
        const pad = 35;
        return (
          pt.x >= hb.x - pad &&
          pt.x <= hb.x + hb.w + pad &&
          pt.y >= hb.y - pad &&
          pt.y <= hb.y + hb.h + pad
        );
      }

      function handleCanvasTap(clientX, clientY) {
        const pt = screenToVirtual(clientX, clientY);
        const scene = SCENES[currentIndex];
        const hb = scene.hitbox;
        const inside = isPointInHitbox(pt, hb);

        if (inside && !sceneState.fixed) {
          sceneState.fixed = true;
          sceneState.anim = 0.001;
          sceneState.celebrateTime = 0;
          if (SoundFX[scene.sound]) SoundFX[scene.sound]();
          spawnBurst(hb.x + hb.w * 0.5, hb.y + hb.h * 0.5, scene.particles, 38);
          nextBtn.classList.add("pulse");
        } else if (inside && sceneState.fixed) {
          // Joyful extra sparkle & happy bounce when tapping the already-fixed object!
          sceneState.bounce = 1;
          SoundFX.sparkle();
          spawnBurst(pt.x, pt.y, scene.particles, 18);
        } else {
          // Gentle playful tap feedback anywhere else on the living scene
          SoundFX.tap();
          spawnRipple(pt.x, pt.y);
        }
      }

      canvas.addEventListener("pointerdown", (e) => {
        handleCanvasTap(e.clientX, e.clientY);
      });

      canvas.addEventListener("pointermove", (e) => {
        const pt = screenToVirtual(e.clientX, e.clientY);
        const inside = isPointInHitbox(pt, SCENES[currentIndex].hitbox);
        canvas.style.cursor = inside ? "pointer" : "default";
      });

      function handleCanvasTap(clientX, clientY) {
        const pt = screenToVirtual(clientX, clientY);
        const scene = SCENES[currentIndex];
        const hb = scene.hitbox;
        // Generous +35px padding around hitbox for kid-friendly touch/mouse control
        const pad = 35;
        const inside =
          pt.x >= hb.x - pad &&
          pt.x <= hb.x + hb.w + pad &&
          pt.y >= hb.y - pad &&
          pt.y <= hb.y + hb.h + pad;

        if (inside && !sceneState.fixed) {
          sceneState.fixed = true;
          sceneState.anim = 0.001;
          sceneState.celebrateTime = 0;
          if (SoundFX[scene.sound]) SoundFX[scene.sound]();
          spawnBurst(hb.x + hb.w * 0.5, hb.y + hb.h * 0.5, scene.particles, 38);
          nextBtn.classList.add("pulse");
        } else if (inside && sceneState.fixed) {
          // Joyful extra sparkle when tapping the already-fixed object!
          SoundFX.sparkle();
          spawnBurst(pt.x, pt.y, scene.particles, 16);
        } else {
          // Gentle playful tap feedback anywhere else on the living scene
          SoundFX.tap();
          spawnRipple(pt.x, pt.y);
        }
      }

      canvas.addEventListener("pointerdown", (e) => {
        handleCanvasTap(e.clientX, e.clientY);
      });

      // Draw subtle textured storybook wooden/painterly vignette border around viewport
      function drawPainterlyFrame() {
        ctx.save();
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Soft paper grain across whole canvas
        if (grainPattern) {
          ctx.fillStyle = grainPattern;
          ctx.fillRect(0, 0, viewW, viewH);
        }

        // Warm painterly vignette around edges
        const rad = Math.max(viewW, viewH) * 0.72;
        const vig = ctx.createRadialGradient(viewW * 0.5, viewH * 0.5, rad * 0.58, viewW * 0.5, viewH * 0.5, rad);
        vig.addColorStop(0, "rgba(45, 25, 10, 0)");
        vig.addColorStop(0.82, "rgba(45, 25, 10, 0.14)");
        vig.addColorStop(1, "rgba(45, 22, 8, 0.42)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, viewW, viewH);

        // Thin handcrafted wooden storybook border
        const bw = Math.max(8, Math.min(viewW, viewH) * 0.014);
        ctx.strokeStyle = "#6F4518";
        ctx.lineWidth = bw * 2;
        ctx.strokeRect(0, 0, viewW, viewH);

        ctx.strokeStyle = "rgba(255, 240, 200, 0.35)";
        ctx.lineWidth = 2;
        ctx.strokeRect(bw + 2, bw + 2, viewW - (bw + 2) * 2, viewH - (bw + 2) * 2);

        // Smooth scene transition veil
        if (transitionAlpha > 0.005) {
          ctx.fillStyle = `rgba(255, 246, 226, ${transitionAlpha})`;
          ctx.fillRect(0, 0, viewW, viewH);
        }
        ctx.restore();
      }

      /* ============================================================================
         7. MAIN 60FPS ANIMATION LOOP
      ============================================================================ */
      function loop(now) {
        const dt = Math.min(0.05, (now - lastFrame) / 1000);
        lastFrame = now;
        globalTime += dt;

        if (sceneState.fixed && sceneState.anim < 1) {
          sceneState.anim = Math.min(1, sceneState.anim + dt * 1.9);
        }
        if (sceneState.fixed) {
          sceneState.celebrateTime += dt;
        }
        if (sceneState.bounce > 0) {
          sceneState.bounce = Math.max(0, sceneState.bounce - dt * 2.8);
        }
        if (transitionAlpha > 0) {
          transitionAlpha = Math.max(0, transitionAlpha - dt * 3.4);
        }

        // Apply high-DPI + centered 16:9 virtual transform
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        // Render active scene
        SCENES[currentIndex].draw(globalTime, sceneState);

        // Render particles & ripples in virtual coordinates
        updateAndDrawParticles(dt);

        // Render viewport-fitted painterly frame & vignette
        drawPainterlyFrame();

        requestAnimationFrame(loop);
      }

      window.onload = function () {
        resizeCanvas();
        lastFrame = performance.now();
        requestAnimationFrame(loop);
      };
    })();
  </script>
