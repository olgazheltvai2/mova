<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Підводний риф</title>
  <!-- Rounded, child-friendly Cyrillic typography with reliable system fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       GLOBAL RESET & WIDESCREEN VIEWPORT LOCK
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #04253e;
      font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      touch-action: manipulation;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, #1994b8 0%, #0b5a82 46%, #052f52 84%, #031c35 100%);
    }

    /* =========================================================================
       CANVAS LAYERS (BACKDROP OCEAN + FOREGROUND DISSOLVE PARTICLES)
       ========================================================================= */
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #bg-canvas {
      z-index: 1;
      pointer-events: none;
    }

    #fx-canvas {
      z-index: 40;
      pointer-events: none;
    }

    /* Subtle animated caustic overlay for underwater immersion */
    #caustic-veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 65% 28% at 30% 6%, rgba(162, 245, 255, 0.16), transparent 72%),
        radial-gradient(ellipse 55% 26% at 72% 8%, rgba(145, 240, 255, 0.14), transparent 72%);
      animation: veilPulse 7s ease-in-out infinite alternate;
    }

    @keyframes veilPulse {
      0%   { opacity: 0.72; transform: translateX(-1.5%) scaleY(1); }
      100% { opacity: 1;    transform: translateX(1.5%)  scaleY(1.06); }
    }

    /* =========================================================================
       TOP INTERFACE LAYER (LANGUAGE BUTTON, DRIFTWOOD WORD PLAQUE, NEXT BUTTON)
       ========================================================================= */
    #top-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 18vh;
      min-height: 86px;
      max-height: 158px;
      z-index: 30;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(8px, 1.5vh, 18px) clamp(14px, 2.2vw, 34px);
    }

    /* Circular sea-glass & antique brass medallion buttons */
    .medallion-btn {
      pointer-events: auto;
      position: relative;
      width: clamp(54px, 5.2vw, 72px);
      height: clamp(54px, 5.2vw, 72px);
      border-radius: 50%;
      border: 3px solid #c99b52;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 30% 25%, rgba(173, 246, 248, 0.72) 0%, rgba(35, 147, 168, 0.78) 46%, rgba(12, 74, 98, 0.92) 100%);
      box-shadow:
        0 8px 22px rgba(2, 18, 34, 0.55),
        inset 0 2px 5px rgba(255, 252, 232, 0.65),
        inset 0 -4px 8px rgba(4, 34, 52, 0.72),
        0 0 0 2px rgba(72, 48, 22, 0.75);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, filter 0.22s ease;
      outline: none;
      flex-shrink: 0;
    }

    .medallion-btn::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 236, 186, 0.45);
      pointer-events: none;
    }

    .medallion-btn::after {
      content: "";
      position: absolute;
      top: 7px;
      left: 12px;
      width: 44%;
      height: 24%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0));
      transform: rotate(-18deg);
      pointer-events: none;
    }

    .medallion-btn:hover {
      transform: translateY(-2px) scale(1.07);
      box-shadow:
        0 10px 26px rgba(2, 18, 34, 0.62),
        0 0 18px rgba(102, 242, 255, 0.45),
        inset 0 2px 6px rgba(255, 252, 232, 0.8),
        inset 0 -4px 8px rgba(4, 34, 52, 0.72),
        0 0 0 2px rgba(92, 62, 28, 0.85);
      filter: brightness(1.08);
    }

    .medallion-btn:active {
      transform: translateY(1px) scale(0.95);
    }

    #lang-btn {
      font-family: inherit;
      font-weight: 900;
      font-size: clamp(15px, 1.45vw, 21px);
      letter-spacing: 0.04em;
      color: #fff6d9;
      text-shadow: 0 2px 4px rgba(4, 24, 38, 0.85), 0 0 8px rgba(255, 235, 170, 0.35);
      text-transform: lowercase;
    }

    #next-btn svg {
      width: 54%;
      height: 54%;
      filter: drop-shadow(0 2px 3px rgba(3, 22, 36, 0.75));
      transition: transform 0.22s ease;
    }

    #next-btn:hover svg {
      transform: translateX(2px);
    }

    /* =========================================================================
       CARVED DRIFTWOOD & WEATHERED BRONZE WORD PLAQUE
       ========================================================================= */
    #plaque-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(320px, 50vw, 700px);
      height: clamp(78px, 13.8vh, 132px);
      pointer-events: none;
      animation: plaqueFloat 5.6s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes plaqueFloat {
      0%, 100% { transform: translateY(0px) rotate(-0.35deg); }
      50%      { transform: translateY(4px) rotate(0.4deg); }
    }

    #plaque-wrap.word-swap {
      animation: plaqueSwap 0.52s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes plaqueSwap {
      0%   { transform: translateY(0) scale(1); }
      35%  { transform: translateY(7px) scale(0.95) rotate(-1.2deg); filter: brightness(1.12); }
      72%  { transform: translateY(-4px) scale(1.035) rotate(0.7deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }

    #plaque-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 12px 22px rgba(2, 16, 30, 0.58)) drop-shadow(0 2px 5px rgba(0, 0, 0, 0.35));
    }

    #target-word {
      position: relative;
      z-index: 2;
      font-weight: 900;
      font-size: clamp(24px, 3.6vw, 54px);
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff5d6;
      text-align: center;
      white-space: nowrap;
      padding: 0 8%;
      text-shadow:
        0 3px 0 #3f2411,
        0 5px 10px rgba(10, 20, 30, 0.72),
        0 0 18px rgba(255, 224, 145, 0.32);
      transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #target-word.long-word {
      font-size: clamp(20px, 2.85vw, 43px);
      letter-spacing: 0.045em;
    }

    #target-word.word-fade {
      opacity: 0;
      transform: scale(0.88);
    }

    /* =========================================================================
       OCEAN CREATURE PLAYFIELD
       ========================================================================= */
    #creatures-layer {
      position: absolute;
      top: 17.5vh;
      left: 2.5vw;
      width: 95vw;
      height: 78.5vh;
      z-index: 15;
    }

    .creature-slot {
      position: absolute;
      transform: translate(-50%, -50%);
      width: min(21vw, 27.5vh);
      height: min(16.2vw, 22vh);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.55s ease;
    }

    .creature-slot.entered {
      opacity: 1;
    }

    .creature-slot.solved {
      pointer-events: none;
    }

    /* Hover luminous underwater caustic aura (no rectangles!) */
    .creature-hit {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), filter 0.26s ease;
      filter: drop-shadow(0 12px 14px rgba(2, 22, 42, 0.48));
      will-change: transform, filter;
    }

    .creature-slot:not(.solved):hover .creature-hit {
      transform: scale(1.11) translateY(-4px);
      filter:
        drop-shadow(0 16px 18px rgba(2, 22, 42, 0.55))
        drop-shadow(0 0 18px rgba(130, 245, 255, 0.52));
    }

    .creature-slot:not(.solved):active .creature-hit {
      transform: scale(0.97);
    }

    /* Inner wrapper for species-specific natural motion */
    .creature-motion {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    /* Inner wrapper for optional horizontal facing flip */
    .creature-flip {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .creature-flip.flipped {
      transform: scaleX(-1);
    }

    .creature-svg {
      width: 96%;
      height: 96%;
      overflow: visible;
      pointer-events: none;
    }

    /* =========================================================================
       SPECIES-APPROPRIATE REALISTIC SWIM & FLOAT ANIMATIONS
       ========================================================================= */
    .motion-swim-glide {
      animation: swimGlide var(--dur, 6.2s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes swimGlide {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      25%      { transform: translate(7px, -7px) rotate(-2.2deg); }
      50%      { transform: translate(12px, 1px) rotate(1.2deg); }
      75%      { transform: translate(4px, 7px) rotate(2.4deg); }
    }

    .motion-jelly-pulse {
      animation: jellyPulse var(--dur, 4.4s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes jellyPulse {
      0%, 100% { transform: translateY(7px) scale(1.03, 0.96) rotate(-1.5deg); }
      38%      { transform: translateY(-9px) scale(0.95, 1.06) rotate(1.8deg); }
      68%      { transform: translateY(-3px) scale(1.01, 0.99) rotate(0.6deg); }
    }

    .motion-octo-float {
      animation: octoFloat var(--dur, 5.5s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes octoFloat {
      0%, 100% { transform: translate(0px, 4px) rotate(-2.5deg) scale(1); }
      35%      { transform: translate(-6px, -8px) rotate(2.2deg) scale(1.03, 0.98); }
      70%      { transform: translate(6px, -2px) rotate(-1.2deg) scale(0.98, 1.03); }
    }

    .motion-seahorse-bob {
      animation: seahorseBob var(--dur, 4.8s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes seahorseBob {
      0%, 100% { transform: translateY(6px) rotate(-3deg); }
      50%      { transform: translateY(-9px) rotate(3.2deg); }
    }

    .motion-crab-scuttle {
      animation: crabScuttle var(--dur, 5.1s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes crabScuttle {
      0%, 100% { transform: translate(0px, 2px) rotate(0deg); }
      20%      { transform: translate(8px, -2px) rotate(2.8deg); }
      40%      { transform: translate(11px, 2px) rotate(-2.4deg); }
      65%      { transform: translate(-6px, -2px) rotate(-2.6deg); }
      85%      { transform: translate(-9px, 2px) rotate(2.2deg); }
    }

    .motion-star-sway {
      animation: starSway var(--dur, 6.4s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes starSway {
      0%, 100% { transform: translateY(3px) rotate(-3.5deg) scale(1); }
      50%      { transform: translateY(-5px) rotate(3.8deg) scale(1.03); }
    }

    /* =========================================================================
       WRONG-CLICK STARTLED WIGGLE (PLAYFUL, NON-HARSH)
       ========================================================================= */
    .creature-hit.wrong-wiggle {
      animation: wrongWiggle 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes wrongWiggle {
      0%   { transform: translateX(0) rotate(0deg) scale(1); }
      18%  { transform: translateX(-9px) rotate(-7deg) scale(1.05, 0.95); }
      38%  { transform: translateX(9px) rotate(7deg) scale(0.95, 1.05); }
      58%  { transform: translateX(-6px) rotate(-4.5deg) scale(1.03, 0.97); }
      78%  { transform: translateX(5px) rotate(3deg) scale(0.99, 1.01); }
      100% { transform: translateX(0) rotate(0deg) scale(1); }
    }

    /* =========================================================================
       5 VARIED DISSOLVE ANIMATIONS FOR CORRECT ANSWERS
       ========================================================================= */
    .creature-hit.dissolve-bubbles {
      animation: dissolveBubbles 0.58s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes dissolveBubbles {
      0%   { opacity: 1; transform: scale(1); filter: brightness(1) blur(0px); }
      30%  { opacity: 0.95; transform: scale(1.18) translateY(-6px); filter: brightness(1.65) saturate(1.4) blur(1px); }
      100% { opacity: 0; transform: scale(1.36) translateY(-28px); filter: brightness(2.2) blur(10px); }
    }

    .creature-hit.dissolve-stardust {
      animation: dissolveStardust 0.6s ease-out forwards;
    }
    @keyframes dissolveStardust {
      0%   { opacity: 1; transform: scale(1) rotate(0deg); filter: brightness(1) blur(0px); }
      28%  { opacity: 1; transform: scale(1.14) rotate(5deg); filter: brightness(1.9) drop-shadow(0 0 26px #9affff) blur(0.5px); }
      100% { opacity: 0; transform: scale(0.62) rotate(-10deg); filter: brightness(2.6) blur(12px); }
    }

    .creature-hit.dissolve-whirlpool {
      animation: dissolveWhirlpool 0.62s cubic-bezier(0.55, 0.05, 0.67, 0.19) forwards;
    }
    @keyframes dissolveWhirlpool {
      0%   { opacity: 1; transform: scale(1) rotate(0deg); filter: brightness(1) blur(0px); }
      35%  { opacity: 0.95; transform: scale(1.08) rotate(35deg); filter: brightness(1.55) blur(1.5px); }
      100% { opacity: 0; transform: scale(0.1) rotate(240deg); filter: brightness(2.3) blur(10px); }
    }

    .creature-hit.dissolve-ripple {
      animation: dissolveRipple 0.56s ease-out forwards;
    }
    @keyframes dissolveRipple {
      0%   { opacity: 1; transform: scale(1, 1); filter: brightness(1) blur(0px); }
      32%  { opacity: 0.92; transform: scale(1.24, 0.88); filter: brightness(1.8) saturate(1.3) blur(2px); }
      65%  { opacity: 0.45; transform: scale(1.42, 1.15); filter: brightness(2.1) blur(6px); }
      100% { opacity: 0; transform: scale(1.65, 0.72); filter: brightness(2.4) blur(14px); }
    }

    .creature-hit.dissolve-seafoam {
      animation: dissolveSeafoam 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes dissolveSeafoam {
      0%   { opacity: 1; transform: scale(1); filter: brightness(1) blur(0px); }
      35%  { opacity: 0.9; transform: scale(1.16) translateY(-10px); filter: brightness(1.75) hue-rotate(12deg) blur(2px); }
      100% { opacity: 0; transform: scale(1.38) translateY(-34px); filter: brightness(2.5) hue-rotate(30deg) blur(13px); }
    }

    /* Entry swim-in transition for fresh rounds */
    .creature-slot.spawn-in {
      animation: spawnFloatIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) var(--spawn-delay, 0s) forwards;
    }
    @keyframes spawnFloatIn {
      0%   { opacity: 0; transform: translate(-50%, -32%) scale(0.72); filter: blur(4px); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0px); }
    }

    /* Responsive tuning for compact/tablet screens */
    @media (max-aspect-ratio: 4/3) {
      .creature-slot {
        width: min(22.5vw, 24vh);
        height: min(17vw, 19.5vh);
      }
      #plaque-wrap {
        width: clamp(260px, 60vw, 560px);
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- Living animated underwater canvas -->
    <canvas id="bg-canvas"></canvas>
    <div id="caustic-veil"></div>

    <!-- Top minimal HUD: Language button | Carved driftwood word plaque | Next arrow button -->
    <header id="top-hud">
      <button id="lang-btn" class="medallion-btn" type="button" aria-label="Language toggle">укр</button>

      <div id="plaque-wrap">
        <!-- Hand-crafted organic carved driftwood & weathered bronze maritime plaque -->
        <svg id="plaque-svg" viewBox="0 0 640 132" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <!-- Weathered carved teak/driftwood gradient -->
            <linearGradient id="wood-base" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#8b5b36" />
              <stop offset="22%" stop-color="#6f4324" />
              <stop offset="60%" stop-color="#58331a" />
              <stop offset="100%" stop-color="#3c210f" />
            </linearGradient>
            <!-- Subtle coastal sea-teal patina glaze -->
            <linearGradient id="teal-patina" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3fa8a8" stop-opacity="0.28" />
              <stop offset="50%" stop-color="#1c6c78" stop-opacity="0.14" />
              <stop offset="100%" stop-color="#4cc2ba" stop-opacity="0.26" />
            </linearGradient>
            <!-- Antique bronze rim gradient -->
            <linearGradient id="bronze-rim" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e5c17b" />
              <stop offset="35%" stop-color="#a87939" />
              <stop offset="70%" stop-color="#6e4b1e" />
              <stop offset="100%" stop-color="#d4ad64" />
            </linearGradient>
            <!-- Brass rivet shading -->
            <radialGradient id="rivet-grad" cx="32%" cy="28%" r="70%">
              <stop offset="0%" stop-color="#fff0bc" />
              <stop offset="48%" stop-color="#c69347" />
              <stop offset="100%" stop-color="#543511" />
            </radialGradient>
            <!-- Inner sunken carved bevel -->
            <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#1f1006" stop-opacity="0.58" />
              <stop offset="15%" stop-color="#3a2010" stop-opacity="0.12" />
              <stop offset="85%" stop-color="#4e2e17" stop-opacity="0.1" />
              <stop offset="100%" stop-color="#d8a86a" stop-opacity="0.28" />
            </linearGradient>
          </defs>

          <!-- Organic curved driftwood board silhouette -->
          <path d="M 38 22
                   C 118 8, 224 14, 320 11
                   C 418 8, 524 14, 602 22
                   C 624 25, 632 45, 630 66
                   C 628 89, 622 108, 600 112
                   C 518 125, 422 119, 320 122
                   C 218 125, 118 120, 40 112
                   C 18 109, 10 88, 12 66
                   C 14 44, 18 25, 38 22 Z"
                fill="url(#wood-base)" stroke="url(#bronze-rim)" stroke-width="5.5" />

          <!-- Sea-teal aged coastal patina glaze -->
          <path d="M 42 26
                   C 120 13, 225 18, 320 15
                   C 416 13, 522 18, 598 26
                   C 617 29, 624 47, 622 66
                   C 620 86, 615 103, 596 107
                   C 516 119, 421 114, 320 116
                   C 219 119, 120 114, 44 107
                   C 25 104, 18 86, 20 66
                   C 22 46, 25 29, 42 26 Z"
                fill="url(#teal-patina)" />

          <!-- Organic wood grain grooves & knots -->
          <g fill="none" stroke="#2c1608" stroke-linecap="round" opacity="0.34">
            <path d="M 34 38 C 145 31, 250 40, 385 33 C 475 29, 545 36, 608 38" stroke-width="2.1" />
            <path d="M 28 56 C 125 63, 222 50, 330 57 C 435 64, 535 51, 612 58" stroke-width="1.6" />
            <path d="M 28 77 C 138 71, 240 84, 358 76 C 462 70, 542 82, 612 75" stroke-width="1.8" />
            <path d="M 38 96 C 142 103, 258 92, 378 99 C 482 104, 548 94, 602 96" stroke-width="2.2" />
            <!-- Wood knot swirls -->
            <ellipse cx="94" cy="48" rx="14" ry="5" stroke-width="1.4" />
            <ellipse cx="546" cy="86" rx="16" ry="5.5" stroke-width="1.4" />
          </g>

          <!-- Sunlit wood highlight streaks -->
          <g fill="none" stroke="#d8a86a" stroke-linecap="round" opacity="0.22">
            <path d="M 46 28 C 168 18, 305 22, 468 20 C 522 19, 568 23, 594 27" stroke-width="2" />
            <path d="M 54 68 C 190 64, 415 69, 588 65" stroke-width="1.2" />
          </g>

          <!-- Inner recessed carved maritime frame -->
          <path d="M 50 32
                   C 126 21, 226 25, 320 23
                   C 414 21, 514 25, 590 32
                   C 605 34, 610 49, 609 66
                   C 608 83, 603 97, 588 100
                   C 512 110, 415 106, 320 108
                   C 225 110, 126 106, 52 100
                   C 37 97, 32 83, 33 66
                   C 34 49, 37 34, 50 32 Z"
                fill="url(#inner-bevel)" stroke="#d9b26f" stroke-opacity="0.34" stroke-width="1.5" />

          <!-- Four antique brass corner rivets -->
          <circle cx="44" cy="40" r="6" fill="url(#rivet-grad)" stroke="#3e240d" stroke-width="1.2" />
          <circle cx="596" cy="40" r="6" fill="url(#rivet-grad)" stroke="#3e240d" stroke-width="1.2" />
          <circle cx="44" cy="92" r="6" fill="url(#rivet-grad)" stroke="#3e240d" stroke-width="1.2" />
          <circle cx="596" cy="92" r="6" fill="url(#rivet-grad)" stroke="#3e240d" stroke-width="1.2" />

          <!-- Tiny coastal barnacles & mini scallop embellishment on edges -->
          <g opacity="0.92">
            <!-- Left bottom barnacle cluster -->
            <path d="M 15 95 L 22 83 L 31 96 Z" fill="#d8cbb5" stroke="#5d4d3a" stroke-width="1" />
            <ellipse cx="22.5" cy="85" rx="2.6" ry="1.2" fill="#4f4030" />
            <path d="M 26 102 L 32 92 L 39 103 Z" fill="#e6dcc9" stroke="#5d4d3a" stroke-width="1" />
            <ellipse cx="32.3" cy="93.6" rx="2.1" ry="1" fill="#4f4030" />
            <!-- Right top tiny coral shell accent -->
            <path d="M 604 20 C 607 10, 621 10, 624 21 C 618 24, 610 24, 604 20 Z" fill="#f0a899" stroke="#7d4135" stroke-width="1.1" />
            <path d="M 614 12 L 614 22 M 609 14 L 612 22 M 619 14 L 616 22" stroke="#9e5446" stroke-width="0.9" />

        </svg>

        function ensureContext() {

            if (!ctx) {

              if (!AudioCtx) return null;
              ctx = new AudioCtx();
              masterGain = ctx.createGain();
              masterGain.gain.value = 0.55;
              masterGain.connect(ctx.destination);

            if (ctx.state === 'suspended') {
              ctx.resume();
            }
            return ctx;
          } catch (err) {
            return null;
          }

        function playTone({ freq, type = 'sine', start = 0, dur = 0.35, gain = 0.22, freqEnd = null, attack = 0.012 }) {

          const now = ac.currentTime + start;

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (freqEnd !== null) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + dur);
          }
          g.gain.setValueAtTime(0.0001, now);
          g.gain.linearRampToValueAtTime(gain, now + attack);
          g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now);
          osc.stop(now + dur + 0.03);
        }

        // 6 distinct celebratory sound designs
        const successVariations = [
          // 0: Shimmering Harp Glissando

      /* =======================================================================
         3. LIVING ANIMATED OCEAN BACKDROP CANVAS (GOD RAYS, CORALS, KELP, BUBBLES)
         ======================================================================= */
      const bgCanvas = document.getElementById('bg-canvas');
      const bgCtx = bgCanvas.getContext('2d');
      const fxCanvas = document.getElementById('fx-canvas');
      const fxCtx = fxCanvas.getContext('2d');

      let W = window.innerWidth;
      let H = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // Persistent ocean entities
      const ambientBubbles = [];
      const planktonMotes = [];
      const sunBeams = [];
      const kelpStrands = [];
      const bgFishSilhouettes = [];
      const seabedCorals = [];

      function initOceanScene() {
        ambientBubbles.length = 0;
        for (let i = 0; i < 42; i++) {
          ambientBubbles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 2 + Math.random() * 7.5,
            speed: 14 + Math.random() * 34,
            wobbleAmp: 6 + Math.random() * 14,
            wobbleFreq: 0.7 + Math.random() * 1.4,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.22 + Math.random() * 0.42
          });
        }

        planktonMotes.length = 0;
        for (let i = 0; i < 65; i++) {
          planktonMotes.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 0.9 + Math.random() * 2.2,
            vx: (Math.random() - 0.5) * 9,
            vy: -2 - Math.random() * 7,
            phase: Math.random() * Math.PI * 2,
            hue: Math.random() > 0.35 ? 186 : 48
          });
        }

        sunBeams.length = 0;
        for (let i = 0; i < 8; i++) {
          sunBeams.push({
            xRatio: 0.06 + i * 0.128 + (Math.random() - 0.5) * 0.04,
            widthRatio: 0.055 + Math.random() * 0.065,
            angle: 0.16 + (Math.random() - 0.5) * 0.09,
            speed: 0.28 + Math.random() * 0.32,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.055 + Math.random() * 0.055
          });
        }

        kelpStrands.length = 0;
        const kelpPositions = [0.02, 0.05, 0.085, 0.13, 0.87, 0.915, 0.95, 0.98];
        kelpPositions.forEach((xr, idx) => {
          kelpStrands.push({
            xRatio: xr,
            heightRatio: 0.24 + (idx % 3) * 0.09 + Math.random() * 0.08,
            segments: 7,
            phase: Math.random() * Math.PI * 2,
            speed: 0.85 + Math.random() * 0.45,
            hue: idx % 2 === 0 ? '#167d6c' : '#1f997a',
            leafColor: idx % 2 === 0 ? '#24ad8c' : '#32c299'
          });
        });

        // Tiny distant reef fish silhouettes swimming peacefully in the far background
        bgFishSilhouettes.length = 0;
        for (let i = 0; i < 9; i++) {
          const dir = Math.random() > 0.5 ? 1 : -1;
          bgFishSilhouettes.push({
            x: Math.random() * W,
            y: H * (0.22 + Math.random() * 0.52),
            size: 6 + Math.random() * 9,
            speed: (10 + Math.random() * 18) * dir,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.09 + Math.random() * 0.09
          });
        }

        seabedCorals.length = 0;
        const coralSpecs = [
          { xr: 0.07, scale: 1.05, color: '#d95b6a', type: 'branch' },
          { xr: 0.16, scale: 0.85, color: '#e68c4c', type: 'fan' },
          { xr: 0.27, scale: 0.72, color: '#9c59b8', type: 'tube' },
          { xr: 0.73, scale: 0.78, color: '#e07a5f', type: 'tube' },
          { xr: 0.84, scale: 0.95, color: '#d65a8a', type: 'branch' },
          { xr: 0.93, scale: 1.08, color: '#f09d51', type: 'fan' }
        ];
        coralSpecs.forEach((c, i) => seabedCorals.push({ ...c, phase: i * 1.1 }));
      }

      function resizeCanvases() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        [bgCanvas, fxCanvas].forEach((c) => {
          c.width = Math.floor(W * dpr);
          c.height = Math.floor(H * dpr);
          c.style.width = W + 'px';
          c.style.height = H + 'px';
        });
        bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function drawCoralItem(ctx, x, baseY, scale, color, type, sway) {
        ctx.save();
        ctx.translate(x, baseY);
        ctx.scale(scale, scale);

        if (type === 'branch') {
          ctx.strokeStyle = color;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          const drawBranch = (bx, by, len, angle, width, depth) => {
            if (depth <= 0) return;
            const nx = bx + Math.sin(angle + sway * 0.05) * len;
            const ny = by - Math.cos(angle + sway * 0.05) * len;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(nx, ny);
            ctx.stroke();
            drawBranch(nx, ny, len * 0.72, angle - 0.42, width * 0.68, depth - 1);
            drawBranch(nx, ny, len * 0.72, angle + 0.38, width * 0.68, depth - 1);
          };
          drawBranch(0, 0, 34, -0.08, 10, 3);
        } else if (type === 'fan') {
          ctx.strokeStyle = color;
          ctx.lineCap = 'round';
          for (let a = -0.85; a <= 0.85; a += 0.24) {
            ctx.lineWidth = 4.2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            const tipX = Math.sin(a + sway * 0.06) * 58;
            const tipY = -Math.cos(a + sway * 0.06) * 58;
            ctx.quadraticCurveTo(tipX * 0.45, tipY * 0.65, tipX, tipY);
            ctx.stroke();
          }
        } else {
          // Sea anemone / coral tubes
          const offsets = [-18, -6, 7, 19];
          const heights = [36, 52, 46, 32];
          offsets.forEach((ox, i) => {
            const h = heights[i];
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(ox - 6, 0);
            ctx.quadraticCurveTo(ox - 7 + sway * 2, -h * 0.5, ox - 5 + sway * 3, -h);
            ctx.lineTo(ox + 5 + sway * 3, -h);
            ctx.quadraticCurveTo(ox + 7 + sway * 2, -h * 0.5, ox + 6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255,245,215,0.45)';
            ctx.beginPath();
            ctx.ellipse(ox + sway * 3, -h, 5, 2.3, 0, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        ctx.restore();
      }

      function drawBackground(t, dt) {
        // 1. Rich turquoise-to-deep-ocean gradient
        const waterGrad = bgCtx.createLinearGradient(0, 0, 0, H);
        waterGrad.addColorStop(0, '#1ca7c9');
        waterGrad.addColorStop(0.2, '#1179a3');
        waterGrad.addColorStop(0.58, '#094b75');
        waterGrad.addColorStop(0.88, '#052c4f');
        waterGrad.addColorStop(1, '#041f3b');
        bgCtx.fillStyle = waterGrad;
        bgCtx.fillRect(0, 0, W, H);

        // 2. Undulating sunlit water surface at the top
        bgCtx.save();
        bgCtx.beginPath();
        bgCtx.moveTo(0, 0);
        const surfBase = H * 0.042;
        for (let x = 0; x <= W; x += 28) {
          const y = surfBase + Math.sin(x * 0.008 + t * 1.4) * 6 + Math.cos(x * 0.017 - t * 0.9) * 3.5;
          bgCtx.lineTo(x, y);
        }
        bgCtx.lineTo(W, 0);
        bgCtx.closePath();
        const surfGrad = bgCtx.createLinearGradient(0, 0, 0, surfBase + 14);
        surfGrad.addColorStop(0, 'rgba(195, 252, 255, 0.55)');
        surfGrad.addColorStop(0.6, 'rgba(110, 232, 248, 0.25)');
        surfGrad.addColorStop(1, 'rgba(38, 175, 209, 0)');
        bgCtx.fillStyle = surfGrad;
        bgCtx.fill();
        bgCtx.restore();

        // 3. Dancing volumetric sunbeams (god rays)
        bgCtx.save();
        bgCtx.globalCompositeOperation = 'screen';
        for (let i = 0; i < sunBeams.length; i++) {
          const b = sunBeams[i];
          const pulse = 0.65 + 0.35 * Math.sin(t * b.speed + b.phase);
          const bx = b.xRatio * W + Math.sin(t * 0.25 + b.phase) * 28;
          const bw = b.widthRatio * W;
          const beamLen = H * 0.92;
          const slant = Math.tan(b.angle) * beamLen;

          const grad = bgCtx.createLinearGradient(bx, 0, bx + slant * 0.5, beamLen);
          grad.addColorStop(0, `rgba(170, 248, 255, ${(b.alpha * pulse * 1.45).toFixed(3)})`);
          grad.addColorStop(0.45, `rgba(110, 224, 248, ${(b.alpha * pulse * 0.72).toFixed(3)})`);
          grad.addColorStop(1, 'rgba(50, 175, 215, 0)');

          bgCtx.fillStyle = grad;
          bgCtx.beginPath();
          bgCtx.moveTo(bx - bw * 0.35, 0);
          bgCtx.lineTo(bx + bw * 0.35, 0);
          bgCtx.lineTo(bx + slant + bw * 1.25, beamLen);
          bgCtx.lineTo(bx + slant - bw * 0.85, beamLen);
          bgCtx.closePath();
          bgCtx.fill();
        }
        bgCtx.restore();

        // 4. Distant layered coral reef silhouettes
        bgCtx.save();
        bgCtx.fillStyle = 'rgba(4, 34, 62, 0.52)';
        bgCtx.beginPath();
        bgCtx.moveTo(0, H);
        bgCtx.lineTo(0, H * 0.83);
        bgCtx.bezierCurveTo(W * 0.14, H * 0.76, W * 0.24, H * 0.88, W * 0.38, H * 0.85);
        bgCtx.bezierCurveTo(W * 0.54, H * 0.81, W * 0.68, H * 0.89, W * 0.82, H * 0.82);
        bgCtx.bezierCurveTo(W * 0.91, H * 0.77, W * 0.96, H * 0.81, W, H * 0.79);
        bgCtx.lineTo(W, H);
        bgCtx.closePath();
        bgCtx.fill();
        bgCtx.restore();

        // 5. Tiny distant fish silhouettes swimming peacefully
        bgCtx.save();
        for (let i = 0; i < bgFishSilhouettes.length; i++) {
          const f = bgFishSilhouettes[i];
          f.x += f.speed * dt;
          if (f.speed > 0 && f.x > W + 40) f.x = -40;
          if (f.speed < 0 && f.x < -40) f.x = W + 40;
          const fy = f.y + Math.sin(t * 1.6 + f.phase) * 6;
          const dir = f.speed > 0 ? 1 : -1;

          bgCtx.save();
          bgCtx.translate(f.x, fy);
          bgCtx.scale(dir, 1);
          bgCtx.fillStyle = `rgba(128, 224, 245, ${f.alpha})`;
          bgCtx.beginPath();
          bgCtx.ellipse(0, 0, f.size, f.size * 0.45, 0, 0, Math.PI * 2);
          bgCtx.moveTo(-f.size * 0.7, 0);
          bgCtx.lineTo(-f.size * 1.45, -f.size * 0.48);
          bgCtx.lineTo(-f.size * 1.45, f.size * 0.48);
          bgCtx.closePath();
          bgCtx.fill();
          bgCtx.restore();
        }
        bgCtx.restore();

        // 6. Sunlit textured sandy seabed at bottom
        const sandY = H * 0.915;
        bgCtx.save();
        bgCtx.beginPath();
        bgCtx.moveTo(0, H);
        bgCtx.lineTo(0, sandY);
        bgCtx.bezierCurveTo(W * 0.22, sandY - 26, W * 0.45, sandY + 18, W * 0.68, sandY - 14);
        bgCtx.bezierCurveTo(W * 0.84, sandY - 30, W * 0.94, sandY - 12, W, sandY - 6);
        bgCtx.lineTo(W, H);
        bgCtx.closePath();

        const sandGrad = bgCtx.createLinearGradient(0, sandY - 26, 0, H);
        sandGrad.addColorStop(0, '#c29e68');
        sandGrad.addColorStop(0.45, '#8f6e44');
        sandGrad.addColorStop(1, '#4f3b24');
        bgCtx.fillStyle = sandGrad;
        bgCtx.fill();

        // Undulating caustic light ribbons shimmering on the sandy seabed
        bgCtx.clip();
        bgCtx.strokeStyle = 'rgba(175, 248, 255, 0.22)';
        bgCtx.lineWidth = 2.4;
        for (let r = 0; r < 5; r++) {
          bgCtx.beginPath();
          const ry = sandY - 4 + r * 14;
          for (let x = 0; x <= W; x += 32) {
            const wy = ry + Math.sin(x * 0.015 + t * 1.6 + r * 1.4) * 5;
            if (x === 0) bgCtx.moveTo(x, wy);
            else bgCtx.lineTo(x, wy);
          }
          bgCtx.stroke();
        }
        bgCtx.restore();

        // 7. Vibrant seabed corals
        for (let i = 0; i < seabedCorals.length; i++) {
          const c = seabedCorals[i];
          const sway = Math.sin(t * 1.1 + c.phase);
          drawCoralItem(bgCtx, c.xr * W, H * 0.945, c.scale * Math.min(1.1, W / 1360), c.color, c.type, sway);
        }

        // 8. Smoothly swaying multi-layered kelp & seagrass in corners
        for (let i = 0; i < kelpStrands.length; i++) {
          const k = kelpStrands[i];
          const baseX = k.xRatio * W;
          const baseY = H + 8;
          const totalH = k.heightRatio * H;
          const segH = totalH / k.segments;

          bgCtx.save();
          bgCtx.strokeStyle = k.hue;
          bgCtx.lineWidth = 4.2;
          bgCtx.lineCap = 'round';
          bgCtx.beginPath();
          bgCtx.moveTo(baseX, baseY);

          let px = baseX;
          let py = baseY;
          for (let s = 1; s <= k.segments; s++) {
            const ratio = s / k.segments;
            const offset = Math.sin(t * k.speed + k.phase + s * 0.55) * (18 * ratio);
            const nx = baseX + offset;
            const ny = baseY - segH * s;
            bgCtx.lineTo(nx, ny);

            // Leaf blades along kelp
            const side = s % 2 === 0 ? 1 : -1;
            bgCtx.save();
            bgCtx.fillStyle = k.leafColor;
            bgCtx.globalAlpha = 0.72;
            bgCtx.beginPath();
            bgCtx.ellipse(nx + side * 12, ny + 4, 13 * (1 - ratio * 0.35), 4.6, side * (0.45 + offset * 0.01), 0, Math.PI * 2);
            bgCtx.fill();
            bgCtx.restore();

            px = nx;
            py = ny;
          }
          bgCtx.stroke();
          bgCtx.restore();
        }

        // 9. Gently drifting bioluminescent plankton motes
        bgCtx.save();
        for (let i = 0; i < planktonMotes.length; i++) {
          const m = planktonMotes[i];
          m.x += (m.vx + Math.sin(t * 0.8 + m.phase) * 4) * dt;
          m.y += m.vy * dt;
          if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
          if (m.x < -10) m.x = W + 10;
          if (m.x > W + 10) m.x = -10;

          const glow = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2.2 + m.phase));
          bgCtx.fillStyle = `hsla(${m.hue}, 95%, 80%, ${(glow * 0.55).toFixed(3)})`;
          bgCtx.beginPath();
          bgCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          bgCtx.fill();
        }
        bgCtx.restore();

        // 10. Rising ambient air bubbles with glossy specular highlights
        bgCtx.save();
        for (let i = 0; i < ambientBubbles.length; i++) {
          const b = ambientBubbles[i];
          b.y -= b.speed * dt;
          if (b.y < -20) {
            b.y = H + 15 + Math.random() * 40;
            b.x = Math.random() * W;
          }
          const bx = b.x + Math.sin(t * b.wobbleFreq + b.phase) * b.wobbleAmp;

          bgCtx.strokeStyle = `rgba(202, 248, 255, ${b.alpha})`;
          bgCtx.lineWidth = 1.25;
          bgCtx.fillStyle = `rgba(175, 242, 255, ${b.alpha * 0.16})`;
          bgCtx.beginPath();
          bgCtx.arc(bx, b.y, b.r, 0, Math.PI * 2);
          bgCtx.fill();
          bgCtx.stroke();

          // Glossy catchlight dot
          bgCtx.fillStyle = `rgba(255, 255, 255, ${Math.min(0.9, b.alpha * 1.6)})`;
          bgCtx.beginPath();
          bgCtx.arc(bx - b.r * 0.34, b.y - b.r * 0.34, Math.max(1, b.r * 0.26), 0, Math.PI * 2);
          bgCtx.fill();
        }
        bgCtx.restore();
      }

      /* =======================================================================
         4. FOREGROUND PARTICLE & DISSOLVE FX SYSTEM (5 VARIED STYLES + FINALE)
         ======================================================================= */
      const fxParticles = [];
      const fxRings = [];
      let dissolveQueue = [];

      function spawnDissolveEffect(rect, colors) {
        if (dissolveQueue.length === 0) {
          dissolveQueue = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5);
        }
        const styleIdx = dissolveQueue.pop();
        const cx = rect.left + rect.width * 0.5;
        const cy = rect.top + rect.height * 0.5;
        const rx = rect.width * 0.42;
        const ry = rect.height * 0.38;

        if (styleIdx === 0) {
          // Style 0: Bubble Eruption
          for (let i = 0; i < 42; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 45 + Math.random() * 190;
            fxParticles.push({
              kind: 'bubble',
              x: cx + (Math.random() - 0.5) * rx * 1.4,
              y: cy + (Math.random() - 0.5) * ry * 1.4,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd - 65,
              r: 4 + Math.random() * 13,
              life: 0,
              maxLife: 0.75 + Math.random() * 0.65,
              color: colors[i % colors.length],
              wobble: Math.random() * Math.PI * 2
            });
          }
          fxRings.push({ x: cx, y: cy, r: 16, maxR: Math.max(rx, ry) * 2.1, color: '#9cf7ff', life: 0, maxLife: 0.62, lineWidth: 5 });
          return 'dissolve-bubbles';
        }

        if (styleIdx === 1) {
          // Style 1: Bioluminescent Stardust Disintegration
          for (let i = 0; i < 68; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 30 + Math.random() * 210;
            fxParticles.push({
              kind: i % 3 === 0 ? 'star' : 'spark',
              x: cx + (Math.random() - 0.5) * rx * 1.6,
              y: cy + (Math.random() - 0.5) * ry * 1.5,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd - 20,
              r: 3 + Math.random() * 7,
              life: 0,
              maxLife: 0.7 + Math.random() * 0.75,
              color: i % 4 === 0 ? '#fff7c2' : colors[i % colors.length],
              rot: Math.random() * Math.PI * 2,
              vrot: (Math.random() - 0.5) * 8
            });
          }
          fxRings.push({ x: cx, y: cy, r: 12, maxR: Math.max(rx, ry) * 2.3, color: '#ffe999', life: 0, maxLife: 0.68, lineWidth: 4 });
          return 'dissolve-stardust';
        }

        if (styleIdx === 2) {
          // Style 2: Swirling Pearl Whirlpool
          for (let i = 0; i < 54; i++) {
            const ang = (i / 54) * Math.PI * 2 + Math.random() * 0.3;
            const dist = 12 + Math.random() * Math.max(rx, ry);
            fxParticles.push({
              kind: 'swirl',
              cx,
              cy,
              angle: ang,
              dist,
              vAngle: 4.5 + Math.random() * 3.5,
              vDist: 70 + Math.random() * 140,
              r: 3.5 + Math.random() * 7.5,
              life: 0,
              maxLife: 0.75 + Math.random() * 0.55,
              color: i % 3 === 0 ? '#ffffff' : colors[i % colors.length]
            });
          }
          fxRings.push({ x: cx, y: cy, r: 18, maxR: Math.max(rx, ry) * 2.2, color: '#c4f5ff', life: 0, maxLife: 0.65, lineWidth: 5 });
          return 'dissolve-whirlpool';
        }

        if (styleIdx === 3) {
          // Style 3: Sunbeam Ripple Burst
          for (let k = 0; k < 3; k++) {
            fxRings.push({
              x: cx,
              y: cy,
              r: 10 + k * 14,
              maxR: Math.max(rx, ry) * (1.8 + k * 0.65),
              color: k % 2 === 0 ? '#9cf8ff' : '#ffe899',
              life: -k * 0.08,
              maxLife: 0.72,
              lineWidth: 6 - k * 1.4
            });
          }
          for (let i = 0; i < 46; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 90 + Math.random() * 210;
            fxParticles.push({
              kind: 'spark',
              x: cx + (Math.random() - 0.5) * rx,
              y: cy + (Math.random() - 0.5) * ry,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              r: 3.5 + Math.random() * 6.5,
              life: 0,
              maxLife: 0.6 + Math.random() * 0.55,
              color: colors[i % colors.length]
            });
          }
          return 'dissolve-ripple';
        }

        // Style 4: Rainbow Seafoam Bloom
        const foamPalette = ['#9cf8ff', '#ffd6f5', '#fff2a6', '#a8ffda', ...colors];
        for (let i = 0; i < 52; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 40 + Math.random() * 175;
          fxParticles.push({
            kind: i % 2 === 0 ? 'bubble' : 'star',
            x: cx + (Math.random() - 0.5) * rx * 1.3,
            y: cy + (Math.random() - 0.5) * ry * 1.3,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 50,
            r: 5 + Math.random() * 11,
            life: 0,
            maxLife: 0.8 + Math.random() * 0.6,
            color: foamPalette[i % foamPalette.length],
            wobble: Math.random() * Math.PI * 2,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 6
          });
        }
        fxRings.push({ x: cx, y: cy, r: 14, maxR: Math.max(rx, ry) * 2.1, color: '#ffcef2', life: 0, maxLife: 0.65, lineWidth: 5 });
        return 'dissolve-seafoam';
      }

      // Gentle startled bubbles + soft coral halo for wrong clicks
      function spawnWrongEffect(rect) {
        const cx = rect.left + rect.width * 0.5;
        const cy = rect.top + rect.height * 0.45;
        fxRings.push({ x: cx, y: cy, r: 22, maxR: Math.max(rect.width, rect.height) * 0.72, color: '#ffb59e', life: 0, maxLife: 0.44, lineWidth: 3.5 });
        for (let i = 0; i < 5; i++) {
          fxParticles.push({
            kind: 'bubble',
            x: cx + (Math.random() - 0.5) * rect.width * 0.45,
            y: cy - Math.random() * 15,
            vx: (Math.random() - 0.5) * 45,
            vy: -55 - Math.random() * 60,
            r: 4 + Math.random() * 5.5,
            life: 0,
            maxLife: 0.55 + Math.random() * 0.35,
            color: '#d2f8ff',
            wobble: Math.random() * Math.PI * 2
          });
        }
      }

      // Sweeping bubble wave across screen for Next button
      function spawnWaveSweep() {
        for (let i = 0; i < 65; i++) {
          const delay = (i / 65) * 0.25;
          fxParticles.push({
            kind: i % 4 === 0 ? 'star' : 'bubble',
            x: -20 - Math.random() * 80,
            y: Math.random() * H,
            vx: W * (1.35 + Math.random() * 0.65),
            vy: (Math.random() - 0.5) * 140 - 30,
            r: 4 + Math.random() * 13,
            life: -delay,
            maxLife: 0.75 + Math.random() * 0.35,
            color: i % 3 === 0 ? '#ffeaa6' : '#a8f6ff',
            wobble: Math.random() * Math.PI * 2,
            rot: 0,
            vrot: 5
          });
        }
      }

      // Grand celebratory underwater curtain when all creatures on screen dissolve
      function spawnFinaleCurtain() {
        const finaleColors = ['#9cf8ff', '#ffe58f', '#ffbae8', '#9effd6', '#ffffff'];
        for (let i = 0; i < 120; i++) {
          const delay = Math.random() * 0.55;
          fxParticles.push({
            kind: i % 3 === 0 ? 'star' : 'bubble',
            x: Math.random() * W,
            y: H + 20 + Math.random() * 80,
            vx: (Math.random() - 0.5) * 110,
            vy: -(H * (0.75 + Math.random() * 0.65)),
            r: 5 + Math.random() * 14,
            life: -delay,
            maxLife: 1.15 + Math.random() * 0.55,
            color: finaleColors[i % finaleColors.length],
            wobble: Math.random() * Math.PI * 2,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 7
          });
        }
        for (let r = 0; r < 4; r++) {
          fxRings.push({
            x: W * (0.2 + r * 0.2),
            y: H * (0.42 + (r % 2) * 0.2),
            r: 20,
            maxR: Math.min(W, H) * 0.42,
            color: r % 2 === 0 ? '#ffe58f' : '#9cf8ff',
            life: -r * 0.14,
            maxLife: 0.9,
            lineWidth: 5
          });
        }
      }

      function drawStarShape(ctx, x, y, r, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = (i * Math.PI) / 2;
          const b = a + Math.PI / 4;
          const ox = Math.cos(a) * r;
          const oy = Math.sin(a) * r;
          const ix = Math.cos(b) * (r * 0.34);
          const iy = Math.sin(b) * (r * 0.34);
          if (i === 0) ctx.moveTo(ox, oy);
          else ctx.lineTo(ox, oy);
          ctx.lineTo(ix, iy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawForegroundFX(t, dt) {
        fxCtx.clearRect(0, 0, W, H);

        // Update & draw expanding caustic water rings
        for (let i = fxRings.length - 1; i >= 0; i--) {
          const ring = fxRings[i];
          ring.life += dt;
          if (ring.life < 0) continue;
          const p = ring.life / ring.maxLife;
          if (p >= 1) {
            fxRings.splice(i, 1);
            continue;
          }
          const ease = 1 - Math.pow(1 - p, 3);
          const currR = ring.r + (ring.maxR - ring.r) * ease;
          const alpha = (1 - p) * 0.78;
          fxCtx.save();
          fxCtx.strokeStyle = ring.color;
          fxCtx.globalAlpha = alpha;
          fxCtx.lineWidth = Math.max(1, ring.lineWidth * (1 - p * 0.7));
          fxCtx.beginPath();
          fxCtx.arc(ring.x, ring.y, currR, 0, Math.PI * 2);
          fxCtx.stroke();
          fxCtx.restore();
        }

        // Update & draw particles
        for (let i = fxParticles.length - 1; i >= 0; i--) {
          const pt = fxParticles[i];
          pt.life += dt;
          if (pt.life < 0) continue;
          const p = pt.life / pt.maxLife;
          if (p >= 1) {
            fxParticles.splice(i, 1);
            continue;
          }

          const alpha = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;

          if (pt.kind === 'swirl') {
            pt.angle += pt.vAngle * dt;
            pt.dist += pt.vDist * dt;
            const px = pt.cx + Math.cos(pt.angle) * pt.dist;
            const py = pt.cy + Math.sin(pt.angle) * pt.dist;
            fxCtx.save();
            fxCtx.globalAlpha = alpha;
            fxCtx.fillStyle = pt.color;
            fxCtx.shadowBlur = 10;
            fxCtx.shadowColor = pt.color;
            fxCtx.beginPath();
            fxCtx.arc(px, py, pt.r * (1 - p * 0.45), 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.restore();
            continue;
          }

          pt.vx *= Math.pow(0.28, dt);
          pt.vy *= Math.pow(0.45, dt);
          if (pt.kind === 'bubble') {
            pt.vy -= 95 * dt; // Buoyancy upward
            pt.x += (pt.vx + Math.sin(t * 6 + pt.wobble) * 24) * dt;
            pt.y += pt.vy * dt;

            const rad = pt.r * (0.85 + p * 0.35);
            fxCtx.save();
            fxCtx.globalAlpha = alpha * 0.9;
            fxCtx.fillStyle = pt.color;
            fxCtx.globalAlpha = alpha * 0.24;
            fxCtx.beginPath();
            fxCtx.arc(pt.x, pt.y, rad, 0, Math.PI * 2);
            fxCtx.fill();

            fxCtx.globalAlpha = alpha * 0.92;
            fxCtx.strokeStyle = '#e8fcff';
            fxCtx.lineWidth = 1.5;
            fxCtx.stroke();

            fxCtx.fillStyle = '#ffffff';
            fxCtx.beginPath();
            fxCtx.arc(pt.x - rad * 0.32, pt.y - rad * 0.32, Math.max(1.2, rad * 0.25), 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.restore();
          } else if (pt.kind === 'star') {
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.rot += (pt.vrot || 4) * dt;
            fxCtx.save();
            fxCtx.globalAlpha = alpha;
            fxCtx.fillStyle = pt.color;
            fxCtx.shadowBlur = 12;
            fxCtx.shadowColor = pt.color;
            drawStarShape(fxCtx, pt.x, pt.y, pt.r * (1.1 - p * 0.4), pt.rot);
            fxCtx.restore();
          } else {
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            fxCtx.save();
            fxCtx.globalAlpha = alpha;
            fxCtx.fillStyle = pt.color;
            fxCtx.shadowBlur = 10;
            fxCtx.shadowColor = pt.color;
            fxCtx.beginPath();
            fxCtx.arc(pt.x, pt.y, pt.r * (1 - p * 0.55), 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.restore();
          }
        }
      }

      /* =======================================================================
         5. INFINITE READING GAME LOGIC & ORGANIC NON-OVERLAPPING LAYOUT
         ======================================================================= */
      const creaturesLayer = document.getElementById('creatures-layer');
      const targetWordEl = document.getElementById('target-word');
      const plaqueWrapEl = document.getElementById('plaque-wrap');
      const langBtn = document.getElementById('lang-btn');
      const nextBtn = document.getElementById('next-btn');

      let currentLang = 'uk'; // 'uk' -> 'укр', 'ru' -> 'рус'
      let activeRoundItems = [];
      let remainingIds = [];
      let currentTargetId = null;
      let inputLocked = false;
      let pendingTimers = [];
      let lastRoundIds = [];

      function clearPendingTimers() {
        while (pendingTimers.length > 0) {
          clearTimeout(pendingTimers.pop());
        }
      }

      function schedule(fn, delay) {
        const id = setTimeout(fn, delay);
        pendingTimers.push(id);
        return id;
      }

      function shuffle(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      // Generate organic non-overlapping coordinates in percentage of #creatures-layer
      function buildOrganicSlots(count) {
        // Staggered 3-row layouts for 10, 11, or 12 creatures
        let rowCounts;
        if (count === 12) rowCounts = [4, 4, 4];
        else if (count === 11) rowCounts = [4, 3, 4];
        else rowCounts = [3, 4, 3];

        const rowYs = [18, 51, 83];
        const slots = [];

        rowCounts.forEach((cols, rIdx) => {
          const baseY = rowYs[rIdx];
          // Subtle row stagger for natural reef composition
          const staggerX = cols === 4 ? (rIdx === 1 ? 2.4 : (rIdx === 0 ? -1.4 : 0.8)) : 0;
          const marginX = cols === 4 ? 12.5 : 18.5;
          const spanX = 100 - marginX * 2;

          for (let c = 0; c < cols; c++) {
            const baseX = marginX + (cols > 1 ? (c / (cols - 1)) * spanX : spanX * 0.5) + staggerX;
            const jitterX = (Math.random() - 0.5) * 3.2;
            const jitterY = (Math.random() - 0.5) * 4.2;
            slots.push({
              x: Math.max(10, Math.min(90, baseX + jitterX)),
              y: Math.max(13, Math.min(88, baseY + jitterY))
            });
          }
        });

        return shuffle(slots);
      }

      function getCreatureById(id) {
        return CREATURES.find((c) => c.id === id);
      }

      function renderTargetWord(animateSwap = false) {
        const creature = getCreatureById(currentTargetId);
        if (!creature) {
          targetWordEl.textContent = '';
          return;
        }
        const word = currentLang === 'uk' ? creature.uk : creature.ru;

        const applyText = () => {
          targetWordEl.textContent = word;
          if (word.length >= 11) {
            targetWordEl.classList.add('long-word');
          } else {
            targetWordEl.classList.remove('long-word');
          }
        };

        if (animateSwap) {
          targetWordEl.classList.add('word-fade');
          plaqueWrapEl.classList.remove('word-swap');
          void plaqueWrapEl.offsetWidth;
          plaqueWrapEl.classList.add('word-swap');

          schedule(() => {
            applyText();
            targetWordEl.classList.remove('word-fade');
          }, 170);
        } else {
          applyText();
        }
      }

      function pickNextTarget(animateSwap = true) {
        if (remainingIds.length === 0) return;
        const idx = Math.floor(Math.random() * remainingIds.length);
        currentTargetId = remainingIds[idx];
        renderTargetWord(animateSwap);
      }

      function handleCreatureClick(creature, slotEl, hitEl) {
        SoundEngine.ensureContext();
        if (inputLocked || slotEl.classList.contains('solved')) return;

        const rect = hitEl.getBoundingClientRect();

        if (creature.id === currentTargetId) {
          // CORRECT CHOICE!
          inputLocked = true;
          slotEl.classList.add('solved');
          remainingIds = remainingIds.filter((id) => id !== creature.id);

          const dissolveClass = spawnDissolveEffect(rect, creature.colors);
          hitEl.classList.add(dissolveClass);
          SoundEngine.playSuccess();

          if (remainingIds.length === 0) {
            // All creatures dissolved -> Underwater Finale + Fresh Round!
            targetWordEl.classList.add('word-fade');
            schedule(() => {
              SoundEngine.playFinale();
              spawnFinaleCurtain();
            }, 340);
            schedule(() => {
              startNewRound(false);
            }, 1580);
          } else {
            schedule(() => {
              pickNextTarget(true);
              inputLocked = false;
            }, 540);
          }
        } else {
          // WRONG CHOICE -> Gentle playful non-verbal feedback
          SoundEngine.playWrong();
          spawnWrongEffect(rect);
          hitEl.classList.remove('wrong-wiggle');
          void hitEl.offsetWidth;
          hitEl.classList.add('wrong-wiggle');
        }
      }

      function startNewRound(withWaveSweep = false) {
        clearPendingTimers();
        inputLocked = true;

        if (withWaveSweep) {
          SoundEngine.playWaveWhoosh();
          spawnWaveSweep();
        }

        // Choose 10, 11, or 12 unique creatures (weighted nicely toward 11-12)
        const countChoices = [10, 11, 12, 12];
        const count = countChoices[Math.floor(Math.random() * countChoices.length)];

        // Prioritize creatures not in the previous round to keep rounds endlessly fresh
        const freshPool = shuffle(CREATURES.filter((c) => !lastRoundIds.includes(c.id)));
        const olderPool = shuffle(CREATURES.filter((c) => lastRoundIds.includes(c.id)));
        const selected = [...freshPool, ...olderPool].slice(0, count);
        lastRoundIds = selected.map((c) => c.id);

        activeRoundItems = shuffle(selected);
        remainingIds = activeRoundItems.map((c) => c.id);

        const slots = buildOrganicSlots(count);
        creaturesLayer.innerHTML = '';

        activeRoundItems.forEach((creature, idx) => {
          const pos = slots[idx];
          const slotEl = document.createElement('div');
          slotEl.className = 'creature-slot spawn-in';
          slotEl.style.left = pos.x.toFixed(2) + '%';
          slotEl.style.top = pos.y.toFixed(2) + '%';
          slotEl.style.setProperty('--spawn-delay', (idx * 0.045).toFixed(3) + 's');
          slotEl.dataset.id = creature.id;

          const hitEl = document.createElement('div');
          hitEl.className = 'creature-hit';

          const motionEl = document.createElement('div');
          motionEl.className = `creature-motion ${creature.motion}`;
          const dur = (4.3 + Math.random() * 2.5).toFixed(2) + 's';
          const delay = (-Math.random() * 5).toFixed(2) + 's';
          motionEl.style.setProperty('--dur', dur);
          motionEl.style.setProperty('--delay', delay);

          const flipEl = document.createElement('div');
          flipEl.className = 'creature-flip';
          if (creature.canFlip && Math.random() > 0.5) {
            flipEl.classList.add('flipped');
          }
          flipEl.innerHTML = creature.svg();

          motionEl.appendChild(flipEl);
          hitEl.appendChild(motionEl);
          slotEl.appendChild(hitEl);
          creaturesLayer.appendChild(slotEl);

          slotEl.addEventListener('click', () => handleCreatureClick(creature, slotEl, hitEl));
        });

        pickNextTarget(true);

        schedule(() => {
          inputLocked = false;
        }, 320);
      }

      /* =======================================================================
         6. BUTTON EVENTS (LANGUAGE TOGGLE & MINIMALIST NEXT BUTTON)
         ======================================================================= */
      langBtn.addEventListener('click', () => {
        SoundEngine.ensureContext();
        SoundEngine.playDroplet();
        currentLang = currentLang === 'uk' ? 'ru' : 'uk';
        langBtn.textContent = currentLang === 'uk' ? 'укр' : 'рус';
        document.documentElement.lang = currentLang;
        renderTargetWord(true);
      });

      nextBtn.addEventListener('click', () => {
        SoundEngine.ensureContext();
        startNewRound(true);
      });

      // Unlock Web Audio cleanly on first interaction anywhere
      const unlockAudioOnce = () => {
        SoundEngine.ensureContext();
        window.removeEventListener('pointerdown', unlockAudioOnce);
      };
      window.addEventListener('pointerdown', unlockAudioOnce, { passive: true });

      /* =======================================================================
         7. MAIN 60FPS ANIMATION LOOP & WINDOW INITIALIZATION
         ======================================================================= */
      let lastTime = performance.now();

      function animate(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const t = now * 0.001;

        drawBackground(t, dt);
        drawForegroundFX(t, dt);

        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', () => {
        resizeCanvases();
      });

      window.onload = function () {
        resizeCanvases();
        initOceanScene();
        startNewRound(false);
        lastTime = performance.now();
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
