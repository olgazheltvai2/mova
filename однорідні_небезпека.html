    function spawnSprite(cx, topY, intense = false) {
      const cols = intense ? 7 : (3 + Math.floor(Math.random() * 4));
      const tendrils = [];
      for (let i = 0; i < cols; i++) {
        tendrils.push({
          ox: (i - (cols - 1) / 2) * (24 + Math.random() * 18),
          h: H * (0.28 + Math.random() * 0.18),
          w: 6 + Math.random() * 9
        });
      }
      aux.sprites.push({ x: cx, y: topY, life: 0.62, maxLife: 0.62, tendrils });
      aux.cloudGlow = 1;
    }

    /* ------------------------------------------------------------------------
       15 BESPOKE RENDERERS + FORMATION & HAZARD SCIENTIFIC OVERLAYS
       ------------------------------------------------------------------------ */
    function renderBallLightning(dt, t, boost) {
      // Stormy night sky
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#040814');
      sky.addColorStop(0.55, '#0b162d');
      sky.addColorStop(1, '#09111f');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Distant storm clouds
      for (let i = 0; i < 8; i++) {
        const cx = ((i * W * 0.18 + t * 14) % (W + 300)) - 150;
        const cy = H * (0.14 + Math.sin(i * 2.1) * 0.06);
        drawSoftGlow(cx, cy, 170, 'rgba(30, 52, 92, 0.34)');
      }

      // Rain streaks
      ctx.strokeStyle = 'rgba(148, 197, 255, 0.18)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      for (const p of particles) {
        p.x -= p.spd * 0.22 * dt;
        p.y += p.spd * dt;
        if (p.y > H) { p.y = -20; p.x = Math.random() * (W + 140); }
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.len * 0.22, p.y + p.len);
      }
      ctx.stroke();

      // Dark wet night hills & wet reflective ground
      ctx.fillStyle = '#060c18';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.72);
      ctx.quadraticCurveTo(W * 0.25, H * 0.63, W * 0.55, H * 0.72);
      ctx.quadraticCurveTo(W * 0.82, H * 0.79, W, H * 0.68);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Floating glowing plasma orb with turbulent Lissajous physics
      const targetX = W * 0.56 + Math.sin(t * 0.75) * W * 0.14 + Math.cos(t * 1.9) * 28;
      const targetY = H * 0.44 + Math.cos(t * 0.92) * H * 0.1 + Math.sin(t * 2.3) * 18;
      aux.orb.x += (targetX - aux.orb.x) * Math.min(1, dt * 4);
      aux.orb.y += (targetY - aux.orb.y) * Math.min(1, dt * 4);
      const ox = aux.orb.x, oy = aux.orb.y;
      const orbR = (38 + Math.sin(t * 9) * 3.5) * (1 + boost * 0.45);

      // Wet ground reflection
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawSoftGlow(ox, H * 0.78, orbR * 3.8, 'rgba(56, 189, 248, 0.22)');

      // Multi-layered plasma bloom
      drawSoftGlow(ox, oy, orbR * 5.2, `rgba(56, 189, 248, ${0.24 + boost * 0.22})`);
      drawSoftGlow(ox, oy, orbR * 2.7, `rgba(251, 191, 36, ${0.42 + boost * 0.25})`);
      drawSoftGlow(ox, oy, orbR * 1.45, 'rgba(224, 242, 254, 0.88)');
      drawSoftGlow(ox, oy, orbR * 0.75, '#ffffff');
      ctx.restore();

      // Crackling plasma micro-bolts around the orb
      const arcCount = boost > 0.1 ? 8 : 3;
      for (let i = 0; i < arcCount; i++) {
        if (Math.random() < (boost > 0.1 ? 0.85 : 0.36)) {
          const ang = Math.random() * Math.PI * 2;
          const dist = orbR * (1.8 + Math.random() * (boost > 0.1 ? 5.5 : 2.2));
          drawLightning(ox, oy, ox + Math.cos(ang) * dist, oy + Math.sin(ang) * dist, 22, i % 2 ? '#38bdf8' : '#fbbf24', 1.5, 1);
        }
      }

      // Mouse attracts plasma tendrils!
      if (state.mouse.active) {
        const d = Math.hypot(state.mouse.px - ox, state.mouse.py - oy);
        if (d < 340 && Math.random() < 0.7) {
          drawLightning(ox, oy, state.mouse.px, state.mouse.py, 26, '#7dd3fc', 1.8, 1);
        }
      }

      // Climax storm discharge
      if (boost > 0.15 && Math.random() < 0.45) {
        drawLightning(ox, oy, Math.random() * W, H * 0.74, 48, '#38bdf8', 2.4, 2);
      }

      // Scientific Overlays
      if (state.infoMode === 'form') {
        drawLightning(W * 0.46, 0, ox, oy - orbR, 30, 'rgba(125,211,252,0.85)', 1.5, 1);
        drawCharge(ox - orbR * 2.1, oy - 34, '+', '#fbbf24');
        drawCharge(ox + orbR * 2.1, oy - 24, '−', '#38bdf8');
        drawCharge(ox - orbR * 1.7, oy + 52, '−', '#38bdf8');
        drawCharge(ox + orbR * 1.8, oy + 46, '+', '#fbbf24');
        drawCurvedArrow(ox - 120, oy + 90, ox - 20, oy + 125, ox + 115, oy + 72, '#38bdf8', t);
      } else if (state.infoMode === 'danger') {
        drawDangerPulse(ox, oy, 185, t, 'rgba(244, 63, 94, 0.85)');
        for (let a = 0; a < 6; a++) {
          const ang = (a / 6) * Math.PI * 2 + t * 0.4;
          drawFlowArrow(ox + Math.cos(ang) * 56, oy + Math.sin(ang) * 56, ox + Math.cos(ang) * 135, oy + Math.sin(ang) * 135, '#fb7185', t, true, 8);
        }
      }
    }

    function renderLimnic(dt, t, boost) {
      const surfY = H * 0.42;
      // Dusk volcanic sky
      const sky = ctx.createLinearGradient(0, 0, 0, surfY);
      sky.addColorStop(0, '#070b18');
      sky.addColorStop(1, '#142238');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, surfY);

      // Crater rim silhouette
      ctx.fillStyle = '#0c1322';
      ctx.beginPath();
      ctx.moveTo(0, surfY + 5);
      ctx.lineTo(W * 0.14, H * 0.25);
      ctx.lineTo(W * 0.28, surfY + 5);
      ctx.lineTo(W * 0.74, surfY + 5);
      ctx.lineTo(W * 0.88, H * 0.24);
      ctx.lineTo(W, surfY + 5);
      ctx.closePath();
      ctx.fill();

      // Deep stratified crater lake cross-section
      const water = ctx.createLinearGradient(0, surfY, 0, H);
      water.addColorStop(0, '#0c3547');
      water.addColorStop(0.55, '#071d2c');
      water.addColorStop(1, '#040d17');
      ctx.fillStyle = water;
      ctx.fillRect(0, surfY, W, H - surfY);

      // Volcanic rock basin + subtle magma glow underneath
      drawSoftGlow(W * 0.54, H * 0.98, W * 0.34, `rgba(239, 68, 68, ${0.24 + Math.sin(t * 2.5) * 0.06 + boost * 0.2})`);
      ctx.fillStyle = '#090e19';
      ctx.beginPath();
      ctx.moveTo(0, surfY);
      ctx.lineTo(W * 0.22, surfY);
      ctx.quadraticCurveTo(W * 0.34, H * 0.88, W * 0.54, H * 0.87);
      ctx.quadraticCurveTo(W * 0.74, H * 0.86, W * 0.82, surfY);
      ctx.lineTo(W, surfY);
      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();
      ctx.fill();

      // Rising CO2 pressurized bubbles
      const surge = 1 + boost * 2.4;
      for (const p of particles) {
        p.y -= p.spd * surge * dt;
        p.x += Math.sin(t * 3 + p.phase) * 14 * dt;
        if (p.y < surfY - 8) {
          p.y = H * (0.76 + Math.random() * 0.11);
          p.x = W * (0.36 + Math.random() * 0.34);
        }
        const expand = 1 + (1 - (p.y - surfY) / (H * 0.45)) * 1.4;
        ctx.fillStyle = `rgba(153, 246, 228, ${0.32 + (1 - (p.y - surfY) / (H * 0.5)) * 0.4})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * expand, 0, Math.PI * 2);
        ctx.fill();
      }

      // Erupting central white-teal water/gas fountain
      const jetH = H * (0.24 + Math.sin(t * 4) * 0.03 + boost * 0.16);
      const cx = W * 0.54;
      const gJet = ctx.createLinearGradient(cx, surfY, cx, surfY - jetH);
      gJet.addColorStop(0, 'rgba(94, 234, 212, 0.72)');
      gJet.addColorStop(0.6, 'rgba(204, 251, 241, 0.52)');
      gJet.addColorStop(1, 'rgba(204, 251, 241, 0)');
      ctx.fillStyle = gJet;
      ctx.beginPath();
      ctx.moveTo(cx - 26, surfY + 4);
      ctx.quadraticCurveTo(cx - 14, surfY - jetH * 0.6, cx - 54 - boost * 35, surfY - jetH);
      ctx.lineTo(cx + 54 + boost * 35, surfY - jetH);
      ctx.quadraticCurveTo(cx + 14, surfY - jetH * 0.6, cx + 26, surfY + 4);
      ctx.closePath();
      ctx.fill();

      // Heavy misty CO2 blanket rolling along the surface
      for (const m of aux.mist) {
        m.x += m.vx * (1 + boost) * dt;
        if (m.x < -120) m.x = cx;
        if (m.x > W + 120) m.x = cx;
        drawSoftGlow(m.x, surfY - 8 + Math.sin(t + m.x * 0.01) * 8, m.r * (1 + boost * 0.35), `rgba(186, 230, 253, ${m.a + boost * 0.12})`);
      }

      // Lake surface ripples
      ctx.strokeStyle = 'rgba(94, 234, 212, 0.45)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = W * 0.2; x <= W * 0.84; x += 12) {
        const y = surfY + Math.sin(x * 0.04 + t * 5) * 3.5;
        if (x === W * 0.2) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      if (state.infoMode === 'form') {
        drawFlowArrow(cx - 70, H * 0.86, cx - 50, H * 0.52, '#2dd4bf', t, true);
        drawFlowArrow(cx, H * 0.88, cx, H * 0.26, '#5eead4', t, true);
        drawFlowArrow(cx + 70, H * 0.86, cx + 50, H * 0.52, '#2dd4bf', t, true);
      } else if (state.infoMode === 'danger') {
        // Dense suffocating gas blanket indicator arrows rolling down valley
        drawFlowArrow(cx - 60, surfY - 18, W * 0.16, surfY - 6, '#fb7185', t, true, 12);
        drawFlowArrow(cx + 60, surfY - 18, W * 0.9, surfY - 6, '#fb7185', t, true, 12);
        ctx.fillStyle = 'rgba(244, 63, 94, 0.16)';
        ctx.fillRect(0, surfY - 46, W, 46);
      }
    }

    function renderRedSprites(dt, t, boost) {
      // Earth's upper atmosphere twilight mesosphere (strictly Earth horizon, no outer space/planets)
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#070a18');
      sky.addColorStop(0.38, '#131630');
      sky.addColorStop(0.68, '#1f2847');
      sky.addColorStop(1, '#090d1a');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Faint curved Earth atmospheric airglow band
      ctx.save();
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.14)';
      ctx.lineWidth = 22;
      ctx.beginPath();
      ctx.arc(W * 0.5, H * 2.1, H * 1.48, Math.PI * 1.32, Math.PI * 1.68);
      ctx.stroke();
      ctx.restore();

      // Periodic automatic sprite trigger
      aux.nextFlash -= dt * (boost > 0.1 ? 3.8 : 1);
      if (aux.nextFlash <= 0) {
        spawnSprite(W * (0.34 + Math.random() * 0.44), H * (0.14 + Math.random() * 0.12), boost > 0.1);
        aux.nextFlash = boost > 0.1 ? 0.35 : (1.5 + Math.random() * 1.5);
      }

      // Render active crimson Red Sprites
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = aux.sprites.length - 1; i >= 0; i--) {
        const s = aux.sprites[i];
        s.life -= dt;
        if (s.life <= 0) { aux.sprites.splice(i, 1); continue; }
        const a = Math.sin((s.life / s.maxLife) * Math.PI);

        // Diffuse upper crimson halo
        drawSoftGlow(s.x, s.y + 30, 180, `rgba(244, 63, 94, ${a * 0.48})`);
        drawSoftGlow(s.x, s.y + 55, 110, `rgba(251, 113, 133, ${a * 0.55})`);

        for (const td of s.tendrils) {
          const tx = s.x + td.ox;
          // Bright crimson carrot column
          const cg = ctx.createLinearGradient(tx, s.y, tx, s.y + td.h);
          cg.addColorStop(0, `rgba(255, 120, 150, ${a * 0.15})`);
          cg.addColorStop(0.28, `rgba(255, 58, 92, ${a * 0.95})`);
          cg.addColorStop(0.75, `rgba(192, 60, 190, ${a * 0.65})`);
          cg.addColorStop(1, `rgba(96, 165, 250, ${a * 0.35})`); // faint blue lower roots
          ctx.strokeStyle = cg;
          ctx.lineWidth = td.w;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(tx, s.y + 12);
          ctx.lineTo(tx + Math.sin(td.ox) * 12, s.y + td.h);
          ctx.stroke();

          // Branching lower tendrils
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = `rgba(147, 197, 253, ${a * 0.55})`;
          ctx.beginPath();
          ctx.moveTo(tx + Math.sin(td.ox) * 10, s.y + td.h * 0.72);
          ctx.lineTo(tx + td.ox * 0.35 - 14, s.y + td.h * 1.15);
          ctx.moveTo(tx + Math.sin(td.ox) * 10, s.y + td.h * 0.78);
          ctx.lineTo(tx + td.ox * 0.35 + 16, s.y + td.h * 1.18);
          ctx.stroke();
        }
      }
      ctx.restore();

      // Massive dark storm anvil clouds on horizon
      aux.cloudGlow = Math.max(0, aux.cloudGlow - dt * 2.2);
      for (const c of particles) {
        if (aux.cloudGlow > 0.05) {
          drawSoftGlow(c.x, c.y, c.r * 1.4, `rgba(125, 211, 252, ${aux.cloudGlow * 0.22})`);
        }
        const g = ctx.createRadialGradient(c.x, c.y - 12, 8, c.x, c.y, c.r);
        g.addColorStop(0, '#1e2942');
        g.addColorStop(0.65, '#111829');
        g.addColorStop(1, 'rgba(10, 14, 26, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#090e1c';
      ctx.fillRect(0, H * 0.75, W, H * 0.25);

      if (aux.cloudGlow > 0.45) {
        drawLightning(W * 0.54, H * 0.72, W * 0.52, H * 0.94, 24, '#7dd3fc', 2.2, 1);
      }

      if (state.infoMode === 'form') {
        // Mesosphere altitude bands & upward electric field arrows
        ctx.save();
        ctx.strokeStyle = 'rgba(251, 113, 133, 0.32)';
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.moveTo(W * 0.3, H * 0.16); ctx.lineTo(W * 0.88, H * 0.16);
        ctx.moveTo(W * 0.3, H * 0.54); ctx.lineTo(W * 0.88, H * 0.54);
        ctx.stroke();
        ctx.restore();
        drawFlowArrow(W * 0.54, H * 0.7, W * 0.54, H * 0.32, '#fb7185', t, true, 12);
        drawCharge(W * 0.46, H * 0.74, '+', '#38bdf8');
        drawCharge(W * 0.62, H * 0.74, '+', '#38bdf8');
      } else if (state.infoMode === 'danger') {
        drawDangerPulse(W * 0.56, H * 0.36, 220, t, 'rgba(244, 63, 94, 0.82)');
      }
    }

    function renderBrinicle(dt, t, boost) {
      // Deep Arctic underwater gradient
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#0a3a52');
      bg.addColorStop(0.28, '#062134');
      bg.addColorStop(0.75, '#03111f');
      bg.addColorStop(1, '#020912');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Caustic turquoise rays filtering under sea ice
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 6; i++) {
        const rx = W * (0.18 + i * 0.14) + Math.sin(t * 0.7 + i) * 28;
        const g = ctx.createLinearGradient(rx, H * 0.12, rx + 50, H * 0.72);
        g.addColorStop(0, 'rgba(34, 211, 238, 0.14)');
        g.addColorStop(1, 'rgba(34, 211, 238, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(rx - 22, H * 0.1);
        ctx.lineTo(rx + 22, H * 0.1);
        ctx.lineTo(rx + 90, H * 0.75);
        ctx.lineTo(rx - 40, H * 0.75);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Thick backlit glowing sea ice ceiling
      const iceGrad = ctx.createLinearGradient(0, 0, 0, H * 0.16);
      iceGrad.addColorStop(0, '#164e63');
      iceGrad.addColorStop(0.7, '#22d3ee');
      iceGrad.addColorStop(1, '#67e8f9');
      ctx.fillStyle = iceGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(W, 0);
      ctx.lineTo(W, H * 0.11);
      for (let x = W; x >= 0; x -= 48) {
        ctx.lineTo(x, H * 0.11 + Math.sin(x * 0.015) * 14 + Math.cos(x * 0.04) * 6);
      }
      ctx.closePath();
      ctx.fill();

      // Rocky ocean floor
      const floorY = H * 0.81;
      ctx.fillStyle = '#06101b';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, floorY);
      for (let x = 0; x <= W; x += 60) {
        ctx.lineTo(x, floorY + Math.sin(x * 0.012) * 12);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Brinicle central translucent jagged stalactite tube
      const bx = W * 0.56;
      const topY = H * 0.11;
      const tubeW = 36 + boost * 10;

      // Dark supercooled sinking brine core
      const brineG = ctx.createLinearGradient(bx - 16, topY, bx + 16, floorY);
      brineG.addColorStop(0, 'rgba(8, 47, 73, 0.92)');
      brineG.addColorStop(1, 'rgba(14, 116, 144, 0.7)');
      ctx.fillStyle = brineG;
      ctx.beginPath();
      ctx.moveTo(bx - 24, topY);
      ctx.lineTo(bx + 24, topY);
      ctx.lineTo(bx + 12, floorY + 6);
      ctx.lineTo(bx - 12, floorY + 6);
      ctx.closePath();
      ctx.fill();

      // Jagged crystal ice sheath
      ctx.save();
      ctx.fillStyle = 'rgba(165, 243, 252, 0.34)';
      ctx.strokeStyle = 'rgba(207, 250, 254, 0.78)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(bx - tubeW, topY);
      const steps = 18;
      for (let i = 1; i <= steps; i++) {
        const py = topY + (floorY - topY) * (i / steps);
        const wHere = tubeW * (1 - (i / steps) * 0.52) + Math.sin(i * 2.7) * 7;
        ctx.lineTo(bx - wHere, py);
      }
      for (let i = steps; i >= 0; i--) {
        const py = topY + (floorY - topY) * (i / steps);
        const wHere = tubeW * (1 - (i / steps) * 0.52) + Math.cos(i * 2.3) * 7;
        ctx.lineTo(bx + wHere, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Spreading glowing frost crystals across the seafloor
      const spreadR = W * (0.24 + Math.sin(t * 0.8) * 0.03 + boost * 0.22);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawSoftGlow(bx, floorY + 4, spreadR, `rgba(103, 232, 249, ${0.26 + boost * 0.28})`);
      ctx.strokeStyle = `rgba(165, 243, 252, ${0.55 + boost * 0.4})`;
      ctx.lineWidth = 1.6;
      for (let side = -1; side <= 1; side += 2) {
        ctx.beginPath();
        ctx.moveTo(bx, floorY + 2);
        for (let k = 1; k <= 12; k++) {
          const fx = bx + side * (spreadR * (k / 12));
          const fy = floorY + Math.sin(fx * 0.04) * 5;
          ctx.lineTo(fx, fy);
          ctx.moveTo(fx, fy);
          ctx.lineTo(fx + side * 10, fy - 8 - (k % 3) * 5);
          ctx.moveTo(fx, fy);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Silhouettes of sea stars on seafloor
      for (const st of aux.stars) {
        const frozen = Math.abs(st.x - bx) < spreadR * 0.9;
        ctx.save();
        ctx.translate(st.x, st.y);
        ctx.rotate(st.rot);
        ctx.fillStyle = frozen ? 'rgba(186, 230, 253, 0.72)' : '#1e293b';
        ctx.beginPath();
        for (let a = 0; a < 10; a++) {
          const rad = a % 2 === 0 ? st.size : st.size * 0.42;
          const ang = (a / 10) * Math.PI * 2;
          if (a === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
          else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Sinking brine & floating plankton particles
      for (const p of particles) {
        if (p.type === 'brine') {
          p.y += p.spd * (1 + boost) * dt;
          if (p.y > floorY) { p.y = topY; p.x = bx + (Math.random() - 0.5) * 30; }
          ctx.fillStyle = 'rgba(186, 230, 253, 0.55)';
        } else {
          p.x += Math.sin(t + p.y * 0.02) * 14 * dt;
          ctx.fillStyle = 'rgba(103, 232, 249, 0.25)';
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (state.infoMode === 'form') {
        drawFlowArrow(bx, topY + 25, bx, floorY - 25, '#22d3ee', t, true, 13);
        drawCurvedArrow(bx - 95, H * 0.48, bx - 55, H * 0.44, bx - 32, H * 0.48, '#60a5fa', t);
        drawCurvedArrow(bx + 95, H * 0.48, bx + 55, H * 0.44, bx + 32, H * 0.48, '#60a5fa', t);
      } else if (state.infoMode === 'danger') {
        drawFlowArrow(bx - 30, floorY - 12, bx - spreadR, floorY - 12, '#fb7185', t, true, 12);
        drawFlowArrow(bx + 30, floorY - 12, bx + spreadR, floorY - 12, '#fb7185', t, true, 12);
        drawDangerPulse(bx, floorY, spreadR * 0.75, t);
      }
    }

    function renderFireWhirl(dt, t, boost) {
      // Smoky wildfire night sky
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#09060b');
      bg.addColorStop(0.55, '#210c0b');
      bg.addColorStop(1, '#3b1008');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const baseX = W * 0.56;
      const baseY = H * 0.84;
      const lean = state.mouse.active ? (state.mouse.x - 0.56) * 130 : Math.sin(t * 0.8) * 35;

      // Ambient fiery glow
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawSoftGlow(baseX, baseY - H * 0.28, H * (0.48 + boost * 0.16), `rgba(249, 115, 22, ${0.28 + boost * 0.2})`);

      // Twisting layered flame vortex column
      const slices = 38;
      for (let i = 0; i < slices; i++) {
        const f = i / slices;
        const y = baseY - f * H * (0.72 + boost * 0.12);
        const sway = Math.sin(f * 5.2 - t * 5.5) * (16 + f * 36) + lean * f * f;
        const x = baseX + sway;
        const r = (24 + Math.pow(f, 0.85) * 62 + Math.sin(f * 9 - t * 8) * 9) * (1 + boost * 0.35);

        const g = ctx.createRadialGradient(x, y, r * 0.1, x, y, r * 1.45);
        g.addColorStop(0, `rgba(255, 250, 210, ${0.72 * (1 - f * 0.65)})`);
        g.addColorStop(0.38, `rgba(251, 146, 60, ${0.65 * (1 - f * 0.5)})`);
        g.addColorStop(0.75, `rgba(220, 38, 38, ${0.35 * (1 - f * 0.45)})`);
        g.addColorStop(1, 'rgba(127, 29, 29, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r * 1.45, 0, Math.PI * 2);
        ctx.fill();
      }

      // Spiraling embers
      for (const p of particles) {
        p.h += p.spd * (1 + boost * 1.2) * dt;
        p.ang += p.spin * (1 + boost * 0.6) * dt;
        if (p.h > 1) p.h = 0;
        const y = baseY - p.h * H * 0.86;
        const spread = 35 + p.h * 165 * (0.4 + p.radOff);
        const sway = Math.sin(p.h * 5.2 - t * 5.5) * 28 + lean * p.h * p.h;
        const x = baseX + sway + Math.cos(p.ang) * spread;
        ctx.fillStyle = p.h < 0.4 ? '#fef08a' : '#fb923c';
        ctx.globalAlpha = (1 - p.h) * 0.9;
        ctx.beginPath();
        ctx.arc(x, y, p.size * (1 - p.h * 0.4), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Burning jagged ridge silhouette
      ctx.fillStyle = '#0c0607';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.82);
      ctx.quadraticCurveTo(W * 0.35, H * 0.77, W * 0.68, H * 0.84);
      ctx.lineTo(W, H * 0.79);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      if (state.infoMode === 'form') {
        drawFlowArrow(baseX - 150, baseY - 20, baseX - 55, baseY - 25, '#fb923c', t, true);
        drawFlowArrow(baseX + 150, baseY - 20, baseX + 55, baseY - 25, '#fb923c', t, true);
        drawCurvedArrow(baseX - 55, baseY - 120, baseX + 85, baseY - 220, baseX - 45, baseY - 340, '#facc15', t);
      } else if (state.infoMode === 'danger') {
        drawDangerPulse(baseX, baseY - H * 0.3, 210, t);
        drawFlowArrow(baseX + 45, H * 0.36, baseX + 210, H * 0.25, '#fb7185', t, true);
        drawFlowArrow(baseX - 45, H * 0.42, baseX - 210, H * 0.3, '#fb7185', t, true);
      }
    }

    function renderQuicksand(dt, t, boost) {
      const surfY = H * 0.42;
      // Misty coastal marsh sky
      const sky = ctx.createLinearGradient(0, 0, 0, surfY);
      sky.addColorStop(0, '#0c1220');
      sky.addColorStop(1, '#272936');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, surfY);

      // Marsh reeds silhouette
      ctx.strokeStyle = '#141923';
      ctx.lineWidth = 2.4;
      for (let i = 0; i < 24; i++) {
        const rx = i < 12 ? W * (0.04 + i * 0.025) : W * (0.72 + (i - 12) * 0.024);
        const rh = 45 + (i % 5) * 18;
        ctx.beginPath();
        ctx.moveTo(rx, surfY + 6);
        ctx.quadraticCurveTo(rx + Math.sin(t * 1.4 + i) * 9, surfY - rh * 0.5, rx + Math.sin(t * 1.4 + i) * 16, surfY - rh);
        ctx.stroke();
      }

      // Layered wet sandbed cross-section
      const sand = ctx.createLinearGradient(0, surfY, 0, H);
      sand.addColorStop(0, '#6e5638');
      sand.addColorStop(0.22, '#533f28');
      sand.addColorStop(0.68, '#36291b');
      sand.addColorStop(1, '#1c1816');
      ctx.fillStyle = sand;
      ctx.fillRect(0, surfY, W, H - surfY);

      // Underground spring water saturation glow
      drawSoftGlow(W * 0.54, H * 0.88, W * 0.36, `rgba(56, 189, 248, ${0.22 + boost * 0.25})`);

      // Liquefied rippling wet surface sheen
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)';
      ctx.lineWidth = 2.2;
      for (let row = 0; row < 4; row++) {
        ctx.beginPath();
        for (let x = 0; x <= W; x += 18) {
          const y = surfY + row * 12 + Math.sin(x * 0.022 + t * (2.2 + boost * 3) + row) * (3.5 + boost * 4);
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Percolating water & floating sand grains
      for (const p of particles) {
        p.y += p.vy * (1 + boost * 2.2) * dt;
        p.x += Math.sin(t * 2.5 + p.y * 0.03) * 16 * dt;
        if (p.y < surfY + 4) {
          p.y = H * 0.96;
          p.x = Math.random() * W;
        }
        ctx.fillStyle = p.isWater ? 'rgba(125, 211, 252, 0.45)' : 'rgba(217, 179, 120, 0.55)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Interactive sinking ripple rings on click
      for (const c of state.clicks) {
        const prog = c.age / c.maxAge;
        ctx.strokeStyle = `rgba(251, 191, 36, ${(1 - prog) * 0.7})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(c.x, Math.max(surfY + 12, c.y), 14 + prog * 95, 5 + prog * 28, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (state.infoMode === 'form') {
        for (let k = -1; k <= 1; k++) {
          drawFlowArrow(W * 0.54 + k * 110, H * 0.85, W * 0.54 + k * 110, surfY + 26, '#38bdf8', t, true, 12);
        }
      } else if (state.infoMode === 'danger') {
        drawFlowArrow(W * 0.54, surfY - 22, W * 0.54, H * 0.68, '#fb7185', t, true, 13);
        drawDangerPulse(W * 0.54, surfY + 35, 130, t);
      }
    }

    function renderFreezingRain(dt, t, boost) {
      // Cold atmospheric dusk with subtle warm mid-air inversion band
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#071122');
      bg.addColorStop(0.4, '#13243b');
      bg.addColorStop(0.75, '#0c1b2e');
      bg.addColorStop(1, '#07101c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Slanted supercooled rain streaks
      ctx.strokeStyle = `rgba(186, 230, 253, ${0.35 + boost * 0.35})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (const p of particles) {
        p.x -= p.spd * 0.25 * dt;
        p.y += p.spd * dt;
        if (p.y > H) { p.y = -25; p.x = Math.random() * (W + 200); }
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.len * 0.25, p.y + p.len);
      }
      ctx.stroke();

      // Sagging utility power lines glazed in glistening ice
      const sway = Math.sin(t * 2.2) * 5 + (state.mouse.active ? (state.mouse.y - 0.5) * 14 : 0);
      const pole1 = W * 0.16, pole2 = W * 0.84;
      ctx.strokeStyle = '#0c1422';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(pole1, H * 0.26); ctx.lineTo(pole1, H);
      ctx.moveTo(pole2, H * 0.28); ctx.lineTo(pole2, H);
      ctx.stroke();

      for (let w = 0; w < 3; w++) {
        const y0 = H * (0.31 + w * 0.065);
        const sag = 58 + w * 14 + sway;
        // Ice crystal sheath glow
        ctx.strokeStyle = `rgba(165, 243, 252, ${0.42 + boost * 0.45})`;
        ctx.lineWidth = 7 + boost * 3;
        ctx.beginPath();
        ctx.moveTo(pole1, y0);
        ctx.quadraticCurveTo(W * 0.5, y0 + sag, pole2, y0 + 10);
        ctx.stroke();

        // Dark wire core
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Hanging icicles along the middle wire
        if (w === 1) {
          ctx.fillStyle = 'rgba(207, 250, 254, 0.72)';
          for (let k = 1; k < 14; k++) {
            const u = k / 14;
            const ix = (1 - u) * (1 - u) * pole1 + 2 * (1 - u) * u * (W * 0.5) + u * u * pole2;
            const iy = (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * (y0 + sag) + u * u * (y0 + 10);
            const iLen = 12 + (k % 4) * 7 + boost * 10;
            ctx.beginPath();
            ctx.moveTo(ix - 2.6, iy + 2);
            ctx.lineTo(ix + 2.6, iy + 2);
            ctx.lineTo(ix, iy + iLen);
            ctx.closePath();
            ctx.fill();
          }
        }
      }

      // Silhouetted ice-glazed tree branch on right
      ctx.save();
      ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(W, H * 0.64);
      ctx.quadraticCurveTo(W * 0.78, H * 0.56, W * 0.62, H * 0.65);
      ctx.moveTo(W * 0.78, H * 0.59);
      ctx.lineTo(W * 0.68, H * 0.51);
      ctx.stroke();
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.restore();

      // Shimmering crystal sparkles
      for (const s of aux.sparkles) {
        const alpha = (0.2 + 0.8 * Math.abs(Math.sin(t * 3 + s.p))) * (0.45 + boost * 0.55);
        ctx.fillStyle = `rgba(224, 242, 254, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 1.8 + boost * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      if (state.infoMode === 'form') {
        // Warm mid-air inversion layer + freezing surface layer
        ctx.fillStyle = 'rgba(251, 146, 60, 0.14)';
        ctx.fillRect(W * 0.34, H * 0.24, W * 0.54, H * 0.2);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.16)';
        ctx.fillRect(W * 0.34, H * 0.58, W * 0.54, H * 0.2);
        drawFlowArrow(W * 0.6, H * 0.12, W * 0.56, H * 0.74, '#7dd3fc', t, true, 12);
      } else if (state.infoMode === 'danger') {
        drawFlowArrow(W * 0.5, H * 0.42, W * 0.5, H * 0.64, '#fb7185', t, true, 13);
        drawDangerPulse(W * 0.5, H * 0.52, 135, t);
      }
    }

    function renderVolcanicLightning(dt, t, boost) {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#070610');
      bg.addColorStop(0.6, '#151021');
      bg.addColorStop(1, '#1d0d12');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const vx = W * 0.55, vy = H * 0.74;

      // Molten crater glow illuminating ash column from below
      drawSoftGlow(vx, vy, 230 + boost * 90, `rgba(249, 115, 22, ${0.42 + boost * 0.35})`);

      // Billowing charcoal cauliflower ash plume
      for (const p of particles) {
        p.t += p.spd * (1 + boost * 0.9) * dt;
        if (p.t > 1) p.t = 0;
        const y = vy - p.t * H * 0.68;
        const x = vx + p.spread * (28 + p.t * 210);
        if (p.ember) {
          ctx.fillStyle = `rgba(251, 146, 60, ${(1 - p.t) * 0.9})`;
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const rad = p.r * (0.45 + p.t * 1.3);
          const g = ctx.createRadialGradient(x, y, rad * 0.1, x, y, rad);
          g.addColorStop(0, p.t < 0.28 ? 'rgba(90, 42, 34, 0.85)' : 'rgba(34, 32, 46, 0.85)');
          g.addColorStop(1, 'rgba(15, 14, 24, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Rapid jagged violet-white lightning inside ash cloud
      aux.nextBolt -= dt * (boost > 0.1 ? 3.5 : 1);
      if (aux.nextBolt <= 0) {
        const bx = vx + (Math.random() - 0.5) * 190;
        const by = H * (0.18 + Math.random() * 0.38);
        aux.bolts.push({
          x1: bx, y1: by,
          x2: bx + (Math.random() - 0.5) * 210,
          y2: by + 60 + Math.random() * 140,
          life: 0.28
        });
        aux.nextBolt = 0.25 + Math.random() * 0.55;
      }

      for (let i = aux.bolts.length - 1; i >= 0; i--) {
        const b = aux.bolts[i];
        b.life -= dt;
        if (b.life <= 0) { aux.bolts.splice(i, 1); continue; }
        drawSoftGlow((b.x1 + b.x2) * 0.5, (b.y1 + b.y2) * 0.5, 140, 'rgba(192, 132, 252, 0.26)');
        drawLightning(b.x1, b.y1, b.x2, b.y2, 34, '#c084fc', 2.2, 2);
      }

      // Dark volcanic cone silhouette
      ctx.fillStyle = '#09070d';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(vx - 260, H);
      ctx.lineTo(vx - 52, vy);
      ctx.lineTo(vx + 52, vy);
      ctx.lineTo(vx + 280, H);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      if (state.infoMode === 'form') {
        drawCharge(vx - 85, H * 0.34, '+', '#fbbf24');
        drawCharge(vx + 90, H * 0.38, '−', '#c084fc');
        drawCharge(vx - 55, H * 0.52, '−', '#c084fc');
        drawCharge(vx + 60, H * 0.56, '+', '#fbbf24');
        drawFlowArrow(vx, vy - 15, vx, H * 0.26, '#fb923c', t, true, 12);
      } else if (state.infoMode === 'danger') {
        drawDangerPulse(vx, H * 0.44, 210, t);
      }
    }

    function renderPyroclastic(dt, t, boost) {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#0c0810');
      bg.addColorStop(0.55, '#261414');
      bg.addColorStop(1, '#120909');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Steep volcano slope from upper-left to lower-right
      const x0 = W * 0.14, y0 = H * 0.18;
      const x1 = W * 0.96, y1 = H * 0.86;

      ctx.fillStyle = '#100a0e';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.22);
      ctx.lineTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(W, H * 0.88);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Superheated churning ash & incandescent boulder avalanche
      for (const p of particles) {
        p.p += p.spd * (1 + boost * 1.4) * dt;
        if (p.p > 1) p.p = 0;
        const bx = x0 + (x1 - x0) * p.p;
        const by = y0 + (y1 - y0) * p.p - 18 - p.p * 48 + p.off * 0.35;

        if (p.hot) {
          ctx.fillStyle = `rgba(251, 146, 60, ${0.85 * (1 - p.p * 0.3)})`;
          ctx.beginPath();
          ctx.arc(bx + (Math.random() - 0.5) * 18, by + 26, 2.5 + boost * 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const rad = p.r * (0.55 + p.p * 1.15);
          const g = ctx.createRadialGradient(bx, by + rad * 0.2, rad * 0.1, bx, by, rad);
          g.addColorStop(0, `rgba(234, 88, 12, ${0.38 + boost * 0.25})`);
          g.addColorStop(0.45, 'rgba(66, 52, 54, 0.85)');
          g.addColorStop(1, 'rgba(28, 22, 26, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(bx, by, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (state.infoMode === 'form') {
        drawFlowArrow(x0 + 40, y0 - 20, x0 + 180, y0 + 95, '#f97316', t, true, 12);
        drawFlowArrow(W * 0.45, H * 0.35, W * 0.72, H * 0.58, '#fbbf24', t, true, 13);
      } else if (state.infoMode === 'danger') {
        drawFlowArrow(W * 0.35, H * 0.38, W * 0.84, H * 0.74, '#f43f5e', t, false, 16);
        drawDangerPulse(W * 0.72, H * 0.64, 155, t);
      }
    }

    function renderRipCurrent(dt, t, boost) {
      // High-angle coastal ocean view: deep sea top -> sandbars -> beach bottom
      const sea = ctx.createLinearGradient(0, 0, 0, H * 0.82);
      sea.addColorStop(0, '#041e2e');
      sea.addColorStop(0.45, '#0b4557');
      sea.addColorStop(0.85, '#136b78');
      sea.addColorStop(1, '#1d8289');
      ctx.fillStyle = sea;
      ctx.fillRect(0, 0, W, H);

      // Deceptively calm dark rip channel cutting straight out in center
      const chG = ctx.createLinearGradient(W * 0.4, 0, W * 0.6, 0);
      chG.addColorStop(0, 'rgba(3, 24, 38, 0)');
      chG.addColorStop(0.3, 'rgba(3, 24, 38, 0.62)');
      chG.addColorStop(0.7, 'rgba(3, 24, 38, 0.62)');
      chG.addColorStop(1, 'rgba(3, 24, 38, 0)');
      ctx.fillStyle = chG;
      ctx.fillRect(W * 0.39, 0, W * 0.22, H * 0.85);

      // White foaming waves breaking on LEFT and RIGHT sandbars (leaving calm gap in middle)
      for (let w = 0; w < 5; w++) {
        const wy = ((H * 0.16 + w * H * 0.14 + t * 34) % (H * 0.68)) + H * 0.08;
        const alpha = Math.sin(((wy - H * 0.08) / (H * 0.68)) * Math.PI) * 0.65;
        ctx.strokeStyle = `rgba(224, 247, 250, ${alpha})`;
        ctx.lineWidth = 6 + Math.sin(t * 3 + w) * 2;
        ctx.lineCap = 'round';
        // Left wave
        ctx.beginPath();
        ctx.moveTo(0, wy);
        ctx.quadraticCurveTo(W * 0.2, wy + 12, W * 0.41, wy - 4);
        ctx.stroke();
        // Right wave
        ctx.beginPath();
        ctx.moveTo(W * 0.59, wy - 4);
        ctx.quadraticCurveTo(W * 0.8, wy + 12, W, wy);
        ctx.stroke();
      }

      // Beach shoreline at bottom
      const beach = ctx.createLinearGradient(0, H * 0.74, 0, H);
      beach.addColorStop(0, '#7c6544');
      beach.addColorStop(0.4, '#5c4932');
      beach.addColorStop(1, '#33281d');
      ctx.fillStyle = beach;
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.78);
      ctx.quadraticCurveTo(W * 0.5, H * 0.72, W, H * 0.79);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Seafoam tracer streaks pulled rapidly OUTWARD in the rip channel
      for (const p of particles) {
        if (p.inChannel) {
          p.y -= p.spd * (1 + boost * 1.6) * dt;
          if (p.y < H * 0.06) { p.y = H * 0.76; p.x = W * (0.44 + Math.random() * 0.12); }
          ctx.strokeStyle = `rgba(153, 246, 228, ${0.48 + boost * 0.4})`;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y + 18 + boost * 16);
          ctx.stroke();
        } else {
          p.y += p.spd * dt;
          if (p.y > H * 0.75) { p.y = H * 0.12; }
          ctx.fillStyle = 'rgba(207, 250, 254, 0.32)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (state.infoMode === 'form') {
        drawFlowArrow(W * 0.24, H * 0.28, W * 0.24, H * 0.66, '#38bdf8', t, true, 11);
        drawFlowArrow(W * 0.76, H * 0.28, W * 0.76, H * 0.66, '#38bdf8', t, true, 11);
        drawCurvedArrow(W * 0.28, H * 0.7, W * 0.42, H * 0.72, W * 0.48, H * 0.58, '#2dd4bf', t);
        drawCurvedArrow(W * 0.72, H * 0.7, W * 0.58, H * 0.72, W * 0.52, H * 0.58, '#2dd4bf', t);
        drawFlowArrow(W * 0.5, H * 0.66, W * 0.5, H * 0.16, '#5eead4', t, true, 14);
      } else if (state.infoMode === 'danger') {
        drawFlowArrow(W * 0.5, H * 0.68, W * 0.5, H * 0.18, '#f43f5e', t, false, 15);
        // Safe escape vectors parallel to shore!
        drawFlowArrow(W * 0.48, H * 0.42, W * 0.3, H * 0.42, '#34d399', t, true, 12);
        drawFlowArrow(W * 0.52, H * 0.42, W * 0.7, H * 0.42, '#34d399', t, true, 12);
      }
    }

    function renderAvalanche(dt, t, boost) {
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#091426');
      bg.addColorStop(0.5, '#192d4a');
      bg.addColorStop(1, '#0e1b2f');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Steep twilight alpine peak
      const px0 = W * 0.12, py0 = H * 0.14;
      const px1 = W * 0.94, py1 = H * 0.88;
      const mtn = ctx.createLinearGradient(px0, py0, px1, py1);
      mtn.addColorStop(0, '#cbd5e1');
      mtn.addColorStop(0.35, '#64748b');
      mtn.addColorStop(1, '#1e293b');
      ctx.fillStyle = mtn;
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.25);
      ctx.lineTo(px0, py0);
      ctx.lineTo(px1, py1);
      ctx.lineTo(W, H * 0.92);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Jagged snowpack fracture crown line
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(W * 0.18, H * 0.24);
      ctx.lineTo(W * 0.24, H * 0.21);
      ctx.lineTo(W * 0.31, H * 0.28);
      ctx.lineTo(W * 0.37, H * 0.25);
      ctx.stroke();

      // Roaring billowing white-blue powder cloud & tumbling slabs
      for (const p of particles) {
        p.p += p.spd * (1 + boost * 1.4) * dt;
        if (p.p > 1) p.p = 0;
        const x = W * 0.22 + (W * 0.74) * p.p;
        const y = H * 0.24 + (H * 0.62) * p.p + p.off * 0.38 - p.p * 32;
        if (p.slab) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(t * 4 + p.off);
          ctx.fillStyle = 'rgba(226, 238, 252, 0.85)';
          ctx.fillRect(-6, -4, 12, 8);
          ctx.restore();
        } else {
          const rad = p.r * (0.5 + p.p * 1.25 + boost * 0.3);
          const g = ctx.createRadialGradient(x, y, rad * 0.1, x, y, rad);
          g.addColorStop(0, 'rgba(235, 246, 255, 0.75)');
          g.addColorStop(0.55, 'rgba(147, 197, 253, 0.36)');
          g.addColorStop(1, 'rgba(147, 197, 253, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (state.infoMode === 'form') {
        drawFlowArrow(W * 0.28, H * 0.25, W * 0.65, H * 0.56, '#93c5fd', t, true, 13);
      } else if (state.infoMode === 'danger') {
        drawFlowArrow(W * 0.34, H * 0.34, W * 0.82, H * 0.74, '#f43f5e', t, false, 15);
        drawDangerPulse(W * 0.74, H * 0.68, 150, t);
      }
    }

    function renderWaterspout(dt, t, boost) {
      const seaY = H * 0.72;
      // Stormy slate sky
      const sky = ctx.createLinearGradient(0, 0, 0, seaY);
      sky.addColorStop(0, '#0a1220');
      sky.addColorStop(0.55, '#192a3d');
      sky.addColorStop(1, '#223b4f');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, seaY);

      // Dark choppy emerald-slate sea
      const sea = ctx.createLinearGradient(0, seaY, 0, H);
      sea.addColorStop(0, '#0c2c38');
      sea.addColorStop(1, '#041219');
      ctx.fillStyle = sea;
      ctx.fillRect(0, seaY, W, H - seaY);

      // Brooding dark cloud ceiling
      for (let i = 0; i < 10; i++) {
        drawSoftGlow(W * (i * 0.12), H * 0.12, 160, 'rgba(15, 23, 38, 0.85)');
      }

      // Gracefully curving translucent waterspout funnel
      const cx = W * 0.56;
      const swayX = state.mouse.active ? (state.mouse.x - 0.56) * 85 : Math.sin(t * 0.9) * 35;

      const slices = 34;
      for (let i = 0; i < slices; i++) {
        const f = i / slices; // 0 = top cloud, 1 = sea surface
        const y = H * 0.14 + f * (seaY - H * 0.13);
        const curve = Math.sin(f * Math.PI) * (44 + swayX * 0.5) + Math.sin(t * 3 + f * 6) * 6;
        const x = cx + curve;
        const w = (10 + Math.pow(1 - f, 2.2) * 86) * (1 + boost * 0.25);

        const g = ctx.createLinearGradient(x - w, y, x + w, y);
        g.addColorStop(0, 'rgba(186, 230, 253, 0)');
        g.addColorStop(0.28, `rgba(186, 230, 253, ${0.28 + boost * 0.2})`);
        g.addColorStop(0.5, `rgba(224, 242, 254, ${0.52 + boost * 0.28})`);
        g.addColorStop(0.72, `rgba(186, 230, 253, ${0.28 + boost * 0.2})`);
        g.addColorStop(1, 'rgba(186, 230, 253, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - w, y - 6, w * 2, 14);
      }

      // Spinning sea spray ring ("cascade") at surface
      const baseSpoutX = cx + Math.sin(t * 3 + 6) * 6;
      drawSoftGlow(baseSpoutX, seaY, 95 + boost * 45, `rgba(186, 230, 253, ${0.42 + boost * 0.3})`);

      for (const p of particles) {
        p.h -= p.spd * (1 + boost) * dt;
        p.ang += p.spin * (1 + boost * 0.7) * dt;
        if (p.h < 0) p.h = 1;
        if (p.spray) {
          const rad = 22 + (1 - p.h) * 85;
          const x = baseSpoutX + Math.cos(p.ang) * rad;
          const y = seaY - Math.sin((1 - p.h) * Math.PI) * (42 + boost * 35);
          ctx.fillStyle = 'rgba(224, 242, 254, 0.58)';
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const y = H * 0.14 + p.h * (seaY - H * 0.14);
          const curve = Math.sin(p.h * Math.PI) * (44 + swayX * 0.5);
          const rad = 12 + Math.pow(1 - p.h, 2) * 78;
          const x = cx + curve + Math.cos(p.ang) * rad;
          ctx.fillStyle = 'rgba(186, 230, 253, 0.45)';
          ctx.beginPath();
          ctx.arc(x, y, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (state.infoMode === 'form') {
        drawCurvedArrow(baseSpoutX - 80, seaY - 12, baseSpoutX + 75, H * 0.5, baseSpoutX - 45, H * 0.28, '#2dd4bf', t);
        drawFlowArrow(baseSpoutX + 95, H * 0.2, baseSpoutX + 40, H * 0.34, '#38bdf8', t, true);
      } else if (state.infoMode === 'danger') {
        drawDangerPulse(baseSpoutX, seaY - 12, 160, t);
      }
    }

    function renderHaboob(dt, t, boost) {
      // Amber-violet desert dusk sky
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#181326');
      sky.addColorStop(0.45, '#422620');
      sky.addColorStop(1, '#26140c');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Desert dunes
      ctx.fillStyle = '#2d190e';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.72);
      ctx.quadraticCurveTo(W * 0.3, H * 0.64, W * 0.62, H * 0.75);
      ctx.quadraticCurveTo(W * 0.85, H * 0.8, W, H * 0.7);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Colossal rolling ochre/terracotta dust wall advancing across screen
      const wallFront = W * (0.64 + Math.sin(t * 0.35) * 0.08 + boost * 0.14);
      for (const p of particles) {
        if (p.dust) {
          p.x += p.spd * (1 + boost * 1.4) * dt;
          if (p.x > wallFront + 90) p.x = -120;
          const g = ctx.createRadialGradient(p.x, p.y, p.r * 0.1, p.x, p.y, p.r);
          g.addColorStop(0, 'rgba(180, 98, 42, 0.72)');
          g.addColorStop(0.55, 'rgba(124, 58, 24, 0.45)');
          g.addColorStop(1, 'rgba(92, 42, 18, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        } else {
          p.x += p.spd * (1 + boost * 1.3) * dt;
          if (p.x > W + 20) { p.x = -20; p.y = H * (0.2 + Math.random() * 0.7); }
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.34)';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - 16 - boost * 18, p.y + 2);
          ctx.stroke();
        }
      }

      if (state.infoMode === 'form') {
        drawFlowArrow(W * 0.32, H * 0.16, W * 0.32, H * 0.62, '#38bdf8', t, true, 12);
        drawCurvedArrow(W * 0.34, H * 0.68, W * 0.56, H * 0.7, W * 0.66, H * 0.42, '#f59e0b', t);
      } else if (state.infoMode === 'danger') {
        drawFlowArrow(W * 0.36, H * 0.46, W * 0.78, H * 0.46, '#f43f5e', t, false, 15);
        drawDangerPulse(wallFront, H * 0.5, 165, t);
      }
    }

    function renderGeyser(dt, t, boost) {
      const groundY = H * 0.58;
      // Twilight geothermal valley sky
      const sky = ctx.createLinearGradient(0, 0, 0, groundY);
      sky.addColorStop(0, '#07101f');
      sky.addColorStop(1, '#1b2b3d');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, groundY);

      // Geological bedrock cross-section below surface
      const rock = ctx.createLinearGradient(0, groundY, 0, H);
      rock.addColorStop(0, '#1e2430');
      rock.addColorStop(0.6, '#12141c');
      rock.addColorStop(1, '#261110');
      ctx.fillStyle = rock;
      ctx.fillRect(0, groundY, W, H - groundY);

      const gx = W * 0.56;
      // Glowing deep magma heat chamber
      drawSoftGlow(gx, H * 0.98, 220 + boost * 70, `rgba(249, 115, 22, ${0.52 + boost * 0.3})`);

      // Narrow sinuous underground water fissure conduit
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.45)';
      ctx.lineWidth = 24;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(gx, groundY);
      ctx.bezierCurveTo(gx - 38, H * 0.7, gx + 42, H * 0.8, gx, H * 0.93);
      ctx.stroke();

      // Roaring boiling turquoise jet + billowing white steam above vent
      const jetH = H * (0.4 + Math.sin(t * 5) * 0.04 + boost * 0.14);
      const jg = ctx.createLinearGradient(gx, groundY, gx, groundY - jetH);
      jg.addColorStop(0, 'rgba(34, 211, 238, 0.85)');
      jg.addColorStop(0.55, 'rgba(207, 250, 254, 0.65)');
      jg.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = jg;
      ctx.beginPath();
      ctx.moveTo(gx - 12, groundY + 4);
      ctx.lineTo(gx - 42 - boost * 25, groundY - jetH);
      ctx.lineTo(gx + 42 + boost * 25, groundY - jetH);
      ctx.lineTo(gx + 12, groundY + 4);
      ctx.closePath();
      ctx.fill();

      for (const p of particles) {
        if (p.kind === 'bubble') {
          p.y -= (65 + boost * 90) * dt;
          if (p.y < groundY) { p.y = H * 0.92; p.x = gx + (Math.random() - 0.5) * 20; }
          ctx.fillStyle = 'rgba(165, 243, 252, 0.72)';
          ctx.beginPath();
          ctx.arc(p.x + Math.sin(p.y * 0.05) * 14, p.y, 3.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.kind === 'jet') {
          p.x += p.vx * dt;
          p.y += p.vy * (1 + boost * 0.7) * dt;
          p.vy += 320 * dt;
          if (p.y > groundY) {
            p.x = gx + (Math.random() - 0.5) * 14;
            p.y = groundY;
            p.vx = (Math.random() - 0.5) * 75;
            p.vy = -260 - Math.random() * 210;
          }
          ctx.fillStyle = 'rgba(165, 243, 252, 0.75)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          p.y -= (48 + boost * 40) * dt;
          p.x += (18 + Math.sin(t + p.y * 0.02) * 15) * dt;
          if (p.y < H * 0.05) { p.y = groundY - 60; p.x = gx + (Math.random() - 0.5) * 45; }
          drawSoftGlow(p.x, p.y, 28 + p.r * 2, 'rgba(224, 242, 254, 0.16)');
        }
      }

      if (state.infoMode === 'form') {
        drawFlowArrow(gx, H * 0.88, gx, groundY - 120, '#22d3ee', t, true, 13);
        drawFlowArrow(gx - 85, H * 0.92, gx - 25, H * 0.84, '#fb923c', t, true);
        drawFlowArrow(gx + 85, H * 0.92, gx + 25, H * 0.84, '#fb923c', t, true);
      } else if (state.infoMode === 'danger') {
        drawDangerPulse(gx, groundY, 155, t);
      }
    }

    function renderHailstorm(dt, t, boost) {
      // Supercell green-teal illuminated storm sky
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#071316');
      sky.addColorStop(0.45, '#102b2c');
      sky.addColorStop(1, '#081218');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Rotating supercell storm cloud glow
      drawSoftGlow(W * 0.54, H * 0.22, W * 0.42, `rgba(52, 211, 153, ${0.18 + Math.sin(t * 2) * 0.04 + boost * 0.28})`);

      // Dark terraced supercell cloud deck
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = `rgba(12, 26, 32, ${0.72 - i * 0.08})`;
        ctx.beginPath();
        ctx.ellipse(W * 0.54 + Math.sin(t * 0.5 + i) * 18, H * (0.08 + i * 0.045), W * (0.48 - i * 0.05), 34, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (boost > 0.2 && Math.random() < 0.35) {
        drawLightning(W * 0.52, H * 0.22, W * (0.35 + Math.random() * 0.35), H * 0.78, 36, '#6ee7b7', 2.4, 2);
      }

      // Silhouetted rooftops & terrain at bottom
      const floorY = H * 0.82;
      ctx.fillStyle = '#070e15';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, floorY);
      ctx.lineTo(W * 0.28, floorY);
      ctx.lineTo(W * 0.36, floorY - 38);
      ctx.lineTo(W * 0.44, floorY);
      ctx.lineTo(W * 0.72, floorY);
      ctx.lineTo(W * 0.8, floorY - 46);
      ctx.lineTo(W * 0.88, floorY);
      ctx.lineTo(W, floorY);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Heavy translucent layered hailstones falling & shattering
      for (const p of particles) {
        p.x += p.vx * (1 + boost * 0.5) * dt;
        p.y += p.vy * (1 + boost * 0.5) * dt;
        if (p.y > floorY) {
          // Spawn shattering ice shards on impact
          for (let s = 0; s < 3; s++) {
            aux.shards.push({
              x: p.x, y: floorY,
              vx: (Math.random() - 0.5) * 180,
              vy: -70 - Math.random() * 140,
              r: 1.5 + Math.random() * 2.4,
              life: 0.45
            });
          }
          p.y = -20 - Math.random() * 80;
          p.x = Math.random() * (W + 240);
        }

        // Translucent layered hailstone
        const hg = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, 1, p.x, p.y, p.r);
        hg.addColorStop(0, '#ffffff');
        hg.addColorStop(0.55, 'rgba(186, 230, 253, 0.85)');
        hg.addColorStop(1, 'rgba(56, 189, 248, 0.35)');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ice impact shards
      for (let i = aux.shards.length - 1; i >= 0; i--) {
        const s = aux.shards[i];
        s.life -= dt;
        if (s.life <= 0) { aux.shards.splice(i, 1); continue; }
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += 420 * dt;
        ctx.fillStyle = `rgba(224, 242, 254, ${s.life * 2})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (state.infoMode === 'form') {
        // Supercell updraft recirculation loops inside cloud
        drawCurvedArrow(W * 0.46, H * 0.46, W * 0.42, H * 0.22, W * 0.54, H * 0.18, '#34d399', t);
        drawCurvedArrow(W * 0.58, H * 0.18, W * 0.68, H * 0.26, W * 0.6, H * 0.48, '#7dd3fc', t);
      } else if (state.infoMode === 'danger') {
        drawFlowArrow(W * 0.64, H * 0.32, W * 0.54, floorY - 12, '#f43f5e', t, false, 14);
        drawDangerPulse(W * 0.54, floorY - 10, 120, t);
      }
    }

    const RENDERERS = {
      ball: renderBallLightning,
      limnic: renderLimnic,
      sprite: renderRedSprites,
      brinicle: renderBrinicle,
      firewhirl: renderFireWhirl,
      quicksand: renderQuicksand,
      freezing: renderFreezingRain,
      volcanic: renderVolcanicLightning,
      pyroclastic: renderPyroclastic,
      rip: renderRipCurrent,
      avalanche: renderAvalanche,
      waterspout: renderWaterspout,
      haboob: renderHaboob,
      geyser: renderGeyser,
      hail: renderHailstorm
    };

    let lastTS = 0;
    function frame(ts) {
      if (!lastTS) lastTS = ts;
      const dt = Math.min(0.05, (ts - lastTS) / 1000);
      lastTS = ts;
      state.time += dt;

      if (state.climaxTimer > 0) {
        state.climaxTimer = Math.max(0, state.climaxTimer - dt);
      }
      const boost = state.climaxTimer > 0 ? Math.sin((state.climaxTimer / 2.6) * Math.PI) : 0;

      // Update interactive click ripples
      for (let i = state.clicks.length - 1; i >= 0; i--) {
        state.clicks[i].age += dt;
        if (state.clicks[i].age >= state.clicks[i].maxAge) state.clicks.splice(i, 1);
      }

      const fn = RENDERERS[sceneId];
      if (fn) fn(dt, state.time, boost);

      // Subtle interactive cursor glow ring on click
      if (sceneId !== 'quicksand') {
        for (const c of state.clicks) {
          const p = c.age / c.maxAge;
          ctx.save();
          ctx.strokeStyle = `rgba(${currentItem().theme.rgb}, ${(1 - p) * 0.6})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(c.x, c.y, 12 + p * 75, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Climax celebratory radial energy pulse across canvas
      if (boost > 0.05) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const p = 1 - state.climaxTimer / 2.6;
        ctx.strokeStyle = `rgba(${currentItem().theme.rgb}, ${boost * 0.5})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(W * 0.54, H * 0.48, p * Math.max(W, H) * 0.72, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(frame);
    }

    return {
      start() {
        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(frame);
      },
      initScene,
      onInteract
    };
  })();

  /* ==========================================================================
     7. BOOTSTRAP APPLICATION ON WINDOW LOAD
     ========================================================================== */
  window.addEventListener('load', () => {
    SimEngine.start();
    loadPhenomenon(0, false);
  });
})();
</script>
