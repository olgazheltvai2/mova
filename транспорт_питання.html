<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transport</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI','Arial',sans-serif;background:#0b1b2b}
  #game{position:fixed;inset:0;overflow:hidden}
  canvas#bg{position:absolute;inset:0;display:block}

  /* ---------- CARD ---------- */
  #card{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);
    width:min(1180px,88vw);
    padding:clamp(16px,2.2vh,34px) clamp(22px,3vw,52px);
    display:flex;flex-direction:column;gap:clamp(10px,1.6vh,24px);
    border-radius:34px;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.20), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(255,170,80,.22), transparent 46%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 14px, rgba(255,255,255,0) 14px 28px),
      linear-gradient(155deg, rgba(18,58,102,.90), rgba(9,26,52,.94));
    border:2px solid rgba(150,215,255,.35);
    box-shadow:0 30px 80px rgba(0,20,45,.55), inset 0 2px 0 rgba(255,255,255,.18),
               0 0 0 1px rgba(0,0,0,.25);
    backdrop-filter:blur(16px) saturate(150%);
    transition:opacity .7s ease, transform .7s ease;
    opacity:1;
  }
  #card.in{animation:pop .42s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.94);opacity:.4}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

  #prompt{
    text-align:center;
    font-size:clamp(22px,2.5vw,44px);
    font-weight:800;
    line-height:1.18;
    color:#fff;
    letter-spacing:.4px;
    text-shadow:0 3px 14px rgba(0,30,70,.75), 0 0 26px rgba(90,190,255,.35);
  }

  #visual{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;padding:clamp(2px,.8vh,10px) 0}
  #visual svg{max-width:100%;max-height:clamp(140px,30vh,330px);height:auto;width:auto;display:block;
              filter:drop-shadow(0 10px 26px rgba(0,0,0,.45))}

  #options{display:grid;gap:clamp(8px,1.4vw,20px);width:100%}

  .opt{
    position:relative;
    border:2px solid rgba(140,215,255,.45);
    border-radius:22px;
    background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(120,190,255,.07));
    color:#fff;
    font-size:clamp(16px,1.7vw,30px);
    font-weight:700;
    padding:clamp(10px,1.7vh,22px) clamp(8px,1vw,18px);
    cursor:pointer;
    transition:transform .13s ease, background .2s, border-color .2s, box-shadow .2s;
    text-shadow:0 2px 8px rgba(0,25,60,.6);
    display:flex;align-items:center;justify-content:center;
    min-height:clamp(52px,9vh,110px);
    overflow:hidden;
    font-family:inherit;
  }
  .opt::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-120%);transition:transform .5s;
  }
  .opt:hover{transform:translateY(-3px) scale(1.02);
    background:linear-gradient(160deg, rgba(150,225,255,.30), rgba(90,170,255,.14));
    border-color:rgba(180,235,255,.95);
    box-shadow:0 12px 30px rgba(0,120,220,.45), 0 0 24px rgba(120,210,255,.35)}
  .opt:hover::after{transform:translateX(120%)}
  .opt:active{transform:scale(.97)}
  .opt svg{width:100%;max-height:clamp(52px,11vh,120px);height:auto;pointer-events:none;
           filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
  .opt-svg{padding:clamp(6px,1vh,14px)}

  .opt.ok{
    background:linear-gradient(160deg, rgba(90,255,160,.45), rgba(20,190,110,.30));
    border-color:#7dffb8;
    box-shadow:0 0 34px rgba(60,255,150,.75), inset 0 0 22px rgba(140,255,200,.5);
    animation:okPulse .55s ease;
  }
  @keyframes okPulse{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
  .opt.no{
    background:linear-gradient(160deg, rgba(255,80,90,.45), rgba(180,20,50,.32));
    border-color:#ff8090;
    animation:shake .45s;
  }
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
  .opt.dim{opacity:.32;filter:grayscale(.6)}

  /* ---------- NEXT ---------- */
  #next{
    position:absolute;right:18px;bottom:18px;
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    color:rgba(255,255,255,.42);
    font-size:24px;line-height:1;
    cursor:pointer;opacity:.42;
    transition:opacity .25s, background .25s, transform .15s, color .25s;
    z-index:20;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    padding-bottom:3px;
  }
  #next:hover{opacity:1;background:rgba(255,255,255,.22);color:#fff;transform:scale(1.08)}
  #next:active{transform:scale(.94)}

  /* ---------- LANG ---------- */
  #lang{
    position:absolute;left:16px;bottom:18px;
    font-size:12px;letter-spacing:1.6px;font-weight:700;
    color:rgba(255,255,255,.38);
    background:rgba(0,0,0,.13);
    border:1px solid rgba(255,255,255,.13);
    border-radius:20px;padding:4px 12px;cursor:pointer;
    opacity:.38;transition:opacity .3s;z-index:20;font-family:inherit;
  }
  #lang:hover{opacity:1}

  /* ---------- SPARK ---------- */
  .spark{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:30;
         animation:sparkFly .75s ease-out forwards}
  @keyframes sparkFly{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="bg"></canvas>

  <div id="card">
    <div id="prompt"></div>
    <div id="visual"></div>
    <div id="options"></div>
  </div>

  <button id="next">›</button>
  <div id="lang">УК</div>
</div>

/* ============================================================
   АУДІО
   ============================================================ */
let actx = null;
function A(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx = null; }
  }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, start, dur, type, vol){
  const c = A(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  const t0 = c.currentTime + start;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfxCorrect(){
  tone(659,0,0.13,'triangle',0.16);
  tone(880,0.09,0.16,'triangle',0.16);
  tone(1319,0.20,0.30,'sine',0.12);
  tone(1760,0.30,0.22,'sine',0.07);
}
function sfxWrong(){
  tone(196,0,0.16,'sawtooth',0.09);
  tone(147,0.09,0.22,'sawtooth',0.09);
  tone(110,0.19,0.26,'sine',0.07);
}
function sfxClick(){ tone(540,0,0.05,'square',0.045); }
function sfxNext(){ tone(523,0,0.07,'sine',0.09); tone(784,0.06,0.11,'sine',0.09); }
function sfxFinal(){
  const notes = [523,659,784,1047,1319,1568];
  notes.forEach((n,i)=> tone(n, i*0.13, 0.45, 'triangle', 0.12));
  tone(2093, 0.85, 0.7, 'sine', 0.06);
}

/* ============================================================
   ЗАВДАННЯ
   ============================================================ */
const TASKS = [
  {
    prompt:{uk:'Що означає цей дорожній знак?', ru:'Что означает этот дорожный знак?'},
    visual: signParkingSVG(),
    options:[
      {uk:'Паркування', ru:'Парковка', correct:true},
      {uk:'Заправка', ru:'Заправка'},
      {uk:'Лікарня', ru:'Больница'},
      {uk:'Рух заборонено', ru:'Движение запрещено'}
    ],
    cols:2
  },
  {
    prompt:{uk:'Який транспорт має лише два колеса?', ru:'Какой транспорт имеет только два колеса?'},
    visual: null,
    options:[
      {svg: bikeSVG(), correct:true},
      {svg: carSmallSVG()},
      {svg: busSVG()},
      {svg: trainSVG()}
    ],
    cols:4
  },

    visual:null,

    cols:4

      {uk:'Зелений', ru:'Зелёный', correct:true}
    ],
    cols:3
  },
  {
    prompt:{uk:'Який транспорт громадський?', ru:'Какой транспорт общественный?'},
    visual:null,
    options:[
      {svg: busSVG(), correct:true},
      {svg: carSmallSVG()},
      {svg: bikeSVG()},
      {svg: motoSVG()}
    ],
    cols:4
  },
  {

    visual:null,

/* ============================================================
   СТАН
   ============================================================ */
const state = { lang:'uk', task:0, solved:false };
let mode = 'game';

const cardEl   = document.getElementById('card');
const promptEl = document.getElementById('prompt');
const visualEl = document.getElementById('visual');
const optsEl   = document.getElementById('options');
const nextBtn  = document.getElementById('next');
const langBtn  = document.getElementById('lang');

/* ============================================================
   РЕНДЕР ЗАВДАННЯ
   ============================================================ */
function renderTask(){
  if(state.task >= TASKS.length){ startEnd(); return; }
  const t = TASKS[state.task];

  promptEl.textContent = t.prompt[state.lang];
  visualEl.innerHTML = t.visual || '';
  visualEl.style.display = t.visual ? 'flex' : 'none';

  optsEl.innerHTML = '';
  optsEl.style.gridTemplateColumns = `repeat(${t.cols || t.options.length}, 1fr)`;

  t.options.forEach((o, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    if(o.svg){
      b.innerHTML = o.svg;
      b.classList.add('opt-svg');
    } else {
      b.textContent = o[state.lang];
    }
    b.addEventListener('click', ()=> choose(i, b, o));
    optsEl.appendChild(b);
  });

  state.solved = false;

  cardEl.classList.remove('in');
  void cardEl.offsetWidth;
  cardEl.classList.add('in');
}

/* ============================================================
   ВИБІР
   ============================================================ */
function choose(i, btn, o){
  if(state.solved) return;

  if(o.correct){
    state.solved = true;
    btn.classList.add('ok');
    sfxCorrect();
    sparkBurst(btn);
    [...optsEl.children].forEach((c, j)=>{ if(j !== i) c.classList.add('dim'); });
    setTimeout(()=>{ if(state.solved && mode === 'game') goNext(); }, 1500);
  } else {
    btn.classList.add('no');
    sfxWrong();
    setTimeout(()=> btn.classList.remove('no'), 620);
  }
}

function sparkBurst(el){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const colors = ['#7DFFB8','#FFE066','#7FD4FF','#FF9EC7','#FFFFFF'];
  for(let i = 0; i < 22; i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const a = Math.random() * Math.PI * 2;
    const d = 60 + Math.random() * 120;
    s.style.left = cx + 'px';
    s.style.top  = cy + 'px';
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.boxShadow = '0 0 12px ' + s.style.background;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.width = s.style.height = (5 + Math.random() * 8) + 'px';
    document.body.appendChild(s);
    setTimeout(()=> s.remove(), 800);
  }
}

/* ============================================================
   НАВІГАЦІЯ
   ============================================================ */
let locked = false;
function goNext(){
  if(locked) return;
  locked = true;
  setTimeout(()=> locked = false, 280);

  if(state.task >= TASKS.length - 1){
    startEnd();
  } else {
    state.task++;
    sfxNext();
    renderTask();
  }
}

nextBtn.addEventListener('click', ()=>{ sfxClick(); goNext(); });

langBtn.addEventListener('click', ()=>{
  sfxClick();
  state.lang = state.lang === 'uk' ? 'ru' : 'uk';
  langBtn.textContent = state.lang === 'uk' ? 'УК' : 'РУ';
  if(mode === 'game') renderTask();
});

/* ============================================================
   CANVAS
   ============================================================ */
const cvs = document.getElementById('bg');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initCars();
}
window.addEventListener('resize', resize);

/* ---------- helpers ---------- */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- traffic cars ---------- */
const CAR_COLORS = ['#E53935','#43A047','#FB8C00','#1E88E5','#8E24AA','#00ACC1','#F4511E','#D81B60','#FDD835','#5E35B1'];
let traffic = [];

function initCars(){
  traffic = [];
  const n = Math.max(5, Math.round(W / 260));
  for(let i = 0; i < n; i++){
    const dir = i % 2 === 0 ? 1 : -1;
    traffic.push({
      x: Math.random() * (W + 400) - 200,
      lane: Math.floor(Math.random() * 2),
      sp: (80 + Math.random() * 160) * dir,
      col: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
      sc: 0.65 + Math.random() * 0.55,
      dir
    });
  }
}

function drawCarShape(x, y, s, col, flip){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -s : s, s);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath();
  ctx.ellipse(0, 20, 46, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // body
  ctx.fillStyle = col;
  rr(-42, -8, 84, 24, 9);
  ctx.fill();

  // roof
  ctx.beginPath();
  ctx.moveTo(-19, -8);
  ctx.lineTo(-9, -28);
  ctx.lineTo(15, -28);
  ctx.lineTo(27, -8);
  ctx.closePath();
  ctx.fill();

  // windows
  ctx.fillStyle = '#CFEAFF';
  ctx.fillRect(-6, -25, 10, 14);
  ctx.fillRect(7, -25, 10, 14);

  // highlight
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  rr(-42, -8, 84, 7, 4);
  ctx.fill();

  // wheels
  ctx.fillStyle = '#151515';
  ctx.beginPath(); ctx.arc(-23, 16, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(23, 16, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#a8a8a8';
  ctx.beginPath(); ctx.arc(-23, 16, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(23, 16, 4, 0, Math.PI * 2); ctx.fill();

  // headlight
  ctx.fillStyle = 'rgba(255,245,180,.9)';
  ctx.beginPath(); ctx.arc(40, -2, 4, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

/* ============================================================
   ФОН ГРИ
   ============================================================ */
let cloudOffset = 0;

function drawCloud(x, y, s, a){
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, 26 * s, 0, Math.PI * 2);
  ctx.arc(x + 32 * s, y - 13 * s, 33 * s, 0, Math.PI * 2);
  ctx.arc(x + 70 * s, y, 24 * s, 0, Math.PI * 2);
  ctx.arc(x + 34 * s, y + 11 * s, 27 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawGame(t){
  const horizon = H * 0.66;

  /* SKY */
  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0,   '#1E7FD4');
  sky.addColorStop(0.42,'#57B4EE');
  sky.addColorStop(0.78,'#9FDCFF');
  sky.addColorStop(1,   '#D9F2FF');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizon + 2);

  /* SUN */
  const sunX = W * 0.80, sunY = horizon * 0.26, sunR = Math.min(W, H) * 0.055;
  const gl = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 5);
  gl.addColorStop(0, 'rgba(255,245,190,.85)');
  gl.addColorStop(0.35,'rgba(255,225,130,.30)');
  gl.addColorStop(1, 'rgba(255,210,120,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#FFF4C2';
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.fill();

  /* CLOUDS */
  cloudOffset = t * 9;
  for(let i = 0; i < 7; i++){
    const baseX = (i * 337 + cloudOffset * (0.35 + i * 0.08)) % (W + 400) - 200;
    const baseY = horizon * (0.14 + (i % 4) * 0.13);
    drawCloud(baseX, baseY, 0.75 + (i % 3) * 0.32, 0.72 - (i % 3) * 0.12);
  }

  /* DISTANT HILLS */
  ctx.fillStyle = '#6FB8D8';
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  for(let x = 0; x <= W; x += 24){
    const y = horizon - 26 - Math.sin(x * 0.0038 + 1.2) * 34 - Math.cos(x * 0.0017) * 22;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#5BAE76';
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  for(let x = 0; x <= W; x += 20){
    const y = horizon - 10 - Math.sin(x * 0.0052 + 3.4) * 26 - Math.cos(x * 0.0023) * 14;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();

  /* GRASS BAND */
  const grass = ctx.createLinearGradient(0, horizon, 0, H);
  grass.addColorStop(0, '#7BCB63');
  grass.addColorStop(0.45, '#57A94A');
  grass.addColorStop(1, '#3B8036');
  ctx.fillStyle = grass;
  ctx.fillRect(0, horizon, W, H - horizon);

  /* ROAD */
  const roadTop = H * 0.76;
  const roadH = H - roadTop;

  // curb
  ctx.fillStyle = '#C9CFD6';
  ctx.fillRect(0, roadTop - 12, W, 12);
  ctx.fillStyle = '#AEB6BE';
  for(let x = 0; x < W; x += 56){
    ctx.fillStyle = (Math.floor(x / 56) % 2 === 0) ? '#D84343' : '#F2F2F2';
    ctx.fillRect(x, roadTop - 12, 28, 6);
  }

  // asphalt
  const asp = ctx.createLinearGradient(0, roadTop, 0, H);
  asp.addColorStop(0, '#4A4F57');
  asp.addColorStop(0.5, '#3A3F46');
  asp.addColorStop(1, '#2B2F35');
  ctx.fillStyle = asp;
  ctx.fillRect(0, roadTop, W, roadH);

  // asphalt texture
  ctx.save();
  ctx.globalAlpha = 0.10;
  for(let i = 0; i < 140; i++){
    const px = (i * 137.5) % W;
    const py = roadTop + ((i * 89.3) % roadH);
    ctx.fillStyle = i % 3 === 0 ? '#ffffff' : '#000000';
    ctx.fillRect(px, py, 3, 2);
  }
  ctx.restore();

  // center dashes — STATIC (не рухаються)
  ctx.save();
  const dashY = roadTop + roadH * 0.50;
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for(let x = 0; x < W + 120; x += 120){
    ctx.fillRect(x, dashY - 4, 68, 9);
  }
  ctx.restore();

  // edge lines
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillRect(0, roadTop + 8, W, 4);
  ctx.fillRect(0, H - 14, W, 4);

  /* TRAFFIC */
  for(const c of traffic){
    const laneY = roadTop + roadH * (c.lane === 0 ? 0.24 : 0.80);
    drawCarShape(c.x, laneY, c.sc, c.col, c.dir < 0);
  }
}

function updateTraffic(dt){
  for(const c of traffic){
    c.x += c.sp * dt;
    if(c.sp > 0 && c.x > W + 220) c.x = -220;
    if(c.sp < 0 && c.x < -220) c.x = W + 220;
  }
}

/* ============================================================
   ФІНАЛ
   ============================================================ */
let endStart = 0;
let particles = [];
let confetti = [];
let lastFw = -10;
let endInit = false;

function startEnd(){
  mode = 'end';
  endStart = performance.now();
  endInit = false;
  particles = [];
  confetti = [];
  lastFw = -10;

  cardEl.style.opacity = '0';
  cardEl.style.transform = 'translate(-50%,-50%) scale(.9)';
  setTimeout(()=> cardEl.style.display = 'none', 750);

  sfxFinal();
}

function initEndStuff(){
  confetti = [];
  for(let i = 0; i < 90; i++){
    confetti.push({
      x: Math.random() * W,
      y: -Math.random() * H,
      w: 6 + Math.random() * 10,
      h: 9 + Math.random() * 14,
      vy: 45 + Math.random() * 90,
      vx: (Math.random() - 0.5) * 45,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 5,
      col: `hsl(${Math.random() * 360},85%,62%)`
    });
  }
}

function spawnFirework(){
  const x = W * (0.12 + Math.random() * 0.76);
  const y = H * (0.08 + Math.random() * 0.38);
  const hue = Math.random() * 360;
  const n = 46 + Math.floor(Math.random() * 34);
  for(let i = 0; i < n; i++){
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.12;
    const sp = 90 + Math.random() * 190;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 1,
      hue: hue + (Math.random() - 0.5) * 50,
      size: 2 + Math.random() * 3
    });
  }
}

function drawEnd(now){
  const t = (now - endStart) / 1000;
  if(!endInit){ initEndStuff(); endInit = true; }
  const dt = 1 / 60;

  /* SKY */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    '#140F33');
  g.addColorStop(0.28, '#3B1E63');
  g.addColorStop(0.50, '#8A2F6C');
  g.addColorStop(0.68, '#D9556A');
  g.addColorStop(0.82, '#FF9048');
  g.addColorStop(1,    '#FFCF7A');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* STARS */
  for(let i = 0; i < 70; i++){
    const sx = (i * 173.7) % W;
    const sy = (i * 97.3) % (H * 0.45);
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.6 + i));
    ctx.globalAlpha = tw * 0.75;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  /* SUN */
  const sunY = H * 0.70;
  const sunR = Math.min(W, H) * 0.14;
  const glow = ctx.createRadialGradient(W / 2, sunY, 0, W / 2, sunY, sunR * 3.4);
  glow.addColorStop(0,   'rgba(255,235,160,.85)');
  glow.addColorStop(0.30,'rgba(255,180,90,.35)');
  glow.addColorStop(1,   'rgba(255,140,60,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(W / 2, sunY, sunR * 3.4, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#FFE39A';
  ctx.beginPath(); ctx.arc(W / 2, sunY, sunR, 0, Math.PI * 2); ctx.fill();

  /* GROUND */
  const groundY = H * 0.80;
  const gg = ctx.createLinearGradient(0, groundY, 0, H);
  gg.addColorStop(0, '#2A1740');
  gg.addColorStop(1, '#120A24');
  ctx.fillStyle = gg;
  ctx.fillRect(0, groundY, W, H - groundY);

  /* ROAD */
  const roadTop = H * 0.85;
  ctx.fillStyle = '#1A1230';
  ctx.fillRect(0, roadTop, W, H - roadTop);
  ctx.fillStyle = 'rgba(255,220,150,.55)';
  // STATIC dashes
  for(let x = 0; x < W + 150; x += 150){
    ctx.fillRect(x, roadTop + (H - roadTop) * 0.52, 78, 6);
  }

  /* CAR */
  const carX = (W * 0.5) + Math.sin(t * 0.55) * (W * 0.24);
  const carY = roadTop + (H - roadTop) * 0.30;
  const bob = Math.sin(t * 9) * 2.4;
  const cs = Math.min(W, H) / 620;
  drawCarShape(carX, carY + bob, cs * 1.05, '#FFD34D', false);

  // headlight beam
  ctx.save();
  ctx.globalAlpha = 0.28;
  const beam = ctx.createLinearGradient(carX + 40, carY, carX + 330, carY);
  beam.addColorStop(0, 'rgba(255,245,180,.95)');
  beam.addColorStop(1, 'rgba(255,245,180,0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(carX + 40, carY - 8);
  ctx.lineTo(carX + 340, carY - 66);
  ctx.lineTo(carX + 340, carY + 58);
  ctx.lineTo(carX + 40, carY + 10);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* FIREWORKS */
  if(t - lastFw > 0.55){
    lastFw = t;
    spawnFirework();
    tone(520 + Math.random() * 700, 0, 0.35, 'sine', 0.05);
  }

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 130 * dt;
    p.vx *= 0.985;
    p.vy *= 0.985;
    p.life -= dt * 0.62;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${p.hue},95%,68%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life + 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  /* CONFETTI */
  for(const c of confetti){
    c.y += c.vy * dt;
    c.x += c.vx * dt + Math.sin(t * 2 + c.rot) * 0.7;
    c.rot += c.vr * dt;
    if(c.y > H + 30){
      c.y = -30;
      c.x = Math.random() * W;
    }
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.col;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }

  /* VIGNETTE */
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.30, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

/* ============================================================
   ЦИКЛ
   ============================================================ */
let lastT = 0;
function loop(now){
  requestAnimationFrame(loop);
  const t = now / 1000;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;

  if(mode === 'game'){
    updateTraffic(dt);
    drawGame(t);
  } else {
    drawEnd(now);
  }
}

/* ============================================================
   СТАРТ
   ============================================================ */
resize();
renderTask();
requestAnimationFrame(loop);

// розблокування звуку при першій взаємодії
['pointerdown','keydown'].forEach(ev =>
  window.addEventListener(ev, ()=> A(), { once:true })
);
</script>
