<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pond Habitat Board Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #06231d;
      font-family: 'Nunito', 'Comfortaa', sans-serif;
    }

    /* Main stage wrapper */
    #app-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    /* Fullscreen living water canvas */
    #pond-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* SVG Board Layer */
    #board-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Celebration FX Canvas on top */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 35;
      pointer-events: none;
    }

    /* Organic HUD Controls - NO WHITE RECTANGLES */
    .organic-stone-dock {
      background: radial-gradient(circle at 35% 28%, #3c5a45 0%, #243b2c 55%, #14241a 100%);
      border: 3px solid #597e5c;
      box-shadow:
        0 10px 25px rgba(0, 12, 8, 0.75),
        inset 0 3px 8px rgba(169, 224, 158, 0.35),
        inset 0 -6px 12px rgba(7, 18, 12, 0.85);
      border-radius: 42% 58% 47% 53% / 54% 45% 55% 46%;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
    }

    .organic-leaf-btn {
      background: radial-gradient(circle at 30% 30%, #4ca64c 0%, #267333 65%, #144920 100%);
      border: 3px solid #86d96a;
      box-shadow:
        0 8px 20px rgba(0, 15, 9, 0.7),
        inset 0 3px 10px rgba(210, 255, 170, 0.45),
        inset 0 -5px 10px rgba(8, 38, 15, 0.8);
      border-radius: 62% 38% 55% 45% / 48% 60% 40% 52%;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .organic-leaf-btn:hover {
      transform: scale(1.08) rotate(-2deg);
      filter: brightness(1.12);
      box-shadow:
        0 12px 26px rgba(0, 15, 9, 0.85),
        0 0 18px rgba(134, 217, 106, 0.55),
        inset 0 3px 10px rgba(210, 255, 170, 0.6);
    }

    .organic-leaf-btn:active {
      transform: scale(0.94);
    }

    .organic-amber-btn {
      background: radial-gradient(circle at 32% 28%, #f59e0b 0%, #b45309 68%, #78350f 100%);
      border: 3px solid #fcd34d;
      box-shadow:
        0 8px 20px rgba(0, 15, 9, 0.7),
        inset 0 3px 8px rgba(254, 243, 199, 0.6),
        inset 0 -5px 10px rgba(69, 26, 3, 0.85);
      border-radius: 53% 47% 42% 58% / 57% 44% 56% 43%;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      cursor: pointer;
    }

    .organic-amber-btn:hover {
      transform: scale(1.08) rotate(3deg);
      filter: brightness(1.12);
    }

    .organic-amber-btn:active {
      transform: scale(0.94);
    }

    /* Player count selector pebbles */
    .player-pebble {
      position: relative;
      width: clamp(44px, 4.4vw, 64px);
      height: clamp(44px, 4.4vw, 64px);
      border-radius: 54% 46% 49% 51% / 47% 55% 45% 53%;
      background: radial-gradient(circle at 35% 30%, #2a4736 0%, #16291e 75%, #0c1811 100%);
      border: 2.5px solid #476b53;
      box-shadow: 0 5px 12px rgba(0,0,0,0.6), inset 0 2px 5px rgba(160, 220, 175, 0.25);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .player-pebble.active-slot {
      background: radial-gradient(circle at 35% 30%, #3d7a4e 0%, #1f4d2e 70%, #102b19 100%);
      border-color: #9ae66e;
      box-shadow:
        0 6px 14px rgba(0,0,0,0.65),
        0 0 14px rgba(154, 230, 110, 0.45),
        inset 0 2px 8px rgba(210, 255, 180, 0.4);
      transform: translateY(-2px) scale(1.04);
    }

    .player-pebble.current-turn-slot {
      border-color: #fde047;
      box-shadow:
        0 0 0 3px rgba(253, 224, 71, 0.45),
        0 0 22px rgba(250, 204, 21, 0.85),
        inset 0 2px 10px rgba(254, 240, 138, 0.65);
      animation: pulseTurnPebble 1.8s infinite ease-in-out;
    }

    .player-pebble.inactive-slot {
      opacity: 0.38;
      filter: saturate(0.25) brightness(0.75);
      transform: scale(0.9);
    }

    .player-pebble:hover {
      transform: scale(1.12);
    }

    @keyframes pulseTurnPebble {
      0%, 100% { transform: translateY(-2px) scale(1.06); }
      50% { transform: translateY(-6px) scale(1.13); }
    }

    /* Dice Roll Dock */
    #dice-dock {
      position: fixed;
      bottom: 2.2vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: clamp(12px, 1.8vw, 26px);
      padding: clamp(10px, 1.3vw, 18px) clamp(20px, 2.5vw, 34px);
    }

    #dice-btn {
      width: clamp(78px, 7.6vw, 112px);
      height: clamp(78px, 7.6vw, 112px);
      cursor: pointer;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
      filter: drop-shadow(0 10px 18px rgba(0, 10, 6, 0.78));
    }

    #dice-btn:hover {
      transform: scale(1.1) rotate(-5deg);
      filter: drop-shadow(0 14px 22px rgba(0, 10, 6, 0.9)) drop-shadow(0 0 18px rgba(251, 191, 36, 0.6));
    }

    #dice-btn:active {
      transform: scale(0.92);
    }

    .dice-rolling {
      animation: tumbleStoneDice 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes tumbleStoneDice {
      0%   { transform: scale(1) rotate(0deg) translateY(0); }
      20%  { transform: scale(1.25) rotate(110deg) translateY(-28px); }
      45%  { transform: scale(1.18) rotate(240deg) translateY(-12px) translateX(10px); }
      70%  { transform: scale(1.22) rotate(330deg) translateY(-20px) translateX(-10px); }
      100% { transform: scale(1) rotate(360deg) translateY(0); }
    }

    /* Question Leaf Overlay Modal */
    #question-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(4, 28, 21, 0.55) 0%, rgba(2, 16, 12, 0.82) 100%);
      backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 2vw;
    }

    #question-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    #question-leaf-card {
      position: relative;
      width: min(92vw, 940px);
      min-height: min(62vh, 490px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(28px, 4.5vw, 60px) clamp(32px, 6vw, 84px);
      transform: scale(0.75) rotate(-4deg);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #question-overlay.open #question-leaf-card {
      transform: scale(1) rotate(0deg);
    }

    #question-text {
      position: relative;
      z-index: 5;
      color: #fefce8;
      text-shadow: 0 3px 10px rgba(4, 24, 12, 0.95), 0 1px 3px rgba(0, 0, 0, 0.9);
      font-size: clamp(1.35rem, 2.55vw, 2.35rem);
      font-weight: 800;
      line-height: 1.42;
      text-align: center;
      max-width: 90%;
      margin: auto 0;
      letter-spacing: 0.01em;
    }

    /* Board stepping pads hover & pulse */
    .board-pad-group {
      cursor: pointer;
      transition: filter 0.25s ease;
    }

    .board-pad-group:hover {
      filter: brightness(1.15) drop-shadow(0 0 10px rgba(163, 230, 53, 0.45));
    }

    /* CRITICAL FIX: Never apply CSS transform or transform-origin to SVG player tokens,
       so SVG translate(x,y) coordinates stay 100% locked to exact board cell coordinates */
    .amphibian-token {
      filter: drop-shadow(0 6px 8px rgba(0, 12, 6, 0.8));
      cursor: pointer;
    }

    /* Answer reveal leaf pill inside the question modal */
    .answer-leaf-pill {
      background: radial-gradient(circle at 30% 30%, #366938 0%, #1c4322 70%, #0f2914 100%);
      border: 2.5px solid #a3e635;
      box-shadow: 0 6px 16px rgba(0, 14, 7, 0.7), inset 0 2px 6px rgba(217, 249, 157, 0.35);
      border-radius: 45% 55% 48% 52% / 52% 46% 54% 48%;
      color: #ecfccb;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      cursor: pointer;
    }

    .answer-leaf-pill:hover {
      transform: scale(1.04);
      filter: brightness(1.12);
    }
  </style>
</head>
<body>

<div id="app-stage">
  <!-- Layer 1: Living Animated Wetland Canvas (Caustics, Tadpoles, Water Striders, Ripples, Fireflies) -->
  <canvas id="pond-canvas"></canvas>

  <!-- Layer 2: Interactive Vector Board (25 Organic Pads, Cattails, Driftwood, 6 Realistic Amphibian Tokens) -->
  <svg id="board-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Water Lily Pad Gradients -->
      <radialGradient id="lilyGrad1" cx="42%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#65b847" />
        <stop offset="55%" stop-color="#337a2c" />
        <stop offset="88%" stop-color="#1c4f1d" />
        <stop offset="100%" stop-color="#4d8c36" />
      </radialGradient>

      <radialGradient id="lilyGrad2" cx="38%" cy="35%" r="62%">
        <stop offset="0%" stop-color="#76c442" />
        <stop offset="50%" stop-color="#3c892e" />
        <stop offset="85%" stop-color="#20571e" />
        <stop offset="100%" stop-color="#5da13a" />
      </radialGradient>

      <radialGradient id="lilyGradRoyal" cx="45%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#52a849" />
        <stop offset="62%" stop-color="#256328" />
        <stop offset="85%" stop-color="#153d1a" />
        <stop offset="94%" stop-color="#7c3f2c" />
        <stop offset="100%" stop-color="#9e523b" />
      </radialGradient>

      <!-- Mossy Stone Gradient -->
      <radialGradient id="stoneGrad" cx="35%" cy="30%" r="68%">
        <stop offset="0%" stop-color="#6e8574" />
        <stop offset="55%" stop-color="#44574a" />
        <stop offset="100%" stop-color="#253329" />
      </radialGradient>

      <!-- Submerged Bark Log Gradient -->
      <linearGradient id="barkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#6e4b32" />
        <stop offset="50%" stop-color="#4d3220" />
        <stop offset="100%" stop-color="#2e1c11" />
      </linearGradient>

      <!-- Lotus Petal Gradient -->
      <radialGradient id="lotusPetal" cx="50%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fff1f2" />
        <stop offset="55%" stop-color="#fda4af" />
        <stop offset="100%" stop-color="#e11d48" />
      </radialGradient>

      <radialGradient id="goldLotusPetal" cx="50%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fef9c3" />
        <stop offset="55%" stop-color="#facc15" />
        <stop offset="100%" stop-color="#ca8a04" />
      </radialGradient>

      <!-- Dewdrop Gradient -->
      <radialGradient id="dewGrad" cx="30%" cy="25%" r="70%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
        <stop offset="35%" stop-color="#bae6fd" stop-opacity="0.65" />
        <stop offset="80%" stop-color="#0284c7" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6" />
      </radialGradient>

      <!-- Soft Shadow Filter -->
      <filter id="padShadow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#02130e" flood-opacity="0.72" />
      </filter>

      <filter id="glowAura" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- =========================================================
           6 REALISTIC AMPHIBIAN SVG DEFINITIONS (REUSABLE)
           ========================================================= -->

      <!-- 1. European Tree Frog (Hyla arborea) - Bright Leaf Green -->
      <g id="amphibian-1">
        <!-- Shadow -->
        <ellipse cx="0" cy="4" rx="22" ry="26" fill="rgba(0,12,6,0.45)" />
        <!-- Hind Legs -->
        <path d="M-12,10 C-28,14 -30,28 -18,32 C-12,34 -8,26 -14,22" fill="#46a832" stroke="#1e5414" stroke-width="1.5"/>
        <path d="M12,10 C28,14 30,28 18,32 C12,34 8,26 14,22" fill="#46a832" stroke="#1e5414" stroke-width="1.5"/>
        <!-- Hind Toe Pads -->
        <circle cx="-23" cy="31" r="2.6" fill="#7ce854" />
        <circle cx="-18" cy="34" r="2.6" fill="#7ce854" />
        <circle cx="-13" cy="33" r="2.4" fill="#7ce854" />
        <circle cx="23" cy="31" r="2.6" fill="#7ce854" />
        <circle cx="18" cy="34" r="2.6" fill="#7ce854" />
        <circle cx="13" cy="33" r="2.4" fill="#7ce854" />
        <!-- Front Legs -->
        <path d="M-14,-8 C-26,-12 -28,-22 -19,-25" fill="none" stroke="#46a832" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M14,-8 C26,-12 28,-22 19,-25" fill="none" stroke="#46a832" stroke-width="5.5" stroke-linecap="round"/>
        <circle cx="-22" cy="-26" r="2.5" fill="#7ce854" />
        <circle cx="-17" cy="-28" r="2.5" fill="#7ce854" />
        <circle cx="22" cy="-26" r="2.5" fill="#7ce854" />
        <circle cx="17" cy="-28" r="2.5" fill="#7ce854" />
        <!-- Torso -->
        <path d="M0,-28 C16,-26 21,-6 17,16 C14,27 6,31 0,31 C-6,31 -14,27 -17,16 C-21,-6 -16,-26 0,-28 Z" fill="#5cd63a" stroke="#1f5e12" stroke-width="1.6"/>
        <!-- Characteristic Dark Lateral Stripe with Cream Edge -->
        <path d="M-14,-14 C-18,-2 -17,12 -12,24" fill="none" stroke="#2c1d11" stroke-width="3" stroke-linecap="round"/>
        <path d="M-13,-14 C-16,-2 -15,12 -11,23" fill="none" stroke="#fef08a" stroke-width="1.1" stroke-linecap="round"/>
        <path d="M14,-14 C18,-2 17,12 12,24" fill="none" stroke="#2c1d11" stroke-width="3" stroke-linecap="round"/>
        <path d="M13,-14 C16,-2 15,12 11,23" fill="none" stroke="#fef08a" stroke-width="1.1" stroke-linecap="round"/>
        <!-- Glossy Dorsal Highlight -->
        <ellipse cx="-3" cy="-4" rx="7" ry="15" fill="rgba(217, 255, 176, 0.35)" />
        <!-- Golden Eyes -->
        <circle cx="-11" cy="-19" r="5.5" fill="#f59e0b" stroke="#1e3a12" stroke-width="1.3"/>
        <circle cx="11" cy="-19" r="5.5" fill="#f59e0b" stroke="#1e3a12" stroke-width="1.3"/>
        <ellipse cx="-11" cy="-20" rx="2" ry="4" fill="#111827" />
        <ellipse cx="11" cy="-20" rx="2" ry="4" fill="#111827" />
        <circle cx="-12.5" cy="-21.5" r="1.4" fill="#ffffff" />
        <circle cx="9.5" cy="-21.5" r="1.4" fill="#ffffff" />
      </g>

      <!-- 2. Fire Salamander (Salamandra salamandra) - Glossy Black & Bright Yellow-Orange -->
      <g id="amphibian-2">
        <ellipse cx="0" cy="5" rx="20" ry="32" fill="rgba(0,12,6,0.45)" />
        <!-- Legs -->
        <path d="M-10,-12 L-24,-18 L-27,-13" fill="none" stroke="#18181b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10,-12 L24,-18 L27,-13" fill="none" stroke="#18181b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-10,12 L-24,18 L-26,24" fill="none" stroke="#18181b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10,12 L24,18 L26,24" fill="none" stroke="#18181b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Yellow Leg Spots -->
        <circle cx="-19" cy="-15" r="2.8" fill="#facc15" />
        <circle cx="19" cy="-15" r="2.8" fill="#facc15" />
        <circle cx="-19" cy="15" r="2.8" fill="#facc15" />
        <circle cx="19" cy="15" r="2.8" fill="#facc15" />
        <!-- Body & Undulating Tail -->
        <path d="M0,-33 C11,-32 14,-20 12,-5 C11,8 12,16 6,25 C2,32 -6,38 3,45 C-8,40 -10,31 -6,23 C-12,15 -11,8 -12,-5 C-14,-20 -11,-32 0,-33 Z" fill="#111827" stroke="#000000" stroke-width="1.5"/>
        <!-- Vivid Yellow-Orange Fire Markings -->
        <path d="M-7,-24 C-9,-18 -6,-12 -4,-15 C-2,-19 -4,-25 -7,-24 Z" fill="#facc15" />
        <path d="M7,-24 C9,-18 6,-12 4,-15 C2,-19 4,-25 7,-24 Z" fill="#facc15" />
        <ellipse cx="-4" cy="-5" rx="3.5" ry="6" transform="rotate(-12 -4 -5)" fill="#fbbf24" />
        <ellipse cx="5" cy="2" rx="3.5" ry="6.5" transform="rotate(14 5 2)" fill="#fbbf24" />
        <ellipse cx="-4" cy="12" rx="3.2" ry="5.5" transform="rotate(10 -4 12)" fill="#f59e0b" />
        <ellipse cx="2" cy="23" rx="2.5" ry="5" transform="rotate(-18 2 23)" fill="#facc15" />
        <circle cx="-1" cy="33" r="2.4" fill="#facc15" />
        <!-- Glossy Wet Skin Specular Highlight -->
        <path d="M-2,-28 C-1,-12 -1,5 -3,18" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2.2" stroke-linecap="round"/>
        <!-- Prominent Dark Glossy Eyes -->
        <circle cx="-9" cy="-25" r="4.5" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
        <circle cx="9" cy="-25" r="4.5" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
        <circle cx="-10" cy="-26.5" r="1.5" fill="#ffffff" />
        <circle cx="8" cy="-26.5" r="1.5" fill="#ffffff" />
      </g>

      <!-- 3. Red-Eyed Tree Frog (Agalychnis callidryas) - Lime Green, Blue Flanks, Orange Feet, Crimson Eyes -->
      <g id="amphibian-3">
        <ellipse cx="0" cy="4" rx="22" ry="26" fill="rgba(0,12,6,0.45)" />
        <!-- Blue & Yellow Striped Hind Legs -->
        <path d="M-12,8 C-28,12 -31,26 -19,31" fill="none" stroke="#1d4ed8" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M12,8 C28,12 31,26 19,31" fill="none" stroke="#1d4ed8" stroke-width="6.5" stroke-linecap="round"/>
        <!-- Bright Orange Webbed Feet -->
        <circle cx="-24" cy="30" r="3" fill="#f97316" />
        <circle cx="-18" cy="33" r="3" fill="#f97316" />
        <circle cx="-13" cy="31" r="2.8" fill="#f97316" />
        <circle cx="24" cy="30" r="3" fill="#f97316" />
        <circle cx="18" cy="33" r="3" fill="#f97316" />
        <circle cx="13" cy="31" r="2.8" fill="#f97316" />
        <!-- Front Legs -->
        <path d="M-13,-9 C-25,-13 -27,-21 -19,-25" fill="none" stroke="#65a30d" stroke-width="5" stroke-linecap="round"/>
        <path d="M13,-9 C25,-13 27,-21 19,-25" fill="none" stroke="#65a30d" stroke-width="5" stroke-linecap="round"/>
        <circle cx="-22" cy="-26" r="2.8" fill="#f97316" />
        <circle cx="-16" cy="-28" r="2.8" fill="#f97316" />
        <circle cx="22" cy="-26" r="2.8" fill="#f97316" />
        <circle cx="16" cy="-28" r="2.8" fill="#f97316" />
        <!-- Neon Lime Body -->
        <path d="M0,-29 C14,-27 19,-7 15,16 C12,26 6,30 0,30 C-6,30 -12,26 -15,16 C-19,-7 -14,-27 0,-29 Z" fill="#84cc16" stroke="#365314" stroke-width="1.5"/>
        <!-- Cobalt Blue & Cream Flank Bars -->
        <path d="M-15,-8 C-18,2 -17,12 -13,20" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
        <path d="M15,-8 C18,2 17,12 13,20" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
        <line x1="-17" y1="-2" x2="-12" y2="-1" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
        <line x1="-17" y1="6" x2="-12" y2="7" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
        <line x1="17" y1="-2" x2="12" y2="-1" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
        <line x1="17" y1="6" x2="12" y2="7" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
        <!-- Bulging Crimson Eyes with Vertical Slit Pupils -->

  /* ============================================================================
     2. PROCEDURAL WEB AUDIO SYNTHESIZER (NO EXTERNAL AUDIO FILES, NO WORDS)
     ============================================================================ */
  class WetlandAudioEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Water drop / splash plop sound
    playWaterDrop(pitch = 420) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(pitch * 2.4, now + 0.11);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    // Realistic Frog Croak / Ribbit
    playFrogCroak(baseFreq = 165, duration = 0.22) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const mod = this.ctx.createOscillator();
      const modGain = this.ctx.createGain();
      const mainGain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.linearRampToValueAtTime(baseFreq * 1.45, now + duration * 0.7);
      osc.frequency.linearRampToValueAtTime(baseFreq * 0.9, now + duration);

      // Throat rattle modulation
      mod.type = 'sine';
      mod.frequency.setValueAtTime(38, now);
      modGain.gain.setValueAtTime(60, now);

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(baseFreq * 3.2, now);
      filter.Q.setValueAtTime(4.5, now);

      mainGain.gain.setValueAtTime(0.01, now);
      mainGain.gain.linearRampToValueAtTime(0.26, now + 0.03);
      mainGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      mod.connect(modGain);
      modGain.connect(osc.frequency);
      osc.connect(filter);
      filter.connect(mainGain);
      mainGain.connect(this.ctx.destination);

      osc.start(now);
      mod.start(now);
      osc.stop(now + duration + 0.02);
      mod.stop(now + duration + 0.02);
    }

    // River stone dice rattle
    playDiceRoll() {
      this.init();
      if (!this.ctx) return;
      const hits = [0, 0.09, 0.19, 0.31, 0.44, 0.56];
      hits.forEach((delay, idx) => {
        setTimeout(() => {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          const f = 280 + idx * 55 + Math.random() * 60;
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.exponentialRampToValueAtTime(f * 0.5, now + 0.06);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }, delay * 1000);
      });
    }

    // Pad hop sound (boing + splash)
    playHopStep(stepIndex = 0) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const base = 260 + (stepIndex % 6) * 45;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(base, now);
      osc.frequency.exponentialRampToValueAtTime(base * 1.85, now + 0.14);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.19);

      setTimeout(() => this.playWaterDrop(520 + stepIndex * 40), 90);
    }

    // Varied Non-Verbal Celebration Fanfare (Kalimba / Marimba + Frog Chorus + Bubbles)
    playCelebrationSound(variant = 0) {
      this.init();
      if (!this.ctx) return;
      const scales = [
        [523.25, 659.25, 783.99, 1046.50, 1318.51], // C pentatonic bright
        [440, 554.37, 659.25, 880, 1108.73],        // A major warm
        [392, 493.88, 587.33, 783.99, 987.77],      // G nature
        [587.33, 739.99, 880, 1174.66, 1479.98],    // D brightpond
        [493.88, 622.25, 739.99, 987.77, 1244.51]   // B magical
      ];
      const notes = scales[variant % scales.length];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = i % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        }, i * 75);
      });

      // Add lively amphibian ribbits and water splashes
      setTimeout(() => this.playFrogCroak(155, 0.2), 120);
      setTimeout(() => this.playFrogCroak(210, 0.18), 320);
      setTimeout(() => this.playWaterDrop(640), 220);
    }
  }

  function getNextQuestion() {
    if (state.questionDeck.length === 0) {
      state.questionDeck = [...QUESTIONS_BANK];
      for (let i = state.questionDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

  function createNotchedLilyPath(r) {
    // Realistic notched circular leaf path with organic wavy margin
    return `
      M 0,0
      L ${r * 0.96},${-r * 0.16}
      C ${r * 1.02},${r * 0.35} ${r * 0.68},${r * 0.92} ${r * 0.12},${r * 0.99}
      C ${-r * 0.45},${r * 1.04} ${-r * 0.96},${r * 0.62} ${-r * 1.0},${r * 0.04}
      C ${-r * 1.02},${-r * 0.55} ${-r * 0.54},${-r * 1.02} ${r * 0.08},${-r * 0.98}
      C ${r * 0.55},${-r * 0.95} ${r * 0.88},${-r * 0.58} ${r * 0.96},${-r * 0.24}
      Z
    `;
  }

      const curr = BOARD_CELLS[i];

  /* ============================================================================
     6. RENDER & ANIMATE THE 6 REALISTIC AMPHIBIAN PLAYER TOKENS
     Fixed so tokens sit strictly inside each cell's coordinates without SVG transform drift.
     ============================================================================ */
  function computeTokenTargetPos(playerIndex, cellIndex) {
    const cell = BOARD_CELLS[cellIndex];
    // Gather all active players on this same cell so they arrange neatly on the pad
    const occupants = [];
    for (let i = 0; i < state.numPlayers; i++) {
      if (state.players[i].cell === cellIndex) {
        occupants.push(i);
      }
    }
    const slotIdx = occupants.indexOf(playerIndex);
    const total = occupants.length;

    if (total <= 1) {
      return { x: cell.x, y: cell.y };
    }
    const radius = total === 2 ? 16 : (total <= 4 ? 21 : 25);
    const angle = (slotIdx / total) * Math.PI * 2 - Math.PI / 2;
    return {
      x: cell.x + Math.cos(angle) * radius,
      y: cell.y + Math.sin(angle) * radius
    };
  }

  function computeFacingAngle(cellIndex) {
    const nextIdx = (cellIndex + 1) % BOARD_CELLS.length;
    const curr = BOARD_CELLS[cellIndex];
    const next = BOARD_CELLS[nextIdx];
    const rad = Math.atan2(next.y - curr.y, next.x - curr.x);
    return (rad * 180) / Math.PI + 90;
  }

  function initPlayersPositions() {
    for (let i = 0; i < 6; i++) {
      const pos = computeTokenTargetPos(i, state.players[i].cell);
      state.players[i].x = pos.x;
      state.players[i].y = pos.y;
      state.players[i].angle = computeFacingAngle(state.players[i].cell);
      state.players[i].jumpY = 0;
      state.players[i].scaleX = 1;
      state.players[i].scaleY = 1;
    }
    renderPlayerTokensSVG();
  }

  function renderPlayerTokensSVG() {
    const layer = document.getElementById('players-layer');
    const haloLayer = document.getElementById('active-board-halo');
    layer.innerHTML = '';

    // Active player's water aura on the board
    const activeP = state.players[state.currentTurn];
    if (activeP) {
      const ay = activeP.y - (activeP.jumpY || 0);
      haloLayer.innerHTML = `
        <g transform="translate(${activeP.x.toFixed(1)}, ${ay.toFixed(1)})">
          <circle cx="0" cy="0" r="30" fill="rgba(250, 204, 21, 0.22)" stroke="#fde047" stroke-width="2.8" stroke-dasharray="6 5" />
          <circle cx="0" cy="0" r="23" fill="none" stroke="rgba(134, 239, 172, 0.75)" stroke-width="2">
            <animate attributeName="r" values="20;34;20" dur="1.8s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.85;0.12;0.85" dur="1.8s" repeatCount="indefinite" />
          </circle>
        </g>
      `;
    }

    for (let i = 0; i < state.numPlayers; i++) {
      const p = state.players[i];
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'amphibian-token');
      g.setAttribute('id', `board-token-${i}`);

      const yPos = p.y - (p.jumpY || 0);
      const sx = (p.scaleX || 1) * 0.86;
      const sy = (p.scaleY || 1) * 0.86;
      g.setAttribute(
        'transform',
        `translate(${p.x.toFixed(1)}, ${yPos.toFixed(1)}) rotate(${p.angle.toFixed(1)}) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`
      );

      g.innerHTML = `<use href="#amphibian-${p.id}" />`;

      // Clicking an amphibian on the board makes it croak & ripple (or rolls if it's their turn)
      g.addEventListener('click', (e) => {
        e.stopPropagation();
        soundFX.playFrogCroak(145 + i * 28, 0.22);
        spawnWaterRipple(p.x, p.y, 75);
        if (i === state.currentTurn && !state.isMoving && !state.isRolling && !state.modalOpen) {
          rollDiceAndAsk();
        }
      });

      layer.appendChild(g);
    }
  }

  function updateTokenLayoutSmooth() {
    for (let i = 0; i < state.numPlayers; i++) {
      const target = computeTokenTargetPos(i, state.players[i].cell);
      state.players[i].x = target.x;
      state.players[i].y = target.y;
      state.players[i].angle = computeFacingAngle(state.players[i].cell);
      state.players[i].jumpY = 0;
      state.players[i].scaleX = 1;
      state.players[i].scaleY = 1;
    }
    renderPlayerTokensSVG();
  }

    for (let i = 0; i < 6; i++) {

        e.stopPropagation();
        if (state.isMoving || state.isRolling) return;

        if (state.currentTurn >= state.numPlayers) {
          state.currentTurn = 0;
        }
        soundFX.playFrogCroak(150 + i * 25, 0.18);
        updateTokenLayoutSmooth();
        buildPlayerSelectorHUD();
        updateTurnPreview();

  /* ============================================================================
     8. GAMEPLAY FLOW: ROLL DICE -> QUESTION LEAF -> CELEBRATE & HOP ALONG CELLS
     ============================================================================ */
  function rollDiceAndAsk() {
    if (state.isRolling || state.isMoving || state.modalOpen) return;
    state.isRolling = true;
    soundFX.playDiceRoll();

    const diceBtn = document.getElementById('dice-btn');
    diceBtn.classList.remove('dice-rolling');
    void diceBtn.offsetWidth; // trigger reflow
    diceBtn.classList.add('dice-rolling');

    // Flicker pips during roll
    let ticks = 0;
    const rollInterval = setInterval(() => {
      ticks++;
      const tempVal = Math.floor(Math.random() * 6) + 1;
      renderDicePips(tempVal);
      if (ticks >= 7) {
        clearInterval(rollInterval);
        const finalVal = Math.floor(Math.random() * 6) + 1;
        state.diceValue = finalVal;
        renderDicePips(finalVal);
        soundFX.playFrogCroak(175, 0.2);

        setTimeout(() => {
          state.isRolling = false;
          openQuestionModal();
        }, 320);
      }
    }, 85);
  }

  function openQuestionModal() {
    state.currentQuestion = getNextQuestion();
    state.answerRevealed = false;
    updateQuestionTextDisplay();
    updateTurnPreview();
    renderDicePips(state.diceValue);
    state.modalOpen = true;
    document.getElementById('question-overlay').classList.add('open');
    soundFX.playWaterDrop(480);
  }

  function closeQuestionModal() {
    state.modalOpen = false;
    document.getElementById('question-overlay').classList.remove('open');
  }

  function updateQuestionTextDisplay() {
    if (!state.currentQuestion) return;
    const textEl = document.getElementById('question-text');
    textEl.textContent = state.currentQuestion[state.lang];

    const ansTextEl = document.getElementById('answer-reveal-text');
    if (ansTextEl) {
      if (state.answerRevealed) {
        ansTextEl.textContent = state.lang === 'uk' ? state.currentQuestion.ansUk : state.currentQuestion.ansRu;
      } else {
        ansTextEl.textContent = '?';
      }
    }
  }

  // Triggered when the student answers and clicks the Confirm organic button
  function confirmAnswerAndMove() {
    if (!state.modalOpen || state.isMoving) return;
    closeQuestionModal();

    // Trigger varied active non-verbal audio-visual celebration!
    const activePlayer = state.players[state.currentTurn];
    triggerActiveCelebration(activePlayer.x, activePlayer.y);

    // Hop the amphibian step-by-step across the exact number of cells rolled
    hopPlayerSteps(state.currentTurn, state.diceValue);
  }

  // Triggered when player passes turn without moving
  function passTurnWithoutMove() {
    if (!state.modalOpen || state.isMoving) return;
    closeQuestionModal();
    soundFX.playWaterDrop(260);
    const activePlayer = state.players[state.currentTurn];
    spawnWaterRipple(activePlayer.x, activePlayer.y, 65);
    state.currentTurn = (state.currentTurn + 1) % state.numPlayers;
    buildPlayerSelectorHUD();
    updateTurnPreview();
    renderPlayerTokensSVG();
  }

  // Minimalist "Next" button handler (immediately switches question or advances)
  function skipToNextImmediately() {
    if (state.isMoving) return;
    soundFX.playWaterDrop(580);

    if (state.modalOpen) {
      // Load a brand-new question immediately with a subtle leaf bounce
      state.currentQuestion = getNextQuestion();
      state.answerRevealed = false;
      const card = document.getElementById('question-leaf-card');
      card.style.transform = 'scale(0.93) rotate(2deg)';
      setTimeout(() => {
        updateQuestionTextDisplay();
        card.style.transform = 'scale(1) rotate(0deg)';
      }, 130);
    } else {
      // If on board, immediately roll & open the next task without waiting
      rollDiceAndAsk();
    }
  }

  // Step-by-step realistic frog/newt hop animation along the 25 cells
  function hopPlayerSteps(playerIdx, stepsRemaining, stepCount = 0) {
    state.isMoving = true;
    const player = state.players[playerIdx];

    if (stepsRemaining <= 0) {
      // Finished hopping! Arrange all tokens cleanly on their cells and advance turn
      updateTokenLayoutSmooth();
      state.currentTurn = (state.currentTurn + 1) % state.numPlayers;
      buildPlayerSelectorHUD();
      updateTurnPreview();
      renderPlayerTokensSVG();
      state.isMoving = false;
      return;
    }

    const startCellIdx = player.cell;
    let nextCellIdx = startCellIdx + 1;
    let reachedSanctuary = false;

    if (nextCellIdx >= BOARD_CELLS.length) {
      // Endless generator loop: after celebrating at cell 25, smoothly wrap to cell 1
      nextCellIdx = 0;
    }
    if (nextCellIdx === BOARD_CELLS.length - 1) {
      reachedSanctuary = true;
    }

    const startX = player.x;
    const startY = player.y;
    // Temporarily place player on nextCellIdx to compute exact landing slot on that pad
    player.cell = nextCellIdx;
    const landingPos = computeTokenTargetPos(playerIdx, nextCellIdx);
    const endX = landingPos.x;
    const endY = landingPos.y;

    // Face strictly toward the destination pad
    const rad = Math.atan2(endY - startY, endX - startX);
    player.angle = (rad * 180) / Math.PI + 90;

    soundFX.playHopStep(stepCount);

    const hopDuration = 360;
    const startTime = performance.now();

    function animateSingleHop(now) {
      const t = Math.min(1, (now - startTime) / hopDuration);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

      player.x = startX + (endX - startX) * ease;
      player.y = startY + (endY - startY) * ease;

      // Realistic frog leap arc + body stretch mid-air + squash on landing
      const arc = Math.sin(t * Math.PI);
      player.jumpY = arc * 48;
      player.scaleX = 1 - arc * 0.12 + (t > 0.85 ? 0.14 : 0);
      player.scaleY = 1 + arc * 0.34 - (t > 0.85 ? 0.14 : 0);

      renderPlayerTokensSVG();

      if (t < 1) {
        requestAnimationFrame(animateSingleHop);
      } else {
        player.x = endX;
        player.y = endY;
        player.jumpY = 0;
        player.scaleX = 1;
        player.scaleY = 1;
        player.angle = computeFacingAngle(nextCellIdx);

        const targetCell = BOARD_CELLS[nextCellIdx];
        spawnWaterRipple(targetCell.x, targetCell.y, 85);

        // Bounce the lily pad SVG slightly on landing
        const padEl = document.getElementById(`board-cell-${nextCellIdx}`);
        if (padEl) {
          padEl.animate([
            { transform: `translate(${targetCell.x}px, ${targetCell.y}px) scale(1)` },
            { transform: `translate(${targetCell.x}px, ${targetCell.y + 6}px) scale(0.91)` },
            { transform: `translate(${targetCell.x}px, ${targetCell.y}px) scale(1)` }
          ], { duration: 260, easing: 'ease-out' });
        }

        // Also smoothly reposition any other frogs already sitting on start or target cell
        for (let k = 0; k < state.numPlayers; k++) {
          if (k !== playerIdx) {
            const kPos = computeTokenTargetPos(k, state.players[k].cell);
            state.players[k].x = kPos.x;
            state.players[k].y = kPos.y;
          }
        }
        renderPlayerTokensSVG();

        if (reachedSanctuary) {
          triggerGrandSanctuaryCelebration(targetCell.x, targetCell.y);
        }

        setTimeout(() => {
          hopPlayerSteps(playerIdx, stepsRemaining - 1, stepCount + 1);
        }, 75);
      }
    }

    requestAnimationFrame(animateSingleHop);
  }

  /* ============================================================================
     9. LIVING WETLAND ECOSYSTEM & NON-VERBAL CELEBRATION ENGINE (HTML5 CANVAS)
     ============================================================================ */
  const pondCanvas = document.getElementById('pond-canvas');

  // Convert SVG 1920x1080 coordinates to screen canvas coordinates
  function svgToScreen(svgX, svgY) {
    const svg = document.getElementById('board-svg');
    const rect = svg.getBoundingClientRect();
    const scale = Math.max(rect.width / 1920, rect.height / 1080);
    const offsetX = (rect.width - 1920 * scale) / 2;
    const offsetY = (rect.height - 1080 * scale) / 2;
    return {
      x: svgX * scale + offsetX,
      y: svgY * scale + offsetY,
      scale
    };
  }

    pondCanvas.width = window.innerWidth;
    pondCanvas.height = window.innerHeight;

        y: Math.random() * window.innerHeight,
        angle: Math.random() * Math.PI * 2,
        vx: 0,
        vy: 0,
        dashTimer: Math.floor(Math.random() * 120)
      });
    }

    // 45 Floating Duckweed clusters (ряска)
    for (let i = 0; i < 45; i++) {
      duckweeds.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: 0.12 + Math.random() * 0.18,
        vy: (Math.random() - 0.5) * 0.1,
        r: 2.5 + Math.random() * 3.5,
        shade: Math.random() > 0.5 ? '#65a30d' : '#84cc16'
      });
    }

    // 4 Iridescent Dragonflies (бабки)
    const dfColors = ['#38bdf8', '#34d399', '#f472b6', '#facc15'];
    for (let i = 0; i < 4; i++) {
      dragonflies.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        targetX: Math.random() * window.innerWidth,
        targetY: Math.random() * window.innerHeight,
        angle: 0,
        color: dfColors[i % dfColors.length],
        wingPhase: Math.random() * 10
      });
    }

    // 28 Bioluminescent Fireflies / Sunbeams
    for (let i = 0; i < 28; i++) {
      fireflies.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        phase: Math.random() * Math.PI * 2,
        speedX: (Math.random() - 0.5) * 0.45,
        speedY: (Math.random() - 0.5) * 0.45,
        r: 2 + Math.random() * 2.5
      });
    }
  }

  function spawnWaterRipple(svgX, svgY, maxR = 80, color = '167, 243, 208') {
    const pt = svgToScreen(svgX, svgY);
    ripples.push({
      x: pt.x,
      y: pt.y,
      r: 8,
      maxR: maxR * pt.scale,
      alpha: 0.78,
      color
    });
  }

  // Trigger 1 of 5 Distinct, Active Non-Verbal Celebrations!
  function triggerActiveCelebration(svgX, svgY) {
    const pt = svgToScreen(svgX, svgY);
    const variant = state.celebrationCounter % 5;
    state.celebrationCounter++;

    soundFX.playCelebrationSound(variant);

    // Always spawn multi-ring golden/emerald sonic ripples
    for (let ring = 0; ring < 3; ring++) {
      setTimeout(() => {
        ripples.push({
          x: pt.x,
          y: pt.y,
          r: 10,
          maxR: (130 + ring * 45) * pt.scale,
          alpha: 0.9,
          color: ring % 2 === 0 ? '250, 204, 21' : '134, 239, 172'
        });
      }, ring * 110);
    }

    if (variant === 0) {
      // Celebration 1: Frog Tongue Snapping a Glowing Golden Dragonfly + Sparkle Burst
      const flyX = pt.x + (Math.random() > 0.5 ? 140 : -140);
      const flyY = pt.y - 120;
      tongueSnaps.push({
        startX: pt.x,
        startY: pt.y,
        targetX: flyX,
        targetY: flyY,
        progress: 0
      });
      spawnSparkleBurst(flyX, flyY, 32);
    } else if (variant === 1) {
      // Celebration 2: Blooming Water Lotus Flowers Around the Pond
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        celebrationLotuses.push({
          x: pt.x + Math.cos(angle) * 115,
          y: pt.y + Math.sin(angle) * 95,
          scale: 0.05,
          maxScale: 0.85 + Math.random() * 0.35,
          alpha: 1,
          rot: Math.random() * Math.PI,
          hue: i % 2 === 0 ? '#fda4af' : '#fef08a'
        });
      }
      spawnSparkleBurst(pt.x, pt.y, 28);
    } else if (variant === 2) {
      // Celebration 3: Leaping Silver/Golden Koi Fishes Arching Out of the Water with Splashes
      for (let i = 0; i < 3; i++) {
        const dir = i % 2 === 0 ? 1 : -1;
        jumpingFishes.push({
          startX: pt.x - dir * (80 + i * 35),
          startY: pt.y + 20,
          endX: pt.x + dir * (90 + i * 35),
          endY: pt.y + 20,
          arcHeight: 130 + i * 25,
          progress: -i * 0.18,
          color: i === 1 ? '#facc15' : '#38bdf8'
        });
      }
    } else if (variant === 3) {
      // Celebration 4: Swirling Vortex of Bioluminescent Fireflies & Dewdrops
      spawnSparkleBurst(pt.x, pt.y, 48);
    } else {
      // Celebration 5: Fountain of Pond Droplets + Lotus + Leaping Fish Combo
      spawnSparkleBurst(pt.x, pt.y, 35);
      celebrationLotuses.push({
        x: pt.x,
        y: pt.y - 60,
        scale: 0.05,
        maxScale: 1.2,
        alpha: 1,
        rot: 0,
        hue: '#facc15'
      });
    }
  }

  function triggerGrandSanctuaryCelebration(svgX, svgY) {
    const pt = svgToScreen(svgX, svgY);
    soundFX.playCelebrationSound(0);
    setTimeout(() => soundFX.playCelebrationSound(3), 280);
    spawnSparkleBurst(pt.x, pt.y, 70);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      celebrationLotuses.push({
        x: pt.x + Math.cos(a) * 140,
        y: pt.y + Math.sin(a) * 110,
        scale: 0.05,
        maxScale: 1.1,
        alpha: 1,
        rot: a,
        hue: i % 2 === 0 ? '#facc15' : '#fb7185'
      });
    }
  }

  function spawnSparkleBurst(cx, cy, count = 30) {
    const palette = ['#fde047', '#86efac', '#38bdf8', '#f472b6', '#ffffff'];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.5 + Math.random() * 6.5;
      celebrationParticles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2.2,
        r: 3.5 + Math.random() * 5,
        color: palette[i % palette.length],
        alpha: 1,
        gravity: 0.12
      });
    }
  }

  // Main Animation Loop
  let animTime = 0;
  function animateEcosystem() {
    animTime += 0.016;
    const W = pondCanvas.width;
    const H = pondCanvas.height;

    // 1. Deep Emerald & Teal Living Pond Backdrop
    const bgGrad = pondCtx.createRadialGradient(W * 0.5, H * 0.45, 50, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    bgGrad.addColorStop(0, '#0f4c3a');
    bgGrad.addColorStop(0.55, '#093429');
    bgGrad.addColorStop(1, '#041b15');
    pondCtx.fillStyle = bgGrad;
    pondCtx.fillRect(0, 0, W, H);

    // 2. Animated Underwater Caustic Light Waves
    pondCtx.save();
    pondCtx.strokeStyle = 'rgba(110, 231, 183, 0.055)';
    pondCtx.lineWidth = 28;
    for (let i = 0; i < 6; i++) {
      pondCtx.beginPath();
      const baseY = (H / 5) * i;
      for (let x = 0; x <= W; x += 80) {
        const y = baseY + Math.sin(x * 0.004 + animTime * 1.1 + i) * 38;
        if (x === 0) pondCtx.moveTo(x, y);
        else pondCtx.lineTo(x, y);
      }
      pondCtx.stroke();
    }
    pondCtx.restore();

    // 3. Swimming Tadpoles (Пуголовки)
    tadpoles.forEach((tp) => {
      tp.wigglePhase += 0.24;
      tp.x += Math.cos(tp.angle) * tp.speed;
      tp.y += Math.sin(tp.angle) * tp.speed;
      tp.angle += (Math.sin(tp.wigglePhase * 0.3) - 0.5) * 0.03;

      if (tp.x < -30) tp.x = W + 30;
      if (tp.x > W + 30) tp.x = -30;
      if (tp.y < -30) tp.y = H + 30;
      if (tp.y > H + 30) tp.y = -30;

      pondCtx.save();
      pondCtx.translate(tp.x, tp.y);
      pondCtx.rotate(tp.angle);
      // Undulating tail
      pondCtx.beginPath();
      pondCtx.moveTo(-tp.size, 0);
      const tailWag = Math.sin(tp.wigglePhase) * 5;
      pondCtx.quadraticCurveTo(-tp.size * 2.2, tailWag, -tp.size * 3.4, -tailWag * 0.6);
      pondCtx.strokeStyle = 'rgba(20, 45, 34, 0.55)';
      pondCtx.lineWidth = 2.5;
      pondCtx.stroke();
      // Oval head-body
      pondCtx.beginPath();
      pondCtx.ellipse(0, 0, tp.size * 1.25, tp.size * 0.85, 0, 0, Math.PI * 2);
      pondCtx.fillStyle = 'rgba(18, 38, 28, 0.68)';
      pondCtx.fill();
      pondCtx.restore();
    });

    // 4. Floating Duckweed (Ряска)
    duckweeds.forEach((dw) => {
      dw.x += dw.vx;
      dw.y += dw.vy;
      if (dw.x > W + 10) dw.x = -10;
      if (dw.y < -10) dw.y = H + 10;
      if (dw.y > H + 10) dw.y = -10;

      pondCtx.fillStyle = dw.shade;
      pondCtx.globalAlpha = 0.55;
      pondCtx.beginPath();
      pondCtx.arc(dw.x, dw.y, dw.r, 0, Math.PI * 2);
      pondCtx.fill();
      pondCtx.beginPath();
      pondCtx.arc(dw.x + dw.r * 0.9, dw.y + 1.5, dw.r * 0.75, 0, Math.PI * 2);
      pondCtx.fill();
      pondCtx.globalAlpha = 1;
    });

    // 5. Skimming Water Striders (Водомірки)
    waterStriders.forEach((ws) => {
      ws.dashTimer--;
      if (ws.dashTimer <= 0) {
        ws.angle += (Math.random() - 0.5) * 1.4;
        const thrust = 2.8 + Math.random() * 2;
        ws.vx = Math.cos(ws.angle) * thrust;
        ws.vy = Math.sin(ws.angle) * thrust;
        ws.dashTimer = 70 + Math.floor(Math.random() * 90);
        ripples.push({
          x: ws.x,
          y: ws.y,
          r: 3,
          maxR: 28,
          alpha: 0.35,
          color: '167, 243, 208'
        });
      }
      ws.x += ws.vx;
      ws.y += ws.vy;
      ws.vx *= 0.95;
      ws.vy *= 0.95;

      if (ws.x < 20) { ws.x = 20; ws.vx *= -1; }
      if (ws.x > W - 20) { ws.x = W - 20; ws.vx *= -1; }
      if (ws.y < 20) { ws.y = 20; ws.vy *= -1; }
      if (ws.y > H - 20) { ws.y = H - 20; ws.vy *= -1; }

      pondCtx.save();
      pondCtx.translate(ws.x, ws.y);
      pondCtx.rotate(ws.angle);
      pondCtx.strokeStyle = 'rgba(15, 30, 22, 0.65)';
      pondCtx.lineWidth = 1.4;
      // 6 long water-skimming legs
      [[-4, -12], [0, -14], [4, -12], [-4, 12], [0, 14], [4, 12]].forEach(([lx, ly]) => {
        pondCtx.beginPath();
        pondCtx.moveTo(0, 0);
        pondCtx.lineTo(lx, ly);
        pondCtx.stroke();
      });
      pondCtx.fillStyle = '#1e293b';
      pondCtx.beginPath();
      pondCtx.ellipse(0, 0, 6, 2, 0, 0, Math.PI * 2);
      pondCtx.fill();
      pondCtx.restore();
    });

    // 6. Expanding Water Ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += 1.85;
      rp.alpha *= 0.965;
      pondCtx.beginPath();
      pondCtx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
      pondCtx.strokeStyle = `rgba(${rp.color}, ${rp.alpha})`;
      pondCtx.lineWidth = 2.2;
      pondCtx.stroke();
      if (rp.r >= rp.maxR || rp.alpha < 0.02) {
        ripples.splice(i, 1);
      }
    }

    // =========================================================================
    // FOREGROUND FX CANVAS (Dragonflies, Fireflies, Celebrations)
    // =========================================================================
    fxCtx.clearRect(0, 0, W, H);

    // 7. Bioluminescent Fireflies
    fireflies.forEach((ff) => {
      ff.phase += 0.04;
      ff.x += ff.speedX;
      ff.y += ff.speedY;
      if (ff.x < 0) ff.x = W;
      if (ff.x > W) ff.x = 0;
      if (ff.y < 0) ff.y = H;
      if (ff.y > H) ff.y = 0;

      const glow = (Math.sin(ff.phase) + 1) * 0.5;
      fxCtx.save();
      fxCtx.globalAlpha = 0.25 + glow * 0.65;
      const g = fxCtx.createRadialGradient(ff.x, ff.y, 0, ff.x, ff.y, ff.r * 4);
      g.addColorStop(0, '#fef9c3');
      g.addColorStop(0.4, '#fde047');
      g.addColorStop(1, 'rgba(250, 204, 21, 0)');
      fxCtx.fillStyle = g;
      fxCtx.beginPath();
      fxCtx.arc(ff.x, ff.y, ff.r * 4, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();
    });

    // 8. Darting Iridescent Dragonflies
    dragonflies.forEach((df) => {
      df.wingPhase += 0.65;
      const dx = df.targetX - df.x;
      const dy = df.targetY - df.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 25) {
        df.targetX = 80 + Math.random() * (W - 160);
        df.targetY = 80 + Math.random() * (H - 160);
      } else {
        df.angle = Math.atan2(dy, dx);
        df.x += Math.cos(df.angle) * 2.6;
        df.y += Math.sin(df.angle) * 2.6;
      }

      fxCtx.save();
      fxCtx.translate(df.x, df.y);
      fxCtx.rotate(df.angle);
      const wingFlutter = Math.sin(df.wingPhase) * 0.25;
      // 4 Translucent Wings
      fxCtx.fillStyle = 'rgba(224, 242, 254, 0.45)';
      fxCtx.strokeStyle = df.color;
      fxCtx.lineWidth = 0.8;
      [-1, 1].forEach((side) => {
        fxCtx.save();
        fxCtx.scale(1, side * (0.85 + wingFlutter));
        fxCtx.beginPath();
        fxCtx.ellipse(2, 11, 3.2, 13, -0.15, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.stroke();
        fxCtx.beginPath();
        fxCtx.ellipse(-3, 10, 2.8, 11, 0.2, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.stroke();
        fxCtx.restore();
      });
      // Slender Metallic Abdomen & Thorax
      fxCtx.fillStyle = df.color;
      fxCtx.beginPath();
      fxCtx.ellipse(-8, 0, 12, 1.8, 0, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.beginPath();
      fxCtx.arc(5, 0, 2.8, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();
    });

    // 9. Celebration FX: Frog Tongue Snapping a Glowing Dragonfly
    for (let i = tongueSnaps.length - 1; i >= 0; i--) {
      const ts = tongueSnaps[i];
      ts.progress += 0.08;
      const ext = ts.progress < 0.5 ? ts.progress * 2 : (1 - ts.progress) * 2;
      const tipX = ts.startX + (ts.targetX - ts.startX) * ext;
      const tipY = ts.startY + (ts.targetY - ts.startY) * ext;

      fxCtx.save();
      fxCtx.strokeStyle = '#fb7185';
      fxCtx.lineWidth = 7;
      fxCtx.lineCap = 'round';
      fxCtx.beginPath();
      fxCtx.moveTo(ts.startX, ts.startY);
      fxCtx.lineTo(tipX, tipY);
      fxCtx.stroke();
      fxCtx.fillStyle = '#f43f5e';
      fxCtx.beginPath();
      fxCtx.arc(tipX, tipY, 7, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();

      if (ts.progress >= 1) {
        tongueSnaps.splice(i, 1);
      }
    }

    // 10. Celebration FX: Blooming Water Lotuses
    for (let i = celebrationLotuses.length - 1; i >= 0; i--) {
      const lt = celebrationLotuses[i];
      if (lt.scale < lt.maxScale) {
        lt.scale += 0.045;
      } else {
        lt.alpha -= 0.022;
      }
      lt.rot += 0.01;

      fxCtx.save();
      fxCtx.translate(lt.x, lt.y);
      fxCtx.rotate(lt.rot);
      fxCtx.scale(lt.scale, lt.scale);
      fxCtx.globalAlpha = Math.max(0, lt.alpha);

      for (let p = 0; p < 8; p++) {
        fxCtx.save();
        fxCtx.rotate((p * Math.PI) / 4);
        fxCtx.fillStyle = lt.hue;
        fxCtx.beginPath();
        fxCtx.ellipse(0, -20, 10, 24, 0, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();
      }
      fxCtx.fillStyle = '#fde047';
      fxCtx.beginPath();
      fxCtx.arc(0, 0, 11, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();

      if (lt.alpha <= 0) {
        celebrationLotuses.splice(i, 1);
      }
    }

    // 11. Celebration FX: Leaping Fishes
    for (let i = jumpingFishes.length - 1; i >= 0; i--) {
      const jf = jumpingFishes[i];
      jf.progress += 0.028;
      if (jf.progress >= 0 && jf.progress <= 1) {
        const t = jf.progress;
        const x = jf.startX + (jf.endX - jf.startX) * t;
        const y = jf.startY - Math.sin(t * Math.PI) * jf.arcHeight;
        const dx = jf.endX - jf.startX;
        const dy = -Math.cos(t * Math.PI) * Math.PI * jf.arcHeight;
        const ang = Math.atan2(dy, dx);

        fxCtx.save();
        fxCtx.translate(x, y);
        fxCtx.rotate(ang);
        fxCtx.fillStyle = jf.color;
        fxCtx.beginPath();
        fxCtx.ellipse(0, 0, 18, 7, 0, 0, Math.PI * 2);
        fxCtx.fill();
        // Fish tail
        fxCtx.beginPath();
        fxCtx.moveTo(-15, 0);
        fxCtx.lineTo(-27, -9);
        fxCtx.lineTo(-27, 9);
        fxCtx.closePath();
        fxCtx.fill();
        fxCtx.restore();
      } else if (jf.progress > 1) {
        ripples.push({
          x: jf.endX,
          y: jf.endY,
          r: 6,
          maxR: 65,
          alpha: 0.75,
          color: '186, 230, 253'
        });
        jumpingFishes.splice(i, 1);
      }
    }

    // 12. Celebration Sparkle & Dewdrop Particles
    for (let i = celebrationParticles.length - 1; i >= 0; i--) {
      const pt = celebrationParticles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += pt.gravity;
      pt.alpha -= 0.018;

      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, pt.alpha);
      fxCtx.fillStyle = pt.color;
      fxCtx.shadowColor = pt.color;
      fxCtx.shadowBlur = 10;
      fxCtx.beginPath();
      fxCtx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.restore();

      if (pt.alpha <= 0) {
        celebrationParticles.splice(i, 1);
      }
    }

    requestAnimationFrame(animateEcosystem);
  }

  /* ============================================================================
     10. EVENT LISTENERS & INITIALIZATION
     ============================================================================ */
  window.onload = function () {
    buildBoardSVG();
    initPlayersPositions();
    buildPlayerSelectorHUD();
    updateTurnPreview();
    renderDicePips(state.diceValue);
    initPondEcosystem();
    animateEcosystem();

    // Dice click & keyboard spacebar
    document.getElementById('dice-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      rollDiceAndAsk();
    });

    // Confirm Answer button inside Question Leaf
    document.getElementById('answer-confirm-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      confirmAnswerAndMove();
    });

    // Pass Turn button inside Question Leaf
    document.getElementById('answer-pass-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      passTurnWithoutMove();
    });

    // Answer Peek / Reveal Sprout Leaf button
    document.getElementById('answer-reveal-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      state.answerRevealed = !state.answerRevealed;
      soundFX.playWaterDrop(state.answerRevealed ? 620 : 410);
      updateQuestionTextDisplay();
    });

    // Minimalist "Next" button inside Question Leaf
    document.getElementById('modal-next-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      skipToNextImmediately();
    });

    // Minimalist "Next" button on main HUD
    document.getElementById('hud-next-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      skipToNextImmediately();
    });

    // Single Language Toggle Button ("укр" / "рус")
    const langBtn = document.getElementById('lang-toggle-btn');
    langBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      state.lang = state.lang === 'uk' ? 'ru' : 'uk';
      langBtn.textContent = state.lang === 'uk' ? 'укр' : 'рус';
      soundFX.playWaterDrop(510);
      updateQuestionTextDisplay();
    });

    // Clicking anywhere on the pond creates interactive water ripples & droplet sound
    document.getElementById('app-stage').addEventListener('click', (e) => {
      if (state.modalOpen) return;
      ripples.push({
        x: e.clientX,
        y: e.clientY,
        r: 6,
        maxR: 75,
        alpha: 0.65,
        color: '167, 243, 208'
      });
      soundFX.playWaterDrop(390 + Math.random() * 140);
    });

    // Keyboard accessibility (Space to roll or confirm, ArrowRight for Next)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (state.modalOpen) confirmAnswerAndMove();
        else rollDiceAndAsk();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        skipToNextImmediately();
      }
    });
  };
</script>
