<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #061c12;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* ============================================================
       ORGANIC RAINFOREST UI CONTROLS (ZERO WHITE RECTANGLES)
       ============================================================ */

    /* Top-Left Consonant Multi-Selector Trigger */
    #consonantToggle {
      position: fixed;
      top: clamp(12px, 2.2vh, 24px);
      left: clamp(12px, 1.8vw, 26px);
      min-width: clamp(60px, 5vw, 78px);
      max-width: min(360px, 64vw);
      height: clamp(54px, 4.6vw, 70px);
      padding: 0 clamp(16px, 1.6vw, 24px);
      border-radius: 999px;
      border: 2.5px solid rgba(255, 214, 102, 0.78);
      background:
        radial-gradient(circle at 26% 24%, rgba(255, 232, 145, 0.36), transparent 54%),
        linear-gradient(148deg, rgba(20, 92, 56, 0.94), rgba(7, 41, 25, 0.96));
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.45),
        inset 0 2px 6px rgba(255, 240, 175, 0.35),
        inset 0 -4px 10px rgba(3, 24, 14, 0.75);
      color: #fff8d6;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: clamp(22px, 2vw, 32px);
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      outline: none;
    }

    #consonantToggle:hover {
      transform: scale(1.06);
      border-color: rgba(255, 232, 136, 0.98);
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.5),
        0 0 18px rgba(255, 200, 72, 0.45),
        inset 0 2px 8px rgba(255, 246, 200, 0.5);
    }

    #consonantToggle:active {
      transform: scale(0.96);
    }

    /* Translucent Jungle-Emerald Multi-Select Consonant Palette */
    #consonantPalette {
      position: fixed;
      top: clamp(74px, 9.4vh, 108px);
      left: clamp(12px, 1.8vw, 26px);
      width: min(468px, 92vw);
      padding: clamp(12px, 1.4vw, 18px);
      border-radius: 30px 38px 34px 28px;
      border: 2px solid rgba(132, 224, 152, 0.5);
      background:
        radial-gradient(ellipse at 16% 12%, rgba(44, 136, 78, 0.78), transparent 58%),
        radial-gradient(ellipse at 86% 88%, rgba(24, 88, 56, 0.88), rgba(7, 36, 22, 0.95));
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.58),
        inset 0 1px 12px rgba(176, 255, 192, 0.24);
      z-index: 29;
      opacity: 0;
      transform: translateY(-14px) scale(0.92);
      pointer-events: none;
      overflow: hidden;
      transition: opacity 0.24s ease, transform 0.26s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    #consonantPalette.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Decorative subtle leaf pattern inside palette */
    .palette-leaf-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .palette-toolbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: clamp(10px, 1.2vw, 14px);
      padding-bottom: clamp(8px, 0.9vw, 12px);
      border-bottom: 1.5px solid rgba(160, 236, 174, 0.22);
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tool-icon-btn {
      width: clamp(42px, 3.6vw, 50px);
      height: clamp(42px, 3.6vw, 50px);
      border-radius: 50%;
      border: 1.8px solid rgba(182, 244, 192, 0.42);
      background:
        radial-gradient(circle at 30% 28%, rgba(132, 230, 154, 0.32), transparent 58%),
        linear-gradient(155deg, rgba(24, 98, 60, 0.94), rgba(10, 48, 29, 0.96));
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35), inset 0 1px 4px rgba(210, 255, 218, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .tool-icon-btn:hover {
      transform: scale(1.1);
      border-color: #ffe07d;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.42), 0 0 12px rgba(255, 214, 96, 0.4);
    }

    .tool-icon-btn:active {
      transform: scale(0.93);
    }

    .tool-icon-btn.confirm-btn {
      border-color: rgba(146, 252, 168, 0.72);
      background:
        radial-gradient(circle at 30% 26%, rgba(164, 255, 180, 0.42), transparent 58%),
        linear-gradient(155deg, #279c52, #125c30);
    }

    .tool-icon-btn svg {
      width: 56%;
      height: 56%;
    }

    .pebble-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(7px, 0.9vw, 11px);
    }

    .pebble-btn {
      width: clamp(46px, 4.1vw, 60px);
      height: clamp(46px, 4.1vw, 60px);
      border-radius: 46% 54% 49% 51% / 52% 46% 54% 48%;
      border: 1.8px solid rgba(174, 242, 184, 0.36);
      background:
        radial-gradient(circle at 30% 26%, rgba(122, 219, 146, 0.34), transparent 55%),
        linear-gradient(155deg, rgba(25, 92, 58, 0.92), rgba(11, 49, 31, 0.96));
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.35),
        inset 0 2px 4px rgba(190, 255, 204, 0.24);
      color: #eefce8;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: clamp(22px, 2vw, 29px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    .pebble-btn:hover {
      transform: scale(1.1) translateY(-2px);
      border-color: rgba(255, 224, 122, 0.85);
      background:
        radial-gradient(circle at 30% 26%, rgba(255, 224, 122, 0.42), transparent 58%),
        linear-gradient(155deg, rgba(46, 134, 78, 0.95), rgba(18, 72, 42, 0.98));
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4), 0 0 12px rgba(255, 210, 96, 0.35);
    }

    .pebble-btn.active {
      border-color: #ffe075;
      background:
        radial-gradient(circle at 32% 25%, rgba(255, 242, 178, 0.58), transparent 55%),
        linear-gradient(150deg, #e08b18, #944608);
      color: #fffdf0;
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.45),
        0 0 14px rgba(255, 195, 64, 0.58),
        inset 0 2px 5px rgba(255, 246, 198, 0.52);
    }

    /* Top-Right Language Toggle Button ("укр" / "рус") */
    #langToggle {
      position: fixed;
      top: clamp(12px, 2.2vh, 24px);
      right: clamp(12px, 1.8vw, 26px);
      min-width: clamp(72px, 5.8vw, 94px);
      height: clamp(48px, 4.2vw, 62px);
      padding: 0 clamp(14px, 1.4vw, 22px);
      border-radius: 30px 14px 30px 14px;
      border: 2.2px solid rgba(255, 214, 102, 0.75);
      background:
        radial-gradient(circle at 25% 22%, rgba(255, 232, 145, 0.36), transparent 58%),
        linear-gradient(145deg, rgba(24, 96, 58, 0.92), rgba(9, 46, 28, 0.96));
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.44),
        inset 0 2px 6px rgba(255, 244, 188, 0.32);
      color: #fff6cf;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: clamp(19px, 1.65vw, 26px);
      letter-spacing: 0.04em;
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      outline: none;
    }

    #langToggle:hover {
      transform: scale(1.08);
      border-color: #ffe285;
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.5),
        0 0 16px rgba(255, 206, 84, 0.42);
    }

    #langToggle:active {
      transform: scale(0.95);
    }

    /* Bottom-Right Minimalist "Next" Wave Button (SVG Arrow Only) */
    #nextWaveBtn {
      position: fixed;
      bottom: clamp(14px, 2.5vh, 28px);
      right: clamp(14px, 2vw, 28px);
      width: clamp(58px, 4.9vw, 76px);
      height: clamp(58px, 4.9vw, 76px);
      border-radius: 50%;
      border: 2.5px solid rgba(154, 240, 168, 0.74);
      background:
        radial-gradient(circle at 30% 26%, rgba(164, 255, 178, 0.38), transparent 55%),
        radial-gradient(circle at 70% 78%, rgba(18, 92, 52, 0.94), rgba(7, 44, 25, 0.96));
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.48),
        inset 0 2px 7px rgba(200, 255, 206, 0.36),
        inset 0 -4px 10px rgba(4, 24, 13, 0.78);
      cursor: pointer;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      outline: none;
    }

    #nextWaveBtn:hover {
      transform: scale(1.1) translateX(3px);
      border-color: #c8ffd0;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.52),
        0 0 18px rgba(114, 245, 148, 0.45);
    }

    #nextWaveBtn:active {
      transform: scale(0.93);
    }

    #nextWaveBtn svg {
      width: 52%;
      height: 52%;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
      transition: transform 0.2s ease;
    }

    #nextWaveBtn:hover svg {
      transform: translateX(2px);
    }

    @media (max-width: 640px) {
      .pebble-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Consonant Multi-Selector Trigger -->
  <button id="consonantToggle" type="button" aria-label="Consonants">∞</button>

  <!-- Organic Translucent Jungle-Emerald Multi-Select Palette -->
  <div id="consonantPalette" role="menu">
    <svg class="palette-leaf-bg" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <path d="M-20 40 C60 10, 140 50, 170 130 C90 140, 20 100, -20 40Z" fill="#7dff9b"/>
      <path d="M420 280 C330 290, 250 240, 230 160 C310 155, 385 205, 420 280Z" fill="#7dff9b"/>
      <path d="M350 -10 C310 60, 330 130, 390 160 C410 100, 400 35, 350 -10Z" fill="#a8ff8e"/>
      <path d="M30 330 C80 265, 150 260, 195 315 C140 340, 75 345, 30 330Z" fill="#64e884"/>
    </svg>
    <div class="palette-toolbar">
      <div class="toolbar-left">
        <!-- Select All (Star / Grid Icon) -->
        <button id="selectAllBtn" class="tool-icon-btn" type="button" aria-label="Select All">
          <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3L17.1 9.8L24.5 10.6L18.9 15.6L20.5 23L14 19.2L7.5 23L9.1 15.6L3.5 10.6L10.9 9.8L14 3Z" fill="#FFE066" stroke="#FFF8D2" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
        <!-- Clear Selection (Trash / Reset Icon) -->
        <button id="clearAllBtn" class="tool-icon-btn" type="button" aria-label="Clear">
          <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 7L21 21M21 7L7 21" stroke="#FFB8A8" stroke-width="3.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <!-- Close / Apply (Checkmark Icon) -->
      <button id="closePaletteBtn" class="tool-icon-btn confirm-btn" type="button" aria-label="Done">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.5 14.5L11.8 19.8L22 9" stroke="#F4FFF5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div id="pebbleGrid" class="pebble-grid"></div>
  </div>

  <!-- Bilingual Language Toggle ("укр" / "рус") -->
  <button id="langToggle" type="button">укр</button>

  <!-- Minimalist Next Wave Button (Custom SVG Forward Arrow, No Text) -->
  <button id="nextWaveBtn" type="button" aria-label="Next">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 18C12.5 18 21.5 18 28 18" stroke="#E9FFE8" stroke-width="3.8" stroke-linecap="round" />
      <path d="M19.5 9.5C22.2 12.8 25.4 15.6 28.8 18C25.4 20.4 22.2 23.2 19.5 26.5" stroke="#FFE588" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <script>
    (() => {
      'use strict';

      /* ======================================================================
         1. LANGUAGE & MULTI-CONSONANT SYLLABLE ENGINE
         ====================================================================== */
      const LANG_CONFIG = {
        uk: {
          label: 'укр',
          consonants: ['Б','В','Г','Ґ','Д','Ж','З','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ'],
          vowels: ['А','О','У','И','І','Е','Я','Ю','Є','Ї'],
          forbidden: new Set([
            'ЖЯ','ЖЮ','ЖЄ','ЧЯ','ЧЮ','ЧЄ','ШЯ','ШЮ','ШЄ','ЩЯ','ЩЮ','ЩЄ'
          ])
        },
        ru: {
          label: 'рус',
          consonants: ['Б','В','Г','Д','Ж','З','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ'],
          vowels: ['А','О','У','Ы','И','Э','Е','Ё','Я','Ю'],
          forbidden: new Set([
            'ЖЫ','ШЫ','ЧЯ','ЩЯ','ЧЮ','ЩЮ','ЦЯ','ЦЮ','ЖЯ','ЖЮ','ШЯ','ШЮ'
          ])
        }
      };

      let currentLang = 'uk';
      // Multi-select Set of consonants. Empty Set OR full Set => use all consonants.
      let selectedConsonants = new Set();
      let recentSyllables = [];

      function getActiveConsonants() {
        const cfg = LANG_CONFIG[currentLang];
        const validSelected = cfg.consonants.filter(c => selectedConsonants.has(c));
        return validSelected.length > 0 ? validSelected : cfg.consonants;
      }

      function getValidVowelsFor(lang, consonant) {
        const cfg = LANG_CONFIG[lang];
        return cfg.vowels.filter(v => !cfg.forbidden.has(consonant + v));
      }

      function generateWaveSyllables(count = 4) {
        const activeCons = shuffle([...getActiveConsonants()]);
        const result = [];
        const used = new Set();

        if (activeCons.length === 1) {
          // Single consonant selected: vary vowels without repeating previous wave immediately
          const c = activeCons[0];
          const validVowels = shuffle([...getValidVowelsFor(currentLang, c)]);
          validVowels.sort((a, b) => {
            const aRec = recentSyllables.includes(c + a) ? 1 : 0;
            const bRec = recentSyllables.includes(c + b) ? 1 : 0;
            return aRec - bRec;
          });
          for (let i = 0; i < count; i++) {
            result.push(c + validVowels[i % validVowels.length]);
          }
        } else {
          // Multiple consonants (or all): distribute evenly across selected consonants
          let idx = 0;
          let guard = 0;
          while (result.length < count && guard < 160) {
            guard++;
            const c = activeCons[idx % activeCons.length];
            idx++;
            const validVowels = getValidVowelsFor(currentLang, c);
            const v = validVowels[Math.floor(Math.random() * validVowels.length)];
            const syl = c + v;
            if (!used.has(syl) && (!recentSyllables.includes(syl) || guard > 60)) {
              used.add(syl);
              result.push(syl);
            }
          }
        }

        recentSyllables = [...result];
        return result;
      }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      /* ======================================================================
         2. PROCEDURAL WEB AUDIO API SOUND ENGINE (ZERO EXTERNAL FILES)
         ====================================================================== */
      class RainforestAudio {
        constructor() {
          this.ctx = null;
          this.pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99];
          this.noteIdx = 0;
        }

        ensure() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
          } catch (e) {}
          return this.ctx;
        }

        playTongueThwip() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.085);
          osc.frequency.exponentialRampToValueAtTime(340, now + 0.14);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }

        playCatchPopAndMarimba() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;

          // Juicy organic pop
          const popOsc = ctx.createOscillator();
          const popGain = ctx.createGain();
          popOsc.type = 'sine';
          popOsc.frequency.setValueAtTime(320, now);
          popOsc.frequency.exponentialRampToValueAtTime(920, now + 0.055);
          popGain.gain.setValueAtTime(0.25, now);
          popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
          popOsc.connect(popGain);
          popGain.connect(ctx.destination);
          popOsc.start(now);
          popOsc.stop(now + 0.08);

          // Warm wooden marimba / kalimba two-note harmonic chord
          const baseIdx = this.noteIdx % (this.pentatonic.length - 2);
          this.noteIdx = (this.noteIdx + 2) % (this.pentatonic.length - 2);
          const freqs = [this.pentatonic[baseIdx], this.pentatonic[baseIdx + 2]];

          freqs.forEach((f, i) => {
            const t = now + 0.04 + i * 0.055;
            const osc = ctx.createOscillator();
            const overtone = ctx.createOscillator();
            const gain = ctx.createGain();
            const ovGain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, t);
            overtone.type = 'sine';
            overtone.frequency.setValueAtTime(f * 3.98, t);

            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.2, t + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);

            ovGain.gain.setValueAtTime(0.001, t);
            ovGain.gain.linearRampToValueAtTime(0.05, t + 0.008);
            ovGain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);

            osc.connect(gain);
            overtone.connect(ovGain);
            ovGain.connect(gain);
            gain.connect(ctx.destination);

            osc.start(t);
            overtone.start(t);
            osc.stop(t + 0.45);
            overtone.stop(t + 0.14);
          });
        }

        playReactionSound(type) {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'frog') {
            // Tropical tree frog chirp + splash
            for (let i = 0; i < 2; i++) {
              const t = now + i * 0.11;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(520, t);
              osc.frequency.exponentialRampToValueAtTime(1180, t + 0.07);
              gain.gain.setValueAtTime(0.001, t);
              gain.gain.linearRampToValueAtTime(0.14, t + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.1);
            }
          } else if (type === 'bubbles' || type === 'rainbow') {
            // Sparkling water-drop plinks / wind-chime glissando
            const notes = [659.25, 783.99, 987.77, 1174.66, 1318.51];
            notes.forEach((f, idx) => {
              const t = now + idx * 0.065;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, t);
              osc.frequency.exponentialRampToValueAtTime(f * 1.06, t + 0.08);
              gain.gain.setValueAtTime(0.001, t);
              gain.gain.linearRampToValueAtTime(0.09, t + 0.01);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.27);
            });
          } else {
            // Soft kalimba shimmer for hummingbird / flower / fireflies
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((f, idx) => {
              const t = now + idx * 0.05;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(f, t);
              gain.gain.setValueAtTime(0.001, t);
              gain.gain.linearRampToValueAtTime(0.08, t + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(t);
              osc.stop(t + 0.32);
            });
          }
        }

        playWaveCelebration() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const melody = [392.0, 440.0, 523.25, 659.25, 783.99, 1046.5];
          melody.forEach((f, i) => {
            const t = now + i * 0.075;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.16, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.48);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.5);
          });
          // Soft wooden bongo taps
          [0, 0.14, 0.26, 0.42].forEach((offset, i) => {
            const t = now + offset;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            const f0 = i % 2 === 0 ? 185 : 245;
            osc.frequency.setValueAtTime(f0, t);
            osc.frequency.exponentialRampToValueAtTime(f0 * 0.55, t + 0.11);
            gain.gain.setValueAtTime(0.18, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.14);
          });
        }

        playLeafWhoosh() {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime;
          const bufferSize = Math.floor(ctx.sampleRate * 0.22);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(650, now);
          filter.frequency.exponentialRampToValueAtTime(1900, now + 0.12);
          filter.frequency.exponentialRampToValueAtTime(900, now + 0.22);
          filter.Q.value = 2.2;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(now);
        }
      }

      const audio = new RainforestAudio();

      /* ======================================================================
         3. COLOR PALETTES FOR CARRIERS & CHAMELEON MORPHING
         ====================================================================== */
      const PALETTES = [
        {
          name: 'emerald',
          top: [32, 168, 86],
          mid: [68, 206, 108],
          belly: [184, 240, 146],
          stripe: [14, 96, 52],
          accent: [255, 224, 92],
          badgeBg: ['rgba(12, 84, 44, 0.88)', 'rgba(34, 148, 78, 0.92)'],
          badgeBorder: '#a8ffbc'
        },
        {

          top: [16, 118, 228],
          mid: [48, 178, 255],
          belly: [176, 236, 255],
          stripe: [10, 48, 128],

          badgeBg: ['rgba(10, 56, 134, 0.88)', 'rgba(26, 132, 222, 0.92)'],

        },
        {

          badgeBg: ['rgba(136, 16, 44, 0.88)', 'rgba(208, 42, 76, 0.92)'],

        },
        {
          name: 'amber',
          top: [232, 134, 16],
          mid: [255, 186, 42],
          belly: [255, 242, 174],
          stripe: [142, 66, 8],
          accent: [255, 248, 164],
          badgeBg: ['rgba(134, 68, 8, 0.90)', 'rgba(206, 122, 18, 0.92)'],
          badgeBorder: '#ffe68a'
        },
        {
          name: 'orchid',
          top: [148, 46, 196],
          mid: [198, 88, 236],
          belly: [244, 196, 255],
          stripe: [78, 18, 118],
          accent: [255, 176, 234],
          badgeBg: ['rgba(86, 22, 126, 0.88)', 'rgba(154, 52, 198, 0.92)'],
          badgeBorder: '#f0b8ff'
        },
        {
          name: 'tangerine',
          top: [236, 84, 24],
          mid: [255, 136, 52],
          belly: [255, 226, 166],
          stripe: [142, 38, 12],
          accent: [255, 236, 112],
          badgeBg: ['rgba(148, 44, 12, 0.90)', 'rgba(218, 88, 28, 0.92)'],
          badgeBorder: '#ffd09c'
        }
      ];

      function lerp(a, b, t) { return a + (b - a) * t; }
      function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
      function smoothstep(edge0, edge1, x) {
        const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
      }
      function lerpRGB(c1, c2, t, alpha = 1) {
        const r = Math.round(lerp(c1[0], c2[0], t));
        const g = Math.round(lerp(c1[1], c2[1], t));
        const b = Math.round(lerp(c1[2], c2[2], t));
        return alpha < 1 ? `rgba(${r},${g},${b},${alpha})` : `rgb(${r},${g},${b})`;
      }

      /* ======================================================================
         4. CANVAS SETUP & RESPONSIVE GEOMETRY
         ====================================================================== */
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let W = window.innerWidth;
      let H = window.innerHeight;
      let DPR = Math.min(window.devicePixelRatio || 1, 2);
      let S = 1; // Global responsive scale

      const pointer = { x: W * 0.65, y: H * 0.45, active: false };

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        S = Math.min(W / 1280, H / 720);
        repositionCarriersOnResize();
      }

      /* ======================================================================
         5. AMBIENT RAINFOREST PARTICLES (SUNBEAMS, MIST, POLLEN, RAINDROPS)
         ====================================================================== */
      const pollen = Array.from({ length: 42 }, () => ({
        x: Math.random(),
        y: Math.random(),
        r: 1.3 + Math.random() * 2.5,
        vx: 0.004 + Math.random() * 0.008,
        vy: -0.003 + Math.random() * 0.006,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.25 + Math.random() * 0.55
      }));

      const waterfallMist = Array.from({ length: 28 }, () => ({
        x: 0.46 + Math.random() * 0.14,
        y: 0.68 + Math.random() * 0.18,
        r: 18 + Math.random() * 34,
        vx: (Math.random() - 0.5) * 0.012,
        vy: -0.015 - Math.random() * 0.02,
        life: Math.random()
      }));

      const waterRipples = [];
      const fallingDrops = [];
      let nextDropTimer = 1.2;

      function updateAmbient(dt, t) {
        for (const p of pollen) {
          p.x += (p.vx + Math.sin(t * 0.7 + p.phase) * 0.004) * dt;
          p.y += (p.vy + Math.cos(t * 0.9 + p.phase) * 0.003) * dt;
          if (p.x > 1.05) p.x = -0.05;
          if (p.y < -0.05) p.y = 1.05;
          if (p.y > 1.05) p.y = -0.05;
        }

        for (const m of waterfallMist) {
          m.life += dt * 0.32;
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          if (m.life >= 1) {
            m.life = 0;
            m.x = 0.47 + Math.random() * 0.11;
            m.y = 0.78 + Math.random() * 0.08;
          }
        }

        // Occasional raindrops sliding off canopy leaves into the stream
        nextDropTimer -= dt;
        if (nextDropTimer <= 0) {
          nextDropTimer = 1.1 + Math.random() * 2.0;
          fallingDrops.push({
            x: (0.12 + Math.random() * 0.78) * W,
            y: (0.08 + Math.random() * 0.18) * H,
            vy: 160 * S,
            targetY: (0.87 + Math.random() * 0.09) * H
          });
        }

        for (let i = fallingDrops.length - 1; i >= 0; i--) {
          const d = fallingDrops[i];
          d.vy += 680 * S * dt;
          d.y += d.vy * dt;
          if (d.y >= d.targetY) {
            waterRipples.push({
              x: d.x,
              y: d.targetY,
              r: 2,
              maxR: (26 + Math.random() * 26) * S,
              alpha: 0.72
            });
            fallingDrops.splice(i, 1);
          }
        }

        for (let i = waterRipples.length - 1; i >= 0; i--) {
          const r = waterRipples[i];
          r.r += 42 * S * dt;
          r.alpha = clamp(1 - r.r / r.maxR, 0, 1) * 0.65;
          if (r.r >= r.maxR) waterRipples.splice(i, 1);
        }
      }

      /* ======================================================================
         6. HERO CHARACTER — REALISTIC COLOR-SHIFTING CHAMELEON
         ====================================================================== */
      const chameleon = {
        prevPalette: PALETTES[0],
        currPalette: PALETTES[0],
        morphProgress: 1.5, // >= 1.4 means fully morphed
        eyeAngle: -0.15,
        targetEyeAngle: -0.15,
        mouthOpen: 0,
        branchBounce: 0,
        branchBounceVel: 0,
        happyTimer: 0,
        tongueState: 'idle', // idle | aiming | shooting | retracting
        tongueTimer: 0,
        tongueTip: { x: 0, y: 0 },
        targetCarrier: null,
        caughtCarrier: null,
        mouthPos: { x: 0, y: 0 }
      };

      function getChameleonAnchor() {
        return {
          x: W * 0.195,
          y: H * 0.565 + chameleon.branchBounce * S
        };
      }

      function triggerChameleonMorph(newPalette) {
        chameleon.prevPalette = chameleon.currPalette;
        chameleon.currPalette = newPalette;
        chameleon.morphProgress = 0;
        chameleon.happyTimer = 1.6;
        chameleon.branchBounceVel = 95;
      }

      function getMorphColor(key, u, alpha = 1) {
        // Chromatic wave travels from nose (u=0) to tail (u=1)
        const wave = smoothstep(u - 0.18, u + 0.18, chameleon.morphProgress);
        return lerpRGB(chameleon.prevPalette[key], chameleon.currPalette[key], wave, alpha);
      }

      function updateChameleon(dt, t) {
        // Smooth chromatic wave
        if (chameleon.morphProgress < 1.5) {
          chameleon.morphProgress += dt * 1.45;
        }

        // Branch spring physics
        const springK = 140;
        const damping = 10;
        const acc = -springK * chameleon.branchBounce - damping * chameleon.branchBounceVel;
        chameleon.branchBounceVel += acc * dt;
        chameleon.branchBounce += chameleon.branchBounceVel * dt;

        if (chameleon.happyTimer > 0) {
          chameleon.happyTimer = Math.max(0, chameleon.happyTimer - dt);
        }

        const anchor = getChameleonAnchor();
        const scale = S * 1.02;
        const eyeX = anchor.x + 114 * scale;
        const eyeY = anchor.y - 44 * scale;
        chameleon.mouthPos.x = anchor.x + 148 * scale;
        chameleon.mouthPos.y = anchor.y - 26 * scale;

        // Eye tracking cursor or locked target
        let lookX = pointer.x;
        let lookY = pointer.y;
        if (chameleon.targetCarrier) {
          lookX = chameleon.targetCarrier.x;
          lookY = chameleon.targetCarrier.y;
        }
        const desiredAngle = Math.atan2(lookY - eyeY, lookX - eyeX);
        let diff = desiredAngle - chameleon.eyeAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        chameleon.eyeAngle += diff * Math.min(1, dt * 14);

        // Tongue state machine
        if (chameleon.tongueState === 'aiming') {
          chameleon.tongueTimer += dt;
          chameleon.mouthOpen = clamp(chameleon.tongueTimer / 0.08, 0, 1);
          if (chameleon.tongueTimer >= 0.08) {
            chameleon.tongueState = 'shooting';
            chameleon.tongueTimer = 0;
            audio.playTongueThwip();
          }
        } else if (chameleon.tongueState === 'shooting') {
          chameleon.tongueTimer += dt;
          chameleon.mouthOpen = 1;
          const p = clamp(chameleon.tongueTimer / 0.13, 0, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          const tc = chameleon.targetCarrier;
          if (tc) {
            chameleon.tongueTip.x = lerp(chameleon.mouthPos.x, tc.x, ease);
            chameleon.tongueTip.y = lerp(chameleon.mouthPos.y, tc.y, ease);
          }
          if (p >= 1) {
            // Snag the carrier!
            if (tc) {
              tc.caught = true;
              chameleon.caughtCarrier = tc;
              chameleon.branchBounceVel = -75;
              spawnCatchBurst(tc.x, tc.y, tc.palette);
              audio.playCatchPopAndMarimba();
            }
            chameleon.tongueState = 'retracting';
            chameleon.tongueTimer = 0;
          }
        } else if (chameleon.tongueState === 'retracting') {
          chameleon.tongueTimer += dt;
          const p = clamp(chameleon.tongueTimer / 0.21, 0, 1);
          const ease = p * p;
          const tc = chameleon.caughtCarrier;
          if (tc) {
            chameleon.tongueTip.x = lerp(tc.snagX, chameleon.mouthPos.x, ease);
            chameleon.tongueTip.y = lerp(tc.snagY, chameleon.mouthPos.y, ease);
            tc.x = chameleon.tongueTip.x;
            tc.y = chameleon.tongueTip.y;
            tc.scale = lerp(1.1, 0.18, ease);
          }
          chameleon.mouthOpen = clamp(1 - p * 0.7, 0.2, 1);

          if (p >= 1) {
            chameleon.tongueState = 'idle';
            chameleon.mouthOpen = 0;
            if (tc) {
              triggerChameleonMorph(tc.palette);
              triggerRandomReaction(tc.x, tc.y, tc.palette);
              tc.removed = true;
            }
            chameleon.targetCarrier = null;
            chameleon.caughtCarrier = null;
            checkWaveCompletion();
          }
        } else {
          chameleon.mouthOpen = Math.max(0, chameleon.mouthOpen - dt * 6);
        }
      }

      /* ======================================================================
         7. INTERACTIVE SYLLABLE CARRIERS (5 ULTRA-DETAILED PROCEDURAL TYPES)
         ====================================================================== */
      const CARRIER_TYPES = ['butterfly', 'beetle', 'dragonfly', 'blossom', 'fruit'];
      let carriers = [];
      let waveTransitioning = false;
      let hoveredCarrier = null;

      function getCarrierSlotPositions() {
        // Spacious 2x2 organic staggered layout so large syllable medallions never overlap
        return [
          { rx: 0.48, ry: 0.26 },
          { rx: 0.80, ry: 0.25 },
          { rx: 0.52, ry: 0.64 },
          { rx: 0.82, ry: 0.63 }
        ];
      }

      function repositionCarriersOnResize() {
        const slots = getCarrierSlotPositions();
        carriers.forEach((c, idx) => {
          const slot = slots[idx % slots.length];
          c.baseX = (slot.rx + c.jitterX) * W;
          c.baseY = (slot.ry + c.jitterY) * H;
          if (!c.caught) {
            c.x = c.baseX;
            c.y = c.baseY;
          }
        });
      }

      function spawnNewWave(animatedExit = false) {
        waveTransitioning = false;
        const syllables = generateWaveSyllables(4);
        const types = shuffle([...CARRIER_TYPES]).slice(0, 4);
        const palettes = shuffle([...PALETTES]).slice(0, 4);
        const slots = getCarrierSlotPositions();

        carriers = syllables.map((syl, i) => {
          const jx = (Math.random() - 0.5) * 0.032;
          const jy = (Math.random() - 0.5) * 0.04;
          const baseX = (slots[i].rx + jx) * W;
          const baseY = (slots[i].ry + jy) * H;
          return {
            id: Math.random().toString(36).slice(2),
            syllable: syl,
            type: types[i],
            palette: palettes[i],
            fruitVariant: Math.floor(Math.random() * 3), // 0: mango, 1: passionfruit, 2: dragonfruit
            jitterX: jx,
            jitterY: jy,
            baseX,
            baseY,
            x: baseX + W * 0.35,
            y: baseY - H * 0.08,
            snagX: baseX,
            snagY: baseY,
            enterProgress: 0,
            enterDelay: i * 0.09,
            exiting: false,
            exitProgress: 0,
            phase: Math.random() * Math.PI * 2,
            wingSpeed: 9 + Math.random() * 5,
            hoverAmount: 0,
            scale: 1,
            caught: false,
            removed: false
          };
        });
      }

      function triggerNextWaveSkip() {
        if (chameleon.tongueState !== 'idle') {
          chameleon.tongueState = 'idle';
          chameleon.targetCarrier = null;
          chameleon.caughtCarrier = null;
          chameleon.mouthOpen = 0;
        }
        audio.playLeafWhoosh();
        // Smooth exit burst of leaves/sparkles from current carriers
        for (const c of carriers) {
          if (!c.removed) {
            spawnCatchBurst(c.x, c.y, c.palette, 10);
          }
        }
        spawnNewWave(true);
      }

      function checkWaveCompletion() {
        const remaining = carriers.filter(c => !c.removed);
        if (remaining.length === 0 && !waveTransitioning) {
          waveTransitioning = true;
          triggerWaveCelebration();
          setTimeout(() => {
            spawnNewWave(false);
          }, 1750);
        }
      }

      function updateCarriers(dt, t) {
        hoveredCarrier = null;
        for (const c of carriers) {
          if (c.removed) continue;
          if (c.caught) continue;

          if (c.enterDelay > 0) {
            c.enterDelay -= dt;
          } else if (c.enterProgress < 1) {
            c.enterProgress = Math.min(1, c.enterProgress + dt * 1.9);
          }

          const easeEnter = 1 - Math.pow(1 - c.enterProgress, 3);
          const bobX = Math.sin(t * 1.45 + c.phase) * 12 * S;
          const bobY = Math.cos(t * 1.9 + c.phase * 1.3) * 10 * S;
          const targetX = c.baseX + bobX;
          const targetY = c.baseY + bobY;

          c.x = lerp(c.baseX + W * 0.34, targetX, easeEnter);
          c.y = lerp(c.baseY - H * 0.08, targetY, easeEnter);

          const hitRadius = 96 * S;
          const dist = Math.hypot(pointer.x - c.x, pointer.y - c.y);
          const isHover = dist < hitRadius && c.enterProgress > 0.65;
          if (isHover) hoveredCarrier = c;

          c.hoverAmount += ((isHover ? 1 : 0) - c.hoverAmount) * Math.min(1, dt * 12);
          c.scale = (0.35 + 0.65 * easeEnter) * (1 + c.hoverAmount * 0.1);
        }

        canvas.style.cursor = hoveredCarrier ? 'pointer' : 'crosshair';
      }

      /* ======================================================================
         8. ACTIVE, DIVERSE VISUAL REACTIONS (6 DISTINCT + WAVE CELEBRATION)
         ====================================================================== */
      const reactions = [];
      const particles = [];
      let lastReactionIndex = -1;

      function spawnCatchBurst(x, y, palette, count = 20) {
        for (let i = 0; i < count; i++) {
          const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
          const spd = (65 + Math.random() * 195) * S;
          particles.push({
            x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 40 * S,
            r: (3 + Math.random() * 5.5) * S,
            color: i % 2 === 0 ? lerpRGB(palette.mid, [255,255,255], 0.25) : lerpRGB(palette.accent, [255,255,255], 0.2),
            life: 0,
            maxLife: 0.45 + Math.random() * 0.4,
            kind: 'spark'
          });
        }
      }

      function triggerRandomReaction(x, y, palette) {
        const types = ['frog', 'hummingbird', 'hibiscus', 'rainbow', 'bubbles', 'fireflies'];
        let idx = Math.floor(Math.random() * types.length);
        if (idx === lastReactionIndex) idx = (idx + 1) % types.length;
        lastReactionIndex = idx;
        const type = types[idx];

        audio.playReactionSound(type);

        if (type === 'frog') {
          reactions.push({
            type: 'frog',
            t: 0,
            duration: 1.55,
            startX: W * 0.08,
            endX: W * 0.92,
            splashed: false
          });
        } else if (type === 'hummingbird') {
          reactions.push({
            type: 'hummingbird',
            t: 0,
            duration: 2.1,
            fromRight: Math.random() > 0.4,
            hoverY: H * (0.22 + Math.random() * 0.26)
          });
        } else if (type === 'hibiscus') {
          reactions.push({
            type: 'hibiscus',
            t: 0,
            duration: 2.2,
            x: W * (0.86 + Math.random() * 0.06),
            y: H * (0.76 + Math.random() * 0.06),
            palette,
            petalsReleased: false
          });
        } else if (type === 'rainbow') {
          reactions.push({
            type: 'rainbow',
            t: 0,
            duration: 2.4
          });
        } else if (type === 'bubbles') {
          const anchor = getChameleonAnchor();
          const bubs = Array.from({ length: 16 }, () => ({
            x: anchor.x + (Math.random() - 0.2) * 260 * S,
            y: anchor.y + (Math.random() - 0.5) * 90 * S,
            r: (10 + Math.random() * 20) * S,
            vy: -(75 + Math.random() * 115) * S,
            wobble: Math.random() * Math.PI * 2,
            popAt: 0.65 + Math.random() * 0.35,
            popped: false
          }));
          reactions.push({ type: 'bubbles', t: 0, duration: 2.0, bubs });
        } else if (type === 'fireflies') {
          const flies = Array.from({ length: 22 }, (_, i) => ({
            angle: (Math.PI * 2 * i) / 22,
            radius: (55 + Math.random() * 125) * S,
            speed: 2.2 + Math.random() * 2.2,
            yOff: (Math.random() - 0.5) * 95 * S,
            size: (2.8 + Math.random() * 3.5) * S
          }));
          reactions.push({ type: 'fireflies', t: 0, duration: 2.2, flies });
        }
      }

      function triggerWaveCelebration() {
        audio.playWaveCelebration();
        // Shimmering waterfall rainbow + sweeping flock of realistic butterflies
        reactions.push({ type: 'rainbow', t: 0, duration: 2.6 });
        const flock = Array.from({ length: 14 }, (_, i) => ({
          x: -80 * S - i * 48 * S,
          y: H * (0.18 + Math.random() * 0.56),
          vx: (360 + Math.random() * 200) * S,
          phase: Math.random() * Math.PI * 2,
          scale: (0.48 + Math.random() * 0.42) * S,
          palette: PALETTES[i % PALETTES.length]
        }));
        reactions.push({ type: 'celebrationFlock', t: 0, duration: 2.8, flock });
      }

      function updateReactionsAndParticles(dt) {
        for (let i = reactions.length - 1; i >= 0; i--) {
          const r = reactions[i];
          r.t += dt;
          if (r.type === 'frog' && !r.splashed && r.t / r.duration > 0.62) {
            r.splashed = true;
            const sx = lerp(r.startX, r.endX, 0.62);
            waterRipples.push({ x: sx, y: H * 0.89, r: 4, maxR: 64 * S, alpha: 0.9 });
            for (let k = 0; k < 12; k++) {
              particles.push({
                x: sx, y: H * 0.89,
                vx: (Math.random() - 0.5) * 160 * S,
                vy: -(110 + Math.random() * 140) * S,
                r: (2.5 + Math.random() * 3) * S,
                color: 'rgba(195, 248, 255, 0.9)',
                life: 0, maxLife: 0.55, kind: 'drop'
              });
            }
          }
          if (r.type === 'hibiscus' && !r.petalsReleased && r.t > 0.65) {
            r.petalsReleased = true;
            for (let k = 0; k < 14; k++) {
              particles.push({
                x: r.x, y: r.y,
                vx: -(50 + Math.random() * 160) * S,
                vy: -(60 + Math.random() * 130) * S,
                r: (6 + Math.random() * 6) * S,
                rot: Math.random() * Math.PI * 2,
                vrot: (Math.random() - 0.5) * 5,
                color: lerpRGB(r.palette.mid, [255, 220, 235], 0.25),
                life: 0, maxLife: 1.4, kind: 'petal'
              });
            }
          }
          if (r.type === 'bubbles') {
            const p = r.t / r.duration;
            for (const b of r.bubs) {
              if (!b.popped) {
                b.y += b.vy * dt;
                b.x += Math.sin(r.t * 4.5 + b.wobble) * 28 * S * dt;
                if (p >= b.popAt) {
                  b.popped = true;
                  for (let k = 0; k < 5; k++) {
                    const ang = (Math.PI * 2 * k) / 5;
                    particles.push({
                      x: b.x, y: b.y,
                      vx: Math.cos(ang) * 55 * S,
                      vy: Math.sin(ang) * 55 * S,
                      r: 2.4 * S,
                      color: 'rgba(215, 255, 255, 0.95)',
                      life: 0, maxLife: 0.3, kind: 'spark'
                    });
                  }
                }
              }
            }
          }
          if (r.type === 'celebrationFlock') {
            for (const b of r.flock) {
              b.x += b.vx * dt;
              b.y += Math.sin(r.t * 5.2 + b.phase) * 75 * S * dt;
            }
          }
          if (r.t >= r.duration) {
            reactions.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.kind === 'drop') p.vy += 460 * S * dt;
          else if (p.kind === 'petal') {
            p.vy += 45 * S * dt;
            p.vx *= 0.985;
            p.rot += p.vrot * dt;
          } else {
            p.vx *= 0.94;
            p.vy *= 0.94;
          }
          if (p.life >= p.maxLife) particles.splice(i, 1);
        }
      }

      /* ======================================================================
         9. LAYERED TROPICAL RAINFOREST RENDERING
         ====================================================================== */
      function drawBackground(t) {
        // 1. Deep Atmospheric Jungle Canopy Sky Gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#092d1e');
        bgGrad.addColorStop(0.32, '#134c31');
        bgGrad.addColorStop(0.68, '#0c3925');
        bgGrad.addColorStop(1, '#062016');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Warm sunlit canopy glow in upper-center
        const sunGlow = ctx.createRadialGradient(W * 0.56, H * 0.08, 10, W * 0.56, H * 0.22, W * 0.58);
        sunGlow.addColorStop(0, 'rgba(218, 248, 152, 0.28)');
        sunGlow.addColorStop(0.45, 'rgba(92, 186, 108, 0.12)');
        sunGlow.addColorStop(1, 'rgba(10, 48, 28, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, W, H);

        // 2. Distant Jungle Ridge & Silhouette Trees
        ctx.save();
        ctx.fillStyle = '#0b3220';
        ctx.beginPath();
        ctx.moveTo(0, H * 0.58);
        ctx.bezierCurveTo(W * 0.2, H * 0.44, W * 0.38, H * 0.48, W * 0.48, H * 0.56);
        ctx.lineTo(W * 0.48, H);
        ctx.lineTo(0, H);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(W * 0.57, H * 0.54);
        ctx.bezierCurveTo(W * 0.72, H * 0.42, W * 0.88, H * 0.45, W, H * 0.52);
        ctx.lineTo(W, H);
        ctx.lineTo(W * 0.57, H);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 3. Distant Cascading Waterfall
        drawWaterfall(t);

        // 4. Volumetric Drifting Sunbeams (God Rays)
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (let i = 0; i < 5; i++) {
          const bx = W * (0.24 + i * 0.16) + Math.sin(t * 0.28 + i * 1.4) * 32 * S;
          const beamW = (75 + (i % 3) * 38) * S;
          const rayGrad = ctx.createLinearGradient(bx, 0, bx + 140 * S, H * 0.88);
          rayGrad.addColorStop(0, 'rgba(235, 255, 178, 0.11)');
          rayGrad.addColorStop(0.55, 'rgba(182, 240, 142, 0.05)');
          rayGrad.addColorStop(1, 'rgba(120, 210, 130, 0)');
          ctx.fillStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(bx - beamW * 0.4, 0);
          ctx.lineTo(bx + beamW * 0.4, 0);
          ctx.lineTo(bx + 190 * S + beamW, H * 0.92);
          ctx.lineTo(bx + 190 * S - beamW * 0.7, H * 0.92);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // 5. Midground Hanging Vines & Swaying Monstera / Fern Foliage
        drawHangingVines(t);
        drawBackgroundFoliage(t);

        // 6. Rippling Jungle Stream at Bottom
        drawJungleStream(t);

        // 7. Floating Golden Pollen Motes
        ctx.save();
        for (const p of pollen) {
          const px = p.x * W;
          const py = p.y * H;
          const pulse = 0.65 + 0.35 * Math.sin(t * 2.2 + p.phase);
          const g = ctx.createRadialGradient(px, py, 0, px, py, p.r * 3 * S);
          g.addColorStop(0, `rgba(255, 246, 176, ${p.alpha * pulse})`);
          g.addColorStop(1, 'rgba(255, 224, 110, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(px, py, p.r * 3 * S, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawWaterfall(t) {
        const wfX = W * 0.485;
        const wfW = W * 0.075;
        const wfTop = H * 0.32;
        const wfBot = H * 0.84;

        ctx.save();
        // Cliff rocks flanking waterfall
        ctx.fillStyle = '#153629';
        ctx.beginPath();
        ctx.moveTo(wfX - 36 * S, wfTop - 10 * S);
        ctx.lineTo(wfX + wfW + 38 * S, wfTop - 14 * S);
        ctx.lineTo(wfX + wfW + 58 * S, wfBot + 10 * S);
        ctx.lineTo(wfX - 52 * S, wfBot + 10 * S);
        ctx.closePath();
        ctx.fill();

        // Main shimmering waterfall body
        const wfGrad = ctx.createLinearGradient(wfX, wfTop, wfX, wfBot);
        wfGrad.addColorStop(0, 'rgba(175, 242, 238, 0.42)');
        wfGrad.addColorStop(0.5, 'rgba(135, 226, 228, 0.34)');
        wfGrad.addColorStop(1, 'rgba(205, 250, 248, 0.56)');
        ctx.fillStyle = wfGrad;
        ctx.fillRect(wfX, wfTop, wfW, wfBot - wfTop);

        // Animated falling water streaks
        ctx.strokeStyle = 'rgba(235, 255, 255, 0.36)';
        ctx.lineCap = 'round';
        for (let i = 0; i < 9; i++) {
          const sx = wfX + (i + 0.5) * (wfW / 9);
          const offset = ((t * (110 + (i % 3) * 35) + i * 73) % (wfBot - wfTop));
          const len = (36 + (i % 4) * 18) * S;
          ctx.lineWidth = (1.5 + (i % 2) * 1.4) * S;
          ctx.beginPath();
          ctx.moveTo(sx, wfTop + offset);
          ctx.lineTo(sx, Math.min(wfBot, wfTop + offset + len));
          ctx.stroke();
        }

        // Rising waterfall mist particles
        for (const m of waterfallMist) {
          const alpha = Math.sin(m.life * Math.PI) * 0.24;
          const mx = m.x * W;
          const my = m.y * H;
          const mr = m.r * (0.7 + m.life * 0.8) * S;
          const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr);
          mg.addColorStop(0, `rgba(218, 252, 248, ${alpha})`);
          mg.addColorStop(1, 'rgba(180, 240, 235, 0)');
          ctx.fillStyle = mg;
          ctx.beginPath();
          ctx.arc(mx, my, mr, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawHangingVines(t) {
        const vines = [
          { x: 0.14, len: 0.36, amp: 14, ph: 0.3 },
          { x: 0.35, len: 0.28, amp: 11, ph: 1.7 },
          { x: 0.67, len: 0.31, amp: 13, ph: 2.9 },
          { x: 0.91, len: 0.42, amp: 16, ph: 4.1 }
        ];
        ctx.save();
        for (const v of vines) {
          const x0 = v.x * W;
          const sway = Math.sin(t * 0.9 + v.ph) * v.amp * S;
          const yEnd = v.len * H;
          ctx.strokeStyle = '#185432';
          ctx.lineWidth = 3 * S;
          ctx.beginPath();
          ctx.moveTo(x0, -10);
          ctx.quadraticCurveTo(x0 + sway * 0.6, yEnd * 0.5, x0 + sway, yEnd);
          ctx.stroke();

          // Small heart-shaped vine leaves along stem
          for (let k = 1; k <= 5; k++) {
            const f = k / 5.5;
            const lx = x0 + sway * f * f;
            const ly = yEnd * f;
            const side = k % 2 === 0 ? 1 : -1;
            ctx.save();
            ctx.translate(lx, ly);
            ctx.rotate(side * 0.65 + Math.sin(t * 1.4 + k) * 0.08);
            ctx.fillStyle = k % 2 === 0 ? '#247542' : '#1b6036';
            ctx.beginPath();
            ctx.ellipse(side * 10 * S, 0, 12 * S, 6.5 * S, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
        ctx.restore();
      }

      function drawMonsteraLeaf(x, y, size, angle, colorDark, colorLight) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        const grad = ctx.createLinearGradient(0, 0, size, 0);
        grad.addColorStop(0, colorDark);
        grad.addColorStop(1, colorLight);
        ctx.fillStyle = grad;

        // Organic lobed tropical leaf silhouette
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(size * 0.25, -size * 0.48, size * 0.72, -size * 0.44, size, 0);
        ctx.bezierCurveTo(size * 0.72, size * 0.44, size * 0.25, size * 0.48, 0, 0);
        ctx.fill();

        // Central vein & side veins
        ctx.strokeStyle = 'rgba(168, 242, 160, 0.22)';
        ctx.lineWidth = Math.max(1.2, size * 0.018);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(size * 0.92, 0);
        ctx.stroke();

        for (let i = 1; i <= 4; i++) {
          const vx = size * (0.18 * i);
          ctx.beginPath();
          ctx.moveTo(vx, 0);
          ctx.quadraticCurveTo(vx + size * 0.09, -size * 0.16, vx + size * 0.16, -size * 0.26);
          ctx.moveTo(vx, 0);
          ctx.quadraticCurveTo(vx + size * 0.09, size * 0.16, vx + size * 0.16, size * 0.26);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawFernFrond(x, y, len, angle, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2.2 * S;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.5, -len * 0.12, len, 0);
        ctx.stroke();

        const pairs = 11;
        for (let i = 1; i < pairs; i++) {
          const f = i / pairs;
          const px = len * f;
          const py = -Math.sin(f * Math.PI) * len * 0.06;
          const leafletLen = len * 0.22 * Math.sin(f * Math.PI);
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.ellipse(
              px + leafletLen * 0.25,
              py + side * leafletLen * 0.52,
              leafletLen * 0.55,
              leafletLen * 0.18,
              side * 1.15,
              0, Math.PI * 2
            );
            ctx.fill();
          }
        }
        ctx.restore();
      }

      function drawBackgroundFoliage(t) {
        const sway1 = Math.sin(t * 0.85) * 0.045;
        const sway2 = Math.cos(t * 0.72 + 1.1) * 0.05;

        // Top-left & top-right canopy leaves
        drawMonsteraLeaf(-20 * S, H * 0.1, 210 * S, 0.35 + sway1, '#0d3e24', '#1e6e3e');
        drawMonsteraLeaf(W * 0.08, -20 * S, 190 * S, 1.05 + sway2, '#114a2b', '#288549');
        drawMonsteraLeaf(W + 20 * S, H * 0.08, 225 * S, 2.75 - sway1, '#0d3d23', '#1f6e3d');
        drawMonsteraLeaf(W * 0.86, -15 * S, 180 * S, 2.1 - sway2, '#124c2b', '#298348');

        // Bottom-left & bottom-right ferns framing the stream
        drawFernFrond(-10 * S, H * 0.92, 230 * S, -0.45 + sway1, '#124e2d');
        drawFernFrond(W * 0.12, H * 0.98, 195 * S, -0.82 + sway2, '#1b6b3b');
        drawFernFrond(W + 10 * S, H * 0.90, 240 * S, -2.65 - sway1, '#124c2b');
        drawFernFrond(W * 0.88, H * 0.98, 200 * S, -2.25 - sway2, '#1d6f3d');
      }

      function drawJungleStream(t) {
        const streamTop = H * 0.84;
        ctx.save();
        const streamGrad = ctx.createLinearGradient(0, streamTop, 0, H);
        streamGrad.addColorStop(0, '#0a3a36');
        streamGrad.addColorStop(0.35, '#0e524a');
        streamGrad.addColorStop(1, '#062624');
        ctx.fillStyle = streamGrad;
        ctx.fillRect(0, streamTop, W, H - streamTop);

        // Shimmering light caustics across the water surface
        ctx.strokeStyle = 'rgba(162, 248, 236, 0.16)';
        ctx.lineCap = 'round';
        for (let i = 0; i < 16; i++) {
          const cy = streamTop + ((i + 0.5) / 16) * (H - streamTop);
          const cx = ((i * 173 + t * (28 + (i % 4) * 10)) % (W + 160)) - 80;
          const cw = (45 + (i % 5) * 24) * S;
          ctx.lineWidth = (1.5 + (i % 2)) * S;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.quadraticCurveTo(cx + cw * 0.5, cy + Math.sin(t * 2.5 + i) * 3 * S, cx + cw, cy);
          ctx.stroke();
        }

        // Falling raindrops
        ctx.fillStyle = 'rgba(205, 250, 255, 0.78)';
        for (const d of fallingDrops) {
          ctx.beginPath();
          ctx.ellipse(d.x, d.y, 2 * S, 6.5 * S, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Expanding water ripples
        for (const r of waterRipples) {
          ctx.strokeStyle = `rgba(195, 252, 248, ${r.alpha})`;
          ctx.lineWidth = 1.6 * S;
          ctx.beginPath();
          ctx.ellipse(r.x, r.y, r.r, r.r * 0.28, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      /* ======================================================================
         10. MOSSY TREE BRANCH & REALISTIC CHAMELEON RENDERING
         ====================================================================== */
      function drawMossyBranch(t) {
        const anchor = getChameleonAnchor();
        const bx = anchor.x;
        const by = anchor.y;
        const sc = S;

        ctx.save();
        // Main textured bark branch extending from left screen edge
        const branchGrad = ctx.createLinearGradient(0, by - 20 * sc, 0, by + 85 * sc);
        branchGrad.addColorStop(0, '#6a4b32');
        branchGrad.addColorStop(0.35, '#4b321f');
        branchGrad.addColorStop(1, '#28190e');

        ctx.fillStyle = branchGrad;
        ctx.beginPath();
        ctx.moveTo(-25 * sc, by + 58 * sc);
        ctx.bezierCurveTo(bx * 0.45, by + 30 * sc, bx * 0.92, by + 10 * sc, bx + 185 * sc, by + 22 * sc);
        ctx.quadraticCurveTo(bx + 206 * sc, by + 28 * sc, bx + 182 * sc, by + 44 * sc);
        ctx.bezierCurveTo(bx * 0.9, by + 52 * sc, bx * 0.45, by + 78 * sc, -25 * sc, by + 118 * sc);
        ctx.closePath();
        ctx.fill();

        // Bark grooves & organic ridges
        ctx.strokeStyle = 'rgba(26, 14, 6, 0.55)';
        ctx.lineWidth = 2.2 * sc;
        for (let i = 0; i < 6; i++) {
          const yOff = (28 + i * 11) * sc;
          ctx.beginPath();
          ctx.moveTo(-10 * sc, by + yOff + 28 * sc);
          ctx.bezierCurveTo(bx * 0.45, by + yOff + 8 * sc, bx * 0.95, by + yOff - 5 * sc, bx + 150 * sc, by + yOff + 4 * sc);
          ctx.stroke();
        }

        // Sunlit velvet moss cushions along top of branch
        const mossSpots = [
          { x: bx - 165 * sc, y: by + 42 * sc, rx: 46 * sc, ry: 12 * sc },
          { x: bx - 72 * sc, y: by + 25 * sc, rx: 52 * sc, ry: 13 * sc },
          { x: bx + 60 * sc, y: by + 19 * sc, rx: 44 * sc, ry: 10 * sc },
          { x: bx + 148 * sc, y: by + 23 * sc, rx: 30 * sc, ry: 8 * sc }
        ];
        for (const m of mossSpots) {
          const mg = ctx.createRadialGradient(m.x, m.y - m.ry * 0.4, 2, m.x, m.y, m.rx);
          mg.addColorStop(0, '#6ed152');
          mg.addColorStop(0.55, '#3b8c32');
          mg.addColorStop(1, 'rgba(28, 72, 24, 0)');
          ctx.fillStyle = mg;
          ctx.beginPath();
          ctx.ellipse(m.x, m.y, m.rx, m.ry, -0.06, 0, Math.PI * 2);
          ctx.fill();
        }

        // Tiny realistic shelf-mushrooms (polypores) on the lower bark
        const shrooms = [
          { x: bx - 120 * sc, y: by + 68 * sc, w: 30 * sc, h: 12 * sc },
          { x: bx - 98 * sc, y: by + 78 * sc, w: 22 * sc, h: 9 * sc },
          { x: bx - 134 * sc, y: by + 81 * sc, w: 18 * sc, h: 8 * sc }
        ];
        for (const sh of shrooms) {
          const sg = ctx.createLinearGradient(sh.x - sh.w, sh.y, sh.x + sh.w, sh.y);
          sg.addColorStop(0, '#c27b38');
          sg.addColorStop(0.6, '#e8b36d');
          sg.addColorStop(1, '#f7dfb3');
          ctx.fillStyle = sg;
          ctx.beginPath();
          ctx.ellipse(sh.x, sh.y, sh.w, sh.h, 0.08, Math.PI, Math.PI * 2);
          ctx.ellipse(sh.x, sh.y, sh.w, sh.h * 0.45, 0.08, 0, Math.PI);
          ctx.fill();
          ctx.strokeStyle = 'rgba(116, 62, 20, 0.45)';
          ctx.lineWidth = 1.2 * sc;
          ctx.beginPath();
          ctx.ellipse(sh.x, sh.y - sh.h * 0.15, sh.w * 0.65, sh.h * 0.35, 0.08, Math.PI, Math.PI * 2);
          ctx.stroke();
        }

        // Small sprouting twig with fresh leaves at the tip of the branch
        const twigSway = Math.sin(t * 1.6) * 0.07;
        drawMonsteraLeaf(bx + 178 * sc, by + 26 * sc, 58 * sc, -0.55 + twigSway, '#2b8a3e', '#76d964');
        drawMonsteraLeaf(bx + 184 * sc, by + 32 * sc, 44 * sc, 0.25 - twigSway, '#1f7032', '#5cc452');
        ctx.restore();
      }

      function drawChameleon(t) {
        const anchor = getChameleonAnchor();
        const sc = S * 1.02;
        const breathe = Math.sin(t * 2.4) * 2.8;
        const happyBob = chameleon.happyTimer > 0 ? Math.sin(t * 16) * 4 * (chameleon.happyTimer / 1.6) : 0;

        ctx.save();
        ctx.translate(anchor.x, anchor.y + happyBob * sc);
        ctx.scale(sc, sc);

        // 1. Back Legs (behind body, gripping the branch)
        drawChameleonLeg(-36, 10, -28, 30, 0.65, true);
        drawChameleonLeg(54, 4, 62, 24, 0.32, true);

        // 2. Coiled Prehensile Tail (gently sways and curls tighter when happy)
        const tailCurl = 0.08 * Math.sin(t * 1.7) + (chameleon.happyTimer > 0 ? 0.22 : 0);
        ctx.save();
        ctx.translate(-86, 12);
        ctx.rotate(tailCurl);
        ctx.lineCap = 'round';
        // Outer shadow
        ctx.strokeStyle = getMorphColor('stripe', 0.92, 0.9);
        ctx.lineWidth = 22;
        ctx.beginPath();
        for (let a = 0; a <= Math.PI * 3.15; a += 0.14) {
          const rad = 46 * Math.exp(-a * 0.17);
          const tx = -Math.sin(a) * rad;
          const ty = 22 - Math.cos(a) * rad + 22;
          if (a === 0) ctx.moveTo(0, 0);
          else ctx.lineTo(tx, ty);
        }
        ctx.stroke();

        // Highlighted inner tail coil
        for (let step = 0; step < 36; step++) {
          const f = step / 35;
          const a = f * Math.PI * 3.15;
          const rad = 46 * Math.exp(-a * 0.17);
          const tx = f === 0 ? 0 : -Math.sin(a) * rad;
          const ty = f === 0 ? 0 : 22 - Math.cos(a) * rad + 22;
          const w = lerp(19, 3.5, f);
          ctx.fillStyle = getMorphColor('mid', 0.78 + f * 0.22);
          ctx.beginPath();
          ctx.arc(tx, ty, w * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 3. Arched Organic Body
        const bodyGrad = ctx.createLinearGradient(120, -78, -90, 26);
        bodyGrad.addColorStop(0, getMorphColor('top', 0.15));
        bodyGrad.addColorStop(0.45, getMorphColor('mid', 0.45));
        bodyGrad.addColorStop(0.85, getMorphColor('mid', 0.75));
        bodyGrad.addColorStop(1, getMorphColor('top', 0.92));

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(-88, 8);
        ctx.bezierCurveTo(-82, -48 - breathe, -12, -88 - breathe, 64, -62 - breathe * 0.6);
        ctx.bezierCurveTo(88, -54, 102, -32, 92, -4);
        ctx.bezierCurveTo(70, 22 + breathe * 0.6, -24, 28 + breathe * 0.5, -88, 8);
        ctx.closePath();
        ctx.fillStyle = bodyGrad;
        ctx.fill();

        // Clip to body for ventral belly shading, stripes, scales & chromatic shimmer wave
        ctx.clip();

        // Soft ventral belly gradient
        const bellyGrad = ctx.createLinearGradient(0, -10, 0, 30);
        bellyGrad.addColorStop(0, 'rgba(255,255,255,0)');
        bellyGrad.addColorStop(1, getMorphColor('belly', 0.48, 0.85));
        ctx.fillStyle = bellyGrad;
        ctx.fillRect(-100, -15, 220, 55);

        // Organic camouflage vertical/diagonal bands
        for (let i = 0; i < 6; i++) {
          const sx = -58 + i * 26;
          const u = clamp(1 - (sx + 88) / 185, 0, 1);
          ctx.fillStyle = getMorphColor('stripe', u, 0.34);
          ctx.beginPath();
          ctx.ellipse(sx, -26, 9, 44, -0.22, 0, Math.PI * 2);
          ctx.fill();
        }

        // Subtle lifelike scale texture dots
        for (let row = 0; row < 6; row++) {
          for (let col = 0; col < 15; col++) {
            const dx = -78 + col * 12 + (row % 2) * 6;
            const dy = -64 + row * 14;
            ctx.fillStyle = (row + col) % 3 === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)';
            ctx.beginPath();
            ctx.arc(dx, dy, 2.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Luminous iridescent wavefront during color morphing
        if (chameleon.morphProgress < 1.35) {
          const waveX = lerp(140, -100, chameleon.morphProgress);
          const wg = ctx.createLinearGradient(waveX - 28, 0, waveX + 28, 0);
          wg.addColorStop(0, 'rgba(255,255,255,0)');
          wg.addColorStop(0.5, lerpRGB(chameleon.currPalette.accent, [255,255,255], 0.35, 0.55));
          wg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = wg;
          ctx.fillRect(waveX - 30, -95, 60, 140);
        }

        // Sunbeam rim light along the curved dorsal spine
        ctx.strokeStyle = 'rgba(240, 255, 196, 0.42)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-82, 0);
        ctx.bezierCurveTo(-72, -48 - breathe, -8, -84 - breathe, 64, -58 - breathe * 0.6);
        ctx.stroke();
        ctx.restore();

        // Dorsal crest ridges (tiny realistic spikes along back)
        for (let i = 0; i < 11; i++) {
          const f = i / 10;
          const rx = lerp(-68, 56, f);
          const ry = -32 - Math.sin(f * Math.PI) * (40 + breathe) - f * 18;
          const u = clamp(1 - f, 0, 1);
          ctx.fillStyle = getMorphColor('accent', u, 0.88);
          ctx.beginPath();
          ctx.moveTo(rx - 4, ry + 4);
          ctx.lineTo(rx, ry - 5);
          ctx.lineTo(rx + 4, ry + 4);
          ctx.closePath();
          ctx.fill();
        }

        // 4. Sculpted Head with Casque Crest & Hinged Jaw
        ctx.save();
        ctx.translate(78, -42);

        // Lower jaw (opens smoothly when firing tongue)
        ctx.save();
        ctx.translate(18, 12);
        ctx.rotate(chameleon.mouthOpen * 0.44);
        ctx.fillStyle = getMorphColor('belly', 0.08);
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.quadraticCurveTo(22, 16, 52, 6);
        ctx.lineTo(48, -2);
        ctx.lineTo(-10, -4);
        ctx.closePath();
        ctx.fill();
        // Mouth interior when open
        if (chameleon.mouthOpen > 0.08) {
          ctx.fillStyle = '#a8324a';
          ctx.beginPath();
          ctx.ellipse(22, -2, 22, 7 * chameleon.mouthOpen, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Upper head & iconic chameleon casque (helmet crest)
        const headGrad = ctx.createLinearGradient(-15, -42, 72, 20);
        headGrad.addColorStop(0, getMorphColor('top', 0.1));
        headGrad.addColorStop(0.55, getMorphColor('mid', 0.05));
        headGrad.addColorStop(1, getMorphColor('belly', 0.02));
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.moveTo(-14, 10);
        ctx.bezierCurveTo(-18, -24, 2, -48, 22, -48); // Tall casque crest
        ctx.bezierCurveTo(36, -48, 44, -22, 62, -6);  // Snout ridge
        ctx.quadraticCurveTo(76, 4, 68, 14);          // Tip of nose
        ctx.lineTo(14, 14);
        ctx.closePath();
        ctx.fill();

        // Casque golden rim highlight
        ctx.strokeStyle = getMorphColor('accent', 0.05, 0.72);
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(4, -36);
        ctx.quadraticCurveTo(22, -49, 34, -30);
        ctx.stroke();

        // Nostril
        ctx.fillStyle = 'rgba(20, 35, 20, 0.65)';
        ctx.beginPath();
        ctx.ellipse(58, 2, 2.5, 1.6, 0.2, 0, Math.PI * 2);
        ctx.fill();

        // 5. Independent Turret Eye (conical scaly eyelid + tracking pupil)
        const ex = 34;
        const ey = -4;
        const eyeGrad = ctx.createRadialGradient(ex - 4, ey - 4, 2, ex, ey, 17);
        eyeGrad.addColorStop(0, getMorphColor('accent', 0.03));
        eyeGrad.addColorStop(0.55, getMorphColor('mid', 0.04));
        eyeGrad.addColorStop(1, getMorphColor('stripe', 0.06));
        ctx.fillStyle = eyeGrad;
        ctx.beginPath();
        ctx.arc(ex, ey, 16.5, 0, Math.PI * 2);
        ctx.fill();

        // Concentric scaly eyelid rings
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(ex, ey, 12.5, 0, Math.PI * 2);
        ctx.stroke();

        // Moving pupil inside the turret cone
        const px = ex + Math.cos(chameleon.eyeAngle) * 5.2;
        const py = ey + Math.sin(chameleon.eyeAngle) * 5.2;
        ctx.fillStyle = '#0e1612';
        ctx.beginPath();
        ctx.arc(px, py, 6.2, 0, Math.PI * 2);
        ctx.fill();

        // Glossy amber iris rim
        ctx.strokeStyle = '#ffcb4d';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(px, py, 6.4, 0, Math.PI * 2);
        ctx.stroke();

        // Crisp white specular catchlight
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px - 2.1, py - 2.2, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore(); // end head

        // 6. Front Legs (wrapping realistically around the mossy branch)
        drawChameleonLeg(-46, 12, -38, 34, 0.62, false);
        drawChameleonLeg(44, 6, 56, 28, 0.28, false);

        ctx.restore();

        // 7. Elastic Pink Tongue (drawn in world coordinates when shooting/retracting)
        if (chameleon.tongueState === 'shooting' || chameleon.tongueState === 'retracting') {
          drawElasticTongue();
        }
      }

      function drawChameleonLeg(sx, sy, gx, gy, morphU, isBack) {
        ctx.save();
        const alpha = isBack ? 0.72 : 1;
        ctx.strokeStyle = isBack ? getMorphColor('stripe', morphU, alpha) : getMorphColor('mid', morphU, alpha);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = isBack ? 12 : 14;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.quadraticCurveTo((sx + gx) * 0.5 - 8, (sy + gy) * 0.5 + 4, gx, gy);
        ctx.stroke();

        // Zygodactyl grasping mitten toes gripping the branch
        ctx.fillStyle = isBack ? getMorphColor('stripe', morphU, alpha) : getMorphColor('belly', morphU, alpha);
        ctx.beginPath();
        ctx.ellipse(gx - 5, gy + 3, 7, 4.5, 0.4, 0, Math.PI * 2);
        ctx.ellipse(gx + 6, gy + 2, 7.5, 4.5, -0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawElasticTongue() {
        const mx = chameleon.mouthPos.x;
        const my = chameleon.mouthPos.y;
        const tx = chameleon.tongueTip.x;
        const ty = chameleon.tongueTip.y;
        const midX = (mx + tx) * 0.5;
        const midY = (my + ty) * 0.5 + 10 * S;

        ctx.save();
        // Outer warm shadow
        ctx.strokeStyle = '#b5284c';
        ctx.lineWidth = 10 * S;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.quadraticCurveTo(midX, midY, tx, ty);
        ctx.stroke();

        // Glossy pink elastic core
        const tGrad = ctx.createLinearGradient(mx, my, tx, ty);
        tGrad.addColorStop(0, '#e85678');
        tGrad.addColorStop(0.6, '#ff86a4');
        tGrad.addColorStop(1, '#ff5c82');
        ctx.strokeStyle = tGrad;
        ctx.lineWidth = 6.5 * S;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.quadraticCurveTo(midX, midY, tx, ty);
        ctx.stroke();

        // Sticky bulbous tongue pad
        const padGrad = ctx.createRadialGradient(tx - 3 * S, ty - 3 * S, 1, tx, ty, 13 * S);
        padGrad.addColorStop(0, '#ffd4df');
        padGrad.addColorStop(0.45, '#ff688c');
        padGrad.addColorStop(1, '#ba294b');
        ctx.fillStyle = padGrad;
        ctx.beginPath();
        ctx.arc(tx, ty, 12 * S, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      /* ======================================================================
         11. ULTRA-DETAILED SYLLABLE CARRIER RENDERERS (5 TYPES + LARGE BADGE)
         ====================================================================== */
      function drawAllCarriers(t) {
        for (const c of carriers) {
          if (c.removed) continue;
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.scale(c.scale * S, c.scale * S);

          // Soft ambient hover glow
          if (c.hoverAmount > 0.02 && !c.caught) {
            const hg = ctx.createRadialGradient(0, 8, 16, 0, 8, 112);
            hg.addColorStop(0, lerpRGB(c.palette.accent, [255,255,255], 0.3, 0.38 * c.hoverAmount));
            hg.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = hg;
            ctx.beginPath();
            ctx.arc(0, 8, 112, 0, Math.PI * 2);
            ctx.fill();
          }

          const flapRate = c.wingSpeed + c.hoverAmount * 8;
          ctx.save();
          ctx.translate(0, -14);
          if (c.type === 'butterfly') drawRealisticButterfly(c.palette, t * flapRate + c.phase);
          else if (c.type === 'beetle') drawRealisticBeetle(c.palette, t + c.phase);
          else if (c.type === 'dragonfly') drawRealisticDragonfly(c.palette, t * 26 + c.phase);
          else if (c.type === 'blossom') drawRealisticBlossom(c.palette, t + c.phase);
          else drawRealisticFruit(c.palette, c.fruitVariant, t + c.phase);
          ctx.restore();

          // Large Stylized Organic Syllable Medallion (Dewdrop / Nectar Orb — NEVER a white box)
          if (!c.caught) {
            drawSyllableBadge(c.syllable, c.palette, c.hoverAmount);
          }

          ctx.restore();
        }
      }

      function drawRealisticButterfly(pal, phase) {
        const flap = 0.32 + 0.68 * Math.abs(Math.sin(phase * 0.5));
        ctx.save();
        ctx.translate(0, -18);

        for (const side of [-1, 1]) {
          ctx.save();
          ctx.scale(side * flap, 1);

          // Upper iridescent forewing
          const wg = ctx.createRadialGradient(28, -18, 4, 34, -14, 62);
          wg.addColorStop(0, lerpRGB(pal.accent, [255,255,255], 0.25));
          wg.addColorStop(0.45, lerpRGB(pal.mid, pal.top, 0.2));
          wg.addColorStop(0.84, lerpRGB(pal.top, pal.stripe, 0.55));
          wg.addColorStop(1, '#12181c');
          ctx.fillStyle = wg;
          ctx.beginPath();
          ctx.moveTo(0, -4);
          ctx.bezierCurveTo(22, -58, 72, -54, 66, -10);
          ctx.bezierCurveTo(60, 12, 24, 14, 0, 4);
          ctx.closePath();
          ctx.fill();

          // Lower hindwing
          const hwg = ctx.createRadialGradient(22, 22, 4, 24, 24, 46);
          hwg.addColorStop(0, lerpRGB(pal.mid, pal.accent, 0.25));
          hwg.addColorStop(0.75, lerpRGB(pal.top, pal.stripe, 0.45));
          hwg.addColorStop(1, '#12181c');
          ctx.fillStyle = hwg;
          ctx.beginPath();
          ctx.moveTo(0, 2);
          ctx.bezierCurveTo(44, 6, 56, 36, 30, 48);
          ctx.bezierCurveTo(12, 54, 2, 34, 0, 12);
          ctx.closePath();
          ctx.fill();

          // Wing veins
          ctx.strokeStyle = 'rgba(10, 16, 22, 0.42)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(4, -4); ctx.lineTo(54, -28);
          ctx.moveTo(4, -2); ctx.lineTo(56, -10);
          ctx.moveTo(4, 6); ctx.lineTo(36, 30);
          ctx.stroke();

          // Shimmering white/gold marginal dots
          ctx.fillStyle = 'rgba(255, 250, 225, 0.85)';
          ctx.beginPath();
          ctx.arc(54, -26, 3.2, 0, Math.PI * 2);
          ctx.arc(56, -14, 2.4, 0, Math.PI * 2);
          ctx.arc(36, 34, 2.6, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        // Thorax, abdomen & delicate curled antennae
        ctx.fillStyle = '#1b1d20';
        ctx.beginPath();
        ctx.ellipse(0, 4, 5.5, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, -18, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#1b1d20';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-2, -21); ctx.quadraticCurveTo(-12, -38, -18, -36);
        ctx.moveTo(2, -21); ctx.quadraticCurveTo(12, -38, 18, -36);
        ctx.stroke();
