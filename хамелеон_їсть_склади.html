        ctx.restore();
      }

      function drawRealisticBeetle(pal, phase) {
        ctx.save();
        ctx.translate(0, -18);
        ctx.rotate(Math.sin(phase * 1.4) * 0.08);

        // Animated jointed legs
        ctx.strokeStyle = '#1b1e1b';
        ctx.lineWidth = 2.6;
        ctx.lineCap = 'round';
        for (const side of [-1, 1]) {
          for (let i = 0; i < 3; i++) {
            const wiggle = Math.sin(phase * 5 + i * 1.8) * 3.5;
            const y0 = -10 + i * 14;
            ctx.beginPath();
            ctx.moveTo(side * 22, y0);
            ctx.lineTo(side * 38, y0 - 4 + wiggle);
            ctx.lineTo(side * 44, y0 + 10 + wiggle);
            ctx.stroke();
          }
        }

        // Metallic head & pronotum
        const headG = ctx.createRadialGradient(-4, -32, 2, 0, -28, 22);
        headG.addColorStop(0, lerpRGB(pal.accent, [255,255,255], 0.35));
        headG.addColorStop(0.6, lerpRGB(pal.top, pal.stripe, 0.25));
        headG.addColorStop(1, '#101814');
        ctx.fillStyle = headG;
        ctx.beginPath();
        ctx.ellipse(0, -24, 18, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Glossy domed jewel carapace
        const shellG = ctx.createRadialGradient(-12, -8, 4, 0, 6, 44);
        shellG.addColorStop(0, lerpRGB(pal.accent, [255,255,255], 0.55));
        shellG.addColorStop(0.28, lerpRGB(pal.mid, pal.accent, 0.15));
        shellG.addColorStop(0.72, lerpRGB(pal.top, pal.stripe, 0.2));
        shellG.addColorStop(1, lerpRGB(pal.stripe, [0,0,0], 0.5));
        ctx.fillStyle = shellG;
        ctx.beginPath();
        ctx.ellipse(0, 6, 30, 36, 0, 0, Math.PI * 2);
        ctx.fill();

        // Wing-case center seam
        ctx.strokeStyle = 'rgba(10, 14, 12, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(0, 41);
        ctx.stroke();

        // Crisp curved specular light reflection on dome
        ctx.fillStyle = 'rgba(255, 255, 255, 0.46)';
        ctx.beginPath();
        ctx.ellipse(-11, -4, 7.5, 16, -0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawRealisticDragonfly(pal, phase) {
        const flutter = Math.sin(phase) * 0.14;
        ctx.save();
        ctx.translate(0, -18);

        // Four translucent veined wings with rapid blur-flutter
        for (const side of [-1, 1]) {
          for (const pair of [0, 1]) {
            ctx.save();
            ctx.scale(side, 1);
            ctx.rotate((pair === 0 ? -0.22 : 0.14) + flutter * (pair === 0 ? 1 : -1));
            const wg = ctx.createLinearGradient(0, 0, 68, 0);
            wg.addColorStop(0, 'rgba(220, 252, 255, 0.58)');
            wg.addColorStop(0.6, lerpRGB(pal.belly, [255,255,255], 0.5, 0.36));
            wg.addColorStop(1, 'rgba(200, 248, 255, 0.18)');
            ctx.fillStyle = wg;
            ctx.strokeStyle = 'rgba(235, 255, 255, 0.55)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.ellipse(36, pair === 0 ? -6 : 6, 36, pair === 0 ? 10 : 8.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Delicate wing vein
            ctx.beginPath();
            ctx.moveTo(4, pair === 0 ? -6 : 6);
            ctx.lineTo(66, pair === 0 ? -6 : 6);
            ctx.stroke();
            ctx.restore();
          }
        }

        // Metallic segmented abdomen
        for (let i = 0; i < 6; i++) {
          const sy = 6 + i * 7.5;
          const sr = 5.2 - i * 0.45;
          ctx.fillStyle = i % 2 === 0 ? lerpRGB(pal.mid, pal.top, 0.2) : lerpRGB(pal.top, pal.stripe, 0.35);
          ctx.beginPath();
          ctx.ellipse(0, sy, sr, 4.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Iridescent thorax & large compound eyes
        const tg = ctx.createRadialGradient(-3, -10, 2, 0, -8, 12);
        tg.addColorStop(0, lerpRGB(pal.accent, [255,255,255], 0.3));
        tg.addColorStop(1, lerpRGB(pal.top, pal.stripe, 0.4));
        ctx.fillStyle = tg;
        ctx.beginPath();
        ctx.ellipse(0, -8, 8.5, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = lerpRGB(pal.mid, [255, 240, 120], 0.35);
        ctx.beginPath();
        ctx.arc(-6, -22, 6, 0, Math.PI * 2);
        ctx.arc(6, -22, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(-7.5, -24, 2, 0, Math.PI * 2);
        ctx.arc(4.5, -24, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawRealisticBlossom(pal, phase) {
        ctx.save();
        ctx.translate(0, -16);
        ctx.rotate(Math.sin(phase * 0.9) * 0.06);

        // Backing emerald calyx leaves
        for (let i = 0; i < 3; i++) {
          ctx.save();
          ctx.rotate(i * 2.1 + 0.4);
          ctx.fillStyle = '#1f7a3d';
          ctx.beginPath();
          ctx.ellipse(34, 0, 22, 11, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Five layered shaded tropical hibiscus petals
        for (let i = 0; i < 5; i++) {
          ctx.save();
          ctx.rotate((Math.PI * 2 * i) / 5);
          const pg = ctx.createRadialGradient(14, 0, 2, 24, 0, 36);
          pg.addColorStop(0, lerpRGB(pal.stripe, [255,255,255], 0.05));
          pg.addColorStop(0.45, lerpRGB(pal.mid, pal.top, 0.25));
          pg.addColorStop(0.9, lerpRGB(pal.belly, pal.mid, 0.35));
          pg.addColorStop(1, lerpRGB(pal.belly, [255,255,255], 0.45));
          ctx.fillStyle = pg;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(18, -26, 48, -22, 48, 0);
          ctx.bezierCurveTo(48, 22, 18, 26, 0, 0);
          ctx.fill();

          // Delicate petal veins
          ctx.strokeStyle = 'rgba(255,255,255,0.22)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(6, 0); ctx.lineTo(36, 0);
          ctx.moveTo(10, -4); ctx.lineTo(32, -10);
          ctx.moveTo(10, 4); ctx.lineTo(32, 10);
          ctx.stroke();
          ctx.restore();
        }

        // Golden stamens & glistening dewdrop
        ctx.fillStyle = '#ffdf5e';
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        for (let i = 0; i < 8; i++) {
          const a = (Math.PI * 2 * i) / 8;
          ctx.fillStyle = '#fff5b8';
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 12, Math.sin(a) * 12, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        // Dewdrop highlight
        ctx.fillStyle = 'rgba(225, 252, 255, 0.72)';
        ctx.beginPath();
        ctx.arc(24, -14, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(22.5, -15.5, 1.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawRealisticFruit(pal, variant, phase) {
        ctx.save();
        ctx.translate(0, -16);
        ctx.rotate(Math.sin(phase * 1.1) * 0.06);

        // Fresh leaf & stem on top
        ctx.strokeStyle = '#5c3c1e';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.quadraticCurveTo(4, -42, 10, -45);
        ctx.stroke();

        ctx.fillStyle = '#2e9946';
        ctx.beginPath();
        ctx.ellipse(-14, -36, 16, 7.5, -0.35, 0, Math.PI * 2);
        ctx.fill();

        if (variant === 0) {
          // Juicy Tropical Mango with warm blush gradient
          const mg = ctx.createRadialGradient(-10, -10, 4, 0, 2, 42);
          mg.addColorStop(0, '#fff29c');
          mg.addColorStop(0.35, lerpRGB(pal.mid, [255, 188, 42], 0.5));
          mg.addColorStop(0.75, lerpRGB(pal.top, [225, 68, 38], 0.45));
          mg.addColorStop(1, '#7a1f16');
          ctx.fillStyle = mg;
          ctx.beginPath();
          ctx.moveTo(0, -32);
          ctx.bezierCurveTo(32, -28, 36, 14, 14, 34);
          ctx.bezierCurveTo(-12, 42, -36, 14, -28, -14);
          ctx.bezierCurveTo(-24, -28, -10, -34, 0, -32);
          ctx.fill();
        } else if (variant === 1) {
          // Halved Passionfruit with rich golden pulp & glossy seeds
          ctx.fillStyle = lerpRGB(pal.stripe, [92, 22, 84], 0.55);
          ctx.beginPath();
          ctx.arc(0, 2, 34, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#f5e2ba';
          ctx.beginPath();
          ctx.arc(0, 2, 29, 0, Math.PI * 2);
          ctx.fill();
          const pg = ctx.createRadialGradient(0, 2, 2, 0, 2, 26);
          pg.addColorStop(0, '#ffe359');
          pg.addColorStop(1, '#e68412');
          ctx.fillStyle = pg;
          ctx.beginPath();
          ctx.arc(0, 2, 25, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#2e1608';
          for (let i = 0; i < 12; i++) {
            const a = (Math.PI * 2 * i) / 12;
            const r = i % 2 === 0 ? 15 : 8;
            ctx.beginPath();
            ctx.ellipse(Math.cos(a) * r, 2 + Math.sin(a) * r, 3.2, 2, a, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          // Vibrant Dragonfruit with green-tipped scales
          const dg = ctx.createRadialGradient(-8, -6, 4, 0, 2, 38);
          dg.addColorStop(0, '#ff8cb8');
          dg.addColorStop(0.55, lerpRGB(pal.top, [218, 28, 98], 0.6));
          dg.addColorStop(1, '#781038');
          ctx.fillStyle = dg;
          ctx.beginPath();
          ctx.ellipse(0, 2, 30, 35, 0, 0, Math.PI * 2);
          ctx.fill();
          // Green-tipped bracts
          ctx.fillStyle = '#6ad44a';
          for (const pt of [[-24, -12, -0.8], [24, -10, 0.8], [-22, 16, -0.5], [22, 16, 0.5]]) {
            ctx.save();
            ctx.translate(pt[0], pt[1]);
            ctx.rotate(pt[2]);
            ctx.beginPath();
            ctx.moveTo(0, -6); ctx.lineTo(14, 0); ctx.lineTo(0, 6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }

        // Glossy specular shine
        ctx.fillStyle = 'rgba(255, 255, 255, 0.36)';
        ctx.beginPath();
        ctx.ellipse(-12, -10, 6.5, 13, -0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSyllableBadge(syllable, pal, hoverAmount) {
        // Large, airy organic glowing nectar-orb / dewdrop medallion (ZERO white rectangles)
        ctx.save();
        ctx.translate(0, 44);

        const rx = 68 + hoverAmount * 4;
        const ry = 46 + hoverAmount * 3;

        // Deep ambient drop shadow
        ctx.fillStyle = 'rgba(0, 14, 8, 0.48)';
        ctx.beginPath();
        ctx.ellipse(0, 7, rx + 3, ry + 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Rich colored translucent nectar orb
        const bg = ctx.createLinearGradient(0, -ry, 0, ry);
        bg.addColorStop(0, pal.badgeBg[1]);
        bg.addColorStop(1, pal.badgeBg[0]);
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();

        // Top glossy dewdrop reflection arc
        const gloss = ctx.createLinearGradient(0, -ry, 0, 0);
        gloss.addColorStop(0, 'rgba(255, 255, 255, 0.42)');
        gloss.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = gloss;
        ctx.beginPath();
        ctx.ellipse(0, -ry * 0.36, rx * 0.72, ry * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();

        // Luminous organic rim
        ctx.strokeStyle = pal.badgeBorder;
        ctx.lineWidth = 3 + hoverAmount * 1.4;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        // HUGE, ultra-legible Arial uppercase syllable with dark outline + shadow
        ctx.font = '900 54px Arial, Helvetica, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';

        // Crisp dark outline for maximum contrast on screen-sharing
        ctx.lineWidth = 7;
        ctx.strokeStyle = 'rgba(4, 18, 10, 0.82)';
        ctx.strokeText(syllable, 0, 3);

        // Subtle warm drop shadow + bright crisp fill
        ctx.fillStyle = '#fffef4';
        ctx.fillText(syllable, 0, 2);

        ctx.restore();
      }

      /* ======================================================================
         12. RENDERING THE 6 DIVERSE VISUAL REACTIONS & PARTICLES
         ====================================================================== */
      function drawReactionsAndParticles(t) {
        for (const r of reactions) {
          const p = clamp(r.t / r.duration, 0, 1);

          if (r.type === 'rainbow') {
            const alpha = Math.sin(p * Math.PI) * 0.48;
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const cx = W * 0.52;
            const cy = H * 0.85;
            const colors = ['#ff595e', '#ff924c', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'];
            colors.forEach((col, i) => {
              ctx.strokeStyle = col;
              ctx.globalAlpha = alpha;
              ctx.lineWidth = 10 * S;
              ctx.beginPath();
              ctx.arc(cx, cy, (235 - i * 10) * S, Math.PI * 1.08, Math.PI * 1.92);
              ctx.stroke();
            });
            ctx.restore();
          }

          else if (r.type === 'frog') {
            // Realistic Red-Eyed Tree Frog leaping in a parabolic arc
            const fx = lerp(r.startX, r.endX, p);
            const arc = Math.sin(p * Math.PI) * H * 0.42;
            const fy = H * 0.88 - arc;
            const angle = Math.atan2(-Math.cos(p * Math.PI) * 0.65, 1);

            ctx.save();
            ctx.translate(fx, fy);
            ctx.rotate(angle);
            ctx.scale(S * 1.15, S * 1.15);

            // Extended orange-webbed hind legs
            ctx.strokeStyle = '#3bc24a';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-14, 6); ctx.lineTo(-34, 16); ctx.lineTo(-48, 8);
            ctx.stroke();
            ctx.fillStyle = '#ff6e24';
            ctx.beginPath();
            ctx.ellipse(-50, 8, 8, 5, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Vibrant lime-green frog body with blue flank stripe
            const fg = ctx.createRadialGradient(4, -6, 3, 0, 0, 26);
            fg.addColorStop(0, '#7ef25c');
            fg.addColorStop(0.7, '#2ca83c');
            fg.addColorStop(1, '#196e28');
            ctx.fillStyle = fg;
            ctx.beginPath();
            ctx.ellipse(0, 0, 24, 14, -0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2d8cff';
            ctx.beginPath();
            ctx.ellipse(-2, 6, 14, 4.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Iconic bulging ruby-red eye with vertical slit pupil
            ctx.fillStyle = '#e8242e';
            ctx.beginPath();
            ctx.arc(16, -9, 7.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0d0d0d';
            ctx.beginPath();
            ctx.ellipse(17, -9, 1.8, 5.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(14.5, -11.5, 2.2, 0, Math.PI * 2);
            ctx.fill();

            // Front orange toe pads
            ctx.fillStyle = '#ff6e24';
            ctx.beginPath();
            ctx.ellipse(22, 12, 6, 4, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          else if (r.type === 'hummingbird') {
            // Realistic Emerald Hummingbird darting in, hovering, and zipping away
            let hx;
            if (p < 0.3) hx = lerp(r.fromRight ? W + 80 : -80, W * 0.62, smoothstep(0, 0.3, p));
            else if (p < 0.72) hx = W * 0.62 + Math.sin(r.t * 9) * 10 * S;
            else hx = lerp(W * 0.62, r.fromRight ? -90 : W + 90, smoothstep(0.72, 1, p));
            const hy = r.hoverY + Math.sin(r.t * 7) * 14 * S;
            const dir = r.fromRight ? -1 : 1;

            ctx.save();
            ctx.translate(hx, hy);
            ctx.scale(dir * S * 1.1, S * 1.1);

            // Rapid blurred wings
            const wingBlur = Math.sin(r.t * 58) * 0.55;
            ctx.fillStyle = 'rgba(130, 232, 200, 0.42)';
            ctx.save();
            ctx.rotate(-0.6 + wingBlur);
            ctx.beginPath();
            ctx.ellipse(-6, -24, 12, 30, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Forked tail feathers
            ctx.fillStyle = '#105442';
            ctx.beginPath();
            ctx.moveTo(-16, 4); ctx.lineTo(-42, 18); ctx.lineTo(-34, 4); ctx.lineTo(-44, -2);
            ctx.closePath();
            ctx.fill();

            // Iridescent emerald body & ruby gorget
            const bg = ctx.createLinearGradient(-16, -12, 16, 12);
            bg.addColorStop(0, '#5ef29e');
            bg.addColorStop(0.55, '#12a36a');
            bg.addColorStop(1, '#094f3e');
            ctx.fillStyle = bg;
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 12, -0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ff3864';
            ctx.beginPath();
            ctx.ellipse(14, -4, 7, 5, 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Needle beak & bright eye
            ctx.strokeStyle = '#1b1d1c';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(20, -9); ctx.lineTo(46, -11);
            ctx.stroke();
            ctx.fillStyle = '#0d1412';
            ctx.beginPath();
            ctx.arc(15, -10, 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          else if (r.type === 'hibiscus') {
            const bloomScale = p < 0.28 ? smoothstep(0, 0.28, p) : (p > 0.8 ? 1 - smoothstep(0.8, 1, p) : 1);
            ctx.save();
            ctx.translate(r.x, r.y);
            ctx.scale(bloomScale * S * 1.65, bloomScale * S * 1.65);
            ctx.rotate(p * 0.45);
            drawRealisticBlossom(r.palette, r.t * 2);
            ctx.restore();
          }

          else if (r.type === 'bubbles') {
            for (const b of r.bubs) {
              if (b.popped) continue;
              ctx.save();
              const bg = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 1, b.x, b.y, b.r);
              bg.addColorStop(0, 'rgba(255, 255, 255, 0.72)');
              bg.addColorStop(0.45, 'rgba(150, 245, 255, 0.18)');
              bg.addColorStop(0.85, 'rgba(255, 180, 245, 0.35)');
              bg.addColorStop(1, 'rgba(180, 255, 220, 0.65)');
              ctx.fillStyle = bg;
              ctx.beginPath();
              ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
              ctx.lineWidth = 1.2;
              ctx.stroke();
              ctx.restore();
            }
          }

          else if (r.type === 'fireflies') {
            const anchor = getChameleonAnchor();
            const fade = Math.sin(p * Math.PI);
            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            for (const f of r.flies) {
              const ang = f.angle + r.t * f.speed;
              const fx = anchor.x + 25 * S + Math.cos(ang) * f.radius * (0.7 + 0.3 * fade);
              const fy = anchor.y - 25 * S + Math.sin(ang) * f.radius * 0.48 + f.yOff;
              const fg = ctx.createRadialGradient(fx, fy, 0, fx, fy, f.size * 4.2);
              fg.addColorStop(0, `rgba(255, 250, 170, ${0.95 * fade})`);
              fg.addColorStop(0.4, `rgba(210, 255, 110, ${0.45 * fade})`);
              fg.addColorStop(1, 'rgba(160, 255, 90, 0)');
              ctx.fillStyle = fg;
              ctx.beginPath();
              ctx.arc(fx, fy, f.size * 4.2, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }

          else if (r.type === 'celebrationFlock') {
            for (const b of r.flock) {
              ctx.save();
              ctx.translate(b.x, b.y);
              ctx.rotate(0.45);
              ctx.scale(b.scale, b.scale);
              drawRealisticButterfly(b.palette, t * 18 + b.phase);
              ctx.restore();
            }
          }
        }

        // Particles (sparkles, water drops, swirling petals)
        for (const p of particles) {
          const alpha = clamp(1 - p.life / p.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          if (p.kind === 'petal') {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.beginPath();
            ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      /* ======================================================================
         13. INPUT HANDLING (MOUSE + TOUCH FOR INTERACTIVE WHITEBOARDS & TABLETS)
         ====================================================================== */
      function handlePointerMove(clientX, clientY) {
        pointer.x = clientX;
        pointer.y = clientY;
        pointer.active = true;
      }

      function handlePointerDown(clientX, clientY) {
        audio.ensure();
        pointer.x = clientX;
        pointer.y = clientY;
        pointer.active = true;

        // Close consonant palette when clicking outside it
        if (paletteEl.classList.contains('open')) {
          paletteEl.classList.remove('open');
          return;
        }

        if (chameleon.tongueState !== 'idle') return;

        // Check hit on any active syllable carrier (expanded hit area for large medallions)
        let best = null;
        let bestDist = 104 * S;
        for (const c of carriers) {
          if (c.removed || c.caught || c.enterProgress < 0.45) continue;
          const d = Math.hypot(clientX - c.x, clientY - (c.y + 12 * S));
          if (d < bestDist) {
            bestDist = d;
            best = c;
          }
        }

        if (best) {
          best.snagX = best.x;
          best.snagY = best.y;
          chameleon.targetCarrier = best;
          chameleon.tongueState = 'aiming';
          chameleon.tongueTimer = 0;
        }
      }

      canvas.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
      canvas.addEventListener('mousedown', e => handlePointerDown(e.clientX, e.clientY));
      canvas.addEventListener('touchstart', e => {
        if (e.touches.length > 0) {
          e.preventDefault();
          handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });
      canvas.addEventListener('touchmove', e => {
        if (e.touches.length > 0) {
          e.preventDefault();
          handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: false });

      /* ======================================================================
         14. ORGANIC UI CONTROLS (MULTI-CONSONANT SELECTOR, LANG, NEXT)
         ====================================================================== */
      const toggleBtn = document.getElementById('consonantToggle');
      const paletteEl = document.getElementById('consonantPalette');
      const pebbleGrid = document.getElementById('pebbleGrid');
      const selectAllBtn = document.getElementById('selectAllBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const closePaletteBtn = document.getElementById('closePaletteBtn');
      const langBtn = document.getElementById('langToggle');
      const nextBtn = document.getElementById('nextWaveBtn');

      function updateConsonantToggleVisual() {
        const cfg = LANG_CONFIG[currentLang];
        const chosen = cfg.consonants.filter(c => selectedConsonants.has(c));

        if (chosen.length === 0 || chosen.length === cfg.consonants.length) {
          toggleBtn.textContent = '∞';
        } else if (chosen.length <= 4) {
          toggleBtn.textContent = chosen.join(', ');
        } else {
          toggleBtn.textContent = chosen.slice(0, 3).join(', ') + ' +' + (chosen.length - 3);
        }
      }

      function buildConsonantPalette() {
        pebbleGrid.innerHTML = '';
        const cfg = LANG_CONFIG[currentLang];

        for (const letter of cfg.consonants) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'pebble-btn' + (selectedConsonants.has(letter) ? ' active' : '');
          btn.textContent = letter;
          btn.addEventListener('click', e => {
            e.stopPropagation();
            audio.ensure();
            audio.playLeafWhoosh();

            if (selectedConsonants.has(letter)) {
              selectedConsonants.delete(letter);
              btn.classList.remove('active');
            } else {
              selectedConsonants.add(letter);
              btn.classList.add('active');
            }

            updateConsonantToggleVisual();
            spawnNewWave(true);
          });
          pebbleGrid.appendChild(btn);
        }
      }

      // Select all consonants of active language
      selectAllBtn.addEventListener('click', e => {
        e.stopPropagation();
        audio.ensure();
        audio.playLeafWhoosh();
        const cfg = LANG_CONFIG[currentLang];
        selectedConsonants = new Set(cfg.consonants);
        updateConsonantToggleVisual();
        buildConsonantPalette();
        spawnNewWave(true);
      });

      // Clear all selections (generator automatically falls back to all until user taps desired letters)
      clearAllBtn.addEventListener('click', e => {
        e.stopPropagation();
        audio.ensure();
        audio.playLeafWhoosh();
        selectedConsonants.clear();
        updateConsonantToggleVisual();
        buildConsonantPalette();
        spawnNewWave(true);
      });

      // Close palette button
      closePaletteBtn.addEventListener('click', e => {
        e.stopPropagation();
        audio.ensure();
        audio.playLeafWhoosh();
        paletteEl.classList.remove('open');
      });

      // Prevent clicks inside palette from closing it
      paletteEl.addEventListener('click', e => {
        e.stopPropagation();
      });

      toggleBtn.addEventListener('click', e => {
        e.stopPropagation();
        audio.ensure();
        audio.playLeafWhoosh();
        paletteEl.classList.toggle('open');
      });

      langBtn.addEventListener('click', e => {
        e.stopPropagation();
        audio.ensure();
        audio.playLeafWhoosh();
        const prevCfg = LANG_CONFIG[currentLang];
        const wasAllSelected = selectedConsonants.size === prevCfg.consonants.length;

        currentLang = currentLang === 'uk' ? 'ru' : 'uk';
        const nextCfg = LANG_CONFIG[currentLang];
        langBtn.textContent = nextCfg.label;

        if (wasAllSelected) {
          selectedConsonants = new Set(nextCfg.consonants);
        } else {
          // Preserve intersection of selected consonants across languages
          const nextSet = new Set();
          for (const letter of selectedConsonants) {
            if (nextCfg.consonants.includes(letter)) {
              nextSet.add(letter);
            }
          }
          selectedConsonants = nextSet;
        }

        updateConsonantToggleVisual();
        buildConsonantPalette();
        spawnNewWave(true);
      });

      nextBtn.addEventListener('click', e => {
        e.stopPropagation();
        audio.ensure();
        paletteEl.classList.remove('open');
        triggerNextWaveSkip();
      });

      /* ======================================================================
         15. MAIN 60FPS ANIMATION LOOP
         ====================================================================== */
      let lastTime = 0;

      function frame(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
        lastTime = now;
        const t = now * 0.001;

        updateAmbient(dt, t);
        updateCarriers(dt, t);
        updateChameleon(dt, t);
        updateReactionsAndParticles(dt);

        ctx.clearRect(0, 0, W, H);
        drawBackground(t);
        drawMossyBranch(t);
        drawAllCarriers(t);
        drawChameleon(t);
        drawReactionsAndParticles(t);

        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);

      window.onload = () => {
        resize();
        updateConsonantToggleVisual();
        buildConsonantPalette();
        spawnNewWave(false);
        lastTime = performance.now();
        requestAnimationFrame(frame);
      };
    })();
  </script>
</body>
</html>
