<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лісова Галерея</title>
<style>
  /* Скидання базових стилів та заборона виділення для комфортної гри дітей */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    background: #0d2618;
  }

  /* Головний контейнер сцени */
  #game-stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* Фоновий живий SVG-ліс */
  #forest-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Анімації живого лісу */
  @keyframes swayTree {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(1.2deg); }
  }
  @keyframes floatFirefly {
    0%, 100% { transform: translate(0, 0) scale(0.8); opacity: 0.3; }
    50% { transform: translate(15px, -25px) scale(1.3); opacity: 1; }
  }
  @keyframes swayRope {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(1.5deg); }
    75% { transform: rotate(-1.5deg); }
  }
  @keyframes cardAppear {
    0% { transform: translateY(-60px) rotate(-8deg) scale(0.7); opacity: 0; }
    70% { transform: translateY(8px) rotate(3deg) scale(1.03); opacity: 1; }
    100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
  }
  @keyframes cardWinBounce {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.12) rotate(-4deg); }
    50% { transform: scale(1.15) rotate(4deg); }
    75% { transform: scale(1.08) rotate(-2deg); }
  }
  @keyframes cardWrongShake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-7deg); }
    40% { transform: rotate(7deg); }
    60% { transform: rotate(-5deg); }
    80% { transform: rotate(4deg); }
  }

  /* Контейнер мотузки та картин */
  #rope-zone {
    position: absolute;
    top: 2%;
    left: 0;
    width: 100%;
    height: 58%;
    z-index: 10;
    pointer-events: none;
  }

  /* Ряд із трьома картинами на прищіпках */
  #pictures-row {
    position: absolute;
    top: 11%;
    left: 8%;
    right: 8%;
    height: 78%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 3.5vw;
    z-index: 12;
  }

  /* Окрема підвішена картина */
  .hanging-frame {
    position: relative;
    width: min(25vw, 310px);
    aspect-ratio: 1 / 1.05;
    transform-origin: 50% 0%;
    animation: swayRope 5.5s ease-in-out infinite;
    cursor: pointer;
    pointer-events: auto;
    filter: drop-shadow(0 14px 18px rgba(0, 0, 0, 0.45));
    transition: filter 0.3s;
  }
  .hanging-frame:nth-child(1) {
    margin-top: -0.6%;
    animation-delay: -0.5s;
  }
  .hanging-frame:nth-child(2) {
    margin-top: 1.4%;
    animation-delay: -2.2s;
  }
  .hanging-frame:nth-child(3) {
    margin-top: -0.4%;
    animation-delay: -3.8s;
  }
  .hanging-frame:hover {
    filter: drop-shadow(0 18px 24px rgba(255, 215, 80, 0.55));
  }
  .hanging-frame.entering {
    animation: cardAppear 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .hanging-frame.win-anim {
    animation: cardWinBounce 0.8s ease-in-out 2;
  }
  .hanging-frame.wrong-anim {
    animation: cardWrongShake 0.55s ease-in-out;
  }

  /* Зона варіантів відповідей (три стилізовані таблички на дерев'яних підставках) */
  #answers-zone {
    position: absolute;
    bottom: 7%;
    left: 10%;
    right: 20%;
    height: 25%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2.8vw;
    z-index: 20;
  }

  .answer-stand {
    position: relative;
    width: min(23vw, 290px);
    height: min(12vw, 145px);
    cursor: pointer;
    transform-origin: center bottom;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s;
    filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.5));
  }
  .answer-stand:hover {
    transform: translateY(-7px) scale(1.04);
    filter: drop-shadow(0 15px 20px rgba(255, 230, 110, 0.45));
  }
  .answer-stand:active {
    transform: translateY(2px) scale(0.97);
  }
  .answer-stand.correct-hit {
    animation: standCorrect 0.75s ease-out;
  }
  .answer-stand.wrong-hit {
    animation: cardWrongShake 0.5s ease-in-out;
  }

  @keyframes standCorrect {
    0% { transform: scale(1); }
    35% { transform: scale(1.16) translateY(-10px); filter: drop-shadow(0 0 28px #6bff8c); }
    70% { transform: scale(0.96); }
    100% { transform: scale(1); }
  }

  /* Живий персонаж - Лісовий Борсучок */
  #character-zone {
    position: absolute;
    bottom: 3%;
    right: 2.5%;
    width: min(19vw, 245px);
    height: min(26vw, 330px);
    z-index: 25;
    pointer-events: auto;
    cursor: pointer;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.55));
  }

  @keyframes badgerBreathe {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50% { transform: scaleY(1.025) translateY(-3px); }
  }
  @keyframes badgerJump {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25% { transform: translateY(-28px) rotate(-6deg) scale(1.06); }
    50% { transform: translateY(-5px) rotate(5deg) scale(0.98); }
    75% { transform: translateY(-22px) rotate(-4deg) scale(1.05); }
  }
  @keyframes badgerSpinDance {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-24px) rotate(12deg) scale(1.08); }
    60% { transform: translateY(-12px) rotate(-12deg) scale(1.08); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes badgerConfused {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-9deg) translateY(4px); }
    50% { transform: rotate(8deg) translateY(2px); }
    75% { transform: rotate(-6deg) translateY(4px); }
  }

  #badger-svg {
    width: 100%;
    height: 100%;
    transform-origin: 50% 90%;
    animation: badgerBreathe 3.2s ease-in-out infinite;
  }
  #badger-svg.happy-jump {
    animation: badgerJump 0.85s ease-in-out 2;
  }
  #badger-svg.happy-dance {
    animation: badgerSpinDance 0.9s ease-in-out 2;
  }
  #badger-svg.sad-shake {
    animation: badgerConfused 0.65s ease-in-out;
  }

  /* Мінімалістичні дерев'яні кнопки навігації (Назад / Далі) */
  .nav-wooden-btn {
    position: absolute;
    bottom: 2.5%;
    width: min(7.5vw, 92px);
    height: min(5.2vw, 64px);
    z-index: 30;
    cursor: pointer;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55));
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
  }
  .nav-wooden-btn:hover {
    transform: scale(1.1) translateY(-3px);
    filter: drop-shadow(0 10px 16px rgba(255, 220, 100, 0.45));
  }
  .nav-wooden-btn:active {
    transform: scale(0.94);
  }
  #btn-prev { left: 1.8%; }
  #btn-next { right: 1.8%; }

  /* Шар для активних візуальних салютів з листя, нот та зірочок */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 35;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="game-stage">
  <!-- Живий сюжетний лісовий фон із деревами, травою, квітами та світлячками -->
  <svg id="forest-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт глибини лісу -->
      <radialGradient id="forestGlow" cx="50%" cy="42%" r="60%">
        <stop offset="0%" stop-color="#58b368"/>
        <stop offset="45%" stop-color="#266837"/>
        <stop offset="85%" stop-color="#11381f"/>
        <stop offset="100%" stop-color="#092112"/>
      </radialGradient>
      <!-- Градієнт сонячної галявини знизу -->
      <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4ea845"/>
        <stop offset="40%" stop-color="#357d32"/>
        <stop offset="100%" stop-color="#18471c"/>
      </linearGradient>
      <!-- Текстура кори дерева -->
      <linearGradient id="barkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3b2313"/>
        <stop offset="35%" stop-color="#694127"/>
        <stop offset="70%" stop-color="#4e2e18"/>
        <stop offset="100%" stop-color="#2a170b"/>
      </linearGradient>
      <!-- Текстура крученої мотузки -->
      <pattern id="ropePattern" width="28" height="20" patternUnits="userSpaceOnUse">
        <rect width="28" height="20" fill="#8b5a2b"/>
        <path d="M-4,18 C6,2 14,2 24,18 M10,18 C20,2 28,2 38,18" stroke="#d29b61" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M-4,18 C6,2 14,2 24,18 M10,18 C20,2 28,2 38,18" stroke="#4f3013" stroke-width="1.8" fill="none"/>
      </pattern>

      <!-- Стилізовані фони для 3-х картин (жодних білих прямокутників!) -->
      <!-- 1. М'ятне ботанічне полотно -->
      <pattern id="canvasMint" width="90" height="90" patternUnits="userSpaceOnUse">
        <rect width="90" height="90" fill="#a8e0c9"/>
        <circle cx="45" cy="45" r="38" fill="#bbead7" opacity="0.5"/>
        <path d="M12,75 Q28,45 15,15 M15,45 Q30,38 35,25 M15,55 Q5,42 4,30" stroke="#75bfa1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M75,80 Q60,50 78,20 M70,50 Q55,40 52,28" stroke="#75bfa1" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="45" cy="20" r="3" fill="#75bfa1"/>
        <circle cx="70" cy="70" r="3.5" fill="#75bfa1"/>
      </pattern>

      <!-- 2. Сонячне бурштинове полотно зі спіралями -->
      <pattern id="canvasSun" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="#f9e29c"/>
        <circle cx="50" cy="50" r="42" fill="#fcebb6" opacity="0.6"/>
        <path d="M50,50 m-18,0 a18,18 0 1,0 36,0 a15,15 0 1,0 -30,0 a10,10 0 1,0 20,0" stroke="#e4c265" stroke-width="2.2" fill="none"/>
        <path d="M15,15 L25,22 M85,15 L75,22 M15,85 L25,78 M85,85 L75,78" stroke="#e4c265" stroke-width="2.5" stroke-linecap="round"/>
      </pattern>

      <!-- 3. Теракотово-персикове полотно з ромбами -->
      <pattern id="canvasPeach" width="80" height="80" patternUnits="userSpaceOnUse">
        <rect width="80" height="80" fill="#f5c6a5"/>
        <polygon points="40,6 74,40 40,74 6,40" fill="#fad6bc" stroke="#df9e73" stroke-width="2"/>
        <polygon points="40,20 60,40 40,60 20,40" fill="none" stroke="#df9e73" stroke-width="1.8" stroke-dasharray="4,3"/>
        <circle cx="40" cy="40" r="4" fill="#df9e73"/>
      </pattern>

      <!-- Візерунки для кнопок відповідей -->
      <pattern id="btnOrangePat" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M0,20 L20,4 L40,20 L20,36 Z" fill="none" stroke="rgba(255,235,170,0.28)" stroke-width="2.5"/>
        <circle cx="20" cy="20" r="3" fill="rgba(255,235,170,0.3)"/>
      </pattern>
      <pattern id="btnTealPat" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="14" fill="none" stroke="rgba(180,255,250,0.25)" stroke-width="2.5"/>
        <path d="M6,20 H34 M20,6 V34" stroke="rgba(180,255,250,0.18)" stroke-width="2"/>
      </pattern>
      <pattern id="btnBerryPat" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M0,10 Q20,30 40,10 M0,30 Q20,10 40,30" fill="none" stroke="rgba(255,200,245,0.26)" stroke-width="2.5"/>
      </pattern>

      <!-- Фільтр об'ємної тіні для предметів на картинах -->
      <filter id="itemShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#1e2923" flood-opacity="0.38"/>
      </filter>
    </defs>

    <!-- Сяйво далекого лісу -->
    <rect width="1600" height="900" fill="url(#forestGlow)"/>

    <!-- Далекі силуети дерев і кущів -->
    <g opacity="0.35" fill="#134224">
      <ellipse cx="260" cy="480" rx="220" ry="180"/>
      <ellipse cx="550" cy="430" rx="260" ry="210"/>
      <ellipse cx="1050" cy="440" rx="270" ry="200"/>
      <ellipse cx="1350" cy="490" rx="210" ry="170"/>
      <rect x="230" y="450" width="45" height="300"/>
      <rect x="520" y="420" width="55" height="320"/>
      <rect x="1030" y="420" width="50" height="320"/>
    </g>

    <!-- Сонячні промені крізь крони -->
    <g opacity="0.16" fill="#fff6a9">
      <polygon points="350,0 520,0 780,750 480,750"/>
      <polygon points="750,0 920,0 1120,750 860,750"/>
      <polygon points="1120,0 1240,0 1380,750 1180,750"/>
    </g>

    <!-- Квітуча лісова галявина внизу -->
    <path d="M0,660 Q400,615 800,645 T1600,650 L1600,900 L0,900 Z" fill="#2d6e2e"/>
    <path d="M0,715 Q450,670 850,705 T1600,700 L1600,900 L0,900 Z" fill="url(#meadowGrad)"/>

    <!-- Могутнє дерево ліворуч -->
    <g>
      <path d="M-20,0 L125,0 Q110,280 120,520 Q135,680 215,790 L-20,820 Z" fill="url(#barkGrad)"/>
      <!-- Візерунки кори -->
      <path d="M40,60 Q65,190 45,340 M85,120 Q65,280 90,450 M55,480 Q80,600 130,720" stroke="#26150a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <!-- Дупло та гілки -->
      <ellipse cx="70" cy="390" rx="22" ry="35" fill="#1f1006" stroke="#4d2e18" stroke-width="5"/>
      <path d="M95,110 Q250,65 390,15" stroke="url(#barkGrad)" stroke-width="34" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Могутнє дерево праворуч -->
    <g>
      <path d="M1620,0 L1475,0 Q1490,280 1480,520 Q1465,680 1390,790 L1620,820 Z" fill="url(#barkGrad)"/>
      <path d="M1550,80 Q1525,220 1545,380 M1510,160 Q1530,320 1505,500 M1535,510 Q1505,630 1465,730" stroke="#26150a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M1505,110 Q1350,65 1210,15" stroke="url(#barkGrad)" stroke-width="34" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Пишне листя зверху та з боків -->
    <g style="animation: swayTree 7s ease-in-out infinite; transform-origin: 800px 0px;">
      <circle cx="90" cy="40" r="110" fill="#1e5928"/>
      <circle cx="240" cy="20" r="95" fill="#2c7836"/>
      <circle cx="420" cy="-10" r="85" fill="#3a9142"/>
      <circle cx="1510" cy="40" r="110" fill="#1e5928"/>
      <circle cx="1360" cy="20" r="95" fill="#2c7836"/>
      <circle cx="1180" cy="-10" r="85" fill="#3a9142"/>
      <!-- Деталізовані листочки -->
      <g fill="#52b552" stroke="#1b4d21" stroke-width="2">
        <path d="M120,90 Q155,60 180,105 Q145,125 120,90 Z"/>
        <path d="M290,55 Q330,30 350,75 Q310,95 290,55 Z"/>
        <path d="M1450,95 Q1415,65 1390,110 Q1425,130 1450,95 Z"/>
        <path d="M1280,55 Q1240,30 1220,75 Q1260,95 1280,55 Z"/>
      </g>
    </g>

    <!-- Декоративні травички та квіти на передньому плані -->
    <g id="meadow-flowers">
      <!-- Лівий кущ папороті та квітів -->
      <path d="M30,890 Q10,770 85,710 Q55,800 65,890 Z" fill="#296e2c"/>
      <path d="M60,890 Q80,750 155,700 Q115,795 105,890 Z" fill="#3b8c3b"/>
      <path d="M15,890 Q-10,790 35,735 Q25,815 40,890 Z" fill="#4ca649"/>
      <!-- Квіточки на галявині -->
      <g transform="translate(260,840)">
        <circle cx="0" cy="-12" r="9" fill="#ff7eb3"/><circle cx="11" cy="-4" r="9" fill="#ff7eb3"/>
        <circle cx="7" cy="9" r="9" fill="#ff7eb3"/><circle cx="-7" cy="9" r="9" fill="#ff7eb3"/>
        <circle cx="-11" cy="-4" r="9" fill="#ff7eb3"/><circle cx="0" cy="0" r="7" fill="#ffd93d"/>
      </g>
      <g transform="translate(550,865) scale(0.9)">
        <circle cx="0" cy="-12" r="9" fill="#ffb347"/><circle cx="11" cy="-4" r="9" fill="#ffb347"/>
        <circle cx="7" cy="9" r="9" fill="#ffb347"/><circle cx="-7" cy="9" r="9" fill="#ffb347"/>
        <circle cx="-11" cy="-4" r="9" fill="#ffb347"/><circle cx="0" cy="0" r="7" fill="#fff275"/>
      </g>
      <g transform="translate(980,855) scale(0.95)">
        <circle cx="0" cy="-12" r="9" fill="#ff6b8b"/><circle cx="11" cy="-4" r="9" fill="#ff6b8b"/>
        <circle cx="7" cy="9" r="9" fill="#ff6b8b"/><circle cx="-7" cy="9" r="9" fill="#ff6b8b"/>
        <circle cx="-11" cy="-4" r="9" fill="#ff6b8b"/><circle cx="0" cy="0" r="7" fill="#ffe156"/>
      </g>
      <g transform="translate(1220,840) scale(0.85)">
        <circle cx="0" cy="-12" r="9" fill="#7ce0ff"/><circle cx="11" cy="-4" r="9" fill="#7ce0ff"/>
        <circle cx="7" cy="9" r="9" fill="#7ce0ff"/><circle cx="-7" cy="9" r="9" fill="#7ce0ff"/>
        <circle cx="-11" cy="-4" r="9" fill="#7ce0ff"/><circle cx="0" cy="0" r="7" fill="#ffd93d"/>
      </g>
    </g>

    <!-- Живі світлячки -->
    <g fill="#fff89e">
      <circle cx="220" cy="300" r="5" style="animation: floatFirefly 4s ease-in-out infinite;"/>
      <circle cx="480" cy="540" r="4" style="animation: floatFirefly 5.2s ease-in-out infinite -1s;"/>
      <circle cx="820" cy="560" r="5.5" style="animation: floatFirefly 4.6s ease-in-out infinite -2.4s;"/>
      <circle cx="1140" cy="520" r="4.5" style="animation: floatFirefly 5.8s ease-in-out infinite -0.7s;"/>
      <circle cx="1390" cy="290" r="5" style="animation: floatFirefly 4.3s ease-in-out infinite -3.1s;"/>
    </g>
  </svg>

  <!-- Мотузка, натягнута між деревами, та картини на прищіпках -->
  <div id="rope-zone">
    <svg width="100%" height="140" viewBox="0 0 1600 140" preserveAspectRatio="none" style="position:absolute; top:0; left:0; z-index:5;">
      <!-- Тінь від мотузки -->
      <path d="M 0,42 Q 800,118 1600,42" stroke="rgba(0,0,0,0.4)" stroke-width="18" fill="none"/>
      <!-- Основна кручена мотузка -->
      <path d="M 0,36 Q 800,112 1600,36" stroke="url(#ropePattern)" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M 0,36 Q 800,112 1600,36" stroke="#4a2b11" stroke-width="2" fill="none" opacity="0.6"/>
      <!-- Вузли кріплення на стовбурах дерев -->
      <ellipse cx="45" cy="40" rx="18" ry="14" fill="#b87d44" stroke="#4a2b11" stroke-width="3"/>
      <ellipse cx="1555" cy="40" rx="18" ry="14" fill="#b87d44" stroke="#4a2b11" stroke-width="3"/>
    </svg>

    <!-- Три картини на прищіпках -->
    <div id="pictures-row"></div>
  </div>

  <!-- Три стилізовані кнопки з варіантами груп на дерев'яних підставках -->
  <div id="answers-zone"></div>

  <!-- Живий персонаж: Лісовий Борсучок в окулярах та жилетці з орнаментом -->
  <div id="character-zone" title="Натисни на Борсучка!">
    <svg id="badger-svg" viewBox="0 0 260 340">
      <defs>
        <linearGradient id="furDark" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4e5259"/>
          <stop offset="100%" stop-color="#27292e"/>
        </linearGradient>
        <linearGradient id="furLight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="70%" stop-color="#e3e6eb"/>
          <stop offset="100%" stop-color="#b8bec9"/>
        </linearGradient>

class SoundEngine {
  constructor() {
    this.ctx = null;
  }

  // Ініціалізація аудіоконтексту при першому кліку
  init() {
    if (!this.ctx) {

      this.ctx = new AudioCtx();

    if (this.ctx.state === 'suspended') {
      this.ctx.resume();

  // Звук дерев'яного щиглика по картині або кнопці
  playWoodTap(freq = 320) {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);

    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }

  // Три різні фанфари перемоги для різноманітного фідбеку

    this.init();

    if (variant === 0) {

        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + idx * 0.085);
        gain.gain.setValueAtTime(0.25, now + idx * 0.085);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.085 + 0.45);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.085);
        osc.stop(now + idx * 0.085 + 0.46);
      });
    } else if (variant === 1) {
      // Варіант 2: Лісова арфа та спів пташки
      const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + idx * 0.065);
        gain.gain.setValueAtTime(0.22, now + idx * 0.065);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.065 + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.065);
        osc.stop(now + idx * 0.065 + 0.52);
      });

      const bird = this.ctx.createOscillator();
      const bGain = this.ctx.createGain();
      bird.type = 'sine';
      bird.frequency.setValueAtTime(1600, now + 0.42);
      bird.frequency.linearRampToValueAtTime(2200, now + 0.52);
      bird.frequency.linearRampToValueAtTime(1800, now + 0.62);
      bird.frequency.linearRampToValueAtTime(2400, now + 0.75);
      bGain.gain.setValueAtTime(0.18, now + 0.42);
      bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.78);
      bird.connect(bGain);
      bGain.connect(this.ctx.destination);
      bird.start(now + 0.42);
      bird.stop(now + 0.8);
    } else {
      // Варіант 3: Святковий акорд фанфар
      const chord = [523.25, 659.25, 783.99, 987.77, 1046.50];
      chord.forEach((f, idx) => {

        osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
        const delay = idx < 3 ? idx * 0.07 : 0.24;
        osc.frequency.setValueAtTime(f, now + delay);
        gain.gain.setValueAtTime(0.2, now + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.65);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + delay);
        osc.stop(now + delay + 0.66);
      });
    }
  }

    osc.frequency.linearRampToValueAtTime(175, now + 0.26);

    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.46);
  }
}

/* ============================================================================
   4. СИСТЕМА АКТИВНИХ ВІЗУАЛЬНИХ ЕФЕКТІВ (Салюти з листя, нот та зірочок)
   ============================================================================ */
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
let particles = [];

function resizeFx() {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeFx);
resizeFx();

function spawnWinParticles(mode = 0) {
  const colors = ['#ffd93d', '#6bff8c', '#ff6b9d', '#5ce6ff', '#ff9f43'];
  for (let i = 0; i < 65; i++) {
    particles.push({
      x: fxCanvas.width * (0.2 + Math.random() * 0.6),
      y: fxCanvas.height * (0.25 + Math.random() * 0.35),
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 12 - 3,
      size: 10 + Math.random() * 14,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.18,
      color: colors[Math.floor(Math.random() * colors.length)],
      type: mode, // 0: зірочки, 1: лісові листочки, 2: музичні нотки та квіти
      life: 1
    });
  }
}

function animateParticles() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.28; // гравітація
    p.rot += p.vRot;
    p.life -= 0.015;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    fxCtx.save();
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.fillStyle = p.color;
    fxCtx.strokeStyle = '#ffffff';
    fxCtx.lineWidth = 1.5;

    if (p.type === 0) {
      // П'ятикутна зірка
      fxCtx.beginPath();
      for (let j = 0; j < 5; j++) {
        const a1 = (j * 72 - 90) * Math.PI / 180;
        const a2 = ((j + 0.5) * 72 - 90) * Math.PI / 180;
        fxCtx.lineTo(Math.cos(a1) * p.size, Math.sin(a1) * p.size);
        fxCtx.lineTo(Math.cos(a2) * (p.size * 0.45), Math.sin(a2) * (p.size * 0.45));
      }
      fxCtx.closePath();
      fxCtx.fill();
      fxCtx.stroke();
    } else if (p.type === 1) {
      // Лісовий листочок
      fxCtx.beginPath();
      fxCtx.moveTo(0, -p.size);
      fxCtx.quadraticCurveTo(p.size, 0, 0, p.size);
      fxCtx.quadraticCurveTo(-p.size, 0, 0, -p.size);
      fxCtx.fill();
    } else {
      // Пелюстка квітки / музична іскра
      fxCtx.beginPath();
      fxCtx.arc(0, 0, p.size * 0.6, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.stroke();
    }
    fxCtx.restore();
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ============================================================================
   5. ІГРОВА ЛОГІКА ТА ГЕНЕРАЦІЯ КАРТИН НА ПРИЩІПКАХ І ТАБЛИЧОК
   ============================================================================ */
let currentLevel = 0;
let isLocked = false;
let winVariantCounter = 0;

const picturesRow = document.getElementById('pictures-row');
const answersZone = document.getElementById('answers-zone');
const badgerSvg = document.getElementById('badger-svg');
const badgerMouth = document.getElementById('badger-mouth');
const badgerTongue = document.getElementById('badger-tongue');
const badgerArm = document.getElementById('badger-arm-left');

// Створення однієї картини з візерунковою рамою та дерев'яною прищіпкою
function buildPictureFrameHTML(itemKey, idx) {
  const frameThemes = [
    { border: '#e6a145', innerBorder: '#579c87', pattern: 'url(#canvasMint)', pegMain: '#f08a24', pegDark: '#a65108' },
    { border: '#2bb5a8', innerBorder: '#d99b26', pattern: 'url(#canvasSun)', pegMain: '#28c7b5', pegDark: '#0f7367' },
    { border: '#d97a54', innerBorder: '#b85233', pattern: 'url(#canvasPeach)', pegMain: '#d9529b', pegDark: '#7d1b4f' }
  ];
  const t = frameThemes[idx % 3];

  return `
    <div class="hanging-frame entering" style="animation-delay: ${idx * 0.1}s">
      <svg viewBox="0 0 240 255" width="100%" height="100%">
        <!-- Різьблена кольорова рама картини -->
        <rect x="14" y="34" width="212" height="210" rx="10" fill="${t.border}" stroke="#3d220a" stroke-width="4"/>
        <!-- Орнамент по периметру рами -->
        <rect x="22" y="42" width="196" height="194" rx="6" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-dasharray="10,6"/>
        <!-- Візерункове полотно (без білих прямокутників!) -->
        <rect x="28" y="48" width="184" height="182" rx="4" fill="${t.pattern}" stroke="${t.innerBorder}" stroke-width="3.5"/>

        <!-- Деталізований малюнок предмета -->
        <g transform="translate(20, 36)">
          ${SVG_ART[itemKey]}
        </g>

        <!-- Реалістична прищіпка зверху, що тримає картину на мотузці -->
        <g transform="translate(102, 2)">
          <!-- Тінь прищіпки -->
          <rect x="4" y="6" width="32" height="58" rx="5" fill="rgba(0,0,0,0.32)"/>
          <!-- Основна дерев'яна/кольорова планка прищіпки -->
          <polygon points="2,2 34,2 30,58 6,58" fill="${t.pegMain}" stroke="#2e1808" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="6,4 16,4 14,56 8,56" fill="rgba(255,255,255,0.28)"/>
          <!-- Металева пружинка прищіпки -->
          <rect x="0" y="24" width="36" height="8" rx="3" fill="#cfd8e3" stroke="#2c3540" stroke-width="2.2"/>
          <line x1="18" y1="24" x2="18" y2="58" stroke="${t.pegDark}" stroke-width="2.5"/>
        </g>
      </svg>
    </div>
  `;
}

// Створення стилізованої кнопки з назвою групи на дерев'яній лавочці з мохом
function buildAnswerStandHTML(label, idx) {
  const standStyles = [
    { bg1: '#ffb82e', bg2: '#d97211', stroke: '#693000', pat: 'url(#btnOrangePat)' },
    { bg1: '#26d9c4', bg2: '#0f8580', stroke: '#054240', pat: 'url(#btnTealPat)' },
    { bg1: '#e856b3', bg2: '#992171', stroke: '#4a0734', pat: 'url(#btnBerryPat)' }
  ];
  const st = standStyles[idx % 3];
  const isTwoLine = label.includes(' ');
  const words = label.split(' ');

  return `
    <div class="answer-stand" data-answer="${label}">
      <svg viewBox="0 0 310 165" width="100%" height="100%">
        <defs>
          <linearGradient id="standGrad${idx}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${st.bg1}"/>
            <stop offset="100%" stop-color="${st.bg2}"/>
          </linearGradient>
        </defs>

        <!-- Дерев'яна підставка-ослінчик знизу -->
        <rect x="44" y="132" width="20" height="28" rx="4" fill="#6b3e1d" stroke="#361c08" stroke-width="3"/>
        <rect x="246" y="132" width="20" height="28" rx="4" fill="#6b3e1d" stroke="#361c08" stroke-width="3"/>
        <rect x="16" y="120" width="278" height="18" rx="6" fill="#9c5c2b" stroke="#361c08" stroke-width="3"/>

        <!-- Зелений мох і травичка на підставці -->
        <path d="M22,122 Q40,106 62,120 Q85,108 110,122 Z" fill="#4eb844" stroke="#1b5416" stroke-width="2"/>
        <path d="M210,122 Q235,108 258,120 Q276,106 290,122 Z" fill="#4eb844" stroke="#1b5416" stroke-width="2"/>

        <!-- Основна об'ємна табличка з візерунком -->
        <rect x="28" y="12" width="254" height="110" rx="24" fill="url(#standGrad${idx})" stroke="${st.stroke}" stroke-width="4.5"/>
        <rect x="34" y="18" width="242" height="98" rx="19" fill="${st.pat}" stroke="rgba(255,255,255,0.4)" stroke-width="2.5"/>

        <!-- Текст назви групи великими чіткими літерами -->
        ${isTwoLine ? `
          <text x="155" y="58" text-anchor="middle" fill="#fffdf2" stroke="#2b1604" stroke-width="5" paint-order="stroke" font-size="25" font-weight="900" letter-spacing="0.8">${words[0]}</text>
          <text x="155" y="90" text-anchor="middle" fill="#fffdf2" stroke="#2b1604" stroke-width="5" paint-order="stroke" font-size="25" font-weight="900" letter-spacing="0.8">${words.slice(1).join(' ')}</text>
        ` : `
          <text x="155" y="76" text-anchor="middle" fill="#fffdf2" stroke="#2b1604" stroke-width="5.5" paint-order="stroke" font-size="29" font-weight="900" letter-spacing="1">${label}</text>
        `}
      </svg>
    </div>
  `;
}

// Емоції живого Борсучка (без слів, лише рухи, міміка та звуки)
function setBadgerEmotion(state) {
  badgerSvg.classList.remove('happy-jump', 'happy-dance', 'sad-shake');
  void badgerSvg.offsetWidth; // перезапуск CSS-анімації

  if (state === 'win') {
    // Чергуємо різні радісні танці персонажа
    badgerSvg.classList.add(winVariantCounter % 2 === 0 ? 'happy-jump' : 'happy-dance');
    badgerMouth.setAttribute('d', 'M112,150 Q135,176 158,150 Q150,180 135,180 Q120,180 112,150 Z');
    badgerTongue.setAttribute('opacity', '1');
    badgerArm.style.transform = 'rotate(18deg)';
  } else if (state === 'wrong') {
    badgerSvg.classList.add('sad-shake');
    // Здивований круглий ротик
    badgerMouth.setAttribute('d', 'M126,158 A9,9 0 1,0 144,158 A9,9 0 1,0 126,158 Z');
    badgerTongue.setAttribute('opacity', '0');
    badgerArm.style.transform = 'rotate(-16deg)';
  } else {
    // Привітний спокійний стан
    badgerMouth.setAttribute('d', 'M116,154 Q135,172 154,154 Q148,176 135,176 Q122,176 116,154 Z');
    badgerTongue.setAttribute('opacity', '1');
    badgerArm.style.transform = 'rotate(0deg)';
  }
}

// Завантаження поточного рівня
function loadLevel(index) {
  isLocked = false;
  currentLevel = (index + GAME_GROUPS.length) % GAME_GROUPS.length;
  const group = GAME_GROUPS[currentLevel];

  setBadgerEmotion('idle');

  // Малюємо 3 картини поточної групи на мотузці
  picturesRow.innerHTML = group.items
    .map((itemKey, idx) => buildPictureFrameHTML(itemKey, idx))
    .join('');

  // При натисканні на саму картину вона весело гойдається зі звуком
  document.querySelectorAll('.hanging-frame').forEach((frame, idx) => {
    frame.addEventListener('click', () => {
      sound.playWoodTap(380 + idx * 70);
      frame.classList.remove('entering', 'win-anim');
      void frame.offsetWidth;
      frame.classList.add('win-anim');
    });
  });

  // Формуємо 3 варіанти назви групи (1 правильний + 2 випадкові неправильні)
  const wrongPool = GAME_GROUPS
    .map(g => g.name)
    .filter(n => n !== group.name)
    .sort(() => Math.random() - 0.5)
    .slice(0, 2);

  const options = [group.name, ...wrongPool].sort(() => Math.random() - 0.5);

  answersZone.innerHTML = options
    .map((opt, idx) => buildAnswerStandHTML(opt, idx))
    .join('');

  // Обробка вибору відповіді
  document.querySelectorAll('.answer-stand').forEach(stand => {
    stand.addEventListener('click', () => {
      if (isLocked) return;
      const chosen = stand.getAttribute('data-answer');

      if (chosen === group.name) {
        // Правильна відповідь! Активний звуковий, анімаційний та візуальний фідбек
        isLocked = true;
        stand.classList.add('correct-hit');

        const variant = winVariantCounter % 3;
        sound.playSuccess(variant);
        spawnWinParticles(variant);
        setBadgerEmotion('win');
        winVariantCounter++;

        // Картини на мотузці танцюють
        document.querySelectorAll('.hanging-frame').forEach(f => {
          f.classList.remove('entering');
          void f.offsetWidth;
          f.classList.add('win-anim');
        });

        // Автоматичний перехід до наступної групи після святкування
        setTimeout(() => {
          loadLevel(currentLevel + 1);
        }, 1750);
      } else {
        // Неправильна відповідь: похитування, звук пружинки та здивування Борсучка
        sound.playWrong();
        stand.classList.remove('wrong-hit');
        void stand.offsetWidth;
        stand.classList.add('wrong-hit');
        setBadgerEmotion('wrong');

        document.querySelectorAll('.hanging-frame').forEach(f => {
          f.classList.remove('entering', 'wrong-anim');
          void f.offsetWidth;
          f.classList.add('wrong-anim');
        });

        setTimeout(() => {
          if (!isLocked) setBadgerEmotion('idle');
        }, 900);
      }
    });
  });
}

// Живе кліпання очима Борсучка кожні кілька секунд
setInterval(() => {
  const eyes = document.getElementById('badger-eyes');
  if (eyes) {
    eyes.style.transformOrigin = '135px 118px';
    eyes.style.transform = 'scaleY(0.1)';
    setTimeout(() => { eyes.style.transform = 'scaleY(1)'; }, 140);
  }
}, 3800);

// Клік на Борсучка викликає дружній рух та звук
document.getElementById('character-zone').addEventListener('click', () => {
  sound.playWoodTap(520);
  setBadgerEmotion('win');
  setTimeout(() => {
    if (!isLocked) setBadgerEmotion('idle');
  }, 900);
});

// Кнопки миттєвого переходу Назад та Далі (без обов'язкового проходження)
document.getElementById('btn-prev').addEventListener('click', () => {
  sound.playWoodTap(280);
  loadLevel(currentLevel - 1);
});

document.getElementById('btn-next').addEventListener('click', () => {
  sound.playWoodTap(420);
  loadLevel(currentLevel + 1);
});

// Запуск першого рівня
loadLevel(0);
</script>
</body>
</html>
