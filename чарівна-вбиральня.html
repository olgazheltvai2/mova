<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чарівна вбиральня</title>
<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<style>
  :root{
    --gold: #ffd166;
    --ok: #43e97b;
    --bad: #ff6b6b;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family: Arial, sans-serif;
    background:#1a0a2e;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    touch-action:manipulation;
    user-select:none;
  }

  #app{
    position:relative; width:100vw; height:100vh;
    background: transparent;
    overflow:hidden;
  }

  /* ===== канвас для конфетті та іскор ===== */
  #fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:40; }

  /* ===== сцена з персонажем ===== */
  #stageWrap{
    position:absolute; left:50%; top:0; bottom:0;
    transform:translateX(-50%);
    height:100%; width:min(58vw, 92vh);
    display:flex; align-items:flex-end; justify-content:center;
    pointer-events:none;
  }
  #stage{ width:100%; height:100%; display:block; filter:drop-shadow(0 18px 25px rgba(0,0,0,.35)); }

  #charAnim{ transform-box: view-box; transform-origin: 200px 400px; }
  #charAnim.happy{ animation: happyBounce .85s ease; }
  #charAnim.sad{ animation: sadShake .55s ease; }
  #charAnim.dancing{ animation: danceLoop 1.1s ease-in-out infinite; }

  @keyframes happyBounce{
    0%{ transform:translateY(0) rotate(0deg) scale(1); }
    25%{ transform:translateY(-26px) rotate(-6deg) scale(1.05); }
    50%{ transform:translateY(0px) rotate(5deg) scale(1); }
    75%{ transform:translateY(-12px) rotate(-3deg) scale(1.02); }
    100%{ transform:translateY(0) rotate(0deg) scale(1); }
  }
  @keyframes sadShake{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    20%{ transform:translateX(-10px) rotate(-4deg); }
    40%{ transform:translateX(9px) rotate(4deg); }
    60%{ transform:translateX(-7px) rotate(-3deg); }
    80%{ transform:translateX(6px) rotate(2deg); }
  }
  @keyframes danceLoop{
    0%{ transform:translateY(0) rotate(-4deg); }
    25%{ transform:translateY(-30px) rotate(4deg); }
    50%{ transform:translateY(0) rotate(-4deg) scale(1.03); }
    75%{ transform:translateY(-18px) rotate(6deg); }
    100%{ transform:translateY(0) rotate(-4deg); }
  }

  #armL, #armR, #layerBag{ transform-box: view-box; }
  #armL{ transform-origin:160px 218px; }
  #armR{ transform-origin:240px 218px; }
  #layerBag{ transform-origin:240px 218px; }
  .waveL{ animation: waveL .5s ease-in-out infinite alternate; }
  .waveR{ animation: waveR .5s ease-in-out infinite alternate; }
  @keyframes waveL{ from{ transform:rotate(0deg);} to{ transform:rotate(-38deg);} }
  @keyframes waveR{ from{ transform:rotate(0deg);} to{ transform:rotate(38deg);} }

  #legL, #legR{ transform-box: view-box; }
  #legL{ transform-origin:172px 422px; }
  #legR{ transform-origin:228px 422px; }
  .kickL{ animation: kickL .55s ease-in-out infinite alternate; }
  .kickR{ animation: kickR .55s ease-in-out infinite alternate; }
  @keyframes kickL{ from{ transform:rotate(6deg);} to{ transform:rotate(-14deg);} }
  @keyframes kickR{ from{ transform:rotate(-6deg);} to{ transform:rotate(14deg);} }

  .eye{ transform-box: fill-box; transform-origin:center; animation: blink 4.2s infinite; }
  .eye2{ animation-delay:.05s; }
  @keyframes blink{
    0%,92%,100%{ transform:scaleY(1); }
    95%{ transform:scaleY(.12); }
  }

  .sparkleSlow{ animation: spin 9s linear infinite; transform-box: fill-box; transform-origin:center; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ===== нижні мінімалістичні кнопки навігації ===== */
  .navBtn{
    position:absolute; bottom:22px; z-index:50;
    width:58px; height:58px; border-radius:50%; border:none;
    background:linear-gradient(145deg,#ffe29a,#ff9a5a);
    box-shadow:0 6px 0 #c96a2e, 0 10px 18px rgba(0,0,0,.35);
    color:#5a2b06; font-size:24px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .12s ease, opacity .2s ease;
  }
  .navBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #c96a2e, 0 6px 10px rgba(0,0,0,.3); }
  .navBtn:disabled{ opacity:.35; cursor:default; box-shadow:0 6px 0 #8a6a4e33; }
  #btnBack{ left:22px; }
  
  /* Кнопку далі зміщено лівіше (right: 90px), щоб не перекривала кнопку фонів */
  #btnNext{ right:90px; background:linear-gradient(145deg,#b6ffd8,#43e97b); box-shadow:0 6px 0 #1f9c53,0 10px 18px rgba(0,0,0,.35); color:#0d4a26; }
  #btnNext:active{ box-shadow:0 2px 0 #1f9c53, 0 6px 10px rgba(0,0,0,.3); }

  /* ===== індикатор рівнів (маленькі вогники, без слів) ===== */
  #dots{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:7px; z-index:50;
  }
  #dots span{
    width:11px; height:11px; border-radius:50%;
    background:rgba(255,255,255,.25); border:2px solid rgba(255,255,255,.4);
    transition:all .25s ease;
  }
  #dots span.done{ background:var(--gold); border-color:#fff; box-shadow:0 0 8px var(--gold); }
  #dots span.cur{ transform:scale(1.35); border-color:#fff; }

  /* ===== панелі (напівпрозорі, щоб не перекривати фон) ===== */
  #mathPanel, #itemsPanel {
    position:absolute; top:56px; bottom:150px; width:min(30vw,300px);
    border-radius:34px; padding:16px 14px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 14px 28px rgba(0,0,0,0.25), inset 0 0 0 2px rgba(255,255,255,0.1);
    border: 2px dashed rgba(255,255,255,0.3);
    z-index:30;
  }
  
  #mathPanel {
    left:14px; display:flex; flex-direction:column; gap:10px; overflow:hidden;
  }
  
  #mathSchemeWrap{
    width:100%; flex:1 1 auto; min-height:0;
    display: flex; align-items: center; justify-content: center; padding: 10px;
  }
  #questionText{
    font-size: 26px; font-weight: 800; color: #fff; text-align: center;
    text-shadow: 0 4px 6px rgba(0,0,0,0.4); line-height: 1.2;
    font-family: Arial, sans-serif;
  }
  #answers{ display:flex; gap:10px; justify-content:center; padding-bottom:4px; }
  .ansBtn{
    width:110px; height:56px; border-radius:28px; border:none; cursor:pointer;
    font-size:22px; font-weight:800; color:#fff;
    font-family: Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 0 rgba(0,0,0,.25), inset 0 0 0 3px rgba(255,255,255,.4);
    transition:transform .12s ease;
  }
  .ansBtn:active{ transform:translateY(4px) scale(.96); }
  .ansBtn.c0{ background:radial-gradient(circle at 30% 25%, #ff9d7a, #e8462a); }
  .ansBtn.c1{ background:radial-gradient(circle at 30% 25%, #7de6c8, #12a37e); }
  .ansBtn.c2{ background:radial-gradient(circle at 30% 25%, #b39dff, #6a3df0); }
  .ansBtn.wrongFlash{ animation:flashBad .5s ease; }
  .ansBtn.rightFlash{ animation:flashGood .6s ease; }
  @keyframes flashBad{ 0%,100%{filter:none;} 40%{ filter:brightness(.6) saturate(2); transform:translateX(-6px);} 60%{transform:translateX(6px);} }
  @keyframes flashGood{ 0%{transform:scale(1);} 50%{transform:scale(1.25);} 100%{transform:scale(1);} }

  #itemsPanel {
    right:14px; display:flex; flex-direction:column; gap:12px; justify-content:center;
    opacity:0; pointer-events:none; transform:translateX(20px);
    transition:opacity .35s ease, transform .35s ease;
  }
  #itemsPanel.show{ opacity:1; pointer-events:auto; transform:translateX(0); }
  
  .itemBtn{
    border:none; border-radius:24px; padding:8px; cursor:pointer;
    background:linear-gradient(160deg, rgba(255,255,255,.35), rgba(255,255,255,.08));
    box-shadow:0 6px 0 rgba(0,0,0,.2), inset 0 0 0 3px rgba(255,255,255,.35);
    transition:transform .15s ease;
  }
  .itemBtn:hover{ transform:translateY(-3px) scale(1.03); }
  .itemBtn:active{ transform:translateY(3px) scale(.98); }
  .itemBtn.picked{ box-shadow:0 0 0 4px var(--gold), 0 6px 0 rgba(0,0,0,.2); }
  .itemIcon{ width:100%; height:66px; display:block; }

  #btnStartGame:active { transform:translateY(6px); box-shadow: 0 2px 0 #1f9c53, 0 8px 15px rgba(0,0,0,0.4) !important; }

  @media (max-width:760px){
    #mathPanel, #itemsPanel{ width:38vw; }
  }
</style>
</head>
<body>

<!-- Екран початку гри -->
<div id="startScreen" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:20000; display:flex; justify-content:center; align-items:center; backdrop-filter:blur(5px);">
  <button id="btnStartGame" style="padding: 20px 50px; font-size: 32px; font-weight: 800; font-family: Arial, sans-serif; border-radius: 40px; border: none; background: linear-gradient(145deg, #b6ffd8, #43e97b); color: #0d4a26; cursor: pointer; box-shadow: 0 8px 0 #1f9c53, 0 15px 25px rgba(0,0,0,0.4); transition: transform 0.1s;">Почати гру</button>
</div>

<div id="app">
  <canvas id="fx"></canvas>

  <div id="dots"></div>

  <!-- сцена з персонажем -->
  <div id="stageWrap">
    <svg id="stage" viewBox="0 0 400 640" preserveAspectRatio="xMidYMax meet">
      <defs>
        <!-- === форма зірочки для декору (переиспользуємо всюди) === -->
        <symbol id="starShape" viewBox="0 0 20 20">
          <path d="M10 0 L12.6 7.2 L20 7.6 L14.1 12.3 L16.1 20 L10 15.6 L3.9 20 L5.9 12.3 L0 7.6 L7.4 7.2 Z"/>
        </symbol>
        <!-- === форма квіточки === -->
        <symbol id="flowerShape" viewBox="0 0 20 20">
          <circle cx="10" cy="4" r="4"/><circle cx="16" cy="10" r="4"/>
          <circle cx="10" cy="16" r="4"/><circle cx="4" cy="10" r="4"/>
          <circle cx="10" cy="10" r="3.4" fill="#ffd166"/>
        </symbol>

        <!-- === градієнти шкіри та обличчя === -->
        <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffe0bd"/><stop offset="100%" stop-color="#ffc899"/>
        </linearGradient>
        <radialGradient id="blushGrad" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#ff8fa3" stop-opacity=".75"/><stop offset="100%" stop-color="#ff8fa3" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="baseCami" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d9c8ff"/><stop offset="100%" stop-color="#b79aff"/>
        </linearGradient>

        <!-- === зачіски === -->
        <linearGradient id="hairBraid" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a15a2e"/><stop offset="100%" stop-color="#6b3410"/>
        </linearGradient>
        <linearGradient id="hairCurl" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffd979"/><stop offset="100%" stop-color="#e8a83c"/>
        </linearGradient>
        <linearGradient id="hairPony" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6a2e40"/><stop offset="100%" stop-color="#3d1524"/>
        </linearGradient>

        <!-- === головні убори === -->
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff3b0"/><stop offset="50%" stop-color="#ffd166"/><stop offset="100%" stop-color="#e8952a"/>
        </linearGradient>
        <linearGradient id="strawGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f6d68a"/><stop offset="100%" stop-color="#d9a441"/>
        </linearGradient>
        <linearGradient id="bowPink" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffc2e2"/><stop offset="100%" stop-color="#ff6fb0"/>
        </linearGradient>

        <!-- === сукні === -->
        <linearGradient id="dressBlue" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8ecbff"/><stop offset="100%" stop-color="#3d7cf0"/>
        </linearGradient>
        <linearGradient id="dressPink" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb3d1"/><stop offset="100%" stop-color="#f0508c"/>
        </linearGradient>
        <linearGradient id="dressYellow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff0a8"/><stop offset="100%" stop-color="#ffc93c"/>
        </linearGradient>

        <!-- === сумки === -->
        <linearGradient id="bagPastel" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c9b4ff"/><stop offset="100%" stop-color="#7b5cff"/>
        </linearGradient>
        <linearGradient id="bagRed" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff8fa8"/><stop offset="100%" stop-color="#e8244c"/>
        </linearGradient>
        <linearGradient id="bagBrown" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#d9a86a"/><stop offset="100%" stop-color="#9a6432"/>
        </linearGradient>

        <!-- === фони (зарезервовано) === -->
        <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#aee8ff"/><stop offset="100%" stop-color="#e8fff0"/>
        </linearGradient>
        <linearGradient id="groundGreen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8fe08a"/><stop offset="100%" stop-color="#4fae55"/>
        </linearGradient>
        <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1b1042"/><stop offset="100%" stop-color="#4a2a72"/>
        </linearGradient>
        <linearGradient id="skyPastel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd6f0"/><stop offset="100%" stop-color="#d6e8ff"/>
        </linearGradient>

        <!-- === звірята === -->
        <linearGradient id="petOrange" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb877"/><stop offset="100%" stop-color="#ff8a3d"/>
        </linearGradient>
        <linearGradient id="petGrey" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f2f2f7"/><stop offset="100%" stop-color="#c9c9dd"/>
        </linearGradient>
        <linearGradient id="petBlue" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9fd8ff"/><stop offset="100%" stop-color="#4fa8f0"/>
        </linearGradient>

        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".25"/>
        </filter>
      </defs>

      <!-- шар 1: фон (рівень 9) -->
      <g id="layerBg"></g>
      <!-- шар 2: улюбленець (рівень 10) -->
      <g id="layerPet"></g>

      <g id="charAnim">
        <!-- шар 3: базова фігурка (завжди видима) -->
        <g id="charBase">
          <!-- ліва нога -->
          <g id="legL">
            <path d="M168 420 q-14 90 -6 175 q0 6 8 6 h16 q6 0 6 -6 q-2 -90 4 -175 Z" fill="url(#skinGrad)"/>
          </g>
          <!-- права нога -->
          <g id="legR">
            <path d="M232 420 q14 90 6 175 q0 6 -8 6 h-16 q-6 0 -6 -6 q2 -90 -4 -175 Z" fill="url(#skinGrad)"/>
          </g>

          <!-- тулуб (базова майка, буде перекрита сукнею) -->
          <path id="baseTorso" d="M158 210 Q200 195 242 210 L252 405 Q200 425 148 405 Z" fill="url(#baseCami)"/>

          <!-- права рука -->
          <g id="armR">
            <path d="M240 218 q34 18 46 78 q4 20 -6 66 q-3 12 -16 10 q-10 -2 -9 -14 q6 -46 0 -62 q-8 -22 -28 -46 Z" fill="url(#skinGrad)"/>
            <circle cx="278" cy="372" r="15" fill="url(#skinGrad)"/>
          </g>
          <!-- ліва рука -->
          <g id="armL">
            <path d="M160 218 q-34 18 -46 78 q-4 20 6 66 q3 12 16 10 q10 -2 9 -14 q-6 -46 0 -62 q8 -22 28 -46 Z" fill="url(#skinGrad)"/>
            <circle cx="122" cy="372" r="15" fill="url(#skinGrad)"/>
          </g>

          <!-- шия -->
          <rect x="188" y="192" width="24" height="26" rx="8" fill="url(#skinGrad)"/>

          <!-- голова -->
          <circle cx="200" cy="150" r="55" fill="url(#skinGrad)"/>

          <!-- щічки -->
          <circle cx="168" cy="165" r="14" fill="url(#blushGrad)"/>
          <circle cx="232" cy="165" r="14" fill="url(#blushGrad)"/>

          <!-- очі -->
          <g class="eye">
            <ellipse cx="180" cy="150" rx="7" ry="9" fill="#3a2145"/>
            <circle cx="182.5" cy="146" r="2.2" fill="#fff"/>
          </g>
          <g class="eye eye2">
            <ellipse cx="220" cy="150" rx="7" ry="9" fill="#3a2145"/>
            <circle cx="222.5" cy="146" r="2.2" fill="#fff"/>
          </g>
          <!-- брови -->
          <path d="M170 134 q10 -6 20 -1" stroke="#7a4a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M210 133 q10 -5 20 1" stroke="#7a4a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- усмішка -->
          <path id="mouthPath" d="M182 175 q18 16 36 0" stroke="#c4436a" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>

        <!-- шар 4: волосся (рівень 1) -->
        <g id="layerHair"></g>
        <!-- шар 5: сукня (рівень 4) -->
        <g id="layerDress"></g>
        <!-- шар 6: взуття (рівень 8) -->
        <g id="layerShoes"></g>
        <!-- шар 7: шарф (рівень 5) -->
        <g id="layerScarf"></g>
        <!-- шар 8: прикраса (рівень 6) -->
        <g id="layerNecklace"></g>
        <!-- шар 9: головний убір (рівень 2) -->
        <g id="layerHat"></g>
        <!-- шар 10: окуляри (рівень 3) -->
        <g id="layerGlasses"></g>
        <!-- шар 11: сумочка (рівень 7) -->
        <g id="layerBag"></g>
      </g>
    </svg>
  </div>

  <!-- панель питань -->
  <div id="mathPanel">
    <div id="mathSchemeWrap"></div>
    <div id="answers"></div>
  </div>

  <!-- панель вибору вбрання -->
  <div id="itemsPanel">
    <div id="itemButtons"></div>
  </div>

  <button id="btnBack" class="navBtn">&#9664;</button>
  <button id="btnNext" class="navBtn" disabled>&#9654;</button>
</div>

<!-- Theme Manager UI -->
<button id="themeSettingsBtn" style="position:fixed; bottom:22px; right:22px; z-index:10000; font-size:24px; background:rgba(255,255,255,0.8); backdrop-filter:blur(4px); border:none; border-radius:50%; width:58px; height:58px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.2), 0 10px 18px rgba(0,0,0,0.35); transition:transform .12s ease;">⚙️</button>

<div id="themeModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:20px; border-radius:10px; z-index:10001; box-shadow:0 5px 15px rgba(0,0,0,0.5); width:80vw; max-width:600px; max-height:60vh; overflow-y:auto;">
    <h2 style="margin-top:0; font-family:Arial, sans-serif; color:#333;">Оберіть фон</h2>
    <div id="themeGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px;"></div>
    <button id="closeThemeModal" style="margin-top:20px; padding:10px 20px; background:#f72585; color:white; border:none; border-radius:5px; cursor:pointer; width:100%; font-weight:bold; font-family: Arial, sans-serif;">Закрити</button>
</div>
<div id="themeOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:10000;"></div>

<!-- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ (Екран-заглушка) -->
<div id="block-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999999; flex-direction:column; justify-content:center; align-items:center; color:red; font-size:40px; font-weight:bold; text-align:center; padding:20px; box-sizing:border-box;">
  Зачекай! Зараз не твій урок.
</div>

<script>
/* ==========================================================================
   ФАЙРБЕЙЗ, УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ, РАДАР
   ========================================================================== */
const myName = sessionStorage.getItem('myName') || (new URLSearchParams(window.location.search).get('user')) || ('Гість_' + Math.floor(Math.random() * 1000));
sessionStorage.setItem('myName', myName);

const tabId = Math.random().toString(36).substr(2, 9);
let isRemoteAction = false;

const firebaseConfig = {
    databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
    projectId: "lesson-13c44"
};
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

// Надсилання дій
function sendAction(actionData) {
    db.ref('game_action').set({
        senderId: myName + '_' + tabId,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        ...actionData
    });
}

// Прослуховування дій з виправленням "автоматичного пролистування" (ігноруємо старі дії)
let initialActionLoad = true;
db.ref('game_action').on('value', snap => {
    const data = snap.val();
    
    // Ігноруємо перше завантаження, щоб гра не підтягувала стару відповідь
    if (initialActionLoad) {
        initialActionLoad = false;
        return;
    }
    
    if (!data) return;
    if (data.senderId === myName + '_' + tabId) return;

    isRemoteAction = true;
    if (data.type === 'answer') {
        processAnswer(data.val, data.isCorrect, data.btnIndex);
    } else if (data.type === 'item') {
        processItem(data.lvlIdx, data.progIdx, data.i, data.btnIndex);
    } else if (data.type === 'next') {
        processNext();
    } else if (data.type === 'back') {
        processBack();
    } else if (data.type === 'start_game') {
        processStartGame();
    }
    isRemoteAction = false;
});

/* ==========================================================================
   ЧАРІВНА ВБИРАЛЬНЯ — логіка гри
   ========================================================================== */

function scatterSymbol(id, cx, cy, rx, ry, count, size, color, seed){
  let s = '';
  for(let i=0;i<count;i++){
    const ang = (i/count)*Math.PI*2 + seed*0.9;
    const rr = 0.4 + 0.6*((i*seed)%3)/3;
    const x = cx + Math.cos(ang)*rx*rr - size/2;
    const y = cy + Math.sin(ang)*ry*rr - size/2;
    s += `<use href="#${id}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${size}" height="${size}" fill="${color}"/>`;
  }
  return s;
}

function polkaGrid(x0,y0,w,h,step,r,color){
  let s='';
  for(let y=y0, row=0; y<y0+h; y+=step, row++){
    for(let x=x0 + (row%2? step/2:0); x<x0+w; x+=step){
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}" opacity=".85"/>`;
    }
  }
  return s;
}

function beadArc(cx,cy,r,count,beadR,colors){
  let s='';
  for(let i=0;i<count;i++){
    const t = Math.PI*0.15 + (Math.PI*0.7)*(i/(count-1));
    const x = cx + Math.cos(t)*r;
    const y = cy + Math.sin(t)*r*0.55 + 8;
    const c = colors[i%colors.length];
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${beadR}" fill="${c}" stroke="#ffffff55" stroke-width="1"/>`;
  }
  return s;
}

function curlCluster(cx,cy,rx,ry,count,r,fill){
  let s='';
  for(let i=0;i<count;i++){
    const ang = Math.PI*0.95 + (Math.PI*2.15)*(i/count);
    const x = cx + Math.cos(ang)*rx;
    const y = cy + Math.sin(ang)*ry;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}"/>`;
  }
  return s;
}

function starField(count){
  let s='';
  for(let i=0;i<count;i++){
    const x = 15 + (i*37)%370;
    const y = 10 + (i*53)%230;
    const sz = 6 + (i%3)*3;
    s += `<use href="#starShape" x="${x}" y="${y}" width="${sz}" height="${sz}" fill="#fff" opacity="${0.5+(i%5)/10}"/>`;
  }
  return s;
}

const state = {

function getSeededRandom(seed) {
    return function() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
    };
}
const currentSeed = Math.floor(Date.now() / (1000 * 60 * 60)); 
const rand = getSeededRandom(currentSeed);

function shuffleSeeded(arr) {
    let copy = [...arr];
    for(let i=copy.length-1; i>0; i--){
        const j = Math.floor(rand() * (i+1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

const shuffledQuestions = shuffleSeeded(ALL_QUESTIONS);
LEVELS.forEach((_,i)=> state.problems.push(shuffledQuestions[i]));

/* ================================ ЗВУК (Web Audio) ================================ */

let actx = null;
function ensureAudio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }
function tone(freq, dur, type='sine', delay=0, vol=.22){
  ensureAudio();
  const t0 = actx.currentTime + delay;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function playSuccess(){ [523,659,784].forEach((f,i)=>tone(f,.28,'triangle',i*0.09)); }
function playError(){ tone(220,.22,'sawtooth',0,.18); tone(160,.28,'sawtooth',0.12,.18); }
function playSelect(){ tone(880,.18,'sine',0,.2); tone(1180,.16,'sine',0.06,.14); }
function playFanfare(){
  const notes = [523,659,784,1046,784,1046,1318];
  notes.forEach((f,i)=>tone(f,.32,'triangle',i*0.14,.22));
  setTimeout(()=>{ [523,659,784,1046].forEach(f=>tone(f,1.1,'sine',0,.12)); }, notes.length*140);
}

/* ================================ ЧАСТИНКИ / КОНФЕТІ ================================ */

const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
function resizeFx(){ fxCanvas.width = innerWidth; fxCanvas.height = innerHeight; }
resizeFx(); window.addEventListener('resize', resizeFx);

let particles = [];
const CONFETTI_COLORS = ['#ff6fb0','#ffd166','#4fc3ff','#7de6c8','#b39dff','#ff9d7a'];
function burst(x,y,count=36,colors=CONFETTI_COLORS){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const speed = 3+Math.random()*7;
    particles.push({
      x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed-3,
      g:0.22+Math.random()*0.08, life:60+Math.random()*30,
      size:4+Math.random()*5, color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.4, shape: Math.random()<.5?'rect':'circle'
    });
  }
}
function stepFx(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; p.rot+=p.vr;
    fxCtx.save();
    fxCtx.translate(p.x,p.y); fxCtx.rotate(p.rot);
    fxCtx.globalAlpha = Math.max(0, Math.min(1,p.life/40));
    fxCtx.fillStyle = p.color;
    if(p.shape==='rect') fxCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    else { fxCtx.beginPath(); fxCtx.arc(0,0,p.size/2,0,7); fxCtx.fill(); }
    fxCtx.restore();
  });
  particles = particles.filter(p=>p.life>0 && p.y < fxCanvas.height+40);
  requestAnimationFrame(stepFx);
}
stepFx();

let fireworksTimer = null;
function startFireworks(){
  stopFireworks();
  fireworksTimer = setInterval(()=>{
    const x = 60 + Math.random()*(innerWidth-120);
    const y = 60 + Math.random()*(innerHeight*0.5);
    burst(x,y,44);
  }, 380);
}
function stopFireworks(){ if(fireworksTimer){ clearInterval(fireworksTimer); fireworksTimer=null; } }

/* ================================ РЕНДЕР ПИТАНЬ ================================ */

function renderMathScheme(problem, levelIdx){
  const wrap = document.getElementById('mathSchemeWrap');
  wrap.innerHTML = `<div id="questionText">${problem.q}</div>`;
}

function renderAnswers(problem){
  const wrap = document.getElementById('answers');
  wrap.innerHTML = '';
  const opts = ["Правда", "Ні"];
  opts.forEach((val, i)=>{
    const btn = document.createElement('button');
    btn.className = `ansBtn c${i}`;
    btn.textContent = val;
    const isCorrect = (val === "Правда" && problem.a === true) || (val === "Ні" && problem.a === false);
    btn.addEventListener('click', () => {
        if(!isRemoteAction) sendAction({ type: 'answer', val, isCorrect, btnIndex: i });
        processAnswer(val, isCorrect, i);
    });
    wrap.appendChild(btn);
  });
}

function processAnswer(val, isCorrect, btnIndex){
  const btnEl = document.querySelectorAll('.ansBtn')[btnIndex];
  if(!btnEl) return;
  ensureAudio();
  const rect = btnEl.getBoundingClientRect();
  if(isCorrect){
    playSuccess();
    btnEl.classList.add('rightFlash');
    burst(rect.left+rect.width/2, rect.top+rect.height/2, 30);
    reactHappy();
    state.progress[state.level-1].solvedMath = true;
    setTimeout(render, 500);
  } else {
    playError();
    btnEl.classList.add('wrongFlash');
    reactSad();
    setTimeout(()=>btnEl.classList.remove('wrongFlash'), 500);
  }
}

/* ================================ РЕНДЕР ПАНЕЛІ ВБРАННЯ ================================ */

function renderItems(lvl, progIdx){
  const wrap = document.getElementById('itemButtons');
  wrap.innerHTML = '';
  lvl.options.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className = 'itemBtn' + (state.progress[progIdx].chosenItem===i ? ' picked':'');
    btn.innerHTML = `<svg class="itemIcon" viewBox="${lvl.crop}">${opt.svg}</svg>`;
    btn.addEventListener('click', ()=> {
        if(!isRemoteAction) sendAction({ type: 'item', lvlIdx: progIdx, progIdx, i, btnIndex: i });
        processItem(progIdx, progIdx, i, i);
    });
    wrap.appendChild(btn);
  });
}

function processItem(lvlIdx, progIdx, i, btnIndex){
  const lvl = LEVELS[lvlIdx];
  const btnEl = document.querySelectorAll('.itemBtn')[btnIndex];
  if(!btnEl) return;
  ensureAudio();
  document.getElementById(lvl.layer).innerHTML = lvl.options[i].svg;
  document.querySelectorAll('#itemButtons .itemBtn').forEach(b=>b.classList.remove('picked'));
  btnEl.classList.add('picked');
  state.progress[progIdx].chosenItem = i;
  playSelect();
  const rect = btnEl.getBoundingClientRect();
  burst(rect.left+rect.width/2, rect.top+rect.height/2, 24);
  reactHappy();
  updateNav();
}

/* ================================ РЕАКЦІЇ ПЕРСОНАЖА ================================ */

const charAnim = document.getElementById('charAnim');
function reactHappy(){
  charAnim.classList.remove('sad'); charAnim.classList.remove('happy');
  void charAnim.offsetWidth;
  charAnim.classList.add('happy');
  setTimeout(()=>charAnim.classList.remove('happy'), 850);
}
function reactSad(){
  charAnim.classList.remove('happy'); charAnim.classList.remove('sad');
  void charAnim.offsetWidth;
  charAnim.classList.add('sad');
  setTimeout(()=>charAnim.classList.remove('sad'), 550);
}

/* ================================ НАВІГАЦІЯ ТА РЕНДЕР ЕКРАНУ ================================ */

function renderDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  LEVELS.forEach((_,i)=>{
    const d = document.createElement('span');
    if(state.progress[i].chosenItem!==null) d.classList.add('done');
    if(i+1===state.level && state.stage==='play') d.classList.add('cur');
    dots.appendChild(d);
  });
}

function updateNav(){
  const back = document.getElementById('btnBack');
  const next = document.getElementById('btnNext');
  if(state.stage==='victory'){
    back.style.visibility='visible';
    next.disabled = true;
    return;
  }
  back.style.visibility = (state.level>1) ? 'visible':'hidden';
  next.disabled = state.progress[state.level-1].chosenItem===null;
}

function render(){
  if(state.stage==='victory'){ renderVictory(); return; }

  const idx = state.level-1;
  const lvl = LEVELS[idx];
  const prog = state.progress[idx];
  const problem = state.problems[idx];

  document.getElementById('mathPanel').style.display = prog.solvedMath ? 'none':'flex';
  const itemsPanel = document.getElementById('itemsPanel');

  if(prog.solvedMath){
    itemsPanel.classList.add('show');
    renderItems(lvl, idx);
  } else {
    itemsPanel.classList.remove('show');
    renderMathScheme(problem, idx);
    renderAnswers(problem);
  }
  renderDots();
  updateNav();
}

/* ================================ ФІНАЛЬНИЙ ТАНЕЦЬ ================================ */

function renderVictory(){
  document.getElementById('mathPanel').style.display='none';
  document.getElementById('itemsPanel').classList.remove('show');
  renderDots();
  updateNav();
  charAnim.classList.remove('happy','sad');
  charAnim.classList.add('dancing');
  document.getElementById('armL').classList.add('waveL');
  document.getElementById('armR').classList.add('waveR');
  document.getElementById('legL').classList.add('kickL');
  document.getElementById('legR').classList.add('kickR');
  document.getElementById('layerBag').classList.add('waveR');
  playFanfare();
  startFireworks();

  setTimeout(() => {
    if (state.stage === 'victory') {
      charAnim.classList.remove('dancing');
      document.getElementById('armL').classList.remove('waveL');
      document.getElementById('armR').classList.remove('waveR');
      document.getElementById('legL').classList.remove('kickL');
      document.getElementById('legR').classList.remove('kickR');
      document.getElementById('layerBag').classList.remove('waveR');
      stopFireworks();
    }
  }, 4000);
}

/* ================================ ОБРОБНИКИ КНОПОК ================================ */

document.getElementById('btnNext').addEventListener('click', ()=>{
  if(!isRemoteAction) sendAction({ type: 'next' });
  processNext();
});

function processNext(){
  ensureAudio();
  if(state.stage==='victory') return;
  if(state.progress[state.level-1].chosenItem===null) return;
  if(state.level < LEVELS.length){
    state.level++;
    render();
  } else {
    state.stage = 'victory';
    render();
  }
}

document.getElementById('btnBack').addEventListener('click', ()=>{
  if(!isRemoteAction) sendAction({ type: 'back' });
  processBack();
});

function processBack(){
  ensureAudio();
  if(state.stage==='victory'){
    state.stage='play';
    stopFireworks();
    charAnim.classList.remove('dancing');
    document.getElementById('armL').classList.remove('waveL');
    document.getElementById('armR').classList.remove('waveR');
    document.getElementById('legL').classList.remove('kickL');
    document.getElementById('legR').classList.remove('kickR');
    document.getElementById('layerBag').classList.remove('waveR');
    render();
    return;
  }
  if(state.level>1){ state.level--; render(); }
}

/* ================================ СТАРТ ГРИ ================================ */
render();
