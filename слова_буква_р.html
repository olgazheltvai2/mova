<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Асоціації</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Verdana', 'Segoe UI', sans-serif;
    background: #6ec4e8;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Living scenic background */
  #bg-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 30;
    pointer-events: none;
  }

  /* Background animations */
  .cloud-slow { animation: driftSlow 68s linear infinite; }
  .cloud-med  { animation: driftMed 46s linear infinite; }
  .cloud-fast { animation: driftFast 34s linear infinite; }
  .sun-rays   { transform-origin: 185px 125px; animation: spinSun 48s linear infinite; }
  .sway-slow  { transform-origin: bottom center; animation: sway 6s ease-in-out infinite; }
  .sway-alt   { transform-origin: bottom center; animation: swayAlt 5.2s ease-in-out infinite; }
  .butterfly-1 { animation: flyPath1 22s ease-in-out infinite; }
  .butterfly-2 { animation: flyPath2 27s ease-in-out infinite; }
  .bf-wing-l  { transform-origin: 0 0; animation: flapL 0.24s ease-in-out infinite alternate; }
  .bf-wing-r  { transform-origin: 0 0; animation: flapR 0.24s ease-in-out infinite alternate; }

  @keyframes driftSlow {
    0%   { transform: translateX(-220px); }
    100% { transform: translateX(1820px); }
  }
  @keyframes driftMed {
    0%   { transform: translateX(-260px); }
    100% { transform: translateX(1860px); }
  }
  @keyframes driftFast {
    0%   { transform: translateX(-180px); }
    100% { transform: translateX(1780px); }
  }
  @keyframes spinSun {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-2.5deg); }
    50%      { transform: rotate(2.8deg); }
  }
  @keyframes swayAlt {
    0%, 100% { transform: rotate(2.4deg); }
    50%      { transform: rotate(-2.6deg); }
  }
  @keyframes flyPath1 {
    0%   { transform: translate(120px, 230px) rotate(6deg); }
    25%  { transform: translate(520px, 150px) rotate(-8deg); }
    50%  { transform: translate(980px, 240px) rotate(10deg); }
    75%  { transform: translate(1420px, 165px) rotate(-6deg); }
    100% { transform: translate(120px, 230px) rotate(6deg); }
  }
  @keyframes flyPath2 {
    0%   { transform: translate(1500px, 290px) scaleX(-1) rotate(5deg); }
    30%  { transform: translate(1060px, 200px) scaleX(-1) rotate(-7deg); }
    65%  { transform: translate(430px, 260px) scaleX(-1) rotate(8deg); }
    100% { transform: translate(1500px, 290px) scaleX(-1) rotate(5deg); }
  }
  @keyframes flapL {
    from { transform: scaleX(1) rotate(0deg); }
    to   { transform: scaleX(0.32) rotate(-14deg); }
  }
  @keyframes flapR {
    from { transform: scaleX(1) rotate(0deg); }
    to   { transform: scaleX(0.32) rotate(14deg); }
  }

  /* Minimal controls */
  #controls {
    position: absolute;
    top: clamp(14px, 2.2vh, 26px);
    right: clamp(16px, 2.2vw, 30px);
    z-index: 40;
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .wood-btn {
    position: relative;
    border: 3px solid #5c3718;
    border-radius: 999px;
    background: linear-gradient(180deg, #f7c978 0%, #df943c 58%, #b96d22 100%);
    box-shadow:
      0 6px 0 #5c3718,
      0 10px 20px rgba(42, 24, 9, 0.32),
      inset 0 2px 3px rgba(255, 248, 224, 0.72);
    color: #3d210b;
    font-family: inherit;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.14s cubic-bezier(.34,1.56,.64,1), box-shadow 0.14s ease, filter 0.15s ease;
    outline: none;
  }

  .wood-btn:hover {
    transform: translateY(-2px) scale(1.04);
    filter: brightness(1.05);
  }

  .wood-btn:active {
    transform: translateY(4px) scale(0.97);
    box-shadow:
      0 2px 0 #5c3718,
      0 4px 10px rgba(42, 24, 9, 0.28),
      inset 0 2px 3px rgba(255, 248, 224, 0.55);
  }

  #lang-btn {
    min-width: clamp(66px, 5vw, 82px);
    height: clamp(46px, 5.6vh, 56px);
    padding: 0 18px;
    font-size: clamp(18px, 1.5vw, 22px);
    letter-spacing: 0.04em;
    text-transform: lowercase;
  }

  #next-btn {
    width: clamp(50px, 5.6vh, 60px);
    height: clamp(46px, 5.6vh, 56px);
    background: linear-gradient(180deg, #9be15d 0%, #56ab2f 60%, #3d8420 100%);
    border-color: #255712;
    box-shadow:
      0 6px 0 #255712,
      0 10px 20px rgba(22, 54, 12, 0.32),
      inset 0 2px 3px rgba(235, 255, 210, 0.7);
  }

  #next-btn:active {
    box-shadow:
      0 2px 0 #255712,
      0 4px 10px rgba(22, 54, 12, 0.25);
  }

  #next-btn svg {
    width: 26px;
    height: 26px;
    filter: drop-shadow(0 2px 0 rgba(25, 65, 10, 0.45));
  }

  /* Word Plaque hanging from top */
  #word-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }

  .rope-pair {
    display: flex;
    justify-content: space-between;
    width: clamp(230px, 24vw, 390px);
    height: clamp(22px, 3.8vh, 42px);
    padding: 0 26px;
  }

  .rope {
    width: 8px;
    height: 100%;
    border-radius: 4px;
    background: repeating-linear-gradient(
      45deg,
      #b58042 0px,
      #b58042 5px,
      #855523 5px,
      #855523 10px
    );
    box-shadow: 2px 0 4px rgba(0, 0, 0, 0.25);
  }

  #word-plaque {
    position: relative;
    min-width: clamp(320px, 34vw, 560px);
    padding: clamp(14px, 2.1vh, 24px) clamp(38px, 4.2vw, 68px);
    border-radius: 36px 42px 38px 34px / 28px 34px 30px 36px;
    background:
      radial-gradient(ellipse at 25% 18%, rgba(255, 250, 230, 0.55) 0%, transparent 55%),
      repeating-linear-gradient(
        177deg,
        rgba(145, 86, 34, 0.06) 0px,
        rgba(145, 86, 34, 0.06) 3px,
        transparent 3px,
        transparent 14px
      ),
      linear-gradient(180deg, #fae2b2 0%, #f1c77e 52%, #dfa554 100%);
    border: 6px solid #6e3f19;
    box-shadow:
      0 10px 0 #4e2b10,
      0 18px 32px rgba(38, 22, 7, 0.34),
      inset 0 0 0 4px rgba(255, 242, 206, 0.55),
      inset 0 -8px 16px rgba(130, 68, 18, 0.24);
    transform-origin: top center;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    pointer-events: auto;
  }

  #word-plaque.swing-in {
    animation: plaqueSwing 0.65s cubic-bezier(.22,1.25,.36,1);
  }

  @keyframes plaqueSwing {
    0%   { transform: rotate(-5deg) scale(0.88) translateY(-14px); opacity: 0.5; }
    45%  { transform: rotate(2.6deg) scale(1.03) translateY(0); opacity: 1; }
    75%  { transform: rotate(-1.2deg) scale(0.995); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .plaque-nail {
    position: absolute;
    top: 12px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe6a8, #7b4e23 70%, #3e230d);
    box-shadow: 0 2px 3px rgba(0, 0, 0, 0.35);
  }
  .plaque-nail.left  { left: 26px; }
  .plaque-nail.right { right: 26px; }

  .plaque-leaf {
    position: absolute;
    pointer-events: none;
    filter: drop-shadow(0 3px 4px rgba(32, 60, 14, 0.28));
  }
  .plaque-leaf.l1 { top: -18px; left: -20px; width: 52px; }
  .plaque-leaf.l2 { bottom: -16px; right: -22px; width: 56px; transform: rotate(15deg); }

  #word-text {
    text-align: center;
    font-size: clamp(36px, 4.6vw, 72px);
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 1.05;
    color: #2f1b0c;
    text-shadow:
      0 2px 0 rgba(255, 246, 224, 0.85),
      0 4px 8px rgba(84, 44, 12, 0.16);
    white-space: nowrap;
  }

  #word-text .syl {
    color: #c92a2a;
    text-shadow:
      0 2px 0 rgba(255, 242, 218, 0.9),
      0 4px 10px rgba(180, 32, 24, 0.22);
  }

  /* Cards Arena */
  #cards-arena {
    position: absolute;
    top: clamp(148px, 23.5vh, 230px);
    bottom: clamp(36px, 6.5vh, 72px);
    left: clamp(24px, 5vw, 90px);
    right: clamp(24px, 5vw, 90px);
    z-index: 12;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(16px, 2.2vw, 34px);
    align-items: center;
    justify-items: center;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 310px;
    aspect-ratio: 1 / 1.08;
    cursor: pointer;
    border: none;
    background: transparent;
    padding: 0;
    outline: none;
    transform-origin: center center;
    transition: transform 0.24s cubic-bezier(.34,1.56,.64,1), filter 0.25s ease, opacity 0.25s ease;
    animation: cardDeal 0.48s cubic-bezier(.22,1.35,.36,1) backwards;
  }

  .card:nth-child(1) { animation-delay: 0.03s; }
  .card:nth-child(2) { animation-delay: 0.09s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.21s; }

  @keyframes cardDeal {
    0%   { opacity: 0; transform: translateY(42px) scale(0.76) rotate(-4deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }

  .card-shell {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 38px 44px 36px 42px / 44px 36px 42px 38px;
    padding: clamp(10px, 1.1vw, 15px);
    background:
      radial-gradient(circle at 18% 12%, rgba(255, 246, 212, 0.55) 0%, transparent 45%),
      linear-gradient(155deg, #c78641 0%, #9b5a24 52%, #6d3a13 100%);
    box-shadow:
      0 12px 0 #4d280d,
      0 22px 34px rgba(32, 22, 10, 0.34),
      inset 0 3px 4px rgba(255, 236, 195, 0.6);
    transition: box-shadow 0.22s ease, background 0.25s ease;
  }

  .card:hover:not(.wrong):not(.locked) {
    transform: translateY(-10px) scale(1.045) rotate(-1.2deg);
    z-index: 18;
  }

  .card:hover:not(.wrong):not(.locked) .card-shell {
    box-shadow:
      0 16px 0 #4d280d,
      0 28px 42px rgba(32, 22, 10, 0.42),
      0 0 28px rgba(255, 226, 120, 0.55),
      inset 0 3px 5px rgba(255, 245, 210, 0.8);
  }

  .card:active:not(.wrong):not(.locked) {
    transform: translateY(2px) scale(0.97);
  }

  .card-canvas {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 28px 33px 27px 31px / 33px 27px 31px 28px;
    overflow: hidden;
    box-shadow:
      inset 0 4px 12px rgba(68, 36, 10, 0.28),
      inset 0 0 0 3px rgba(255, 244, 212, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-canvas svg.art {
    width: 92%;
    height: 92%;
    overflow: visible;
    filter: drop-shadow(0 8px 10px rgba(45, 32, 18, 0.22));
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }

  .card:hover:not(.wrong):not(.locked) .card-canvas svg.art {
    transform: scale(1.06);
  }

  .card-pin {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff0c2, #a86c2c 75%, #5b3310);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    z-index: 4;
    pointer-events: none;
  }
  .card-pin.tl { top: 8px; left: 10px; }
  .card-pin.tr { top: 8px; right: 10px; }
  .card-pin.bl { bottom: 8px; left: 10px; }
  .card-pin.br { bottom: 8px; right: 10px; }

  /* Wrong feedback */
  .card.wrong-shake {
    animation: jellyWobble 0.52s ease;
  }

  .card.wrong {
    opacity: 0.46;
    filter: saturate(0.45);
    transform: scale(0.93);
    pointer-events: none;
  }

  @keyframes jellyWobble {
    0%   { transform: translateX(0) rotate(0deg) scale(1); }
    18%  { transform: translateX(-14px) rotate(-6deg) scale(0.95, 1.04); }
    36%  { transform: translateX(13px) rotate(5deg) scale(1.04, 0.96); }
    54%  { transform: translateX(-9px) rotate(-3.5deg) scale(0.97, 1.02); }
    72%  { transform: translateX(6px) rotate(2deg) scale(1.01, 0.99); }
    100% { transform: translateX(0) rotate(0deg) scale(0.93); }
  }

  /* Correct feedback */
  .card.correct {
    z-index: 25;
    animation: correctPop 0.72s cubic-bezier(.34,1.56,.64,1) forwards;
    pointer-events: none;
  }

  .card.correct .card-shell {
    background: linear-gradient(155deg, #ffe26a 0%, #f5a623 50%, #c86d11 100%);
    box-shadow:
      0 14px 0 #7b3e06,
      0 0 46px rgba(255, 224, 90, 0.95),
      0 0 90px rgba(255, 190, 60, 0.55),
      inset 0 4px 8px rgba(255, 255, 230, 0.9);
  }

  .card.dimmed {
    opacity: 0.34;
    transform: scale(0.9);
    filter: blur(0.8px) saturate(0.6);
    pointer-events: none;
  }

  @keyframes correctPop {
    0%   { transform: scale(1) rotate(0deg); }
    35%  { transform: scale(1.16) translateY(-16px) rotate(-2.5deg); }
    65%  { transform: scale(1.09) translateY(-10px) rotate(1.8deg); }
    100% { transform: scale(1.12) translateY(-12px) rotate(0deg); }
  }

  /* Animated Fox Explorer Character */
  #fox-wrap {
    position: absolute;
    bottom: clamp(-8px, -0.5vh, 0px);
    left: clamp(8px, 1.4vw, 24px);
    width: clamp(130px, 12.5vw, 210px);
    height: auto;
    z-index: 22;
    pointer-events: none;
    transform-origin: bottom center;
  }

  #fox-svg {
    width: 100%;
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 10px 14px rgba(26, 48, 12, 0.32));
  }

  #fox-tail {
    transform-origin: 70px 146px;
    animation: foxTailWag 2.8s ease-in-out infinite;
  }
  #fox-head {
    transform-origin: 105px 96px;
    animation: foxBreathe 3.4s ease-in-out infinite;
  }
  #fox-ear-l {
    transform-origin: 84px 66px;
    animation: earTwitchL 5.5s ease-in-out infinite;
  }
  #fox-ear-r {
    transform-origin: 126px 66px;
    animation: earTwitchR 6.2s ease-in-out infinite;
  }
  #fox-eyes-open {
    animation: foxBlink 4.6s infinite;
  }
  #fox-eyes-happy {
    opacity: 0;
  }

  #fox-wrap.fox-happy {
    animation: foxJump 0.72s cubic-bezier(.34,1.56,.64,1) 2;
  }
  #fox-wrap.fox-happy #fox-tail {
    animation: foxTailExcited 0.22s ease-in-out infinite;
  }
  #fox-wrap.fox-happy #fox-eyes-open {
    opacity: 0;
    animation: none;
  }
  #fox-wrap.fox-happy #fox-eyes-happy {
    opacity: 1;
  }
  #fox-wrap.fox-curious #fox-head {
    animation: foxTilt 0.7s ease-in-out;
  }

  @keyframes foxTailWag {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(9deg); }
  }
  @keyframes foxTailExcited {
    0%, 100% { transform: rotate(-16deg); }
    50%      { transform: rotate(18deg); }
  }
  @keyframes foxBreathe {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50%      { transform: translateY(-2.5px) rotate(1.2deg); }
  }
  @keyframes earTwitchL {
    0%, 86%, 100% { transform: rotate(0deg); }
    90% { transform: rotate(-12deg); }
    94% { transform: rotate(4deg); }
  }
  @keyframes earTwitchR {
    0%, 78%, 100% { transform: rotate(0deg); }
    82% { transform: rotate(11deg); }
    86% { transform: rotate(-3deg); }
  }
  @keyframes foxBlink {
    0%, 93%, 97%, 100% { transform: scaleY(1); transform-origin: 105px 82px; }
    95% { transform: scaleY(0.08); transform-origin: 105px 82px; }
  }
  @keyframes foxJump {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    20%      { transform: translateY(4px) scale(1.06, 0.92); }
    55%      { transform: translateY(-30px) scale(0.95, 1.07); }
    80%      { transform: translateY(-4px) scale(1.03, 0.97); }
  }
  @keyframes foxTilt {
    0%   { transform: rotate(0deg); }
    35%  { transform: rotate(-13deg) translateY(-2px); }
    75%  { transform: rotate(-10deg) translateY(-1px); }
    100% { transform: rotate(0deg); }
  }

  @media (max-width: 900px) {
    #cards-arena {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      top: 140px;
      bottom: 24px;
    }
    .card { max-width: 220px; }
    #fox-wrap { width: 105px; }
  }
</style>
</head>
<body>
<div id="stage">
  <!-- LIVING SCENIC BACKGROUND -->
  <svg id="bg-scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4eb5e5"/>
        <stop offset="52%" stop-color="#98ddf4"/>
        <stop offset="100%" stop-color="#e5f7d4"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8c4" stop-opacity="1"/>
        <stop offset="40%" stop-color="#ffe066" stop-opacity="0.88"/>
        <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7bc47f"/>
        <stop offset="100%" stop-color="#529e65"/>
      </linearGradient>
      <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8ad160"/>
        <stop offset="100%" stop-color="#4f9b3c"/>
      </linearGradient>
      <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#69b83e"/>
        <stop offset="100%" stop-color="#357a25"/>
      </linearGradient>
      <linearGradient id="barkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#5b3416"/>
        <stop offset="45%" stop-color="#854f25"/>
        <stop offset="100%" stop-color="#4c2a11"/>
      </linearGradient>
      <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#79c843"/>
        <stop offset="65%" stop-color="#43912b"/>
        <stop offset="100%" stop-color="#2c681c"/>
      </linearGradient>
    </defs>

    <!-- Sky -->
    <rect width="1600" height="900" fill="url(#skyGrad)"/>

    <!-- Radiant Sun -->
    <circle cx="185" cy="125" r="145" fill="url(#sunGlow)"/>
    <g class="sun-rays" opacity="0.42">
      <polygon points="185,0 198,62 172,62" fill="#fff3b0"/>
      <polygon points="185,250 198,188 172,188" fill="#fff3b0"/>
      <polygon points="60,125 122,112 122,138" fill="#fff3b0"/>
      <polygon points="310,125 248,112 248,138" fill="#fff3b0"/>
      <polygon points="96,36 146,72 128,90" fill="#fff3b0"/>
      <polygon points="274,214 224,178 242,160" fill="#fff3b0"/>
      <polygon points="274,36 224,72 242,90" fill="#fff3b0"/>
      <polygon points="96,214 146,178 128,160" fill="#fff3b0"/>
    </g>
    <circle cx="185" cy="125" r="52" fill="#fff6b8"/>
    <circle cx="185" cy="125" r="42" fill="#ffdf5d"/>

    <!-- Drifting Clouds -->
    <g class="cloud-slow" opacity="0.9">
      <g transform="translate(0, 82)">
        <ellipse cx="90" cy="48" rx="68" ry="28" fill="#ffffff"/>
        <circle cx="62" cy="34" r="32" fill="#ffffff"/>
        <circle cx="105" cy="28" r="38" fill="#ffffff"/>
        <circle cx="144" cy="40" r="26" fill="#f3fbff"/>
      </g>
    </g>
    <g class="cloud-med" opacity="0.82">
      <g transform="translate(400, 152) scale(0.82)">
        <ellipse cx="96" cy="46" rx="76" ry="26" fill="#ffffff"/>
        <circle cx="58" cy="34" r="30" fill="#ffffff"/>
        <circle cx="106" cy="24" r="38" fill="#ffffff"/>
        <circle cx="148" cy="36" r="28" fill="#eef9ff"/>
      </g>
    </g>
    <g class="cloud-fast" opacity="0.72">
      <g transform="translate(120, 210) scale(0.62)">
        <ellipse cx="86" cy="44" rx="64" ry="22" fill="#ffffff"/>
        <circle cx="66" cy="32" r="28" fill="#ffffff"/>
        <circle cx="108" cy="30" r="30" fill="#f5fcff"/>
      </g>

        }

      if (!this.ctx) return;
      const now = this.ctx.currentTime + start;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      }
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.03);
    }

  /* =========================================================
     3. PARTICLE CELEBRATION SYSTEM (5 Distinct Visual Effects)
     ========================================================= */
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let ambientMotes = [];
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  for (let i = 0; i < 24; i++) {
    ambientMotes.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 2 + Math.random() * 3.5,
      vx: 0.2 + Math.random() * 0.45,
      vy: -0.15 + Math.random() * 0.3,
      phase: Math.random() * Math.PI * 2
    });
  }

  function spawnCelebration(x, y, styleIdx) {
    const s = styleIdx % 5;
    const palettes = [
      ['#fde047', '#fb923c', '#f472b6', '#38bdf8', '#a3e635'],
      ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'],
      ['#e0f2fe', '#7dd3fc', '#fbcfe8', '#fde68a', '#bbf7d0'],
      ['#facc15', '#fbbf24', '#84cc16', '#34d399', '#fef08a'],
      ['#f43f5e', '#fb923c', '#facc15', '#2dd4bf', '#a78bfa']
    ];
    const colors = palettes[s];
    const count = s === 2 ? 42 : 58;

    particles.push({
      kind: 'ring',
      x, y,
      r: 24,
      vr: 9.5,
      alpha: 0.95,
      color: colors[0]
    });

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
      const speed = (s === 2 ? 2.5 : 4.5) + Math.random() * 9.5;
      particles.push({
        kind: s === 0 ? 'star' : s === 1 ? 'ribbon' : s === 2 ? 'bubble' : s === 3 ? 'leaf' : 'spark',
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (s === 2 ? 3.5 : 4.2),
        g: s === 2 ? -0.05 : 0.22,
        size: (s === 2 ? 8 : 7) + Math.random() * 11,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.26,
        color: colors[i % colors.length],
        alpha: 1,
        decay: 0.011 + Math.random() * 0.01
      });
    }
  }

  function spawnWrongPuff(x, y) {
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.6 + Math.random() * 3.4;
      particles.push({
        kind: 'puff',
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 0.8,
        g: 0.04,
        size: 6 + Math.random() * 8,
        rot: 0,
        vrot: 0,
        color: '#e2d4b7',
        alpha: 0.8,
        decay: 0.028
      });
    }
  }

  function drawStar(c, x, y, r, rot) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
      const a2 = a1 + Math.PI / 5;
      c.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
      c.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
    }
    c.closePath();
    c.fill();
    c.restore();
  }

  function tickFX() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    for (const m of ambientMotes) {
      m.phase += 0.02;
      m.x += m.vx + Math.sin(m.phase) * 0.25;
      m.y += m.vy + Math.cos(m.phase * 0.7) * 0.2;
      if (m.x > window.innerWidth + 10) m.x = -10;
      if (m.y < -10) m.y = window.innerHeight + 10;
      if (m.y > window.innerHeight + 10) m.y = -10;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 250, 214, ${0.26 + Math.sin(m.phase) * 0.16})`;
      ctx.fill();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.kind === 'ring') {
        p.r += p.vr;
        p.vr *= 0.94;
        p.alpha -= 0.032;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        continue;
      }

      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.g;
      p.vx *= 0.985;
      p.rot += p.vrot;
      p.alpha -= p.decay;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;

      if (p.kind === 'star') {
        drawStar(ctx, p.x, p.y, p.size, p.rot);
      } else if (p.kind === 'ribbon') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size * 0.75, -p.size * 0.28, p.size * 1.5, p.size * 0.56);
      } else if (p.kind === 'bubble') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.24, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fill();
      } else if (p.kind === 'leaf') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.kind === 'spark') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.lineTo(p.size * 0.32, 0);
        ctx.lineTo(0, p.size);
        ctx.lineTo(-p.size * 0.32, 0);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    requestAnimationFrame(tickFX);
  }
  tickFX();

  /* =========================================================
     4. ENDLESS GAME ENGINE & UI LOGIC
     ========================================================= */
  let lang = 'uk';
  let deck = [];
  let lastTargetId = null;
  let currentTarget = null;
  let currentOptions = [];
  let isTransitioning = false;
  let celebrationIndex = 0;
  let nextTimer = null;

  const wordPlaque = document.getElementById('word-plaque');
  const wordText = document.getElementById('word-text');
  const cardsArena = document.getElementById('cards-arena');
  const langBtn = document.getElementById('lang-btn');
  const nextBtn = document.getElementById('next-btn');
  const foxWrap = document.getElementById('fox-wrap');

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function refillDeck() {
    let nextDeck = shuffle(ITEMS);
    if (lastTargetId && nextDeck[0].id === lastTargetId) {
      [nextDeck[0], nextDeck[nextDeck.length - 1]] = [nextDeck[nextDeck.length - 1], nextDeck[0]];
    }
    deck = nextDeck;
  }

  function renderWord() {
    if (!currentTarget) return;
    const raw = lang === 'uk' ? currentTarget.uk : currentTarget.ru;
    const syl = raw.slice(0, 2);
    const rest = raw.slice(2);
    wordText.innerHTML = `<span class="syl">${syl}</span>${rest}`;
  }

  function setFoxMood(mood) {
    foxWrap.classList.remove('fox-happy', 'fox-curious');
    void foxWrap.offsetWidth;
    if (mood === 'happy') {
      foxWrap.classList.add('fox-happy');
      setTimeout(() => foxWrap.classList.remove('fox-happy'), 1450);
    } else if (mood === 'curious') {
      foxWrap.classList.add('fox-curious');
      setTimeout(() => foxWrap.classList.remove('fox-curious'), 750);
    }
  }

  function pickOptions(target) {
    const otherGroups = shuffle(
      ['ra', 'ro', 'ru', 'ry', 're'].filter(g => g !== target.group)
    );
    const distractors = [];
    for (let i = 0; i < 3; i++) {
      const pool = ITEMS.filter(it => it.group === otherGroups[i]);
      distractors.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    return shuffle([target, ...distractors]);
  }

  function buildRound() {
    if (nextTimer) {
      clearTimeout(nextTimer);
      nextTimer = null;
    }
    isTransitioning = false;

    if (deck.length === 0) refillDeck();
    currentTarget = deck.shift();
    lastTargetId = currentTarget.id;
    currentOptions = pickOptions(currentTarget);

    renderWord();
    wordPlaque.classList.remove('swing-in');
    void wordPlaque.offsetWidth;
    wordPlaque.classList.add('swing-in');

    cardsArena.innerHTML = '';

    currentOptions.forEach(item => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card';
      btn.dataset.id = item.id;

      btn.innerHTML = `
        <div class="card-shell">
          <span class="card-pin tl"></span>
          <span class="card-pin tr"></span>
          <span class="card-pin bl"></span>
          <span class="card-pin br"></span>
          <div class="card-canvas" style="background:${item.bg}">
            <svg class="art" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              ${item.svg}
            </svg>
          </div>
        </div>
      `;

      btn.addEventListener('mouseenter', () => {
        if (!isTransitioning && !btn.classList.contains('wrong')) {
          sound.playHover();
        }
      });

      btn.addEventListener('click', () => handleCardClick(btn, item));
      cardsArena.appendChild(btn);
    });
  }

  function handleCardClick(btn, item) {
    if (isTransitioning || btn.classList.contains('wrong')) return;
    sound.init();

    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    if (item.id === currentTarget.id) {
      isTransitioning = true;
      btn.classList.add('correct');

      cardsArena.querySelectorAll('.card').forEach(c => {
        if (c !== btn) c.classList.add('dimmed');
      });

      sound.playCorrect(celebrationIndex);
      spawnCelebration(cx, cy, celebrationIndex);
      celebrationIndex++;
      setFoxMood('happy');

      nextTimer = setTimeout(() => {
        buildRound();
      }, 1550);
    } else {
      sound.playWrong();
      spawnWrongPuff(cx, cy);
      setFoxMood('curious');
      btn.classList.add('wrong-shake');
      setTimeout(() => {
        btn.classList.remove('wrong-shake');
        btn.classList.add('wrong');
      }, 480);
    }
  }

  langBtn.addEventListener('click', () => {
    lang = lang === 'uk' ? 'ru' : 'uk';
    langBtn.textContent = lang === 'uk' ? 'укр' : 'рус';
    sound.playLang();
    renderWord();
    wordPlaque.classList.remove('swing-in');
    void wordPlaque.offsetWidth;
    wordPlaque.classList.add('swing-in');
  });

  nextBtn.addEventListener('click', () => {
    sound.playNext();
    buildRound();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'Space') {
      e.preventDefault();
      sound.playNext();
      buildRound();
    } else if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
      const idx = Number(e.code.slice(-1)) - 1;
      const card = cardsArena.children[idx];
      if (card) card.click();
    }
  });

  buildRound();
})();
</script>
</body>
</html>
