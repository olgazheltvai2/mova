<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Встав голосні</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a0f1c;
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;}

  #bg{position:fixed;inset:0;z-index:0;display:block;}
  #fx{position:fixed;inset:0;z-index:50;display:block;pointer-events:none;}

  #stage{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:2vh 2vw;}

  /* ---------- BOARD ---------- */
  #board{
    position:relative;
    width:min(1560px,96vw);
    max-height:94vh;
    padding:clamp(18px,3.2vh,46px) clamp(18px,3vw,62px);
    border-radius:38px;
    background:
      radial-gradient(circle at 16% 5%, rgba(255,205,140,.17), transparent 55%),
      radial-gradient(circle at 88% 96%, rgba(255,140,110,.13), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(255,180,120,.06), transparent 70%),
      linear-gradient(158deg, rgba(62,33,45,.88), rgba(28,15,30,.92));
    border:2px solid rgba(255,210,150,.30);
    box-shadow:
      0 34px 80px rgba(0,0,0,.60),
      inset 0 0 70px rgba(255,180,110,.09),
      0 0 0 9px rgba(255,220,170,.03);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    overflow:hidden;
    transition:box-shadow .4s;
  }
  #board::before{
    content:'';position:absolute;inset:11px;border-radius:29px;
    border:1px solid rgba(255,210,150,.14);
    background-image:radial-gradient(rgba(255,225,180,.075) 1px, transparent 1.6px);
    background-size:24px 24px;
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 88%);
    mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 88%);
    pointer-events:none;opacity:.9;
  }
  #board.done{
    animation:boardGlow 1.15s ease-in-out 3;
  }
  @keyframes boardGlow{
    0%,100%{box-shadow:0 34px 80px rgba(0,0,0,.60), inset 0 0 70px rgba(255,180,110,.09), 0 0 0 9px rgba(255,220,170,.03);}
    50%{box-shadow:0 34px 95px rgba(255,195,80,.55), inset 0 0 110px rgba(255,200,90,.30), 0 0 0 9px rgba(255,215,110,.22);}
  }

  /* ---------- SENTENCE ---------- */
  #sentence{
    position:relative;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:.30em .85em;
    font-size:clamp(27px,4.15vw,72px);
    font-weight:800;
    color:#ffeccf;
    letter-spacing:.005em;
    text-shadow:0 3px 0 rgba(60,20,20,.38), 0 0 28px rgba(255,200,120,.38);
    min-height:1.7em;
    padding:2px 0;
  }
  .word{display:inline-block;white-space:nowrap;}
  .ch{display:inline-block;}

  .slot{
    display:inline-flex;align-items:center;justify-content:center;
    width:.82em;height:1.16em;
    margin:0 .045em;
    vertical-align:-.16em;
    border-radius:.30em;
    background:linear-gradient(180deg, rgba(255,235,205,.11), rgba(255,235,205,.02));
    border:2px dashed rgba(255,215,150,.55);
    box-shadow:inset 0 0 14px rgba(255,200,120,.24);
    cursor:pointer;
    line-height:1;
    transition:transform .13s cubic-bezier(.2,1.6,.5,1), box-shadow .18s, background .18s, border-color .18s;
    will-change:transform;
  }
  .slot:hover{background:rgba(255,215,150,.17);transform:translateY(-2px);}
  .slot.selected{
    border-color:rgba(255,215,90,.95);
    box-shadow:0 0 0 3px rgba(255,215,90,.85), 0 0 24px rgba(255,215,90,.7);
    background:rgba(255,215,90,.14);
  }
  .slot.filled{
    border:2px solid rgba(255,220,130,.55);
    background:linear-gradient(180deg, rgba(255,228,130,.30), rgba(255,150,60,.16));
    color:#ffe89a;
    box-shadow:inset 0 0 20px rgba(255,200,80,.35), 0 0 20px rgba(255,200,80,.40);
    cursor:default;
    text-shadow:0 0 16px rgba(255,220,120,.95);
    animation:popIn .32s cubic-bezier(.2,1.7,.5,1);
  }
  @keyframes popIn{
    0%{transform:scale(.35) rotate(-8deg);}
    60%{transform:scale(1.25) rotate(3deg);}
    100%{transform:scale(1) rotate(0);}
  }
  #board.done .slot.filled{animation:glowPulse 1.1s ease-in-out infinite;}
  @keyframes glowPulse{
    0%,100%{box-shadow:inset 0 0 20px rgba(255,200,80,.35), 0 0 18px rgba(255,200,80,.35);}
    50%{box-shadow:inset 0 0 26px rgba(255,230,140,.6), 0 0 34px rgba(255,215,110,.85);}
  }

  .shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97);}
  @keyframes shake{
    0%,100%{transform:translateX(0) rotate(0);}
    15%{transform:translateX(-9px) rotate(-3deg);}
    35%{transform:translateX(9px) rotate(3deg);}
    55%{transform:translateX(-6px) rotate(-2deg);}
    75%{transform:translateX(6px) rotate(2deg);}
  }

  /* ---------- BANK ---------- */
  #bank{
    position:relative;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    gap:clamp(7px,1.05vw,17px);
    margin-top:clamp(18px,3.1vh,42px);
    padding-top:clamp(14px,2.4vh,30px);
    border-top:2px dashed rgba(255,210,150,.22);
    transition:filter .3s;
  }
  .tile{
    position:relative;
    width:clamp(46px,5.0vw,82px);
    height:clamp(46px,5.0vw,82px);
    border-radius:28%;
    border:none;
    padding:0;
    font-family:inherit;
    font-size:clamp(23px,2.6vw,42px);
    font-weight:900;
    color:#2a1208;
    cursor:pointer;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
    box-shadow:0 6px 0 rgba(40,10,10,.35), 0 12px 26px rgba(0,0,0,.42), inset 0 -5px 12px rgba(0,0,0,.22), inset 0 4px 10px rgba(255,255,255,.45);
    transition:transform .15s cubic-bezier(.2,1.7,.5,1), box-shadow .2s, filter .2s, opacity .2s;
    will-change:transform;
    display:flex;align-items:center;justify-content:center;
  }
  .tile:hover{transform:translateY(-6px) scale(1.06);filter:brightness(1.08);}
  .tile:active{transform:translateY(-2px) scale(.99);}
  .tile.selected{
    transform:translateY(-14px) scale(1.14) rotate(-4deg);
    box-shadow:0 0 0 4px #ffd75a, 0 18px 34px rgba(255,215,90,.55), inset 0 4px 10px rgba(255,255,255,.5);
  }
  .tile.pop{
    animation:tilePop .30s ease-out forwards;
    pointer-events:none;
  }
  @keyframes tilePop{
    0%{transform:scale(1.16) rotate(0);opacity:1;}
    100%{transform:scale(0) rotate(160deg);opacity:0;}
  }

  /* ---------- LOCKED STATE ---------- */
  #bank.locked .tile{
    filter:grayscale(.6) brightness(.58);
    cursor:not-allowed;
    box-shadow:0 4px 0 rgba(0,0,0,.3), 0 6px 14px rgba(0,0,0,.35);
  }
  #bank.locked .tile:hover{transform:none;}
  #sentence.locked .slot{
    cursor:not-allowed;
    opacity:.72;
    border-color:rgba(200,180,170,.4);
  }
  #sentence.locked .slot:hover{transform:none;background:linear-gradient(180deg, rgba(255,235,205,.11), rgba(255,235,205,.02));}

  /* ---------- CONTROLS ---------- */
  #nextBtn{
    position:fixed;right:clamp(12px,1.6vw,26px);top:clamp(12px,1.6vw,26px);
    z-index:60;
    width:clamp(42px,4vw,56px);height:clamp(42px,4vw,56px);
    border-radius:50%;
    border:2px solid rgba(255,215,160,.32);
    background:linear-gradient(160deg, rgba(80,44,30,.85), rgba(34,18,30,.90));
    color:#ffd9a0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.45), inset 0 0 18px rgba(255,190,120,.16);
    transition:transform .18s cubic-bezier(.2,1.6,.5,1), box-shadow .2s, color .2s;
  }
  #nextBtn:hover{transform:scale(1.12);color:#fff0d0;box-shadow:0 8px 28px rgba(255,190,110,.5), inset 0 0 24px rgba(255,190,120,.35);}
  #nextBtn:active{transform:scale(.94);}
  #nextBtn.pulse{animation:nextPulse 1.05s ease-in-out infinite;}
  @keyframes nextPulse{
    0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.45), 0 0 0 0 rgba(255,215,110,.6);}
    50%{box-shadow:0 6px 26px rgba(255,215,110,.7), 0 0 0 12px rgba(255,215,110,0);}
  }

  #lockBtn{
    position:fixed;
    right:calc(clamp(12px,1.6vw,26px) + clamp(52px,5vw,68px));
    top:clamp(12px,1.6vw,26px);
    z-index:60;
    width:clamp(42px,4vw,56px);height:clamp(42px,4vw,56px);
    border-radius:50%;
    border:2px solid rgba(255,215,160,.30);
    background:linear-gradient(160deg, rgba(80,44,30,.85), rgba(34,18,30,.90));
    color:#ffd9a0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.45), inset 0 0 18px rgba(255,190,120,.15);
    transition:transform .18s cubic-bezier(.2,1.6,.5,1), box-shadow .25s, color .25s, background .25s, border-color .25s;
  }
  #lockBtn:hover{transform:scale(1.10);color:#fff0d0;}
  #lockBtn:active{transform:scale(.94);}
  #lockBtn.locked{
    color:#ffbe63;
    border-color:rgba(255,180,90,.92);
    background:linear-gradient(160deg, rgba(124,62,30,.95), rgba(62,24,32,.95));
    box-shadow:0 0 0 3px rgba(255,180,90,.28), 0 0 26px rgba(255,170,80,.6), inset 0 0 22px rgba(255,170,80,.38);
  }
  #lockBtn .sh-open{display:none;}
  #lockBtn.locked .sh-closed{display:none;}
  #lockBtn.locked .sh-open{display:block;}

  #langSwitch{
    position:fixed;left:clamp(12px,1.6vw,26px);top:clamp(14px,1.7vw,28px);
    z-index:60;display:flex;gap:6px;
    opacity:.28;transition:opacity .3s;
  }
  #langSwitch:hover{opacity:1;}
  #langSwitch button{
    font-family:inherit;font-size:12px;letter-spacing:.08em;font-weight:700;
    padding:5px 9px;border-radius:9px;cursor:pointer;
    border:1px solid rgba(255,215,160,.30);
    background:rgba(60,30,30,.55);
    color:#ffd9a8;
    transition:background .2s, color .2s, border-color .2s;
  }
  #langSwitch button:hover{background:rgba(120,60,40,.7);}
  #langSwitch button.active{
    background:rgba(255,215,150,.9);
    color:#2a1208;border-color:rgba(255,235,200,.9);
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div id="langSwitch">
  <button data-lang="uk" class="active">УКР</button>
  <button data-lang="ru">РУС</button>
</div>

<button id="lockBtn" aria-label="lock">
  <svg viewBox="0 0 24 24" width="55%" height="55%">
    <path class="sh-closed" d="M8 10.5 V7.6 a4 4 0 0 1 8 0 V10.5"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path class="sh-open" d="M8 10.5 V7.6 a4 4 0 0 1 8 0 V9.3"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="4.6" y="10.3" width="14.8" height="10" rx="2.4" fill="currentColor"/>
    <circle cx="12" cy="15.2" r="1.5" fill="rgba(30,10,5,.55)"/>
  </svg>
</button>

<button id="nextBtn" aria-label="next">
  <svg viewBox="0 0 24 24" width="55%" height="55%">
    <path d="M8 4l9 8-9 8" fill="none" stroke="currentColor" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div id="stage">
  <div id="board">
    <div id="sentence"></div>
    <div id="bank"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   ДАНІ
   ============================================================ */
const DATA = {
  uk: [
    "У саду ростуть яблука",
    "Кіт спить на теплому даху",
    "Веселий вітер гойдає листя",
    "Сонце сяє над рікою",
    "Золота рибка плаває в річці",

    "Ми їдемо на море влітку",

  ],
  ru: [
    "В саду растут яблоки",
    "Кот спит на тёплой крыше",
    "Дети играют в мяч",
    "Весёлый ветер качает листья",
    "Солнце светит над рекой",
    "Золотая рыбка плавает",
    "Мама печёт вкусный хлеб",
    "Мальчик рисует синий цветок",
    "Птичка сидит на ветке",
    "Мы едем на море летом",
    "Белая кошка ловит мышку",
    "Осень принесла жёлтые листья",
    "В лесу живёт рыжая лиса",
    "Течёт быстрая горная речка",
    "Синий мотылёк сел на цветок",
    "Я люблю вкусные яблоки",
    "Наш котик любит молоко",
    "Высокие сосны шумят в лесу",
    "Холодный дождь стучит по крыше",
    "Рыбак поймал большую щуку",
    "Дети бегут в школу",
    "Зимнее утро тихое",
    "Верба склонилась над водой",
    "Цыплёнок клюёт зёрнышки"
  ]
};

const VOWELS = { uk:'аоуиіеєюяї', ru:'аоуыиэеёюя' };

/* ============================================================
   АУДІО
   ============================================================ */
let actx = null;
function ensureAudio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC){ try{ actx = new AC(); }catch(e){ actx = null; } }
  }
  if(actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, vol, delay, slideTo){
  if(!actx) return;
  type = type || 'sine';
  vol = (vol == null) ? 0.15 : vol;
  delay = delay || 0;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.06);
}
function playSelect(){ beep(760,.07,'triangle',.085); beep(1150,.06,'sine',.045,.03); }
function playCorrect(){ beep(700,.12,'sine',.13); beep(1050,.14,'sine',.11,.07); beep(1400,.20,'sine',.085,.14); }
function playWrong(){ beep(230,.16,'sawtooth',.095,0,105); beep(155,.22,'square',.055,.05,75); }
function playWin(){
  [523,659,784,1047,1319].forEach(function(f,i){ beep(f,.30,'triangle',.115,i*.085); });
  beep(2093,.55,'sine',.05,.44);
  beep(1568,.40,'sine',.045,.52);
}
function playNext(){ beep(300,.22,'sine',.085,0,950); beep(950,.12,'triangle',.045,.18); }
function playLockSound(){ beep(340,.09,'square',.075,0,190); beep(170,.14,'sine',.06,.06,110); }
function playUnlockSound(){ beep(210,.09,'sine',.07,0,420); beep(640,.13,'triangle',.06,.07,900); }

/* ============================================================
   КАНВАСИ
   ============================================================ */
const bg  = document.getElementById('bg');
const bx  = bg.getContext('2d');
const fx  = document.getElementById('fx');
const fxc = fx.getContext('2d');
let W = 0, H = 0, DPR = 1;

let books = [], letters = [], motes = [], glows = [], parts = [];

function pick(a){ return a[(Math.random()*a.length)|0]; }

function roundRect(c,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  [bg, fx].forEach(function(c){
    c.width  = Math.floor(W * DPR);
    c.height = Math.floor(H * DPR);
    c.style.width  = W + 'px';
    c.style.height = H + 'px';
  });
  bx.setTransform(DPR,0,0,DPR,0,0);
  fxc.setTransform(DPR,0,0,DPR,0,0);
  buildScene();
}

function buildScene(){
  const coverPalette = ['#8e3b3b','#2f6b5e','#b07a2c','#5a3b7a','#3b5a8e','#8e5a2f','#7a2f4f','#2f7a6a'];

  books = [];
  const nB = Math.max(6, Math.round(W/270));
  for(let i=0;i<nB;i++){
    books.push({
      x: Math.random()*W,
      y: Math.random()*H,
      w: 44 + Math.random()*74,
      h: 14 + Math.random()*19,
      ang: (Math.random()-0.5)*0.5,
      vr: (Math.random()-0.5)*0.06,
      vy: 6 + Math.random()*17,
      sway: Math.random()*Math.PI*2,
      swayA: 0.14 + Math.random()*0.20,
      cover: pick(coverPalette)
    });
  }

  letters = [];
  const chars = 'аеиоуяєюіёыэ';
  const nL = Math.max(11, Math.round(W/145));
  for(let i=0;i<nL;i++){
    letters.push({
      x: Math.random()*W,
      y: Math.random()*H,
      ch: chars[(Math.random()*chars.length)|0],
      size: 26 + Math.random()*66,
      rot: (Math.random()-0.5)*0.8,
      vr: (Math.random()-0.5)*0.15,
      vy: -(4 + Math.random()*13),
      alpha: 0.05 + Math.random()*0.09
    });
  }

  motes = [];
  for(let i=0;i<95;i++){
    motes.push({
      x: Math.random()*W, y: Math.random()*H,
      r: 0.6 + Math.random()*1.9,
      p: Math.random()*6.28,
      vx: (Math.random()-0.5)*6,
      vy: -(3 + Math.random()*9)
    });
  }

  const M = Math.max(W,H);
  glows = [
    {x:W*0.17, y:H*0.10, r:M*0.52, c:'rgba(255,190,110,0.17)'},
    {x:W*0.84, y:H*0.90, r:M*0.55, c:'rgba(255,140,110,0.11)'},
    {x:W*0.50, y:H*0.48, r:M*0.62, c:'rgba(140,90,170,0.11)'}
  ];
}

/* ============================================================
   МАЛЮВАННЯ ФОНУ — тепла книжкова сцена
   ============================================================ */
function drawBg(now, dt){
  const t = now * 0.001;

  // основний градієнт
  const g = bx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,    '#2b1a31');
  g.addColorStop(0.32, '#4e2c3d');
  g.addColorStop(0.66, '#7a4335');
  g.addColorStop(1,    '#2c1828');
  bx.fillStyle = g;
  bx.fillRect(0,0,W,H);

  // теплі свічення
  bx.save();
  bx.globalCompositeOperation = 'screen';
  for(const gl of glows){
    const rg = bx.createRadialGradient(gl.x, gl.y, 0, gl.x, gl.y, gl.r);
    rg.addColorStop(0, gl.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    bx.fillStyle = rg;
    bx.fillRect(0,0,W,H);
  }
  bx.restore();

  // м'які світлові смуги
  bx.save();
  bx.globalCompositeOperation = 'screen';
  bx.globalAlpha = 0.045;
  bx.fillStyle = '#ffdca0';
  bx.beginPath();
  bx.moveTo(W*0.04,-10); bx.lineTo(W*0.29,-10);
  bx.lineTo(W*0.55,H);   bx.lineTo(W*0.17,H);
  bx.closePath(); bx.fill();
  bx.beginPath();
  bx.moveTo(W*0.56,-10); bx.lineTo(W*0.69,-10);
  bx.lineTo(W*0.96,H);   bx.lineTo(W*0.73,H);
  bx.closePath(); bx.fill();
  bx.restore();

  // пилинки
  bx.save();
  for(const m of motes){
    m.y += m.vy * dt;
    m.x += m.vx * dt + Math.sin(t*0.8 + m.p) * 9 * dt;
    if(m.y < -20){ m.y = H + 20; m.x = Math.random()*W; }
    if(m.x < -20) m.x = W + 20;
    if(m.x > W + 20) m.x = -20;
    const a = 0.14 + 0.34 * (0.5 + 0.5*Math.sin(t*1.6 + m.p));
    bx.globalAlpha = a;
    bx.beginPath();
    bx.arc(m.x, m.y, m.r, 0, Math.PI*2);
    bx.fillStyle = '#ffe0a8';
    bx.fill();
  }
  bx.restore();

  // плаваючі літери
  bx.save();
  bx.textAlign = 'center';
  bx.textBaseline = 'middle';
  for(const l of letters){
    l.y += l.vy * dt;
    l.rot += l.vr * dt;
    if(l.y < -110){ l.y = H + 110; l.x = Math.random()*W; }
    bx.save();
    bx.globalAlpha = l.alpha * (0.7 + 0.3*Math.sin(t*0.9 + l.x*0.01));
    bx.translate(l.x + Math.sin(t*0.4 + l.y*0.008) * 15, l.y);
    bx.rotate(l.rot);
    bx.font = 'italic 700 ' + l.size + 'px Georgia, "Times New Roman", serif';
    bx.fillStyle = '#ffe8bf';
    bx.fillText(l.ch, 0, 0);
    bx.restore();
  }
  bx.restore();

  // плаваючі книжки
  for(const b of books){
    b.y -= b.vy * dt;
    if(b.y < -150){ b.y = H + 150; b.x = Math.random()*W; }
    b.sway += dt * 0.6;
    b.ang  += b.vr * dt;

    const ang = b.ang + Math.sin(b.sway) * b.swayA;

    bx.save();
    bx.translate(b.x + Math.sin(b.sway*0.8) * 18, b.y);
    bx.rotate(ang);

    bx.shadowColor = 'rgba(0,0,0,0.45)';
    bx.shadowBlur = 20;
    bx.shadowOffsetY = 10;

    roundRect(bx, -b.w/2, -b.h/2, b.w, b.h, 5);
    bx.fillStyle = b.cover;
    bx.fill();

    bx.shadowColor = 'transparent';
    bx.shadowBlur = 0;
    bx.shadowOffsetY = 0;

    bx.fillStyle = '#f2e2c2';
    roundRect(bx, -b.w/2 + 6, -b.h/2 + 3.5, b.w - 9, b.h - 7, 3);
    bx.fill();

    bx.strokeStyle = 'rgba(150,110,70,0.45)';
    bx.lineWidth = 1;
    for(let i=1;i<=3;i++){
      const yy = -b.h/2 + (b.h/4.2) * i;
      bx.beginPath();
      bx.moveTo(-b.w/2 + 10, yy);
      bx.lineTo( b.w/2 - 6,  yy);
      bx.stroke();
    }

    bx.fillStyle = b.cover;
    bx.fillRect(-b.w/2, -b.h/2, 5, b.h);

    bx.restore();
  }

  // віньєтка
  const vg = bx.createRadialGradient(W*0.5, H*0.45, Math.min(W,H)*0.22, W*0.5, H*0.5, Math.max(W,H)*0.80);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(15,6,20,0.62)');
  bx.fillStyle = vg;
  bx.fillRect(0,0,W,H);
}

/* ============================================================
   ЧАСТИНКИ
   ============================================================ */
function spawnSparkle(x, y){
  for(let i=0;i<20;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 90 + Math.random()*300;
    const lf = 0.55 + Math.random()*0.55;
    parts.push({
      x: x, y: y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - 70,
      g: 420, drag: 1.9,
      life: lf, max: lf,
      size: 2 + Math.random()*5,
      rot: Math.random()*6.28,
      vr: (Math.random()-0.5)*14,
      color: 'hsl(' + (36 + Math.random()*45) + ',100%,' + (62 + Math.random()*25) + '%)',
      shape: Math.random() < 0.55 ? 'star' : 'circle'
    });
  }
}

function confettiBurst(){
  const cx = W*0.5, cy = H*0.42;
  for(let i=0;i<175;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 120 + Math.random()*640;
    const lf = 1.2 + Math.random()*1.3;
    parts.push({
      x: cx + (Math.random()-0.5)*W*0.55,
      y: cy + (Math.random()-0.5)*130,
      vx: Math.cos(a)*sp*0.6,
      vy: Math.sin(a)*sp - 220,
      g: 720, drag: 0.9,
      life: lf, max: lf,
      size: 4 + Math.random()*10,
      rot: Math.random()*6.28,
      vr: (Math.random()-0.5)*17,
      color: 'hsl(' + (Math.random()*360) + ',95%,62%)',
      shape: 'rect'
    });
  }
}

function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i,1); continue; }
    p.vy += p.g*dt;
    const d = Math.max(0, 1 - p.drag*dt);
    p.vx *= d; p.vy *= d;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.rot += p.vr*dt;
  }
}

function drawParticles(){
  fxc.clearRect(0,0,W,H);
  for(const p of parts){
    const a = Math.max(0, Math.min(1, p.life/p.max));
    fxc.save();
    fxc.globalAlpha = a;
    fxc.translate(p.x, p.y);
    fxc.rotate(p.rot);
    fxc.fillStyle = p.color;
    if(p.shape === 'rect'){
      fxc.fillRect(-p.size/2, -p.size/2, p.size, p.size*1.6);
    } else if(p.shape === 'star'){
      fxc.beginPath();
      for(let k=0;k<5;k++){
        const ang = -Math.PI/2 + k*Math.PI*2/5;
        const r1 = p.size, r2 = p.size*0.44;
        fxc.lineTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
        fxc.lineTo(Math.cos(ang + Math.PI/5)*r2, Math.sin(ang + Math.PI/5)*r2);
      }
      fxc.closePath();
      fxc.fill();
    } else {
      fxc.beginPath();
      fxc.arc(0,0,p.size,0,Math.PI*2);
      fxc.fill();
    }
    fxc.restore();
  }
}

/* ============================================================
   ІГРОВА ЛОГІКА
   ============================================================ */
const sentenceEl = document.getElementById('sentence');
const bankEl     = document.getElementById('bank');
const boardEl    = document.getElementById('board');
const nextBtn    = document.getElementById('nextBtn');
const lockBtn    = document.getElementById('lockBtn');
const langSwitch = document.getElementById('langSwitch');

let lang = 'uk';
let queue = { uk: [], ru: [] };
let slots = [], tiles = [];
let selectedTile = null, selectedSlot = null;
let totalSlots = 0, filledCount = 0;
let locked = false;

function isVowel(ch){ return VOWELS[lang].indexOf(ch.toLowerCase()) !== -1; }

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function nextText(){
  if(!queue[lang].length){
    const idxs = [];
    for(let i=0;i<DATA[lang].length;i++) idxs.push(i);
    queue[lang] = shuffle(idxs);
  }
  const idx = queue[lang].shift();
  return DATA[lang][idx];
}

function loadSentence(){
  const text = nextText();

  selectedTile = null;
  selectedSlot = null;
  filledCount = 0;
  totalSlots = 0;
  slots = [];
  tiles = [];

  boardEl.classList.remove('done');
  nextBtn.classList.remove('pulse');

  sentenceEl.innerHTML = '';
  bankEl.innerHTML = '';

  const words = text.split(' ');
  const vowelChars = [];

  words.forEach(function(word){
    const wEl = document.createElement('span');
    wEl.className = 'word';

    const chars = Array.from(word);
    for(let i=0;i<chars.length;i++){
      const ch = chars[i];
      if(isVowel(ch)){
        const s = document.createElement('span');
        s.className = 'slot';
        s.dataset.vowel = ch.toLowerCase();
        s.dataset.char = ch;
        s.addEventListener('click', function(){ onSlotClick(s); });
        wEl.appendChild(s);
        slots.push(s);
        vowelChars.push(ch);
      } else {
        const c = document.createElement('span');
        c.className = 'ch';
        c.textContent = ch;
        wEl.appendChild(c);
      }
    }
    sentenceEl.appendChild(wEl);
  });

  vowelChars.forEach(function(ch, i){
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'tile';
    t.dataset.vowel = ch.toLowerCase();
    const h = (i*47 + 15) % 360;
    t.style.background =
      'radial-gradient(circle at 34% 26%, hsl(' + h + ' 100% 91%), hsl(' + h + ' 85% 65%) 46%, hsl(' + h + ' 78% 45%) 100%)';
    t.textContent = ch.toLowerCase();
    t.addEventListener('click', function(){ onTileClick(t); });
    bankEl.appendChild(t);
    tiles.push(t);
  });

  totalSlots = slots.length;
}

function clearSelections(){
  if(selectedSlot){ selectedSlot.classList.remove('selected'); selectedSlot = null; }
  if(selectedTile){ selectedTile.classList.remove('selected'); selectedTile = null; }
}

function onSlotClick(slot){
  ensureAudio();
  if(locked){ playLockSound(); nudgeLock(); return; }
  if(slot.classList.contains('filled')){ playSelect(); return; }

  if(selectedTile){
    tryPlace(slot, selectedTile);
  } else {
    if(selectedSlot && selectedSlot !== slot) selectedSlot.classList.remove('selected');
    selectedSlot = slot;
    slot.classList.add('selected');
    playSelect();
  }
}

function onTileClick(tile){
  ensureAudio();
  if(locked){ playLockSound(); nudgeLock(); return; }
  if(tile.classList.contains('pop')) return;

  if(selectedSlot){
    tryPlace(selectedSlot, tile);
  } else {
    if(selectedTile && selectedTile !== tile) selectedTile.classList.remove('selected');
    selectedTile = tile;
    tile.classList.add('selected');
    playSelect();
  }
}

function shake(el){
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  setTimeout(function(){ el.classList.remove('shake'); }, 430);
}

function nudgeLock(){
  lockBtn.classList.remove('shake');
  void lockBtn.offsetWidth;
  lockBtn.classList.add('shake');
  setTimeout(function(){ lockBtn.classList.remove('shake'); }, 430);
}

function tryPlace(slot, tile){
  if(!slot || !tile || slot.classList.contains('filled')) return;

  if(slot.dataset.vowel === tile.dataset.vowel){
    slot.classList.add('filled');
    slot.textContent = slot.dataset.char;
    slot.classList.remove('selected');

    tile.classList.remove('selected');
    tile.classList.add('pop');

    const idx = tiles.indexOf(tile);
    if(idx !== -1) tiles.splice(idx,1);

    selectedTile = null;
    selectedSlot = null;

    const r = slot.getBoundingClientRect();
    spawnSparkle(r.left + r.width/2, r.top + r.height/2);

    playCorrect();
    filledCount++;

    if(filledCount === totalSlots) complete();
  } else {
    playWrong();
    shake(slot);
    shake(tile);
    clearSelections();
  }
}

function complete(){
  playWin();
  confettiBurst();
  boardEl.classList.add('done');
  setTimeout(function(){ nextBtn.classList.add('pulse'); }, 700);
}

/* ============================================================
   КЕРУВАННЯ
   ============================================================ */
nextBtn.addEventListener('click', function(){
  ensureAudio();
  playNext();
  loadSentence();
});

lockBtn.addEventListener('click', function(){
  ensureAudio();
  locked = !locked;
  lockBtn.classList.toggle('locked', locked);
  bankEl.classList.toggle('locked', locked);
  sentenceEl.classList.toggle('locked', locked);
  if(locked){
    clearSelections();
    playLockSound();
  } else {
    playUnlockSound();
  }
});

langSwitch.addEventListener('click', function(e){
  const btn = e.target.closest('button');
  if(!btn) return;
  ensureAudio();
  const newLang = btn.dataset.lang;
  if(newLang === lang) return;
  lang = newLang;
  Array.prototype.forEach.call(langSwitch.children, function(b){
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  playNext();
  loadSentence();
});

window.addEventListener('resize', resize);

/* ============================================================
   СТАРТ
   ============================================================ */
resize();
loadSentence();

let lastT = 0;
function frame(now){
  const dt = Math.min(0.05, (now - lastT)/1000 || 0.016);
  lastT = now;
  drawBg(now, dt);
  updateParticles(dt);
  drawParticles();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
