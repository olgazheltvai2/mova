<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Живий Атлас</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #120d08;
      font-family: 'Montserrat', sans-serif;
    }

    /* Wood, Amber & Stone Naturalist UI Styling - ZERO white rectangles */
    .wood-btn {
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 210, 125, 0.28), transparent 60%),
        repeating-linear-gradient(14deg, #4e2f18 0px, #4e2f18 6px, #3b2210 6px, #3b2210 13px, #59361c 13px, #59361c 18px);
      border: 3px solid #c8963e;
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.7),
        inset 0 2px 4px rgba(255, 230, 170, 0.45),
        inset 0 -4px 8px rgba(20, 10, 4, 0.85);
      color: #ffefc4;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, filter 0.18s ease;
      cursor: pointer;
    }
    .wood-btn:hover {
      transform: translateY(-2px) scale(1.05);
      filter: brightness(1.1);
      box-shadow:
        0 12px 26px rgba(0, 0, 0, 0.8),
        0 0 16px rgba(245, 185, 66, 0.45),
        inset 0 2px 6px rgba(255, 235, 180, 0.6),
        inset 0 -4px 8px rgba(20, 10, 4, 0.85);
    }
    .wood-btn:active {
      transform: translateY(1px) scale(0.95);
    }

    .amber-btn {
      background:
        radial-gradient(circle at 35% 25%, #ffe699 0%, #f59e0b 38%, #b45309 78%, #6b2c06 100%);
      border: 3px solid #fde68a;
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.75),
        0 0 18px rgba(245, 158, 11, 0.45),
        inset 0 3px 8px rgba(255, 250, 220, 0.75),
        inset 0 -5px 10px rgba(85, 30, 4, 0.8);
      color: #2c1203;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .amber-btn:hover {
      transform: translateY(-2px) scale(1.07);
      filter: brightness(1.1);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.85),
        0 0 24px rgba(251, 191, 36, 0.75),
        inset 0 3px 10px rgba(255, 255, 230, 0.9),
        inset 0 -5px 10px rgba(85, 30, 4, 0.8);
    }
    .amber-btn:active {
      transform: translateY(1px) scale(0.95);
    }

    /* Carved Naturalist Plaque for Stage 1 */
    .naturalist-plaque {
      background:
        radial-gradient(ellipse at center, rgba(244, 217, 166, 0.97) 0%, rgba(212, 173, 111, 0.98) 68%, rgba(168, 124, 65, 0.99) 100%),
        repeating-linear-gradient(45deg, rgba(92, 58, 24, 0.07) 0px, rgba(92, 58, 24, 0.07) 4px, transparent 4px, transparent 8px);
      border: 6px solid #4a2c11;
      outline: 3px solid #d49b3b;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.85),
        0 0 38px rgba(235, 175, 65, 0.55),
        inset 0 0 28px rgba(74, 44, 17, 0.65),
        inset 0 2px 4px rgba(255, 245, 215, 0.8);
      transform-origin: center bottom;
      transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .naturalist-plaque.hidden-plaque {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 35px) scale(0.72);
    }
    .naturalist-plaque.visible-plaque {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
    }

    /* Stage Progress Stones at Bottom */
    .nav-gem {
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, #9c6f44, #3b2311);
      border: 2px solid #c59256;
      box-shadow: 0 3px 8px rgba(0,0,0,0.75), inset 0 1px 2px rgba(255,220,160,0.45);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .nav-gem:hover {
      transform: scale(1.28);
      border-color: #fde68a;
    }
    .nav-gem.active {
      width: 34px;
      background: radial-gradient(circle at 35% 30%, #fff3b0, #f59e0b 55%, #92400e 100%);
      border-color: #fef08a;
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.9), inset 0 1px 3px rgba(255,255,255,0.85);
    }

    /* Memory 3D Cards - Zero White Surfaces */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: clamp(10px, 1.4vw, 18px);
      width: min(93vw, 1420px);
      height: min(76vh, 760px);
      perspective: 1400px;
    }
    .memory-card {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
    }
    .memory-card:hover:not(.flipped):not(.matched) {
      transform: translateY(-4px) scale(1.025) rotateX(4deg);
      filter: brightness(1.08);
    }
    .memory-card.flipped,
    .memory-card.matched {
      transform: rotateY(180deg);
    }
    .memory-card.matched {
      animation: matchedPulse 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .memory-card.shake {
      animation: mismatchShake 0.45s ease-in-out;
    }
    @keyframes matchedPulse {
      0% { transform: rotateY(180deg) scale(1); }
      45% { transform: rotateY(180deg) scale(1.08); }
      100% { transform: rotateY(180deg) scale(1); }
    }
    @keyframes mismatchShake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-9px) rotateZ(-2deg); }
      75% { transform: rotateY(180deg) translateX(9px) rotateZ(2deg); }
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ornate Carved Walnut & Amber Back */
    .card-back {
      background:
        radial-gradient(circle at 50% 50%, rgba(217, 119, 6, 0.24) 0%, transparent 65%),
        repeating-linear-gradient(28deg, #3c2412 0px, #3c2412 9px, #2d1a0c 9px, #2d1a0c 18px, #472b16 18px, #472b16 26px);
      border: 4px solid #b47d32;
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.7),
        inset 0 0 18px rgba(15, 7, 2, 0.9),
        inset 0 2px 3px rgba(255, 224, 150, 0.4);
    }

    /* Ornate Aged Parchment & Carved Wood Front for Word Cards */
    .card-front-word {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 50% 45%, #f4dfb4 0%, #dfc082 65%, #b88b4a 100%);
      border: 5px solid #593516;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.75),
        inset 0 0 22px rgba(92, 52, 16, 0.55),
        inset 0 2px 5px rgba(255, 245, 215, 0.8);
    }

    /* Ornate Stone & Amber Frame Front for Live Biomechanical Animal Picture Cards */
    .card-front-pic {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at 50% 30%, #3b2a1a 0%, #1f160e 100%);
      border: 5px solid #855826;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.75),
        inset 0 0 16px rgba(0, 0, 0, 0.75);
    }

    .memory-card.matched .card-front-word,
    .memory-card.matched .card-front-pic {
      border-color: #fbbf24;
      box-shadow:
        0 0 28px rgba(251, 191, 36, 0.9),
        0 10px 25px rgba(0, 0, 0, 0.75),
        inset 0 0 18px rgba(251, 191, 36, 0.45);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- STAGE 1: Full-Viewport Biomechanical Living Habitat Canvas -->
  <div id="habitatStage" class="relative z-10 w-full h-full flex items-center justify-center overflow-hidden cursor-pointer">
    <canvas id="habitatCanvas" class="w-full h-full block"></canvas>

    <!-- Ornate Carved Naturalist Plaque (Appears on click, ZERO extra words - only Group Name) -->
    <div id="plaque" class="naturalist-plaque hidden-plaque absolute bottom-16 left-1/2 z-30 px-12 py-6 rounded-3xl flex flex-col items-center justify-center min-w-[320px] max-w-[90vw]">
      <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 400 120" preserveAspectRatio="none">
        <g fill="#5c3614" opacity="0.5">
          <circle cx="18" cy="18" r="5.5"/><circle cx="382" cy="18" r="5.5"/>
          <circle cx="18" cy="102" r="5.5"/><circle cx="382" cy="102" r="5.5"/>
        </g>
        <path d="M30,14 L370,14 M30,106 L370,106" stroke="#78471a" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>
      </svg>
      <div id="plaqueMainWord" class="text-4xl sm:text-6xl md:text-7xl font-black tracking-wider uppercase text-[#2d1706] drop-shadow-[0_2px_1px_rgba(255,240,200,0.9)] leading-none text-center">
        ЗГРАЯ
      </div>
    </div>
  </div>

  <!-- STAGE 2: Endless Memory Game Container (Live Animated Animal Cards + Group Word Plaques) -->
  <div id="memoryStage" class="hidden relative z-10 w-full h-full flex items-center justify-center pt-16 pb-14 px-4">
    <canvas id="memoryBgCanvas" class="absolute inset-0 w-full h-full pointer-events-none -z-10"></canvas>
    <div id="memoryGrid" class="memory-grid"></div>
  </div>

  <!-- Foreground Celebration & Burst Particle Canvas -->
  <canvas id="fxCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-40"></canvas>

  <!-- TOP CONTROLS: Single Language Button (УКР / РУС) + Minimalist NEXT Button -->
  <div class="fixed top-4 left-4 right-4 z-50 flex items-center justify-between pointer-events-none">
    <!-- Left: Single Language Toggle Button (displays ONLY УКР or РУС) -->
    <button id="langBtn" class="pointer-events-auto wood-btn h-12 sm:h-14 px-6 sm:px-7 rounded-2xl font-black text-lg sm:text-xl tracking-widest flex items-center justify-center" aria-label="Language">
      УКР
    </button>

    <!-- Right: Minimalist NEXT / REGENERATE Button (Always available without completion) -->
    <button id="nextBtn" class="pointer-events-auto amber-btn w-14 h-12 sm:w-16 sm:h-14 rounded-2xl flex items-center justify-center" aria-label="Next">
      <svg id="nextBtnIcon" class="w-8 h-8" viewBox="0 0 24 24" fill="none">
        <path d="M5 12H19M13 6L19 12L13 18" stroke="#2c1203" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- BOTTOM NAVIGATION STONES (8 Habitats + Memory Grid Stone) -->
  <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-50 pointer-events-none">
    <div id="stageNavDots" class="pointer-events-auto flex items-center gap-2.5 px-5 py-2.5 rounded-full"
         style="background: linear-gradient(180deg, rgba(48,28,13,0.9), rgba(28,16,7,0.95)); border: 2px solid #8c5d27; box-shadow: 0 6px 18px rgba(0,0,0,0.75), inset 0 1px 2px rgba(255,220,150,0.35);">
    </div>
  </div>

  <script>
    /********************************************************************
     * BILINGUAL ANIMAL GROUPS DATA (ONLY GROUP NAMES SHOWN - ZERO EXTRA TEXT)
     ********************************************************************/
    const ANIMALS = [
      { id: 'wolves', ukr: 'ЗГРАЯ',   rus: 'СТАЯ'    },
      { id: 'horses', ukr: 'ТАБУН',   rus: 'ТАБУН'   },
      { id: 'fish',   ukr: 'КОСЯК',   rus: 'КОСЯК'   },
      { id: 'sheep',  ukr: 'ОТАРА',   rus: 'ОТАРА'   },
      { id: 'bees',   ukr: 'РІЙ',     rus: 'РОЙ'     },
      { id: 'ants',   ukr: 'КОЛОНІЯ', rus: 'КОЛОНИЯ' },
      { id: 'deer',   ukr: 'СТАДО',   rus: 'СТАДО'   },
      { id: 'lions',  ukr: 'ПРАЙД',   rus: 'ПРАЙД'   }
    ];

    let currentLang = 'ukr'; // 'ukr' or 'rus'
    let currentStage = 0;    // 0..7 = Habitat Slides, 8 = Memory Game Stage
    let excitementTimer = 0;
    let lastTime = performance.now();

    /********************************************************************
     * WEB AUDIO SYNTHESIZER (Rich Multi-Layered Nature & Animal Voices)
     ********************************************************************/
    class NatureAudioEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playWoodClick() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(115, now + 0.065);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      playCardFlip() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(290, now);
        osc.frequency.exponentialRampToValueAtTime(580, now + 0.09);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      playAnimalVoice(animalId) {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // Warm discovery marimba chord
        [392.00, 493.88, 587.33, 783.99].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.14, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.42);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.45);
        });

        if (animalId === 'wolves') {
          // Dual-voice atmospheric wolf pack howl
          [
            { f0: 270, f1: 510, f2: 450, f3: 310, d: 0 },
            { f0: 340, f1: 640, f2: 580, f3: 410, d: 0.22 }
          ].forEach(h => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(h.f0, now + h.d);
            osc.frequency.exponentialRampToValueAtTime(h.f1, now + h.d + 0.45);
            osc.frequency.exponentialRampToValueAtTime(h.f2, now + h.d + 1.1);
            osc.frequency.exponentialRampToValueAtTime(h.f3, now + h.d + 1.5);
            gain.gain.setValueAtTime(0.001, now + h.d);
            gain.gain.linearRampToValueAtTime(0.18, now + h.d + 0.25);
            gain.gain.exponentialRampToValueAtTime(0.001, now + h.d + 1.55);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + h.d);
            osc.stop(now + h.d + 1.58);
          });
        } else if (animalId === 'horses') {
          // Rhythmic 4-beat gallop hoofbeats + whinny vibrato
          [0, 0.09, 0.18, 0.34, 0.43, 0.52, 0.68, 0.77].forEach(t => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(165 + (t * 95) % 45, now + t);
            o.frequency.exponentialRampToValueAtTime(52, now + t + 0.055);
            g.gain.setValueAtTime(0.24, now + t);
            g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.06);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(now + t);
            o.stop(now + t + 0.065);
          });
        } else if (animalId === 'fish') {
          // Bubbling underwater stream + aqua glissando
          for (let i = 0; i < 9; i++) {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = 'sine';
            const f = 400 + i * 110;
            o.frequency.setValueAtTime(f, now + i * 0.05);
            o.frequency.exponentialRampToValueAtTime(f * 1.5, now + i * 0.05 + 0.11);
            g.gain.setValueAtTime(0.14, now + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.13);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(now + i * 0.05);
            o.stop(now + i * 0.05 + 0.14);
          }
        } else if (animalId === 'sheep') {
          // Pastoral wooden bells + gentle bleat vibrato
          [659.25, 880, 987.77, 1318.5].forEach((f, i) => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + i * 0.11);
            g.gain.setValueAtTime(0.17, now + i * 0.11);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.5);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(now + i * 0.11);
            o.stop(now + i * 0.11 + 0.52);
          });
        } else if (animalId === 'bees') {
          // Warm harmonic bee swarm hum
          const o = this.ctx.createOscillator();
          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();
          const g = this.ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(190, now);
          lfo.frequency.setValueAtTime(28, now);
          lfoGain.gain.setValueAtTime(16, now);
          lfo.connect(lfoGain);
          lfoGain.connect(o.frequency);
          g.gain.setValueAtTime(0.08, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start(now);
          lfo.start(now);
          o.stop(now + 0.72);
          lfo.stop(now + 0.72);
        } else if (animalId === 'ants') {
          // Forest xylophone footsteps
          [523.25, 659.25, 783.99, 659.25, 880, 1046.5].forEach((f, i) => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(f, now + i * 0.05);
            g.gain.setValueAtTime(0.16, now + i * 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.09);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(now + i * 0.05);
            o.stop(now + i * 0.05 + 0.1);
          });
        } else if (animalId === 'deer') {
          // Woodland horn call + water droplet chimes
          [293.66, 440.00, 587.33].forEach((f, i) => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + i * 0.08);
            g.gain.setValueAtTime(0.18, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(now + i * 0.08);
            o.stop(now + 0.86);
          });
        } else if (animalId === 'lions') {
          // Deep resonant savanna lion roar bass chord
          [98, 146.83, 196, 246.94].forEach((f) => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(f, now);
            o.frequency.exponentialRampToValueAtTime(f * 0.84, now + 0.85);
            g.gain.setValueAtTime(0.08, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.88);
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(now);
            o.stop(now + 0.9);
          });
        }
      }

      playMatchSuccess() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.055);
          gain.gain.setValueAtTime(0.22, now + idx * 0.055);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.65);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.055);
          osc.stop(now + idx * 0.055 + 0.66);
        });
      }

      playMismatch() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [240, 185].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.11);
          osc.stop(now + idx * 0.11 + 0.19);
        });
      }

      playGrandVictory() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

    /********************************************************************
     * BIOMECHANICAL 2-BONE INVERSE KINEMATICS & PROCEDURAL GEOMETRY HELPERS
     ********************************************************************/
    // Exact 2-bone analytical IK solver for realistic knee/elbow/hock bending
    function solveIK(hx, hy, fx, fy, L1, L2, bendDir) {
      let dx = fx - hx;
      let dy = fy - hy;
      let dist = Math.hypot(dx, dy);
      const maxReach = (L1 + L2) * 0.992;
      const minReach = Math.abs(L1 - L2) * 1.05;
      if (dist > maxReach) {
        dx = (dx / dist) * maxReach;
        dy = (dy / dist) * maxReach;
        dist = maxReach;
      } else if (dist < minReach) {
        dx = (dx / (dist || 1)) * minReach;
        dy = (dy / (dist || 1)) * minReach;
        dist = minReach;
      }
      const cosA = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
      const angleA = Math.acos(Math.max(-1, Math.min(1, cosA)));
      const baseAngle = Math.atan2(dy, dx);
      const jointAngle = baseAngle + bendDir * angleA;
      return {
        jx: hx + Math.cos(jointAngle) * L1,
        jy: hy + Math.sin(jointAngle) * L1,
        fx: hx + dx,
        fy: hy + dy
      };
    }

    // Compute realistic non-slipping foot target relative to hip during walk/trot cycle
    // s in [0..1): [0..0.55) is ground stance moving backward at exact body speed; [0.55..1) is lifted swing arc
    function computeQuadrupedFoot(hx, groundY, phaseOffset, cycle, strideLen, liftHeight) {
      const s = ((cycle + phaseOffset) % 1 + 1) % 1;
      const stanceRatio = 0.56;
      let relX = 0;
      let liftY = 0;
      let footPitch = 0;
      let justTouched = false;

      if (s < stanceRatio) {
        // Stance phase: foot planted on ground, moves from +strideLen/2 to -strideLen/2 relative to hip
        const u = s / stanceRatio;
        relX = (0.5 - u) * strideLen;
        liftY = 0;
        footPitch = 0;
        if (u < 0.08) justTouched = true;
      } else {
        // Swing phase: knee bends, lifting paw/hoof in an asymmetric forward arc
        const u = (s - stanceRatio) / (1 - stanceRatio);
        relX = (-0.5 + u) * strideLen;
        liftY = -Math.sin(u * Math.PI) * liftHeight * (1 - 0.2 * u);
        footPitch = Math.sin(u * Math.PI) * 0.55;
      }
      return { fx: hx + relX, fy: groundY + liftY, footPitch, justTouched, inStance: s < stanceRatio };
    }

    // Draw a tapered anatomical limb segment (e.g. muscular thigh or crus)
    function drawTaperedSegment(ctx, x1, y1, x2, y2, r1, r2, color) {
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const nx = -Math.sin(ang);
      const ny = Math.cos(ang);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x1 + nx * r1, y1 + ny * r1);
      ctx.lineTo(x2 + nx * r2, y2 + ny * r2);
      ctx.arc(x2, y2, r2, ang + Math.PI / 2, ang - Math.PI / 2, true);
      ctx.lineTo(x1 - nx * r1, y1 - ny * r1);
      ctx.arc(x1, y1, r1, ang - Math.PI / 2, ang + Math.PI / 2, true);
      ctx.closePath();
      ctx.fill();
    }

    function spawnNatureBurst(x, y, count = 36) {
      const colors = ['#fbbf24', '#fde047', '#f59e0b', '#84cc16', '#38bdf8', '#fb923c', '#fef08a'];
      const shapes = ['leaf', 'sparkle', 'petal', 'ring'];
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = 3 + Math.random() * 9.5;
        burstParticles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2.2,
          gravity: 0.14 + Math.random() * 0.08,
          size: 6 + Math.random() * 9,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.18,
          color: colors[Math.floor(Math.random() * colors.length)],
          shape: shapes[Math.floor(Math.random() * shapes.length)],
          alpha: 1,
          decay: 0.014 + Math.random() * 0.012
        });
      }
    }

    function updateAndDrawFX() {
      fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.985;
        p.rot += p.vRot;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, p.alpha);
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        fxCtx.fillStyle = p.color;
        fxCtx.strokeStyle = p.color;
        if (p.shape === 'leaf') {
          fxCtx.beginPath();
          fxCtx.moveTo(0, -p.size);
          fxCtx.quadraticCurveTo(p.size * 0.85, 0, 0, p.size);
          fxCtx.quadraticCurveTo(-p.size * 0.85, 0, 0, -p.size);
          fxCtx.fill();
        } else if (p.shape === 'sparkle') {
          fxCtx.beginPath();
          for (let s = 0; s < 4; s++) {
            fxCtx.rotate(Math.PI / 2);
            fxCtx.moveTo(0, 0);
            fxCtx.quadraticCurveTo(p.size * 0.2, p.size * 0.2, p.size * 1.2, 0);
            fxCtx.quadraticCurveTo(p.size * 0.2, -p.size * 0.2, 0, 0);
          }
          fxCtx.fill();
        } else if (p.shape === 'ring') {
          fxCtx.lineWidth = 2.2;
          fxCtx.beginPath();
          fxCtx.arc(0, 0, p.size * 0.7, 0, Math.PI * 2);
          fxCtx.stroke();
        } else {
          fxCtx.beginPath();
          fxCtx.ellipse(0, 0, p.size * 0.8, p.size * 0.45, 0, 0, Math.PI * 2);
          fxCtx.fill();
        }
        fxCtx.restore();
      }
    }

    /********************************************************************
     * DETAILED ANATOMICAL SKELETAL QUADRUPED DRAWER (Wolves, Horses, Sheep, Deer, Lions)
     ********************************************************************/
    function drawArticulatedWolf(ctx, wolf, t) {
      ctx.save();
      ctx.translate(wolf.x, wolf.y);
      ctx.scale(wolf.dir * wolf.scale, wolf.scale);

      const isWalking = wolf.speed > 1;
      const stride = 76;
      const lift = 22;
      const groundY = 0;
      const breath = Math.sin(t * 3.2 + wolf.x) * 1.8;
      const bodyBob = isWalking ? Math.sin(wolf.cycle * Math.PI * 4) * 3.2 : breath * 0.5;

      // Hip and Shoulder positions in local space (ground is y = 0)
      const hipX = -34, hipY = -52 + bodyBob;
      const shX = 30,   shY = -55 + bodyBob;

      // Ground shadow
      ctx.fillStyle = 'rgba(10, 18, 28, 0.38)';
      ctx.beginPath();
      ctx.ellipse(0, 2, 54, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Compute 4-beat quadruped leg targets
      const backLeft   = isWalking ? computeQuadrupedFoot(hipX, groundY, 0.0,  wolf.cycle, stride, lift) : { fx: hipX - 8,  fy: 0, footPitch: 0 };
      const frontLeft  = isWalking ? computeQuadrupedFoot(shX,  groundY, 0.25, wolf.cycle, stride, lift) : { fx: shX - 4,   fy: 0, footPitch: 0 };
      const backRight  = isWalking ? computeQuadrupedFoot(hipX, groundY, 0.5,  wolf.cycle, stride, lift) : { fx: hipX + 6,  fy: 0, footPitch: 0 };
      const frontRight = isWalking ? computeQuadrupedFoot(shX,  groundY, 0.75, wolf.cycle, stride, lift) : { fx: shX + 10,  fy: 0, footPitch: 0 };

      // Helper to draw 3-segment canine leg (thigh -> crus/hock -> paw)
      const drawWolfLeg = (hx, hy, foot, isFront, isFar) => {
        const L1 = isFront ? 29 : 31;
        const L2 = isFront ? 29 : 30;
        // Front elbow bends backward (-1), hind stifle/hock articulation bends effectively with knee/hock
        const bend = isFront ? 1 : -1;
        const ik = solveIK(hx, hy, foot.fx, foot.fy - 4, L1, L2, bend);
        const colUpper = isFar ? '#475569' : '#64748b';
        const colLower = isFar ? '#64748b' : '#94a3b8';
        drawTaperedSegment(ctx, hx, hy, ik.jx, ik.jy, isFront ? 9 : 11, 6, colUpper);
        drawTaperedSegment(ctx, ik.jx, ik.jy, ik.fx, ik.fy, 6, 4, colLower);
        // Articulated Paw
        ctx.save();
        ctx.translate(ik.fx, ik.fy);
        ctx.rotate(foot.footPitch);
        ctx.fillStyle = isFar ? '#334155' : '#475569';
        ctx.beginPath();
        ctx.ellipse(4, 2, 7.5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      // Far legs
      drawWolfLeg(hipX, hipY, backLeft, false, true);
      drawWolfLeg(shX, shY, frontLeft, true, true);

      // Articulated multi-segment bushy tail
      const tailWag = Math.sin(t * 4.5 + wolf.x * 0.1) * 0.18 + (isWalking ? 0.25 : -0.15);
      ctx.save();
      ctx.translate(hipX - 10, hipY - 4);
      ctx.rotate(tailWag);
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-24, 4, -48, 22, -44, 38);
      ctx.bezierCurveTo(-30, 38, -14, 22, 2, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Supple Torso & Ribcage with winter fur ruff
      const torsoGrad = ctx.createLinearGradient(0, hipY - 22, 0, hipY + 24);
      torsoGrad.addColorStop(0, '#1e293b');
      torsoGrad.addColorStop(0.45, '#64748b');
      torsoGrad.addColorStop(1, '#cbd5e1');
      ctx.fillStyle = torsoGrad;
      ctx.beginPath();
      ctx.moveTo(hipX - 12, hipY - 6);
      ctx.bezierCurveTo(-10, hipY - 20, 18, shY - 22, shX + 14, shY - 8);
      ctx.bezierCurveTo(shX + 22, shY + 10, shX + 10, shY + 22 + breath, 12, shY + 20 + breath);
      ctx.bezierCurveTo(-8, hipY + 14, hipX - 6, hipY + 14, hipX - 12, hipY - 6);
      ctx.closePath();
      ctx.fill();

      // Near legs
      drawWolfLeg(hipX, hipY, backRight, false, false);
      drawWolfLeg(shX, shY, frontRight, true, false);

      // Articulated Neck, Head & Jaw
      let neckAngle = -0.35;
      let headAngle = 0.25;
      let jawOpen = 0.04;
      if (wolf.role === 'howl') {
        const howlAmt = Math.max(0, Math.sin(t * 1.8));
        neckAngle = -0.65 - howlAmt * 0.45;
        headAngle = -0.25 - howlAmt * 0.55;
        jawOpen = 0.05 + howlAmt * 0.38;
      } else if (wolf.role === 'sniff') {
        const sniffAmt = Math.max(0, Math.sin(t * 1.5));
        neckAngle = 0.25 + sniffAmt * 0.55;
        headAngle = 0.35 + sniffAmt * 0.3;
      } else {
        neckAngle = -0.32 + Math.sin(wolf.cycle * Math.PI * 4) * 0.06;
        headAngle = 0.22 - Math.sin(wolf.cycle * Math.PI * 4) * 0.05;
      }

      ctx.save();
      ctx.translate(shX + 8, shY - 6);
      ctx.rotate(neckAngle);
      // Muscular furred neck
      ctx.fillStyle = torsoGrad;
      ctx.beginPath();
      ctx.moveTo(-10, 12);
      ctx.quadraticCurveTo(8, -14, 24, -18);
      ctx.lineTo(30, 2);
      ctx.quadraticCurveTo(14, 16, -6, 18);
      ctx.closePath();
      ctx.fill();

      // Head at tip of neck
      ctx.translate(24, -10);
      ctx.rotate(headAngle);

      // Twitching Ears
      const earTwitch = Math.sin(t * 5 + wolf.x) > 0.85 ? -0.22 : 0;
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.moveTo(-6, -10); ctx.lineTo(-10, -26); ctx.lineTo(2, -12); ctx.fill();
      ctx.save();
      ctx.rotate(earTwitch);
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.moveTo(0, -10); ctx.lineTo(2, -27); ctx.lineTo(11, -10); ctx.fill();
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.moveTo(2, -12); ctx.lineTo(3, -23); ctx.lineTo(9, -12); ctx.fill();
      ctx.restore();

      // Lower Jaw (articulates open for howling/panting)
      ctx.save();
      ctx.translate(8, 2);
      ctx.rotate(jawOpen);
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.lineTo(24, 0);
      ctx.quadraticCurveTo(20, 6, 0, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Cranium & Upper Muzzle
      ctx.fillStyle = '#64748b';
      ctx.beginPath();
      ctx.moveTo(-8, -8);
      ctx.quadraticCurveTo(4, -16, 16, -9);
      ctx.lineTo(34, -3);
      ctx.quadraticCurveTo(34, 3, 22, 3);
      ctx.lineTo(6, 4);
      ctx.quadraticCurveTo(-8, 4, -8, -8);
      ctx.closePath();
      ctx.fill();

      // White cheek & muzzle fur
      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.moveTo(2, 0); ctx.lineTo(32, -1); ctx.lineTo(24, 4); ctx.lineTo(-2, 5); ctx.closePath();
      ctx.fill();

      // Nose & Amber Eye
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(33, -2, 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(13, -6, 2.8, 2.0, -0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(13.6, -6, 1.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.restore();
    }

    function drawArticulatedHorse(ctx, horse, t) {
      ctx.save();
      ctx.translate(horse.x, horse.y);
      ctx.scale(horse.dir * horse.scale, horse.scale);

      const isMoving = horse.speed > 1;
      const isCanter = horse.role === 'canter';
      const stride = isCanter ? 105 : 86;
      const lift = isCanter ? 34 : 26;
      const groundY = 0;

      // Suspension pitch & vertical bob during trot/canter
      const pitch = isCanter ? Math.sin(horse.cycle * Math.PI * 2) * 0.08 : 0;
      const bob = isMoving ? Math.sin(horse.cycle * Math.PI * (isCanter ? 2 : 4)) * 5 : Math.sin(t * 2.5 + horse.x) * 1.2;

      const hipX = -42, hipY = -68 + bob - Math.sin(pitch) * 35;
      const shX = 36,   shY = -70 + bob + Math.sin(pitch) * 35;

      // Shadow
      ctx.fillStyle = 'rgba(20, 10, 4, 0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 3, 62, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Phase offsets: canter vs 2-beat diagonal trot
      const pBL = 0.0;
      const pFR = isCanter ? 0.18 : 0.05;
      const pBR = isCanter ? 0.42 : 0.50;
      const pFL = isCanter ? 0.65 : 0.55;

      const backLeft   = isMoving ? computeQuadrupedFoot(hipX, groundY, pBL, horse.cycle, stride, lift) : { fx: hipX - 6, fy: 0, footPitch: 0 };
      const frontLeft  = isMoving ? computeQuadrupedFoot(shX,  groundY, pFL, horse.cycle, stride, lift) : { fx: shX - 5,  fy: 0, footPitch: 0 };
      const backRight  = isMoving ? computeQuadrupedFoot(hipX, groundY, pBR, horse.cycle, stride, lift) : { fx: hipX + 6, fy: 0, footPitch: 0 };
      const frontRight = isMoving ? computeQuadrupedFoot(shX,  groundY, pFR, horse.cycle, stride, lift) : { fx: shX + 9,  fy: 0, footPitch: 0 };

      const drawEquineLeg = (hx, hy, foot, isFront, isFar) => {
        const L1 = isFront ? 35 : 37;
        const L2 = isFront ? 36 : 36;
        // Front knee bends forward (+1 in screen space when facing right), hind hock bends backward (-1)
        const bend = isFront ? -1 : -1;
        const ik = solveIK(hx, hy, foot.fx, foot.fy - 5, L1, L2, bend);
        const col = isFar ? horse.dark : horse.coat;
        drawTaperedSegment(ctx, hx, hy, ik.jx, ik.jy, isFront ? 10 : 13, 6.5, col);
        drawTaperedSegment(ctx, ik.jx, ik.jy, ik.fx, ik.fy, 6, 4.2, col);
        // Fetlock & Hoof
        ctx.save();
        ctx.translate(ik.fx, ik.fy);
        ctx.rotate(foot.footPitch);
        ctx.fillStyle = '#1c1917';
        ctx.beginPath();
        ctx.moveTo(-4, -2); ctx.lineTo(5, -2); ctx.lineTo(7, 5); ctx.lineTo(-4, 5); ctx.closePath();
        ctx.fill();
        ctx.restore();
      };

      // Far legs
      drawEquineLeg(hipX, hipY, backLeft, false, true);
      drawEquineLeg(shX, shY, frontLeft, true, true);

      // Multi-strand flowing wave Tail
      const tailWave = Math.sin(t * 5 + horse.x * 0.05) * 0.22 + (isMoving ? 0.48 : 0.08);
      ctx.save();
      ctx.translate(hipX - 14, hipY - 8);
      ctx.rotate(tailWave);
      ctx.fillStyle = horse.mane;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-28, -6, -54, 18 + Math.sin(t * 7) * 8, -48, 48);
      ctx.bezierCurveTo(-30, 40, -18, 18, 2, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Muscular Equine Barrel & Croup
      const bodyGrad = ctx.createLinearGradient(0, hipY - 26, 0, hipY + 26);
      bodyGrad.addColorStop(0, horse.coat);
      bodyGrad.addColorStop(0.75, horse.coat);
      bodyGrad.addColorStop(1, horse.dark);
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(hipX - 16, hipY - 4);
      ctx.bezierCurveTo(hipX - 6, hipY - 26, -12, hipY - 20, 14, shY - 20);
      ctx.bezierCurveTo(shX + 16, shY - 22, shX + 22, shY + 4, shX + 10, shY + 18);
      ctx.bezierCurveTo(12, shY + 22, -16, hipY + 20, hipX - 10, hipY + 12);
      ctx.closePath();
      ctx.fill();

      // Near legs
      drawEquineLeg(hipX, hipY, backRight, false, false);
      drawEquineLeg(shX, shY, frontRight, true, false);

      // Articulated Neck, Flowing Mane & Head (supports smooth grazing dip & nibbling)
      let neckAng = -0.58 + Math.sin(horse.cycle * Math.PI * 2) * 0.1;
      let headAng = 0.45;
      if (horse.role === 'graze') {
        const gCycle = Math.sin(t * 0.9 + horse.grazePhase);
        const reachDown = gCycle > -0.2 ? Math.min(1, (gCycle + 0.2) * 1.4) : 0;
        const nibble = reachDown > 0.85 ? Math.sin(t * 11) * 0.06 : 0;
        neckAng = -0.55 + reachDown * 1.48 + nibble;
        headAng = 0.42 - reachDown * 0.55 - nibble * 0.5;
      }

      ctx.save();
      ctx.translate(shX + 8, shY - 8);
      ctx.rotate(neckAng);

      // Flowing Mane locks along crest of neck
      ctx.fillStyle = horse.mane;
      for (let m = 0; m < 6; m++) {
        const mx = 4 + m * 6.5;
        const my = -8 - m * 4.5;
        const wave = Math.sin(t * 7 + m * 0.9) * 5;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.quadraticCurveTo(mx - 12, my - 10 + wave, mx - 18, my + 4 + wave);
        ctx.quadraticCurveTo(mx - 6, my + 6, mx + 4, my + 2);
        ctx.fill();
      }

      // Muscular Neck
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(-12, 14);
      ctx.quadraticCurveTo(12, -14, 42, -26);
      ctx.lineTo(48, -8);
      ctx.quadraticCurveTo(24, 14, -4, 22);
      ctx.closePath();
      ctx.fill();

      // Head & Muzzle
      ctx.translate(42, -18);
      ctx.rotate(headAng);

      // Flicking Ears
      const earRot = Math.sin(t * 4.2 + horse.x) * 0.18;
      ctx.save();
      ctx.rotate(earRot);
      ctx.fillStyle = horse.dark;
      ctx.beginPath();
      ctx.moveTo(-2, -10); ctx.lineTo(-4, -23); ctx.lineTo(4, -11); ctx.fill();
      ctx.fillStyle = horse.coat;
      ctx.beginPath();
      ctx.moveTo(3, -10); ctx.lineTo(5, -24); ctx.lineTo(11, -10); ctx.fill();
      ctx.restore();

      // Equine Skull, Cheek & Tapered Muzzle
      ctx.fillStyle = horse.coat;
      ctx.beginPath();
      ctx.moveTo(-6, -8);
      ctx.quadraticCurveTo(10, -14, 34, -2);
      ctx.quadraticCurveTo(36, 6, 28, 8);
      ctx.lineTo(8, 7);
      ctx.quadraticCurveTo(-6, 8, -6, -8);
      ctx.closePath();
      ctx.fill();

      // Nostril & Expressive Eye
      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.ellipse(30, 2, 2.5, 1.6, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(11, -5, 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(11.8, -5.8, 0.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.restore();
    }

    // 3. Undulating Multi-Segment Spine Carangiform Fish Drawer
    function drawUndulatingFish(ctx, fish, t) {
      const speed = Math.hypot(fish.vx, fish.vy);
      const baseAngle = Math.atan2(fish.vy, fish.vx);
      const segLen = 7.5 * fish.scale;

      // Update 10 spine nodes with quadratic amplitude increase from head to tail
      const N = 10;
      const pts = [];
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1); // 0 at nose, 1 at tail tip
        // Lateral undulation wave grows towards the tail (true carangiform swimming)
        const amp = (1.5 + u * u * 14) * fish.scale;
        const wave = Math.sin(fish.swimPhase - u * 4.2) * amp;
        const backDist = -i * segLen;
        const px = fish.x + Math.cos(baseAngle) * backDist - Math.sin(baseAngle) * wave;
        const py = fish.y + Math.sin(baseAngle) * backDist + Math.cos(baseAngle) * wave;
        pts.push({ x: px, y: py, u });
      }

      // Width profile of streamlined fish body
      const widths = [3, 10, 15, 16, 14, 11, 7.5, 4.5, 3, 12].map(w => w * fish.scale);
      const leftEdge = [];
      const rightEdge = [];

      for (let i = 0; i < N; i++) {
        const p = pts[i];
        const next = pts[Math.max(0, i - 1)];
        const prev = pts[Math.min(N - 1, i + 1)];
        const tx = next.x - prev.x;
        const ty = next.y - prev.y;
        const len = Math.hypot(tx, ty) || 1;
        const nx = -ty / len;
        const ny = tx / len;
        leftEdge.push({ x: p.x + nx * widths[i], y: p.y + ny * widths[i] });
        rightEdge.push({ x: p.x - nx * widths[i], y: p.y - ny * widths[i] });
      }

      // Dorsal fin along mid-spine
      ctx.fillStyle = 'rgba(125, 211, 252, 0.65)';
      ctx.beginPath();
      ctx.moveTo(leftEdge[2].x, leftEdge[2].y);
      ctx.quadraticCurveTo(
        (leftEdge[4].x + rightEdge[4].x) * 0.5 + (leftEdge[4].x - rightEdge[4].x) * 1.1,
        (leftEdge[4].y + rightEdge[4].y) * 0.5 + (leftEdge[4].y - rightEdge[4].y) * 1.1,
        leftEdge[6].x, leftEdge[6].y
      );
      ctx.closePath();
      ctx.fill();

      // Forked Caudal Tail Fin flexing at nodes 7..9
      ctx.fillStyle = 'rgba(56, 189, 248, 0.78)';
      ctx.beginPath();
      ctx.moveTo(pts[7].x, pts[7].y);
      ctx.lineTo(leftEdge[9].x, leftEdge[9].y);
      ctx.lineTo(pts[8].x, pts[8].y);
      ctx.lineTo(rightEdge[9].x, rightEdge[9].y);
      ctx.closePath();
      ctx.fill();

      // Streamlined Iridescent Body Polygon
      const grad = ctx.createLinearGradient(leftEdge[3].x, leftEdge[3].y, rightEdge[3].x, rightEdge[3].y);
      grad.addColorStop(0, '#0284c7');
      grad.addColorStop(0.45, '#38bdf8');
      grad.addColorStop(0.75, '#e0f2fe');
      grad.addColorStop(1, '#64748b');
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.moveTo(pts[0].x + Math.cos(baseAngle) * 5 * fish.scale, pts[0].y + Math.sin(baseAngle) * 5 * fish.scale);
      for (let i = 0; i < 8; i++) ctx.lineTo(leftEdge[i].x, leftEdge[i].y);
      for (let i = 7; i >= 0; i--) ctx.lineTo(rightEdge[i].x, rightEdge[i].y);
      ctx.closePath();
      ctx.fill();

      // Golden lateral stripe
      ctx.strokeStyle = 'rgba(254, 240, 138, 0.75)';
      ctx.lineWidth = 2 * fish.scale;
      ctx.beginPath();
      for (let i = 1; i < 8; i++) {
        if (i === 1) ctx.moveTo(pts[i].x, pts[i].y);
        else ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.stroke();

      // Fluttering Pectoral Fin near node 2
      const finFlap = Math.sin(fish.swimPhase * 1.5) * 0.45;
      ctx.save();
      ctx.translate(pts[2].x, pts[2].y);
      ctx.rotate(baseAngle + 2.3 + finFlap);
      ctx.fillStyle = 'rgba(186, 230, 253, 0.75)';
      ctx.beginPath();
      ctx.ellipse(8 * fish.scale, 0, 9 * fish.scale, 4 * fish.scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Eye at node 1
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(pts[1].x, pts[1].y - 2 * fish.scale, 3.6 * fish.scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(pts[1].x + Math.cos(baseAngle) * 1.2, pts[1].y - 2 * fish.scale, 2 * fish.scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // 4. Articulated Sheep & Playful Pronking Lamb Drawer
    function drawArticulatedSheep(ctx, sheep, t) {
      ctx.save();
      ctx.translate(sheep.x, sheep.y);
      ctx.scale(sheep.dir * sheep.scale, sheep.scale);

      const isWalking = sheep.speed > 1;
      const stride = 54;
      const lift = 16;

      // Pronking (four-legged spring) kinematics for playful lambs
      let pronkY = 0;
      let pronkCrouch = 0;
      if (sheep.role === 'pronk') {
        const p = (t * 2.1 + sheep.pronkPhase) % (Math.PI * 2);
        if (p < Math.PI) {
          pronkY = -Math.sin(p) * 42;
        } else if (p < Math.PI * 1.35) {
          pronkCrouch = Math.sin(((p - Math.PI) / 0.35)) * 9;
        }
      }

      const bodyBob = (isWalking ? Math.sin(sheep.cycle * Math.PI * 4) * 2.5 : Math.sin(t * 3 + sheep.x) * 1.2) + pronkY + pronkCrouch;
      const hipX = -26, hipY = -42 + bodyBob;
      const shX = 22,   shY = -42 + bodyBob;

      // Shadow scales with jump height
      ctx.fillStyle = 'rgba(20, 40, 20, 0.32)';
      ctx.beginPath();
      const shScale = Math.max(0.55, 1 + pronkY * 0.008);
      ctx.ellipse(0, 2, 44 * shScale, 9 * shScale, 0, 0, Math.PI * 2);
      ctx.fill();

      const footY = pronkY < -2 ? pronkY * 0.45 : 0;
      const backLeft   = isWalking ? computeQuadrupedFoot(hipX, footY, 0.0,  sheep.cycle, stride, lift) : { fx: hipX - 5, fy: 0 };
      const frontLeft  = isWalking ? computeQuadrupedFoot(shX,  footY, 0.25, sheep.cycle, stride, lift) : { fx: shX - 4,  fy: 0 };
      const backRight  = isWalking ? computeQuadrupedFoot(hipX, footY, 0.5,  sheep.cycle, stride, lift) : { fx: hipX + 5, fy: 0 };
      const frontRight = isWalking ? computeQuadrupedFoot(shX,  footY, 0.75, sheep.cycle, stride, lift) : { fx: shX + 6,  fy: 0 };

      const drawSheepLeg = (hx, hy, foot, isFront, isFar) => {
        const ik = solveIK(hx, hy, foot.fx, foot.fy - 3, 22, 23, isFront ? -1 : -1);
        const col = isFar ? '#1c1917' : '#292524';
        drawTaperedSegment(ctx, hx, hy, ik.jx, ik.jy, 6, 4.2, col);
        drawTaperedSegment(ctx, ik.jx, ik.jy, ik.fx, ik.fy, 4.2, 3.2, col);
      };

      drawSheepLeg(hipX, hipY, backLeft, false, true);
      drawSheepLeg(shX, shY, frontLeft, true, true);
      drawSheepLeg(hipX, hipY, backRight, false, false);
      drawSheepLeg(shX, shY, frontRight, true, false);

      // Fluffy Multi-Puff Curly Wool Fleece (jiggles subtly with movement)
      const woolJiggle = Math.sin(sheep.cycle * Math.PI * 4 + t * 5) * 1.4;
      const puffs = [
        [-30, -44, 18], [-14, -54, 21], [6, -55, 22], [24, -46, 19],
        [-22, -32, 18], [0, -31, 21], [20, -32, 18], [-6, -43, 22]
      ];
      puffs.forEach(([px, py, pr], idx) => {
        const g = ctx.createRadialGradient(px - 4, py + bodyBob - 5, 2, px, py + bodyBob, pr);
        g.addColorStop(0, '#fffbeb');
        g.addColorStop(0.65, '#f5ebd6');
        g.addColorStop(1, '#d6c5ad');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(px, py + bodyBob + (idx % 2 === 0 ? woolJiggle : -woolJiggle), pr, 0, Math.PI * 2);
        ctx.fill();
      });

      // Articulated Grazing Neck, Chewing Jaw & Twitching Ears
      let neckAng = -0.25;
      let headAng = 0.2;
      let chewX = 0, chewY = 0;
      if (sheep.role === 'graze') {
        const g = Math.sin(t * 0.95 + sheep.grazePhase);
        const down = g > 0 ? Math.min(1, g * 1.5) : 0;
        neckAng = -0.25 + down * 1.15;
        headAng = 0.2 - down * 0.4;
        if (down < 0.2) {
          chewX = Math.cos(t * 12) * 1.5;
          chewY = Math.abs(Math.sin(t * 12)) * 2.2;
        }
      }

      ctx.save();
      ctx.translate(shX + 10, shY - 8);
      ctx.rotate(neckAng);
      ctx.translate(8, -4);
      ctx.rotate(headAng);

      // Ear twitch
      const earRot = Math.sin(t * 4.5 + sheep.x) * 0.25;
      ctx.save();
      ctx.translate(-2, -6);
      ctx.rotate(-0.4 + earRot);
      ctx.fillStyle = '#44403c';
      ctx.beginPath();
      ctx.ellipse(-6, 0, 8, 3.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Dark Sheep Head
      ctx.fillStyle = '#292524';
      ctx.beginPath();
      ctx.moveTo(-4, -10);
      ctx.quadraticCurveTo(16, -12, 22, 0);
      ctx.quadraticCurveTo(20, 8, 6, 7);
      ctx.quadraticCurveTo(-6, 6, -4, -10);
      ctx.fill();

      // Chewing Lower Jaw
      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.ellipse(13 + chewX, 5 + chewY, 7, 3.2, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // Wool cap on forehead
      ctx.fillStyle = '#fffbeb';
      ctx.beginPath();
      ctx.arc(0, -10, 8.5, 0, Math.PI * 2);
      ctx.fill();

      // Curved Ram Horns if horned
      if (sheep.horns) {
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(-2, -6, 10, -Math.PI * 0.8, Math.PI * 0.55);
        ctx.stroke();
      }

      // Warm Amber Eye
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(9, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(9.6, -4, 1.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.restore();
    }

    // 5. Realistic Honeybee Drawer (with high-speed wing motion blur & 6 segmented legs)
    function drawArticulatedBee(ctx, bee, t, isFlying = true) {
      ctx.save();
      ctx.translate(bee.x, bee.y);
      const dir = bee.vx >= 0 ? 1 : -1;
      const bankTilt = isFlying ? Math.max(-0.35, Math.min(0.35, bee.vx * 0.0025)) * dir : 0;
      ctx.scale(dir * bee.scale, bee.scale);
      ctx.rotate(bankTilt);

      // Subtle abdomen respiration pulse
      const resp = 1 + Math.sin(t * 8 + bee.phase) * 0.045;

      // 6 Jointed Legs (extend when landing, tuck slightly in fast flight)
      const legTuck = isFlying ? 0.25 : 0;
      const legWalk = !isFlying ? Math.sin(t * 18 + bee.phase) * 4 : 0;
      ctx.strokeStyle = '#1c1917';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      [
        [-6, 7, -14, 16 - legTuck * 8, -18 + legWalk, 23 - legTuck * 10],
        [2,  8, 0,   18 - legTuck * 8, -2 - legWalk,  25 - legTuck * 10],
        [10, 7, 16,  16 - legTuck * 8, 21 + legWalk,  22 - legTuck * 10]
      ].forEach(([x0, y0, x1, y1, x2, y2]) => {
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      });

      // Striped Abdomen
      ctx.save();
      ctx.translate(-15, 3);
      ctx.rotate(-0.12);
      ctx.scale(resp, 1 / resp);
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 10.5, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(-18, -12, 36, 24);
      ctx.fillStyle = '#1c1917';
      [-14, -5, 4, 12].forEach(sx => ctx.fillRect(sx, -12, 4.5, 24));
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath();
      ctx.ellipse(0, -5, 12, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Fuzzy Golden-Brown Thorax
      const thGrad = ctx.createRadialGradient(4, -2, 2, 6, 1, 11);
      thGrad.addColorStop(0, '#fbbf24');
      thGrad.addColorStop(0.6, '#b45309');
      thGrad.addColorStop(1, '#451a03');
      ctx.fillStyle = thGrad;
      ctx.beginPath();
      ctx.ellipse(6, 1, 10.5, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head, Compound Eye & Elbowed Antennae
      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(17, 2, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(19, 0, 2.5, 4, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(20, -1.2, 0.9, 0, Math.PI * 2);
      ctx.fill();

      // Vibrating Antennae
      const antVib = Math.sin(t * 24 + bee.phase) * 1.5;
      ctx.strokeStyle = '#1c1917';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(21, -2); ctx.lineTo(26, -7); ctx.lineTo(31, -5 + antVib);
      ctx.moveTo(22, 1);  ctx.lineTo(27, -2); ctx.lineTo(32, 1 - antVib);
      ctx.stroke();

      // High-Frequency Beating Translucent Wings with Motion Blur Ghosting
      const wingAngles = isFlying
        ? [Math.sin(t * 68 + bee.wingPhase) * 0.65, Math.sin(t * 68 + bee.wingPhase + 0.9) * 0.45]
        : [-0.25];
      wingAngles.forEach((wa, idx) => {
        ctx.save();
        ctx.translate(5, -5);
        ctx.rotate(-0.45 + wa);
        ctx.globalAlpha = idx === 0 ? 0.72 : 0.32;
        ctx.fillStyle = 'rgba(224, 242, 254, 0.78)';
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.9)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(-10, -8, 16, 6.8, -0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      ctx.restore();
    }

    // 6. Realistic 6-Legged Alternating Tripod Gait Wood Ant Drawer
    function drawArticulatedAnt(ctx, ant, x, y, angle, t) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(ant.dir * ant.scale, ant.scale);

      // Alternating Tripod Gait: Tripod A (L1, R2, L3) vs Tripod B (R1, L2, R3)
      const stride = 11;
      const pA = Math.sin(ant.cycle * Math.PI * 2);
      const pB = -pA;
      const liftA = Math.max(0, Math.cos(ant.cycle * Math.PI * 2)) * 5;
      const liftB = Math.max(0, -Math.cos(ant.cycle * Math.PI * 2)) * 5;

      // Shadow
      ctx.fillStyle = 'rgba(15, 8, 4, 0.34)';
      ctx.beginPath();
      ctx.ellipse(-4, 14, 24, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      const drawAntLeg = (bx, by, footX, footY, kneeY, isFar) => {
        ctx.strokeStyle = isFar ? '#271004' : '#451a03';
        ctx.lineWidth = isFar ? 2.0 : 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo((bx + footX) * 0.5, kneeY);
        ctx.lineTo(footX, footY);
        ctx.stroke();
      };

      // Far 3 legs
      drawAntLeg(-4, 2, -16 + pA * stride * 0.5, 13 - liftA, -8 - liftA * 0.5, true);
      drawAntLeg(2,  2, 2   + pB * stride * 0.5, 14 - liftB, -9 - liftB * 0.5, true);
      drawAntLeg(8,  2, 18  + pA * stride * 0.5, 13 - liftA, -7 - liftA * 0.5, true);

      // Glossy Chitin Gaster (Abdomen), Petiole & Thorax
      const gGrad = ctx.createRadialGradient(-24, -4, 2, -21, 0, 14);
      gGrad.addColorStop(0, '#b45309');
      gGrad.addColorStop(0.55, '#7c2d12');
      gGrad.addColorStop(1, '#1c0a02');
      ctx.fillStyle = gGrad;
      ctx.beginPath();
      ctx.ellipse(-21, 0, 13.5, 9.5, -0.1, 0, Math.PI * 2);
      ctx.fill();

      // Petiole node & Thorax
      ctx.fillStyle = '#7c2d12';
      ctx.beginPath();
      ctx.arc(-7, 2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = gGrad;
      ctx.beginPath();
      ctx.ellipse(3, 1, 9, 5.2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Near 3 legs
      drawAntLeg(-4, 3, -14 + pB * stride * 0.5, 15 - liftB, -5 - liftB * 0.5, false);
      drawAntLeg(2,  3, 4   + pA * stride * 0.5, 16 - liftA, -6 - liftA * 0.5, false);
      drawAntLeg(8,  3, 20  + pB * stride * 0.5, 15 - liftB, -5 - liftB * 0.5, false);

      // Head, Mandibles, Tapping Antennae & Carried Cargo
      ctx.fillStyle = gGrad;
      ctx.beginPath();
      ctx.ellipse(16, 0, 7, 5.5, 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#090502';
      ctx.beginPath();
      ctx.arc(18, -2, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Rapidly tapping antennae (especially active during antennation pause)
      const tapSpeed = ant.pauseTimer > 0 ? 38 : 14;
      const tap = Math.sin(t * tapSpeed + ant.progress * 20) * (ant.pauseTimer > 0 ? 5 : 2.5);
      ctx.strokeStyle = '#3b1604';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(20, -3); ctx.lineTo(26, -10); ctx.lineTo(33, -7 + tap);
      ctx.moveTo(21, 1);  ctx.lineTo(27, 7);   ctx.lineTo(34, 5 - tap);
      ctx.stroke();

      // Carried Forest Cargo in Mandibles
      if (ant.cargo === 'leaf') {
        ctx.fillStyle = '#65a30d';
        ctx.strokeStyle = '#365314';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(22, -1);
        ctx.bezierCurveTo(26, -18, 44, -22, 48, -6);
        ctx.bezierCurveTo(40, 6, 28, 4, 22, -1);
        ctx.fill();
        ctx.stroke();
      } else if (ant.cargo === 'needle') {
        ctx.strokeStyle = '#a16207';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(16, 3);
        ctx.lineTo(48, -8);
        ctx.stroke();
      } else if (ant.cargo === 'seed') {
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.ellipse(26, -1, 5.5, 3.8, -0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // 7. Articulated Red Deer (Stag, Hind & Spotted Fawn) Drawer
    function drawArticulatedDeer(ctx, deer, t) {
      ctx.save();
      ctx.translate(deer.x, deer.y);
      ctx.scale(deer.dir * deer.scale, deer.scale);

      const isWalking = deer.speed > 1;
      const stride = 78;
      const lift = 28; // High-stepping graceful cervine stride
      const bodyBob = isWalking ? Math.sin(deer.cycle * Math.PI * 4) * 3 : Math.sin(t * 2.6 + deer.x) * 1.2;

      const hipX = -34, hipY = -66 + bodyBob;
      const shX = 30,   shY = -68 + bodyBob;

      // Shadow
      ctx.fillStyle = 'rgba(25, 12, 4, 0.34)';
      ctx.beginPath();
      ctx.ellipse(0, 3, 52, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      const backLeft   = isWalking ? computeQuadrupedFoot(hipX, 0, 0.0,  deer.cycle, stride, lift) : { fx: hipX - 6, fy: 0, footPitch: 0 };
      const frontLeft  = isWalking ? computeQuadrupedFoot(shX,  0, 0.25, deer.cycle, stride, lift) : { fx: shX - 4,  fy: 0, footPitch: 0 };
      const backRight  = isWalking ? computeQuadrupedFoot(hipX, 0, 0.5,  deer.cycle, stride, lift) : { fx: hipX + 6, fy: 0, footPitch: 0 };
      const frontRight = isWalking ? computeQuadrupedFoot(shX,  0, 0.75, deer.cycle, stride, lift) : { fx: shX + 8,  fy: 0, footPitch: 0 };

      const drawCervineLeg = (hx, hy, foot, isFront, isFar) => {
        const ik = solveIK(hx, hy, foot.fx, foot.fy - 4, 34, 35, isFront ? -1 : -1);
        const col = isFar ? '#78350f' : '#9a3412';
        drawTaperedSegment(ctx, hx, hy, ik.jx, ik.jy, isFront ? 8.5 : 10.5, 5, col);
        drawTaperedSegment(ctx, ik.jx, ik.jy, ik.fx, ik.fy, 5, 3.2, col);
        ctx.fillStyle = '#1c1917';
        ctx.fillRect(ik.fx - 2, ik.fy - 1, 6, 4);
      };

      drawCervineLeg(hipX, hipY, backLeft, false, true);
      drawCervineLeg(shX, shY, frontLeft, true, true);

      // Slender Deer Torso & Cream Rump Patch
      const coatGrad = ctx.createLinearGradient(0, hipY - 18, 0, hipY + 20);
      coatGrad.addColorStop(0, '#9a3412');
      coatGrad.addColorStop(0.65, '#b45309');
      coatGrad.addColorStop(1, '#78350f');
      ctx.fillStyle = coatGrad;
      ctx.beginPath();
      ctx.moveTo(hipX - 12, hipY - 4);
      ctx.bezierCurveTo(-12, hipY - 20, 14, shY - 18, shX + 12, shY - 6);
      ctx.bezierCurveTo(shX + 16, shY + 14, 12, shY + 18, -14, hipY + 15);
      ctx.closePath();
      ctx.fill();

      // Cream Rump Patch
      ctx.fillStyle = '#fef3c7';
      ctx.beginPath();
      ctx.ellipse(hipX - 10, hipY + 1, 5, 8, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // White Fawn Spots
      if (deer.isFawn) {
        ctx.fillStyle = 'rgba(254, 243, 199, 0.78)';
        [[-18, -6], [-6, -9], [8, -5], [-12, 2], [2, 2], [14, -1]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.arc(sx, hipY + sy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      drawCervineLeg(hipX, hipY, backRight, false, false);
      drawCervineLeg(shX, shY, frontRight, true, false);

      // Articulated Neck, Head & Majestic Antlers (supports drinking from stream & grazing)
      let neckAng = -0.82;
      let headAng = 0.72;
      if (deer.role === 'drink' || deer.role === 'graze') {
        const s = Math.sin(t * 0.85 + deer.actionPhase);
        const dip = s > -0.1 ? Math.min(1, (s + 0.1) * 1.35) : 0;
        neckAng = -0.82 + dip * 1.75;
        headAng = 0.72 - dip * 0.65;
        // Spawn expanding water ripple when drinking stag's muzzle touches stream
        if (deer.role === 'drink' && dip > 0.92 && Math.random() < 0.18 && currentStage === 6) {
          worldState.ripples.push({ x: deer.x + 88 * deer.scale * deer.dir, y: deer.y + 8, r: 4, alpha: 0.85 });
        }
      }

      ctx.save();
      ctx.translate(shX + 6, shY - 6);
      ctx.rotate(neckAng);

      // Stag winter neck mane or slender hind neck
      ctx.fillStyle = deer.isStag ? '#5c2409' : '#9a3412';
      ctx.beginPath();
      ctx.moveTo(-10, 10);
      ctx.quadraticCurveTo(14, -12, 38, -18);
      ctx.lineTo(42, -2);
      ctx.quadraticCurveTo(18, 14, -4, 16);
      ctx.closePath();
      ctx.fill();

      ctx.translate(38, -12);
      ctx.rotate(headAng);

      // Branching Royal Antlers for Stag
      if (deer.isStag) {
        ctx.strokeStyle = '#d6b384';
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(-2, -8);
        ctx.bezierCurveTo(-14, -28, -32, -42, -48, -48);
        ctx.moveTo(-12, -22); ctx.lineTo(2, -32);
        ctx.moveTo(-22, -33); ctx.lineTo(-12, -46);
        ctx.moveTo(-34, -41); ctx.lineTo(-30, -56);
        ctx.stroke();
      }

      // Rotating Alert Ears
      const earRot = Math.sin(t * 3.8 + deer.x) * 0.22;
      ctx.save();
      ctx.translate(-2, -8);
      ctx.rotate(-0.5 + earRot);
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.ellipse(-7, 0, 8.5, 3.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Head & Tapered Muzzle
      ctx.fillStyle = '#9a3412';
      ctx.beginPath();
      ctx.moveTo(-6, -8);
      ctx.quadraticCurveTo(10, -12, 28, -3);
      ctx.quadraticCurveTo(28, 4, 18, 5);
      ctx.lineTo(0, 5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(27, -1, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(8.7, -4.7, 0.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.restore();
    }

    // 8. Articulated Lion, Stalking Lioness & Playful Pouncing Cub Drawer
    function drawArticulatedLion(ctx, lion, t) {
      ctx.save();
      ctx.translate(lion.x, lion.y);
      ctx.scale(lion.dir * lion.scale, lion.scale);

      const isWalking = lion.speed > 1;
      const stride = 82;
      const lift = 21;

      // Playful cub crouch & pounce kinematics
      let crouchFront = 0;
      let jumpX = 0, jumpY = 0;
      if (lion.role === 'pounce') {
        const p = (t * 1.8 + lion.pouncePhase) % (Math.PI * 2);
        if (p < 2.2) {
          crouchFront = Math.sin((p / 2.2) * Math.PI) * 14;
        } else if (p < 4.2) {
          const u = (p - 2.2) / 2.0;
          jumpX = Math.sin(u * Math.PI) * 36;
          jumpY = -Math.sin(u * Math.PI) * 28;
        }
      }
      ctx.translate(jumpX, jumpY);

      // Feline shoulder blade (withers) rise & fall and supple spine flex
      const shoulderPump = isWalking ? Math.sin(lion.cycle * Math.PI * 2) * 4.5 : 0;
      const hipPump = isWalking ? Math.cos(lion.cycle * Math.PI * 2) * 3.5 : 0;
      const isResting = lion.role === 'rest';

      const hipX = -38, hipY = isResting ? -22 : -54 + hipPump;
      const shX = 32,   shY = isResting ? -26 : -56 + shoulderPump + crouchFront;

      // Shadow
      ctx.fillStyle = 'rgba(28, 12, 2, 0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 3 - jumpY * 0.6, 58, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      const backLeft   = isWalking ? computeQuadrupedFoot(hipX, 0, 0.0,  lion.cycle, stride, lift) : { fx: hipX - 8, fy: 0, footPitch: 0 };
      const frontLeft  = isWalking ? computeQuadrupedFoot(shX,  0, 0.25, lion.cycle, stride, lift) : { fx: shX - 2,  fy: 0, footPitch: 0 };
      const backRight  = isWalking ? computeQuadrupedFoot(hipX, 0, 0.5,  lion.cycle, stride, lift) : { fx: hipX + 6, fy: 0, footPitch: 0 };
      const frontRight = isWalking ? computeQuadrupedFoot(shX,  0, 0.75, lion.cycle, stride, lift) : { fx: shX + 12, fy: 0, footPitch: 0 };

      const drawFelineLeg = (hx, hy, foot, isFront, isFar) => {
        if (isResting) {
          ctx.fillStyle = isFar ? '#b45309' : '#d97706';
          ctx.beginPath();
          ctx.roundRect(hx - 6, -12, 34, 12, 6);
          ctx.fill();
          return;
        }
        const ik = solveIK(hx, hy, foot.fx, foot.fy - 4, 29, 29, isFront ? 1 : -1);
        const col = isFar ? '#b45309' : '#d97706';
        drawTaperedSegment(ctx, hx, hy, ik.jx, ik.jy, isFront ? 10 : 12, 7, col);
        drawTaperedSegment(ctx, ik.jx, ik.jy, ik.fx, ik.fy, 7, 5, col);
        // Heavy cushioned feline paw
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.ellipse(ik.fx + 4, ik.fy + 1, 8, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();
      };

      drawFelineLeg(hipX, hipY, backLeft, false, true);
      drawFelineLeg(shX, shY, frontLeft, true, true);

      // Multi-segment wave-physics Tufted Feline Tail
      const tailSway = Math.sin(t * 3.8 + lion.x * 0.1) * 12;
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 5.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hipX - 10, hipY - 2);
      ctx.bezierCurveTo(hipX - 38, hipY + 12, hipX - 48, hipY + 28 + tailSway, hipX - 36, hipY + 18 + tailSway);
      ctx.stroke();
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.ellipse(hipX - 36, hipY + 18 + tailSway, 7, 4.5, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Supple Tawny Feline Spine & Muscular Torso
      const bodyGrad = ctx.createLinearGradient(0, shY - 20, 0, shY + 24);
      bodyGrad.addColorStop(0, '#d97706');
      bodyGrad.addColorStop(0.65, '#f59e0b');
      bodyGrad.addColorStop(1, '#fef3c7');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(hipX - 12, hipY - 6);
      ctx.bezierCurveTo(-12, (hipY + shY) * 0.5 - 16, 14, shY - 22, shX + 14, shY - 8);
      ctx.bezierCurveTo(shX + 20, shY + 12, 14, shY + 20, -14, hipY + 16);
      ctx.closePath();
      ctx.fill();

      drawFelineLeg(hipX, hipY, backRight, false, false);
      drawFelineLeg(shX, shY, frontRight, true, false);

      // Head, Roaring Jaw & Wind-Reactive Layered Mane
      const roarAmt = lion.isMale ? Math.max(0, Math.sin(t * 1.4) - 0.35) * 0.55 : 0;
      ctx.save();
      ctx.translate(shX + 12, shY - 8);

      if (lion.isMale) {
        // Multi-layered wind-and-stride reactive mane
        const wind = Math.sin(t * 5.5) * 3.5;
        ctx.fillStyle = '#451a03';
        ctx.beginPath();
        ctx.ellipse(-6 + wind * 0.4, 2, 28, 32, -0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.ellipse(-2 + wind * 0.2, 0, 22, 26, -0.1, 0, Math.PI * 2);
        ctx.fill();
      }

      // Rounded Feline Ears
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.arc(-2, -18, 6, 0, Math.PI * 2);
      ctx.arc(8, -19, 6, 0, Math.PI * 2);
      ctx.fill();

      // Articulated Roaring Lower Jaw
      ctx.save();
      ctx.translate(10, 4);
      ctx.rotate(roarAmt);
      ctx.fillStyle = '#fef3c7';
      ctx.beginPath();
      ctx.ellipse(8, 2, 10, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Broad Feline Skull & Muzzle
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(-8, -14);
      ctx.quadraticCurveTo(12, -18, 26, -6);
      ctx.quadraticCurveTo(28, 4, 16, 5);
      ctx.lineTo(-4, 4);
      ctx.closePath();
      ctx.fill();

      // Nose & Amber Predator Eye
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.moveTo(22, -5); ctx.lineTo(27, -2); ctx.lineTo(23, 2); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.ellipse(11, -8, 3.2, 2.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(11.6, -8, 1.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.restore();
    }

    /********************************************************************
     * FULL-SCENE BIOME RENDERERS (Used for both Main Stage & Live Memory Cards)
     ********************************************************************/
    function updateWorldPhysics(dt, t) {
      const boost = 1 + excitementTimer * 1.4;

      // 1. Update Wolves
      worldState.wolves.forEach(w => {
        if (w.speed > 0) {
          const v = w.speed * boost * w.dir;
          w.x += v * dt;
          // Exact stride-locked cycle so paws never slip on the snow
          w.cycle = (w.cycle + (Math.abs(v) * dt) / (76 * w.scale)) % 1;
          if (w.dir === 1 && w.x > 2050) w.x = -130;
          if (w.dir === -1 && w.x < -130) w.x = 2050;
          if (Math.random() < 0.14) {
            worldState.footprints.push({ x: w.x - w.dir * 20, y: w.y + 2, alpha: 0.55 });
            if (worldState.footprints.length > 70) worldState.footprints.shift();
          }
        } else if (w.role === 'howl') {
          const howlAmt = Math.max(0, Math.sin(t * 1.8));
          if (howlAmt > 0.35 && Math.random() < 0.35) {
            worldState.breathPuffs.push({
              x: w.x + 62 * w.scale,
              y: w.y - 105 * w.scale,
              vx: 18 + Math.random() * 16,
              vy: -24 - Math.random() * 18,
              r: 5,
              alpha: 0.55
            });
          }
        }
      });
      for (let i = worldState.breathPuffs.length - 1; i >= 0; i--) {
        const bp = worldState.breathPuffs[i];
        bp.x += bp.vx * dt;
        bp.y += bp.vy * dt;
        bp.r += 16 * dt;
        bp.alpha -= 0.38 * dt;
        if (bp.alpha <= 0) worldState.breathPuffs.splice(i, 1);
      }

      // 2. Update Horses
      worldState.horses.forEach(h => {
        if (h.speed > 0) {
          const v = h.speed * boost * h.dir;
          h.x += v * dt;
          const stride = (h.role === 'canter' ? 105 : 86) * h.scale;
          h.cycle = (h.cycle + (Math.abs(v) * dt) / stride) % 1;
          if (h.x > 2080) h.x = -160;
          if (Math.random() < 0.25) {
            worldState.dustPuffs.push({
              x: h.x - 25 * h.scale,
              y: h.y + 2,
              vx: -30 - Math.random() * 25,
              vy: -12 - Math.random() * 18,
              r: 6 + Math.random() * 6,
              alpha: 0.45
            });
          }
        }
      });
      for (let i = worldState.dustPuffs.length - 1; i >= 0; i--) {
        const dp = worldState.dustPuffs[i];
        dp.x += dp.vx * dt;
        dp.y += dp.vy * dt;
        dp.r += 18 * dt;
        dp.alpha -= 0.55 * dt;
        if (dp.alpha <= 0) worldState.dustPuffs.splice(i, 1);
      }

      // 3. Update Boids Fish School
      const schoolCenterY = 520 + Math.sin(t * 0.8) * 140;
      worldState.fish.forEach((f, idx) => {
        const speed = Math.hypot(f.vx, f.vy);
        f.swimPhase += (speed * 0.085 + 4.5) * dt * boost;
        f.vy += ((schoolCenterY + Math.sin(t * 1.4 + idx * 0.5) * 120 - f.y) * 0.9 - f.vy * 0.8) * dt;
        f.vx += ((115 * boost + (idx % 4) * 18) - f.vx) * 1.5 * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        if (f.x > 2050) f.x = -120;
      });

      // 4. Update Sheep
      worldState.sheep.forEach(s => {
        if (s.speed > 0) {
          const v = s.speed * boost * s.dir;
          s.x += v * dt;
          s.cycle = (s.cycle + (Math.abs(v) * dt) / (54 * s.scale)) % 1;
          if (s.dir === 1 && s.x > 2020) s.x = -100;
          if (s.dir === -1 && s.x < -100) s.x = 2020;
        }
      });

      // 5. Update Bees & Flower Bending
      worldState.flowers.forEach(fl => { fl.bend *= Math.pow(0.08, dt); });
      worldState.bees.forEach((b, i) => {
        if (b.role === 'comb') {
          const oldX = b.x;
          b.x = 760 + Math.sin(t * 1.1 + i * 1.7) * 75;
          b.y = 315 + Math.cos(t * 1.5 + i * 2.1) * 85;
          b.vx = (b.x - oldX) / (dt || 0.016);
        } else {
          // Cycle between hovering on flower and flying in Lissajous swarm
          const cycle = (t * 0.35 + i * 0.42) % 1;
          const fl = worldState.flowers[b.targetFlower];
          let tx, ty;
          if (cycle < 0.32) {
            tx = fl.bx;
            ty = fl.by - 18;
            if (Math.hypot(b.x - tx, b.y - ty) < 28) {
              fl.bend = Math.min(22, fl.bend + 65 * dt);
            }
          } else {
            tx = 960 + Math.sin(t * 1.2 + i * 0.9) * 580;
            ty = 420 + Math.sin(t * 2.4 + i * 1.3) * 210;
          }
          b.vx += ((tx - b.x) * 3.2 - b.vx * 2.4) * dt;
          b.vy += ((ty - b.y) * 3.2 - b.vy * 2.4) * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
        }
      });

      // 6. Update Ants with Antennation Pauses
      worldState.ants.forEach((a, i) => {
        if (a.pauseTimer > 0) {
          a.pauseTimer -= dt;
          return;
        }
        const dp = a.speed * boost * dt;
        a.progress = (a.progress + dp * a.dir + 1) % 1;
        a.cycle = (a.cycle + dp * 28) % 1;

        // Check if meeting an opposite-direction ant on same lane
        for (let j = i + 1; j < worldState.ants.length; j++) {
          const other = worldState.ants[j];
          if (other.lane === a.lane && other.dir !== a.dir && other.pauseTimer <= 0) {
            if (Math.abs(a.progress - other.progress) < 0.018) {
              a.pauseTimer = 0.45;
              other.pauseTimer = 0.45;
            }
          }
        }
      });

      // 7. Update Deer & Stream Ripples
      worldState.deer.forEach(d => {
        if (d.speed > 0) {
          const v = d.speed * boost * d.dir;
          d.x += v * dt;
          d.cycle = (d.cycle + (Math.abs(v) * dt) / (78 * d.scale)) % 1;
          if (d.dir === 1 && d.x > 2050) d.x = -130;
          if (d.dir === -1 && d.x < -130) d.x = 2050;
        }
      });
      for (let i = worldState.ripples.length - 1; i >= 0; i--) {
        const rp = worldState.ripples[i];
        rp.r += 42 * dt;
        rp.alpha -= 0.45 * dt;
        if (rp.alpha <= 0) worldState.ripples.splice(i, 1);
      }

      // 8. Update Lions
      worldState.lions.forEach(l => {
        if (l.speed > 0) {
          const v = l.speed * boost * l.dir;
          l.x += v * dt;
          l.cycle = (l.cycle + (Math.abs(v) * dt) / (82 * l.scale)) % 1;
          if (l.dir === 1 && l.x > 2060) l.x = -140;
          if (l.dir === -1 && l.x < -140) l.x = 2060;
        }
      });
    }

    function renderBiomeScene(ctx, biomeId, width, height, t) {

        ctx.fillStyle = meadow;
        ctx.beginPath();
        ctx.moveTo(0, 710); ctx.quadraticCurveTo(960, 660, 1920, 720);
        ctx.lineTo(1920, 1080); ctx.lineTo(0, 1080); ctx.fill();

        // Draw 7 Articulated Sheep & Pronking Lambs
        worldState.sheep.forEach(s => drawArticulatedSheep(ctx, s, t));

      } else if (biomeId === 'bees') {
        // Blooming Linden Tree Branch & Detailed Hexagonal Honeycomb
        const bg = ctx.createLinearGradient(0, 0, 0, 1080);
        bg.addColorStop(0, '#14532d');
        bg.addColorStop(0.5, '#3f6212');
        bg.addColorStop(1, '#ca8a04');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 1920, 1080);

        // Linden Tree Branch
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 38;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 150); ctx.quadraticCurveTo(680, 110, 1380, 140);
        ctx.stroke();

        // Detailed Golden Hexagonal Honeycomb
        ctx.save();
        ctx.translate(760, 310);
        ctx.fillStyle = '#d97706';
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.ellipse(0, 0, 155, 185, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Draw Hexagonal Comb Cells
        const hexR = 16;
        for (let row = -5; row <= 5; row++) {
          for (let col = -4; col <= 4; col++) {
            const hx = col * hexR * 1.75 + (row % 2) * hexR * 0.88;
            const hy = row * hexR * 1.52;
            if ((hx * hx) / (135 * 135) + (hy * hy) / (165 * 165) < 0.88) {
              ctx.fillStyle = (row + col) % 3 === 0 ? '#fef08a' : '#f59e0b';
              ctx.strokeStyle = '#92400e';
              ctx.lineWidth = 2;
              ctx.beginPath();
              for (let k = 0; k < 6; k++) {
                const a = (Math.PI / 3) * k;
                const px = hx + Math.cos(a) * (hexR - 2);
                const py = hy + Math.sin(a) * (hexR - 2);
                if (k === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);

              ctx.closePath();

          ctx.quadraticCurveTo(fl.bx + sway * 0.5, (1080 + fy) * 0.5, fx, fy);

        // Sunset Savanna Sun & Flat-Topped Acacia Silhouette

        // Draw 5 Articulated Lions (Prowling/Roaring Male, Stalking Lioness, Pouncing Cubs)
        worldState.lions.forEach(l => drawArticulatedLion(ctx, l, t));
      }
