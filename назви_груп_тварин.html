    }

    /********************************************************************
     * STAGE 1 INTERACTION (Click reveals group plaque + animal sound + burst)
     ********************************************************************/
    const habitatStage = document.getElementById('habitatStage');
    const plaque = document.getElementById('plaque');
    const plaqueMainWord = document.getElementById('plaqueMainWord');

    function updatePlaqueText() {
      if (currentStage >= 8) return;
      plaqueMainWord.textContent = ANIMALS[currentStage][currentLang];
    }

    habitatStage.addEventListener('pointerdown', (e) => {
      if (currentStage >= 8) return;
      const item = ANIMALS[currentStage];
      excitementTimer = 1.2;

      // If fish stage, give fish a quick darting boost
      if (item.id === 'fish') {
        worldState.fish.forEach(f => { f.vx = 280 + Math.random() * 120; });
      }

      sound.playAnimalVoice(item.id);
      spawnNatureBurst(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2, 42);

      updatePlaqueText();
      plaque.classList.remove('hidden-plaque');
      plaque.classList.add('visible-plaque');
    });

    /********************************************************************
     * STAGE 2: ENDLESS MEMORY GENERATOR WITH LIVE BIOMECHANICAL MINI-CANVASES
     ********************************************************************/
    const memoryGrid = document.getElementById('memoryGrid');
    let memoryCards = [];
    let flippedCards = [];
    let matchedCount = 0;
    let lockBoard = false;
    let activeMiniCanvases = [];

    function getOrnateCardBackSvg() {
      return `
        <svg viewBox="0 0 200 140" class="w-full h-full p-2 opacity-90">
          <rect x="8" y="8" width="184" height="124" rx="12" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
          <path d="M16,28 C16,16 28,16 28,16 M184,28 C184,16 172,16 172,16 M16,112 C16,124 28,124 28,124 M184,112 C184,124 172,124 172,124" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="100" cy="70" r="30" fill="#78350f" stroke="#f59e0b" stroke-width="2.5"/>
          <circle cx="100" cy="70" r="18" fill="#d97706" stroke="#fde68a" stroke-width="1.5"/>
          <path d="M100,42 L106,64 L128,70 L106,76 L100,98 L94,76 L72,70 L94,64 Z" fill="#fde68a"/>

    function initMemoryGame() {
      flippedCards = [];
      matchedCount = 0;
      lockBoard = false;
      activeMiniCanvases = [];

      const deck = [];
      ANIMALS.forEach((animal) => {
        deck.push({ uid: animal.id + '-word', pairId: animal.id, type: 'word', animalObj: animal });
        deck.push({ uid: animal.id + '-pic',  pairId: animal.id, type: 'pic',  animalObj: animal });
      });

      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      memoryCards = deck;
      renderMemoryBoard();
    }

    function renderMemoryBoard() {
      memoryGrid.innerHTML = '';
      activeMiniCanvases = [];

      memoryCards.forEach((cardData, idx) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'memory-card';
        cardEl.dataset.index = idx;
        cardEl.dataset.pairId = cardData.pairId;

        if (cardData.type === 'word') {
          cardEl.innerHTML = `
            <div class="card-face card-back">${getOrnateCardBackSvg()}</div>
            <div class="card-face card-front-word flex-col px-3 text-center">
              <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-35" viewBox="0 0 200 140" preserveAspectRatio="none">
                <rect x="8" y="8" width="184" height="124" rx="10" fill="none" stroke="#5c3412" stroke-width="2"/>
                <circle cx="16" cy="16" r="3.5" fill="#5c3412"/><circle cx="184" cy="16" r="3.5" fill="#5c3412"/>
                <circle cx="16" cy="124" r="3.5" fill="#5c3412"/><circle cx="184" cy="124" r="3.5" fill="#5c3412"/>
              </svg>
              <span class="word-label text-xl sm:text-2xl md:text-3xl lg:text-4xl font-black tracking-wider text-[#2d1604] drop-shadow-[0_1px_1px_rgba(255,245,215,0.85)] uppercase">
                ${cardData.animalObj[currentLang]}
              </span>
            </div>
          `;
        } else {
          cardEl.innerHTML = `
            <div class="card-face card-back">${getOrnateCardBackSvg()}</div>
            <div class="card-face card-front-pic">
              <canvas width="384" height="216" class="mini-biome-canvas w-full h-full block"></canvas>
              <div class="absolute inset-0 pointer-events-none rounded-[13px] shadow-[inset_0_0_16px_rgba(0,0,0,0.65)] border-2 border-[#d97706]/40"></div>
            </div>
          `;
          const miniCanvas = cardEl.querySelector('.mini-biome-canvas');
          activeMiniCanvases.push({
            canvas: miniCanvas,
            ctx: miniCanvas.getContext('2d'),
            biomeId: cardData.pairId
          });
        }

        cardEl.addEventListener('pointerdown', () => handleCardClick(cardEl, cardData));
        memoryGrid.appendChild(cardEl);
      });
    }

    function updateMemoryLanguage() {
      const cardNodes = memoryGrid.querySelectorAll('.memory-card');
      cardNodes.forEach((node) => {
        const idx = parseInt(node.dataset.index, 10);
        const cardData = memoryCards[idx];
        if (cardData && cardData.type === 'word') {
          const wordSpan = node.querySelector('.word-label');
          if (wordSpan) wordSpan.textContent = cardData.animalObj[currentLang];
        }
      });
    }

    function handleCardClick(cardEl, cardData) {
      if (lockBoard) return;
      if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

      sound.playCardFlip();
      cardEl.classList.add('flipped');
      flippedCards.push({ el: cardEl, data: cardData });

      if (flippedCards.length === 2) {
        lockBoard = true;
        const [first, second] = flippedCards;

        if (first.data.pairId === second.data.pairId) {
          setTimeout(() => {
            first.el.classList.add('matched');
            second.el.classList.add('matched');
            sound.playMatchSuccess();
            sound.playAnimalVoice(first.data.pairId);

            const r1 = first.el.getBoundingClientRect();
            const r2 = second.el.getBoundingClientRect();
            spawnNatureBurst(r1.left + r1.width / 2, r1.top + r1.height / 2, 32);
            spawnNatureBurst(r2.left + r2.width / 2, r2.top + r2.height / 2, 32);

            flippedCards = [];
            matchedCount++;
            lockBoard = false;

            if (matchedCount === ANIMALS.length) {
              setTimeout(() => {
                sound.playGrandVictory();
                for (let k = 0; k < 5; k++) {
                  setTimeout(() => {
                    spawnNatureBurst(
                      window.innerWidth * (0.2 + Math.random() * 0.6),
                      window.innerHeight * (0.25 + Math.random() * 0.5),
                      48
                    );
                  }, k * 180);
                }
              }, 350);
            }
          }, 260);
        } else {
          setTimeout(() => {
            sound.playMismatch();
            first.el.classList.add('shake');
            second.el.classList.add('shake');
          }, 380);

          setTimeout(() => {
            first.el.classList.remove('flipped', 'shake');
            second.el.classList.remove('flipped', 'shake');
            flippedCards = [];
            lockBoard = false;
          }, 960);
        }
      }
    }

    /********************************************************************
     * NAVIGATION, STAGE CONTROLLER & MAIN ANIMATION LOOP
     ********************************************************************/
    const stageNavDots = document.getElementById('stageNavDots');
    const memoryStage = document.getElementById('memoryStage');
    const langBtn = document.getElementById('langBtn');
    const nextBtn = document.getElementById('nextBtn');
    const nextBtnIcon = document.getElementById('nextBtnIcon');

    function buildNavDots() {
      stageNavDots.innerHTML = '';
      for (let i = 0; i <= 8; i++) {
        const dot = document.createElement('button');
        dot.className = 'nav-gem' + (i === currentStage ? ' active' : '');
        dot.setAttribute('aria-label', i < 8 ? `Slide ${i + 1}` : 'Memory');
        dot.addEventListener('pointerdown', () => {
          sound.playWoodClick();
          goToStage(i);
        });
        stageNavDots.appendChild(dot);
      }
    }

    function goToStage(stageIndex) {
      currentStage = stageIndex;
      buildNavDots();
      plaque.classList.remove('visible-plaque');
      plaque.classList.add('hidden-plaque');
      updatePlaqueText();

      if (currentStage < 8) {
        memoryStage.classList.add('hidden');
        habitatStage.classList.remove('hidden');
        nextBtnIcon.innerHTML = `<path d="M5 12H19M13 6L19 12L13 18" stroke="#2c1203" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`;
      } else {
        habitatStage.classList.add('hidden');
        memoryStage.classList.remove('hidden');
        initMemoryGame();
        spawnNatureBurst(window.innerWidth / 2, window.innerHeight / 2, 36);
        nextBtnIcon.innerHTML = `
          <path d="M4 12a8 8 0 0 1 14.3-4.9M20 12a8 8 0 0 1-14.3 4.9" stroke="#2c1203" stroke-width="3.1" stroke-linecap="round"/>
          <polyline points="15 3 19 7.5 14 8.5" stroke="#2c1203" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="9 21 5 16.5 10 15.5" stroke="#2c1203" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
        `;
      }
    }

    // Single Language Toggle Button ("УКР" or "РУС")
    langBtn.addEventListener('pointerdown', () => {
      sound.playWoodClick();
      currentLang = currentLang === 'ukr' ? 'rus' : 'ukr';
      langBtn.textContent = currentLang === 'ukr' ? 'УКР' : 'РУС';
      updatePlaqueText();
      if (currentStage === 8) updateMemoryLanguage();
      const r = langBtn.getBoundingClientRect();
      spawnNatureBurst(r.left + r.width / 2, r.top + r.height / 2, 18);
    });

    // Minimalist NEXT Button (Advances slides immediately OR regenerates fresh Memory layout infinitely)
    nextBtn.addEventListener('pointerdown', () => {
      sound.playWoodClick();
      const r = nextBtn.getBoundingClientRect();
      spawnNatureBurst(r.left + r.width / 2, r.top + r.height / 2, 24);

      if (currentStage < 8) {
        goToStage(currentStage + 1);
      } else {
        initMemoryGame();
        spawnNatureBurst(window.innerWidth / 2, window.innerHeight / 2, 42);
      }
    });

    function animateMainLoop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const t = now * 0.001;

      if (excitementTimer > 0) {
        excitementTimer = Math.max(0, excitementTimer - dt);
      }

      updateWorldPhysics(dt, t);

      if (currentStage < 8) {
        renderBiomeScene(hCtx, ANIMALS[currentStage].id, window.innerWidth, window.innerHeight, t);
      } else {
        // Draw warm forest canopy & fireflies on Memory stage background
        const w = window.innerWidth;
        const h = window.innerHeight;
        const grad = mBgCtx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#132415');
        grad.addColorStop(0.5, '#1e331c');
        grad.addColorStop(1, '#26190d');
        mBgCtx.fillStyle = grad;
        mBgCtx.fillRect(0, 0, w, h);

        worldState.snowflakes.forEach((p, idx) => {
          const fx = (p.x + Math.sin(t + idx) * 40) % w;
          const fy = (p.y + Math.cos(t * 0.8 + idx) * 40) % h;
          mBgCtx.fillStyle = `rgba(253, 224, 71, ${0.35 + 0.35 * Math.sin(t * 2.5 + idx)})`;
          mBgCtx.beginPath();
          mBgCtx.arc(fx, fy, p.r, 0, Math.PI * 2);
          mBgCtx.fill();
        });

        // Render live biomechanical mini-canvases on all 8 animal picture cards
        activeMiniCanvases.forEach(mc => {
          renderBiomeScene(mc.ctx, mc.biomeId, 384, 216, t);
        });
      }

      updateAndDrawFX();
      requestAnimationFrame(animateMainLoop);
    }

    goToStage(0);
    requestAnimationFrame(animateMainLoop);
  </script>
</body>
</html>
