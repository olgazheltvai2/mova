<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Замки та Ключі</title>
<style>
  /* === ОСНОВНІ СТИЛІ ЕКРАНУ === */
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }
  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: #1a2a3a;
  }

  /* Контейнер всієї гри */
  #game-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* Головна SVG-сцена */
  #scene-svg {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* === МІНІМАЛІСТИЧНА НАВІГАЦІЯ === */
  .nav-bar {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 30;
    align-items: center;
  }

  .icon-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.85);
    background: linear-gradient(145deg, #ff9f1c, #e76f51);
    box-shadow: 0 5px 12px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .icon-btn:hover {
    transform: scale(1.1);
    filter: brightness(1.1);
  }
  .icon-btn:active {
    transform: scale(0.94);
  }
  .icon-btn svg {
    width: 24px;
    height: 24px;
    fill: #fff;
  }

  /* Перемикач мови УКР / РУС (компактна пігулка) */
  .lang-btn {
    height: 44px;
    padding: 0 14px;
    border-radius: 22px;
    border: 3px solid rgba(255,255,255,0.85);
    background: linear-gradient(145deg, #2a9d8f, #1d6f65);
    color: #fff;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(0,0,0,0.35);
    transition: transform 0.15s;
  }
  .lang-btn:hover { transform: scale(1.07); }

  /* Індикатор точок рівня (без цифр і слів) */
  .dots-bar {
    display: flex;
    gap: 8px;
    background: rgba(0,0,0,0.3);
    padding: 8px 14px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    cursor: pointer;
    transition: all 0.25s;
  }
  .dot.active {
    background: #ffd166;
    transform: scale(1.3);
    box-shadow: 0 0 10px #ffd166;
  }
  .dot.done {
    background: #06d6a0;
  }

  /* Полиця здобутих скарбів у лівому верхньому кутку */
  .trophy-shelf {
    position: absolute;
    top: 16px;
    left: 20px;
    display: flex;
    gap: 10px;
    z-index: 30;
  }
  .trophy-slot {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: radial-gradient(circle, rgba(255,255,255,0.25), rgba(0,0,0,0.35));
    border: 2px dashed rgba(255,215,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .trophy-slot.earned {
    border: 3px solid #ffd166;
    background: radial-gradient(circle, #fff3b0, #e09f3e);
    box-shadow: 0 0 16px rgba(255, 209, 102, 0.8);
    transform: scale(1.08);
  }

  /* Анімації для SVG елементів */
  .key-group {
    cursor: grab;
    transition: filter 0.2s;
  }
  .key-group:active {
    cursor: grabbing;
  }
  .key-group.selected {
    filter: drop-shadow(0 0 14px #fff700) brightness(1.12);
  }
  .lock-group {
    cursor: pointer;
  }
  @keyframes floatIdle {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
  }
  @keyframes pulseGlow {
    0%, 100% { filter: drop-shadow(0 0 8px #ffd166); }
    50% { filter: drop-shadow(0 0 22px #ffffff); }
  }
  .prize-pop {
    cursor: pointer;
    animation: pulseGlow 2s infinite;
  }
</style>
</head>

   ============================================================================ */

/* ============================================================================
   СИНТЕЗАТОР РЕАЛІСТИЧНИХ ЗВУКІВ (Web Audio API — без зовнішніх файлів)
   ============================================================================ */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  // Звук взяття ключа (металевий дзвін)
  playPickup() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(920, now);
    osc.frequency.exponentialRampToValueAtTime(1480, now + 0.09);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }
  // Реалістичний звук повороту ключа у замковій щілині та клацання дужки
  playUnlockSequence() {
    this.init();
    const now = this.ctx.currentTime;

    // 1. Вставляння ключа (металевий шурхіт-клац)
    this.tone(420, 680, 0.08, now, 'sawtooth', 0.15);
    // 2. Провертання механізму (два храпових клацання)
    this.tone(310, 520, 0.07, now + 0.18, 'square', 0.18);
    this.tone(480, 760, 0.08, now + 0.30, 'square', 0.20);
    // 3. Відстрілювання сталевої дужки замка (пружинний дзвін!)
    this.tone(880, 1760, 0.22, now + 0.52, 'triangle', 0.30);
    // 4. Приємний мажорний акорд успіху
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      this.tone(freq, freq * 1.01, 0.28, now + 0.56 + i * 0.06, 'sine', 0.18);
    });
  }
  // Звук помилки (ключ не підійшов — глухе деренчання)
  playError() {
    this.init();
    const now = this.ctx.currentTime;
    this.tone(210, 145, 0.14, now, 'sawtooth', 0.25);
    this.tone(175, 115, 0.18, now + 0.14, 'sawtooth', 0.25);
  }
  // Святкова фанфара відкриття скрині зі скарбом!
  playChestOpen() {
    this.init();
    const now = this.ctx.currentTime;
    // Скрип важкої кришки
    this.tone(160, 290, 0.35, now, 'sawtooth', 0.14);
    // Урочисті переливи скарбу
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093.0];
    notes.forEach((n, idx) => {
      this.tone(n, n, 0.45, now + 0.25 + idx * 0.08, 'triangle', 0.22);
    });
  }
  // Звук взаємодії з виграним скарбом
  playSparkle() {
    this.init();
    const now = this.ctx.currentTime;
    [1046.5, 1318.5, 1567.98, 2093].forEach((n, i) => {
      this.tone(n, n * 1.05, 0.18, now + i * 0.05, 'sine', 0.2);
    });
  }
  tone(f1, f2, dur, start, type, vol) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, start);
    osc.frequency.exponentialRampToValueAtTime(f2, start + dur);
    gain.gain.setValueAtTime(vol, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(start);
    osc.stop(start + dur);
  }
}

function renderLocks(locksData) {
  locksLayer.innerHTML = '';

  locksData.forEach((lock, idx) => {

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'lock-group');
    g.setAttribute('id', `lock-${idx}`);
    g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
    g.dataset.index = idx;
    g.dataset.unlocked = 'false';

    // Замок має дужку, яка при відкритті підстрибує вгору і повертається!
    // Посередині білого віконця є замкова щілина, куди вставляється ключ,
    // а після повороту ключа там з'являється золотий склад!
    g.innerHTML = `
      <!-- Сталева дужка замка (продіта крізь скобу скрині) -->
      <g id="shackle-${idx}" style="transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: 42px -12px;">

        <rect x="-72" y="110" width="144" height="16" rx="8" fill="#78350f" opacity="0.35"/>

        <!-- Біла табличка з першою та останньою літерами слова -->
        <rect x="-72" y="25" width="144" height="72" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="3.5"/>

        <!-- Ліва літера -->
        <text x="-47" y="75" text-anchor="middle" font-size="44" font-weight="900" fill="#1e293b">${lock.left}</text>

        <!-- Права літера -->
        <text x="47" y="75" text-anchor="middle" font-size="44" font-weight="900" fill="#1e293b">${lock.right}</text>

        <!-- Центральна замкова щілина (поки замок закритий) -->
        <g id="keyhole-${idx}">
          <circle cx="0" cy="61" r="18" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5"/>

    // Клік по замку (якщо дитина спочатку клікнула ключ, а потім замок)
    g.addEventListener('pointerdown', (e) => {

/* ============================================================================
   ПЕРЕТЯГУВАННЯ (DRAG & DROP) ТА КЛІК ПО КЛЮЧАХ
   ============================================================================ */
function getSVGPoint(clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX;
  pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function setupKeyInteraction(keyEl, keyIdx) {
  let dragging = false;
  let startPt = null;
  let origPos = KEY_POS[keyIdx];
  let movedEnough = false;

  keyEl.addEventListener('pointerdown', (e) => {
    if (isAnimatingLock || keyEl.dataset.used === 'true') return;
    e.stopPropagation();
    sfx.playPickup();

    dragging = true;
    movedEnough = false;
    startPt = getSVGPoint(e.clientX, e.clientY);

    // Піднімаємо активний ключ поверх інших
    keysLayer.appendChild(keyEl);
    keyEl.setPointerCapture(e.pointerId);
  });

  keyEl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const curPt = getSVGPoint(e.clientX, e.clientY);
    const dx = curPt.x - startPt.x;
    const dy = curPt.y - startPt.y;
    if (Math.hypot(dx, dy) > 8) movedEnough = true;

    const nx = origPos.x + dx;
    const ny = origPos.y + dy;
    keyEl.setAttribute('transform', `translate(${nx}, ${ny}) scale(1.08)`);
  });

  keyEl.addEventListener('pointerup', (e) => {
    if (!dragging) return;
    dragging = false;
    keyEl.releasePointerCapture(e.pointerId);

    const curPt = getSVGPoint(e.clientX, e.clientY);
    const dropX = origPos.x + (curPt.x - startPt.x);
    const dropY = origPos.y + (curPt.y - startPt.y);

    // Якщо це був просто клік — виділяємо ключ (щоб можна було клікнути на замок)
    if (!movedEnough) {
      selectKey(keyIdx);
      keyEl.setAttribute('transform', `translate(${origPos.x}, ${origPos.y - 12}) scale(1.08)`);
      return;
    }

    // Перевіряємо, чи піднесли ключ близько до якогось із 4 замків
    let hitLockIdx = -1;
    let minDist = 115;
    LOCK_POS.forEach((lpos, lIdx) => {
      const lockEl = document.getElementById(`lock-${lIdx}`);
      if (lockEl && lockEl.dataset.unlocked === 'false') {
        const dist = Math.hypot(dropX - lpos.x, dropY - (lpos.y + 55));
        if (dist < minDist) {
          minDist = dist;
          hitLockIdx = lIdx;
        }
      }
    });

    if (hitLockIdx !== -1) {
      attemptUnlock(keyIdx, hitLockIdx);
    } else {
      returnKeyHome(keyIdx);
    }
  });
}

function selectKey(keyIdx) {
  document.querySelectorAll('.key-group').forEach((el, i) => {
    el.classList.remove('selected');
    if (el.dataset.used === 'false' && i !== keyIdx) {
      el.setAttribute('transform', `translate(${KEY_POS[i].x}, ${KEY_POS[i].y})`);
    }
  });
  selectedKeyIndex = keyIdx;
  const kEl = document.getElementById(`key-${keyIdx}`);
  if (kEl) kEl.classList.add('selected');
}

function returnKeyHome(keyIdx) {
  const kEl = document.getElementById(`key-${keyIdx}`);
  if (!kEl) return;
  kEl.classList.remove('selected');
  kEl.style.transition = 'transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';
  kEl.setAttribute('transform', `translate(${KEY_POS[keyIdx].x}, ${KEY_POS[keyIdx].y})`);
  setTimeout(() => { kEl.style.transition = ''; }, 360);
}

/* ============================================================================
   РЕАЛІСТИЧНА АНІМАЦІЯ ВІДМИКАННЯ ЗАМКА КЛЮЧЕМ
   ============================================================================ */
function attemptUnlock(keyIdx, lockIdx) {
  isAnimatingLock = true;
  selectedKeyIndex = null;

  const slideData = GAME_DATA[currentLang][currentSlide];
  const keyObj = slideData.keys[keyIdx];
  const lockObj = slideData.locks[lockIdx];

  const keyEl = document.getElementById(`key-${keyIdx}`);
  const keyInner = document.getElementById(`key-inner-${keyIdx}`);
  const lockEl = document.getElementById(`lock-${lockIdx}`);
  const lPos = LOCK_POS[lockIdx];

  keyEl.classList.remove('selected');

  // КРОК 1: Ключ підлітає точно до замкової щілини замка і стає вертикально/під кутом
  keyEl.style.transition = 'transform 0.32s ease-out';
  keyEl.setAttribute('transform', `translate(${lPos.x + 25}, ${lPos.y + 62}) rotate(-90) scale(0.92)`);

  if (keyObj.syl === lockObj.need) {
    // === ПРАВИЛЬНИЙ КЛЮЧ! ===
    sfx.playUnlockSequence();
    renderCharacter('happy');
    keyEl.dataset.used = 'true';
    lockEl.dataset.unlocked = 'true';

    // КРОК 2: Ключ вставляється глибше і ПРОВЕРТАЄТЬСЯ у щілині!
    setTimeout(() => {
      keyInner.style.transition = 'transform 0.35s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
      keyInner.style.transformOrigin = '-65px 15px';
      keyInner.style.transform = 'scaleY(0.55) rotate(25deg)';
    }, 300);

    // КРОК 3: Замкова щілина ховається, склад стає між літерами, а дужка замка ВІДСКАКУЄ!
    setTimeout(() => {
      const kh = document.getElementById(`keyhole-${lockIdx}`);
      const ins = document.getElementById(`inserted-syl-${lockIdx}`);
      const shackle = document.getElementById(`shackle-${lockIdx}`);
      const clasp = document.getElementById(`clasp-${lockIdx}`);

      if (kh) kh.setAttribute('opacity', '0');
      if (ins) ins.setAttribute('opacity', '1');

      // Дужка замка підлітає вгору та відвертається вбік
      if (shackle) {
        shackle.style.transform = 'translateY(-22px) rotate(32deg)';
      }
      // Золота скоба на скрині звільняється
      if (clasp) {
        clasp.style.transition = 'transform 0.4s';
        clasp.setAttribute('transform', `translate(${lPos.x}, 202)`);
      }

      // Ключ плавно розчиняється після виконання своєї роботи
      keyEl.style.transition = 'opacity 0.35s, transform 0.35s';
      keyEl.style.opacity = '0';

      // Іскри радості навколо відкритого замка
      spawnSparkles(lPos.x, lPos.y + 50, 16);
    }, 620);

    // КРОК 4: Відімкнений замок злегка погойдується і стає зеленувато-золотим
    setTimeout(() => {
      lockEl.style.transition = 'transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)';
      lockEl.setAttribute('transform', `translate(${lPos.x}, ${lPos.y + 18}) rotate(-4)`);
      unlockedCount++;
      isAnimatingLock = false;

      // Якщо всі 4 замки відкрито — відчиняємо скриню і даруємо скарб!
      if (unlockedCount >= 4) {
        setTimeout(openTreasureAndReward, 450);
      } else {
        setTimeout(() => renderCharacter('idle'), 900);
      }
    }, 1000);

  } else {
    // === НЕПРАВИЛЬНИЙ КЛЮЧ! ===
    sfx.playError();
    renderCharacter('oops');

    // Ключ намагається повернутися, але заклинює і тремтить разом із замком
    setTimeout(() => {
      lockEl.style.transition = 'transform 0.08s';
      lockEl.setAttribute('transform', `translate(${lPos.x - 10}, ${lPos.y}) rotate(-5)`);
      setTimeout(() => lockEl.setAttribute('transform', `translate(${lPos.x + 10}, ${lPos.y}) rotate(5)`), 80);
      setTimeout(() => lockEl.setAttribute('transform', `translate(${lPos.x}, ${lPos.y})`), 160);
    }, 280);

    // Повертаємо ключ на його гвоздик
    setTimeout(() => {
      returnKeyHome(keyIdx);
      isAnimatingLock = false;
      setTimeout(() => renderCharacter('idle'), 700);
    }, 580);
  }
}

/* ============================================================================
   ВІДКРИТТЯ СКРИНІ ТА ОТРИМАННЯ ІНТЕРАКТИВНОГО СКАРБУ-ПОДАРУНКА
   ============================================================================ */
function openTreasureAndReward() {
  sfx.playChestOpen();
  renderCharacter('party');

  // Знімаємо відімкнені замки вниз, щоб звільнити кришку скрині
  LOCK_POS.forEach((pos, idx) => {
    const lockEl = document.getElementById(`lock-${idx}`);
    if (lockEl) {
      lockEl.style.transition = 'transform 0.6s ease-in, opacity 0.5s';
      lockEl.setAttribute('transform', `translate(${pos.x}, ${pos.y + 95}) scale(0.88)`);
    }
  });

  // Відкриваємо кришку скрині
  const slideData = GAME_DATA[currentLang][currentSlide];
  renderChest(slideData.theme, true);

  // Додаємо трофей у верхню поличку
  earnedTrophies[currentSlide] = true;
  updateTrophyShelf();
  updateNavDots();

  // Вилітає великий інтерактивний подарунок із кришки скрині!
  prizeLayer.innerHTML = `
    <g id="reward-item" class="prize-pop" transform="translate(665, 195) scale(0.1)"
       style="transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);">
      <!-- Сяйво позаду подарунка -->
      <circle cx="0" cy="0" r="95" fill="url(#treasure-glow)"/>
      ${getPrizeSVG(currentSlide)}
    </g>
  `;

  const rewardEl = document.getElementById('reward-item');
  setTimeout(() => {
    rewardEl.setAttribute('transform', 'translate(665, 130) scale(1.15)');
    spawnSparkles(665, 140, 38);
  }, 60);

  // Дитина може клікати на свій скарб, і він підстрибує та розсипає зірки!
  rewardEl.addEventListener('pointerdown', () => {
    sfx.playSparkle();
    rewardEl.setAttribute('transform', 'translate(665, 105) scale(1.32) rotate(8)');
    spawnSparkles(665, 120, 24);
    setTimeout(() => {
      rewardEl.setAttribute('transform', 'translate(665, 130) scale(1.15) rotate(0)');
    }, 320);
  });
}

// Унікальні деталізовані SVG-подарунки для кожного з 3 слайдів
function getPrizeSVG(slideIdx) {
  if (slideIdx === 0) {
    // 1. Золота корона капітана з рубінами та діамантами
    return `
      <g filter="url(#drop-sh)">
        <path d="M -65 35 L -78 -28 L -35 5 L 0 -48 L 35 5 L 78 -28 L 65 35 Z"
              fill="url(#gold-grad)" stroke="#92400e" stroke-width="4" stroke-linejoin="round"/>
        <rect x="-65" y="28" width="130" height="20" rx="8" fill="#f59e0b" stroke="#92400e" stroke-width="3.5"/>
        <!-- Самоцвіти на короні -->
        <polygon points="0,-18 14,0 0,18 -14,0" fill="#ef4444" stroke="#fff" stroke-width="2"/>
        <circle cx="-42" cy="14" r="9" fill="#06b6d4" stroke="#fff" stroke-width="2"/>
        <circle cx="42" cy="14" r="9" fill="#06b6d4" stroke="#fff" stroke-width="2"/>
        <circle cx="-78" cy="-32" r="7" fill="#fef08a"/>
        <circle cx="0" cy="-52" r="9" fill="#fef08a"/>
        <circle cx="78" cy="-32" r="7" fill="#fef08a"/>
      </g>
    `;
  } else if (slideIdx === 1) {
    // 2. Сяючий магічний кришталевий медальйон-зірка
    return `
      <g filter="url(#drop-sh)">
        <polygon points="0,-65 20,-22 66,-15 32,18 40,64 0,42 -40,64 -32,18 -66,-15 -20,-22"
                 fill="url(#gold-grad)" stroke="#b45309" stroke-width="4"/>
        <polygon points="0,-42 28,0 0,42 -28,0" fill="#38bdf8" stroke="#e0f2fe" stroke-width="3"/>
        <polygon points="0,-24 15,0 0,24 -15,0" fill="#bae6fd"/>
        <circle cx="-28" cy="-12" r="6" fill="#f43f5e"/>
        <circle cx="28" cy="-12" r="6" fill="#f43f5e"/>
      </g>
    `;
  } else {
    // 3. Кумедний золотий Кубок Чемпіона з маленьким рудим лисеням!
    return `
      <g filter="url(#drop-sh)">
        <!-- Золотий кубок -->
        <path d="M -48 -10 Q -68 -10 -68 15 Q -68 38 -32 38" fill="none" stroke="url(#gold-grad)" stroke-width="8"/>
        <path d="M 48 -10 Q 68 -10 68 15 Q 68 38 32 38" fill="none" stroke="url(#gold-grad)" stroke-width="8"/>
        <path d="M -46 -18 L 46 -18 L 34 42 Q 0 60 -34 42 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="3.5"/>
        <rect x="-14" y="45" width="28" height="18" fill="#d97706"/>
        <rect x="-32" y="60" width="64" height="14" rx="6" fill="url(#gold-grad)" stroke="#92400e" stroke-width="3"/>
        <!-- Миле лисенятко визирає з кубка -->
        <path d="M -28 -25 L -34 -55 L -8 -36 Z" fill="#ea580c" stroke="#9a3412" stroke-width="2.5"/>
        <path d="M 28 -25 L 34 -55 L 8 -36 Z" fill="#ea580c" stroke="#9a3412" stroke-width="2.5"/>
        <ellipse cx="0" cy="-24" rx="30" ry="22" fill="#f97316" stroke="#9a3412" stroke-width="2.5"/>
        <path d="M -28 -20 Q -10 -5 0 -10 Q 10 -5 28 -20 Q 18 -2 0 -2 Q -18 -2 -28 -20 Z" fill="#fff7ed"/>
        <circle cx="-11" cy="-24" r="4" fill="#1e293b"/>
        <circle cx="11" cy="-24" r="4" fill="#1e293b"/>
        <circle cx="0" cy="-14" r="4.5" fill="#1e293b"/>
      </g>
    `;
  }
}

/* ============================================================================
   ЧАСТИНКИ КОНФЕТІ ТА ЗІРОЧОК
   ============================================================================ */
function spawnSparkles(cx, cy, count = 20) {
  const colors = ['#fde047', '#38bdf8', '#fb7185', '#4ade80', '#f59e0b', '#ffffff'];
  for (let i = 0; i < count; i++) {
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const r = 5 + Math.random() * 6;
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', cy);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', colors[i % colors.length]);
    fxLayer.appendChild(circle);

    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    const dist = 60 + Math.random() * 130;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist - 25;

    circle.animate([
      { transform: 'translate(0px, 0px) scale(1)', opacity: 1 },
      { transform: `translate(${tx}px, ${ty}px) scale(0.1)`, opacity: 0 }
    ], {
      duration: 650 + Math.random() * 350,
      easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
    }).onfinish = () => circle.remove();
  }
}

/* ============================================================================
   ОНОВЛЕННЯ ПОЛИЦІ НАГОРОД ТА НАВІГАЦІЇ МІЖ 3 СЛАЙДАМИ
   ============================================================================ */
function updateTrophyShelf() {
  for (let i = 0; i < 3; i++) {
    const slot = document.getElementById(`trophy-${i}`);
    if (earnedTrophies[i]) {
      slot.classList.add('earned');
      slot.innerHTML = `<svg viewBox="-85 -75 170 150" width="42" height="42">${getPrizeSVG(i)}</svg>`;
    } else {
      slot.classList.remove('earned');
      slot.innerHTML = '';
    }
  }
}

function updateNavDots() {
  document.querySelectorAll('.dot').forEach((d, idx) => {
    d.classList.toggle('active', idx === currentSlide);
    d.classList.toggle('done', earnedTrophies[idx]);
  });
}

function loadSlide(slideIndex) {
  currentSlide = (slideIndex + 3) % 3;
  unlockedCount = 0;
  selectedKeyIndex = null;
  isAnimatingLock = false;
  prizeLayer.innerHTML = '';
  fxLayer.innerHTML = '';

  const slideData = GAME_DATA[currentLang][currentSlide];
  renderBackground(slideData.theme);
  renderCharacter('idle');
  renderChest(slideData.theme, false);
  renderLocks(slideData.locks);
  renderKeysRack();
  renderKeys(slideData.keys);
  updateNavDots();
}

// Живий погляд Єнота: зіниці стежать за курсором / пальцем дитини
window.addEventListener('pointermove', (e) => {
  const pt = getSVGPoint(e.clientX, e.clientY);
  const dx = Math.max(-3.5, Math.min(3.5, (pt.x - 115) / 140));
  const dy = Math.max(-2.5, Math.min(2.5, (pt.y - 475) / 140));
  document.querySelectorAll('.pupil').forEach((p, idx) => {
    const baseX = idx === 0 ? -17 : 21;
    p.setAttribute('cx', baseX + dx);
    p.setAttribute('cy', -8 + dy);
  });
});

// Кнопки перемикання слайдів (Далі / Назад / Оновити / Мова)
document.getElementById('prev-btn').addEventListener('click', () => {
  sfx.playPickup();
  loadSlide(currentSlide - 1);
});

document.getElementById('next-btn').addEventListener('click', () => {
  sfx.playPickup();
  loadSlide(currentSlide + 1);
});

document.getElementById('reset-btn').addEventListener('click', () => {
  sfx.playPickup();
  loadSlide(currentSlide);
});

document.querySelectorAll('.dot').forEach(dot => {
  dot.addEventListener('click', () => {
    sfx.playPickup();
    loadSlide(parseInt(dot.dataset.idx, 10));
  });
});

document.getElementById('lang-btn').addEventListener('click', (e) => {
  sfx.playPickup();
  currentLang = currentLang === 'uk' ? 'ru' : 'uk';
  e.target.textContent = currentLang === 'uk' ? 'УКР' : 'РУС';
  loadSlide(currentSlide);
});

// Запуск першого слайда
loadSlide(0);
</script>
