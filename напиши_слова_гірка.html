<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Гірка Першого Письма</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&display=swap');

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Rubik', sans-serif;
    background: linear-gradient(180deg, #38bdf8 0%, #86efac 65%, #15803d 100%);
  }

  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: hidden;
  }

  #scene-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    pointer-events: none;
  }

  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 25;
    pointer-events: none;
  }

  #top-controls {
    position: relative;
    z-index: 30;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2vh 2.2vw;
    pointer-events: none;
  }

  .ctrl-group {
    display: flex;
    gap: 1.2vw;
    pointer-events: auto;
  }

  .wood-btn {
    position: relative;
    cursor: pointer;
    border: none;
    outline: none;
    border-radius: 22px;
    padding: 0.9vh 1.6vw;
    min-height: 54px;
    min-width: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rubik', sans-serif;
    font-weight: 900;
    font-size: clamp(1.1rem, 2.1vw, 1.7rem);
    color: #fff8dc;
    text-shadow: 0 2px 4px rgba(60, 20, 0, 0.75);
    background:
      radial-gradient(circle at 22% 20%, rgba(255, 255, 255, 0.35) 0%, transparent 45%),
      repeating-linear-gradient(12deg, rgba(120, 53, 15, 0.18) 0px, rgba(120, 53, 15, 0.18) 6px, transparent 6px, transparent 14px),
      linear-gradient(180deg, #f59e0b 0%, #d97706 55%, #92400e 100%);
    box-shadow:
      0 6px 0 #5b2106,
      0 10px 18px rgba(0, 0, 0, 0.35),
      inset 0 3px 2px rgba(255, 237, 213, 0.65),
      inset 0 -4px 6px rgba(69, 26, 3, 0.6);
    border: 3px solid #78350f;
    transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, filter 0.14s ease;
  }

  .wood-btn:hover {
    filter: brightness(1.08);
    transform: translateY(-2px) scale(1.03);
  }

  .wood-btn:active {
    transform: translateY(4px) scale(0.97);
    box-shadow:
      0 2px 0 #5b2106,
      0 4px 8px rgba(0, 0, 0, 0.3),
      inset 0 2px 2px rgba(255, 237, 213, 0.5);
  }

  .wood-btn.emerald-theme {
    background:
      radial-gradient(circle at 22% 20%, rgba(255, 255, 255, 0.35) 0%, transparent 45%),
      repeating-linear-gradient(-15deg, rgba(6, 78, 59, 0.16) 0px, rgba(6, 78, 59, 0.16) 7px, transparent 7px, transparent 15px),
      linear-gradient(180deg, #34d399 0%, #10b981 52%, #047857 100%);
    box-shadow:
      0 6px 0 #064e3b,
      0 10px 18px rgba(0, 0, 0, 0.35),
      inset 0 3px 2px rgba(209, 250, 229, 0.7),
      inset 0 -4px 6px rgba(6, 78, 59, 0.6);
    border-color: #065f46;
  }

  .wood-btn.berry-theme {
    background:
      radial-gradient(circle at 22% 20%, rgba(255, 255, 255, 0.38) 0%, transparent 45%),
      repeating-linear-gradient(20deg, rgba(131, 24, 67, 0.16) 0px, rgba(131, 24, 67, 0.16) 7px, transparent 7px, transparent 14px),
      linear-gradient(180deg, #fb7185 0%, #e11d48 55%, #9f1239 100%);
    box-shadow:
      0 6px 0 #500724,
      0 10px 18px rgba(0, 0, 0, 0.35),
      inset 0 3px 2px rgba(255, 228, 230, 0.75),
      inset 0 -4px 6px rgba(80, 7, 36, 0.6);
    border-color: #881337;
  }

  #word-board-container {
    position: absolute;
    bottom: 3%;
    right: 3%;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: auto;
  }

  #word-plaque {
    position: relative;
    display: flex;
    gap: clamp(8px, 1.1vw, 18px);
    padding: clamp(12px, 1.8vh, 22px) clamp(18px, 2.4vw, 34px);
    border-radius: 30px;
    background:
      radial-gradient(ellipse at top, rgba(254, 243, 199, 0.25), transparent 70%),
      repeating-linear-gradient(8deg, rgba(69, 26, 3, 0.16) 0px, rgba(69, 26, 3, 0.16) 4px, rgba(120, 53, 15, 0.06) 4px, rgba(120, 53, 15, 0.06) 11px),
      linear-gradient(180deg, #b45309 0%, #92400e 50%, #78350f 100%);
    border: 4px solid #451a03;
    box-shadow:
      0 10px 0 #3b1502,
      0 18px 30px rgba(0, 0, 0, 0.42),
      inset 0 4px 4px rgba(253, 230, 138, 0.45),
      inset 0 -6px 10px rgba(35, 12, 1, 0.7);
  }

  #word-plaque::before,
  #word-plaque::after {
    content: '';
    position: absolute;
    top: -14px;
    width: 16px;
    height: 22px;
    border-radius: 8px;
    background: repeating-linear-gradient(45deg, #d97706, #d97706 4px, #92400e 4px, #92400e 8px);
    border: 2px solid #451a03;
    box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }
  #word-plaque::before { left: 28px; }
  #word-plaque::after { right: 28px; }

  .letter-slot {
    width: clamp(50px, 5.4vw, 84px);
    height: clamp(58px, 6.6vw, 96px);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.9rem, 3.6vw, 3.4rem);
    font-weight: 900;
    color: #fef3c7;
    text-shadow: 0 3px 0 #78350f, 0 5px 10px rgba(0,0,0,0.45);
    position: relative;
    background:
      radial-gradient(circle at 30% 25%, rgba(255, 251, 235, 0.22), transparent 55%),
      repeating-linear-gradient(-6deg, rgba(69, 26, 3, 0.22) 0px, rgba(69, 26, 3, 0.22) 3px, transparent 3px, transparent 9px),
      linear-gradient(180deg, #78350f 0%, #451a03 100%);
    border: 3px solid #d97706;
    box-shadow:
      inset 0 6px 10px rgba(0, 0, 0, 0.65),
      inset 0 -3px 4px rgba(251, 191, 36, 0.25),
      0 3px 0 rgba(253, 224, 71, 0.28);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .letter-slot.active-target {
    background:
      radial-gradient(circle at 50% 30%, rgba(254, 240, 138, 0.45), transparent 65%),
      linear-gradient(180deg, #d97706 0%, #92400e 100%);
    border-color: #fde047;
    box-shadow:
      0 0 18px rgba(250, 204, 21, 0.75),
      inset 0 4px 8px rgba(69, 26, 3, 0.5),
      0 4px 0 #78350f;
    animation: pulseSlot 1.3s infinite ease-in-out;
  }

  .letter-slot.active-target::after {
    content: '';
    position: absolute;
    bottom: 10px;
    width: 55%;
    height: 6px;
    border-radius: 4px;
    background: #fef08a;
    box-shadow: 0 0 8px #fde047;
    animation: blinkBar 1s infinite ease-in-out;
  }

  .letter-slot.filled {
    background:
      radial-gradient(circle at 25% 20%, rgba(255, 255, 255, 0.45), transparent 45%),
      linear-gradient(180deg, #fbbf24 0%, #d97706 55%, #b45309 100%);
    border-color: #fef08a;
    color: #fffbeb;
    text-shadow: 0 3px 0 #92400e, 0 5px 8px rgba(0, 0, 0, 0.4);
    box-shadow:
      0 5px 0 #78350f,
      0 8px 15px rgba(0,0,0,0.35),
      inset 0 3px 3px rgba(255, 255, 255, 0.6);
    transform: translateY(-3px) scale(1.04);
  }

  .letter-slot.prefilled {
    background:
      radial-gradient(circle at 25% 20%, rgba(255, 255, 255, 0.4), transparent 45%),
      linear-gradient(180deg, #fbbf24 0%, #d97706 60%, #b45309 100%);
    border-color: #fde68a;
    color: #fffbeb;
    text-shadow: 0 3px 0 #92400e, 0 5px 8px rgba(0, 0, 0, 0.35);
    box-shadow:
      0 4px 0 #78350f,
      inset 0 3px 3px rgba(255, 255, 255, 0.5);
    opacity: 0.92;
  }

  .letter-slot.error-shake {
    animation: shakeError 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    border-color: #fb7185 !important;
    background: linear-gradient(180deg, #e11d48 0%, #881337 100%) !important;
  }

  @keyframes pulseSlot {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  @keyframes blinkBar {
    0%, 100% { opacity: 0.95; transform: scaleX(1); }
    50% { opacity: 0.35; transform: scaleX(0.75); }
  }

  @keyframes shakeError {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-9px) rotate(-5deg); }
    40% { transform: translateX(9px) rotate(5deg); }
    60% { transform: translateX(-7px) rotate(-3deg); }
    80% { transform: translateX(7px) rotate(3deg); }
  }

  /* === COMPACT DRAGGABLE KEYBOARD PANEL (shrink-to-fit) === */
  #keyboard-dock {
    position: fixed;
    z-index: 40;
    top: 92px;
    left: 50%;
    transform: translateX(-50%);
    width: auto;
    max-width: calc(100vw - 12px);
    margin: 0;
    padding: 6px 10px;
    border-radius: 18px;
    background:
      radial-gradient(circle at 50% 0%, rgba(254, 243, 199, 0.25), transparent 70%),
      repeating-linear-gradient(90deg, rgba(6, 78, 59, 0.14) 0px, rgba(6, 78, 59, 0.14) 12px, transparent 12px, transparent 26px),
      linear-gradient(180deg, #15803d 0%, #166534 55%, #14532d 100%);
    border: 2.5px solid #052e16;
    box-shadow:
      0 4px 0 #052e16,
      0 8px 16px rgba(0, 0, 0, 0.4),
      inset 0 2px 3px rgba(187, 247, 208, 0.4);
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    touch-action: none;
    cursor: grab;
    will-change: left, top;
  }

  #keyboard-dock.dragging {
    cursor: grabbing;
    filter: brightness(1.06);
    box-shadow:
      0 4px 0 #052e16,
      0 14px 26px rgba(0, 0, 0, 0.5),
      inset 0 2px 3px rgba(187, 247, 208, 0.45);
  }

  .kb-row {
    display: flex;
    justify-content: center;
    gap: clamp(3px, 0.5vw, 6px);
    flex-wrap: nowrap;
  }

  .key-tile {
    flex: 0 0 auto;
    width: clamp(24px, 3.8vw, 46px);
    height: clamp(28px, 4.4vw, 50px);
    border-radius: 10px;
    border: 2px solid #78350f;
    cursor: pointer;
    font-family: 'Rubik', sans-serif;
    font-weight: 900;
    font-size: clamp(0.72rem, 1.4vw, 1.35rem);
    color: #fffbeb;
    text-shadow: 0 1px 1px rgba(69, 26, 3, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.1s ease, filter 0.12s ease, box-shadow 0.1s ease;
  }

  .key-tile.tone-0 {
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(180deg, #fbbf24 0%, #d97706 65%, #92400e 100%);
    box-shadow: 0 3px 0 #5b2106, inset 0 1px 1px rgba(254, 243, 199, 0.7);
    border-color: #78350f;
  }
  .key-tile.tone-1 {
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(180deg, #fb923c 0%, #ea580c 65%, #9a3412 100%);
    box-shadow: 0 3px 0 #5c1d08, inset 0 1px 1px rgba(255, 237, 213, 0.7);
    border-color: #7c2d12;
  }
  .key-tile.tone-2 {
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(180deg, #38bdf8 0%, #0284c7 65%, #075985 100%);
    box-shadow: 0 3px 0 #0c4a6e, inset 0 1px 1px rgba(224, 242, 254, 0.7);
    border-color: #0369a1;
  }
  .key-tile.tone-3 {
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(180deg, #a855f7 0%, #7e22ce 65%, #581c87 100%);
    box-shadow: 0 3px 0 #3b0764, inset 0 1px 1px rgba(243, 232, 255, 0.7);
    border-color: #6b21a8;
  }

  .key-tile:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
  }

  .key-tile:active, .key-tile.pressed {
    transform: translateY(2px) scale(0.95);
    box-shadow: 0 1px 0 rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.3);
  }

  .key-tile.wrong-flash {
    background: linear-gradient(180deg, #f43f5e 0%, #be123c 100%) !important;
    animation: shakeError 0.35s ease;
  }

  .key-tile.correct-flash {
    background: linear-gradient(180deg, #4ade80 0%, #15803d 100%) !important;
    transform: scale(1.12);
  }

  .cloud-drift-1 { animation: cloudMove1 48s linear infinite; }
  .cloud-drift-2 { animation: cloudMove2 64s linear infinite; }
  .cloud-drift-3 { animation: cloudMove3 55s linear infinite; }

  @keyframes cloudMove1 {
    0% { transform: translateX(-180px); }
    50% { transform: translateX(160px); }
    100% { transform: translateX(-180px); }
  }
  @keyframes cloudMove2 {
    0% { transform: translateX(140px); }
    50% { transform: translateX(-160px); }
    100% { transform: translateX(140px); }
  }
  @keyframes cloudMove3 {
    0% { transform: translateX(-90px); }
    50% { transform: translateX(120px); }
    100% { transform: translateX(-90px); }
  }

  .tree-sway-1 {
    transform-origin: 180px 580px;
    animation: swayTree 6s ease-in-out infinite;
  }
  .tree-sway-2 {
    transform-origin: 1450px 560px;
    animation: swayTree 7.5s ease-in-out infinite reverse;
  }
  .sun-rays-spin {
    transform-origin: 1420px 115px;
    animation: spinRays 50s linear infinite;
  }

  @keyframes swayTree {
    0%, 100% { transform: rotate(-1.4deg); }
    50% { transform: rotate(1.6deg); }
  }
  @keyframes spinRays {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  #target-object-group {
    cursor: pointer;
    transition: filter 0.2s ease;
  }
  #target-object-group:hover {
    filter: drop-shadow(0 0 14px rgba(254, 240, 138, 0.85)) brightness(1.06);
  }
  #animal-actor-group {
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="top-controls">
    <div class="ctrl-group">
      <button id="lang-btn" class="wood-btn" aria-label="Language">УКР</button>
      <button id="mode-btn" class="wood-btn emerald-theme" aria-label="Mode">
        <svg id="mode-icon-svg" width="68" height="32" viewBox="0 0 68 32"></svg>
      </button>
    </div>
    <div class="ctrl-group">
      <button id="next-btn" class="wood-btn berry-theme" aria-label="Next">
        <svg width="38" height="32" viewBox="0 0 38 32" fill="none">
          <path d="M5 16H30M30 16L19 5M30 16L19 27" stroke="#FFFBEB" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="keyboard-dock"></div>

  <div id="word-board-container">
    <div id="word-plaque"></div>
  </div>

  <svg id="scene-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0ea5e9"/>
        <stop offset="48%" stop-color="#7dd3fc"/>
        <stop offset="100%" stop-color="#fef9c3"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fffbeb"/>
        <stop offset="35%" stop-color="#fde047"/>
        <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="farHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#86efac"/>
        <stop offset="100%" stop-color="#22c55e"/>
      </linearGradient>
      <linearGradient id="midHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#15803d"/>
      </linearGradient>
      <linearGradient id="fgMeadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#22c55e"/>
        <stop offset="55%" stop-color="#16a34a"/>
        <stop offset="100%" stop-color="#14532d"/>
      </linearGradient>
      <radialGradient id="sandpitGrad" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="65%" stop-color="#fbbf24"/>
        <stop offset="100%" stop-color="#d97706"/>
      </radialGradient>
      <linearGradient id="slideBedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fb7185"/>
        <stop offset="35%" stop-color="#f43f5e"/>
        <stop offset="75%" stop-color="#e11d48"/>
        <stop offset="100%" stop-color="#9f1239"/>
      </linearGradient>
      <linearGradient id="slideRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fde047"/>
        <stop offset="50%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>
      <linearGradient id="woodPostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#b45309"/>
        <stop offset="35%" stop-color="#d97706"/>
        <stop offset="70%" stop-color="#92400e"/>
        <stop offset="100%" stop-color="#78350f"/>
      </linearGradient>
      <linearGradient id="canopyRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2dd4bf"/>
        <stop offset="60%" stop-color="#0d9488"/>
        <stop offset="100%" stop-color="#115e59"/>
      </linearGradient>
      <linearGradient id="treeTrunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5c2808"/>
        <stop offset="40%" stop-color="#854d0e"/>
        <stop offset="100%" stop-color="#451a03"/>
      </linearGradient>
      <radialGradient id="foliageLight" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#bef264"/>
        <stop offset="55%" stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#15803d"/>
      </radialGradient>
      <radialGradient id="foliageDeep" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="65%" stop-color="#16a34a"/>
        <stop offset="100%" stop-color="#14532d"/>
      </radialGradient>
    </defs>

    <rect width="1600" height="900" fill="url(#skyGrad)"/>

    <g class="sun-rays-spin">
      <circle cx="1420" cy="115" r="165" fill="url(#sunGlow)"/>
      <g stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.45">
        <line x1="1420" y1="-70" x2="1420" y2="-30"/>
        <line x1="1420" y1="260" x2="1420" y2="300"/>
        <line x1="1235" y1="115" x2="1275" y2="115"/>
        <line x1="1565" y1="115" x2="1605" y2="115"/>
        <line x1="1290" y1="-15" x2="1320" y2="15"/>
        <line x1="1520" y1="215" x2="1550" y2="245"/>
        <line x1="1550" y1="-15" x2="1520" y2="15"/>
        <line x1="1320" y1="215" x2="1290" y2="245"/>
      </g>
    </g>
    <circle cx="1420" cy="115" r="58" fill="#fef9c3" stroke="#fde047" stroke-width="6"/>

    <g class="cloud-drift-1" opacity="0.92">
      <path d="M180 155 C155 155 135 138 140 115 C145 92 172 82 192 92 C205 64 248 58 272 82 C298 72 332 88 334 116 C354 122 362 155 330 155 Z" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
    </g>
    <g class="cloud-drift-2" opacity="0.88">
      <path d="M680 110 C650 110 635 90 644 70 C652 50 680 42 700 54 C718 25 768 22 790 50 C818 42 848 62 845 88 C865 95 865 110 835 110 Z" fill="#fefce8" stroke="#fde68a" stroke-width="3"/>
    </g>
    <g class="cloud-drift-3" opacity="0.85">
      <path d="M1040 190 C1018 190 1005 174 1012 156 C1018 140 1042 135 1058 144 C1072 122 1108 120 1126 142 C1148 136 1170 152 1166 172 C1180 178 1178 190 1156 190 Z" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
    </g>

    <path d="M-50 540 Q320 400 760 490 T1650 460 L1650 900 L-50 900 Z" fill="url(#farHillGrad)"/>
    <path d="M-50 585 Q480 470 980 555 T1650 520 L1650 900 L-50 900 Z" fill="url(#midHillGrad)"/>

    <g opacity="0.9">
      <rect x="420" y="485" width="780" height="12" rx="5" fill="#92400e" stroke="#451a03" stroke-width="2"/>
      <rect x="420" y="512" width="780" height="12" rx="5" fill="#92400e" stroke="#451a03" stroke-width="2"/>
      <g fill="#b45309" stroke="#451a03" stroke-width="2">

class SoundEngine {
  constructor() { this.ctx = null; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playHop(pitch = 320) {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(pitch, now);
    osc.frequency.exponentialRampToValueAtTime(pitch * 1.45, now + 0.11);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.14);
  }
  playSlideWhoosh() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(620, now);
    osc.frequency.exponentialRampToValueAtTime(240, now + 0.85);
    osc.frequency.exponentialRampToValueAtTime(340, now + 1.05);
    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.16, now + 0.2);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 1.12);
    const notes = [783.99, 659.25, 587.33, 523.25, 440.0, 523.25];
    notes.forEach((freq, idx) => {
      const t = now + idx * 0.14;
      const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.11, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + 0.15);
    });
  }
  playCorrectLetter(stepIndex = 0) {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
    const baseFreq = scale[stepIndex % scale.length];
    [1, 2].forEach((mult, idx) => {
      const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
      osc.type = idx === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(baseFreq * mult, now);
      gain.gain.setValueAtTime(idx === 0 ? 0.26 : 0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(now); osc.stop(now + 0.3);
    });
  }
  playWrongLetter() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(550, now);
    osc.frequency.setValueAtTime(190, now);
    osc.frequency.linearRampToValueAtTime(135, now + 0.12);
    osc.frequency.linearRampToValueAtTime(175, now + 0.24);
    osc.frequency.linearRampToValueAtTime(125, now + 0.36);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
    osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.4);
  }
  playCelebrationFanfare(variant = 0) {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const melodies = [
      [{ f: 523.25, t: 0.0, d: 0.16 }, { f: 659.25, t: 0.14, d: 0.16 }, { f: 783.99, t: 0.28, d: 0.16 }, { f: 1046.50, t: 0.42, d: 0.45 }],
      [{ f: 587.33, t: 0.0, d: 0.13 }, { f: 659.25, t: 0.11, d: 0.13 }, { f: 783.99, t: 0.22, d: 0.13 }, { f: 880.00, t: 0.33, d: 0.15 }, { f: 1174.66, t: 0.46, d: 0.45 }],
      [{ f: 440.00, t: 0.0, d: 0.14 }, { f: 554.37, t: 0.12, d: 0.14 }, { f: 659.25, t: 0.24, d: 0.14 }, { f: 880.00, t: 0.36, d: 0.14 }, { f: 659.25, t: 0.50, d: 0.14 }, { f: 880.00, t: 0.62, d: 0.42 }],
      [{ f: 523.25, t: 0.0, d: 0.2 }, { f: 587.33, t: 0.08, d: 0.2 }, { f: 659.25, t: 0.16, d: 0.2 }, { f: 783.99, t: 0.24, d: 0.2 }, { f: 880.00, t: 0.32, d: 0.2 }, { f: 1046.50, t: 0.40, d: 0.5 }],
      [{ f: 392.00, t: 0.0, d: 0.15 }, { f: 523.25, t: 0.15, d: 0.15 }, { f: 659.25, t: 0.30, d: 0.15 }, { f: 783.99, t: 0.45, d: 0.22 }, { f: 659.25, t: 0.65, d: 0.15 }, { f: 1046.50, t: 0.80, d: 0.45 }]
    ];
    const seq = melodies[variant % melodies.length];
    seq.forEach(note => {
      const osc = this.ctx.createOscillator(); const sub = this.ctx.createOscillator(); const gain = this.ctx.createGain();
      osc.type = 'triangle'; sub.type = 'sine';
      osc.frequency.setValueAtTime(note.f, now + note.t);
      sub.frequency.setValueAtTime(note.f * 1.5, now + note.t);
      gain.gain.setValueAtTime(0.24, now + note.t);
      gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
      osc.connect(gain); sub.connect(gain); gain.connect(this.ctx.destination);
      osc.start(now + note.t); sub.start(now + note.t);
      osc.stop(now + note.t + note.d + 0.02); sub.stop(now + note.t + note.d + 0.02);
    });
  }
  playClick() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(640, now);
    osc.frequency.exponentialRampToValueAtTime(920, now + 0.06);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.08);
  }
}

class CelebrationFX {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particles = [];
    this._dirty = false;
    this.resize();
    window.addEventListener('resize', () => this.resize());
    requestAnimationFrame(() => this.tick());
  }
  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
  }
  svgToScreen(svgX, svgY) {
    const rect = this.canvas.getBoundingClientRect();
    const scale = Math.max(rect.width / 1600, rect.height / 900);
    const offsetX = (rect.width - 1600 * scale) / 2;
    const offsetY = (rect.height - 900 * scale) / 2;
    return { x: svgX * scale + offsetX, y: svgY * scale + offsetY };
  }
  spawnSandPuff(svgX, svgY) {
    const pos = this.svgToScreen(svgX, svgY);
    const colors = ['#fef08a', '#fbbf24', '#f59e0b', '#fde68a'];
    for (let i = 0; i < 22; i++) {
      const angle = Math.PI + (Math.random() - 0.5) * Math.PI * 0.9;
      const speed = 2 + Math.random() * 6;
      this.particles.push({
        type: 'circle', x: pos.x + (Math.random() - 0.5) * 40, y: pos.y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
        r: 5 + Math.random() * 9, color: colors[i % colors.length], alpha: 0.95,
        gravity: 0.18, decay: 0.025
      });
    }
  }
  spawnSlotSparkles(domElem) {
    if (!domElem) return;
    const r = domElem.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const colors = ['#fde047', '#fbbf24', '#34d399', '#fb7185', '#38bdf8'];
    for (let i = 0; i < 26; i++) {
      const angle = (Math.PI * 2 * i) / 26 + Math.random() * 0.2;
      const speed = 3 + Math.random() * 6.5;
      this.particles.push({
        type: 'star', x: cx, y: cy,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        r: 7 + Math.random() * 7, rot: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.2, color: colors[i % colors.length],
        alpha: 1, gravity: 0.12, decay: 0.022
      });
    }
  }
  celebrate(variant = 0) {
    const palette = ['#fb7185', '#fbbf24', '#34d399', '#38bdf8', '#a855f7', '#fde047', '#f97316'];
    const center = this.svgToScreen(920, 600);
    if (variant === 0) {
      for (let i = 0; i < 110; i++) {
        this.particles.push({
          type: 'rect', x: Math.random() * this.canvas.width,
          y: -30 - Math.random() * this.canvas.height * 0.7,
          vx: (Math.random() - 0.5) * 2.4, vy: 2 + Math.random() * 3.6,
          w: 6 + Math.random() * 9, h: 8 + Math.random() * 12,
          rot: Math.random() * Math.PI, vRot: (Math.random() - 0.5) * 0.28,
          color: palette[i % palette.length], alpha: 1, gravity: 0.04, decay: 0.0035
        });
      }
    } else if (variant === 1) {
      for (let i = 0; i < 62; i++) {
        const a = (Math.PI * 2 * i) / 62 + Math.random() * 0.14;
        const sp = 4 + Math.random() * 9;
        this.particles.push({
          type: 'star', x: center.x, y: center.y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
          r: 8 + Math.random() * 10, rot: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.3, color: palette[i % palette.length],
          alpha: 1, gravity: 0.14, decay: 0.012
        });
      }
    } else if (variant === 2) {
      for (let i = 0; i < 26; i++) {
        this.particles.push({
          type: 'balloon',
          x: center.x + (Math.random() - 0.5) * this.canvas.width * 0.85,
          y: this.canvas.height + 60 + Math.random() * 220,
          vx: (Math.random() - 0.5) * 1.6, vy: -(2.4 + Math.random() * 2.6),
          r: 16 + Math.random() * 16, color: palette[i % palette.length],
          alpha: 1, gravity: -0.012, decay: 0.0035
        });
      }
    } else if (variant === 3) {
      [0, 280].forEach((delay, idx) => {
        setTimeout(() => {
          const cx = this.canvas.width * (0.22 + Math.random() * 0.56);
          const cy = this.canvas.height * (0.15 + Math.random() * 0.32);
          const base = palette[(idx + 2) % palette.length];
          for (let i = 0; i < 56; i++) {
            const a = (Math.PI * 2 * i) / 56;
            const sp = 2 + Math.random() * 7;
            this.particles.push({
              type: 'circle', x: cx, y: cy,
              vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
              r: 3 + Math.random() * 4,
              color: Math.random() < 0.5 ? base : palette[i % palette.length],
              alpha: 1, gravity: 0.09, decay: 0.016
            });
          }
        }, delay);
      });
    } else {
      for (let i = 0; i < 58; i++) {
        this.particles.push({
          type: i % 3 === 0 ? 'heart' : 'star',
          x: center.x + (Math.random() - 0.5) * this.canvas.width * 0.9,
          y: -30 - Math.random() * 300,
          vx: (Math.random() - 0.5) * 2, vy: 1.6 + Math.random() * 3,
          r: 8 + Math.random() * 10, rot: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.2, color: palette[i % palette.length],
          alpha: 1, gravity: 0.05, decay: 0.005
        });
      }
    }
  }
  drawStarShape(ctx, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r : r * 0.45;
      const a = (Math.PI / 5) * i - Math.PI / 2;
      const x = Math.cos(a) * rad;
      const y = Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  drawHeartShape(ctx, r) {
    ctx.beginPath();
    ctx.moveTo(0, r * 0.35);
    ctx.bezierCurveTo(r, -r * 0.6, r * 0.5, -r * 1.15, 0, -r * 0.35);
    ctx.bezierCurveTo(-r * 0.5, -r * 1.15, -r, -r * 0.6, 0, r * 0.35);
    ctx.closePath();
  }
  tick() {
    const ctx = this.ctx;
    if (this.particles.length === 0) {
      if (this._dirty) {
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this._dirty = false;
      }
      requestAnimationFrame(() => this.tick());
      return;
    }
    this._dirty = true;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.alpha -= p.decay;
      if (p.rot !== undefined) p.rot += p.vRot;
      if (p.alpha <= 0 || p.y > this.canvas.height + 140 || p.y < -300) {
        this.particles.splice(i, 1); continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      if (p.rot) ctx.rotate(p.rot);
      if (p.type === 'circle') { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill(); }
      else if (p.type === 'star') { this.drawStarShape(ctx, p.r); ctx.fill(); }
      else if (p.type === 'rect') { ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      else if (p.type === 'heart') { this.drawHeartShape(ctx, p.r); ctx.fill(); }
      else if (p.type === 'balloon') {
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 0.78, p.r, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(69,26,3,0.45)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(0, p.r); ctx.lineTo(0, p.r + 22); ctx.stroke();
      }
      ctx.restore();
    }
    requestAnimationFrame(() => this.tick());
  }
}

const fx = new CelebrationFX(document.getElementById('fx-canvas'));

const state = {
  lang: 'ukr',
  mode: 1,
  objectIndex: 0,
  letterIndex: 0,
  solved: false,
  busy: false
};

const langBtn = document.getElementById('lang-btn');
const modeBtn = document.getElementById('mode-btn');
const nextBtn = document.getElementById('next-btn');
const plaqueEl = document.getElementById('word-plaque');
const keyboardEl = document.getElementById('keyboard-dock');
const animalEl = document.getElementById('animal-actor-group');
const objectEl = document.getElementById('target-object-group');

const suppressClick = { value: false };

function currentWord() {
  return OBJECTS_DATA[state.objectIndex][state.lang];
}

function buildKeyboardLetters() {
  if (state.mode === 1) return KEYBOARDS[state.lang];

  const word = currentWord();
  const uniq = [...new Set(word.split(''))];
  const all = KEYBOARDS[state.lang].flat();
  const distractors = all.filter(l => !uniq.includes(l));

  for (let i = distractors.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [distractors[i], distractors[j]] = [distractors[j], distractors[i]];
  }

  const targetCount = Math.min(all.length, Math.max(8, uniq.length + 5));
  const extra = distractors.slice(0, Math.max(0, targetCount - uniq.length));
  let letters = [...uniq, ...extra];

  for (let i = letters.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }

  const rows = [];
  const perRow = letters.length <= 7 ? letters.length : Math.ceil(letters.length / 2);
  for (let i = 0; i < letters.length; i += perRow) {
    rows.push(letters.slice(i, i + perRow));
  }
  return rows;
}

function createTravelPath() {
  const ns = 'http://www.w3.org/2000/svg';
  let path = document.getElementById('animal-travel-path');
  if (path) return path;
  path = document.createElementNS(ns, 'path');
  path.setAttribute('id', 'animal-travel-path');
  path.setAttribute('d', 'M 320 290 C 445 290, 492 466, 625 558 C 695 606, 748 618, 808 618 C 850 618, 880 616, 905 610');
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', 'none');
  path.style.pointerEvents = 'none';
  document.getElementById('scene-svg').appendChild(path);
  return path;
}

function placeAnimalAtStart() {
  const path = createTravelPath();
  const p0 = path.getPointAtLength(0);
  animalEl.setAttribute('transform', `translate(${p0.x - 12}, ${p0.y - 48})`);
}

function animateAnimalDown() {
  const path = createTravelPath();
  const total = path.getTotalLength();
  const dur = 1900;
  const t0 = performance.now();
  sound.playSlideWhoosh();
  function step(now) {
    const t = Math.min(1, (now - t0) / dur);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const pt = path.getPointAtLength(total * e);
    animalEl.setAttribute('transform', `translate(${pt.x - 12}, ${pt.y - 48})`);
    if (t < 1) requestAnimationFrame(step);
    else fx.spawnSandPuff(905, 645);
  }
  requestAnimationFrame(step);
}

function animalCelebrate() {
  const base = animalEl.getAttribute('transform') || '';
  const start = performance.now();
  function step(now) {
    const t = (now - start) / 950;
    if (t >= 1) { animalEl.setAttribute('transform', base); return; }
    const s = 1 + Math.sin(t * Math.PI * 3) * 0.13 * (1 - t);
    animalEl.setAttribute('transform', `${base} scale(${s})`);
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderAnimal() {
  const type = ANIMALS_LIST[state.objectIndex % ANIMALS_LIST.length];
  animalEl.innerHTML = renderAnimalSVG(type);
}

function renderObject() {
  const obj = OBJECTS_DATA[state.objectIndex];
  objectEl.innerHTML = renderObjectSVG(obj.id);
}

function renderModeIcon() {
  const svg = document.getElementById('mode-icon-svg');
  const active = state.mode === 1 ? 1 : 3;
  let inner = '';
  for (let i = 0; i < 3; i++) {
    const isOn = i < active;
    const fill = isOn ? '#fde047' : '#065f46';
    const stroke = isOn ? '#fff7ed' : '#34d399';
    inner += `<rect x="${4 + i * 21}" y="6" width="18" height="20" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
  }
  svg.innerHTML = inner;
}

function renderKeyboard() {
  keyboardEl.innerHTML = '';
  const rows = buildKeyboardLetters();
  rows.forEach((row, rIdx) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    row.forEach((letter, cIdx) => {
      const btn = document.createElement('button');
      btn.className = `key-tile tone-${(rIdx + cIdx) % 4}`;
      btn.type = 'button';
      btn.textContent = letter;
      btn.addEventListener('click', () => {
        if (suppressClick.value) { suppressClick.value = false; return; }
        sound.init();
        handleLetter(letter, btn);
      });
      rowEl.appendChild(btn);
    });
    keyboardEl.appendChild(rowEl);
  });
}

function renderWord() {
  const word = currentWord();
  plaqueEl.innerHTML = '';
  for (let i = 0; i < word.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'letter-slot';
    slot.dataset.index = String(i);
    if (state.mode === 1 && i > 0) {
      slot.classList.add('prefilled');
      slot.textContent = word[i];
    }
    plaqueEl.appendChild(slot);
  }
  updateSlots();
}

function updateSlots() {
  const slots = plaqueEl.querySelectorAll('.letter-slot');
  slots.forEach((s, i) => {
    const isTarget = !state.solved
      && i === state.letterIndex
      && !s.classList.contains('prefilled');
    s.classList.toggle('active-target', isTarget);
  });
}

function handleLetter(letter, keyEl) {
  if (state.solved) return;
  const word = currentWord();
  if (state.letterIndex >= word.length) return;
  const expected = word[state.letterIndex];
  const slot = plaqueEl.querySelector(`.letter-slot[data-index="${state.letterIndex}"]`);
  if (!slot) return;
  if (letter === expected) {
    slot.textContent = letter;
    slot.classList.remove('active-target');
    slot.classList.remove('prefilled');
    slot.classList.add('filled');
    sound.playCorrectLetter(state.letterIndex);
    fx.spawnSlotSparkles(slot);
    if (keyEl) {
      keyEl.classList.add('correct-flash');
      setTimeout(() => keyEl.classList.remove('correct-flash'), 320);
    }
    state.letterIndex += 1;
    const isDone = state.mode === 1 ? state.letterIndex >= 1 : state.letterIndex >= word.length;
    if (isDone) completeWord();
    else updateSlots();
  } else {
    sound.playWrongLetter();
    slot.classList.add('error-shake');
    setTimeout(() => slot.classList.remove('error-shake'), 460);
    if (keyEl) {
      keyEl.classList.add('wrong-flash');
      setTimeout(() => keyEl.classList.remove('wrong-flash'), 380);
    }
  }
}

function completeWord() {
  state.solved = true;
  const word = currentWord();
  const slots = plaqueEl.querySelectorAll('.letter-slot');
  slots.forEach((s, i) => {
    s.classList.remove('active-target');
    if (!s.textContent) {
      s.textContent = word[i];
      s.classList.add('filled');
    }
  });
  animalCelebrate();
  fx.celebrate(Math.floor(Math.random() * 5));
  sound.playCelebrationFanfare(state.objectIndex % 5);
}

function startRound(withSlide) {
  state.letterIndex = 0;
  state.solved = false;
  renderWord();
  if (withSlide) {
    placeAnimalAtStart();
    setTimeout(animateAnimalDown, 120);
  }
}

/* DRAGGABLE KEYBOARD PANEL */
(function initKeyboardDrag() {
  let drag = null;
  keyboardEl.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = {
      id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false,
      origLeft: 0, origTop: 0
    };
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 9) return;
      drag.moved = true;
      const r = keyboardEl.getBoundingClientRect();
      drag.origLeft = r.left;
      drag.origTop = r.top;
      keyboardEl.style.transform = 'none';
      keyboardEl.style.left = r.left + 'px';
      keyboardEl.style.top = r.top + 'px';
      keyboardEl.classList.add('dragging');
      try { keyboardEl.setPointerCapture(e.pointerId); } catch (err) {}
    }
    const w = keyboardEl.offsetWidth;
    const h = keyboardEl.offsetHeight;
    let newLeft = drag.origLeft + dx;
    let newTop = drag.origTop + dy;
    newLeft = Math.min(Math.max(newLeft, 4), Math.max(4, window.innerWidth - w - 4));
    newTop = Math.min(Math.max(newTop, 4), Math.max(4, window.innerHeight - h - 4));
    keyboardEl.style.left = newLeft + 'px';
    keyboardEl.style.top = newTop + 'px';
  });
  function endDrag(e) {
    if (!drag) return;
    if (e && e.pointerId !== undefined && e.pointerId !== drag.id) return;
    const wasMoved = drag.moved;
    drag = null;
    keyboardEl.classList.remove('dragging');
    if (wasMoved) {
      suppressClick.value = true;
      setTimeout(() => { suppressClick.value = false; }, 350);
    }
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
})();

function positionKeyboardInitial() {
  const tc = document.getElementById('top-controls');
  const r = tc.getBoundingClientRect();
  const w = keyboardEl.offsetWidth;
  keyboardEl.style.transform = 'none';
  keyboardEl.style.left = Math.max(6, (window.innerWidth - w) / 2) + 'px';
  keyboardEl.style.top = Math.max(6, r.bottom + 6) + 'px';
}

window.addEventListener('resize', () => {
  const w = keyboardEl.offsetWidth;
  const h = keyboardEl.offsetHeight;
  const l = parseFloat(keyboardEl.style.left);
  const t = parseFloat(keyboardEl.style.top);
  if (!isNaN(l) && !isNaN(t)) {
    keyboardEl.style.left = Math.min(Math.max(l, 4), Math.max(4, window.innerWidth - w - 4)) + 'px';
    keyboardEl.style.top = Math.min(Math.max(t, 4), Math.max(4, window.innerHeight - h - 4)) + 'px';
  }
});

langBtn.addEventListener('click', () => {
  sound.playClick();
  state.lang = state.lang === 'ukr' ? 'rus' : 'ukr';
  langBtn.textContent = state.lang === 'ukr' ? 'УКР' : 'РУС';
  renderKeyboard();
  state.letterIndex = 0;
  state.solved = false;
  renderWord();
});

modeBtn.addEventListener('click', () => {
  sound.playClick();
  state.mode = state.mode === 1 ? 2 : 1;
  renderModeIcon();
  renderKeyboard();
  state.letterIndex = 0;
  state.solved = false;
  renderWord();
});

nextBtn.addEventListener('click', () => {
  sound.playClick();
  if (state.busy) return;
  state.busy = true;
  setTimeout(() => { state.busy = false; }, 400);
  state.objectIndex = (state.objectIndex + 1) % OBJECTS_DATA.length;
  renderObject();
  renderAnimal();
  renderKeyboard();
  startRound(true);
});

objectEl.addEventListener('click', () => {
  sound.playCorrectLetter(Math.floor(Math.random() * 6));
  fx.spawnSlotSparkles(objectEl);
});

animalEl.addEventListener('click', () => {
  sound.playHop(300 + Math.random() * 220);
});

function spawnButterflies() {
  const layer = document.getElementById('butterflies-layer');
  const colors = ['#fb7185', '#fbbf24', '#38bdf8', '#a855f7'];
  const paths = [
    'M 220 420 Q 420 320 640 420 T 1040 400 Q 1260 320 1390 440',
    'M 1340 500 Q 1120 380 900 480 T 500 460 Q 300 380 170 500',
    'M 420 520 Q 620 430 820 520 T 1220 500'
  ];
  let html = '';
  paths.forEach((p, i) => {
    const c1 = colors[i % colors.length];
    const c2 = colors[(i + 1) % colors.length];
    html += `
      <g opacity="0.95">
        <g>
          <ellipse cx="-5" cy="0" rx="6" ry="8" fill="${c1}">
            <animate attributeName="rx" values="6;1.6;6" dur="0.32s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="5" cy="0" rx="6" ry="8" fill="${c2}">
            <animate attributeName="rx" values="6;1.6;6" dur="0.32s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="0" cy="0" rx="1.6" ry="7" fill="#451a03"/>
        </g>
        <animateMotion dur="${17 + i * 5}s" repeatCount="indefinite" path="${p}" rotate="auto"/>
      </g>`;
  });
  layer.innerHTML = html;
}

function scheduleBlink() {
  setTimeout(() => {
    document.querySelectorAll('.anim-eyes-open').forEach(e => e.style.display = 'none');
    document.querySelectorAll('.anim-eyes-blink').forEach(e => e.style.display = '');
    setTimeout(() => {
      document.querySelectorAll('.anim-eyes-open').forEach(e => e.style.display = '');
      document.querySelectorAll('.anim-eyes-blink').forEach(e => e.style.display = 'none');
    }, 170);
    scheduleBlink();
  }, 2600 + Math.random() * 2800);
}

function init() {
  renderKeyboard();
  renderModeIcon();
  renderObject();
  renderAnimal();
  renderWord();
  spawnButterflies();
  createTravelPath();
  placeAnimalAtStart();
  scheduleBlink();
  positionKeyboardInitial();
  setTimeout(animateAnimalDown, 600);
  const warm = () => { sound.init(); window.removeEventListener('pointerdown', warm); };
  window.addEventListener('pointerdown', warm);
}

init();
</script>
