<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Жива Книжка: Мишка і Сир</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1e1610;
            font-family: 'Nunito', 'Comfortaa', sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <!-- Головне полотно живої книжки -->
    <canvas id="storybookCanvas"></canvas>

    <script>
        /**
         * ============================================================================
         * ЖИВА ІНТЕРАКТИВНА КНИЖКА: МИШКА І ВЕЛИЧЕЗНИЙ СИР (12 СТОРІНОК)
         * Вдвічі збільшений шрифт у верхній зоні пергаменту (Y: 16..236),
         * який ніколи не перекриває ілюстрації та інтерактивні об'єкти (Y: 265..890).
         * ============================================================================
         */

        const canvas = document.getElementById('storybookCanvas');
        const ctx = canvas.getContext('2d');

        // Віртуальна широкоекранна сцена 1600x900
        const STAGE_W = 1600;
        const STAGE_H = 900;
        // Межа верхньої зони сувою, щоб ілюстрації ніколи не перекривалися текстом
        const SAFE_STAGE_TOP = 255;

        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;

        // Поточна мова ('укр' або 'рус')
        let currentLang = 'укр';

        // Поточна сторінка (0..11 відповідає 1..12)
        let currentPage = 0;
        let loopIteration = 0;

        // Стан святкування та переходу сторінки
        let isCelebrating = false;
        let celebrationTimer = 0;
        let pageTurnProgress = 0;
        let isTurningPage = false;
        let nextTargetPage = 0;

        // 12 сюжетних сторінок двома мовами (великий зручний шрифт для 1 класу)
        const STORY_PAGES = [
            {
                укр: "Маленька мишка гуляє на сонячній галявині — потруси ягідний кущик, де щось смачно пахне!",
                рус: "Маленькая мышка гуляет на солнечной полянке — потряси ягодный кустик, где что-то вкусно пахнет!"
            },
            {
                укр: "Це величезний духмяний сир — допоможи мишці покотити його стежкою до самої нірки!",
                рус: "Это огромный душистый сыр — помоги мышке покатить его по тропинке к самой норке!"
            },
            {
                укр: "Мишка прикотила сир до дверей під старим дубом — спробуй проштовхнути сир у нірку!",
                рус: "Мышка прикатила сыр к дверям под старым дубом — попробуй протолкнуть сыр в норку!"
            },
            {
                укр: "Сир не влазить у вузькі двері — натисни тричі на мишку, щоб вона пострибала на сирі!",
                рус: "Сыр не влезает в узкие двери — нажми трижды на мышку, чтобы она попрыгала на сыре!"
            },
            {
                укр: "Поруч живе її друг кріт — постукай тричі по горбочку землі, щоб покликати крота на допомогу!",
                рус: "Рядом живёт её друг крот — постучи трижды по холмику земли, чтобы позвать крота на помощь!"
            },
            {
                укр: "Кріт приніс блискучу пилку — рухай пилкою туди-сюди, щоб розрізати сир на три шматочки!",
                рус: "Крот принёс блестящую пилу — двигай пилой туда-сюда, чтобы разрезать сыр на три кусочка!"
            },
            {
                укр: "Тепер шматочки сиру якраз підходять — перетягни всі три шматочки всередину нірки!",
                рус: "Теперь кусочки сыра как раз подходят — перетащи все три кусочка внутрь норки!"
            },
            {
                укр: "У підземній нірці темно — торкнися трьох жолудевих ліхтариків, щоб запалити тепле світло!",
                рус: "В подземной норке темно — коснись трёх желудёвых фонариков, чтобы зажечь тёплый свет!"
            },
            {
                укр: "Розклади апетитні шматочки сиру на три розписні тарілочки на дубовому столі!",
                рус: "Разложи аппетитные кусочки сыра на три расписные тарелочки на дубовом столе!"
            },
            {
                укр: "Візьми стиглі солодкі малинки з кошика і прикрась ними святкове частування на столі!",
                рус: "Возьми спелые сладкие малинки из корзинки и укрась ими праздничное угощение на столе!"
            },
            {
                укр: "Налий духмяний трав'яний чай із мідного чайника в обидві чашки для мишки та крота!",
                рус: "Налей душистый травяной чай из медного чайника в обе чашки для мышки и крота!"
            },
            {
                укр: "Торкнися друзів, щоб вони цокнулися чашками і весело поласували смачним сиром разом!",
                рус: "Коснись друзей, чтобы они чокнулись чашками и весело полакомились вкусным сыром вместе!"
            }
        ];

        // ============================================================================
        // СИНТЕЗАТОР ЗВУКІВ (Web Audio API — без зовнішніх файлів)
        // ============================================================================
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSqueak(pitchMultiplier = 1) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const base = 1150 * pitchMultiplier;
                osc.frequency.setValueAtTime(base, now);
                osc.frequency.exponentialRampToValueAtTime(base * 1.45, now + 0.09);
                osc.frequency.exponentialRampToValueAtTime(base * 0.9, now + 0.18);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.16, now + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playRustle() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.22;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1800 + Math.random() * 600, now);
                filter.Q.setValueAtTime(1.8, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.005, now + 0.22);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            // Пружний комічний "боінг", коли сир відскакує від вузької нірки
            playBoing(step = 1) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(170 + step * 35, now);
                osc.frequency.exponentialRampToValueAtTime(480 + step * 50, now + 0.14);
                osc.frequency.exponentialRampToValueAtTime(210, now + 0.34);

                gain.gain.setValueAtTime(0.24, now);
                gain.gain.exponentialRampToValueAtTime(0.004, now + 0.36);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.38);
            }

            playDig() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.16;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(480 + Math.random() * 220, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.28, now);
                gain.gain.exponentialRampToValueAtTime(0.008, now + 0.16);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            // Ритмічний звук дворучної пилки
            playSawStroke() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(240 + Math.random() * 90, now);
                osc.frequency.linearRampToValueAtTime(390, now + 0.09);
                gain.gain.setValueAtTime(0.07, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.11);
            }

            // Теплий дзвіночок при запалюванні жолудевого ліхтарика або цоканні чашок
            playChime(noteIndex = 0) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const freqs = [659.25, 783.99, 987.77, 1174.66];
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freqs[noteIndex % freqs.length], now);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.46);
            }

            playPour() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const freq = 520 + Math.random() * 380;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.35, now + 0.08);
                gain.gain.setValueAtTime(0.09, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.095);
            }

            playWoodClick() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(340, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.06);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.07);
            }

            playPageTurn() {
                this.init();
                if (!this.ctx) return;
                this.playRustle();
            }

            playCelebrationFanfare() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    const start = now + idx * 0.09;
                    osc.frequency.setValueAtTime(freq, start);

                    gain.gain.setValueAtTime(0.001, start);
                    gain.gain.linearRampToValueAtTime(0.16, start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.65);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(start);
                    osc.stop(start + 0.68);
                });
                setTimeout(() => this.playSqueak(1.12), 250);
                setTimeout(() => this.playSqueak(1.25), 550);
            }
        }

        const sound = new SoundEngine();

        // ============================================================================
        // ГЕНЕРАТОР ПРОЦЕДУРНИХ ВАРІАЦІЙ ТА ДЕКОРАЦІЙ НА КОЖНОМУ ЦИКЛІ
        // ============================================================================
        let worldPalette = {
            skyTop: '#8ecae6',
            skyMid: '#cdeac0',
            flowerColors: ['#ff758f', '#ffd166', '#a8dadc', '#cdb4db'],
            cheeseHoles: [],
            plateColor: '#e9edc9',
            plateTrim: '#d4a373',
            cupColor: '#9c6644'
        };

        function randomizeWorldVariations() {
            const skies = [
                { top: '#8ecae6', mid: '#cdeac0' },
                { top: '#ffb5a7', mid: '#fae1dd' },
                { top: '#90e0ef', mid: '#d8f3dc' }
            ];
            const palettes = [
                ['#ff758f', '#ffd166', '#72efdd', '#cdb4db'],
                ['#ff9f1c', '#ffbf69', '#e0aaff', '#80ed99'],
                ['#f72585', '#fee440', '#00bbf9', '#ff99c8']
            ];
            const plates = [
                { bg: '#fefae0', trim: '#d4a373', cup: '#9c6644' },
                { bg: '#e0fbfc', trim: '#ee6c4d', cup: '#3d5a80' },
                { bg: '#fcefb4', trim: '#bc4749', cup: '#6a994e' }
            ];

            const skyPick = skies[loopIteration % skies.length];
            worldPalette.skyTop = skyPick.top;
            worldPalette.skyMid = skyPick.mid;
            worldPalette.flowerColors = palettes[loopIteration % palettes.length];
            const platePick = plates[loopIteration % plates.length];
            worldPalette.plateColor = platePick.bg;
            worldPalette.plateTrim = platePick.trim;
            worldPalette.cupColor = platePick.cup;

            worldPalette.cheeseHoles = [
                { rx: -0.35, ry: -0.22, r: 0.14 },
                { rx: 0.22, ry: -0.28, r: 0.11 },
                { rx: -0.05, ry: 0.06, r: 0.16 },
                { rx: 0.36, ry: 0.18, r: 0.12 },
                { rx: -0.38, ry: 0.24, r: 0.10 },
                { rx: 0.08, ry: -0.36, r: 0.08 }
            ].map(h => ({
                rx: h.rx + (Math.random() - 0.5) * 0.05,
                ry: h.ry + (Math.random() - 0.5) * 0.05,
                r: h.r * (0.9 + Math.random() * 0.25)
            }));
        }

        // Навколишні живі частинки в ігровій зоні (нижче пергаменту)
        const ambientSeeds = Array.from({ length: 20 }, () => ({
            x: Math.random() * STAGE_W,
            y: SAFE_STAGE_TOP + 30 + Math.random() * (STAGE_H - SAFE_STAGE_TOP - 80),
            vx: 0.25 + Math.random() * 0.45,
            vy: -0.15 + Math.random() * 0.3,
            size: 3 + Math.random() * 5,
            phase: Math.random() * Math.PI * 2
        }));

        let fxParticles = [];

        function spawnParticles(x, y, count = 18, type = 'sparkle', customColor = null) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 6.5;
                fxParticles.push({
                    x,
                    y: Math.max(SAFE_STAGE_TOP + 15, y),
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - (type === 'dirt' ? 3.5 : 1.8),
                    size: type === 'dirt' ? 5 + Math.random() * 7 : 6 + Math.random() * 9,
                    life: 1.0,
                    decay: 0.014 + Math.random() * 0.015,
                    type,
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.15,
                    color: customColor || (type === 'dirt' ? '#6b4423' : ['#ffd166', '#ffe66d', '#ff9f1c', '#a8f0c6'][i % 4])
                });
            }
        }

        // ============================================================================
        // СТАН КОЖНОЇ СТОРІНКИ (ВСІ КООРДИНАТИ НИЖЧЕ SAFE_STAGE_TOP = 255)
        // ============================================================================
        const charState = {
            mouseX: 420,
            mouseY: 660,
            mouseFacing: 1,
            earSpringL: 0,
            earVelL: 0,
            earSpringR: 0,
            earVelR: 0,
            blinkTimer: 0,
            isBlinking: false,
            moleX: 1080,
            moleY: 675,
            molePop: 0,
            moleArmAngle: 0,
            chewPhase: 0
        };

        let sceneState = {};

        function initSceneState(pageIndex) {
            isCelebrating = false;
            celebrationTimer = 0;
            charState.moleArmAngle = 0;

            if (pageIndex === 0) {
                // Стор. 1: Мишка біля ягідного кущика, в якому схований величезний сир
                charState.mouseX = 430;
                charState.mouseY = 665;
                charState.mouseFacing = 1;
                sceneState = {
                    bushX: 930,
                    bushY: 625,
                    shakes: 0,
                    bushShakeAnim: 0,
                    revealed: false,
                    bushOpenSpread: 0
                };
            } else if (pageIndex === 1) {
                // Стор. 2: Котимо сир стежкою до нірки
                sceneState = {
                    cheeseX: 460,
                    cheeseY: 640,
                    cheeseRot: 0,
                    targetX: 1030,
                    draggingCheese: false
                };
                charState.mouseX = 310;
                charState.mouseY = 670;
                charState.mouseFacing = 1;
            } else if (pageIndex === 2) {
                // Стор. 3: Спробувати проштовхнути сир у вузьку нірку -> застрягає і пружинить
                charState.mouseX = 630;
                charState.mouseY = 670;
                charState.mouseFacing = 1;
                sceneState = {
                    cheeseX: 830,
                    cheeseY: 635,
                    draggingCheese: false,
                    boingCount: 0,
                    squishX: 1,
                    squishVel: 0,
                    doorX: 1065
                };
            } else if (pageIndex === 3) {
                // Стор. 4: Мишка стрибає зверху на сирі біля входу в нірку (3 стрибки)
                sceneState = {
                    cheeseX: 1010,
                    cheeseY: 645,
                    jumps: 0,
                    bounceAnim: 0,
                    squishX: 1,
                    squishVel: 0
                };
                charState.mouseX = 1005;
                charState.mouseY = 475;
                charState.mouseFacing = 1;
            } else if (pageIndex === 4) {
                // Стор. 5: Постукати тричі по горбочку землі, щоб виліз кріт
                charState.mouseX = 470;
                charState.mouseY = 670;
                charState.mouseFacing = 1;
                charState.molePop = 0;
                sceneState = {
                    moundX: 825,
                    moundY: 695,
                    taps: 0,
                    moundShake: 0,
                    moleAppeared: false
                };
            } else if (pageIndex === 5) {
                // Стор. 6: Мишка і кріт дворучною пилкою розрізають сир на 3 шматочки
                charState.mouseX = 480;
                charState.mouseY = 670;
                charState.mouseFacing = 1;
                charState.moleX = 1090;
                charState.moleY = 675;
                charState.molePop = 1;
                sceneState = {
                    cheeseX: 785,
                    cheeseY: 640,
                    sawX: 785,
                    sawY: 545,
                    draggingSaw: false,
                    sawProgress: 0,
                    sliced: false,
                    wedgeSpread: 0
                };
            } else if (pageIndex === 6) {
                // Стор. 7: Перетягнути всі 3 шматочки сиру всередину нірки
                charState.mouseX = 330;
                charState.mouseY = 670;
                charState.mouseFacing = 1;
                charState.moleX = 1320;
                charState.moleY = 675;
                charState.molePop = 1;
                sceneState = {
                    wedges: [
                        { id: 0, x: 520, y: 665, inside: false, scale: 1, part: 1 },
                        { id: 1, x: 695, y: 665, inside: false, scale: 1, part: 2 },
                        { id: 2, x: 870, y: 665, inside: false, scale: 1, part: 3 }
                    ],
                    activeWedge: null,
                    burrowDoorX: 1105,
                    burrowDoorY: 620
                };
            } else if (pageIndex === 7) {
                // Стор. 8: У нірці темно — запалити 3 жолудеві ліхтарики під склепінням (нижче сувою!)
                charState.mouseX = 460;
                charState.mouseY = 675;
                charState.mouseFacing = 1;
                charState.moleX = 1140;
                charState.moleY = 680;
                charState.molePop = 1;

        function triggerTaskSuccess() {
            if (isCelebrating || isTurningPage) return;
            isCelebrating = true;
            celebrationTimer = 0;
            sound.playCelebrationFanfare();

            spawnParticles(charState.mouseX, Math.max(SAFE_STAGE_TOP + 40, charState.mouseY - 70), 26, 'star');
            spawnParticles(STAGE_W * 0.5, 480, 32, 'sparkle');

        // ============================================================================
        // АДАПТАЦІЯ ПІД БУДЬ-ЯКИЙ ШИРОКИЙ ЕКРАН
        // ============================================================================
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const scaleX = window.innerWidth / STAGE_W;
            const scaleY = window.innerHeight / STAGE_H;
            scale = Math.min(scaleX, scaleY);
            offsetX = (window.innerWidth - STAGE_W * scale) * 0.5;
            offsetY = (window.innerHeight - STAGE_H * scale) * 0.5;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function screenToStage(clientX, clientY) {
            return {
                x: (clientX - offsetX) / scale,
                y: (clientY - offsetY) / scale
            };
        }

        // ============================================================================
        // МАЛЮВАННЯ РЕАЛІСТИЧНИХ ПЕРСОНАЖІВ (МИШКА ТА КРІТ)
        // ============================================================================
        function drawFurRing(cx, cy, rx, ry, count, length, baseColor, tipColor, timeOffset = 0) {
            ctx.save();
            ctx.lineCap = 'round';
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const x1 = cx + Math.cos(angle) * (rx - 2);
                const y1 = cy + Math.sin(angle) * (ry - 2);
                const wave = Math.sin(angle * 5 + timeOffset) * 0.12;
                const bristleAngle = angle + wave;
                const x2 = x1 + Math.cos(bristleAngle) * length;
                const y2 = y1 + Math.sin(bristleAngle) * length;

                ctx.strokeStyle = i % 2 === 0 ? baseColor : tipColor;
                ctx.lineWidth = 2.1;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawMouse(x, y, facing = 1, pose = 'standing', time = 0) {
            ctx.save();
            const jumpOffset = isCelebrating ? -Math.abs(Math.sin(celebrationTimer * 10)) * 45 : 0;
            const breath = Math.sin(time * 3.2) * 3.2;

            ctx.translate(x, y + jumpOffset);
            ctx.scale(facing, 1);

            // М'яка тінь на землі
            ctx.save();
            ctx.translate(0, -jumpOffset);
            const shadowScale = 1 - Math.abs(jumpOffset) / 160;
            const shGrad = ctx.createRadialGradient(0, 56, 5, 0, 56, 90 * shadowScale);
            shGrad.addColorStop(0, 'rgba(20, 12, 5, 0.45)');
            shGrad.addColorStop(1, 'rgba(20, 12, 5, 0)');
            ctx.fillStyle = shGrad;
            ctx.beginPath();
            ctx.ellipse(0, 56, 90 * shadowScale, 22 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Довгий гнучкий хвостик
            ctx.save();
            const tailWag = Math.sin(time * 4.5 + (isCelebrating ? time * 8 : 0)) * 16;
            ctx.strokeStyle = '#c99383';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-54, 26);
            ctx.bezierCurveTo(-118, 34, -148, -8 + tailWag, -175, -30 + tailWag * 1.2);
            ctx.stroke();
            ctx.strokeStyle = '#e5b5a6';
            ctx.lineWidth = 3.5;
            ctx.stroke();
            ctx.restore();

            // Задні лапки
            ctx.fillStyle = '#e5989b';
            ctx.beginPath();
            ctx.ellipse(-26, 50, 22, 10, -0.1, 0, Math.PI * 2);
            ctx.ellipse(20, 52, 22, 10, 0.1, 0, Math.PI * 2);
            ctx.fill();

            // Пухнасте грушоподібне тільце
            const furGrad = ctx.createRadialGradient(8, -10, 12, -5, 5, 74);
            furGrad.addColorStop(0, '#b59e8a');
            furGrad.addColorStop(0.6, '#8a705a');
            furGrad.addColorStop(1, '#5e4b3b');
            ctx.fillStyle = furGrad;
            ctx.beginPath();
            ctx.ellipse(0, 6, 52 + breath * 0.6, 60 - breath * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Світлий животик
            const bellyGrad = ctx.createRadialGradient(16, 12, 5, 14, 12, 42);
            bellyGrad.addColorStop(0, '#f5ebe0');
            bellyGrad.addColorStop(1, 'rgba(227, 213, 202, 0)');
            ctx.fillStyle = bellyGrad;
            ctx.beginPath();
            ctx.ellipse(13, 12, 32, 43, 0.08, 0, Math.PI * 2);
            ctx.fill();

            drawFurRing(0, 6, 50 + breath * 0.5, 58, 60, 7.5, '#7f6753', '#b8a28e', time);

            // Голова
            ctx.save();
            const headBob = Math.sin(time * 4) * 2.2 + (isCelebrating ? Math.sin(time * 18) * 4.5 : 0);
            ctx.translate(12, -54 + headBob);

            // Дальнє вушко
            ctx.save();
            ctx.translate(15, -26);
            ctx.rotate(0.25 + charState.earSpringR);
            ctx.fillStyle = '#6e5644';
            ctx.beginPath();
            ctx.ellipse(0, -13, 22, 28, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#d97b82';
            ctx.beginPath();
            ctx.ellipse(2, -13, 15, 20, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Мордочка (з анімацією жування на 12 сторінці)
            const chew = (currentPage === 11 && isCelebrating) ? Math.sin(time * 22) * 3.5 : 0;
            ctx.fillStyle = furGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, 42, 36, -0.08, 0, Math.PI * 2);
            ctx.ellipse(26, 6 + chew * 0.4, 28, 20 + chew * 0.3, 0.12, 0, Math.PI * 2);
            ctx.fill();
            drawFurRing(-2, 0, 40, 34, 40, 6.5, '#7f6753', '#b8a28e', time);

            // Ближнє вушко на пружинці
            ctx.save();
            ctx.translate(-16, -24);
            ctx.rotate(-0.2 + charState.earSpringL);
            ctx.fillStyle = '#7f6753';
            ctx.beginPath();
            ctx.ellipse(0, -14, 24, 30, -0.2, 0, Math.PI * 2);
            ctx.fill();
            const innerEarG = ctx.createRadialGradient(2, -12, 2, 0, -14, 20);
            innerEarG.addColorStop(0, '#ffb3b8');
            innerEarG.addColorStop(1, '#d97b82');
            ctx.fillStyle = innerEarG;
            ctx.beginPath();
            ctx.ellipse(3, -14, 16, 22, -0.2, 0, Math.PI * 2);

            // Очі
            if (charState.isBlinking) {
                ctx.strokeStyle = '#261810';

            } else {
                ctx.fillStyle = '#1c120c';
                ctx.beginPath();
                ctx.ellipse(17, -5, 9, 10.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(20, -8.5, 3.4, 0, Math.PI * 2);
                ctx.arc(14, -2, 1.7, 0, Math.PI * 2);
                ctx.fill();
            }

            // Рум'яна щічка та посмішка
            ctx.fillStyle = 'rgba(244, 132, 130, 0.4)';
            ctx.beginPath();
            ctx.ellipse(20, 11 + chew * 0.3, 11, 6.5, 0, 0, Math.PI * 2);

            ctx.strokeStyle = '#3d281a';
            ctx.lineWidth = 2.6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(30, 10 + chew * 0.4, 8, 0.15, Math.PI * 0.85);

            // Рухливий рожевий носик
            const noseWiggle = Math.sin(time * 9) * 2;
            ctx.fillStyle = '#f28482';
            ctx.beginPath();
            ctx.ellipse(53 + noseWiggle, 4, 9, 7, -0.1, 0, Math.PI * 2);

            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.arc(55 + noseWiggle, 1.5, 2.6, 0, Math.PI * 2);
            ctx.fill();

            // Вусики
            ctx.strokeStyle = 'rgba(255, 248, 240, 0.85)';
            ctx.lineWidth = 1.5;
            const whiskerWave = Math.sin(time * 7) * 2.8;
            [-1, 0, 1].forEach(idx => {
                ctx.beginPath();
                ctx.moveTo(43, 8 + idx * 3);
                ctx.quadraticCurveTo(20, 12 + idx * 7, -2, 14 + idx * 12 + whiskerWave);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(49, 8 + idx * 3);
                ctx.quadraticCurveTo(68, 10 + idx * 6, 84, 14 + idx * 10 - whiskerWave);
                ctx.stroke();
            });

            ctx.restore(); // Кінець голови

            // Передні лапки
            ctx.save();
            const pawWave = isCelebrating ? Math.sin(time * 20) * 16 : Math.sin(time * 4) * 3.5;
            ctx.fillStyle = '#8a705a';
            if (pose === 'pushing') {
                ctx.beginPath();
                ctx.ellipse(44, -10, 21, 9.5, -0.2, 0, Math.PI * 2);
                ctx.ellipse(48, 8, 21, 9.5, 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#e5989b';
                ctx.beginPath();
                ctx.arc(63, -13, 8.5, 0, Math.PI * 2);
                ctx.arc(67, 9, 8.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.ellipse(26, -7 - pawWave * 0.5, 17, 8.5, 0.35, 0, Math.PI * 2);
                ctx.ellipse(32, 7 + pawWave * 0.5, 17, 8.5, -0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#e5989b';
                ctx.beginPath();
                ctx.arc(40, -4 - pawWave * 0.5, 7.5, 0, Math.PI * 2);
                ctx.arc(46, 4 + pawWave * 0.5, 7.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            ctx.restore();
        }

        function drawMole(x, y, popAmount = 1, facing = -1, time = 0) {

            ctx.scale(facing, 1);

            const moleGrad = ctx.createRadialGradient(-10, -25, 12, 0, 0, 80);
            moleGrad.addColorStop(0, '#4a4e58');
            moleGrad.addColorStop(0.55, '#2b2d34');
            moleGrad.addColorStop(1, '#16181d');
            ctx.fillStyle = moleGrad;
            ctx.beginPath();
            ctx.ellipse(0, 5, 60, 68, 0, 0, Math.PI * 2);
            ctx.fill();

            drawFurRing(0, 5, 58, 64, 68, 6.5, '#2b2d34', '#5c6270', time);

            ctx.fillStyle = 'rgba(130, 125, 135, 0.28)';
            ctx.beginPath();
            ctx.ellipse(14, 18, 32, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            const snoutWiggle = Math.sin(time * 8) * 2.8;
            ctx.fillStyle = '#2b2d34';
            ctx.beginPath();
            ctx.ellipse(36, -26 + snoutWiggle * 0.4, 30, 19, 0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f4978e';
            ctx.beginPath();
            ctx.ellipse(64, -23 + snoutWiggle, 10.5, 8.5, 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath();
            ctx.arc(66, -26 + snoutWiggle, 2.8, 0, Math.PI * 2);
            ctx.fill();

            // Круглі золоті окуляри крота
            ctx.save();
            ctx.translate(20, -38);
            ctx.fillStyle = 'rgba(190, 235, 255, 0.35)';
            ctx.strokeStyle = '#e09f3e';
            ctx.lineWidth = 3.6;
            ctx.beginPath();
            ctx.arc(0, 0, 13, 0, Math.PI * 2);
            ctx.arc(19, -2, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-13, 0);
            ctx.lineTo(-32, 4);
            ctx.stroke();
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(2, 0, 4.2, 0, Math.PI * 2);
            ctx.arc(20, -2, 3.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';

            ctx.beginPath();
