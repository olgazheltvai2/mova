        // ============================================================================
        // МАЛЮВАННЯ ВЕЛИЧЕЗНОГО СИРУ ТА ЙОГО ТРЬОХ СЕКТОРІВ
        // ============================================================================
        function drawCheeseWheel(x, y, radius = 88, rotation = 0, sx = 1, sy = 1, wedgeMode = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(sx, sy);
            ctx.rotate(rotation);

            // Якщо wedgeMode = 1, 2 або 3 — вирізаємо один із 3 акуратних трикутних секторів
            if (wedgeMode >= 1 && wedgeMode <= 3) {
                const startA = (wedgeMode - 1) * ((Math.PI * 2) / 3) - Math.PI / 2;
                const endA = startA + (Math.PI * 2) / 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius + 16, startA, endA);
                ctx.closePath();
                ctx.clip();
            }

            // Тінь під сиром
            ctx.fillStyle = 'rgba(25, 15, 5, 0.32)';
            ctx.beginPath();
            ctx.ellipse(0, radius * 0.85, radius * 0.92, radius * 0.24, 0, 0, Math.PI * 2);
            ctx.fill();

            // Золотиста скоринка
            const rindGrad = ctx.createRadialGradient(-radius * 0.25, -radius * 0.25, radius * 0.1, 0, 0, radius);
            rindGrad.addColorStop(0, '#ffe169');
            rindGrad.addColorStop(0.75, '#f5b700');
            rindGrad.addColorStop(1, '#c98a00');
            ctx.fillStyle = rindGrad;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            // М'якоть сиру
            const innerGrad = ctx.createRadialGradient(-radius * 0.2, -radius * 0.2, 5, 0, 0, radius * 0.88);
            innerGrad.addColorStop(0, '#fff394');
            innerGrad.addColorStop(1, '#f7c815');
            ctx.fillStyle = innerGrad;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.88, 0, Math.PI * 2);
            ctx.fill();

            // Дірочки-кратери в сирі
            worldPalette.cheeseHoles.forEach(h => {
                const hx = h.rx * radius;
                const hy = h.ry * radius;
                const hr = h.r * radius;

                const holeGrad = ctx.createRadialGradient(hx + hr * 0.2, hy + hr * 0.2, hr * 0.1, hx, hy, hr);
                holeGrad.addColorStop(0, '#e09f1f');
                holeGrad.addColorStop(1, '#b87908');
                ctx.fillStyle = holeGrad;
                ctx.beginPath();
                ctx.arc(hx, hy, hr, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 248, 190, 0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            if (wedgeMode >= 1 && wedgeMode <= 3) {
                const startA = (wedgeMode - 1) * ((Math.PI * 2) / 3) - Math.PI / 2;
                const endA = startA + (Math.PI * 2) / 3;
                ctx.strokeStyle = '#e09f1f';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startA, endA);
                ctx.closePath();
                ctx.stroke();
            }

            ctx.restore();
        }

        // ============================================================================
        // ЖИВИЙ СЮЖЕТНИЙ ФОН (ГАЛЯВИНА СТОР. 1-7 ТА ПІДЗЕМНА НІРКА СТОР. 8-12)
        // ============================================================================
        function drawLivingEnvironment(pageIndex, time) {
            const isInsideBurrow = (pageIndex >= 7);

            const viewLeft = -offsetX / scale - 50;
            const viewTop = -offsetY / scale - 50;
            const viewW = window.innerWidth / scale + 100;
            const viewH = window.innerHeight / scale + 100;

            if (isInsideBurrow) {
                // ЗАТИШНА ПІДЗЕМНА НІРКА ПІД КОРІННЯМ ДУБА (Стор. 8..12)
                let litCount = 3;
                if (pageIndex === 7 && sceneState.lanterns) {
                    litCount = sceneState.lanterns.filter(l => l.lit).length;
                }
                const brightness = 0.25 + (litCount / 3) * 0.75;

                const wallGrad = ctx.createRadialGradient(800, 560, 60, 800, 560, 950);
                wallGrad.addColorStop(0, `rgba(${Math.round(115 * brightness)}, ${Math.round(72 * brightness)}, ${Math.round(38 * brightness)}, 1)`);
                wallGrad.addColorStop(0.6, `rgba(${Math.round(68 * brightness)}, ${Math.round(40 * brightness)}, ${Math.round(20 * brightness)}, 1)`);
                wallGrad.addColorStop(1, '#140b04');
                ctx.fillStyle = wallGrad;
                ctx.fillRect(viewLeft, viewTop, viewW, viewH);

                // Могутнє коріння дуба під стелею нірки (нижче сувою пергаменту!)
                ctx.strokeStyle = '#2d190a';
                ctx.lineWidth = 32;
                ctx.lineCap = 'round';
                [
                    [-80, 270, 420, 310, 820, 265],
                    [1680, 275, 1180, 315, 780, 265],
                    [140, 840, 30, 560, 220, 290],
                    [1460, 840, 1570, 560, 1380, 290]
                ].forEach(r => {
                    ctx.beginPath();
                    ctx.moveTo(r[0], r[1]);
                    ctx.quadraticCurveTo(r[2], r[3], r[4], r[5]);
                    ctx.stroke();
                });

                // Дерев'яна підлога та теплий килимок у нижній частині сцени
                const floorGrad = ctx.createLinearGradient(0, 660, 0, 940);
                floorGrad.addColorStop(0, '#4f3119');
                floorGrad.addColorStop(1, '#261508');
                ctx.fillStyle = floorGrad;
                ctx.beginPath();
                ctx.ellipse(800, 815, 1150, 210, 0, 0, Math.PI * 2);
                ctx.fill();

                const rugGrad = ctx.createRadialGradient(800, 740, 20, 800, 740, 410);
                rugGrad.addColorStop(0, '#8c583a');
                rugGrad.addColorStop(0.7, '#6f8f4e');
                rugGrad.addColorStop(1, '#4c6633');
                ctx.fillStyle = rugGrad;
                ctx.beginPath();
                ctx.ellipse(800, 740, 420, 72, 0, 0, Math.PI * 2);
                ctx.fill();

                // Два затишні різьблені крісла з дубової кори
                [460, 1140].forEach((chairX, idx) => {
                    ctx.fillStyle = '#5c3418';
                    ctx.beginPath();
                    ctx.roundRect(chairX - 65, 520, 130, 145, 38);
                    ctx.fill();
                    ctx.fillStyle = idx === 0 ? '#bc4749' : '#588157';
                    ctx.beginPath();
                    ctx.roundRect(chairX - 50, 535, 100, 115, 28);
                    ctx.fill();
                });

                // Три жолудеві ліхтарики під стелею нірки (на сторінці 8 дитина їх вмикає, на стор. 9-12 вони світяться)
                const lanternsList = (pageIndex === 7 && sceneState.lanterns) ? sceneState.lanterns : [
                    { x: 480, y: 335, lit: true, swing: 0 },
                    { x: 800, y: 320, lit: true, swing: 1.2 },
                    { x: 1120, y: 335, lit: true, swing: 2.4 }
                ];

                lanternsList.forEach((lan, idx) => {
                    ctx.save();
                    const sw = Math.sin(time * 2.2 + lan.swing) * 0.07;
                    ctx.translate(lan.x, lan.y);
                    ctx.rotate(sw);

                    if (lan.lit) {
                        const glowG = ctx.createRadialGradient(0, 35, 6, 0, 35, 310);
                        glowG.addColorStop(0, 'rgba(255, 225, 110, 0.5)');
                        glowG.addColorStop(0.5, 'rgba(255, 180, 60, 0.16)');
                        glowG.addColorStop(1, 'rgba(255, 160, 40, 0)');
                        ctx.fillStyle = glowG;
                        ctx.beginPath();
                        ctx.arc(0, 35, 310, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Ніжний золотий контур-підказка для вимкненого ліхтарика
                        ctx.strokeStyle = `rgba(255, 230, 130, ${0.4 + Math.sin(time * 5 + idx) * 0.25})`;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(0, 32, 42, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Гілочка-підвіс
                    ctx.strokeStyle = '#3b2210';
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(0, -55);
                    ctx.lineTo(0, 12);
                    ctx.stroke();

                    // Шапочка жолудя
                    ctx.fillStyle = '#523018';
                    ctx.beginPath();
                    ctx.ellipse(0, 16, 32, 15, 0, Math.PI, Math.PI * 2);
                    ctx.fill();

                    // Сяючий або темний жолудь
                    ctx.fillStyle = lan.lit ? '#ffe57f' : '#6c584c';
                    ctx.beginPath();
                    ctx.arc(0, 36, 23, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

            } else {
                // СОНЯЧНА ЛІСОВА ГАЛЯВИНА (Стор. 1..7)
                const skyGrad = ctx.createLinearGradient(0, viewTop, 0, 660);
                skyGrad.addColorStop(0, worldPalette.skyTop);
                skyGrad.addColorStop(0.6, worldPalette.skyMid);
                skyGrad.addColorStop(1, '#e9f5db');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(viewLeft, viewTop, viewW, viewH);

                // Сонячні промені
                ctx.save();
                for (let i = 0; i < 4; i++) {
                    const rayX = 250 + i * 330 + Math.sin(time * 0.7 + i) * 30;
                    const rayGrad = ctx.createLinearGradient(rayX, 240, rayX + 180, 740);
                    rayGrad.addColorStop(0, 'rgba(255, 245, 180, 0.24)');
                    rayGrad.addColorStop(1, 'rgba(255, 245, 180, 0)');
                    ctx.fillStyle = rayGrad;
                    ctx.beginPath();
                    ctx.moveTo(rayX - 50, 240);
                    ctx.lineTo(rayX + 85, 240);
                    ctx.lineTo(rayX + 260, 760);
                    ctx.lineTo(rayX + 35, 760);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();

                // Далекі пагорби (опущені нижче пергаменту)
                ctx.fillStyle = '#8ab17d';
                ctx.beginPath();
                ctx.moveTo(viewLeft, 595);
                ctx.quadraticCurveTo(400, 470, 900, 555);
                ctx.quadraticCurveTo(1350, 610, viewLeft + viewW, 505);
                ctx.lineTo(viewLeft + viewW, 780);
                ctx.lineTo(viewLeft, 780);
                ctx.closePath();
                ctx.fill();

                // Зелена галявина
                const meadowGrad = ctx.createLinearGradient(0, 555, 0, viewTop + viewH);
                meadowGrad.addColorStop(0, '#74a853');
                meadowGrad.addColorStop(0.5, '#558b3e');
                meadowGrad.addColorStop(1, '#345e24');
                ctx.fillStyle = meadowGrad;
                ctx.beginPath();
                ctx.moveTo(viewLeft, 575);
                ctx.quadraticCurveTo(800, 535, viewLeft + viewW, 590);
                ctx.lineTo(viewLeft + viewW, viewTop + viewH);
                ctx.lineTo(viewLeft, viewTop + viewH);
                ctx.closePath();
                ctx.fill();

                // Стежка на галявині (Y: 640..750)
                const pathGrad = ctx.createLinearGradient(150, 660, 1200, 660);
                pathGrad.addColorStop(0, '#d4a373');
                pathGrad.addColorStop(0.5, '#c69260');
                pathGrad.addColorStop(1, '#a97444');
                ctx.fillStyle = pathGrad;
                ctx.beginPath();
                ctx.moveTo(viewLeft, 685);
                ctx.quadraticCurveTo(550, 615, 1160, 635);
                ctx.lineTo(1290, 725);
                ctx.quadraticCurveTo(600, 755, viewLeft, 785);
                ctx.closePath();
                ctx.fill();

                // На сторінках 2..7 малюємо старий дуб праворуч і вхід у нірку
                if (pageIndex >= 1 && pageIndex <= 6) {
                    drawOakAndBurrowEntrance(pageIndex, time);
                }

                // Жива трава та квіти вздовж галявини
                for (let i = 0; i < 26; i++) {
                    const gx = (i * 64) % 1560 + 20;
                    const gy = 585 + ((i * 39) % 245);
                    if (gy > 620 && gy < 745 && gx > 220 && gx < 1220) continue;

                    const sway = Math.sin(time * 2.4 + i) * 6.5;
                    ctx.strokeStyle = i % 2 === 0 ? '#43792f' : '#659e4c';
                    ctx.lineWidth = 3.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(gx, gy);
                    ctx.quadraticCurveTo(gx + sway * 0.5, gy - 16, gx + sway, gy - 32);
                    ctx.stroke();

                    if (i % 3 === 0) {
                        const fColor = worldPalette.flowerColors[i % worldPalette.flowerColors.length];
                        ctx.fillStyle = fColor;
                        for (let p = 0; p < 5; p++) {
                            const pa = (p / 5) * Math.PI * 2 + time * 0.5;
                            ctx.beginPath();
                            ctx.arc(gx + sway + Math.cos(pa) * 5.5, gy - 32 + Math.sin(pa) * 5.5, 4.2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.fillStyle = '#ffe169';
                        ctx.beginPath();
                        ctx.arc(gx + sway, gy - 32, 3.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Пушинки кульбабки або світлячки (тільки в нижній ігровій зоні)
            ambientSeeds.forEach((s, idx) => {
                s.x += s.vx;
                s.y += s.vy + Math.sin(time * 2 + s.phase) * 0.25;
                if (s.x > STAGE_W + 80) s.x = -80;
                if (s.y < SAFE_STAGE_TOP + 20) s.y = STAGE_H - 40;

                ctx.save();
                ctx.translate(s.x, s.y);
                if (isInsideBurrow) {
                    const alpha = 0.35 + Math.sin(time * 4 + idx) * 0.25;
                    ctx.fillStyle = `rgba(255, 225, 115, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(0, 0, s.size * 0.9, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                    ctx.lineWidth = 1.4;
                    for (let k = 0; k < 4; k++) {
                        const a = (k / 4) * Math.PI + Math.sin(time + idx) * 0.2;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(a) * s.size * 1.7, -Math.sin(a) * s.size * 1.7);
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(0, 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function drawOakAndBurrowEntrance(pageIndex, time) {
            ctx.save();

            // Стовбур могутнього дуба праворуч
            const barkGrad = ctx.createLinearGradient(980, 0, 1540, 0);
            barkGrad.addColorStop(0, '#6b472a');
            barkGrad.addColorStop(0.5, '#4f331c');
            barkGrad.addColorStop(1, '#331f0f');
            ctx.fillStyle = barkGrad;
            ctx.beginPath();
            ctx.moveTo(1050, 220);
            ctx.quadraticCurveTo(1020, 460, 945, 720);
            ctx.lineTo(1590, 740);
            ctx.lineTo(1560, 220);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(35, 18, 6, 0.45)';
            ctx.lineWidth = 6;
            for (let i = 0; i < 6; i++) {
                const bx = 1070 + i * 65;
                ctx.beginPath();
                ctx.moveTo(bx, 250);
                ctx.quadraticCurveTo(bx - 22, 460, bx - 38, 680);
                ctx.stroke();
            }

            // Вхід у нірку між корінням (Y = 685)
            const holeX = 1115;
            const holeY = 685;
            const archW = 78;
            const archH = 104;

            const insideGrad = ctx.createRadialGradient(holeX, holeY - archH * 0.4, 15, holeX, holeY - archH * 0.4, archH * 1.1);
            insideGrad.addColorStop(0, '#ffbe55');
            insideGrad.addColorStop(0.55, '#8f4716');
            insideGrad.addColorStop(1, '#2b1405');
            ctx.fillStyle = insideGrad;
            ctx.beginPath();
            ctx.ellipse(holeX, holeY, archW, archH, 0, Math.PI, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#402612';
            ctx.lineWidth = 22;
            ctx.beginPath();
            ctx.ellipse(holeX, holeY, archW + 6, archH + 6, 0, Math.PI, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        // Допоміжна функція для малювання святкового столу в нірці (Стор. 9..12)
        function drawBurrowTable(pageIndex, time) {
            ctx.save();
            // Дубові ніжки та стільниця
            ctx.fillStyle = '#5c3719';
            ctx.beginPath();
            ctx.roundRect(755, 640, 90, 145, 16);
            ctx.fill();

            const tableGrad = ctx.createLinearGradient(500, 610, 1100, 670);
            tableGrad.addColorStop(0, '#8d5b34');
            tableGrad.addColorStop(0.5, '#a66e40');
            tableGrad.addColorStop(1, '#6e4423');
            ctx.fillStyle = tableGrad;
            ctx.beginPath();
            ctx.ellipse(800, 640, 315, 52, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#4a2b13';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Три розписні керамічні тарілочки на столі
            const platePositions = [
                { x: 630, y: 635 },
                { x: 800, y: 625 },
                { x: 970, y: 635 }
            ];
            platePositions.forEach((p, idx) => {
                ctx.fillStyle = worldPalette.plateColor;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, 64, 22, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = worldPalette.plateTrim;
                ctx.lineWidth = 3.5;
                ctx.stroke();

                // Якщо це Стор. 10..12 — сир уже лежить на тарілочках
                if (pageIndex >= 9) {
                    drawCheeseWheel(p.x, p.y - 12, 48, 0, 1, 1, idx + 1);
                }
                // Якщо це Стор. 11..12 — малинки вже прикрашають сир
                if (pageIndex >= 10) {
                    drawRaspberry(p.x, p.y - 26, 0.85);
                }
            });
            ctx.restore();
        }

        function drawRaspberry(x, y, scaleVal = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scaleVal, scaleVal);
            // Зелений хвостик
            ctx.fillStyle = '#4f772d';
            ctx.beginPath();
            ctx.moveTo(0, -22);
            ctx.lineTo(-10, -12);
            ctx.lineTo(10, -12);
            ctx.closePath();
            ctx.fill();

            // Зернятка малинки
            const drupes = [
                [-8, -8], [0, -10], [8, -8],
                [-11, 0], [-3, -1], [4, -1], [11, 0],
                [-8, 8], [0, 9], [8, 8],
                [-3, 15], [3, 15]
            ];
            drupes.forEach(d => {
                const g = ctx.createRadialGradient(d[0] - 2, d[1] - 2, 1, d[0], d[1], 7);
                g.addColorStop(0, '#ff4d6d');
                g.addColorStop(0.7, '#c9184a');
                g.addColorStop(1, '#800f2f');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(d[0], d[1], 6.5, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawTeaCup(x, y, fillLevel = 0, isFull = false, time = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.strokeStyle = worldPalette.cupColor;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(-25, 4, 11, Math.PI * 0.5, Math.PI * 1.5);
            ctx.stroke();

            ctx.fillStyle = worldPalette.cupColor;
            ctx.beginPath();
            ctx.arc(0, 0, 27, 0, Math.PI);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#4a2c14';
            ctx.beginPath();
            ctx.ellipse(0, 0, 27, 9.5, 0, 0, Math.PI * 2);
            ctx.fill();

            if (fillLevel > 0.05) {
                ctx.fillStyle = '#e07a22';
                ctx.beginPath();
                ctx.ellipse(0, 1, 24 * Math.min(1, fillLevel), 8 * Math.min(1, fillLevel), 0, 0, Math.PI * 2);
                ctx.fill();
            }

            if (isFull) {
                for (let s = 0; s < 2; s++) {
                    const sy = -14 - ((time * 35 + s * 22) % 36);
                    const sx = (s - 0.5) * 14 + Math.sin(time * 4 + s) * 5;
                    ctx.strokeStyle = 'rgba(255, 245, 220, 0.55)';
                    ctx.lineWidth = 3.2;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.quadraticCurveTo(sx - 6, sy - 10, sx + 4, sy - 20);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        // ============================================================================
        // МАЛЮВАННЯ ІНТЕРАКТИВНИХ ОБ'ЄКТІВ ДЛЯ КОЖНОЇ З 12 СТОРІНОК
        // ============================================================================
        function drawSceneInteractions(pageIndex, time) {
            if (pageIndex === 0) {
                // Стор. 1: Потрусити ягідний кущик, щоб знайти величезний сир
                drawMouse(charState.mouseX, charState.mouseY, 1, 'standing', time);

                // Сир під кущиком
                drawCheeseWheel(sceneState.bushX, sceneState.bushY + 15, 92, 0);

                // Хвилі аромату сиру
                for (let a = 0; a < 3; a++) {
                    const ax = sceneState.bushX - 45 + a * 45;
                    const ay = 505 - ((time * 42 + a * 35) % 95);
                    const alpha = Math.sin(((505 - ay) / 95) * Math.PI) * 0.6;
                    ctx.strokeStyle = `rgba(255, 225, 105, ${alpha})`;
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(ax, ay);
                    ctx.bezierCurveTo(ax - 16, ay - 20, ax + 16, ay - 40, ax, ay - 58);
                    ctx.stroke();
                }

                // Пишний ягідний кущик, який розсувається після струшування
                if (sceneState.bushShakeAnim > 0) {
                    sceneState.bushShakeAnim = Math.max(0, sceneState.bushShakeAnim - 0.05);
                }
                if (sceneState.revealed) {
                    sceneState.bushOpenSpread = Math.min(155, sceneState.bushOpenSpread + 5);
                }
                const shakeX = Math.sin(time * 55) * sceneState.bushShakeAnim * 12;

                [-1, 1].forEach(side => {
                    ctx.save();
                    ctx.translate(sceneState.bushX + side * (35 + sceneState.bushOpenSpread) + shakeX, sceneState.bushY);
                    const bushGrad = ctx.createRadialGradient(-15, -25, 15, 0, 0, 125);
                    bushGrad.addColorStop(0, '#6a994e');
                    bushGrad.addColorStop(0.65, '#386641');
                    bushGrad.addColorStop(1, '#224028');
                    ctx.fillStyle = bushGrad;
                    ctx.beginPath();
                    ctx.arc(-35, 15, 68, 0, Math.PI * 2);
                    ctx.arc(35, 15, 68, 0, Math.PI * 2);
                    ctx.arc(0, -32, 74, 0, Math.PI * 2);
                    ctx.fill();

                    // Червоні ягідки на кущику
                    ctx.fillStyle = '#e63946';
                    [[-28, -18], [18, -32], [-10, 22], [32, 10]].forEach(b => {
                        ctx.beginPath();
                        ctx.arc(b[0], b[1], 8.5, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.restore();
                });

            } else if (pageIndex === 1) {
                // Стор. 2: Котимо сир стежкою до нірки
                charState.mouseX = sceneState.cheeseX - 135;
                drawMouse(charState.mouseX, charState.mouseY, 1, 'pushing', time);
                drawCheeseWheel(sceneState.cheeseX, sceneState.cheeseY, 92, sceneState.cheeseRot);

            } else if (pageIndex === 2) {
                // Стор. 3: Штовхаємо сир у вузьку нірку -> він стискається і відскакує з "боінгом"
                sceneState.squishVel += (1 - sceneState.squishX) * 0.22;
                sceneState.squishVel *= 0.78;
                sceneState.squishX += sceneState.squishVel;
                const sy = 2 - sceneState.squishX;

                charState.mouseX = sceneState.cheeseX - 135;
                drawMouse(charState.mouseX, charState.mouseY, 1, 'pushing', time);
                drawCheeseWheel(sceneState.cheeseX, sceneState.cheeseY, 92, 0.1, sceneState.squishX, sy);

            } else if (pageIndex === 3) {
                // Стор. 4: Мишка стрибає зверху на сирі біля нірки
                sceneState.squishVel += (1 - sceneState.squishX) * 0.24;
                sceneState.squishVel *= 0.76;
                sceneState.squishX += sceneState.squishVel;
                const sy = 2 - sceneState.squishX;

                if (sceneState.bounceAnim > 0) {
                    sceneState.bounceAnim = Math.max(0, sceneState.bounceAnim - 0.045);
                }
                const jumpY = -Math.sin(sceneState.bounceAnim * Math.PI) * 110;

                drawCheeseWheel(sceneState.cheeseX, sceneState.cheeseY, 94, 0, sceneState.squishX, sy);
                drawMouse(sceneState.cheeseX - 5, sceneState.cheeseY - 140 * sy + jumpY, -1, 'standing', time);

            } else if (pageIndex === 4) {
                // Стор. 5: Постукати по горбочку землі, щоб виліз кріт
                drawMouse(charState.mouseX, charState.mouseY, 1, 'standing', time);
                drawCheeseWheel(1220, 665, 86, -0.2);

                if (sceneState.moleAppeared) {
                    charState.molePop = Math.min(1, charState.molePop + 0.045);
                }
                drawMole(sceneState.moundX, sceneState.moundY - 35, charState.molePop, -1, time);

                ctx.save();
                const shakeX = sceneState.moundShake > 0 ? Math.sin(time * 55) * sceneState.moundShake * 9 : 0;
                if (sceneState.moundShake > 0) sceneState.moundShake = Math.max(0, sceneState.moundShake - 0.04);
                ctx.translate(sceneState.moundX + shakeX, sceneState.moundY);

                const soilGrad = ctx.createRadialGradient(0, -15, 10, 0, 10, 115);
                soilGrad.addColorStop(0, '#7f5539');
                soilGrad.addColorStop(0.65, '#583118');
                soilGrad.addColorStop(1, '#381d0a');
                ctx.fillStyle = soilGrad;
                ctx.beginPath();
                ctx.moveTo(-115, 30);
                ctx.quadraticCurveTo(-75, -65, 0, -68);
                ctx.quadraticCurveTo(75, -65, 115, 30);
                ctx.quadraticCurveTo(0, 48, -115, 30);
                ctx.fill();
                ctx.restore();

            } else if (pageIndex === 5) {
                // Стор. 6: Розрізання сиру дворучною пилкою на 3 трикутні шматочки
                drawMouse(charState.mouseX, charState.mouseY, 1, 'pushing', time);
                drawMole(charState.moleX, charState.moleY, 1, -1, time);

                if (sceneState.sliced) {
                    sceneState.wedgeSpread = Math.min(34, sceneState.wedgeSpread + 1.6);
                }
                const sp = sceneState.wedgeSpread;
                drawCheeseWheel(sceneState.cheeseX + sp * 0.7, sceneState.cheeseY - sp * 0.5, 92, 0, 1, 1, 1);
                drawCheeseWheel(sceneState.cheeseX, sceneState.cheeseY + sp * 0.8, 92, 0, 1, 1, 2);
                drawCheeseWheel(sceneState.cheeseX - sp * 0.7, sceneState.cheeseY - sp * 0.5, 92, 0, 1, 1, 3);

                // Блискуча дворучна пилка з дерев'яними ручками
                if (!sceneState.sliced) {
                    ctx.save();
                    const sawY = sceneState.CheeseY ? sceneState.cheeseY : 560 + sceneState.sawProgress * 125;
                    ctx.translate(sceneState.sawX, sawY);

                    // Полотно пилки із зубчиками
                    const bladeGrad = ctx.createLinearGradient(-150, -18, 150, 18);
                    bladeGrad.addColorStop(0, '#ced4da');
                    bladeGrad.addColorStop(0.5, '#f8f9fa');
                    bladeGrad.addColorStop(1, '#adb5bd');
                    ctx.fillStyle = bladeGrad;
                    ctx.beginPath();
                    ctx.moveTo(-155, -18);
                    ctx.lineTo(155, -18);
                    ctx.lineTo(145, 10);
                    for (let tx = 140; tx >= -140; tx -= 14) {
                        ctx.lineTo(tx - 7, 22);
                        ctx.lineTo(tx - 14, 10);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#6c757d';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Дерев'яні ручки з обох боків
                    ctx.fillStyle = '#9c6644';
                    ctx.beginPath();
                    ctx.roundRect(-175, -36, 24, 58, 10);
                    ctx.roundRect(151, -36, 24, 58, 10);
                    ctx.fill();
                    ctx.restore();
                }

            } else if (pageIndex === 6) {
                // Стор. 7: Перетягнути 3 шматочки сиру всередину нірки
                drawMouse(charState.mouseX, charState.mouseY, 1, 'standing', time);
                drawMole(charState.moleX, charState.moleY, 1, -1, time);

                sceneState.wedges.forEach(w => {
                    if (w.inside) {
                        w.scale = Math.max(0, w.scale - 0.07);
                    }
                    if (w.scale > 0.02) {
                        drawCheeseWheel(w.x, w.y, 78 * w.scale, 0, 1, 1, w.part);
                    }
                });

            } else if (pageIndex === 7) {
                // Стор. 8: Запалюємо 3 жолудеві ліхтарики в темній нірці
                drawBurrowTable(pageIndex, time);
                drawMouse(charState.mouseX, charState.mouseY, 1, 'standing', time);
                drawMole(charState.moleX, charState.moleY, 1, -1, time);

            } else if (pageIndex === 8) {
                // Стор. 9: Розкласти 3 шматочки сиру на 3 тарілочки на столі
                drawBurrowTable(pageIndex, time);
                drawMouse(charState.mouseX, charState.mouseY, 1, 'standing', time);
                drawMole(charState.moleX, charState.moleY, 1, -1, time);

                sceneState.wedges.forEach(w => {
                    drawCheeseWheel(w.x, w.y, w.placed ? 48 : 66, 0, 1, 1, w.part);
                });

            } else if (pageIndex === 9) {
                // Стор. 10: Прикрасити сир на столі стиглими малинками з кошика
                drawBurrowTable(pageIndex, time);
                drawMouse(charState.mouseX, charState.mouseY, 1, 'standing', time);
                drawMole(charState.moleX, charState.moleY, 1, -1, time);

                // Плетений кошик унизу по центру
                ctx.save();
                ctx.translate(sceneState.basketX, sceneState.basketY);
                ctx.fillStyle = '#a97142';
                ctx.beginPath();
                ctx.ellipse(0, 0, 95, 42, 0, 0, Math.PI);
                ctx.fill();
                ctx.strokeStyle = '#6f4522';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();

                sceneState.berries.forEach(b => {
                    drawRaspberry(b.x, b.y, b.placed ? 0.85 : 1.15);
                });

            } else if (pageIndex === 10) {
                // Стор. 11: Налити трав'яний чай із мідного чайника в обидві чашки
                drawBurrowTable(pageIndex, time);
                drawMouse(charState.mouseX, charState.mouseY, 1, 'standing', time);
                drawMole(charState.moleX, charState.moleY, 1, -1, time);

                sceneState.cups.forEach(cup => {
                    drawTeaCup(cup.x, cup.y, cup.fill, cup.full, time);
                });

                // Мідний заварник
                ctx.save();
                ctx.translate(sceneState.teapotX, sceneState.teapotY);
                ctx.rotate(sceneState.potTilt);

                if (Math.abs(sceneState.potTilt) > 0.25) {
                    ctx.strokeStyle = 'rgba(235, 135, 35, 0.85)';
                    ctx.lineWidth = 7;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-58, -4);
                    ctx.quadraticCurveTo(-72, 35, -65, 82);
                    ctx.stroke();
                }

                ctx.strokeStyle = '#b5542c';
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-28, 5);
                ctx.quadraticCurveTo(-52, -12, -58, -6);
                ctx.stroke();

                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(32, 0, 20, -Math.PI * 0.5, Math.PI * 0.5);
                ctx.stroke();

                const potGrad = ctx.createRadialGradient(-12, -12, 8, 0, 0, 44);
                potGrad.addColorStop(0, '#f4a261');
                potGrad.addColorStop(0.65, '#c86d3b');
                potGrad.addColorStop(1, '#7d3214');
                ctx.fillStyle = potGrad;
                ctx.beginPath();
                ctx.ellipse(0, 4, 42, 34, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#f4e2c6';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-34, 4);
                ctx.bezierCurveTo(-15, -8, 15, 16, 34, 4);
                ctx.stroke();

                ctx.fillStyle = '#9e421d';
                ctx.beginPath();
                ctx.ellipse(0, -28, 22, 8, 0, 0, Math.PI * 2);
                ctx.arc(0, -36, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

            } else if (pageIndex === 11) {
                // Стор. 12: Друзі цокаються чашками і ласують сиром
                drawBurrowTable(pageIndex, time);
                drawMouse(charState.mouseX, charState.mouseY, 1, 'standing', time);
                drawMole(charState.moleX, charState.moleY, 1, -1, time);

                // Чашки піднімаються назустріч для тосту при кліку
                const clinkShift = isCelebrating ? Math.sin(time * 10) * 35 + 65 : 0;
                drawTeaCup(615 + clinkShift, 630 - Math.abs(clinkShift) * 0.35, 1, true, time);
                drawTeaCup(985 - clinkShift, 630 - Math.abs(clinkShift) * 0.35, 1, true, time);
            }
        }

        // ============================================================================
        // ВЕРХНІЙ СУВІЙ ІЗ ВДВІЧІ ЗБІЛЬШЕНИМ ШРИФТОМ (НЕ ПЕРЕКРИВАЄ ІЛЮСТРАЦІЇ!)
        // ============================================================================
        function drawOrganicUI(time) {
            ctx.save();
            const scrollCX = STAGE_W * 0.5;
            const scrollCY = 126;
            const scrollW = 1230;
            const scrollH = 196;

            // М'яка тінь під верхнім сувоєм
            ctx.fillStyle = 'rgba(12, 7, 2, 0.48)';
            ctx.beginPath();
            ctx.ellipse(scrollCX, scrollCY + 14, scrollW * 0.51, scrollH * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();

            // Дубова гілка-тримач зверху сувою
            ctx.strokeStyle = '#3d2310';
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(scrollCX - scrollW * 0.53, scrollCY - scrollH * 0.42);
            ctx.quadraticCurveTo(scrollCX, scrollCY - scrollH * 0.54, scrollCX + scrollW * 0.53, scrollCY - scrollH * 0.42);
            ctx.stroke();

            // Золотисто-бурштиновий пергамент
            const parchGrad = ctx.createLinearGradient(scrollCX - scrollW * 0.5, scrollCY - 95, scrollCX + scrollW * 0.5, scrollCY + 95);
            parchGrad.addColorStop(0, '#e3be82');
            parchGrad.addColorStop(0.2, '#f5deb3');
            parchGrad.addColorStop(0.5, '#fff3d6');
            parchGrad.addColorStop(0.8, '#f3d8a7');
            parchGrad.addColorStop(1, '#d9ad6b');

            ctx.fillStyle = parchGrad;
            ctx.beginPath();
            const leftX = scrollCX - scrollW * 0.48;
            const rightX = scrollCX + scrollW * 0.48;
            const topY = scrollCY - scrollH * 0.47;
            const botY = scrollCY + scrollH * 0.47;

            ctx.moveTo(leftX, topY + 6);
            ctx.quadraticCurveTo(scrollCX, topY - 12, rightX, topY + 6);
            ctx.bezierCurveTo(rightX + 32, topY + 25, rightX + 32, botY - 25, rightX, botY - 6);
            ctx.quadraticCurveTo(scrollCX, botY + 12, leftX, botY - 6);
            ctx.bezierCurveTo(leftX - 32, botY - 25, leftX - 32, topY + 25, leftX, topY + 6);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#9c6b36';
            ctx.lineWidth = 3.8;
            ctx.stroke();

            // Різьблені дерев'яні валики пергаменту з боків
            [-1, 1].forEach(side => {
                const rx = scrollCX + side * (scrollW * 0.485);
                const rollGrad = ctx.createLinearGradient(rx - 22, scrollCY, rx + 22, scrollCY);
                rollGrad.addColorStop(0, '#b58347');
                rollGrad.addColorStop(0.5, '#ebd09e');
                rollGrad.addColorStop(1, '#8a5d28');
                ctx.fillStyle = rollGrad;
                ctx.beginPath();
                ctx.ellipse(rx, scrollCY, 20, scrollH * 0.51, side * 0.04, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#6e4519';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Дубові листочки на кутах сувою
                ctx.save();
                ctx.translate(rx + side * 12, scrollCY + 65);
                ctx.rotate(side * 0.4 + Math.sin(time * 2 + side) * 0.06);
                ctx.fillStyle = '#588157';
                ctx.beginPath();
                ctx.ellipse(0, 0, 24, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#344e41';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            });

            // ВДВІЧІ ЗБІЛЬШЕНИЙ ШРИФТ (52px-56px) з розумним переносом рядків по ширині пергаменту
            const sentence = STORY_PAGES[currentPage][currentLang];
            ctx.fillStyle = '#261407';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const maxTextWidth = scrollW - 115;
            let fontSize = 54;
            let lines = [];

            while (fontSize >= 42) {
                ctx.font = `800 ${fontSize}px "Nunito", "Comfortaa", sans-serif`;
                lines = [];
                let currentLine = '';
                const words = sentence.split(' ');

                for (let i = 0; i < words.length; i++) {
                    const testLine = currentLine ? currentLine + ' ' + words[i] : words[i];
                    if (ctx.measureText(testLine).width <= maxTextWidth) {
                        currentLine = testLine;
                    } else {
                        if (currentLine) lines.push(currentLine);
                        currentLine = words[i];
                    }
                }
                if (currentLine) lines.push(currentLine);

                if (lines.length <= 2 || (lines.length === 3 && fontSize <= 46)) {
                    break;
                }
                fontSize -= 2;
            }

            const lineHeight = fontSize * 1.16;
            const totalHeight = (lines.length - 1) * lineHeight;
            const startY = scrollCY - totalHeight * 0.5;

            lines.forEach((line, idx) => {
                // Легке світле підсвічування під літерами для бездоганної контрастності
                ctx.strokeStyle = 'rgba(255, 248, 230, 0.75)';
                ctx.lineWidth = 4;
                ctx.strokeText(line, scrollCX, startY + idx * lineHeight);
                ctx.fillText(line, scrollCX, startY + idx * lineHeight);
            });
            ctx.restore();

            // Кнопка перемикання мови ("укр" / "рус") зліва від сувою
            drawWoodenMedallionButton(88, 126, 66, 46, 'lang', time);

            // Мінімалістична кнопка "Далі" (стрілочка) справа від сувою
            drawWoodenMedallionButton(STAGE_W - 88, 126, 66, 46, 'next', time);
        }

        function drawWoodenMedallionButton(cx, cy, rx, ry, type, time) {
            ctx.save();
            ctx.translate(cx, cy);

            ctx.fillStyle = 'rgba(15, 8, 3, 0.45)';
            ctx.beginPath();
            ctx.ellipse(0, 6, rx + 4, ry + 4, 0, 0, Math.PI * 2);
            ctx.fill();

            const woodGrad = ctx.createRadialGradient(-12, -10, 5, 0, 0, rx);
            woodGrad.addColorStop(0, '#9c6644');
            woodGrad.addColorStop(0.65, '#6f4522');
            woodGrad.addColorStop(1, '#432812');
            ctx.fillStyle = woodGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ddb892';
            ctx.lineWidth = 3.8;
            ctx.stroke();

            ctx.save();
            ctx.translate(18, -ry + 2);
            ctx.rotate(0.3 + Math.sin(time * 2.5) * 0.08);
            ctx.fillStyle = '#6a994e';
            ctx.beginPath();
            ctx.ellipse(0, 0, 17, 8.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (type === 'lang') {
                ctx.fillStyle = '#faedcd';
                ctx.font = '800 34px "Nunito", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(currentLang, 0, 2);
            } else if (type === 'next') {
                ctx.strokeStyle = '#faedcd';
                ctx.lineWidth = 6.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(-22, 0);
                ctx.lineTo(18, 0);
                ctx.moveTo(5, -14);
                ctx.lineTo(22, 0);
                ctx.lineTo(5, 14);
                ctx.stroke();
            }

            ctx.restore();
        }

        // ============================================================================
        // ЧАСТИНКИ ТА СВЯТКОВІ ЕФЕКТИ
        // ============================================================================
        function updateAndDrawParticles() {
            for (let i = fxParticles.length - 1; i >= 0; i--) {
                const p = fxParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                if (p.type === 'dirt') {
                    p.vy += 0.32;
                } else {
                    p.vy += 0.06;
                }
                p.rot += p.vRot;
                p.life -= p.decay;

                if (p.life <= 0) {
                    fxParticles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;

                if (p.type === 'star') {
                    ctx.beginPath();
                    for (let s = 0; s < 5; s++) {
                        const a1 = (s * 2 * Math.PI) / 5 - Math.PI / 2;
                        const a2 = a1 + Math.PI / 5;
                        ctx.lineTo(Math.cos(a1) * p.size, Math.sin(a1) * p.size);
                        ctx.lineTo(Math.cos(a2) * (p.size * 0.45), Math.sin(a2) * (p.size * 0.45));
                    }
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // ============================================================================
        // ОБРОБКА МИШІ ТА СЕНСОРНОГО ЕКРАНА ДЛЯ ВСІХ 12 СТОРІНОК
        // ============================================================================
        let isPointerDown = false;
        let lastStagePos = { x: 0, y: 0 };

        function handlePointerDown(e) {
            e.preventDefault();
            sound.init();
            const pt = e.touches ? e.touches[0] : e;
            const pos = screenToStage(pt.clientX, pt.clientY);
            isPointerDown = true;
            lastStagePos = pos;

            // Перевірка кнопки перемикання мови ("укр" / "рус")
            if (Math.hypot(pos.x - 88, pos.y - 126) < 70) {
                currentLang = currentLang === 'укр' ? 'рус' : 'укр';
                sound.playWoodClick();
                return;
            }

            // Перевірка кнопки "Далі" (стрілочка у правому верхньому куті)
            if (Math.hypot(pos.x - (STAGE_W - 88), pos.y - 126) < 70) {
                sound.playWoodClick();
                const nextP = (currentPage + 1) % STORY_PAGES.length;
                if (nextP === 0) {
                    loopIteration++;
                    randomizeWorldVariations();
                }
                advanceToPage(nextP);
                return;
            }

            if (isCelebrating || isTurningPage) return;

            if (currentPage === 0) {
                // Стор. 1: Клік або струшування ягідного кущика
                if (Math.hypot(pos.x - sceneState.bushX, pos.y - sceneState.bushY) < 165 && !sceneState.revealed) {
                    sceneState.shakes++;
                    sceneState.bushShakeAnim = 1.0;
                    sound.playRustle();
                    spawnParticles(sceneState.bushX, sceneState.bushY - 30, 12, 'sparkle', '#6a994e');
                    if (sceneState.shakes >= 3) {
                        sceneState.revealed = true;
                        triggerTaskSuccess();
                    }
                }
            } else if (currentPage === 1) {
                // Стор. 2: Захоплення сиру для кочення
                if (Math.hypot(pos.x - sceneState.cheeseX, pos.y - sceneState.cheeseY) < 130) {
                    sceneState.draggingCheese = true;
                    sound.playSqueak(0.95);
                }
            } else if (currentPage === 2) {
                // Стор. 3: Штовхаємо сир у двері нірки (або клікаємо по ньому)
                if (Math.hypot(pos.x - sceneState.cheeseX, pos.y - sceneState.cheeseY) < 135) {
                    sceneState.draggingCheese = true;
                    triggerBoingAttempt();
                }
            } else if (currentPage === 3) {
                // Стор. 4: Натиснути тричі на мишку або сир, щоб вона пострибала зверху
                if (Math.hypot(pos.x - sceneState.cheeseX, pos.y - (sceneState.cheeseY - 60)) < 175) {
                    sceneState.jumps++;
                    sceneState.bounceAnim = 1.0;
                    sceneState.squishX = 1.28;
                    sound.playBoing(sceneState.jumps);
                    sound.playSqueak(1.0 + sceneState.jumps * 0.1);
                    spawnParticles(sceneState.cheeseX, sceneState.cheeseY - 40, 14, 'sparkle');
                    if (sceneState.jumps >= 3) {
                        triggerTaskSuccess();
                    }
                }
            } else if (currentPage === 4) {
                // Стор. 5: Постукати тричі по горбочку землі, щоб виліз кріт
                if (Math.hypot(pos.x - sceneState.moundX, pos.y - sceneState.moundY) < 135 && !sceneState.moleAppeared) {
                    sceneState.taps++;
                    sceneState.moundShake = 1.0;
                    sound.playDig();
                    spawnParticles(sceneState.moundX, sceneState.moundY - 25, 16, 'dirt');
                    if (sceneState.taps >= 3) {
                        sceneState.moleAppeared = true;
                        triggerTaskSuccess();
                    }
                }
            } else if (currentPage === 5) {
                // Стор. 6: Захоплення дворучної пилки для розрізання сиру
                if (Math.hypot(pos.x - sceneState.cheeseX, pos.y - sceneState.cheeseY) < 185) {
                    sceneState.draggingSaw = true;
                    sound.playSawStroke();
                }
            } else if (currentPage === 6) {
                // Стор. 7: Захоплення одного з 3 шматочків сиру біля нірки
                sceneState.wedges.forEach(w => {
                    if (!w.inside && Math.hypot(pos.x - w.x, pos.y - w.y) < 95) {
                        sceneState.activeWedge = w;
                        sound.playSqueak(1.05);
                    }
                });
            } else if (currentPage === 7) {
                // Стор. 8: Дотик до 3 жолудевих ліхтариків у темній нірці
                sceneState.lanterns.forEach((lan, idx) => {
                    if (!lan.lit && Math.hypot(pos.x - lan.x, pos.y - (lan.y + 30)) < 78) {
                        lan.lit = true;
                        sound.playChime(idx);
                        spawnParticles(lan.x, lan.y + 35, 18, 'star');
                        if (sceneState.lanterns.every(l => l.lit)) {
                            triggerTaskSuccess();
                        }
                    }
                });
            } else if (currentPage === 8) {
                // Стор. 9: Захоплення шматочка сиру для розкладання на тарілочки
                sceneState.wedges.forEach(w => {
                    if (!w.placed && Math.hypot(pos.x - w.x, pos.y - w.y) < 90) {
                        sceneState.activeWedge = w;
                        sound.playSqueak(1.08);
                    }
                });
            } else if (currentPage === 9) {
                // Стор. 10: Захоплення або клік по малинках у кошику
                sceneState.berries.forEach((b, idx) => {
                    if (!b.placed && Math.hypot(pos.x - b.x, pos.y - b.y) < 65) {
                        sceneState.activeBerry = b;
                        sound.playChime(idx);
                    }
                });
            } else if (currentPage === 10) {
                // Стор. 11: Захоплення мідного чайника
                if (Math.hypot(pos.x - sceneState.teapotX, pos.y - sceneState.teapotY) < 105) {
                    sceneState.draggingPot = true;
                    sound.playWoodClick();
                }
            } else if (currentPage === 11) {
                // Стор. 12: Торкнутися мишки, крота або столу, щоб друзі цокнулися чашками
                if (pos.y > SAFE_STAGE_TOP) {
                    sound.playChime(3);
                    triggerTaskSuccess();
                }
            }
        }

        function triggerBoingAttempt() {
            sceneState.boingCount++;
            sceneState.cheeseX = 955;
            sceneState.squishX = 0.68;
            sound.playBoing(sceneState.boingCount);
            spawnParticles(1015, sceneState.cheeseY, 14, 'sparkle');
            setTimeout(() => {
                if (currentPage === 2) sceneState.cheeseX = 845;
            }, 180);
            if (sceneState.boingCount >= 2) {
                triggerTaskSuccess();
            }
        }

        function handlePointerMove(e) {
            if (!isPointerDown || isCelebrating || isTurningPage) return;
            e.preventDefault();
            const pt = e.touches ? e.touches[0] : e;
            const pos = screenToStage(pt.clientX, pt.clientY);

            if (currentPage === 0 && !sceneState.revealed) {
                // Струшування ягідного кущика рухом пальчика
                if (Math.hypot(pos.x - sceneState.bushX, pos.y - sceneState.bushY) < 150) {
                    if (Math.hypot(pos.x - lastStagePos.x, pos.y - lastStagePos.y) > 22) {
                        sceneState.shakes += 0.35;
                        sceneState.bushShakeAnim = 1.0;
                        if (Math.random() < 0.3) sound.playRustle();
                        if (sceneState.shakes >= 3) {
                            sceneState.revealed = true;
                            triggerTaskSuccess();
                        }
                    }
                }
            } else if (currentPage === 1 && sceneState.draggingCheese) {
                const newX = Math.max(sceneState.cheeseX, Math.min(sceneState.targetX, pos.x));
                const dx = newX - sceneState.cheeseX;
                sceneState.cheeseX = newX;
                sceneState.cheeseRot += dx / 85;
                if (sceneState.cheeseX >= sceneState.targetX - 15) {
                    sceneState.cheeseX = sceneState.targetX;
                    sceneState.draggingCheese = false;
                    triggerTaskSuccess();
                }
            } else if (currentPage === 2 && sceneState.draggingCheese) {
                sceneState.cheeseX = Math.max(760, Math.min(975, pos.x));
                if (sceneState.cheeseX >= 950) {
                    sceneState.draggingCheese = false;
                    triggerBoingAttempt();
                }
            } else if (currentPage === 5 && sceneState.draggingSaw && !sceneState.sliced) {
                const dx = Math.abs(pos.x - lastStagePos.x);
                sceneState.sawX = 785 + Math.max(-65, Math.min(65, pos.x - 785));
                if (dx > 4) {
                    sceneState.sawProgress += dx / 420;
                    charState.moleArmAngle = Math.sin(sceneState.sawProgress * 22) * 0.35;
                    if (Math.random() < 0.22) {
                        sound.playSawStroke();
                        spawnParticles(sceneState.cheeseX, sceneState.cheeseY - 20, 2, 'sparkle', '#fff394');
                    }
                    if (sceneState.sawProgress >= 1) {
                        sceneState.sliced = true;
                        sceneState.draggingSaw = false;
                        charState.moleArmAngle = 0;
                        triggerTaskSuccess();
                    }
                }
            } else if (currentPage === 6 && sceneState.activeWedge) {
                const w = sceneState.activeWedge;
                w.x = pos.x;
                w.y = Math.max(SAFE_STAGE_TOP + 60, pos.y);
                if (Math.hypot(w.x - sceneState.burrowDoorX, w.y - sceneState.burrowDoorY) < 120) {
                    w.inside = true;
                    sceneState.activeWedge = null;
                    sound.playSqueak(1.2);
                    spawnParticles(sceneState.burrowDoorX, sceneState.burrowDoorY, 16, 'sparkle');
                    if (sceneState.wedges.every(item => item.inside)) {
                        triggerTaskSuccess();
                    }
                }
            } else if (currentPage === 8 && sceneState.activeWedge) {
                const w = sceneState.activeWedge;
                w.x = pos.x;
                w.y = Math.max(SAFE_STAGE_TOP + 60, pos.y);
                sceneState.plates.forEach(plate => {
                    if (!plate.occupied && Math.hypot(w.x - plate.x, w.y - plate.y) < 85) {
                        plate.occupied = true;
                        w.placed = true;
                        w.x = plate.x;
                        w.y = plate.y - 12;
                        sceneState.activeWedge = null;
                        sound.playChime(plate.id);
                        spawnParticles(plate.x, plate.y, 14, 'sparkle');
                        if (sceneState.wedges.every(item => item.placed)) {
                            triggerTaskSuccess();
                        }
                    }
                });
            } else if (currentPage === 9 && sceneState.activeBerry) {
                const b = sceneState.activeBerry;
                b.x = pos.x;
                b.y = Math.max(SAFE_STAGE_TOP + 50, pos.y);
                if (Math.hypot(b.x - b.targetX, b.y - b.targetY) < 95) {
                    b.placed = true;
                    b.x = b.targetX;
                    b.y = b.targetY;
                    sceneState.activeBerry = null;
                    sound.playChime(b.id + 1);
                    spawnParticles(b.x, b.y, 14, 'sparkle', '#ff4d6d');
                    if (sceneState.berries.every(item => item.placed)) {
                        triggerTaskSuccess();
                    }
                }
            } else if (currentPage === 10 && sceneState.draggingPot) {
                sceneState.teapotX = pos.x;
                sceneState.teapotY = Math.max(SAFE_STAGE_TOP + 65, pos.y);
                let nearCup = false;
                sceneState.cups.forEach(cup => {
                    if (Math.hypot((pos.x - 55) - cup.x, (pos.y + 45) - cup.y) < 95) {
                        nearCup = true;
                        sceneState.potTilt = -0.48;
                        if (!cup.full) {
                            cup.fill += 0.03;
                            if (Math.random() < 0.28) sound.playPour();
                            if (cup.fill >= 1) {
                                cup.full = true;
                                spawnParticles(cup.x, cup.y - 15, 14, 'sparkle');
                            }
                        }
                    }
                });
                if (!nearCup) {
                    sceneState.potTilt *= 0.8;
                }
                if (sceneState.cups.every(c => c.full)) {
                    sceneState.draggingPot = false;
                    sceneState.potTilt = 0;
                    sceneState.teapotX = sceneState.startX;
                    sceneState.teapotY = sceneState.startY;
                    triggerTaskSuccess();
                }
            }

            lastStagePos = pos;
        }

        function handlePointerUp() {
            isPointerDown = false;
            if (currentPage === 1 || currentPage === 2) sceneState.draggingCheese = false;
            if (currentPage === 5) {
                sceneState.draggingSaw = false;
                charState.moleArmAngle = 0;
            }
            if (currentPage === 6 || currentPage === 8) sceneState.activeWedge = null;
            if (currentPage === 9 && sceneState.activeBerry) {
                // Якщо дитина просто клікнула по малинці, плавно переносимо її на тарілочку
                const b = sceneState.activeBerry;
                if (!b.placed) {
                    b.placed = true;
                    b.x = b.targetX;
                    b.y = b.targetY;
                    spawnParticles(b.x, b.y, 14, 'sparkle', '#ff4d6d');
                    if (sceneState.berries.every(item => item.placed)) {
                        triggerTaskSuccess();
                    }
                }
                sceneState.activeBerry = null;
            }
            if (currentPage === 10) {
                sceneState.draggingPot = false;
                sceneState.potTilt = 0;
            }
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        window.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);

        // ============================================================================
        // ГОЛОВНИЙ ІГРОВИЙ ЦИКЛ ТА ПЕРЕГОРТАННЯ СТОРІНКИ КНИЖКИ
        // ============================================================================
        let lastTime = performance.now();

        function animate(now) {
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;
            const time = now / 1000;

            // Пружинна фізика вушок мишки
            const k = 18;
            const damp = 0.85;
            charState.earVelL += (-k * charState.earSpringL) * dt;
            charState.earVelL *= damp;
            charState.earSpringL += charState.earVelL;

            charState.earVelR += (-k * charState.earSpringR) * dt;
            charState.earVelR *= damp;
            charState.earSpringR += charState.earVelR;

            // Природне кліпання очей мишки
            charState.blinkTimer += dt;
            if (charState.blinkTimer > 3.4) {
                charState.isBlinking = true;
                if (charState.blinkTimer > 3.56) {
                    charState.isBlinking = false;
                    charState.blinkTimer = 0;
                }
            }

            // Таймер активного святкування (2.5 секунди перед автоматичним перегортанням сторінки)
            if (isCelebrating) {
                celebrationTimer += dt;
                if (Math.random() < 0.22) {
                    spawnParticles(
                        350 + Math.random() * 900,
                        220 + Math.random() * 280,
                        3,
                        Math.random() < 0.5 ? 'star' : 'sparkle'
                    );
                }
                if (celebrationTimer >= 2.5 && !isTurningPage) {
                    const nextP = (currentPage + 1) % STORY_PAGES.length;
                    if (nextP === 0) {
                        loopIteration++;
                        randomizeWorldVariations();
                    }
                    advanceToPage(nextP);
                }
            }

            // Анімація м'якого перегортання книжкової сторінки
            if (isTurningPage) {
                pageTurnProgress += dt * 1.45;
                if (pageTurnProgress >= 0.5 && currentPage !== nextTargetPage) {
                    currentPage = nextTargetPage;
                    initSceneState(currentPage);
                }
                if (pageTurnProgress >= 1) {
                    isTurningPage = false;
                    pageTurnProgress = 0;
                }
            }

            // Рендеринг сцени
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            drawLivingEnvironment(currentPage, time);
            drawSceneInteractions(currentPage, time);
            updateAndDrawParticles();
            drawOrganicUI(time);

            // Ефект золотистої хвилі перегортання сторінки
            if (isTurningPage) {
                const waveX = (1 - pageTurnProgress) * (STAGE_W + 400) - 200;
                const curtainAlpha = Math.sin(pageTurnProgress * Math.PI) * 0.45;
                ctx.fillStyle = `rgba(245, 222, 179, ${curtainAlpha})`;
                ctx.fillRect(-offsetX / scale, -offsetY / scale, window.innerWidth / scale, window.innerHeight / scale);

                const curlGrad = ctx.createLinearGradient(waveX - 120, 0, waveX + 120, 0);
                curlGrad.addColorStop(0, 'rgba(90, 52, 20, 0)');
                curlGrad.addColorStop(0.5, 'rgba(245, 222, 179, 0.85)');
                curlGrad.addColorStop(1, 'rgba(90, 52, 20, 0)');
                ctx.fillStyle = curlGrad;
                ctx.fillRect(waveX - 120, -100, 240, STAGE_H + 200);
            }

            ctx.restore();
            requestAnimationFrame(animate);
        }

        window.onload = function () {
            resizeCanvas();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
