<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кольоровий Код — Морський Риф</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
    background: #041f38;
  }

  /* ЖИВИЙ СЮЖЕТНИЙ ФОН: ПІДВОДНА ЛАГУНА */
  .ocean-scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1687a7 0%, #07456f 48%, #031c32 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 1.5vh 2.5vw 2vh;
    overflow: hidden;
  }

  /* Сонячні промені крізь воду */
  .sunbeams {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        108deg,
         rgba(255, 255, 255, 0.0) 0%,
         rgba(130, 245, 255, 0.07) 4%,
         rgba(255, 255, 255, 0.0) 9%
      );
    transform-origin: top center;
    animation: swayBeams 9s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes swayBeams {
    0% { transform: rotate(-2deg) scaleX(1.05); opacity: 0.75; }
    100% { transform: rotate(2deg) scaleX(1.15); opacity: 1; }
  }

  /* Декоративні SVG шари фону */
  .bg-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .seaweed {
    transform-origin: bottom center;
    animation: swayWeed 4.5s ease-in-out infinite alternate;
  }
  .seaweed.slow { animation-duration: 6s; animation-delay: -1.5s; }
  .seaweed.fast { animation-duration: 3.6s; animation-delay: -0.7s; }

  @keyframes swayWeed {
    0% { transform: skewX(-6deg) rotate(-2deg); }
    100% { transform: skewX(6deg) rotate(2deg); }
  }

  .fish-swim-right {
    animation: swimRight 22s linear infinite;
  }
  .fish-swim-left {
    animation: swimLeft 26s linear infinite;
  }

  @keyframes swimRight {
    0% { transform: translateX(-15vw) translateY(0px); }
    50% { transform: translateX(55vw) translateY(-18px); }
    100% { transform: translateX(115vw) translateY(5px); }
  }

  @keyframes swimLeft {
    0% { transform: translateX(115vw) translateY(0px); }
    50% { transform: translateX(40vw) translateY(15px); }
    100% { transform: translateX(-15vw) translateY(-8px); }
  }

  /* Canvas для бульбашок та святкових ефектів */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }

  /* ВЕРХНЯ ПАНЕЛЬ: КЛЮЧ КОЛЬОРІВ ТА ПЕРЕМИКАЧ МОВИ */
  .top-bar {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1500px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.2vw;
  }

  /* Рифова дошка з ключем */
  .key-reef-board {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.7vw;
    padding: 1.2vh 1.6vw;
    background: linear-gradient(180deg, #1b4d6e 0%, #0d2e47 100%);
    border: 4px solid #3993b6;
    border-radius: 36px;
    box-shadow:
      0 10px 24px rgba(0, 10, 25, 0.65),
      inset 0 3px 6px rgba(170, 240, 255, 0.35),
      inset 0 -5px 10px rgba(0, 0, 0, 0.5);
    position: relative;
  }

  /* Візерунок на дошці ключа */
  .key-reef-board::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 30px;
    background-image: radial-gradient(rgba(140, 230, 255, 0.12) 2px, transparent 2px);
    background-size: 16px 16px;
    pointer-events: none;
  }

  .key-gem {
    position: relative;
    width: clamp(54px, 6.8vw, 96px);
    height: clamp(64px, 9.2vh, 102px);
    border-radius: 22px 22px 18px 18px;
    border: 4px solid #061b2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 3.3vw, 48px);
    font-weight: 900;
    color: #071929;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.65);
    cursor: pointer;
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease;
    box-shadow:
      0 6px 0 #051626,
      0 10px 16px rgba(0, 0, 0, 0.45),
      inset 0 5px 6px rgba(255, 255, 255, 0.55),
      inset 0 -6px 8px rgba(0, 0, 0, 0.28);
  }

  .key-gem::after {
    content: "";
    position: absolute;
    top: 7px;
    left: 14%;
    width: 72%;
    height: 18%;
    background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.05));
    border-radius: 10px;
    pointer-events: none;
  }

  .key-gem:hover {
    transform: translateY(-5px) scale(1.06);
    box-shadow:
      0 11px 0 #051626,
      0 16px 24px rgba(0, 229, 255, 0.4),
      inset 0 5px 8px rgba(255, 255, 255, 0.75);
  }

  .key-gem:active {
    transform: translateY(2px) scale(0.97);
    box-shadow: 0 2px 0 #051626;
  }

  /* Перемикач мови (одна кнопка-тумблер) */
  .lang-switch {
    display: flex;
    background: linear-gradient(180deg, #123c58, #092235);
    border: 3px solid #3993b6;
    border-radius: 26px;
    padding: 5px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
  }

  .lang-btn {
    padding: 10px 16px;
    border-radius: 20px;
    border: none;
    background: transparent;
    color: #7ec8e3;
    font-weight: 900;
    font-size: clamp(16px, 1.5vw, 22px);
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 1px;
  }

  .lang-btn.active {
    background: linear-gradient(180deg, #ffca28 0%, #f57c00 100%);
    color: #082032;
    box-shadow: 0 3px 8px rgba(245, 124, 0, 0.5), inset 0 2px 3px rgba(255,255,255,0.6);
  }

  /* ЦЕНТРАЛЬНА ІГРОВА ЗОНА */
  .main-stage {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1480px;
    flex: 1;
    display: grid;
    grid-template-columns: 1.05fr 1.15fr;
    align-items: center;
    gap: 2.5vw;
    padding: 1vh 1vw;
  }

  /* ЛІВА КОЛОНКА: КОНЦЕНТРИЧНА МОРСЬКА МУШЛЯ / МЕДАЛЬЙОН */
  .medallion-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    height: 100%;
  }

  .medallion-pedestal {
    position: relative;
    width: clamp(320px, 41vw, 540px);
    height: clamp(320px, 41vw, 540px);
    max-height: 68vh;
    max-width: 68vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(26, 188, 156, 0.22) 0%, rgba(11, 56, 84, 0.65) 68%, rgba(5, 28, 46, 0.85) 100%);
    border-radius: 50%;
    border: 5px solid #297ca0;
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.65),
      0 0 35px rgba(0, 229, 255, 0.25),
      inset 0 0 30px rgba(0, 229, 255, 0.25);
  }

  /* Декоративний візерунок навколо медальйона */
  .medallion-pedestal::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 3px dashed rgba(130, 235, 255, 0.35);
    animation: slowSpin 45s linear infinite;
    pointer-events: none;
  }

  @keyframes slowSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  #code-svg {
    width: 92%;
    height: 92%;
    overflow: visible;
    filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.55));
  }

  .code-layer {
    cursor: pointer;
    transform-origin: 200px 200px;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
  }

  .code-layer:hover {
    filter: brightness(1.12);
  }

  .code-layer.pulse-layer {
    animation: ringPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes ringPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.09); filter: brightness(1.25); }
    100% { transform: scale(1); }
  }

  /* ПРАВА КОЛОНКА: ПРАВИЛО НАПРЯМКУ + МУШЛІ ДЛЯ СЛОВА + ВОСЬМИНІГ */
  .decode-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5vh;
    position: relative;
  }

  /* ПЛАШКА НАПРЯМКУ (ВІД БІЛЬШОГО ДО МЕНШОГО / ВІД МЕНШОГО ДО БІЛЬШОГО) */
  .direction-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2vw;
    padding: 1.4vh 2.2vw;
    background: linear-gradient(135deg, #f39c12 0%, #d35400 100%);
    border: 4px solid #ffe082;
    border-radius: 40px;
    box-shadow:
      0 8px 0 #7e2c00,
      0 14px 28px rgba(0, 0, 0, 0.55),
      inset 0 4px 6px rgba(255, 255, 255, 0.55);
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .direction-banner:hover {
    transform: translateY(-3px) scale(1.02);
  }

  .direction-banner.alt-mode {
    background: linear-gradient(135deg, #00b894 0%, #006266 100%);
    border-color: #81ecec;
    box-shadow:
      0 8px 0 #003b3d,
      0 14px 28px rgba(0, 0, 0, 0.55),
      inset 0 4px 6px rgba(255, 255, 255, 0.55);
  }

  .direction-icon-svg {
    width: clamp(68px, 6.5vw, 100px);
    height: clamp(44px, 4.4vh, 62px);
    flex-shrink: 0;
  }

  .direction-text {
    font-size: clamp(20px, 2.2vw, 34px);
    font-weight: 900;
    color: #fffdf5;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
    text-align: center;
  }

  /* СЛОТИ ДЛЯ БУКВ (ПЕРЛИННІ МУШЛІ НА ДЕРЕВ'ЯНІЙ ПАЛУБІ) */
  .word-deck {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.3vw;
    padding: 2.6vh 2.4vw;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(55, 28, 12, 0.22) 0px,
        rgba(55, 28, 12, 0.22) 3px,
        transparent 3px,
        transparent 48px
      ),
      linear-gradient(180deg, #8d5524 0%, #5c3311 100%);
    border: 5px solid #c68642;
    border-radius: 38px;
    box-shadow:
      0 12px 0 #3a1e07,
      0 20px 35px rgba(0, 0, 0, 0.65),
      inset 0 5px 10px rgba(255, 215, 160, 0.45),
      inset 0 -8px 14px rgba(28, 12, 2, 0.7);
    position: relative;
  }

  .letter-slot {
    position: relative;
    width: clamp(82px, 8.8vw, 134px);
    height: clamp(92px, 12.5vh, 146px);
    border-radius: 30px 30px 24px 24px;
    background: radial-gradient(circle at 50% 35%, #1e5f8a 0%, #0d334f 100%);
    border: 5px solid #63cdda;
    box-shadow:
      0 8px 0 #072136,
      inset 0 6px 12px rgba(0, 0, 0, 0.65),
      inset 0 -4px 8px rgba(130, 235, 255, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: clamp(38px, 4.4vw, 68px);
    font-weight: 900;
    color: #071929;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Декоративна мушля всередині порожнього слота */
  .letter-slot::before {
    content: "";
    position: absolute;
    width: 65%;
    height: 65%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Маленька кольорова підказка-перлинка над слотом */
  .slot-hint-dot {
    position: absolute;
    top: -15px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 3px solid #071929;
    background: #164e70;
    box-shadow: 0 3px 6px rgba(0,0,0,0.45), inset 0 2px 3px rgba(255,255,255,0.6);
    transition: transform 0.25s ease, background 0.25s ease;
  }

  .letter-slot.active-slot {
    border-color: #ffeaa7;
    transform: translateY(-6px) scale(1.04);
    box-shadow:
      0 14px 0 #072136,
      0 0 25px rgba(255, 234, 167, 0.85),
      inset 0 4px 10px rgba(255, 234, 167, 0.4);
  }

  .letter-slot.filled-slot {
    border-color: #061b2e;
    box-shadow:
      0 8px 0 #051626,
      0 12px 20px rgba(0,0,0,0.45),
      inset 0 6px 8px rgba(255,255,255,0.6),
      inset 0 -6px 10px rgba(0,0,0,0.3);
    animation: popSlot 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .letter-slot.wrong-shake {
    animation: shakeWrong 0.45s ease;
    border-color: #ff5252;
  }

  @keyframes popSlot {
    0% { transform: scale(0.75); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-12px) rotate(-5deg); }
    40% { transform: translateX(12px) rotate(5deg); }
    60% { transform: translateX(-9px) rotate(-3deg); }
    80% { transform: translateX(9px) rotate(3deg); }
  }

  /* АНІМОВАНИЙ ПЕРСОНАЖ — ВЕСЕЛИЙ ВОСЬМИНІГ ТА СКРИНЯ СКАРБІВ */
  .mascot-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.5vw;
    margin-top: 0.5vh;
  }

  .octopus-wrap {
    width: clamp(110px, 11vw, 165px);
    height: clamp(110px, 11vw, 165px);
    transition: transform 0.3s ease;
    animation: floatOcto 3.2s ease-in-out infinite alternate;
    cursor: pointer;
  }

  @keyframes floatOcto {
    0% { transform: translateY(0px) rotate(-3deg); }
    100% { transform: translateY(-12px) rotate(3deg); }
  }

  .octopus-wrap.happy-dance {
    animation: danceOcto 0.65s ease-in-out 3;
  }

  @keyframes danceOcto {
    0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
    30% { transform: translateY(-26px) scale(1.15) rotate(-12deg); }
    70% { transform: translateY(-20px) scale(1.15) rotate(12deg); }
  }

  .chest-wrap {
    width: clamp(115px, 11.5vw, 170px);
    height: clamp(105px, 10.5vw, 155px);
    transition: transform 0.3s ease;
  }

  .chest-lid {
    transform-origin: 50% 60px;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .chest-wrap.open .chest-lid {
    transform: translateY(-22px) rotate(-18deg);
  }

  .chest-glow {
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .chest-wrap.open .chest-glow {
    opacity: 1;
  }

  /* МІНІМАЛІСТИЧНА КНОПКА "ДАЛІ" (ЗАВЖДИ АКТИВНА) */
  .next-btn {
    position: fixed;
    bottom: 2.4vh;
    right: 2.4vw;
    z-index: 30;
    width: clamp(68px, 6.2vw, 92px);
    height: clamp(68px, 6.2vw, 92px);
    border-radius: 50%;
    border: 4px solid #b8ffda;
    background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
    box-shadow:
      0 8px 0 #005b66,
      0 14px 26px rgba(0, 0, 0, 0.55),
      inset 0 4px 8px rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
  }

  .next-btn:hover {
    transform: translateY(-5px) scale(1.08);
    box-shadow:
      0 13px 0 #005b66,
      0 18px 32px rgba(0, 230, 118, 0.55),
      inset 0 4px 10px rgba(255, 255, 255, 0.85);
  }

  .next-btn:active {
    transform: translateY(3px) scale(0.95);
    box-shadow: 0 3px 0 #005b66;
  }

  .next-btn svg {
    width: 55%;
    height: 55%;
    fill: none;
    stroke: #04253a;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Святкова хвиля перемоги на весь екран */
  .win-burst-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 8px solid rgba(255, 230, 100, 0.85);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 19;
  }

  .win-burst-ring.animate {
    animation: burstExpand 0.9s ease-out forwards;
  }

  @keyframes burstExpand {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(65); opacity: 0; }
  }
</style>
</head>
<body>

<div class="ocean-scene">
  <div class="sunbeams"></div>
  <div id="win-ring" class="win-burst-ring"></div>

  <!-- ЖИВИЙ СЮЖЕТНИЙ ПІДВОДНИЙ ФОН (100% SVG) -->
  <svg class="bg-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <defs>
      <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d4a359"/>
        <stop offset="100%" stop-color="#8c5823"/>
      </linearGradient>
      <linearGradient id="coralPink" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff6b8b"/>
        <stop offset="100%" stop-color="#c41e56"/>
      </linearGradient>
      <linearGradient id="coralOrange" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff9f43"/>
        <stop offset="100%" stop-color="#cf4600"/>
      </linearGradient>
      <linearGradient id="kelpGreen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2ed573"/>
        <stop offset="100%" stop-color="#0b663a"/>
      </linearGradient>
    </defs>

    <!-- Далекі підводні скелі -->
    <path d="M0 950 Q250 780 520 920 T1100 890 T1650 860 T1920 930 L1920 1080 L0 1080 Z" fill="#062c49" opacity="0.7"/>
    
    <!-- Рибки на задньому плані -->
    <g class="fish-swim-right" style="transform-box: fill-box;">
      <g transform="translate(100, 260) scale(0.85)">
        <path d="M0 25 L-28 5 L-22 25 L-28 45 Z" fill="#ff9f43"/>
        <ellipse cx="22" cy="25" rx="30" ry="18" fill="#ffbe76" stroke="#e58e26" stroke-width="3"/>
        <path d="M12 8 Q20 25 12 42" stroke="#eb2f06" stroke-width="5" fill="none"/>
        <path d="M28 10 Q35 25 28 40" stroke="#eb2f06" stroke-width="5" fill="none"/>
        <circle cx="40" cy="20" r="4" fill="#0a192f"/>
      </g>
    </g>

    <g class="fish-swim-left" style="transform-box: fill-box;">
      <g transform="translate(0, 480) scale(-0.75, 0.75)">
        <path d="M0 25 L-28 5 L-22 25 L-28 45 Z" fill="#00d2d3"/>
        <ellipse cx="22" cy="25" rx="32" ry="20" fill="#48dbfb" stroke="#0abde3" stroke-width="3"/>
        <path d="M5 25 Q22 12 38 25" stroke="#feca57" stroke-width="5" fill="none"/>
        <circle cx="42" cy="20" r="4" fill="#0a192f"/>
      </g>
    </g>

    <!-- Корали та водорості зліва -->
    <g class="seaweed" transform="translate(65, 980)">
      <path d="M0 0 Q-35 -120 10 -240 Q45 -350 -10 -470 Q-25 -350 25 -240 Q-10 -120 28 0 Z" fill="url(#kelpGreen)"/>
      <path d="M45 0 Q85 -100 35 -210 Q0 -310 50 -400 Q70 -300 20 -200 Q60 -100 20 0 Z" fill="url(#kelpGreen)" opacity="0.85"/>
    </g>
    <g class="seaweed slow" transform="translate(150, 990)">
      <path d="M0 0 C-40 -60 -55 -150 -20 -190 C0 -210 15 -170 -5 -130 C25 -170 60 -220 30 -250 C10 -270 -10 -230 15 -180 C45 -140 50 -60 22 0 Z" fill="url(#coralPink)"/>
    </g>

    <!-- Корали та водорості справа -->
    <g class="seaweed fast" transform="translate(1820, 985)">

<script>
  /* ==========================================================
     1. КЛЮЧ КОЛЬОРІВ ТА СЛОВНИКИ (UA & RU по 15 слів)
     Усі слова складаються з 4 літер ключа: Т Е В Р С К П А О Ш
  ========================================================== */
  const COLOR_KEY = [
    { letter: 'Т', color: '#2ECC71' }, // Яскраво-зелений
    { letter: 'Е', color: '#0097E6' }, // Насичений синій
    { letter: 'В', color: '#FF4791' }, // Рожевий маджента
    { letter: 'Р', color: '#FFD32A' }, // Сонячно-жовтий
    { letter: 'С', color: '#9B59B6' }, // Фіолетовий
    { letter: 'К', color: '#95A5A6' }, // Сталево-сірий
    { letter: 'П', color: '#FF7F11' }, // Помаранчевий
    { letter: 'А', color: '#A66332' }, // Теплий коричневий
    { letter: 'О', color: '#EA2027' }, // Червоний
    { letter: 'Ш', color: '#00E5FF' }  // Бірюзовий ціан
  ];

  const COLOR_MAP = {};
  COLOR_KEY.forEach(item => { COLOR_MAP[item.letter] = item.color; });

  const WORDS_DB = {
    ua: [
      'ПАРК', 'ТОРТ', 'ПОРТ', 'СКАТ', 'КАША',
      'РОСА', 'КОСА', 'КОРА', 'ПЕРО', 'СОВА',
      'КАВА', 'КЕКС', 'СТЕП', 'ВАТА', 'КАСА'
    ],
    ru: [
      'ПАРК', 'ТОРТ', 'ПОРТ', 'КРОТ', 'СКАТ',
      'СВЕТ', 'РЕКА', 'КАША', 'РОСА', 'КОСА',
      'КОРА', 'ПЕРО', 'СОВА', 'ВОСК', 'КЕКС'
    ]
  };

  const DIRECTION_LABELS = {
    ua: {
      bigToSmall: 'ВІД БІЛЬШОГО ДО МЕНШОГО',
      smallToBig: 'ВІД МЕНШОГО ДО БІЛЬШОГО'
    },
    ru: {
      bigToSmall: 'ОТ БОЛЬШЕГО К МЕНЬШЕМУ',
      smallToBig: 'ОТ МЕНЬШЕГО К БОЛЬШЕМУ'
    }
  };

  /* ==========================================================
     2. СТАН ГРИ
  ========================================================== */
  let currentLang = 'ua';
  let wordQueue = [];
  let currentWord = '';
  let isBigToSmall = true; // true = від більшого до меншого, false = від меншого до більшого
  let shapeStyleIndex = 0; // 0..3 різні сюжетні морські форми концентричних кілець
  let activeSlotIndex = 0;
  let userLetters = ['', '', '', ''];
  let isTransitioning = false;

  /* ==========================================================
     3. WEB AUDIO API СИНТЕЗАТОР (Активні різноманітні звуки)
  ========================================================== */
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playBubblePop(freq = 520) {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 2.1, ctx.currentTime + 0.11);
    gain.gain.setValueAtTime(0.22, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.12);
  }

  function playCorrectLetterSound(stepIndex) {
    const ctx = getAudio();
    const scale = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    const baseFreq = scale[stepIndex % scale.length];

    [baseFreq, baseFreq * 1.5].forEach((f, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = idx === 0 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(f, ctx.currentTime + idx * 0.04);
      gain.gain.setValueAtTime(0.24 / (idx + 1), ctx.currentTime + idx * 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28 + idx * 0.04);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.04);
      osc.stop(ctx.currentTime + 0.3 + idx * 0.04);
    });
  }

  function playWrongBoing() {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(135, ctx.currentTime + 0.14);
    osc.frequency.linearRampToValueAtTime(195, ctx.currentTime + 0.24);
    osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.38);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  }

  let winMelodyVariant = 0;
  function playVictoryFanfare() {
    const ctx = getAudio();
    const melodies = [
      [523.25, 659.25, 783.99, 1046.50, 987.77, 1046.50],
      [440.00, 554.37, 659.25, 880.00, 1108.73, 1318.51],
      [587.33, 739.99, 880.00, 1174.66, 880.00, 1174.66]
    ];
    const notes = melodies[winMelodyVariant % melodies.length];
    winMelodyVariant++;

    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      const startTime = ctx.currentTime + i * 0.095;
      const duration = i === notes.length - 1 ? 0.45 : 0.18;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.28, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    });
  }

  /* ==========================================================
     4. ГЕНЕРАТОР СЮЖЕТНИХ КОНЦЕНТРИЧНИХ МОРСЬКИХ ФІГУР (SVG)
     Замість простих квадратів:
     0 - Морська перлинна мушля-квітка (Хвилястий медальйон)
     1 - Зірка Атлантиди (Округлий 8-променевий морський щит)
     2 - Кораловий лотос (Пелюстковий рифовий кристал)
     3 - Скарбниця Посейдона (Фігурний щит з вирізами)
  ========================================================== */
  function createWavyMedallionPath(cx, cy, r, lobes = 12, waveAmp = 0.08) {
    const steps = 120;
    let d = '';
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2;
      const mod = 1 + waveAmp * Math.cos(lobes * theta);
      const rad = r * mod;
      const x = cx + rad * Math.cos(theta);
      const y = cy + rad * Math.sin(theta);
      d += (i === 0 ? 'M ' : 'L ') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
    }
    return d + 'Z';
  }

  function createRoundedPolygonPath(cx, cy, r, sides = 6, rotOffset = 0) {
    const steps = 120;
    let d = '';
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2 + rotOffset;
      // Плавний супер-багатокутник
      const cosFactor = Math.cos(sides * theta);
      const rad = r * (0.92 + 0.08 * cosFactor);
      const x = cx + rad * Math.cos(theta);
      const y = cy + rad * Math.sin(theta);
      d += (i === 0 ? 'M ' : 'L ') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
    }
    return d + 'Z';
  }

  function getShapePath(styleIdx, radius) {
    const cx = 200, cy = 200;
    switch (styleIdx % 4) {
      case 0: // Хвиляста морська черепашка (10 пелюсток)
        return createWavyMedallionPath(cx, cy, radius, 10, 0.085);
      case 1: // Морська зірка-щит (8 променів)
        return createWavyMedallionPath(cx, cy, radius, 8, 0.11);
      case 2: // Шестигранний кристал рифу
        return createRoundedPolygonPath(cx, cy, radius, 6, Math.PI / 6);
      case 3: // Чотирипелюстковий клевер-медальйон
        return createWavyMedallionPath(cx, cy, radius, 4, 0.11);
    }
  }

  /* ==========================================================
     5. ВІДМАЛЬОВКА ІНТЕРФЕЙСУ ТА ЗАВДАННЯ
  ========================================================== */
  function renderKeyBar() {
    const board = document.getElementById('key-board');
    board.innerHTML = '';
    COLOR_KEY.forEach((item, idx) => {
      const btn = document.createElement('div');
      btn.className = 'key-gem';
      btn.style.backgroundColor = item.color;
      btn.textContent = item.letter;
      btn.onclick = () => handleLetterInput(item.letter, idx);
      board.appendChild(btn);
    });
  }

  function renderDirectionBanner() {
    const banner = document.getElementById('dir-banner');
    const textEl = document.getElementById('dir-text');
    const iconSvg = document.getElementById('dir-icon');

    if (isBigToSmall) {
      banner.classList.remove('alt-mode');
      textEl.textContent = DIRECTION_LABELS[currentLang].bigToSmall;
      // Іконка: Велика фігура -> Стрілка -> Мала фігура
      iconSvg.innerHTML = `
        <circle cx="24" cy="32" r="22" fill="#ffeaa7" stroke="#071929" stroke-width="3.5"/>
        <circle cx="24" cy="32" r="11" fill="none" stroke="#071929" stroke-width="2" stroke-dasharray="3 3"/>
        <path d="M54 32 L78 32 M68 22 L79 32 L68 42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="98" cy="32" r="10" fill="#ffeaa7" stroke="#071929" stroke-width="3.5"/>
      `;
    } else {
      banner.classList.add('alt-mode');
      textEl.textContent = DIRECTION_LABELS[currentLang].smallToBig;
      // Іконка: Мала фігура -> Стрілка -> Велика фігура
      iconSvg.innerHTML = `
        <circle cx="20" cy="32" r="10" fill="#81ecec" stroke="#071929" stroke-width="3.5"/>
        <path d="M40 32 L64 32 M54 22 L65 32 L54 42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="94" cy="32" r="22" fill="#81ecec" stroke="#071929" stroke-width="3.5"/>
        <circle cx="94" cy="32" r="11" fill="none" stroke="#071929" stroke-width="2" stroke-dasharray="3 3"/>
      `;
    }
  }

  function renderConcentricMedallion() {
    const svg = document.getElementById('code-svg');
    svg.innerHTML = '';

    // Визначаємо кольори від найбільшого (зовнішнього, індекс 0) до найменшого (внутрішнього, індекс 3)
    const letters = currentWord.split('');
    // Якщо isBigToSmall === true:
    // зовнішній шар (0) = letters[0], ..., найменший (3) = letters[3]
    // Якщо isBigToSmall === false (від меншого до більшого):
    // найменший шар (3) = letters[0], ..., найбільший зовнішній (0) = letters[3]
    const outerToInnerLetters = isBigToSmall ? letters : [...letters].reverse();

    const radii = [176, 132, 88, 44];

    radii.forEach((r, layerIdx) => {
      const letter = outerToInnerLetters[layerIdx];
      const fillColor = COLOR_MAP[letter];
      const pathData = getShapePath(shapeStyleIndex, r);

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'code-layer');
      g.setAttribute('id', `medallion-layer-${layerIdx}`);

      // Тінь/контур шару
      const mainPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      mainPath.setAttribute('d', pathData);
      mainPath.setAttribute('fill', fillColor);
      mainPath.setAttribute('stroke', '#061a2c');
      mainPath.setAttribute('stroke-width', '6');
      mainPath.setAttribute('stroke-linejoin', 'round');

      // Внутрішній глянцевий блік для об'єму
      const highlightPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      highlightPath.setAttribute('d', getShapePath(shapeStyleIndex, r - 6));
      highlightPath.setAttribute('fill', 'none');
      highlightPath.setAttribute('stroke', 'rgba(255, 255, 255, 0.38)');
      highlightPath.setAttribute('stroke-width', '3');

      g.appendChild(mainPath);
      g.appendChild(highlightPath);

      g.onclick = () => {
        playBubblePop(360 + layerIdx * 110);
        g.classList.remove('pulse-layer');
        void g.offsetWidth;
        g.classList.add('pulse-layer');
      };

      svg.appendChild(g);
    });
  }

  function renderWordSlots() {
    const deck = document.getElementById('word-deck');
    deck.innerHTML = '';

    for (let i = 0; i < 4; i++) {
      const slot = document.createElement('div');
      slot.className = 'letter-slot';
      if (i === activeSlotIndex && !userLetters[i]) {
        slot.classList.add('active-slot');
      }

      const hintDot = document.createElement('div');
      hintDot.className = 'slot-hint-dot';

      if (userLetters[i]) {
        const char = userLetters[i];
        slot.classList.add('filled-slot');
        slot.style.background = COLOR_MAP[char];
        slot.textContent = char;
        hintDot.style.background = COLOR_MAP[char];
        hintDot.style.transform = 'scale(1.18)';
      }

      slot.appendChild(hintDot);

      slot.onclick = () => {
        if (isTransitioning) return;
        playBubblePop(480);
        if (userLetters[i]) {
          userLetters[i] = '';
        }
        activeSlotIndex = i;
        renderWordSlots();
      };

      deck.appendChild(slot);
    }
  }

  /* ==========================================================
     6. ЛОГІКА ПЕРЕВІРКИ ВВОДУ ТА ФІДБЕКІВ
  ========================================================== */
  function handleLetterInput(letter, keyIdx = 0) {
    if (isTransitioning) return;
    if (activeSlotIndex >= 4) return;

    const expectedLetter = currentWord[activeSlotIndex];

    if (letter === expectedLetter) {
      // Правильна буква!
      userLetters[activeSlotIndex] = letter;
      playCorrectLetterSound(activeSlotIndex);

      // Підсвічуємо відповідне кільце на медальйоні
      const ringIdx = isBigToSmall ? activeSlotIndex : (3 - activeSlotIndex);
      const ringEl = document.getElementById(`medallion-layer-${ringIdx}`);
      if (ringEl) {
        ringEl.classList.remove('pulse-layer');
        void ringEl.offsetWidth;
        ringEl.classList.add('pulse-layer');
      }

      // Переходимо до наступного вільного слота
      const nextEmpty = userLetters.findIndex(ch => ch === '');
      activeSlotIndex = nextEmpty !== -1 ? nextEmpty : 4;
      renderWordSlots();

      // Спалах бульбашок біля слота
      const slots = document.querySelectorAll('.letter-slot');
      const targetSlot = slots[activeSlotIndex < 4 ? Math.max(0, activeSlotIndex - 1) : 3];
      if (targetSlot) {
        const rect = targetSlot.getBoundingClientRect();
        spawnBurstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, COLOR_MAP[letter], 18);
      }

      // Якщо все слово розшифровано!
      if (userLetters.every(ch => ch !== '')) {
        triggerVictoryCelebration();
      }
    } else {
      // Помилка — активний невербальний фідбек
      playWrongBoing();
      const slots = document.querySelectorAll('.letter-slot');
      const currentSlotEl = slots[activeSlotIndex];
      if (currentSlotEl) {
        currentSlotEl.classList.remove('wrong-shake');
        void currentSlotEl.offsetWidth;
        currentSlotEl.classList.add('wrong-shake');
      }
      // Восьминіжка дивується
      const mouth = document.getElementById('octo-mouth');
      if (mouth) {
        mouth.setAttribute('d', 'M92 120 Q100 110 108 120');
        setTimeout(() => {
          mouth.setAttribute('d', 'M88 115 Q100 128 112 115');
        }, 500);
      }
    }
  }

  // Підтримка фізичної клавіатури
  window.addEventListener('keydown', (e) => {
    if (isTransitioning) return;
    if (e.key === 'ArrowRight') {
      nextTask();
      return;
    }
    const char = e.key.toUpperCase();
    if (COLOR_MAP[char]) {
      handleLetterInput(char);
    }
  });

  function triggerVictoryCelebration() {
    isTransitioning = true;
    playVictoryFanfare();

    // Танцює восьминіжка і відкривається скриня скарбів
    const octo = document.getElementById('octopus');
    const chest = document.getElementById('treasure-chest');
    const winRing = document.getElementById('win-ring');

    octo.classList.add('happy-dance');
    chest.classList.add('open');
    winRing.classList.remove('animate');
    void winRing.offsetWidth;
    winRing.classList.add('animate');

    // Феєрверк морських перлин та зірочок по всьому екрану
    const pedRect = document.getElementById('pedestal').getBoundingClientRect();
    spawnBurstParticles(pedRect.left + pedRect.width / 2, pedRect.top + pedRect.height / 2, '#FFD32A', 45);
    setTimeout(() => {
      spawnBurstParticles(window.innerWidth * 0.68, window.innerHeight * 0.55, '#00E5FF', 45);
    }, 220);

    setTimeout(() => {
      octo.classList.remove('happy-dance');
      chest.classList.remove('open');
      nextTask();
    }, 1850);
  }

  /* ==========================================================
     7. БЕЗКІНЕЧНИЙ ГЕНЕРАТОР ЗАВДАНЬ ТА ПЕРЕМИКАЧІ
  ========================================================== */
  function refillQueue() {
    const pool = [...WORDS_DB[currentLang]];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    // Запобігаємо повтору того самого слова на стику черг
    if (pool[0] === currentWord && pool.length > 1) {
      [pool[0], pool[1]] = [pool[1], pool[0]];
    }
    wordQueue = pool;
  }

  function nextTask() {
    isTransitioning = false;
    playBubblePop(620);

    if (wordQueue.length === 0) {
      refillQueue();
    }
    currentWord = wordQueue.pop();

    // Чергуємо або випадково змінюємо напрямок та форму медальйона
    isBigToSmall = Math.random() < 0.5 ? !isBigToSmall : isBigToSmall;
    shapeStyleIndex = (shapeStyleIndex + 1) % 4;

    userLetters = ['', '', '', ''];
    activeSlotIndex = 0;

    document.getElementById('treasure-chest').classList.remove('open');
    document.getElementById('octopus').classList.remove('happy-dance');

    renderDirectionBanner();
    renderConcentricMedallion();
    renderWordSlots();
  }

  function toggleDirectionManual() {
    if (isTransitioning) return;
    playBubblePop(540);
    isBigToSmall = !isBigToSmall;
    userLetters = ['', '', '', ''];
    activeSlotIndex = 0;
    renderDirectionBanner();
    renderConcentricMedallion();
    renderWordSlots();
  }

  function toggleLanguage() {
    setLanguage(currentLang === 'ua' ? 'ru' : 'ua');
  }

  function setLanguage(lang) {
    if (currentLang === lang) return;
    currentLang = lang;
    document.getElementById('btn-lang').textContent = lang.toUpperCase();
    wordQueue = [];
    nextTask();
  }

  function octopusBoing() {
    playBubblePop(700);
    const octo = document.getElementById('octopus');
    octo.classList.remove('happy-dance');
    void octo.offsetWidth;
    octo.classList.add('happy-dance');
  }

  /* ==========================================================
     8. CANVAS-СИСТЕМА ЖИВИХ БУЛЬБАШОК ТА СВЯТКОВИХ ЧАСТИНОК
  ========================================================== */
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let ambientBubbles = [];
  let burstParticles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  for (let i = 0; i < 26; i++) {
    ambientBubbles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 3 + Math.random() * 10,
      speedY: 0.4 + Math.random() * 1.1,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.015 + Math.random() * 0.025
    });
  }

  function spawnBurstParticles(x, y, baseColor, count = 30) {
    const palette = [baseColor, '#FFD32A', '#00E5FF', '#FF4791', '#2ECC71', '#FFFFFF'];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 11;
      burstParticles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        r: 5 + Math.random() * 9,
        color: palette[Math.floor(Math.random() * palette.length)],
        alpha: 1,
        star: Math.random() > 0.45
      });
    }
  }

  function drawStar(cx, cy, spikes, outerR, innerR, color, alpha) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    const step = Math.PI / spikes;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerR;
      y = cy + Math.sin(rot) * outerR;
      ctx.lineTo(x, y);
      rot += step;

      x = cx + Math.cos(rot) * innerR;
      y = cy + Math.sin(rot) * innerR;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function animateCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Фонова анімація морських бульбашок
    ambientBubbles.forEach(b => {
      b.y -= b.speedY;
      b.wobble += b.wobbleSpeed;
      const drawX = b.x + Math.sin(b.wobble) * 14;
      if (b.y < -20) {
        b.y = canvas.height + 20;
        b.x = Math.random() * canvas.width;
      }
      ctx.beginPath();
      ctx.arc(drawX, b.y, b.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(175, 245, 255, 0.35)';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(drawX - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fill();
    });

    // Святкові частинки фідбеку
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const p = burstParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.22;
      p.alpha -= 0.018;

      if (p.alpha <= 0) {
        burstParticles.splice(i, 1);
        continue;
      }

      if (p.star) {
        drawStar(p.x, p.y, 5, p.r * 1.4, p.r * 0.6, p.color, p.alpha);
      } else {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = '#061a2c';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
    }

    requestAnimationFrame(animateCanvas);
  }

  /* Ініціалізація гри */
  renderKeyBar();
  refillQueue();
  nextTask();
  animateCanvas();
</script>
</body>
