<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Інтерактивна дошка</title>
    
    <!-- Fabric.js для роботи з Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        body { 
            margin: 0; 
            overflow: auto; 
            background-color: #ffffff; 
            font-family: Arial, sans-serif; 
        }
        
        /* Основний контейнер, який буде масштабуватись */
        #zoom-wrapper {
            transform-origin: top left;
            transition: transform 0.2s ease;
            position: absolute;
            top: 0; left: 0;
            width: 3000px; height: 3000px;
        }

        #grid-canvas, #fabric-canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #fabric-canvas-container { pointer-events: auto; }
        
        /* Панелі керування */
        .panel { position: fixed; background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 100; }
        
        /* Кнопка вчителя */
        .teacher-btn-container { top: 10px; left: 10px; display: none; } /* За замовчуванням прихована, покажеться якщо вільна або ми вчитель */
        .teacher-btn { background: #34495e; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Зум */
        .top-right { top: 10px; right: 10px; display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
        
        /* Мінімалістична панель інструментів (по центру) */
        .right-panel { 
            top: 50%; 
            right: 10px; 
            transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px; 
            align-items: center; width: auto; 
        }
        .tool-btn {
            width: 50px; height: 50px;
            font-size: 24px;
            border: 2px solid transparent;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: #f0f0f0; }
        .tool-btn.active { background: #e8f5e9; border-color: #4caf50; box-shadow: 0 0 10px rgba(76, 175, 80, 0.5); transform: scale(1.1); }
        
        /* Налаштування олівця та гумки */
        #draw-settings, #erase-settings { display: none; flex-direction: column; gap: 5px; background: white; padding: 5px; border-radius: 8px; margin-top: 5px; border: 1px solid #ccc; width: 60px; align-items: center;}
        #draw-settings input[type="color"] { width: 40px; height: 40px; padding: 0; border: none; border-radius: 4px; cursor: pointer; }
        input[type="range"] { width: 50px; }

        button { padding: 8px 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-weight: bold; }
        button:hover { background: #e0e0e0; }

        /* Модальні вікна */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 1000; min-width: 320px; max-width: 90vw; max-height: 85vh; overflow-y: auto; }
        .modal.active { display: block; }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999; }
        .overlay.active { display: block; }
        
        .modal h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .modal h4 { margin-bottom: 10px; color: #555; }
        .form-group { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .section-divider { margin: 20px 0; border: 0; border-top: 2px dashed #ccc; }
        
        /* Бібліотека зображень */
        #library-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 250px; overflow-y: auto; margin-top: 10px; background: #f9f9f9; padding: 5px; border-radius: 8px; }
        .lib-item { position: relative; border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .lib-item img { width: 100%; height: 80px; object-fit: contain; border-radius: 4px; background: white; }
        .lib-item .delete-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; z-index: 2;}
        .lib-item-name { font-size: 10px; text-align: center; margin-top: 4px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555; }

        /* Меню об'єкта */
        #object-menu { position: fixed; display: none; background: white; border: 1px solid #ccc; padding: 5px; border-radius: 4px; z-index: 101; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* Екран блокування */
        #block-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 100000; justify-content: center; align-items: center; color: red; font-size: 40px; font-weight: bold; text-align: center; font-family: Arial, sans-serif; }

        /* Курсор затирачки - прозорий фон, лише контур */
        #eraser-cursor { 
            position: fixed; 
            border: 1.5px solid #2c3e50; 
            background-color: transparent; 
            border-radius: 50%; 
            pointer-events: none; 
            display: none; 
            z-index: 99999; 
            transform: translate(-50%, -50%); 
        }

        @media (max-width: 600px) {
            .top-right { flex-direction: column; align-items: flex-end; }
            .modal { width: 95vw; padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- Екран блокування -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <!-- Робоча зона -->
    <div id="zoom-wrapper">
        <canvas id="grid-canvas" width="3000" height="3000"></canvas>
        <div id="fabric-canvas-container">
            <canvas id="c"></canvas>
        </div>
    </div>

    <!-- Кнопка Вчителя -->
    <div class="panel teacher-btn-container">
        <button class="teacher-btn" onclick="tryOpenTeacherPanel()">⚙️ Вчитель</button>
    </div>

    <!-- Кнопки Зуму -->
    <div class="panel top-right">
        <button onclick="zoom(0.1)">+ Наблизити</button>
        <button onclick="zoom(-0.1)">- Віддалити</button>
        <button onclick="resetZoom()">100%</button>
    </div>

    <!-- Мінімалістична панель інструментів (по центру) -->
    <div class="panel right-panel">
        <button id="btn-select" class="tool-btn active" onclick="setMode('select')" title="Вказівник">👆</button>
        <button id="btn-pan" class="tool-btn" onclick="setMode('pan')" title="Рука (Переміщення екрану)">✋</button>
        
        <button id="btn-draw" class="tool-btn" onclick="setMode('draw')" title="Олівець">✏️</button>
        <div id="draw-settings">
            <input type="color" id="draw-color" value="#000000" title="Колір">
            <input type="range" id="draw-width" min="1" max="30" value="5" title="Товщина">
        </div>
        
        <button id="btn-erase" class="tool-btn" onclick="setMode('erase')" title="Затирачка">🧽</button>
        <div id="erase-settings">
            <input type="range" id="erase-width" min="10" max="150" value="40" title="Розмір затирачки">
        </div>
        
        <hr style="width: 80%; border-top: 2px solid #eee;">
        
        <button class="tool-btn" onclick="clearCanvas()" title="Очистити все">🗑️</button>
    </div>

    <!-- Видимий курсор для затирачки -->
    <div id="eraser-cursor"></div>

    <!-- Модалки -->
    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <!-- Об'єднане вікно Вчителя -->
    <div class="modal" id="teacher-modal">
        <h3>⚙️ Панель Вчителя</h3>
        
        <!-- Секція кружечка -->
        <h4>1. Інтерактивний кружок</h4>
        <div class="form-group"><label>Колір:</label><input type="color" id="circle-color" value="#ff0000"></div>
        <div class="form-group"><label>Розмір:</label><input type="range" id="circle-size" min="10" max="100" value="30"></div>
        <div class="form-group"><label><input type="checkbox" id="circle-pulse"> Пульсація</label></div>
        <button onclick="addCircle()" style="width: 100%; background: #4caf50; color: white;">Створити кружок</button>
        
        <hr class="section-divider">

        <!-- Секція Бібліотеки -->
        <h4>2. Бібліотека зображень</h4>
        <input type="file" id="image-upload" accept="image/png, image/jpeg, image/gif, image/webp" multiple>
        <div id="library-grid"></div>
        
        <hr class="section-divider">

        <!-- Секція Друк А4 -->
        <h4>3. Друк (А4)</h4>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button onclick="showPrintFrame()" style="flex: 1;">Увімкнути рамку</button>
            <button onclick="hidePrintFrame()" style="flex: 1;">Сховати рамку</button>
        </div>
        <button onclick="printA4Area()" style="width: 100%; background: #2980b9; color: white;">Зберегти та надрукувати</button>

        <hr class="section-divider">

        <!-- Секція Сітки -->
        <h4>4. Налаштування сітки</h4>
        <div class="form-group"><label>Ширина клітинки:</label><input type="number" id="g-width" value="47" style="width:60px;"></div>
        <div class="form-group"><label>Висота клітинки:</label><input type="number" id="g-height" value="61" style="width:60px;"></div>
        <div class="form-group"><label>Нахил (в пікселях):</label><input type="number" id="g-skew" value="-30" style="width:60px;"></div>
        <div class="form-group"><label>Товщина лінії:</label><input type="number" id="g-line" value="3" style="width:60px;"></div>
        <div class="form-group"><label>Колір:</label><input type="color" id="g-color" value="#cccccc"></div>
        <div class="form-group"><label>Прозорість:</label><input type="range" id="g-opacity" min="0" max="1" step="0.1" value="1"></div>
        <button onclick="applyGrid();" style="width: 100%; margin-top: 5px;">Застосувати сітку</button>

        <button onclick="closeModals();" style="width: 100%; margin-top: 15px; background:#e74c3c; color:white;">Закрити</button>
    </div>

    <!-- Плаваюче меню для картинки -->
    <div id="object-menu">
        <button onclick="resetSelectedImageSize()">Оригінальний розмір</button>
    </div>

    <script>
        const CONFIG = { gameId: 'whiteboard_main' };
        
        // Властивості Fabric, які експортуються для синхронізації
        const FABRIC_PROPS = ['customPulse', 'baseRadius', 'hasControls', 'hasBorders', 'hoverCursor', 'moveCursor', 'id', 'lockUniScaling', 'lockRotation'];
        
        // Ініціалізація Firebase
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        firebase.initializeApp(firebaseConfig);
        const dbFirebase = firebase.database();

        let canvas, gridCanvas, gridCtx;
        let currentZoom = 1;
        let mode = 'select'; 
        let dbIndexed;
        let lastImageScaleX = null;
        let lastImageScaleY = null;
        let pulsingCircles = [];
        
        let isPanning = false;
        let lastClientX, lastClientY;
        
        // Змінні для малювання і затирання у реальному часі
        let isErasing = false;
        let lastEraseX = undefined;
        let lastEraseY = undefined;
        let wasModifiedDuringErase = false;
        let isLocalDrawing = false;
        let remoteDrawPaths = {};
        let remoteEraseState = {};
        let lastRealtimeSync = 0;

        let printFrame = null;

        // Ідентифікація користувача
        let myName = sessionStorage.getItem('userName');
        if (!myName) {
            const urlParams = new URLSearchParams(window.location.search);
            myName = urlParams.get('user');
            if (myName) {
                sessionStorage.setItem('userName', myName);
            } else {
                myName = 'Гість_' + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('userName', myName);
            }
        }
        let isRemoteAction = false;

        function getEventPoint(e) {
            if (e.e.touches && e.e.touches.length > 0) {
                return { x: e.e.touches[0].clientX, y: e.e.touches[0].clientY };
            } else if (e.e.changedTouches && e.e.changedTouches.length > 0) {
                return { x: e.e.changedTouches[0].clientX, y: e.e.changedTouches[0].clientY };
            }
            return { x: e.e.clientX || 0, y: e.e.clientY || 0 };
        }

        function keepCirclesOnTop() {
            if (!canvas) return;
            canvas.getObjects().forEach(obj => {
                if (obj.type === 'circle' || obj.id === 'print-frame') {
                    obj.bringToFront();
                }
            });
        }

        function tryOpenTeacherPanel() {
            const ref = dbFirebase.ref(CONFIG.gameId + '/teacher_id');
            ref.transaction((currentTeacher) => {
                if (currentTeacher === null || currentTeacher === myName) {
                    return myName;
                }
                return; 
            }, (error, committed) => {
                if (committed) {
                    ref.onDisconnect().remove();
                    openModal('teacher-modal');
                } else {
                    alert('Панель вчителя вже використовується іншим користувачем!');
                }
            });
        }

        function initCanvas() {
            gridCanvas = document.getElementById('grid-canvas');
            gridCtx = gridCanvas.getContext('2d');
            
            // Відключаємо кешування об'єктів для ідеально плавної роботи векторної затирачки
            fabric.Object.prototype.objectCaching = false;
            
            canvas = new fabric.Canvas('c', {
                width: 3000,
                height: 3000,
                selection: true,
                preserveObjectStacking: true
            });

            canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            canvas.freeDrawingBrush.color = document.getElementById('draw-color').value;
            canvas.freeDrawingBrush.width = parseInt(document.getElementById('draw-width').value);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    let activeObjects = canvas.getActiveObjects();
                    if (activeObjects.length) {
                        canvas.discardActiveObject();
                        activeObjects.forEach(function(object) {
                            canvas.remove(object);
                        });
                        saveState();
                        syncAction('delete_objects');
                    }
                }
            });

            canvas.on('object:scaling', function(e) {
                if (e.target && e.target.type === 'image') {
                    lastImageScaleX = e.target.scaleX;
                    lastImageScaleY = e.target.scaleY;
                    saveState();
                }
                if (e.target && e.target.id === 'print-frame') {
                    e.target.strokeWidth = 2 / (e.target.scaleX * currentZoom);
                }
            });

            canvas.on('object:moving', function() {
                keepCirclesOnTop();
                syncAction('moving', false); 
            });

            // Малюнки створюються як стандартні шляхи (нічого не перекривають)
            canvas.on('path:created', function(e) {
                e.path.set({
                    id: 'draw',
                    hasControls: false, hasBorders: false,
                    hoverCursor: 'default', moveCursor: 'default',
                    fill: 'transparent'
                });
                keepCirclesOnTop();
                saveState();
                syncAction('path_created');
            });
            
            canvas.on('object:modified', () => { 
                keepCirclesOnTop();
                saveState(); 
                syncAction('modify'); 
            });

            canvas.on('mouse:dblclick', function(e) {
                if (e.target && mode === 'select' && e.target.id !== 'print-frame') {
                    e.target.set({
                        hasControls: true, 
                        hasBorders: true,
                        hoverCursor: 'move', 
                        moveCursor: 'move'
                    });
                    keepCirclesOnTop();
                    canvas.requestRenderAll();
                    saveState();
                }
            });

            function hideControls(objects) {
                if (!objects) return;
                objects.forEach(obj => {
                    if (obj.id !== 'print-frame') {
                        obj.set({
                            hasControls: false, hasBorders: false,
                            hoverCursor: 'default', moveCursor: 'default'
                        });
                    }
                });
            }
            canvas.on('selection:cleared', function(e) { hideControls(e.deselected); canvas.requestRenderAll(); });
            canvas.on('selection:updated', function(e) { hideControls(e.deselected); canvas.requestRenderAll(); });

            // --- МИША DOWN ---
            canvas.on('mouse:down', function(e) {
                document.getElementById('object-menu').style.display = 'none';
                let point = getEventPoint(e);
                
                if (mode === 'pan') {
                    isPanning = true;
                    lastClientX = point.x;
                    lastClientY = point.y;
                    canvas.defaultCursor = 'grabbing';
                } 
                else if (mode === 'erase') {
                    isErasing = true;
                    wasModifiedDuringErase = false;
                    let logicalPoint = canvas.getPointer(e.e);
                    lastEraseX = logicalPoint.x;
                    lastEraseY = logicalPoint.y;
                    let eRadius = (parseInt(document.getElementById('erase-width').value) / currentZoom) / 2;
                    syncRealtime('erase_start', { x: logicalPoint.x, y: logicalPoint.y, r: eRadius });
                    eraseVector(logicalPoint); // Запускаємо затирання одразу по кліку
                }
                else if (mode === 'draw') {
                    isLocalDrawing = true;
                    let logicalPoint = canvas.getPointer(e.e);
                    syncRealtime('draw_start', {
                        x: logicalPoint.x, 
                        y: logicalPoint.y,
                        color: document.getElementById('draw-color').value,
                        width: parseInt(document.getElementById('draw-width').value)
                    });
                }
                
                if (e.button === 3 && e.target && e.target.type === 'image') {
                    canvas.setActiveObject(e.target);
                    let menu = document.getElementById('object-menu');
                    menu.style.display = 'block';
                    menu.style.left = point.x + 'px';
                    menu.style.top = point.y + 'px';
                    e.e.preventDefault();
                }
            });

            // --- МИША MOVE ---
            canvas.on('mouse:move', function(e) {
                let point = getEventPoint(e);

                if (isPanning && mode === 'pan') {
                    let dx = lastClientX - point.x;
                    let dy = lastClientY - point.y;
                    window.scrollBy(dx, dy);
                    lastClientX = point.x;
                    lastClientY = point.y;
                }

                if (isLocalDrawing && mode === 'draw') {
                    let logicalPoint = canvas.getPointer(e.e);
                    syncRealtime('draw_move', { x: logicalPoint.x, y: logicalPoint.y });
                }

                // Візуальний курсор
                let cursor = document.getElementById('eraser-cursor');
                if (mode === 'erase') {
                    cursor.style.display = 'block';
                    let eSize = parseInt(document.getElementById('erase-width').value);
                    let eRadius = (eSize / currentZoom) / 2;
                    cursor.style.width = eSize + 'px';
                    cursor.style.height = eSize + 'px';
                    cursor.style.left = point.x + 'px';
                    cursor.style.top = point.y + 'px';
                    
                    if (isErasing) {
                        let logicalPoint = canvas.getPointer(e.e);
                        syncRealtime('erase_move', { x: logicalPoint.x, y: logicalPoint.y, r: eRadius });
                        
                        // Інтерполяція: стирає всі сегменти навіть при швидкому русі мишкою
                        if (lastEraseX !== undefined && lastEraseY !== undefined) {
                            let dist = Math.hypot(logicalPoint.x - lastEraseX, logicalPoint.y - lastEraseY);
                            let steps = Math.max(1, Math.floor(dist / 5)); 
                            for (let i = 0; i <= steps; i++) {
                                let interpX = lastEraseX + (logicalPoint.x - lastEraseX) * (i / steps);
                                let interpY = lastEraseY + (logicalPoint.y - lastErase.y) * (i / steps);
                                eraseVector({x: interpX, y: interpY});
                            }
                        } else {
                            eraseVector(logicalPoint);
                        }
                        lastEraseX = logicalPoint.x;
                        lastEraseY = logicalPoint.y;
                    }
                } else {
                    cursor.style.display = 'none';
                }
            });

            // --- МИША UP ---
            canvas.on('mouse:up', function(e) {
                if (mode === 'pan') {
                    isPanning = false;
                    canvas.defaultCursor = 'grab';
                } else if (mode === 'erase') {
                    isErasing = false;
                    lastEraseX = undefined;
                    lastEraseY = undefined;
                    syncRealtime('erase_end', {});
                    // Якщо лінія була розрізана, відправляємо оновлення на інші пристрої
                    if (wasModifiedDuringErase) {
                        saveState();
                        syncAction('modify');
                        wasModifiedDuringErase = false;
                    }
                } else if (mode === 'draw') {
                    isLocalDrawing = false;
                    syncRealtime('draw_end', {});
                }
            });

            document.querySelector('.canvas-container').addEventListener('contextmenu', e => e.preventDefault());

            applyGrid();
            initDB();
            setupFirebaseSync();
        }

        // --- ЛОГІКА ВЕКТОРНОЇ ЗАТИРАЧКИ ---
        // Ця функція знаходить відстань від центру гумки до намальованого відрізка (лінії)
        function pointToSegmentDist(px, py, x1, y1, x2, y2) {
            let A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
            let dot = A * C + B * D;
            let len_sq = C * C + D * D;
            let param = -1;
            if (len_sq !== 0) param = dot / len_sq;
            let xx, yy;
            if (param < 0) { xx = x1; yy = y1; }
            else if (param > 1) { xx = x2; yy = y2; }
            else { xx = x1 + param * C; yy = y1 + param * D; }
            let dx = px - xx, dy = py - yy;
            return Math.hypot(dx, dy);
        }

        // Перевіряє всі лінії на екрані і розрізає ті, по яким пройшла гумка
        function eraseVector(pointer, overrideRadius = null) {
            let eRadius = overrideRadius !== null ? overrideRadius : (parseInt(document.getElementById('erase-width').value) / currentZoom) / 2;
            let canvasObjects = canvas.getObjects();
            let hasChanges = false;
            
            for (let j = 0; j < canvasObjects.length; j++) {
                let obj = canvasObjects[j];
                // Обробляємо лише малюнки олівцем
                if (obj.id === 'draw' && obj.type === 'path') {
                    let br = obj.getBoundingRect();
                    
                    // Відкидаємо лінії, які далеко від гумки (оптимізація)
                    if (pointer.x < br.left - eRadius || pointer.x > br.left + br.width + eRadius ||
                        pointer.y < br.top - eRadius || pointer.y > br.top + br.height + eRadius) {
                        continue;
                    }

                    // Переводимо координати гумки у простір об'єкта
                    let invertedMatrix = fabric.util.invertTransform(obj.calcTransformMatrix());
                    let localP = fabric.util.transformPoint(pointer, invertedMatrix);
                    
                    // ДОДАНО: Враховуємо зсув шляху (pathOffset), щоб координати точно збігалися
                    if (obj.pathOffset) {
                        localP.x += obj.pathOffset.x;
                        localP.y += obj.pathOffset.y;
                    }

                    let localRadius = eRadius / Math.max(obj.scaleX || 1, obj.scaleY || 1);

                    let modified = false;
                    let pArray = obj.path;
                    if (!pArray || pArray.length === 0) continue;
                    
                    let lastX = pArray[0][1], lastY = pArray[0][2]; 
                    
                    for (let i = 1; i < pArray.length; i++) {
                        let cmd = pArray[i];
                        let currentX, currentY;
                        
                        if (cmd[0] === 'L' || cmd[0] === 'M') {
                            currentX = cmd[1]; currentY = cmd[2];
                        } else if (cmd[0] === 'Q') {
                            currentX = cmd[3]; currentY = cmd[4];
                        } else if (cmd[0] === 'C') {
                            currentX = cmd[5]; currentY = cmd[6];
                        } else {
                            continue;
                        }

                        let dist = pointToSegmentDist(localP.x, localP.y, lastX, lastY, currentX, currentY);
                        
                        // Якщо відрізок потрапляє в зону гумки — розриваємо його
                        if (dist < localRadius) {
                            if (cmd[0] !== 'M') {
                                pArray[i] = ['M', currentX, currentY];
                                modified = true;
                            }
                        }
                        
                        lastX = currentX;
                        lastY = currentY;
                    }
                    if (modified) {
                        // Вимкнено перерахунок розмірів, щоб малюнок не "стрибав" при затиранні
                        // obj._calcDimensions();
                        // obj.setCoords();
                        obj.dirty = true;
                        hasChanges = true;
                        wasModifiedDuringErase = true;
                    }
                }
            }
            
            // --- ПОВНЕ ВИДАЛЕННЯ ПОРОЖНІХ ЛІНІЙ (Вирішує баг невидимих об'єктів) ---
            for (let j = canvasObjects.length - 1; j >= 0; j--) {
                let obj = canvasObjects[j];
                if (obj.id === 'draw' && obj.type === 'path' && obj.path) {
                    // Якщо лінія складається тільки з 'M' (немає малюнку)
                    let hasVisible = obj.path.some(cmd => cmd[0] !== 'M');
                    if (!hasVisible) {
                        canvas.remove(obj);
                        hasChanges = true;
                        wasModifiedDuringErase = true;
                    }
                }
            }

            if (hasChanges) {
                canvas.requestRenderAll(); 
            }
        }

        // --- ЛОГІКА ДЛЯ РАМКИ ТА ДРУКУ А4 ---
        function showPrintFrame() {
            if (printFrame) return;
            let w = 800; let h = 1131;
            printFrame = new fabric.Rect({
                id: 'print-frame',
                left: window.scrollX / currentZoom + 100, top: window.scrollY / currentZoom + 100,
                width: w, height: h, fill: 'transparent', stroke: '#e74c3c',
                strokeWidth: 2 / currentZoom, strokeDashArray: [10, 5],
                selectable: true, hasControls: true, hasBorders: true,
                hoverCursor: 'move', moveCursor: 'move',
                lockUniScaling: true, // Зберігаємо пропорції А4 при зміні розміру
                lockRotation: true,
                scaleX: 1 / currentZoom, // Одразу компенсуємо поточний зум екрану
                scaleY: 1 / currentZoom
            });
            
            // Залишаємо тільки кутові маркери (щоб не розтягнули непропорційно)
            printFrame.setControlsVisibility({
                mt: false, mb: false, ml: false, mr: false, mtr: false
            });

            canvas.add(printFrame);
            canvas.setActiveObject(printFrame);
            keepCirclesOnTop();
            canvas.requestRenderAll();
            closeModals();
        }

        function hidePrintFrame() {
            if (printFrame) {
                canvas.remove(printFrame);
                printFrame = null;
                canvas.requestRenderAll();
            }
        }

        function printA4Area() {
            if (!printFrame) { alert('Спочатку увімкніть рамку А4!'); return; }
            printFrame.set('strokeWidth', 0);
            canvas.renderAll();
            
            let rect = printFrame.getBoundingRect();
            
            // 1. Отримуємо малюнки та об'єкти з Fabric у PNG (щоб зберегти прозорість)
            let fabricDataURL = canvas.toDataURL({ 
                left: rect.left, 
                top: rect.top, 
                width: rect.width, 
                height: rect.height, 
                format: 'png' 
            });
            
            printFrame.set('strokeWidth', 2 / currentZoom);
            canvas.renderAll();

            // 2. Створюємо тимчасовий canvas для об'єднання фону, сітки та малюнків
            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = rect.width;
            tempCanvas.height = rect.height;
            let tempCtx = tempCanvas.getContext('2d');

            // 3. Заливаємо білим фоном (щоб не було чорного кольору при конвертації в JPEG)
            tempCtx.fillStyle = '#ffffff';
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

            // 4. Малюємо частину сітки
            tempCtx.drawImage(
                gridCanvas,
                rect.left, rect.top, rect.width, rect.height,
                0, 0, rect.width, rect.height
            );

            // 5. Малюємо об'єкти Fabric поверх сітки
            let fabricImg = new Image();
            fabricImg.onload = function() {
                tempCtx.drawImage(fabricImg, 0, 0, rect.width, rect.height);
                
                // 6. Генеруємо фінальний JPEG у максимальній якості
                let finalDataURL = tempCanvas.toDataURL('image/jpeg', 1.0);
                
                // 7. Відкриваємо у новій вкладці для збереження як PDF
                let printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <html><head><title>Друк А4</title>
                    <style>
                        @media print { 
                            @page { margin: 0; size: A4 portrait; } 
                            html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: white; overflow: hidden; } 
                            .instruction { display: none !important; }
                            img { 
                                position: absolute; 
                                top: 0; 
                                left: 0; 
                                width: 100%; 
                                height: 100%; 
                                object-fit: contain; 
                                margin: 0; 
                                padding: 0; 
                                page-break-inside: avoid;
                                page-break-before: avoid;
                                page-break-after: avoid;
                            }
                        } 
                        body { margin: 0; text-align: center; background: #555; font-family: Arial; } 
                        img { max-width: 100%; box-shadow: 0 0 10px rgba(0,0,0,0.5); margin: 20px auto; background: white; display: block; } 
                        .instruction { color: white; padding: 10px; font-size: 18px; }
                    </style>
                    </head><body>
                    <div class="instruction">Оберіть "Зберегти як PDF" у вікні, що з'явиться.</div>
                    <img src="${finalDataURL}" onload="setTimeout(() => window.print(), 500);">
                    </body></html>
                `);
                printWindow.document.close();
                closeModals();
            };
            fabricImg.src = fabricDataURL;
        }

        // --- УПРАВЛІННЯ ІНСТРУМЕНТАМИ ---
        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('draw-settings').style.display = 'none';
            document.getElementById('erase-settings').style.display = 'none';

            if (mode === 'select') {
                document.getElementById('btn-select').classList.add('active');
                canvas.isDrawingMode = false;
                canvas.selection = true;
                canvas.forEachObject(o => o.selectable = true);
                canvas.defaultCursor = 'default';
                canvas.hoverCursor = 'default';
            } else if (mode === 'pan') {
                document.getElementById('btn-pan').classList.add('active');
                canvas.isDrawingMode = false;
                canvas.selection = false;
                canvas.forEachObject(o => o.selectable = false);
                canvas.defaultCursor = 'grab';
                canvas.hoverCursor = 'grab';
            } else if (mode === 'draw') {
                document.getElementById('btn-draw').classList.add('active');
                document.getElementById('draw-settings').style.display = 'flex';
                
                canvas.isDrawingMode = true;
                canvas.selection = false;
                canvas.defaultCursor = 'crosshair';
                canvas.hoverCursor = 'crosshair';
                
                canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
                updateBrush();
            } else if (mode === 'erase') {
                document.getElementById('btn-erase').classList.add('active');
                document.getElementById('erase-settings').style.display = 'flex';
                
                // Для векторної гумки ми повністю вимикаємо standard малювання
                canvas.isDrawingMode = false; 
                canvas.selection = false;
                canvas.forEachObject(o => o.selectable = false);
                canvas.defaultCursor = 'none'; 
                canvas.hoverCursor = 'none';
            }
        }

        document.getElementById('draw-color').addEventListener('input', updateBrush);
        document.getElementById('draw-width').addEventListener('input', updateBrush);
        
        function updateBrush() {
            if(mode !== 'draw') return;
            canvas.freeDrawingBrush.color = document.getElementById('draw-color').value;
            canvas.freeDrawingBrush.width = parseInt(document.getElementById('draw-width').value);
        }

        function clearCanvas() {
            if(confirm('Точно очистити все?')) {
                canvas.clear();
                saveState();
                syncAction('clear');
            }
        }

        function zoom(amount) {
            let oldZoom = currentZoom;
            currentZoom += amount;
            if(currentZoom < 0.2) currentZoom = 0.2;
            if(currentZoom > 3) currentZoom = 3;
            document.getElementById('zoom-wrapper').style.transform = `scale(${currentZoom})`;

            if (printFrame) {
                // Компенсуємо зум, щоб рамка візуально залишалась нерухомою на екрані
                let newScaleX = printFrame.scaleX * (oldZoom / currentZoom);
                let newScaleY = printFrame.scaleY * (oldZoom / currentZoom);
                printFrame.set({
                    scaleX: newScaleX,
                    scaleY: newScaleY,
                    strokeWidth: 2 / (newScaleX * currentZoom)
                });
                canvas.requestRenderAll();
                saveState();
            }
        }
        
        function resetZoom() {
            let oldZoom = currentZoom;
            currentZoom = 1;
            document.getElementById('zoom-wrapper').style.transform = `scale(1)`;
            
            if (printFrame) {
                let newScaleX = printFrame.scaleX * (oldZoom / currentZoom);
                let newScaleY = printFrame.scaleY * (oldZoom / currentZoom);
                printFrame.set({
                    scaleX: newScaleX,
                    scaleY: newScaleY,
                    strokeWidth: 2 / (newScaleX * currentZoom)
                });
                canvas.requestRenderAll();
                saveState();
            }
        }

        // --- МАЛЮВАННЯ ТА СИНХРОНІЗАЦІЯ СІТКИ (Виправлено похилі лінії) ---
        function applyGrid(emit = true) {
            let wVal = parseInt(document.getElementById('g-width').value);
            let w = isNaN(wVal) ? 47 : wVal;
            let hVal = parseInt(document.getElementById('g-height').value);
            let h = isNaN(hVal) ? 61 : hVal;
            let skewVal = parseInt(document.getElementById('g-skew').value);
            let skew = isNaN(skewVal) ? -30 : skewVal;
            let lineVal = parseInt(document.getElementById('g-line').value);
            let line = isNaN(lineVal) ? 3 : lineVal;
            let opVal = parseFloat(document.getElementById('g-opacity').value);
            let opacity = isNaN(opVal) ? 1 : opVal;
            let color = document.getElementById('g-color').value || '#cccccc';

            gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
            gridCtx.globalAlpha = opacity;
            gridCtx.strokeStyle = color;
            gridCtx.lineWidth = line;
            gridCtx.beginPath();

            for (let y = 0; y <= gridCanvas.height; y += h) {
                gridCtx.moveTo(0, y);
                gridCtx.lineTo(gridCanvas.width, y);
            }
            
            let totalShift = (h > 0) ? (gridCanvas.height / h) * skew : 0;
            // Малюємо від -30000 до 30000, щоб гарантовано покрити екран при будь-якому нахилі
            for (let x = -30000; x <= 30000; x += w) {
                gridCtx.moveTo(x, 0);
                gridCtx.lineTo(x + totalShift, gridCanvas.height);
            }
            
            gridCtx.stroke();
            saveState();
            
            if (emit && !isRemoteAction) {
                dbFirebase.ref(CONFIG.gameId + '/grid_state').set({
                    senderId: myName, timestamp: Date.now(),
                    settings: { w, h, skew, line, color, opacity }
                });
            }
        }

        function openModal(id) {
            document.getElementById('overlay').classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        function closeModals() {
            document.getElementById('overlay').classList.remove('active');
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            document.getElementById('object-menu').style.display = 'none';
        }

        function initDB() {
            let request = indexedDB.open('TutorAppDB', 1);
            request.onupgradeneeded = function(e) {
                dbIndexed = e.target.result;
                if (!dbIndexed.objectStoreNames.contains('images')) {
                    dbIndexed.createObjectStore('images', { keyPath: 'id', autoIncrement: true });
                }
                if (!dbIndexed.objectStoreNames.contains('settings')) {
                    dbIndexed.createObjectStore('settings', { keyPath: 'id' });
                }
            };
            request.onsuccess = function(e) {
                dbIndexed = e.target.result;
                loadLibraryUI();
                loadState();
            };
        }

        document.getElementById('image-upload').addEventListener('change', function(e) {
            let files = e.target.files;
            for(let i=0; i<files.length; i++) {
                let file = files[i];
                let reader = new FileReader();
                reader.onload = function(event) {
                    saveImageToDB(event.target.result, file.name);
                };
                reader.readAsDataURL(file);
            }
            this.value = "";
        });

        function saveImageToDB(dataUrl, fileName) {
            let tx = dbIndexed.transaction('images', 'readwrite');
            tx.objectStore('images').add({ data: dataUrl, name: fileName });
            tx.oncomplete = loadLibraryUI;
        }

        function loadLibraryUI() {
            let grid = document.getElementById('library-grid');
            grid.innerHTML = '';
            let tx = dbIndexed.transaction('images', 'readonly');
            let request = tx.objectStore('images').getAll(); // Використовуємо getAll для можливості сортування
            request.onsuccess = function(e) {
                let items = e.target.result;
                if (items && items.length > 0) {
                    // Сортуємо зображення за алфавітом по назві файлу
                    items.sort((a, b) => {
                        let nameA = (a.name || '').toLowerCase();
                        let nameB = (b.name || '').toLowerCase();
                        return nameA.localeCompare(nameB);
                    });
                    
                    items.forEach(item => {
                        let div = document.createElement('div');
                        div.className = 'lib-item';
                        
                        let img = document.createElement('img');
                        img.src = item.data;
                        img.onclick = function() { addImageToCanvas(item.data); closeModals(); };
                        
                        let delBtn = document.createElement('button');
                        delBtn.className = 'delete-btn';
                        delBtn.innerText = 'X';
                        delBtn.onclick = function(ev) { ev.stopPropagation(); deleteImage(item.id); };
                        
                        let nameDiv = document.createElement('div');
                        nameDiv.className = 'lib-item-name';
                        nameDiv.innerText = item.name || 'Без назви';
                        nameDiv.title = item.name || 'Без назви';

                        div.appendChild(img); 
                        div.appendChild(nameDiv);
                        div.appendChild(delBtn); 
                        grid.appendChild(div);
                    });
                }
            };
        }

        function addImageToCanvas(dataUrl) {
            fabric.Image.fromURL(dataUrl, function(img) {
                let viewportCenter = {
                    x: (window.scrollX + window.innerWidth / 2) / currentZoom,
                    y: (window.scrollY + window.innerHeight / 2) / currentZoom
                };
                img.set({ left: viewportCenter.x - 50, top: viewportCenter.y - 50, hasControls: false, hasBorders: false, hoverCursor: 'default', moveCursor: 'default' });
                if (lastImageScaleX !== null && lastImageScaleY !== null) { img.set({ scaleX: lastImageScaleX, scaleY: lastImageScaleY }); } else { img.scaleToWidth(200); }
                canvas.add(img);
                canvas.setActiveObject(img);
                keepCirclesOnTop();
                saveState();
                syncAction('add_image');
            });
        }

        function resetSelectedImageSize() {
            let active = canvas.getActiveObject();
            if (active && active.type === 'image') {
                active.set({ scaleX: 1, scaleY: 1 });
                lastImageScaleX = 1; lastImageScaleY = 1;
                canvas.requestRenderAll();
                saveState();
                syncAction('modify');
            }
            document.getElementById('object-menu').style.display = 'none';
        }

        function addCircle() {
            let color = document.getElementById('circle-color').value;
            let size = parseInt(document.getElementById('circle-size').value);
            let isPulsing = document.getElementById('circle-pulse').checked;

            let circle = new fabric.Circle({
                radius: size, fill: color,
                left: window.scrollX / currentZoom + 100, top: window.scrollY / currentZoom + 100,
                originX: 'center', originY: 'center',
                hasControls: false, hasBorders: false, hoverCursor: 'default', moveCursor: 'default', selectable: true,
                customPulse: isPulsing, baseRadius: size
            });

            canvas.add(circle);
            if (isPulsing) { pulsingCircles.push({ obj: circle, direction: 1 }); }
            keepCirclesOnTop();
            canvas.requestRenderAll();
            saveState();
            syncAction('add_circle');
            closeModals();
        }

        setInterval(() => {
            if (pulsingCircles.length === 0) return;
            pulsingCircles.forEach(p => {
                let currentRad = p.obj.radius;
                if (currentRad >= p.obj.baseRadius * 1.2) p.direction = -1;
                if (currentRad <= p.obj.baseRadius) p.direction = 1;
                p.obj.set('radius', currentRad + (0.5 * p.direction));
            });
            canvas.requestRenderAll();
        }, 30);

        function saveState() {
            if(!dbIndexed) return;
            let tx = dbIndexed.transaction('settings', 'readwrite');
            let store = tx.objectStore('settings');
            
            let gridSettings = {
                w: document.getElementById('g-width').value, h: document.getElementById('g-height').value,
                skew: document.getElementById('g-skew').value, line: document.getElementById('g-line').value,
                color: document.getElementById('g-color').value, opacity: document.getElementById('g-opacity').value
            };

            store.put({ id: 'grid', data: gridSettings });
            store.put({ id: 'canvas', data: canvas.toJSON(FABRIC_PROPS) });
            store.put({ id: 'imageScale', data: {x: lastImageScaleX, y: lastImageScaleY} });
        }

        function loadState() {
            let tx = dbIndexed.transaction('settings', 'readonly');
            let store = tx.objectStore('settings');
            
            store.get('grid').onsuccess = function(e) {
                if(e.target.result) {
                    let d = e.target.result.data;
                    document.getElementById('g-width').value = d.w; document.getElementById('g-height').value = d.h;
                    document.getElementById('g-skew').value = d.skew; document.getElementById('g-line').value = d.line;
                    document.getElementById('g-color').value = d.color; document.getElementById('g-opacity').value = d.opacity;
                    applyGrid(false); 
                }
            };

            store.get('canvas').onsuccess = function(e) {
                if(e.target.result) {
                    canvas.loadFromJSON(e.target.result.data, function() {
                        canvas.renderAll();
                        pulsingCircles = [];
                        canvas.getObjects().forEach(obj => {
                            if(obj.type === 'circle' && obj.customPulse) { pulsingCircles.push({ obj: obj, direction: 1 }); }
                            if(obj.id === 'print-frame') { printFrame = obj; }
                        });
                        keepCirclesOnTop();
                    });
                }
            };

            store.get('imageScale').onsuccess = function(e) {
                if(e.target.result) {
                    lastImageScaleX = e.target.result.data.x; lastImageScaleY = e.target.result.data.y;
                }
            };
        }

        // --- FIREBASE СИНХРОНІЗАЦІЯ ДОШКИ ---
        function syncRealtime(actionType, data) {
            if (isRemoteAction) return;
            const now = Date.now();
            if ((actionType === 'draw_move' || actionType === 'erase_move') && now - lastRealtimeSync < 25) return; 
            lastRealtimeSync = now;
            dbFirebase.ref(CONFIG.gameId + '/realtime_action').set({
                senderId: myName, timestamp: now, type: actionType, data: data
            });
        }

        let lastSyncTime = 0;
        
        function syncAction(actionType, force = true) {
            if (isRemoteAction) return;
            const now = Date.now();
            if (!force && now - lastSyncTime < 50) return; 
            lastSyncTime = now;
            // Завдяки Векторній затирачці, ми просто відправляємо змінені координати, і вони ідеально відображаються всюди
            dbFirebase.ref(CONFIG.gameId + '/canvas_state').set({ senderId: myName, timestamp: now, type: actionType, data: canvas.toJSON(FABRIC_PROPS) });
        }

        function setupFirebaseSync() {
            dbFirebase.ref(CONFIG.gameId + '/teacher_id').on('value', (snap) => {
                const currentTeacher = snap.val();
                const btn = document.querySelector('.teacher-btn-container');
                if (currentTeacher && currentTeacher !== myName) { btn.style.display = 'none'; } else { btn.style.display = 'block'; }
            });

            dbFirebase.ref(CONFIG.gameId + '/canvas_state').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val && val.senderId !== myName) {
                    isRemoteAction = true;
                    canvas.loadFromJSON(val.data, function() {
                        remoteDrawPaths = {}; // Очищаємо тимчасові лінії малювання
                        canvas.renderAll();
                        pulsingCircles = []; printFrame = null;
                        canvas.getObjects().forEach(obj => {
                            if(obj.type === 'circle' && obj.customPulse) { pulsingCircles.push({ obj: obj, direction: 1 }); }
                            if(obj.id === 'print-frame') { printFrame = obj; }
                        });
                        keepCirclesOnTop();
                        isRemoteAction = false;
                        saveState();
                    });
                }
            });

            dbFirebase.ref(CONFIG.gameId + '/grid_state').on('value', (snapshot) => {
                const val = snapshot.val();
                if (val && val.senderId !== myName) {
                    isRemoteAction = true;
                    document.getElementById('g-width').value = val.settings.w; document.getElementById('g-height').value = val.settings.h;
                    document.getElementById('g-skew').value = val.settings.skew; document.getElementById('g-line').value = val.settings.line;
                    document.getElementById('g-color').value = val.settings.color; document.getElementById('g-opacity').value = val.settings.opacity;
                    applyGrid(false);
                    isRemoteAction = false;
                }
            });

            // Слухач для дій малювання та затирання у реальному часі
            dbFirebase.ref(CONFIG.gameId + '/realtime_action').on('value', snap => {
                const val = snap.val();
                if (val && val.senderId !== myName) {
                    isRemoteAction = true;
                    const sender = val.senderId;

                    if (val.type === 'draw_start') {
                        let path = new fabric.Path(`M ${val.data.x} ${val.data.y}`, {
                            fill: 'transparent',
                            stroke: val.data.color,
                            strokeWidth: val.data.width,
                            strokeLineCap: 'round',
                            strokeLineJoin: 'round',
                            selectable: false,
                            evented: false,
                            id: 'remote_temp_draw'
                        });
                        remoteDrawPaths[sender] = path;
                        canvas.add(path);
                        canvas.requestRenderAll();
                    }
                    else if (val.type === 'draw_move') {
                        let path = remoteDrawPaths[sender];
                        if (path) {
                            path.path.push(['L', val.data.x, val.data.y]);
                            path.dirty = true;
                            canvas.requestRenderAll();
                        }
                    }
                    else if (val.type === 'erase_start') {
                        remoteEraseState[sender] = { x: val.data.x, y: val.data.y };
                        eraseVector({x: val.data.x, y: val.data.y}, val.data.r);
                    }
                    else if (val.type === 'erase_move') {
                        let lastErase = remoteEraseState[sender];
                        let logicalPoint = { x: val.data.x, y: val.data.y };
                        if (lastErase) {
                            let dist = Math.hypot(logicalPoint.x - lastErase.x, logicalPoint.y - lastErase.y);
                            let steps = Math.max(1, Math.floor(dist / 5));
                            for (let i = 0; i <= steps; i++) {
                                let interpX = lastErase.x + (logicalPoint.x - lastErase.x) * (i / steps);
                                let interpY = lastErase.y + (logicalPoint.y - lastErase.y) * (i / steps);
                                eraseVector({x: interpX, y: interpY}, val.data.r);
                            }
                        } else {
                            eraseVector(logicalPoint, val.data.r);
                        }
                        remoteEraseState[sender] = { x: val.data.x, y: val.data.y };
                    }
                    else if (val.type === 'erase_end') {
                        delete remoteEraseState[sender];
                    }
                    isRemoteAction = false;
                }
            });
        }

        window.onload = initCanvas;
    </script>

    <script>
        const tabId = Math.random().toString(36).substr(2, 9);
        const userRef = dbFirebase.ref('online_users/' + myName + '/' + tabId);
        
        dbFirebase.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                userRef.set({ game: CONFIG.gameId, connectedAt: firebase.database.ServerValue.TIMESTAMP });
                userRef.onDisconnect().remove();
            }
        });

        window.addEventListener('beforeunload', () => { userRef.remove(); });

        dbFirebase.ref('force_refresh').on('value', (snapshot) => {
            if (snapshot.val()) {
                const parts = snapshot.val().split('_');
                if (Date.now() - parseInt(parts[1]) < 5000) window.location.reload();
            }
        });

        dbFirebase.ref('blocked_users/' + myName).on('value', (snapshot) => {
            document.getElementById('block-overlay').style.display = snapshot.val() ? 'flex' : 'none';
        });

        const immunityEndTime = Date.now() + 1000;
        dbFirebase.ref('current_activity').on('value', (snapshot) => {
            if (Date.now() < immunityEndTime) return;
            const activity = snapshot.val();
            if (activity === 'lobby' || (activity && (activity.type === 'lobby' || activity.activity === 'lobby'))) {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });
    </script>
