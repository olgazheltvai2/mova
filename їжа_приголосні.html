<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Їжа</title>
  <style>
    /* =====================================================================
       RESET & FULLSCREEN 16:9 VIEWPORT (ZERO SCROLL, NO WHITE RECTANGLES)
       ===================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #ffcf7d 0%, #ffe6a8 52%, #b5d96c 100%);
      font-family: Arial, sans-serif;
      position: relative;
    }

    /* =====================================================================
       LAYER 1: LIVING OUTDOOR CAFÉ & SUMMER PICNIC GARDEN BACKGROUND (SVG)
       ===================================================================== */
    #scene-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .sun-rays {
      transform-origin: 1410px 130px;
      animation: rotateSun 46s linear infinite;
    }

    .sun-core {
      transform-origin: 1410px 130px;
      animation: pulseSun 4.4s ease-in-out infinite;
    }

    .cloud-a { animation: driftCloudA 58s linear infinite; }
    .cloud-b { animation: driftCloudB 74s linear infinite; }
    .cloud-c { animation: driftCloudC 49s linear infinite; }

    .herb-left {
      transform-origin: 75px 890px;
      animation: swayPlant 4.6s ease-in-out infinite;
    }
    .herb-right {
      transform-origin: 1525px 890px;
      animation: swayPlant 5.1s ease-in-out infinite reverse;
    }
    .sunflower-left {
      transform-origin: 148px 895px;
      animation: swayPlant 5.4s ease-in-out infinite 0.5s;
    }
    .sunflower-right {
      transform-origin: 1450px 895px;
      animation: swayPlant 4.9s ease-in-out infinite 0.9s;
    }

    /* Rising translucent bakery steam wisps */
    .steam-wisp-1 { animation: riseSteam 5.2s ease-in-out infinite; }
    .steam-wisp-2 { animation: riseSteam 6.1s ease-in-out infinite 1.8s; }
    .steam-wisp-3 { animation: riseSteam 5.6s ease-in-out infinite 3.1s; }

    /* Animated fluttering cartoon butterfly */
    .butterfly-path {
      animation: flyButterfly 22s ease-in-out infinite;
    }
    .butterfly-wings {
      transform-origin: 0px 0px;
      animation: flapWings 0.28s ease-in-out infinite alternate;
    }

    @keyframes rotateSun {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes pulseSun {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.07); }
    }

    @keyframes driftCloudA {
      0%   { transform: translateX(-280px); }
      100% { transform: translateX(1880px); }
    }

    @keyframes driftCloudB {
      0%   { transform: translateX(1840px); }
      100% { transform: translateX(-300px); }
    }

    @keyframes driftCloudC {
      0%   { transform: translateX(-220px); }
      100% { transform: translateX(1820px); }
    }

    @keyframes swayPlant {
      0%, 100% { transform: rotate(-3.2deg); }
      50%      { transform: rotate(3.4deg); }
    }

    @keyframes riseSteam {
      0%   { transform: translateY(18px) scale(0.85); opacity: 0; }
      30%  { opacity: 0.42; }
      75%  { opacity: 0.25; }
      100% { transform: translateY(-48px) scale(1.15); opacity: 0; }
    }

    @keyframes flyButterfly {
      0%   { transform: translate(-80px, 280px) rotate(8deg); }
      20%  { transform: translate(340px, 195px) rotate(-10deg); }
      42%  { transform: translate(780px, 260px) rotate(12deg); }
      65%  { transform: translate(1180px, 175px) rotate(-8deg); }
      85%  { transform: translate(1480px, 235px) rotate(6deg); }
      100% { transform: translate(1720px, 165px) rotate(-6deg); }
    }

    @keyframes flapWings {
      0%   { transform: scaleY(1); }
      100% { transform: scaleY(0.32); }
    }

    /* =====================================================================
       LAYER 2: AMBIENT GOLDEN MOTES & FLOATING SPARKLES CANVAS
       ===================================================================== */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* =====================================================================
       LAYER 3: GAME GRID (12 FOOD PLATES AROUND CENTRAL BISTRO SIGN)
       4 columns x 4 rows:
       - Top row: 4 plates
       - Middle 2 rows: 2 left plates, central bistro menu sign (2x2), 2 right plates
       - Bottom row: 4 plates
       ===================================================================== */
    #game-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 1.18fr 1.18fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      padding: 4.8vh 6.6vw 2vh;
      gap: 1.1vh 1.2vw;
      align-items: center;
      justify-items: center;
    }

    /* =====================================================================
       CENTRAL CARVED WOOD & TEAL-ENAMEL BISTRO MENU SIGN (NO WHITE BOX!)
       ===================================================================== */
    #signboard-wrap {
      grid-column: 2 / 4;
      grid-row: 2 / 4;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 15;
    }

    .bistro-sign {
      position: relative;
      width: 96%;
      max-width: 53vw;
      min-height: 22.5vh;
      padding: 3.1vh 2.5vw;
      border-radius: 38px;
      /* Deep rich teal-enamel center framed by warm carved wood & gold trim */
      background:
        radial-gradient(ellipse at 50% 24%, #217b7e 0%, #135459 58%, #0c383d 100%);
      border: 7px solid #8a4b1f;
      box-shadow:
        0 0 0 4px #f2be49,
        0 0 0 7px #5c2e0e,
        0 20px 36px rgba(42, 20, 6, 0.48),
        0 0 40px rgba(255, 210, 95, 0.35),
        inset 0 5px 14px rgba(145, 245, 238, 0.25),
        inset 0 -8px 20px rgba(4, 24, 28, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
    }

    /* Inner scalloped warm-gold decorative border */
    .bistro-sign::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 27px;
      border: 3px dashed rgba(255, 218, 117, 0.72);
      pointer-events: none;
    }

    /* Ornamental brass corner rivets */
    .brass-rivet {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #fff7c2 0%, #f5be3d 48%, #8f530a 100%);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.52), inset 0 1px 2px rgba(255, 255, 255, 0.85);
      z-index: 4;
    }
    .brass-rivet.tl { top: 16px; left: 16px; }
    .brass-rivet.tr { top: 16px; right: 16px; }
    .brass-rivet.bl { bottom: 16px; left: 16px; }
    .brass-rivet.br { bottom: 16px; right: 16px; }

    /* Top & bottom scalloped gold crests */
    .sign-ornament-top,
    .sign-ornament-bottom {
      position: absolute;
      left: 50%;
      width: 126px;
      height: 24px;
      pointer-events: none;
      z-index: 5;
    }
    .sign-ornament-top {
      top: -18px;
      transform: translateX(-50%);
    }
    .sign-ornament-bottom {
      bottom: -18px;
      transform: translateX(-50%) rotate(180deg);
    }

    .bistro-sign.word-pop {
      animation: plaquePop 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bistro-sign.celebrate-glow {
      box-shadow:
        0 0 0 4px #ffe566,
        0 0 0 8px #70390f,
        0 0 58px rgba(190, 255, 110, 0.92),
        0 20px 36px rgba(42, 20, 6, 0.48),
        inset 0 5px 18px rgba(220, 255, 175, 0.45);
    }

    @keyframes plaquePop {
      0%   { transform: scale(0.86); opacity: 0.7; }
      60%  { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Word Display inside Bistro Sign */
    #word-display {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      gap: var(--letter-gap, 0.48vw);
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: var(--word-size, clamp(30px, 5vw, 80px));
      line-height: 1;
      position: relative;
      z-index: 6;
      padding: 0.4vh 0.4vw;
    }

    /* Crisp cream/ivory consonants with dark outline/shadow */
    .letter-consonant {
      color: #fff6dc;
      text-shadow:
        0 4px 0 #07282b,
        0 7px 14px rgba(0, 0, 0, 0.48),
        0 0 12px rgba(255, 232, 160, 0.32);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0.6em;
    }

    /* Missing Vowel Slot: golden-apricot tile with subtle pulsing shimmer */
    .letter-vowel-slot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 0.94em;
      height: 1.16em;
      border-radius: 15px;
      background: linear-gradient(180deg, #ffca4b 0%, #f07b26 100%);
      border: 3px solid #ffe999;
      box-shadow:
        0 5px 0 #8a3a08,
        0 8px 14px rgba(0, 0, 0, 0.38),
        inset 0 3px 6px rgba(255, 250, 210, 0.6);
      overflow: hidden;
      animation: slotShimmer 2.4s ease-in-out infinite;
      transition: background 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
    }

    /* Subtle moving glossy sheen on empty vowel tiles */
    .letter-vowel-slot::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -80%;
      width: 55%;
      height: 140%;
      background: linear-gradient(105deg, transparent 0%, rgba(255, 255, 255, 0.48) 50%, transparent 100%);
      animation: tileGlint 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    /* Golden underline indicator inside blank slot */
    .letter-vowel-slot::after {
      content: "";
      position: absolute;
      bottom: 13%;
      left: 16%;
      right: 16%;
      height: 11%;
      border-radius: 99px;
      background: #fff7cc;
      box-shadow: 0 2px 4px rgba(120, 45, 0, 0.45);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .vowel-char {
      display: inline-block;
      color: #ffffff;
      text-shadow: 0 3px 0 #1f6b18, 0 5px 10px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(70%) scale(0.3);
      position: relative;
      z-index: 2;
    }

    /* Revealed lime-gold glow state */
    .letter-vowel-slot.revealed {
      animation: none;
      background: linear-gradient(180deg, #98f042 0%, #37b83c 100%);
      border-color: #f4ff99;
      box-shadow:
        0 5px 0 #19691c,
        0 0 24px rgba(180, 255, 90, 0.95),
        inset 0 3px 8px rgba(255, 255, 220, 0.65);
    }

    .letter-vowel-slot.revealed::before,
    .letter-vowel-slot.revealed::after {
      opacity: 0;
      transform: scaleX(0);
    }

    .letter-vowel-slot.revealed .vowel-char {
      animation: vowelBounceIn 0.54s cubic-bezier(0.34, 1.72, 0.64, 1) forwards;
    }

    @keyframes slotShimmer {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.1); }
    }

    @keyframes tileGlint {
      0%, 55%  { left: -80%; }
      100%     { left: 140%; }
    }

    @keyframes vowelBounceIn {
      0%   { opacity: 0; transform: translateY(75%) scale(0.25) rotate(-14deg); }
      62%  { opacity: 1; transform: translateY(-12%) scale(1.22) rotate(5deg); }
      100% { opacity: 1; transform: translateY(0%) scale(1) rotate(0deg); }
    }

    /* =====================================================================
       12 STYLIZED CERAMIC FOOD PLATES (COLORFUL, PATTERNED, NO WHITE BOXES)
       ===================================================================== */
    .food-plate {
      position: relative;
      width: min(20vh, 17vw);
      height: min(20vh, 17vw);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: idlePlate var(--float-dur, 3.8s) ease-in-out infinite var(--float-delay, 0s);
    }

    .plate-rim {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      padding: 9px;
      background: var(--rim-grad);
      box-shadow:
        0 9px 18px rgba(56, 28, 8, 0.34),
        0 0 0 3px rgba(255, 245, 210, 0.72),
        inset 0 3px 7px rgba(255, 255, 255, 0.6),
        inset 0 -4px 8px rgba(0, 0, 0, 0.16);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease;
    }

    /* Decorative ceramic dotted/scalloped border on plate rim */
    .plate-rim::before {
      content: "";
      position: absolute;
      inset: 3.5px;
      border-radius: 50%;
      border: 3px dotted rgba(255, 250, 224, 0.85);
      pointer-events: none;
      z-index: 3;
    }

    .plate-well {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: var(--well-grad);
      box-shadow:
        inset 0 6px 14px rgba(0, 0, 0, 0.14),
        inset 0 -3px 6px rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .plate-well svg {
      width: 92%;
      height: 92%;
      display: block;
      filter: drop-shadow(0 5px 5px rgba(50, 24, 6, 0.22));
    }

    /* Hover & touch scale-up */
    .food-plate:hover .plate-rim,
    .food-plate:focus-visible .plate-rim {
      transform: scale(1.12) translateY(-4px);
      box-shadow:
        0 14px 24px rgba(52, 24, 6, 0.4),
        0 0 0 4px #ffe566,
        0 0 26px rgba(255, 224, 90, 0.8);
    }

    .food-plate:active .plate-rim {
      transform: scale(0.95);
    }

    @keyframes idlePlate {
      0%, 100% { transform: translateY(0px) scale(1); }
      50%      { transform: translateY(-4.5px) scale(1.015); }
    }

    /* Correct Answer Dance + Golden-Lime Glow */
    .food-plate.is-correct {
      z-index: 30;
      animation: none;
    }

    .food-plate.is-correct .plate-rim {
      animation: plateDance 0.92s ease-in-out infinite;
      box-shadow:
        0 0 0 6px #fff176,
        0 0 44px 12px rgba(255, 224, 60, 0.95),
        0 14px 28px rgba(40, 20, 5, 0.35);
    }

    @keyframes plateDance {
      0%   { transform: scale(1.18) translateY(0) rotate(0deg); }
      22%  { transform: scale(1.27) translateY(-16px) rotate(-8deg); }
      48%  { transform: scale(1.22) translateY(-4px) rotate(8deg); }
      74%  { transform: scale(1.28) translateY(-14px) rotate(-6deg); }
      100% { transform: scale(1.18) translateY(0) rotate(0deg); }
    }

    /* Wrong Answer: friendly elastic wobble + soft coral rim pulse */
    .food-plate.is-wrong .plate-rim {
      animation: elasticWobble 0.56s ease-in-out;
      box-shadow:
        0 0 0 5px #ff8573,
        0 0 26px rgba(255, 118, 97, 0.78),
        0 9px 18px rgba(56, 28, 8, 0.32);
    }

    @keyframes elasticWobble {
      0%   { transform: rotate(0deg) scale(1); }
      18%  { transform: rotate(-11deg) scale(0.94); }
      38%  { transform: rotate(10deg) scale(1.04); }
      58%  { transform: rotate(-7deg) scale(0.97); }
      78%  { transform: rotate(5deg) scale(1.01); }
      100% { transform: rotate(0deg) scale(1); }
    }

    /* =====================================================================
       MINIMALIST FLOATING CORNER CONTROLS (TOP-LEFT & TOP-RIGHT ONLY)
       ===================================================================== */
    .corner-btn {
      position: fixed;
      top: 1.8vh;
      z-index: 40;
      border: 4px solid #ffe885;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      box-shadow:
        0 5px 0 rgba(110, 48, 8, 0.55),
        0 10px 20px rgba(40, 18, 4, 0.32),
        inset 0 3px 6px rgba(255, 255, 255, 0.52);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
    }

    .corner-btn:hover {
      transform: scale(1.1);
      box-shadow:
        0 6px 0 rgba(110, 48, 8, 0.55),
        0 0 22px rgba(255, 224, 90, 0.85),
        inset 0 3px 6px rgba(255, 255, 255, 0.65);
    }

    .corner-btn:active {
      transform: translateY(3px) scale(0.95);
      box-shadow: 0 2px 0 rgba(110, 48, 8, 0.55), 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    /* Top-left Language Toggle: ONLY "укр" or "рус" */
    #lang-btn {
      left: 1.2vw;
      min-width: 68px;
      height: 52px;
      padding: 0 14px;
      border-radius: 26px;
      background: linear-gradient(180deg, #ff7d45 0%, #d9411e 100%);
      color: #fffbe0;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(18px, 1.55vw, 24px);
      letter-spacing: 0.4px;
      text-shadow: 0 2px 3px rgba(105, 22, 0, 0.55);
    }

    /* Top-right Next Word Arrow Button (icon only, ZERO text) */
    #next-btn {
      right: 1.2vw;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(180deg, #32cf7c 0%, #149450 100%);
      padding: 11px;
    }

    #next-btn svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 2px 2px rgba(0, 60, 25, 0.5));
    }

    /* =====================================================================
       LAYER 5: FULLSCREEN CELEBRATION PARTICLES CANVAS
       ===================================================================== */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 50;
      pointer-events: none;
    }

    @media (max-aspect-ratio: 4/3) {
      #game-stage {
        padding: 5.5vh 2.8vw 2vh;
        gap: 1vh 1vw;
      }
      .food-plate {
        width: min(16.8vh, 21vw);
        height: min(16.8vh, 21vw);
      }
    }
  </style>
</head>
<body>

  <!-- =====================================================================
       LIVING ANIMATED OUTDOOR BAKERY/CAFÉ TERRACE & PICNIC GARDEN (SVG)
       ===================================================================== -->
  <svg id="scene-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <!-- Warm sunlit summer sky -->
      <linearGradient id="warmSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5ec2ff" />
        <stop offset="46%" stop-color="#a8e6ff" />
        <stop offset="100%" stop-color="#fff0bd" />
      </linearGradient>

      <!-- Glowing sun halo -->
      <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff9b8" stop-opacity="1" />
        <stop offset="48%" stop-color="#ffd24c" stop-opacity="0.72" />
        <stop offset="100%" stop-color="#ffd24c" stop-opacity="0" />
      </radialGradient>

      <!-- Rolling sunny hills -->
      <linearGradient id="sunnyHillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#96e060" />
        <stop offset="100%" stop-color="#56ad39" />
      </linearGradient>
      <linearGradient id="sunnyHillNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#aeee6d" />
        <stop offset="100%" stop-color="#69bf43" />
      </linearGradient>

      <!-- Warm wooden & mosaic picnic terrace tabletop -->
      <linearGradient id="tableWood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f2c482" />
        <stop offset="42%" stop-color="#de9f57" />
        <stop offset="100%" stop-color="#ba7836" />
      </linearGradient>

      <!-- Subtle wooden plank + warm terracotta mosaic pattern -->
      <pattern id="terracePattern" width="120" height="60" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="120" height="28" fill="#f5cc8c" opacity="0.28" />
        <rect x="0" y="30" width="120" height="28" fill="#c7833e" opacity="0.22" />
        <line x1="0" y1="29" x2="120" y2="29" stroke="#a66224" stroke-width="2" opacity="0.28" />
        <line x1="0" y1="59" x2="120" y2="59" stroke="#a66224" stroke-width="2" opacity="0.28" />
        <circle cx="30" cy="14" r="3" fill="#fff0c2" opacity="0.26" />
        <circle cx="90" cy="44" r="3" fill="#fff0c2" opacity="0.22" />
      </pattern>

      <!-- Soft tablecloth runner trim -->
      <pattern id="ginghamTrim" width="32" height="32" patternUnits="userSpaceOnUse">
        <rect width="32" height="32" fill="#ffe6b5" />
        <rect x="0" y="0" width="16" height="16" fill="#ff9d6e" opacity="0.45" />
        <rect x="16" y="16" width="16" height="16" fill="#ff9d6e" opacity="0.45" />
      </pattern>
    </defs>

    <!-- Sky Backdrop -->
    <rect width="1600" height="900" fill="url(#warmSky)" />

    <!-- Animated Glowing Sun -->
    <g>
      <circle cx="1410" cy="130" r="145" fill="url(#sunHalo)" />
      <g class="sun-rays" stroke="#ffdf59" stroke-width="10" stroke-linecap="round" opacity="0.88">
        <line x1="1410" y1="30" x2="1410" y2="56" />
        <line x1="1410" y1="204" x2="1410" y2="230" />
        <line x1="1310" y1="130" x2="1336" y2="130" />
        <line x1="1484" y1="130" x2="1510" y2="130" />
        <line x1="1340" y1="60" x2="1358" y2="78" />
        <line x1="1462" y1="182" x2="1480" y2="200" />
        <line x1="1480" y1="60" x2="1462" y2="78" />

      /* ===================================================================
         2. WEB AUDIO API SOUND ENGINE (5 CHEERFUL MELODIES + CUTE BOING)
         =================================================================== */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.unlocked = false;
        }

        unlock() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          this.unlocked = true;
          return this.ctx;
        }

        playTone(freq, delay, dur, type = 'triangle', vol = 0.18, slideTo = null) {
          const ctx = this.unlock();
          if (!ctx) return;
          const now = ctx.currentTime + delay;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
          }

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.03);
        }

        playVictory(index) {
          const mode = index % 5;
          if (mode === 0) {
            // 1. Marimba arpeggio
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
              this.playTone(f, i * 0.08, 0.28, 'triangle', 0.22);
              this.playTone(f * 2, i * 0.08, 0.12, 'sine', 0.07);
            });
          } else if (mode === 1) {
            // 2. Xylophone sparkle
            [587.33, 739.99, 880.0, 1174.66, 1479.98].forEach((f, i) => {
              this.playTone(f, i * 0.065, 0.24, 'sine', 0.19);
              this.playTone(f * 2.95, i * 0.065, 0.08, 'sine', 0.05);
            });
          } else if (mode === 2) {
            // 3. Happy chime chord
            [523.25, 659.25, 783.99, 987.77, 1318.5].forEach((f, i) => {
              this.playTone(f, i * 0.05, 0.56, 'sine', 0.15);
            });
          } else if (mode === 3) {
            // 4. Playful glockenspiel cascade
            [659.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((f, i) => {
              this.playTone(f, i * 0.07, 0.4, 'sine', 0.16);
              this.playTone(f * 1.5, i * 0.07 + 0.01, 0.18, 'triangle', 0.06);
            });
          } else {
            // 5. Upbeat festive fanfare
            const notes = [
              { f: 523.25, t: 0.0, d: 0.13 },
              { f: 659.25, t: 0.10, d: 0.13 },
              { f: 783.99, t: 0.20, d: 0.13 },
              { f: 1046.5, t: 0.31, d: 0.48 }
            ];
            notes.forEach(n => {
              this.playTone(n.f, n.t, n.d, 'triangle', 0.2);
              this.playTone(n.f * 0.5, n.t, n.d, 'sine', 0.11);
            });
          }
        }

        playWrongBoing() {
          // Cute gentle cartoon boing / soft marimba bonk
          const ctx = this.unlock();
          if (!ctx) return;
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(165, now + 0.09);
          osc.frequency.exponentialRampToValueAtTime(295, now + 0.21);

          gain.gain.setValueAtTime(0.001, now);

          osc.connect(gain);

          osc.start(now);
          osc.stop(now + 0.37);
        }

        playTap() {
          this.playTone(690, 0, 0.08, 'sine', 0.11, 880);
        }
      }

      const sound = new SoundEngine();

      // Unlock Web Audio cleanly on first pointer/touch interaction

      /* ===================================================================
         3. AMBIENT CANVAS (FLOATING GOLDEN LIGHT MOTES)
         =================================================================== */
      const ambientCanvas = document.getElementById('ambient-canvas');
      const ambCtx = ambientCanvas.getContext('2d');
      let motes = [];

      function initMotes() {
        motes = [];
        const colors = ['#fff6b8', '#ffe382', '#ffffff', '#ffd9e8', '#e6ffad'];
        for (let i = 0; i < 28; i++) {
          motes.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: 2.8 + Math.random() * 4.8,
            vx: 0.2 + Math.random() * 0.42,
            vy: -0.22 + Math.random() * 0.36,
            phase: Math.random() * Math.PI * 2,
            color: colors[i % colors.length],
            alpha: 0.32 + Math.random() * 0.45
          });
        }
      }

      function renderAmbient() {
        const w = ambientCanvas.width;
        const h = ambientCanvas.height;
        ambCtx.clearRect(0, 0, w, h);

        for (const m of motes) {
          m.x += m.vx;
          m.y += m.vy + Math.sin(m.phase) * 0.2;
          m.phase += 0.022;

          if (m.x > w + 20) m.x = -20;
          if (m.y > h + 20) m.y = -20;
          if (m.y < -20) m.y = h + 20;

          ambCtx.save();
          ambCtx.translate(m.x, m.y);
          ambCtx.globalAlpha = m.alpha * (0.6 + 0.4 * Math.sin(m.phase * 1.4));
          ambCtx.fillStyle = m.color;
          const s = m.r * 1.15;
          ambCtx.beginPath();
          ambCtx.moveTo(0, -s);
          ambCtx.quadraticCurveTo(0, 0, s, 0);
          ambCtx.quadraticCurveTo(0, 0, 0, s);
          ambCtx.quadraticCurveTo(0, 0, -s, 0);
          ambCtx.quadraticCurveTo(0, 0, 0, -s);
          ambCtx.fill();
          ambCtx.restore();
        }
      }

      /* ===================================================================
         4. CELEBRATION FX CANVAS (6 DIVERSE FULL-SCREEN PARTICLE EFFECTS)
            0: Colorful festive confetti shower
            1: Golden & rainbow star fireworks bursting from clicked plate
            2: Floating iridescent soap bubbles rising across screen
            3: Cheerful colorful balloons floating upward
            4: Spinning blossoms, sparkles, and swirling magic ribbons
            5: Cascading rainbow arcs and glittering hearts/stars
         =================================================================== */

      function drawStar(ctx, r) {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const outer = (i * 2 * Math.PI) / 5 - Math.PI / 2;
          const inner = outer + Math.PI / 5;
          if (i === 0) ctx.moveTo(Math.cos(outer) * r, Math.sin(outer) * r);
          else ctx.lineTo(Math.cos(outer) * r, Math.sin(outer) * r);
          ctx.lineTo(Math.cos(inner) * r * 0.45, Math.sin(inner) * r * 0.45);
        }
        ctx.closePath();
        ctx.fill();
      }

      function drawHeart(ctx, r) {
        ctx.beginPath();
        ctx.moveTo(0, r * 0.35);
        ctx.bezierCurveTo(-r, -r * 0.35, -r * 0.55, -r * 1.15, 0, -r * 0.45);
        ctx.bezierCurveTo(r * 0.55, -r * 1.15, r, -r * 0.35, 0, r * 0.35);
        ctx.closePath();
        ctx.fill();
      }

      function triggerCelebrationFX(originX, originY) {
        const mode = fxModeCounter % 6;
        fxModeCounter++;

              const spd = 3.5 + Math.random() * 9.5;
              fxItems.push({
                kind: 'star',
                x: b.x,
                y: b.y,
                vx: Math.cos(a) * spd,
                vy: Math.sin(a) * spd,
                gravity: 0.08,
                size: 8 + Math.random() * 11,
                rot: Math.random() * Math.PI,
                vRot: (Math.random() - 0.5) * 0.16,
                color: i % 3 === 0 ? '#ffe159' : PALETTE[Math.floor(Math.random() * PALETTE.length)],
                life: 1,
                decay: 0.012 + Math.random() * 0.006
              });
            }
          });
        } else if (mode === 2) {
          // 3. Floating iridescent soap bubbles rising across the screen
          for (let i = 0; i < 38; i++) {
            fxItems.push({
              kind: 'bubble',
              x: Math.random() * w,
              y: h + 30 + Math.random() * 200,
              vx: (Math.random() - 0.5) * 1.4,
              vy: -(3.2 + Math.random() * 4.5),
              size: 14 + Math.random() * 24,
              phase: Math.random() * Math.PI * 2,
              hue: Math.floor(Math.random() * 360),
              life: 1,
              decay: 0.0075
            });
          }
        } else if (mode === 3) {
          // 4. Cheerful colorful balloons floating upward
          for (let i = 0; i < 24; i++) {
            fxItems.push({
              kind: 'balloon',
              x: w * 0.07 + Math.random() * w * 0.86,
              y: h + 40 + Math.random() * 180,
              vx: (Math.random() - 0.5) * 1.3,
              vy: -(4.4 + Math.random() * 4.2),
              size: 22 + Math.random() * 16,
              phase: Math.random() * Math.PI * 2,
              color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
              life: 1,
              decay: 0.007
            });
          }
        } else if (mode === 4) {
          // 5. Spinning blossoms, sparkles, and swirling magic ribbons
          for (let i = 0; i < 64; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 3 + Math.random() * 8.5;
            const kind = i % 3 === 0 ? 'ribbon' : (i % 3 === 1 ? 'flower' : 'star');
            fxItems.push({
              kind,
              x: i < 32 ? originX : w * 0.5,
              y: i < 32 ? originY : h * 0.5,
              vx: Math.cos(a) * spd,
              vy: Math.sin(a) * spd - 2.2,
              gravity: 0.09,
              size: 9 + Math.random() * 9,
              rot: Math.random() * Math.PI * 2,
              vRot: (Math.random() - 0.5) * 0.18,
              phase: Math.random() * Math.PI * 2,
              color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
              life: 1,
              decay: 0.011
            });
          }
        } else {
          // 6. Cascading rainbow arcs and glittering hearts/stars
          fxRainbow = { progress: 0, alpha: 1 };
          for (let i = 0; i < 58; i++) {
            fxItems.push({
              kind: i % 2 === 0 ? 'heart' : 'star',
              x: Math.random() * w,
              y: h * 0.15 + Math.random() * h * 0.65,
              vx: (Math.random() - 0.5) * 2.4,
              vy: -(1.2 + Math.random() * 2.8),
              gravity: 0.03,
              size: 9 + Math.random() * 11,
              rot: (Math.random() - 0.5) * 0.4,
              vRot: (Math.random() - 0.5) * 0.06,
              color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
              life: 1,
              decay: 0.011
            });
          }
        }
      }

      function renderFX() {
        const w = fxCanvas.width;
        const h = fxCanvas.height;
        fxCtx.clearRect(0, 0, w, h);

        // Rainbow Arc
        if (fxRainbow) {
          fxRainbow.progress = Math.min(1, fxRainbow.progress + 0.038);
          if (fxRainbow.progress >= 1) fxRainbow.alpha -= 0.022;
          if (fxRainbow.alpha <= 0) {
            fxRainbow = null;
          } else {
            const colors = ['#ff4d6d', '#ff922b', '#ffd43b', '#51cf66', '#339af0', '#9775fa'];
            const cx = w * 0.5;
            const cy = h * 0.8;
            const baseR = Math.min(w, h) * 0.58;
            fxCtx.save();
            fxCtx.globalAlpha = fxRainbow.alpha * 0.62;
            colors.forEach((col, idx) => {
              fxCtx.beginPath();
              fxCtx.strokeStyle = col;
              fxCtx.lineWidth = Math.max(12, h * 0.022);
              fxCtx.lineCap = 'round';
              fxCtx.arc(cx, cy, baseR - idx * (h * 0.024), Math.PI, Math.PI + Math.PI * fxRainbow.progress);
              fxCtx.stroke();
            });
            fxCtx.restore();
          }
        }

        // Particles
        for (let i = fxItems.length - 1; i >= 0; i--) {
          const p = fxItems[i];
          p.life -= p.decay;
          if (p.life <= 0) {
            fxItems.splice(i, 1);
            continue;
          }

          if (p.kind === 'balloon' || p.kind === 'bubble') {
            p.phase += 0.06;
            p.x += p.vx + Math.sin(p.phase) * 0.95;
            p.y += p.vy;
          } else {
            p.vy += p.gravity || 0;
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.986;
            p.rot = (p.rot || 0) + (p.vRot || 0);
          }

          fxCtx.save();
          fxCtx.translate(p.x, p.y);
          fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.35));

          if (p.kind === 'confetti') {
            fxCtx.rotate(p.rot);
            fxCtx.fillStyle = p.color;
            fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          } else if (p.kind === 'star') {
            fxCtx.rotate(p.rot);
            fxCtx.fillStyle = p.color;
            drawStar(fxCtx, p.size);
          } else if (p.kind === 'heart') {
            fxCtx.rotate(p.rot);
            fxCtx.fillStyle = p.color;
            drawHeart(fxCtx, p.size);
          } else if (p.kind === 'flower') {
            fxCtx.rotate(p.rot);
            fxCtx.fillStyle = p.color;
            for (let k = 0; k < 5; k++) {
              fxCtx.rotate((Math.PI * 2) / 5);
              fxCtx.beginPath();
              fxCtx.ellipse(p.size * 0.55, 0, p.size * 0.45, p.size * 0.28, 0, 0, Math.PI * 2);
              fxCtx.fill();
            }
            fxCtx.fillStyle = '#ffe866';
            fxCtx.beginPath();
            fxCtx.arc(0, 0, p.size * 0.3, 0, Math.PI * 2);
            fxCtx.fill();
          } else if (p.kind === 'ribbon') {
            fxCtx.rotate(p.rot);
            fxCtx.strokeStyle = p.color;
            fxCtx.lineWidth = 4.5;
            fxCtx.lineCap = 'round';
            fxCtx.beginPath();
            fxCtx.moveTo(-p.size * 1.4, 0);
            fxCtx.bezierCurveTo(-p.size * 0.5, -p.size, p.size * 0.5, p.size, p.size * 1.4, 0);
            fxCtx.stroke();
          } else if (p.kind === 'bubble') {
            // Iridescent soap bubble
            const grad = fxCtx.createRadialGradient(-p.size * 0.3, -p.size * 0.3, p.size * 0.1, 0, 0, p.size);
            grad.addColorStop(0, 'rgba(255,255,255,0.85)');
            grad.addColorStop(0.55, `hsla(${p.hue}, 95%, 78%, 0.28)`);
            grad.addColorStop(0.85, `hsla(${(p.hue + 90) % 360}, 95%, 72%, 0.5)`);
            grad.addColorStop(1, 'rgba(255,255,255,0.75)');
            fxCtx.fillStyle = grad;
            fxCtx.beginPath();
            fxCtx.arc(0, 0, p.size, 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.strokeStyle = 'rgba(255,255,255,0.75)';
            fxCtx.lineWidth = 1.8;
            fxCtx.stroke();
            // Shine dot
            fxCtx.fillStyle = 'rgba(255,255,255,0.85)';
            fxCtx.beginPath();
            fxCtx.ellipse(-p.size * 0.32, -p.size * 0.34, p.size * 0.18, p.size * 0.11, -0.6, 0, Math.PI * 2);
            fxCtx.fill();
          } else if (p.kind === 'balloon') {
            fxCtx.strokeStyle = 'rgba(255,255,255,0.78)';
            fxCtx.lineWidth = 2;
            fxCtx.beginPath();
            fxCtx.moveTo(0, p.size * 1.1);
            fxCtx.quadraticCurveTo(6, p.size * 1.7, -4, p.size * 2.3);
            fxCtx.stroke();
            fxCtx.fillStyle = p.color;
            fxCtx.beginPath();
            fxCtx.ellipse(0, 0, p.size * 0.85, p.size * 1.05, 0, 0, Math.PI * 2);
            fxCtx.fill();
            fxCtx.fillStyle = 'rgba(255,255,255,0.45)';
            fxCtx.beginPath();
            fxCtx.ellipse(-p.size * 0.28, -p.size * 0.35, p.size * 0.18, p.size * 0.32, -0.4, 0, Math.PI * 2);
            fxCtx.fill();
          }
          fxCtx.restore();
        }
      }

      /* ===================================================================
         5. ENDLESS SHUFFLE-BAG GENERATOR (NO CONSECUTIVE REPEATS)
         =================================================================== */
      let currentLang = 'uk';
      let bag = [];
      let currentFood = null;
      let isLocked = false;
      let advanceTimer = null;
      let victorySoundIdx = 0;

      const stageEl = document.getElementById('game-stage');
      const signEl = document.getElementById('bistro-sign');
      const wordDisplayEl = document.getElementById('word-display');
      const langBtn = document.getElementById('lang-btn');
      const nextBtn = document.getElementById('next-btn');

      const plateMap = new Map();

      function shuffle(arr) {
        const out = arr.slice();
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      function refillBag() {
        const nextCycle = shuffle(FOODS);
        // Guarantee first word of new cycle never repeats last word of previous cycle
        if (currentFood && nextCycle[0].id === currentFood.id) {
          const swapIdx = 1 + Math.floor(Math.random() * (nextCycle.length - 1));
          [nextCycle[0], nextCycle[swapIdx]] = [nextCycle[swapIdx], nextCycle[0]];
        }
        bag = nextCycle;
      }

      function pullNextFood() {
        if (bag.length === 0) refillBag();
        return bag.shift();
      }

      /* ===================================================================
         6. BUILD 12 COLORFUL CERAMIC FOOD PLATES
         =================================================================== */
      function buildFoodPlates() {
        FOODS.forEach((food, idx) => {
          const slot = GRID_SLOTS[idx];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'food-plate';
          btn.dataset.id = food.id;
          btn.style.gridColumn = String(slot.col);
          btn.style.gridRow = String(slot.row);
          btn.style.setProperty('--rim-grad', food.rimGrad);
          btn.style.setProperty('--well-grad', food.wellGrad);
          btn.style.setProperty('--float-dur', `${3.5 + (idx % 4) * 0.42}s`);
          btn.style.setProperty('--float-delay', `${(idx * 0.25).toFixed(2)}s`);

          btn.innerHTML = `
            <div class="plate-rim">
              <div class="plate-well">${food.svg}</div>
            </div>
          `;

          btn.addEventListener('click', () => handlePlateClick(food, btn));
          stageEl.appendChild(btn);
          plateMap.set(food.id, btn);
        });
      }

      /* ===================================================================
         7. RENDER WORD WITH MISSING VOWEL TILES
         =================================================================== */
      function renderWord(revealed = false) {
        if (!currentFood) return;
        const word = currentFood[currentLang];
        const vowels = currentLang === 'uk' ? UKR_VOWELS : RUS_VOWELS;

        // Adapt font size dynamically for short (СУП, СИР) vs longer (МОРОЖЕНОЕ) words
        const len = word.length;
        let vwSize = 5.4;
        let gapVw = 0.52;
        if (len >= 9) {
          vwSize = 3.8;
          gapVw = 0.34;
        } else if (len >= 7) {
          vwSize = 4.55;
          gapVw = 0.42;
        } else if (len >= 5) {
          vwSize = 5.4;
          gapVw = 0.52;
        } else {
          vwSize = 6.2;
          gapVw = 0.65;
        }

        wordDisplayEl.style.setProperty('--word-size', `clamp(26px, ${vwSize}vw, 86px)`);
        wordDisplayEl.style.setProperty('--letter-gap', `${gapVw}vw`);
        wordDisplayEl.innerHTML = '';

        for (const ch of word) {
          if (vowels.has(ch)) {
            const slot = document.createElement('span');
            slot.className = 'letter-vowel-slot' + (revealed ? ' revealed' : '');
            const span = document.createElement('span');
            span.className = 'vowel-char';
            span.textContent = ch;
            slot.appendChild(span);
            wordDisplayEl.appendChild(slot);
          } else {
            const cons = document.createElement('span');
            cons.className = 'letter-consonant';
            cons.textContent = ch;
            wordDisplayEl.appendChild(cons);
          }
        }
      }

      function loadNextWord() {
        if (advanceTimer) {
          clearTimeout(advanceTimer);
          advanceTimer = null;
        }
        isLocked = false;
        plateMap.forEach(el => el.classList.remove('is-correct', 'is-wrong'));
        signEl.classList.remove('celebrate-glow', 'word-pop');

        currentFood = pullNextFood();
        renderWord(false);

        void signEl.offsetWidth;
        signEl.classList.add('word-pop');
      }

      /* ===================================================================
         8. INTERACTION HANDLERS
         =================================================================== */
      function handlePlateClick(food, btnEl) {
        if (isLocked || !currentFood) return;

        if (food.id === currentFood.id) {
          // CORRECT!
          isLocked = true;
          btnEl.classList.remove('is-wrong');
          btnEl.classList.add('is-correct');
          signEl.classList.add('celebrate-glow');

          // Staggered bouncy reveal of missing vowels
          const vowelSlots = wordDisplayEl.querySelectorAll('.letter-vowel-slot');
          vowelSlots.forEach((slot, i) => {
            setTimeout(() => slot.classList.add('revealed'), i * 80);
          });

          // Trigger 1 of 6 Canvas celebration effects at plate center
          const rect = btnEl.getBoundingClientRect();
          triggerCelebrationFX(rect.left + rect.width / 2, rect.top + rect.height / 2);

          // Play 1 of 5 cheerful synthesized melodies
          sound.playVictory(victorySoundIdx++);

          // Advance automatically after ~1.7 seconds
          advanceTimer = setTimeout(() => {
            loadNextWord();
          }, 1700);
        } else {
          // WRONG: friendly elastic wobble + soft coral rim pulse + cute boing
          btnEl.classList.remove('is-wrong');
          void btnEl.offsetWidth;
          btnEl.classList.add('is-wrong');
          sound.playWrongBoing();
          setTimeout(() => btnEl.classList.remove('is-wrong'), 580);
        }
      }

      // Top-left Language Toggle: "укр" <-> "рус"
      langBtn.addEventListener('click', () => {
        sound.playTap();
        currentLang = currentLang === 'uk' ? 'ru' : 'uk';
        langBtn.textContent = currentLang === 'uk' ? 'укр' : 'рус';
        langBtn.setAttribute('aria-label', langBtn.textContent);
        renderWord(isLocked);
      });

      // Top-right Next Word Arrow Button
      nextBtn.addEventListener('click', () => {
        sound.playTap();
        loadNextWord();
      });

      /* ===================================================================
         9. RESPONSIVE CANVAS RESIZING & ANIMATION LOOP
         =================================================================== */
      function resizeCanvases() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        ambientCanvas.width = w;
        ambientCanvas.height = h;
        fxCanvas.width = w;
        fxCanvas.height = h;
      }

      function animate() {
        renderAmbient();
        renderFX();
        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resizeCanvases);

      window.onload = function () {
        resizeCanvases();
        initMotes();
        buildFoodPlates();
        loadNextWord();
        animate();
      };
    })();
  </script>
</body>
