<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bath Bubbles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #134e5e;
    font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
  }
  canvas {
    display: block; width: 100vw; height: 100vh;
    touch-action: none;
  }

  .hud {
    position: fixed; top: 18px; right: 20px; z-index: 20;
    display: flex; gap: 10px; align-items: center;
  }
  .btn {
    height: 48px; min-width: 48px; padding: 0 15px;
    border: 2.5px solid rgba(190, 242, 255, 0.55);
    border-radius: 26px;
    background: linear-gradient(145deg, rgba(22, 118, 145, 0.88), rgba(13, 71, 94, 0.94));
    color: #e8fbff;
    font-weight: 800; font-size: 16px; letter-spacing: 0.4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    box-shadow: 0 8px 20px rgba(7, 36, 51, 0.42), inset 0 2px 3px rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(8px);
    transition: transform 0.16s cubic-bezier(.34,1.56,.64,1), border-color 0.2s, background 0.2s;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.05);
    border-color: #a5f3fc;
    background: linear-gradient(145deg, rgba(32, 148, 178, 0.95), rgba(16, 92, 120, 0.96));
  }
  .btn:active { transform: scale(0.94); }
  .btn svg {
    width: 22px; height: 22px; fill: none; stroke: currentColor;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }

  .btn-next {
    background: linear-gradient(145deg, #ff9f43, #ee5253);
    color: #fff8eb;
    border-color: rgba(255, 234, 167, 0.8);
  }
  .btn-next:hover {
    background: linear-gradient(145deg, #ffb15e, #ff6b6b);
    border-color: #fff3c4;
  }

  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(8, 35, 48, 0.58);
    backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.22s ease;
  }
  .drawer-backdrop.open { display: flex; opacity: 1; }

  .drawer {
    width: min(690px, 92vw);
    padding: 24px 26px 26px;
    border-radius: 34px;
    background:
      radial-gradient(circle at 12% 14%, rgba(125, 249, 255, 0.22), transparent 45%),
      radial-gradient(circle at 88% 85%, rgba(255, 168, 107, 0.2), transparent 48%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 8px, transparent 8px, transparent 16px),
      linear-gradient(155deg, #125d72 0%, #0d3f52 55%, #092b3a 100%);
    border: 3px solid rgba(165, 243, 252, 0.5);
    box-shadow: 0 26px 65px rgba(4, 20, 30, 0.7), inset 0 2px 14px rgba(186, 242, 255, 0.2);
  }

  .drawer-top {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px; gap: 10px;
  }
  .mode-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill {
    height: 42px; padding: 0 15px; border-radius: 22px;
    border: 2px solid rgba(165, 243, 252, 0.35);
    background: rgba(8, 34, 46, 0.65);
    color: #cffafe; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    font-weight: 800; font-size: 15px;
    transition: all 0.16s ease;
  }
  .pill:hover { border-color: #a5f3fc; transform: translateY(-1px); }
  .pill.active {
    background: linear-gradient(135deg, #22d3ee, #0284c7);
    color: #062230; border-color: #e0f7ff;
    box-shadow: 0 0 16px rgba(34, 211, 238, 0.55);
  }
  .dot-c { width: 12px; height: 12px; border-radius: 50%; background: #ff9f43; display: inline-block; }
  .dot-v { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid #cffafe; display: inline-block; }
  .pill.active .dot-v { border-color: #062230; }
  .pill.active .dot-c { background: #fef08a; }

  .letters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 10px;
  }
  .letter-tile {
    height: 58px;
    border-radius: 20px;
    border: 2px solid rgba(165, 243, 252, 0.32);
    background: linear-gradient(155deg, rgba(20, 108, 134, 0.86), rgba(10, 58, 76, 0.94));
    color: #cffafe;
    font-size: 27px; font-weight: 900;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 12px rgba(4, 22, 32, 0.38), inset 0 2px 3px rgba(255,255,255,0.16);
    transition: transform 0.14s cubic-bezier(.34,1.56,.64,1), background 0.16s, border-color 0.16s;
  }
  .letter-tile:hover { transform: scale(1.08); border-color: #a5f3fc; }
  .letter-tile.selected {
    background: linear-gradient(145deg, #ff9f43, #ee5253);
    color: #fffbeb;
    border-color: #fef08a;
    box-shadow: 0 6px 18px rgba(238, 82, 83, 0.48), inset 0 2px 4px rgba(255,255,255,0.38);
    transform: translateY(-2px);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <button class="btn" id="btnConsonants">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    <span id="consonantPreview">М, С</span>
  </button>
  <button class="btn" id="btnLang">укр</button>
  <button class="btn" id="btnSound">
    <svg id="iconSoundOn" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
    <svg id="iconSoundOff" viewBox="0 0 24 24" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
  </button>
  <button class="btn btn-next" id="btnNext">
    <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>
</div>

<div class="drawer-backdrop" id="drawerBackdrop">
  <div class="drawer">
    <div class="drawer-top">
      <div class="mode-group">
        <button class="pill active" id="modeCV" title="Відкриті (МА)">
          <span class="dot-c"></span><span class="dot-v"></span>
        </button>
        <button class="pill" id="modeVC" title="Закриті (АМ)">
          <span class="dot-v"></span><span class="dot-c"></span>
        </button>
        <button class="pill" id="btnSelectAll">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <button class="pill" id="btnClearOne">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="12" cy="12" r="4"/></svg>
        </button>
      </div>
      <button class="btn" id="btnCloseDrawer" style="height:40px;min-width:40px;padding:0;">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="letters-grid" id="lettersGrid"></div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  // ==================== PROCEDURAL BATHROOM AUDIO ENGINE ====================
  let audioCtx = null;
  let muted = false;

  function ensureAudio() {
    if (muted) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freq, type, duration, gainVal, slideTo = null, delay = 0) {
    const ac = ensureAudio();
    if (!ac) return;
    const now = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(gainVal, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  function playNoiseBurst(duration, filterFreq, gainVal, delay = 0) {
    const ac = ensureAudio();
    if (!ac) return;
    const now = ac.currentTime + delay;
    const bufferSize = Math.floor(ac.sampleRate * duration);
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buffer;
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(filterFreq, now);
    filter.Q.setValueAtTime(1.4, now);
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(gainVal, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ac.destination);
    src.start(now);
  }

  function playBubblePop(reactionId) {
    const base = 360 + Math.random() * 140;
    playTone(base, 'sine', 0.09, 0.28, base * 2.5);
    playNoiseBurst(0.045, 2400, 0.14);

    if (reactionId === 0) {
      playNoiseBurst(0.28, 900, 0.22, 0.05);
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
        playTone(f, 'triangle', 0.22, 0.13, null, 0.06 + i * 0.05)
      );
    } else if (reactionId === 1) {
      playTone(620, 'sawtooth', 0.11, 0.09, 440, 0.06);
      playTone(680, 'sawtooth', 0.13, 0.09, 470, 0.2);
      playTone(880, 'sine', 0.2, 0.12, 1174, 0.34);
    } else if (reactionId === 2) {
      [587.33, 739.99, 880, 1174.66, 987.77].forEach((f, i) =>
        playTone(f, 'sine', 0.18, 0.14, f * 1.04, 0.04 + i * 0.055)
      );
    } else if (reactionId === 3) {
      playNoiseBurst(0.45, 3200, 0.12, 0.04);
      [659.25, 783.99, 987.77, 1318.51, 1567.98].forEach((f, i) =>
        playTone(f, 'sine', 0.32, 0.1, null, 0.06 + i * 0.06)
      );
    } else {
      [440, 554.37, 659.25, 880].forEach((f, i) =>
        playTone(f, 'triangle', 0.28, 0.12, null, 0.05 + i * 0.04)
      );
      playTone(1108.73, 'sine', 0.26, 0.12, 1318.5, 0.22);
    }
  }

  function playBubbleSpawn() {
    playTone(260 + Math.random() * 120, 'sine', 0.11, 0.06, 520 + Math.random() * 140);
  }

  function playHoverTick() {
    playTone(720, 'sine', 0.04, 0.04, 880);
  }

  // ==================== LANGUAGE & INFINITE SYLLABLE GENERATOR ====================
  const LANGS = {
    uk: {
      label: 'укр',
      consonants: ['Б','В','Г','Ґ','Д','Ж','З','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ'],
      closedVowels: ['А','О','У','И','І','Е'],
      validOpenVowels(c) {
        if ('ЖЧШЩҐ'.includes(c)) return ['А','О','У','И','І','Е'];
        return ['А','О','У','И','І','Е','Я','Ю','Є'];
      }
    },
    ru: {
      label: 'рус',
      consonants: ['Б','В','Г','Д','Ж','З','К','Л','М','Н','П','Р','С','Т','Ф','Х','Ц','Ч','Ш','Щ'],
      closedVowels: ['А','О','У','Ы','И','Э'],
      validOpenVowels(c) {
        if ('ЖШЧЩ'.includes(c)) return ['А','О','У','И','Е','Ё'];
        if (c === 'Ц') return ['А','О','У','Ы','Е'];
        if ('ГКХ'.includes(c)) return ['А','О','У','И','Е'];
        return ['А','О','У','Ы','И','Е','Ё','Я','Ю'];
      }
    }
  };

  let currentLang = 'uk';
  let allowCV = true;   // Відкриті склади (МА, СО...)
  let allowVC = false;  // Закриті склади (АМ, ОС...)
  let selectedConsonants = new Set(['М', 'С', 'Л', 'Н']);
  let recentSyllables = [];

  function nextSyllable(excludeList = []) {
    const cfg = LANGS[currentLang];
    const active = [...selectedConsonants].filter(c => cfg.consonants.includes(c));
    if (!active.length) active.push(cfg.consonants[0]);

    const pool = [];
    for (const c of active) {
      if (allowCV) {
        for (const v of cfg.validOpenVowels(c)) pool.push(c + v);
      }
      if (allowVC) {
        for (const v of cfg.closedVowels) pool.push(v + c);
      }
    }

    const candidates = pool.filter(s => !excludeList.includes(s) && !recentSyllables.includes(s));
    const fallback = pool.filter(s => !excludeList.includes(s));
    const src = candidates.length ? candidates : (fallback.length ? fallback : pool);
    const chosen = src[Math.floor(Math.random() * src.length)];

    recentSyllables.push(chosen);
    const maxRecent = Math.max(4, Math.min(14, Math.floor(pool.length * 0.55)));
    if (recentSyllables.length > maxRecent) recentSyllables.shift();
    return chosen;
  }

  // ==================== WORLD STATE ====================
  let W = window.innerWidth, H = window.innerHeight, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let time = 0;
  let mouse = { x: W * 0.5, y: H * 0.35, lastMove: 0 };
  let hoveredBubbleId = null;

  const steamWisps = Array.from({ length: 14 }, () => ({
    x: 0.15 + Math.random() * 0.7,
    y: 0.2 + Math.random() * 0.65,
    r: 35 + Math.random() * 55,
    speed: 0.015 + Math.random() * 0.02,
    phase: Math.random() * Math.PI * 2
  }));

  const ambientBubbles = Array.from({ length: 22 }, () => ({
    x: 0.18 + Math.random() * 0.64,
    y: 0.45 + Math.random() * 0.35,
    r: 4 + Math.random() * 11,
    speed: 0.03 + Math.random() * 0.05,
    phase: Math.random() * Math.PI * 2
  }));

  // Boy Character State (smooth gaze shifting, NO blinking/flickering!)
  const boy = {
    reaction: 'idle',
    reactionTime: 0,
    reactionDuration: 1.55,
    eyeX: 0, eyeY: -0.35,
    gazeTargetIdx: 2,
    gazeSwitchTimer: 2.2,
    smile: 0.35,
    laughOpen: 0,
    bounce: 0,
    leftArmLift: 0,
    rightArmLift: 0,
    headTilt: 0,
    foamCrown: 0,
    lastReactionIdx: -1
  };

  const duck = { jump: 0, spin: 0, quack: 0 };
  const boat = { xOffset: 0, speed: 0 };
  const shower = { active: 0 };
  let faucetDrop = { y: 0, speed: 0 };
  let particles = [];
  let popRings = [];

  const BUBBLE_SLOTS = [
    { rx: 0.18, ry: 0.32 },
    { rx: 0.34, ry: 0.22 },
    { rx: 0.50, ry: 0.19 },
    { rx: 0.67, ry: 0.24 },
    { rx: 0.82, ry: 0.35 }
  ];

  const BUBBLE_TINTS = [
    { rim: '#38bdf8', glow: '#f472b6', inner: 'rgba(14, 116, 144, 0.46)' },
    { rim: '#a78bfa', glow: '#34d399', inner: 'rgba(91, 33, 182, 0.44)' },
    { rim: '#fb7185', glow: '#fde047', inner: 'rgba(159, 18, 57, 0.44)' },
    { rim: '#2dd4bf', glow: '#60a5fa', inner: 'rgba(15, 118, 110, 0.46)' },
    { rim: '#fbbf24', glow: '#f472b6', inner: 'rgba(146, 64, 14, 0.45)' }
  ];

  let bubbles = [];

  function getTubMetrics() {
    const s = Math.max(0.62, Math.min(Math.min(W / 1280, H / 720) * 1.05, 1.3));
    return {
      cx: W * 0.5,
      tubTopY: H * 0.72,
      tubW: Math.min(W * 0.64, 680 * s),
      tubH: 195 * s,
      s
    };
  }

  function createBubbleForSlot(slotIdx, delay = 0) {
    const m = getTubMetrics();
    const slot = BUBBLE_SLOTS[slotIdx];
    const currentTexts = bubbles.map(b => b.text);
    const text = nextSyllable(currentTexts);
    const tint = BUBBLE_TINTS[Math.floor(Math.random() * BUBBLE_TINTS.length)];
    const startX = m.cx + (slot.rx - 0.5) * m.tubW * 0.65;
    const startY = m.tubTopY - 12 * m.s;

    return {
      id: Math.random().toString(36).slice(2),
      slotIdx,
      text,
      tint,
      x: startX,
      y: startY,
      targetRx: slot.rx + (Math.random() - 0.5) * 0.035,
      targetRy: slot.ry + (Math.random() - 0.5) * 0.035,
      radius: 0,
      scale: 0.01,
      riseProgress: -delay,
      phase: Math.random() * Math.PI * 2,
      wobbleFreq: 1.8 + Math.random() * 0.9,
      hover: 0
    };
  }

  function resetAllBubbles(burstOld = false) {
    if (burstOld) {
      bubbles.forEach(b => {
        if (b.riseProgress > 0.1) spawnPopBurst(b.x, b.y, b.tint, 10);
      });
    }
    bubbles = BUBBLE_SLOTS.map((_, idx) => createBubbleForSlot(idx, idx * 0.16));
  }

  function spawnPopBurst(x, y, tint, count = 26) {
    popRings.push({ x, y, r: 22, maxR: 115, alpha: 0.95, color: tint.rim });
    popRings.push({ x, y, r: 10, maxR: 80, alpha: 0.75, color: tint.glow });

    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
      const spd = 2.6 + Math.random() * 7.2;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 1.4,
        r: 3.5 + Math.random() * 6.5,
        color: i % 3 === 0 ? '#ffffff' : (i % 2 === 0 ? tint.rim : tint.glow),
        life: 1,
        decay: 0.018 + Math.random() * 0.016,
        gravity: 0.16,
        kind: i % 4 === 0 ? 'star' : 'drop'
      });
    }
  }

  function triggerBoyReaction() {
    let idx = Math.floor(Math.random() * 5);
    if (idx === boy.lastReactionIdx) idx = (idx + 1) % 5;
    boy.lastReactionIdx = idx;

    const names = ['splash', 'duck', 'cheer', 'rainbow', 'foamhat'];
    boy.reaction = names[idx];
    boy.reactionTime = 0;
    boy.reactionDuration = 1.65;

    playBubblePop(idx);

    const m = getTubMetrics();
    if (idx === 0) {
      for (let i = 0; i < 34; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        particles.push({
          x: m.cx + side * (75 + Math.random() * 55) * m.s,
          y: m.tubTopY - 8 * m.s,
          vx: side * (1.5 + Math.random() * 5.2),
          vy: -(5.5 + Math.random() * 6.5),
          r: 4 + Math.random() * 6,
          color: i % 3 === 0 ? '#e0f7ff' : '#38bdf8',
          life: 1,
          decay: 0.016 + Math.random() * 0.012,
          gravity: 0.24,
          kind: 'drop'
        });
      }
    } else if (idx === 1) {
      duck.jump = 1;
      duck.spin = 1;
      duck.quack = 1;
    } else if (idx === 2) {
      for (let i = 0; i < 22; i++) {
        particles.push({
          x: m.cx + (Math.random() - 0.5) * 200 * m.s,
          y: m.tubTopY - 90 * m.s,
          vx: (Math.random() - 0.5) * 4,
          vy: -(3 + Math.random() * 5),
          r: 5 + Math.random() * 6,
          color: ['#fde047', '#f472b6', '#38bdf8', '#4ade80'][i % 4],
          life: 1,
          decay: 0.014,
          gravity: 0.06,
          kind: 'star'
        });
      }
    } else if (idx === 3) {
      shower.active = 1;
    } else if (idx === 4) {
      boy.foamCrown = 1;
      boat.speed = (Math.random() > 0.5 ? 1 : -1) * 2.8;
    }
  }

  // ==================== DRAWING: COZY LIVING BATHROOM ====================
  function drawBathroomBackground() {
    const wallGrad = ctx.createLinearGradient(0, 0, 0, H);
    wallGrad.addColorStop(0, '#1a758b');
    wallGrad.addColorStop(0.55, '#13576b');
    wallGrad.addColorStop(1, '#0d3d4d');
    ctx.fillStyle = wallGrad;
    ctx.fillRect(0, 0, W, H);

    const tile = Math.max(48, Math.round(W / 24));
    ctx.save();
    ctx.strokeStyle = 'rgba(186, 242, 255, 0.09)';
    ctx.lineWidth = 1.5;
    for (let x = 0; x < W; x += tile) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H * 0.78); ctx.stroke();
    }
    for (let y = 0; y < H * 0.78; y += tile) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    const stripY = H * 0.52;
    ctx.fillStyle = 'rgba(255, 183, 77, 0.18)';
    ctx.fillRect(0, stripY, W, 16);
    for (let x = 0; x < W; x += 28) {
      ctx.fillStyle = (Math.floor(x / 28) % 2 === 0) ? 'rgba(255, 138, 101, 0.35)' : 'rgba(77, 208, 225, 0.32)';
      ctx.fillRect(x + 4, stripY + 3, 20, 10);
    }
    ctx.restore();

    const floorY = H * 0.78;
    const floorGrad = ctx.createLinearGradient(0, floorY, 0, H);
    floorGrad.addColorStop(0, '#164e63');
    floorGrad.addColorStop(1, '#082f49');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, floorY, W, H - floorY);

    const m = getTubMetrics();
    ctx.save();
    ctx.fillStyle = '#e76f51';
    ctx.beginPath();
    ctx.ellipse(m.cx, H * 0.93, m.tubW * 0.36, 26 * m.s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f4a261';
    ctx.lineWidth = 6 * m.s;
    ctx.beginPath();
    ctx.ellipse(m.cx, H * 0.93, m.tubW * 0.29, 19 * m.s, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    drawBathroomWindow(m.s);
    drawBathroomShelf(m.s);
    drawShowerFixture(m);

    ctx.save();
    steamWisps.forEach(w => {
      const sy = ((w.y - time * w.speed) % 0.85 + 0.85) % 0.85;
      const sx = w.x + Math.sin(time * 0.6 + w.phase) * 0.025;
      const px = sx * W, py = sy * H;
      const g = ctx.createRadialGradient(px, py, 2, px, py, w.r);
      g.addColorStop(0, 'rgba(224, 247, 255, 0.075)');
      g.addColorStop(1, 'rgba(224, 247, 255, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, w.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawBathroomWindow(s) {
    const wx = W * 0.09, wy = H * 0.27;
    const ww = 115 * s, wh = 155 * s;
    ctx.save();
    ctx.translate(wx, wy);

    const glow = ctx.createRadialGradient(0, 0, ww * 0.2, 0, 0, ww * 1.9);
    glow.addColorStop(0, 'rgba(254, 240, 138, 0.22)');
    glow.addColorStop(1, 'rgba(254, 240, 138, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, ww * 1.9, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-ww * 0.5, wh * 0.5);
    ctx.lineTo(-ww * 0.5, -wh * 0.15);
    ctx.arc(0, -wh * 0.15, ww * 0.5, Math.PI, 0);
    ctx.lineTo(ww * 0.5, wh * 0.5);
    ctx.closePath();
    const sky = ctx.createLinearGradient(0, -wh * 0.6, 0, wh * 0.5);
    sky.addColorStop(0, '#7dd3fc');
    sky.addColorStop(0.65, '#bae6fd');
    sky.addColorStop(1, '#fef08a');
    ctx.fillStyle = sky;
    ctx.fill();
    ctx.clip();

    const cx = ((time * 8) % (ww * 1.8)) - ww * 0.9;
    ctx.fillStyle = 'rgba(255, 250, 235, 0.72)';
    ctx.beginPath();
    ctx.arc(cx, -wh * 0.18, 22 * s, 0, Math.PI * 2);
    ctx.arc(cx + 18 * s, -wh * 0.22, 18 * s, 0, Math.PI * 2);
    ctx.arc(cx - 18 * s, -wh * 0.16, 15 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = '#0e495c';
    ctx.lineWidth = 8 * s;
    ctx.beginPath();
    ctx.moveTo(-ww * 0.5, wh * 0.5);
    ctx.lineTo(-ww * 0.5, -wh * 0.15);
    ctx.arc(0, -wh * 0.15, ww * 0.5, Math.PI, 0);
    ctx.lineTo(ww * 0.5, wh * 0.5);
    ctx.closePath();
    ctx.stroke();

    ctx.lineWidth = 4 * s;
    ctx.beginPath();
    ctx.moveTo(0, -wh * 0.65); ctx.lineTo(0, wh * 0.5);
    ctx.moveTo(-ww * 0.5, wh * 0.08); ctx.lineTo(ww * 0.5, wh * 0.08);
    ctx.stroke();

    ctx.fillStyle = '#c27849';
    ctx.beginPath();
    ctx.roundRect(-ww * 0.6, wh * 0.48, ww * 1.2, 14 * s, 6 * s);
    ctx.fill();

    ctx.fillStyle = '#e07a5f';
    ctx.beginPath();
    ctx.moveTo(ww * 0.12, wh * 0.48);
    ctx.lineTo(ww * 0.38, wh * 0.48);
    ctx.lineTo(ww * 0.43, wh * 0.26);
    ctx.lineTo(ww * 0.07, wh * 0.26);
    ctx.closePath();
    ctx.fill();
    const sway = Math.sin(time * 1.3) * 0.12;
    ctx.fillStyle = '#34d399';
    [-0.5, 0, 0.55].forEach(a => {
      ctx.save();
      ctx.translate(ww * 0.25, wh * 0.27);
      ctx.rotate(a + sway);
      ctx.beginPath();
      ctx.ellipse(0, -18 * s, 7 * s, 20 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    ctx.restore();
  }

  function drawBathroomShelf(s) {
    const sx = W * 0.90, sy = H * 0.57;
    ctx.save();
    ctx.translate(sx, sy);

    ctx.fillStyle = '#9c5a32';
    ctx.beginPath();
    ctx.roundRect(-78 * s, 0, 156 * s, 14 * s, 6 * s);
    ctx.fill();
    ctx.fillStyle = '#c27849';
    ctx.beginPath();
    ctx.roundRect(-78 * s, 0, 156 * s, 6 * s, 4 * s);
    ctx.fill();

    ctx.fillStyle = '#fb7185';
    ctx.beginPath(); ctx.roundRect(-62 * s, -48 * s, 28 * s, 48 * s, 10 * s); ctx.fill();
    ctx.fillStyle = '#fde047';
    ctx.fillRect(-53 * s, -58 * s, 10 * s, 10 * s);

    ctx.fillStyle = '#2dd4bf';
    ctx.beginPath(); ctx.roundRect(-26 * s, -58 * s, 26 * s, 58 * s, 10 * s); ctx.fill();
    ctx.fillStyle = '#0f766e';
    ctx.fillRect(-18 * s, -67 * s, 10 * s, 9 * s);

    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.roundRect(12 * s, -34 * s, 54 * s, 34 * s, 14 * s); ctx.fill();
    ctx.strokeStyle = '#fef3c7';
    ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.arc(54 * s, -17 * s, 11 * s, 0, Math.PI * 2); ctx.stroke();

    ctx.restore();
  }

  function drawShowerFixture(m) {
    const s = m.s;
    const baseX = m.cx - m.tubW * 0.44;
    const baseY = m.tubTopY;
    ctx.save();

    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 10 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(baseX, baseY + 6 * s);
    ctx.lineTo(baseX, baseY - 220 * s);
    ctx.quadraticCurveTo(baseX, baseY - 265 * s, baseX + 55 * s, baseY - 250 * s);
    ctx.stroke();

    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 3.5 * s;
    ctx.beginPath();
    ctx.moveTo(baseX - 2 * s, baseY);
    ctx.lineTo(baseX - 2 * s, baseY - 220 * s);
    ctx.quadraticCurveTo(baseX - 2 * s, baseY - 260 * s, baseX + 50 * s, baseY - 248 * s);
    ctx.stroke();

    ctx.save();
    ctx.translate(baseX + 58 * s, baseY - 248 * s);
    ctx.rotate(0.55);
    const hg = ctx.createLinearGradient(-16 * s, 0, 16 * s, 0);
    hg.addColorStop(0, '#64748b');
    hg.addColorStop(0.5, '#f1f5f9');
    hg.addColorStop(1, '#475569');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(-8 * s, -10 * s);
    ctx.lineTo(8 * s, -10 * s);
    ctx.lineTo(22 * s, 14 * s);
    ctx.lineTo(-22 * s, 14 * s);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (shower.active > 0.02) {
      const sx = baseX + 68 * s, sy = baseY - 236 * s;
      const colors = ['#ff595e', '#ffca3a', '#8ac926', '#38bdf8', '#c084fc'];
      colors.forEach((col, i) => {
        ctx.strokeStyle = col;
        ctx.globalAlpha = shower.active * 0.55;
        ctx.lineWidth = 4.5 * s;
        ctx.setLineDash([12 * s, 10 * s]);
        ctx.lineDashOffset = -time * 180 - i * 14;
        ctx.beginPath();
        ctx.moveTo(sx + (i - 2) * 5 * s, sy);
        ctx.quadraticCurveTo(
          sx + (70 + i * 16) * s, sy + 75 * s,
          sx + (115 + i * 24) * s, baseY - 12 * s
        );
        ctx.stroke();
      });
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath();
    ctx.moveTo(baseX + 4 * s, baseY - 18 * s);
    ctx.quadraticCurveTo(baseX + 38 * s, baseY - 26 * s, baseX + 44 * s, baseY - 4 * s);
    ctx.lineTo(baseX + 32 * s, baseY - 4 * s);
    ctx.quadraticCurveTo(baseX + 26 * s, baseY - 12 * s, baseX + 4 * s, baseY - 8 * s);
    ctx.closePath();
    ctx.fill();

    if (faucetDrop.y > 0) {
      ctx.fillStyle = '#7dd3fc';
      ctx.beginPath();
      ctx.arc(baseX + 38 * s, baseY - 2 * s + faucetDrop.y * s, 3.8 * s, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // ==================== DRAWING: EXPRESSIVE REALISTIC BOY IN TUB ====================
  function drawBoyAndTub() {
    const m = getTubMetrics();
    const s = m.s;
    const cx = m.cx;
    const ty = m.tubTopY;

    // 1. Back rim & water surface
    ctx.save();
    ctx.fillStyle = '#0e7490';
    ctx.beginPath();
    ctx.ellipse(cx, ty, m.tubW * 0.5, 24 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#22d3ee';
    ctx.beginPath();
    ctx.ellipse(cx, ty + 3 * s, m.tubW * 0.46, 18 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 2. Back foam layer
    drawFoamPuffs(cx, ty - 6 * s, m.tubW * 0.44, 11, s, '#d8f3ff', '#bae6fd', 0.5);

    // 3. The Boy (full torso extending deep into tub so bouncing NEVER shows a cut-off edge!)
    drawBoy(cx, ty - 4 * s, s);

    // 4. Rubber Duck & Toy Boat
    drawRubberDuck(cx + m.tubW * 0.30, ty - 14 * s, s);
    drawToyBoat(cx - m.tubW * 0.28 + boat.xOffset * s, ty - 10 * s, s);

    // 5. Front rich soap foam overlapping boy's chest & water line
    drawFoamPuffs(cx, ty + 4 * s, m.tubW * 0.47, 16, s, '#e0f7ff', '#93c5fd', 1.2);

    // 6. Stylized Turquoise Clawfoot Bathtub Body (covers lower torso completely)
    ctx.save();
    const tubGrad = ctx.createLinearGradient(cx - m.tubW * 0.5, ty, cx + m.tubW * 0.5, ty + m.tubH);
    tubGrad.addColorStop(0, '#38bdf8');
    tubGrad.addColorStop(0.35, '#0ea5e9');
    tubGrad.addColorStop(0.75, '#0284c7');
    tubGrad.addColorStop(1, '#0369a1');

    ctx.fillStyle = '#d97706';
    [-0.35, 0.35].forEach(side => {
      const fx = cx + side * m.tubW;
      const fy = ty + m.tubH * 0.86;
      ctx.beginPath();
      ctx.ellipse(fx, fy + 16 * s, 20 * s, 11 * s, side * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(fx + side * 8 * s, fy + 20 * s, 7 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#d97706';
    });

    ctx.fillStyle = tubGrad;
    ctx.beginPath();
    ctx.moveTo(cx - m.tubW * 0.5, ty);
    ctx.bezierCurveTo(
      cx - m.tubW * 0.48, ty + m.tubH * 0.96,
      cx - m.tubW * 0.25, ty + m.tubH,
      cx, ty + m.tubH
    );
    ctx.bezierCurveTo(
      cx + m.tubW * 0.25, ty + m.tubH,
      cx + m.tubW * 0.48, ty + m.tubH * 0.96,
      cx + m.tubW * 0.5, ty
    );
    ctx.closePath();
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(224, 247, 255, 0.28)';
    ctx.lineWidth = 10 * s;
    ctx.beginPath();
    for (let x = cx - m.tubW * 0.55; x <= cx + m.tubW * 0.55; x += 24 * s) {
      const wy = ty + m.tubH * 0.52 + Math.sin(x * 0.04) * 10 * s;
      if (x === cx - m.tubW * 0.55) ctx.moveTo(x, wy);
      else ctx.lineTo(x, wy);
    }
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
    ctx.beginPath();
    ctx.ellipse(cx - m.tubW * 0.2, ty + m.tubH * 0.35, m.tubW * 0.16, m.tubH * 0.22, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const rimGrad = ctx.createLinearGradient(0, ty - 12 * s, 0, ty + 18 * s);
    rimGrad.addColorStop(0, '#bae6fd');
    rimGrad.addColorStop(0.5, '#38bdf8');
    rimGrad.addColorStop(1, '#0369a1');
    ctx.strokeStyle = rimGrad;
    ctx.lineWidth = 18 * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - m.tubW * 0.5, ty + 2 * s);
    ctx.quadraticCurveTo(cx, ty + 22 * s, cx + m.tubW * 0.5, ty + 2 * s);
    ctx.stroke();

    drawFoamDrip(cx - m.tubW * 0.18, ty + 12 * s, 18 * s, 26 * s);
    drawFoamDrip(cx + m.tubW * 0.22, ty + 10 * s, 14 * s, 20 * s);

    ctx.restore();
  }

  function drawFoamDrip(x, y, w, h) {
    ctx.fillStyle = '#dcf4ff';
    ctx.beginPath();
    ctx.arc(x, y, w * 0.65, 0, Math.PI * 2);
    ctx.arc(x - w * 0.4, y + h * 0.25, w * 0.42, 0, Math.PI * 2);
    ctx.arc(x + w * 0.35, y + h * 0.45, w * 0.38, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFoamPuffs(cx, cy, halfW, count, s, lightCol, shadowCol, phaseShift) {
    ctx.save();
    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0.5 : i / (count - 1);
      const px = cx + (t - 0.5) * 2 * halfW;
      const py = cy + Math.sin(t * Math.PI * 3 + time * 1.4 + phaseShift) * 4 * s;
      const r = (22 + Math.sin(i * 2.1 + phaseShift) * 8) * s;

      const g = ctx.createRadialGradient(px - r * 0.3, py - r * 0.35, r * 0.1, px, py, r);
      g.addColorStop(0, lightCol);
      g.addColorStop(0.75, '#c8eeff');
      g.addColorStop(1, shadowCol);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBoy(cx, cy, s) {
    const bob = Math.sin(time * 2.3) * 3.5 * s - boy.bounce * 22 * s;
    const tilt = boy.headTilt;

    ctx.save();
    ctx.translate(cx, cy + bob);
    ctx.scale(s, s);

    const skinGrad = ctx.createRadialGradient(-12, -108, 12, 0, -90, 80);
    skinGrad.addColorStop(0, '#ffdfc4');
    skinGrad.addColorStop(0.65, '#f6c39d');
    skinGrad.addColorStop(1, '#de9e74');

    const torsoGrad = ctx.createRadialGradient(-16, -24, 10, 0, 12, 95);
    torsoGrad.addColorStop(0, '#ffdfc4');
    torsoGrad.addColorStop(0.55, '#f4be96');
    torsoGrad.addColorStop(1, '#d8956a');

    // 1. Complete, deep torso & shoulders (extends seamlessly down to +85 inside the tub!)
    ctx.fillStyle = torsoGrad;
    ctx.beginPath();
    ctx.moveTo(-64, 85);
    ctx.lineTo(-64, -12);
    ctx.bezierCurveTo(-64, -46, -34, -56, 0, -56);
    ctx.bezierCurveTo(34, -56, 64, -46, 64, -12);
    ctx.lineTo(64, 85);
    ctx.closePath();
    ctx.fill();

    // Subtle collarbone shading for realism
    ctx.strokeStyle = 'rgba(180, 110, 72, 0.25)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-26, -34); ctx.quadraticCurveTo(-12, -29, -4, -33);
    ctx.moveTo(26, -34); ctx.quadraticCurveTo(12, -29, 4, -33);
    ctx.stroke();

    // Neck
    ctx.fillStyle = '#e4a77f';
    ctx.beginPath();
    ctx.roundRect(-15, -66, 30, 32, 10);
    ctx.fill();

    // 2. Articulated Arms & Hands
    drawBoyArm(-56, -24, -1, boy.leftArmLift, boy.reaction === 'cheer');
    drawBoyArm(56, -24, 1, boy.rightArmLift, boy.reaction === 'cheer');

    // 3. Head Group
    ctx.save();
    ctx.translate(0, -54);
    ctx.rotate(tilt);

    // Ears
    [-52, 52].forEach(ex => {
      ctx.fillStyle = '#efb38a';
      ctx.beginPath(); ctx.ellipse(ex, -46, 11, 15, ex < 0 ? -0.15 : 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d89368';
      ctx.beginPath(); ctx.ellipse(ex + (ex < 0 ? 2 : -2), -46, 5, 8, 0, 0, Math.PI * 2); ctx.fill();
    });

    // Head contour
    ctx.fillStyle = skinGrad;
    ctx.beginPath();
    ctx.ellipse(0, -52, 54, 58, 0, 0, Math.PI * 2);
    ctx.fill();

    // Warm rosy bath cheeks
    const blushAlpha = 0.34 + boy.smile * 0.24;
    [-30, 30].forEach(bx => {
      const bg = ctx.createRadialGradient(bx, -31, 2, bx, -31, 16);
      bg.addColorStop(0, `rgba(255, 118, 117, ${blushAlpha})`);
      bg.addColorStop(1, 'rgba(255, 118, 117, 0)');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(bx, -31, 16, 0, Math.PI * 2); ctx.fill();
    });

    // Expressive Realistic Eyes (NO blinking/flickering — smooth gaze tracking only!)
    [-21, 21].forEach(ex => {
      const ey = -52;

      // Sclera
      ctx.fillStyle = '#fffaf5';
      ctx.beginPath();
      ctx.ellipse(ex, ey, 11.8, 12.6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Clip iris/pupil neatly inside eye opening
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(ex, ey, 11.4, 12.2, 0, 0, Math.PI * 2);
      ctx.clip();

      const ix = ex + boy.eyeX * 4.8;
      const iy = ey + boy.eyeY * 4.4;

      const irisG = ctx.createRadialGradient(ix, iy, 1, ix, iy, 7.6);
      irisG.addColorStop(0, '#38bdf8');
      irisG.addColorStop(0.7, '#0369a1');
      irisG.addColorStop(1, '#0c4a6e');
      ctx.fillStyle = irisG;
      ctx.beginPath(); ctx.arc(ix, iy, 7.4, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(ix, iy, 3.8, 0, Math.PI * 2); ctx.fill();

      // Bright twin catchlights
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ix - 2.3, iy - 2.3, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ix + 2.1, iy + 1.8, 1.1, 0, Math.PI * 2); ctx.fill();

      ctx.restore();

      // Upper lash line
      ctx.strokeStyle = '#3b2416';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(ex, ey + 2, 12.2, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();

      // Expressive eyebrows
      const browLift = boy.smile * 4.2 + boy.laughOpen * 3;
      ctx.strokeStyle = '#5c3a21';
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ex - 9, ey - 17 - browLift);
      ctx.quadraticCurveTo(ex, ey - 21 - browLift, ex + 9, ey - 16 - browLift);
      ctx.stroke();
    });

    // Cute button nose
    ctx.strokeStyle = '#c8855b';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, -37, 4.5, 0.25, Math.PI - 0.25);
    ctx.stroke();

    // Expressive Mouth
    const mouthY = -20;
    if (boy.laughOpen > 0.12) {
      const mw = 17 + boy.laughOpen * 9;
      const mh = 8 + boy.laughOpen * 14;
      ctx.fillStyle = '#9f1239';
      ctx.beginPath();
      ctx.moveTo(-mw, mouthY - 2);
      ctx.quadraticCurveTo(0, mouthY + 2, mw, mouthY - 2);
      ctx.quadraticCurveTo(0, mouthY + mh * 1.65, -mw, mouthY - 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fb7185';
      ctx.beginPath();
      ctx.ellipse(0, mouthY + mh * 0.85, mw * 0.55, mh * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fffbeb';
      ctx.beginPath();
      ctx.roundRect(-mw * 0.62, mouthY - 1, mw * 1.24, 5, 2.5);
      ctx.fill();
    } else {
      const curve = 8 + boy.smile * 10;
      ctx.strokeStyle = '#8c3b2b';
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-15, mouthY - 1);
      ctx.quadraticCurveTo(0, mouthY + curve, 15, mouthY - 1);
      ctx.stroke();
    }

    // Wet Tousled Chestnut Hair
    const hairGrad = ctx.createLinearGradient(0, -120, 0, -55);
    hairGrad.addColorStop(0, '#7c4d2b');
    hairGrad.addColorStop(0.6, '#593319');
    hairGrad.addColorStop(1, '#3b200e');
    ctx.fillStyle = hairGrad;
    ctx.beginPath();
    ctx.moveTo(-53, -58);
    ctx.bezierCurveTo(-60, -104, -22, -122, 6, -118);
    ctx.bezierCurveTo(38, -116, 60, -96, 53, -56);
    ctx.quadraticCurveTo(44, -84, 24, -86);
    ctx.quadraticCurveTo(8, -74, -8, -86);
    ctx.quadraticCurveTo(-30, -84, -44, -74);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-12, -114);
    ctx.quadraticCurveTo(-24, -132, -4, -124);
    ctx.quadraticCurveTo(10, -135, 18, -116);
    ctx.fill();

    // Cute soap foam tuft / crown on hair
    const crownScale = 0.55 + boy.foamCrown * 1.15;
    ctx.save();
    ctx.translate(10, -112);
    ctx.scale(crownScale, crownScale);
    const puffs = [[-16, 2, 14], [0, -8, 18], [16, 2, 14], [-6, -18, 12], [9, -16, 11]];
    puffs.forEach(([px, py, pr]) => {
      const pg = ctx.createRadialGradient(px - 3, py - 3, 2, px, py, pr);
      pg.addColorStop(0, '#ffffff');
      pg.addColorStop(1, '#bae6fd');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();

    ctx.restore();
    ctx.restore();
  }

  function drawBoyArm(x, y, side, lift, clapping) {
    ctx.save();
    ctx.translate(x, y);
    const clapOffset = clapping ? Math.sin(time * 26) * 0.28 * side : 0;
    const baseAngle = side * (0.45 - lift * 1.15) + clapOffset;
    ctx.rotate(baseAngle);

    ctx.strokeStyle = '#f2ba92';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(side * 16, -14 - lift * 22, side * 12, -36 - lift * 28);
    ctx.stroke();

    const hx = side * 12, hy = -40 - lift * 28;
    ctx.fillStyle = '#f8c8a4';
    ctx.beginPath();
    ctx.arc(hx, hy, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(hx - side * 10, hy + 2, 6, 4, side * 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawRubberDuck(x, y, s) {
    const bob = Math.sin(time * 2.8 + 1) * 4 * s;
    const jumpY = Math.sin(duck.jump * Math.PI) * 58 * s;
    const rot = Math.sin(time * 2.1) * 0.08 + duck.spin * Math.PI * 2;

    ctx.save();
    ctx.translate(x, y + bob - jumpY);
    ctx.scale(s, s);
    ctx.rotate(rot);

    const dg = ctx.createRadialGradient(-8, -8, 4, 0, 0, 32);
    dg.addColorStop(0, '#fef08a');
    dg.addColorStop(0.55, '#facc15');
    dg.addColorStop(1, '#ca8a04');
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.ellipse(0, 4, 28, 19, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(20, 0); ctx.lineTo(32, -10); ctx.lineTo(26, 8); ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(-14, -14, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#eab308';
    ctx.beginPath();
    ctx.ellipse(4, 5, 13, 8, -0.2, 0, Math.PI * 2);
    ctx.fill();

    const q = Math.sin(duck.quack * Math.PI * 3) * 0.35;
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.moveTo(-26, -15);
    ctx.lineTo(-40, -13 - Math.abs(q) * 6);
    ctx.lineTo(-27, -9);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-26, -10);
    ctx.lineTo(-38, -7 + Math.abs(q) * 6);
    ctx.lineTo(-26, -5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(-19, -17, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-20, -18, 1.2, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function drawToyBoat(x, y, s) {
    const bob = Math.sin(time * 2.5 + 2.2) * 3.5 * s;
    const rock = Math.sin(time * 2.2) * 0.09;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(s, s);
    ctx.rotate(rock);

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(-30, 0);
    ctx.lineTo(30, 0);
    ctx.lineTo(20, 14);
    ctx.lineTo(-20, 14);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(-24, 3, 48, 3);

    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -34); ctx.stroke();

    ctx.fillStyle = '#fb923c';
    ctx.beginPath();
    ctx.moveTo(2, -32);
    ctx.lineTo(24, -6);
    ctx.lineTo(2, -6);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(-2, -28);
    ctx.lineTo(-18, -6);
    ctx.lineTo(-2, -6);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // ==================== DRAWING: IRIDESCENT SOAP BUBBLES & LARGE SYLLABLES ====================
  function drawAmbientMiniBubbles() {
    ctx.save();
    ambientBubbles.forEach(b => {
      const py = ((b.y - time * b.speed) % 0.72 + 0.72) % 0.72;
      const px = b.x * W + Math.sin(time * 1.6 + b.phase) * 14;
      const yPos = py * H;
      ctx.strokeStyle = 'rgba(224, 247, 255, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, yPos, b.r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath(); ctx.arc(px - b.r * 0.32, yPos - b.r * 0.32, b.r * 0.25, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  function drawSyllableBubbles() {
    const baseR = Math.max(58, Math.min(W, H) * 0.102);

    bubbles.forEach(b => {
      if (b.riseProgress < 0) return;
      b.radius = baseR;

      const sc = b.scale * (1 + b.hover * 0.11);
      if (sc <= 0.03) return;

      const wobX = 1 + Math.sin(time * b.wobbleFreq + b.phase) * 0.032;
      const wobY = 1 - Math.sin(time * b.wobbleFreq + b.phase) * 0.032;

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(sc * wobX, sc * wobY);

      if (b.hover > 0.02) {
        const hg = ctx.createRadialGradient(0, 0, baseR * 0.7, 0, 0, baseR * 1.42);
        hg.addColorStop(0, `rgba(255, 255, 255, ${0.34 * b.hover})`);
        hg.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(0, 0, baseR * 1.42, 0, Math.PI * 2); ctx.fill();
      }

      const bg = ctx.createRadialGradient(-baseR * 0.25, -baseR * 0.28, baseR * 0.08, 0, 0, baseR);
      bg.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
      bg.addColorStop(0.55, b.tint.inner);
      bg.addColorStop(0.88, b.tint.rim + '88');
      bg.addColorStop(1, b.tint.glow + 'cc');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(0, 0, baseR, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 4;
      ctx.strokeStyle = b.tint.rim;
      ctx.beginPath();
      ctx.arc(0, 0, baseR - 1.5, -Math.PI * 0.85, Math.PI * 0.15);
      ctx.stroke();

      ctx.strokeStyle = b.tint.glow;
      ctx.beginPath();
      ctx.arc(0, 0, baseR - 1.5, Math.PI * 0.15, Math.PI * 1.15);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.beginPath();
      ctx.ellipse(-baseR * 0.38, -baseR * 0.42, baseR * 0.26, baseR * 0.12, -0.65, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.26)';
      ctx.beginPath();
      ctx.ellipse(baseR * 0.36, baseR * 0.44, baseR * 0.16, baseR * 0.07, -0.65, 0, Math.PI * 2);
      ctx.fill();

      const fontSize = Math.round(baseR * 0.92);
      ctx.font = `900 ${fontSize}px 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.lineWidth = Math.max(6, baseR * 0.125);
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(7, 30, 46, 0.9)';
      ctx.strokeText(b.text, 0, 3);

      const tg = ctx.createLinearGradient(0, -fontSize * 0.45, 0, fontSize * 0.45);
      tg.addColorStop(0, '#ffffff');
      tg.addColorStop(1, '#fef9c3');
      ctx.fillStyle = tg;
      ctx.fillText(b.text, 0, 3);

      ctx.restore();
    });
  }

  function drawFX() {
    popRings.forEach(r => {
      ctx.save();
      ctx.globalAlpha = r.alpha;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 4 * r.alpha;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });

    particles.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      if (p.kind === 'star') {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
          const b = a + Math.PI / 5;
          ctx.lineTo(Math.cos(a) * p.r * 1.4, Math.sin(a) * p.r * 1.4);
          ctx.lineTo(Math.cos(b) * p.r * 0.55, Math.sin(b) * p.r * 0.55);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.beginPath();
        ctx.arc(-p.r * 0.3, -p.r * 0.3, p.r * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
  }

  // ==================== SIMULATION UPDATE ====================
  let lastTs = 0;
  function update(dt) {
    time += dt;
    const m = getTubMetrics();

    faucetDrop.speed += 180 * dt;
    faucetDrop.y += faucetDrop.speed * dt;
    if (faucetDrop.y > 46) {
      faucetDrop.y = -Math.random() * 140;
      faucetDrop.speed = 0;
    }

    // Smooth gaze shifting: tracks cursor when active, or gently glances at floating bubbles
    const headX = m.cx, headY = m.tubTopY - 104 * m.s;
    let lookX = mouse.x, lookY = mouse.y;

    if (time - mouse.lastMove > 2.0 && bubbles.length > 0) {
      boy.gazeSwitchTimer -= dt;
      if (boy.gazeSwitchTimer <= 0) {
        boy.gazeTargetIdx = Math.floor(Math.random() * bubbles.length);
        boy.gazeSwitchTimer = 1.8 + Math.random() * 1.8;
      }
      const targetB = bubbles[boy.gazeTargetIdx];
      if (targetB && targetB.riseProgress > 0.2) {
        lookX = targetB.x;
        lookY = targetB.y;
      }
    }

    const ang = Math.atan2(lookY - headY, lookX - headX);
    const dist = Math.min(1, Math.hypot(lookX - headX, lookY - headY) / 230);
    boy.eyeX += (Math.cos(ang) * dist - boy.eyeX) * Math.min(1, dt * 7.5);
    boy.eyeY += (Math.sin(ang) * dist - boy.eyeY) * Math.min(1, dt * 7.5);

    // Boy Joyful Reaction Animations
    if (boy.reaction !== 'idle') {
      boy.reactionTime += dt;
      const p = Math.min(1, boy.reactionTime / boy.reactionDuration);
      const env = Math.sin(p * Math.PI);

      boy.smile = 0.45 + 0.55 * env;
      boy.laughOpen = env;
      boy.bounce = Math.abs(Math.sin(p * Math.PI * 3)) * (1 - p * 0.4);
      boy.headTilt = Math.sin(p * Math.PI * 4) * 0.14 * env;

      if (boy.reaction === 'splash') {
        boy.leftArmLift = Math.abs(Math.sin(p * Math.PI * 5)) * 0.7;
        boy.rightArmLift = Math.abs(Math.cos(p * Math.PI * 5)) * 0.7;
      } else if (boy.reaction === 'cheer' || boy.reaction === 'rainbow') {
        boy.leftArmLift = env * 1.1;
        boy.rightArmLift = env * 1.1;
      } else if (boy.reaction === 'duck') {
        boy.rightArmLift = env * 0.95;
        boy.leftArmLift = env * 0.35;
      } else {
        boy.leftArmLift = env * 0.85;
        boy.rightArmLift = env * 0.85;
      }

      if (p >= 1) {
        boy.reaction = 'idle';
        boy.laughOpen = 0;
        boy.bounce = 0;
        boy.headTilt = 0;
      }
    } else {
      boy.smile += ((hoveredBubbleId ? 0.68 : 0.35) - boy.smile) * Math.min(1, dt * 6);
      boy.leftArmLift += (0.05 - boy.leftArmLift) * Math.min(1, dt * 6);
      boy.rightArmLift += (0.05 - boy.rightArmLift) * Math.min(1, dt * 6);
      boy.headTilt += (0 - boy.headTilt) * Math.min(1, dt * 6);
    }

    boy.foamCrown = Math.max(0, boy.foamCrown - dt * 0.38);
    duck.jump = Math.max(0, duck.jump - dt * 1.05);
    duck.spin = Math.max(0, duck.spin - dt * 1.05);
    duck.quack = Math.max(0, duck.quack - dt * 1.2);
    shower.active = Math.max(0, shower.active - dt * 0.6);

    boat.xOffset += boat.speed;
    boat.speed *= 0.965;
    if (boat.xOffset > 60) { boat.xOffset = 60; boat.speed *= -0.7; }
    if (boat.xOffset < -45) { boat.xOffset = -45; boat.speed *= -0.7; }

    bubbles.forEach(b => {
      const prev = b.riseProgress;
      b.riseProgress = Math.min(1, b.riseProgress + dt * 0.95);
      if (prev < 0 && b.riseProgress >= 0) playBubbleSpawn();
      if (b.riseProgress < 0) return;

      const ease = 1 - Math.pow(1 - b.riseProgress, 3);
      const startX = m.cx + (b.targetRx - 0.5) * m.tubW * 0.62;
      const startY = m.tubTopY - 12 * m.s;
      const floatX = Math.sin(time * 1.15 + b.phase) * 14;
      const floatY = Math.cos(time * 0.95 + b.phase) * 11;

      b.x = startX + (b.targetRx * W - startX) * ease + floatX * ease;
      b.y = startY + (b.targetRy * H - startY) * ease + floatY * ease;
      b.scale = ease;

      const isHov = b.id === hoveredBubbleId && b.riseProgress > 0.35;
      b.hover += ((isHov ? 1 : 0) - b.hover) * Math.min(1, dt * 12);
    });

    popRings.forEach(r => {
      r.r += (r.maxR - r.r) * Math.min(1, dt * 10);
      r.alpha -= dt * 2.4;
    });
    popRings = popRings.filter(r => r.alpha > 0.02);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function render(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
    lastTs = ts;
    update(dt);

    ctx.clearRect(0, 0, W, H);
    drawBathroomBackground();
    drawAmbientMiniBubbles();
    drawBoyAndTub();
    drawSyllableBubbles();
    drawFX();

    requestAnimationFrame(render);
  }

  // ==================== INTERACTION ====================
  function hitBubble(px, py) {
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (b.riseProgress < 0.25) continue;
      const dx = px - b.x, dy = py - b.y;
      if (dx * dx + dy * dy <= (b.radius * b.scale * 1.12) ** 2) return b;
    }
    return null;
  }

  canvas.addEventListener('pointermove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.lastMove = time;
    const hit = hitBubble(mouse.x, mouse.y);
    const newId = hit ? hit.id : null;
    if (newId && newId !== hoveredBubbleId) playHoverTick();
    hoveredBubbleId = newId;
    canvas.style.cursor = newId ? 'pointer' : 'default';
  });

  canvas.addEventListener('pointerdown', e => {
    ensureAudio();
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.lastMove = time;

    const hit = hitBubble(mouse.x, mouse.y);
    if (hit) {
      spawnPopBurst(hit.x, hit.y, hit.tint, 28);
      triggerBoyReaction();
      const idx = bubbles.indexOf(hit);
      if (idx !== -1) {
        bubbles[idx] = createBubbleForSlot(hit.slotIdx, 0.22);
      }
      hoveredBubbleId = null;
    } else {
      const m = getTubMetrics();
      const dx = mouse.x - (m.cx + m.tubW * 0.30);
      const dy = mouse.y - (m.tubTopY - 14 * m.s);
      if (dx * dx + dy * dy <= (42 * m.s) ** 2) {
        duck.jump = 1; duck.quack = 1;
        playTone(620, 'sawtooth', 0.11, 0.09, 440);
      }
    }
  });

  // ==================== UI CONTROLS ====================
  const btnLang = document.getElementById('btnLang');
  const btnNext = document.getElementById('btnNext');
  const btnSound = document.getElementById('btnSound');
  const iconSoundOn = document.getElementById('iconSoundOn');
  const iconSoundOff = document.getElementById('iconSoundOff');
  const btnConsonants = document.getElementById('btnConsonants');
  const consonantPreview = document.getElementById('consonantPreview');
  const drawerBackdrop = document.getElementById('drawerBackdrop');
  const btnCloseDrawer = document.getElementById('btnCloseDrawer');
  const lettersGrid = document.getElementById('lettersGrid');
  const modeCV = document.getElementById('modeCV');
  const modeVC = document.getElementById('modeVC');
  const btnSelectAll = document.getElementById('btnSelectAll');
  const btnClearOne = document.getElementById('btnClearOne');

  function updateConsonantPreview() {
    const arr = [...selectedConsonants];
    consonantPreview.textContent = arr.length <= 3
      ? arr.join(', ')
      : `${arr.slice(0, 2).join(', ')} +${arr.length - 2}`;
  }

  function updateModeButtons() {
    modeCV.classList.toggle('active', allowCV);
    modeVC.classList.toggle('active', allowVC);
  }

  function renderLetterGrid() {
    const cfg = LANGS[currentLang];
    lettersGrid.innerHTML = '';
    cfg.consonants.forEach(c => {
      const tile = document.createElement('button');
      tile.className = 'letter-tile' + (selectedConsonants.has(c) ? ' selected' : '');
      tile.textContent = c;
      tile.addEventListener('click', () => {
        ensureAudio();
        playHoverTick();
        if (selectedConsonants.has(c)) {
          if (selectedConsonants.size > 1) selectedConsonants.delete(c);
        } else {
          selectedConsonants.add(c);
        }
        tile.classList.toggle('selected', selectedConsonants.has(c));
        updateConsonantPreview();
        recentSyllables = [];
        resetAllBubbles(false);
      });
      lettersGrid.appendChild(tile);
    });
  }

  btnLang.addEventListener('click', () => {
    ensureAudio();
    currentLang = currentLang === 'uk' ? 'ru' : 'uk';
    btnLang.textContent = LANGS[currentLang].label;
    const valid = new Set(LANGS[currentLang].consonants);
    const kept = [...selectedConsonants].filter(c => valid.has(c));
    selectedConsonants = new Set(kept.length ? kept : ['М', 'С', 'Л']);
    updateConsonantPreview();
    renderLetterGrid();
    recentSyllables = [];
    resetAllBubbles(true);
  });

  btnNext.addEventListener('click', () => {
    ensureAudio();
    playTone(540, 'sine', 0.1, 0.14, 880);
    resetAllBubbles(true);
  });

  btnSound.addEventListener('click', () => {
    muted = !muted;
    iconSoundOn.style.display = muted ? 'none' : 'block';
    iconSoundOff.style.display = muted ? 'block' : 'none';
  });

  btnConsonants.addEventListener('click', () => {
    renderLetterGrid();
    updateModeButtons();
    drawerBackdrop.classList.add('open');
  });

  btnCloseDrawer.addEventListener('click', () => drawerBackdrop.classList.remove('open'));
  drawerBackdrop.addEventListener('click', e => {
    if (e.target === drawerBackdrop) drawerBackdrop.classList.remove('open');
  });

  // Independent toggles: both Open (CV) and Closed (VC) can be active simultaneously!
  modeCV.addEventListener('click', () => {
    ensureAudio();
    playHoverTick();
    if (allowCV && !allowVC) return; // keep at least one active
    allowCV = !allowCV;
    updateModeButtons();
    recentSyllables = [];
    resetAllBubbles(true);
  });

  modeVC.addEventListener('click', () => {
    ensureAudio();
    playHoverTick();
    if (allowVC && !allowCV) return; // keep at least one active
    allowVC = !allowVC;
    updateModeButtons();
    recentSyllables = [];
    resetAllBubbles(true);
  });

  btnSelectAll.addEventListener('click', () => {
    selectedConsonants = new Set(LANGS[currentLang].consonants);
    updateConsonantPreview();
    renderLetterGrid();
    recentSyllables = [];
    resetAllBubbles(false);
  });

  btnClearOne.addEventListener('click', () => {
    const first = [...selectedConsonants][0] || LANGS[currentLang].consonants[0];
    selectedConsonants = new Set([first]);
    updateConsonantPreview();
    renderLetterGrid();
    recentSyllables = [];
    resetAllBubbles(false);
  });

  // ==================== RESIZE & INIT ====================
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();
  updateConsonantPreview();
  updateModeButtons();
  resetAllBubbles(false);
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
