<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Полювання на корінь слова</title>
  <style>
    /* ==========================================================================
       ОСНОВНІ СТИЛІ ТА СКИДАННЯ (БЕЗ БІЛИХ ПРЯМОКУТНИКІВ ТА ЗАЙВИХ СЛІВ)
       ========================================================================== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a2a1d;
      font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
    }

    /* Головна сцена гри */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Живий сюжетний SVG-фон на весь екран */
    #scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================================================
       НАВІГАЦІЙНІ КНОПКИ (МІНІМАЛІСТИЧНІ, БЕЗ СЛІВ, ДЕРЕВ'ЯНО-МЕТАЛЕВИЙ СТИЛЬ)
       ========================================================================== */
    .nav-controls {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 22px;
      z-index: 40;
    }

    .nav-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 4px solid #5c3818;
      background: radial-gradient(circle at 30% 30%, #f5b041, #d35400 70%, #873600 100%);
      box-shadow:
        0 6px 0 #4a2306,
        0 10px 18px rgba(0, 0, 0, 0.55),
        inset 0 3px 6px rgba(255, 255, 255, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s;
    }

    .nav-btn:hover {
      transform: translateY(-3px) scale(1.06);
      filter: brightness(1.1);
    }

    .nav-btn:active {
      transform: translateY(4px) scale(0.96);
      box-shadow:
        0 2px 0 #4a2306,
        0 4px 8px rgba(0, 0, 0, 0.5),
        inset 0 3px 6px rgba(0, 0, 0, 0.3);
    }

    .nav-btn svg {
      width: 34px;
      height: 34px;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
    }

    /* Індикатор-крапки прогресу (без цифр і слів) */
    .level-dots {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 30px;
      background: linear-gradient(180deg, #4e342e 0%, #2d1b14 100%);
      border: 3px solid #795548;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.7), 0 5px 12px rgba(0,0,0,0.45);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6d4c41;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #ffeb3b;
      transform: scale(1.35);
      box-shadow: 0 0 8px #ffeb3b;
    }

    .dot.done {
      background: #76ff03;
      box-shadow: 0 0 6px #76ff03;
    }

    /* ==========================================================================
       ДЕРЕВ'ЯНИЙ СТЕНД ІЗ ДОШКАМИ ДЛЯ СЛІВ (ЖОДНИХ БІЛИХ ПРЯМОКУТНИКІВ)
       ========================================================================== */
    #words-board {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-54%);
      width: min(820px, 76vw);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 20px 26px 26px;
      border-radius: 28px;
      /* Реалістична текстура старого дерева з металевою окантовкою */
      background:
        repeating-linear-gradient(
          90deg,
          rgba(62, 39, 35, 0.14) 0px,
          rgba(62, 39, 35, 0.14) 3px,
          transparent 3px,
          transparent 18px
        ),
        linear-gradient(180deg, #6d4124 0%, #4e2c16 50%, #3b200e 100%);
      border: 6px solid #2b1608;
      box-shadow:
        0 14px 0 #1f0f05,
        0 24px 38px rgba(0, 0, 0, 0.65),
        inset 0 3px 0 rgba(255, 204, 153, 0.3),
        inset 0 0 30px rgba(0, 0, 0, 0.6);
    }

    /* Декоративні металеві заклепки по кутах стенда */
    #words-board::before,
    #words-board::after {
      content: "";
      position: absolute;
      top: 12px;
      width: calc(100% - 28px);
      height: 14px;
      pointer-events: none;
      background-image:
        radial-gradient(circle, #cfd8dc 30%, #546e7a 70%, #263238 100%),
        radial-gradient(circle, #cfd8dc 30%, #546e7a 70%, #263238 100%);
      background-size: 14px 14px;
      background-repeat: no-repeat;
      background-position: left center, right center;
    }

    #words-board::after {
      top: auto;
      bottom: 12px;
    }

    /* Окрема дерев'яна табличка для кожного спільнокореневого слова */
    .word-plank {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 18px 28px 10px;
      border-radius: 18px;
      /* Фактурна світліша деревина дуба з сучками та градієнтом */
      background:
        radial-gradient(ellipse at 20% 50%, rgba(120, 66, 18, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 30%, rgba(120, 66, 18, 0.2) 0%, transparent 45%),
        repeating-linear-gradient(
          4deg,
          rgba(141, 85, 36, 0.16) 0px,
          rgba(141, 85, 36, 0.16) 2px,
          transparent 2px,
          transparent 9px
        ),
        linear-gradient(180deg, #f0c27b 0%, #d49448 55%, #b5732a 100%);
      border: 4px solid #5c3311;
      box-shadow:
        0 7px 0 #3d210a,
        0 10px 18px rgba(0, 0, 0, 0.45),
        inset 0 2px 3px rgba(255, 243, 214, 0.7);
      transition: transform 0.2s ease;
    }

    .word-plank:hover {
      transform: scale(1.02);
    }

    /* SVG-шар над словом для дужки кореня та плям фарби з бластера */
    .plank-overlay-svg {
      position: absolute;
      inset: -14px -18px -10px -18px;
      width: calc(100% + 36px);
      height: calc(100% + 24px);
      pointer-events: none;
      z-index: 5;
      overflow: visible;
    }

    /* Контейнер літер у слові */
    .letters-row {
      position: relative;
      display: flex;
      gap: 6px;
      z-index: 3;
    }

    /* Окрема крупна літера-плитка */
    .letter-tile {
      position: relative;
      min-width: clamp(38px, 4.4vw, 56px);
      height: clamp(50px, 5.8vh, 66px);
      padding: 0 6px;
      border-radius: 12px;
      background: linear-gradient(180deg, #4a2c11 0%, #2e1907 100%);
      border: 3px solid #7e4a1e;
      box-shadow:
        0 4px 0 #1c0f04,
        inset 0 2px 3px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 3.3vw, 44px);
      font-weight: 900;
      color: #fff3d1;
      text-shadow: 0 3px 0 #1a0d00;
      cursor: pointer;
      transition:
        transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.18s,
        border-color 0.18s,
        box-shadow 0.18s;
    }

    .letter-tile:hover {
      transform: translateY(-3px);
      border-color: #ffca28;
    }

    /* Виділена дитиною літера (приціл кореня) */
    .letter-tile.selected {
      transform: translateY(-6px) scale(1.06);
      background: linear-gradient(180deg, #ff9800 0%, #e65100 100%);
      border-color: #fff59d;
      color: #ffffff;
      box-shadow:
        0 8px 0 #8c2d00,
        0 0 16px rgba(255, 193, 7, 0.85),
        inset 0 2px 4px rgba(255, 255, 255, 0.55);
    }

    /* Зафарбовані бластером літери кореня після правильного влучання */
    .letter-tile.painted-cyan {
      background: radial-gradient(circle at 30% 30%, #18ffff, #00b0ff 65%, #006064 100%);
      border-color: #e0f7fa;
      color: #002633;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
      transform: translateY(-5px) rotate(-2deg) scale(1.07);
      box-shadow: 0 6px 0 #004d40, 0 0 22px #00e5ff;
    }

    .letter-tile.painted-lime {
      background: radial-gradient(circle at 30% 30%, #ccff90, #76ff03 65%, #33691e 100%);
      border-color: #f9fbe7;
      color: #1b3300;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
      transform: translateY(-5px) rotate(2deg) scale(1.07);
      box-shadow: 0 6px 0 #1b5e20, 0 0 22px #76ff03;
    }

    .letter-tile.painted-magenta {
      background: radial-gradient(circle at 30% 30%, #ff80ab, #ff1744 65%, #880e4f 100%);
      border-color: #fce4ec;
      color: #ffffff;
      text-shadow: 0 2px 0 #4a001f;
      transform: translateY(-5px) rotate(-1.5deg) scale(1.07);
      box-shadow: 0 6px 0 #560027, 0 0 22px #ff4081;
    }

    .letter-tile.painted-yellow {
      background: radial-gradient(circle at 30% 30%, #ffff8d, #ffea00 65%, #f57f17 100%);
      border-color: #fffde7;
      color: #3e2723;
      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
      transform: translateY(-5px) rotate(1.5deg) scale(1.07);
      box-shadow: 0 6px 0 #bf360c, 0 0 22px #ffea00;
    }

    /* Трясіння дошки при помилці */
    @keyframes plankShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-14px) rotate(-1.5deg); }
      40% { transform: translateX(12px) rotate(1.5deg); }
      60% { transform: translateX(-10px) rotate(-1deg); }
      80% { transform: translateX(8px) rotate(1deg); }
    }

    .shake-error {
      animation: plankShake 0.55s ease-in-out;
    }

    /* ==========================================================================
       КНОПКА ПОСТРІЛУ З БЛАСТЕРА (ПУЛЬСУЮЧА МІШЕНЬ З ФАРБОЮ, БЕЗ СЛІВ)
       ========================================================================== */
    #fire-btn {
      position: absolute;
      bottom: 24px;
      left: 46%;
      transform: translateX(-50%) scale(0.85);
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 5px solid #263238;
      background: radial-gradient(circle at 35% 30%, #76ff03 0%, #00e676 50%, #00796b 100%);
      box-shadow:
        0 9px 0 #1b3022,
        0 14px 28px rgba(0, 0, 0, 0.65),
        0 0 0 0 rgba(118, 255, 3, 0.7),
        inset 0 4px 8px rgba(255, 255, 255, 0.6);
      cursor: pointer;
      z-index: 35;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.45;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s, filter 0.2s;
    }

    #fire-btn.ready {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
      animation: pulseTarget 1.3s infinite;
    }

    #fire-btn.ready:hover {
      transform: translateX(-50%) scale(1.1);
      filter: brightness(1.12);
    }

    #fire-btn.ready:active {
      transform: translateX(-50%) translateY(5px) scale(0.95);
    }

    @keyframes pulseTarget {
      0% { box-shadow: 0 9px 0 #1b3022, 0 0 0 0 rgba(118, 255, 3, 0.75); }
      70% { box-shadow: 0 9px 0 #1b3022, 0 0 0 22px rgba(118, 255, 3, 0); }
      100% { box-shadow: 0 9px 0 #1b3022, 0 0 0 0 rgba(118, 255, 3, 0); }
    }

    /* ==========================================================================
       ПЕРСОНАЖІ: ШКОДНИЙ ХЛОПЧИК ІЗ БЛАСТЕРОМ ТА СУВОРА МАМА
       ========================================================================== */
    #boy-container {
      position: absolute;
      right: 2vw;
      bottom: -10px;
      width: clamp(270px, 27vw, 400px);
      height: clamp(340px, 56vh, 500px);
      z-index: 30;
      pointer-events: none;
      transform-origin: bottom center;
      animation: boyIdleBreath 3.2s ease-in-out infinite;
    }

    @keyframes boyIdleBreath {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(-0.8deg); }
    }

    /* Стан хлопчика: регоче після влучання з бластера */
    #boy-container.laughing {
      animation: boyLaughBounce 0.28s ease-in-out infinite;
    }

    @keyframes boyLaughBounce {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1.03); }
      50% { transform: translateY(-14px) rotate(3deg) scale(1.05); }
    }

    /* Стан хлопчика: засоромлений, коли мама сварить */
    #boy-container.scolded {
      animation: boyGuiltyShiver 0.4s ease-in-out infinite;
    }

    @keyframes boyGuiltyShiver {
      0%, 100% { transform: translateY(12px) scaleY(0.94) rotate(2deg); }
      50% { transform: translateY(14px) scaleY(0.93) rotate(-1deg); }
    }

    /* Контейнер мами, яка виходить з дверей ліворуч */
    #mom-container {
      position: absolute;
      left: -420px;
      bottom: -8px;
      width: clamp(260px, 25vw, 370px);
      height: clamp(380px, 64vh, 550px);
      z-index: 32;
      pointer-events: none;
      transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #mom-container.active {
      left: 1.5vw;
    }

    /* Анімація сварячого пальця мами */
    #mom-container.active #mom-arm-wag {
      animation: wagFinger 0.26s ease-in-out infinite alternate;
      transform-origin: 185px 255px;
    }

    @keyframes wagFinger {
      0% { transform: rotate(-14deg); }
      100% { transform: rotate(18deg); }
    }

    /* Анімація сердитих брів та голови мами */
    #mom-container.active #mom-head-group {
      animation: momHeadNod 0.32s ease-in-out infinite alternate;
      transform-origin: 150px 145px;
    }

    @keyframes momHeadNod {
      0% { transform: rotate(-4deg) translateY(0); }
      100% { transform: rotate(5deg) translateY(4px); }
    }

    /* Шар для польоту кульок з фарбою та спецефектів */
    #fx-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 38;
    }

    /* Анімації живого фону (хмари, дерева, бульбашки в бластері) */
    .cloud-slow {
      animation: floatCloud 38s linear infinite;
    }
    .cloud-fast {
      animation: floatCloud 26s linear infinite reverse;
    }
    @keyframes floatCloud {
      0% { transform: translateX(-80px); }
      50% { transform: translateX(80px); }
      100% { transform: translateX(-80px); }
    }

    .tree-sway {
      transform-origin: bottom center;
      animation: swayTree 5s ease-in-out infinite alternate;
    }
    @keyframes swayTree {
      0% { transform: skewX(-1.5deg); }
      100% { transform: skewX(2deg); }
    }

    /* Адаптивність для менших екранів */
    @media (max-width: 900px) {
      #words-board {
        width: 90vw;
        transform: translateX(-50%);
        top: 84px;
        padding: 14px 14px 18px;
      }
      #boy-container {
        width: 210px;
        height: 290px;
        right: -10px;
      }
      #mom-container.active {
        left: -10px;
        width: 210px;
        height: 320px;
      }
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- ========================================================================
       1. ДЕТАЛІЗОВАНИЙ СЮЖЕТНИЙ SVG-ФОН: СОНЯЧНЕ ПОДВІР'Я, ЦЕГЛЯНИЙ БУДИНОК,
          ДЕРЕВА, ПАРКАН ТА ДВЕРІ, З ЯКИХ ВИХОДИТЬ МАМА
       ======================================================================== -->
  <svg id="scene-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт теплого літнього неба -->
      <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2980b9" />
        <stop offset="55%" stop-color="#6dd5fa" />
        <stop offset="100%" stop-color="#fef9d7" />
      </linearGradient>

      <!-- Сонячне сяйво -->
      <radialGradient id="sunGlow" cx="85%" cy="16%" r="35%">
        <stop offset="0%" stop-color="#fffde7" stop-opacity="1" />
        <stop offset="25%" stop-color="#ffd54f" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#ffd54f" stop-opacity="0" />
      </radialGradient>

      <!-- Далекі пагорби -->
      <linearGradient id="hillFar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#689f38" />
        <stop offset="100%" stop-color="#33691e" />
      </linearGradient>

      <!-- Ближній газон -->
      <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#7cb342" />
        <stop offset="45%" stop-color="#558b2f" />
        <stop offset="100%" stop-color="#2e5718" />
      </linearGradient>

      <!-- Патерн реалістичної цегляної стіни будинку ліворуч -->
      <pattern id="brickPattern" width="120" height="64" patternUnits="userSpaceOnUse">
        <rect width="120" height="64" fill="#6d3b2e" />
        <rect x="3" y="3" width="54" height="26" rx="3" fill="#a94432" />
        <rect x="63" y="3" width="54" height="26" rx="3" fill="#923726" />
        <rect x="-27" y="35" width="54" height="26" rx="3" fill="#873121" />
        <rect x="33" y="35" width="54" height="26" rx="3" fill="#b34b38" />
        <rect x="93" y="35" width="54" height="26" rx="3" fill="#9c3b2a" />
      </pattern>

      <!-- Патерн дерев'яного паркана -->
      <linearGradient id="fenceWood" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#a1662f" />
        <stop offset="50%" stop-color="#c68642" />
        <stop offset="100%" stop-color="#8d5524" />
      </linearGradient>

      <!-- Крони дерев -->
      <radialGradient id="foliageGrad1" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#9ccc65" />
        <stop offset="55%" stop-color="#558b2f" />
        <stop offset="100%" stop-color="#264d14" />
      </radialGradient>
    </defs>

    <!-- Небо та сонце -->
    <rect width="1920" height="1080" fill="url(#skyGrad)" />
    <circle cx="1630" cy="170" r="520" fill="url(#sunGlow)" />
    <circle cx="1630" cy="170" r="85" fill="#fff9c4" />

    <!-- Об'ємні живі хмари -->
    <g class="cloud-slow" opacity="0.9">
      <ellipse cx="420" cy="150" rx="130" ry="48" fill="#ffffff" />
      <circle cx="360" cy="130" r="58" fill="#ffffff" />
      <circle cx="445" cy="115" r="72" fill="#ffffff" />
      <circle cx="515" cy="140" r="46" fill="#ffffff" />
      <ellipse cx="425" cy="166" rx="125" ry="25" fill="#d7ccc8" opacity="0.4" />
    </g>

    <g class="cloud-fast" opacity="0.85">
      <ellipse cx="1180" cy="210" rx="150" ry="52" fill="#ffffff" />
      <circle cx="1110" cy="185" r="64" fill="#ffffff" />
      <circle cx="1205" cy="170" r="78" fill="#ffffff" />
      <circle cx="1285" cy="195" r="52" fill="#ffffff" />
    </g>

    <!-- Далекі зелені пагорби -->
    <path d="M0,660 Q480,530 980,640 T1920,600 L1920,1080 L0,1080 Z" fill="url(#hillFar)" />

    <!-- Пишні дерева на задньому плані (хитаються від вітру) -->
    <g class="tree-sway">
      <rect x="1560" y="380" width="54" height="320" rx="12" fill="#5d4037" />
      <path d="M1585,460 L1510,390 M1585,430 L1665,365" stroke="#5d4037" stroke-width="18" stroke-linecap="round" />
      <circle cx="1585" cy="310" r="145" fill="url(#foliageGrad1)" />
      <circle cx="1475" cy="360" r="110" fill="url(#foliageGrad1)" />
      <circle cx="1690" cy="355" r="115" fill="url(#foliageGrad1)" />
      <circle cx="1585" cy="220" r="95" fill="url(#foliageGrad1)" />
    </g>

    <!-- Дерев'яний паркан уздовж двору -->
    <g id="backyard-fence">
      <rect x="260" y="545" width="1660" height="24" fill="#5d3a1a" />
      <rect x="260" y="695" width="1660" height="24" fill="#5d3a1a" />
      <!-- Дощечки паркана з гострими верхівками -->
      <g fill="url(#fenceWood)" stroke="#4a2c11" stroke-width="3">
        <path d="M320,460 L355,425 L390,460 L390,780 L320,780 Z" />
        <path d="M405,460 L440,425 L475,460 L475,780 L405,780 Z" />
        <path d="M490,460 L525,425 L560,460 L560,780 L490,780 Z" />
        <path d="M575,460 L610,425 L645,460 L645,780 L575,780 Z" />

  <!-- ========================================================================
       7. ПОВНОЕКРАННИЙ SVG-ШАР ДЛЯ ПОЛЬОТУ КУЛЬОК ФАРБИ ТА БРИЗОК
       ======================================================================== -->
  <svg id="fx-layer" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
</div>

<script>
  /* ==========================================================================
     БАЗА ДАНИХ ІЗ 22 НАБОРІВ СПІЛЬНОКОРЕНЕВИХ СЛІВ (ДЛЯ 3-4 КЛАСУ)
     Дитина може виділити правильний корінь у БУДЬ-ЯКОМУ ОДНОМУ слові з набору!
     ========================================================================== */
  const LEVELS = [
    { root: "ЛІС",   words: ["ЛІС", "ЛІСНИК", "ЛІСОВИЙ", "ПІДЛІСОК", "ЛІСОЧОК"] },
    { root: "САД",   words: ["САД", "САДОК", "САДІВНИК", "САДОВИЙ", "ПОСАДКА"] },
    { root: "ВОД",   words: ["ВОДА", "ВОДНИЙ", "ВОДЯНИЙ", "ПІДВОДНИЙ", "ВОДИЧКА"] },
    { root: "РИБ",   words: ["РИБА", "РИБКА", "РИБАЛКА", "РИБНИЙ", "РИБОНЬКА"] },
    { root: "ЗИМ",   words: ["ЗИМА", "ЗИМОВИЙ", "ЗИМУВАТИ", "ЗИМОНЬКА"] },
    { root: "ДУБ",   words: ["ДУБ", "ДУБОК", "ДУБОВИЙ", "ДУБНЯК", "ДУБОЧОК"] },
    { root: "ГРИБ",  words: ["ГРИБ", "ГРИБОК", "ГРИБНИЙ", "ГРИБНИЦЯ"] },
    { root: "МОВ",   words: ["МОВА", "МОВНИЙ", "ВИМОВА", "РОЗМОВА", "ПЕРЕДМОВА"] },
    { root: "ТРАВ",  words: ["ТРАВА", "ТРАВИЧКА", "ТРАВИНКА", "ТРАВЕНЬ"] },
    { root: "КВІТ",  words: ["КВІТКА", "КВІТНИК", "КВІТКОВИЙ", "РОЗКВІТ"] },
    { root: "ХМАР",  words: ["ХМАРА", "ХМАРКА", "ХМАРНИЙ", "ХМАРИНКА", "БЕЗХМАРНИЙ"] },
    { root: "МОРОЗ", words: ["МОРОЗ", "МОРОЗНИЙ", "МОРОЗИВО", "ЗАМОРОЗКИ"] },
    { root: "ДОЩ",   words: ["ДОЩ", "ДОЩИК", "ДОЩОВИЙ", "ДОЩОВИК"] },
    { root: "СТЕП",  words: ["СТЕП", "СТЕПОВИЙ", "СТЕПОК", "СТЕПИК"] },
    { root: "БЕРЕЗ", words: ["БЕРЕЗА", "БЕРЕЗОВИЙ", "БЕРЕЗНЯК", "БЕРЕЗЕНЬ"] },
    { root: "КАЛИН", words: ["КАЛИНА", "КАЛИНОВИЙ", "КАЛИНКА", "КАЛИНОНЬКА"] },
    { root: "ВЕРБ",  words: ["ВЕРБА", "ВЕРБОВИЙ", "ВЕРБИЧКА", "ВЕРБОНЬКА"] },
    { root: "МОР",   words: ["МОРЕ", "МОРСЬКИЙ", "МОРЯК", "ПРИМОРСЬКИЙ"] },
    { root: "ЧАС",   words: ["ЧАС", "ЧАСОВИЙ", "ЧАСИНКА", "ВЧАСНИЙ"] },
    { root: "ПИС",   words: ["ПИСАТИ", "ПИСАНКА", "ЗАПИС", "ПЕРЕПИС", "НАДПИС"] },
    { root: "ЧИТ",   words: ["ЧИТАТИ", "ЧИТАЧ", "ЧИТАНКА", "ПРОЧИТАТИ"] },
    { root: "МАЛ",   words: ["МАЛЮВАТИ", "МАЛЮНОК", "МАЛЯР", "ЗАМАЛЬОВКА"] }
  ];

  // Палітра яскравих фарб для пострілів бластера
  const PAINT_COLORS = [
    { cls: "painted-cyan",    hex: "#00e5ff", stroke: "#006064" },
    { cls: "painted-lime",    hex: "#76ff03", stroke: "#1b5e20" },
    { cls: "painted-magenta", hex: "#ff1744", stroke: "#880e4f" },
    { cls: "painted-yellow",  hex: "#ffea00", stroke: "#e65100" }
  ];

  /* ==========================================================================
     СИНТЕЗАТОР ЗВУКІВ (WEB AUDIO API - ЖОДНИХ ЗОВНІШНІХ АУДІОФАЙЛІВ)
     Всі фідбеки звукові, активні, без слів!
     ========================================================================== */
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === "suspended") {
        this.ctx.resume();
      }
    }

    // Звук вибору дерев'яної літери
    playTileClick(pitchIndex = 0) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(340 + pitchIndex * 35, now);
      osc.frequency.exponentialRampToValueAtTime(580 + pitchIndex * 40, now + 0.09);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    // Звук пострілу з бластера + соковитий ляпас фарби
    playBlasterShot() {
      this.init();
      const now = this.ctx.currentTime;

      // Лазерно-пневматичний імпульс
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(920, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.18);

      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.19);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.19);

      // Звук ляпаса фарби (фільтрований шум + бульбашка)
      setTimeout(() => {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const popOsc = this.ctx.createOscillator();
        const popGain = this.ctx.createGain();
        popOsc.type = "sine";
        popOsc.frequency.setValueAtTime(220, t);
        popOsc.frequency.exponentialRampToValueAtTime(680, t + 0.08);
        popOsc.frequency.exponentialRampToValueAtTime(180, t + 0.16);

        popGain.gain.setValueAtTime(0.35, t);
        popGain.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
        popOsc.connect(popGain);
        popGain.connect(this.ctx.destination);
        popOsc.start(t);
        popOsc.stop(t + 0.17);
      }, 130);
    }

    // Бешкетний дитячий сміх хлопчика (серія веселих стрибаючих нот "хі-хі-ха-ха!")
    playBoyLaugh() {
      this.init();
      const notes = [520, 660, 580, 740, 640, 820, 880];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.18, t + 0.06);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.9, t + 0.12);

          gain.gain.setValueAtTime(0.28, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.13);
        }, idx * 105);
      });
    }

    // Звук відкриття дверей та сердитого бурчання мами ("уа-уа-уа-уааа!")
    playMomScold() {
      this.init();
      const scoldNotes = [
        { f1: 310, f2: 260, delay: 0,   dur: 0.22 },
        { f1: 295, f2: 245, delay: 240, dur: 0.22 },
        { f1: 280, f2: 220, delay: 480, dur: 0.24 },
        { f1: 250, f2: 155, delay: 740, dur: 0.55 }
      ];

      scoldNotes.forEach(item => {
        setTimeout(() => {
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(item.f1, t);
          osc.frequency.linearRampToValueAtTime(item.f2, t + item.dur);

          // Формантний фільтр для імітації сердитої інтонації "уа-уа"
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(650, t);
          filter.frequency.linearRampToValueAtTime(380, t + item.dur);
          filter.Q.value = 3.5;

          gain.gain.setValueAtTime(0.38, t);
          gain.gain.exponentialRampToValueAtTime(0.008, t + item.dur);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(t);
          osc.stop(t + item.dur);
        }, item.delay);
      });
    }
  }

  const sound = new SoundEngine();

  /* ==========================================================================
     СТАН ГРИ ТА ОСНОВНІ ЕЛЕМЕНТИ DOM
     ========================================================================== */
  let currentLevelIdx = 0;
  let completedLevels = new Set();
  let activeWordIdx = null;        // Індекс слова, в якому дитина зараз виділяє корінь
  let selectedLetterIndices = [];  // Відсортований масив індексів виділених літер у цьому слові
  let isDragging = false;          // Підтримка протягування мишкою або пальцем по літерах
  let dragStartIdx = null;
  let isAnimating = false;         // Блокування під час анімації пострілів або мами

  const wordsBoard = document.getElementById("words-board");
  const fireBtn = document.getElementById("fire-btn");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");
  const levelDots = document.getElementById("level-dots");
  const boyContainer = document.getElementById("boy-container");
  const momContainer = document.getElementById("mom-container");
  const fxLayer = document.getElementById("fx-layer");

  /* ==========================================================================
     ІНІЦІАЛІЗАЦІЯ КРАПОК ПРОГРЕСУ ТА ЗАВАНТАЖЕННЯ РІВНЯ
     ========================================================================== */
  function renderDots() {
    levelDots.innerHTML = "";
    LEVELS.forEach((_, idx) => {
      const dot = document.createElement("div");
      dot.className = "dot";
      if (idx === currentLevelIdx) dot.classList.add("active");
      if (completedLevels.has(idx)) dot.classList.add("done");
      levelDots.appendChild(dot);
    });
  }

  function loadLevel(idx) {
    isAnimating = false;
    activeWordIdx = null;
    selectedLetterIndices = [];
    resetCharacterStates();
    updateFireButton();

    currentLevelIdx = (idx + LEVELS.length) % LEVELS.length;
    renderDots();

    const levelData = LEVELS[currentLevelIdx];
    wordsBoard.innerHTML = "";

    // Створюємо дерев'яні дошки для кожного спільнокореневого слова
    levelData.words.forEach((word, wIdx) => {
      const plank = document.createElement("div");
      plank.className = "word-plank";
      plank.dataset.wordIdx = wIdx;

      // SVG-шар над дошкою для малювання дужки кореня та плям фарби
      const svgOverlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svgOverlay.setAttribute("class", "plank-overlay-svg");
      plank.appendChild(svgOverlay);

      const lettersRow = document.createElement("div");
      lettersRow.className = "letters-row";

      [...word].forEach((char, cIdx) => {
        const tile = document.createElement("div");
        tile.className = "letter-tile";
        tile.textContent = char;
        tile.dataset.wordIdx = wIdx;
        tile.dataset.charIdx = cIdx;

        // Початок виділення кліком або протягуванням
        tile.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          if (isAnimating) return;
          handlePointerDownOnLetter(wIdx, cIdx);
        });

        // Продовження виділення при проведенні курсором/пальцем
        tile.addEventListener("pointerenter", () => {
          if (!isDragging || isAnimating) return;
          handlePointerEnterLetter(wIdx, cIdx);
        });

        lettersRow.appendChild(tile);
      });

      plank.appendChild(lettersRow);
      wordsBoard.appendChild(plank);
    });
  }

  window.addEventListener("pointerup", () => {
    isDragging = false;
  });

  /* ==========================================================================
     ЛОГІКА ВИДІЛЕННЯ КОРЕНЯ В ОДНОМУ СЛОВІ
     Дитина може клікати по сусідніх літерах або провести пальцем/мишкою
     ========================================================================== */
  function handlePointerDownOnLetter(wIdx, cIdx) {
    isDragging = true;
    dragStartIdx = cIdx;

    // Якщо дитина переключилася на інше слово — очищуємо попереднє слово
    if (activeWordIdx !== wIdx) {
      activeWordIdx = wIdx;
      selectedLetterIndices = [cIdx];
    } else {
      // Якщо клікнули по літері в тому ж слові: додаємо/прибираємо неперервний діапазон
      if (selectedLetterIndices.includes(cIdx)) {
        // Якщо клікнули з краю виділення — скорочуємо, інакше починаємо нове з цієї літери
        if (selectedLetterIndices.length === 1) {
          selectedLetterIndices = [];
          activeWordIdx = null;
        } else if (cIdx === selectedLetterIndices[0]) {
          selectedLetterIndices.shift();
        } else if (cIdx === selectedLetterIndices[selectedLetterIndices.length - 1]) {
          selectedLetterIndices.pop();
        } else {
          selectedLetterIndices = [cIdx];
        }
      } else {
        const minIdx = Math.min(...selectedLetterIndices, cIdx);
        const maxIdx = Math.max(...selectedLetterIndices, cIdx);
        selectedLetterIndices = [];
        for (let i = minIdx; i <= maxIdx; i++) {
          selectedLetterIndices.push(i);
        }
      }
    }

    sound.playTileClick(selectedLetterIndices.length);
    refreshSelectionUI();
  }

  function handlePointerEnterLetter(wIdx, cIdx) {
    if (wIdx !== activeWordIdx || dragStartIdx === null) return;
    const minIdx = Math.min(dragStartIdx, cIdx);
    const maxIdx = Math.max(dragStartIdx, cIdx);

    const newRange = [];
    for (let i = minIdx; i <= maxIdx; i++) {
      newRange.push(i);
    }

    if (newRange.join(",") !== selectedLetterIndices.join(",")) {
      selectedLetterIndices = newRange;
      sound.playTileClick(selectedLetterIndices.length);
      refreshSelectionUI();
    }
  }

  // Оновлення підсвітки вибраних літер та малювання класичної дужки кореня ⁀
  function refreshSelectionUI() {
    document.querySelectorAll(".word-plank").forEach((plank) => {
      const wIdx = Number(plank.dataset.wordIdx);
      const svg = plank.querySelector(".plank-overlay-svg");
      svg.innerHTML = "";

      plank.querySelectorAll(".letter-tile").forEach((tile) => {
        const cIdx = Number(tile.dataset.charIdx);
        const isSelected = wIdx === activeWordIdx && selectedLetterIndices.includes(cIdx);
        tile.classList.toggle("selected", isSelected);
      });

      if (wIdx === activeWordIdx && selectedLetterIndices.length > 0) {
        drawRootArc(plank, selectedLetterIndices[0], selectedLetterIndices[selectedLetterIndices.length - 1], "#fff59d");
      }
    });

    updateFireButton();
  }

  // Малювання шкільної дужки кореня над діапазоном літер
  function drawRootArc(plankElement, startIdx, endIdx, strokeColor = "#fff59d", splatColor = null) {
    const svg = plankElement.querySelector(".plank-overlay-svg");
    const tiles = plankElement.querySelectorAll(".letter-tile");
    const firstTile = tiles[startIdx];
    const lastTile = tiles[endIdx];
    if (!firstTile || !lastTile) return;

    const svgRect = svg.getBoundingClientRect();
    const firstRect = firstTile.getBoundingClientRect();
    const lastRect = lastTile.getBoundingClientRect();

    const x1 = firstRect.left - svgRect.left + 4;
    const x2 = lastRect.right - svgRect.left - 4;
    const yBase = firstRect.top - svgRect.top + 4;
    const midX = (x1 + x2) / 2;
    const archHeight = Math.min(28, Math.max(16, (x2 - x1) * 0.18));

    // Якщо передано колір фарби — додаємо соковиту декоративну пляму під дужкою
    if (splatColor) {
      const splat = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const r = 10;
      splat.setAttribute(
        "d",
        `M ${x1},${yBase + 6} Q ${midX},${yBase - archHeight - 10} ${x2},${yBase + 6}`
      );
      splat.setAttribute("fill", "none");
      splat.setAttribute("stroke", splatColor);
      splat.setAttribute("stroke-width", "12");
      splat.setAttribute("stroke-linecap", "round");
      splat.setAttribute("opacity", "0.65");
      svg.appendChild(splat);

      // Краплі фарби навколо дужки
      [x1 - 6, midX, x2 + 6].forEach((cx, i) => {
        const drop = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        drop.setAttribute("cx", cx);
        drop.setAttribute("cy", i === 1 ? yBase - archHeight * 0.7 : yBase + 4);
        drop.setAttribute("r", i === 1 ? r * 0.6 : r * 0.5);
        drop.setAttribute("fill", splatColor);
        svg.appendChild(drop);
      });
    }

    // Сама дужка кореня
    const arc = document.createElementNS("http://www.w3.org/2000/svg", "path");
    arc.setAttribute(
      "d",
      `M ${x1},${yBase} Q ${midX},${yBase - archHeight} ${x2},${yBase}`
    );
    arc.setAttribute("fill", "none");
    arc.setAttribute("stroke", strokeColor);
    arc.setAttribute("stroke-width", "6");
    arc.setAttribute("stroke-linecap", "round");
    svg.appendChild(arc);
  }

  function updateFireButton() {
    if (activeWordIdx !== null && selectedLetterIndices.length > 0 && !isAnimating) {
      fireBtn.classList.add("ready");
    } else {
      fireBtn.classList.remove("ready");
    }
  }

  /* ==========================================================================
     ПЕРЕВІРКА ВИДІЛЕНОГО КОРЕНЯ ПРИ НАТИСКАННІ КНОПКИ ПОСТРІЛУ
     ========================================================================== */
  fireBtn.addEventListener("click", () => {
    if (isAnimating || activeWordIdx === null || selectedLetterIndices.length === 0) return;

    const levelData = LEVELS[currentLevelIdx];
    const targetWord = levelData.words[activeWordIdx];
    const selectedSubstring = selectedLetterIndices.map(i => targetWord[i]).join("");

    // Перевіряємо, чи виділена частина збігається з коренем
    const expectedStart = targetWord.indexOf(levelData.root);
    const expectedEnd = expectedStart + levelData.root.length - 1;

    const isExactMatch =
      selectedSubstring === levelData.root &&
      selectedLetterIndices[0] === expectedStart &&
      selectedLetterIndices[selectedLetterIndices.length - 1] === expectedEnd;

    if (isExactMatch) {
      triggerCorrectBlasterSequence(levelData);
    } else {
      triggerWrongMomScoldSequence();
    }
  });

  /* ==========================================================================
     СЦЕНАРІЙ УСПІХУ: ХЛОПЧИК СТРІЛЯЄ З БЛАСТЕРА ПО ВСІХ СЛОВАХ І СМІЄТЬСЯ
     ========================================================================== */
  function triggerCorrectBlasterSequence(levelData) {
    isAnimating = true;
    updateFireButton();
    completedLevels.add(currentLevelIdx);
    renderDots();

    const planks = Array.from(document.querySelectorAll(".word-plank"));

    // Вмикаємо анімацію веселого сміху хлопчика
    setBoyEmotion("laugh");

    // По черзі стріляємо з бластера у кожне слово на дошці, фарбуючи корені
    planks.forEach((plank, wIdx) => {
      setTimeout(() => {
        const word = levelData.words[wIdx];
        const rootStart = word.indexOf(levelData.root);
        const rootEnd = rootStart + levelData.root.length - 1;
        const paintStyle = PAINT_COLORS[wIdx % PAINT_COLORS.length];

        // Випускаємо струмінь/кульку фарби від бластера до кореня слова
        shootPaintProjectileToPlank(plank, rootStart, rootEnd, paintStyle, () => {
          // Фарбуємо літери кореня і малюємо яскраву дужку
          const tiles = plank.querySelectorAll(".letter-tile");
          for (let i = rootStart; i <= rootEnd; i++) {
            tiles[i].classList.remove("selected");
            tiles[i].classList.add(paintStyle.cls);
          }
          drawRootArc(plank, rootStart, rootEnd, "#ffffff", paintStyle.hex);
        });
      }, wIdx * 340);
    });

    // Після зафарбовування всіх коренів хлопчик заливається сміхом
    setTimeout(() => {
      sound.playBoyLaugh();
    }, planks.length * 340);

    // Автоматичний перехід на наступне завдання після святкування
    setTimeout(() => {
      loadLevel(currentLevelIdx + 1);
    }, planks.length * 340 + 1850);
  }

  // Анімація польоту фарбової кулі та бризок на SVG-шарі спецефектів
  function shootPaintProjectileToPlank(plank, rootStart, rootEnd, paintStyle, onHitCallback) {
    sound.playBlasterShot();

    // Віддача бластера при пострілі
    const blasterGroup = document.getElementById("boy-blaster-group");
    blasterGroup.style.transform = "rotate(9deg) translateX(8px)";
    setTimeout(() => {
      blasterGroup.style.transform = "rotate(0deg) translateX(0)";
    }, 140);

    // Знаходимо координати дула бластера та центру кореня у слові
    const muzzle = document.getElementById("blaster-muzzle").getBoundingClientRect();
    const tiles = plank.querySelectorAll(".letter-tile");
    const r1 = tiles[rootStart].getBoundingClientRect();
    const r2 = tiles[rootEnd].getBoundingClientRect();

    const scaleX = 1920 / window.innerWidth;
    const scaleY = 1080 / window.innerHeight;

    const startX = (muzzle.left + muzzle.width / 2) * scaleX;
    const startY = (muzzle.top + muzzle.height / 2) * scaleY;
    const targetX = ((r1.left + r2.right) / 2) * scaleX;
    const targetY = ((r1.top + r1.bottom) / 2) * scaleY;

    // Створюємо промінь та кульку фарби
    const beam = document.createElementNS("http://www.w3.org/2000/svg", "line");
    beam.setAttribute("x1", startX);
    beam.setAttribute("y1", startY);
    beam.setAttribute("x2", targetX);
    beam.setAttribute("y2", targetY);
    beam.setAttribute("stroke", paintStyle.hex);
    beam.setAttribute("stroke-width", "14");
    beam.setAttribute("stroke-linecap", "round");
    beam.setAttribute("stroke-dasharray", "30 18");
    fxLayer.appendChild(beam);

    // Створюємо соковитий вибух крапель у точці влучання
    setTimeout(() => {
      beam.remove();
      onHitCallback();

      const splatGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 35 + Math.random() * 55;
        const drop = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        drop.setAttribute("cx", targetX + Math.cos(angle) * dist);
        drop.setAttribute("cy", targetY + Math.sin(angle) * dist);
        drop.setAttribute("r", 6 + Math.random() * 10);
        drop.setAttribute("fill", paintStyle.hex);
        splatGroup.appendChild(drop);
      }
      fxLayer.appendChild(splatGroup);

      setTimeout(() => splatGroup.remove(), 650);
    }, 130);
  }

  /* ==========================================================================
     СЦЕНАРІЙ ПОМИЛКИ: ВІДЧИНЯЮТЬСЯ ДВЕРІ, ВИХОДИТЬ МАМА І СВАРИТЬ ХЛОПЧИКА
     ========================================================================== */
  function triggerWrongMomScoldSequence() {
    isAnimating = true;
    updateFireButton();

    // Трясемо дошку зі словом, де була помилка
    const activePlank = document.querySelector(`.word-plank[data-word-idx="${activeWordIdx}"]`);
    if (activePlank) {
      activePlank.classList.add("shake-error");
      setTimeout(() => activePlank.classList.remove("shake-error"), 600);
    }

    // Двері будинку розчиняються
    const door = document.getElementById("house-door");
    door.style.transform = "scaleX(0.25)";

    // Виходить мама та сварить хлопчика
    momContainer.classList.add("active");
    setBoyEmotion("scolded");
    sound.playMomScold();

    // Через 2.2 секунди мама повертається в будинок, а дитина може спробувати ще раз
    setTimeout(() => {
      momContainer.classList.remove("active");
      door.style.transform = "scaleX(1)";
      resetCharacterStates();
      activeWordIdx = null;
      selectedLetterIndices = [];
      refreshSelectionUI();
      isAnimating = false;
    }, 2200);
  }

  /* ==========================================================================
     КЕРУВАННЯ ЕМОЦІЯМИ ТА РУХАМИ ПЕРСОНАЖА
     ========================================================================== */
  function setBoyEmotion(state) {
    const eyesNormal = document.getElementById("boy-eyes-normal");
    const eyesLaugh = document.getElementById("boy-eyes-laugh");
    const mouthSmirk = document.getElementById("boy-mouth-smirk");
    const mouthLaugh = document.getElementById("boy-mouth-laugh");
    const mouthGuilty = document.getElementById("boy-mouth-guilty");
    const blush = document.getElementById("boy-blush");
    const blasterGroup = document.getElementById("boy-blaster-group");

    boyContainer.classList.remove("laughing", "scolded");

    if (state === "laugh") {
      boyContainer.classList.add("laughing");
      eyesNormal.setAttribute("opacity", "0");
      eyesLaugh.setAttribute("opacity", "1");
      mouthSmirk.setAttribute("opacity", "0");
      mouthLaugh.setAttribute("opacity", "1");
      mouthGuilty.setAttribute("opacity", "0");
      blush.setAttribute("opacity", "0");
      blasterGroup.style.transform = "rotate(-6deg)";
    } else if (state === "scolded") {
      boyContainer.classList.add("scolded");
      eyesNormal.setAttribute("opacity", "1");
      eyesLaugh.setAttribute("opacity", "0");
      mouthSmirk.setAttribute("opacity", "0");
      mouthLaugh.setAttribute("opacity", "0");
      mouthGuilty.setAttribute("opacity", "1");
      blush.setAttribute("opacity", "1");
      // Хлопчик винувато опускає бластер донизу
      blasterGroup.style.transform = "rotate(-32deg) translateY(22px)";
    } else {
      eyesNormal.setAttribute("opacity", "1");
      eyesLaugh.setAttribute("opacity", "0");
      mouthSmirk.setAttribute("opacity", "1");
      mouthLaugh.setAttribute("opacity", "0");
      mouthGuilty.setAttribute("opacity", "0");
      blush.setAttribute("opacity", "0");
      blasterGroup.style.transform = "rotate(0deg)";
    }
  }

  function resetCharacterStates() {
    momContainer.classList.remove("active");
    document.getElementById("house-door").style.transform = "scaleX(1)";
    setBoyEmotion("normal");
  }

  // Стеження очима хлопчика за курсором дитини для живої взаємодії
  window.addEventListener("pointermove", (e) => {
    const ratioX = (e.clientX / window.innerWidth - 0.5) * 8;
    const ratioY = (e.clientY / window.innerHeight - 0.5) * 6;
    const pL = document.getElementById("pupil-l");
    const pR = document.getElementById("pupil-r");
    if (pL && pR) {
      pL.setAttribute("cx", 178 + ratioX);
      pL.setAttribute("cy", 132 + ratioY);
      pR.setAttribute("cx", 234 + ratioX);
      pR.setAttribute("cy", 132 + ratioY);
    }
  });

  /* ==========================================================================
     КНОПКИ МИТТЄВОГО ПЕРЕХОДУ НАЗАД І ДАЛІ (БЕЗ ПРОХОДЖЕННЯ)
     ========================================================================== */
  prevBtn.addEventListener("click", () => {
    sound.playTileClick(2);
    loadLevel(currentLevelIdx - 1);
  });

  nextBtn.addEventListener("click", () => {
    sound.playTileClick(4);
    loadLevel(currentLevelIdx + 1);
  });

  // Перемальовування дужки кореня при зміні розміру вікна
  window.addEventListener("resize", () => {
    if (!isAnimating) refreshSelectionUI();
  });

  // Запуск першого рівня
  loadLevel(0);
</script>
</body>
</html>
