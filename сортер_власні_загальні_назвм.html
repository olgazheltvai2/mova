<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Baggage Sorter - One Line</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Mono:wght@700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #0f1115;
            font-family: 'Oswald', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* --- Фон аеропорту --- */
        .airport-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: linear-gradient(to bottom, #1a1c23 0%, #2d303a 40%, #15171b 100%);
            overflow: hidden;
        }

        .terminal-window {
            position: absolute;
            top: 5%; left: 5%; width: 90%; height: 35%;
            background: linear-gradient(180deg, #0b0e14 0%, #1c2438 100%);
            border: 15px solid #2d303a;
            border-radius: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .runway-lights {
            position: absolute;
            bottom: 20%; left: 0; width: 100%; height: 4px;
            background: repeating-linear-gradient(90deg, transparent, transparent 40px, #ffcc00 40px, #ffcc00 60px);
            box-shadow: 0 0 15px #ffcc00;
            animation: runwayMove 2s linear infinite;
        }
        @keyframes runwayMove {
            0% { background-position: 0 0; }
            100% { background-position: 100px 0; }
        }

        .plane-lights {
            position: absolute;
            top: 60%; left: 10%;
            width: 5px; height: 5px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px 5px #fff, 0 0 40px 10px #00f2fe;
            animation: fly 8s infinite ease-in;
        }
        @keyframes fly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(800px, -200px) scale(0.2); opacity: 0; }
        }

        /* --- Конвеєрна стрічка --- */
        .conveyor-area {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 60%;
            background: #1e2128;
            border-top: 10px solid #3a3f4a;
            box-shadow: inset 0 20px 50px rgba(0,0,0,0.8);
            z-index: 1;
        }

        .conveyor-belt {
            position: absolute;
            top: 20px; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, #2a2e38 0px, #2a2e38 20px, #1f2229 20px, #1f2229 40px);
            background-size: 40px 100%;
            animation: conveyorMove 1s linear infinite;
            opacity: 0.8;
            z-index: -1;
        }
        @keyframes conveyorMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }

        .conveyor-rail {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 20px;
            background: linear-gradient(to bottom, #555a66, #2a2e38);
            border-bottom: 2px solid #111;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* --- Ігрова зона --- */
        #game-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
        }

        /* Кнопка Далі */
        #next-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        #next-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1) rotate(180deg);
        }
        #next-btn svg { width: 30px; height: 30px; fill: #fff; }

        /* --- Зона сортування (Пазл) --- */
        .drop-zone-container {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .slot {
            width: 220px; /* Ширина валізи */
            height: 115px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slot-left { margin-right: -30px; z-index: 5; }
        .slot-right { margin-left: -30px; z-index: 5; }

        /* Центральна бірка */
        .target-tag {
            width: 360px;
            height: 170px;
            background: linear-gradient(135deg, #f0f0f0 0%, #d1d1d1 100%);
            border-radius: 15px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 0 2px #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 15px solid #2c3e50;
            z-index: 6;
        }

        .target-tag::before {
            content: '';
            position: absolute;
            top: 15px; left: -35px;
            width: 20px; height: 20px;
            background: #0f1115;
            border-radius: 50%;
            box-shadow: inset 0 0 5px #000, 0 0 0 3px #555;
        }

        .target-tag::after {
            content: '';
            position: absolute;
            top: -30px; left: -40px;
            width: 40px; height: 60px;
            border: 4px solid #8b4513;
            border-radius: 50%;
            border-right-color: transparent;
            border-bottom-color: transparent;
            transform: rotate(-30deg);
        }

        .tag-header {
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            color: #555;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
            border-bottom: 2px dashed #aaa;
            padding-bottom: 5px;
        }

        .tag-title {
            font-size: 3.5rem;
            font-weight: 700;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #fff;
        }

        .barcode {
            position: absolute;
            bottom: 15px; right: 20px;
            width: 120px; height: 30px;
            background: repeating-linear-gradient(90deg, #000 0px, #000 2px, transparent 2px, transparent 4px, #000 4px, #000 7px, transparent 7px, transparent 10px);
            opacity: 0.7;
        }

        /* --- Сітка валіз (Трей) --- */
        #items-tray {
            position: absolute;
            bottom: 25%; /* ПІДНЯТО ЗНАЧНО ВИЩЕ */
            left: 5%;
            width: 90%;
            height: 35%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            align-content: center;
            justify-items: center;
            z-index: 20;
            padding: 10px;
        }

        /* --- Дизайн валізи --- */
        .suitcase {
            width: 220px; /* Трохи ширше для тексту */
            height: 110px;
            background: linear-gradient(135deg, #4a4e59 0%, #2a2d35 100%);
            border-radius: 10px;
            position: relative;
            cursor: grab;
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.6), 
                inset 0 0 0 2px #5a5f6b,
                inset 0 -10px 20px rgba(0,0,0,0.5),
                inset 0 10px 10px rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: box-shadow 0.2s;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
        }

        .suitcase::before {
            content: '';
            position: absolute;
            top: -12px; left: 50%;
            transform: translateX(-50%);
            width: 50px; height: 15px;
            border: 3px solid #777;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
        }

        .suitcase::after {
            content: '';
            position: absolute;
            bottom: 8px; left: 12px;
            width: 18px; height: 18px;
            background: radial-gradient(circle, #ffd700 20%, #b8860b 80%);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Пазлоподібні виступи */
        .suitcase .tab-left,
        .suitcase .tab-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            z-index: -1;
        }
        .suitcase .tab-left { left: -20px; }
        .suitcase .tab-right { right: -20px; }

        /* Бірка на валізі */
        .suitcase-tag {
            background: #e8e8e8;
            color: #111;
            padding: 0 10px; /* Зменшено вертикальний падінг, щоб текст стояв рівно */
            border-radius: 8px;
            font-family: 'Roboto Mono', monospace;
            font-weight: 900;
            /* Замість border-left використовуємо inset box-shadow, щоб зекономити місце */
            box-shadow: inset 5px 0 0 #d32f2f, 0 2px 5px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            height: 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            
            /* ГОЛОВНЕ: Забороняємо перенос слів */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
        }

        .suitcase:active {
            cursor: grabbing;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 0 2px #888;
        }

        /* Стиль для валізи, що вже на місці */
        .suitcase.placed {
            cursor: default;
            pointer-events: none;
            animation: snapIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            position: relative;
            left: auto !important;
            top: auto !important;
            transform: none !important;
            margin: 0;
        }

        @keyframes snapIn {
            0% { transform: scale(1.1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .suitcase.shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px) rotate(-2deg); }
            40%, 80% { transform: translateX(10px) rotate(2deg); }
        }

        .target-tag.scanning::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: #00f2fe;
            box-shadow: 0 0 15px 5px #00f2fe;
            animation: scan 1s infinite linear;
        }
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: pop 0.6s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Адаптивність */
        @media (max-width: 1024px) {
            .drop-zone-container { transform: translateX(-50%) scale(0.85); }
            #items-tray { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; height: 40%; }
            .suitcase { width: 180px; height: 95px; }
            .slot { width: 180px; height: 95px; }
            .suitcase .tab-left { left: -15px; width: 30px; height: 30px; }
            .suitcase .tab-right { right: -15px; width: 30px; height: 30px; }
            .target-tag { width: 280px; height: 130px; }
            .tag-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="airport-bg">
        <div class="terminal-window">
            <div class="runway-lights"></div>
            <div class="plane-lights"></div>
        </div>
    </div>

    <button id="next-btn" aria-label="Далі">
        <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    </button>

    <div id="game-container">
        <!-- Зона пазла -->
        <div class="drop-zone-container">
            <div class="slot slot-left" id="slot-left"></div>
            
            <div class="target-tag" id="target-tag">
                <div class="tag-header">Категорія / Дестинація</div>
                <div class="tag-title" id="cat-title">Завантаження...</div>
                <div class="barcode"></div>
            </div>

            <div class="slot slot-right" id="slot-right"></div>
        </div>

        <!-- Конвеєр -->
        <div class="conveyor-area">
            <div class="conveyor-rail"></div>
            <div class="conveyor-belt"></div>
            <div id="items-tray"></div>
        </div>
    </div>

    <script>
        // --- Аудіо система ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'pickup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'snap') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.setValueAtTime(1800, now + 0.05);
                osc.frequency.setValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'win') {
                osc.type = 'triangle';
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    osc.frequency.setValueAtTime(freq, now + i * 0.1);
                });
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        document.addEventListener('pointerdown', initAudio, { once: true });
        document.getElementById('next-btn').addEventListener('click', () => {
            initAudio(); playSound('pickup'); generateLevel();
        });

        // --- База даних ---
        const db = [
            { cat: "Ім'я", items: ["Олександр", "Марія", "Іван", "Софія", "Петро", "Анна", "Дмитро", "Олена"] },
            { cat: "Прізвище", items: ["Шевченко", "Франко", "Коваленко", "Бондаренко", "Мельник", "Ткаченко", "Кравчук", "Олійник"] },
            { cat: "По батькові", items: ["Олександрович", "Маріївна", "Іванович", "Софіївна", "Петрович", "Аннівна", "Дмитрович", "Оленівна"] },
            { cat: "Гора", items: ["Говерла", "Еверест", "Монблан", "Ельбрус", "Казбек", "Піп Іван", "Аннапурна", "Кіліманджаро"] },
            { cat: "Річка", items: ["Дніпро", "Дністер", "Дунай", "Амазонка", "Ніл", "Тигр", "Євфрат", "Міссісіпі"] },
            { cat: "Місто", items: ["Київ", "Одеса", "Львів", "Париж", "Лондон", "Токіо", "Рим", "Берлін"] },
            { cat: "Вулиця", items: ["Хрещатик", "Володимирська", "Соборна", "Головна", "Лесі Українки", "Шевченка", "Соборності", "Незалежності"] }
        ];

        const targetTag = document.getElementById('target-tag');
        const catTitle = document.getElementById('cat-title');
        const itemsTray = document.getElementById('items-tray');
        const slotLeft = document.getElementById('slot-left');
        const slotRight = document.getElementById('slot-right');
        
        let correctItems = [];
        let placedCount = 0;
        let totalCorrect = 2; 

        // --- Генерація рівня ---
        function generateLevel() {
            itemsTray.innerHTML = '';
            slotLeft.innerHTML = '';
            slotRight.innerHTML = '';
            placedCount = 0;

            const catData = db[Math.floor(Math.random() * db.length)];
            catTitle.textContent = catData.cat;

            const shuffledItems = [...catData.items].sort(() => 0.5 - Math.random());
            correctItems = shuffledItems.slice(0, totalCorrect);

            let distractors = [];
            while (distractors.length < 6) {
                const randomCat = db[Math.floor(Math.random() * db.length)];
                if (randomCat.cat !== catData.cat) {
                    const randomItem = randomCat.items[Math.floor(Math.random() * randomCat.items.length)];
                    if (!distractors.includes(randomItem) && !correctItems.includes(randomItem)) {
                        distractors.push(randomItem);
                    }
                }
            }

            const allItems = [...correctItems, ...distractors].sort(() => 0.5 - Math.random());

            allItems.forEach(itemText => {
                const suitcase = document.createElement('div');
                suitcase.className = 'suitcase';
                suitcase.dataset.name = itemText;
                suitcase.dataset.isCorrect = correctItems.includes(itemText) ? 'true' : 'false';
                
                const tabLeft = document.createElement('div');
                tabLeft.className = 'tab-left';
                const tabRight = document.createElement('div');
                tabRight.className = 'tab-right';
                
                const tag = document.createElement('div');
                tag.className = 'suitcase-tag';
                tag.textContent = itemText;

                // Динамічний підбір розміру шрифту для ОДНОГО рядка
                let fontSize = 2.4; // Базовий великий розмір
                if (itemText.length > 13) fontSize = 1.1;      // Для дуже довгих (напр. "Володимирська")
                else if (itemText.length > 11) fontSize = 1.3;  // "Олександрович"
                else if (itemText.length > 9) fontSize = 1.5;   // "Коваленко"
                else if (itemText.length > 7) fontSize = 1.8;   // "Шевченко"
                else if (itemText.length > 5) fontSize = 2.1;   // "Дніпро"
                
                tag.style.fontSize = fontSize + 'rem';

                suitcase.appendChild(tabLeft);
                suitcase.appendChild(tabRight);
                suitcase.appendChild(tag);

                suitcase.addEventListener('pointerdown', startDrag);
                itemsTray.appendChild(suitcase);
            });
        }

        // --- Drag & Drop ---
        let draggedItem = null;
        let offsetX = 0;
        let offsetY = 0;

        function startDrag(e) {
            if (this.classList.contains('placed')) return;
            
            draggedItem = this;
            
            const rect = draggedItem.getBoundingClientRect();
            
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            draggedItem.style.position = 'fixed';
            draggedItem.style.width = rect.width + 'px';
            draggedItem.style.height = rect.height + 'px';
            draggedItem.style.left = rect.left + 'px';
            draggedItem.style.top = rect.top + 'px';
            draggedItem.style.margin = '0';
            draggedItem.style.zIndex = 2000;
            draggedItem.style.cursor = 'grabbing';
            draggedItem.style.transform = 'none';

            document.body.appendChild(draggedItem);

            draggedItem.setPointerCapture(e.pointerId);
            draggedItem.addEventListener('pointermove', drag);
            draggedItem.addEventListener('pointerup', endDrag);
            
            playSound('pickup');
        }

        function drag(e) {
            if (!draggedItem) return;
            draggedItem.style.left = (e.clientX - offsetX) + 'px';
            draggedItem.style.top = (e.clientY - offsetY) + 'px';

            const tagRect = targetTag.getBoundingClientRect();
            const itemRect = draggedItem.getBoundingClientRect();
            
            if (itemRect.right > tagRect.left && itemRect.left < tagRect.right &&
                itemRect.bottom > tagRect.top && itemRect.top < tagRect.bottom) {
                targetTag.classList.add('scanning');
            } else {
                targetTag.classList.remove('scanning');
            }
        }

        function endDrag(e) {
            if (!draggedItem) return;
            
            targetTag.classList.remove('scanning');
            draggedItem.removeEventListener('pointermove', drag);
            draggedItem.removeEventListener('pointerup', endDrag);
            draggedItem.releasePointerCapture(e.pointerId);

            const itemRect = draggedItem.getBoundingClientRect();
            const itemCenterX = itemRect.left + itemRect.width / 2;
            const itemCenterY = itemRect.top + itemRect.height / 2;
            
            const tagRect = targetTag.getBoundingClientRect();
            const leftSlotRect = slotLeft.getBoundingClientRect();
            const rightSlotRect = slotRight.getBoundingClientRect();

            let dropped = false;

            if (draggedItem.dataset.isCorrect === 'true') {
                // Лівий слот
                if (itemCenterX > leftSlotRect.left && itemCenterX < leftSlotRect.right &&
                    itemCenterY > leftSlotRect.top && itemCenterY < leftSlotRect.bottom) {
                    if (slotLeft.children.length === 0) {
                        snapToSlot(draggedItem, slotLeft, 'left');
                        dropped = true;
                    }
                }
                
                // Правий слот
                if (!dropped && itemCenterX > rightSlotRect.left && itemCenterX < rightSlotRect.right &&
                    itemCenterY > rightSlotRect.top && itemCenterY < rightSlotRect.bottom) {
                    if (slotRight.children.length === 0) {
                        snapToSlot(draggedItem, slotRight, 'right');
                        dropped = true;
                    }
                }

                // Якщо впав прямо на бірку
                if (!dropped && itemCenterX > tagRect.left && itemCenterX < tagRect.right &&
                    itemCenterY > tagRect.top && itemCenterY < tagRect.bottom) {
                    
                    if (slotLeft.children.length === 0) {
                        snapToSlot(draggedItem, slotLeft, 'left');
                        dropped = true;
                    } else if (slotRight.children.length === 0) {
                        snapToSlot(draggedItem, slotRight, 'right');
                        dropped = true;
                    }
                }
            }

            if (!dropped) {
                playSound('error');
                returnItem(draggedItem);
            }
        }

        function snapToSlot(item, slot, side) {
            playSound('snap');
            
            item.classList.add('placed');
            
            if (side === 'left') {
                item.querySelector('.tab-left').style.display = 'none';
            } else {
                item.querySelector('.tab-right').style.display = 'none';
            }

            item.style.position = '';
            item.style.width = '';
            item.style.height = '';
            item.style.left = '';
            item.style.top = '';
            item.style.margin = '';
            item.style.transform = '';

            slot.appendChild(item);
            createParticles(item);
            
            placedCount++;

            if (placedCount >= totalCorrect) {
                playSound('win');
                setTimeout(() => {
                    generateLevel();
                }, 1500);
            }
        }

        function returnItem(item) {
            item.classList.add('shake');
            
            setTimeout(() => {
                item.classList.remove('shake');
                item.style.position = '';
                item.style.width = '';
                item.style.height = '';
                item.style.left = '';
                item.style.top = '';
                item.style.margin = '';
                item.style.transform = '';
                item.style.zIndex = '10';
                item.style.cursor = 'grab';
                
                itemsTray.appendChild(item);
                draggedItem = null;
            }, 400);
        }

        function createParticles(element) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            const colors = ['#00f2fe', '#4facfe', '#fff'];
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 8 + 4;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.boxShadow = '0 0 10px ' + colors[0];
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 80 + 30;
                p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        generateLevel();
        window.addEventListener('resize', () => generateLevel());
    </script>
</body>
</html>
