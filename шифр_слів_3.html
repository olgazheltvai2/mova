<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Гра-шифратор</title>
    <!-- Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНІ НАЛАШТУВАННЯ ===== */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a0f0a;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            background-size: cover;
            background-position: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(180deg, rgba(43,24,16,0.92) 0%, rgba(10,5,2,0.92) 100%);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 153, 0, 0.15), inset 0 0 40px rgba(0, 0, 0, 0.9);
            border: 4px solid #4a2918;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        /* --- THEME MANAGER --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #ccc;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        #theme-btn:hover { background: #f0f0f0; transform: scale(1.1); }
        #theme-modal {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 9998;
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            max-height: 60vh;
            overflow-y: auto;
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 250px;
        }
        .theme-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .theme-thumb:hover { border-color: #ff9900; transform: scale(1.05); }
        .theme-thumb span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 12px;
            text-align: center;
            padding: 4px 0;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        /* --- ПЕРЕМИКАЧ МОВИ --- */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 10px;
            z-index: 1000;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .lang-switch:hover { opacity: 1; }
        .lang-btn {
            background: rgba(0,0,0,0.5);
            border: 2px solid #ff9900;
            color: #ff9900;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: rgba(255,153,0,0.3);
            border-color: #ffcc00;
            color: #ffcc00;
            box-shadow: 0 0 15px rgba(255,153,0,0.6);
        }

        /* --- НАВІГАЦІЯ --- */
        .nav-panel {
            position: absolute;
            bottom: 20px;
            left: 25px;
            display: flex;
            gap: 15px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .nav-panel.active { opacity: 1; pointer-events: all; }
        .nav-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4a2918, #1a0f0a);
            border: 2px solid #ff9900;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }
        .nav-btn:hover { border-color: #ffcc00; box-shadow: 0 0 15px rgba(255,204,0,0.4); transform: translateY(-3px); }
        .nav-btn:active { transform: translateY(1px); }
        .nav-btn svg { width: 28px; height: 28px; fill: #ffcc00; }

        /* --- ФОН --- */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 15px 5px #ffcc00;
            opacity: 0;
            animation: float-particle 6s infinite ease-in-out;
        }
        @keyframes float-particle {
            0%, 100% { transform: translate(0,0) scale(0.5); opacity: 0; }
            50% { transform: translate(30px,-50px) scale(1.2); opacity: 0.8; }
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ЕКРАН НАЛАШТУВАНЬ --- */
        #setup-screen {
            background: rgba(30,15,10,0.9);
            border: 3px solid #ff9900;
            border-radius: 25px;
            padding: 50px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            box-shadow: 0 0 50px rgba(255,153,0,0.3), inset 0 0 20px rgba(255,153,0,0.2);
            transform: scale(1);
            transition: all 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
            z-index: 100;
        }
        #setup-screen.hidden {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }
        .cyber-input {
            background: rgba(0,0,0,0.8);
            border: 2px solid #a35c17;
            color: #ffcc00;
            padding: 20px;
            font-size: 36px;
            border-radius: 15px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.9);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .cyber-input#word-input {
            color: transparent;
            text-shadow: none;
            caret-color: #ffcc00;
        }
        .cyber-input:focus {
            border-color: #ffcc00;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.9), 0 0 20px rgba(255,153,0,0.4);
        }
        .cyber-input::placeholder {
            color: rgba(255,153,0,0.5);
            text-transform: none;
        }
        .start-btn {
            background: linear-gradient(45deg, #a35c17, #ffcc00);
            border: none;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }
        .start-btn:hover { filter: brightness(1.2) drop-shadow(0 0 15px #ffcc00); transform: translateY(-2px); }
        .start-btn:active { transform: translateY(2px) scale(0.95); }
        .start-btn svg { width: 50px; height: 50px; fill: #1a0f0a; }

        /* --- ІГРОВИЙ ЕКРАН --- */
        #game-screen {
            display: flex;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #game-screen.active { opacity: 1; pointer-events: all; }
        .game-layout {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            align-items: center;
            justify-content: space-around;
            gap: 15px;
        }

        /* --- СІТКА --- */
        .grid-section {
            background: rgba(40,20,10,0.95);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #a35c17;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.7);
            display: grid;
            gap: 8px;
            align-items: center;
            justify-items: center;
            flex-shrink: 0;
        }
        .grid-label {
            color: #ff9900;
            font-size: 32px;
            text-shadow: 0 0 10px rgba(255,153,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            font-weight: bold;
        }
        .cell {
            background: linear-gradient(135deg, #4e342e, #21110a);
            border: 2px solid #795548;
            border-bottom: 5px solid #140a05;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            color: #ffecd2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            transition: all 0.2s;
            box-sizing: border-box;
            font-weight: bold;
        }
        .cell:hover { transform: scale(1.05) translateY(-2px); border-color: #ffcc00; box-shadow: 0 10px 15px rgba(0,0,0,0.7), inset 0 0 15px rgba(255,204,0,0.4); }
        .cell:active { transform: scale(0.95) translateY(2px); border-bottom-width: 2px; }
        .cell.solved {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #2b1810;
            text-shadow: none;
            border-color: #ffe066;
            pointer-events: none;
            animation: pulse-gold 1.5s infinite alternate;
        }
        .cell.wrong {
            background: linear-gradient(135deg, #d84315, #8a2a0b);
            border-color: #ff8a65;
            animation: shake 0.4s;
        }

        /* --- ШИФР --- */
        .cipher-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(20,10,5,0.85);
            padding: 25px;
            border-radius: 20px;
            border: 3px dashed #ff9900;
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
            min-width: 280px;
            flex: 1;
            max-width: 650px;
        }
        .cipher-codes-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .cipher-code {
            font-size: 30px;
            color: #795548;
            padding: 8px 14px;
            border-radius: 10px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #3e2723;
            transition: all 0.3s;
            font-weight: bold;
        }
        .cipher-code.active {
            color: #ffcc00;
            text-shadow: 0 0 12px #ffcc00;
            background: rgba(255,204,0,0.15);
            border: 2px solid #ffcc00;
            transform: scale(1.1);
            animation: glow-pulse 2s infinite alternate;
        }
        .cipher-code.solved {
            color: #3e2723;
            border-color: #1a0f0a;
            transform: scale(0.9);
        }
        .cipher-letters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .cipher-slot {
            width: 45px;
            height: 55px;
            border-bottom: 5px solid #ff5722;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            font-size: 42px;
            color: #ffffff;
            padding-bottom: 5px;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
            font-weight: bold;
        }

        /* --- РОБОТ --- */
        .character-section {
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            width: 350px;
        }
        #robot-svg {
            width: 100%;
            height: 100%;
            max-height: 550px;
            filter: drop-shadow(0 20px 15px rgba(0,0,0,0.8));
            transform-origin: bottom center;
            overflow: visible;
        }

        /* --- АНІМАЦІЇ --- */
        @keyframes pulse-gold {
            from { box-shadow: inset 0 0 10px #ff9900; }
            to { box-shadow: inset 0 0 25px #ffcc00, 0 0 15px #ff9900; }
        }
        @keyframes glow-pulse {
            from { box-shadow: 0 0 5px rgba(255,204,0,0.2); }
            to { box-shadow: 0 0 20px rgba(255,204,0,0.6); }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-3deg); }
            40% { transform: translateX(10px) rotate(3deg); }
            60% { transform: translateX(-10px) rotate(-3deg); }
            80% { transform: translateX(10px) rotate(3deg); }
        }
        @keyframes gearSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes wheelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .bg-gear { transform-origin: center; transform-box: fill-box; }
        .bg-gear.fast { animation: gearSpin 15s linear infinite; }
        .bg-gear.slow { animation: gearSpin 25s linear infinite reverse; }
        .wheel-spin { animation: wheelSpin 3s linear infinite; transform-origin: center; transform-box: fill-box; }

        @media (max-width: 1024px) {
            .game-layout { flex-direction: column; padding: 10px; gap: 10px; }
            .character-section { width: 200px; }
            #robot-svg { max-height: 300px; }
            .cipher-section { min-width: unset; width: 100%; max-width: 100%; }
            .grid-section { padding: 10px; gap: 4px; }
            .cell { font-size: 28px; }
            .grid-label { font-size: 20px; }
            .cipher-code { font-size: 22px; padding: 4px 10px; }
            .cipher-slot { width: 32px; height: 40px; font-size: 28px; }
            #setup-screen { padding: 25px; }
            .cyber-input { font-size: 24px; padding: 12px; }
            .lang-switch { top: 10px; right: 10px; }
            .lang-btn { font-size: 14px; padding: 4px 10px; }
            .nav-panel { bottom: 10px; left: 10px; }
            .nav-btn { width: 40px; height: 40px; }
            .nav-btn svg { width: 20px; height: 20px; }
        }
        @media (max-width: 600px) {
            .cell { font-size: 20px; }
            .cipher-code { font-size: 18px; }
            .cipher-slot { width: 26px; height: 34px; font-size: 22px; }
            .character-section { width: 140px; }
            #robot-svg { max-height: 200px; }
            .grid-section { padding: 6px; gap: 3px; }
            .grid-label { font-size: 16px; }
            .cipher-section { padding: 12px; gap: 10px; }
            #setup-screen { padding: 16px; gap: 16px; }
            .cyber-input { font-size: 18px; padding: 10px; }
        }
    </style>
</head>
<body>

<!-- ===== МЕНЮ ФОНІВ ===== -->
<div id="theme-btn" onclick="toggleThemeModal()">⚙️</div>
<div id="theme-modal"></div>

<!-- ===== КОНТЕЙНЕР ГРИ ===== -->
<div id="game-container">
    
    <!-- Перемикач мови -->
    <div class="lang-switch">
        <button class="lang-btn active" id="lang-ukr" onclick="setLanguage('UKR')">UKR</button>
        <button class="lang-btn" id="lang-rus" onclick="setLanguage('RUS')">RUS</button>
    </div>

    <!-- Навігація -->
    <div class="nav-panel" id="nav-panel">
        <button class="nav-btn" onclick="resetGame()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <button class="nav-btn" onclick="initGame(true)">
            <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
    </div>

    <!-- Фоновий шар -->
    <svg class="bg-layer" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
        <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff9900" stop-opacity="0.15"/>
                <stop offset="100%" stop-color="#1a0f0a" stop-opacity="0"/>
            </radialGradient>
            <pattern id="hexagons" width="50" height="86.6" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
                <path d="M25 0 L50 14.4 L50 43.3 L25 57.7 L0 43.3 L0 14.4 Z" fill="none" stroke="rgba(255,153,0,0.05)" stroke-width="2"/>
                <path d="M25 86.6 L50 72.2 L50 43.3 L25 57.7 L0 43.3 L0 72.2 Z" fill="none" stroke="rgba(255,153,0,0.05)" stroke-width="2"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#hexagons)"/>
        <circle cx="200" cy="300" r="400" fill="url(#glow)"/>
        <circle cx="1000" cy="600" r="500" fill="url(#glow)"/>
        <path d="M -50 100 Q 150 100 200 250 T 500 300" fill="none" stroke="#d84315" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
        <path d="M 1300 500 Q 1100 500 1050 350 T 800 300" fill="none" stroke="#ff9900" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
        <g opacity="0.4" transform="translate(150, 550)">
            <g class="bg-gear fast">
                <circle cx="0" cy="0" r="120" fill="none" stroke="#ff9900" stroke-width="15" stroke-dasharray="35 20"/>
                <circle cx="0" cy="0" r="75" fill="none" stroke="#ff9900" stroke-width="5"/>
                <circle cx="0" cy="0" r="25" fill="#ff9900"/>
                <line x1="-75" y1="0" x2="75" y2="0" stroke="#ff9900" stroke-width="10"/>
                <line x1="0" y1="-75" x2="0" y2="75" stroke="#ff9900" stroke-width="10"/>
            </g>
        </g>
        <g opacity="0.3" transform="translate(1100, 150)">
            <g class="bg-gear slow">
                <circle cx="0" cy="0" r="160" fill="none" stroke="#ff5722" stroke-width="25" stroke-dasharray="50 30"/>
                <circle cx="0" cy="0" r="110" fill="none" stroke="#ff5722" stroke-width="8"/>
                <circle cx="0" cy="0" r="40" fill="#ff5722"/>
                <path d="M -110 0 L 110 0 M 0 -110 L 0 110 M -80 -80 L 80 80 M -80 80 L 80 -80" stroke="#ff5722" stroke-width="12"/>
            </g>
        </g>
    </svg>

    <!-- Частинки -->
    <div id="particles-container" class="bg-layer"></div>

    <!-- ===== ЕКРАН НАЛАШТУВАНЬ ===== -->
    <div id="setup-screen" class="ui-layer">
        <input type="text" id="word-input" class="cyber-input" placeholder="✎ СЛОВО" autocomplete="off">
        <input type="number" id="grid-size-input" class="cyber-input" placeholder="⊞ РОЗМІР (3-6)" min="2" max="6">
        <button class="start-btn" onclick="initGame(false)">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
    </div>

    <!-- ===== ІГРОВИЙ ЕКРАН ===== -->
    <div id="game-screen" class="ui-layer">
        <div class="game-layout">
            
            <!-- Сітка -->
            <div class="grid-section" id="unified-grid"></div>

            <!-- Шифр -->
            <div class="cipher-section" id="cipher-container">
                <div class="cipher-codes-row" id="cipher-codes"></div>
                <div class="cipher-letters-row" id="cipher-letters"></div>
            </div>

            <!-- Робот -->
            <div class="character-section">
                <svg id="robot-svg" viewBox="-100 -100 500 700">
                    <defs>
                        <linearGradient id="metal-base" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#475569"/>
                            <stop offset="50%" stop-color="#334155"/>
                            <stop offset="100%" stop-color="#1e293b"/>
                        </linearGradient>
                        <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#94a3b8"/>
                            <stop offset="100%" stop-color="#64748b"/>
                        </linearGradient>
                    </defs>
                    <g id="robot-group">
                        <line x1="150" y1="120" x2="150" y2="50" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
                        <circle id="antenna-bulb" cx="150" cy="50" r="15" fill="#ffaa00"/>
                        <rect x="130" y="220" width="40" height="30" fill="url(#metal-base)"/>
                        <g id="arms-group">
                            <path id="arm-l" d="M 60 280 Q -20 350 -10 420" fill="none" stroke="url(#metal-base)" stroke-width="25" stroke-linecap="round"/>
                            <circle id="fist-l" cx="-10" cy="420" r="25" fill="#00ffcc" stroke="#1e293b" stroke-width="6"/>
                            <path id="arm-r" d="M 240 280 Q 320 350 310 420" fill="none" stroke="url(#metal-base)" stroke-width="25" stroke-linecap="round"/>
                            <circle id="fist-r" cx="310" cy="420" r="25" fill="#00ffcc" stroke="#1e293b" stroke-width="6"/>
                        </g>
                        <rect x="50" y="250" width="200" height="150" rx="30" fill="url(#metal-base)" stroke="#0f172a" stroke-width="5"/>
                        <rect x="70" y="270" width="160" height="110" rx="15" fill="#0f172a" stroke="#0088aa" stroke-width="3"/>
                        <circle cx="150" cy="325" r="35" fill="#020617" stroke="#334155" stroke-width="6"/>
                        <circle id="core-light" cx="150" cy="325" r="18" fill="#00ffcc"/>
                        <rect x="40" y="120" width="220" height="120" rx="25" fill="url(#metal-light)" stroke="#0f172a" stroke-width="5"/>
                        <rect x="55" y="135" width="190" height="90" rx="15" fill="#020617" stroke="#00ffcc" stroke-width="4"/>
                        <g id="eyes-group">
                            <rect id="eye-l" x="80" y="160" width="40" height="30" rx="10" fill="#00ffcc"/>
                            <rect id="eye-r" x="180" y="160" width="40" height="30" rx="10" fill="#00ffcc"/>
                        </g>
                        <path d="M 80 400 L 220 400 L 250 450 L 50 450 Z" fill="url(#metal-base)" stroke="#0f172a" stroke-width="4"/>
                        <g class="wheel-spin" transform="translate(150, 480)">
                            <circle cx="0" cy="0" r="70" fill="#0f172a" stroke="#334155" stroke-width="12"/>
                            <circle cx="0" cy="0" r="50" fill="none" stroke="#0088aa" stroke-width="10" stroke-dasharray="25 15"/>
                            <circle cx="0" cy="0" r="20" fill="url(#metal-light)"/>
                            <line x1="-70" y1="0" x2="70" y2="0" stroke="#334155" stroke-width="10"/>
                            <line x1="0" y1="-70" x2="0" y2="70" stroke="#334155" stroke-width="10"/>
                        </g>
                    </g>
                </svg>
            </div>
            
        </div>
    </div>
</div>

<script>
    // ================================================================
    // 1. THEME MANAGER
    // ================================================================
    function toggleThemeModal() {
        const modal = document.getElementById('theme-modal');
        modal.style.display = modal.style.display === 'grid' ? 'none' : 'grid';
    }

    async function initThemeManager() {
        const modal = document.getElementById('theme-modal');
        const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/background_';
        const ext = '.webp';
        let bgIndex = 1;

        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) {
            document.body.style.backgroundImage = `url(${savedBg})`;
        } else {
            document.body.style.backgroundImage = `url(${baseUrl}1${ext})`;
        }

        while (bgIndex <= 1000) {
            const bgUrl = `${baseUrl}${bgIndex}${ext}`;
            const exists = await checkImageExists(bgUrl);
            if (!exists) break;

            const thumb = document.createElement('div');
            thumb.className = 'theme-thumb';
            thumb.style.backgroundImage = `url(${bgUrl})`;
            thumb.innerHTML = `<span>Фон ${bgIndex}</span>`;
            thumb.onclick = () => {
                document.body.style.backgroundImage = `url(${bgUrl})`;
                localStorage.setItem('mySavedGameBg', bgUrl);
            };
            modal.appendChild(thumb);
            bgIndex++;
        }
    }

    function checkImageExists(url) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = url;
        });
    }

    window.addEventListener('DOMContentLoaded', initThemeManager);

    // ================================================================
    // 2. FIREBASE СИНХРОНІЗАЦІЯ (використовуємо ту саму базу, що й в успішній грі)
    // ================================================================
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const senderId = 'dev_' + Math.random().toString(36).substr(2, 9);
    let lastActionTime = 0;
    let isRemoteAction = false;
    let isInitialized = false;

    // Слухач лобі
    db.ref('current_activity').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val === 'lobby' || (val && val.activity === 'lobby')) {
            window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html';
        }
    });

    // Слухач ігрових дій (той самий підхід, що й в успішній грі з емодзі)
    db.ref('game_action').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        if (data.senderId === senderId) return;
        if (data.timestamp <= lastActionTime) return;

        isRemoteAction = true;
        lastActionTime = data.timestamp;

        console.log('Отримано дію:', data.type, 'від', data.senderId);

        if (data.type === 'init') {
            // Відновлюємо стан гри
            currentLang = data.lang;
            currentAlphabet = data.lang === 'RUS' ? ALPHABET_RUS : ALPHABET_UKR;
            document.getElementById('lang-ukr').classList.toggle('active', currentLang === 'UKR');
            document.getElementById('lang-rus').classList.toggle('active', currentLang === 'RUS');

            gameState.word = data.word;
            gameState.size = data.size;
            gameState.grid = data.grid;
            gameState.targets = data.targets;
            gameState.currentIndex = data.currentIndex;

            renderLevel();
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('nav-panel').classList.add('active');
            setCharacterEmotion('neutral');
            console.log('Гру відновлено з Firebase');

        } else if (data.type === 'click') {
            gameState.currentIndex = data.currentIndex;
            renderLevelFromState();
            // Не граємо звуки та не робимо анімацій – це робиться на пристрої-джерелі

        } else if (data.type === 'error') {
            // Помилка – тільки візуалізація без звуку (можна додати анімацію, але поки пропускаємо)

        } else if (data.type === 'reset') {
            resetGameUI();
        }

        isRemoteAction = false;
    });

    // Також при завантаженні сторінки перевіряємо, чи є вже збережений стан
    function loadInitialState() {
        db.ref('game_action').once('value').then((snapshot) => {
            const data = snapshot.val();
            if (data && data.type === 'init' && data.senderId !== senderId) {
                // Відновлюємо гру, якщо є ініціалізований стан
                console.log('Відновлення початкового стану з Firebase');
                isRemoteAction = true;
                currentLang = data.lang;
                currentAlphabet = data.lang === 'RUS' ? ALPHABET_RUS : ALPHABET_UKR;
                document.getElementById('lang-ukr').classList.toggle('active', currentLang === 'UKR');
                document.getElementById('lang-rus').classList.toggle('active', currentLang === 'RUS');

                gameState.word = data.word;
                gameState.size = data.size;
                gameState.grid = data.grid;
                gameState.targets = data.targets;
                gameState.currentIndex = data.currentIndex;

                renderLevel();
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.add('active');
                document.getElementById('nav-panel').classList.add('active');
                setCharacterEmotion('neutral');
                isRemoteAction = false;
            }
        }).catch(err => console.warn('Помилка завантаження початкового стану:', err));
    }

    // Відправка дії
    function sendAction(actionData) {
        if (isRemoteAction) return;
        actionData.senderId = senderId;
        actionData.timestamp = Date.now();
        db.ref('game_action').set(actionData);
        console.log('Відправлено дію:', actionData.type);
    }

    // ================================================================
    // 3. НАЛАШТУВАННЯ МОВИ
    // ================================================================
    const ALPHABET_UKR = "АБВГДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ";
    const ALPHABET_RUS = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
    let currentLang = 'UKR';
    let currentAlphabet = ALPHABET_UKR;

    function setLanguage(lang) {
        currentLang = lang;
        currentAlphabet = lang === 'RUS' ? ALPHABET_RUS : ALPHABET_UKR;
        document.getElementById('lang-ukr').classList.toggle('active', lang === 'UKR');
        document.getElementById('lang-rus').classList.toggle('active', lang === 'RUS');
    }

    // ================================================================
    // 4. ЧАСТИНКИ
    // ================================================================
    function spawnParticles() {
        const container = document.getElementById('particles-container');
        container.innerHTML = '';
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            container.appendChild(particle);
        }
    }
    spawnParticles();

    // ================================================================
    // 5. АУДІО
    // ================================================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        const VOL = 0.05;

        if (type === 'success') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
            gainNode.gain.setValueAtTime(VOL, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
            gainNode.gain.setValueAtTime(VOL, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'win') {
            const freqs = [523.25, 659.25, 783.99, 1046.50];
            freqs.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                o.frequency.value = freq;
                o.connect(g);
                g.connect(audioCtx.destination);
                const st = now + (i * 0.15);
                g.gain.setValueAtTime(0, st);
                g.gain.linearRampToValueAtTime(VOL, st + 0.1);
                g.gain.exponentialRampToValueAtTime(0.001, st + 1.2);
                o.start(st);
                o.stop(st + 1.5);
            });
        }
    }

    // ================================================================
    // 6. ЕМОЦІЇ РОБОТА
    // ================================================================
    function setCharacterEmotion(emotion) {
        const robot = document.getElementById('robot-group');
        const eyeL = document.getElementById('eye-l');
        const eyeR = document.getElementById('eye-r');
        const core = document.getElementById('core-light');
        const antenna = document.getElementById('antenna-bulb');
        const armL = document.getElementById('arm-l');
        const fistL = document.getElementById('fist-l');
        const armR = document.getElementById('arm-r');
        const fistR = document.getElementById('fist-r');

        robot.style.transform = "translateY(0)";
        robot.style.transition = "transform 0.2s";
        
        eyeL.setAttribute('height', '30');
        eyeL.setAttribute('y', '160');
        eyeL.setAttribute('fill', '#00ffcc');
        eyeR.setAttribute('height', '30');
        eyeR.setAttribute('y', '160');
        eyeR.setAttribute('fill', '#00ffcc');
        core.setAttribute('fill', '#00ffcc');
        antenna.setAttribute('fill', '#ffaa00');

        armL.setAttribute('d', 'M 60 280 Q -20 350 -10 420');
        fistL.setAttribute('cy', '420');
        fistL.setAttribute('cx', '-10');
        fistL.setAttribute('fill', '#00ffcc');
        armR.setAttribute('d', 'M 240 280 Q 320 350 310 420');
        fistR.setAttribute('cy', '420');
        fistR.setAttribute('cx', '310');
        fistR.setAttribute('fill', '#00ffcc');

        if (emotion === 'happy') {
            eyeL.setAttribute('height', '10');
            eyeL.setAttribute('y', '170');
            eyeR.setAttribute('height', '10');
            eyeR.setAttribute('y', '170');
            armL.setAttribute('d', 'M 60 280 Q 0 150 -10 100');
            fistL.setAttribute('cy', '100');
            fistL.setAttribute('cx', '-10');
            armR.setAttribute('d', 'M 240 280 Q 300 150 310 100');
            fistR.setAttribute('cy', '100');
            fistR.setAttribute('cx', '310');
            robot.style.transform = "translateY(-20px)";
            setTimeout(() => setCharacterEmotion('neutral'), 600);
            
        } else if (emotion === 'sad') {
            eyeL.setAttribute('fill', '#ff3d00');
            eyeR.setAttribute('fill', '#ff3d00');
            core.setAttribute('fill', '#ff3d00');
            antenna.setAttribute('fill', '#ff3d00');
            fistL.setAttribute('fill', '#ff3d00');
            fistR.setAttribute('fill', '#ff3d00');
            armL.setAttribute('d', 'M 60 280 Q 20 420 30 480');
            fistL.setAttribute('cy', '480');
            fistL.setAttribute('cx', '30');
            armR.setAttribute('d', 'M 240 280 Q 280 420 270 480');
            fistR.setAttribute('cy', '480');
            fistR.setAttribute('cx', '270');
            let shake = setInterval(() => {
                robot.style.transform = `translateX(${Math.random()*10 - 5}px)`;
            }, 40);
            setTimeout(() => {
                clearInterval(shake);
                setCharacterEmotion('neutral');
            }, 400);
            
        } else if (emotion === 'win') {
            let toggle = false;
            let winInt = setInterval(() => {
                const color = toggle ? '#ffaa00' : '#00ffcc';
                eyeL.setAttribute('fill', color);
                eyeR.setAttribute('fill', color);
                core.setAttribute('fill', color);
                antenna.setAttribute('fill', color);
                fistL.setAttribute('fill', color);
                fistR.setAttribute('fill', color);
                robot.style.transform = toggle ? "translateY(-30px)" : "translateY(0)";
                toggle = !toggle;
            }, 200);
            armL.setAttribute('d', 'M 60 280 Q -30 150 -10 50');
            fistL.setAttribute('cy', '50');
            fistL.setAttribute('cx', '-10');
            armR.setAttribute('d', 'M 240 280 Q 330 150 310 50');
            fistR.setAttribute('cy', '50');
            fistR.setAttribute('cx', '310');
            setTimeout(() => {
                clearInterval(winInt);
                setTimeout(resetGame, 1000);
            }, 2500);
        }
    }

    // ================================================================
    // 7. ЛОГІКА ГРИ
    // ================================================================
    let gameState = {
        word: "",
        size: 0,
        grid: [],       
        targets: [],   
        currentIndex: 0     
    };

    function resetGameUI() {
        document.getElementById('setup-screen').classList.remove('hidden');
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('nav-panel').classList.remove('active');
        setCharacterEmotion('neutral');
        document.getElementById('word-input').value = '';
    }

    function resetGame() {
        if (!isRemoteAction) {
            sendAction({ type: 'reset' });
        }
        resetGameUI();
    }

    function initGame(isAuto = false) {
        if (isRemoteAction) return;
        initAudio();
        
        let word, size;

        if (isAuto) {
            const DICT_UKR = ["СИЛА", "РОБОТ", "МЕХАНІЗМ", "РУХ", "МАГНІТ"];
            const DICT_RUS = ["СИЛА", "МЕХ", "КЛЮЧ", "ТОК", "МОТОР"];
            let dict = currentLang === 'UKR' ? DICT_UKR : DICT_RUS;
            word = dict[Math.floor(Math.random() * dict.length)];
            size = Math.max(3, Math.ceil(Math.sqrt(word.length)));
            document.getElementById('grid-size-input').value = size;
        } else {
            word = document.getElementById('word-input').value.trim().toUpperCase();
            size = parseInt(document.getElementById('grid-size-input').value) || 3;
        }

        if (currentLang === 'UKR') {
            word = word.replace(/[^А-ЯІЇЄҐ]/g, '').substring(0, 100);
        } else {
            word = word.replace(/[^А-ЯЁЪЫЬЭ]/g, '').substring(0, 100);
        }

        if (!word) {
            const inputs = document.querySelectorAll('.cyber-input');
            inputs.forEach(inp => {
                inp.style.borderColor = '#d84315';
                setTimeout(() => inp.style.borderColor = '#a35c17', 500);
            });
            playSound('error');
            return;
        }

        let requiredSize = Math.ceil(Math.sqrt(word.length));
        if (size < requiredSize) {
            size = requiredSize;
            document.getElementById('grid-size-input').value = size;
        }
        if (size > 10) size = 10;

        gameState.word = word;
        gameState.size = size;
        gameState.currentIndex = 0;
        
        generateLevel();
        renderLevel();

        document.getElementById('setup-screen').classList.add('hidden');
        setTimeout(() => {
            document.getElementById('game-screen').classList.add('active');
            document.getElementById('nav-panel').classList.add('active');
        }, 300);

        sendAction({
            type: 'init',
            lang: currentLang,
            word: gameState.word,
            size: gameState.size,
            grid: gameState.grid,
            targets: gameState.targets,
            currentIndex: gameState.currentIndex
        });
    }

    function generateLevel() {
        const { word, size } = gameState;
        
        gameState.grid = [];
        for (let y = 1; y <= size; y++) {
            for (let x = 0; x < size; x++) {
                gameState.grid.push({ x, y, letter: null });
            }
        }
        
        gameState.targets = [];
        let available = [...gameState.grid];
        
        for (let i = 0; i < word.length; i++) {
            const randIdx = Math.floor(Math.random() * available.length);
            const cell = available.splice(randIdx, 1)[0];
            const gridCell = gameState.grid.find(c => c.x === cell.x && c.y === cell.y);
            gridCell.letter = word[i];
            gameState.targets.push({ x: cell.x, y: cell.y, letter: word[i] });
        }

        gameState.grid.forEach(cell => {
            if (!cell.letter) {
                cell.letter = currentAlphabet[Math.floor(Math.random() * currentAlphabet.length)];
            }
        });
    }

    function renderLevel() {
        const { size, targets, grid } = gameState;
        
        const gridEl = document.getElementById('unified-grid');
        const codesRow = document.getElementById('cipher-codes');
        const lettersRow = document.getElementById('cipher-letters');
        
        gridEl.innerHTML = '';
        codesRow.innerHTML = '';
        lettersRow.innerHTML = '';

        let cellSize = 80;
        if (size >= 5) cellSize = 60;
        if (size >= 7) cellSize = 45;

        gridEl.style.gridTemplateColumns = `40px repeat(${size}, ${cellSize}px)`;
        gridEl.style.gridTemplateRows = `repeat(${size}, ${cellSize}px) 40px`;

        for (let y = size; y >= 1; y--) {
            const rowLabel = document.createElement('div');
            rowLabel.className = 'grid-label';
            rowLabel.textContent = y;
            gridEl.appendChild(rowLabel);

            for (let x = 0; x < size; x++) {
                const cellData = grid.find(c => c.x === x && c.y === y);
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.textContent = cellData.letter;
                if (size >= 7) cell.style.fontSize = '28px';
                cell.onclick = () => onCellClick(cell, cellData);
                gridEl.appendChild(cell);
            }
        }

        const emptyCorner = document.createElement('div');
        gridEl.appendChild(emptyCorner);

        for (let x = 0; x < size; x++) {
            const colLabel = document.createElement('div');
            colLabel.className = 'grid-label';
            colLabel.textContent = currentAlphabet[x];
            gridEl.appendChild(colLabel);
        }

        targets.forEach((target, index) => {
            const colChar = currentAlphabet[target.x];
            const codeEl = document.createElement('div');
            codeEl.className = 'cipher-code';
            codeEl.id = `code-${index}`;
            codeEl.textContent = `${colChar}${target.y}`;
            if (index === gameState.currentIndex) codeEl.classList.add('active');
            if (index < gameState.currentIndex) codeEl.classList.add('solved');
            codesRow.appendChild(codeEl);

            const slotEl = document.createElement('div');
            slotEl.className = 'cipher-slot';
            slotEl.id = `slot-${index}`;
            if (index < gameState.currentIndex) {
                slotEl.textContent = target.letter;
            }
            if (targets.length > 8) {
                slotEl.style.width = '35px';
                slotEl.style.fontSize = '32px';
                slotEl.style.height = '45px';
            }
            lettersRow.appendChild(slotEl);
        });
    }

    function renderLevelFromState() {
        const { size, targets, grid, currentIndex } = gameState;
        const gridEl = document.getElementById('unified-grid');
        const cells = gridEl.querySelectorAll('.cell');
        
        targets.forEach((target, index) => {
            const codeEl = document.getElementById(`code-${index}`);
            const slotEl = document.getElementById(`slot-${index}`);
            if (!codeEl || !slotEl) return;

            codeEl.classList.remove('active', 'solved');
            if (index < currentIndex) {
                codeEl.classList.add('solved');
                slotEl.textContent = target.letter;
            } else if (index === currentIndex) {
                codeEl.classList.add('active');
                slotEl.textContent = '';
            } else {
                slotEl.textContent = '';
            }
        });

        let idx = 0;
        for (let y = size; y >= 1; y--) {
            for (let x = 0; x < size; x++) {
                const cellData = grid.find(c => c.x === x && c.y === y);
                const cellEl = cells[idx++];
                if (!cellEl) continue;

                let isSolved = targets.slice(0, currentIndex).some(t => t.x === x && t.y === y);
                if (isSolved) {
                    cellEl.classList.add('solved');
                } else {
                    cellEl.classList.remove('solved');
                }
            }
        }
    }

    function onCellClick(cellElement, cellData) {
        if (isRemoteAction) return;

        const { targets, currentIndex } = gameState;
        if (currentIndex >= targets.length) return;

        const currentTarget = targets[currentIndex];

        if (cellData.x === currentTarget.x && cellData.y === currentTarget.y) {
            playSound('success');
            setCharacterEmotion('happy');
            
            cellElement.classList.add('solved');
            const currentCode = document.getElementById(`code-${currentIndex}`);
            const currentSlot = document.getElementById(`slot-${currentIndex}`);
            currentCode.classList.remove('active');
            currentCode.classList.add('solved');
            currentSlot.textContent = currentTarget.letter;

            gameState.currentIndex++;

            let isWin = false;
            if (gameState.currentIndex < targets.length) {
                const nextCode = document.getElementById(`code-${gameState.currentIndex}`);
                nextCode.classList.add('active');
            } else {
                isWin = true;
                setTimeout(() => {
                    playSound('win');
                    setCharacterEmotion('win');
                }, 300);
            }

            sendAction({
                type: 'click',
                currentIndex: gameState.currentIndex,
                isWin: isWin
            });
        } else {
            playSound('error');
            setCharacterEmotion('sad');
            cellElement.classList.remove('wrong');
            void cellElement.offsetWidth;
            cellElement.classList.add('wrong');
            sendAction({ type: 'error' });
        }
    }

    // ================================================================
    // 8. ЗАПУСК ПРИ ЗАВАНТАЖЕННІ
    // ================================================================
    window.onload = function() {
        // Спроба відновити стан із Firebase
        loadInitialState();
        console.log('Гра-шифратор завантажена. Синхронізація активна.');
    };
</script>
</body>
</html>
