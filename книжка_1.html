<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Інтерактивна книжка</title>
  <style>
    /* ==========================================================================
       ОСНОВНІ СТИЛІ ТА СЮЖЕТНИЙ ФОН ДЕРЕВ'ЯНОГО СТОЛУ
       ========================================================================== */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, 'Trebuchet MS', sans-serif;
      /* Теплий текстурований дерев'яний стіл без білих прямокутників */
      background:
        radial-gradient(ellipse at 50% 45%, rgba(255, 224, 163, 0.25) 0%, rgba(56, 30, 14, 0.72) 100%),
        repeating-linear-gradient(
          92deg,
          #6b3e26 0px,
          #75452b 18px,
          #5e341f 22px,
          #6f4128 54px,
          #59311d 58px
        );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Головний контейнер гри */
    .stage {
      position: relative;
      width: min(96vw, 1180px);
      height: min(94vh, 760px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Контейнер розгорнутої книжки */
    .book-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 24px 32px rgba(25, 10, 2, 0.65));
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Анімація перегортання сторінки */
    .book-wrapper.turning {
      transform: scale(0.97) rotateY(4deg);
    }

    /* Головне SVG-полотно книжки */
    #book-svg {
      width: 100%;
      height: 100%;
      max-height: 100%;
      overflow: visible;
    }

    /* ==========================================================================
       ІНТЕРАКТИВНІ ЕЛЕМЕНТИ (РОЗДІЛЕНІ ШАРИ — НІЩО НЕ ТІКАЄ ВІД КУРСОРА!)
       Зовнішній <g class="clickable"> тримає позицію,
       внутрішній <g class="hover-fx"> відповідає лише за масштаб та тремтіння.
       ========================================================================== */
    .clickable {
      cursor: pointer;
    }

    .clickable .hover-fx {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .clickable:hover .hover-fx {
      filter: brightness(1.08) drop-shadow(0 5px 7px rgba(0, 0, 0, 0.25));
      transform: scale(1.07);
    }

    .clickable:active .hover-fx {
      transform: scale(0.94);
    }

    /* Плавне переміщення предметів (кошик, рюкзак, торт, лійка, мухи) */
    .movable {
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.45s ease;
    }

    /* Тремтіння при виборі зайвого предмета (на внутрішньому шарі!) */
    @keyframes wobbleWrong {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-11deg) scale(1.06); }
      45% { transform: rotate(11deg) scale(1.06); }
      70% { transform: rotate(-6deg); }
      85% { transform: rotate(4deg); }
    }

    .wobble .hover-fx {
      animation: wobbleWrong 0.48s ease-in-out;
    }

    /* Живі фонові анімації (на окремому внутрішньому шарі) */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    @keyframes swayGentle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3.5deg); }
    }

    @keyframes flyBuzz {
      0%   { transform: translate(0px, 0px) rotate(0deg); }
      25%  { transform: translate(10px, -9px) rotate(6deg); }
      50%  { transform: translate(-8px, -14px) rotate(-5deg); }
      75%  { transform: translate(-12px, 5px) rotate(8deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    @keyframes wingFlap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.35); }
    }

    @keyframes waveDrift {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(10px); }
    }

    @keyframes duckBob {
      0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px #ffd54f); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px #ffeb3b); transform: scale(1.1); }
    }

    .anim-float { animation: floatSlow 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .anim-sway  { animation: swayGentle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .anim-buzz  { animation: flyBuzz 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .anim-wing  { animation: wingFlap 0.14s linear infinite; transform-box: fill-box; transform-origin: center; }
    .anim-wave  { animation: waveDrift 3.8s ease-in-out infinite; }
    .anim-duck  { animation: duckBob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    /* ==========================================================================
       МІНІМАЛІСТИЧНІ КНОПКИ НАВІГАЦІЇ (НАЗАД / ДАЛІ)
       ========================================================================== */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 62px;
      height: 62px;
      border: none;
      background: none;
      cursor: pointer;
      z-index: 30;
      padding: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.12);
      filter: brightness(1.1);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.94);
    }

    #btn-prev { left: -12px; }
    #btn-next { right: -12px; }

    /* Підсвітка кнопки "Далі", коли завдання виконано */
    #btn-next.ready-pulse svg {
      animation: pulseGlow 1.3s ease-in-out infinite;
    }

    /* ==========================================================================
       ЖИВИЙ ПЕРСОНАЖ — ЛИСЕНЯ (РОЗТАШОВАНЕ БІЛЯ КНИЖКИ)
       ========================================================================== */
    .fox-container {
      position: absolute;
      bottom: -8px;
      left: 14px;
      width: clamp(120px, 15vw, 175px);
      height: clamp(120px, 15vw, 175px);
      z-index: 25;
      pointer-events: auto;
      cursor: pointer;
      filter: drop-shadow(0 10px 14px rgba(30, 12, 0, 0.45));
    }

    @keyframes tailWag {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(9deg); }
    }

    @keyframes foxBreathe {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.03); }
    }

    @keyframes foxJump {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-26px) scale(1.07, 0.95); }
      55% { transform: translateY(0) scale(0.96, 1.05); }
      75% { transform: translateY(-14px) scale(1.03); }
    }

    @keyframes foxHeadTilt {
      0%, 100% { transform: rotate(0deg); }
      30%, 70% { transform: rotate(-14deg); }
    }

    @keyframes earTwitch {
      0%, 92%, 100% { transform: rotate(0deg); }
      96% { transform: rotate(10deg); }
    }

    .fox-tail { animation: tailWag 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: right bottom; }
    .fox-body-anim { animation: foxBreathe 3s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .fox-ear-r { animation: earTwitch 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }

    .fox-container.happy { animation: foxJump 0.85s ease-in-out 2; }
    .fox-container.confused #fox-head { animation: foxHeadTilt 0.9s ease-in-out; transform-box: fill-box; transform-origin: bottom center; }

    /* ==========================================================================
       ШАР ЧАСТИНОК ДЛЯ ЯСКРАВОГО ФІДБЕКУ (ЗІРОЧКИ, КРАПЛІ, СЕРДЕЧКА)
       ========================================================================== */
    #fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      overflow: hidden;
    }

    @media (max-width: 760px) {
      #btn-prev { left: 2px; width: 48px; height: 48px; }
      #btn-next { right: 2px; width: 48px; height: 48px; }
      .fox-container { width: 105px; height: 105px; left: 4px; bottom: 0; }
    }
  </style>
</head>
<body>

  <div class="stage">
    <!-- Кнопка НАЗАД (попередня сторінка) -->
    <button id="btn-prev" class="nav-btn" aria-label="Попередня сторінка">
      <svg viewBox="0 0 70 70">
        <defs>
          <radialGradient id="btnGradL" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffd97d"/>
            <stop offset="60%" stop-color="#e09f3e"/>
            <stop offset="100%" stop-color="#9e5b16"/>
          </radialGradient>
        </defs>
        <circle cx="35" cy="35" r="31" fill="url(#btnGradL)" stroke="#5c3309" stroke-width="3.5"/>
        <circle cx="35" cy="35" r="24" fill="none" stroke="#fff3c4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
        <path d="M41 21 L24 35 L41 49" fill="none" stroke="#4a2505" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- РОЗГОРНУТА ІНТЕРАКТИВНА КНИЖКА -->
    <div class="book-wrapper" id="book-wrapper">
      <svg id="book-svg" viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Градієнти обкладинки та пергаменту книжки -->
          <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b2f2f"/>
            <stop offset="50%" stop-color="#691f1f"/>
            <stop offset="100%" stop-color="#451212"/>
          </linearGradient>

          <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f8ebd2"/>
            <stop offset="46%" stop-color="#fff6e3"/>
            <stop offset="50%" stop-color="#d7c29e"/>
            <stop offset="54%" stop-color="#fff6e3"/>
            <stop offset="100%" stop-color="#f3e1bf"/>
          </linearGradient>

          <!-- Стрічка-сувій для великого тексту завдання -->
          <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff2c2"/>
            <stop offset="50%" stop-color="#ffe194"/>
            <stop offset="100%" stop-color="#f4c462"/>
          </linearGradient>

          <!-- Візерунки скатертини та шпалер -->
          <pattern id="ginghamPattern" width="28" height="28" patternUnits="userSpaceOnUse">
            <rect width="28" height="28" fill="#ffe9d6"/>
            <rect width="14" height="28" fill="#f7b29c" opacity="0.45"/>
            <rect width="28" height="14" fill="#f7b29c" opacity="0.45"/>
          </pattern>

          <pattern id="wallStripes" width="36" height="36" patternUnits="userSpaceOnUse">
            <rect width="36" height="36" fill="#d7c4e8"/>
            <rect width="18" height="36" fill="#cbb3e0"/>
          </pattern>

          <!-- Маска для внутрішньої ілюстрації сторінки -->
          <clipPath id="sceneClip">
            <rect x="64" y="152" width="972" height="508" rx="18"/>
          </clipPath>

          <!-- Тінь для об'ємності -->
          <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#2b1404" flood-opacity="0.28"/>
          </filter>
        </defs>

        <!-- Тверда обкладинка книжки із золотим тисненням -->
        <rect x="26" y="20" width="1048" height="676" rx="28" fill="url(#coverGrad)" stroke="#330d0d" stroke-width="5"/>
        <rect x="36" y="30" width="1028" height="656" rx="22" fill="none" stroke="#d9a441" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.7"/>

        <!-- Багатошарові краї паперових сторінок -->
        <rect x="44" y="38" width="1012" height="640" rx="18" fill="#d9c39e"/>
        <rect x="49" y="36" width="1002" height="638" rx="16" fill="#ead6b3"/>
        <rect x="54" y="34" width="992" height="636" rx="16" fill="url(#pageGrad)" stroke="#c7ae82" stroke-width="2"/>

        <!-- Червона шовкова закладка знизу -->
        <path d="M535 668 L565 668 L565 716 L550 701 L535 716 Z" fill="#c92a2a" stroke="#7d1515" stroke-width="2"/>

        <!-- КОНТЕЙНЕР ДЛЯ АКТИВНОЇ СЦЕНИ (заповнюється з JavaScript) -->
        <g id="scene-root" clip-path="url(#sceneClip)"></g>

        <!-- Легка тінь згину книжки посередині поверх сцени -->
        <rect x="534" y="152" width="32" height="508" fill="url(#pageGrad)" opacity="0.16" pointer-events="none"/>
        <line x1="550" y1="36" x2="550" y2="670" stroke="#70522b" stroke-width="2" opacity="0.22" pointer-events="none"/>

        <!-- ЗБІЛЬШЕНА ДЕКОРАТИВНА СТРІЧКА-СУВІЙ ДЛЯ КРУПНОГО ТЕКСТУ ЗАВДАННЯ -->
        <g id="task-banner" filter="url(#softShadow)">
          <!-- Хвостики стрічки -->
          <path d="M84 48 L48 64 L66 94 L48 124 L92 124 Z" fill="#d99b38" stroke="#804d0c" stroke-width="2.5"/>
          <path d="M1016 48 L1052 64 L1034 94 L1052 124 L1008 124 Z" fill="#d99b38" stroke="#804d0c" stroke-width="2.5"/>
          <!-- Основна декоративна плашка -->
          <rect x="78" y="34" width="944" height="108" rx="24" fill="url(#bannerGrad)" stroke="#8c5311" stroke-width="3.5"/>
          <rect x="88" y="42" width="924" height="92" rx="18" fill="none" stroke="#fff7dc" stroke-width="2.2" stroke-dasharray="7 5" opacity="0.88"/>
          <!-- Кутові заклепки -->
          <circle cx="104" cy="88" r="5.5" fill="#b86b14"/>
          <circle cx="996" cy="88" r="5.5" fill="#b86b14"/>
          <!-- Крупний текст завдання (підтримує 1 або 2 рядки) -->
          <text id="task-text" x="550" y="96" text-anchor="middle" fill="#3b1a04" font-family="Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="0.4"></text>
        </g>

        <!-- Святкове золоте сяйво по контуру сторінки при перемозі -->
        <rect id="win-glow" x="64" y="152" width="972" height="508" rx="18" fill="none" stroke="#ffd43b" stroke-width="10" opacity="0" pointer-events="none"/>
      </svg>

      <!-- ЖИВИЙ ПЕРСОНАЖ — ЛИСЕНЯ (взаємодіє рухами та емоціями) -->
      <div class="fox-container" id="fox-character">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Пухнастий хвіст -->
          <g class="fox-tail">
            <path d="M58 168 C16 168, 8 118, 34 102 C54 90, 74 114, 72 146 Z" fill="#e86a24" stroke="#7a2c08" stroke-width="3.5"/>
            <path d="M34 102 C22 108, 18 124, 26 132 C38 122, 46 112, 49 104 C44 100, 38 100, 34 102 Z" fill="#fff4e6"/>
          </g>

          <!-- Тіло та лапки -->
          <g class="fox-body-anim">
            <ellipse cx="106" cy="158" rx="44" ry="34" fill="#f07829" stroke="#7a2c08" stroke-width="3.5"/>
            <ellipse cx="108" cy="162" rx="24" ry="22" fill="#fff3e0"/>
            <ellipse cx="82" cy="182" rx="13" ry="9" fill="#592209"/>
            <ellipse cx="132" cy="182" rx="13" ry="9" fill="#592209"/>
          </g>

          <!-- Голова Лисеняти -->
          <g id="fox-head">
            <path d="M68 84 L54 34 L94 64 Z" fill="#e86a24" stroke="#7a2c08" stroke-width="3.5" stroke-linejoin="round"/>
            <path d="M70 76 L62 46 L86 64 Z" fill="#ffd2b3"/>
            <g class="fox-ear-r">
              <path d="M144 84 L158 34 L118 64 Z" fill="#e86a24" stroke="#7a2c08" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="M142 76 L150 46 L126 64 Z" fill="#ffd2b3"/>
            </g>

            <path d="M56 96 C56 62, 156 62, 156 96 C156 126, 128 142, 106 142 C84 142, 56 126, 56 96 Z" fill="#f58231" stroke="#7a2c08" stroke-width="3.5"/>
            <path d="M58 102 C68 96, 86 106, 94 122 C98 130, 102 138, 106 140 C82 140, 58 124, 58 102 Z" fill="#fff4e6"/>
            <path d="M154 102 C144 96, 126 106, 118 122 C114 130, 110 138, 106 140 C130 140, 154 124, 154 102 Z" fill="#fff4e6"/>

            <ellipse cx="75" cy="116" rx="8" ry="4.5" fill="#ff8a80" opacity="0.55"/>
            <ellipse cx="137" cy="116" rx="8" ry="4.5" fill="#ff8a80" opacity="0.55"/>

            <!-- Звичайний живий погляд -->
            <g id="fox-eyes-normal">
              <circle cx="88" cy="98" r="7.5" fill="#2b1204"/>
              <circle cx="124" cy="98" r="7.5" fill="#2b1204"/>
              <circle cx="85.5" cy="95.5" r="2.6" fill="#ffffff"/>
              <circle cx="121.5" cy="95.5" r="2.6" fill="#ffffff"/>
            </g>

            <!-- Щасливі примружені оченята -->
            <g id="fox-eyes-happy" style="display:none">
              <path d="M78 100 Q88 88 98 100" fill="none" stroke="#2b1204" stroke-width="4.5" stroke-linecap="round"/>
              <path d="M114 100 Q124 88 134 100" fill="none" stroke="#2b1204" stroke-width="4.5" stroke-linecap="round"/>
            </g>

            <!-- Здивований погляд (коли натиснуто зайве) -->
            <g id="fox-eyes-confused" style="display:none">
              <circle cx="88" cy="98" r="8.5" fill="#fff"/>
              <circle cx="124" cy="98" r="8.5" fill="#fff"/>
              <circle cx="89" cy="98" r="4.5" fill="#2b1204"/>
              <circle cx="123" cy="98" r="4.5" fill="#2b1204"/>
              <path d="M78 84 L96 88" stroke="#592209" stroke-width="3.2" stroke-linecap="round"/>
              <path d="M116 88 L134 81" stroke="#592209" stroke-width="3.2" stroke-linecap="round"/>
            </g>

            <ellipse cx="106" cy="116" rx="8" ry="5.5" fill="#2b1204"/>
            <ellipse cx="104" cy="114.5" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.6"/>
            <path id="fox-mouth" d="M97 126 Q106 134 115 126" fill="none" stroke="#592209" stroke-width="3.2" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <!-- Шар для вибухів зірочок, крапельок і сердечок -->
      <svg id="fx-layer" viewBox="0 0 1100 720"></svg>
    </div>

    <!-- Кнопка ДАЛІ (наступна сторінка без очікування) -->
    <button id="btn-next" class="nav-btn" aria-label="Наступна сторінка">
      <svg viewBox="0 0 70 70">
        <defs>
          <radialGradient id="btnGradR" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffd97d"/>
            <stop offset="60%" stop-color="#e09f3e"/>
            <stop offset="100%" stop-color="#9e5b16"/>
          </radialGradient>
        </defs>
        <circle cx="35" cy="35" r="31" fill="url(#btnGradR)" stroke="#5c3309" stroke-width="3.5"/>
        <circle cx="35" cy="35" r="24" fill="none" stroke="#fff3c4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
        <path d="M29 21 L46 35 L29 49" fill="none" stroke="#4a2505" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <script>
    /* ==========================================================================
       1. ЗВУКОВИЙ РУШІЙ (WEB AUDIO API — БЕЗ ЗОВНІШНІХ ФАЙЛІВ І БЕЗ СЛІВ)
       ========================================================================== */
    const SoundFX = (() => {
      let ctx = null;

      function init() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') ctx.resume();
      }

      function tone(freq, type, startTime, duration, vol = 0.2, freqEnd = null) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        if (freqEnd) {
          osc.frequency.exponentialRampToValueAtTime(freqEnd, startTime + duration);
        }
        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      return {
        pageTurn() {
          init();
          const bufferSize = ctx.sampleRate * 0.22;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(900, ctx.currentTime);

       ========================================================================== */
    const fxLayer = document.getElementById('fx-layer');

    function spawnParticles(x, y, style = 'stars', count = 12) {
      const colors = {
        stars: ['#ffd43b', '#ff922b', '#ff6b6b', '#51cf66', '#339af0', '#cc5de8'],
        water: ['#74c0fc', '#339af0', '#a5d8ff', '#4dabf7'],
        hearts: ['#ff6b6b', '#ff8787', '#f06595', '#faa2c1'],
        crumbs: ['#ffd8a8', '#f08c00', '#ffe066', '#e8590c']
      }[style] || ['#ffd43b', '#ff6b6b', '#51cf66'];

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const speed = 35 + Math.random() * 85;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed - (style === 'water' ? -25 : 20);
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = 6 + Math.random() * 9;

        const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        if (style === 'water') {
          el.setAttribute('d', 'M0,-8 C5,-2 6,4 0,7 C-6,4 -5,-2 0,-8 Z');
        } else if (style === 'hearts') {
          el.setAttribute('d', 'M0,5 C-7,0 -9,-6 -4,-8 C-1,-9 0,-6 0,-4 C0,-6 1,-9 4,-8 C9,-6 7,0 0,5 Z');
        } else {
          el.setAttribute('d', 'M0,-9 L2.5,-3 L9,-3 L3.8,1 L5.8,8 L0,4 L-5.8,8 L-3.8,1 L-9,-3 L-2.5,-3 Z');
        }

        el.setAttribute('fill', color);
        el.setAttribute('transform', `translate(${x}, ${y}) scale(${size / 10})`);
        fxLayer.appendChild(el);

        const duration = 550 + Math.random() * 400;
        const start = performance.now();

        function animate(now) {
          const p = Math.min((now - start) / duration, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          const cx = x + dx * ease;
          const cy = y + dy * ease + p * p * 45;
          const sc = (size / 10) * (1 - p * 0.65);
          const rot = p * 220 * (i % 2 === 0 ? 1 : -1);
          el.setAttribute('transform', `translate(${cx}, ${cy}) rotate(${rot}) scale(${sc})`);
          el.setAttribute('opacity', (1 - p).toFixed(2));
          if (p < 1) {
            requestAnimationFrame(animate);
          } else {
            el.remove();
          }
        }
        requestAnimationFrame(animate);
      }
    }

                <path d="M-12 6 Q0 15 12 6" fill="none" stroke="#2b8a3e" stroke-width="2.8" stroke-linecap="round"/>
                <ellipse cx="-24" cy="22" rx="12" ry="6" fill="#37b24d"/>
                <ellipse cx="24" cy="22" rx="12" ry="6" fill="#37b24d"/>
              </g>
            </g>

            <!-- ЗАЙВИЙ ПРЕДМЕТ: Червона рибка -->
            <g id="p4-fish" class="clickable" style="transform: translate(660px, 565px)" filter="url(#softShadow)">
              <g class="hover-fx">
                <g class="anim-wave">
                  <polygon points="-32,0 -54,-18 -54,18" fill="#ff6b6b" stroke="#a61e22" stroke-width="2.5"/>
                  <ellipse cx="0" cy="0" rx="34" ry="19" fill="#ff8787" stroke="#a61e22" stroke-width="3"/>
                  <circle cx="16" cy="-4" r="4" fill="#111"/>
                  <circle cx="17" cy="-5" r="1.4" fill="#fff"/>
                </g>
              </g>
            </g>

            <!-- ЗАЙВИЙ ПРЕДМЕТ: Бабка -->
            <g id="p4-dragonfly" class="clickable" style="transform: translate(765px, 224px)">
              <g class="hover-fx">
                <g class="anim-float">
                  <g class="anim-wing">
                    <ellipse cx="-18" cy="-6" rx="22" ry="6" fill="#e7f5ff" stroke="#339af0" stroke-width="1.8" transform="rotate(-12)"/>
                    <ellipse cx="18" cy="-6" rx="22" ry="6" fill="#e7f5ff" stroke="#339af0" stroke-width="1.8" transform="rotate(12)"/>
                  </g>
                  <rect x="-4" y="-12" width="8" height="44" rx="4" fill="#15aabf" stroke="#0b7285" stroke-width="2"/>
                  <circle cx="0" cy="-15" r="7" fill="#15aabf" stroke="#0b7285" stroke-width="2"/>
                </g>
              </g>
            </g>

            ${drawDuck('y1', 260, 390, '#ffd43b', '#d97706', true, 1)}
            ${drawDuck('y2', 520, 355, '#ffd43b', '#d97706', true, -1)}
            ${drawDuck('y3', 440, 520, '#ffd43b', '#d97706', true, 1)}

            ${drawDuck('w1', 680, 420, '#f8f9fa', '#868e96', false, -1)}
            ${drawDuck('w2', 320, 485, '#f8f9fa', '#868e96', false, 1)}
          `;

          function checkWin() {
            if (!won && fedYellow.size === 3 && frogFound) {
              won = true;
              onWin();
            }
          }

          root.querySelectorAll('.duck').forEach(duck => {
            duck.addEventListener('click', () => {
              const isYellow = duck.dataset.yellow === 'true';
              const x = Number(duck.dataset.x);
              const y = Number(duck.dataset.y);
              if (!isYellow) {
                triggerDistractor(duck, x, y);
                return;
              }
              const id = duck.dataset.id;
              if (!fedYellow.has(id)) {
                fedYellow.add(id);
                duck.querySelector('.fed-mark').style.display = 'block';
                SoundFX.quack();
                Fox.setEmotion('happy', 700);
                spawnParticles(x, y - 20, 'crumbs', 10);
                checkWin();
              } else {
                SoundFX.quack();
              }
            });
          });

          const frog = root.querySelector('#p4-frog');
          frog.addEventListener('click', () => {
            SoundFX.ribbit();
            spawnParticles(868, 450, 'water', 10);
            frog.style.transform = 'translate(868px, 434px) scale(1.15)';
            setTimeout(() => { frog.style.transform = 'translate(868px, 466px) scale(1)'; }, 280);
            if (!frogFound) {
              frogFound = true;
              Fox.setEmotion('happy', 800);
              checkWin();
            }
          });

          [['p4-fish', 660, 565], ['p4-dragonfly', 765, 224]].forEach(([id, x, y]) => {
            const el = root.querySelector('#' + id);
            el.addEventListener('click', () => triggerDistractor(el, x, y));
          });
        }
      },

      /* ------------------------------------------------------------------------
         СТОРІНКА 5: СОНЯЧНА КЛУМБА ТА ЛІЙКА
         Умова: Полити всі 3 сині квіти І сховати лійку під лавку.
         Зайві предмети: червоні тюльпани, жовті ромашки, відерце.
         ------------------------------------------------------------------------ */
      {
        sentence: 'Полий сині квіти\nі сховай лійку під лавку.',
        init(root, onWin) {
          let wateredBlue = new Set();
          let canHidden = false;
          let won = false;

          const drawFlower = (id, x, y, color, stroke, isBlue) => `
            <g class="flower clickable" data-id="${id}" data-blue="${isBlue}" data-x="${x}" data-y="${y}" style="transform: translate(${x}px, ${y}px)">
              <g class="hover-fx">
                <path class="stem" d="M0 0 Q-12 -32 ${isBlue ? '14' : '0'} ${isBlue ? '-54' : '-76'}" fill="none" stroke="#2f9e44" stroke-width="6" stroke-linecap="round"/>
                <ellipse cx="-14" cy="-24" rx="14" ry="7" fill="#51cf66" transform="rotate(-24 -14 -24)"/>
                <ellipse cx="14" cy="-30" rx="14" ry="7" fill="#51cf66" transform="rotate(24 14 -30)"/>
                <g class="bloom" transform="translate(${isBlue ? '14, -56' : '0, -78'}) scale(${isBlue ? '0.78' : '1'})">
                  <circle cx="0" cy="-16" r="13" fill="${color}" stroke="${stroke}" stroke-width="2.5"/>
                  <circle cx="15" cy="-4" r="13" fill="${color}" stroke="${stroke}" stroke-width="2.5"/>
                  <circle cx="9" cy="13" r="13" fill="${color}" stroke="${stroke}" stroke-width="2.5"/>
                  <circle cx="-9" cy="13" r="13" fill="${color}" stroke="${stroke}" stroke-width="2.5"/>
                  <circle cx="-15" cy="-4" r="13" fill="${color}" stroke="${stroke}" stroke-width="2.5"/>
                  <circle cx="0" cy="0" r="10" fill="#ffd43b" stroke="#e67700" stroke-width="2"/>
                </g>
              </g>
            </g>`;

          root.innerHTML = `
            <rect x="64" y="152" width="972" height="220" fill="#c5f6fa"/>
            <g fill="#f3d9a4" stroke="#b07d44" stroke-width="3">
              ${Array.from({ length: 14 }, (_, i) => `<path d="M${80 + i * 68} 365 L${80 + i * 68} 255 L${108 + i * 68} 230 L${136 + i * 68} 255 L${136 + i * 68} 365 Z"/>`).join('')}
              <rect x="64" y="280" width="972" height="14"/>
              <rect x="64" y="330" width="972" height="14"/>
            </g>
            <rect x="64" y="355" width="972" height="305" fill="#69db7c"/>
            <ellipse cx="380" cy="545" rx="280" ry="72" fill="#8d5524" stroke="#5c3317" stroke-width="4"/>

            <!-- ПАРКОВА ЛАВКА -->
            <g id="bench-area" class="clickable" filter="url(#softShadow)">
              <g class="hover-fx">
                <ellipse cx="835" cy="492" rx="145" ry="26" fill="#2b6e35" opacity="0.45"/>
                <rect x="720" y="405" width="16" height="86" rx="4" fill="#495057"/>
                <rect x="935" y="405" width="16" height="86" rx="4" fill="#495057"/>
                <rect x="700" y="336" width="272" height="28" rx="6" fill="#d97706" stroke="#78350f" stroke-width="3"/>
                <rect x="700" y="372" width="272" height="26" rx="6" fill="#d97706" stroke="#78350f" stroke-width="3"/>
                <rect x="692" y="406" width="288" height="24" rx="7" fill="#f59e0b" stroke="#78350f" stroke-width="3.5"/>
              </g>
            </g>

            <!-- ЗАЙВИЙ ПРЕДМЕТ: Відерце -->
            <g id="p5-bucket" class="clickable" filter="url(#softShadow)">
              <g class="hover-fx">
                <path d="M745 555 L758 615 L814 615 L827 555 Z" fill="#ff922b" stroke="#b35900" stroke-width="3"/>
                <ellipse cx="786" cy="555" rx="41" ry="10" fill="#ffd8a8" stroke="#b35900" stroke-width="3"/>
                <path d="M748 555 C756 520, 816 520, 824 555" fill="none" stroke="#495057" stroke-width="4"/>
              </g>
            </g>

            ${drawFlower('b1', 210, 545, '#339af0', '#1864ab', true)}
            ${drawFlower('b2', 390, 520, '#339af0', '#1864ab', true)}
            ${drawFlower('b3', 555, 555, '#339af0', '#1864ab', true)}

            ${drawFlower('r1', 300, 575, '#ff6b6b', '#a61e22', false)}
            ${drawFlower('r2', 485, 515, '#ff6b6b', '#a61e22', false)}
            ${drawFlower('y1', 275, 505, '#ffe066', '#d97706', false)}
            ${drawFlower('y2', 465, 582, '#ffe066', '#d97706', false)}

            <!-- САДОВА ЛІЙКА -->
            <g id="p5-can" class="clickable movable" style="transform: translate(885px, 565px)" filter="url(#softShadow)">
              <g class="hover-fx">
                <path d="M22 -12 C48 -24, 54 16, 22 18" fill="none" stroke="#20c997" stroke-width="9" stroke-linecap="round"/>
                <path d="M-26 6 L-58 -22 L-50 -30 L-18 -6 Z" fill="#20c997" stroke="#087f5b" stroke-width="3"/>
                <ellipse cx="-56" cy="-28" rx="7" ry="13" fill="#ffd43b" stroke="#087f5b" stroke-width="2.5" transform="rotate(-40 -56 -28)"/>
                <rect x="-28" y="-20" width="54" height="46" rx="10" fill="#38d9a9" stroke="#087f5b" stroke-width="3.5"/>
                <ellipse cx="-1" cy="-20" rx="22" ry="7" fill="#0ca678" stroke="#087f5b" stroke-width="2.5"/>
              </g>
            </g>
          `;

          function checkWin() {
            if (!won && wateredBlue.size === 3 && canHidden) {
              won = true;
              onWin();
            }
          }

          root.querySelectorAll('.flower').forEach(fl => {
            fl.addEventListener('click', () => {
              const x = Number(fl.dataset.x);
              const y = Number(fl.dataset.y);
              if (canHidden) {
                triggerDistractor(root.querySelector('#p5-can'), 835, 470);
                return;
              }
              if (fl.dataset.blue !== 'true') {
                triggerDistractor(fl, x, y - 55);
                return;
              }
              const id = fl.dataset.id;
              SoundFX.water();
              spawnParticles(x, y - 70, 'water', 14);
              if (!wateredBlue.has(id)) {
                wateredBlue.add(id);
                fl.querySelector('.stem').setAttribute('d', 'M0 0 Q-4 -38 0 -82');
                fl.querySelector('.bloom').setAttribute('transform', 'translate(0, -86) scale(1.12)');
                Fox.setEmotion('happy', 750);
                checkWin();
              }
            });
          });

          function toggleCan() {
            canHidden = !canHidden;
            const can = root.querySelector('#p5-can');
            if (canHidden) {
              can.style.transform = 'translate(838px, 466px) scale(0.76)';
              SoundFX.pop();
              spawnParticles(838, 460, 'stars', 8);
            } else {
              can.style.transform = 'translate(885px, 565px) scale(1)';
              SoundFX.unpop();
            }
            checkWin();
          }

          root.querySelector('#p5-can').addEventListener('click', toggleCan);
          root.querySelector('#bench-area').addEventListener('click', toggleCan);

          const bucket = root.querySelector('#p5-bucket');
          bucket.addEventListener('click', () => triggerDistractor(bucket, 786, 580));
        }
      },

      /* ------------------------------------------------------------------------
         СТОРІНКА 6: ПІКНІК У ЛІСІ (ЗБИРАЄМО РЮКЗАК)
         Умова: У рюкзаку рівно сир, хліб і термос (без зайвих предметів!).
         Зайві предмети: 2 шишки, гумовий чобіт, компас.
         ------------------------------------------------------------------------ */
      {
        sentence: 'Збери в рюкзак сир,\nхліб і термос.',
        init(root, onWin) {
          const inBag = new Map();
          let won = false;

          const bagSlots = [
            { x: 808, y: 412 }, { x: 862, y: 405 }, { x: 912, y: 414 },
            { x: 835, y: 382 }, { x: 888, y: 382 }
          ];

          root.innerHTML = `
            <rect x="64" y="152" width="972" height="220" fill="#d0ebff"/>
            <g fill="#2b8a3e">
              <polygon points="150,350 215,180 280,350"/>
              <polygon points="270,355 325,205 380,355"/>
              <polygon points="690,355 755,175 820,355"/>
              <polygon points="840,355 915,195 990,355"/>
            </g>
            <path d="M64 345 Q380 315 680 355 Q880 375 1036 335 L1036 660 L64 660 Z" fill="#51cf66"/>

            <g filter="url(#softShadow)">
              <rect x="195" y="455" width="245" height="90" rx="18" fill="#8d5524" stroke="#5c3317" stroke-width="3.5"/>
              <ellipse cx="317" cy="455" rx="122" ry="34" fill="#e6be8a" stroke="#5c3317" stroke-width="3.5"/>
              <ellipse cx="317" cy="455" rx="90" ry="22" fill="none" stroke="#c7925b" stroke-width="2.5"/>
            </g>

            <!-- ЗАДНЯ ЧАСТИНА РЮКЗАКА -->
            <g filter="url(#softShadow)">
              <path d="M774 420 C774 340, 946 340, 946 420 Z" fill="#1864ab" stroke="#0b3d6b" stroke-width="4"/>
            </g>

            <!-- ШАР ПРЕДМЕТІВ -->
            <g id="picnic-items">
              <g class="bag-item clickable movable" data-id="cheese" data-need="1" data-ox="255" data-oy="435" style="transform: translate(255px, 435px)" filter="url(#softShadow)">
                <g class="hover-fx">
                  <polygon points="-38,16 38,16 26,-26 -38,16" fill="#ffd43b" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
                  <rect x="-38" y="16" width="76" height="18" rx="4" fill="#fcc419" stroke="#d97706" stroke-width="3"/>
                  <circle cx="-6" cy="6" r="6" fill="#f08c00"/>
                  <circle cx="14" cy="-2" r="5" fill="#f08c00"/>
                  <circle cx="12" cy="24" r="4" fill="#d97706"/>
                </g>
              </g>

              <g class="bag-item clickable movable" data-id="bread" data-need="1" data-ox="378" data-oy="442" style="transform: translate(378px, 442px)" filter="url(#softShadow)">
                <g class="hover-fx">
                  <path d="M-44 14 C-46 -22, 46 -22, 44 14 C44 28, -44 28, -44 14 Z" fill="#d97706" stroke="#78350f" stroke-width="3.5"/>
                  <path d="M-20 -10 L-8 8 M2 -12 L14 8 M22 -8 L30 6" stroke="#ffec99" stroke-width="4" stroke-linecap="round"/>
                </g>
              </g>

              <g class="bag-item clickable movable" data-id="thermos" data-need="1" data-ox="560" data-oy="455" style="transform: translate(560px, 455px)" filter="url(#softShadow)">
                <g class="hover-fx">
                  <rect x="-22" y="-36" width="44" height="78" rx="12" fill="#e03131" stroke="#7d1515" stroke-width="3"/>
                  <rect x="-22" y="-12" width="44" height="22" fill="#ffd43b"/>
                  <rect x="-17" y="-52" width="34" height="20" rx="6" fill="#adb5bd" stroke="#495057" stroke-width="3"/>
                </g>
              </g>

              <g class="bag-item clickable movable" data-id="cone1" data-need="0" data-ox="480" data-oy="570" style="transform: translate(480px, 570px)" filter="url(#softShadow)">
                <g class="hover-fx">
                  <ellipse cx="0" cy="0" rx="22" ry="30" fill="#8d5524" stroke="#4a2505" stroke-width="3"/>
                  <path d="M-16 -12 L16 12 M-18 4 L14 -14 M-10 20 L14 4" stroke="#5c3317" stroke-width="3"/>
                </g>
              </g>

              <g class="bag-item clickable movable" data-id="cone2" data-need="0" data-ox="630" data-oy="560" style="transform: translate(630px, 560px)" filter="url(#softShadow)">
                <g class="hover-fx">
                  <ellipse cx="0" cy="0" rx="20" ry="27" fill="#9c5a19" stroke="#4a2505" stroke-width="3"/>
                  <path d="M-14 -10 L14 10 M-15 4 L12 -12" stroke="#5c3317" stroke-width="3"/>
                </g>
              </g>

              <g class="bag-item clickable movable" data-id="boot" data-need="0" data-ox="185" data-oy="585" style="transform: translate(185px, 585px)" filter="url(#softShadow)">
                <g class="hover-fx">
                  <path d="M-16 -36 L14 -36 L14 8 L36 12 C42 14, 42 28, 34 28 L-16 28 Z" fill="#38d9a9" stroke="#087f5b" stroke-width="3.5" stroke-linejoin="round"/>
                  <rect x="-16" y="22" width="54" height="8" rx="3" fill="#ffd43b"/>
                </g>
              </g>

              <g class="bag-item clickable movable" data-id="compass" data-need="0" data-ox="660" data-oy="430" style="transform: translate(660px, 430px)" filter="url(#softShadow)">
                <g class="hover-fx">
                  <circle cx="0" cy="0" r="26" fill="#ffd43b" stroke="#8c5311" stroke-width="3.5"/>
                  <circle cx="0" cy="0" r="20" fill="#fff9db"/>
                  <polygon points="0,-16 6,0 -6,0" fill="#e03131"/>
                  <polygon points="0,16 6,0 -6,0" fill="#339af0"/>
                  <circle cx="0" cy="0" r="3" fill="#212529"/>
                </g>
              </g>
            </g>

            <!-- ПЕРЕДНЯ ЧАСТИНА РЮКЗАКА -->
            <g pointer-events="none" filter="url(#softShadow)">
              <rect x="765" y="422" width="190" height="175" rx="34" fill="#228be6" stroke="#0b3d6b" stroke-width="4"/>
              <rect x="795" y="495" width="130" height="76" rx="18" fill="#4dabf7" stroke="#0b3d6b" stroke-width="3"/>
              <line x1="806" y1="518" x2="914" y2="518" stroke="#ffd43b" stroke-width="5" stroke-linecap="round"/>
              <circle cx="860" cy="518" r="7" fill="#ffd43b" stroke="#0b3d6b" stroke-width="2"/>
            </g>
          `;

          function checkWin() {
            let needed = 0, extras = 0;
            inBag.forEach(need => need ? needed++ : extras++);
            if (extras > 0) Fox.setEmotion('confused', 950);
            if (!won && needed === 3 && extras === 0) {
              won = true;
              onWin();
            }
          }

          root.querySelectorAll('.bag-item').forEach(item => {
            item.addEventListener('click', () => {
              const id = item.dataset.id;
              const need = item.dataset.need === '1';
              const ox = Number(item.dataset.ox);
              const oy = Number(item.dataset.oy);

              if (inBag.has(id)) {
                inBag.delete(id);
                item.style.transform = `translate(${ox}px, ${oy}px) scale(1)`;
                SoundFX.unpop();
              } else {
                if (inBag.size >= bagSlots.length) {
                  SoundFX.oops();
                  Fox.setEmotion('confused', 900);
                  return;
                }
                const slot = bagSlots[inBag.size];
                inBag.set(id, need);
                item.style.transform = `translate(${slot.x}px, ${slot.y}px) scale(0.76)`;
                if (need) {
                  SoundFX.pop();
                  spawnParticles(slot.x, slot.y - 12, 'stars', 8);
                } else {
                  SoundFX.oops();
                  Fox.setEmotion('confused', 1000);
                }
              }
              checkWin();
            });
          });
        }
      }
    ];

    /* ==========================================================================
       5. КЕРУВАННЯ СТОРІНКАМИ, РЕНДЕР КРУПНОГО ТЕКСТУ ТА НАВІГАЦІЯ
       ========================================================================== */
    let currentPage = 0;
    const sceneRoot = document.getElementById('scene-root');
    const taskText = document.getElementById('task-text');
    const bookWrapper = document.getElementById('book-wrapper');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // Вивід крупного тексту в 1 або 2 рядки на стрічці
    function renderBannerText(sentence) {
      const lines = sentence.split('\n');
      taskText.innerHTML = '';
      if (lines.length === 1) {
        taskText.setAttribute('y', '102');
        taskText.setAttribute('font-size', '42');
        taskText.textContent = lines[0];
      } else {
        taskText.setAttribute('y', '78');
        taskText.setAttribute('font-size', '40');
        lines.forEach((line, idx) => {
          const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
          tspan.setAttribute('x', '550');
          tspan.setAttribute('dy', idx === 0 ? '0' : '44');
          tspan.textContent = line;
          taskText.appendChild(tspan);
        });
      }
    }

    function loadPage(index, withSound = true) {
      currentPage = (index + PAGES.length) % PAGES.length;
      btnNext.classList.remove('ready-pulse');
      Fox.setEmotion('normal', 0);

      if (withSound) {
        SoundFX.pageTurn();
        bookWrapper.classList.add('turning');
        setTimeout(() => bookWrapper.classList.remove('turning'), 240);
      }

      const page = PAGES[currentPage];
      renderBannerText(page.sentence);
      sceneRoot.innerHTML = '';
      page.init(sceneRoot, celebrateWin);
    }

    btnPrev.addEventListener('click', () => loadPage(currentPage - 1, true));
    btnNext.addEventListener('click', () => loadPage(currentPage + 1, true));

    // Запуск першої сторінки
    loadPage(0, false);
  </script>
</body>
</html>
