<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таємниці Мови: Сейф Знань</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Russo One', sans-serif;
            user-select: none;
        }

        /* Реалістичний фон: темний метал з іржавими плямами */
        #game-container {
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(80, 40, 20, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(20, 40, 80, 0.4) 0%, transparent 40%),
                repeating-linear-gradient(45deg, #2a2a2a 0, #2a2a2a 2px, #222 2px, #222 4px);
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 0 200px rgba(0,0,0,1);
        }

        /* Мінімалістичні кнопки */
        .ui-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #666, #222);
            border: 3px solid #555;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .ui-btn:hover {
            background: radial-gradient(circle at 30% 30%, #888, #333);
            transform: scale(1.1);
        }

        #next-btn {
            top: 20px;
            right: 20px;
        }

        #next-btn::after {
            content: '➔';
            color: #ccc;
            font-size: 32px;
            text-shadow: 0 2px 4px #000;
        }

        #info-btn {
            top: 20px;
            left: 20px;
        }

        #info-btn::after {
            content: 'i';
            color: #ccc;
            font-size: 36px;
            font-weight: bold;
            font-family: serif;
            text-shadow: 0 2px 4px #000;
        }

        /* Вікно з підказкою (Модальне вікно) */
        #task-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #task-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: linear-gradient(135deg, #3a3a3a, #1a1a1a);
            border: 4px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        #task-modal.active .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            color: #ffd700;
            font-size: 36px;
            margin-top: 0;
            text-shadow: 0 2px 5px #000;
        }

        .modal-content p {
            color: #fff;
            font-size: 28px;
            line-height: 1.5;
            margin-bottom: 30px;
            text-shadow: 0 1px 3px #000;
        }

        #close-modal {
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Russo One', sans-serif;
            background: linear-gradient(to bottom, #ffd700, #b8860b);
            border: none;
            border-radius: 10px;
            color: #1a1a1a;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }

        #close-modal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
        }

        /* Конструкція сейфа */
        #safe-container {
            position: relative;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: #1a1a1a;
            box-shadow: 
                0 0 0 20px #333,
                0 0 0 25px #555,
                0 0 50px rgba(0,0,0,1),
                inset 0 0 50px rgba(0,0,0,1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        /* Внутрішня частина сейфа */
        #safe-interior {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #111 80%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 80px #000;
        }

        /* ===== РЕАЛІСТИЧНИЙ СКАРБ ===== */
        .treasure-pile {
            position: absolute;
            width: 250px;
            height: 200px;
            opacity: 0;
            transform: scale(0);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8));
        }

        .treasure-pile.show {
            opacity: 1;
            transform: scale(1.1);
            animation: floatTreasure 4s ease-in-out infinite alternate;
        }

        @keyframes floatTreasure {
            0% { transform: translateY(0) scale(1.1) rotate(0deg); }
            100% { transform: translateY(-10px) scale(1.1) rotate(2deg); }
        }

        /* Золоті монети */
        .coin {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #fff8b0, #ffd700, #b8860b);
            border-radius: 50%;
            box-shadow: 
                3px 5px 8px rgba(0,0,0,0.8), 
                inset 0 -3px 5px rgba(139, 69, 19, 0.8), 
                inset 0 3px 5px rgba(255, 255, 255, 0.8);
            border: 2px solid #daa520;
        }

        /* Дорогоцінні камені */
        .gem {
            position: absolute;
            width: 50px;
            height: 50px;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.8);
        }

        .ruby {
            background: linear-gradient(135deg, #ff4d4d, #cc0000, #660000);
            filter: drop-shadow(0 0 15px #ff0000);
        }

        .emerald {
            background: linear-gradient(135deg, #66ff66, #00cc00, #006600);
            filter: drop-shadow(0 0 15px #00ff00);
        }

        .sapphire {
            background: linear-gradient(135deg, #66b3ff, #0066cc, #003366);
            filter: drop-shadow(0 0 15px #0066ff);
        }

        /* Дверцята сейфа */
        #safe-door {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 50% 50%, #444 0%, #222 70%, #111 100%);
            border: 10px solid #555;
            box-sizing: border-box;
            z-index: 20;
            transform-origin: left center;
            transition: transform 1.5s cubic-bezier(0.6, -0.28, 0.735, 0.045);
            box-shadow: 
                inset 0 0 50px #000,
                10px 0 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #safe-door.open {
            transform: perspective(1500px) rotateY(-120deg);
        }

        /* Зубчасті колеса */
        .gear {
            position: absolute;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, #333 0deg 10deg, #111 10deg 20deg);
            box-shadow: inset 0 0 20px #000, 0 0 10px #000;
            animation: rotate 30s linear infinite;
        }

        .gear:nth-child(1) { width: 350px; height: 350px; animation-direction: reverse; opacity: 0.8; }
        .gear:nth-child(2) { width: 250px; height: 250px; animation-duration: 20s; opacity: 0.9; }
        
        .gear.stop {
            animation-play-state: paused;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* Замкова щілина */
        #keyhole {
            width: 80px;
            height: 120px;
            background: #000;
            border-radius: 40px 40px 10px 10px;
            border: 6px solid #777;
            position: relative;
            z-index: 25;
            box-shadow: inset 0 0 20px rgba(0,0,0,1), 0 0 15px rgba(255, 215, 0, 0.1);
            transition: all 0.3s;
        }

        #keyhole::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 50px;
            background: #000;
            border: 6px solid #777;
            border-radius: 0 0 10px 10px;
            box-sizing: border-box;
        }

        #keyhole.active {
            box-shadow: inset 0 0 30px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.6);
            border-color: #ffd700;
        }

        /* Зона для ключів */
        #keys-area {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* ===== РЕАЛІСТИЧНИЙ КЛЮЧ ===== */
        .key-container {
            position: absolute;
            display: flex;
            align-items: center;
            cursor: grab;
            pointer-events: auto;
            filter: drop-shadow(5px 10px 15px rgba(0,0,0,0.8));
            transition: transform 0.1s;
            transform: translate(-50%, -50%);
        }

        .key-container:active {
            cursor: grabbing;
            z-index: 1000;
        }

        .key-bow {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #b87333, #cd7f32, #8b4513);
            border: 5px solid #e6a854;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .key-bow::after {
            content: '';
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #1a1a1a;
            box-shadow: inset 0 0 10px #000;
        }

        .key-shaft {
            height: 28px;
            background: linear-gradient(to bottom, #f6c460, #b87333, #8b4513);
            margin-left: -5px;
            position: relative;
            z-index: 1;
            border-top: 2px solid #ffd700;
            border-bottom: 3px solid #5a2d0c;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .key-text {
            color: #1a0f00;
            text-shadow: 0 1px 1px rgba(255,255,255,0.4);
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .key-teeth {
            width: 35px;
            height: 60px;
            background: linear-gradient(to right, #b87333, #8b4513);
            margin-left: -2px;
            position: relative;
            z-index: 2;
            border-radius: 0 5px 5px 0;
            border: 3px solid #e6a854;
            border-left: none;
            flex-shrink: 0;
            clip-path: polygon(0 0, 100% 0, 100% 20%, 60% 20%, 60% 40%, 100% 40%, 100% 60%, 60% 60%, 60% 80%, 100% 80%, 100% 100%, 0 100%);
        }

        .key-container.error {
            animation: shake 0.4s;
            filter: drop-shadow(0 0 20px red);
        }
        .key-container.error .key-bow,
        .key-container.error .key-shaft,
        .key-container.error .key-teeth {
            background: linear-gradient(to bottom, #ff4c4c, #8b0000);
            border-color: #ff0000;
        }

        .key-container.success {
            animation: absorb 0.6s forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-55%, -50%) rotate(-5deg); }
            50% { transform: translate(-45%, -50%) rotate(5deg); }
            75% { transform: translate(-55%, -50%) rotate(-5deg); }
        }

        @keyframes absorb {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.5; filter: brightness(2); }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        /* Спалахи та іскри */
        .spark {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px #ffeb3b, 0 0 30px #ff9800;
            animation: sparkOut 0.6s forwards;
            z-index: 1000;
        }

        @keyframes sparkOut {
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Індикатор завдання */
        #task-indicator {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .task-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #222;
            border: 4px solid #444;
            box-shadow: inset 0 0 10px #000;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #666;
        }

        .task-icon.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px #ffd700, inset 0 0 10px #ffd700;
            background: #333;
            color: #fff;
            text-shadow: 0 0 10px #ffd700;
        }

        /* Прогрес-бар */
        #progress-bar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 15px;
            background: #111;
            border-radius: 10px;
            border: 2px solid #333;
            box-shadow: inset 0 5px 10px #000;
            overflow: hidden;
            z-index: 100;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b87333, #ffd700, #b87333);
            box-shadow: 0 0 15px #ffd700;
            transition: width 0.4s ease;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <button id="next-btn" class="ui-btn"></button>
        <button id="info-btn" class="ui-btn"></button>

        <!-- Модальне вікно з підказкою -->
        <div id="task-modal">
            <div class="modal-content">
                <h2 id="modal-title">Завдання</h2>
                <p id="modal-desc">Текст завдання</p>
                <button id="close-modal">Зрозуміло</button>
            </div>
        </div>

        <div id="task-indicator">
            <div class="task-icon task-1-icon active">1</div>
            <div class="task-icon task-2-icon">2</div>
        </div>

        <div id="safe-container">
            <!-- Внутрішня частина з реалістичним скарбом -->
            <div id="safe-interior">
                <div class="treasure-pile" id="treasure">
                    <!-- Монети -->
                    <div class="coin" style="bottom: 20px; left: 50px; transform: rotate(15deg);"></div>
                    <div class="coin" style="bottom: 40px; left: 80px; transform: rotate(45deg);"></div>
                    <div class="coin" style="bottom: 15px; left: 120px; transform: rotate(-20deg);"></div>
                    <div class="coin" style="bottom: 60px; left: 60px; transform: rotate(10deg);"></div>
                    <div class="coin" style="bottom: 30px; left: 150px; transform: rotate(70deg);"></div>
                    <div class="coin" style="bottom: 80px; left: 100px; transform: rotate(-40deg);"></div>
                    <!-- Камені -->
                    <div class="gem ruby" style="bottom: 70px; left: 40px; transform: rotate(25deg);"></div>
                    <div class="gem emerald" style="bottom: 90px; left: 130px; transform: rotate(-15deg); width: 45px; height: 45px;"></div>
                    <div class="gem sapphire" style="bottom: 50px; left: 100px; transform: rotate(45deg); width: 55px; height: 55px;"></div>
                </div>
            </div>

            <!-- Дверцята -->
            <div id="safe-door">
                <div class="gear"></div>
                <div class="gear"></div>
                <div id="keyhole"></div>
            </div>
        </div>

        <div id="keys-area"></div>

        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playClank() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playError() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playUnlockSound() {
            if(!audioCtx) return;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc1.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 1.5);
            gain1.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain1.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 1.5);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 1.5);

            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 1.5);
            }, 1000);
        }

        const allWords = [
            "Зошити", "Клас", "Дошка", "Вікна", "Підручники", 
            "Ручка", "Парти", "Лінійка", "Олівці", "Учениця", 
            "Діти", "Учень", "Рюкзаки", "Альбом"
        ];

        const singularWords = ["Клас", "Дошка", "Ручка", "Лінійка", "Учениця", "Учень", "Альбом"];
        
        // Виправлено згідно з правилами переносу: "Олівці" та "Учениця" можна переносити
        const noHyphenWords = ["Клас", "Учень"];

        let currentTask = 1;
        let targetWords = [];
        let foundCount = 0;
        
        const keysArea = document.getElementById('keys-area');
        const keyhole = document.getElementById('keyhole');
        const taskIcons = document.querySelectorAll('.task-icon');
        const progressFill = document.getElementById('progress-fill');
        const nextBtn = document.getElementById('next-btn');
        const infoBtn = document.getElementById('info-btn');
        const safeDoor = document.getElementById('safe-door');
        const treasure = document.getElementById('treasure');
        const taskModal = document.getElementById('task-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const closeModal = document.getElementById('close-modal');

        function initGame() {
            initAudio();
            keysArea.innerHTML = '';
            foundCount = 0;
            progressFill.style.width = '0%';
            
            safeDoor.classList.remove('open');
            treasure.classList.remove('show');
            document.querySelectorAll('.gear').forEach(g => g.classList.remove('stop'));
            keyhole.classList.remove('active');
            
            if (currentTask === 1) {
                targetWords = singularWords;
                taskIcons[0].classList.add('active');
                taskIcons[1].classList.remove('active');
                modalTitle.textContent = "Завдання 1";
                modalDesc.textContent = "Знайди та перетягни до замкової щілини слова, які означають один предмет (однину).";
            } else {
                targetWords = noHyphenWords;
                taskIcons[0].classList.remove('active');
                taskIcons[1].classList.add('active');
                modalTitle.textContent = "Завдання 2";
                modalDesc.textContent = "Знайди та перетягни слова, які НЕ МОЖНА поділити для переносу.";
            }

            const shuffledWords = [...allWords].sort(() => Math.random() - 0.5);
            
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            const maxRadiusX = Math.max(320, window.innerWidth / 2 - 180); 
            const maxRadiusY = Math.max(260, window.innerHeight / 2 - 120);

            shuffledWords.forEach((word, index) => {
                const keyContainer = document.createElement('div');
                keyContainer.className = 'key-container';
                keyContainer.dataset.word = word;
                
                const bow = document.createElement('div');
                bow.className = 'key-bow';
                
                const shaft = document.createElement('div');
                shaft.className = 'key-shaft';
                
                const text = document.createElement('span');
                text.className = 'key-text';
                text.textContent = word;
                
                const teeth = document.createElement('div');
                teeth.className = 'key-teeth';
                
                const wordLen = word.length;
                shaft.style.width = `${Math.max(140, wordLen * 24)}px`;
                text.style.fontSize = wordLen > 8 ? '24px' : (wordLen > 6 ? '28px' : '32px');
                
                shaft.appendChild(text);
                keyContainer.appendChild(bow);
                keyContainer.appendChild(shaft);
                keyContainer.appendChild(teeth);
                
                const angle = (index / shuffledWords.length) * Math.PI * 2;
                const rx = maxRadiusX * (0.8 + Math.random() * 0.2);
                const ry = maxRadiusY * (0.8 + Math.random() * 0.2);
                
                const xPos = centerX + Math.cos(angle) * rx;
                const yPos = centerY + Math.sin(angle) * ry;
                
                keyContainer.style.left = `${xPos}px`;
                keyContainer.style.top = `${yPos}px`;
                
                const rotation = angle * (180 / Math.PI) + 90;
                keyContainer.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
                keyContainer.dataset.baseRotation = rotation;
                
                makeDraggable(keyContainer);
                keysArea.appendChild(keyContainer);
            });
        }

        function makeDraggable(el) {
            let isDragging = false;
            let offsetX, offsetY;

            el.addEventListener('pointerdown', (e) => {
                initAudio();
                isDragging = true;
                el.style.zIndex = 1000;
                
                const rect = el.getBoundingClientRect();
                offsetX = e.clientX - (rect.left + rect.width / 2);
                offsetY = e.clientY - (rect.top + rect.height / 2);
                
                el.style.cursor = 'grabbing';
                el.style.transform = `translate(-50%, -50%) scale(1.1) rotate(0deg)`;
                el.setPointerCapture(e.pointerId);
            });

            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                
                el.style.left = `${e.clientX - offsetX}px`;
                el.style.top = `${e.clientY - offsetY}px`;

                const keyholeRect = keyhole.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                
                const elCenterX = elRect.left + elRect.width / 2;
                const elCenterY = elRect.top + elRect.height / 2;
                const holeCenterX = keyholeRect.left + keyholeRect.width / 2;
                const holeCenterY = keyholeRect.top + keyholeRect.height / 2;

                const distance = Math.hypot(elCenterX - holeCenterX, elCenterY - holeCenterY);
                
                if (distance < 130) {
                    keyhole.classList.add('active');
                } else {
                    keyhole.classList.remove('active');
                }
            });

            el.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                el.style.cursor = 'grab';
                el.releasePointerCapture(e.pointerId);

                const keyholeRect = keyhole.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                
                const elCenterX = elRect.left + elRect.width / 2;
                const elCenterY = elRect.top + elRect.height / 2;
                const holeCenterX = keyholeRect.left + keyholeRect.width / 2;
                const holeCenterY = keyholeRect.top + keyholeRect.height / 2;

                const distance = Math.hypot(elCenterX - holeCenterX, elCenterY - holeCenterY);
                
                if (distance < 130) {
                    checkAnswer(el);
                } else {
                    keyhole.classList.remove('active');
                    el.style.transform = `translate(-50%, -50%) rotate(${el.dataset.baseRotation}deg)`;
                }
            });
        }

        function checkAnswer(key) {
            const word = key.dataset.word;
            
            if (targetWords.includes(word)) {
                playClank();
                key.classList.add('success');
                createSparks(key);
                
                setTimeout(() => {
                    key.remove();
                }, 600);

                foundCount++;
                const progress = (foundCount / targetWords.length) * 100;
                progressFill.style.width = `${progress}%`;

                if (foundCount === targetWords.length) {
                    keyhole.classList.remove('active');
                    
                    setTimeout(() => {
                        playUnlockSound();
                        document.querySelectorAll('.gear').forEach(g => g.classList.add('stop'));
                        safeDoor.classList.add('open');
                        
                        setTimeout(() => {
                            treasure.classList.add('show');
                        }, 1000);
                    }, 500);
                }
            } else {
                playError();
                key.classList.add('error');
                keyhole.classList.remove('active');
                
                setTimeout(() => {
                    key.classList.remove('error');
                    
                    const currentX = parseFloat(key.style.left);
                    const currentY = parseFloat(key.style.top);
                    const cx = window.innerWidth / 2;
                    const cy = window.innerHeight / 2;
                    
                    let angle = Math.atan2(currentY - cy, currentX - cx);
                    if (isNaN(angle)) angle = Math.random() * Math.PI * 2;
                    
                    const safeDistX = Math.max(350, window.innerWidth / 2 - 180);
                    const safeDistY = Math.max(280, window.innerHeight / 2 - 120);
                    
                    let newX = cx + Math.cos(angle) * safeDistX;
                    let newY = cy + Math.sin(angle) * safeDistY;
                    
                    newX = Math.max(150, Math.min(window.innerWidth - 150, newX));
                    newY = Math.max(100, Math.min(window.innerHeight - 100, newY));

                    key.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    key.style.left = `${newX}px`;
                    key.style.top = `${newY}px`;
                    
                    const newRotation = angle * (180 / Math.PI) + 90;
                    key.style.transform = `translate(-50%, -50%) rotate(${newRotation}deg)`;
                    key.dataset.baseRotation = newRotation;
                    
                    setTimeout(() => { key.style.transition = ''; }, 500);
                }, 400);
            }
        }

        function createSparks(element) {
            const rect = element.getBoundingClientRect();
            for (let i = 0; i < 25; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = `${rect.left + rect.width/2}px`;
                spark.style.top = `${rect.top + rect.height/2}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                spark.style.setProperty('--tx', `${tx}px`);
                spark.style.setProperty('--ty', `${ty}px`);
                
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 600);
            }
        }

        nextBtn.addEventListener('click', () => {
            playClank();
            currentTask = currentTask === 1 ? 2 : 1;
            initGame();
        });

        infoBtn.addEventListener('click', () => {
            playClank();
            taskModal.classList.add('active');
        });

        closeModal.addEventListener('click', () => {
            playClank();
            taskModal.classList.remove('active');
        });

        window.onload = initGame;

    </script>
</body>
</html>
