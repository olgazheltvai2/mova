<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра: Читання по словах</title>
    
    <!-- Підключення Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* Базові налаштування сторінки */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер гри (тільки для показу тексту дитині) */
        #game-container {
            background: transparent; /* Жодних фонових прямокутників */
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 95%; /* Розширено в сторони */
            max-width: 1400px; /* Збільшено максимальну ширину */
            min-height: 450px;
            margin-bottom: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-clip: padding-box;
            border: 4px solid transparent;
            /* Нова спокійна анімація: м'яке світіння та легкий рух */
            animation: softGlow 4s ease-in-out infinite alternate;
        }

        /* Нова анімація замість яскравої рамки */
        @keyframes softGlow {
            0% { box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); transform: translateY(0); }
            100% { box-shadow: 0 8px 30px rgba(33, 150, 243, 0.25); transform: translateY(-4px); }
        }

        /* Зона відображення тексту */
        #display-area {
            font-size: 80px; /* Крупний шрифт */
            font-weight: bold;
            color: #333;
            /* Додано білу тінь для контрасту на будь-якому фоні */
            text-shadow: 2px 2px 4px #ffffff, -2px -2px 4px #ffffff, 2px -2px 4px #ffffff, -2px 2px 4px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
        }

        /* Панель адміністратора (ввід речень та кнопки керування знизу) */
        #admin-area {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column; /* Зміна напрямку для створення рядів */
            gap: 15px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            align-items: center;
            width: auto;
            max-width: 95%;
        }

        /* Ряди для кнопок в панелі адміністратора */
        .admin-row {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }

        #sentence-input {
            width: 400px;
            max-width: 100%;
            padding: 12px;
            font-size: 20px;
            /* Секретне поле вводу */
            background-color: #e8e8e8;
            color: transparent; /* Невидимий текст */
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #sentence-input:focus {
            outline: 2px solid #4CAF50;
        }
        
        #sentence-input::selection {
            background-color: transparent;
            color: transparent; /* Невидиме виділення */
        }

        /* Кнопки адміністратора */
        .admin-btn {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            color: white;
            transition: transform 0.1s;
            white-space: nowrap;
        }

        .admin-btn:active {
            transform: scale(0.96);
        }

        #btn-submit { background: #2196F3; }
        #btn-prev-word { background: #ff9800; }
        #btn-next-word { background: #4CAF50; padding: 12px 30px; }

        /* --- Theme Manager CSS --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: white;
            border: 2px solid #ccc;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        #theme-btn:hover {
            transform: scale(1.1);
        }

        #theme-modal {
            position: fixed;
            bottom: 90px;
            right: 20px;
            z-index: 9998;
            background: white;
            border-radius: 10px;
            padding: 15px;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            width: 350px;
            max-width: 90vw;
            display: none;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .theme-thumb {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Співвідношення 16:9 */
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s;
        }

        .theme-thumb:hover {
            border-color: #2196F3;
        }

        .theme-thumb span {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 3px 6px;
            font-size: 14px;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Адаптивність (Mobile Friendly) */
        @media (max-width: 768px) {
            #display-area {
                font-size: 50px;
            }
            #sentence-input {
                width: 100%;
            }
            .admin-row {
                flex-direction: column;
                gap: 10px;
            }
            .admin-btn {
                width: 100%;
            }
            #game-container {
                margin-bottom: 220px; /* Більше місця для високої панелі кнопок */
            }
        }

        /* Стилі екрану-заглушки для блокування */
        #block-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: red;
            font-size: 40px;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Контейнер гри (тільки для показу тексту дитині) -->
    <div id="game-container">
        <div id="display-area"></div>
    </div>

    <!-- Панель вводу та керування текстом -->
    <div id="admin-area">
        <div class="admin-row">
            <input type="text" id="sentence-input" placeholder="Введіть речення..." autocomplete="off">
            <button id="btn-submit" class="admin-btn">Завантажити</button>
        </div>
        <div class="admin-row">
            <button id="btn-prev-word" class="admin-btn" title="Сховати останнє слово">↩ Сховати</button>
            <button id="btn-next-word" class="admin-btn">Показати слово</button>
        </div>
    </div>

    <!-- Theme Manager (Система динамічних фонів) -->
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal">
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <!-- Екран-заглушка для Універсального блоку контролю -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        // Ініціалізація Firebase
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ (Ідентифікація, Радар) ---
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user');
        
        if (myName) {
            sessionStorage.setItem('myName', myName);
        } else {
            myName = sessionStorage.getItem('myName');
            if (!myName) {
                myName = "Гість_" + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('myName', myName);
            }
        }

        const tabId = Date.now().toString() + "_" + Math.random().toString(36).substr(2, 5);
        const presenceRef = db.ref(`online_users/${myName}/${tabId}`);

        db.ref('.info/connected').on('value', snap => {
            if (snap.val() === true) {
                presenceRef.set(true);
                presenceRef.onDisconnect().remove();
            }
        });

        window.addEventListener('beforeunload', () => {
            presenceRef.remove();
        });

        // Блокування користувача
        db.ref(`blocked_users/${myName}`).on('value', snap => {
            const blockOverlay = document.getElementById('block-overlay');
            if (snap.val() === true) {
                blockOverlay.style.display = 'flex';
            } else {
                blockOverlay.style.display = 'none';
            }
        });

        // Примусове оновлення (force_refresh)
        db.ref('force_refresh').on('value', snap => {
            const timestamp = snap.val();
            if (timestamp && timestamp > Date.now() - 5000) {
                window.location.reload();
            }
        });

        // Повернення в лобі (з імунітетом першої секунди)
        const scriptStartTime = Date.now();
        db.ref('current_activity').on('value', snap => {
            if (Date.now() - scriptStartTime > 1000) {
                if (snap.val() === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            }
        });


        // --- ЛОГІКА ГРИ ---
        const inputEl = document.getElementById('sentence-input');
        const displayArea = document.getElementById('display-area');
        
        let wordsRevealed = 0;
        let currentWords = [];
        let isRemoteAction = false;
        const appLaunchTime = Date.now();

        // Функція для відправки дій у Firebase
        function sendGameAction(type, data = {}) {
            if (isRemoteAction) return;
            db.ref('game_action').set({
                senderId: tabId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            });
        }

        // Синхронізація дій з Firebase
        db.ref('game_action').on('value', snap => {
            const action = snap.val();
            if (!action) return;
            if (action.timestamp < appLaunchTime) return; // Ігноруємо старі дії
            if (action.senderId === tabId) return; // Ігноруємо власні дії

            isRemoteAction = true;
            if (action.type === 'load_sentence') {
                const text = action.data.text;
                if (text !== undefined) {
                    currentWords = text.split(/\s+/);
                    wordsRevealed = 0;
                    renderWords();
                }
            } else if (action.type === 'next_word') {
                if (currentWords.length > 0 && wordsRevealed < currentWords.length) {
                    wordsRevealed++;
                    renderWords();
                }
            } else if (action.type === 'prev_word') {
                if (wordsRevealed > 0) {
                    wordsRevealed--;
                    renderWords();
                }
            }
            isRemoteAction = false;
        });

        // Додавання нового речення
        document.getElementById('btn-submit').addEventListener('click', () => {
            const text = inputEl.value.trim();
            if (text !== '') {
                currentWords = text.split(/\s+/);
                wordsRevealed = 0;
                renderWords();
                sendGameAction('load_sentence', { text: text });
                inputEl.value = ''; // Очищення поля вводу після завантаження
            }
        });

        // Показати наступне слово
        document.getElementById('btn-next-word').addEventListener('click', () => {
            if (currentWords.length > 0 && wordsRevealed < currentWords.length) {
                wordsRevealed++;
                renderWords();
                sendGameAction('next_word');
            }
        });

        // Сховати останнє слово
        document.getElementById('btn-prev-word').addEventListener('click', () => {
            if (wordsRevealed > 0) {
                wordsRevealed--;
                renderWords();
                sendGameAction('prev_word');
            }
        });

        function renderWords() {
            displayArea.innerHTML = '';
            for (let i = 0; i < wordsRevealed; i++) {
                const span = document.createElement('span');
                span.textContent = currentWords[i];
                displayArea.appendChild(span);
            }
        }

        // Ввід через Enter
        inputEl.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('btn-submit').click();
            }
        });


        // --- ЛОГІКА THEME MANAGER (Система динамічних фонів) ---
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeGrid = document.getElementById('theme-grid');
        
        const baseBgUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        const defaultBg = `${baseBgUrl}background_1.webp`;
        let isRemoteThemeUpdate = false;

        // Відкриття/закриття меню фонів
        themeBtn.addEventListener('click', () => {
            if (themeModal.style.display === 'none' || themeModal.style.display === '') {
                themeModal.style.display = 'block';
            } else {
                themeModal.style.display = 'none';
            }
        });

        // Встановлення фону та автозбереження
        function setBackground(url, sync = true) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
            
            // Синхронізуємо у Firebase тільки якщо це локальна зміна
            if (sync && !isRemoteThemeUpdate) {
                db.ref('game_theme').set(url);
            }
        }

        // Слухач Firebase для синхронізації фонів
        db.ref('game_theme').on('value', snap => {
            const url = snap.val();
            if (url && url !== localStorage.getItem('mySavedGameBg')) {
                isRemoteThemeUpdate = true;
                setBackground(url, false);
                isRemoteThemeUpdate = false;
            }
        });

        // Перевірка збереженого фону при завантаженні (локально)
        const savedBg = localStorage.getItem('mySavedGameBg') || defaultBg;
        setBackground(savedBg, false);

        // Асинхронне завантаження та перевірка наявності картинок (1-1000)
        function loadThemes() {
            for (let i = 1; i <= 1000; i++) {
                const url = `${baseBgUrl}background_${i}.webp`;
                
                // Створюємо порожній блок одразу, щоб зберегти правильний порядок нумерації у сітці
                const placeholder = document.createElement('div');
                placeholder.style.display = 'none';
                themeGrid.appendChild(placeholder);
                
                const img = new Image();
                img.onload = () => {
                    // Якщо картинка існує, перетворюємо плейсхолдер на мініатюру
                    placeholder.className = 'theme-thumb';
                    placeholder.style.backgroundImage = `url('${url}')`;
                    placeholder.style.display = 'block';
                    placeholder.onclick = () => setBackground(url, true);
                    
                    const label = document.createElement('span');
                    label.textContent = `Фон ${i}`;
                    placeholder.appendChild(label);
                };
                img.src = url;
            }
        }

        // Запуск перевірки фонів після завантаження сторінки
        window.onload = loadThemes;

    </script>
</html>
