<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Phonics Garden</title>
  <style>
    /* ==========================================================================
       CORE LAYOUT & RESET (16:9 Widescreen Adaptive, Zero Scroll, Zero White Boxes)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #2b1d12;
      position: relative;
    }

    /* Full-bleed living background layer */
    #bg-scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Ambient floating pollen motes canvas */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* Fluttering butterflies layer */
    #butterflies-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    /* Interactive particles & light-trail canvas */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 30;
      pointer-events: none;
    }

    /* ==========================================================================
       BACKGROUND ANIMATIONS
       ========================================================================== */
    @keyframes cloudDriftSlow {
      0% { transform: translateX(-180px); }
      100% { transform: translateX(1780px); }
    }
    @keyframes cloudDriftMed {
      0% { transform: translateX(-240px); }
      100% { transform: translateX(1820px); }
    }
    @keyframes sunbeamPulse {
      0%, 100% { opacity: 0.22; transform: skewX(-18deg) scaleX(1); }
      50% { opacity: 0.36; transform: skewX(-16deg) scaleX(1.06); }
    }
    @keyframes branchSwayLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2.6deg); }
    }
    @keyframes branchSwayRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2.8deg); }
    }
    @keyframes butterflyFly1 {
      0%   { transform: translate(-8vw, 24vh) rotate(8deg) scale(0.82); opacity: 0; }
      8%   { opacity: 0.95; }
      28%  { transform: translate(26vw, 15vh) rotate(-6deg) scale(0.95); }
      54%  { transform: translate(56vw, 28vh) rotate(10deg) scale(0.88); }
      80%  { transform: translate(84vw, 16vh) rotate(-8deg) scale(0.92); }
      94%  { opacity: 0.95; }
      100% { transform: translate(108vw, 22vh) rotate(4deg) scale(0.82); opacity: 0; }
    }
    @keyframes butterflyFly2 {
      0%   { transform: translate(108vw, 36vh) scaleX(-1) rotate(6deg) scale(0.74); opacity: 0; }
      10%  { opacity: 0.9; }
      35%  { transform: translate(72vw, 22vh) scaleX(-1) rotate(-10deg) scale(0.84); }
      68%  { transform: translate(32vw, 34vh) scaleX(-1) rotate(8deg) scale(0.78); }
      92%  { opacity: 0.9; }
      100% { transform: translate(-10vw, 19vh) scaleX(-1) rotate(-5deg) scale(0.72); opacity: 0; }
    }
    @keyframes wingFlap {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(0.28) scaleX(0.92); }
    }

    .cloud-1 { animation: cloudDriftSlow 95s linear infinite; }
    .cloud-2 { animation: cloudDriftMed 72s linear infinite; animation-delay: -28s; }
    .cloud-3 { animation: cloudDriftSlow 115s linear infinite; animation-delay: -65s; }
    .sunbeam { transform-origin: top left; animation: sunbeamPulse 9s ease-in-out infinite; }
    .branch-left { transform-origin: 0% 10%; animation: branchSwayLeft 7.5s ease-in-out infinite; }
    .branch-right { transform-origin: 100% 8%; animation: branchSwayRight 8.3s ease-in-out infinite; }

    .butterfly-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 68px;
      height: 54px;
      will-change: transform;
    }
    .butterfly-1 { animation: butterflyFly1 29s ease-in-out infinite; }
    .butterfly-2 { animation: butterflyFly2 37s ease-in-out infinite; animation-delay: -15s; }
    .butterfly-wings {
      transform-origin: center;
      animation: wingFlap 0.34s ease-in-out infinite;
    }

    /* ==========================================================================
       TOP-RIGHT MINIMALIST BRONZE & OAK CONTROLS
       ========================================================================== */
    #top-controls {
      position: fixed;
      top: clamp(14px, 2.2vh, 26px);
      right: clamp(16px, 2.4vw, 32px);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.3vw, 18px);
    }

    .bronze-btn {
      position: relative;
      border: none;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 32% 24%, #f4d28b 0%, #c88e3e 42%, #87531d 84%, #5c340e 100%);
      box-shadow:
        0 8px 18px rgba(32, 16, 4, 0.48),
        0 2px 4px rgba(32, 16, 4, 0.4),
        inset 0 2px 3px rgba(255, 244, 208, 0.72),
        inset 0 -3px 6px rgba(68, 34, 6, 0.65);
      border: 2.5px solid #e7be6e;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease, box-shadow 0.18s ease;
    }

    .bronze-btn::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: inherit;
      border: 1px solid rgba(255, 238, 188, 0.42);
      pointer-events: none;
    }

    .bronze-btn:hover {
      transform: translateY(-2px) scale(1.05);
      filter: brightness(1.08);
      box-shadow:
        0 12px 24px rgba(32, 16, 4, 0.52),
        0 0 16px rgba(255, 210, 115, 0.42),
        inset 0 2px 4px rgba(255, 248, 220, 0.85);
    }

    .bronze-btn:active {
      transform: translateY(2px) scale(0.95);
      filter: brightness(0.96);
    }

    #lang-btn {
      height: clamp(46px, 6.2vh, 62px);
      min-width: clamp(82px, 6.8vw, 106px);
      padding: 0 clamp(14px, 1.4vw, 22px);
      border-radius: 999px;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(16px, 2.1vh, 22px);
      letter-spacing: 0.08em;
      color: #fff6dc;
      text-shadow: 0 2px 3px rgba(58, 26, 4, 0.8);
    }

    #next-btn {
      width: clamp(54px, 7.2vh, 72px);
      height: clamp(54px, 7.2vh, 72px);
      border-radius: 50%;
    }

    #next-btn svg {
      width: 56%;
      height: 56%;
      filter: drop-shadow(0 2px 2px rgba(60, 28, 5, 0.72));
      transition: transform 0.22s ease;
    }

    #next-btn:hover svg {
      transform: translateX(3px);
    }

    /* ==========================================================================
       MAIN STAGE LAYOUT (WIDESCREEN HARMONIOUS COMPOSITION)
       ========================================================================== */
    #stage {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(14px, 2.4vh, 28px) clamp(24px, 5vw, 84px) clamp(20px, 4.5vh, 48px);
      pointer-events: none;
    }

    /* ==========================================================================
       UPPER CENTER: CARVED OAK & BRASS LETTER MEDALLION + POSITION BAR
       ========================================================================== */
    #letter-assembly {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
      margin-top: clamp(0px, 0.6vh, 10px);
    }

    #letter-medallion {
      position: relative;
      width: clamp(138px, 21vh, 212px);
      height: clamp(138px, 21vh, 212px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 32% 24%, #8d5c32 0%, #643c1e 48%, #472711 86%, #311909 100%);
      box-shadow:
        0 18px 36px rgba(26, 12, 3, 0.58),
        0 6px 14px rgba(26, 12, 3, 0.45),
        inset 0 4px 10px rgba(255, 224, 165, 0.34),
        inset 0 -8px 16px rgba(20, 8, 2, 0.72);
      border: clamp(6px, 0.9vh, 9px) solid transparent;
      background-clip: padding-box;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Ornate brass rim around letter medallion */
    #letter-medallion::before {
      content: "";
      position: absolute;
      inset: calc(-1 * clamp(7px, 1vh, 10px));
      border-radius: 50%;
      z-index: -1;
      background: conic-gradient(
        from 20deg,
        #f2ce7c, #b67d2d, #fae09b, #8b5619, #e5b75a, #f9df97, #9c6520, #f2ce7c
      );
      box-shadow:
        0 8px 20px rgba(25, 11, 2, 0.55),
        inset 0 2px 4px rgba(255, 250, 226, 0.8);
    }

    /* Inner carved parchment-wood sunlit ring */
    #letter-medallion::after {
      content: "";
      position: absolute;
      inset: clamp(9px, 1.4vh, 14px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 28%, rgba(255, 228, 170, 0.22) 0%, rgba(118, 70, 32, 0.08) 55%, rgba(28, 12, 3, 0.32) 100%);
      border: 2px dashed rgba(242, 202, 118, 0.42);
      pointer-events: none;
    }

    #letter-medallion.medallion-pulse {
      animation: medallionGlowPulse 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes medallionGlowPulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 214, 102, 0)); }
      38% { transform: scale(1.07); filter: drop-shadow(0 0 28px rgba(255, 214, 102, 0.85)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 214, 102, 0)); }
    }

    #target-letter {
      position: relative;
      z-index: 2;
      font-family: Arial, sans-serif;
      font-weight: 900;
      font-size: clamp(76px, 12.6vh, 132px);
      line-height: 1;
      color: #fff4d2;
      background: linear-gradient(180deg, #fffdf0 0%, #ffe6a3 52%, #e0a94c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 5px 4px rgba(34, 14, 2, 0.85)) drop-shadow(0 0 12px rgba(255, 218, 125, 0.25));
      transform: translateY(-2px);
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease;
    }

    #target-letter.swap-in {
      animation: letterPopIn 0.46s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes letterPopIn {
      0% { transform: scale(0.45) rotate(-8deg); opacity: 0; }
      70% { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* Integrated Wordless Brass Position Bar (LEFT gem = start, dots, RIGHT gem = end) */
    #position-bar {
      position: relative;
      margin-top: calc(-1 * clamp(14px, 2.2vh, 22px));
      z-index: 5;
      width: clamp(190px, 25vh, 270px);
      height: clamp(38px, 5.4vh, 52px);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(10px, 1.4vh, 15px);
      background: linear-gradient(180deg, #d9a74f 0%, #9b6420 50%, #683e0f 100%);
      border: 2.5px solid #f4d483;
      box-shadow:
        0 8px 18px rgba(28, 12, 2, 0.56),
        inset 0 2px 3px rgba(255, 245, 205, 0.72),
        inset 0 -3px 5px rgba(56, 26, 4, 0.75);
    }

    .bar-dots {
      display: flex;
      align-items: center;
      gap: clamp(9px, 1.4vh, 16px);
    }

    .bar-dot {
      width: clamp(7px, 1vh, 10px);
      height: clamp(7px, 1vh, 10px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe6a1 0%, #9e6a26 65%, #4d2c09 100%);
      box-shadow: inset 0 1px 2px rgba(255, 244, 200, 0.6), 0 1px 2px rgba(34, 15, 3, 0.65);
    }

    .pos-gem {
      position: relative;
      width: clamp(24px, 3.6vh, 34px);
      height: clamp(24px, 3.6vh, 34px);
      border-radius: 50%;
      border: 2.5px solid #f5d889;
      background: radial-gradient(circle at 34% 28%, #7b6650 0%, #443528 58%, #261c14 100%);
      box-shadow:
        inset 0 3px 5px rgba(0, 0, 0, 0.55),
        inset 0 -2px 3px rgba(255, 232, 180, 0.25),
        0 2px 6px rgba(25, 10, 2, 0.6);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease, background 0.35s ease;
    }

    /* Facet highlight inside gem */
    .pos-gem::after {
      content: "";
      position: absolute;
      top: 18%;
      left: 22%;
      width: 34%;
      height: 24%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: rotate(-28deg);
    }

    /* Lit states for Left (Emerald-Gold) and Right (Amber-Ruby) gems */
    #gem-start.lit {
      background: radial-gradient(circle at 34% 28%, #e4ffdf 0%, #52e88b 38%, #16a354 78%, #0a5c2c 100%);
      box-shadow:
        0 0 16px 5px rgba(92, 242, 148, 0.85),
        0 0 32px 10px rgba(255, 234, 130, 0.55),
        inset 0 2px 5px rgba(255, 255, 255, 0.85);
      transform: scale(1.22);
      animation: gemPulseStart 1.8s ease-in-out infinite;
    }

    #gem-end.lit {
      background: radial-gradient(circle at 34% 28%, #fff6d6 0%, #ffbe3b 38%, #e86b17 78%, #8f2d06 100%);
      box-shadow:
        0 0 16px 5px rgba(255, 186, 56, 0.9),
        0 0 32px 10px rgba(255, 118, 46, 0.55),
        inset 0 2px 5px rgba(255, 255, 255, 0.88);
      transform: scale(1.22);
      animation: gemPulseEnd 1.8s ease-in-out infinite;
    }

    @keyframes gemPulseStart {
      0%, 100% { transform: scale(1.18); box-shadow: 0 0 14px 4px rgba(92, 242, 148, 0.8), 0 0 28px 8px rgba(255, 234, 130, 0.45); }
      50% { transform: scale(1.28); box-shadow: 0 0 22px 7px rgba(120, 255, 170, 0.95), 0 0 40px 14px rgba(255, 240, 150, 0.65); }
    }
    @keyframes gemPulseEnd {
      0%, 100% { transform: scale(1.18); box-shadow: 0 0 14px 4px rgba(255, 186, 56, 0.85), 0 0 28px 8px rgba(255, 120, 45, 0.45); }
      50% { transform: scale(1.28); box-shadow: 0 0 22px 7px rgba(255, 208, 86, 0.98), 0 0 40px 14px rgba(255, 132, 54, 0.68); }
    }

    /* ==========================================================================
       LEFT & RIGHT CERAMIC MEDALLION PEDESTALS (NO WHITE BOXES!)
       ========================================================================== */
    #objects-row {
      width: 100%;
      max-width: 1340px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      gap: clamp(20px, 5vw, 90px);
      pointer-events: none;
      margin-bottom: clamp(4px, 1.6vh, 22px);
    }

    .pedestal-card {
      position: relative;
      pointer-events: auto;
      cursor: pointer;
      width: clamp(220px, 38vh, 390px);
      height: clamp(220px, 38vh, 390px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(22px, 3.6vh, 38px);
      /* Warm sunlit Mediterranean terracotta & ochre ceramic glaze */
      background:
        radial-gradient(circle at 34% 28%, #f6dfba 0%, #e7c28e 46%, #cfa068 82%, #b07c45 100%);
      box-shadow:
        0 26px 42px rgba(32, 15, 4, 0.56),
        0 10px 18px rgba(32, 15, 4, 0.4),
        inset 0 8px 18px rgba(255, 245, 218, 0.72),
        inset 0 -12px 24px rgba(124, 68, 22, 0.52);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease;
    }

    /* Decorative glazed terracotta & botanical mosaic outer ring */
    .pedestal-card::before {
      content: "";
      position: absolute;
      inset: calc(-1 * clamp(10px, 1.6vh, 16px));
      border-radius: 50%;
      z-index: -1;
      background:
        repeating-conic-gradient(
          from 0deg,
          #9f4b28 0deg 10deg,
          #d79647 10deg 15deg,
          #53734d 15deg 25deg,
          #e3b568 25deg 30deg
        );
      box-shadow:
        0 18px 34px rgba(28, 12, 3, 0.55),
        inset 0 3px 6px rgba(255, 240, 198, 0.55);
      border: 3px solid #e9c273;
    }

    /* Inner recessed ceramic filigree rim */
    .pedestal-card::after {
      content: "";
      position: absolute;
      inset: clamp(10px, 1.6vh, 16px);
      border-radius: 50%;
      border: 2.5px solid rgba(158, 92, 38, 0.36);
      box-shadow: inset 0 0 28px rgba(132, 72, 24, 0.18);
      pointer-events: none;
    }

    /* Subtle cast ellipse shadow on the oak garden table below */
    .pedestal-shadow {
      position: absolute;
      bottom: calc(-1 * clamp(18px, 2.8vh, 28px));
      left: 10%;
      width: 80%;
      height: clamp(22px, 3.6vh, 36px);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(24, 10, 2, 0.52) 0%, rgba(24, 10, 2, 0) 74%);
      pointer-events: none;
      z-index: -2;
      transition: transform 0.28s ease, opacity 0.28s ease;
    }

    .pedestal-card:hover {
      transform: translateY(-7px) scale(1.035);
      box-shadow:
        0 34px 52px rgba(32, 15, 4, 0.58),
        0 0 26px rgba(255, 214, 120, 0.35),
        inset 0 8px 18px rgba(255, 248, 224, 0.82),
        inset 0 -12px 24px rgba(124, 68, 22, 0.48);
    }

    .pedestal-card:hover .pedestal-shadow {
      transform: scale(0.92);
      opacity: 0.72;
    }

    .pedestal-card.glow-start {
      box-shadow:
        0 26px 46px rgba(32, 15, 4, 0.56),
        0 0 38px 6px rgba(96, 236, 146, 0.58),
        inset 0 8px 18px rgba(255, 248, 224, 0.85),
        inset 0 -12px 24px rgba(124, 68, 22, 0.45);
    }

    .pedestal-card.glow-end {
      box-shadow:
        0 26px 46px rgba(32, 15, 4, 0.56),
        0 0 38px 6px rgba(255, 184, 62, 0.64),
        inset 0 8px 18px rgba(255, 248, 224, 0.85),
        inset 0 -12px 24px rgba(124, 68, 22, 0.45);
    }

    /* Object SVG wrapper */
    .object-art {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 12px 14px rgba(58, 28, 8, 0.34));
      will-change: transform;
    }

    .object-art svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Gentle idle breathing / life animation */
    @keyframes idleFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.015); }
    }
    .object-art.idle {
      animation: idleFloat 4.2s ease-in-out infinite;
    }
    #pedestal-right .object-art.idle {
      animation-delay: -2.1s;
    }

    /* Joyful physical click animations (cycled for variety) */
    @keyframes clickSpring {
      0%   { transform: scale(1) rotate(0deg); }
      20%  { transform: scale(1.18, 0.86) translateY(6px); }
      46%  { transform: scale(0.92, 1.15) translateY(-16px) rotate(-4deg); }
      70%  { transform: scale(1.06, 0.96) translateY(2px) rotate(3deg); }
      86%  { transform: scale(0.99, 1.02) translateY(-3px) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes clickWiggleJoy {
      0%   { transform: scale(1) rotate(0deg); }
      18%  { transform: scale(1.12) rotate(-9deg); }
      38%  { transform: scale(1.16) rotate(9deg) translateY(-10px); }
      58%  { transform: scale(1.08) rotate(-6deg) translateY(-4px); }
      78%  { transform: scale(1.03) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes clickPopShimmer {
      0%   { transform: scale(1); filter: drop-shadow(0 12px 14px rgba(58,28,8,0.34)) brightness(1); }
      30%  { transform: scale(1.16) translateY(-12px); filter: drop-shadow(0 20px 22px rgba(255,205,80,0.65)) brightness(1.18); }
      65%  { transform: scale(0.96) translateY(2px); filter: drop-shadow(0 12px 16px rgba(255,205,80,0.35)) brightness(1.06); }
      100% { transform: scale(1); filter: drop-shadow(0 12px 14px rgba(58,28,8,0.34)) brightness(1); }
    }

    .anim-spring { animation: clickSpring 0.72s cubic-bezier(0.22, 1, 0.36, 1) !important; }
    .anim-wiggle { animation: clickWiggleJoy 0.72s cubic-bezier(0.22, 1, 0.36, 1) !important; }
    .anim-shimmer { animation: clickPopShimmer 0.72s cubic-bezier(0.22, 1, 0.36, 1) !important; }

    /* Card entrance animation when round changes */
    @keyframes pedestalEnter {
      0% { transform: scale(0.76) translateY(24px); opacity: 0; }
      70% { transform: scale(1.03) translateY(-4px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .pedestal-enter {
      animation: pedestalEnter 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ==========================================================================
       INTERNAL SVG LIFE ANIMATIONS (Blinking eyes, rising steam, falling drops)
       ========================================================================== */
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .svg-blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 4.6s ease-in-out infinite;
    }

    @keyframes steamRise {
      0%   { transform: translateY(6px) scaleX(0.9); opacity: 0; }
      35%  { opacity: 0.7; }
      100% { transform: translateY(-18px) scaleX(1.15); opacity: 0; }
    }
    .svg-steam-1 { animation: steamRise 2.8s ease-out infinite; }
    .svg-steam-2 { animation: steamRise 2.8s ease-out infinite 0.9s; }

    /* ==========================================================================
       3. WEB AUDIO API SYNTHESIZER (5 VARIED ACOUSTIC INSTRUMENTS, NO SPEECH)
       ========================================================================== */
    const SoundEngine = (() => {
      let ctx = null;
      let styleIdx = 0;

      function ensureCtx() {
        try {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            ctx = new AudioCtx();
          }
          if (ctx.state === "suspended") ctx.resume();
        } catch (e) {}
        return ctx;
      }

      function playTone(freq, startTime, dur, type, gainPeak, detune = 0) {
        const ac = ensureCtx();
        if (!ac) return;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        if (detune) osc.detune.setValueAtTime(detune, startTime);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(gainPeak, startTime + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(startTime);
        osc.stop(startTime + dur + 0.03);
      }

      // Varied melodies: ascending bright for START, warm resolving cadence for END
      function playObjectFeedback(position) {
        const ac = ensureCtx();
        if (!ac) return;
        const now = ac.currentTime;
        const style = styleIdx % 5;
        styleIdx++;

        const notesStart = [
          [523.25, 659.25, 783.99, 1046.5],   // C major ascending (Marimba)
          [587.33, 739.99, 880.00, 1174.66],  // D major harp
          [440.00, 554.37, 659.25, 880.00],   // A major kalimba
          [523.25, 587.33, 659.25, 783.99],   // Xylophone run
          [659.25, 783.99, 987.77, 1318.51]   // Wind chimes
        ];
        const notesEnd = [
          [783.99, 659.25, 587.33, 523.25],   // Warm resolving marimba
          [880.00, 739.99, 659.25, 587.33],   // Gentle harp cadence
          [659.25, 554.37, 493.88, 440.00],   // Kalimba resolve
          [783.99, 659.25, 523.25, 659.25],   // Xylophone bounce
          [1046.5, 880.00, 783.99, 659.25]    // Sparkling chimes
        ];

        const seq = position === "first" ? notesStart[style] : notesEnd[style];
        const waveTypes = ["sine", "triangle", "sine", "triangle", "sine"];
        const spacing = style === 1 ? 0.065 : style === 4 ? 0.055 : 0.085;
        const dur = style === 1 || style === 4 ? 0.65 : 0.34;

        seq.forEach((f, i) => {
          const t = now + i * spacing;
          playTone(f, t, dur, waveTypes[style], 0.16);
          // Warm harmonic overtone
          playTone(f * 2, t, dur * 0.55, "sine", 0.045, 4);
        });
      }

      function playGemChime(position) {
        const ac = ensureCtx();
        if (!ac) return;
        const now = ac.currentTime;
        const base = position === "first" ? 1046.5 : 880.0;
        playTone(base, now, 0.45, "sine", 0.12);
        playTone(base * 1.5, now + 0.04, 0.5, "sine", 0.07);
      }

      function playButtonTick() {
        const ac = ensureCtx();
        if (!ac) return;
        const now = ac.currentTime;
        playTone(620, now, 0.09, "triangle", 0.1);
        playTone(930, now + 0.03, 0.11, "sine", 0.06);
      }

      return { playObjectFeedback, playGemChime, playButtonTick };
    })();

    /* ==========================================================================
       4. AMBIENT POLLEN CANVAS & INTERACTIVE PARTICLE / ORB EFFECTS ENGINE
       ========================================================================== */
    const ambientCanvas = document.getElementById("ambient-canvas");
    const ambCtx = ambientCanvas.getContext("2d");
    const fxCanvas = document.getElementById("fx-canvas");
    const fxCtx = fxCanvas.getContext("2d");

    let W = window.innerWidth;
    let H = window.innerHeight;
    let motes = [];
    let particles = [];
    let orbs = [];
    let burstStyleIdx = 0;

    function resizeCanvases() {
      W = window.innerWidth;
      H = window.innerHeight;
      ambientCanvas.width = W;
      ambientCanvas.height = H;
      fxCanvas.width = W;
      fxCanvas.height = H;
      initMotes();
    }

    function initMotes() {
      const count = Math.min(48, Math.max(24, Math.floor(W / 32)));
      motes = Array.from({ length: count }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1.4 + Math.random() * 2.8,
        vx: 0.15 + Math.random() * 0.35,
        vy: -0.12 - Math.random() * 0.28,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.25 + Math.random() * 0.48
      }));
    }

    // Emit 5 diverse visual particle bursts on click
    function emitBurst(x, y, position) {
      const style = burstStyleIdx % 5;
      burstStyleIdx++;
      const count = style === 2 ? 22 : 34;

      const palettes = {
        first: ["#7cffb2", "#fff3a6", "#3de385", "#ffd166", "#d8ffea"],
        last:  ["#ffd166", "#ff9642", "#fff2b2", "#ff6b4a", "#ffe08a"]
      };
      const colors = palettes[position];

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = 2.4 + Math.random() * 6.5;
        particles.push({
          type: style, // 0: sparkles, 1: petals, 2: bubbles, 3: fireflies, 4: sunlit leaves
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (style === 2 ? 2.4 : 1.2),
          size: style === 2 ? 6 + Math.random() * 11 : 4 + Math.random() * 7,
          color: colors[i % colors.length],
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.16,
          life: 1,
          decay: 0.012 + Math.random() * 0.014
        });
      }
    }

    // Launch glowing light-orb from clicked pedestal to LEFT or RIGHT gem
    function launchOrb(fromEl, targetEl, position, onArrive) {
      const fr = fromEl.getBoundingClientRect();
      const tr = targetEl.getBoundingClientRect();
      const sx = fr.left + fr.width / 2;
      const sy = fr.top + fr.height / 2;
      const ex = tr.left + tr.width / 2;
      const ey = tr.top + tr.height / 2;
      const cx = (sx + ex) / 2 + (sx < ex ? -60 : 60);
      const cy = Math.min(sy, ey) - 110;

      orbs.push({
        sx, sy, cx, cy, ex, ey,
        t: 0,
        speed: 0.032,
        position,
        color: position === "first" ? "#6ef5a4" : "#ffc04d",
        trail: [],
        onArrive
      });
    }

    function drawStar(ctx, x, y, r, rot, color, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI) / 2;
        ctx.lineTo(Math.cos(a) * r * 1.5, Math.sin(a) * r * 1.5);
        ctx.lineTo(Math.cos(a + Math.PI / 4) * r * 0.45, Math.sin(a + Math.PI / 4) * r * 0.45);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function animateLoops() {
      // 1. Ambient sunlit pollen motes
      ambCtx.clearRect(0, 0, W, H);
      for (const m of motes) {
        m.phase += 0.018;
        m.x += m.vx + Math.sin(m.phase) * 0.25;
        m.y += m.vy;
        if (m.x > W + 10) m.x = -10;
        if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }

        const a = m.alpha * (0.65 + 0.35 * Math.sin(m.phase * 1.6));
        ambCtx.beginPath();
        ambCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ambCtx.fillStyle = `rgba(255, 244, 198, ${a})`;
        ambCtx.fill();
      }

      // 2. Interactive particles & light-trail orbs
      fxCtx.clearRect(0, 0, W, H);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        p.life -= p.decay;

        if (p.type === 2) { // Bubbles float upward
          p.vy -= 0.05;
          p.vx *= 0.97;
        } else if (p.type === 1 || p.type === 4) { // Petals & leaves flutter
          p.vy += 0.06;
          p.vx = p.vx * 0.97 + Math.sin(p.rot * 2) * 0.14;
        } else {
          p.vy += 0.08;
          p.vx *= 0.97;
        }

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        if (p.type === 0) {
          drawStar(fxCtx, p.x, p.y, p.size, p.rot, p.color, p.life);
        } else if (p.type === 1 || p.type === 4) {
          fxCtx.save();
          fxCtx.translate(p.x, p.y);
          fxCtx.rotate(p.rot);
          fxCtx.globalAlpha = p.life;
          fxCtx.fillStyle = p.type === 4 ? "#9de05c" : p.color;
          fxCtx.beginPath();
          fxCtx.ellipse(0, 0, p.size * 1.25, p.size * 0.62, 0, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.restore();
        } else if (p.type === 2) {
          fxCtx.save();
          fxCtx.globalAlpha = p.life * 0.85;
          fxCtx.strokeStyle = p.color;
          fxCtx.lineWidth = 2;
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          fxCtx.stroke();
          fxCtx.fillStyle = "rgba(255,255,255,0.6)";
          fxCtx.beginPath();
          fxCtx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.25, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.restore();
        } else {
          fxCtx.save();
          fxCtx.globalAlpha = p.life;
          const g = fxCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.6);
          g.addColorStop(0, "#ffffff");
          g.addColorStop(0.45, p.color);
          g.addColorStop(1, "rgba(255,230,120,0)");
          fxCtx.fillStyle = g;
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.size * 1.6, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.restore();
        }
      }

      // Light-trail orbs
      for (let i = orbs.length - 1; i >= 0; i--) {
        const o = orbs[i];
        o.t += o.speed;
        const t = Math.min(1, o.t);
        const inv = 1 - t;
        const x = inv * inv * o.sx + 2 * inv * t * o.cx + t * t * o.ex;
        const y = inv * inv * o.sy + 2 * inv * t * o.cy + t * t * o.ey;

        o.trail.push({ x, y });
        if (o.trail.length > 16) o.trail.shift();

        // Draw luminous trail
        for (let j = 0; j < o.trail.length; j++) {
          const pt = o.trail[j];
          const ratio = (j + 1) / o.trail.length;
          fxCtx.save();
          fxCtx.globalAlpha = ratio * 0.72;
          fxCtx.fillStyle = o.color;
          fxCtx.beginPath();
          fxCtx.arc(pt.x, pt.y, 3 + ratio * 9, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.restore();
        }

        // Core orb glow
        fxCtx.save();
        const og = fxCtx.createRadialGradient(x, y, 0, x, y, 22);
        og.addColorStop(0, "#ffffff");
        og.addColorStop(0.4, o.color);
        og.addColorStop(1, "rgba(255,235,140,0)");
        fxCtx.fillStyle = og;
        fxCtx.beginPath();
        fxCtx.arc(x, y, 22, 0, Math.PI * 2);
        fxCtx.fill();
        fxCtx.restore();

        if (o.t >= 1) {
          emitBurst(o.ex, o.ey, o.position);
          if (o.onArrive) o.onArrive();
          orbs.splice(i, 1);
        }
      }

      requestAnimationFrame(animateLoops);
    }

    /* ==========================================================================
       5. GAME STATE & ENDLESS NON-REPEATING SHUFFLED GENERATOR
       ========================================================================== */
    let currentLang = "uk";
    let deck = [];
    let deckPos = 0;
    let currentRound = null;
    let leftPosType = "first"; // "first" or "last"
    let rightPosType = "last";
    let clickAnimIdx = 0;

    const targetLetterEl = document.getElementById("target-letter");
    const medallionEl = document.getElementById("letter-medallion");
    const gemStartEl = document.getElementById("gem-start");
    const gemEndEl = document.getElementById("gem-end");
    const pedLeft = document.getElementById("pedestal-left");
    const pedRight = document.getElementById("pedestal-right");
    const artLeft = document.getElementById("art-left");
    const artRight = document.getElementById("art-right");
    const langBtn = document.getElementById("lang-btn");
    const nextBtn = document.getElementById("next-btn");

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function refillDeck(avoidLetter = null) {
      deck = shuffleArray(DATASETS[currentLang]);
      if (avoidLetter && deck[0].letter === avoidLetter && deck.length > 1) {
        const swap = 1 + Math.floor(Math.random() * (deck.length - 1));
        [deck[0], deck[swap]] = [deck[swap], deck[0]];
      }
      deckPos = 0;
    }

    function loadNextRound() {
      const prevLetter = currentRound ? currentRound.letter : null;
      if (deckPos >= deck.length) {
        refillDeck(prevLetter);
      }
      currentRound = deck[deckPos++];

      // Reset gems & pedestal glows
      gemStartEl.classList.remove("lit");
      gemEndEl.classList.remove("lit");
      pedLeft.classList.remove("glow-start", "glow-end", "pedestal-enter");
      pedRight.classList.remove("glow-start", "glow-end", "pedestal-enter");

      // Update large letter with pop animation
      targetLetterEl.classList.remove("swap-in");
      void targetLetterEl.offsetWidth;
      targetLetterEl.textContent = currentRound.letter;
      targetLetterEl.classList.add("swap-in");

      // Randomize left/right placement of first-sound vs last-sound object
      const firstOnLeft = Math.random() < 0.5;
      leftPosType = firstOnLeft ? "first" : "last";
      rightPosType = firstOnLeft ? "last" : "first";

      const leftKey = firstOnLeft ? currentRound.first : currentRound.last;
      const rightKey = firstOnLeft ? currentRound.last : currentRound.first;

      artLeft.innerHTML = SVG_ASSETS[leftKey]("L" + deckPos + Date.now());
      artRight.innerHTML = SVG_ASSETS[rightKey]("R" + deckPos + Date.now());

      // Trigger smooth pedestal entrance
      void pedLeft.offsetWidth;
      pedLeft.classList.add("pedestal-enter");
      pedRight.classList.add("pedestal-enter");
    }

    function handleObjectClick(side) {
      const pedEl = side === "left" ? pedLeft : pedRight;
      const artEl = side === "left" ? artLeft : artRight;
      const posType = side === "left" ? leftPosType : rightPosType;
      const targetGem = posType === "first" ? gemStartEl : gemEndEl;

      // 1. Synthesized pleasant varied sound
      SoundEngine.playObjectFeedback(posType);

      // 2. Varied joyful physical animation on clicked object
      const animClasses = ["anim-spring", "anim-wiggle", "anim-shimmer"];
      const chosenAnim = animClasses[clickAnimIdx % animClasses.length];
      clickAnimIdx++;

      artEl.classList.remove("anim-spring", "anim-wiggle", "anim-shimmer");
      void artEl.offsetWidth;
      artEl.classList.add(chosenAnim);

      // Highlight pedestal aura
      pedEl.classList.remove("glow-start", "glow-end");
      pedEl.classList.add(posType === "first" ? "glow-start" : "glow-end");

      // 3. Particle burst at clicked object center
      const rect = pedEl.getBoundingClientRect();
      emitBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, posType);

      // 4. Flying golden light-orb to LEFT gem (first) or RIGHT gem (last)
      launchOrb(pedEl, targetGem, posType, () => {
        targetGem.classList.add("lit");
        medallionEl.classList.remove("medallion-pulse");
        void medallionEl.offsetWidth;
        medallionEl.classList.add("medallion-pulse");
        SoundEngine.playGemChime(posType);
      });
    }

    // Event Listeners
    pedLeft.addEventListener("click", () => handleObjectClick("left"));
    pedRight.addEventListener("click", () => handleObjectClick("right"));

    pedLeft.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleObjectClick("left"); }
    });
    pedRight.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleObjectClick("right"); }
    });

    nextBtn.addEventListener("click", () => {
      SoundEngine.playButtonTick();
      loadNextRound();
    });

    langBtn.addEventListener("click", () => {
      SoundEngine.playButtonTick();
      currentLang = currentLang === "uk" ? "ru" : "uk";
      langBtn.textContent = currentLang === "uk" ? "УКР" : "РУС";
      refillDeck();
      loadNextRound();
    });

    window.addEventListener("resize", resizeCanvases);

    // Initialize everything on load
    window.onload = function () {
      resizeCanvases();
      refillDeck();
      loadNextRound();
      animateLoops();
    };
  </script>
</body>
</html>
