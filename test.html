<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест GitHub</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .card {
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Тест системи</h1>
        <p id="status">Перевірка JS...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusText = document.getElementById('status');
            statusText.textContent = 'Код працює ідеально!';
            statusText.style.color = 'green';
            console.log('GitHub Test: OK');
        });
    </script>
<script src="https://olgazheltvai2.github.io/rizne/pencil.js"></script></body>
</html>
