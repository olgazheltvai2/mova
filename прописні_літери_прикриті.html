<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Підключення прописного кириличного шрифту -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Marck+Script&display=swap" rel="stylesheet">
  <style>
    /* ================= БАЗОВІ НАЛАШТУВАННЯ ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #67b8de;
      touch-action: none;
      font-family: 'Marck Script', 'Caveat', 'Segoe Script', cursive;
    }

    /* Головна сцена гри */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ================= ФОНОВИЙ SVG ПАРКУ ================= */
    #park-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Рух хмар по небу */
    @keyframes cloudDriftSlow {
      0% { transform: translateX(-180px); }
      100% { transform: translateX(1720px); }
    }
    @keyframes cloudDriftMed {
      0% { transform: translateX(-220px); }
      100% { transform: translateX(1760px); }
    }
    .cloud-1 { animation: cloudDriftSlow 68s linear infinite; }
    .cloud-2 { animation: cloudDriftMed 52s linear infinite; animation-delay: -18s; }
    .cloud-3 { animation: cloudDriftSlow 78s linear infinite; animation-delay: -40s; }

    /* Обертання сонячних променів та колеса огляду */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .sun-rays {
      transform-origin: 1380px 120px;
      animation: spinSlow 45s linear infinite;
    }
    .ferris-wheel {
      transform-origin: 1120px 330px;
      animation: spinSlow 55s linear infinite;
    }

    /* Погойдування дерев на вітрі */
    @keyframes treeSway {
      0%, 100% { transform: rotate(-1.4deg); }
      50% { transform: rotate(1.6deg); }
    }
    .tree-sway-1 {
      transform-origin: 145px 620px;
      animation: treeSway 6s ease-in-out infinite;
    }
    .tree-sway-2 {
      transform-origin: 1465px 610px;
      animation: treeSway 7.2s ease-in-out infinite reverse;
    }
    .tree-sway-3 {
      transform-origin: 330px 550px;
      animation: treeSway 5.5s ease-in-out infinite;
    }

    /* Мерехтіння паркових ліхтарів */
    @keyframes lampGlow {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 0.95; }
    }
    .lamp-aura { animation: lampGlow 3.6s ease-in-out infinite; }

    /* Політ пташок у небі */
    @keyframes birdFly {
      0% { transform: translate(-120px, 20px) scale(0.8); }
      25% { transform: translate(380px, -25px) scale(0.85); }
      50% { transform: translate(860px, 10px) scale(0.75); }
      75% { transform: translate(1300px, -20px) scale(0.82); }
      100% { transform: translate(1720px, 15px) scale(0.8); }
    }
    .sky-birds { animation: birdFly 34s linear infinite; }

    /* ================= ДЕРЕВ'ЯНИЙ ПАРКОВИЙ СТЕНД ДЛЯ СЛОВА ================= */
    #board-wrapper {
      position: absolute;
      top: 44%;
      left: 54%;
      transform: translate(-50%, -50%);
      width: min(84vw, 960px);
      height: min(48vh, 375px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* SVG-рама стенда */
    #board-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 18px 24px rgba(32, 22, 8, 0.35));
      pointer-events: none;
    }

    /* Контейнер для літер слова */
    #word-container {
      position: relative;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.5vw, 22px);
      padding: 18px 34px;
      width: 88%;
      height: 76%;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Святкова анімація, коли всі листочки прибрано */
    #word-container.word-revealed {
      animation: wordCelebrate 1.1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes wordCelebrate {
      0% { transform: scale(1); }
      35% { transform: scale(1.12) rotate(-1.2deg); }
      65% { transform: scale(1.06) rotate(1deg); }
      100% { transform: scale(1.04) rotate(0deg); }
    }

    /* Окрема комірка літери + листочка */
    .letter-slot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(82px, 13.8vw, 152px);
      height: clamp(120px, 26vh, 210px);
      flex-shrink: 0;
    }

    /* Велика, чітка прописна літера */
    .cursive-letter {
      font-family: 'Marck Script', 'Caveat', 'Segoe Script', cursive;
      font-size: clamp(5.8rem, 12.2vw, 10.4rem);
      line-height: 1;
      color: #421f0c;
      text-shadow:
        0 2px 0 rgba(255, 246, 220, 0.9),
        0 4px 10px rgba(72, 34, 10, 0.22);
      transform: rotate(-3deg);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.35s ease, text-shadow 0.35s ease;
      cursor: pointer;
    }

    .letter-slot.uncovered .cursive-letter {
      color: #27591d;
      transform: rotate(-2deg) scale(1.07);
      text-shadow:
        0 0 18px rgba(255, 224, 102, 0.92),
        0 3px 0 rgba(255, 250, 225, 0.95);
    }

    #word-container.word-revealed .cursive-letter {
      color: #7c2d12;
      animation: letterWave 0.75s ease-in-out forwards;
      text-shadow:
        0 0 22px rgba(255, 208, 66, 0.95),
        0 3px 0 #fff7d6;
    }

    @keyframes letterWave {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1.07); }
      50% { transform: translateY(-14px) rotate(3deg) scale(1.14); }
    }

    /* ================= ІНТЕРАКТИВНИЙ ЛИСТОЧОК =================
       Розмір спеціально підібрано так, щоб прикривати лише ~30–35% літери,
       а дитина могла легко впізнати її ще до зняття листочка.
       Додано невидимий padding для зручного захоплення пальцем або мишкою! */
    .leaf-cover {
      position: absolute;
      width: clamp(66px, 8.2vw, 94px);
      height: clamp(66px, 8.2vw, 94px);
      padding: 12px;
      cursor: grab;
      z-index: 20;
      touch-action: none;
      filter: drop-shadow(0 5px 7px rgba(45, 24, 5, 0.34));
      transition: filter 0.2s ease;
      will-change: transform, opacity;
    }

    .leaf-cover:hover {
      filter: drop-shadow(0 10px 12px rgba(45, 24, 5, 0.44)) brightness(1.07);
    }

    .leaf-cover:active {
      cursor: grabbing;
    }

    /* Легке тремтіння листочка на вітрі */
    .leaf-inner {
      width: 100%;
      height: 100%;
      transform-origin: 50% 50%;
      animation: leafBreathe 3.4s ease-in-out infinite;
    }

    @keyframes leafBreathe {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(3.5deg) scale(1.03); }
    }

    /* Анімація відльоту листочка після кліку або перетягування */
    .leaf-cover.flying-away {
      pointer-events: none;
      transition: transform 0.95s cubic-bezier(0.22, 0.68, 0.36, 1), opacity 0.85s ease-in;
      opacity: 0;
    }

    /* ================= ЖИВИЙ ПЕРСОНАЖ: БІЛОЧКА НА ПЕНЬОЧКУ =================
       Пеньочок і білочка знаходяться в одному SVG — тому вона ЗАВЖДИ
       сидить точно на пеньочку на будь-якому екрані! */
    #squirrel-container {
      position: absolute;
      bottom: clamp(4px, 1.5vh, 18px);
      left: clamp(10px, 2.5vw, 44px);
      width: clamp(170px, 22vw, 275px);
      height: clamp(210px, 27.5vw, 340px);
      z-index: 25;
      cursor: pointer;
      filter: drop-shadow(0 10px 14px rgba(24, 34, 14, 0.32));
      transition: transform 0.25s ease;
    }

    #squirrel-container:hover {
      transform: scale(1.03);
    }

    /* Дихання, рух хвоста, підстрибування та емоції білочки */
    @keyframes squirrelBreathe {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50% { transform: scaleY(1.022) translateY(-2px); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes tailWagFast {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(16deg); }
    }
    @keyframes squirrelHop {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-30px) scale(1.05, 0.96) rotate(-4deg); }
      65% { transform: translateY(-10px) scale(0.98, 1.04) rotate(3deg); }
    }
    @keyframes squirrelCelebrate {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      20% { transform: translateY(-38px) rotate(-7deg) scale(1.07); }
      40% { transform: translateY(0) rotate(0deg) scale(1); }
      60% { transform: translateY(-34px) rotate(7deg) scale(1.07); }
      80% { transform: translateY(-6px) rotate(-3deg); }
    }
    @keyframes earTwitch {
      0%, 88%, 100% { transform: rotate(0deg); }
      92% { transform: rotate(-10deg); }
      96% { transform: rotate(6deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    #sq-body-group {
      transform-origin: 145px 215px;
      animation: squirrelBreathe 2.8s ease-in-out infinite;
    }
    #sq-tail {
      transform-origin: 108px 195px;
      animation: tailWag 2.4s ease-in-out infinite;
    }
    #sq-ear-r {
      transform-origin: 162px 104px;
      animation: earTwitch 4.5s ease-in-out infinite;
    }
    .sq-eye-lid {
      transform-origin: center;
      transform-box: fill-box;
      animation: eyeBlink 4.2s ease-in-out infinite;
    }

    #squirrel-container.hop #sq-root {
      animation: squirrelHop 0.58s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #squirrel-container.celebrate #sq-root {
      animation: squirrelCelebrate 1.15s ease-in-out 2;
    }
    #squirrel-container.celebrate #sq-tail,
    #squirrel-container.hop #sq-tail {
      animation: tailWagFast 0.28s ease-in-out infinite;
    }

    /* ================= МІНІМАЛІСТИЧНІ КНОПКИ «НАЗАД» ТА «ДАЛІ» ================= */
    .nav-btn {
      position: absolute;
      bottom: clamp(18px, 4vh, 36px);
      width: clamp(58px, 7.5vw, 76px);
      height: clamp(58px, 7.5vw, 76px);
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 40;
      padding: 0;
      outline: none;
      filter: drop-shadow(0 8px 12px rgba(34, 20, 6, 0.35));
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }

    .nav-btn:hover {
      transform: scale(1.12);
      filter: drop-shadow(0 12px 16px rgba(34, 20, 6, 0.42)) brightness(1.06);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    #btn-prev {
      right: clamp(92px, 12vw, 134px);
    }

    #btn-next {
      right: clamp(20px, 3vw, 40px);
    }

    /* ================= ШАР ДЛЯ ЕФЕКТІВ ФІДБЕКУ ================= */
    #fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 35;
      overflow: hidden;
    }

    .fx-particle {
      position: absolute;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* Адаптивність для невеликих екранів та планшетів */
    @media (max-width: 720px) {
      #board-wrapper {
        top: 38%;
        left: 50%;
        width: 94vw;
        height: 40vh;
      }
      #squirrel-container {
        width: 145px;
        height: 180px;
        bottom: 8px;
        left: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="game-stage">

    <!-- ================= 1. СЮЖЕТНИЙ ЖИВИЙ ФОН: ПАРК У МІСТІ ================= -->
    <svg id="park-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Градієнт неба -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4ba6e3" />
          <stop offset="52%" stop-color="#9ad8f5" />
          <stop offset="100%" stop-color="#fce8b8" />
        </linearGradient>

        <!-- Сонце -->
        <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffef0" />
          <stop offset="55%" stop-color="#ffe066" />
          <stop offset="100%" stop-color="#ffb830" stop-opacity="0" />
        </radialGradient>

        <!-- Градієнти пагорбів парку -->
        <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7ec46b" />
          <stop offset="100%" stop-color="#4d994c" />
        </linearGradient>
        <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#69b854" />
          <stop offset="100%" stop-color="#3c823d" />
        </linearGradient>
        <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#58a646" />
          <stop offset="100%" stop-color="#2d6b2e" />
        </linearGradient>

        <!-- Доріжка парку -->
        <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8cfa0" />
          <stop offset="100%" stop-color="#c9a46c" />
        </linearGradient>

        <!-- Крони дерев -->
        <radialGradient id="treeGreen" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#8be05c" />
          <stop offset="60%" stop-color="#489e3c" />
          <stop offset="100%" stop-color="#296628" />
        </radialGradient>
        <radialGradient id="treeGold" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ffd559" />
          <stop offset="55%" stop-color="#f08c2b" />
          <stop offset="100%" stop-color="#b84a16" />
        </radialGradient>
        <radialGradient id="treeRed" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff8a5b" />
          <stop offset="60%" stop-color="#d9462b" />
          <stop offset="100%" stop-color="#8c2318" />
        </radialGradient>

        <!-- Світіння паркового ліхтаря -->
        <radialGradient id="lampLight" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff8c4" stop-opacity="0.95" />
          <stop offset="45%" stop-color="#ffd86b" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#ffd86b" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Небо -->
      <rect width="1600" height="900" fill="url(#skyGrad)" />

      <!-- Сонце з променями -->
      <g class="sun-rays" opacity="0.55">
        <g transform="translate(1380,120)" fill="#fff2a6">
          <polygon points="0,-135 12,-70 -12,-70" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(30)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(60)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(90)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(120)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(150)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(180)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(210)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(240)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(270)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(300)" />
          <polygon points="0,-135 12,-70 -12,-70" transform="rotate(330)" />
        </g>
      </g>
      <circle cx="1380" cy="120" r="105" fill="url(#sunCore)" />
      <circle cx="1380" cy="120" r="46" fill="#fff7bf" />

      <!-- Пливучі хмарки -->
      <g class="cloud-1" opacity="0.9">
        <path d="M40,140 C40,115 70,102 95,112 C108,85 152,82 172,106 C198,100 225,118 220,142 C232,155 220,174 198,174 L65,174 C40,174 28,156 40,140 Z" fill="#ffffff" />
        <path d="M55,168 L205,168 C212,168 215,158 205,158 L62,158 C50,158 48,168 55,168 Z" fill="#e1f2fc" />
      </g>
      <g class="cloud-2" opacity="0.82" transform="translate(0, 55) scale(0.82)">
        <path d="M40,140 C40,115 70,102 95,112 C108,85 152,82 172,106 C198,100 225,118 220,142 C232,155 220,174 198,174 L65,174 C40,174 28,156 40,140 Z" fill="#ffffff" />
      </g>
      <g class="cloud-3" opacity="0.72" transform="translate(0, 12) scale(0.65)">
        <path d="M40,140 C40,115 70,102 95,112 C108,85 152,82 172,106 C198,100 225,118 220,142 C232,155 220,174 198,174 L65,174 C40,174 28,156 40,140 Z" fill="#fffdf5" />
      </g>

      <!-- Зграйка далеких пташок -->
      <g class="sky-birds" stroke="#456e8c" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M0,190 Q10,178 20,190 Q30,178 40,190" />
        <path d="M52,170 Q60,160 68,170 Q76,160 84,170" />
        <path d="M25,212 Q32,204 39,212 Q46,204 53,212" />
      </g>

      <!-- СИЛУЕТ МІСТА НА ГОРИЗОНТІ (будинки + колесо огляду) -->
      <g id="city-skyline" opacity="0.92">
        <!-- Колесо огляду -->
        <g stroke="#7a9eb8" stroke-width="4" fill="none">
          <line x1="1120" y1="330" x2="1075" y2="515" stroke-width="6" />
          <line x1="1120" y1="330" x2="1165" y2="515" stroke-width="6" />
        </g>
        <g class="ferris-wheel">
          <circle cx="1120" cy="330" r="105" stroke="#85abc4" stroke-width="4" fill="none" />
          <circle cx="1120" cy="330" r="78" stroke="#9ec0d6" stroke-width="2" fill="none" />
          <g stroke="#9ec0d6" stroke-width="2">
            <line x1="1120" y1="225" x2="1120" y2="435" />
            <line x1="1015" y1="330" x2="1225" y2="330" />
            <line x1="1046" y1="256" x2="1194" y2="404" />
            <line x1="1194" y1="256" x2="1046" y2="404" />
          </g>
          <!-- Кабінки колеса -->
          <rect x="1112" y="216" width="16" height="16" rx="4" fill="#f58a67" />
          <rect x="1112" y="428" width="16" height="16" rx="4" fill="#f7c85c" />
          <rect x="1006" y="322" width="16" height="16" rx="4" fill="#6cc9a4" />
          <rect x="1218" y="322" width="16" height="16" rx="4" fill="#9b87e8" />
          <rect x="1038" y="248" width="16" height="16" rx="4" fill="#f7c85c" />
          <rect x="1186" y="396" width="16" height="16" rx="4" fill="#f58a67" />
          <rect x="1186" y="248" width="16" height="16" rx="4" fill="#6cc9a4" />
          <rect x="1038" y="396" width="16" height="16" rx="4" fill="#9b87e8" />
          <circle cx="1120" cy="330" r="10" fill="#f7c85c" />
        </g>

        <!-- Будинки міста -->
        <rect x="45" y="340" width="95" height="220" rx="6" fill="#89a8c9" />
        <polygon points="40,342 92,295 145,342" fill="#c97967" />
        <rect x="135" y="275" width="110" height="285" rx="6" fill="#a2b8d4" />
        <rect x="240" y="320" width="90" height="240" rx="6" fill="#d9a68b" />
        <polygon points="235,322 285,282 335,322" fill="#a85c4c" />
        <rect x="330" y="365" width="105" height="195" rx="6" fill="#9bb4cf" />

        <rect x="445" y="310" width="85" height="250" rx="5" fill="#e0be8d" />
        <rect x="525" y="255" width="76" height="305" rx="5" fill="#94b0cc" />
        <!-- Вежа з годинником -->
        <polygon points="520,257 563,205 606,257" fill="#6888a8" />
        <circle cx="563" cy="288" r="18" fill="#fff7db" stroke="#6888a8" stroke-width="3" />
        <line x1="563" y1="288" x2="563" y2="276" stroke="#4d6882" stroke-width="2.5" stroke-linecap="round" />
        <line x1="563" y1="288" x2="573" y2="291" stroke="#4d6882" stroke-width="2.5" stroke-linecap="round" />

  <script>
    /* =========================================================================
       НАЛАШТУВАННЯ ГРИ (МОЖНА ЛЕГКО РЕДАГУВАТИ!)
       ========================================================================= */

    // Список слів (24 слова по 4–5 літер). Можна додавати або змінювати на власні.
    const WORDS = [
      'сонце', 'літо', 'вода', 'квіти',
      'трава', 'небо', 'вітер', 'хмара',
      'білка', 'сова', 'річка', 'клен',
      'липа', 'весна', 'осінь', 'зима',
      'парк', 'море', 'поле', 'казка',
      'пісня', 'птахи', 'роса', 'сніг'
    ];

    /*
      Зміщення листочків відносно центру літери (у відсотках від розміру комірки).
      Листочок акуратно прикриває лише один куточок або край літери (~30%),
      тому основні елементи прописної літери добре видно і дитина може її впізнати!
    */
    const LEAF_OFFSETS = [
      { x: 26,  y: 28,  rot: -20 }, // нижній правий куточок
      { x: -26, y: 26,  rot: 24  }, // нижній лівий куточок
      { x: 25,  y: -18, rot: 18  }, // верхній правий куточок
      { x: -25, y: -16, rot: -26 }, // верхній лівий куточок
      { x: 8,   y: 34,  rot: -12 }  // самий низ літери
    ];

    /* =========================================================================
       ЗВУКОВИЙ РУШІЙ (WEB AUDIO API — БЕЗ ЗОВНІШНІХ ФАЙЛІВ)
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      ensure() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Шелест листочка + дзвінка нота ксилофону
      playLeafRemove(stepIndex) {
        this.ensure();
        const now = this.ctx.currentTime;

        const bufferSize = Math.floor(this.ctx.sampleRate * 0.22);
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, now);
        filter.frequency.exponentialRampToValueAtTime(3200, now + 0.18);
        filter.Q.value = 1.4;

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.18, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);

        const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
        const freq = scale[stepIndex % scale.length];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.02, now + 0.08);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.24, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      }

      // 4 варіанти святкових мелодій при повному відкритті слова
      playWordCelebration(variant) {
        this.ensure();
        const now = this.ctx.currentTime;
        const melodies = [
          [523.25, 659.25, 783.99, 1046.5, 1318.5],
          [587.33, 739.99, 880.0, 1174.66, 880.0, 1174.66],
          [659.25, 783.99, 987.77, 1318.5, 1567.98],
          [523.25, 659.25, 880.0, 783.99, 1046.5]
        ];
        const notes = melodies[variant % melodies.length];

        notes.forEach((freq, i) => {
          const t = now + i * 0.095;
          const osc = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc2.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          osc2.frequency.setValueAtTime(freq * 2, t);

          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.2, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);

          osc.connect(gain);
          osc2.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(t);
          osc2.start(t);
          osc.stop(t + 0.58);
          osc2.stop(t + 0.58);
        });
      }

      // Писк білочки при натисканні
      playSquirrelChirp() {
        this.ensure();
        const now = this.ctx.currentTime;
        [0, 0.11].forEach((offset, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const base = idx === 0 ? 920 : 1120;
          osc.frequency.setValueAtTime(base, now + offset);
          osc.frequency.exponentialRampToValueAtTime(base * 1.45, now + offset + 0.07);
          osc.frequency.exponentialRampToValueAtTime(base * 1.1, now + offset + 0.1);

          gain.gain.setValueAtTime(0.001, now + offset);
          gain.gain.linearRampToValueAtTime(0.16, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.11);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.12);
        });
      }

      // Клік кнопок навігації
      playNavClick(isNext) {
        this.ensure();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isNext ? 440 : 350, now);
        osc.frequency.exponentialRampToValueAtTime(isNext ? 620 : 280, now + 0.09);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
    }

    const sound = new SoundEngine();

    /* =========================================================================
       ГЕНЕРАТОР ДЕТАЛІЗОВАНИХ SVG-ЛИСТОЧКІВ (5 РІЗНИХ ПОРІД ДЕРЕВ)
       ========================================================================= */
    let leafUidCounter = 0;

    function createDetailedLeafSVG(typeIndex) {
      const uid = ++leafUidCounter;
      const types = [
        // 0: Кленовий золотисто-помаранчевий листочок
        () => `
          <svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lg${uid}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffd54f" />
                <stop offset="52%" stop-color="#f28322" />
                <stop offset="100%" stop-color="#bd3817" />
              </linearGradient>
            </defs>
            <path d="M60,92 L60,115" stroke="#6e2e0f" stroke-width="5" stroke-linecap="round" />
            <path d="M60,94 C50,90 42,96 32,88 C36,80 34,74 14,70 C24,62 24,54 12,42 C28,44 36,42 42,48 C36,30 34,20 42,10 C48,18 54,18 60,6 C66,18 72,18 78,10 C86,20 84,30 78,48 C84,42 92,44 108,42 C96,54 96,62 106,70 C86,74 84,80 88,88 C78,96 70,90 60,94 Z"
                  fill="url(#lg${uid})" stroke="#7d290c" stroke-width="2.8" stroke-linejoin="round" />
            <g stroke="#ffe7a1" stroke-width="2" stroke-linecap="round" opacity="0.72" fill="none">
              <path d="M60,92 L60,18" />
              <path d="M60,72 L24,52" />
              <path d="M60,72 L96,52" />
              <path d="M60,52 L42,24" />
              <path d="M60,52 L78,24" />
            </g>
            <ellipse cx="47" cy="54" rx="4" ry="2.6" fill="#ffffff" opacity="0.55" transform="rotate(-25 47 54)" />
          </svg>
        `,

        // 1: Дубовий смарагдово-салатовий листочок
        () => `
          <svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lg${uid}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#a8eb5b" />
                <stop offset="55%" stop-color="#4ea836" />
                <stop offset="100%" stop-color="#226624" />
              </linearGradient>
            </defs>
            <path d="M60,96 Q62,108 68,116" stroke="#42591b" stroke-width="5" fill="none" stroke-linecap="round" />
            <path d="M60,96 C46,94 34,86 38,76 C24,74 18,58 32,52 C20,42 26,24 44,28 C44,12 60,6 60,6 C60,6 76,12 76,28 C94,24 100,42 88,52 C102,58 96,74 82,76 C86,86 74,94 60,96 Z"
                  fill="url(#lg${uid})" stroke="#1f541f" stroke-width="2.8" stroke-linejoin="round" />
            <g stroke="#d9ffa8" stroke-width="2.1" stroke-linecap="round" opacity="0.7" fill="none">
              <path d="M60,94 L60,16" />
              <path d="M60,74 L38,62" />
              <path d="M60,74 L82,62" />
              <path d="M60,52 L36,38" />
              <path d="M60,52 L84,38" />
            </g>
          </svg>
        `,

        // 2: Липовий серцеподібний сонячно-жовтий листочок
        () => `
          <svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lg${uid}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#fff078" />
                <stop offset="55%" stop-color="#f5b82e" />
                <stop offset="100%" stop-color="#c97914" />
              </linearGradient>
            </defs>
            <path d="M60,90 Q54,106 46,115" stroke="#7d4c10" stroke-width="4.5" fill="none" stroke-linecap="round" />
            <path d="M60,10 C82,28 102,52 94,76 C88,92 70,96 60,86 C50,96 32,92 26,76 C18,52 38,28 60,10 Z"
                  fill="url(#lg${uid})" stroke="#8c540e" stroke-width="2.8" stroke-linejoin="round" />
            <g stroke="#fff9cc" stroke-width="2.1" stroke-linecap="round" opacity="0.75" fill="none">
              <path d="M60,86 L60,20" />
              <path d="M60,68 Q42,64 34,54" />
              <path d="M60,68 Q78,64 86,54" />
              <path d="M60,48 Q46,44 42,36" />
              <path d="M60,48 Q74,44 78,36" />
            </g>
          </svg>
        `,

        // 3: Березовий яскраво-зелений листочок
        () => `
          <svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lg${uid}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#87f07a" />
                <stop offset="55%" stop-color="#3bb559" />
                <stop offset="100%" stop-color="#19733c" />
              </linearGradient>
            </defs>
            <path d="M60,92 L60,114" stroke="#235c2c" stroke-width="4.5" stroke-linecap="round" />
            <path d="M60,8 C72,26 96,46 92,72 C88,88 74,94 60,94 C46,94 32,88 28,72 C24,46 48,26 60,8 Z"
                  fill="url(#lg${uid})" stroke="#17592f" stroke-width="2.8" stroke-linejoin="round" />
            <g stroke="#d1ffcf" stroke-width="2" stroke-linecap="round" opacity="0.72" fill="none">
              <path d="M60,92 L60,18" />
              <path d="M60,76 L38,64" />
              <path d="M60,76 L82,64" />
              <path d="M60,56 L40,46" />
              <path d="M60,56 L80,46" />
              <path d="M60,38 L48,30" />
              <path d="M60,38 L72,30" />
            </g>
          </svg>
        `,

        // 4: Червоно-бордовий парковий листочок
        () => `
          <svg viewBox="0 0 120 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lg${uid}" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff8c61" />
                <stop offset="55%" stop-color="#e0432b" />
                <stop offset="100%" stop-color="#8f1c1c" />
              </linearGradient>
            </defs>
            <path d="M60,92 Q66,105 72,114" stroke="#631515" stroke-width="4.5" fill="none" stroke-linecap="round" />
            <path d="M60,10 C84,18 102,42 96,68 C90,88 74,94 60,94 C46,94 30,88 24,68 C18,42 36,18 60,10 Z"
                  fill="url(#lg${uid})" stroke="#6b1414" stroke-width="2.8" stroke-linejoin="round" />
            <g stroke="#ffd1bf" stroke-width="2" stroke-linecap="round" opacity="0.72" fill="none">
              <path d="M60,92 L60,20" />
              <path d="M60,70 L34,54" />
              <path d="M60,70 L86,54" />
              <path d="M60,46 L38,34" />
              <path d="M60,46 L82,34" />
            </g>
            <circle cx="72" cy="42" r="3.5" fill="#ffffff" opacity="0.5" />
          </svg>
        `
      ];

      return types[typeIndex % types.length]();
    }

    /* =========================================================================
       СТАН ГРИ ТА ЕЛЕМЕНТИ DOM
       ========================================================================= */
    let currentIndex = 0;
    let remainingLeaves = 0;
    let removedCount = 0;
    let celebrationCounter = 0;

    const wordContainer = document.getElementById('word-container');
    const fxLayer = document.getElementById('fx-layer');
    const squirrelEl = document.getElementById('squirrel-container');
    const sqEyesNormal = document.getElementById('sq-eyes-normal');
    const sqEyesHappy = document.getElementById('sq-eyes-happy');
    const sqMouthNormal = document.getElementById('sq-mouth-normal');
    const sqMouthHappy = document.getElementById('sq-mouth-happy');
    const pupilL = document.getElementById('pupil-l');
    const pupilR = document.getElementById('pupil-r');

    /* =========================================================================
       ВІДОБРАЖЕННЯ ПОТОЧНОГО СЛОВА З ЛИСТОЧКАМИ
       ========================================================================= */
    function loadWord(index) {
      currentIndex = (index + WORDS.length) % WORDS.length;
      const word = WORDS[currentIndex];
      const letters = Array.from(word);

      remainingLeaves = letters.length;
      removedCount = 0;

      wordContainer.classList.remove('word-revealed');
      wordContainer.innerHTML = '';
      setSquirrelEmotion('normal');

      letters.forEach((char, idx) => {
        const slot = document.createElement('div');
        slot.className = 'letter-slot';

        // Прописна літера
        const letterEl = document.createElement('span');
        letterEl.className = 'cursive-letter';
        letterEl.textContent = char;
        letterEl.style.animationDelay = `${idx * 0.08}s`;

        // При натисканні на вже відкриту літеру вона підстрибує й іскриться
        letterEl.addEventListener('pointerdown', () => {
          if (slot.classList.contains('uncovered')) {
            sound.playLeafRemove(idx);
            letterEl.style.transform = 'scale(1.2) rotate(4deg)';
            spawnSparklesAtElement(letterEl, 6);
            setTimeout(() => {
              letterEl.style.transform = '';
            }, 260);
          }
        });

        slot.appendChild(letterEl);

        // Створення листочка, який лише частково прикриває край літери
        const leaf = document.createElement('div');
        leaf.className = 'leaf-cover';

        const offset = LEAF_OFFSETS[(currentIndex + idx) % LEAF_OFFSETS.length];
        const baseX = offset.x;
        const baseY = offset.y;
        const baseRot = offset.rot;

        leaf.style.transform = `translate(${baseX}px, ${baseY}px) rotate(${baseRot}deg)`;

        const inner = document.createElement('div');
        inner.className = 'leaf-inner';
        inner.style.animationDelay = `${idx * 0.45}s`;
        inner.innerHTML = createDetailedLeafSVG(currentIndex + idx);
        leaf.appendChild(inner);

        attachLeafInteraction(leaf, slot, baseX, baseY, baseRot);

        slot.appendChild(leaf);
        wordContainer.appendChild(slot);
      });
    }

    /* =========================================================================
       ІНТЕРАКТИВНІСТЬ ЛИСТОЧКА: КЛІК АБО ПЕРЕТЯГУВАННЯ
       ========================================================================= */
    function attachLeafInteraction(leaf, slot, baseX, baseY, baseRot) {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let currentDX = 0;
      let currentDY = 0;
      let removed = false;

      leaf.addEventListener('pointerdown', (e) => {
        if (removed) return;
        e.preventDefault();
        sound.ensure();
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        currentDX = 0;
        currentDY = 0;
        leaf.setPointerCapture(e.pointerId);
        leaf.style.zIndex = '35';
        leaf.style.transition = 'none';
      });

      leaf.addEventListener('pointermove', (e) => {
        if (!isDragging || removed) return;
        currentDX = e.clientX - startX;
        currentDY = e.clientY - startY;
        const tilt = baseRot + currentDX * 0.28;
        leaf.style.transform = `translate(${baseX + currentDX}px, ${baseY + currentDY}px) rotate(${tilt}deg) scale(1.1)`;

        // Якщо відтягнули листочок достатньо далеко — він злітає!
        if (Math.hypot(currentDX, currentDY) > 58) {
          isDragging = false;
          flyAwayLeaf(leaf, slot, baseX + currentDX, baseY + currentDY, currentDX, currentDY);
          removed = true;
        }
      });

      const handleRelease = () => {
        if (!isDragging || removed) return;
        isDragging = false;
        const dirX = Math.abs(currentDX) > 8 ? currentDX * 4 : (Math.random() > 0.5 ? 1 : -1) * (140 + Math.random() * 140);
        const dirY = Math.abs(currentDY) > 8 ? currentDY * 4 : -(130 + Math.random() * 120);
        flyAwayLeaf(leaf, slot, baseX + currentDX, baseY + currentDY, dirX, dirY);
        removed = true;
      };

      leaf.addEventListener('pointerup', handleRelease);
      leaf.addEventListener('pointercancel', handleRelease);
    }

    function flyAwayLeaf(leaf, slot, fromX, fromY, vx, vy) {
      const rect = leaf.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      sound.playLeafRemove(removedCount);
      spawnSparkles(cx, cy, 10);

      leaf.classList.add('flying-away');
      const endX = fromX + (vx >= 0 ? Math.max(vx, 180) : Math.min(vx, -180)) * 1.4;
      const endY = fromY + (vy < 0 ? Math.min(vy, -140) : vy - 120);
      const spin = (vx >= 0 ? 1 : -1) * (240 + Math.random() * 220);

      requestAnimationFrame(() => {
        leaf.style.transform = `translate(${endX}px, ${endY}px) rotate(${spin}deg) scale(0.45)`;
      });

      slot.classList.add('uncovered');
      removedCount++;
      remainingLeaves--;

      if (remainingLeaves > 0) {
        triggerSquirrelHop();
      } else {
        setTimeout(() => {
          triggerWordCelebration();
        }, 180);
      }

      setTimeout(() => {
        if (leaf.parentNode) leaf.remove();
      }, 980);
    }

    /* =========================================================================
       ЕМОЦІЇ ТА АНІМАЦІЇ БІЛОЧКИ
       ========================================================================= */
    let emotionTimeout = null;

    function setSquirrelEmotion(mode) {
      if (mode === 'happy') {
        sqEyesNormal.style.display = 'none';
        sqEyesHappy.style.display = 'block';
        sqMouthNormal.style.display = 'none';
        sqMouthHappy.style.display = 'block';
      } else {
        sqEyesNormal.style.display = 'block';
        sqEyesHappy.style.display = 'none';
        sqMouthNormal.style.display = 'block';
        sqMouthHappy.style.display = 'none';
      }
    }

    function triggerSquirrelHop() {
      squirrelEl.classList.remove('hop');
      void squirrelEl.offsetWidth;
      squirrelEl.classList.add('hop');
      setSquirrelEmotion('happy');

      clearTimeout(emotionTimeout);
      emotionTimeout = setTimeout(() => {
        if (!squirrelEl.classList.contains('celebrate')) {
          setSquirrelEmotion('normal');
        }
      }, 650);
    }

    function triggerSquirrelCelebrate() {
      squirrelEl.classList.remove('hop', 'celebrate');
      void squirrelEl.offsetWidth;
      squirrelEl.classList.add('celebrate');
      setSquirrelEmotion('happy');

      clearTimeout(emotionTimeout);
      emotionTimeout = setTimeout(() => {
        squirrelEl.classList.remove('celebrate');
        setSquirrelEmotion('normal');
      }, 2400);
    }

    // При натисканні на білочку вона радісно пищить і підстрибує на пеньочку
    squirrelEl.addEventListener('pointerdown', () => {
      sound.playSquirrelChirp();
      triggerSquirrelHop();
      const rect = squirrelEl.getBoundingClientRect();
      spawnHearts(rect.left + rect.width * 0.56, rect.top + rect.height * 0.22, 4);
    });

    // Зіниці білочки стежать за курсором / пальцем дитини
    window.addEventListener('pointermove', (e) => {
      const rect = squirrelEl.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.56;
      const cy = rect.top + rect.height * 0.35;
      const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
      const dist = Math.min(3.4, Math.hypot(e.clientX - cx, e.clientY - cy) / 90);
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;

      pupilL.setAttribute('cx', (142 + dx).toFixed(1));
      pupilL.setAttribute('cy', (117 + dy).toFixed(1));
      pupilR.setAttribute('cx', (178 + dx).toFixed(1));
      pupilR.setAttribute('cy', (117 + dy).toFixed(1));
    });

    /* =========================================================================
       АКТИВНІ ТА РІЗНОМАНІТНІ ВІЗУАЛЬНІ ФІДБЕКИ (БЕЗ СЛІВ)
       ========================================================================= */
    function triggerWordCelebration() {
      wordContainer.classList.add('word-revealed');
      sound.playWordCelebration(celebrationCounter);
      triggerSquirrelCelebrate();

      const boardRect = wordContainer.getBoundingClientRect();
      const cx = boardRect.left + boardRect.width / 2;
      const cy = boardRect.top + boardRect.height / 2;

      const mode = celebrationCounter % 3;
      if (mode === 0) {
        spawnButterflies(8);
        spawnSparkles(cx, cy, 24);
      } else if (mode === 1) {
        spawnFlowerPetals(28);
        spawnSparkles(cx, cy, 18);
      } else {
        spawnParkBubbles(18);
        spawnButterflies(5);
      }

      celebrationCounter++;
    }

    function spawnSparkles(x, y, count) {
      const colors = ['#ffe14d', '#ff9b42', '#7dff6b', '#ff6fa5', '#6be5ff'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'fx-particle';
        const size = 12 + Math.random() * 16;
        const color = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${x - size / 2}px`;
        el.style.top = `${y - size / 2}px`;
        el.innerHTML = `
          <svg viewBox="0 0 24 24" width="100%" height="100%">
            <path d="M12,1 L14.8,9.2 L23,12 L14.8,14.8 L12,23 L9.2,14.8 L1,12 L9.2,9.2 Z" fill="${color}" />
          </svg>
        `;
        fxLayer.appendChild(el);

        const angle = Math.random() * Math.PI * 2;
        const dist = 55 + Math.random() * 140;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist - 20;

        el.animate([
          { transform: 'translate(0, 0) scale(0.3) rotate(0deg)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) scale(1.15) rotate(${120 + Math.random() * 180}deg)`, opacity: 0 }
        ], {
          duration: 650 + Math.random() * 380,
          easing: 'cubic-bezier(0.16, 0.84, 0.44, 1)',
          fill: 'forwards'
        }).onfinish = () => el.remove();
      }
    }

    function spawnSparklesAtElement(targetEl, count) {
      const rect = targetEl.getBoundingClientRect();
      spawnSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, count);
    }

    function spawnButterflies(count) {
      const palettes = [
        ['#ff75a0', '#ffd166'],
        ['#6ec6ff', '#b388ff'],
        ['#ffd54f', '#ff8a47'],
        ['#7ce874', '#4dd0e1']
      ];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'fx-particle';
        const size = 34 + Math.random() * 22;
        const [c1, c2] = palettes[i % palettes.length];
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;

        const startX = window.innerWidth * (0.2 + Math.random() * 0.6);
        const startY = window.innerHeight * (0.45 + Math.random() * 0.25);
        el.style.left = `${startX}px`;
        el.style.top = `${startY}px`;

        el.innerHTML = `
          <svg viewBox="0 0 60 60" width="100%" height="100%">
            <path d="M30,30 C16,10 2,16 6,32 C10,42 22,40 30,34 Z" fill="${c1}" stroke="#4a2b3d" stroke-width="1.6"/>
            <path d="M30,30 C44,10 58,16 54,32 C50,42 38,40 30,34 Z" fill="${c1}" stroke="#4a2b3d" stroke-width="1.6"/>
            <path d="M30,34 C20,42 12,54 22,54 C28,54 30,44 30,36 Z" fill="${c2}" stroke="#4a2b3d" stroke-width="1.4"/>
            <path d="M30,34 C40,42 48,54 38,54 C32,54 30,44 30,36 Z" fill="${c2}" stroke="#4a2b3d" stroke-width="1.4"/>
            <ellipse cx="30" cy="34" rx="2.8" ry="10" fill="#4a2b3d"/>
          </svg>
        `;
        fxLayer.appendChild(el);

        const endX = (Math.random() - 0.5) * 620;
        const endY = -(240 + Math.random() * 260);
        const midX = endX * 0.45 + (Math.random() - 0.5) * 140;

        el.animate([
          { transform: 'translate(0, 0) scale(0.3) rotate(-15deg)', opacity: 0 },
          { transform: `translate(${midX}px, ${endY * 0.45}px) scale(1.1) rotate(12deg)`, opacity: 1, offset: 0.35 },
          { transform: `translate(${endX}px, ${endY}px) scale(0.85) rotate(-18deg)`, opacity: 0 }
        ], {
          duration: 1700 + Math.random() * 800,
          delay: i * 90,
          easing: 'ease-in-out',
          fill: 'forwards'
        }).onfinish = () => el.remove();
      }
    }

    function spawnFlowerPetals(count) {
      const colors = ['#ff85a2', '#ffd166', '#95e06c', '#ff9f68', '#b89eff'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'fx-particle';
        const size = 16 + Math.random() * 14;
        const color = colors[i % colors.length];
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${Math.random() * window.innerWidth}px`;
        el.style.top = `-30px`;
        el.innerHTML = `
          <svg viewBox="0 0 24 24" width="100%" height="100%">
            <path d="M12,2 C18,6 20,16 12,22 C4,16 6,6 12,2 Z" fill="${color}" />
          </svg>
        `;
        fxLayer.appendChild(el);

        const drift = (Math.random() - 0.5) * 260;
        el.animate([
          { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
          { transform: `translate(${drift}px, ${window.innerHeight + 60}px) rotate(${360 + Math.random() * 360}deg)`, opacity: 0.3 }
        ], {
          duration: 1800 + Math.random() * 1200,
          delay: Math.random() * 400,
          easing: 'ease-in',
          fill: 'forwards'
        }).onfinish = () => el.remove();
      }
    }

    function spawnParkBubbles(count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'fx-particle';
        const size = 24 + Math.random() * 34;
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${window.innerWidth * (0.15 + Math.random() * 0.7)}px`;
        el.style.top = `${window.innerHeight * (0.65 + Math.random() * 0.25)}px`;
        el.innerHTML = `
          <svg viewBox="0 0 40 40" width="100%" height="100%">
            <circle cx="20" cy="20" r="18" fill="rgba(180,240,255,0.28)" stroke="rgba(255,255,255,0.85)" stroke-width="2" />
            <ellipse cx="14" cy="13" rx="5" ry="3" fill="#ffffff" opacity="0.8" transform="rotate(-35 14 13)" />
          </svg>
        `;
        fxLayer.appendChild(el);

        const driftX = (Math.random() - 0.5) * 160;
        el.animate([
          { transform: 'translate(0, 0) scale(0.4)', opacity: 0.9 },
          { transform: `translate(${driftX}px, -${window.innerHeight * 0.7}px) scale(1.15)`, opacity: 0 }
        ], {
          duration: 1700 + Math.random() * 900,
          delay: i * 65,
          easing: 'ease-out',
          fill: 'forwards'
        }).onfinish = () => el.remove();
      }
    }

    function spawnHearts(x, y, count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'fx-particle';
        el.style.width = '20px';
        el.style.height = '20px';
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.innerHTML = `
          <svg viewBox="0 0 24 24" width="100%" height="100%">
            <path d="M12,21 C12,21 3,14.5 3,8.5 C3,5.4 5.4,3 8.2,3 C10,3 11.4,4 12,5.3 C12.6,4 14,3 15.8,3 C18.6,3 21,5.4 21,8.5 C21,14.5 12,21 12,21 Z" fill="#ff5e7e" />
          </svg>
        `;
        fxLayer.appendChild(el);

        const dx = (Math.random() - 0.5) * 90;
        const dy = -(65 + Math.random() * 75);
        el.animate([
          { transform: 'translate(0, 0) scale(0.4)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) scale(1.1)`, opacity: 0 }
        ], {
          duration: 850 + Math.random() * 300,
          delay: i * 80,
          easing: 'ease-out',
          fill: 'forwards'
        }).onfinish = () => el.remove();
      }
    }

    /* =========================================================================
       НАВІГАЦІЯ (МИТТЄВИЙ ПЕРЕХІД «НАЗАД» І «ДАЛІ»)
       ========================================================================= */
    document.getElementById('btn-prev').addEventListener('click', () => {
      sound.playNavClick(false);
      loadWord(currentIndex - 1);
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      sound.playNavClick(true);
      loadWord(currentIndex + 1);
    });

    // Стрілки клавіатури для швидкого перемикання вчителем
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        sound.playNavClick(true);
        loadWord(currentIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        sound.playNavClick(false);
        loadWord(currentIndex - 1);
      }
    });

    // Старт гри
    loadWord(0);
  </script>
</body>
</html>
