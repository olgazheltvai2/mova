         ========================================================================= */
      const MECHANICS = [
        { id: 'watering', build: buildWateringScene },
        { id: 'scrubbing', build: buildScrubbingScene },
        { id: 'cooking', build: buildCookingScene },
        { id: 'bridge', build: buildBridgeScene },
        { id: 'cloud', build: buildCloudSunScene },
        { id: 'harvest', build: buildHarvestScene },
        { id: 'sorting', build: buildSortingScene },
        { id: 'evening', build: buildEveningRoomScene },
        { id: 'concert', build: buildConcertScene },
        { id: 'seating', build: buildSeatingScene },
        { id: 'bubbles', build: buildBubblesScene },
        { id: 'care', build: buildAnimalCareScene }
      ];

      function loadNextScene() {
        pageDone = false;
        autoTurnTimer = 0;
        activeDrag = null;
        const pool = MECHANICS.filter(m => !recentMechanics.includes(m.id));
        const chosen = pick(pool.length ? pool : MECHANICS);
        recentMechanics.push(chosen.id);
        if (recentMechanics.length > 4) recentMechanics.shift();
        currentScene = chosen.build();
      }

      function triggerPageFlip() {
        if (pageFlipAnim > 0) return;
        sfx.playPageTurn();
        pageFlipAnim = 0.001;
        pendingNextScene = true;
      }

      function drawPageFlipSweep() {
        if (pageFlipAnim <= 0) return;
        // Smooth curved paper sweep across the open spread from right to left
        const p = pageFlipAnim;
        const foldX = lerp(BOOK.px + BOOK.pw, BOOK.px, p);
        const curlW = Math.sin(p * Math.PI) * 190;

        ctx.save();
        roundRectPath(ctx, BOOK.px, BOOK.py, BOOK.pw, BOOK.ph, 16);
        ctx.clip();

        // Shadow cast by lifting page
        const shG = ctx.createLinearGradient(foldX - 70, 0, foldX, 0);
        shG.addColorStop(0, 'rgba(42, 24, 8, 0)');
        shG.addColorStop(1, 'rgba(42, 24, 8, 0.34)');
        ctx.fillStyle = shG;
        ctx.fillRect(foldX - 70, BOOK.py, 70, BOOK.ph);

        // Curled cream parchment sheet
        const pg = ctx.createLinearGradient(foldX, 0, foldX + curlW, 0);
        pg.addColorStop(0, '#e3cb9d');
        pg.addColorStop(0.35, '#fdf5e2');
        pg.addColorStop(1, '#dfc594');
        ctx.fillStyle = pg;
        ctx.fillRect(foldX, BOOK.py, curlW, BOOK.ph);
        ctx.restore();
      }

      /* =========================================================================
         8. UNIFIED POINTER INPUT (MOUSE & TOUCH, DIRECT 1440x810 MAPPING)
         ========================================================================= */
      canvas.addEventListener('pointerdown', (e) => {
        if (pageFlipAnim > 0 || !currentScene) return;
        sfx.ready();
        const pt = clientToLogical(e.clientX, e.clientY);
        pointerX = pt.x; pointerY = pt.y;

        // Check draggable items top-most first
        const list = currentScene.items || [];
        for (let i = list.length - 1; i >= 0; i--) {
          const it = list[i];
          if (it.locked || it.hidden) continue;
          if (dist(pt.x, pt.y, it.x, it.y) <= it.radius) {
            activeDrag = it;
            it.dragging = true;
            it.targetScale = 1.09;
            dragOffX = pt.x - it.x;
            dragOffY = pt.y - it.y;
            // Move to top of render order cleanly
            list.splice(i, 1);
            list.push(it);
            sfx.playPickup();
            canvas.setPointerCapture(e.pointerId);
            return;
          }
        }

        // Otherwise trigger scene tap interaction (bubbles, lamps, instruments)
        if (currentScene.onTap) currentScene.onTap(pt.x, pt.y);
      });

      canvas.addEventListener('pointermove', (e) => {
        const pt = clientToLogical(e.clientX, e.clientY);
        pointerX = pt.x; pointerY = pt.y;
        if (activeDrag && activeDrag.dragging) {
          activeDrag.x = clamp(pt.x - dragOffX, BOOK.px + 30, BOOK.px + BOOK.pw - 30);
          activeDrag.y = clamp(pt.y - dragOffY, BOOK.py + 85, BOOK.py + BOOK.ph - 30);
        }
      });

      const endDrag = () => {
        if (activeDrag && activeDrag.dragging) {
          const it = activeDrag;
          it.dragging = false;
          activeDrag = null;
          if (currentScene && currentScene.onDrop) {
            currentScene.onDrop(it);
          } else {
            it.targetX = it.homeX; it.targetY = it.homeY; it.targetScale = 1;
          }
        }
      };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);

      /* =========================================================================
         9. MINIMALIST LANGUAGE & NEXT BUTTON HANDLERS
         ========================================================================= */
      langBtn.addEventListener('click', () => {
        sfx.ready();
        sfx.playXylophone(2);
        lang = lang === 'uk' ? 'ru' : 'uk';
        langBtn.textContent = lang === 'uk' ? 'укр' : 'рус';
        nextLabel.textContent = lang === 'uk' ? 'далі' : 'дальше';
      });

      nextBtn.addEventListener('click', () => {
        sfx.ready();
        triggerPageFlip();
      });

      /* =========================================================================
         10. MAIN 60FPS ANIMATION LOOP
         ========================================================================= */
      let lastTime = performance.now();

      function tick(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const t = now * 0.001;

        // Natural blinking rhythm
        blinkTimer -= dt;
        if (blinkTimer <= 0) {
          blinkAmount = 1;
          if (blinkTimer <= -0.14) {
            blinkAmount = 0;
            blinkTimer = 2.6 + Math.random() * 2.8;
          }
        }

        // Auto page turn after celebration
        if (pageDone && autoTurnTimer > 0) {
          autoTurnTimer -= dt;
          if (autoTurnTimer <= 0) triggerPageFlip();
        }

        // Page-flip animation progress
        if (pageFlipAnim > 0) {
          pageFlipAnim += dt * 1.75;
          if (pendingNextScene && pageFlipAnim >= 0.48) {
            pendingNextScene = false;
            loadNextScene();
          }
          if (pageFlipAnim >= 1) pageFlipAnim = 0;
        }

        // Update current scene & smooth item easing
        if (currentScene) {
          currentScene.update(dt, t);
          (currentScene.items || []).forEach(it => updateItemMotion(it, dt));
        }

        // Update ambient dust motes
        dustMotes.forEach(m => {
          m.x += m.vx + Math.sin(t + m.phase) * 0.16;
          m.y += m.vy;
          if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
          if (m.x < -10) m.x = W + 10;
          if (m.x > W + 10) m.x = -10;
        });

        // === RENDER FRAME IN SINGLE UNIFIED COORDINATE SPACE ===
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.translate(viewOffX, viewOffY);
        ctx.scale(viewScale, viewScale);

        drawWoodenDeskAndBook(t);

        if (currentScene) {
          ctx.save();
          roundRectPath(ctx, BOOK.px, BOOK.py, BOOK.pw, BOOK.ph, 16);
          ctx.clip();

          currentScene.draw(t);
          (currentScene.items || []).forEach(it => renderItem(it, t));
          if (currentScene.drawForeground) currentScene.drawForeground(t);

          ctx.restore();
          drawBookOverlayDetails();
          drawSentenceRibbon(currentScene.texts[lang]);
        }

        drawPageFlipSweep();
        updateAndDrawParticles(dt);

        // Floating golden sunlit dust motes
        dustMotes.forEach(m => {
          const a = 0.14 + 0.16 * (0.5 + 0.5 * Math.sin(t * 1.6 + m.phase));
          ctx.fillStyle = `rgba(255, 240, 188, ${a.toFixed(3)})`;
          ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
        });

        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', resizeCanvas);
      window.onload = () => {
        resizeCanvas();
        loadNextScene();
        requestAnimationFrame(tick);
      };
    })();
  </script>
</body>
</html>
