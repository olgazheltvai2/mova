      /* =========================================================================
       * 12. VIBRANT CARTOON OPEN-TOP CONVERTIBLE CAR
       * ========================================================================= */
      function drawConvertibleCar(ctx) {
        const car = game.car;
        const pal = CAR_PALETTES[car.paletteIndex];

        ctx.save();
        ctx.translate(car.x, car.y + car.bounce * 0.25);

        // Ground shadow beneath car
        ctx.fillStyle = 'rgba(20, 26, 34, 0.36)';
        ctx.beginPath();
        ctx.ellipse(0, 52 - car.bounce * 0.25, 178, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.rotate(car.pitch);

        // --- BACK LAYER: Cozy interior, seat backrest, steering wheel ---
        // Rear exhaust pipe
        ctx.fillStyle = '#bdc3c7';
        ctx.strokeStyle = '#57606f';
        ctx.lineWidth = 3;
        roundRect(ctx, -172, 12, 34, 14, 5);
        ctx.fill();
        ctx.stroke();

        // Interior tub background
        ctx.fillStyle = '#2f3542';
        ctx.beginPath();
        ctx.roundRect(-84, -46, 152, 54, 16);
        ctx.fill();

        // Cozy seat backrest
        ctx.fillStyle = pal.seat;
        ctx.strokeStyle = '#2f3542';
        ctx.lineWidth = 3;
        roundRect(ctx, -78, -68, 38, 62, 14);
        ctx.fill();
        ctx.stroke();

        // Steering column & steering wheel
        ctx.strokeStyle = '#2f3542';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(52, -10);
        ctx.lineTo(30, -44);
        ctx.stroke();
        ctx.strokeStyle = '#1e272e';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.ellipse(26, -46, 8, 20, -0.35, 0, Math.PI * 2);
        ctx.stroke();

        // --- MIDDLE LAYER: Seated character visibly waving behind steering wheel! ---
        if (car.passenger) {
          ctx.save();
          // Clip bottom so character sits cleanly inside cockpit
          ctx.beginPath();
          ctx.rect(-140, -260, 280, 245);
          ctx.clip();

          // Temporarily place character at cockpit origin
          const p = car.passenger;
          const savedX = p.x;
          const savedY = p.y;
          p.x = -12;
          p.y = 26;
          drawCharacter(ctx, p, true);
          p.x = savedX;
          p.y = savedY;
          ctx.restore();
        }

        // --- FRONT LAYER: Glossy sculpted convertible body, windshield, headlights, spinning wheels ---
        // Angled glossy windshield
        ctx.save();
        ctx.fillStyle = 'rgba(180, 240, 255, 0.72)';
        ctx.strokeStyle = '#dfe6e9';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(58, -22);
        ctx.lineTo(36, -78);
        ctx.lineTo(54, -78);
        ctx.lineTo(78, -22);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Main glossy car body silhouette
        const bodyGrad = ctx.createLinearGradient(0, -45, 0, 38);
        bodyGrad.addColorStop(0, pal.light);
        bodyGrad.addColorStop(0.28, pal.body);
        bodyGrad.addColorStop(1, pal.dark);
        ctx.fillStyle = bodyGrad;
        ctx.strokeStyle = '#2c2c2c';
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(-148, 28);
        ctx.lineTo(-154, -6);
        ctx.quadraticCurveTo(-152, -32, -118, -34);
        ctx.lineTo(-76, -34);
        ctx.lineTo(-68, -14); // Cockpit door dip
        ctx.lineTo(48, -14);
        ctx.lineTo(60, -34);
        ctx.quadraticCurveTo(132, -34, 158, -12);
        ctx.quadraticCurveTo(170, 4, 162, 28);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Playful side racing stripe
        ctx.fillStyle = pal.stripe;
        ctx.beginPath();
        ctx.roundRect(-144, -2, 294, 11, 5);
        ctx.fill();

        // Glossy top shine highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
        ctx.beginPath();
        ctx.ellipse(106, -22, 34, 6, 0.12, 0, Math.PI * 2);
        ctx.ellipse(-116, -24, 24, 5, -0.05, 0, Math.PI * 2);
        ctx.fill();

        // Chrome front & rear bumpers
        ctx.fillStyle = '#ecf0f1';
        ctx.strokeStyle = '#57606f';
        ctx.lineWidth = 3;
        roundRect(ctx, 146, 12, 26, 15, 7);
        ctx.fill();
        ctx.stroke();
        roundRect(ctx, -166, 12, 26, 15, 7);
        ctx.fill();
        ctx.stroke();

        // Shiny glowing headlight
        ctx.fillStyle = '#fff59d';
        ctx.strokeStyle = '#d68910';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(158, -4, 9, 13, -0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Cute red tail light
        ctx.fillStyle = '#ff4757';
        ctx.strokeStyle = '#b33939';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(-150, -6, 7, 11, 0.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Spinning spoked wheels
        drawWheel(ctx, -96, 30, 36, car.wheelAngle);
        drawWheel(ctx, 96, 30, 36, car.wheelAngle);

        ctx.restore();
      }

      function drawWheel(ctx, x, y, r, angle) {
        ctx.save();
        ctx.translate(x, y);

        // Tire rubber
        ctx.fillStyle = '#2f3542';
        ctx.strokeStyle = '#1e272e';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Whitewall accent ring
        ctx.strokeStyle = '#f1f2f6';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2);
        ctx.stroke();

        // Rotating hub & spokes
        ctx.rotate(angle);
        ctx.fillStyle = '#ced6e0';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.58, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#57606f';
        ctx.lineWidth = 4;
        for (let i = 0; i < 5; i++) {
          const a = (i * Math.PI * 2) / 5;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55);
          ctx.stroke();
        }

        // Center hubcap
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.22, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Utility for rounded rectangles (safe across all browsers)
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      /* =========================================================================
       * 13. MAIN RENDER & ANIMATION LOOP
       * ========================================================================= */
      function render() {
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.translate(stageOffsetX, stageOffsetY);
        ctx.scale(stageScale, stageScale);

        // 1. Living scenic countryside background
        drawBackground(ctx);

        // 2. Stylized large syllable signboard in upper-center
        drawSyllableSign(ctx);

        // 3. Meadow characters sorted by Y for natural depth (excluding currently seated passenger)
        const standing = game.characters
          .filter((c) => !c.seated && c !== game.boarding.char)
          .sort((a, b) => a.y - b.y);
        for (const ch of standing) {
          drawCharacter(ctx, ch, false);
        }

        // 4. Convertible car (with seated passenger inside)
        drawConvertibleCar(ctx);

        // 5. Currently boarding character drawn in front so jumps/flips soar cleanly over the car!
        if (game.boarding.char) {
          // Optional tornado wind swirl lines when doing the tornado spin
          if (game.boarding.style === 'tornado') {
            drawTornadoSwirl(ctx, game.boarding.char.x, game.boarding.char.y - 50);
          }
          drawCharacter(ctx, game.boarding.char, false);
        }

        // 6. Celebration particles, bubbles, smoke rings, speed lines
        drawParticles(ctx);

        ctx.restore();
      }

      function drawTornadoSwirl(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        for (let i = 0; i < 4; i++) {
          const r = 24 + i * 16;
          const oy = 45 - i * 28;
          ctx.beginPath();
          ctx.ellipse(Math.sin(game.time * 22 + i) * 10, oy, r, 10, 0, 0.2, Math.PI * 1.45);
          ctx.stroke();
        }
        ctx.restore();
      }

      let lastTime = 0;
      function loop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
        lastTime = timestamp;

        updateGame(dt);
        render();
        requestAnimationFrame(loop);
      }

      // Initialize first wave and start animation loop on window load
      window.onload = function () {
        resizeCanvas();
        createWave();
        requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
