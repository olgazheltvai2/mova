<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎒</title>
<style>
  /* ================= ОСНОВНІ СТИЛІ ТА СКИДАННЯ ================= */
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #1a2634;
    font-family: sans-serif;
    touch-action: none;
  }

  /* Контейнер гри на весь екран */
  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* Шар живого фону (локації) */
  #scene-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    transition: filter 0.4s ease;
  }

  #scene-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ================= ВЕРХНЯ СТЕЖКА ПРОГРЕСУ (БЕЗ СЛІВ ТА ЦИФР) ================= */
  #progress-trail {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: linear-gradient(180deg, #5c3a21 0%, #3d2314 100%);
    border: 3px solid #8c5830;
    border-radius: 30px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.45), inset 0 2px 3px rgba(255,255,255,0.2);
  }

  .trail-stone {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #8a7f75, #4f4740);
    border: 2px solid #2e2722;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.3), 0 2px 4px rgba(0,0,0,0.5);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
  }

  /* Заповнена локація */
  .trail-stone.packed {
    background: radial-gradient(circle at 30% 30%, #76ff03, #2e7d32);
    border-color: #b9f6ca;
    box-shadow: 0 0 8px rgba(118, 255, 3, 0.6);
  }

  /* Поточна локація */
  .trail-stone.active {
    transform: scale(1.45);
    border-color: #ffd54f;
    box-shadow: 0 0 12px #ffab00;
  }

  /* Режим пригадування (золоте обрамлення стежки) */
  #progress-trail.recall-mode {
    background: linear-gradient(180deg, #4a2c6b 0%, #291540 100%);
    border-color: #ffd54f;
    box-shadow: 0 6px 20px rgba(255, 213, 79, 0.4), inset 0 2px 4px rgba(255,255,255,0.3);
  }

  /* ================= КНОПКИ НАВІГАЦІЇ (ДЕРЕВ'ЯНІ МЕДАЛЬЙОНИ) ================= */
  .nav-btn {
    position: absolute;
    top: 12px;
    z-index: 25;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
  }

  .nav-btn:hover {
    transform: scale(1.1);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.6)) brightness(1.08);
  }

  .nav-btn:active {
    transform: scale(0.92);
  }

  #btn-prev { left: 18px; }
  #btn-next { right: 18px; }
  #btn-restart { left: 88px; }

  /* ================= ЦЕНТРАЛЬНА ЗОНА: РЮКЗАК ТА ПЕРСОНАЖ ================= */
  #stage-center {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 185px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #Stage-inner {
    position: relative;
    width: 780px;
    height: 430px;
    max-width: 96vw;
    max-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Контейнер живого персонажа (Лисеня-мандрівник) */
  #character-wrap {
    position: absolute;
    left: 2%;
    bottom: 5%;
    width: 210px;
    height: 250px;
    z-index: 12;
    pointer-events: auto;
    cursor: pointer;
    transform-origin: bottom center;
    animation: charBreath 3.2s ease-in-out infinite;
    filter: drop-shadow(0 12px 14px rgba(0,0,0,0.45));
  }

  @keyframes charBreath {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(-4px) scaleY(1.02); }
  }

  #character-wrap.happy-jump {
    animation: charJump 0.65s cubic-bezier(0.28, 0.84, 0.42, 1) 2;
  }

  @keyframes charJump {
    0%, 100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
    20% { transform: translateY(8px) scale(1.08, 0.9) rotate(-4deg); }
    50% { transform: translateY(-38px) scale(0.95, 1.06) rotate(6deg); }
    80% { transform: translateY(4px) scale(1.04, 0.96) rotate(-2deg); }
  }

  #character-wrap.curious-tilt {
    animation: charTilt 2.4s ease-in-out infinite;
  }

  @keyframes charTilt {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-5px); }
  }

  /* Контейнер туристичного рюкзака */
  #backpack-wrap {
    position: relative;
    width: 390px;
    height: 390px;
    z-index: 11;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 16px 24px rgba(0,0,0,0.55));
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #backpack-wrap.pack-bounce {
    animation: packBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes packBounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.1, 0.92); }
    75% { transform: scale(0.96, 1.05); }
    100% { transform: scale(1); }
  }

  /* Закритий рюкзак у Фазі 2 (Пригадування) пульсує та запрошує клікнути */
  #backpack-wrap.recall-ready {
    cursor: pointer;
    animation: recallPulse 1.8s ease-in-out infinite;
  }

  @keyframes recallPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.04) rotate(-2deg); }
    50% { transform: scale(1.06) rotate(2deg); }
    75% { transform: scale(1.03) rotate(-1deg); }
  }

  /* Слоти всередині відкритого рюкзака (3 кишені) */
  #slots-container {
    position: absolute;
    top: 158px;
    left: 50%;
    transform: translateX(-50%);
    width: 286px;
    height: 110px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    z-index: 15;
  }

  .backpack-slot {
    width: 82px;
    height: 82px;
    border-radius: 20px;
    background: radial-gradient(circle, rgba(35, 22, 12, 0.78) 0%, rgba(18, 10, 5, 0.92) 100%);
    border: 3px dashed #d7a15c;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.8), 0 2px 6px rgba(255, 215, 140, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.25s ease;
  }

  .backpack-slot.highlight {
    border-color: #ffd54f;
    border-style: solid;
    background: radial-gradient(circle, rgba(255, 213, 79, 0.35) 0%, rgba(45, 28, 12, 0.9) 100%);
    transform: scale(1.1);
    box-shadow: 0 0 18px rgba(255, 213, 79, 0.75), inset 0 0 10px rgba(255, 213, 79, 0.4);
  }

  .backpack-slot.filled {
    border-style: solid;
    border-color: #ffb300;
    background: radial-gradient(circle, rgba(93, 64, 55, 0.85) 0%, rgba(39, 24, 15, 0.95) 100%);
    cursor: pointer;
  }

  .backpack-slot .slot-item-svg {
    width: 70px;
    height: 70px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    animation: popInSlot 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popInSlot {
    0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* ================= ЗОНА ВИЛЬОТУ ПРЕДМЕТІВ У ФАЗІ 2 (ПРИГАДУВАННЯ) ================= */
  #flying-recall-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
  }

  .recall-medallion {
    position: absolute;
    left: 50%;
    top: 58%;
    width: 134px;
    height: 134px;
    margin-left: -67px;
    margin-top: -67px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3e0 0%, #ffe0b2 55%, #ffb74d 100%);
    border: 6px solid #8d4e24;
    box-shadow: 0 14px 28px rgba(0,0,0,0.55), 0 0 25px rgba(255, 213, 79, 0.75), inset 0 3px 8px rgba(255,255,255,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translate(0, 0) scale(0.1);
    transition: transform 0.75s cubic-bezier(0.25, 1.4, 0.45, 1), opacity 0.35s ease;
  }

  .recall-medallion::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 2px dashed #b26a36;
    pointer-events: none;
  }

  .recall-medallion svg {
    width: 96px;
    height: 96px;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
  }

  .recall-medallion.fly-out-0 {
    opacity: 1;
    transform: translate(-185px, -170px) scale(1) rotate(-6deg);
    animation: floatMedallion0 3s ease-in-out 0.75s infinite;
  }
  .recall-medallion.fly-out-1 {
    opacity: 1;
    transform: translate(0px, -210px) scale(1.08) rotate(0deg);
    animation: floatMedallion1 3.2s ease-in-out 0.75s infinite;
  }
  .recall-medallion.fly-out-2 {
    opacity: 1;
    transform: translate(185px, -170px) scale(1) rotate(6deg);
    animation: floatMedallion2 2.8s ease-in-out 0.75s infinite;
  }

  @keyframes floatMedallion0 {
    0%, 100% { transform: translate(-185px, -170px) scale(1) rotate(-6deg); }
    50% { transform: translate(-185px, -184px) scale(1.03) rotate(-3deg); }
  }
  @keyframes floatMedallion1 {
    0%, 100% { transform: translate(0px, -210px) scale(1.08) rotate(0deg); }
    50% { transform: translate(0px, -225px) scale(1.11) rotate(2deg); }
  }
  @keyframes floatMedallion2 {
    0%, 100% { transform: translate(185px, -170px) scale(1) rotate(6deg); }
    50% { transform: translate(185px, -184px) scale(1.03) rotate(3deg); }
  }

  /* ================= НИЖНЯ ДЕРЕВ'ЯНА КОЛОДА З 12 ПРЕДМЕТАМИ ================= */
  #items-dock-wrapper {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1080px, 97vw);
    height: 172px;
    z-index: 20;
    transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
  }

  #items-dock-wrapper.hidden-dock {
    transform: translateX(-50%) translateY(220px);
    opacity: 0;
    pointer-events: none;
  }

  /* Текстурована дерев'яна дошка зі шкіряними ременями */
  #items-dock {
    position: relative;
    width: 100%;
    height: 100%;
    background: 
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 10px),
      linear-gradient(180deg, #794a28 0%, #593318 48%, #42240f 100%);
    border: 4px solid #9e6538;
    border-radius: 28px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.65), inset 0 3px 6px rgba(255, 220, 180, 0.28), inset 0 -6px 12px rgba(0,0,0,0.6);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px 12px;
    padding: 12px 24px;
    align-items: center;
    justify-items: center;
  }

  /* Декоративні металеві заклепки по кутах дошки */
  .dock-rivet {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd54f, #8d6e63);
    border: 2px solid #3e2723;
    box-shadow: 0 2px 3px rgba(0,0,0,0.6);
  }
  .dock-rivet.tl { top: 8px; left: 10px; }
  .dock-rivet.tr { top: 8px; right: 10px; }
  .dock-rivet.bl { bottom: 8px; left: 10px; }
  .dock-rivet.br { bottom: 8px; right: 10px; }

  /* Комірка предмета на дерев'яній дошці */
  .item-cell {
    width: 72px;
    height: 70px;
    border-radius: 18px;
    background: radial-gradient(circle at 50% 40%, #4e2c16 0%, #2e180a 100%);
    border: 2px solid #85522c;
    box-shadow: inset 0 4px 8px rgba(0,0,0,0.75), 0 1px 2px rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Сам перетягуваний предмет */
  .draggable-item {
    width: 66px;
    height: 66px;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 5px 6px rgba(0,0,0,0.5));
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    touch-action: none;
  }

  .draggable-item:hover {
    transform: scale(1.15) translateY(-4px);
  }

  .draggable-item.in-backpack {
    opacity: 0.18;
    pointer-events: none;
    transform: scale(0.8);
    filter: grayscale(0.8);
  }

  /* Копія предмета під час перетягування */
  #drag-avatar {
    position: fixed;
    width: 92px;
    height: 92px;
    pointer-events: none;
    z-index: 9999;
    display: none;
    filter: drop-shadow(0 16px 20px rgba(0,0,0,0.55));
    transform: translate(-50%, -50%) scale(1.15);
  }

  /* Canvas для яскравих частинок, листя, іскор та конфеті */
  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 40;
  }

  /* Адаптивність для невеликих екранів та планшетів */
  @media (max-width: 760px) {
    #character-wrap {
      width: 145px;
      height: 175px;
      left: 0%;
      bottom: 2%;
    }
    #backpack-wrap {
      width: 310px;
      height: 310px;
    }
    #slots-container {
      top: 125px;
      width: 230px;
      height: 85px;
    }
    .backpack-slot {
      width: 66px;
      height: 66px;
    }
    .backpack-slot .slot-item-svg {
      width: 56px;
      height: 56px;
    }
    .recall-medallion {
      width: 105px;
      height: 105px;
      margin-left: -52px;
      margin-top: -52px;
    }
    .recall-medallion.fly-out-0 { transform: translate(-120px, -135px) scale(0.95); }
    .recall-medallion.fly-out-1 { transform: translate(0px, -165px) scale(1); }
    .recall-medallion.fly-out-2 { transform: translate(120px, -135px) scale(0.95); }
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- Шар 1: Сюжетна анімована локація (10 деталізованих SVG-сцен) -->
  <div id="scene-layer"></div>

  <!-- Шар 2: Верхня стежка прогресу (10 камінців без цифр) -->
  <div id="progress-trail"></div>

  <!-- Шар 3: Кнопки навігації (Назад, Почати спочатку, Далі) -->
  <button id="btn-prev" class="nav-btn" aria-label="prev">
    <svg viewBox="0 0 64 64">
      <defs>
        <radialGradient id="woodBtn" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#a66c38"/>
          <stop offset="60%" stop-color="#6e4019"/>
          <stop offset="100%" stop-color="#42240c"/>
        </radialGradient>
        <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffe57f"/>
          <stop offset="50%" stop-color="#ffb300"/>
          <stop offset="100%" stop-color="#8d5500"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="29" fill="url(#woodBtn)" stroke="url(#goldRim)" stroke-width="4"/>
      <circle cx="32" cy="32" r="24" fill="none" stroke="#3b200c" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="M37 18 L21 32 L37 46 L37 38 L46 38 L46 26 L37 26 Z" fill="#ffe57f" stroke="#5c3300" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="btn-restart" class="nav-btn" aria-label="restart">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29" fill="url(#woodBtn)" stroke="url(#goldRim)" stroke-width="4"/>
      <circle cx="32" cy="32" r="24" fill="none" stroke="#3b200c" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="M32 16 A16 16 0 1 1 18 24" fill="none" stroke="#ffe57f" stroke-width="5.5" stroke-linecap="round"/>
      <polygon points="14,13 27,17 18,29" fill="#ffe57f" stroke="#5c3300" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="btn-next" class="nav-btn" aria-label="next">
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29" fill="url(#woodBtn)" stroke="url(#goldRim)" stroke-width="4"/>
      <circle cx="32" cy="32" r="24" fill="none" stroke="#3b200c" stroke-width="1.5" stroke-dasharray="4 3"/>
      <path d="M27 18 L43 32 L27 46 L27 38 L18 38 L18 26 L27 26 Z" fill="#ffe57f" stroke="#5c3300" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Шар 4: Центральна сцена (Живий Персонаж + Інтерактивний Рюкзак) -->
  <div id="stage-center">
    <div id="Stage-inner">
      <!-- Живий персонаж: Лисеня-мандрівник зі скаутською хустинкою -->
      <div id="character-wrap"></div>

      <!-- Туристичний рюкзак (відкритий у Фазі 1, закритий у Фазі 2) -->
      <div id="backpack-wrap">
        <div id="backpack-svg-holder" style="width:100%;height:100%;"></div>
        <!-- 3 слоти для предметів -->
        <div id="slots-container">
          <div class="backpack-slot" data-slot="0"></div>
          <div class="backpack-slot" data-slot="1"></div>
          <div class="backpack-slot" data-slot="2"></div>
        </div>
        <!-- Контейнер для вильоту 3 предметів одночасно у Фазі 2 -->
        <div id="flying-recall-container"></div>
      </div>
    </div>
  </div>

  <!-- Шар 5: Нижня дерев'яна колода з 12 предметами -->
  <div id="items-dock-wrapper">
    <div id="items-dock">
      <div class="dock-rivet tl"></div>
      <div class="dock-rivet tr"></div>
      <div class="dock-rivet bl"></div>
      <div class="dock-rivet br"></div>
      <!-- 12 комірок генеруються скриптом -->
    </div>
  </div>

  <!-- Перетягуваний аватар предмета -->
  <div id="drag-avatar"></div>

  <!-- Шар 6: Частинки святкування та спецефектів -->
  <canvas id="fx-canvas"></canvas>
</div>

<script>
/* ============================================================================
   1. АУДІО-СИНТЕЗАТОР (Web Audio API — активні звукові ефекти без зовнішніх файлів)
   ============================================================================ */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Звук взяття предмета
  playPickup() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(580, now + 0.11);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }

  // Звук укладання предмета в рюкзак
  playPackSlot(slotCount) {
    this.init();
    const now = this.ctx.currentTime;
    const baseFreq = [440, 554.37, 659.25][slotCount - 1] || 440;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(baseFreq * 0.75, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq, now + 0.09);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.25, now + 0.22);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.24);
  }

  // Звук повернення предмета на дошку
  playRemoveSlot() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(480, now);
    osc.frequency.exponentialRampToValueAtTime(240, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }

  // Святкова мелодія, коли всі 3 предмети зібрано в рюкзак
  playBackpackComplete() {
    this.init();
    const notes = [523.25, 659.25, 783.99, 1046.50, 987.77, 1046.50];
    const times = [0, 0.09, 0.18, 0.28, 0.40, 0.50];
    const durs  = [0.12, 0.12, 0.14, 0.15, 0.12, 0.42];

    notes.forEach((freq, idx) => {
      const now = this.ctx.currentTime + times[idx];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = idx === notes.length - 1 ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + durs[idx]);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + durs[idx]);
    });
  }

  // Ефект одночасного вильоту 3 предметів із рюкзака у Фазі 2
  playRecallPop() {
    this.init();
    const now = this.ctx.currentTime;
    // Шумовий сплеск відкриття клапана
    const bufferSize = this.ctx.sampleRate * 0.15;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(900, now);
    const nGain = this.ctx.createGain();
    nGain.gain.setValueAtTime(0.3, now);
    noise.connect(filter);
    filter.connect(nGain);
    nGain.connect(this.ctx.destination);
    noise.start(now);

    // Магічний акорд вильоту 3 предметів
    const chord = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    chord.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      const t = now + i * 0.045;
      osc.frequency.setValueAtTime(freq * 0.6, t);
      osc.frequency.exponentialRampToValueAtTime(freq, t + 0.14);
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.56);
    });
  }

  // Кумедний звук порожнього рюкзака (якщо рівень було пропущено без вибору)
  playEmptyBoing() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(190, now);
    osc.frequency.exponentialRampToValueAtTime(340, now + 0.12);
    osc.frequency.exponentialRampToValueAtTime(150, now + 0.35);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.36);
  }

  // Звук перемикання рівня
  playStepSwitch() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(380, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.09);
  }

}

/* ============================================================================
   5. РЕАЛІСТИЧНИЙ ТУРИСТИЧНИЙ РЮКЗАК (Відкритий у Фазі 1 / Закритий у Фазі 2)

function getBackpackSVG(isOpen = true) {

    <!-- Бічні кишені рюкзака -->
    <rect x="28" y="175" width="48" height="125" rx="22" fill="url(#packPocket)" stroke="#0f3312" stroke-width="3"/>
    <rect x="304" y="175" width="48" height="125" rx="22" fill="url(#packPocket)" stroke="#0f3312" stroke-width="3"/>
    <rect x="26" y="215" width="48" height="14" rx="5" fill="url(#packLeather)"/>
    <rect x="306" y="215" width="48" height="14" rx="5" fill="url(#packLeather)"/>

    <!-- Основний корпус рюкзака -->

      <!-- ВІДКРИТИЙ РЮКЗАК (Фаза 1): Відкинутий вгору клапан та глибока внутрішня частина -->
      <path d="M78,92 C78,34 302,34 302,92 L292,130 Q190,115 88,130 Z" fill="url(#packLeather)" stroke="#331704" stroke-width="3"/>
      <path d="M88,88 C88,46 292,46 292,88" fill="none" stroke="#ffe0b2" stroke-width="2" stroke-dasharray="5 5"/>
      <!-- Темний отвір всередину рюкзака під 3 слоти -->
      <rect x="40" y="138" width="300" height="142" rx="28" fill="#26160c" stroke="#8d5524" stroke-width="5"/>

      <rect x="82" y="195" width="216" height="105" rx="22" fill="url(#packPocket)" stroke="#0f3312" stroke-width="3"/>
      <!-- Складний верхній клапан опущений донизу -->

      <path d="M78,96 L290,96 M86,208 Q190,235 294,208" fill="none" stroke="#ffe0b2" stroke-width="2" stroke-dasharray="6 5"/>
      <!-- Емблема компаса в центрі клапана -->

      <!-- Два вертикальні шкіряні ремені з пряжками -->
      <rect x="116" y="145" width="22" height="150" rx="6" fill="url(#packLeather)" stroke="#2e1303" stroke-width="2.5"/>

      <rect x="112" y="225" width="30" height="24" rx="5" fill="none" stroke="#ffd54f" stroke-width="5"/>

/* ============================================================================
   6. СИСТЕМА ЧАСТИНОК ТА ФЕЄРВЕРКІВ (Canvas FX)
   ============================================================================ */
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function spawnBurst(x, y, count = 42, mode = 'celebrate') {
  const colors = mode === 'dust'
    ? ['#d7ccc8', '#bcaaa4', '#efebe9', '#a1887f']
    : ['#ffd54f', '#ff6e40', '#69f0ae', '#40c4ff', '#ea80fc', '#fff59d'];

  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
    const speed = 3 + Math.random() * 9;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (mode === 'celebrate' ? 3 : 1),
      size: 6 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.2,
      shape: mode === 'dust' ? 'circle' : (i % 2 === 0 ? 'star' : 'circle')
    });
  }
}

function animateParticles() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.22; // гравітація
    p.alpha -= 0.017;
    p.rot += p.vRot;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, p.alpha);
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.color;

    if (p.shape === 'star') {
      fxCtx.beginPath();
      for (let j = 0; j < 5; j++) {
        const a1 = (j * 2 * Math.PI) / 5 - Math.PI / 2;
        const a2 = a1 + Math.PI / 5;
        fxCtx.lineTo(Math.cos(a1) * p.size, Math.sin(a1) * p.size);
        fxCtx.lineTo(Math.cos(a2) * (p.size * 0.45), Math.sin(a2) * (p.size * 0.45));
      }
      fxCtx.closePath();
      fxCtx.fill();
    } else {
      fxCtx.beginPath();
      fxCtx.arc(0, 0, p.size * 0.65, 0, Math.PI * 2);
      fxCtx.fill();
    }
    fxCtx.restore();
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* ============================================================================
   7. СТАН ГРИ ТА ОСНОВНА МЕХАНІКА (20 КРОКІВ: 10 ЗБОРІВ + 10 ПРИГАДУВАНЬ)
   ============================================================================ */
// currentStep: від 0 до 9 — Фаза 1 (Збираємо рюкзак на 10 локаціях)
// currentStep: від 10 до 19 — Фаза 2 (Пригадуємо, що поклали на цих же 10 локаціях)
let currentStep = 0;

// Для кожної з 10 локацій зберігаємо масив із 3 вибраних предметів: [id0, id1, id2]
let savedChoices = Array.from({ length: 10 }, () => [null, null, null]);

// Стан вильоту предметів у Фазі 2 для поточної локації
let recallRevealed = false;

const sceneLayer = document.getElementById('scene-layer');
const progressTrail = document.getElementById('progress-trail');
const characterWrap = document.getElementById('character-wrap');
const backpackWrap = document.getElementById('backpack-wrap');
const backpackSvgHolder = document.getElementById('backpack-svg-holder');
const slotsContainer = document.getElementById('slots-container');
const flyingRecallContainer = document.getElementById('flying-recall-container');
const itemsDockWrapper = document.getElementById('items-dock-wrapper');
const itemsDock = document.getElementById('items-dock');
const dragAvatar = document.getElementById('drag-avatar');

// Ініціалізація верхньої стежки з 10 камінців
function initProgressTrail() {
  progressTrail.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const stone = document.createElement('div');
    stone.className = 'trail-stone';
    stone.addEventListener('click', () => {
      sound.playStepSwitch();
      const isRecallPhase = currentStep >= 10;
      currentStep = isRecallPhase ? 10 + i : i;
      renderCurrentStep();
    });
    progressTrail.appendChild(stone);
  }
}

// Ініціалізація нижньої дошки з 12 предметами
function initItemsDock() {
  // Видаляємо старі комірки, залишаючи заклепки
  itemsDock.querySelectorAll('.item-cell').forEach(el => el.remove());

  ITEMS_DATA.forEach(item => {
    const cell = document.createElement('div');
    cell.className = 'item-cell';

    const dragEl = document.createElement('div');
    dragEl.className = 'draggable-item';
    dragEl.dataset.id = item.id;
    dragEl.innerHTML = item.svg;

    // Підтримка перетягування (Pointer Events для миші та сенсорного екрана)
    dragEl.addEventListener('pointerdown', e => startDragItem(e, item));

    cell.appendChild(dragEl);
    itemsDock.appendChild(cell);
  });
}

// Відображення поточного кроку (Фаза 1 або Фаза 2)
function renderCurrentStep() {
  const locIdx = currentStep % 10;
  const isRecallPhase = currentStep >= 10;
  recallRevealed = false;
  flyingRecallContainer.innerHTML = '';

  // 1. Оновлюємо сюжетний фон локації
  sceneLayer.innerHTML = LOCATIONS_SVG[locIdx];

  // 2. Оновлюємо камінці прогресу зверху
  progressTrail.classList.toggle('recall-mode', isRecallPhase);
  const stones = progressTrail.querySelectorAll('.trail-stone');
  stones.forEach((st, idx) => {
    const count = savedChoices[idx].filter(Boolean).length;
    st.classList.toggle('packed', count === 3);
    st.classList.toggle('active', idx === locIdx);
  });

  // 3. Налаштовуємо режим Фази 1 (Збір) або Фази 2 (Пригадування)
  if (!isRecallPhase) {
    // ФАЗА 1: Відкритий рюкзак, видима панель із 12 предметами
    itemsDockWrapper.classList.remove('hidden-dock');
    slotsContainer.style.display = 'flex';
    backpackWrap.classList.remove('recall-ready');
    backpackSvgHolder.innerHTML = getBackpackSVG(true);

    const packedCount = savedChoices[locIdx].filter(Boolean).length;
    setCharacterEmotion(packedCount === 3 ? 'happy' : 'normal');

    renderSlotsAndDock(locIdx);
  } else {
    // ФАЗА 2: Пригадування — панель предметів схована, рюкзак закритий
    itemsDockWrapper.classList.add('hidden-dock');
    slotsContainer.style.display = 'none';
    backpackWrap.classList.add('recall-ready');
    backpackSvgHolder.innerHTML = getBackpackSVG(false);
    setCharacterEmotion('curious');
  }
}

// Оновлення вмісту 3 слотів рюкзака та стану предметів на дошці
function renderSlotsAndDock(locIdx) {
  const currentSlots = savedChoices[locIdx];
  const slotEls = slotsContainer.querySelectorAll('.backpack-slot');

  slotEls.forEach((slotEl, sIdx) => {
    const itemId = currentSlots[sIdx];
    slotEl.innerHTML = '';
    if (itemId) {
      const itemObj = ITEMS_DATA.find(it => it.id === itemId);
      slotEl.classList.add('filled');
      const wrap = document.createElement('div');
      wrap.className = 'slot-item-svg';
      wrap.innerHTML = itemObj.svg;
      slotEl.appendChild(wrap);

      // Клік по слоту повертає предмет назад на дерев'яну дошку
      slotEl.onclick = (e) => {
        e.stopPropagation();
        currentSlots[sIdx] = null;
        sound.playRemoveSlot();
        setCharacterEmotion('normal');
        renderSlotsAndDock(locIdx);
        updateStoneStatus(locIdx);
      };
    } else {
      slotEl.classList.remove('filled');
      slotEl.onclick = null;
    }
  });

  // Відмічаємо предмети на нижній дошці, які вже лежать у рюкзаку
  const dockItems = itemsDock.querySelectorAll('.draggable-item');
  dockItems.forEach(dEl => {
    const inPack = currentSlots.includes(dEl.dataset.id);
    dEl.classList.toggle('in-backpack', inPack);
  });
}

function updateStoneStatus(locIdx) {
  const stones = progressTrail.querySelectorAll('.trail-stone');
  const count = savedChoices[locIdx].filter(Boolean).length;
  if (stones[locIdx]) {
    stones[locIdx].classList.toggle('packed', count === 3);
  }
}

function setCharacterEmotion(emotion) {
  characterWrap.innerHTML = getCharacterSVG(emotion);
  characterWrap.classList.remove('happy-jump', 'curious-tilt');
  if (emotion === 'happy') {
    void characterWrap.offsetWidth;
    characterWrap.classList.add('happy-jump');
  } else if (emotion === 'curious') {
    characterWrap.classList.add('curious-tilt');
  }
}

// Клік по лисеняті завжди викликає живу реакцію
characterWrap.addEventListener('click', () => {
  sound.playPickup();
  setCharacterEmotion('happy');
});

/* ============================================================================
   8. ПЕРЕТЯГУВАННЯ ПРЕДМЕТІВ У РЮКЗАК (Drag & Drop + Сенсорний екран)
   ============================================================================ */
let draggingItem = null;

function startDragItem(e, item) {
  if (currentStep >= 10) return; // У фазі пригадування перетягування вимкнено
  const locIdx = currentStep % 10;
  if (savedChoices[locIdx].includes(item.id)) return;

  e.preventDefault();
  sound.playPickup();
  draggingItem = item;

  dragAvatar.innerHTML = item.svg;
  dragAvatar.style.display = 'block';
  moveDragAvatar(e.clientX, e.clientY);

  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
}

function moveDragAvatar(x, y) {
  dragAvatar.style.left = x + 'px';
  dragAvatar.style.top = y + 'px';
}

function onPointerMove(e) {
  if (!draggingItem) return;
  moveDragAvatar(e.clientX, e.clientY);

  // Підсвічуємо слоти рюкзака при наведенні
  const slotEls = slotsContainer.querySelectorAll('.backpack-slot');
  slotEls.forEach(slotEl => {
    const rect = slotEl.getBoundingClientRect();
    const isInside = e.clientX >= rect.left - 18 && e.clientX <= rect.right + 18 &&
                     e.clientY >= rect.top - 18 && e.clientY <= rect.bottom + 18;
    slotEl.classList.toggle('highlight', isInside);
  });
}

function onPointerUp(e) {
  if (!draggingItem) return;

  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerUp);

  dragAvatar.style.display = 'none';
  const slotEls = slotsContainer.querySelectorAll('.backpack-slot');
  slotEls.forEach(s => s.classList.remove('highlight'));

  const locIdx = currentStep % 10;
  const currentSlots = savedChoices[locIdx];

  // Перевіряємо, чи відпустили над конкретним слотом або над усім рюкзаком
  let targetSlotIdx = -1;
  slotEls.forEach((slotEl, idx) => {
    const rect = slotEl.getBoundingClientRect();
    if (e.clientX >= rect.left - 20 && e.clientX <= rect.right + 20 &&
        e.clientY >= rect.top - 20 && e.clientY <= rect.bottom + 20) {
      targetSlotIdx = idx;
    }
  });

  // Якщо кинули просто на площу рюкзака — знаходимо перший вільний слот
  if (targetSlotIdx === -1) {
    const packRect = backpackWrap.getBoundingClientRect();
    const overBackpack = e.clientX >= packRect.left && e.clientX <= packRect.right &&
                         e.clientY >= packRect.top && e.clientY <= packRect.bottom;
    if (overBackpack) {
      targetSlotIdx = currentSlots.findIndex(val => val === null);
    }
  }

  // Якщо слот знайдено (або заміна предмета в зайнятому слоті)
  if (targetSlotIdx !== -1) {
    currentSlots[targetSlotIdx] = draggingItem.id;
    const packedCount = currentSlots.filter(Boolean).length;

    // Анімація пружного рюкзака
    backpackWrap.classList.remove('pack-bounce');
    void backpackWrap.offsetWidth;
    backpackWrap.classList.add('pack-bounce');

    renderSlotsAndDock(locIdx);
    updateStoneStatus(locIdx);

    const packRect = backpackWrap.getBoundingClientRect();
    const centerX = packRect.left + packRect.width / 2;
    const centerY = packRect.top + packRect.height / 2;

    if (packedCount === 3) {
      // Всі 3 предмети в рюкзаку — яскравий фідбек!
      sound.playBackpackComplete();
      spawnBurst(centerX, centerY, 55, 'celebrate');
      setCharacterEmotion('happy');
    } else {
      sound.playPackSlot(packedCount);
      spawnBurst(e.clientX, e.clientY, 18, 'celebrate');
    }
  }

  draggingItem = null;
}

/* ============================================================================
   9. ФАЗА 2 (ПРИГАДУВАННЯ): ОДНОЧАСНИЙ ВИЛІТ 3 ЗБЕРЕЖЕНИХ ПРЕДМЕТІВ ПО КЛІКУ
   ============================================================================ */
backpackWrap.addEventListener('click', () => {
  if (currentStep < 10) return; // Працює тільки у Фазі 2 (Пригадування)

  const locIdx = currentStep % 10;
  const chosenItems = savedChoices[locIdx].filter(Boolean);
  const packRect = backpackWrap.getBoundingClientRect();
  const centerX = packRect.left + packRect.width / 2;
  const centerY = packRect.top + packRect.height / 2;

  // Якщо предмети вже вилетіли — повторний клік ховає їх назад у рюкзак
  if (recallRevealed) {
    recallRevealed = false;
    sound.playStepSwitch();
    backpackSvgHolder.innerHTML = getBackpackSVG(false);
    flyingRecallContainer.innerHTML = '';
    setCharacterEmotion('curious');
    return;
  }

  recallRevealed = true;
  // Відкриваємо клапан рюкзака
  backpackSvgHolder.innerHTML = getBackpackSVG(true);
  backpackWrap.classList.remove('pack-bounce');
  void backpackWrap.offsetWidth;
  backpackWrap.classList.add('pack-bounce');

  if (chosenItems.length === 0) {
    // Якщо в цій локації нічого не клали — кумедний звук та хмаринка пилу
    sound.playEmptyBoing();
    spawnBurst(centerX, centerY - 30, 28, 'dust');
    return;
  }

  // Звук тріумфального відкриття та феєрверк
  sound.playRecallPop();
  spawnBurst(centerX, centerY - 40, 50, 'celebrate');
  setCharacterEmotion('happy');

  // Створюємо медальйони з тими самими предметами, які дитина поклала
  flyingRecallContainer.innerHTML = '';
  chosenItems.forEach((itemId, idx) => {
    const itemObj = ITEMS_DATA.find(it => it.id === itemId);
    if (!itemObj) return;

    const medal = document.createElement('div');
    medal.className = 'recall-medallion';
    medal.innerHTML = itemObj.svg;
    flyingRecallContainer.appendChild(medal);

    // Запускаємо одночасний розліт трьох предметів по дузі
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        medal.classList.add(`fly-out-${idx}`);
      });
    });
  });
});

/* ============================================================================
   10. КНОПКИ НАВІГАЦІЇ («НАЗАД», «ДАЛІ», «ПОЧАТИ СПОЧАТКУ»)
   ============================================================================ */
document.getElementById('btn-next').addEventListener('click', () => {
  sound.playStepSwitch();
  // Після 10 локацій збору (0..9) переходимо на 10 локацій пригадування (10..19)
  currentStep = (currentStep + 1) % 20;
  renderCurrentStep();
});

document.getElementById('btn-prev').addEventListener('click', () => {
  sound.playStepSwitch();
  currentStep = (currentStep - 1 + 20) % 20;
  renderCurrentStep();
});

document.getElementById('btn-restart').addEventListener('click', () => {
  sound.playBackpackComplete();
  // Очищаємо всі збережені предмети та повертаємось на 1-шу локацію
  savedChoices = Array.from({ length: 10 }, () => [null, null, null]);
  currentStep = 0;
  renderCurrentStep();
  spawnBurst(window.innerWidth / 2, window.innerHeight / 2, 45, 'celebrate');
});

// Запуск гри при завантаженні
initProgressTrail();
initItemsDock();
renderCurrentStep();
</script>
