<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лісова граматика</title>
<style>
  /* ================= ОСНОВНІ СТИЛІ ТА СКИДАННЯ ================= */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', 'Palatino Linotype', serif;
    background: #070d0c;
  }

  /* Контейнер усієї сцени */
  #game-scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* Фоновий SVG на весь екран */
  #forest-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  /* Анімація лісового туману */
  .mist-layer {
    animation: mistFloat 18s ease-in-out infinite alternate;
  }
  .mist-layer-2 {
    animation: mistFloat2 24s ease-in-out infinite alternate;
  }
  @keyframes mistFloat {
    0% { transform: translateX(-35px) translateY(0px); opacity: 0.45; }
    100% { transform: translateX(35px) translateY(-8px); opacity: 0.7; }
  }
  @keyframes mistFloat2 {
    0% { transform: translateX(40px) translateY(5px); opacity: 0.35; }
    100% { transform: translateX(-40px) translateY(-5px); opacity: 0.6; }
  }

  /* ================= ЛІВА ПАНЕЛЬ ЗАВДАННЯ (РІЗЬБЛЕНА КОРА ДУБА) ================= */
  #task-panel {
    position: absolute;
    left: 3.5%;
    top: 52%;
    transform: translateY(-50%);
    width: min(460px, 42vw);
    z-index: 10;
    filter: drop-shadow(0 22px 32px rgba(0, 0, 0, 0.85));
  }

  /* Внутрішній контейнер рядків зі словами поверх SVG-дошки */
  #words-container {
    position: absolute;
    top: 13%;
    left: 11%;
    right: 11%;
    bottom: 23%;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
  }

  /* Рядок одного відмінка */
  .case-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(28, 16, 8, 0.82) 0%, rgba(46, 27, 13, 0.9) 100%);
    border: 2px solid #6e4720;
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,0.85),
      0 2px 4px rgba(255, 205, 120, 0.15);
    transition: transform 0.25s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .case-row:hover {
    transform: scale(1.015);
    border-color: #9e6b30;
  }

  /* Мітка відмінка (Н. в., Р. в., З. в., М. в.) */
  .case-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(1.25rem, 2.1vw, 1.8rem);
    font-weight: 900;
    color: #7ee856;
    text-shadow: 0 2px 4px #000, 0 0 12px rgba(126, 232, 86, 0.45);
    min-width: 34%;
  }

  /* Декоративний лісовий камінець біля відмінка */
  .rune-gem {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }

  /* Основа слова + поле вводу закінчення */
  .word-group {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex: 1;
  }

  .word-stem {
    font-size: clamp(1.4rem, 2.5vw, 2.15rem);
    font-weight: bold;
    color: #ffefd0;
    text-shadow: 0 3px 5px rgba(0, 0, 0, 0.95), 0 0 8px rgba(255, 195, 100, 0.3);
    letter-spacing: 1px;
    padding-right: 4px;
  }

  /* Стилізоване бурштинове віконце для закінчення (жодних білих прямокутників!) */
  .ending-input {
    width: clamp(54px, 5vw, 70px);
    height: clamp(46px, 4.8vw, 62px);
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: clamp(1.4rem, 2.5vw, 2.15rem);
    font-weight: bold;
    color: #fff6d6;
    background: radial-gradient(circle at 30% 25%, #613b16 0%, #2f1907 70%, #1c0e03 100%);
    border: 2.5px solid #c88a32;
    border-radius: 14px;
    box-shadow:
      inset 0 4px 10px rgba(0, 0, 0, 0.9),
      inset 0 0 12px rgba(245, 170, 45, 0.25),
      0 3px 8px rgba(0, 0, 0, 0.7);
    outline: none;
    transition: all 0.25s ease;
    caret-color: #ffcf56;
  }

  .ending-input:focus {
    border-color: #ffdf6b;
    background: radial-gradient(circle at 30% 25%, #7d4b18 0%, #3d2008 75%, #241103 100%);
    box-shadow:
      inset 0 3px 8px rgba(0, 0, 0, 0.8),
      0 0 16px rgba(255, 206, 75, 0.75);
    transform: scale(1.06);
  }

  /* Стан правильного поля */
  .ending-input.correct-field {
    border-color: #65f042;
    background: radial-gradient(circle at 30% 25%, #2b5e19 0%, #143309 80%);
    box-shadow: 0 0 18px rgba(101, 240, 66, 0.8), inset 0 0 10px rgba(101, 240, 66, 0.4);
    color: #e4ffd9;
  }

  /* Стан помилкового поля */
  .ending-input.wrong-field {
    border-color: #ff3b1f;
    background: radial-gradient(circle at 30% 25%, #731818 0%, #380707 80%);
    box-shadow: 0 0 20px rgba(255, 59, 31, 0.9), inset 0 0 12px rgba(255, 59, 31, 0.5);
    animation: shakeField 0.45s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes shakeField {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px) rotate(-3deg); }
    40% { transform: translateX(9px) rotate(3deg); }
    60% { transform: translateX(-7px) rotate(-2deg); }
    80% { transform: translateX(7px) rotate(2deg); }
  }

  /* Кнопка "Перевірити" */
  #check-btn-wrap {
    position: absolute;
    bottom: 6.5%;
    left: 50%;
    transform: translateX(-50%);
    width: 68%;
    height: 12%;
  }

  #check-btn {
    width: 100%;
    height: 100%;
    cursor: pointer;
    border: none;
    border-radius: 30px;
    background: linear-gradient(180deg, #e09626 0%, #9c5509 55%, #633102 100%);
    border: 3px solid #ffcf70;
    box-shadow:
      0 8px 18px rgba(0, 0, 0, 0.85),
      inset 0 3px 6px rgba(255, 240, 185, 0.65),
      inset 0 -4px 8px rgba(45, 18, 0, 0.85);
    color: #fff8e3;
    font-family: 'Georgia', serif;
    font-size: clamp(1.15rem, 1.9vw, 1.6rem);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
    transition: transform 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
  }

  #check-btn:hover {
    filter: brightness(1.14);
    transform: translateY(-2px);
    box-shadow:
      0 10px 22px rgba(0, 0, 0, 0.9),
      0 0 18px rgba(255, 190, 65, 0.55),
      inset 0 3px 6px rgba(255, 240, 185, 0.75);
  }

  #check-btn:active {
    transform: translateY(3px);
  }

  /* ================= МІНІМАЛІСТИЧНІ КНОПКИ НАВІГАЦІЇ (НАЗАД / ДАЛІ) ================= */
  #nav-controls {
    position: absolute;
    top: 20px;
    left: 3.5%;
    display: flex;
    gap: 16px;
    z-index: 25;
  }

  .nav-rune-btn {
    width: 58px;
    height: 58px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.8));
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .nav-rune-btn:hover {
    transform: scale(1.12);
    filter: drop-shadow(0 0 14px rgba(255, 200, 80, 0.75));
  }

  .nav-rune-btn:active {
    transform: scale(0.94);
  }

  /* ================= ПРАВА СЦЕНА: БАБА ЯГА, КОТЕЛ І ПЕРЕТВОРЕННЯ ================= */
  #character-stage {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 58vw;
    height: 98vh;
    z-index: 8;
    pointer-events: none;
  }

  /* Живе дихання тіла Баби Яги у спокої */
  #baba-yaga-body {
    transform-origin: 480px 580px;
    animation: yagaIdle 3.4s ease-in-out infinite;
  }

  @keyframes yagaIdle {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(0.6deg); }
  }

  /* Повільне помішування паличкою прямо всередині зеленої жижі у спокої */
  #yaga-stirring-assembly {
    transform-origin: 410px 395px;
    animation: stirInPotionIdle 2.8s ease-in-out infinite;
  }

  /* Смарагдовий вир на поверхні жижі рухається синхронно з паличкою */
  #potion-swirl-group {
    animation: swirlFollowIdle 2.8s ease-in-out infinite;
  }

  @keyframes stirInPotionIdle {
    0%, 100% { transform: rotate(-3.5deg) translateX(-10px) translateY(2px); }
    50% { transform: rotate(4.5deg) translateX(14px) translateY(-3px); }
  }

  @keyframes swirlFollowIdle {
    0%, 100% { transform: translateX(-16px) scaleX(0.95); }
    50% { transform: translateX(20px) scaleX(1.08); }
  }

  /* Анімація переляку Баби Яги перед вибухом */
  .yaga-scared #baba-yaga-body,
  .yaga-scared #yaga-stirring-assembly {
    animation: yagaPanic 0.12s ease-in-out infinite !important;
  }
  @keyframes yagaPanic {
    0% { transform: translate(-5px, -12px) scale(1.03) rotate(-2deg); }
    50% { transform: translate(5px, -16px) scale(1.05) rotate(2deg); }
    100% { transform: translate(-5px, -12px) scale(1.03) rotate(-2deg); }
  }

  /* Анімація зловісного сміху та інтенсивного колотіння зілля при помилці */
  .yaga-laughing #baba-yaga-body {
    animation: yagaCackle 0.22s ease-in-out infinite !important;
  }
  .yaga-laughing #yaga-stirring-assembly {
    animation: stirInPotionFast 0.26s ease-in-out infinite !important;
  }
  .yaga-laughing #potion-swirl-group {
    animation: swirlFollowFast 0.26s ease-in-out infinite !important;
  }
  .yaga-laughing #yaga-right-arm {
    transform-origin: 545px 385px;
    animation: rightArmLaugh 0.26s ease-in-out infinite !important;
  }

  @keyframes yagaCackle {
    0%, 100% { transform: translateY(0) rotate(-2.5deg) scale(1.02); }
    50% { transform: translateY(-14px) rotate(3deg) scale(1.05); }
  }

  @keyframes stirInPotionFast {
    0%, 100% { transform: rotate(-9deg) translateX(-24px) translateY(5px); }
    50% { transform: rotate(11deg) translateX(28px) translateY(-6px); }
  }

  @keyframes swirlFollowFast {
    0%, 100% { transform: translateX(-38px) scale(1.18); }
    50% { transform: translateX(42px) scale(1.25); }
  }

  @keyframes rightArmLaugh {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-24deg) translateY(-12px); }
  }

  /* Анімація полум'я під котлом */
  .flame-1 {
    transform-origin: 240px 760px;
    animation: flicker1 0.45s ease-in-out infinite alternate;
  }
  .flame-2 {
    transform-origin: 240px 760px;
    animation: flicker2 0.32s ease-in-out infinite alternate;
  }
  @keyframes flicker1 {
    0% { transform: scaleY(0.92) scaleX(1.04) skewX(-3deg); }
    100% { transform: scaleY(1.12) scaleX(0.95) skewX(4deg); }
  }
  @keyframes flicker2 {
    0% { transform: scaleY(1.08) scaleX(0.92) skewX(5deg); }
    100% { transform: scaleY(0.88) scaleX(1.06) skewX(-4deg); }
  }

  /* Анімація перетвореного об'єкта (розташованого правіше, центр X=585, Y=555) */
  #transformed-container {
    transform-origin: 585px 555px;
  }
  .transformed-pop {
    animation: popBounce 0.75s cubic-bezier(0.22, 1.45, 0.48, 1) forwards,
               floatTransformed 2.5s ease-in-out 0.75s infinite alternate;
  }
  @keyframes popBounce {
    0% { transform: scale(0.05) rotate(-18deg); opacity: 0; }
    60% { transform: scale(1.14) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes floatTransformed {
    0% { transform: translateY(0px) rotate(-1.5deg); }
    100% { transform: translateY(-12px) rotate(1.8deg); }
  }

  /* Анімація об'ємного облачка вибуху */
  .cloud-puff-main {
    transform-origin: 585px 525px;
    animation: cloudExplodeMain 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .cloud-puff-inner {
    transform-origin: 585px 525px;
    animation: cloudExplodeInner 0.95s ease-out forwards;
  }
  .cloud-shockwave {
    transform-origin: 585px 525px;
    animation: shockwaveExpand 0.85s ease-out forwards;
  }

  @keyframes cloudExplodeMain {
    0% { transform: scale(0.12) rotate(-12deg); opacity: 1; }
    35% { transform: scale(1.18) rotate(4deg); opacity: 1; }
    70% { transform: scale(1.32) rotate(8deg); opacity: 0.85; }
    100% { transform: scale(1.55) rotate(12deg); opacity: 0; }
  }

  @keyframes cloudExplodeInner {
    0% { transform: scale(0.1); opacity: 1; }
    30% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  @keyframes shockwaveExpand {
    0% { transform: scale(0.2); opacity: 1; stroke-width: 18px; }
    100% { transform: scale(1.75); opacity: 0; stroke-width: 2px; }
  }
</style>
</head>
<body>

<div id="game-scene">

  <!-- ================= НАВІГАЦІЙНІ КНОПКИ (НАЗАД І ДАЛІ БЕЗ ЗАЙВИХ СЛІВ) ================= -->
  <div id="nav-controls">
    <!-- Кнопка "Назад" (попередній рівень) -->
    <button class="nav-rune-btn" id="prev-btn" aria-label="Попередній рівень">
      <svg viewBox="0 0 80 80" width="100%" height="100%">
        <defs>
          <radialGradient id="woodBtnGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#8f5b28"/>
            <stop offset="65%" stop-color="#4f2d0f"/>
            <stop offset="100%" stop-color="#291505"/>
          </radialGradient>
          <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe28a"/>
            <stop offset="50%" stop-color="#b87b1e"/>
            <stop offset="100%" stop-color="#5e3805"/>
          </linearGradient>
        </defs>
        <polygon points="40,4 70,18 76,48 56,74 24,74 4,48 10,18" fill="url(#woodBtnGrad)" stroke="url(#goldRim)" stroke-width="4"/>
        <polygon points="40,10 64,22 69,46 52,68 28,68 11,46 16,22" fill="none" stroke="#3b2009" stroke-width="1.5"/>
        <path d="M48,24 L26,40 L48,56 L42,40 Z" fill="#ffdf78" stroke="#4a2600" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Кнопка "Далі" (одразу перехід на наступне завдання) -->
    <button class="nav-rune-btn" id="next-btn" aria-label="Наступний рівень">
      <svg viewBox="0 0 80 80" width="100%" height="100%">
        <polygon points="40,4 70,18 76,48 56,74 24,74 4,48 10,18" fill="url(#woodBtnGrad)" stroke="url(#goldRim)" stroke-width="4"/>
        <polygon points="40,10 64,22 69,46 52,68 28,68 11,46 16,22" fill="none" stroke="#3b2009" stroke-width="1.5"/>
        <path d="M32,24 L54,40 L32,56 L38,40 Z" fill="#ffdf78" stroke="#4a2600" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- ================= ДЕТАЛІЗОВАНИЙ СЮЖЕТНИЙ ФОН КАЗКОВОГО ЛІСУ (SVG) ================= -->
  <svg id="forest-bg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнт нічного лісового неба -->
      <radialGradient id="nightSky" cx="72%" cy="22%" r="85%">
        <stop offset="0%" stop-color="#294a4c"/>
        <stop offset="35%" stop-color="#13282e"/>
        <stop offset="70%" stop-color="#09141a"/>
        <stop offset="100%" stop-color="#04080b"/>
      </radialGradient>

      <!-- Сяйво повного місяця -->
      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff8d6" stop-opacity="1"/>
        <stop offset="40%" stop-color="#ffe89e" stop-opacity="0.65"/>
        <stop offset="75%" stop-color="#76b8a5" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#76b8a5" stop-opacity="0"/>
      </radialGradient>

      <!-- Текстура кори дерева -->
      <linearGradient id="barkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0d0805"/>
        <stop offset="30%" stop-color="#26170e"/>
        <stop offset="65%" stop-color="#3b2416"/>
        <stop offset="90%" stop-color="#1c1009"/>
        <stop offset="100%" stop-color="#0a0604"/>
      </linearGradient>

      <!-- Градієнт болотного туману -->
      <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4e8c7a" stop-opacity="0"/>
        <stop offset="50%" stop-color="#58a38c" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#1b3b34" stop-opacity="0"/>
      </linearGradient>

      <!-- Градієнт моху та галявини -->
      <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#172e1c"/>
        <stop offset="45%" stop-color="#0f2114"/>
        <stop offset="100%" stop-color="#050b07"/>
      </linearGradient>

      <!-- Градієнт шапки мухомора -->
      <radialGradient id="agaricCap" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ff4b38"/>
        <stop offset="60%" stop-color="#b81409"/>
        <stop offset="100%" stop-color="#5c0602"/>
      </radialGradient>
    </defs>

    <!-- Небо -->
    <rect width="1920" height="1080" fill="url(#nightSky)"/>

    <!-- Зорі на небі -->
    <g fill="#fff9d2" opacity="0.75">
      <circle cx="210" cy="120" r="1.8"/>
      <circle cx="480" cy="85" r="2.4"/>
      <circle cx="650" cy="190" r="1.5"/>
      <circle cx="920" cy="95" r="2.2"/>
      <circle cx="1140" cy="150" r="1.6"/>
      <circle cx="1650" cy="110" r="2.5"/>
      <circle cx="1810" cy="215" r="1.7"/>
      <circle cx="1030" cy="240" r="1.4"/>
    </g>

    <!-- Великий реалістичний місяць з кратерами -->
    <circle cx="1420" cy="205" r="250" fill="url(#moonGlow)"/>
    <circle cx="1420" cy="205" r="92" fill="#fff6cf"/>
    <circle cx="1390" cy="180" r="18" fill="#ebd89b" opacity="0.45"/>
    <circle cx="1455" cy="230" r="26" fill="#ebd89b" opacity="0.4"/>
    <circle cx="1385" cy="240" r="12" fill="#ebd89b" opacity="0.35"/>

    <!-- Далекий план соснового лісу -->
    <path d="M0,760 L60,610 L115,740 L190,540 L260,730 L340,580 L410,740 L510,510 L590,720 L680,560 L760,730 L850,530 L940,730 L1030,570 L1120,740 L1210,520 L1300,720 L1390,590 L1470,730 L1560,500 L1650,710 L1740,560 L1830,730 L1920,580 L1920,1080 L0,1080 Z" fill="#0b1a1f"/>

    <!-- Середній план дерев і хащі -->
    <path d="M0,820 L95,630 L175,800 L280,580 L370,810 L470,620 L570,800 L690,590 L790,810 L900,640 L1010,820 L1130,610 L1230,800 L1350,650 L1460,810 L1590,590 L1700,800 L1820,630 L1920,790 L1920,1080 L0,1080 Z" fill="#102424"/>

    <!-- Хатинка Баби Яги на курячих ніжках у глибині лісу -->
    <g transform="translate(860, 445) scale(0.82)" opacity="0.85">
      <!-- Курячі лапи -->
      <path d="M120,230 L115,310 L85,330 M115,310 L115,335 M115,310 L140,328" stroke="#8c6228" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M210,230 L218,310 L190,328 M218,310 L222,335 M218,310 L248,325" stroke="#8c6228" stroke-width="12" stroke-linecap="round" fill="none"/>
      <!-- Зруб хатинки з колод -->
      <rect x="65" y="100" width="200" height="135" rx="10" fill="#2e1b0f" stroke="#170c06" stroke-width="4"/>
      <line x1="60" y1="128" x2="270" y2="128" stroke="#170c06" stroke-width="5"/>
      <line x1="60" y1="156" x2="270" y2="156" stroke="#170c06" stroke-width="5"/>
      <line x1="60" y1="184" x2="270" y2="184" stroke="#170c06" stroke-width="5"/>
      <line x1="60" y1="212" x2="270" y2="212" stroke="#170c06" stroke-width="5"/>
      <!-- Світле віконце з теплим вогником -->
      <rect x="135" y="135" width="60" height="55" rx="6" fill="#ffae36" stroke="#472810" stroke-width="6"/>

  /* =========================================================================

  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Звук переляку Баби Яги + гучний вибух-пуф хмари + передзвін перетворення
  function playExplosionAndTransformSound(transformIndex) {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    // 1. Короткий зойк переляку
    const gaspOsc = ctx.createOscillator();
    const gaspGain = ctx.createGain();
    gaspOsc.type = 'triangle';
    gaspOsc.frequency.setValueAtTime(280, now);
    gaspOsc.frequency.exponentialRampToValueAtTime(760, now + 0.25);
    gaspGain.gain.setValueAtTime(0.32, now);
    gaspGain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
    gaspOsc.connect(gaspGain).connect(ctx.destination);
    gaspOsc.start(now);
    gaspOsc.stop(now + 0.29);

    // 2. Об'ємний вибух хмари ("ПУФ-БАХ!")
    const bufferSize = ctx.sampleRate * 0.95;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.24));
    }
    const whiteNoise = ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1050, now + 0.32);
    filter.frequency.exponentialRampToValueAtTime(75, now + 1.18);

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.9, now + 0.32);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 1.22);

    whiteNoise.connect(filter).connect(noiseGain).connect(ctx.destination);
    whiteNoise.start(now + 0.32);

    // 3. Казкові іскри перетворення
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq + (transformIndex * 18), now + 0.55 + idx * 0.07);
      gain.gain.setValueAtTime(0.2, now + 0.55 + idx * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95 + idx * 0.07);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + 0.55 + idx * 0.07);
      osc.stop(now + 0.98 + idx * 0.07);
    });
  }

  // Звук противного сміху Баби Яги та булькання зеленої жижі в котлі при помилці
  function playWitchLaughAndCauldronSound() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    for (let i = 0; i < 6; i++) {
      const start = now + i * 0.17;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      const baseFreq = 460 - i * 24;
      osc.frequency.setValueAtTime(baseFreq, start);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.58, start + 0.14);

      gain.gain.setValueAtTime(0.24, start);
      gain.gain.exponentialRampToValueAtTime(0.01, start + 0.15);

      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.15);
    }

    // Активне булькання зеленої жижі в котлі
    for (let b = 0; b < 8; b++) {
      const bStart = now + 0.08 + b * 0.12;
      const bubOsc = ctx.createOscillator();
      const bubGain = ctx.createGain();
      bubOsc.type = 'sine';
      const f = 140 + Math.random() * 180;
      bubOsc.frequency.setValueAtTime(f, bStart);
      bubOsc.frequency.exponentialRampToValueAtTime(f * 2.1, bStart + 0.09);

      bubGain.gain.setValueAtTime(0.22, bStart);
      bubGain.gain.exponentialRampToValueAtTime(0.01, bStart + 0.1);

      bubOsc.connect(bubGain).connect(ctx.destination);
      bubOsc.start(bStart);
      bubOsc.stop(bStart + 0.11);
    }
  }

  /* =========================================================================
     СТАН ГРИ ТА ВІДОБРАЖЕННЯ ЗАВДАННЯ
     ========================================================================= */
  let currentLevel = 0;
  let transformationCounter = 0;
  let isAnimating = false;
  let autoAdvanceTimer = null;

  const wordsContainer = document.getElementById('words-container');
  const characterStage = document.getElementById('character-stage');
  const yagaWrapper = document.getElementById('baba-yaga-wrapper');
  const potionSwirlGroup = document.getElementById('potion-swirl-group');
  const transformedContainer = document.getElementById('transformed-container');
  const explosionLayer = document.getElementById('explosion-layer');
  const splashLayer = document.getElementById('potion-splash-layer');

  const mouthIdle = document.getElementById('mouth-idle');
  const toothIdle = document.getElementById('tooth-idle');
  const mouthLaugh = document.getElementById('mouth-laugh');
  const mouthScared = document.getElementById('mouth-scared');

  // Створення живих світлячків у лісі
  function initFireflies() {
    const layer = document.getElementById('fireflies-layer');
    for (let i = 0; i < 24; i++) {
      const cx = Math.random() * 1900;
      const cy = 220 + Math.random() * 760;
      const r = 2.5 + Math.random() * 4;
      const dur = 3 + Math.random() * 4;
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', r);
      circle.setAttribute('fill', '#d9ff66');
      circle.innerHTML = `
        <animate attributeName="opacity" values="0.15;0.95;0.15" dur="${dur}s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="${cy};${cy - 35};${cy}" dur="${dur * 1.3}s" repeatCount="indefinite"/>
      `;
      layer.appendChild(circle);
    }
  }

  // Повернення Баби Яги до початкового стану
  function resetBabaYagaState() {
    if (autoAdvanceTimer) {
      clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = null;
    }
    isAnimating = false;
    characterStage.classList.remove('yaga-scared', 'yaga-laughing');
    yagaWrapper.style.display = 'block';
    potionSwirlGroup.style.display = 'block';
    transformedContainer.style.display = 'none';
    transformedContainer.className = '';
    transformedContainer.innerHTML = '';
    explosionLayer.innerHTML = '';
    splashLayer.innerHTML = '';

    mouthIdle.style.display = 'block';
    toothIdle.style.display = 'block';
    mouthLaugh.style.display = 'none';
    mouthScared.style.display = 'none';
  }

  // Рендер поточного слова у 4 відмінках
  function renderLevel(index) {
    resetBabaYagaState();
    wordsContainer.innerHTML = '';

    const wordData = WORDS_DATA[index];
    wordData.cases.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'case-row';

      row.innerHTML = `
        <div class="case-label">
          <svg class="rune-gem" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="15" fill="#2c4a1e" stroke="#7ee856" stroke-width="2.5"/>
            <circle cx="14" cy="13" r="4" fill="#b9ff99" opacity="0.65"/>
          </svg>
          <span>${item.label}</span>
        </div>
        <div class="word-group">
          <span class="word-stem">${item.stem}</span>
          <input type="text" class="ending-input" maxlength="2" data-idx="${idx}" autocomplete="off" spellcheck="false" />
        </div>
      `;
      wordsContainer.appendChild(row);
    });

    const inputs = wordsContainer.querySelectorAll('.ending-input');
    if (inputs.length > 0) {
      inputs[0].focus();
    }

    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.classList.remove('wrong-field', 'correct-field');
        if (inp.value.trim().length >= 1 && i < inputs.length - 1) {
          inputs[i + 1].focus();
        }
      });

      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          checkAnswers();
        } else if (e.key === 'Backspace' && inp.value === '' && i > 0) {
          inputs[i - 1].focus();
        }
      });
    });
  }

  /* =========================================================================
     ДЕТАЛІЗОВАНЕ ПУХНАСТЕ ОБЛАЧКО ВИБУХУ (НАВКОЛО НОВОЇ ПОЗИЦІЇ ПРАВІШЕ X=585, Y=525)
     Малює багатошарову клубочисту хмару диму зі спалахом, завитками та зірочками
     ========================================================================= */
  function triggerVisualExplosion() {
    explosionLayer.innerHTML = '';

    // 1. Ударна хвиля та багатошарове пухнасте облачко диму
    let cloudMarkup = `
      <!-- Зовнішнє ударне кільце -->
      <circle class="cloud-shockwave" cx="585" cy="525" r="145" fill="none" stroke="#fff3a1" />

      <!-- Головне пухнасте облачко вибуху з фігурними клубами диму та завитками -->
      <g class="cloud-puff-main">
        <path d="M 435,545
                 C 390,510 410,435 468,428
                 C 482,365 565,350 605,398
                 C 665,360 738,405 725,468
                 C 778,498 765,578 708,598
                 C 715,652 638,678 592,642
                 C 542,682 462,658 458,602
                 C 405,595 398,558 435,545 Z"
              fill="url(#smokeCloudOuter)" stroke="#5b3c7a" stroke-width="6" stroke-linejoin="round"/>

        <!-- Внутрішні об'ємні пухирці хмари для максимальної пухнастості -->
        <circle cx="485" cy="485" r="68" fill="#f2e6ff" opacity="0.9"/>
        <circle cx="585" cy="455" r="82" fill="#fff7eb" opacity="0.95"/>
        <circle cx="665" cy="505" r="66" fill="#f2e6ff" opacity="0.9"/>
        <circle cx="635" cy="580" r="64" fill="#e6d2f7" opacity="0.9"/>
        <circle cx="525" cy="578" r="70" fill="#ebdcf9" opacity="0.9"/>

        <!-- Декоративні завитки диму всередині облачка -->
        <path d="M475,465 Q515,435 535,475 T495,515" fill="none" stroke="#b396d1" stroke-width="5" stroke-linecap="round"/>
        <path d="M645,470 Q685,485 660,525 T610,515" fill="none" stroke="#b396d1" stroke-width="5" stroke-linecap="round"/>
        <path d="M545,595 Q585,625 615,585" fill="none" stroke="#b396d1" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- Яскраве вогняно-золоте ядро вибуху всередині облачка -->
      <g class="cloud-puff-inner">
        <polygon points="585,375 612,462 702,438 642,510 715,568 622,568 635,655 575,585 502,642 532,555 445,545 522,495 478,420 558,458"
                 fill="url(#smokeCloudInner)"/>
      </g>
    `;

    // 2. Окремі клубочки диму та яскраві іскри, що розлітаються з облачка
    const puffColors = ['#fffDF5', '#f0e1ff', '#ffea75', '#d5b8f2', '#9eff57'];
    for (let i = 0; i < 18; i++) {
      const angle = (Math.PI * 2 * i) / 18;
      const dist = 140 + Math.random() * 130;
      const tx = 585 + Math.cos(angle) * dist;
      const ty = 525 + Math.sin(angle) * dist;
      const r = 18 + Math.random() * 28;
      const color = puffColors[i % puffColors.length];

      cloudMarkup += `
        <circle cx="585" cy="525" r="${r}" fill="${color}" stroke="#6c4b8a" stroke-width="2">
          <animate attributeName="cx" values="585;${tx}" dur="0.85s" fill="freeze"/>
          <animate attributeName="cy" values="525;${ty}" dur="0.85s" fill="freeze"/>
          <animate attributeName="r" values="${r * 0.4};${r};4" dur="0.85s" fill="freeze"/>
          <animate attributeName="opacity" values="1;0.9;0" dur="0.85s" fill="freeze"/>
        </circle>
      `;
    }

    explosionLayer.innerHTML = cloudMarkup;
  }

  // Бризки киплячої зеленої жижі з котла під час помилки
  function triggerCauldronSplash() {
    splashLayer.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const startX = 165 + Math.random() * 150;
      const endX = startX + (Math.random() * 120 - 60);
      const endY = 390 + Math.random() * 110;
      const r = 6 + Math.random() * 10;

      const drop = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      drop.setAttribute('cx', startX);
      drop.setAttribute('cy', '550');
      drop.setAttribute('r', r);
      drop.setAttribute('fill', i % 2 === 0 ? '#b8ff47' : '#3dff8b');
      drop.innerHTML = `
        <animate attributeName="cx" values="${startX};${endX}" dur="0.75s" repeatCount="2"/>
        <animate attributeName="cy" values="550;${endY};555" dur="0.75s" repeatCount="2"/>
        <animate attributeName="opacity" values="1;0.9;0" dur="0.75s" repeatCount="2"/>
      `;
      splashLayer.appendChild(drop);
    }
  }

  // Перевірка введених закінчень
  function checkAnswers() {
    if (isAnimating) return;

    const wordData = WORDS_DATA[currentLevel];
    const inputs = wordsContainer.querySelectorAll('.ending-input');
    let allCorrect = true;

    inputs.forEach((inp, idx) => {
      const userVal = inp.value.trim().toLowerCase();
      const expectedVal = wordData.cases[idx].ending.toLowerCase();

      inp.classList.remove('wrong-field', 'correct-field');
      void inp.offsetWidth;

      if (userVal === expectedVal) {
        inp.classList.add('correct-field');
      } else {
        inp.classList.add('wrong-field');
        allCorrect = false;
      }
    });

    if (allCorrect) {
      // Усе правильно: Баба Яга лякається -> з'являється густе облачко вибуху -> перетворення правіше
      isAnimating = true;
      const currentTransformIdx = transformationCounter % TRANSFORMATIONS_SVG.length;
      transformationCounter++;

      playExplosionAndTransformSound(currentTransformIdx);

      // 1. Переляк Баби Яги
      mouthIdle.style.display = 'none';
      toothIdle.style.display = 'none';
      mouthScared.style.display = 'block';
      characterStage.classList.add('yaga-scared');

      // 2. Вибух пухнастого облачка диму і поява перетвореного об'єкта правіше
      setTimeout(() => {
        triggerVisualExplosion();
        yagaWrapper.style.display = 'none';
        potionSwirlGroup.style.display = 'none';
        characterStage.classList.remove('yaga-scared');

        transformedContainer.innerHTML = TRANSFORMATIONS_SVG[currentTransformIdx];
        transformedContainer.style.display = 'block';
        transformedContainer.setAttribute('class', 'transformed-pop');
      }, 330);

      // 3. Автоматичний перехід до наступного слова після перегляду перетворення
      autoAdvanceTimer = setTimeout(() => {
        currentLevel = (currentLevel + 1) % WORDS_DATA.length;
        renderLevel(currentLevel);
      }, 3200);

    } else {
      // Є помилка: Баба Яга противно сміється і інтенсивно мішає зелену жижу паличкою всередині котла
      isAnimating = true;
      playWitchLaughAndCauldronSound();
      triggerCauldronSplash();

      mouthIdle.style.display = 'none';
      toothIdle.style.display = 'none';
      mouthLaugh.style.display = 'block';
      characterStage.classList.add('yaga-laughing');

      setTimeout(() => {
        characterStage.classList.remove('yaga-laughing');
        mouthLaugh.style.display = 'none';
        mouthIdle.style.display = 'block';
        toothIdle.style.display = 'block';
        splashLayer.innerHTML = '';
        isAnimating = false;
      }, 1500);
    }
  }

  // Обробники кнопок
  document.getElementById('check-btn').addEventListener('click', checkAnswers);

  // Мінімалістична кнопка "Назад" (попередній рівень)
  document.getElementById('prev-btn').addEventListener('click', () => {
    currentLevel = (currentLevel - 1 + WORDS_DATA.length) % WORDS_DATA.length;
    renderLevel(currentLevel);
  });

  // Мінімалістична кнопка "Далі" (миттєвий перехід на наступне завдання без проходження)
  document.getElementById('next-btn').addEventListener('click', () => {
    currentLevel = (currentLevel + 1) % WORDS_DATA.length;
    renderLevel(currentLevel);
  });

  // Запуск гри
  initFireflies();
  renderLevel(currentLevel);
</script>
