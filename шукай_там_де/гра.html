<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Інтерактивна гра: Знайди об'єкт</title>

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* БАЗОВІ СТИЛІ ТА ШРИФТ */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #222;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ПРОЗОРІ КОНТЕЙНЕРИ ІГРИ */
        #game-ui {
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 900px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        /* КОНТРАСТНИЙ ШРИФТ ПИТАННЯ */
        #question-display {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 15px;
            padding: 15px 30px;
            font-size: 32px;
            font-weight: 900;
            color: #FFFF00;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 
                3px 3px 0 #000, 
                -2px -2px 0 #000, 
                2px -2px 0 #000, 
                -2px 2px 0 #000, 
                2px 2px 0 #000,
                0px 5px 15px rgba(0,0,0,1);
            border: 3px solid #FFFF00;
            transition: transform 0.3s ease;
        }

        /* КНОПКА "НАСТУПНЕ ПИТАННЯ" */
        #next-btn {
            padding: 12px 30px;
            font-size: 22px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9900, #ff5500);
            color: white;
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            pointer-events: auto;
            transition: all 0.2s;
            text-shadow: 1px 1px 2px #000;
        }
        #next-btn:active {
            transform: scale(0.92);
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* КОНТЕЙНЕР ЗОБРАЖЕННЯ НА ВЕСЬ ЕКРАН */
        #image-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        #main-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: crosshair;
            position: relative;
        }
        
        /* ЕФЕКТ ФІДБЕКУ ПРИ ЗНАХОДЖЕННІ */
        .feedback-ripple {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(0,255,0,0.9) 0%, rgba(0,255,0,0) 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: rippleAnim 1s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }
        @keyframes rippleAnim {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(4); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(6); opacity: 0; }
        }

        /* ІНСТРУМЕНТ КООРДИНАТОР (ДЛЯ ВЧИТЕЛЯ) */
        #dev-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #0f0;
            z-index: 100;
            cursor: pointer; /* Тепер клікабельно */
            transition: background 0.2s;
        }
        #dev-panel:active {
            background: rgba(0,255,0,0.3);
        }

        /* THEME MANAGER UI */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border: 2px solid white;
            font-size: 24px;
            cursor: pointer;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            transition: transform 0.2s;
        }
        #theme-btn:active { transform: scale(0.9); }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            max-height: 60vh;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid white;
            border-radius: 15px;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        .theme-item {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
        }
        .theme-item:hover { border-color: #fff; }
        .theme-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-item span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 4px 0;
            font-weight: bold;
        }
        #theme-close {
            position: absolute;
            top: 10px;
            right: 15px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        /* БЛОК ДОСТУПУ (ЗАГЛУШКА) */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #block-overlay h1 {
            color: red;
            font-size: 40px;
            text-align: center;
            margin: 0 20px;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
        }

        /* АДАПТИВНІСТЬ */
        @media (max-width: 600px) {
            #question-display { font-size: 20px; padding: 12px 20px; border-width: 2px; }
            #next-btn { font-size: 18px; padding: 10px 20px; }
            .theme-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
        }
    </style>
</head>
<body>

    <!-- ІНСТРУМЕНТ КООРДИНАТОР -->
    <div id="dev-panel" title="Натисніть сюди, щоб скопіювати координати">
        1. Клікніть по картинці<br>
        2. <b>Клікніть ТУТ, щоб скопіювати</b><br>
        <span id="dev-coords">X: 0%, Y: 0%</span>
    </div>

    <!-- UI ІГРИ -->
    <div id="game-ui">
        <div id="question-display">ЗАВАНТАЖЕННЯ...</div>
        <button id="next-btn" style="display: none;">Наступне питання ➔</button>
    </div>

    <!-- КОНТЕЙНЕР ІГРОВОГО ПОЛЯ НА ВЕСЬ ЕКРАН -->
    <div id="image-container">
        <!-- Змініть шлях на ваш фон.png -->
        <img id="main-image" src="фон.png" alt="Ігрове поле">
        <div id="ripple-container"></div>
    </div>

    <!-- THEME MANAGER UI -->
    <div id="theme-btn">⚙️</div>
    <div id="theme-modal">
        <div id="theme-close">×</div>
        <h2 style="color:white; text-align:center; margin-top:0;">Виберіть фон</h2>
        <div class="theme-grid" id="theme-grid"></div>
    </div>

    <!-- ЕКРАН-ЗАГЛУШКА -->
    <div id="block-overlay">
        <h1>Зачекай! Зараз не твій урок.</h1>
    </div>

    <script>
        // ==========================================
        // 1. ДАНІ ГРИ ТА КООРДИНАТИ
        // ==========================================
        const questionsData = [
            { id: 1, text: "Шукай там, де холодно.", x: 15, y: 20, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" },
            { id: 2, text: "Шукай там, де відпочивають.", x: 30, y: 50, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2001/2001-preview.mp3" },
            { id: 3, text: "Шукай там, де говорять.", x: 45, y: 10, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2002/2002-preview.mp3" },
            { id: 4, text: "Шукай там, де чисто.", x: 60, y: 80, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" },
            { id: 5, text: "Шукай там, де реклама.", x: 75, y: 40, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3" },
            { id: 6, text: "Шукай там, де біжить час.", x: 10, y: 90, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2005/2005-preview.mp3" },
            { id: 7, text: "Шукай там, де є другий ти.", x: 85, y: 15, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2006/2006-preview.mp3" },
            { id: 8, text: "Шукай там, де смачно.", x: 50, y: 50, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2007/2007-preview.mp3" },
            { id: 9, text: "Шукай там, де смердить.", x: 90, y: 90, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2008/2008-preview.mp3" },
            { id: 10, text: "Шукай там, де небезпечно.", x: 5, y: 50, radius: 5, sound: "https://assets.mixkit.co/active_storage/sfx/2009/2009-preview.mp3" }
        ];

        let availableQuestions = [...questionsData];
        let currentQuestion = null;
        let isGameFinished = false;

        // ==========================================
        // 2. ІДЕНТИФІКАЦІЯ
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user');
        if (myName) {
            sessionStorage.setItem('userName', myName);
        } else {
            myName = sessionStorage.getItem('userName');
            if (!myName) {
                myName = "Гість_" + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('userName', myName);
            }
        }
        const tabId = Math.random().toString(36).substr(2, 9);
        const senderId = myName + "_" + tabId;

        // ==========================================
        // 3. FIREBASE ІНІЦІАЛІЗАЦІЯ
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================
        // 4. THEME MANAGER З СИНХРОНІЗАЦІЄЮ
        // ==========================================
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeClose = document.getElementById('theme-close');
        const themeGrid = document.getElementById('theme-grid');
        const baseUrl = "https://olgazheltvai2.github.io/images/backgrounds/";

        themeBtn.onclick = () => themeModal.style.display = 'block';
        themeClose.onclick = () => themeModal.style.display = 'none';

        async function loadThemes() {
            themeGrid.innerHTML = '';
            for (let i = 1; i <= 1000; i++) {
                const url = `${baseUrl}background_${i}.webp`;
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    const div = document.createElement('div');
                    div.className = 'theme-item';
                    div.innerHTML = `<img src="${url}"><span>Фон ${i}</span>`;
                    div.onclick = () => {
                        db.ref('game_theme').set(url);
                        themeModal.style.display = 'none';
                    };
                    themeGrid.appendChild(div);
                };
                img.onerror = () => { i = 1001; };
            }
        }
        loadThemes();

        db.ref('game_theme').on('value', (snap) => {
            const url = snap.val();
            if (url) {
                document.body.style.backgroundImage = `url('${url}')`;
                localStorage.setItem('mySavedGameBg', url);
            }
        });
        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

        // ==========================================
        // 5. ЛОГІКА ІГРИ ТА СИНХРОНІЗАЦІЯ ДІЙ
        // ==========================================
        const questionDisplay = document.getElementById('question-display');
        const nextBtn = document.getElementById('next-btn');
        const mainImage = document.getElementById('main-image');
        const devPanel = document.getElementById('dev-panel');
        const devCoords = document.getElementById('dev-coords');
        
        let lastActionTimestamp = 0;

        function pickRandomQuestion() {
            if (availableQuestions.length === 0) return null;
            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            return availableQuestions[randomIndex];
        }

        function setQuestion(questionObj) {
            currentQuestion = questionObj;
            if (currentQuestion) {
                questionDisplay.innerText = currentQuestion.text;
                questionDisplay.style.transform = 'scale(1.05)';
                setTimeout(() => questionDisplay.style.transform = 'scale(1)', 200);
                nextBtn.style.display = 'inline-block';
            } else {
                questionDisplay.innerText = "ВСІ ПРЕДМЕТИ ЗНАЙДЕНО!";
                nextBtn.style.display = 'none';
                triggerConfetti();
                isGameFinished = true;
            }
        }

        function sendGameAction(type, data) {
            db.ref('game_action').set({
                senderId: senderId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            });
        }

        // Обробка кнопки "Наступне питання"
        nextBtn.addEventListener('click', () => {
            if (isGameFinished || !currentQuestion) return;
            
            availableQuestions = availableQuestions.filter(q => q.id !== currentQuestion.id);
            const nextQ = pickRandomQuestion();
            
            sendGameAction('skip_question', {
                nextQuestionId: nextQ ? nextQ.id : null
            });
        });

        // Обробка кліку по картинці для знаходження координат
        mainImage.addEventListener('click', (e) => {
            if (isGameFinished || !currentQuestion) return;

            const rect = mainImage.getBoundingClientRect();
            const clickX = ((e.clientX - rect.left) / rect.width) * 100;
            const clickY = ((e.clientY - rect.top) / rect.height) * 100;

            // Виведення для розробника та підготовка для копіювання
            const xStr = clickX.toFixed(2);
            const yStr = clickY.toFixed(2);
            devCoords.innerText = `X: ${xStr}%, Y: ${yStr}%`;
            devPanel.dataset.coords = `x: ${xStr}, y: ${yStr}`;

            // Перевірка влучання
            const dx = clickX - currentQuestion.x;
            const dy = clickY - currentQuestion.y;
            const distance = Math.sqrt(dx*dx + dy*dy);

            if (distance <= currentQuestion.radius) {
                // Влучання! Готуємо наступне питання
                availableQuestions = availableQuestions.filter(q => q.id !== currentQuestion.id);
                const nextQ = pickRandomQuestion();
                
                sendGameAction('target_found', {
                    clickX: clickX,
                    clickY: clickY,
                    soundUrl: currentQuestion.sound,
                    nextQuestionId: nextQ ? nextQ.id : null
                });
            }
        });

        // Обробка кліку по панелі для копіювання в буфер
        devPanel.addEventListener('click', () => {
            const coords = devPanel.dataset.coords;
            if (coords) {
                navigator.clipboard.writeText(coords).then(() => {
                    const originalText = devCoords.innerText;
                    devCoords.innerText = "Скопійовано!";
                    devCoords.style.color = "#fff";
                    setTimeout(() => { 
                        devCoords.innerText = originalText;
                        devCoords.style.color = "#0f0";
                    }, 1000);
                }).catch(err => {
                    console.error('Не вдалося скопіювати', err);
                });
            }
        });

        function playSound(url) {
            const audio = new Audio(url);
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Аудіо заблоковано браузером", e));
        }

        function showRipple(xPercent, yPercent) {
            const ripple = document.createElement('div');
            ripple.className = 'feedback-ripple';
            ripple.style.left = `${xPercent}%`;
            ripple.style.top = `${yPercent}%`;
            mainImage.parentElement.appendChild(ripple);
            setTimeout(() => { ripple.remove(); }, 1000);
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // Слухач дій через Firebase
        db.ref('game_action').on('value', (snap) => {
            const action = snap.val();
            if (!action) return;
            
            if (action.timestamp <= lastActionTimestamp) return;
            lastActionTimestamp = action.timestamp;

            if (action.type === 'start_game') {
                const startQ = questionsData.find(q => q.id === action.data.firstQuestionId);
                availableQuestions = questionsData.filter(q => q.id !== action.data.firstQuestionId);
                setQuestion(startQ);
            } 
            else if (action.type === 'target_found' || action.type === 'skip_question') {
                
                if (action.type === 'target_found') {
                    showRipple(action.data.clickX, action.data.clickY);
                    playSound(action.data.soundUrl);
                }

                if (currentQuestion) {
                    availableQuestions = availableQuestions.filter(q => q.id !== currentQuestion.id);
                }
                
                if (action.data.nextQuestionId) {
                    const nextQ = questionsData.find(q => q.id === action.data.nextQuestionId);
                    setQuestion(nextQ);
                } else {
                    setQuestion(null);
                }
            }
        });

        // Ініціалізація першого запуску
        db.ref('game_action').once('value').then(snap => {
            const action = snap.val();
            const now = Date.now();
            if (!action || (now - action.timestamp > 3600000)) {
                const firstQ = pickRandomQuestion();
                sendGameAction('start_game', { firstQuestionId: firstQ.id });
            }
        });

        // ==========================================
        // 6. УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ
        // ==========================================
        const radarRef = db.ref(`online_users/${myName}/${tabId}`);
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                radarRef.set({ timestamp: firebase.database.ServerValue.TIMESTAMP });
                radarRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => { radarRef.remove(); });

        db.ref('force_refresh').on('value', (snap) => {
            if(snap.val()) {
                const now = Date.now();
                if(now - snap.val() < 5000) window.location.reload();
            }
        });

        db.ref(`blocked_users/${myName}`).on('value', (snap) => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        let immunity = true;
        setTimeout(() => { immunity = false; }, 1000);
        db.ref('current_activity').on('value', (snap) => {
            if(immunity) return;
            const activity = snap.val();
            if (activity === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });
    </script>
</body>
</html>
