<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Властивості предметів</title>
<style>
  /* Скидання базових стилів та заборона виділення */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #053254;
    font-family: sans-serif;
  }

  /* Головний контейнер гри */
  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Головне SVG-полотно сцени (завжди повністю вміщується по висоті й ширині) */
  #scene-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Анімації живої природи на фоні */
  @keyframes driftCloud1 {
    0% { transform: translateX(-300px); }
    100% { transform: translateX(1500px); }
  }
  @keyframes driftCloud2 {
    0% { transform: translateX(1500px); }
    100% { transform: translateX(-350px); }
  }
  @keyframes swayReed {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(4deg); }
  }
  @keyframes swayWeed {
    0%, 100% { transform: skewX(-5deg); }
    50% { transform: skewX(5deg); }
  }
  @keyframes waveMove1 {
    0%, 100% { transform: translateX(0px) translateY(0px); }
    50% { transform: translateX(-35px) translateY(3px); }
  }
  @keyframes waveMove2 {
    0%, 100% { transform: translateX(-20px) translateY(2px); }
    50% { transform: translateX(25px) translateY(-3px); }
  }
  @keyframes sunRayPulse {
    0%, 100% { opacity: 0.16; }
    50% { opacity: 0.34; }
  }
  @keyframes lilyBob {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(5px) rotate(1deg); }
  }

  .cloud-1 { animation: driftCloud1 70s linear infinite; }
  .cloud-2 { animation: driftCloud2 90s linear infinite; }
  .reed-1 { transform-origin: 120px 310px; animation: swayReed 4.5s ease-in-out infinite; }
  .reed-2 { transform-origin: 1080px 310px; animation: swayReed 5.2s ease-in-out infinite reverse; }
  .weed-1 { transform-origin: 180px 650px; animation: swayWeed 4s ease-in-out infinite; }
  .weed-2 { transform-origin: 480px 655px; animation: swayWeed 5s ease-in-out infinite reverse; }
  .weed-3 { transform-origin: 820px 650px; animation: swayWeed 4.3s ease-in-out infinite; }
  .weed-4 { transform-origin: 1020px 650px; animation: swayWeed 5.5s ease-in-out infinite reverse; }
  .wave-back { animation: waveMove1 5s ease-in-out infinite; }
  .wave-front { animation: waveMove2 3.8s ease-in-out infinite; }
  .sun-ray { animation: sunRayPulse 6s ease-in-out infinite; }
  #frog-lily-group { transform-origin: 210px 325px; animation: lilyBob 3.5s ease-in-out infinite; }

  /* Предмет, на який можна натиснути для звукової підказки */
  #item-holder {
    cursor: pointer;
  }

  /* ==================== СТАЦІОНАРНІ КНОПКИ ІНТЕРФЕЙСУ ==================== */
  /* Сам елемент button ніколи не змінює своїх координат, тому не втікає від миші */
  .ui-btn {
    position: absolute;
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
    padding: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  /* Візуальна частина кнопки всередині (масштабується від центру без зміщення хітбоксу) */
  .ui-btn svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    transform-origin: center center;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
    filter: drop-shadow(0 5px 8px rgba(0, 20, 40, 0.4));
  }

  .ui-btn:hover svg {
    transform: scale(1.08);
    filter: brightness(1.08) drop-shadow(0 7px 12px rgba(0, 20, 40, 0.5));
  }

  .ui-btn:active svg {
    transform: scale(0.92);
  }

  /* Мінімалістичні кнопки навігації (Назад / Далі) у верхніх кутах */
  #btn-prev {
    top: 16px;
    left: 20px;
    width: clamp(54px, 7.5vmin, 72px);
    height: clamp(54px, 7.5vmin, 72px);
  }

  #btn-next {
    top: 16px;
    right: 20px;
    width: clamp(54px, 7.5vmin, 72px);
    height: clamp(54px, 7.5vmin, 72px);
  }

  /* Кнопки вибору: Попливе (вгорі праворуч) та Потоне (внизу праворуч) */
  #btn-float {
    right: clamp(24px, 5vw, 80px);
    top: 18vh;
    width: clamp(105px, 18vmin, 148px);
    height: clamp(105px, 18vmin, 148px);
  }

  #btn-sink {
    right: clamp(24px, 5vw, 80px);
    bottom: 12vh;
    width: clamp(105px, 18vmin, 148px);
    height: clamp(105px, 18vmin, 148px);
  }

  /* Анімації фідбеку для внутрішнього SVG кнопки */
  @keyframes btnShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-12px) rotate(-6deg); }
    40% { transform: translateX(12px) rotate(6deg); }
    60% { transform: translateX(-8px) rotate(-4deg); }
    80% { transform: translateX(8px) rotate(4deg); }
  }

  @keyframes btnPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  .shake-anim svg {
    animation: btnShake 0.42s ease-in-out;
  }

  .pop-anim svg {
    animation: btnPop 0.36s ease-out;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <!-- ================= КНОПКИ НАВІГАЦІЇ ТА ВИБОРУ ================= -->
  <!-- Кнопка «НАЗАД» (попередній предмет) -->
  <button id="btn-prev" class="ui-btn" aria-label="Попередній">
    <svg viewBox="-36 -36 72 72">
      <defs>
        <linearGradient id="uiWood" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e09f5a"/>
          <stop offset="50%" stop-color="#b87333"/>
          <stop offset="100%" stop-color="#7f4616"/>
        </linearGradient>
      </defs>
      <circle cx="0" cy="0" r="31" fill="url(#uiWood)" stroke="#4a2508" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="24" fill="#fefae0" opacity="0.22"/>
      <path d="M8,-13 L-9,0 L8,13 Z" fill="#fff3b0" stroke="#4a2508" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Кнопка «ДАЛІ» (одразу наступний предмет без проходження) -->
  <button id="btn-next" class="ui-btn" aria-label="Наступний">
    <svg viewBox="-36 -36 72 72">
      <circle cx="0" cy="0" r="31" fill="url(#uiWood)" stroke="#4a2508" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="24" fill="#fefae0" opacity="0.22"/>
      <path d="M-8,-13 L9,0 L-8,13 Z" fill="#fff3b0" stroke="#4a2508" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Кнопка «ПОПЛИВЕ» -->
  <button id="btn-float" class="ui-btn" aria-label="Попливе">
    <svg viewBox="-72 -72 144 144">
      <defs>
        <linearGradient id="floatInner" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e0fbfc"/>
          <stop offset="55%" stop-color="#98f5e1"/>
          <stop offset="100%" stop-color="#00bbf9"/>
        </linearGradient>
      </defs>
      <circle cx="0" cy="0" r="65" fill="url(#uiWood)" stroke="#4a2508" stroke-width="4.5"/>
      <circle cx="0" cy="0" r="55" fill="url(#floatInner)" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Хвиля та кораблик на поверхні -->
      <path d="M-48,14 Q-24,4 0,14 T48,14 A54,54 0 0,1 -48,14 Z" fill="#0077b6" opacity="0.88"/>
      <path d="M-48,14 Q-24,4 0,14 T48,14" stroke="#ffffff" stroke-width="3" fill="none"/>
      <polygon points="-24,8 24,8 15,20 -15,20" fill="#ff9f1c" stroke="#582f0e" stroke-width="2"/>
      <polygon points="-2,6 -2,-16 16,4" fill="#ffffff" stroke="#582f0e" stroke-width="1.5"/>
      <!-- Зелена стрілка ВГОРУ -->
      <path d="M0,-44 L20,-22 L9,-22 L9,-6 L-9,-6 L-9,-22 L-20,-22 Z" fill="#38b000" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Кнопка «ПОТОНЕ» -->
  <button id="btn-sink" class="ui-btn" aria-label="Потоне">
    <svg viewBox="-72 -72 144 144">
      <defs>
        <linearGradient id="sinkInner" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#48cae4"/>
          <stop offset="55%" stop-color="#023e8a"/>
          <stop offset="100%" stop-color="#d9ab57"/>
        </linearGradient>
      </defs>
      <circle cx="0" cy="0" r="65" fill="url(#uiWood)" stroke="#4a2508" stroke-width="4.5"/>
      <circle cx="0" cy="0" r="55" fill="url(#sinkInner)" stroke="#90e0ef" stroke-width="2.5"/>
      <!-- Поверхня води зверху та камінь на дні внизу -->
      <path d="M-46,-28 Q-23,-35 0,-28 T46,-28" stroke="#caf0f8" stroke-width="3" fill="none"/>
      <path d="M-45,32 Q0,22 45,32 A54,54 0 0,1 -45,32 Z" fill="#d9ab57"/>
      <ellipse cx="0" cy="34" rx="18" ry="10" fill="#495057" stroke="#212529" stroke-width="2"/>
      <!-- Бульбашки -->
      <circle cx="-22" cy="-6" r="4" fill="#caf0f8" opacity="0.8"/>
      <circle cx="24" cy="4" r="5" fill="#caf0f8" opacity="0.8"/>
      <circle cx="20" cy="-14" r="3" fill="#caf0f8" opacity="0.8"/>
      <!-- Червона стрілка ВНИЗ -->
      <path d="M0,20 L20,-2 L9,-2 L9,-20 L-9,-20 L-9,-2 L-20,-2 Z" fill="#ff595e" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- ================= ГОЛОВНА СЦЕНА ВОДОЙМИ ================= -->
  <!-- preserveAspectRatio="xMidYMid meet" гарантує, що вся висота від гілки до дна 100% видна -->
  <svg id="scene-svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- Градієнти природи -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4facfe"/>
        <stop offset="55%" stop-color="#9be7ff"/>
        <stop offset="100%" stop-color="#dff8ff"/>
      </linearGradient>

      <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fffde4"/>
        <stop offset="40%" stop-color="#ffe66d"/>
        <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#76c893"/>
        <stop offset="100%" stop-color="#52b788"/>
      </linearGradient>

      <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#52b788"/>
        <stop offset="100%" stop-color="#2d6a4f"/>
      </linearGradient>

      <linearGradient id="waterDeep" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1ca3ec" stop-opacity="0.88"/>
        <stop offset="35%" stop-color="#0f76b8" stop-opacity="0.94"/>
        <stop offset="80%" stop-color="#084c7d" stop-opacity="0.97"/>
        <stop offset="100%" stop-color="#053254" stop-opacity="0.99"/>
      </linearGradient>

      <linearGradient id="waveGrad1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#72efdd" stop-opacity="0.75"/>
        <stop offset="100%" stop-color="#1ca3ec" stop-opacity="0.9"/>
      </linearGradient>

      <linearGradient id="waveGrad2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a8f9ff" stop-opacity="0.85"/>
        <stop offset="20%" stop-color="#38b6ff" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#0f76b8" stop-opacity="0.0"/>
      </linearGradient>

      <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f3d292"/>
        <stop offset="45%" stop-color="#d9ab57"/>
        <stop offset="100%" stop-color="#a47528"/>
      </linearGradient>

      <linearGradient id="rayGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#72efdd" stop-opacity="0"/>
      </linearGradient>

      <linearGradient id="woodBranch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8d5524"/>
        <stop offset="50%" stop-color="#6f3e14"/>
        <stop offset="100%" stop-color="#4a2508"/>
      </linearGradient>

      <linearGradient id="woodBtnGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e09f5a"/>
        <stop offset="50%" stop-color="#b87333"/>
        <stop offset="100%" stop-color="#7f4616"/>
      </linearGradient>

      <radialGradient id="frogSkin" cx="45%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#aacc00"/>
        <stop offset="65%" stop-color="#55a630"/>
        <stop offset="100%" stop-color="#2b9348"/>
      </radialGradient>

      <radialGradient id="frogBelly" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffb5"/>
        <stop offset="100%" stop-color="#d4d700"/>
      </radialGradient>

      <linearGradient id="lilyGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#80ed99"/>
        <stop offset="60%" stop-color="#38a3a5"/>
        <stop offset="100%" stop-color="#22577a"/>
      </linearGradient>

      <!-- Градієнти для 22 предметів -->
      <radialGradient id="duckGrad" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#fff78a"/>
        <stop offset="45%" stop-color="#ffd000"/>
        <stop offset="100%" stop-color="#e08e00"/>
      </radialGradient>

      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ff9e00"/>
        <stop offset="100%" stop-color="#e85d04"/>
      </linearGradient>

      <linearGradient id="ironGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ced4da"/>
        <stop offset="40%" stop-color="#6c757d"/>
        <stop offset="80%" stop-color="#343a40"/>
        <stop offset="100%" stop-color="#212529"/>
      </linearGradient>

      <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="35%" stop-color="#dee2e6"/>
        <stop offset="70%" stop-color="#868e96"/>
        <stop offset="100%" stop-color="#495057"/>
      </linearGradient>

      <radialGradient id="goldGrad" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#fff3b0"/>
        <stop offset="40%" stop-color="#ffbe0b"/>
        <stop offset="85%" stop-color="#c97a00"/>
        <stop offset="100%" stop-color="#8a4f00"/>
      </radialGradient>

      <radialGradient id="appleGrad" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#ff758f"/>
        <stop offset="40%" stop-color="#d90429"/>
        <stop offset="85%" stop-color="#800f2f"/>
        <stop offset="100%" stop-color="#590d22"/>
      </radialGradient>

      <radialGradient id="stoneGrad" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#adb5bd"/>
        <stop offset="55%" stop-color="#6c757d"/>
        <stop offset="100%" stop-color="#343a40"/>
      </radialGradient>

      <linearGradient id="corkGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#e6ccb2"/>
        <stop offset="40%" stop-color="#ddb892"/>
        <stop offset="80%" stop-color="#b08968"/>
        <stop offset="100%" stop-color="#7f5539"/>
      </linearGradient>

      <radialGradient id="marbleGrad" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#caf0f8" stop-opacity="0.95"/>
        <stop offset="45%" stop-color="#00b4d8" stop-opacity="0.88"/>
        <stop offset="85%" stop-color="#03045e" stop-opacity="0.92"/>
        <stop offset="100%" stop-color="#0077b6" stop-opacity="0.95"/>
      </radialGradient>

      <linearGradient id="oakLeafGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffbe0b"/>
        <stop offset="50%" stop-color="#fb5607"/>
        <stop offset="100%" stop-color="#9b2226"/>
      </linearGradient>

      <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#90e0ef"/>
        <stop offset="30%" stop-color="#e0fbfc"/>
        <stop offset="75%" stop-color="#48cae4"/>
        <stop offset="100%" stop-color="#0077b6"/>
      </linearGradient>

      <linearGradient id="featherGrad" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#7209b7"/>
        <stop offset="45%" stop-color="#4cc9f0"/>
        <stop offset="100%" stop-color="#f72585"/>
      </linearGradient>

      <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#001d2e" flood-opacity="0.38"/>
      </filter>
    </defs>

    <!-- ================= 1. ШИРОКИЙ ФОН (розтягнутий за межі viewBox для ультрашироких екранів) ================= -->
    <rect x="-800" y="-400" width="2800" height="730" fill="url(#skyGrad)"/>

    <!-- Сонце -->
    <circle cx="920" cy="85" r="76" fill="url(#sunGrad)"/>
    <circle cx="920" cy="85" r="36" fill="#fff9c4"/>

    <!-- Хмаринки -->
    <g class="cloud-1" opacity="0.9">
      <ellipse cx="140" cy="80" rx="55" ry="26" fill="#ffffff"/>
      <ellipse cx="175" cy="70" rx="45" ry="32" fill="#ffffff"/>
      <ellipse cx="215" cy="83" rx="48" ry="24" fill="#ffffff"/>
      <ellipse cx="175" cy="89" rx="75" ry="18" fill="#e3f6ff"/>
    </g>
    <g class="cloud-2" opacity="0.82">
      <ellipse cx="420" cy="120" rx="45" ry="20" fill="#ffffff"/>
      <ellipse cx="455" cy="110" rx="38" ry="26" fill="#ffffff"/>
      <ellipse cx="485" cy="122" rx="40" ry="18" fill="#ffffff"/>
    </g>

    <!-- Далекі та близькі зелені береги -->
    <path d="M-800,315 Q-200,220 180,260 T650,285 T1150,255 T2000,305 L2000,340 L-800,340 Z" fill="url(#hillFar)"/>
    <path d="M-800,315 Q-100,230 310,315 L-800,335 Z" fill="url(#hillNear)"/>
    <path d="M880,315 Q1250,225 2000,305 L2000,335 Z" fill="url(#hillNear)"/>

    <!-- Очерет на лівому та правому березі -->
    <g class="reed-1">
      <path d="M95,320 Q85,220 70,150" stroke="#2d6a4f" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M115,320 Q120,210 135,135" stroke="#40916c" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="124" y="148" width="12" height="44" rx="6" transform="rotate(8 130 170)" fill="#582f0e"/>
      <path d="M115,280 Q80,235 55,220 Q88,255 114,295 Z" fill="#52b788"/>
      <path d="M118,265 Q155,220 175,210 Q145,245 117,280 Z" fill="#40916c"/>
    </g>
    <g class="reed-2">
      <path d="M1090,320 Q1100,225 1115,155" stroke="#2d6a4f" stroke-width="6" fill="none" stroke-linecap="round"/>
      <rect x="1104" y="165" width="12" height="42" rx="6" transform="rotate(7 1110 185)" fill="#582f0e"/>
      <path d="M1070,320 Q1055,240 1040,175" stroke="#52b788" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M1088,285 Q1050,240 1025,230 Q1060,260 1088,300 Z" fill="#40916c"/>
    </g>

    <!-- Верхня гілка дерева з мотузкою, яка тримає предмет -->
    <g id="tree-crane">
      <path d="M-600,20 Q200,12 470,40 Q565,52 615,46 Q630,44 632,56 Q628,68 605,68 Q480,73 200,58 L-600,82 Z" fill="url(#woodBranch)" filter="url(#dropShadow)"/>
      <path d="M140,42 Q230,40 310,48 M350,46 Q450,54 540,54" stroke="#3b1d06" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
      <!-- Листя на гілці -->
      <path d="M320,40 Q340,10 375,18 Q355,46 320,40 Z" fill="#52b788"/>
      <path d="M460,46 Q485,15 520,25 Q495,53 460,46 Z" fill="#74c69d"/>
      <path d="M445,50 Q420,20 390,32 Q415,56 445,50 Z" fill="#40916c"/>
      <!-- Мотузка та тримач предмета -->
      <line id="crane-rope" x1="600" y1="60" x2="600" y2="124" stroke="#d4a373" stroke-width="5" stroke-dasharray="6,3"/>
      <circle cx="600" cy="60" r="9" fill="#b08968" stroke="#582f0e" stroke-width="3"/>

   1. АУДІО-СИНТЕЗАТОР (Web Audio API) — звуки води, матеріалів та емоцій
   ============================================================================ */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // Звук матеріалу при натисканні на предмет (слухова підказка дитині)
  playMaterialHint(mat) {
    this.init();
    const now = this.ctx.currentTime;

    if (mat === 'metal') {
      [1100, 1680, 2450].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.16 / (idx + 1), now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      });
    } else if (mat === 'wood') {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.12);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (mat === 'rubber') {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(620, now);
      osc.frequency.linearRampToValueAtTime(980, now + 0.08);
      osc.frequency.linearRampToValueAtTime(700, now + 0.18);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (mat === 'glass') {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1950, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.55);
    } else if (mat === 'stone') {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.15);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    } else {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    }
  }

  // Сплеск води при зануренні
  playSplash(isHeavy) {
    this.init();
    const now = this.ctx.currentTime;
    const duration = isHeavy ? 0.55 : 0.35;

    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(isHeavy ? 480 : 850, now);
    filter.frequency.exponentialRampToValueAtTime(isHeavy ? 1200 : 1800, now + duration);
    filter.Q.value = 1.8;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(isHeavy ? 0.45 : 0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);

    const bloop = this.ctx.createOscillator();
    const bloopGain = this.ctx.createGain();
    bloop.type = 'sine';
    bloop.frequency.setValueAtTime(isHeavy ? 210 : 360, now + 0.05);
    bloop.frequency.exponentialRampToValueAtTime(isHeavy ? 520 : 780, now + 0.25);
    bloopGain.gain.setValueAtTime(0.28, now + 0.05);
    bloopGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    bloop.connect(bloopGain);
    bloopGain.connect(this.ctx.destination);
    bloop.start(now + 0.05);
    bloop.stop(now + 0.28);
  }

  // Бульбашки повітря під водою
  playBubble() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const startFreq = 350 + Math.random() * 250;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(startFreq * 2.1, now + 0.11);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }

  // Глухий удар об піщане дно
  playSandThud() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(115, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.22);
    gain.gain.setValueAtTime(0.38, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.24);
  }

  // Переможний акорд
  playSuccess() {
    this.init();
    const now = this.ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.09);
      gain.gain.setValueAtTime(0.22, now + i * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.09);
      osc.stop(now + i * 0.09 + 0.35);
    });
  }

  // Кумедний звук помилки
  playWrong() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.linearRampToValueAtTime(145, now + 0.28);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.32);
  }

  // Клік кнопки
  playPop() {
    this.init();
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(480, now);
    osc.frequency.exponentialRampToValueAtTime(820, now + 0.07);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.08);
  }
}

/* ============================================================================
   3. СТАН ГРИ, ФІЗИКА ТА ЕМОЦІЇ ЖАБЕНЯТИ
   ============================================================================ */
let currentIndex = 0;
let gameState = 'waiting'; // 'waiting' | 'dropping' | 'settled'
let itemX = 600;
let itemY = 185;
let itemVY = 0;
let itemRot = 0;
let swingPhase = 0;
let autoNextTimer = null;
let particles = [];

// Елементи DOM
const itemHolder = document.getElementById('item-holder');
const craneRope = document.getElementById('crane-rope');
const ropeClaw = document.getElementById('rope-claw');
const clawLeft = document.getElementById('claw-left');
const clawRight = document.getElementById('claw-right');
const fxLayer = document.getElementById('fx-layer');
const frogPupils = document.getElementById('frog-pupils');
const frogEyelids = document.getElementById('frog-eyelids');
const frogMouth = document.getElementById('frog-mouth');
const frogTongue = document.getElementById('frog-tongue');
const frogBodyGroup = document.getElementById('frog-body-group');

// Завантаження предмета за індексом
function loadItem(idx) {
  if (autoNextTimer) {
    clearTimeout(autoNextTimer);
    autoNextTimer = null;
  }

  currentIndex = (idx + ITEMS.length) % ITEMS.length;
  const item = ITEMS[currentIndex];

  gameState = 'waiting';
  itemX = 600;
  itemY = 182;
  itemVY = 0;
  itemRot = 0;

  // Зачиняємо дерев'яний тримач на мотузці
  clawLeft.setAttribute('d', 'M-4,0 Q-22,12 -14,28');
  clawRight.setAttribute('d', 'M4,0 Q22,12 14,28');
  craneRope.setAttribute('y2', '124');
  ropeClaw.setAttribute('transform', 'translate(600, 124)');

  itemHolder.innerHTML = item.svg;
  itemHolder.setAttribute('transform', `translate(${itemX}, ${itemY}) scale(1.15)`);

  particles = [];
  fxLayer.innerHTML = '';
  setFrogEmotion('idle');
}

// Зміна емоцій жабеняти
function setFrogEmotion(emotion) {
  if (emotion === 'idle') {
    frogMouth.setAttribute('d', 'M188,252 Q210,268 232,252');
    frogTongue.setAttribute('opacity', '0');
    frogBodyGroup.setAttribute('transform', 'translate(0, 0)');
  } else if (emotion === 'happy') {
    frogMouth.setAttribute('d', 'M182,248 Q210,278 238,248');
    frogTongue.setAttribute('opacity', '1');
    // Стрибок радості через чистий requestAnimationFrame, щоб не конфліктувати з SVG-атрибутами
    let jumpStart = performance.now();
    function jumpStep(now) {
      let t = (now - jumpStart) / 650;
      if (t < 1) {
        let dy = -Math.abs(Math.sin(t * Math.PI * 2)) * 26 * (1 - t * 0.4);
        frogBodyGroup.setAttribute('transform', `translate(0, ${dy.toFixed(1)})`);
        requestAnimationFrame(jumpStep);
      } else {
        frogBodyGroup.setAttribute('transform', 'translate(0, 0)');
      }
    }
    requestAnimationFrame(jumpStep);
  } else if (emotion === 'wrong') {
    frogMouth.setAttribute('d', 'M192,258 Q201,248 210,258 T228,258');
    frogTongue.setAttribute('opacity', '0');
    let shakeStart = performance.now();
    function shakeStep(now) {
      let t = (now - shakeStart) / 480;
      if (t < 1) {
        let dx = Math.sin(t * Math.PI * 6) * 10 * (1 - t);
        frogBodyGroup.setAttribute('transform', `translate(${dx.toFixed(1)}, 0)`);
        requestAnimationFrame(shakeStep);
      } else {
        frogBodyGroup.setAttribute('transform', 'translate(0, 0)');
        if (gameState === 'waiting') setFrogEmotion('idle');
      }
    }
    requestAnimationFrame(shakeStep);
  }
}

// Генерація бризок води та кіл
function spawnWaterSplash(x, y, isHeavy) {
  const dropCount = isHeavy ? 18 : 12;
  for (let i = 0; i < dropCount; i++) {
    const angle = -Math.PI * (0.15 + Math.random() * 0.7);
    const speed = (isHeavy ? 6 : 4) + Math.random() * 7;
    particles.push({
      type: 'drop',
      x: x + (Math.random() - 0.5) * 30,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 3.5 + Math.random() * 4.5,
      alpha: 0.9
    });
  }

  for (let j = 0; j < 2; j++) {
    particles.push({
      type: 'ripple',
      x: x,
      y: y + 4,
      rx: 18 + j * 15,
      ry: 5 + j * 3,
      alpha: 0.85
    });
  }
}

// Генерація бульбашок
function spawnBubble(x, y) {
  particles.push({
    type: 'bubble',
    x: x + (Math.random() - 0.5) * 36,
    y: y,
    vx: (Math.random() - 0.5) * 0.8,
    vy: -2.2 - Math.random() * 2.2,
    r: 3 + Math.random() * 5.5,
    alpha: 0.85
  });
}

// Генерація зірочок при правильній відповіді
function spawnCelebrationStars(x, y) {
  const colors = ['#ffd166', '#06d6a0', '#ff70a6', '#ffffff', '#ffbe0b'];
  for (let i = 0; i < 16; i++) {
    const angle = (Math.PI * 2 * i) / 16 + Math.random() * 0.3;
    const speed = 3 + Math.random() * 5.5;
    particles.push({
      type: 'star',
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      size: 7 + Math.random() * 6,
      color: colors[i % colors.length],
      alpha: 1,
      rot: Math.random() * 360
    });
  }
}

// Анімація кнопки без зміни її позиції
function triggerButtonAnim(btnElement, animClass) {
  btnElement.classList.remove('shake-anim', 'pop-anim');
  void btnElement.offsetWidth; // Перезапуск CSS-анімації
  btnElement.classList.add(animClass);
}

// Перевірка вибору дитини
function handleGuess(guessFloats, btnElement) {
  if (gameState !== 'waiting') return;

  const item = ITEMS[currentIndex];

  if (guessFloats === item.floats) {
    // ПРАВИЛЬНО
    gameState = 'dropping';
    item.splashed = false;

    clawLeft.setAttribute('d', 'M-6,0 Q-34,6 -32,24');
    clawRight.setAttribute('d', 'M6,0 Q34,6 32,24');

    sfx.playPop();
    setFrogEmotion('happy');
    triggerButtonAnim(btnElement, 'pop-anim');
  } else {
    // НЕПРАВИЛЬНО
    sfx.playWrong();
    setFrogEmotion('wrong');
    triggerButtonAnim(btnElement, 'shake-anim');

    setTimeout(() => {
      sfx.playMaterialHint(item.mat);
    }, 180);
  }
}

/* ============================================================================
   4. ГОЛОВНИЙ ЦИКЛ АНІМАЦІЇ (60 FPS)
   ============================================================================ */
let fish1X = 300;
let fish2X = 850;
const fish1El = document.getElementById('fish-1');
const fish2El = document.getElementById('fish-2');

function animateScene() {
  swingPhase += 0.045;
  const item = ITEMS[currentIndex];

  // Рух фонових рибок
  fish1X += 0.7;
  if (fish1X > 1300) fish1X = -100;
  fish1El.setAttribute('transform', `translate(${fish1X}, ${440 + Math.sin(swingPhase) * 8})`);

  fish2X -= 0.55;
  if (fish2X < -100) fish2X = 1300;
  fish2El.setAttribute('transform', `translate(${fish2X}, ${520 + Math.cos(swingPhase * 0.8) * 6}) scale(-0.85, 0.85)`);

  // Фізика предмета
  if (gameState === 'waiting') {
    const swayX = Math.sin(swingPhase) * 6;
    const swayRot = Math.sin(swingPhase) * 3.5;
    itemX = 600 + swayX;
    itemY = 182 + Math.cos(swingPhase * 2) * 2;

    craneRope.setAttribute('x2', 600 + swayX * 0.6);
    ropeClaw.setAttribute('transform', `translate(${600 + swayX * 0.6}, 124) rotate(${swayRot * 0.5})`);
    itemHolder.setAttribute('transform', `translate(${itemX}, ${itemY}) rotate(${swayRot}) scale(1.15)`);

  } else if (gameState === 'dropping') {
    const waterSurfaceY = 308;

    if (itemY < waterSurfaceY) {
      itemVY += 0.68;
      itemY += itemVY;
      itemRot += 0.6;
    } else {
      if (!item.splashed) {
        item.splashed = true;
        sfx.playSplash(!item.floats);
        spawnWaterSplash(itemX, waterSurfaceY, !item.floats);
      }

      if (item.floats) {
        // Плавання на поверхні
        const targetY = waterSurfaceY + (item.floatOffset || 0);
        const displacement = targetY - itemY;
        itemVY = itemVY * 0.82 + displacement * 0.12;
        itemY += itemVY;
        itemRot = Math.sin(swingPhase * 1.6) * 7;

        if (Math.abs(itemVY) < 0.35 && Math.abs(displacement) < 4) {
          gameState = 'settled';
          sfx.playSuccess();
          spawnCelebrationStars(itemX, waterSurfaceY - 20);
          autoNextTimer = setTimeout(() => loadItem(currentIndex + 1), 2500);
        }
      } else {
        // Занурення на піщане дно
        const bottomY = 618;
        itemVY = Math.min(itemVY * 0.92 + 0.28, 4.8);
        itemY += itemVY;
        itemX += Math.sin(itemY * 0.05) * 1.1;
        itemRot += 0.9;

        if (Math.random() < 0.38) {
          spawnBubble(itemX, itemY - 10);
          if (Math.random() < 0.25) sfx.playBubble();
        }

        if (itemY >= bottomY) {
          itemY = bottomY;
          gameState = 'settled';
          sfx.playSandThud();
          sfx.playSuccess();
          spawnCelebrationStars(itemX, itemY - 30);
          for (let b = 0; b < 6; b++) spawnBubble(itemX, itemY - 12);
          autoNextTimer = setTimeout(() => loadItem(currentIndex + 1), 2500);
        }
      }
    }

    itemHolder.setAttribute('transform', `translate(${itemX}, ${itemY}) rotate(${itemRot}) scale(1.15)`);

  } else if (gameState === 'settled') {
    if (item.floats) {
      const waterSurfaceY = 308 + (item.floatOffset || 0);
      const bobY = waterSurfaceY + Math.sin(swingPhase * 1.8) * 5;
      const bobRot = Math.cos(swingPhase * 1.5) * 6;
      itemHolder.setAttribute('transform', `translate(${itemX}, ${bobY}) rotate(${bobRot}) scale(1.15)`);
    }
  }

  // Оновлення частинок
  let fxHtml = '';
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    if (p.type === 'drop') {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.42;
      p.alpha -= 0.022;
      if (p.alpha <= 0 || p.y > 335) {
        particles.splice(i, 1);
        continue;
      }
      fxHtml += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r}" fill="#caf0f8" opacity="${p.alpha.toFixed(2)}"/>`;

    } else if (p.type === 'ripple') {
      p.rx += 2.2;
      p.ry += 0.45;
      p.alpha -= 0.025;
      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }
      fxHtml += `<ellipse cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" rx="${p.rx.toFixed(1)}" ry="${p.ry.toFixed(1)}" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="${p.alpha.toFixed(2)}"/>`;

    } else if (p.type === 'bubble') {
      p.x += p.vx + Math.sin(swingPhase * 2 + i) * 0.4;
      p.y += p.vy;
      p.alpha -= 0.012;
      if (p.y <= 310 || p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }
      fxHtml += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r}" fill="#caf0f8" fill-opacity="0.35" stroke="#ffffff" stroke-width="1.5" opacity="${p.alpha.toFixed(2)}"/>`;

    } else if (p.type === 'star') {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.rot += 5;
      p.alpha -= 0.02;
      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }
      fxHtml += `<g transform="translate(${p.x.toFixed(1)}, ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(0)})" opacity="${p.alpha.toFixed(2)}">
        <polygon points="0,-${p.size} ${p.size*0.3},-${p.size*0.3} ${p.size},0 ${p.size*0.3},${p.size*0.3} 0,${p.size} -${p.size*0.3},${p.size*0.3} -${p.size},0 -${p.size*0.3},-${p.size*0.3}" fill="${p.color}"/>
      </g>`;
    }
  }
  fxLayer.innerHTML = fxHtml;

  // Очі жабеняти стежать за предметом
  const dx = Math.max(-5, Math.min(5, (itemX - 210) * 0.012));
  const dy = Math.max(-4, Math.min(5, (itemY - 218) * 0.015));
  frogPupils.setAttribute('transform', `translate(${dx.toFixed(1)}, ${dy.toFixed(1)})`);

  requestAnimationFrame(animateScene);
}

// Кліпання очима жабеняти
setInterval(() => {
  frogEyelids.setAttribute('opacity', '1');
  setTimeout(() => frogEyelids.setAttribute('opacity', '0'), 150);
}, 3600);

/* ============================================================================
   5. ОБРОБНИКИ ПОДІЙ
   ============================================================================ */
document.getElementById('btn-float').addEventListener('click', function() {
  handleGuess(true, this);
});

document.getElementById('btn-sink').addEventListener('click', function() {
  handleGuess(false, this);
});

// Натискання на предмет відтворює звук матеріалу
itemHolder.addEventListener('click', () => {
  const item = ITEMS[currentIndex];
  sfx.playMaterialHint(item.mat);
});

// Навігація Назад та Далі
document.getElementById('btn-prev').addEventListener('click', function() {
  sfx.playPop();
  triggerButtonAnim(this, 'pop-anim');
  loadItem(currentIndex - 1);
});

document.getElementById('btn-next').addEventListener('click', function() {
  sfx.playPop();
  triggerButtonAnim(this, 'pop-anim');
  loadItem(currentIndex + 1);
});

// Запуск гри
loadItem(0);
requestAnimationFrame(animateScene);
</script>
