<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Що з чого зроблено</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #231208;
      font-family: 'Rubik', sans-serif;
    }

    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 400;
    }

    #top-hud {
      position: fixed;
      top: 14px;
      right: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-btn {
      position: relative;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      outline: none;
      filter: drop-shadow(0 6px 10px rgba(15, 6, 2, 0.65));
    }

    .hud-btn-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 54px;
      padding: 0 20px;
      border-radius: 16px;
      background: linear-gradient(180deg, #9a5b30 0%, #6b3817 55%, #47220b 100%);
      border: 4px solid #f59e0b;
      box-shadow: inset 0 2px 4px rgba(254, 240, 138, 0.45), inset 0 -4px 6px rgba(20, 8, 2, 0.7);
      color: #fef3c7;
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 0 #291205, 0 -1px 0 #291205, 2px 0 0 #291205, -2px 0 0 #291205;
      pointer-events: none;
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.16s ease;
    }

    .hud-btn-icon .hud-btn-inner {
      width: 58px;
      padding: 0;
    }

    .hud-btn:hover .hud-btn-inner {
      transform: translateY(-3px) scale(1.05);
      filter: brightness(1.1);
    }

    .hud-btn:active .hud-btn-inner {
      transform: translateY(1px) scale(0.95);
    }

    #sticker-dock {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.8vw, 24px);
      padding: 12px 24px 14px;
      border-radius: 26px;
      background: linear-gradient(180deg, #6e3a19 0%, #4a240d 65%, #2e1506 100%);
      border: 4px solid #b46934;
      box-shadow:
        0 14px 28px rgba(10, 4, 1, 0.75),
        inset 0 2px 6px rgba(253, 224, 71, 0.25),
        inset 0 -6px 12px rgba(15, 6, 2, 0.8);
      max-width: 96vw;
    }

    #sticker-dock::before,
    #sticker-dock::after {
      content: '';
      position: absolute;
      top: 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #d97706 65%, #78350f 100%);
      border: 1.5px solid #3b1906;
      pointer-events: none;
    }
    #sticker-dock::before { left: 10px; }
    #sticker-dock::after { right: 10px; }

    .sticker-slot {
      position: relative;
      width: clamp(175px, 20vw, 265px);
      height: clamp(74px, 8.8vh, 98px);
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      outline: none;
      display: block;
      flex-shrink: 0;
    }

    .sticker-visual {
      width: 100%;
      height: 100%;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
      filter: drop-shadow(0 6px 8px rgba(15, 6, 2, 0.55));
    }

    .sticker-slot:hover .sticker-visual {
      transform: translateY(-5px) scale(1.03);
      filter: drop-shadow(0 12px 14px rgba(15, 6, 2, 0.68)) brightness(1.06);
    }

    .sticker-slot:active .sticker-visual {
      transform: translateY(1px) scale(0.96);
    }

    @keyframes idleHandsBreath {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes wrongWobble {
      0%, 100% { transform: translateX(0px) rotate(0deg); }
      18% { transform: translateX(-16px) rotate(-5deg); }
      36% { transform: translateX(15px) rotate(4.5deg); }
      54% { transform: translateX(-11px) rotate(-3deg); }
      72% { transform: translateX(8px) rotate(2deg); }
    }

    @keyframes correctBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.08) rotate(-1.5deg); }
      70% { transform: scale(0.97) rotate(1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes boxShakeRummage {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-4px, 2px); }
      50% { transform: translate(5px, -2px); }
      75% { transform: translate(-4px, -1px); }
    }

    .hands-idle {
      animation: idleHandsBreath 3.2s ease-in-out infinite;
    }

    .item-wrong {
      animation: wrongWobble 0.52s ease-in-out;
    }

    .item-correct {
      animation: correctBounce 0.46s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .box-rummage {
      animation: boxShakeRummage 0.35s ease-in-out infinite;
    }

    #left-hand-mover,
    #right-hand-mover,
    #active-item-mover {
      transition: transform 0.38s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
  </style>
</head>

    /* 4. STICKER SVG BUILDER */
    function buildAppliedStickerSVG(material) {
      const label = LANGUAGES[currentLang].stickers[material];
      const gradMap = { glass: 'url(#stickerGlassGrad)', paper: 'url(#stickerPaperGrad)', metal: 'url(#stickerMetalGrad)', plastic: 'url(#stickerPlasticGrad)' };
      const strokeMap = { glass: '#083344', paper: '#451a03', metal: '#0f172a', plastic: '#500724' };
      return `
        <g transform="rotate(-6) scale(0.78)" filter="url(#softShadow)">
          <path d="M-110 -44 L92 -44 Q112 -44 112 -24 L112 18 L86 44 L-110 44 Q-130 44 -130 24 L-130 -24 Q-130 -44 -110 -44 Z" fill="${gradMap[material]}" stroke="#fef3c7" stroke-width="4" />
          <path d="M-104 -34 L88 -34 Q100 -34 100 -22 L100 14 L80 34 L-104 34 Q-118 34 -118 20 L-118 -22 Q-118 -34 -104 -34 Z" fill="none" stroke="#fef3c7" stroke-width="2" stroke-dasharray="6,5" opacity="0.8" />
          <text x="-10" y="12" text-anchor="middle" fill="#ffffff" font-family="Rubik, sans-serif" font-size="32" font-weight="900" letter-spacing="1.5" stroke="${strokeMap[material]}" stroke-width="6" paint-order="stroke">${label}</text>
          <path d="M112 18 L86 44 L82 14 Q98 18 112 18 Z" fill="#f59e0b" stroke="#fef3c7" stroke-width="2" stroke-linejoin="round" />
        </g>`;
    }

    /* 5. CANVAS FX */
    const fxCanvas = document.getElementById('fx-canvas');
    const fxCtx = fxCanvas.getContext('2d');
    function resizeCanvas() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    const dustMotes = Array.from({ length: 38 }, () => ({
      x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight * 0.82,
      r: 1.4 + Math.random() * 2.5, vx: -0.15 + Math.random() * 0.3, vy: -0.2 + Math.random() * 0.4,
      alpha: 0.22 + Math.random() * 0.5, phase: Math.random() * Math.PI * 2
    }));
    const activeParticles = [];
    const flyingStickers = [];
    let celebrationCounter = 0;

    function svgToScreen(svgX, svgY) {
      const rect = fxCanvas.getBoundingClientRect();
      const scale = Math.max(rect.width / 1920, rect.height / 1080);
      const offsetX = (rect.width - 1920 * scale) / 2;
      const offsetY = (rect.height - 1080 * scale) / 2;
      return { x: svgX * scale + offsetX, y: svgY * scale + offsetY, scale };
    }

    function spawnBoxPaperShreds() {
      const origin = svgToScreen(960, 575);
      const colors = ['#fbbf24', '#38bdf8', '#f472b6', '#4ade80', '#fb923c'];
      const baseIndex = currentItemIndex;
      for (let i = 0; i < 20; i++) {
        const step = i / 19;
        const angle = -Math.PI * 0.85 + step * Math.PI * 0.7;
        const speed = (6 + (i % 5) * 2) * origin.scale;
        activeParticles.push({
          type: 'shred',
          x: origin.x + (i - 9.5) * 16 * origin.scale,
          y: origin.y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2 * origin.scale,
          gravity: 0.42 * origin.scale,
          rot: step * Math.PI * 2, vRot: 0.05 + (i % 3) * 0.02,
          len: (16 + (i % 4) * 4) * origin.scale,
          color: colors[(baseIndex + i) % colors.length],
          life: 1, decay: 0.024
        });
      }
    }

    function triggerWordlessCelebration(material) {
      const center = svgToScreen(960, 350);
      celebrationCounter++;
      const palettes = {
        glass: ['#67e8f9', '#22d3ee', '#bae6fd', '#fde047'],
        paper: ['#fde047', '#fbbf24', '#f59e0b', '#fef3c7'],
        metal: ['#e2e8f0', '#94a3b8', '#38bdf8', '#fbbf24'],
        plastic: ['#f472b6', '#ec4899', '#a855f7', '#22d3ee']
      };
      const palette = palettes[material] || palettes.glass;
      for (let r = 0; r < 2; r++) {
        activeParticles.push({
          type: 'ring', x: center.x, y: center.y,
          radius: (30 + r * 35) * center.scale, maxRadius: (340 + r * 80) * center.scale,
          color: palette[r % palette.length], life: 1, decay: 0.028
        });
      }
      for (let i = 0; i < 52; i++) {
        const angle = (Math.PI * 2 * i) / 52;
        const speed = (5 + (i % 7) * 2) * center.scale;
        activeParticles.push({
          type: i % 2 === 0 ? 'star' : 'orb', x: center.x, y: center.y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          gravity: 0.16 * center.scale,
          size: (9 + (i % 5) * 2.2) * center.scale,
          rot: angle, vRot: 0.02 + (i % 4) * 0.01,
          color: palette[i % palette.length], life: 1, decay: 0.017 + (i % 3) * 0.004
        });
      }
    }

    function spawnBouncingWrongSticker(material) {
      const center = svgToScreen(960, 350);
      const colors = { glass: '#06b6d4', paper: '#f59e0b', metal: '#64748b', plastic: '#db2777' };
      const dir = (currentItemIndex % 2 === 0) ? 1 : -1;
      flyingStickers.push({
        x: center.x, y: center.y,
        vx: dir * (7 + (currentItemIndex % 5)) * center.scale, vy: -10 * center.scale,
        gravity: 0.65 * center.scale,
        rot: -0.2, vRot: dir * (0.2 + (currentItemIndex % 3) * 0.03),
        scale: center.scale,
        color: colors[material], label: LANGUAGES[currentLang].stickers[material],
        curl: 0.1, life: 1
      });
    }

    function drawFourPointStar(ctx, x, y, size, rot, color, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.globalAlpha = Math.max(0, alpha); ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const r = i % 2 === 0 ? size : size * 0.38;
        const a = (i * Math.PI) / 4;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    function animateFX() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      dustMotes.forEach(m => {
        m.phase += 0.025; m.x += m.vx + Math.sin(m.phase) * 0.2; m.y += m.vy;
        if (m.x < 0) m.x = fxCanvas.width;
        if (m.x > fxCanvas.width) m.x = 0;
        if (m.y < 0) m.y = fxCanvas.height * 0.82;
        if (m.y > fxCanvas.height * 0.82) m.y = 0;
        fxCtx.save(); fxCtx.globalAlpha = m.alpha * (0.65 + 0.35 * Math.sin(m.phase));
        fxCtx.fillStyle = '#fef08a'; fxCtx.beginPath(); fxCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2); fxCtx.fill(); fxCtx.restore();
      });
      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i]; p.life -= p.decay;
        if (p.life <= 0) { activeParticles.splice(i, 1); continue; }
        if (p.type === 'ring') {
          p.radius += (p.maxRadius - p.radius) * 0.11;
          fxCtx.save(); fxCtx.globalAlpha = p.life * 0.75; fxCtx.strokeStyle = p.color; fxCtx.lineWidth = 6 * p.life;
          fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); fxCtx.stroke(); fxCtx.restore();
        } else if (p.type === 'star') {
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.rot += p.vRot;
          drawFourPointStar(fxCtx, p.x, p.y, p.size * p.life, p.rot, p.color, p.life);
        } else if (p.type === 'orb') {
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
          fxCtx.save(); fxCtx.globalAlpha = p.life; fxCtx.fillStyle = p.color;
          fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); fxCtx.fill(); fxCtx.restore();
        } else if (p.type === 'shred') {
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.rot += p.vRot;
          fxCtx.save(); fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
          fxCtx.globalAlpha = p.life; fxCtx.strokeStyle = p.color; fxCtx.lineWidth = 5; fxCtx.lineCap = 'round';
          fxCtx.beginPath(); fxCtx.moveTo(-p.len / 2, 0);
          fxCtx.quadraticCurveTo(0, -p.len * 0.35, p.len / 2, 0); fxCtx.stroke(); fxCtx.restore();
        }
      }
      for (let i = flyingStickers.length - 1; i >= 0; i--) {
        const s = flyingStickers[i];
        s.x += s.vx; s.y += s.vy; s.vy += s.gravity; s.rot += s.vRot;
        s.curl = Math.min(0.65, s.curl + 0.04); s.life -= 0.022;
        if (s.life <= 0 || s.y > fxCanvas.height + 120) { flyingStickers.splice(i, 1); continue; }
        fxCtx.save(); fxCtx.translate(s.x, s.y); fxCtx.rotate(s.rot);
        fxCtx.scale(s.scale * (1 - s.curl * 0.3), s.scale);
        fxCtx.globalAlpha = Math.min(1, s.life * 1.4);
        fxCtx.fillStyle = s.color; fxCtx.strokeStyle = '#fef3c7'; fxCtx.lineWidth = 4;
        fxCtx.beginPath(); fxCtx.roundRect(-85, -34, 170, 68, 16); fxCtx.fill(); fxCtx.stroke();
        fxCtx.font = '900 24px Rubik, sans-serif'; fxCtx.textAlign = 'center'; fxCtx.textBaseline = 'middle';
        fxCtx.lineWidth = 6; fxCtx.strokeStyle = '#1c0d04'; fxCtx.strokeText(s.label, 0, 0);
        fxCtx.fillStyle = '#ffffff'; fxCtx.fillText(s.label, 0, 0);
        fxCtx.restore();
      }
      requestAnimationFrame(animateFX);
    }
    animateFX();

    /* ============================================================
       6. GAME STATE — ВИПАДКОВИЙ ПОРЯДОК ПРЕДМЕТІВ
       ============================================================
       При завантаженні створюється випадкова перестановка індексів
       0..19 (Fisher–Yates). Кнопки «вперед»/«назад» рухаються по цій
       перестановці, тому предмети показуються у випадковому порядку.
       Стан «вирішено» зберігається за ОРИГІНАЛЬНИМ індексом, тому
       наліпки не злітають при навігації.
       ============================================================ */
    function shuffle(array) {
      const a = array.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    const itemOrder = shuffle([...Array(20).keys()]);
    let currentOrderPos = 0;
    let currentItemIndex = itemOrder[currentOrderPos]; // випадковий перший предмет
    const solvedSet = new Set();
    let isAnimating = false;

    const DOM = {
      activeItemInner: document.getElementById('active-item-inner'),
      appliedStickerSlot: document.getElementById('applied-sticker-slot'),
      activeItemMover: document.getElementById('active-item-mover'),
      activeItemWrapper: document.getElementById('active-item-wrapper'),
      rightHandHeldSticker: document.getElementById('right-hand-held-sticker'),
      rightHandMover: document.getElementById('right-hand-mover'),
      rivetsGroup: document.getElementById('rivets-20-group'),
      langBtnLabel: document.getElementById('lang-btn-label'),
      langBtn: document.getElementById('lang-btn'),
      prevBtn: document.getElementById('prev-btn'),
      nextBtn: document.getElementById('next-btn')
    };

    function renderRivets() {
      let html = '';
      for (let i = 0; i < 20; i++) {
        const x = -285 + i * 30;
        const done = solvedSet.has(i);
        html += `<circle cx="${x}" cy="0" r="9" fill="${done ? '#fbbf24' : '#3d200d'}" stroke="${done ? '#fef08a' : '#78350f'}" stroke-width="2.5" />`;
        if (done) html += `<circle cx="${x - 2}" cy="-2" r="3.5" fill="#fef08a" opacity="0.9" />`;
      }
      DOM.rivetsGroup.innerHTML = html;
    }

    function loadItem() {
      const item = ITEMS_CATALOG[currentItemIndex];
      DOM.activeItemInner.innerHTML = item.renderSVG();
      DOM.appliedStickerSlot.innerHTML = solvedSet.has(currentItemIndex) ? buildAppliedStickerSVG(item.material) : '';
      renderRivets();
    }

    function updateLanguageUI() {
      const lang = LANGUAGES[currentLang];
      DOM.langBtnLabel.textContent = lang.btn;
      ['glass', 'paper', 'metal', 'plastic'].forEach(mat => {
        const el = document.getElementById(`dock-label-${mat}`);
        if (el) el.textContent = lang.stickers[mat];
      });
    }

    function animateStickerApplication(material) {
      if (isAnimating) return;
      if (solvedSet.has(currentItemIndex)) return;
      const item = ITEMS_CATALOG[currentItemIndex];
      isAnimating = true;

      sound.playStickerPeelAndSlap();
      sound.playBoxRummage();

      DOM.rightHandHeldSticker.innerHTML = buildAppliedStickerSVG(material);
      DOM.rightHandHeldSticker.style.opacity = '1';
      DOM.rightHandMover.style.transform = 'translate(-90px, -25px)';

      setTimeout(() => {
        const isCorrect = item.material === material;
        if (isCorrect) {
          sound.playMaterialSound(material);
          sound.playCelebrationFanfare(celebrationCounter);
          triggerWordlessCelebration(material);
          DOM.appliedStickerSlot.innerHTML = buildAppliedStickerSVG(material);
          DOM.activeItemMover.classList.add('item-correct');
          solvedSet.add(currentItemIndex);
          renderRivets();
          setTimeout(() => DOM.activeItemMover.classList.remove('item-correct'), 500);
        } else {
          sound.playWrongBoing();
          spawnBoxPaperShreds();
          spawnBouncingWrongSticker(material);
          DOM.activeItemMover.classList.add('item-wrong');
          setTimeout(() => DOM.activeItemMover.classList.remove('item-wrong'), 560);
        }
        DOM.rightHandHeldSticker.style.opacity = '0';
        setTimeout(() => {
          DOM.rightHandMover.style.transform = 'translate(0, 0)';
          DOM.rightHandHeldSticker.innerHTML = '';
          isAnimating = false;
        }, 450);
      }, 420);
    }

    /* 7. EVENT LISTENERS */
    document.querySelectorAll('.sticker-slot').forEach(slot => {
      slot.addEventListener('click', () => {
        sound.init();
        const mat = slot.getAttribute('data-material');
        if (mat) animateStickerApplication(mat);
      });
    });

    DOM.langBtn.addEventListener('click', () => {
      sound.playClick();
      currentLang = currentLang === 'uk' ? 'ru' : 'uk';
      updateLanguageUI();
      if (solvedSet.has(currentItemIndex)) {
        DOM.appliedStickerSlot.innerHTML = buildAppliedStickerSVG(ITEMS_CATALOG[currentItemIndex].material);
      }
    });

    /* «Назад» / «Вперед» тепер крокують по ВИПАДКОВІЙ перестановці itemOrder */
    DOM.prevBtn.addEventListener('click', () => {
      sound.playClick();
      currentOrderPos = (currentOrderPos - 1 + 20) % 20;
      currentItemIndex = itemOrder[currentOrderPos];
      loadItem();
    });

    DOM.nextBtn.addEventListener('click', () => {
      sound.playClick();
      currentOrderPos = (currentOrderPos + 1) % 20;
      currentItemIndex = itemOrder[currentOrderPos];
      loadItem();
    });

    document.getElementById('desk-lamp').addEventListener('click', () => {
      sound.playClick();
      const cone = document.getElementById('lamp-cone');
      const glow = document.getElementById('lamp-bulb-glow');
      const visible = cone.style.opacity !== '0';
      cone.style.transition = 'opacity 0.3s';
      glow.style.transition = 'opacity 0.3s';
      cone.style.opacity = visible ? '0' : '1';
      glow.style.opacity = visible ? '0.2' : '1';
    });

    document.getElementById('window-cat').addEventListener('click', () => { sound.playCatPurr(); });
    DOM.activeItemWrapper.addEventListener('click', () => { sound.init(); sound.playClick(); });

    /* 8. INIT */
    loadItem();
    updateLanguageUI();
  </script>
</body>
</html>
