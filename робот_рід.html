<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Версія гри: v6.0 (Perfect Layout, Editor Removed, Full Master Rules) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
            transition: background-image 0.5s ease;
        }

        #font-controls { position: fixed; top: 15px; left: 15px; z-index: 1000; display: flex; gap: 10px; }
        .font-btn { background: rgba(10, 20, 40, 0.9); border: 2px solid #00f3ff; color: #fff; padding: 5px 15px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 0 10px rgba(0,243,255,0.5); }
        .font-btn:active { transform: scale(0.9); }

        #admin-panel { position: fixed; top: 15px; left: 130px; z-index: 1000; display: flex; gap: 5px; align-items: center; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 8px; border: 1px solid #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.3); }
        .secret-input { background: rgba(255,255,255,0.1); border: 1px solid #00f3ff; border-radius: 5px; padding: 5px; outline: none; width: 120px; color: #fff; }
        .secret-input.hidden-text { color: transparent; text-shadow: 0 0 0 transparent; selection-color: transparent; }
        .secret-input.hidden-text::selection { background: transparent; color: transparent; }
        .toggle-visibility-btn { background: #222; color: #00f3ff; border: 1px solid #00f3ff; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .toggle-visibility-btn:hover { background: #00f3ff; color: #000; }

        .modal-overlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-width: 700px; background: rgba(10, 15, 30, 0.98); border: 4px solid #ff00ff; border-radius: 8px; padding: 20px; z-index: 10005; box-shadow: 0 0 40px rgba(255,0,255,0.7); font-family: Arial, sans-serif; color: #fff; }
        .modal-overlay h3 { margin-top: 0; text-align: center; text-shadow: 0 0 10px #ff00ff; }
        .modal-overlay p.hint { font-size: 13px; margin-bottom: 8px; color: #00f3ff; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px; }
        .modal-textarea { width: 100%; height: 300px; background: rgba(0,0,0,0.8); color: #00f3ff; border: 1px solid #ff00ff; font-family: monospace; padding: 10px; border-radius: 5px; box-sizing: border-box; font-size: 14px; resize: vertical; white-space: pre; }
        .admin-modal-btns { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .admin-modal-btns button { background: #ff00ff; color: white; border: 2px solid #cc00cc; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 0 15px #ff00ff; }
        .admin-modal-btns button.cancel { background: #333; border-color: #555; box-shadow: none; color: #fff; }

        #questionModal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: linear-gradient(135deg, #0a0a2a 0%, #000010 100%); padding: 40px; border-radius: 10px; box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 30px rgba(0,243,255,0.6); border: 8px solid #00f3ff; z-index: 2000; text-align: center; opacity: 0; transition: opacity 0.5s, transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3); width: 500px; max-width: 90vw; }
        #questionModal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #qText { color: #fff; font-size: 26px; line-height: 1.5; text-shadow: 0 0 10px #00f3ff; margin-top: 0; margin-bottom: 25px; background: rgba(0, 243, 255, 0.1); padding: 20px; border-radius: 5px; border-top: 2px solid #00f3ff; border-bottom: 2px solid #00f3ff; font-weight: bold; }
        .options-container { display: flex; flex-direction: column; gap: 15px; }
        .opt-btn { background: linear-gradient(to bottom, #111, #333); border: 2px solid #ff00ff; color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 10px rgba(255,0,255,0.5); transition: all 0.2s; text-shadow: 0 0 5px #ff00ff; }
        .opt-btn:hover { background: #222; box-shadow: 0 0 20px rgba(255,0,255,0.8); }
        .opt-btn:active { transform: translateY(4px); box-shadow: 0 0 5px rgba(255,0,255,0.8); }

        #gameCanvas { display: block; width: 100vw; height: 100vh; background: transparent; }

        #mobileControls { position: fixed; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 1000; pointer-events: none; }
        #mobileControls .dpad { display: flex; gap: 10px; }
        #mobileControls .action-pad { margin-right: 80px; }
        #mobileControls button { width: 65px; height: 65px; border-radius: 35px; background: rgba(0, 0, 0, 0.7); border: 2px solid #00f3ff; color: #00f3ff; font-size: 24px; pointer-events: auto; user-select: none; touch-action: manipulation; box-shadow: 0 0 15px rgba(0,243,255,0.5); display: flex; align-items: center; justify-content: center; }
        #mobileControls button:active { background: rgba(0, 243, 255, 0.3); transform: translateY(3px); }
        #mobileControls .jump-btn { width: 90px; height: 90px; border-radius: 45px; font-size: 16px; font-weight: bold; border: 2px solid #ff00ff; color: #ff00ff; box-shadow: 0 0 15px rgba(255,0,255,0.5); }
        #mobileControls .jump-btn:active { background: rgba(255, 0, 255, 0.3); }
        @media (min-width: 1400px) { #mobileControls { display: none; } }
        @media (max-width: 768px) { #mobileControls .action-pad { margin-right: 60px; } }

        /* Theme Manager */
        #theme-btn { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: rgba(10, 20, 30, 0.9); color: #00f3ff; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 9999; box-shadow: 0 0 15px rgba(0,243,255,0.5); border: 2px solid #00f3ff; transition: transform 0.2s; }
        #theme-btn:hover { transform: scale(1.1); }
        #theme-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-width: 700px; background: rgba(5, 10, 20, 0.98); border: 4px solid #00f3ff; border-radius: 8px; padding: 20px; z-index: 10000; box-shadow: 0 0 40px rgba(0,243,255,0.8); font-family: Arial, sans-serif; }
        #theme-modal h3 { color: #fff; margin-top: 0; text-align: center; text-shadow: 0 0 10px #00f3ff; }
        #theme-close { position: absolute; top: 10px; right: 15px; color: #fff; font-size: 24px; cursor: pointer; }
        #theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; max-height: 60vh; overflow-y: auto; padding: 10px 0; }
        .theme-item { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 5px; cursor: pointer; overflow: hidden; border: 2px solid #555; transition: all 0.2s; background: #000; }
        .theme-item:hover { border-color: #00f3ff; box-shadow: 0 0 15px #00f3ff; transform: scale(1.05); }
        .theme-item img { width: 100%; height: 100%; object-fit: cover; }
        .theme-item span { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); color: #fff; text-align: center; font-size: 14px; padding: 5px 0; font-weight: bold; }

        /* Малювання (Фіолетова кнопка) */
        #global-draw-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 90000; }
        #toggle-draw-btn-global { position: fixed; bottom: 85px; right: 20px; width: 50px; height: 50px; background: #8e44ad; color: #fff; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 90001; box-shadow: 0 0 15px rgba(142,68,173,0.8); border: 2px solid #fff; }
        #draw-panel-global { display: none; position: fixed; top: 20px; right: 20px; background: rgba(10, 10, 20, 0.95); border: 2px solid #00f3ff; border-radius: 8px; padding: 10px; z-index: 90002; flex-direction: column; gap: 10px; box-shadow: 0 0 30px rgba(0,243,255,0.5); width: 150px; touch-action: none; }
        .draw-handle { background: #333; height: 15px; border-radius: 4px; cursor: grab; margin-bottom: 5px; }
        .draw-btn-row { display: flex; gap: 5px; }
        .draw-btn-row button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .active-tool { background: #00f3ff; color: black; box-shadow: 0 0 10px #00f3ff; }
        .inactive-tool { background: #333; color: white; }
        #draw-color { width: 100%; height: 30px; border: none; cursor: pointer; border-radius: 4px; }
        #draw-size { width: 100%; }
        #draw-clear-btn { background: #ff00ff; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; box-shadow: 0 0 10px #ff00ff; }
        #draw-close { position: absolute; top: -10px; right: -10px; background: #fff; color: #000; width: 25px; height: 25px; border-radius: 15px; text-align: center; line-height: 25px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>

    <div id="font-controls">
        <button class="font-btn" onclick="adjustFontSize(2)">А+</button>
        <button class="font-btn" onclick="adjustFontSize(-2)">А-</button>
    </div>

    <!-- Секретна панель вчителя -->
    <div id="admin-panel">
        <input type="text" class="secret-input hidden-text" id="secret-word" placeholder="Секретне слово">
        <button class="toggle-visibility-btn" onclick="toggleSecretVisibility()">👁️</button>
        <button class="toggle-visibility-btn" onclick="openAdminQuestions()">📝 Питання</button>
    </div>

    <!-- Вікно редагування питань -->
    <div id="admin-questions-modal" class="modal-overlay">
        <h3>Редагувати питання (Текст)</h3>
        <p class="hint">Формат: Питання ; Правильна відповідь ; Неправильна 1 ; Неправильна 2 | Наступне питання ; ...</p>
        <textarea id="admin-questions-text" class="modal-textarea" placeholder="Приклад питання ; Відповідь ; Неправильно 1 ; Неправильно 2 |"></textarea>
        <div class="admin-modal-btns">
            <button onclick="saveAdminQuestions()">Зберегти та Синхронізувати</button>
            <button class="cancel" onclick="closeAdminQuestions()">Скасувати</button>
        </div>
    </div>

    <!-- Theme Manager -->
    <div id="theme-btn">⚙️</div>
    <div id="theme-modal">
        <div id="theme-close">✖</div>
        <h3>Оберіть пейзаж</h3>
        <div id="theme-grid">
            <div class="theme-item" onclick="applyTheme('none');">
                <div style="width:100%; height:100%; background:#050510;"></div>
                <span>Без фону</span>
            </div>
        </div>
    </div>

    <div id="questionModal">
        <h2 id="qText">Питання</h2>
        <div class="options-container" id="qOptions"></div>
    </div>

    <div id="mobileControls">
        <div class="dpad">
            <button id="btnLeft">⬅️</button>
            <button id="btnDown">🔽</button>
            <button id="btnRight">➡️</button>
        </div>
        <div class="action-pad">
            <button id="btnUp" class="jump-btn">СТРИБНУТИ</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const CONFIG = { gameId: 'forest_nouns_adventure_v4' }; // Унікальний ID гри

        function toggleSecretVisibility() {
            const input = document.getElementById('secret-word');
            input.classList.toggle('hidden-text');
        }

        let currentFontSize = 26;
        function adjustFontSize(delta) {
            currentFontSize += delta;
            if(currentFontSize < 16) currentFontSize = 16;
            if(currentFontSize > 50) currentFontSize = 50;
            document.getElementById('qText').style.fontSize = currentFontSize + 'px';
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.style.fontSize = (currentFontSize - 6) + 'px');
        }

        function parseQuestionsText(text) {
            let parsed = [];
            let blocks = text.split('|').map(s => s.trim()).filter(s => s.length > 0);
            for(let block of blocks) {
                let parts = block.split(';').map(s => s.trim()).filter(s => s.length > 0);
                if(parts.length >= 2) {
                    let qText = parts[0];
                    let correctAns = parts[1];
                    let options = parts.slice(1); 
                    for (let i = options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [options[i], options[j]] = [options[j], options[i]];
                    }
                    let correctIdx = options.indexOf(correctAns);
                    parsed.push({ text: qText, options: options, correct: correctIdx });
                }
            }
            return parsed;
        }

        function formatQuestionsText(questions) {
            return questions.map(q => {
                let correctOpt = q.options[q.correct];
                let wrongOpts = q.options.filter((_, i) => i !== q.correct);
                return [q.text, correctOpt, ...wrongOpts].join(' ; ');
            }).join(' | \n') + ' |';
        }

        let defaultQuestionsText = "Знайди іменник чоловічого роду: ; Струм ; Батарея ; Магнітне поле | Знайди іменник жіночого роду: ; Іскра ; Кабель ; Джерело | Знайди іменник середнього роду: ; Замикання ; Дріт ; Схема | Знайди іменник чоловічого роду: ; Робот ; Енергія ; Кріплення | Знайди іменник жіночого роду: ; Вантажівка ; Метал ; Паливо |";
        let activeQuestions = parseQuestionsText(defaultQuestionsText);

        const firebaseConfig = { databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/", projectId: "lesson-13c44" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        let myName = sessionStorage.getItem('myName') || 'Гість_' + Math.floor(Math.random() * 1000);
        let isRemoteAction = false;
        
        let currentLeaderId = null; 
        db.ref('game_leader').on('value', snap => { currentLeaderId = snap.val(); });
        function claimLeadership() { if (currentLeaderId !== myName) { currentLeaderId = myName; db.ref('game_leader').set(myName); } }

        db.ref('game_questions_nouns_txt').on('value', snap => {
            if(snap.exists()) { activeQuestions = snap.val(); }
        });

        function openAdminQuestions() {
            document.getElementById('admin-questions-text').value = formatQuestionsText(activeQuestions);
            document.getElementById('admin-questions-modal').style.display = 'block';
        }
        function closeAdminQuestions() { document.getElementById('admin-questions-modal').style.display = 'none'; }
        function saveAdminQuestions() {
            let rawText = document.getElementById('admin-questions-text').value;
            let parsed = parseQuestionsText(rawText);
            if (parsed.length > 0) {
                db.ref('game_questions_nouns_txt').set(parsed);
                closeAdminQuestions();
                alert("Питання успішно оновлено та синхронізовано!");
            } else { alert("Помилка: Не вдалося розпізнати питання. Перевірте формат."); }
        }

        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeClose = document.getElementById('theme-close');
        const themeGrid = document.getElementById('theme-grid');
        themeBtn.addEventListener('click', () => { themeModal.style.display = 'block'; });
        themeClose.addEventListener('click', () => { themeModal.style.display = 'none'; });

        async function loadThemes() {
            let i = 1; let consecutiveErrors = 0;
            while(i <= 1000 && consecutiveErrors < 3) {
                let url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                try {
                    let response = await fetch(url, { method: 'HEAD' });
                    if(response.ok) {
                        consecutiveErrors = 0;
                        let div = document.createElement('div');
                        div.className = 'theme-item';
                        div.innerHTML = `<img src="${url}" alt="Фон ${i}"><span>Фон ${i}</span>`;
                        div.onclick = () => { applyTheme(url); };
                        themeGrid.appendChild(div);
                    } else { consecutiveErrors++; }
                } catch(e) { consecutiveErrors++; }
                i++;
            }
        }
        
        function applyTheme(url) {
            if (url === 'none') { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = '#050510'; } 
            else { document.body.style.backgroundImage = `url('${url}')`; }
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url); // ЗБЕРЕЖЕННЯ ЗА GAME ID
            db.ref('game_theme').set({ url: url, timestamp: Date.now() });
            themeModal.style.display = 'none';
        }
        
        let savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
        if(savedBg) applyTheme(savedBg);
        
        db.ref('game_theme').on('value', snap => {
            const data = snap.val();
            if(data && data.url) {
                if (data.url === 'none') { document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor = '#050510'; }
                else { document.body.style.backgroundImage = `url('${data.url}')`; }
            }
        });
        
        loadThemes();

        function sendAction(type, data) {
            try { db.ref('game_action').set({ senderId: myName, timestamp: firebase.database.ServerValue.TIMESTAMP, type: type, data: data }); } catch (e) {}
        }

        db.ref('game_action').on('value', snap => {
            const val = snap.val();
            if (!val || val.senderId === myName) return; 
            const age = Date.now() - (val.timestamp || 0);
            if (age > 5000) return; 
            isRemoteAction = true;
            if (val.type === 'QUESTION_OPEN') { let obs = levelData.obstacles.find(o => o.qIdx === val.data.qIdx); if (obs) triggerQuestion(obs, true); } 
            else if (val.type === 'QUESTION_CLOSE') { closeQuestion(true); } 
            else if (val.type === 'ENTER_HOUSE') { triggerHouseEnter(true); } 
            else if (val.type === 'FINISH') { triggerFinish(true); } 
            else if (val.type === 'CANDY_COLLECT') { if (levelData.candies[val.data.idx]) { levelData.candies[val.data.idx].collected = true; playSound('candy'); } } 
            else if (val.type === 'ENEMY_KILL') { if (levelData.enemies[val.data.idx]) { levelData.enemies[val.data.idx].active = false; } }
            isRemoteAction = false;
        });

        setInterval(() => {
            if (currentLeaderId === myName && gameState === 'PLAYING') {
                db.ref('player_sync').set({
                    senderId: myName, x: player.x, y: player.y, vx: player.vx, vy: player.vy,
                    state: player.state, facingRight: player.facingRight, isClimbing: player.isClimbing, timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            }
        }, 50);

        db.ref('player_sync').on('value', snap => {
            const data = snap.val();
            if (!data || data.senderId === myName || currentLeaderId === myName || Date.now() - (data.timestamp || 0) > 2000) return;
            player.targetX = data.x; player.targetY = data.y; player.state = data.state;
            player.facingRight = data.facingRight; player.isClimbing = data.isClimbing;
        });

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: true }); 
        let width, height;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
            osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime; gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.04, now + 0.02); 
            
            switch (type) {
                case 'jump': osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.3); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
                case 'candy': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.1); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
                case 'question_appear': osc.type = 'sine'; filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, now); filter.frequency.linearRampToValueAtTime(800, now + 0.4); osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(200, now + 0.4); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6); osc.start(now); osc.stop(now + 0.6); break;
                case 'next': osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.3); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); osc.start(now); osc.stop(now + 0.4); break;
                case 'wrong': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.4); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); osc.start(now); osc.stop(now + 0.4); break;
                case 'climb': osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(200, now + 0.1); gain.gain.setValueAtTime(0.015, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15); osc.start(now); osc.stop(now + 0.15); break;
                case 'splash': osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.4); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); osc.start(now); osc.stop(now + 0.4); break;
            }
        }

        let gameState = 'PLAYING'; let cameraX = 0, cameraY = 0, frameCount = 0; let currentObstacle = null;
        
// КІНЕЦЬ ЧАСТИНИ 1
// ПОЧАТОК ЧАСТИНИ 2

        const player = {
            x: -100, y: 450, width: 60, height: 70, vx: 0, vy: 0, speed: 7, jumpPower: -17,
            grounded: false, isClimbing: false, currentPlatform: null, facingRight: true, state: 'idle', 
            glowTimer: 0, entered: false, lookOffsetX: 0, targetX: undefined, targetY: undefined, windForce: 0,
            
            jump() {
                if (this.grounded || this.isClimbing) {

                }

            respawn() {
                let bestPlatform = null; let minDistance = Infinity;
                for(let p of levelData.platforms) {
                    if (p.type === 'ground' || p.type === 'ruins') {
                        let pCenterX = p.x + p.w / 2; let dist = Math.abs(this.x - pCenterX);
                        if (dist < minDistance) { minDistance = dist; bestPlatform = p; }
                    }
                }
                if (bestPlatform) {
                    this.x = Math.max(bestPlatform.x + 40, Math.min(this.x, bestPlatform.x + bestPlatform.w - this.width - 40));
                    this.y = bestPlatform.y - this.height - 5;
                } else { this.x = -100; this.y = 450; }
                this.vy = 0; this.vx = 0; this.isClimbing = false; this.state = 'idle'; this.windForce = 0;
                this.targetX = this.x; this.targetY = this.y;
                cameraX = this.x - width / 2.5; cameraY = this.y - height / 1.5; playSound('splash');
            },
            update() {
                if (frameCount % 80 === 0 && Math.random() > 0.4) this.lookOffsetX = (Math.random() - 0.5) * 6;
                if(gameState !== 'PLAYING') { if (gameState === 'FINISHED') { this.state = 'idle'; this.vx = 0; this.vy = 0; } return; }

                if (currentLeaderId !== null && currentLeaderId !== myName) {
                    if (this.targetX !== undefined && this.targetY !== undefined) {
                        if (Math.abs(this.targetX - this.x) > 200 || Math.abs(this.targetY - this.y) > 200) { this.x = this.targetX; this.y = this.targetY; }
                        else { this.x += (this.targetX - this.x) * 0.4; this.y += (this.targetY - this.y) * 0.4; }
                    }
                    return; 
                }

                this.state = 'idle'; let activeVine = null;
                for(let v of levelData.vines) { if(this.x + this.width > v.x - 40 && this.x < v.x + v.w + 40 && this.y + this.height > v.y && this.y < v.y + v.h + 20) { activeVine = v; break; } }

                if (activeVine) {
                    if (keys.up || keys.down) this.isClimbing = true;
                    if (this.isClimbing) { let targetX = activeVine.x + activeVine.w/2 - this.width/2; this.x += (targetX - this.x) * 0.15; }
                } else { this.isClimbing = false; }

                if (this.isClimbing) {
                    this.vx = 0; this.vy = 0; this.state = 'climb';
                    if (keys.up) { this.y -= this.speed; if(frameCount%15===0) playSound('climb'); }
                    if (keys.down) { this.y += this.speed; if(frameCount%15===0) playSound('climb'); }
                } else {
                    this.vy += 0.9; if(this.vy > 18) this.vy = 18;
                    if (keys.right) { this.vx = this.speed; this.facingRight = true; this.state = 'walk'; }
                    else if (keys.left) { this.vx = -this.speed; this.facingRight = false; this.state = 'walk'; }
                    else { this.vx = 0; }
                    if (!this.grounded && this.vy !== 0) this.state = 'jump';
                }

                this.x += this.vx + this.windForce; this.y += this.vy;
                if (this.grounded && this.currentPlatform && this.currentPlatform.type === 'moving') this.x += this.currentPlatform.vx;

                        ctx.beginPath(); ctx.moveTo(dX+x, dY+10); ctx.lineTo(dX+x, dY+30); ctx.stroke();
                        ctx.fillStyle = '#fff'; ctx.shadowBlur = 0;
                        ctx.beginPath(); ctx.arc(dX+x, dY+15, 2, 0, Math.PI*2); ctx.fill();
                        ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 8;
                    }
                    ctx.shadowBlur = 0;
                } else if (p.type === 'ruins') {
                    ctx.fillStyle = '#222'; ctx.fillRect(dX, dY+10, p.w, p.h);
                    ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 3; ctx.strokeRect(dX, dY+10, p.w, p.h);
                }
            });

            levelData.enemies.forEach(e => {
                if(e.active) {
                    let dX = e.x - cameraX, dY = e.y - cameraY;
                    let bounce = Math.abs(Math.sin(frameCount * 0.5)) * 3;
                    
                    ctx.fillStyle = '#2a2a2a'; ctx.fillRect(dX, dY+10-bounce, e.w, e.h-10); 
                    ctx.fillStyle = '#111'; ctx.fillRect(e.vx > 0 ? dX+e.w-25 : dX, dY-bounce, 25, e.h); 
                    
                    ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 10;
                    ctx.strokeRect(dX, dY+10-bounce, e.w, e.h-10);
                    
                    ctx.shadowBlur = 0; ctx.fillStyle = '#000';
                    let w1X = dX + 20, w2X = dX + e.w - 20, wY = dY + e.h;
                    ctx.beginPath(); ctx.arc(w1X, wY, 10, 0, Math.PI*2); ctx.arc(w2X, wY, 10, 0, Math.PI*2); ctx.fill();
                    
                    ctx.fillStyle = '#00f3ff'; ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 5;
                    ctx.beginPath(); ctx.arc(w1X, wY, 4, 0, Math.PI*2); ctx.arc(w2X, wY, 4, 0, Math.PI*2); ctx.fill();

                    let fireLen = Math.random() * 20 + 10;
                    ctx.fillStyle = '#ff3300'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 15;
                    ctx.beginPath();
                    if(e.vx > 0) {
                        ctx.moveTo(dX, dY+e.h-8-bounce); ctx.lineTo(dX-fireLen, dY+e.h-bounce); ctx.lineTo(dX, dY+e.h+2-bounce);
                    } else {
                        ctx.moveTo(dX+e.w, dY+e.h-8-bounce); ctx.lineTo(dX+e.w+fireLen, dY+e.h-bounce); ctx.lineTo(dX+e.w, dY+e.h+2-bounce);
                    }
                    ctx.fill(); ctx.shadowBlur = 0;
                }
            });

            levelData.candies.forEach((c) => {
                if (!c.collected) {
                    let floatY = Math.sin(frameCount * 0.05 + c.x) * 6;
                    ctx.save(); ctx.translate(c.x - cameraX + 20, c.y - cameraY + 20 + floatY); 
                    ctx.rotate(frameCount * 0.03);
                    
                    ctx.shadowColor = '#00ff00'; ctx.shadowBlur = 15;
                    ctx.fillStyle = '#052205'; ctx.fillRect(-12, -12, 24, 24); 
                    ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 2; ctx.strokeRect(-12, -12, 24, 24);
                    
                    ctx.fillStyle = '#00ff00'; ctx.fillRect(-5, -5, 10, 10);
                    ctx.beginPath(); 
                    ctx.moveTo(0, -5); ctx.lineTo(0, -15); 
                    ctx.moveTo(0, 5); ctx.lineTo(0, 15); 
                    ctx.moveTo(-5, 0); ctx.lineTo(-15, 0); 
                    ctx.moveTo(5, 0); ctx.lineTo(15, 0); 
                    ctx.stroke();
                    ctx.restore();
                }
            });

            levelData.clouds.forEach(c => {
                let dX = c.x - cameraX, dY = c.y - cameraY;
                let floatY = Math.sin(frameCount * 0.02 + c.x) * 10;
                
                ctx.fillStyle = '#222'; ctx.fillRect(dX, dY + 10 + floatY, c.w, 50);
                ctx.strokeStyle = '#555'; ctx.lineWidth = 4; ctx.strokeRect(dX, dY + 10 + floatY, c.w, 50);
                
                ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 15;
                ctx.fillStyle = '#00f3ff'; ctx.fillRect(dX + 5, dY + 15 + floatY, c.w * 0.8, 40);
                ctx.shadowBlur = 0;
                
                ctx.fillStyle = '#888'; ctx.fillRect(dX + c.w, dY + 20 + floatY, 20, 30);
                ctx.fillStyle = '#111'; ctx.font = "20px Arial"; ctx.fillText("+", dX + c.w + 4, dY + 43 + floatY);

                if (c.isRaining) {
                    ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2; ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 10;
                    for(let i = 30; i < c.w; i += 50) {
                        ctx.beginPath();
                        let startX = dX + i; let currentY = dY + 60 + floatY;
                        ctx.moveTo(startX, currentY);
                        for(let step = 0; step < 6; step++) {
                            currentY += 25 + Math.random()*20;
                            startX += (Math.random() - 0.5) * 40;
                            ctx.lineTo(startX, currentY);
                        }
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                }
            });

            if (levelData.house) {
                let hx = levelData.house.x - cameraX, hy = levelData.house.y - cameraY;
                if (hx < width && hx + levelData.house.w > 0) {
                    ctx.save(); ctx.translate(hx, hy);
                    
                    ctx.fillStyle = '#0a0a1a'; ctx.beginPath(); ctx.moveTo(20, 300); ctx.lineTo(60, 50); ctx.lineTo(240, 50); ctx.lineTo(280, 300); ctx.fill();
                    ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 4; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 15;
                    ctx.beginPath(); ctx.moveTo(20, 300); ctx.lineTo(60, 50); ctx.lineTo(240, 50); ctx.lineTo(280, 300); ctx.stroke();
                    
                    ctx.fillStyle = '#00f3ff'; ctx.fillRect(100, 80, 100, 30);
                    ctx.fillStyle = '#000'; ctx.font = "bold 16px Arial"; ctx.fillText("ЗАВАНТАЖЕННЯ", 102, 100);
                    
                    let doorW = 120, openOff = (doorW/2) * levelData.house.doorState;
                    ctx.shadowBlur = 0;
                    if(levelData.house.doorState < 1) {
                        ctx.fillStyle = 'rgba(0, 243, 255, 0.2)';
                        ctx.fillRect(150 - doorW/2 + openOff, 150, doorW - openOff*2, 150);
                        
                        ctx.fillStyle = '#00f3ff'; ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 10;
                        for(let i=150; i<300; i+=25) { 
                            ctx.fillRect(150 - doorW/2 + openOff, i + (frameCount%25), doorW - openOff*2, 2); 
                        }
                    }
                    ctx.restore();
                }
            }

            levelData.obstacles.forEach(o => {
                if (!o.active) return;
                let dX = o.x - cameraX, dY = o.y - cameraY;
                ctx.save(); ctx.translate(dX + o.w/2, dY + o.h);
                
                if (o.type === 'flower') {
                    ctx.translate(0, -o.h + 60);
                    let pulse = Math.abs(Math.sin(frameCount * 0.1)) * 5;
                    
                    ctx.fillStyle = '#d32f2f'; ctx.strokeStyle = '#111'; ctx.lineWidth = 4;
                    ctx.beginPath(); 
                    ctx.arc(0, 0, 45, Math.PI, 0); 
                    ctx.lineTo(45, -50); ctx.lineTo(25, -50); ctx.lineTo(25, 0); 
                    ctx.arc(0, 0, 25, 0, Math.PI, true); 
                    ctx.lineTo(-25, -50); ctx.lineTo(-45, -50); 
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                    
                    ctx.fillStyle = '#ccc'; 
                    ctx.fillRect(-45, -70, 20, 20); ctx.fillRect(25, -70, 20, 20);
                    
                    ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 3 + pulse; ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 15;
                    ctx.beginPath(); ctx.moveTo(-35, -60);
                    for(let i=-20; i<35; i+=10) { 
                        ctx.lineTo(i, -60 + (Math.random()-0.5)*25); 
                    }
                    ctx.lineTo(35, -60); ctx.stroke(); ctx.shadowBlur = 0;
                    
                } else {
                    let bob = Math.sin(frameCount * 0.05 + o.x) * 5;
                    ctx.translate(0, -o.h + 50 + bob);
                    
                    ctx.fillStyle = '#222'; ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(-25, 20); ctx.lineTo(25, 20); ctx.lineTo(35, -15); ctx.lineTo(-35, -15); ctx.closePath(); ctx.fill(); ctx.stroke();
                    
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, -15, 18, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    
                    let look = Math.sin(frameCount * 0.03 + o.x) * 6;
                    ctx.fillStyle = '#ff00ff'; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 15;
                    ctx.beginPath(); ctx.arc(look, -15, 6 + Math.random()*2, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                    
                    ctx.fillStyle = 'rgba(255, 0, 255, 0.15)';
                    ctx.beginPath(); ctx.moveTo(look, -15); ctx.lineTo(-60, 120); ctx.lineTo(60, 120); ctx.fill();
                }
                ctx.restore();
            });
        }

        function checkCollisions() {
            if (currentLeaderId !== myName && currentLeaderId !== null) return;
            player.grounded = false; player.currentPlatform = null; player.windForce = 0;

            levelData.windZones.forEach(w => {
                if (player.x + player.width > w.x && player.x < w.x + w.w) { 
                    if(player.grounded || player.vy > 0) player.windForce = w.speed; 
                }
            });

            if(!player.isClimbing) {
                for(let p of levelData.platforms) {
                    if (p.type === 'water') {
                        if (player.x + player.width > p.x && player.x < p.x + p.w && player.y + player.height > p.y + 20 && player.y < p.y + p.h) player.respawn();
                    } else {
                        if (player.x + player.width > p.x && player.x < p.x + p.w && player.y + player.height >= p.y && player.y + player.height <= p.y + 25 && player.vy >= 0) {
                            player.y = p.y - player.height; player.vy = 0; player.grounded = true; player.currentPlatform = p;
                        }
                    }
                }
            }

            levelData.clouds.forEach(c => {
                if (c.isRaining) {
                    if (player.x + player.width > c.x + 10 && player.x < c.x + c.w - 10 && player.y + player.height > c.y + 40 && player.y < c.y + 1000) {
                        player.respawn();
                    }
                }
            });

            levelData.enemies.forEach(e => {
                if (e.active && player.x + player.width > e.x && player.x < e.x + e.w && player.y + player.height > e.y && player.y < e.y + e.h) {
                    player.respawn();
                }
            });

            levelData.candies.forEach((c, idx) => {
                if (!c.collected) {
                    let dx = (player.x + player.width/2) - (c.x + 20), dy = (player.y + player.height/2) - (c.y + 20);
                    if (Math.sqrt(dx*dx + dy*dy) < 45) { c.collected = true; player.glowTimer = 20; playSound('candy'); sendAction('CANDY_COLLECT', { idx: idx }); }
                }
            });

            for(let o of levelData.obstacles) {
                if (o.active) {
                    if (player.x + player.width > o.x && player.x < o.x + o.w && player.y + player.height > o.y && player.y < o.y + o.h) {
                        player.vx = 0; player.vy = 0;
                        if (player.x < o.x) player.x = o.x - player.width - 2; else player.x = o.x + o.w + 2;
                        triggerQuestion(o, false);
                    }
                }
            }

            if (levelData.house && gameState === 'PLAYING') {
                if (player.x > levelData.house.x + levelData.house.w/2 - 60) triggerHouseEnter(false);
            }
        }

        const modal = document.getElementById('questionModal'), qText = document.getElementById('qText'), qOptions = document.getElementById('qOptions');

        function triggerQuestion(obstacle, fromRemote = false) {
            if (gameState === 'QUESTION') return;
            gameState = 'QUESTION'; currentObstacle = obstacle; playSound('question_appear');
            keys.right = false; keys.left = false; keys.up = false; keys.down = false;
            
            if (!activeQuestions || activeQuestions.length === 0) activeQuestions = parseQuestionsText(defaultQuestionsText);
            
            let qd = activeQuestions[obstacle.qIdx % activeQuestions.length];
            qText.innerText = qd.text;
            qText.style.fontSize = currentFontSize + 'px';
            
            qOptions.innerHTML = '';
            qd.options.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn'; btn.innerText = opt;
                btn.style.fontSize = (currentFontSize - 6) + 'px';
                btn.onclick = () => {
                    if(idx === qd.correct) closeQuestion(false);
                    else { playSound('wrong'); btn.style.background = '#8a2b2b'; }
                };
                qOptions.appendChild(btn);
            });
            modal.classList.add('active');
            if (!fromRemote) sendAction('QUESTION_OPEN', { qIdx: obstacle.qIdx });
        }

        function closeQuestion(fromRemote = false) {
            if (gameState !== 'QUESTION') return;
            playSound('next'); modal.classList.remove('active');
            if(currentObstacle) currentObstacle.active = false;
            setTimeout(() => { if (gameState !== 'FINISHED') gameState = 'PLAYING'; }, 300);
            if (!fromRemote) sendAction('QUESTION_CLOSE', {});
        }

        function triggerHouseEnter(fromRemote = false) {
            if (gameState === 'ENTERING_HOUSE' || gameState === 'FINISHED') return;
            gameState = 'ENTERING_HOUSE'; levelData.house.doorState = 0; player.vx = 0; keys.right = false; keys.left = false;
            if (!fromRemote) sendAction('ENTER_HOUSE', {});
        }
        function triggerFinish(fromRemote = false) {
            if (gameState === 'FINISHED') return;
            gameState = 'FINISHED'; keys.right = false; keys.left = false;
            if (!fromRemote) sendAction('FINISH', {});
        }

        function gameLoop() {
            ctx.clearRect(0, 0, width, height);
            
            if (gameState === 'PLAYING') { updateLevelEnvironment(); }
            
            player.update();
            if (gameState === 'PLAYING') checkCollisions();

            if (gameState === 'ENTERING_HOUSE') {
                if (levelData.house.doorState < 1 && !player.entered) { levelData.house.doorState += 0.02; } 
                else if (!player.entered) { let targetX = levelData.house.x + levelData.house.w/2 - player.width/2; if (player.x < targetX) { player.x += 1.5; player.state = 'walk'; } else { player.entered = true; } } 
                else if (player.entered) { if (levelData.house.doorState > 0) { levelData.house.doorState -= 0.03; } else { triggerFinish(false); } }
            }

            let targetCamX = player.x - width / 2.5, targetCamY = player.y - height / 1.5;
            if(targetCamY > 500) targetCamY = 500;
            if(gameState === 'ENTERING_HOUSE' || gameState === 'FINISHED') { targetCamX = levelData.house.x + levelData.house.w/2 - width/2; targetCamY = levelData.house.y - height/2 + 100; }
            cameraX += (targetCamX - cameraX) * 0.1; cameraY += (targetCamY - cameraY) * 0.1;

            drawLevel();
            player.draw();
            frameCount++; requestAnimationFrame(gameLoop);
        }

        buildLevel(); gameLoop();
    </script>

    <!-- ГЛОБАЛЬНИЙ ІНСТРУМЕНТ МАЛЮВАННЯ -->
    <div id="toggle-draw-btn-global">✏️</div>
    <div id="draw-panel-global">
        <div id="draw-close">✕</div>
        <div class="draw-handle"></div>
        <div class="draw-btn-row">
            <button id="draw-pencil" class="active-tool">✏️</button>
            <button id="draw-eraser" class="inactive-tool">🧽</button>
        </div>
        <input type="color" id="draw-color" value="#00f3ff">
        <input type="range" id="draw-size" min="1" max="50" value="5">
        <button id="draw-clear-btn">🗑️ Очистити</button>
    </div>
    <canvas id="global-draw-canvas"></canvas>

    <script>
        (function() {
            const drawCanvas = document.getElementById('global-draw-canvas');
            const dCtx = drawCanvas.getContext('2d');
            const toggleDraw = document.getElementById('toggle-draw-btn-global');
            const panel = document.getElementById('draw-panel-global');
            const closePanel = document.getElementById('draw-close');
            let isDrawingMode = false;
            let isDrawing = false;
            let tool = 'pencil';
            
            function resizeDrawCanvas() {
                drawCanvas.width = window.innerWidth; drawCanvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeDrawCanvas); resizeDrawCanvas();

            toggleDraw.addEventListener('click', () => {
                panel.style.display = 'flex'; drawCanvas.style.pointerEvents = 'auto'; isDrawingMode = true;
                tool = 'pencil';
                document.getElementById('draw-pencil').className = 'active-tool';
                document.getElementById('draw-eraser').className = 'inactive-tool';
            });
            closePanel.addEventListener('click', () => {
                panel.style.display = 'none'; drawCanvas.style.pointerEvents = 'none'; isDrawingMode = false;
            });

            document.getElementById('draw-pencil').onclick = function() { tool = 'pencil'; this.className = 'active-tool'; document.getElementById('draw-eraser').className = 'inactive-tool'; };
            document.getElementById('draw-eraser').onclick = function() { tool = 'eraser'; this.className = 'active-tool'; document.getElementById('draw-pencil').className = 'inactive-tool'; };

            document.getElementById('draw-clear-btn').onclick = () => { dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); sendDrawAction('clear_canvas', {}); };

            function getPos(e) {
                const rect = drawCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { nx: (clientX - rect.left) / rect.width, ny: (clientY - rect.top) / rect.height };
            }

            let lastPos = null;
            function startDraw(e) { if(!isDrawingMode) return; isDrawing = true; lastPos = getPos(e); }
            function endDraw() { isDrawing = false; lastPos = null; }
            function draw(e) {
                if(!isDrawing || !isDrawingMode) return;
                e.preventDefault();
                const pos = getPos(e);
                const color = tool === 'pencil' ? document.getElementById('draw-color').value : null;
                const size = document.getElementById('draw-size').value;
                drawLine(lastPos.nx, lastPos.ny, pos.nx, pos.ny, color, size, false);
                sendDrawAction('draw_line', { x1: lastPos.nx, y1: lastPos.ny, x2: pos.nx, y2: pos.ny, color, size });
                lastPos = pos;
            }

            function drawLine(nx1, ny1, nx2, ny2, color, size, isRemote) {
                const x1 = nx1 * drawCanvas.width, y1 = ny1 * drawCanvas.height;
                const x2 = nx2 * drawCanvas.width, y2 = ny2 * drawCanvas.height;
                dCtx.lineCap = 'round'; dCtx.lineJoin = 'round'; dCtx.lineWidth = size;
                if(color === null) { 
                    dCtx.globalCompositeOperation = 'destination-out'; dCtx.strokeStyle = 'rgba(0,0,0,1)'; 
                } else { 
                    dCtx.globalCompositeOperation = 'source-over'; dCtx.strokeStyle = color; 
                    dCtx.shadowColor = color; dCtx.shadowBlur = 10;
                } 
                dCtx.beginPath(); dCtx.moveTo(x1, y1); dCtx.lineTo(x2, y2); dCtx.stroke();
                dCtx.shadowBlur = 0;
            }

            drawCanvas.addEventListener('mousedown', startDraw); drawCanvas.addEventListener('mousemove', draw); drawCanvas.addEventListener('mouseup', endDraw); drawCanvas.addEventListener('mouseout', endDraw);
            drawCanvas.addEventListener('touchstart', startDraw, {passive:false}); drawCanvas.addEventListener('touchmove', draw, {passive:false}); drawCanvas.addEventListener('touchend', endDraw);

            function sendDrawAction(type, data) { try { db.ref('game_action').set({ senderId: myName, timestamp: firebase.database.ServerValue.TIMESTAMP, type: type, data: data }); } catch(e){} }
            
            db.ref('game_action').on('value', snap => {
                const val = snap.val(); if (!val || val.senderId === myName || Date.now() - (val.timestamp || 0) > 5000) return;
                if (val.type === 'draw_line') drawLine(val.data.x1, val.data.y1, val.data.x2, val.data.y2, val.data.color, val.data.size, true);
                if (val.type === 'clear_canvas') dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            });

            let isDraggingPanel = false, panelOffX, panelOffY;
            const handle = document.querySelector('.draw-handle');
            handle.addEventListener('mousedown', e => { isDraggingPanel = true; panelOffX = e.clientX - panel.offsetLeft; panelOffY = e.clientY - panel.offsetTop; });
            document.addEventListener('mousemove', e => { if(isDraggingPanel) { panel.style.left = (e.clientX - panelOffX) + 'px'; panel.style.top = (e.clientY - panelOffY) + 'px'; panel.style.right = 'auto'; } });
            document.addEventListener('mouseup', () => { isDraggingPanel = false; });
            handle.addEventListener('touchstart', e => { isDraggingPanel = true; panelOffX = e.touches[0].clientX - panel.offsetLeft; panelOffY = e.touches[0].clientY - panel.offsetTop; }, {passive:false});
            document.addEventListener('touchmove', e => { if(isDraggingPanel) { panel.style.left = (e.touches[0].clientX - panelOffX) + 'px'; panel.style.top = (e.touches[0].clientY - panelOffY) + 'px'; panel.style.right = 'auto'; } }, {passive:false});
            document.addEventListener('touchmove', e => { if(isDraggingPanel) { panel.style.left = (e.touches[0].clientX - panelOffX) + 'px'; panel.style.top = (e.touches[0].clientY - panelOffY) + 'px'; panel.style.right = 'auto'; } }, {passive:false});
            document.addEventListener('touchend', () => { isDraggingPanel = false; });
        })();
    </script>

    <!-- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛУ -->
    <div id="block-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 99999; color: #00f3ff; font-size: 5vw; text-align: center; line-height: 100vh; font-family: 'Arial', sans-serif; font-weight: bold; pointer-events: none; user-select: none; text-shadow: 0 0 20px #00f3ff;">ДОСТУП ЗАБЛОКОВАНО. ОЧІКУЙТЕ.</div>
    <script>
        (function() {
            try {
                if (!window.db) window.db = firebase.database();
                const urlParams = new URLSearchParams(window.location.search);
                let myName = urlParams.get('user');
                if (myName) { sessionStorage.setItem('myName', myName); } 
                else {
                    myName = sessionStorage.getItem('myName');
                    if (!myName) { myName = 'Гість_' + Math.floor(Math.random() * 1000); sessionStorage.setItem('myName', myName); }
                }
                const tabId = 'tab_' + Math.random().toString(36).substr(2, 9);
                const userRef = window.db.ref('online_users/' + myName + '/' + tabId);
                const blockRef = window.db.ref('blocked_users/' + myName);
                const activityRef = window.db.ref('current_activity');
                const forceRefreshRef = window.db.ref('force_refresh');
                
                window.db.ref('.info/connected').on('value', (snap) => { if (snap.val() === true) { userRef.set(true); userRef.onDisconnect().remove(); } });
                window.addEventListener('beforeunload', () => { userRef.remove(); });
                
                const blockOverlay = document.getElementById('block-overlay');
                blockRef.on('value', (snap) => { blockOverlay.style.display = snap.val() === true ? 'block' : 'none'; });
                
                let immunity = true; setTimeout(() => { immunity = false; }, 1000);
                activityRef.on('value', (snap) => {
                    if (immunity) return;
                    if (snap.val() === 'lobby') window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                });
                
                let firstLoad = true;
                forceRefreshRef.on('value', (snap) => {
                    if (firstLoad) { firstLoad = false; return; }
                    if (snap.val()) window.location.reload();
                });
            } catch (err) {}
        })();
    </script>
