<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кінотеатр Частин Мови</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --velvet-dark: #240409;
    --velvet-mid: #4d0915;
    --velvet-bright: #7c1123;
    --velvet-highlight: #a81c33;
    --brass-dark: #6e4f1d;
    --brass-mid: #b88a39;
    --brass-light: #f3d27a;
    --brass-shine: #fff1b8;
    --screen-warm: #e8dcc4;
    --screen-amber: #d2be96;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #0d0204;
    font-family: 'Montserrat', sans-serif;
  }

  /* Main theater container */
  .theater-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 38%, #380b14 0%, #1a0408 55%, #070102 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  /* Architectural side walls with Art-Deco paneling */
  .wall-left, .wall-right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 16vw;
    z-index: 2;
    pointer-events: none;
  }
  .wall-left {
    left: 0;
    background: linear-gradient(90deg, #090103 0%, #1e050a 65%, transparent 100%);
  }
  .wall-right {
    right: 0;
    background: linear-gradient(-90deg, #090103 0%, #1e050a 65%, transparent 100%);
  }

  /* Pleated Velvet Curtains */
  .curtain-left, .curtain-right {
    position: absolute;
    top: 0;
    height: 82vh;
    width: 15vw;
    z-index: 6;
    pointer-events: none;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .curtain-left {
    left: -1vw;
    transform-origin: top left;
    background:
      repeating-linear-gradient(
        90deg,
        #2b040a 0%,
        #5e0b19 8%,
        #8f1529 14%,
        #420710 22%,
        #2b040a 28%
      );
    border-bottom-right-radius: 45% 18%;
    box-shadow: 18px 12px 45px rgba(0, 0, 0, 0.85), inset -8px 0 20px rgba(0,0,0,0.6);
  }
  .curtain-right {
    right: -1vw;
    transform-origin: top right;
    background:
      repeating-linear-gradient(
        -90deg,
        #2b040a 0%,
        #5e0b19 8%,
        #8f1529 14%,
        #420710 22%,
        #2b040a 28%
      );
    border-bottom-left-radius: 45% 18%;
    box-shadow: -18px 12px 45px rgba(0, 0, 0, 0.85), inset 8px 0 20px rgba(0,0,0,0.6);
  }

  /* Golden Tassel Tiebacks */
  .curtain-left::after, .curtain-right::after {
    content: '';
    position: absolute;
    top: 52%;
    width: 100%;
    height: 18px;
    background: repeating-linear-gradient(45deg, #755115, #d4af37 6px, #f9e28c 10px, #755115 14px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.8);
    border-radius: 10px;
  }

  .curtain-sway-left {
    transform: rotate(-3.5deg) scaleX(0.92);
  }
  .curtain-sway-right {
    transform: rotate(3.5deg) scaleX(0.92);
  }

  /* Top Grand Valance (Lambrequin) */
  .valance-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 9.5vh;
    z-index: 8;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        90deg,
        #32050c 0px,
        #6e0e1e 28px,
        #96172c 48px,
        #4a0813 72px,
        #32050c 96px
      );
    box-shadow: 0 14px 35px rgba(0,0,0,0.9);
    border-bottom: 5px solid #d4af37;
  }
  .valance-top::after {
    content: '';
    position: absolute;
    bottom: -11px;
    left: 0;
    right: 0;
    height: 11px;
    background: repeating-linear-gradient(90deg, #d4af37 0px, #f7df8b 3px, #593b0c 5px, transparent 6px, transparent 9px);
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.7));
  }

  /* Top Control Deck (Brass & Velvet Director Console) */
  .director-console {
    position: relative;
    z-index: 30;
    margin: 1.1vh auto 0;
    padding: 0.65vh 1.4vw;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.9vw;
    flex-wrap: wrap;
    background:
      linear-gradient(180deg, #3a0b14 0%, #21050a 50%, #140205 100%);
    border: 2px solid #c69a45;
    border-radius: 999px;
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.9),
      inset 0 1px 2px rgba(255, 240, 185, 0.5),
      inset 0 -3px 8px rgba(0, 0, 0, 0.8),
      0 0 0 4px #2a070d,
      0 0 0 5px #6e4e19;
    max-width: 96vw;
  }

  /* Brass Controls & Buttons */
  .brass-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4vw;
    padding: 0.65vh 1.1vw;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(0.72rem, 1.05vw, 0.98rem);
    letter-spacing: 0.04em;
    color: #2b1700;
    background: linear-gradient(180deg, #fff3c4 0%, #e7bd60 35%, #b58327 80%, #8a5e12 100%);
    border: 1.5px solid #fffae0;
    border-radius: 999px;
    box-shadow:
      0 4px 10px rgba(0,0,0,0.75),
      inset 0 2px 2px rgba(255,255,255,0.6),
      inset 0 -2px 3px rgba(77, 48, 3, 0.8);
    cursor: pointer;
    transition: all 0.16s ease;
    text-transform: uppercase;
  }
  .brass-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow:
      0 6px 14px rgba(212, 175, 55, 0.4),
      inset 0 2px 3px rgba(255,255,255,0.8);
  }
  .brass-btn:active {
    transform: translateY(1px);
    filter: brightness(0.96);
  }

  /* Velvet Recessed Selector Group */
  .selector-pod {
    display: inline-flex;
    align-items: center;
    background: linear-gradient(180deg, #160206 0%, #2d070f 100%);
    padding: 0.35vh 0.4vw;
    border-radius: 999px;
    border: 1.5px solid #8c6625;
    box-shadow: inset 0 3px 7px rgba(0,0,0,0.9), 0 1px 0 rgba(255,228,150,0.25);
    gap: 0.25vw;
  }

  .pos-pill {
    padding: 0.5vh 0.85vw;
    border-radius: 999px;
    font-weight: 700;
    font-size: clamp(0.68rem, 0.95vw, 0.9rem);
    color: #e2c58a;
    background: linear-gradient(180deg, #3c0a14 0%, #24040a 100%);
    border: 1px solid #591622;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .pos-pill:hover {
    color: #fff3c4;
    border-color: #b58327;
    background: linear-gradient(180deg, #570f1d 0%, #33060e 100%);
  }
  .pos-pill.active-source {
    color: #241200;
    font-weight: 800;
    background: linear-gradient(180deg, #ffefb5 0%, #dfb14b 50%, #aa771c 100%);
    border-color: #fff8dc;
    box-shadow: 0 0 12px rgba(243, 210, 122, 0.6), inset 0 1px 2px #fff;
  }
  .pos-pill.active-target {
    color: #fff8e7;
    font-weight: 800;
    background: linear-gradient(180deg, #c9243f 0%, #8f0f24 55%, #5c0614 100%);
    border-color: #f3d27a;
    box-shadow: 0 0 12px rgba(201, 36, 63, 0.75), inset 0 1px 2px rgba(255, 219, 148, 0.7);
  }

  /* Next ("Далі") Emerald & Gold Cinema Button */
  .next-btn {
    background: linear-gradient(180deg, #39b56a 0%, #1d7d42 45%, #0f4d26 100%);
    color: #fff7db;
    border: 2px solid #f3d27a;
    padding: 0.65vh 1.35vw;
    box-shadow:
      0 4px 14px rgba(0, 0, 0, 0.8),
      0 0 15px rgba(42, 168, 92, 0.35),
      inset 0 2px 2px rgba(255, 255, 255, 0.45);
  }
  .next-btn:hover {
    background: linear-gradient(180deg, #46cc7b 0%, #23944f 45%, #135e2f 100%);
    box-shadow:
      0 6px 18px rgba(42, 168, 92, 0.6),
      inset 0 2px 3px rgba(255, 255, 255, 0.65);
  }

  /* Reaction / Clapper Button */
  .clap-btn {
    background: linear-gradient(180deg, #d63447 0%, #991324 50%, #610712 100%);
    color: #ffefc2;
    border: 2px solid #f3d27a;
    padding: 0.65vh 1vw;
    box-shadow:
      0 4px 14px rgba(0,0,0,0.8),
      0 0 15px rgba(214, 52, 71, 0.4),
      inset 0 2px 2px rgba(255, 220, 180, 0.45);
  }

  /* Center Cinema Screen Area */
  .screen-stage-wrapper {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 0.5vh 14vw 24vh;
    width: 100%;
  }

  /* Ornate Art-Deco Projection Screen Frame */
  .cinema-frame {
    position: relative;
    width: min(68vw, 118vh);
    height: min(53vh, 42vw);
    min-height: 250px;
    border-radius: 22px;
    padding: 14px;
    background:
      linear-gradient(135deg, #75531a 0%, #e5c168 22%, #614210 48%, #f5d884 74%, #664614 100%);
    box-shadow:
      0 22px 60px rgba(0, 0, 0, 0.95),
      0 0 90px rgba(235, 198, 120, 0.22),
      inset 0 2px 4px rgba(255, 250, 210, 0.8);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
  }
  .cinema-frame:hover {
    box-shadow:
      0 22px 65px rgba(0, 0, 0, 0.95),
      0 0 115px rgba(245, 212, 135, 0.34),
      inset 0 2px 4px rgba(255, 250, 210, 0.9);
  }
  .cinema-frame:active {
    transform: scale(0.992);
  }

  /* Inner Dark Velvet Matte Border of Screen */
  .cinema-matte {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    padding: 10px;
    background: #140508;
    box-shadow: inset 0 0 20px #000;
  }

  /* Textured Vintage Silver-Amber Projection Screen (NO plain white!) */
  .projection-surface {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 2.2vh 3vw;
    background:
      radial-gradient(ellipse at 50% 45%, #f4e8cd 0%, #e4d1a7 52%, #c3a873 88%, #8f7240 100%);
    box-shadow:
      inset 0 0 65px rgba(56, 33, 5, 0.68),
      inset 0 0 18px rgba(0, 0, 0, 0.75);
  }

  /* Subtle Woven Screen Texture & Scanlines Overlay */
  .projection-surface::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(45, 28, 5, 0.04) 0px, rgba(45, 28, 5, 0.04) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(45, 28, 5, 0.03) 0px, rgba(45, 28, 5, 0.03) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 1;
  }

  /* Vintage Film Sprocket Strips on Left & Right of Screen */
  .film-strip-left, .film-strip-right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 26px;
    background: rgba(38, 22, 6, 0.22);
    border-right: 1.5px solid rgba(74, 46, 12, 0.3);
    border-left: 1.5px solid rgba(74, 46, 12, 0.3);
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
    padding: 8px 0;
    pointer-events: none;
  }
  .film-strip-left { left: 10px; }
  .film-strip-right { right: 10px; }

  .sprocket-hole {
    width: 12px;
    height: 16px;
    border-radius: 3px;
    background: rgba(45, 26, 7, 0.38);
    border: 1px solid rgba(255, 232, 175, 0.35);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.45);
  }

  /* Flickering Vintage Projector Effect */
  @keyframes projectorFlicker {
    0%, 100% { opacity: 1; }
    48% { opacity: 0.985; }
    50% { opacity: 0.955; }
    52% { opacity: 0.99; }
    85% { opacity: 0.99; }
    87% { opacity: 0.96; }
  }
  .flicker-layer {
    animation: projectorFlicker 3.5s infinite;
  }

  /* Film Reel Advance Transition */
  @keyframes reelRoll {
    0% { transform: translateY(-75%) scaleY(1.08); filter: blur(4px) sepia(0.6); opacity: 0.2; }
    65% { transform: translateY(6%) scaleY(0.98); filter: blur(0px) sepia(0.1); opacity: 1; }
    100% { transform: translateY(0) scaleY(1); filter: blur(0px) sepia(0); opacity: 1; }
  }
  .reel-transition {
    animation: reelRoll 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Source Part-of-Speech Top Badge on Screen */
  .source-pos-badge {
    position: relative;
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 0.55vh 1.8vw;
    background: linear-gradient(180deg, #42250b 0%, #261404 100%);
    border: 2px solid #b58838;
    border-radius: 999px;
    color: #f5deb0;
    font-size: clamp(0.78rem, 1.3vw, 1.15rem);
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    box-shadow: 0 4px 12px rgba(41, 22, 4, 0.4);
  }

  /* Main Source Word Display (HUGE TEXT) */
  .source-word-display {
    position: relative;
    z-index: 4;
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(2.5rem, 6.4vw, 6.2rem);
    line-height: 1.05;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #261005;
    text-align: center;
    text-shadow:
      0 3px 0 rgba(255, 244, 214, 0.85),
      0 8px 22px rgba(66, 35, 6, 0.32);
    padding: 0 2.5vw;
    word-break: break-word;
  }

  /* Target Part-of-Speech Ornate Banner on Screen */
  .target-banner {
    position: relative;
    z-index: 4;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 1.1vw;
    padding: 1.1vh 3.2vw;
    background:
      linear-gradient(180deg, #7d1122 0%, #520814 55%, #36040c 100%);
    border: 3px solid #e5bd62;
    border-radius: 16px;
    box-shadow:
      0 8px 22px rgba(38, 17, 2, 0.55),
      inset 0 2px 4px rgba(255, 232, 166, 0.55),
      0 0 0 3px #3d1d06;
    color: #fff4d2;
    font-weight: 900;
    font-size: clamp(1.3rem, 2.8vw, 2.75rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 3px 8px rgba(0, 0, 0, 0.85);
  }

  /* Fullscreen Interactive Canvas for Projector Beam, Dust, Stage Lights, Audience & Confetti */
  #cinemaCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 15;
    pointer-events: none;
  }

  /* Interactive Audience Click Zone at Bottom */
  .audience-hit-zone {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 27vh;
    z-index: 20;
    cursor: pointer;
  }

  /* Decorative Art-Deco Corner Ornaments inside Screen */
  .deco-corner {
    position: absolute;
    width: 34px;
    height: 34px;
    z-index: 3;
    pointer-events: none;
    opacity: 0.65;
  }
  .deco-tl { top: 12px; left: 42px; }
  .deco-tr { top: 12px; right: 42px; transform: scaleX(-1); }
  .deco-bl { bottom: 12px; left: 42px; transform: scaleY(-1); }
  .deco-br { bottom: 12px; right: 42px; transform: scale(-1, -1); }
</style>
</head>
<body>

<div class="theater-stage">
  <!-- Side Walls & Velvet Curtains -->
  <div class="wall-left"></div>
  <div class="wall-right"></div>
  <div class="valance-top"></div>
  <div id="curtainLeft" class="curtain-left"></div>
  <div id="curtainRight" class="curtain-right"></div>

  <!-- Top Director Control Console -->
  <header class="director-console">
    <!-- Single Language Toggle Button ("УКР" or "РУС") -->
    <button id="langBtn" class="brass-btn" title="Мова / Язык">УКР</button>

    <!-- Mode Toggle Button (Іменник/Прикметник/Дієслово <-> Предмет/Ознака/Дія) -->
    <button id="modeBtn" class="brass-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M4 7h16M4 12h16M4 17h10"/>
      </svg>
      <span id="modeBtnLabel">ІМЕННИК • ПРИКМЕТНИК • ДІЄСЛОВО</span>
    </button>

    <!-- Transformation Selector: FROM -> TO -->
    <div class="flex items-center gap-1.5 flex-wrap justify-center">
      <!-- Source Selector Pod -->
      <div class="selector-pod" id="sourcePod">
        <button data-pos="all" class="pos-pill active-source" aria-label="All">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" class="inline">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>
        <button data-pos="noun" class="pos-pill src-label-noun">Іменник</button>
        <button data-pos="adj" class="pos-pill src-label-adj">Прикметник</button>
        <button data-pos="verb" class="pos-pill src-label-verb">Дієслово</button>
      </div>

      <!-- Golden Arrow Icon -->
      <div class="px-1 text-amber-300 flex items-center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="#f3d27a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Target Selector Pod -->
      <div class="selector-pod" id="targetPod">
        <button data-pos="all" class="pos-pill active-target" aria-label="Random Target">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" class="inline">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>
        <button data-pos="noun" class="pos-pill tgt-label-noun">Іменник</button>
        <button data-pos="adj" class="pos-pill tgt-label-adj">Прикметник</button>
        <button data-pos="verb" class="pos-pill tgt-label-verb">Дієслово</button>
      </div>
    </div>

    <!-- Audience Ovation / Celebration Trigger Button (Wordless) -->
    <button id="celebrateBtn" class="brass-btn clap-btn" aria-label="Ovation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffefc2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="#f3d27a"/>
      </svg>
    </button>

    <!-- Minimalist "Далі" ("Далее") Button -->
    <button id="nextBtn" class="brass-btn next-btn">
      <span id="nextBtnLabel">ДАЛІ</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon>
        <line x1="19" y1="5" x2="19" y2="19"></line>
      </svg>
    </button>
  </header>

  <!-- Central Cinema Projection Screen -->
  <main class="screen-stage-wrapper">
    <div id="cinemaFrame" class="cinema-frame">
      <div class="cinema-matte">
        <div id="projectionSurface" class="projection-surface flicker-layer">
          <!-- Film strips on edges -->
          <div class="film-strip-left">
            <div class="sprocket-hole"></div><div class="sprocket-hole"></div><div class="sprocket-hole"></div>
            <div class="sprocket-hole"></div><div class="sprocket-hole"></div><div class="sprocket-hole"></div>
            <div class="sprocket-hole"></div><div class="sprocket-hole"></div>
          </div>
          <div class="film-strip-right">
            <div class="sprocket-hole"></div><div class="sprocket-hole"></div><div class="sprocket-hole"></div>
            <div class="sprocket-hole"></div><div class="sprocket-hole"></div><div class="sprocket-hole"></div>
            <div class="sprocket-hole"></div><div class="sprocket-hole"></div>
          </div>

          <!-- Art Deco SVG Corners -->
          <svg class="deco-corner deco-tl" viewBox="0 0 40 40" fill="none">
            <path d="M2 38V2H38" stroke="#5e3a0e" stroke-width="3"/>

function refillDeck(lang, pos) {
  const indices = Array.from({ length: WORD_BANK[lang][pos].length }, (_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  state.decks[lang][pos] = indices;
}

function drawWordIndex(lang, pos) {
  if (!state.decks[lang][pos] || state.decks[lang][pos].length === 0) {
    refillDeck(lang, pos);
  }
  return state.decks[lang][pos].pop();
}

/* ============================================================================
   4. WEB AUDIO API SYNTHESIZER (Projector Sounds & 5 Celebration Audio Themes)
   ============================================================================ */
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

// Crisp 35mm film advance mechanical click + reel whir
function playProjectorAdvanceSound() {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    // Two sprocket clicks
    [0, 0.065].forEach((offset, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(idx === 0 ? 190 : 240, now + offset);
      osc.frequency.exponentialRampToValueAtTime(45, now + offset + 0.045);

      gain.gain.setValueAtTime(0.28, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.045);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.05);
    });

    // Subtle film strip flutter noise
    const bufferSize = ctx.sampleRate * 0.14;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.05));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1100;
    filter.Q.value = 2.0;

    const nGain = ctx.createGain();
    nGain.gain.value = 0.18;

    noise.connect(filter);
    filter.connect(nGain);
    nGain.connect(ctx.destination);
    noise.start(now);
  } catch (e) {}
}

// 5 distinct rich celebration soundscapes (wordless!)
function playCelebrationSound(typeIndex) {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    if (typeIndex === 0) {
      // 1. STANDING OVATION: Warm applause claps + triumphant major chord swell
      for (let i = 0; i < 28; i++) {
        const delay = Math.random() * 1.3;
        const bufLen = Math.floor(ctx.sampleRate * 0.045);
        const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
        const ch = buf.getChannelData(0);
        for (let k = 0; k < bufLen; k++) {
          ch[k] = (Math.random() * 2 - 1) * Math.exp(-k / (bufLen * 0.35));
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;

        const filt = ctx.createBiquadFilter();
        filt.type = "bandpass";
        filt.frequency.value = 950 + Math.random() * 700;
        filt.Q.value = 1.8;

        const g = ctx.createGain();
        g.gain.value = 0.09;

        src.connect(filt);
        filt.connect(g);
        g.connect(ctx.destination);
        src.start(now + delay);
      }

      // Warm cinema organ/brass chord (C - E - G - B - D)
      [261.63, 329.63, 392.00, 493.88, 587.33].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, now + idx * 0.04);

        const lpf = ctx.createBiquadFilter();
        lpf.type = "lowpass";
        lpf.frequency.value = 1600;

        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.075, now + 0.18);
        g.gain.exponentialRampToValueAtTime(0.001, now + 1.45);

        osc.connect(lpf);
        lpf.connect(g);
        g.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.5);
      });
    } else if (typeIndex === 1) {
      // 2. POPCORN FOUNTAIN: Playful popping sounds + xylophone glissando
      for (let i = 0; i < 18; i++) {
        const t = now + i * 0.065 + Math.random() * 0.03;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        const startF = 320 + Math.random() * 480;
        osc.frequency.setValueAtTime(startF, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.055);

        g.gain.setValueAtTime(0.22, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);

        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.065);
      }
      const notes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
      notes.forEach((f, i) => {
        const t = now + i * 0.09;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.16, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.36);
      });
    } else if (typeIndex === 2) {
      // 3. PREMIERE PAPARAZZI FLASHES: Camera shutter clicks + Hollywood fanfare
      for (let i = 0; i < 9; i++) {
        const t = now + i * 0.14 + Math.random() * 0.04;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(1800, t);
        osc.frequency.exponentialRampToValueAtTime(280, t + 0.025);
        g.gain.setValueAtTime(0.14, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.035);
      }
      // Fanfare notes (G4 - C5 - E5 - G5)
      const fanfare = [
        { f: 392.0, t: 0, d: 0.14 },
        { f: 523.25, t: 0.14, d: 0.14 },
        { f: 659.25, t: 0.28, d: 0.14 },
        { f: 783.99, t: 0.42, d: 0.75 }
      ];
      fanfare.forEach(n => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(n.f, now + n.t);
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 2100;
        g.gain.setValueAtTime(0.14, now + n.t);
        g.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
        osc.connect(filter);
        filter.connect(g);
        g.connect(ctx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d + 0.02);
      });
    } else if (typeIndex === 3) {
      // 4. GLOWSTICK WAVE: Shimmering synth arpeggio wave across the theater
      const arp = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.5, 1318.5];
      arp.forEach((f, idx) => {
        const t = now + idx * 0.085;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.56);
      });
    } else {
      // 5. ENCORE CURTAIN & GOLDEN STARS: Timpani roll + grand harp/chime cascade
      const scale = [587.33, 659.25, 783.99, 880, 987.77, 1174.66, 1318.51, 1567.98];
      scale.forEach((f, idx) => {
        const t = now + idx * 0.07;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.14, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.66);
      });
    }
  } catch (e) {}
}

  const l = LABELS[state.lang];
  const m = l.modes[state.mode];

  langBtn.textContent = l.langBtn;
  nextBtnLabel.textContent = l.nextBtn;
  modeBtnLabel.textContent = m.toggleTitle;

  document.querySelector(".src-label-noun").textContent = m.shortNoun;
  document.querySelector(".src-label-adj").textContent = m.shortAdj;
  document.querySelector(".src-label-verb").textContent = m.shortVerb;

  document.querySelector(".tgt-label-adj").textContent = m.shortAdj;
  document.querySelector(".tgt-label-verb").textContent = m.shortVerb;

  renderScreenContent(false);
}

function pickTargetPos(sourcePos) {
  if (state.targetFilter !== "all") {
    return state.targetFilter;
  }
  // When target is random ("all"), always pick a DIFFERENT part of speech than sourcePos
  const candidates = POS_KEYS.filter(k => k !== sourcePos);
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function generateNextTask(withReelAnimation = true) {
  // Determine Source Part of Speech
  if (state.sourceFilter === "all") {
    // If targetFilter is locked to a specific POS, prefer picking a different source POS so transformation is meaningful
    const pool = state.targetFilter !== "all"
      ? POS_KEYS.filter(k => k !== state.targetFilter)
      : POS_KEYS;
    state.currentSourcePos = pool[Math.floor(Math.random() * pool.length)];
  } else {
    state.currentSourcePos = state.sourceFilter;
  }

  state.currentTargetPos = pickTargetPos(state.currentSourcePos);
  state.currentWordIndex = drawWordIndex(state.lang, state.currentSourcePos);

  if (withReelAnimation) {
    playProjectorAdvanceSound();
  }
  renderScreenContent(withReelAnimation);
}

function renderScreenContent(animateReel = true) {
  const m = LABELS[state.lang].modes[state.mode];
  const wordList = WORD_BANK[state.lang][state.currentSourcePos];
  const word = wordList[state.currentWordIndex % wordList.length];

  screenSourcePos.textContent = m[state.currentSourcePos];
  screenWord.textContent = word;
  screenTargetPos.textContent = m[state.currentTargetPos];

  if (animateReel) {
    projectionSurface.classList.remove("reel-transition");
    void projectionSurface.offsetWidth;
    projectionSurface.classList.add("reel-transition");
  }
}

/* ============================================================================
   6. LIVING CINEMA & AUDIENCE CANVAS ENGINE
   Draws:
   - Glowing Art-Deco Wall Sconces on left & right walls
   - Dynamic Volumetric Projector Light Beam & Floating Dust Motes

   - 3 Rows of Velvet Cinema Seats with 19 Unique Animated Audience Members

   ============================================================================ */
const canvas = document.getElementById("cinemaCanvas");
const ctx = canvas.getContext("2d");

let cw = window.innerWidth;
let ch = window.innerHeight;

// Dust Motes in Projector Beam
const dustMotes = Array.from({ length: 55 }, () => ({
  x: Math.random(),

  r: 1 + Math.random() * 2.2,
  vx: (Math.random() - 0.5) * 0.0004,
  vy: -0.0002 - Math.random() * 0.0005,
  alpha: 0.2 + Math.random() * 0.6,

// Active Celebration Particles (Popcorn, Golden Stars/Confetti, Camera Flashes)
let particles = [];
let cameraFlashes = [];
let activeReaction = {
  type: -1,      // 0: Ovation, 1: Popcorn, 2: Paparazzi, 3: Glowsticks, 4: Encore Stars
  timer: 0,
  duration: 135  // frames (~2.2 sec)
};

// Trigger one of the 5 varied wordless celebrations
function triggerAudienceReaction() {
  const type = state.reactionIndex % 5;
  state.reactionIndex++;

  activeReaction.type = type;
  activeReaction.timer = activeReaction.duration;

  playCelebrationSound(type);

  // Sway velvet curtains
  curtainLeft.classList.add("curtain-sway-left");
  curtainRight.classList.add("curtain-sway-right");
  setTimeout(() => {
    curtainLeft.classList.remove("curtain-sway-left");
    curtainRight.classList.remove("curtain-sway-right");
  }, 900);

  // Spawn specific particles for the chosen celebration
  if (type === 1) {
    // POPCORN FOUNTAIN from audience members
    audience.forEach(person => {
      for (let i = 0; i < 6; i++) {
        particles.push({
          kind: "popcorn",
          x: person.x + (Math.random() - 0.5) * 30,
          y: person.y - 20 * person.scale,
          vx: (Math.random() - 0.5) * 6,
          vy: -7 - Math.random() * 8,
          gravity: 0.28,

          vrot: (Math.random() - 0.5) * 0.2,
          size: (5 + Math.random() * 4) * person.scale,
          life: 110
        });
      }
    });
  } else if (type === 2) {
    // PAPARAZZI CAMERA FLASHES across the audience rows
    cameraFlashes = [];
    for (let i = 0; i < 14; i++) {
      const p = audience[Math.floor(Math.random() * audience.length)];
      cameraFlashes.push({
        x: p.x + (Math.random() - 0.5) * 35 * p.scale,
        y: p.y - 35 * p.scale,
        delay: Math.floor(Math.random() * 55),
        life: 18,
        maxLife: 18,
        radius: (55 + Math.random() * 45) * p.scale
      });
    }
  } else if (type === 4) {
    // ENCORE GOLDEN STARS & CRIMSON RIBBONS raining from top
    for (let i = 0; i < 65; i++) {
      particles.push({
        kind: i % 2 === 0 ? "star" : "ribbon",

}

// Build 3 Rows of Diverse Audience Characters
let audience = [];
const HAIR_COLORS = ["#1e120b", "#3d2314", "#6e3b1e", "#b86b28", "#d9a441", "#2b1b2d", "#591d22"];
const CLOTH_COLORS = ["#1f4e78", "#2e6b4e", "#7a2332", "#5d3a7a", "#9c6324", "#28596b", "#823147"];
const GLOW_COLORS = ["#00f5d4", "#ff4d6d", "#fee440", "#9b5de5", "#00bbf9"];

function buildAudience() {
  audience = [];
  const rows = [
    { count: 7, yRatio: 0.805, scale: 0.72, rowIdx: 0 }, // Back row
    { count: 6, yRatio: 0.875, scale: 0.88, rowIdx: 1 }, // Middle row
    { count: 6, yRatio: 0.955, scale: 1.06, rowIdx: 2 }  // Front row
  ];

  let idCounter = 0;
  rows.forEach(r => {
    const span = cw * 0.76;
    const startX = (cw - span) / 2;
    const step = span / (r.count - 1);

    for (let i = 0; i < r.count; i++) {
      const stagger = (r.rowIdx % 2 === 1 ? (i - (r.count - 1) / 2) * 8 : 0);
      const x = startX + i * step + stagger;
      const y = ch * r.yRatio;

      audience.push({
        id: idCounter,
        rowIdx: r.rowIdx,
        colIdx: i,
        x,
        y,
        scale: r.scale,
        hairStyle: idCounter % 5, // 0: short curl, 1: twin buns, 2: bob, 3: spiky, 4: ponytail
        hairColor: HAIR_COLORS[idCounter % HAIR_COLORS.length],
        clothColor: CLOTH_COLORS[(idCounter * 3) % CLOTH_COLORS.length],
        hasGlasses: idCounter % 4 === 1,
        hasBow: idCounter % 5 === 2,
        hasPopcorn: idCounter % 3 === 0,
        hasDrink: idCounter % 3 === 1,
        glowColor: GLOW_COLORS[idCounter % GLOW_COLORS.length],
        phase: idCounter * 1.15,
        blinkTimer: Math.floor(Math.random() * 160)
      });
      idCounter++;
    }
  });
}

// Draw Art-Deco Wall Sconces along the side walls
function drawWallSconces(time) {
  const sconcePairs = [
    { xLeft: cw * 0.045, xRight: cw * 0.955, y: ch * 0.28, scale: 0.75 },
    { xLeft: cw * 0.032, xRight: cw * 0.968, y: ch * 0.50, scale: 0.92 }
  ];

  const pulse = 1 + Math.sin(time * 0.004) * 0.06;

  sconcePairs.forEach(pair => {
    [pair.xLeft, pair.xRight].forEach(sx => {
      ctx.save();
      ctx.translate(sx, pair.y);
      ctx.scale(pair.scale, pair.scale);

      // Warm radial wall glow
      const glow = ctx.createRadialGradient(0, -10, 4, 0, -10, 75 * pulse);
      glow.addColorStop(0, "rgba(255, 214, 122, 0.55)");
      glow.addColorStop(0.45, "rgba(219, 132, 39, 0.18)");
      glow.addColorStop(1, "rgba(219, 132, 39, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, -10, 75 * pulse, 0, Math.PI * 2);
      ctx.fill();

      // Upward light cone
      const cone = ctx.createLinearGradient(0, 0, 0, -68);
      cone.addColorStop(0, "rgba(255, 224, 150, 0.45)");
      cone.addColorStop(1, "rgba(255, 224, 150, 0)");
      ctx.fillStyle = cone;
      ctx.beginPath();
      ctx.moveTo(-8, 0);
      ctx.lineTo(-28, -68);
      ctx.lineTo(28, -68);
      ctx.lineTo(8, 0);
      ctx.closePath();
      ctx.fill();

      // Frosted amber glass shade
      ctx.fillStyle = "#ffe599";
      ctx.strokeStyle = "#b8862d";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, -18);
      ctx.lineTo(14, -18);
      ctx.lineTo(8, 4);
      ctx.lineTo(-8, 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Brass bracket base
      ctx.fillStyle = "#c99a3e";
      ctx.fillRect(-5, 4, 10, 14);
      ctx.beginPath();
      ctx.moveTo(-3, 18);
      ctx.lineTo(3, 18);
      ctx.lineTo(0, 28);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    });
  });
}

// Draw Stage Deck & Footlights beneath the Cinema Screen
function drawStageAndFootlights(time) {
  const stageY = ch * 0.725;
  const stageW = cw * 0.74;
  const stageX = (cw - stageW) / 2;

  ctx.save();
  // Curved wooden & brass stage apron
  const apronGrad = ctx.createLinearGradient(0, stageY - 12, 0, stageY + 26);
  apronGrad.addColorStop(0, "#5c2814");
  apronGrad.addColorStop(0.35, "#381207");
  apronGrad.addColorStop(1, "#140402");

  ctx.fillStyle = apronGrad;
  ctx.beginPath();
  ctx.moveTo(stageX, stageY);
  ctx.quadraticCurveTo(cw * 0.5, stageY + 18, stageX + stageW, stageY);
  ctx.lineTo(stageX + stageW + 30, stageY + 28);
  ctx.quadraticCurveTo(cw * 0.5, stageY + 44, stageX - 30, stageY + 28);
  ctx.closePath();
  ctx.fill();

  // Brass trim along stage lip
  ctx.strokeStyle = "#d4a849";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(stageX, stageY);
  ctx.quadraticCurveTo(cw * 0.5, stageY + 18, stageX + stageW, stageY);
  ctx.stroke();

  // 9 Stage Footlights
  const numLights = 9;
  for (let i = 0; i < numLights; i++) {
    const t = (i + 0.5) / numLights;
    const lx = stageX + t * stageW;
    const curveOffset = Math.sin(t * Math.PI) * 9;
    const ly = stageY + curveOffset;

    // Footlight color changes during celebrations!
    let lightColor = "rgba(255, 214, 130, 0.38)";
    if (activeReaction.timer > 0) {
      const hue = (time * 0.35 + i * 40) % 360;
      lightColor = `hsla(${hue}, 90%, 65%, 0.65)`;
    }

    const glow = ctx.createRadialGradient(lx, ly - 4, 2, lx, ly - 12, 34);
    glow.addColorStop(0, lightColor);
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(lx, ly - 6, 34, 0, Math.PI * 2);
    ctx.fill();

    // Brass hood shell
    ctx.fillStyle = "#8f651e";
    ctx.beginPath();
    ctx.arc(lx, ly + 2, 8, Math.PI, 0);
    ctx.fill();

    // Glowing bulb core
    ctx.fillStyle = "#fff5cc";
    ctx.beginPath();
    ctx.arc(lx, ly, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Draw Volumetric Projector Light Beam & Floating Dust Motes
function drawProjectorBeam(time) {
  const frameRect = cinemaFrame.getBoundingClientRect();
  if (!frameRect.width) return;

  ctx.save();
  // Origin of projector beam at top center-back of theater
  const originX = cw * 0.5;
  const originY = -10;

  const beamGrad = ctx.createLinearGradient(originX, originY, originX, frameRect.bottom);
  beamGrad.addColorStop(0, "rgba(255, 240, 195, 0.22)");
  beamGrad.addColorStop(0.45, "rgba(245, 218, 155, 0.08)");
  beamGrad.addColorStop(1, "rgba(245, 218, 155, 0.01)");

  ctx.fillStyle = beamGrad;
  ctx.beginPath();
  ctx.moveTo(originX - 28, originY);
  ctx.lineTo(frameRect.left + 12, frameRect.top + 12);
  ctx.lineTo(frameRect.right - 12, frameRect.bottom - 12);
  ctx.lineTo(frameRect.left + 12, frameRect.bottom - 12);
  ctx.lineTo(originX + 28, originY);
  ctx.closePath();
  ctx.fill();

  // Celebration Sweeping Golden Spotlights (for Standing Ovation & Encore)
  if (activeReaction.timer > 0 && (activeReaction.type === 0 || activeReaction.type === 4)) {
    const sweep1 = Math.sin(time * 0.008) * (cw * 0.28);
    const sweep2 = Math.cos(time * 0.008) * (cw * 0.28);

    [
      { sx: cw * 0.18, tx: cw * 0.5 + sweep1, color: "rgba(255, 223, 120, 0.18)" },
      { sx: cw * 0.82, tx: cw * 0.5 + sweep2, color: "rgba(255, 190, 130, 0.18)" }
    ].forEach(sp => {
      const sg = ctx.createLinearGradient(sp.sx, ch * 0.75, sp.tx, 0);
      sg.addColorStop(0, sp.color);
      sg.addColorStop(1, "rgba(255, 223, 120, 0)");
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(sp.sx - 12, ch * 0.75);
      ctx.lineTo(sp.tx - 95, 0);
      ctx.lineTo(sp.tx + 95, 0);
      ctx.lineTo(sp.sx + 12, ch * 0.75);
      ctx.closePath();
      ctx.fill();
    });
  }

  // Floating Dust Motes in the Light
  dustMotes.forEach(d => {
    d.x += d.vx;
    d.y += d.vy;
    if (d.y < 0.05) d.y = 0.7;
    if (d.x < 0.2) d.x = 0.8;
    if (d.x > 0.8) d.x = 0.2;

    const px = d.x * cw;
    const py = d.y * ch;
    const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(time * 0.003 + d.phase));

    ctx.fillStyle = `rgba(255, 238, 185, ${d.alpha * twinkle * 0.55})`;
    ctx.beginPath();
    ctx.arc(px, py, d.r, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

// Draw a Single Cinema Velvet Seat & Animated Person
function drawAudienceMember(p, time) {
  const s = p.scale;
  const isReacting = activeReaction.timer > 0;
  const rType = activeReaction.type;

  // Idle subtle breathing & head tilt
  let bobY = Math.sin(time * 0.003 + p.phase) * 2.5 * s;
  let headTilt = Math.sin(time * 0.0018 + p.phase) * 0.05;
  let armRaise = 0;

  // Dynamic reaction movements
  if (isReacting) {
    if (rType === 0) {
      // Standing ovation: jump & wave hands high
      bobY = -Math.abs(Math.sin(time * 0.015 + p.phase)) * 22 * s - 8 * s;
      armRaise = 1;
      headTilt = Math.sin(time * 0.02 + p.phase) * 0.14;
    } else if (rType === 1) {
      // Popcorn fountain excitement
      bobY = -Math.abs(Math.sin(time * 0.018 + p.phase * 2)) * 14 * s;
      armRaise = 0.7;
    } else if (rType === 2) {
      // Paparazzi excitement
      bobY = -Math.abs(Math.sin(time * 0.012 + p.phase)) * 10 * s;
      armRaise = 0.4;
    } else if (rType === 3) {
      // Stadium glowstick wave across columns!
      const wavePhase = time * 0.012 - p.colIdx * 0.55;
      const waveHeight = Math.max(0, Math.sin(wavePhase));
      bobY = -waveHeight * 20 * s;
      armRaise = 0.85;
      headTilt = Math.cos(wavePhase) * 0.15;
    } else if (rType === 4) {
      // Encore applause & looking up at falling stars
      bobY = -Math.abs(Math.sin(time * 0.014 + p.phase)) * 14 * s;
      armRaise = 0.9;
    }
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(s, s);

  // 1. Plush Crimson Velvet Cinema Seat Backrest (Behind character)
  const seatGrad = ctx.createLinearGradient(0, -48, 0, 25);
  seatGrad.addColorStop(0, "#751222");
  seatGrad.addColorStop(0.5, "#4a0813");
  seatGrad.addColorStop(1, "#210207");

  ctx.fillStyle = seatGrad;
  ctx.strokeStyle = "#b88a39";
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.roundRect(-42, -42, 84, 72, [20, 20, 6, 6]);
  ctx.fill();
  ctx.stroke();

  // Inner quilted cushion line
  ctx.strokeStyle = "rgba(255, 215, 140, 0.22)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.roundRect(-34, -34, 68, 56, [14, 14, 4, 4]);
  ctx.stroke();

  // Wooden/Brass Armrests on sides
  ctx.fillStyle = "#3b1708";
  ctx.strokeStyle = "#9e7329";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(-48, -6, 12, 34, 5);
  ctx.roundRect(36, -6, 12, 34, 5);
  ctx.fill();
  ctx.stroke();

  // 2. Character Body & Shoulders
  ctx.save();
  ctx.translate(0, bobY);

  ctx.fillStyle = p.clothColor;
  ctx.strokeStyle = "#120408";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-28, -18, 56, 44, [18, 18, 4, 4]);
  ctx.fill();
  ctx.stroke();

  // Collar detail
  ctx.fillStyle = "#f2dec4";
  ctx.beginPath();
  ctx.moveTo(-9, -18);
  ctx.lineTo(9, -18);
  ctx.lineTo(0, -8);
  ctx.closePath();
  ctx.fill();

  // 3. Raised Arms during Celebration (Clapping / Waving / Holding Glowsticks)
  if (armRaise > 0) {
    const waveAngle = Math.sin(time * 0.025 + p.phase) * 0.32;

    // Left Arm
    ctx.save();
    ctx.translate(-24, -10);
    ctx.rotate(-0.45 - waveAngle);
    ctx.fillStyle = p.clothColor;
    ctx.beginPath();
    ctx.roundRect(-6, -34, 12, 36, 6);
    ctx.fill();
    ctx.fillStyle = "#f0c8a0";
    ctx.beginPath();
    ctx.arc(0, -36, 6.5, 0, Math.PI * 2);
    ctx.fill();

    // Glowstick in Mode 3
    if (isReacting && rType === 3) {
      ctx.strokeStyle = p.glowColor;
      ctx.lineWidth = 5;
      ctx.shadowColor = p.glowColor;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(0, -38);
      ctx.lineTo(-4, -64);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();

    // Right Arm
    ctx.save();
    ctx.translate(24, -10);
    ctx.rotate(0.45 + waveAngle);
    ctx.fillStyle = p.clothColor;
    ctx.beginPath();
    ctx.roundRect(-6, -34, 12, 36, 6);
    ctx.fill();
    ctx.fillStyle = "#f0c8a0";
    ctx.beginPath();
    ctx.arc(0, -36, 6.5, 0, Math.PI * 2);
    ctx.fill();

    if (isReacting && rType === 3) {
      ctx.strokeStyle = p.glowColor;
      ctx.lineWidth = 5;
      ctx.shadowColor = p.glowColor;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(0, -38);
      ctx.lineTo(4, -64);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // 4. Head & Hair (Back of head facing screen, turning slightly so side profile/cheeks show)
  ctx.save();
  ctx.translate(0, -36);
  ctx.rotate(headTilt);

  // Warm rim light from the cinema screen on top of head
  ctx.fillStyle = "#eac096";
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.fill();

  // Ears
  ctx.beginPath();
  ctx.arc(-20, 2, 4.5, 0, Math.PI * 2);
  ctx.arc(20, 2, 4.5, 0, Math.PI * 2);
  ctx.fill();

  // Distinct Hairstyles
  ctx.fillStyle = p.hairColor;
  ctx.beginPath();
  ctx.arc(0, -1, 20.5, 0, Math.PI * 2);
  ctx.fill();

  if (p.hairStyle === 1) {
    // Twin buns
    ctx.beginPath();
    ctx.arc(-16, -15, 8.5, 0, Math.PI * 2);
    ctx.arc(16, -15, 8.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (p.hairStyle === 2) {
    // Classic bob hair
    ctx.beginPath();
    ctx.roundRect(-21, -8, 42, 24, 10);
    ctx.fill();
  } else if (p.hairStyle === 3) {
    // Spiky crown
    ctx.beginPath();
    ctx.moveTo(-14, -16);
    ctx.lineTo(-8, -27);
    ctx.lineTo(0, -19);
    ctx.lineTo(6, -28);
    ctx.lineTo(13, -16);
    ctx.closePath();
    ctx.fill();
  } else if (p.hairStyle === 4) {
    // Ponytail
    ctx.beginPath();
    ctx.ellipse(0, 8, 8, 13, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Golden screen rim-light highlight along top edge of hair
  ctx.strokeStyle = "rgba(255, 232, 168, 0.55)";
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.arc(0, -1, 19.5, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();

  // Optional Hair Bow / Ribbon
  if (p.hasBow) {
    ctx.fillStyle = "#e63956";
    ctx.beginPath();
    ctx.moveTo(0, -17);
    ctx.lineTo(-10, -23);
    ctx.lineTo(-10, -11);
    ctx.closePath();
    ctx.moveTo(0, -17);
    ctx.lineTo(10, -23);
    ctx.lineTo(10, -11);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffccd5";
    ctx.beginPath();
    ctx.arc(0, -17, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Optional Glasses Temples on sides
  if (p.hasGlasses) {
    ctx.strokeStyle = "#f3d27a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-21, 0);
    ctx.lineTo(-15, -2);
    ctx.moveTo(21, 0);
    ctx.lineTo(15, -2);
    ctx.stroke();
  }

  ctx.restore(); // end head

  // 5. Props in Lap (Striped Popcorn Bucket or Soda Cup with Straw)
  if (p.hasPopcorn) {
    ctx.save();
    ctx.translate(-18, 4);
    // Golden popcorn kernels on top
    ctx.fillStyle = "#ffe169";
    ctx.beginPath();
    ctx.arc(-4, -9, 4, 0, Math.PI * 2);
    ctx.arc(0, -11, 4.5, 0, Math.PI * 2);
    ctx.arc(4, -9, 4, 0, Math.PI * 2);
    ctx.fill();
    // Red & Cream Striped Bucket
    ctx.fillStyle = "#d92b3a";
    ctx.beginPath();
    ctx.moveTo(-8, -7);
    ctx.lineTo(8, -7);
    ctx.lineTo(6, 12);
    ctx.lineTo(-6, 12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#f7e5c6";
    ctx.fillRect(-3, -7, 2.5, 19);
    ctx.fillRect(1.5, -7, 2.5, 19);
    ctx.restore();
  } else if (p.hasDrink) {
    ctx.save();
    ctx.translate(19, 5);
    // Straw
    ctx.strokeStyle = "#f3d27a";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(4, -15);
    ctx.lineTo(8, -16);
    ctx.stroke();
    // Cup
    ctx.fillStyle = "#2b7a9b";
    ctx.beginPath();
    ctx.moveTo(-6, -6);
    ctx.lineTo(6, -6);
    ctx.lineTo(4.5, 10);
    ctx.lineTo(-4.5, 10);
    ctx.closePath();
    ctx.fill();
    // Lid
    ctx.fillStyle = "#e8d5b5";
    ctx.fillRect(-7, -8, 14, 3);
    ctx.restore();
  }

  ctx.restore(); // end body bob
  ctx.restore(); // end seat
}

// Draw Active Celebration Particles & Camera Flashes
function drawCelebrationEffects() {
  // 1. Particles (Popcorn, Golden Stars, Ribbons)
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += pt.gravity;
    pt.rot += pt.vrot;
    pt.life--;

    if (pt.life <= 0 || pt.y > ch + 40) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(pt.rot);

    if (pt.kind === "popcorn") {
      // Fluffy golden popcorn kernel
      ctx.fillStyle = "#ffdf6b";
      ctx.strokeStyle = "#c48b20";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(-pt.size * 0.4, 0, pt.size * 0.65, 0, Math.PI * 2);
      ctx.arc(pt.size * 0.4, 0, pt.size * 0.6, 0, Math.PI * 2);
      ctx.arc(0, -pt.size * 0.45, pt.size * 0.65, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (pt.kind === "star") {
      // 5-pointed golden star
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      for (let s = 0; s < 5; s++) {
        const outerA = (s * 72 - 90) * (Math.PI / 180);
        const innerA = ((s * 72 + 36) - 90) * (Math.PI / 180);
        const ox = Math.cos(outerA) * pt.size;
        const oy = Math.sin(outerA) * pt.size;
        const ix = Math.cos(innerA) * (pt.size * 0.45);
        const iy = Math.sin(innerA) * (pt.size * 0.45);
        if (s === 0) ctx.moveTo(ox, oy);
        else ctx.lineTo(ox, oy);
        ctx.lineTo(ix, iy);
      }
      ctx.closePath();
      ctx.fill();
    } else if (pt.kind === "ribbon") {
      ctx.fillStyle = pt.color;
      ctx.fillRect(-pt.size * 0.8, -pt.size * 0.35, pt.size * 1.6, pt.size * 0.7);
    }

    ctx.restore();
  }

  // 2. Paparazzi Camera Flashes
  if (activeReaction.timer > 0 && activeReaction.type === 2) {
    cameraFlashes.forEach(fl => {
      if (fl.delay > 0) {
        fl.delay--;
        return;
      }
      if (fl.life > 0) {
        const ratio = fl.life / fl.maxLife;
        ctx.save();
        ctx.translate(fl.x, fl.y);

        const rg = ctx.createRadialGradient(0, 0, 2, 0, 0, fl.radius);
        rg.addColorStop(0, `rgba(255, 250, 220, ${ratio * 0.95})`);
        rg.addColorStop(0.35, `rgba(255, 220, 140, ${ratio * 0.55})`);
        rg.addColorStop(1, "rgba(255, 220, 140, 0)");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(0, 0, fl.radius, 0, Math.PI * 2);
        ctx.fill();

        // 4-point lens flare star
        ctx.strokeStyle = `rgba(255, 252, 230, ${ratio * 0.9})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-fl.radius * 0.85, 0);
        ctx.lineTo(fl.radius * 0.85, 0);
        ctx.moveTo(0, -fl.radius * 0.85);
        ctx.lineTo(0, fl.radius * 0.85);
        ctx.stroke();

        ctx.restore();
        fl.life--;
      }
    });
  }
}

// Main Animation Loop
function animateCinema(time) {
  ctx.clearRect(0, 0, cw, ch);

  if (activeReaction.timer > 0) {
    activeReaction.timer--;
  }

  drawWallSconces(time);
  drawStageAndFootlights(time);
  drawProjectorBeam(time);

  // Draw audience back-to-front for proper 3D perspective overlap
  for (let i = 0; i < audience.length; i++) {
    drawAudienceMember(audience[i], time);
  }

  drawCelebrationEffects();

  requestAnimationFrame(animateCinema);
}

// Initialize on load
window.onload = function () {
  resizeCanvas();
  ["uk", "ru"].forEach(l => {
    POS_KEYS.forEach(p => refillDeck(l, p));
  });
  updateUIText();
  generateNextTask(false);
  requestAnimationFrame(animateCinema);
};
</script>
