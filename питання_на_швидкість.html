<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>•••</title>
  <style>
    /* =========================================================================
       RESET & FULLSCREEN VIEWPORT LOCK
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      /* Dynamic nature palette CSS variables updated per slide */
      --sky-top: #7ec8e3;
      --sky-mid: #bfe6f2;
      --sky-bot: #f6efd2;
      --sun-core: #fff6c2;
      --sun-glow: #ffd166;
      --hill-far: #8bb99a;
      --hill-mid: #6ca67c;
      --hill-near: #4e8c62;
      --water-top: #5ab6c8;
      --water-bot: #368ea4;
      --flower-a: #ff8fa3;
      --flower-b: #ffd166;
      --flower-c: #b892ff;

      /* Highlight mode 1..4 palette accents */
      --m1-bg: #ffad33;
      --m1-bg2: #ff7b3b;
      --m1-stroke: #fff6c9;
      --m1-glow: rgba(255, 190, 50, 0.92);

      --m2-bg: #f4c77b;
      --m2-stroke: #fff1cc;
      --m2-glow: rgba(244, 199, 123, 0.58);

      --m3-glow: rgba(255, 248, 214, 0.42);
      --m4-glow: rgba(255, 255, 240, 0.22);

      --font-round: 'Nunito', 'Comfortaa', 'Quicksand', 'SF Pro Rounded',
                    'Hiragino Maru Gothic ProN', 'Segoe UI', 'Trebuchet MS',
                    ui-rounded, system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-round);
      user-select: none;
      -webkit-user-select: none;
      background: var(--sky-top);
      touch-action: manipulation;
    }

    /* =========================================================================
       STAGE & LAYER STACK
       ========================================================================= */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    /* Living SVG Meadow Backdrop */
    #scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    #scene-svg stop,
    #scene-svg path,
    #scene-svg ellipse,
    #scene-svg circle {
      transition: stop-color 1.1s ease, fill 1.1s ease;
    }

    /* Sunbeam slow rotation */
    @keyframes spinRays {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .sun-rays {
      transform-origin: 1220px 130px;
      animation: spinRays 90s linear infinite;
    }

    /* Drifting clouds */
    @keyframes driftSlow {
      0%   { transform: translateX(-220px); }
      100% { transform: translateX(1660px); }
    }
    .cloud-1 { animation: driftSlow 78s linear infinite; animation-delay: -18s; }
    .cloud-2 { animation: driftSlow 102s linear infinite; animation-delay: -56s; }
    .cloud-3 { animation: driftSlow 64s linear infinite; animation-delay: -41s; }
    .cloud-4 { animation: driftSlow 90s linear infinite; animation-delay: -6s; }

    /* Swaying botanical grass & flowers */
    @keyframes swayGentle {
      0%, 100% { transform: rotate(-3.2deg); }
      50%      { transform: rotate(3.8deg); }
    }
    @keyframes swayAlt {
      0%, 100% { transform: rotate(3.5deg); }
      50%      { transform: rotate(-2.8deg); }
    }
    .sway-a { transform-box: fill-box; transform-origin: bottom center; animation: swayGentle 4.6s ease-in-out infinite; }
    .sway-b { transform-box: fill-box; transform-origin: bottom center; animation: swayAlt 5.4s ease-in-out infinite; }
    .sway-c { transform-box: fill-box; transform-origin: bottom center; animation: swayGentle 3.9s ease-in-out infinite; animation-delay: -1.4s; }

    /* Water shimmer */
    @keyframes ripplePulse {
      0%, 100% { opacity: 0.25; transform: scaleX(0.92); }
      50%      { opacity: 0.65; transform: scaleX(1.08); }
    }
    .water-shimmer {
      transform-box: fill-box;
      transform-origin: center;
      animation: ripplePulse 4.2s ease-in-out infinite;
    }
    .water-shimmer.d2 { animation-delay: -1.6s; }
    .water-shimmer.d3 { animation-delay: -3.0s; }

    /* Ambient & celebration particles canvas */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Hint connection trail SVG */
    #hint-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #hint-svg.visible {
      opacity: 1;
    }

    @keyframes dashFlow {
      from { stroke-dashoffset: 36; }
      to   { stroke-dashoffset: 0; }
    }
    .hint-path {
      fill: none;
      stroke: rgba(255, 245, 190, 0.78);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 2 16;
      animation: dashFlow 1.6s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 210, 90, 0.8));
    }

    /* =========================================================================
       WORDS PLAYFIELD & ORGANIC SURFACES (NO PLAIN WHITE RECTANGLES)
       ========================================================================= */
    #words-layer {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .word-node {
      position: absolute;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: clamp(13px, 1.35vh, 18px) clamp(24px, 2.2vw, 34px);
      pointer-events: none;
      transform-origin: center center;
      transition:
        transform 0.34s cubic-bezier(0.22, 1.25, 0.36, 1),
        filter 0.34s ease,
        left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.4s ease;
      will-change: transform, filter;
    }

    /* Organic SVG stone / wood / leaf backdrop */
    .word-shape {
      position: absolute;
      inset: -4px -8px;
      width: calc(100% + 16px);
      height: calc(100% + 8px);
      overflow: visible;
      z-index: 0;
      filter: drop-shadow(0 6px 10px rgba(34, 48, 36, 0.22));
      transition: filter 0.34s ease;
    }

    .word-shape .shape-base {
      transition: fill 0.32s ease, stroke 0.32s ease, stroke-width 0.32s ease, opacity 0.32s ease;
    }
    .word-shape .shape-hi {
      transition: opacity 0.32s ease, fill 0.32s ease;
    }
    .word-shape .shape-rim {
      transition: stroke 0.32s ease, stroke-width 0.32s ease, opacity 0.32s ease;
    }

    .word-text {
      position: relative;
      z-index: 1;
      font-size: clamp(25px, 2.25vw, 36px);
      font-weight: 800;
      letter-spacing: 0.015em;
      line-height: 1.08;
      color: #262922;
      white-space: nowrap;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    /* Subtle entrance animation when slide loads */
    @keyframes popInWord {
      0%   { opacity: 0; transform: scale(0.76) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .word-node.entering {
      animation: popInWord 0.46s cubic-bezier(0.22, 1.25, 0.36, 1) both;
    }

    /* -------------------------------------------------------------------------
       4 CONTRAST / HIGHLIGHT MODES
       ------------------------------------------------------------------------- */

    /* MODE 1: MAXIMUM CONTRAST (vivid glowing amber-coral, luminous aura, 1.12x scale) */
    .word-node.is-active.mode-1 {
      z-index: 20;
      transform: scale(1.13) translateY(-4px);
    }
    .word-node.is-active.mode-1 .word-shape {
      filter:
        drop-shadow(0 0 18px var(--m1-glow))
        drop-shadow(0 0 36px rgba(255, 130, 50, 0.68))
        drop-shadow(0 10px 16px rgba(70, 32, 8, 0.3));
    }
    .word-node.is-active.mode-1 .shape-base {
      fill: url(#activeGradM1) !important;
    }
    .word-node.is-active.mode-1 .shape-rim {
      stroke: #fff9d6 !important;
      stroke-width: 4.2 !important;
      opacity: 1 !important;
    }
    .word-node.is-active.mode-1 .word-text {
      color: #1c1005;
      text-shadow: 0 1px 2px rgba(255, 248, 210, 0.8);
    }

    /* MODE 2: MEDIUM CONTRAST (warm noticeable golden-peach tint, moderate glow, 1.05x scale) */
    .word-node.is-active.mode-2 {
      z-index: 20;
      transform: scale(1.055) translateY(-2px);
    }
    .word-node.is-active.mode-2 .word-shape {
      filter:
        drop-shadow(0 0 13px var(--m2-glow))
        drop-shadow(0 8px 13px rgba(45, 38, 22, 0.24));
    }
    .word-node.is-active.mode-2 .shape-base {
      fill: #f5ce87 !important;
    }
    .word-node.is-active.mode-2 .shape-rim {
      stroke: #fff3c7 !important;
      stroke-width: 2.8 !important;
      opacity: 0.92 !important;
    }
    .word-node.is-active.mode-2 .word-text {
      color: #211a0e;
    }

    /* MODE 3: LOW CONTRAST (gentle pastel shift, soft thin glow, NO scale change) */
    .word-node.is-active.mode-3 {
      z-index: 15;
      transform: scale(1);
    }
    .word-node.is-active.mode-3 .word-shape {
      filter:
        brightness(1.13)
        saturate(1.22)
        drop-shadow(0 0 8px var(--m3-glow))
        drop-shadow(0 6px 10px rgba(34, 48, 36, 0.22));
    }
    .word-node.is-active.mode-3 .shape-rim {
      stroke: rgba(255, 248, 210, 0.82) !important;
      stroke-width: 2.2 !important;
      opacity: 0.85 !important;
    }

    /* MODE 4: ULTRA-SUBTLE / EAGLE EYE (whisper-thin rim + delicate luminance nudge, NO scale) */
    .word-node.is-active.mode-4 {
      z-index: 15;
      transform: scale(1);
    }
    .word-node.is-active.mode-4 .word-shape {
      filter:
        brightness(1.075)
        saturate(1.12)
        drop-shadow(0 0 4px var(--m4-glow))
        drop-shadow(0 6px 10px rgba(34, 48, 36, 0.22));
    }
    .word-node.is-active.mode-4 .shape-rim {
      stroke: rgba(255, 252, 232, 0.52) !important;
      stroke-width: 1.5 !important;
      opacity: 0.65 !important;
    }

    /* HINT / REVEAL ALL SENTENCE WORDS */
    .word-node.is-hinted:not(.is-active) .word-shape {
      filter:
        brightness(1.08)
        drop-shadow(0 0 12px rgba(255, 230, 128, 0.72))
        drop-shadow(0 6px 10px rgba(34, 48, 36, 0.22));
    }
    .word-node.is-hinted:not(.is-active) .shape-rim {
      stroke: rgba(255, 240, 165, 0.92) !important;
      stroke-width: 2.6 !important;
      opacity: 0.95 !important;
    }

    /* =========================================================================
       CURIOUS RED FOX CHARACTER (BOTTOM-LEFT)
       ========================================================================= */
    #fox-wrap {
      position: absolute;
      left: clamp(10px, 1.8vw, 28px);
      bottom: clamp(8px, 1.5vh, 22px);
      width: clamp(128px, 12.5vw, 188px);
      aspect-ratio: 1 / 1;
      z-index: 6;
      pointer-events: none;
    }

    #fox-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 8px 12px rgba(26, 46, 30, 0.28));
    }

    /* Idle tail sway */
    @keyframes foxTailIdle {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(6deg); }
    }
    #fox-tail {
      transform-origin: 96px 158px;
      animation: foxTailIdle 3.2s ease-in-out infinite;
    }

    /* Idle ear twitch */
    @keyframes earTwitch {
      0%, 86%, 100% { transform: rotate(0deg); }
      90%           { transform: rotate(-10deg); }
      94%           { transform: rotate(3deg); }
    }
    #fox-ear-r {
      transform-origin: 122px 76px;
      animation: earTwitch 6.5s ease-in-out infinite;
    }

    /* Idle subtle breathing */
    @keyframes foxBreathe {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50%      { transform: translateY(-1.8px) scaleY(1.012); }
    }
    #fox-body-group {
      transform-origin: 100px 180px;
      animation: foxBreathe 3.8s ease-in-out infinite;
    }

    /* Celebration hop & tail wag */
    @keyframes foxCelebrateHop {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      18%      { transform: translateY(4px) scale(1.06, 0.93); }
      42%      { transform: translateY(-22px) scale(0.96, 1.06); }
      65%      { transform: translateY(2px) scale(1.04, 0.96); }
      82%      { transform: translateY(-10px) scale(0.99, 1.02); }
    }
    @keyframes foxTailWagFast {
      0%, 100% { transform: rotate(-14deg); }
      50%      { transform: rotate(16deg); }
    }
    #fox-wrap.celebrating #fox-body-group {
      animation: foxCelebrateHop 0.95s cubic-bezier(0.28, 0.84, 0.42, 1) 2;
    }
    #fox-wrap.celebrating #fox-tail {
      animation: foxTailWagFast 0.24s ease-in-out infinite;
    }

    /* Animated glowing "?" glyph popping up above fox */
    #question-glyph {
      position: absolute;
      left: 58%;
      top: -18%;
      width: clamp(46px, 4.4vw, 66px);
      height: clamp(46px, 4.4vw, 66px);
      opacity: 0;
      transform: translate(-50%, 18px) scale(0.3) rotate(-14deg);
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    @keyframes qPopFloat {
      0%   { opacity: 0; transform: translate(-50%, 22px) scale(0.3) rotate(-16deg); }
      18%  { opacity: 1; transform: translate(-50%, -8px) scale(1.18) rotate(8deg); }
      32%  { opacity: 1; transform: translate(-50%, -2px) scale(1.0) rotate(-4deg); }
      65%  { opacity: 1; transform: translate(-50%, -14px) scale(1.06) rotate(4deg); }
      88%  { opacity: 1; transform: translate(-50%, -18px) scale(1.0) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%, -32px) scale(0.85) rotate(6deg); }
    }
    #question-glyph.show {
      animation: qPopFloat 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* =========================================================================
       MINIMALIST WOODEN / BOTANICAL FLOATING CONTROL DOCK
       ========================================================================= */
    #control-dock {
      position: absolute;
      left: 50%;
      bottom: clamp(12px, 1.8vh, 22px);
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: clamp(4px, 0.55vw, 8px);
      padding: clamp(6px, 0.7vh, 9px) clamp(10px, 1.1vw, 16px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(84, 58, 37, 0.84) 0%, rgba(56, 39, 25, 0.90) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(226, 200, 152, 0.36);
      box-shadow:
        0 10px 28px rgba(24, 34, 22, 0.34),
        inset 0 1px 0 rgba(255, 240, 205, 0.28);
      cursor: default;
      max-width: calc(100vw - 24px);
    }

    .dock-sep {
      width: 1.5px;
      height: 24px;
      background: rgba(240, 218, 178, 0.24);
      border-radius: 2px;
      margin: 0 2px;
      flex-shrink: 0;
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: clamp(3px, 0.35vw, 5px);
    }

    .dock-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(34px, 3.1vw, 42px);
      height: clamp(34px, 3.1vw, 42px);
      border-radius: 50%;
      border: 1.5px solid transparent;
      background: rgba(255, 246, 225, 0.08);
      color: #f9efd8;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
      outline: none;
    }

    .dock-btn svg {
      width: 60%;
      height: 60%;
      display: block;
      pointer-events: none;
    }

    .dock-btn:hover {
      background: rgba(255, 244, 214, 0.18);
      transform: translateY(-1.5px);
    }

    .dock-btn:active {
      transform: scale(0.92);
    }

    .dock-btn.active {
      background: rgba(255, 212, 112, 0.24);
      border-color: #ffd778;
      box-shadow: 0 0 12px rgba(255, 208, 96, 0.42);
      color: #fff6d6;
    }

    /* Play/Pause prominent botanical accent */
    .dock-btn.play-btn {
      background: linear-gradient(145deg, #6ab36d, #488e50);
      border-color: rgba(232, 255, 218, 0.48);
      box-shadow: 0 4px 12px rgba(34, 72, 38, 0.35);
      color: #ffffff;
    }
    .dock-btn.play-btn:hover {
      background: linear-gradient(145deg, #77c27a, #529c5b);
    }
    .dock-btn.play-btn.is-playing {
      background: linear-gradient(145deg, #f3a63e, #df7e2a);
      border-color: rgba(255, 240, 198, 0.6);
    }

    /* Language toggle pill — ONLY shows "укр" or "рус" */
    .dock-btn.lang-btn {
      width: auto;
      min-width: clamp(44px, 4vw, 54px);
      padding: 0 10px;
      border-radius: 999px;
      font-family: var(--font-round);
      font-size: clamp(13px, 1.1vw, 15px);
      font-weight: 800;
      letter-spacing: 0.03em;
      background: rgba(255, 244, 218, 0.14);
      border-color: rgba(255, 232, 182, 0.32);
      color: #fff5dc;
    }
    .dock-btn.lang-btn:hover {
      background: rgba(255, 244, 218, 0.25);
    }

    /* Next slide button */
    .dock-btn.next-btn {
      background: linear-gradient(145deg, #f0b44c, #d9862b);
      border-color: rgba(255, 244, 204, 0.55);
      color: #fffdf5;
      box-shadow: 0 4px 12px rgba(92, 52, 12, 0.35);
    }
    .dock-btn.next-btn:hover {
      background: linear-gradient(145deg, #f8c362, #e59337);
    }

    /* Subtle pulse on play button when idle before first click */
    @keyframes gentleIdlePulse {
      0%, 100% { box-shadow: 0 4px 12px rgba(34, 72, 38, 0.35), 0 0 0 0 rgba(122, 206, 125, 0.55); }
      60%      { box-shadow: 0 4px 14px rgba(34, 72, 38, 0.35), 0 0 0 9px rgba(122, 206, 125, 0); }
    }
    .dock-btn.play-btn.idle-pulse {
      animation: gentleIdlePulse 2.4s ease-out infinite;
    }

    /* Responsive adjustments for smaller viewports */
    @media (max-width: 900px) {
      .dock-sep { margin: 0 1px; height: 18px; }
      #fox-wrap { width: 108px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- =====================================================================
         SHARED SVG DEFINITIONS (Gradients for Highlight Modes)
         ===================================================================== -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none;" aria-hidden="true">
      <defs>
        <linearGradient id="activeGradM1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffd147" />
          <stop offset="55%" stop-color="#ffaa2b" />
          <stop offset="100%" stop-color="#ff7a3d" />
        </linearGradient>
      </defs>
    </svg>

    <!-- =====================================================================
         LAYER 1: LIVING ANIMATED MEADOW & BOTANICAL POND SCENE
         ===================================================================== -->
    <svg id="scene-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop id="sky-s1" offset="0%" stop-color="var(--sky-top)" />
          <stop id="sky-s2" offset="56%" stop-color="var(--sky-mid)" />
          <stop id="sky-s3" offset="100%" stop-color="var(--sky-bot)" />
        </linearGradient>

        <radialGradient id="sunGlowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--sun-core)" stop-opacity="1" />
          <stop offset="40%" stop-color="var(--sun-glow)" stop-opacity="0.55" />
          <stop offset="100%" stop-color="var(--sun-glow)" stop-opacity="0" />
        </radialGradient>

        <linearGradient id="pondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--water-top)" />
          <stop offset="100%" stop-color="var(--water-bot)" />
        </linearGradient>

        <linearGradient id="hillNearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--hill-near)" />
          <stop offset="100%" stop-color="#356646" />
        </linearGradient>
      </defs>

      <!-- Sky -->
      <rect width="1440" height="900" fill="url(#skyGrad)" />

      <!-- Warm Sun & Rotating Translucent Sunbeams -->
      <g opacity="0.92">
        <g class="sun-rays" opacity="0.22">
          <polygon points="1220,130 1160,-220 1280,-220" fill="var(--sun-core)" />
          <polygon points="1220,130 1560,-40 1620,60" fill="var(--sun-core)" />
          <polygon points="1220,130 1580,260 1510,360" fill="var(--sun-core)" />
          <polygon points="1220,130 1280,520 1160,520" fill="var(--sun-core)" />
          <polygon points="1220,130 880,340 820,240" fill="var(--sun-core)" />
          <polygon points="1220,130 860,20 920,-80" fill="var(--sun-core)" />
        </g>
        <circle cx="1220" cy="130" r="195" fill="url(#sunGlowGrad)" />
        <circle cx="1220" cy="130" r="52" fill="var(--sun-core)" opacity="0.95" />
      </g>

      <!-- Gently Drifting Clouds -->
      <g fill="#ffffff" opacity="0.62">
        <g class="cloud-1">
          <path d="M40,140 C40,118 62,104 86,110 C96,88 130,84 148,102 C172,98 196,114 196,138 C196,154 180,162 162,162 L62,162 C48,162 40,152 40,140 Z" />
        </g>
        <g class="cloud-2" opacity="0.72">
          <path d="M20,210 C20,192 40,180 62,185 C74,166 106,164 122,182 C142,178 164,194 162,212 C160,224 146,230 130,230 L42,230 C28,230 20,222 20,210 Z" />

      /* =======================================================================
         4. WEB AUDIO API SYNTHESIZER (Warm Marimba/Kalimba Notes & Fanfare)
         ======================================================================= */
      const SoundEngine = (() => {
        let ctx = null;
        let muted = false;

        // Warm C-major pentatonic scale frequencies spanning 2 octaves
        const PENTATONIC = [
          261.63, // C4
          293.66, // D4
          329.63, // E4
          392.00, // G4
          440.00, // A4
          523.25, // C5
          587.33, // D5
          659.25, // E5
          783.99  // G5
        ];

        function ensureContext() {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) ctx = new AudioCtx();
          }
          if (ctx && ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          return ctx;
        }

        function playKalimbaNote(stepIndex) {
          if (muted) return;
          const ac = ensureContext();
          if (!ac) return;

          const now = ac.currentTime;
          const freq = PENTATONIC[stepIndex % PENTATONIC.length];

          // Fundamental warm sine + gentle harmonic bell overtone
          const osc1 = ac.createOscillator();
          const osc2 = ac.createOscillator();
          const gain1 = ac.createGain();
          const gain2 = ac.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2, now);

          gain1.gain.setValueAtTime(0.001, now);
          gain1.gain.exponentialRampToValueAtTime(0.22, now + 0.018);
          gain1.gain.exponentialRampToValueAtTime(0.0008, now + 0.58);

          gain2.gain.setValueAtTime(0.001, now);
          gain2.gain.exponentialRampToValueAtTime(0.055, now + 0.012);
          gain2.gain.exponentialRampToValueAtTime(0.0005, now + 0.24);

          osc1.connect(gain1).connect(ac.destination);
          osc2.connect(gain2).connect(ac.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.62);
          osc2.stop(now + 0.28);
        }

        function playCelebrationArpeggio() {
          if (muted) return;
          const ac = ensureContext();
          if (!ac) return;

          const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
          const base = ac.currentTime + 0.03;

          notes.forEach((freq, i) => {
            const t = base + i * 0.09;
            const osc = ac.createOscillator();
            const over = ac.createOscillator();
            const g = ac.createGain();
            const gOver = ac.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            over.type = 'triangle';
            over.frequency.setValueAtTime(freq * 2, t);

            g.gain.setValueAtTime(0.001, t);
            g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0008, t + 0.78);

            gOver.gain.setValueAtTime(0.001, t);
            gOver.gain.exponentialRampToValueAtTime(0.045, t + 0.015);
            gOver.gain.exponentialRampToValueAtTime(0.0005, t + 0.35);

            osc.connect(g).connect(ac.destination);
            over.connect(gOver).connect(ac.destination);

            osc.start(t);
            over.start(t);
            osc.stop(t + 0.82);
            over.stop(t + 0.38);
          });
        }

        function playSoftClick() {
          if (muted) return;
          const ac = ensureContext();
          if (!ac) return;

          const now = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(280, now + 0.055);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain).connect(ac.destination);
          osc.start(now);
          osc.stop(now + 0.065);
        }

        return {
          unlock: ensureContext,
          note: playKalimbaNote,
          celebrate: playCelebrationArpeggio,
          click: playSoftClick,
          setMuted(v) { muted = v; },
          isMuted() { return muted; }
        };
      })();

      function spawnWordRipple(x, y, mode) {
        const colors = {
          1: '#ffd147',
          2: '#f5ce87',
          3: '#fff3c4',
          4: '#ffffff'
        };
        const c = colors[mode] || '#ffd147';
        const alphaBase = mode === 1 ? 0.85 : mode === 2 ? 0.55 : mode === 3 ? 0.34 : 0.2;

        ripples.push({
          x, y,
          r: 22,
          maxR: mode <= 2 ? 105 : 74,
          alpha: alphaBase,
          color: c
        });

        const moteCount = mode === 1 ? 10 : mode === 2 ? 6 : 3;
        for (let i = 0; i < moteCount; i++) {
          const ang = (Math.PI * 2 * i) / moteCount + Math.random() * 0.5;
          const spd = 0.8 + Math.random() * 1.9;
          burstParticles.push({
            x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 0.5,
            size: 2.5 + Math.random() * 3.5,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.14,
            alpha: alphaBase,
            decay: 0.018 + Math.random() * 0.012,
            color: c,
            kind: 'spark'
          });
        }
      }

        const petalColors = ['#ff8fa3', '#ffd166', '#95d5b2', '#ffb703', '#c8b6ff', '#fff3b0'];
        // Burst from fox area + across center sky

          { x: viewW * 0.50, y: viewH * 0.45 },
          { x: viewW * 0.78, y: viewH * 0.58 }

        origins.forEach((o, idx) => {
          const count = idx === 0 ? 34 : 22;
          for (let i = 0; i < count; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 1.6 + Math.random() * 4.4;
            burstParticles.push({
              x: o.x + (Math.random() - 0.5) * 40,
              y: o.y + (Math.random() - 0.5) * 40,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd - (idx === 0 ? 2.6 : 1.4),
              size: 5 + Math.random() * 6.5,

              vRot: (Math.random() - 0.5) * 0.16,

      const questionGlyph = document.getElementById('question-glyph');

      const eyeState = {
        targetX: viewW * 0.5,
        targetY: viewH * 0.4,
        curX: 0,
        curY: 0
      };

      function updateFoxEyes() {
        const rect = foxWrap.getBoundingClientRect();
        const eyeOriginX = rect.left + rect.width * 0.47;
        const eyeOriginY = rect.top + rect.height * 0.43;

        const dx = eyeState.targetX - eyeOriginX;
        const dy = eyeState.targetY - eyeOriginY;
        const dist = Math.hypot(dx, dy) || 1;
        const maxOffset = 3.8;
        const factor = Math.min(dist / 220, 1) * maxOffset;

        const wantX = (dx / dist) * factor;
        const wantY = (dy / dist) * factor;

        eyeState.curX += (wantX - eyeState.curX) * 0.14;
        eyeState.curY += (wantY - eyeState.curY) * 0.14;

        const tf = `translate(${eyeState.curX.toFixed(2)}, ${eyeState.curY.toFixed(2)})`;
        foxPupilL.setAttribute('transform', tf);
        foxPupilR.setAttribute('transform', tf);
      }

      /* =======================================================================
         7. 60FPS ANIMATION LOOP
         ======================================================================= */
      function animateFrame(ts) {
        fxCtx.clearRect(0, 0, viewW, viewH);

        // 1. Pollen / dandelion seeds
        for (let i = 0; i < pollen.length; i++) {
          const p = pollen[i];
          p.phase += 0.015;
          p.x += p.vx + Math.sin(p.phase) * 0.2;
          p.y += p.vy + Math.cos(p.phase * 0.8) * 0.18;
          if (p.x > viewW + 12) p.x = -12;
          if (p.y < -12) p.y = viewH + 12;
          if (p.y > viewH + 12) p.y = -12;

          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          fxCtx.fillStyle = `rgba(255, 250, 220, ${p.alpha})`;
          fxCtx.fill();
        }

        // 2. Fluttering butterflies
        for (let i = 0; i < butterflies.length; i++) {
          const b = butterflies[i];
          b.phase += 0.02;
          b.wingPhase += 0.22;
          b.x += b.vx;
          b.y += Math.sin(b.phase) * 0.65;

          if (b.x > viewW + 40) { b.x = -35; b.y = viewH * (0.1 + Math.random() * 0.45); }
          if (b.x < -40) { b.x = viewW + 35; b.y = viewH * (0.1 + Math.random() * 0.45); }

          const flap = Math.abs(Math.sin(b.wingPhase));
          fxCtx.save();
          fxCtx.translate(b.x, b.y);
          fxCtx.scale(b.scale * (b.vx < 0 ? -1 : 1), b.scale);

          // Upper & lower wings
          fxCtx.fillStyle = b.colors[0];
          fxCtx.beginPath();
          fxCtx.ellipse(-3, -4 * flap, 8, 5.5 * (0.35 + 0.65 * flap), -0.45, 0, Math.PI * 2);
          fxCtx.fill();

          fxCtx.fillStyle = b.colors[1];
          fxCtx.beginPath();
          fxCtx.ellipse(4, -3 * flap, 6.5, 4.5 * (0.35 + 0.65 * flap), 0.45, 0, Math.PI * 2);
          fxCtx.fill();

          // Tiny body
          fxCtx.strokeStyle = '#4a3628';
          fxCtx.lineWidth = 1.6;
          fxCtx.beginPath();
          fxCtx.moveTo(-4, 2);
          fxCtx.lineTo(5, 0);
          fxCtx.stroke();
          fxCtx.restore();
        }

        // 3. Expanding organic ripples around highlighted words
        for (let i = ripples.length - 1; i >= 0; i--) {
          const rp = ripples[i];
          rp.r += 2.3;
          rp.alpha *= 0.945;
          if (rp.r >= rp.maxR || rp.alpha < 0.02) {
            ripples.splice(i, 1);
            continue;
          }
          fxCtx.save();
          fxCtx.beginPath();
          fxCtx.ellipse(rp.x, rp.y, rp.r * 1.25, rp.r * 0.68, 0, 0, Math.PI * 2);
          fxCtx.strokeStyle = rp.color;
          fxCtx.globalAlpha = rp.alpha;
          fxCtx.lineWidth = 2.6;
          fxCtx.stroke();
          fxCtx.restore();
        }

        // 4. Petals & golden sparkles
        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const pt = burstParticles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.vy += pt.kind === 'petal' ? 0.045 : 0.02;
          pt.vx *= 0.99;
          pt.rot += pt.vRot;
          pt.alpha -= pt.decay;

          if (pt.alpha <= 0) {
            burstParticles.splice(i, 1);
            continue;
          }

          fxCtx.save();
          fxCtx.translate(pt.x, pt.y);
          fxCtx.rotate(pt.rot);
          fxCtx.globalAlpha = Math.max(0, pt.alpha);
          fxCtx.fillStyle = pt.color;

          if (pt.kind === 'petal') {
            fxCtx.beginPath();
            fxCtx.ellipse(0, 0, pt.size, pt.size * 0.52, 0, 0, Math.PI * 2);
            fxCtx.fill();
          } else {
            // 4-point sparkle
            const s = pt.size;
            fxCtx.beginPath();
            fxCtx.moveTo(0, -s);
            fxCtx.quadraticCurveTo(0, 0, s, 0);
            fxCtx.quadraticCurveTo(0, 0, 0, s);
            fxCtx.quadraticCurveTo(0, 0, -s, 0);
            fxCtx.quadraticCurveTo(0, 0, 0, -s);
            fxCtx.fill();
          }
          fxCtx.restore();
        }

        // 5. Smooth fox eye tracking
        updateFoxEyes();

        requestAnimationFrame(animateFrame);
      }

      /* =======================================================================
         8. GAME STATE & SLIDE DECK MANAGEMENT
         ======================================================================= */
      const wordsLayer = document.getElementById('words-layer');
      const hintSvg = document.getElementById('hint-svg');
      const stage = document.getElementById('stage');
      const controlDock = document.getElementById('control-dock');
      const btnPlay = document.getElementById('btn-play');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const btnReplay = document.getElementById('btn-replay');
      const btnHint = document.getElementById('btn-hint');
      const btnSound = document.getElementById('btn-sound');
      const iconSoundOn = document.getElementById('icon-sound-on');
      const iconSoundOff = document.getElementById('icon-sound-off');
      const btnLang = document.getElementById('btn-lang');
      const btnNext = document.getElementById('btn-next');

      const state = {
        lang: 'uk',             // 'uk' or 'ru'
        contrastMode: 1,        // 1..4
        speedMs: 1500,          // 2200, 1500, 1000, 650
        slideOrder: SLIDES.map((_, i) => i),
        deckPos: 0,
        paletteIndex: 0,
        isPlaying: false,
        isFinished: false,
        hintVisible: false,
        activeStep: -1,         // index in sentence (0 .. sentenceLen-1)
        timerId: null,
        stepStartedAt: 0,
        items: []               // { id, isSentence, sentenceIdx, shapeVariant, fillColor, el, textEl, x, y, w, h }
      };

      function shuffleArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function applyPalette(idx) {
        const p = PALETTES[idx % PALETTES.length];
        const root = document.documentElement.style;
        root.setProperty('--sky-top', p.skyTop);
        root.setProperty('--sky-mid', p.skyMid);
        root.setProperty('--sky-bot', p.skyBot);
        root.setProperty('--sun-core', p.sunCore);
        root.setProperty('--sun-glow', p.sunGlow);
        root.setProperty('--hill-far', p.hillFar);
        root.setProperty('--hill-mid', p.hillMid);
        root.setProperty('--hill-near', p.hillNear);
        root.setProperty('--water-top', p.waterTop);
        root.setProperty('--water-bot', p.waterBot);
        root.setProperty('--flower-a', p.fa);
        root.setProperty('--flower-b', p.fb);
        root.setProperty('--flower-c', p.fc);
        return p;
      }

      /* =======================================================================
         9. COLLISION-FREE ORGANIC LAYOUT ENGINE
            Guarantees zero overlaps, zero clipping, and avoids Fox & Dock.
         ======================================================================= */
      function layoutWords(preserveOrder = false) {
        const items = state.items;
        if (!items.length) return;

        const dockRect = controlDock.getBoundingClientRect();
        const foxRect = foxWrap.getBoundingClientRect();

        const padLeft = Math.max(22, viewW * 0.028);
        const padRight = Math.max(22, viewW * 0.028);
        const padTop = Math.max(22, viewH * 0.038);
        const safeBottom = Math.min(dockRect.top - 24, viewH - 96);

        const usableW = Math.max(300, viewW - padLeft - padRight);
        const usableH = Math.max(240, safeBottom - padTop);

        // Fox exclusion rectangle (bottom-left corner)
        const foxZone = {
          right: foxRect.right + 22,
          top: foxRect.top - 18
        };

        // Measure current rendered bounding box of every word node
        items.forEach(item => {
          item.w = item.el.offsetWidth;
          item.h = item.el.offsetHeight;
        });

        if (!preserveOrder) {
          // Build a spacious 5x4 (20-slot) organic grid and filter out the fox corner
          const cols = 5;
          const rows = 4;
          const cellW = usableW / cols;
          const cellH = usableH / rows;

          const cells = [];
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const cx = padLeft + (c + 0.5) * cellW;
              const cy = padTop + (r + 0.5) * cellH;
              // Skip cell that sits directly over the fox
              if (cx < foxZone.right + 20 && cy > foxZone.top - 10) continue;
              cells.push({ cx, cy, r, c });
            }
          }

          let shuffledCells = shuffleArray(cells);

          // Assign each item to a shuffled cell with organic jitter
          items.forEach((item, idx) => {
            const cell = shuffledCells[idx % shuffledCells.length];
            const jx = (Math.random() - 0.5) * cellW * 0.32;
            const jy = (Math.random() - 0.5) * cellH * 0.34;
            item.x = cell.cx - item.w / 2 + jx;
            item.y = cell.cy - item.h / 2 + jy;
          });

          // Ensure sentence words are genuinely scattered (not monotonically left-to-right)
          const sentItems = items
            .filter(it => it.isSentence)
            .sort((a, b) => a.sentenceIdx - b.sentenceIdx);
          let monoRun = 0;
          for (let i = 1; i < sentItems.length; i++) {
            if (sentItems[i].x > sentItems[i - 1].x) monoRun++;
          }
          if (monoRun >= sentItems.length - 2 && sentItems.length >= 4) {
            // Swap positions of 2nd and penultimate sentence words for better visual scanning
            const a = sentItems[1];
            const b = sentItems[sentItems.length - 2];
            [a.x, b.x] = [b.x, a.x];
            [a.y, b.y] = [b.y, a.y];
          }
        }

        // Iterative collision resolution + boundary clamping (AABB separation)
        const gapX = Math.max(18, viewW * 0.015);
        const gapY = Math.max(16, viewH * 0.018);

        for (let iter = 0; iter < 140; iter++) {
          let moved = false;

          for (let i = 0; i < items.length; i++) {
            const a = items[i];

            // Resolve pairwise overlaps
            for (let j = i + 1; j < items.length; j++) {
              const b = items[j];
              const overlapX = (a.w / 2 + b.w / 2 + gapX) - Math.abs((a.x + a.w / 2) - (b.x + b.w / 2));
              const overlapY = (a.h / 2 + b.h / 2 + gapY) - Math.abs((a.y + a.h / 2) - (b.y + b.h / 2));

              if (overlapX > 0 && overlapY > 0) {
                moved = true;
                if (overlapX < overlapY) {
                  const dir = (a.x + a.w / 2) < (b.x + b.w / 2) ? -1 : 1;
                  const shift = overlapX * 0.52;
                  a.x += dir * shift;
                  b.x -= dir * shift;
                } else {
                  const dir = (a.y + a.h / 2) < (b.y + b.h / 2) ? -1 : 1;
                  const shift = overlapY * 0.52;
                  a.y += dir * shift;
                  b.y -= dir * shift;
                }
              }
            }

            // Push out of Fox exclusion zone
            if (a.x < foxZone.right && (a.y + a.h) > foxZone.top) {
              const pushRight = foxZone.right - a.x;
              const pushUp = (a.y + a.h) - foxZone.top;
              if (pushRight < pushUp * 1.4) {
                a.x += pushRight * 0.65;
              } else {
                a.y -= pushUp * 0.65;
              }
              moved = true;
            }

            // Clamp strictly inside safe playfield
            const maxX = viewW - padRight - a.w;
            const maxY = safeBottom - a.h;
            if (a.x < padLeft) { a.x = padLeft; moved = true; }
            if (a.x > maxX)    { a.x = maxX;    moved = true; }
            if (a.y < padTop)  { a.y = padTop;  moved = true; }
            if (a.y > maxY)    { a.y = maxY;    moved = true; }
          }

          if (!moved) break;
        }

        // Commit positions to DOM
        items.forEach(item => {
          item.el.style.left = `${Math.round(item.x)}px`;
          item.el.style.top = `${Math.round(item.y)}px`;
        });

        // Update hint connection overlay if active
        renderHintOverlay();

        // Re-aim fox eyes if a word is currently highlighted
        if (state.activeStep >= 0) {
          const activeItem = getSentenceItem(state.activeStep);
          if (activeItem) aimFoxAtItem(activeItem);
        }
      }

      /* =======================================================================
         10. HINT / REVEAL OVERLAY (Connects Sentence Words in Order)
         ======================================================================= */
      function renderHintOverlay() {
        if (!state.hintVisible) {
          hintSvg.classList.remove('visible');
          hintSvg.innerHTML = '';
          return;
        }

        const sentItems = state.items
          .filter(it => it.isSentence)
          .sort((a, b) => a.sentenceIdx - b.sentenceIdx);

        if (sentItems.length < 2) return;

        hintSvg.setAttribute('viewBox', `0 0 ${viewW} ${viewH}`);
        let svgParts = [];

        // Draw smooth curved dotted trail connecting sentence words in exact order
        for (let i = 0; i < sentItems.length - 1; i++) {
          const a = sentItems[i];
          const b = sentItems[i + 1];
          const ax = a.x + a.w / 2;
          const ay = a.y + a.h / 2;
          const bx = b.x + b.w / 2;
          const by = b.y + b.h / 2;
          const mx = (ax + bx) / 2;
          const my = (ay + by) / 2 - 22;

          svgParts.push(`<path class="hint-path" d="M${ax},${ay} Q${mx},${my} ${bx},${by}" />`);
        }

        // Glowing pearl dot at each sentence word center (slightly brighter on word 1)
        sentItems.forEach((it, idx) => {
          const cx = it.x + it.w / 2;
          const cy = it.y + it.h / 2;
          const r = idx === 0 ? 7.5 : 4.5;
          const fill = idx === 0 ? '#ffd147' : '#fff5c2';
          svgParts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" opacity="0.85" />`);
        });

        hintSvg.innerHTML = svgParts.join('');
        hintSvg.classList.add('visible');
      }

      /* =======================================================================
         11. SLIDE RENDERING & LIVE LANGUAGE SWITCHING
         ======================================================================= */
      function getCurrentSlide() {
        const slideIdx = state.slideOrder[state.deckPos];
        return SLIDES[slideIdx];
      }

      function getSentenceItem(stepIdx) {
        return state.items.find(it => it.isSentence && it.sentenceIdx === stepIdx) || null;
      }

      function aimFoxAtItem(item) {
        eyeState.targetX = item.x + item.w / 2;
        eyeState.targetY = item.y + item.h / 2;
      }

      function loadSlide() {
        stopPlayback(true);
        foxWrap.classList.remove('celebrating');
        questionGlyph.classList.remove('show');

        const palette = applyPalette(state.paletteIndex);
        const slide = getCurrentSlide();
        const langPack = slide[state.lang];

        // Build combined word descriptors
        const rawItems = [];
        langPack.sentence.forEach((word, sIdx) => {
          rawItems.push({ isSentence: true, sentenceIdx: sIdx, word });
        });
        langPack.distractors.forEach((word, dIdx) => {
          rawItems.push({ isSentence: false, distractorIdx: dIdx, word });
        });

        // Shuffle visual order
        const shuffled = shuffleArray(rawItems);

        wordsLayer.innerHTML = '';
        state.items = shuffled.map((entry, idx) => {
          const fillColor = palette.stones[idx % palette.stones.length];
          const shapeVariant = (idx + state.paletteIndex) % 4;

          const node = document.createElement('div');
          node.className = `word-node entering mode-${state.contrastMode}`;
          if (state.hintVisible && entry.isSentence) {
            node.classList.add('is-hinted');
          }
          node.style.animationDelay = `${(idx * 22)}ms`;
          node.innerHTML = buildOrganicShapeSVG(shapeVariant, fillColor);

          const span = document.createElement('span');
          span.className = 'word-text';
          span.textContent = entry.word;
          node.appendChild(span);

          wordsLayer.appendChild(node);

          return {
            isSentence: entry.isSentence,
            sentenceIdx: entry.sentenceIdx ?? -1,
            distractorIdx: entry.distractorIdx ?? -1,
            shapeVariant,
            fillColor,
            el: node,
            textEl: span,
            x: 0, y: 0, w: 0, h: 0
          };
        });

        // Remove entering animation class after entrance so highlight transitions are crisp
        setTimeout(() => {
          state.items.forEach(it => it.el.classList.remove('entering'));
        }, 720);

        // Aim fox gently toward center
        eyeState.targetX = viewW * 0.52;
        eyeState.targetY = viewH * 0.42;

        // Compute collision-free layout
        layoutWords(false);
        updatePlayButtonUI();
      }

      function translateCurrentSlideInPlace() {
        const slide = getCurrentSlide();
        const langPack = slide[state.lang];

        state.items.forEach(item => {
          if (item.isSentence) {
            item.textEl.textContent = langPack.sentence[item.sentenceIdx];
          } else {
            item.textEl.textContent = langPack.distractors[item.distractorIdx];
          }
        });

        // Gently relax any minor overlap caused by longer/shorter translated words
        layoutWords(true);
      }

      /* =======================================================================
         12. SEQUENTIAL HIGHLIGHTING PLAYBACK ENGINE
         ======================================================================= */
      function clearActiveHighlight() {
        state.items.forEach(it => it.el.classList.remove('is-active'));
      }

      function applyContrastModeClasses() {
        state.items.forEach(it => {
          it.el.classList.remove('mode-1', 'mode-2', 'mode-3', 'mode-4');
          it.el.classList.add(`mode-${state.contrastMode}`);
        });
      }

      function updatePlayButtonUI() {
        if (state.isPlaying) {
          btnPlay.classList.add('is-playing');
          btnPlay.classList.remove('idle-pulse');
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
        } else {
          btnPlay.classList.remove('is-playing');
          if (state.activeStep < 0 && !state.isFinished) {
            btnPlay.classList.add('idle-pulse');
          } else {
            btnPlay.classList.remove('idle-pulse');
          }
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
        }
      }

      function stopPlayback(resetStep = false) {
        if (state.timerId !== null) {
          clearTimeout(state.timerId);
          state.timerId = null;
        }
        state.isPlaying = false;
        if (resetStep) {
          state.activeStep = -1;
          state.isFinished = false;
          clearActiveHighlight();
        }
        updatePlayButtonUI();
      }

      function triggerCelebration() {
        state.isPlaying = false;
        state.isFinished = true;
        state.timerId = null;
        clearActiveHighlight();
        updatePlayButtonUI();

        // Musical celebration arpeggio
        SoundEngine.celebrate();

        // Burst of petals & golden sparkles
        spawnCelebrationBurst();

        // Curious fox joyful bounce & animated "?" glyph
        foxWrap.classList.remove('celebrating');
        questionGlyph.classList.remove('show');
        void foxWrap.offsetWidth; // reflow to restart CSS animations cleanly
        foxWrap.classList.add('celebrating');
        questionGlyph.classList.add('show');

        // Look gently upward at the floating "?"
        const foxRect = foxWrap.getBoundingClientRect();
        eyeState.targetX = foxRect.left + foxRect.width * 0.58;
        eyeState.targetY = foxRect.top - 40;

        setTimeout(() => {
          foxWrap.classList.remove('celebrating');
        }, 2100);
      }

      function highlightStep(stepIdx) {
        const slide = getCurrentSlide();
        const total = slide[state.lang].sentence.length;

        if (stepIdx >= total) {
          triggerCelebration();
          return;
        }

        state.activeStep = stepIdx;
        state.stepStartedAt = performance.now();
        clearActiveHighlight();

        const targetItem = getSentenceItem(stepIdx);
        if (targetItem) {
          targetItem.el.classList.add('is-active');
          aimFoxAtItem(targetItem);
          spawnWordRipple(
            targetItem.x + targetItem.w / 2,
            targetItem.y + targetItem.h / 2,
            state.contrastMode
          );
          SoundEngine.note(stepIdx);
        }

        state.timerId = setTimeout(() => {
          if (state.isPlaying) {
            highlightStep(state.activeStep + 1);
          }
        }, state.speedMs);
      }

      function togglePlayPause() {
        SoundEngine.unlock();

        if (state.isPlaying) {
          // Pause right on current word
          if (state.timerId !== null) {
            clearTimeout(state.timerId);
            state.timerId = null;
          }
          state.isPlaying = false;
          updatePlayButtonUI();
          return;
        }

        // Start or resume
        foxWrap.classList.remove('celebrating');
        questionGlyph.classList.remove('show');
        state.isPlaying = true;
        updatePlayButtonUI();

        if (state.isFinished || state.activeStep < 0) {
          state.isFinished = false;
          highlightStep(0);
        } else {
          // Resume from next step cleanly
          state.stepStartedAt = performance.now();
          state.timerId = setTimeout(() => {
            if (state.isPlaying) {
              highlightStep(state.activeStep + 1);
            }
          }, Math.max(420, state.speedMs * 0.65));
        }
      }

      function replaySlide() {
        SoundEngine.unlock();
        stopPlayback(true);
        foxWrap.classList.remove('celebrating');
        questionGlyph.classList.remove('show');
        state.isPlaying = true;
        updatePlayButtonUI();
        highlightStep(0);
      }

      function nextSlide() {
        SoundEngine.unlock();
        SoundEngine.click();
        state.deckPos++;
        state.paletteIndex++;

        if (state.deckPos >= state.slideOrder.length) {
          // Seamlessly reshuffle all 15 slides and continue endlessly
          const lastSlideIdx = state.slideOrder[state.slideOrder.length - 1];
          state.slideOrder = shuffleArray(SLIDES.map((_, i) => i));
          // Avoid repeating the exact same slide back-to-back
          if (state.slideOrder[0] === lastSlideIdx) {
            const swapIdx = 1 + Math.floor(Math.random() * (state.slideOrder.length - 1));
            [state.slideOrder[0], state.slideOrder[swapIdx]] = [state.slideOrder[swapIdx], state.slideOrder[0]];
          }
          state.deckPos = 0;
        }

        loadSlide();
      }

      /* =======================================================================
         13. EVENT LISTENERS (Click Playfield, Live Contrast/Speed/Lang Controls)
         ======================================================================= */
      // Clicking anywhere on the playfield toggles Play / Pause
      stage.addEventListener('click', (e) => {
        if (controlDock.contains(e.target)) return;
        togglePlayPause();
      });

      // Prevent dock clicks from bubbling to stage
      controlDock.addEventListener('click', (e) => {
        e.stopPropagation();
      });

      btnPlay.addEventListener('click', () => {
        togglePlayPause();
      });

      btnReplay.addEventListener('click', () => {
        replaySlide();
      });

      // Contrast Mode 1..4 (instant live update even mid-sentence)
      document.querySelectorAll('#contrast-group .dock-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          SoundEngine.unlock();
          SoundEngine.click();
          state.contrastMode = Number(btn.dataset.mode);
          document.querySelectorAll('#contrast-group .dock-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyContrastModeClasses();
        });
      });

      // Speed Presets (instant live update even mid-sentence)
      document.querySelectorAll('#speed-group .dock-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          SoundEngine.unlock();
          SoundEngine.click();
          state.speedMs = Number(btn.dataset.speed);
          document.querySelectorAll('#speed-group .dock-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          // Reschedule active timer immediately if currently playing
          if (state.isPlaying && state.timerId !== null) {
            clearTimeout(state.timerId);
            const elapsed = performance.now() - state.stepStartedAt;
            const remaining = Math.max(90, state.speedMs - elapsed);
            state.timerId = setTimeout(() => {
              if (state.isPlaying) {
                highlightStep(state.activeStep + 1);
              }
            }, remaining);
          }
        });
      });

      // Reveal / Hint Toggle
      btnHint.addEventListener('click', () => {
        SoundEngine.unlock();
        SoundEngine.click();
        state.hintVisible = !state.hintVisible;
        btnHint.classList.toggle('active', state.hintVisible);
        state.items.forEach(it => {
          if (it.isSentence) {
            it.el.classList.toggle('is-hinted', state.hintVisible);
          }
        });
        renderHintOverlay();
      });

      // Sound Mute / Unmute
      btnSound.addEventListener('click', () => {
        SoundEngine.unlock();
        const nextMuted = !SoundEngine.isMuted();
        SoundEngine.setMuted(nextMuted);
        iconSoundOn.style.display = nextMuted ? 'none' : 'block';
        iconSoundOff.style.display = nextMuted ? 'block' : 'none';
        btnSound.classList.toggle('active', nextMuted);
        if (!nextMuted) SoundEngine.click();
      });

      // Language Toggle ("укр" <-> "рус")
      btnLang.addEventListener('click', () => {
        SoundEngine.unlock();
        SoundEngine.click();
        state.lang = state.lang === 'uk' ? 'ru' : 'uk';
        btnLang.textContent = state.lang === 'uk' ? 'укр' : 'рус';
        translateCurrentSlideInPlace();
      });

      // Next Slide
      btnNext.addEventListener('click', () => {
        nextSlide();
      });

      // Keyboard convenience (Space = Play/Pause, Right Arrow = Next)
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlayPause();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextSlide();
        }
      });

      // Responsive Resize Handler
      let resizeRaf = null;
      window.addEventListener('resize', () => {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(() => {
          initCanvas();
          layoutWords(false);
        });
      });

      /* =======================================================================
         14. INITIALIZATION
         ======================================================================= */
      window.addEventListener('load', () => {
        initCanvas();
        seedAmbientLife();
        loadSlide();
        requestAnimationFrame(animateFrame);
      });
    })();
  </script>
</body>
</html>
