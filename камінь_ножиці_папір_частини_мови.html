<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камінь, Ножиці, Папір - Механіка</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root {
            --font-size: 32px;
        }
        
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #87CEEB;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease, box-shadow 0.5s ease;
            display: flex;
            flex-direction: column;
            color: #333;
            overflow-x: hidden;
        }

        /* Візуальні ефекти результату */
        body.winner-glow {
            box-shadow: inset 0 0 100px 30px rgba(0, 255, 0, 0.8);
        }
        body.loser-glow {
            box-shadow: inset 0 0 100px 30px rgba(255, 0, 0, 0.8);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        body.draw-glow {
            box-shadow: inset 0 0 100px 30px rgba(255, 255, 0, 0.6);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        /* Конфетті */
        .confetti {
            position: fixed;
            top: -10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            z-index: 999;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: transparent;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
        }

        .score-board {
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 15px;
            border-radius: 10px;
            border: 2px solid #333;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 5px 15px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-control:hover { background: rgba(255, 255, 255, 0.8); }

        .game-layout {
            display: flex;
            flex-grow: 1;
            width: 100%;
            padding: 20px;
            gap: 20px;
        }

        .game-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Бокова панель гравців */
        .sidebar-players {
            width: 250px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed #333;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-title {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }

        .player-item {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            transition: 0.3s;
        }

        .player-item.ready {
            background: rgba(144, 238, 144, 0.8); /* Світло-зелений */
            border-color: green;
        }

        .player-choice-display {
            font-size: 1.5rem;
        }

        /* Флеш-картка */
        .flashcard {
            font-size: var(--font-size);
            font-weight: bold;
            text-align: center;
            margin: 0 0 40px 0;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            border: 4px dashed #333;
            background: rgba(255, 255, 255, 0.5);
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
            word-wrap: break-word;
        }

        .weapons-panel {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            width: 100%;
        }

        .weapon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            background: transparent;
        }

        .weapon-card:hover { transform: scale(1.1); }
        .weapon-card.selected .weapon-emoji {
            background: rgba(255, 255, 0, 0.6);
            border-color: #ff9800;
            transform: scale(1.15);
            box-shadow: 0 0 20px yellow;
        }

        .weapon-emoji {
            font-size: 70px;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            border: 3px solid #333;
            transition: all 0.2s ease;
            user-select: none;
        }

        /* Мінімалістичні кнопки дій (Нижній лівий кут) */
        .action-buttons {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn-minimal {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px #333;
            transition: all 0.1s;
        }
        .btn-minimal:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #333;
        }
        .btn-minimal.primary {
            background: #ffeb3b;
        }

        /* Theme Manager Styles */
        .theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #333;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .theme-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }

        .theme-content {
            background: #fff;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .theme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .close-theme { cursor: pointer; font-size: 1.5rem; color: red; }

        .theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .theme-thumb {
            width: 100px;
            height: 70px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            overflow: hidden;
        }
        .theme-thumb:hover { border-color: #007bff; }
        .theme-thumb span {
            background: rgba(0,0,0,0.6);
            color: #fff;
            width: 100%;
            text-align: center;
            font-size: 12px;
            padding: 2px 0;
            pointer-events: none;
        }

        /* Адаптивність */
        @media (max-width: 768px) {
            .game-layout {
                flex-direction: column-reverse;
            }
            .sidebar-players {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .player-item {
                min-width: 120px;
                flex-grow: 1;
            }
            .weapon-emoji { width: 80px; height: 80px; font-size: 40px; }
            .action-buttons {
                position: static;
                justify-content: center;
                margin-top: 30px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-board" id="score-board">0 : 0</div>
        <div class="controls">
            <button class="btn-control" onclick="changeFontSize(-4)">A-</button>
            <button class="btn-control" onclick="changeFontSize(4)">A+</button>
        </div>
    </div>

    <div class="game-layout">
        <div class="game-main">
            <div id="flashcard-word" class="flashcard">Завантаження...</div>

            <div class="weapons-panel">
                <div class="weapon-card" id="card-rock" onclick="makeChoice('rock')">
                    <div class="weapon-emoji">🪨</div>
                </div>
                <div class="weapon-card" id="card-scissors" onclick="makeChoice('scissors')">
                    <div class="weapon-emoji">✂️</div>
                </div>
                <div class="weapon-card" id="card-paper" onclick="makeChoice('paper')">
                    <div class="weapon-emoji">📄</div>
                </div>
            </div>
        </div>

        <div class="sidebar-players">
            <div class="sidebar-title">Гравці</div>
            <div id="players-container">
                <!-- Гравці генеруються тут -->
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-minimal primary" id="btn-reveal" onclick="forceReveal()" style="display: none;">Розкрити</button>
        <button class="btn-minimal" id="btn-next" onclick="nextRound()" style="display: none;">➡️ Наступна</button>
    </div>

    <!-- Theme Manager UI -->
    <button class="theme-btn" onclick="document.getElementById('theme-modal').style.display='flex'">⚙️</button>
    <div id="theme-modal" class="theme-modal">
        <div class="theme-content">
            <div class="theme-header">
                <span>Оберіть фон</span>
                <span class="close-theme" onclick="document.getElementById('theme-modal').style.display='none'">&times;</span>
            </div>
            <div id="theme-gallery" class="theme-gallery"></div>
        </div>
    </div>

    <!-- Universal Control Block -->
    <div id="block-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 999999; justify-content: center; align-items: center; color: red; font-size: 3rem; font-weight: bold; font-family: Arial, sans-serif; text-align: center;">Зачекай! Зараз не твій урок.</div>

    <script>
        // 1. Ініціалізація Firebase
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 2. Ідентифікація та контроль доступу
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user') || sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('userName', myName);

        const tabId = Math.random().toString(36).substring(2, 15);
        
        let activeUsersGlobal = {};
        let onlineUsersLoaded = false; 

        db.ref('online_users').on('value', snap => {
            activeUsersGlobal = snap.val() || {};
            onlineUsersLoaded = true; 
            checkAndRemoveGhosts();
        });

        function checkAndRemoveGhosts() {
            if (!currentPlayers || !onlineUsersLoaded) return; 
            for (const playerName in currentPlayers) {
                if (!activeUsersGlobal[playerName]) {
                    db.ref(`game_state/rps_room/players/${playerName}`).remove();
                }
            }
        }

        db.ref('.info/connected').on('value', snap => {
            if (snap.val()) {
                const ref = db.ref(`online_users/${myName}/${tabId}`);
                ref.onDisconnect().remove();
                ref.set(true);
                
                const playerRef = db.ref(`game_state/rps_room/players/${myName}`);
                playerRef.onDisconnect().remove(); 
                
                // Ініціалізуємо статистику (Перемоги та Поразки)
                playerRef.once('value', s => {
                    let data = s.val() || {};
                    playerRef.set({ 
                        choice: "", 
                        wins: data.wins || 0, 
                        losses: data.losses || 0,
                        online: true 
                    });
                });
            }
        });

        window.addEventListener('beforeunload', () => {
            db.ref(`online_users/${myName}/${tabId}`).remove();
            db.ref(`game_state/rps_room/players/${myName}`).remove();
        });

        let firstRefreshLoad = true;
        db.ref('force_refresh').on('value', snap => {
            if (!firstRefreshLoad && snap.val() === true) window.location.reload();
            firstRefreshLoad = false;
        });

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        let immune = true;
        setTimeout(() => immune = false, 1000);
        db.ref('current_activity').on('value', snap => {
            if (!immune && snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        // 3. Theme Manager Логіка
        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) document.body.style.backgroundImage = `url(${savedBg})`;

        db.ref('game_theme').on('value', snap => {
            const themeUrl = snap.val();
            if (themeUrl) {
                document.body.style.backgroundImage = `url(${themeUrl})`;
                localStorage.setItem('mySavedGameBg', themeUrl);
            }
        });

        async function loadThemes() {
            const gallery = document.getElementById('theme-gallery');
            for(let i = 1; i <= 100; i++) { 
                let url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                let img = new Image();
                img.src = url;
                img.onload = () => {
                    let div = document.createElement('div');
                    div.className = 'theme-thumb';
                    div.style.backgroundImage = `url(${url})`;
                    div.innerHTML = `<span>Фон ${i}</span>`;
                    div.onclick = () => {
                        db.ref('game_theme').set(url);
                        document.getElementById('theme-modal').style.display = 'none';
                    };
                    gallery.appendChild(div);
                };
                if (i % 10 === 0) await new Promise(r => setTimeout(r, 10)); 
            }
        }
        loadThemes();

        // 4. Логіка гри Камінь-Ножиці-Папір
        const flashcards = [
            "Кіт", "Собака", "Дерево", "Будинок", "Книга", "Сонце", "Місяць", "Автомобіль", "Місто", "Річка",
            "Гора", "Хліб", "Вода", "Стіл", "Вікно", "Двері", "Птах", "Риба", "Квітка", "Яблуко",
            "Великий", "Маленький", "Швидкий", "Повільний", "Добрий", "Злий", "Гарячий", "Холодний", "Новий", "Старий",
            "Чистий", "Брудний", "Високий", "Низький", "Сильний", "Слабкий", "Яскравий", "Темний", "Смачний", "Солодкий",
            "Бігти", "Стрибати", "Плавати", "Літати", "Читати", "Писати", "Говорити", "Мовчати", "Їсти", "Пити",
            "Спати", "Працювати", "Грати", "Співати", "Танцювати", "Дивитися", "Слухати", "Думати", "Розуміти", "Любити"
        ];

        let currentPlayers = {};
        let gameState = { status: 'waiting', cardIndex: 0 };
        const emojis = { rock: '🪨', scissors: '✂️', paper: '📄' };

        // Стан кімнати
        db.ref('game_state/rps_room/state').on('value', snap => {
            const data = snap.val();
            if (data) {
                const oldStatus = gameState.status;
                gameState = data;
                document.getElementById('flashcard-word').innerText = flashcards[(gameState.cardIndex || 0) % flashcards.length];
                
                // Якщо статус змінився на revealed, запускаємо візуальний ефект
                if (oldStatus === 'waiting' && gameState.status === 'revealed') {
                    triggerVisualFeedback();
                }

                updateUI();
            } else {
                db.ref('game_state/rps_room/state').set({ status: 'waiting', cardIndex: 0 });
            }
        });

        // Стан гравців
        db.ref('game_state/rps_room/players').on('value', snap => {
            currentPlayers = snap.val() || {};
            checkAndRemoveGhosts();

            if (currentPlayers[myName]) {
                const wins = currentPlayers[myName].wins || 0;
                const losses = currentPlayers[myName].losses || 0;
                document.getElementById('score-board').innerText = `${wins} : ${losses}`;
            }
            updateUI();
        });

        function updateUI() {
            renderPlayers();
            checkAutoReveal();
            
            ['rock', 'scissors', 'paper'].forEach(c => document.getElementById(`card-${c}`).classList.remove('selected'));
            if (currentPlayers[myName] && currentPlayers[myName].choice) {
                document.getElementById(`card-${currentPlayers[myName].choice}`).classList.add('selected');
            }

            // Якщо статус очікування, знімаємо всі ефекти
            if (gameState.status === 'waiting') {
                document.body.className = '';
            }
        }

        window.makeChoice = function(choice) {
            if (gameState.status === 'revealed') return;
            db.ref(`game_state/rps_room/players/${myName}/choice`).set(choice);
        };

        window.forceReveal = function() {
            if (gameState.status === 'revealed') return;
            
            let names = Object.keys(currentPlayers);
            let choices = new Set(names.map(n => currentPlayers[n].choice).filter(c => c));
            let winningChoice = null;

            if (choices.size === 2) {
                if (choices.has('rock') && choices.has('scissors')) winningChoice = 'rock';
                else if (choices.has('scissors') && choices.has('paper')) winningChoice = 'scissors';
                else if (choices.has('paper') && choices.has('rock')) winningChoice = 'paper';
            }

            let updates = {};
            if (winningChoice) {
                names.forEach(n => {
                    if (currentPlayers[n].choice === winningChoice) {
                        updates[`game_state/rps_room/players/${n}/wins`] = (currentPlayers[n].wins || 0) + 1;
                    } else {
                        updates[`game_state/rps_room/players/${n}/losses`] = (currentPlayers[n].losses || 0) + 1;
                    }
                });
            }
            
            updates['game_state/rps_room/state/status'] = 'revealed';
            db.ref().update(updates);
        };

        window.nextRound = function() {
            let updates = {};
            updates['game_state/rps_room/state/status'] = 'waiting';
            updates['game_state/rps_room/state/cardIndex'] = (gameState.cardIndex || 0) + 1;
            
            Object.keys(currentPlayers).forEach(n => {
                updates[`game_state/rps_room/players/${n}/choice`] = "";
            });
            
            db.ref().update(updates);
        };

        function checkAutoReveal() {
            const names = Object.keys(currentPlayers);
            if (names.length === 0) return;

            const allChosen = names.every(n => currentPlayers[n].choice !== "");
            
            if (gameState.status === 'waiting') {
                document.getElementById('btn-reveal').style.display = allChosen ? 'block' : 'none';
                document.getElementById('btn-next').style.display = 'none';
            } else if (gameState.status === 'revealed') {
                document.getElementById('btn-reveal').style.display = 'none';
                document.getElementById('btn-next').style.display = 'block';
            }
        }

        // Рендер бокової панелі
        function renderPlayers() {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            
            for (const [name, data] of Object.entries(currentPlayers)) {
                let statusIcon = '';
                let readyClass = '';

                if (gameState.status === 'revealed') {
                    // Показуємо вибір, якщо гру розкрито
                    statusIcon = data.choice ? emojis[data.choice] : '❓';
                    readyClass = ''; 
                } else {
                    // Статус під час вибору
                    if (data.choice) {
                        statusIcon = '✔️'; // Приховуємо вибір інших
                        readyClass = 'ready';
                    } else {
                        statusIcon = '⏳';
                    }
                }

                container.innerHTML += `
                    <div class="player-item ${readyClass}">
                        <span>${name}</span>
                        <span class="player-choice-display">${statusIcon}</span>
                    </div>
                `;
            }
        }

        // Візуальні ефекти без слів
        function triggerVisualFeedback() {
            const names = Object.keys(currentPlayers);
            const choices = new Set(names.map(n => currentPlayers[n].choice).filter(c => c));
            let winningChoice = null;

            if (choices.size === 2) {
                if (choices.has('rock') && choices.has('scissors')) winningChoice = 'rock';
                else if (choices.has('scissors') && choices.has('paper')) winningChoice = 'scissors';
                else if (choices.has('paper') && choices.has('rock')) winningChoice = 'paper';
            }

            document.body.className = ''; // Очищаємо класи

            const myChoice = currentPlayers[myName]?.choice;
            
            if (choices.size === 1 || choices.size === 3) {
                // Нічия
                document.body.classList.add('draw-glow');
            } else if (winningChoice) {
                if (myChoice === winningChoice) {
                    // Перемога
                    document.body.classList.add('winner-glow');
                    launchConfetti();
                } else {
                    // Поразка
                    document.body.classList.add('loser-glow');
                }
            }
        }

        function launchConfetti() {
            const colors = ['#f44336', '#4caf50', '#2196f3', '#ffeb3b', '#9c27b0', '#ff9800'];
            for(let i=0; i<60; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(conf);
                
                // Видаляємо після завершення анімації
                setTimeout(() => conf.remove(), 4500);
            }
        }

        function changeFontSize(delta) {
            const root = document.documentElement;
            let currentSize = parseInt(getComputedStyle(root).getPropertyValue('--font-size'));
            if (isNaN(currentSize)) currentSize = 32;
            let newSize = currentSize + delta;
            if (newSize < 16) newSize = 16;
            if (newSize > 80) newSize = 80;
            root.style.setProperty('--font-size', newSize + 'px');
        }
    </script>
</body>
</html>
