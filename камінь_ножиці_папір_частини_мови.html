<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камінь, Ножиці, Папір - Інтерактивна версія</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root {
            --font-size: 32px;
        }
        
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #87CEEB;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease, box-shadow 0.5s ease;
            display: flex;
            flex-direction: column;
            color: #333;
            overflow-x: hidden;
        }

        /* Візуальні ефекти результату */
        body.winner-glow {
            box-shadow: inset 0 0 100px 30px rgba(0, 255, 0, 0.6);
        }
        body.loser-glow {
            box-shadow: inset 0 0 100px 30px rgba(255, 0, 0, 0.6);
            animation: shakeScreen 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        body.draw-glow {
            box-shadow: inset 0 0 100px 30px rgba(255, 255, 0, 0.5);
        }

        @keyframes shakeScreen {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }

        /* Конфетті */
        .confetti {
            position: fixed;
            top: -10px;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            z-index: 999;
            pointer-events: none;
            animation: fall linear forwards, spin 2s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh); }
        }
        @keyframes spin {
            100% { transform: rotate(360deg) rotateX(360deg); }
        }

        /* Анімація перемішування */
        @keyframes fastShuffle {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.2) rotate(-15deg); }
            50% { transform: scale(0.9) rotate(15deg); }
            75% { transform: scale(1.1) rotate(-10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animating-shuffle {
            animation: fastShuffle 0.3s infinite;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        /* Дихаюча анімація для слова */
        @keyframes floatWord {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: transparent;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
        }

        .score-board {
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.4);
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px dashed #333;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid #333;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 0 #333;
        }
        .btn-control:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-2px); }
        .btn-control:active { box-shadow: 0 0 0 #333; transform: translateY(2px); }

        .game-layout {
            display: flex;
            flex-grow: 1;
            width: 100%;
            padding: 20px;
            gap: 20px;
        }

        .game-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 80px;
        }

        /* Бокова панель гравців */
        .sidebar-players {
            width: 280px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(51, 51, 51, 0.5);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            align-self: flex-start;
        }

        .sidebar-title {
            text-align: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin-bottom: 10px;
            border-bottom: 2px dashed rgba(51, 51, 51, 0.5);
            padding-bottom: 10px;
            text-shadow: 1px 1px 2px #fff;
        }

        .player-item {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .player-item.ready {
            background: rgba(144, 238, 144, 0.9);
            border-color: #1b5e20;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(144, 238, 144, 0.8);
        }

        .player-choice-display {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        /* Флеш-картка */
        .flashcard {
            font-size: var(--font-size);
            font-weight: bold;
            text-align: center;
            margin: 0 0 40px 0;
            padding: 30px 50px;
            width: 100%;
            max-width: 600px;
            border-radius: 25px;
            border: 4px solid #333;
            background: rgba(255, 255, 255, 0.7);
            text-shadow: 2px 2px 0px #fff;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.2);
            word-wrap: break-word;
            animation: floatWord 4s ease-in-out infinite;
        }

        .weapons-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
            min-height: 180px;
            align-items: center;
        }

        .weapon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: transparent;
            opacity: 1;
            transform: scale(1);
            width: 140px;
        }

        /* Класи для зникнення/вибору */
        .weapon-card.hidden {
            opacity: 0;
            transform: scale(0.1) translateY(50px);
            pointer-events: none;
            width: 0;
            margin: 0;
            overflow: hidden;
        }

        .weapon-card.selected {
            transform: scale(1.3);
            z-index: 10;
        }

        .weapon-card.selected .weapon-emoji {
            background: linear-gradient(145deg, #fff9c4, #fff176);
            border-color: #f57f17;
            box-shadow: 0 15px 25px rgba(245, 127, 23, 0.4), inset 0 0 20px rgba(255,255,255,0.8);
        }

        .weapon-emoji {
            font-size: 70px;
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(240,240,240,0.6));
            border-radius: 25px;
            border: 4px solid #333;
            transition: all 0.3s ease;
            user-select: none;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
        }

        .weapon-card:hover:not(.selected):not(.hidden) .weapon-emoji {
            transform: translateY(-10px) rotate(5deg);
            box-shadow: 5px 15px 10px rgba(0,0,0,0.2);
        }

        .weapon-name {
            font-size: calc(var(--font-size) * 0.45);
            font-weight: bold;
            margin-top: 15px;
            text-shadow: 1px 1px 2px white, 0 0 10px rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.6);
            padding: 5px 15px;
            border-radius: 10px;
            border: 2px solid #333;
        }

        /* Мінімалістичні кнопки дій (Нижній лівий кут) */
        .action-buttons {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .btn-minimal {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #333;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #333;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-minimal:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #333;
        }
        .btn-minimal.primary {
            background: #ffeb3b;
            color: #000;
        }
        .btn-minimal.primary:hover {
            background: #fff176;
        }

        /* Theme Manager Styles */
        .theme-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border: 3px solid #333;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #333;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        .theme-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #333;
        }

        .theme-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .theme-content {
            background: rgba(255, 255, 255, 0.95);
            width: 95%;
            max-width: 700px;
            border-radius: 20px;
            padding: 25px;
            border: 4px solid #333;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }

        .theme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.5rem;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 10px;
        }

        .close-theme { cursor: pointer; font-size: 2rem; color: #d32f2f; line-height: 1; transition: 0.2s; }
        .close-theme:hover { transform: scale(1.2) rotate(90deg); }

        .theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .theme-gallery::-webkit-scrollbar { width: 10px; }
        .theme-gallery::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 5px; }
        .theme-gallery::-webkit-scrollbar-thumb { background: #888; border-radius: 5px; }

        .theme-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            border: 3px solid transparent;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .theme-thumb:hover { border-color: #2196f3; transform: scale(1.05); z-index: 2; box-shadow: 0 8px 15px rgba(33, 150, 243, 0.4); }
        .theme-thumb span {
            background: rgba(0,0,0,0.7);
            color: #fff;
            width: 100%;
            text-align: center;
            font-size: 13px;
            padding: 4px 0;
            pointer-events: none;
            font-weight: bold;
        }

        /* Адаптивність */
        @media (max-width: 800px) {
            .game-layout { flex-direction: column; padding: 10px; }
            .sidebar-players { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: stretch; padding: 10px; }
            .sidebar-title { width: 100%; margin-bottom: 5px; }
            .player-item { min-width: calc(50% - 10px); flex-grow: 1; padding: 8px 10px; }
            .weapon-emoji { width: 80px; height: 80px; font-size: 45px; border-radius: 15px; }
            .weapon-card { width: 100px; }
            .flashcard { padding: 20px; font-size: calc(var(--font-size)*0.8); border-radius: 15px; }
            .action-buttons { position: static; justify-content: center; margin-top: 10px; padding-bottom: 20px; width: 100%; }
            .theme-btn { bottom: 15px; right: 15px; width: 50px; height: 50px; font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-board" id="score-board">🏆 Перемог: 0 | 💔 Поразок: 0</div>
        <div class="controls">
            <button class="btn-control" onclick="changeFontSize(-4)">A-</button>
            <button class="btn-control" onclick="changeFontSize(4)">A+</button>
        </div>
    </div>

    <div class="game-layout">
        <div class="game-main">
            <div id="flashcard-word" class="flashcard">Завантаження...</div>

            <div class="weapons-panel">
                <div class="weapon-card" id="card-rock" onclick="makeChoice('rock')">
                    <div class="weapon-emoji">🪨</div>
                    <div class="weapon-name">КАМІНЬ</div>
                </div>
                <div class="weapon-card" id="card-scissors" onclick="makeChoice('scissors')">
                    <div class="weapon-emoji">✂️</div>
                    <div class="weapon-name">НОЖИЦІ</div>
                </div>
                <div class="weapon-card" id="card-paper" onclick="makeChoice('paper')">
                    <div class="weapon-emoji">📄</div>
                    <div class="weapon-name">ПАПІР</div>
                </div>
            </div>
        </div>

        <div class="sidebar-players">
            <div class="sidebar-title">Гравці</div>
            <div id="players-container">
                <!-- Гравці генеруються тут -->
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn-minimal primary" id="btn-reveal" onclick="triggerRevealSequence()" style="display: none;">🎭 Розкрити вибір</button>
        <button class="btn-minimal" id="btn-next" onclick="nextRound()" style="display: none;">➡️ Наступна картка</button>
    </div>

    <!-- Theme Manager UI -->
    <button class="theme-btn" onclick="document.getElementById('theme-modal').style.display='flex'">⚙️</button>
    <div id="theme-modal" class="theme-modal">
        <div class="theme-content">
            <div class="theme-header">
                <span>Оберіть фон гри</span>
                <span class="close-theme" onclick="document.getElementById('theme-modal').style.display='none'">&times;</span>
            </div>
            <div id="theme-gallery" class="theme-gallery"></div>
        </div>
    </div>

    <!-- Universal Control Block -->
    <div id="block-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 999999; justify-content: center; align-items: center; color: #ff5252; font-size: 3rem; font-weight: bold; font-family: Arial, sans-serif; text-align: center; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);">Зачекай!<br>Зараз не твій урок.</div>

    <script>
        // --- 0. ЗВУКОВИЙ ДВИЖОК (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(frequency, type, duration, volume = 0.05) {
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playWinSound() {
            playTone(440, 'sine', 0.2); // A4
            setTimeout(() => playTone(554.37, 'sine', 0.2), 150); // C#5
            setTimeout(() => playTone(659.25, 'sine', 0.4), 300); // E5
        }

        function playLoseSound() {
            playTone(300, 'sawtooth', 0.3);
            setTimeout(() => playTone(250, 'sawtooth', 0.5), 250);
        }

        function playDrawSound() {
            playTone(330, 'square', 0.2);
            setTimeout(() => playTone(330, 'square', 0.2), 250);
        }

        function playTickSound() {
            // Тихий короткий клік для імітації перемішування/очікування
            playTone(800, 'triangle', 0.05, 0.02);
        }

        // Включаємо аудіо по першому кліку на екрані (політика браузерів)
        document.body.addEventListener('click', initAudio, { once: true });


        // --- 1. Ініціалізація Firebase ---
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. Універсальний блок контролю ---
        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user') || sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('userName', myName);

        const tabId = Math.random().toString(36).substring(2, 15);
        
        let activeUsersGlobal = {};
        let onlineUsersLoaded = false; 

        db.ref('online_users').on('value', snap => {
            activeUsersGlobal = snap.val() || {};
            onlineUsersLoaded = true; 
            checkAndRemoveGhosts();
        });

        function checkAndRemoveGhosts() {
            if (!currentPlayers || !onlineUsersLoaded) return; 
            for (const playerName in currentPlayers) {
                if (!activeUsersGlobal[playerName]) {
                    db.ref(`game_state/rps_room/players/${playerName}`).remove();
                }
            }
        }

        db.ref('.info/connected').on('value', snap => {
            if (snap.val()) {
                const ref = db.ref(`online_users/${myName}/${tabId}`);
                ref.onDisconnect().remove();
                ref.set(true);
                
                const playerRef = db.ref(`game_state/rps_room/players/${myName}`);
                playerRef.onDisconnect().remove(); 
                
                playerRef.once('value', s => {
                    let data = s.val() || {};
                    playerRef.set({ 
                        choice: "", 
                        wins: data.wins || 0, 
                        losses: data.losses || 0,
                        online: true 
                    });
                });
            }
        });

        window.addEventListener('beforeunload', () => {
            db.ref(`online_users/${myName}/${tabId}`).remove();
            db.ref(`game_state/rps_room/players/${myName}`).remove();
        });

        let firstRefreshLoad = true;
        db.ref('force_refresh').on('value', snap => {
            if (!firstRefreshLoad && snap.val() === true) window.location.reload();
            firstRefreshLoad = false;
        });

        db.ref(`blocked_users/${myName}`).on('value', snap => {
            document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
        });

        let immune = true;
        setTimeout(() => immune = false, 1000);
        db.ref('current_activity').on('value', snap => {
            if (!immune && snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        // --- 3. Theme Manager Логіка ---
        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) document.body.style.backgroundImage = `url(${savedBg})`;

        db.ref('game_theme').on('value', snap => {
            const themeUrl = snap.val();
            if (themeUrl) {
                document.body.style.backgroundImage = `url(${themeUrl})`;
                localStorage.setItem('mySavedGameBg', themeUrl);
            }
        });

        async function loadThemes() {
            const gallery = document.getElementById('theme-gallery');
            for(let i = 1; i <= 100; i++) { 
                let url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                let img = new Image();
                img.src = url;
                img.onload = () => {
                    let div = document.createElement('div');
                    div.className = 'theme-thumb';
                    div.style.backgroundImage = `url(${url})`;
                    div.innerHTML = `<span>Фон ${i}</span>`;
                    div.onclick = () => {
                        db.ref('game_theme').set(url);
                        document.getElementById('theme-modal').style.display = 'none';
                    };
                    gallery.appendChild(div);
                };
                if (i % 10 === 0) await new Promise(r => setTimeout(r, 10)); 
            }
        }
        loadThemes();

        // --- 4. Логіка гри Камінь-Ножиці-Папір ---
        const flashcards = [
            "Кіт", "Собака", "Дерево", "Будинок", "Книга", "Сонце", "Місяць", "Автомобіль", "Місто", "Річка",
            "Гора", "Хліб", "Вода", "Стіл", "Вікно", "Двері", "Птах", "Риба", "Квітка", "Яблуко",
            "Великий", "Маленький", "Швидкий", "Повільний", "Добрий", "Злий", "Гарячий", "Холодний", "Новий", "Старий",
            "Чистий", "Брудний", "Високий", "Низький", "Сильний", "Слабкий", "Яскравий", "Темний", "Смачний", "Солодкий",
            "Бігти", "Стрибати", "Плавати", "Літати", "Читати", "Писати", "Говорити", "Мовчати", "Їсти", "Пити",
            "Спати", "Працювати", "Грати", "Співати", "Танцювати", "Дивитися", "Слухати", "Думати", "Розуміти", "Любити"
        ];

        let currentPlayers = {};
        let gameState = { status: 'waiting', cardIndex: 0 };
        const emojis = { rock: '🪨', scissors: '✂️', paper: '📄' };
        
        let localVisualStatus = 'waiting'; // 'waiting', 'animating', 'revealed'
        let suspenseInterval = null;

        // Стан кімнати
        db.ref('game_state/rps_room/state').on('value', snap => {
            const data = snap.val();
            if (data) {
                const oldStatus = gameState.status;
                gameState = data;
                document.getElementById('flashcard-word').innerText = flashcards[(gameState.cardIndex || 0) % flashcards.length];
                
                // Перехід у стан розкриття (із саспенсом)
                if (oldStatus === 'waiting' && gameState.status === 'revealed') {
                    startRevealAnimation();
                } else if (gameState.status === 'waiting') {
                    localVisualStatus = 'waiting';
                    document.body.className = '';
                    updateUI();
                } else if (gameState.status === 'revealed' && localVisualStatus !== 'animating') {
                    localVisualStatus = 'revealed';
                    updateUI();
                }
            } else {
                db.ref('game_state/rps_room/state').set({ status: 'waiting', cardIndex: 0 });
            }
        });

        // Стан гравців
        db.ref('game_state/rps_room/players').on('value', snap => {
            currentPlayers = snap.val() || {};
            checkAndRemoveGhosts();

            if (currentPlayers[myName]) {
                const wins = currentPlayers[myName].wins || 0;
                const losses = currentPlayers[myName].losses || 0;
                // Формат рахунку
                document.getElementById('score-board').innerText = `🏆 Перемог: ${wins} | 💔 Поразок: ${losses}`;
            }
            updateUI();
        });

        // Вибір зброї
        window.makeChoice = function(choice) {
            if (gameState.status !== 'waiting' || localVisualStatus !== 'waiting') return;
            
            // Записуємо вибір. Якщо натиснули те саме - знімаємо вибір.
            const newChoice = (currentPlayers[myName]?.choice === choice) ? "" : choice;
            db.ref(`game_state/rps_room/players/${myName}/choice`).set(newChoice);
        };

        // Локальне візуальне оновлення
        function updateUI() {
            renderPlayersSidebar();
            checkAutoRevealButton();
            
            // Логіка кнопок зброї
            const weapons = ['rock', 'scissors', 'paper'];
            const myChoice = currentPlayers[myName]?.choice;

            weapons.forEach(c => {
                const card = document.getElementById(`card-${c}`);
                card.classList.remove('selected', 'hidden');
                
                // Якщо є вибір і це не ця карта - ховаємо її
                if (myChoice && myChoice !== c) {
                    card.classList.add('hidden');
                } else if (myChoice && myChoice === c) {
                    card.classList.add('selected');
                }
            });
        }

        // Анімація саспенсу перед розкриттям
        function startRevealAnimation() {
            localVisualStatus = 'animating';
            renderPlayersSidebar(); // Оновить сайдбар на режим анімації
            checkAutoRevealButton();

            // Звук тікання
            let ticks = 0;
            suspenseInterval = setInterval(() => {
                playTickSound();
                ticks++;
                if (ticks > 15) clearInterval(suspenseInterval);
            }, 100);

            // Через 1.8с показуємо справжні результати
            setTimeout(() => {
                clearInterval(suspenseInterval);
                localVisualStatus = 'revealed';
                updateUI();
                triggerVisualAndAudioFeedback();
            }, 1800);
        }

        // Ініціатор розкриття (запис у Firebase)
        window.triggerRevealSequence = function() {
            if (gameState.status === 'revealed') return;
            
            let names = Object.keys(currentPlayers);
            let choices = new Set(names.map(n => currentPlayers[n].choice).filter(c => c));
            let winningChoice = null;

            if (choices.size === 2) {
                if (choices.has('rock') && choices.has('scissors')) winningChoice = 'rock';
                else if (choices.has('scissors') && choices.has('paper')) winningChoice = 'scissors';
                else if (choices.has('paper') && choices.has('rock')) winningChoice = 'paper';
            }

            let updates = {};
            // Розрахунок нових балів (записуються відразу, але UI покаже їх після анімації завдяки localVisualStatus)
            if (winningChoice) {
                names.forEach(n => {
                    if (currentPlayers[n].choice === winningChoice) {
                        updates[`game_state/rps_room/players/${n}/wins`] = (currentPlayers[n].wins || 0) + 1;
                    } else {
                        updates[`game_state/rps_room/players/${n}/losses`] = (currentPlayers[n].losses || 0) + 1;
                    }
                });
            }
            
            updates['game_state/rps_room/state/status'] = 'revealed';
            db.ref().update(updates);
        };

        window.nextRound = function() {
            document.body.className = ''; // Очищаємо ефекти
            
            let updates = {};
            updates['game_state/rps_room/state/status'] = 'waiting';
            updates['game_state/rps_room/state/cardIndex'] = (gameState.cardIndex || 0) + 1;
            
            Object.keys(currentPlayers).forEach(n => {
                updates[`game_state/rps_room/players/${n}/choice`] = "";
            });
            
            db.ref().update(updates);
        };

        function checkAutoRevealButton() {
            const names = Object.keys(currentPlayers);
            if (names.length === 0) return;

            const allChosen = names.every(n => currentPlayers[n].choice !== "");
            
            if (gameState.status === 'waiting' && localVisualStatus === 'waiting') {
                document.getElementById('btn-reveal').style.display = allChosen ? 'flex' : 'none';
                document.getElementById('btn-next').style.display = 'none';
            } else if (localVisualStatus === 'animating') {
                document.getElementById('btn-reveal').style.display = 'none';
                document.getElementById('btn-next').style.display = 'none';
            } else if (localVisualStatus === 'revealed') {
                document.getElementById('btn-reveal').style.display = 'none';
                document.getElementById('btn-next').style.display = 'flex';
            }
        }

        // Рендер бокової панелі з урахуванням анімації
        function renderPlayersSidebar() {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            
            for (const [name, data] of Object.entries(currentPlayers)) {
                let statusIcon = '';
                let readyClass = '';
                let additionalClass = '';

                if (localVisualStatus === 'animating') {
                    // Анімація саспенсу
                    statusIcon = '🌀';
                    additionalClass = 'animating-shuffle';
                    readyClass = 'ready';
                } else if (localVisualStatus === 'revealed') {
                    // Фінальний показ
                    statusIcon = data.choice ? emojis[data.choice] : '❓';
                    
                    // Визначаємо чи гравець переміг для підсвітки рамки (опціонально)
                    const names = Object.keys(currentPlayers);
                    const choices = new Set(names.map(n => currentPlayers[n].choice).filter(c => c));
                    let winningChoice = null;
                    if (choices.size === 2) {
                        if (choices.has('rock') && choices.has('scissors')) winningChoice = 'rock';
                        else if (choices.has('scissors') && choices.has('paper')) winningChoice = 'scissors';
                        else if (choices.has('paper') && choices.has('rock')) winningChoice = 'paper';
                    }
                    if (winningChoice && data.choice === winningChoice) {
                        readyClass = 'ready'; // Зелений фон для переможця
                    }

                } else {
                    // Очікування
                    if (data.choice) {
                        statusIcon = '✔️'; 
                        readyClass = 'ready';
                    } else {
                        statusIcon = '⏳';
                    }
                }

                container.innerHTML += `
                    <div class="player-item ${readyClass}">
                        <span>${name}</span>
                        <span class="player-choice-display ${additionalClass}">${statusIcon}</span>
                    </div>
                `;
            }
        }

        // Фінальні ефекти (світло, звук, конфетті)
        function triggerVisualAndAudioFeedback() {
            const names = Object.keys(currentPlayers);
            const choices = new Set(names.map(n => currentPlayers[n].choice).filter(c => c));
            let winningChoice = null;

            if (choices.size === 2) {
                if (choices.has('rock') && choices.has('scissors')) winningChoice = 'rock';
                else if (choices.has('scissors') && choices.has('paper')) winningChoice = 'scissors';
                else if (choices.has('paper') && choices.has('rock')) winningChoice = 'paper';
            }

            document.body.className = ''; // Очищаємо класи
            const myChoice = currentPlayers[myName]?.choice;
            
            if (choices.size === 1 || choices.size === 3) {
                // Нічия
                document.body.classList.add('draw-glow');
                playDrawSound();
            } else if (winningChoice) {
                if (myChoice === winningChoice) {
                    // Перемога
                    document.body.classList.add('winner-glow');
                    launchConfetti();
                    playWinSound();
                } else {
                    // Поразка
                    document.body.classList.add('loser-glow');
                    playLoseSound();
                }
            }
        }

        // Генератор конфетті
        function launchConfetti() {
            const colors = ['#f44336', '#4caf50', '#2196f3', '#ffeb3b', '#9c27b0', '#ff9800'];
            for(let i=0; i < 80; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Рандомізація розміру та швидкості
                let scale = Math.random() * 1 + 0.5;
                conf.style.transform = `scale(${scale})`;
                
                let duration = Math.random() * 2 + 2;
                conf.style.animationDuration = `${duration}s, ${duration/2}s`;
                conf.style.animationDelay = (Math.random() * 0.5) + 's';
                
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 4500); // Очищення
            }
        }

        // Зміна розміру шрифту (залишилась від попередньої версії)
        function changeFontSize(delta) {
            const root = document.documentElement;
            let currentSize = parseInt(getComputedStyle(root).getPropertyValue('--font-size'));
            if (isNaN(currentSize)) currentSize = 32;
            let newSize = currentSize + delta;
            if (newSize < 16) newSize = 16;
            if (newSize > 80) newSize = 80;
            root.style.setProperty('--font-size', newSize + 'px');
        }
    </script>
</body>
</html>
